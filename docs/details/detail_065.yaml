  - 1. 运行哈希工具对一个多层模型计算 SHA-256，记录输出
  - 2. 使用二进制编辑器手动修改模型中间的某个权重字节，重新计算哈希，观察变化
  - 3. 分析代码中过滤 `.attention.masked_bias` 等后缀的逻辑，理解为什么这些张量不计入哈希
  - 4. 尝试启用 `--no-layer` 参数，对比分层哈希与整体哈希在故障定位时的优劣
