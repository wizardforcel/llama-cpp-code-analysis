learning_targets:
- 掌握 GGUF 命令行工具链的核心分类：只读扫描仪（dump/hash）与读写手术刀（set/new/convert）的本质区别
- 理解 gguf_dump 的多格式输出机制，包括文本的树状展示、JSON 的结构化序列化以及 Markdown 的报表生成
- 精通跨平台字节序转换原理，掌握不同量化格式（Q4_0/Q4_K/Q6_K/BF16）的字节交换差异与风险防控
- 熟练运用元数据编辑工具进行单字段精准修改（set_metadata）与全量重建（new_metadata）
- 掌握基于 SHA-1/SHA-256/UUID v5 的模型完整性校验体系与分层哈希策略
- 了解 GGUF GUI 编辑器的架构设计，包括分词器、数组、枚举类型的可视化编辑流程与状态管理
life_analogy:
- 想象 GGUF 文件是一个**标准化的海运集装箱**，而这一章的工具链就是码头上的「运维百宝箱」：
- '- **gguf_dump** = 集装箱 X 光扫描仪：不开箱就能生成内容清单（文本/JSON/Markdown 三种报告格式）'
- '- **gguf_convert_endian** = 跨国电压转换器：不同国家（CPU 架构）的电流标准（字节序）不同，需要专业设备转换，乱接会烧坏设备（文件损坏）'
- '- **gguf_set_metadata** = 激光标签打印机：精准修改箱外的一个标签（如把 BOS Token 从 1 改成 2），无需开封'
- '- **gguf_new_metadata** = 整体翻新流水线：把货物倒出来，重新装修内部（修改元数据），再装回新箱子'
- '- **gguf_hash** = 防伪指纹采集器：为整个集装箱生成独一无二的指纹（SHA-256），或按层生成货物批次码'
- '- **gguf_editor_gui** = 可视化控制台：给理货员一个图形界面，用鼠标点击就能修改清单，不用背命令行'
- ''
- '**安全法则**：就像高压电作业必须先断电再操作，所有会修改集装箱的工具（`r+` 模式）都配备了「双保险」：'
- 1. **dry-run 预览**：先模拟操作看结果，确认无误再真动手
- 2. **YES 确认**：高危操作前必须输入大写 YES，防止手滑
