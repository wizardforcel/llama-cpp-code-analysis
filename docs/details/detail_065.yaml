summary:
- concept: GGUFReader 'r' vs 'r+' 模式
  desc: 只读扫描用 'r'，原地修改用 'r+'，后者风险如心脏手术
- concept: 字节序 'S' 标记
  desc: 表示文件字节序与主机相反，需要交换（Swap）处理
- concept: Q4_0/Q8_0 字节交换
  desc: 仅交换块首 2 字节 f16 缩放因子，量化数据本身无需变动
- concept: Q4_K 字节交换
  desc: 需交换块首两个连续 f16 字段（offset 0-2, 2-4）
- concept: Q6_K 字节交换
  desc: 特殊偏移 208 处交换 f16 字段，布局异于 K-quants 家族
- concept: BF16 特殊处理
  desc: 默认按 1 字节读取，需先 view 为 uint16 再执行 byteswap
- concept: field.parts 结构
  desc: Part 0=键长, 1=键名, 2=类型, 3=值；field.data[0] 指向值索引
- concept: 元数据修改四策略
  desc: GGUFWriter 重建流程中的 Skip/Modify/Copy/Delete 决策树
- concept: 三层哈希体系
  desc: SHA-1（兼容旧系统）+ SHA-256（安全校验）+ UUIDv5（内容寻址命名）
- concept: 非持久化张量过滤
  desc: 哈希计算时排除 .attention.masked_bias 等推理缓存张量
- concept: BPW (Bits Per Weight)
  desc: 每权重比特数 = (张量字节数 × 8) / 元素数，量化效率核心指标
- concept: dry-run 哲学
  desc: 所有破坏性操作提供预览模式，遵循「先观察，后动手」原则
- concept: YES 确认机制
  desc: 高危操作强制交互确认，防止脚本自动化导致的意外损坏
- concept: KEY_TO_ENUM_TYPE
  desc: GUI 中自动关联元数据键与 TokenType 等枚举类型的映射表
- concept: TOKENIZER_LINKED_KEYS
  desc: tokens/token_types/scores 三数组的一体化联动编辑机制
- concept: GUI 变更追踪
  desc: metadata_changes 与 metadata_to_remove 暂存修改，Save As 时批量应用
- concept: 分页加载机制
  desc: 大数组通过 page_size=100 分页显示，避免 GUI 卡顿
