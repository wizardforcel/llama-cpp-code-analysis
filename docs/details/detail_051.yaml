exercises:
- contents:
  - 阅读 `common/speculative.cpp` 第 222-322 行（common_speculative_state_draft.draft()）。
  - 回答问题：
  - 1. `reuse_i` 和 `reuse_n` 是如何计算的？它们如何帮助避免重复解码？
  - 2. 当 `reuse_n == 0` 与 `reuse_n > 0` 时，代码分别如何处理 `llama_memory`？
  - 3. 为什么要检查 `cur >= 256 || n_ctx >= prompt_cur.size()` 这个条件？
  'no': 1
  title: 分析草稿模型的 KV 缓存复用策略
- contents:
  - 阅读 `common/ngram-cache.cpp` 第 62-139 行（两个 try_draft 函数）。
  - 分析以下常量的作用：
  - '- `draft_min_sample_size_lax` = {2, 2, 1, 1}'
  - '- `draft_min_percent_lax` = {66, 50, 50, 50}'
  - '- `draft_min_percent_strict` = {75, 66, 66, 66}'
  - 回答问题：
  - 1. 为什么静态缓存（static）使用 `lax`（宽松）阈值，而动态缓存（dynamic）使用 `strict`（严格）阈值？
  - 2. 在联合验证版本（第 97-139 行）中，为什么要计算 `count_primary * count_static` 的乘积？这解决了什么问题？
  'no': 2
  title: 推导 n-gram 缓存的置信度阈值逻辑
- contents:
  - 阅读 `common/ngram-map.cpp` 第 196-405 行（common_ngram_map_draft）。
  - 构造一个测试场景：
  - '- 输入历史 tokens: [A, B, C, A, B, C, A, B, D]（其中 A/B/C/D 为 token ID）'
  - '- 设置 n=3, m=2'
  - 回答问题：
  - 1. 当处理到最后一个 token D 时，key「A, B」的 values 会记录哪些候选？各自的 value_num 是多少？
  - 2. 根据 `max_occur < 2 * sum_occur` 的检查逻辑，此时会生成草稿吗？为什么？
  - 3. 如果要让系统接受「C」作为「A, B」的候选，需要什么样的历史模式？
  'no': 3
  title: 设计实验验证 n-gram 映射的统计显著性
- contents:
  - 阅读 `common/speculative.cpp` 第 421-498 行（common_speculative_state_ngram_mod）。
  - 回答问题：
  - 1. `begin()` 方法中，为什么要检查 `f > 0.25`（占用率阈值）？过高占用率会导致什么问题？
  - 2. `accept()` 方法中，连续 3 次接受率低于 50% 触发重置的逻辑，是为了解决什么实际场景？
  - 3. 如果要调整重置策略为「接受率低于 30% 连续 5 次」，需要修改哪些变量和逻辑？
  'no': 4
  title: 研究 NGRAM_MOD 的自动重置机制
- contents:
  - 基于 `common/speculative.cpp` 第 1020-1110 行的 `common_speculative` 类接口。
  - 编写一段伪代码或描述逻辑：
  - 1. 同时初始化 `NGRAM_SIMPLE` 和 `NGRAM_MOD` 两种策略。
  - 2. 在生成 100 个 token 后，统计两种策略的：平均草稿长度、接受率（n_acc_tokens/n_gen_tokens）、调用耗时（t_draft_us）。
  - 3. 根据统计结果，设计一个动态切换策略：当某种策略连续 10 次接受率低于 30% 时，自动切换到另一种。
  'no': 5
  title: 实现一个简单的投机解码策略比较器
learning_targets:
- 理解投机解码的统一接口与调度机制（begin/draft/accept 三阶段）及类型注册系统
- 掌握草稿模型投机解码的实现：上下文初始化、词汇表兼容性检查、KV 缓存复用与概率阈值控制
- 精通 n-gram 缓存算法：三级缓存架构（context/dynamic/static）、主导比例验证与持久化/合并机制
- 熟悉 n-gram 映射与哈希结构：LCG 哈希、Fibonacci 哈希、固定容量表与统计决策逻辑
- 掌握多种投机策略的状态机实现及其性能监控、统计收集与自动重置机制
life_analogy:
- 想象投机解码是一家**餐厅的预测备菜系统**：
- '- **统一接口（common_speculative_state）** = 餐厅经理的标准工作流程：开市准备（begin）→ 预估菜品（draft）→ 确认订单（accept）'
- '- **草稿模型（Draft Model）** = 经验丰富的学徒厨师：快速猜测主厨（目标模型）会做什么菜，提前备好食材（token），主厨只需确认或微调'
- '- **n-gram 缓存** = 历史订单统计本：记录「顾客点了宫保鸡丁后，80% 会点米饭」的模式，根据置信度阈值决定是否提前煮饭'
- '- **n-gram 映射/哈希** = 餐厅的快速检索便签墙：把常见菜品组合（key）和推荐配菜（value）贴在墙上，用编号（哈希）快速查找，而不是翻遍整本账本'
- '- **动态重置机制** = 如果连续几桌客人都不点预测的菜（接受率 <50%），经理会撕掉旧的预测便签，重新观察新趋势'
- '- **词汇表翻译（replace_to_dft/tgt）** = 学徒和主厨用不同的菜谱术语，需要实时翻译确保理解一致'
'no': 50
summary:
- concept: common_speculative_state
  desc: 抽象基类，定义 begin/draft/accept 三阶段生命周期，支持多态策略
- concept: common_speculative_type
  desc: 八种策略枚举：NONE、DRAFT（草稿模型）、EAGLE3、NGRAM_SIMPLE、NGRAM_MAP_K、NGRAM_MAP_K4V、NGRAM_MOD、NGRAM_CACHE
- concept: common_speculative_are_compatible
  desc: 检查目标与草稿模型的词表类型、特殊 Token（BOS/EOS）及内容一致性，确保可协同工作
- concept: common_speculative_state_draft
  desc: 草稿模型实现：通过独立 ctx_dft 生成候选词，支持 KV 缓存复用（reuse_n）和概率早停（p_min）
- concept: replace_to_dft / replace_to_tgt
  desc: 词表不兼容时的字符串级双向翻译机制，基于 replacements 映射表
- concept: common_ngram_cache
  desc: 三级缓存系统：context（当前会话）、dynamic（动态历史）、static（静态语料库），支持持久化
- concept: try_draft 双重验证
  desc: 草稿生成需满足最小样本数（min_sample_size）和主导比例（dominance percentage，如 66% 或 50%）
- concept: common_ngram_map
  desc: 键值对映射结构：key 为 n-gram，value 为候选 m-gram 及其统计信息，支持哈希加速（LCG）与 min_hits 验证
- concept: max_occur < 2 * sum_occur
  desc: 统计显著性检查：最高频候选必须显著高于其他候选总和才采纳
- concept: common_ngram_mod
  desc: 固定容量（4MB）哈希表，O(1) 查找， EMPTY 标记空槽，高占用率（>25%）或低接受率自动重置
- concept: common_speculative_init
  desc: 工厂函数：根据参数类型组装多个策略实例到 impls 数组，实现策略链式调度
- concept: common_speculative_draft
  desc: 主调度器：按优先级轮询 impls，取第一个非空草稿结果，并统计生成 token 数
- concept: min_hits / dominance
  desc: 置信度控制：键出现次数需达阈值，且最高频值占比需超过 50-75%（视缓存级别而定）
- concept: common_ngram_cache_merge
  desc: 多个 n-gram 缓存合并，累加相同 n-gram 的 token 计数，用于分布式统计汇总
