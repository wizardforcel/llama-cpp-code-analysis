  points:
  - '**不同投机策略的状态类如何实现统一接口？**'
  - '- `common_speculative_state_ngram_simple`：包装简单 n-gram 匹配，配置仅包含 n-gram 和 m-gram
    尺寸，构造函数仅保存配置'
  - '- `common_speculative_state_ngram_map_k`：包装映射表版本，支持仅键模式（key_only）和完整键值统计，构造函数接收
    `common_ngram_map` 对象，通过 `begin/draft/accept` 三回调联动更新统计'
  - '- `common_speculative_state_ngram_mod`：动态维护 n-gram 容器，构造函数初始化 `common_ngram_mod`
    并检查 `LLAMA_TRACE` 环境变量，使用 `LLAMA_TRACE` 控制详细日志，接受率低于 50% 且连续 3 次时自动重置容器'
  - '- `common_speculative_state_ngram_cache`：构造函数加载静态与动态缓存文件，整合静态与动态缓存文件，支持从磁盘加载预训练的
    n-gram 统计'
  - '- `common_speculative_state_eagle3`：EAGLE-3 策略预留接口，构造函数仅初始化基类，当前为占位符实现（TODO）'
  - '- 所有状态类都实现 `begin()`/`draft()`/`accept()` 三阶段生命周期，便于 `common_speculative` 类进行统一调度与统计收集'
  - '- `get_common_ngram_map()` 和 `create_state_ngram_cache()` 作为工厂辅助函数，完成从配置到具体状态的实例化'
