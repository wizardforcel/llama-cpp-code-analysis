    八种策略'
  - '- `common_speculative` 主类作为调度器，通过 `impls` 数组管理多个实现实例，实现策略的灵活组合与优先级选择'
  - '- 类型系统支持字符串与枚举的双向转换（`common_speculative_type_to_str`/`from_name`），便于配置解析'
  - '- `common_speculative_is_compat()` 在初始化前检查目标上下文是否支持必要的内存操作（部分序列删除）'
