  name: n-gram 映射与哈希 —— 「键值对」结构的模式速查
  'no': 4
  points:
  - '**为什么需要 n-gram 映射（Map）而非简单缓存？**'
  - '- `common_ngram_simple_draft()` 是线性扫描历史，时间复杂度 O(n²)，适用于短序列'
  - '- `common_ngram_map` 建立键（key n-gram）到值（value m-gram）的显式映射，支持统计多次出现的候选值'
  - '- 哈希加速：使用 LCG（线性同余生成器）哈希函数将 token 序列映射到固定大小的哈希表（key_map），实现近似 O(1) 查找'
  - '- `common_ngram_map_draft()` 的统计决策：计算候选值的出现次数（occur），只有当最大值显著大于总和的 2 倍时才采纳（`max_occur
    < 2 * sum_occur`）'
  - '- 最小命中数（min_hits）：仅当键在 history 中出现次数达到阈值才信任该模式'
  - '- `common_ngram_mod` 使用固定容量哈希表与模运算索引：通过组合哈希 `res*6364136223846793005ULL + token`
    计算槽位，解决冲突并监控占用率（occupancy）'
  - '- 接受反馈机制：`common_ngram_map_accept()` 根据实际接受数量更新候选值的统计信息'
