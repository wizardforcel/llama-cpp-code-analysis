  name: n-gram 缓存算法 —— 基于统计的「历史复读机」
  'no': 3
  points:
  - '**n-gram 缓存如何利用历史重复模式？**'
  - '- 将 token 序列视为 n-gram（1-4 个 token 的连续序列），统计每个 n-gram 后续出现的 token 及其频率'
  - '- 三级缓存架构：context（当前上下文）、dynamic（动态历史）、static（静态语料库），按置信度阈值逐级尝试'
  - '- `common_ngram_cache_update()`：滑动窗口统计新增 token 的 n-gram 分布，支持进度显示用于大规模语料处理'
  - '- `try_draft()` 两级验证：主缓存在「宽松」阈值（lax）下尝试，动态缓存在「严格」阈值（strict）下尝试，静态缓存在最低样本数下尝试'
  - '- 主导比例（dominance）检查：只有当最高频 token 占比超过特定百分比（如 66%、50%）时才采纳，避免低置信度预测'
  - '- 持久化支持：`common_ngram_cache_save()` 和 `common_ngram_cache_load()` 实现缓存的二进制序列化与反序列化'
  - '- 缓存合并：`common_ngram_cache_merge()` 支持将多个缓存统计信息累加合并'
