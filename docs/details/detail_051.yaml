  name: 草稿模型投机解码 —— 「小模型猜大模型」的协作艺术
  'no': 2
  points:
  - '**草稿模型（Draft Model）的核心思想是什么？**'
  - '- 使用一个小型、快速的语言模型（ctx_dft）作为「预言家」，预测目标大模型（ctx_tgt）的输出'
  - '- 通过 `llama_init_from_model()` 创建独立的草稿上下文，并配置独立的采样器（仅使用 Top-K 策略）'
  - '- 兼容性检查是关键：`common_speculative_are_compatible()` 确保两个模型使用相同的词汇表类型、特殊 token（BOS/EOS）且
    token 内容一致'
  - '- 词汇表不匹配时启动「翻译机制」：通过 `replace_to_dft()` 和 `replace_to_tgt()` 在字符串层面进行双向映射'
  - '- 构造函数中初始化 `batch` 和 `smpl`（采样器），并检测词表兼容性（`vocab_cmpt`）'
  - '- 析构函数负责释放 `ctx_dft`、`smpl` 和 `batch` 资源'
  - '- 草稿生成流程：复用 KV 缓存（reuse_n 计算）→ 批量解码新 prompt → 自回归采样生成 n_max 个候选 token'
  - '- 概率阈值控制：当草稿模型对候选 token 的置信度低于 `params.p_min` 时提前停止生成'
