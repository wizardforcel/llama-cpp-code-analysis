learning_targets:
- 理解llama_context作为推理引擎入口的整体职责和架构
- 掌握llama_cparams结构体如何统一管理推理上下文配置
- 深入了解sched_reserve机制如何预热图与检测Flash Attention/Gated Delta Net支持
- 熟悉encode/decode主循环的内部流程：批分配、图构建、结果提取
- 理解状态序列化/反序列化的实现原理与文件格式
- 了解适配器（LoRA/cvec）的运行时应用与调度器重预留机制
- 掌握线程池、中止回调、内存分布统计等运行时控制接口的实现
- 理解采样器链与graph_params/can_reuse机制的协同工作
- 能阅读并理解轻量级训练相关的opt_init/opt_epoch实现
life_analogy:
- 想象 `llama_context` 是一家餐厅的「中央厨房总监」：
- '- **llama_cparams** = 餐厅的运营手册（座位数、菜量、营业时段、是否开启外卖窗口）'
- '- **后端初始化** = 招募各路厨师（GPU主厨、CPU副厨、加速器小工），并登记他们的特长'
- '- **sched_reserve** = 餐厅开业前的「试菜大会」——预演最繁忙时段的菜谱，确定设备容量'
- '- **encode/decode** = 日常营业：接到订单（batch）→ 拆分给厨师（ubatch）→ 上菜（logits/embeddings）'
- '- **graph_reserve** = 提前准备好的「万能菜谱模板」，相同菜式直接复用模板'
- '- **process_ubatch** = 后厨工位：检查是否可复用旧菜谱（can_reuse），否则现做，并最终摆盘'
- '- **can_reuse / graph_reuse** = 经验丰富的厨师对相同菜式直接沿用上次做法（省时）'
- '- **attach_threadpool** = 给厨房分配帮工数量（提示处理 vs 单token生成帮工数不同）'
- '- **set_abort_callback** = 安装火警按钮，紧急时所有厨师立刻停手'
- '- **set_adapters_lora** = 餐厅推出新口味（LoRA），需要重新培训厨师（触发reserve）'
- '- **state_serialize** = 把当前所有菜品半成品（KV缓存）打包冷冻，恢复时解冻继续烹饪'
- '- **state_seq_save_file** = 把某一桌的半成品单独打包外卖，下次回来继续吃'
- '- **opt_init/opt_epoch** = 后厨研发新菜品（小规模训练/微调）'
- '- **memory_breakdown** = 月底盘点：模型原料、餐桌占用、临时工位各占多少储物空间'
- '- **output_reorder** = 出餐顺序按顾客订单调整（循环模型的特殊排序）'
- '- **set_sampler** = 给餐厅配备不同口味品鉴师（采样器），不同桌配不同口味'
- 就像总监需要协调厨师、菜谱、储物与上菜节奏，`llama_context` 也在后端、调度器、内存与图执行之间精细调度，确保推理又快又稳。
'no': 16
summary:
- concept: '`llama_cparams`'
  desc: 推理上下文参数集合，统管ctx/batch/线程/RoPE/Flash Attention等开关
- concept: '`llama_context` 构造'
  desc: 合并参数→初始化后端→创建内存模块→预热调度器→初始化采样器映射
- concept: '`sched_reserve`'
  desc: FA/GDN自动检测、预留最坏情况pp/tg图，避免推理时再分配
- concept: '`graph_reserve`'
  desc: 用dummy ubatch构造真实图，触发gallocr分配计算缓冲区
- concept: '`graph_reuse_disable`'
  desc: 通过环境变量LLAMA_GRAPH_REUSE_DISABLE强制关闭can_reuse
- concept: '`pipeline_parallel`'
  desc: 多GPU层分割+offload_kqv开启+异步事件支持时启用，否则回退
- concept: '`process_ubatch`'
  desc: 图复用核心：can_reuse则同步后直接set_inputs，否则reset并build_graph
- concept: '`can_reuse`'
  desc: 根据gparams判等决定是否复用上次图，避免每次重建
- concept: '`graph_get_cb`'
  desc: 对norm层做后端亲和性调度，减少跨后端数据传输
- concept: '`encode()`'
  desc: 编码器模式：强制非因果注意力，无KV缓存，处理整个batch
- concept: '`decode()`'
  desc: 解码器主循环：init_batch→init_full→逐ubatch执行→提取logits/采样→输出重排
- concept: '`memory_update`'
  desc: 应用内存模块更新并触发最坏情况图重预留
- concept: '`output_reserve`'
  desc: 分配host buffer并布局logits/embd/采样数组
- concept: '`output_reorder`'
  desc: 对循环模型按用户原始batch顺序懒重排logits/embeddings
- concept: '`output_resolve_row`'
  desc: 将batch token索引通过output_ids转换为输出buffer行号
- concept: '`set_adapters_lora`'
  desc: 比对已有loras→若无变化直接返回；否则重建映射并触发reserve
- concept: '`set_adapter_cvec`'
  desc: 按层写入控制向量数据并触发reserve
- concept: '`attach_threadpool`'
  desc: 绑定外部线程池，prompt处理与token生成可分别指定
- concept: '`set_n_threads`'
  desc: 运行时调整n_threads/n_threads_batch并立即下发所有后端
- concept: '`set_abort_callback`'
  desc: 通过动态库符号给所有后端安装中止回调
- concept: '`set_sampler`'
  desc: 按seq_id注入后端采样器，仅支持chain类型，否则退化为CPU采样
- concept: '`state_serialize`'
  desc: 通过llama_io_write_i/read_i抽象序列化KV缓存到buffer或文件
- concept: '`state_load_file`'
  desc: 校验魔数LLAMA_SESSION_MAGIC、版本、token数量再恢复KV
- concept: '`state_seq_save_file`'
  desc: 单序列状态保存，使用LLAMA_STATE_SEQ_MAGIC
- concept: '`llama_io_write_dummy`'
  desc: 只统计字节数的占位IO，用于state_get_size
- concept: '`llama_io_write_buffer/file`'
  desc: 具体序列化实现，分别写入内存与文件
- concept: '`llama_io_read_buffer/file`'
  desc: 具体反序列化实现，分别读取内存与文件
- concept: '`needs_raw_logits`'
  desc: 判断是否有序列未配置后端采样器，需拷回原始logits
- concept: '`copy_tensor_async_*`'
  desc: 异步将后端采样结果（token/logits/probs/candidates）拷回host buffer
- concept: '`build_seq_to_output_row`'
  desc: 将每个seq_id映射到其output_row以支持正确采样
- concept: '`opt_init`'
  desc: 创建ggml_opt_context，逐层调用llama_set_param标记可训练张量
- concept: '`llama_set_param`'
  desc: 过滤F32张量，跳过token_embd与rope_freqs，调ggml_set_param
- concept: '`opt_epoch`'
  desc: 数据集划分为train/eval循环，每个batch构建opt图并设置labels
- concept: '`opt_epoch_iter`'
  desc: 在n_ctx窗口内按n_batch/n_ubatch构建opt图，调用ggml_opt_eval
- concept: '`memory_breakdown`'
  desc: 按buft聚合模型/上下文/计算缓冲区内存用量
- concept: '`llama_memory_breakdown_print`'
  desc: 表格化输出每个设备的total/free/self/unaccounted
- concept: '`llama_adapter_cvec`'
  desc: 控制向量按层存1D张量，apply时直接ggml_add到激活
- concept: '`llama_adapter_lora`'
  desc: GGUF格式加载、a/b配对、按buft分配ctx/buffer并回读数据
- concept: '`llama_adapter_lora_weight::get_scale`'
  desc: 按alpha/rank计算实际LoRA缩放系数
- concept: '`llama_adapter_meta_*`'
  desc: 查询LoRA GGUF元数据KV对
- concept: '`llama_adapter_get_alora_*`'
  desc: 获取alora调用token序列
