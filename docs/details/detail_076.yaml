  name: ViT 主干与补丁嵌入构建 —— 图像分块的「流水线工厂」
  'no': 5
  points:
  - '**输入管道 build_inp：像素到嵌入的「变形记」**'
  - '- 创建原始输入张量（inp_raw）：3D 张量（宽 x 高 x 通道数），标记为计算图输入节点（GGML_TENSOR_FLAG_INPUT）'
  - '- 2D 卷积补丁化：使用 patch_size 步长将图像切成不重叠的补丁，输出展平为 (n_patches, n_embd) 的矩阵'
  - '- 偏置注入：可选的 patch_bias 支持补丁嵌入后的仿射变换，增强位置感知能力'
  - '**位置嵌入动态调整 resize_position_embeddings**'
  - '- 尺寸匹配检测：当输入尺寸与预训练位置嵌入（通常为固定正方形）不匹配时自动触发插值'
  - '- 双线性插值流程：reshape 为 2D 网格 → permute 调整维度 → interpolate 插值 → 恢复展平，支持任意分辨率输入'
  - '- 反锯齿开关：interpolation_mode 参数支持双线性/双三次/区域等多种插值算法，平衡精度与速度'
  - '**完整 ViT 构建 build_vit 的「装配流水线」**'
  - '- 预归一化（pre_ln）选项：在补丁嵌入后立即应用 LayerNorm，稳定训练早期梯度'
  - '- 逐层循环：每层依次执行 LayerNorm → Attention → 残差连接 → LayerNorm → FFN → 残差连接，形成标准的 Post-LN
    架构'
  - '- QKV 双投影模式：支持合并矩阵（qkv_w）一次性计算 QKV，或分别使用 q_w/k_w/v_w 独立计算，兼容不同模型权重格式'
  - '- 位置添加策略：通过 add_pos lambda 灵活注入位置编码（支持 RoPE、Sine、Learned Absolute 等多种方案）'
  - '- 音频特化处理 pool_1d：当模型为音频投影器时，在时间维度执行平均池化，压缩序列长度'
