  name: 图像编码主循环 —— 从像素到向量的「翻译终端」
  'no': 8
  points:
  - '**双模态编码入口设计**'
  - '- clip_image_encode：单张图像便捷接口，内部自动包装为批次并调用批量接口，简化用户调用'
  - '- clip_image_batch_encode：核心处理函数，支持批量但当前限制 batch_size=1，预留未来扩展能力'
  - '- 动态图构建 clip_image_build_graph：通过投影器类型路由到 20+ 种具体构图器（SigLIP、Qwen-VL、LLaVA 等），实现「一个入口，多种架构」'
  - '**输入张量智能装配**'
  - '- 像素数据重排：将 RGB 像素数据从交错格式（RGBRGB）转换为平面格式（RRRGGGBBB），适配 Conv2D 输入要求'
  - '- 位置索引生成：根据投影器类型生成特定位置张量（如 MiniCPM-V 的 bucket_coords 高频分桶坐标，或 Qwen2-VL 的二维网格坐标）'
  - '- 音频模式分支：当 is_audio 为真时，直接传入梅尔频谱图而非原始波形，复用视觉编码流程处理音频特征'
  - '**结果提取与校验**'
  - '- 输出张量定位：通过 ggml_graph_node(gf, -1) 获取计算图最后一个节点（最终嵌入），确保提取正确的输出结果'
  - '- 内存布局检查：验证张量维度与预期嵌入大小（projection_dim）匹配，防止架构不一致导致的静默错误'
  - '- 全局辅助函数：clip_encode_float_image 提供直接编码浮点图像的便捷接口，自动处理内存布局转换'
