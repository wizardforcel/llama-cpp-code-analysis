  name: 注意力机制与 2D RoPE —— 空间关系的「编织工」
  'no': 6
  points:
  - '**Flash Attention 智能切换**'
  - '- 条件启用：当后端支持且未禁用 flash_attn 时，调用 ggml_flash_attn_ext 进行快速注意力计算，显著降低内存占用并提升速度'
  - '- 精度保护：设置 GGML_PREC_F32 强制 Softmax 计算在 FP32 精度下进行，避免半精度累积误差导致的数值溢出'
  - '- 自动降级：不支持时回退到标准实现（permute → matmul → softmax → matmul），确保功能可用性'
  - '**2D RoPE 的分两半处理策略**'
  - '- 频率分解：将隐藏维度分为两半，前半部分使用基础频率（freq_base），后半部分使用频率缩放因子（freq_scale_odd）'
  - '- 视图解构：利用 ggml_view_3d 创建张量切片视图，不复制数据直接对子区域应用旋转位置编码，节省内存带宽'
  - '- 交错模式：interleave_freq 参数控制维度交错（维度 0 与 1 配对）或分块（前一半维度与后一半维度配对），适配不同模型的 RoPE 实现'
  - '**像素重排 build_patch_merge_permute**'
  - '- 动态分辨率支持：当输入尺寸不能被 scale_factor 整除时，自动进行边界填充（pad_width/pad_height）'
  - '- 三次 reshape + permute 操作：将 (H, W, C) 张量重排为 (H/s, W/s, C*s^2)，实现空间合并（Patch Merging），下采样特征图同时增加通道数'
