  name: 公共 C API 与工具函数 —— 多模态能力的「门面接口」
  'no': 9
  points:
  - '**图像内存管理家族**'
  - '- 生命周期管理四件套：clip_image_u8_init/free、clip_image_f32_init/free 提供基础的图像结构体创建与销毁'
  - '- 尺寸管理：clip_image_size_init/free 管理图像尺寸对象，默认初始化为 448x448'
  - '- 数据访问：clip_image_u8_get_data 提供对原始像素数据的只读访问，支持可选的宽高输出参数'
  - '**批次操作与克隆**'
  - '- clip_image_f32_batch 作为核心批次容器，支持通过 clone() 方法实现深拷贝，确保多线程环境下的数据安全'
  - '- 批次遍历接口：clip_image_f32_batch_n_images/nx/ny/get_img 提供对批次中图像的随机访问能力'
  - '- 音频支持：clip_image_f32_batch_add_mel 将梅尔频谱图封装为伪图像批次，统一音视频处理接口'
  - '**张量维度计算工具**'
  - '- clip_n_output_tokens：核心计算器，根据投影器类型（如 MLP、LDP、Qwen2VL）和输入尺寸动态计算输出序列长度'
  - '- clip_n_output_tokens_x/y：针对 M-RoPE 模型提供二维 Token 计数，支持空间感知的序列长度获取'
  - '- clip_embd_nbytes/clip_embd_nbytes_by_img：内存预计算器，根据图像尺寸或默认尺寸估算输出嵌入所需字节数'
  - '**模型信息查询接口**'
  - '- 基础属性获取：clip_get_image_size/patch_size/hidden_size 提供模型关键维度的快速访问'
  - '- 类型检测家族：clip_is_minicpmv/glm/llava 与 clip_has_vision/audio/whisper_encoder 提供模型架构与能力的运行时判断'
  - '- 高级标识：clip_get_projector_type 返回投影器类型枚举，clip_patch_merge_type 返回字符串形式的合并策略'
  - '- 特殊张量访问：clip_get_newline_tensor 获取图像换行符嵌入，用于多模态对话中的格式控制'
