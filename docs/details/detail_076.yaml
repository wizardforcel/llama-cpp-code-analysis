  name: 内部实现基础设施 —— 调试与日志的「工具箱」
  'no': 10
  points:
  - '**智能指针与资源管理**'
  - '- clip_image_u8/f32：基础图像数据结构，分别存储 8 位 RGB 和 32 位浮点数据，支持任意尺寸，通过构造函数初始化缓冲区'
  - '- clip_image_u8_batch/f32_batch：批次容器，使用 unique_ptr 管理图像所有权，f32 版本支持网格尺寸记录和 clone()
    深拷贝'
  - '- 自定义删除器：clip_image_size_deleter/u8_deleter/f32_deleter 为智能指针提供正确的内存释放逻辑，防止资源泄漏'
  - '**日志系统三级架构**'
  - '- clip_logger_state：全局日志状态，存储回调函数与用户数据指针，通过构造函数初始化'
  - '- clip_log_callback_default：默认回调实现，直接输出到 stderr 并刷新缓冲区'
  - '- clip_log_internal_v/internal：可变参数日志包装，支持格式化字符串，自动处理缓冲区分配与释放'
  - '**字符串处理工具集**'
  - '- string_format：类型安全的字符串格式化，动态计算所需缓冲区大小，避免溢出'
  - '- string_replace_all/split_str：字符串查找替换与分割，支持多字节字符安全处理'
  - '- string_starts_with/ends_with：轻量级前缀/后缀检查，用于投影器类型路由等场景'
  - '**GGUF 与调试工具**'
  - '- gguf_data_to_str/kv_to_str：将 GGUF 枚举类型与键值对转换为可读字符串，支持数组与嵌套类型'
  - '- print_tensor_shape/data：张量调试双雄，分别打印形状信息与数据内容，支持多种数据类型（F16/F32/I32/I16/I8）'
  - '- clip_projector_type_from_string：将字符串名称映射为枚举值，用于 GGUF 元数据解析'
