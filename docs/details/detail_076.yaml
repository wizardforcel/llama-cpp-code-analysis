  name: GGUF 模型加载器 —— 权重文件的「拆箱流水线」
  'no': 7
  points:
  - '**clip_model_loader 的「三步拆箱法」**'
  - '- 元数据预读：通过 gguf_init_from_file 以 no_alloc 模式快速读取键值对与张量元信息，构建元数据上下文（ctx_meta），不加载实际权重数据'
  - '- 超参数加载 load_hparams：根据视觉/音频模态读取投影器类型、模型维度等 30+ 键值，自动处理 MiniCPM-V 版本差异（query_num
    随版本变化）'
  - '- 张量加载 load_tensors：创建数据上下文（ctx_data），按层号前缀（v./a.）匹配张量名称，使用 ifstream 从 GGUF 文件流式读取二进制权重到预分配内存'
  - '**类型安全访问家族**'
  - '- get_bool/get_i32/get_u32/get_f32/get_string：提供五种基础类型的键值读取，支持 required 标志控制强制检查'
  - '- get_arr_int：专门读取整数数组（如 image_res_candidates、vision_feature_layer），自动处理类型转换与长度获取'
  - '**动态分辨率候选生成**'
  - '- set_llava_uhd_res_candidates：为 LLaVA-UHD 生成所有可能的宽高组合，跳过基础 1x1 分辨率，支持任意比例图像输入'
  - '- set_internvl_dhr_res_candidates：为 InternVL 生成满足 min/max tiles 约束的候选分辨率，实现动态高分切片'
  - '**张量名称模板系统**'
  - '- 命名空间设计：使用 string_format 生成 "v.blk.%d.attn_q.weight" 等标准键名，实现跨架构的统一权重访问接口'
  - '- 可选权重探测：通过 required=false 参数优雅处理缺失的可选权重（如 qkv_b、q_norm），自动检测模型能力边界'
  - '**FFN 权重交换检测**'
  - '- 兼容性补丁：检测特定模型（LLaVA、Qwen2VL 等）中 up/down 权重是否转置，若检测到维度不匹配（ff_down_w->ne[0] ==
    n_embd），自动交换以适应期望布局'
