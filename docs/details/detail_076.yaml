  name: CLIP 运行时上下文与后端初始化 —— 视觉引擎的「点火启动器」
  'no': 1
  points:
  - '**为什么说 clip_ctx 是 CLIP 的「驾驶舱」？**'
  - '- 封装后端设备引用（CPU/GPU）、内存上下文与调度器，集中管理推理所需的全部运行时资源'
  - '- 通过后端列表与缓冲区类型配对，实现张量到硬件设备的自动映射与内存分配'
  - '- 预设计算图元数据缓冲区（buf_compute_meta），支持快速重复构图而无需频繁分配内存'
  - '- 通过 proj_type() 接口对外暴露模型投影器类型，作为模态路由的关键标识'
  - '**后端选择的「三级火箭」策略**'
  - '- 一级：通过环境变量 MTMD_BACKEND_DEVICE 指定专用后端，实现精准硬件控制'
  - '- 二级：自动探测 GPU 后端类型，失败时优雅降级并输出警告日志'
  - '- 三级：兜底启用 CPU 后端，确保任何环境下均可运行，并记录后端选择结果'
  - '**预热机制：批量推理前的「预演彩排」**'
  - '- 创建虚拟图像批次（448x448 或自定义 warmup 尺寸），驱动计算图完成一次完整前向传播'
  - '- 通过 ggml_backend_sched_alloc_graph 锁定张量内存布局，避免运行时动态分配开销'
  - '- 支持音频模式下的频谱图预热（nx=音频长度，ny=梅尔频带数），统一视觉与音频的初始化流程'
