  name: 模型层结构与张量组织 —— 权重矩阵的「集装箱码头」
  'no': 3
  points:
  - '**clip_layer：标准 Transformer 层的「俄罗斯套娃」**'
  - '- 基础组件：QKV 投影矩阵（q_w/k_w/v_w）+ 输出投影（o_w），支持合并（qkv_w）与分离两种存储格式'
  - '- 归一化双轨制：ln_1/ln_2（标准 LayerNorm）与 attn_post_norm/ffn_post_norm（后归一化变体）并存，适配不同模型架构'
  - '- 条件权重设计：层缩放参数（ls_1_w/ls_2_w/ls_out_w）与 QK 归一化（q_norm/k_norm）按需加载，支持零开销的条件初始化'
  - '- DeepStack 扩展槽：deepstack_fc1/fc2 权重为 Qwen3VL 等多层特征融合模型预留接口，实现跨层特征交互'
  - '**clip_model：模型级张量的「中央仓库」**'
  - '- 顶层输入嵌入三件套：patch_embeddings_0（卷积权重）+ position_embeddings（学习位置编码）+ class_embedding（分类
    token）'
  - '- 投影器权重矩阵：mm_projector（基础 MLP 投影）与 vision_resampler（重采样器）分离，支持 LLaVA、MiniCPM
    等多种投影模式'
  - '- 音频特性检测：audio_has_avgpool 与 audio_has_stack_frames 接口判断是否需要应用平均池化或帧堆叠预处理'
