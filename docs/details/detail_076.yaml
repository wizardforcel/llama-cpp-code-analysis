  name: 模型超参数体系 —— 视觉架构的「基因测序报告」
  'no': 2
  points:
  - '**clip_hparams：从像素到向量的「翻译官」**'
  - '- 定义 Vision Transformer 核心五元组（嵌入维度/层数/头数/FFN 维度/投影维度），描述模型的容量规模'
  - '- 封装图像预处理参数（patch_size/image_size/归一化均值方差），决定输入数据的形状变换规则'
  - '- 通过 n_merge 与 spatial_merge_size 支持空间合并策略，实现高分辨率图像的分块压缩'
  - '**动态分辨率支持三剑客**'
  - '- set_limit_image_tokens：将 token 数量约束转换为像素约束，确保输入图像在模型处理能力范围内'
  - '- set_warmup_n_tokens：根据平方数反推预热图像边长，优化计算图内存预分配效率'
  - '- global_attn_indices：标识 SAM 类模型中采用全局注意力的特殊层，指导稀疏注意力掩码构建'
  - '**模态检测双通道**'
  - '- 通过 has_vision/has_audio 标志位实现视觉与音频编码器的自动识别与路由'
  - '- load_hparams 中通过 KEY_PROJ_TYPE 判断投影器类型，自动降级 QWEN25O 为 QWEN25VL/QWEN2A 以适配不同模态'
  - '**全局访问接口**'
  - '- clip_get_hparams 提供对超参数结构体的只读访问，实现跨模块的参数共享'
