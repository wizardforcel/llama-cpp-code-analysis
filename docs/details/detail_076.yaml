  name: 计算图构建基类 clip_graph —— 视觉推理的「图纸设计师」
  'no': 4
  points:
  - '**多态构建器模式：一套接口，百种实现**'
  - '- 纯虚函数 build() 强制子类实现特定架构的完整构图逻辑，保证接口统一性'
  - '- 构造时自动注入模型指针、超参数、图像尺寸，并初始化独立的 GGML 上下文（ctx0）与计算图（gf），避免全局状态污染'
  - '- 预计算派生参数：n_patches（补丁总数）、d_head（头维度）、kq_scale（注意力缩放因子），减少运行时重复计算'
  - '**张量回调与调试支持**'
  - '- cb() 方法自动为张量命名并附加层索引，生成可读性极强的计算图节点标签（如 "blk.0.attn_q"），便于调试与可视化分析'
  - '**模块化构建工具箱**'
  - '- build_norm：统一处理 LayerNorm/RMSNorm，支持可选的权重（w）与偏置（b），通过 il 参数标记所属层'
  - '- build_ffn：灵活的 FFN 构建器，支持门控机制（SiLU/GeLU 变体）、条件上下投影（up/gate/down 权重可空）'
  - '- build_attn：核心注意力封装，智能选择 Flash Attention 或标准数学实现，自动处理 QKV 维度重排与输出投影'
  - '- build_stack：通用音频帧堆叠函数，通过堆叠因子重塑输入特征，支持 ultravox 等音频模型'
  - '- build_mm：矩阵乘法包装器，默认调用 ggml_mul_mat，子类可覆盖以支持 LoRA 适配等扩展'
