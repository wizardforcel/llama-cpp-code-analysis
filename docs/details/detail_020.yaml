  name: 采样器后端支持与性能统计 —— 让 GPU 也能当「指挥官」
  'no': 8
  points:
  - '**后端采样：让 GGML 计算图直接选 token**'
  - '- 每个 sampler 的 `backend_apply` 在 ggml_context 中构造算子图（softmax、cumsum、argmax 等）'
  - '- `backend_init` 调用 `llama_sampler_backend_support` 用一个 dummy 张量跑一遍图，检查所有 op
    是否被后端支持'
  - '- 支持的采样器名字会带 `+` 前缀（如 `+top-k`），不支持的带 `-`（如 `-top-p`）'
  - '- `llama_sampler_backend` 基类管理 name_ext 的 `+/-` 前缀状态'
  - '**链中的后端短路**'
  - '- `llama_sampler_chain_apply` 发现当前 sampler 是 backend 类型就跳过后续 CPU sampler'
  - '- `chain_backend_accept / _apply / _set_input` 也遵循同样的链式前缀规则'
  - '- `chain_backend_init` 遍历所有 sampler 探测后端支持，结果保存在 info.is_backend'
  - '- 保证 GPU 路径与 CPU 路径互斥，避免重复采样'
  - '**Dist 后端的 double 精度 RNG**'
  - '- `dist_backend_set_input` 在每次采样前把 uniform 张量填充新的 random 数'
  - '- 必须用 double 精度才能保证与 CPU 路径产生完全一致的序列'
  - '**Logit Bias 后端：ggml_set_rows 的零拷贝写入**'
  - '- `logit_bias_backend_apply` 构造 fill(0) → set_rows(bias) → add 算子链'
  - '- `logit_bias_backend_set_input` 把 bias 和 idx 数据写到 inp_* 张量'
  - '**采样统计与种子管理**'
  - '- `llama_perf_sampler` 读取 chain 的 t_sample_us / n_sample 返回性能数据'
  - '- `get_rng_seed` 统一处理 LLAMA_DEFAULT_SEED：自动用 system_clock 或 random_device'
  - '- `llama_sampler_get_seed` 支持从 dist/mirostat/mirostat_v2/链中反向查找实际种子'
  - '**perf 接口家族**'
  - '- `llama_perf_sampler` 返回结构体（t_sample_ms + n_sample）'
  - '- `llama_perf_sampler_print` 用 LLAMA_LOG_INFO 打印人类可读的性能报告'
  - '- `llama_perf_sampler_reset` 把 t_sample_us/n_sample 清零'
