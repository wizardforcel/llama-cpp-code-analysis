learning_targets:
- 理解 `llama_sampler_i` 虚函数表的契约设计与多态调度机制
- 掌握采样器链 `llama_sampler_chain` 的链式调度与时间统计原理
- 了解贪心、Dist、Top-K、Top-P、Min-P、Typical、xtc 等基础采样器的算法实现
- 掌握温度与自适应（Mirostat、adaptive_p）采样如何动态调整概率分布
- 理解 Penalties、DRY、Top-N-Sigma 等重复抑制算法的实现细节
- 掌握 Logit Bias、Infill、Grammar 等直接干预 logit 的特权通道
- 了解 GGML 计算图如何承载后端采样器，让 GPU 也能成为「指挥官」
- 熟悉环形缓冲区 `ring_buffer`、Z-算法、桶排序等关键数据结构
- 理解 `apply` / `accept` / `reset` / `clone` / `free` / `name` 六大钩子在状态机中的角色
- 掌握采样器的 clone/reset/free 生命周期管理以及 ring_buffer 等辅助数据结构
- 理解 empty 采样器作为占位符的设计哲学以及后端支持检测机制
life_analogy:
- 想象一下 LLM 的 token 选择是一个**「乐团指挥选拔下一位乐手」**的过程：
- '- **logits** = 所有候选乐手的「试奏评分」（尚未归一化的偏好分数）'
- '- **贪心采样** = 指挥只看分数最高的乐手，缺乏变化但稳定'
- '- **Dist（分布采样）** = 按试奏评分的高低概率抽签决定，多样但有时会爆冷'
- '- **Top-K / Top-P** = 「限定选拔范围」（K 个候选 / 概率累积到 P 为止），让指挥只关注头部'
- '- **Min-P** = 「按最高分比例定门槛」，把远低于冠军的乐手直接淘汰'
- '- **Typical** = 「按典型性选人」，偏离分布熵的「怪才」会被淘汰'
- '- **Temperature** = 「演出氛围调节」：温度低→冷静精准（接近贪心），温度高→热烈奔放'
- '- **Temp-Ext** = 「自适应氛围」：根据已有分布的熵自动调节温度，让氛围变化更细腻'
- '- **XTC** = 「随机禁用最高音」：故意剔除一些高分乐手，打破同质化'
- '- **Mirostat / adaptive_p** = 「自适应裁判」：根据观众反应实时调整选拔尺度'
- '- **Penalties / DRY** = 「反重复纪律委员」：已经登台的乐手要降权，避免连续重复'
- '- **Logit Bias** = 「VIP 通道」：用户可以为某些 token 加减分强制出场'
- '- **Infill** = 「填空专用」：在文本中间补全时，会主动抑制 EOS 并合并共享前缀的 token'
- '- **Grammar** = 「语法警察」：只允许符合 BNF 文法的 token 通过'
- '- **采样链** = 「流水线指挥链」：每个采样器只负责一道工序（先温度、再 Top-K、再 Top-P……）'
- '- **后端采样（backend_apply）** = 「让 GPU 当指挥」：用 GGML 计算图直接在 GPU 上完成 softmax、cumsum、argmax
  等操作，避免 CPU/GPU 数据来回搬运'
- '- **ring_buffer** = 「最近 N 次登台记录」：用定长滚动窗口记录最近 penalty_last_n 个 token，老数据自动滚出'
- '- **Z-算法（DRY）** = 「重复片段扫描仪」：用 O(N) 时间找出末尾序列在历史中最早出现的最长匹配'
- '- **桶排序 + partial_sort** = 「快速分类筛子」：先用 128 个桶粗分，再用 partial_sort 在桶内细排，节省排序时间'
- '- **empty 采样器** = 「指挥休息位」：当某个采样策略不需要时（如 k<=0、temp=1），安排一个什么都不做的乐手保留位置，确保流水线不被打乱'
- '- **clone / free / reset / name** = 「乐团的复制 / 解散 / 复位 / 点名」：每个采样器都支持复制以生成相同状态的副本、安全释放内存、恢复初始状态、以及查询自己的身份'
