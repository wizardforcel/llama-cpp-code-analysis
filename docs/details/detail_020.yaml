summary:
- concept: '`llama_sampler_i`'
  desc: 虚函数表抽象，name/apply/accept/reset/clone/free + 后端四钩子（backend_init/apply/accept/set_input）
- concept: 空采样器（empty）
  desc: 占位符，名称带 `?`，所有方法 no-op，配置不合法时自动插入以保链稳定
- concept: '`llama_sampler_chain`'
  desc: 采样链容器，保存子采样器列表、is_backend 标志、预分配 cur 缓冲与计时字段
- concept: '`llama_sampler_sample`'
  desc: 采样入口：拉 logits/probs/candidates → apply → 返回 selected token
- concept: '`llama_sampler_backend_support`'
  desc: 用 dummy ggml 图遍历算子，检查后端是否支持，否则降级为 CPU 路径
- concept: '`llama_sampler_backend`'
  desc: 后端采样器基类，提供 name_ext 前缀（+支持/-不支持）与 init 一次性开关
- concept: '`llama_sampler_greedy`'
  desc: 贪心，线性 argmax；后端用 ggml_argmax
- concept: '`llama_sampler_dist`'
  desc: softmax + 累积概率一次完成采样+归一化；用 double 精度 RNG 保证可复现
- concept: '`llama_sampler_top_k`'
  desc: partial_sort 截断到 k；k≤0 时返回空采样器
- concept: '`llama_sampler_top_p`'
  desc: 排序累加概率达 p 截断；未排序时用 256 候选桶排序启发式
- concept: '`llama_sampler_min_p`'
  desc: 相对 max_logit 的阈值过滤；未排序数组有快速线性扫描路径
- concept: '`llama_sampler_typical`'
  desc: 用 |(-log p) - H| 作为偏离熵的距离排序截断（仅 CPU）
- concept: '`llama_sampler_temp`'
  desc: logit /= temp；temp≤0 退化为 argmax；temp=1.0 返回空采样器
- concept: '`llama_sampler_temp_ext`'
  desc: 基于熵的动态温度；后端完整用 soft_max/log/mul/sum/scale/exp/div 算子图
- concept: '`llama_sampler_xtc`'
  desc: 概率性剔除累积概率首次低于 threshold 的高频 token
- concept: '`llama_sampler_mirostat`'
  desc: 用 s_hat 估计动态 top-k；按 observed_surprise - τ 更新 μ
- concept: '`llama_sampler_mirostat_v2`'
  desc: 直接按 μ 截断 surprise，无需 m 参数，更简洁
- concept: '`llama_sampler_adaptive_p`'
  desc: EMA 跟踪被选 token 概率；用二次函数形变 logit 靠近目标
- concept: '`llama_sampler_grammar`'
  desc: 委托 llama_grammar_apply_impl 把非法 token 设 -INF；支持 lazy + trigger
- concept: '`llama_sampler_penalties`'
  desc: ring_buffer + token_count；repeat 按符号乘/除，freq 按次数扣，present 出现即扣
- concept: '`llama_sampler_top_n_sigma`'
  desc: Z-score 风格截断，保留 max - n*std 以上的 token
- concept: '`llama_sampler_dry`'
  desc: Z-算法求最长后缀重复；seq_breakers 阻止过度抑制；max_exponent 防 pow 溢出
- concept: '`llama_sampler_logit_bias`'
  desc: 直接 logit += bias；先 idx==id 快速路径，后用 ggml_set_rows + ggml_add
- concept: '`llama_sampler_infill`'
  desc: EOG 比例抑制 + 共享前缀 token 合并 + 双重 thold（0.2 + 1/(n+1)）
- concept: '`ring_buffer<T>`'
  desc: 定容环形缓冲；满时 push_back 自动覆盖最旧元素；rat(i) 反向索引；to_vector 线性化
- concept: '`llama_token_data_array_partial_sort`'
  desc: 128 桶桶排序 + partial_sort 混合；仅保留前 npartial 个候选
- concept: '`llama_sample_dist`'
  desc: std::discrete_distribution 包装，迭代器遍历 token_data 的 p 字段
- concept: '`llama_sampler_softmax_impl`'
  desc: 数值稳定 softmax：减 max_l 再 exp，可选就地排序
- concept: '`get_rng_seed`'
  desc: 统一处理 LLAMA_DEFAULT_SEED，自动用 system_clock 或 random_device
- concept: '`llama_perf_sampler`'
  desc: 读取 chain 的 t_sample_us / n_sample，返回性能统计
- concept: '`llama_sampler_get_seed`'
  desc: 从 dist/mirostat/chain 反向查找实际生效的 RNG 种子
