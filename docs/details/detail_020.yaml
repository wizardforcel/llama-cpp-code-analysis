- '│   ├── chain_backend_init / _apply / _accept / _set_input  # 后端短路链'
- '│   ├── chain_add/n/get/remove  # 子采样器增删查'
- '│   ├── chain_name             # 固定返回 "chain"'
- '│   └── chain_sample() # 主入口：拉取 logits/probs/candidates → cur 缓冲 → apply'
