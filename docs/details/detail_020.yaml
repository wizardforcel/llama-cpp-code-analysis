  points:
  - '**为什么需要 `llama_sampler_i` 虚函数表？**'
  - '- 采样器种类繁多（贪心、温度、Top-K、Grammar 等），但调用方只关心「采样下一个 token」'
  - '- 通过面向对象的多态机制，把每个采样器的具体行为封装到 ctx 中'
  - '- 头文件中 `llama_sampler_i` 抽象了 name/accept/apply/reset/clone/free 六大核心钩子 + 四大后端钩子（backend_init/apply/accept/set_input）'
  - '**空采样器（Empty Sampler）的占位符艺术**'
  - '- 当配置参数不合法（如 k<=0、p>=1）时，构造函数返回 `?top-k` 这样带问号的空采样器'
  - '- 空采样器的所有方法都是 no-op，但保留在采样链中可保留位置'
  - '- 这种设计避免了采样链中的「采样器数量与位置不固定」带来的管理复杂度'
  - '**公共 API：llama_sampler_init/apply/accept/reset/clone/free**'
  - '- `llama_sampler_init` 是统一的构造函数，接收 iface + ctx，返回堆上的 sampler'
  - '- `apply` 必现，`accept/reset/clone/free` 都可以为 null（用 `if (smpl->iface->xxx)` 防御）'
  - '- `name` 查询走 `smpl->iface->name(smpl)`，让 ctx 自己决定如何报告身份'
