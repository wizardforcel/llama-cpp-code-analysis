code_map:
- src/llama-sampler.h
- '├── struct llama_sampler_chain       # 采样链容器'
- '│   ├── params / is_init             # 构造参数与后端初始化标志'
- '│   ├── std::vector<info> samplers   # 子采样器列表（每项含 is_backend）'
- '│   ├── std::vector<llama_token_data> cur  # 预分配的 token 缓冲'
- '│   └── t_sample_us / n_sample       # 性能统计字段'
- '└── llama_sampler_init_dry_testing() # 测试用 DRY 构造器声明'
- ''
- src/llama-sampler.cpp
- '├── ring_buffer<T>                   # 自定义环形缓冲区（penalties/dry 用）'
- '│   ├── ring_buffer() / front / back # 构造与访问器'
- '│   ├── push_back / pop_front / rat  # 末尾追加 / 头部弹出 / 反向索引'
- '│   ├── to_vector                    # 线性化导出'
- '│   └── clear / empty / size         # 状态查询'
- │
- '├── llama_token_data_array_partial_sort()      # 桶排序 + partial_sort 的混合排序'
- '├── llama_token_data_array_partial_sort_inplace # 小数组就地 partial_sort 入口'
- '├── llama_sample_dist()             # 按概率离散分布采样（std::discrete_distribution）'
- '├── llama_sampler_softmax_impl()     # 数值稳定的 softmax 实现（可选排序）'
- '├── llama_sampler_temp_impl()        # 温度缩放：temp≤0 退化为 argmax'
- │
- ├── 采样器公共基础
- '│   ├── llama_sampler_init/apply/accept/reset/clone/free  # 抽象 API 入口'
- '│   ├── llama_sampler_name()         # 接口契约的查询方法'
- '│   └── llama_sampler_empty_i        # 空采样器占位符（?xxx 名称）'
- │
- ├── 后端辅助：llama_sampler_backend 基类
- '│   ├── llama_sampler_backend()      # 构造（name + is_init=false + support=false）'
- '│   ├── get_name()                   # 返回 +/-name 前缀表示后端支持情况'
- '│   └── init()                       # 一次性设置 support 标志'
- │
- ├── 后端探测：llama_sampler_backend_support()
- │   ├── 构造 dummy ggml 图（1M 长度 F32 + I32 candidates）
- │   ├── 用 backend_apply 填充算子
- │   └── ggml_backend_dev_supports_op() 遍历检查
- │
- ├── 采样链：llama_sampler_chain_*
- '│   ├── chain_apply    # is_backend 短路 + time_meas 自动计时'
- '│   ├── chain_accept   # 广播 accept 到所有子采样器'
- '│   ├── chain_reset    # 重置所有子采样器'
