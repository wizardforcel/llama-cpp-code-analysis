  name: 重复惩罚：Penalties、DRY 与 Top-N-Sigma —— 抑制重复的「纪律委员」
  'no': 6
  points:
  - '**Penalties：经典三件套（repeat / freq / present）**'
  - '- 用环形缓冲区 `ring_buffer<llama_token>` 保存最近 penalty_last_n 个 token'
  - '- 用哈希表 `token_count` 统计窗口内每个 token 的出现次数'
  - '- repeat 惩罚：logit 正负时分别用除法/乘法（避免负 logit 反向放大）'
  - '- freq 惩罚：按出现次数扣减 logit（次数越多扣越多）'
  - '- present 惩罚：出现过就扣固定值'
  - '- clone 时复制 ring_buffer（深拷贝）；reset 时清空 prev + token_count'
  - '**DRY（Don''t Repeat Yourself）：基于序列相似度的惩罚**'
  - '- 用 Z-算法（线性时间）找出最近 N 个 token 中所有重复后缀'
  - '- seq_breakers 序列断裂符阻止过度抑制（如句号、换行）'
  - '- 用 `pow(dry_base, repeat_len)` 计算指数级惩罚'
  - '- 用 `max_exponent` 防 float 溢出'
  - '- `llama_sampler_init_dry` 在初始化时调用 `get_overlapping_token_sequences` 把 seq_breaker
    字符串转换为 token 序列对'
  - '- `llama_sampler_init_dry_testing` 是测试专用入口，直接接收 token 序列对'
  - '**Top-N-Sigma：基于标准差的截断**'
  - '- 计算所有非 -INF logit 的均值和标准差'
  - '- 保留 max - n*std 以上的 token，剔除离群低值'
  - '- 类似 Z-score 异常检测的思路'
  - '**环形缓冲区数据结构详解**'
  - '- 构造时按 capacity 预分配 `std::vector<T>`，无内存动态扩张'
  - '- `push_back` 在容量满时让 first 指针前进一格，自动覆盖最旧元素'
  - '- `front()` / `back()` 提供两端访问；空时抛 std::runtime_error'
  - '- `rat(i)` 反向索引：rat(0) 是最新，rat(1) 是上一个；DRY 算法专用'
  - '- `to_vector` 把环形内容线性化为 vector，按「从头到尾」顺序'
  - '- `clear` 仅重置状态不释放内存；`empty/size` 维护当前长度'
