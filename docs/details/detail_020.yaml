- '│   ├── dist_apply           # softmax + cumulative sum 一次采样'
- '│   ├── dist_backend_apply   # soft_max → cumsum → sub → step → sum 算子图'
- '│   ├── dist_backend_set_input # double 精度 RNG → float uniform'
