- '│   ├── top_k_backend_apply  # ggml_top_k + get_rows 索引筛选'
- '│   └── top_k_backend_init   # 探测后端支持'
- │
- ├── Top-P 采样
- '│   ├── top_p_name / clone / free             # 标识与生命周期'
- '│   ├── top_p_apply          # softmax + 累加概率截断 + 256 候选启发式'
- '│   ├── top_p_backend_apply  # argsort + cumsum + step + log + add 算子图'
- '│   └── top_p_backend_init   # 探测后端支持'
- │
- ├── Min-P 采样
- '│   ├── min_p_name / clone / free             # 标识与生命周期'
- '│   ├── min_p_apply          # 未排序数组快速线性扫描 vs 排序后二分'
- '│   ├── min_p_backend_apply  # argmax + scale_bias + step + log + add'
- '│   └── min_p_backend_init   # 探测后端支持'
- │
- ├── Typical 采样（仅 CPU）
- '│   ├── typical_name / clone / free          # 标识与生命周期'
- '│   └── typical_apply        # 计算 entropy + |(-log p) - H| 排序截断'
- │
- ├── 温度采样（temp / temp-ext）
- '│   ├── temp_name / clone / free             # 标识与生命周期'
- '│   ├── temp_apply          # 调用 temp_impl'
- '│   ├── temp_backend_apply  # ggml_scale 缩放 + argmax 分支'
- '│   └── temp_backend_init   # 探测后端支持'
- │
- ├── 温度扩展采样（temp-ext）
- '│   ├── temp_ext_name / clone / free         # 标识与生命周期'
- '│   ├── temp_ext_apply      # 熵 → 幂函数 → 动态温度区间'
- '│   ├── temp_ext_backend_apply # soft_max → log → mul → sum → scale → exp → div'
- '│   └── temp_ext_backend_init # 探测后端支持'
- │
- ├── XTC 采样（Exclude Top Choices）
- '│   ├── xtc_name / reset / clone / free      # 标识与生命周期'
- '│   └── xtc_apply           # 概率性剔除累积概率 ≥ threshold 的 token'
- │
- ├── Mirostat v1 / v2
- '│   ├── mirostat_name / reset / clone / free # 标识与生命周期'
- '│   ├── mirostat_apply       # 用 s_hat 估计动态 k + 滑动学习 μ'
- │   ├── mirostat_v2_name / reset / clone / free
- '│   └── mirostat_v2_apply    # 按 μ 截断 surprise，重 softmax 采样'
- │
- ├── Adaptive-P 采样
- '│   ├── adaptive_p_name / clone / free       # 标识与生命周期'
- '│   ├── adaptive_p_apply     # 二次函数形变 logit + EMA 目标'
- '│   ├── adaptive_p_accept    # pending_token 验证后才更新 EMA'
- '│   └── adaptive_p_reset     # 重置 EMA + pending_token + RNG'
- │
- ├── Grammar 采样
- '│   ├── grammar_name / accept_impl / apply / reset / clone / free  # 标识与生命周期'
- '│   └── grammar_init_impl    # 支持 lazy / trigger_words / trigger_patterns'
- │
- ├── Penalties 采样
- '│   ├── penalties_name / clone / free        # 标识与生命周期'
- '│   ├── penalties_apply      # repeat (乘/除按符号) + freq + present'
- '│   └── penalties_accept     # ring_buffer + unordered_map token_count'
- │
- ├── Top-N-Sigma 采样
- '│   ├── top_n_sigma_name / clone / free     # 标识与生命周期'
- '│   └── top_n_sigma_apply    # mean + std → 保留 max - n*std'
- │
- ├── DRY 采样
- '│   ├── dry_name / reset / clone / free      # 标识与生命周期'
- '│   ├── dry_apply            # Z-算法求最长后缀重复 + dry_processed_breakers'
- '│   ├── dry_accept           # push_back 当前 token 到 last_tokens'
