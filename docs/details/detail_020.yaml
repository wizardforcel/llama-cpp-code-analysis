  name: 温度、Typical、XTC：调节「生成多样性」的旋钮
  'no': 4
  points:
  - '**Temperature：logit 的「温度计」**'
  - '- `llama_sampler_temp_impl` 把所有 logit 除以 temp'
  - '- temp≤0 时退化为 argmax（等价于贪心），但保留为独立采样器'
  - '- temp=1.0 时是恒等变换，返回空采样器节省开销'
  - '- 后端 `llama_sampler_backend_temp_sampling` 是 temp/temp_ext 后端的公共工具'
  - '**Temp-Ext：基于熵的动态温度**'
  - '- 计算 softmax 分布的熵，按幂函数映射到 [min_temp, max_temp] 区间'
  - '- 熵高（分布均匀）→ 用 max_temp 鼓励探索；熵低（分布尖锐）→ 用 min_temp 收紧'
  - '- delta=0 时退化为标准 temperature 采样'
  - '- 后端实现完全用 GGML 算子图：soft_max → log → mul → sum → scale → exp → div'
  - '**Typical（仅 CPU）：按「偏离熵」排序截断**'
  - '- 先做 softmax，再计算整条分布的 entropy H'
  - '- 计算每个 token 的 |(-log p) - H|，把「离熵的距离」作为偏离典型性的度量'
  - '- 按距离升序排列后累加概率，达到 p 时截断'
  - '- 只有 CPU 实现，没有后端 GPU 路径'
  - '**XTC（Exclude Top Choices）：概率性剔除高频 token**'
  - '- 用 softmax 得到概率，找累积概率首次低于 threshold 的位置'
  - '- 仅保留低概率尾部，鼓励模型跳出重复模式'
  - '- 用 `std::uniform_real_distribution` 决定是否触发（概率由 probability 控制）'
  - '**温度家族生命周期**'
  - '- `llama_sampler_init_temp` 当 temp==1.0 时返回 `?temp` 空采样器'
  - '- `llama_sampler_init_temp_ext` 当 temp==1.0 且 delta<=0 时返回 `?temp-ext`'
  - '- `temp_backend_apply` 用 `llama_sampler_backend_temp_sampling` 实现 scale + argmax'
