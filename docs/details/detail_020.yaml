  name: 采样器链：链式调度的「流水线指挥官」
  'no': 2
  points:
  - '**为什么需要「采样器链」？**'
  - '- 真实推理中往往需要组合多种策略（如先 Temperature，再 Top-K，再 Top-P）'
  - '- 单个采样器无法满足复杂需求；链式组合让配置像积木一样灵活'
  - '- 每个子采样器只关心自己的 logits 变换，链负责按顺序调度'
  - '**采样链的数据结构：sampler 的「列车车厢」**'
  - '- `llama_sampler_chain` 内部用 `std::vector<info>` 保存所有子采样器'
  - '- 每个 info 还携带 `is_backend` 标志，标记能否在 GPU 后端运行'
  - '- `cur` 是预分配的 token_data 缓冲，避免每次采样都重新分配内存'
  - '**时间统计与后端调度**'
  - '- 每次 apply 都会被 `time_meas` 包裹，自动累计 `t_sample_us`'
  - '- `n_sample` 记录采样次数，`llama_perf_sampler()` 可以查看总耗时'
  - '- 当前 sampler 是 backend 类型时，后续 CPU 采样器会被跳过以避免重复'
  - '**链的辅助操作：clone/reset/free/n/get/remove/add**'
  - '- `chain_clone` 深拷贝所有子采样器（递归调用每个 sampler 的 clone）'
  - '- `chain_reset` 广播 reset 到所有子采样器；`chain_free` 逐个 free 后删除 chain'
  - '- `chain_n` 返回子采样器数量；`chain_get` 按索引访问；`chain_remove` 弹出指定采样器'
  - '- `chain_add` 把 sampler 追加到 `std::vector<info>` 末尾，默认 `is_backend=false`'
  - '- `chain_name` 固定返回字符串 "chain"，标识链路身份'
