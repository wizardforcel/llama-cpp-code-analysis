- '│   ├── logit_bias_backend_set_input # 把 bias 与 idx 数据写到 inp_* 张量'
- '│   └── logit_bias_backend_init # 探测后端支持'
- │
- ├── Infill 采样
- '│   ├── infill_name / clone / free           # 标识与生命周期'
