  name: Logit Bias、Infill 与 Grammar：直接干预 logit 的「特权通道」
  'no': 7
  points:
  - '**Logit Bias：给指定 token 加减分**'
  - '- `logit_bias` 是 {token, bias} 列表，apply 时直接修改对应 token 的 logit'
  - '- 优化策略：先处理 idx==id 的简单情况，剩下的放进 to_search 二次扫描'
  - '- 后端实现用 `ggml_set_rows` 把 bias 写入指定 token 的位置，再 `ggml_add` 叠加'
  - '- 后端 `set_input` 把 bias 与 idx 数据写入 `inp_logit_bias` 与 `inp_logit_idxs` 张量'
  - '**Infill：Fill-in-the-Middle 填充采样**'
  - '- 当 EOG token 概率过高（>文本 token 总概率 / 3N）时强制采样 EOG'
  - '- 用 token piece 字符串前缀合并策略：把共享前缀的多 token 合并为高概率项'
  - '- 双重 thold 过滤（0.2 + 1/(n_non_eog+1)）保留足够多候选'
  - '- 如果所有候选都是 EOG，则强制返回 EOT/EOS'
  - '- `buf0/buf1` 预分配 512 字节，存储 token_to_piece 输出避免反复分配'
  - '**Grammar：语法约束采样**'
  - '- 委托给 `llama_grammar_apply_impl` 修改 logit：把不合法 token 设为 -INF'
  - '- lazy 模式支持 trigger_words/trigger_patterns 延迟激活'
  - '- reset 时会重新初始化 grammar 对象（保留 trigger 配置）'
  - '- clone 在 ctx 为空时调用 `init_grammar_impl(..., nullptr, ...)` 创建空实例再填充状态'
  - '**Grammar 初始化的多样性**'
  - '- `llama_sampler_init_grammar` 默认非 lazy'
  - '- `llama_sampler_init_grammar_lazy` 支持 trigger_words + trigger_tokens'
  - '- `llama_sampler_init_grammar_lazy_patterns` 支持正则 trigger_patterns'
  - '- `llama_sampler_init_grammar_impl` 是三者的内部公共入口'
  - '- trigger_words 会被转换为正则 trigger_pattern：`[\s\S]*?(word1|word2|...)[\s\S]*`'
