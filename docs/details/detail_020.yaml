  name: Mirostat 与 adaptive_p：自适应「目标惊奇度」算法
  'no': 5
  points:
  - '**Mirostat v1：用 s_hat 估计动态 top-k**'
  - '- 用前 m 个 token 的 log(p_i/p_{i+1}) 估计分布的「熵衰减斜率」'
  - '- 基于 s_hat 和目标惊奇度 τ 反推 k 值，再用 Top-K 裁剪'
  - '- 采样后根据观测到的实际惊奇度（-log2(p)）调整 μ（学习状态）'
  - '- μ 越大说明模型越「无趣」，需要鼓励多样化'
  - '- reset 时把 μ 重置为 `2.0f*tau`，并重新种子化 RNG'
  - '**Mirostat v2：按 μ 直接截断而非 top-k**'
  - '- 把所有 surprise > μ 的 token 直接砍掉，重新 softmax 后采样'
  - '- v2 比 v1 更简单且无需 m 参数'
  - '- reset 同样把 μ 初始化为 `2.0f*tau`'
  - '**adaptive_p：指数滑动平均目标适配**'
  - '- 用 EMA 跟踪历史被选 token 的原始概率，动态调整目标概率'
  - '- 当实际概率普遍高于目标 → 收紧目标；反之放宽'
  - '- 通过二次函数把偏离目标的位置 logit 调低，靠近目标的位置保持高分'
  - '- pending_token 机制保证只有真正被接受的 token 才更新 EMA'
  - '- DISTRIBUTION_WIDTH / PEAK_LOGIT_VALUE / SHARPNESS 三个常量控制形变曲线'
  - '- clone 复制 weighted_sum / total_weight / pending_token 状态；不复制 original_probs'
  - '- reset 重置 EMA 状态、pending_token 与 RNG 种子'
