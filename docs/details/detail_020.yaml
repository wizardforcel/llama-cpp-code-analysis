  name: 基础采样器：贪心、Dist、Top-K、Top-P、Min-P —— 选 token 的「基本招式」
  'no': 3
  points:
  - '**Greedy：永远选概率最高的**'
  - '- `llama_sampler_greedy_apply` 遍历 cur_p 找到 logit 最大的 token，设为 selected'
  - '- 实现极简，但缺乏多样性，常用于确定性测试场景'
  - '- 后端实现用 `ggml_argmax` 算子直接选出最大下标'
  - '**Dist：按概率分布随机采样**'
  - '- `llama_sample_dist` 用 `std::discrete_distribution` 按概率权重选 token'
  - '- `llama_sampler_dist_apply` 先做 softmax 把 logit 转成概率，再用 cumulative sum 一次完成采样+归一化'
  - '- 双精度（double）随机数确保与不同 RNG 实现产生相同序列'
  - '- `dist_backend_set_input` 也用 double 精度 RNG 才能复现与 CPU 路径完全一致的序列'
  - '**Top-K：截断到概率最高的 K 个**'
  - '- `llama_sampler_top_k_impl` 把 cur_p 的 size 缩小到 k'
  - '- 当 k<=0 时退化为空采样器（不裁剪）'
  - '- 后端实现用 `ggml_top_k` 算子 + `ggml_get_rows` 在 GPU 上并行完成索引筛选'
  - '**Top-P（Nucleus）：累积概率达到 p 为止**'
  - '- 排序后累加概率，找到刚好 ≥p 的位置截断'
  - '- 当 cur_p 未排序且较大时，先做 partial_sort（256 个候选）作为启发式'
  - '- 后端实现用 argsort + cumsum + step + log + add 算子图，把 mask 转 logit 偏置'
  - '**Min-P：相对最大 logit 的阈值过滤**'
  - '- 计算 max_logit + log(p)，过滤掉所有低于该阈值的 token'
  - '- 对未排序数组做了快速线性扫描的优化路径'
  - '- 后端实现用 argmax + step + log 算子构造偏置，叠加到 logits 上'
  - '**桶排序与 partial_sort 基础**'
  - '- `llama_token_data_array_partial_sort` 用 128 桶（-10~+10）粗排 + partial_sort 细排'
  - '- `llama_token_data_array_partial_sort_inplace` 是 npartial≤128 时的快路径'
  - '- `llama_sampler_softmax_impl` 数值稳定 softmax：减 max_l 再 exp，可选就地排序'
  - '**采样器的生命周期：name/clone/free/init_greedy/dist/top_k/top_p/min_p**'
  - '- 每个采样器的 `name` 函数返回字符串标识，便于调试和链式报告'
  - '- `clone` 用「重新 init + 拷贝动态状态」的方式深拷贝'
  - '- `free` 仅 delete ctx（基类 iface 由静态定义，无需释放）'
  - '- 各 init 函数在配置不合法时返回空采样器（`?top-k` 等）'
