  - '**多层级联反量化**：IQ2_XXS 采用 `d * (0.5 + scales) * 0.25 * grid * signs` 的多级公式，分离幅度、网格形状和符号'
  - '**IQ3_XXS 的三值网格**：扩展为 3-bit 索引，结合 `qh`（高位掩码）和 `qs`（低位）组成 9-bit 或 11-bit 索引，访问更大网格'
  - '**Delta 偏移技巧**：IQ1_S/IQ1_M 引入 `delta` 偏移量（±0.125），通过判断 `qh` 最高位选择加/减 delta，细化零点附近精度'
  - '**IQ4 非线性**：IQ4_NL 使用固定 `kvalues` 查找表，IQ4_XS 则结合高低位 `scales` 拆分实现更精细的缩放控制'
  - '**非线性量化优势**：相比传统均匀量化，IQ 系列在 2-3 bit 范围能更好保留原始分布的偏态特征，减少精度损失'
