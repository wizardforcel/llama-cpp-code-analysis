  points:
  - '**自动类型路由**：模块级 `quantize` / `dequantize` 函数根据 `GGMLQuantizationType` 枚举自动分发到
    F32/F16 直接转换或 `_type_traits` 中的具体实现类'
  - '**形状转换工具**：`quant_shape_to_byte_shape` 和 `quant_shape_from_byte_shape` 处理逻辑形状与字节形状的双向转换，校验块大小对齐'
  - '**舍入一致性**：`np_roundf` 复现 C 语言 `roundf` 的''远离零''舍入行为，确保 Python 量化结果与 C 实现位级一致（对
    Q8_0 等敏感格式至关重要）'
  - '**静态数据仓库**：`__main__` 中定义的 `grid_hex`、`grid_map`、`ksigns`、`delta` 等类属性存储了 IQ
    系列所需的全部查找表原始数据'
  - '**错误处理策略**：对未实现的量化类型抛出 `NotImplementedError`，对无法整除块大小的形状抛出 `ValueError`，防止静默错误'
  - '**测试与验证钩子**：通过 `_type_traits` 字典暴露所有内部实现类，便于单元测试直接调用各类的 `quantize_blocks` / `dequantize_blocks`
    方法'
