  name: 经典量化家族 —— 整数压缩的'经典四重奏'
  'no': 2
  points:
  - '**BF16 的位运算精要**：`quantize_blocks` 中通过 `np.uint64` 中间类型实现 ''round to nearest even''
    舍入，确保与 C 语言实现位级一致'
  - '**Q4_0 对称量化**：基于块内绝对最大值计算缩放因子 `d=max/-8`，使用 `imax` 定位极值，实现 4-bit 对称量化（带隐藏位偏移
    8）'
  - '**Q4_1 非对称量化**：引入最小值偏移 `m`，通过 `d=(max-min)/15` 覆盖全范围，适合分布不均的张量'
  - '**Q5_x 的位扩展艺术**：Q5_0/Q5_1 将 32 个 5-bit 值拆分为低 4 位字节 + 高 1 位掩码（`qh`），利用 `np.packbits`
    压缩第 5 位'
  - '**Q8_0 精确保留**：使用 8-bit 整数存储权重，通过 `np_roundf`（远离零舍入）匹配 C 参考实现的舍入行为，误差最小但体积较大'
  - '**字节布局规范**：所有经典格式均遵循 `[d(float16), (m), qs]` 的内存布局，其中 `qs` 为 packed 4/5/8-bit
    整数'
