  name: 前沿量化格式 —— 面向新硬件的'特种部队'
  'no': 5
  points:
  - '**三元量化（Ternary）**：TQ1_0/TQ2_0 将权重量化为 {-1, 0, 1}，TQ1_0 使用 5 个三元组打包为 1 字节，TQ2_0
    使用 4 个三元组打包，适合极低位宽推理'
  - '**MXFP4 的 E8M0 指数**：采用 Open Compute Project 的 Microscaling 格式，8-bit 指数（e8m0）提供大动态范围，e2m1
    尾数节省空间，通过 `e8m0_to_fp32_half` 转换'
  - '**NVFP4 的 UE4M3 编码**：NVIDIA FP4 使用无符号 E4M3 格式（bias=7），通过 `ue4m3_to_fp32` 和 `fp32_to_ue4m3`
    实现硬件级兼容转换'
  - '**E2M1 与 K-Values**：MXFP4 和 NVFP4 均使用预定义浮点数组 `kvalues`（如 [0, 0.5, 1, 1.5, 2,
    3, 4, 6]）作为量化网格，非线性分布优化精度'
  - '**超块（Super-block）结构**：NVFP4 每 64 个值为一组，共享 4 个 ue4m3 缩放因子，比传统单缩放因子更灵活'
  - '**硬件协同设计**：这些新格式直接对应 NVIDIA Blackwell 等新一代 GPU 的 FP4 张量核心，实现计算与存储的双重加速'
