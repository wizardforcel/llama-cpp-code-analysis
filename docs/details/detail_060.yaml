  name: __Quant 基类 —— 量化框架的'万能模具'
  'no': 1
  points:
  - '**注册机制的魔法**：`__init_subclass__` 如何像自动登记处一样，在子类定义时自动收集量化类型到 `_type_traits` 全局字典'
  - '**惰性计算包装**：通过 `LazyNumpyTensor._wrap_fn` 将普通数组操作转换为支持延迟计算的代理，实现 ''按需计算'' 的内存优化'
  - '**形状变换双生子**：`__shape_to_bytes` / `__shape_from_bytes` 负责逻辑张量形状与量化字节形状之间的转换，解决块大小对齐问题'
  - '**批量处理策略**：`_apply_over_grouped_rows` 将大数组分组为 16 行批次处理，在内存占用与并行效率间取得平衡'
  - '**统一接口设计**：`quantize` / `dequantize` 类方法作为总入口，根据输入类型自动路由到惰性或即时计算路径'
  - '**网格初始化**：`init_grid` 类方法在首次使用时将十六进制字符串解码为浮点查找表，支持 IQ 系列的查表法反量化'
  - '**生命周期控制**：`__init__` 阻止实例化，`__quantize_array`/`__dequantize_array` 管理底层数组处理流程'
