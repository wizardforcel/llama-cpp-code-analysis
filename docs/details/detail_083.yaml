  name: 取消与清理机制 —— 异常路径的「安全气囊」
  'no': 5
  points:
  - '**任务取消的级联处理**'
  - '- stop() 方法不仅删除本地等待状态，还向队列前端（front=true）插入取消任务，确保高优先级执行'
  - '- 取消任务是特殊类型（SERVER_TASK_TYPE_CANCEL），在 server_queue::post 中会触发关联任务的清理'
  - '- 支持部分取消：通过 id_tasks 集合精确指定要终止的子任务，不影响其他并行任务'
  - '**RAII 与资源安全**'
  - '- 析构函数自动调用 stop()，确保即使上层忘记显式调用，任务也会被正确取消，防止服务端资源泄漏'
  - '- 使用智能指针（server_task_result_ptr）管理结果对象，自动处理内存生命周期'
  - '**边界情况处理**'
  - '- has_next() 检查 cancelled 标志，避免在已取消状态下继续等待'
  - '- post_tasks() 中会展开所有子任务（child_tasks），为每个子任务建立独立状态跟踪，确保嵌套任务（如并行采样）的正确取消'
