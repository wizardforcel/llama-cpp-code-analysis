  name: 任务队列基础设施 —— 服务端推理的「交通枢纽调度台」
  'no': 1
  points:
  - '**server_queue 的核心设计哲学**'
  - '- 作为 llama-server 的并发核心，server_queue 承担着「交通指挥中心」的角色，负责接收 HTTP 请求转化的推理任务，并按优先级调度给后端处理线程'
  - '- 采用双端队列（deque）设计，支持 front 插入实现紧急任务插队（如取消请求）'
  - '- 引入延迟队列（deferred queue）机制，处理暂时无法执行的任务（如等待 KV 缓存槽位释放）'
  - '**线程安全与同步原语**'
  - '- 使用 std::mutex 保护任务队列，std::condition_variable 实现生产者-消费者模式'
  - '- 通过 QUE_DBG/RES_DBG 宏实现调试日志，便于追踪任务流转状态'
  - '**任务生命周期管理**'
  - '- 每个任务通过唯一的 task.id 标识，支持批量提交（post 重载）和单个提交'
  - '- 取消任务（SERVER_TASK_TYPE_CANCEL）会触发 cleanup_pending_task 清理关联任务'
  - '- defer/pop_deferred_task 实现任务的挂起与恢复，优化槽位利用率'
  - '**辅助查询接口**'
  - '- is_sleeping() 与 queue_tasks_deferred_size() 为外部模块（如 server_metrics）提供运行时状态查询能力'
  - '- on_sleeping_state 支持多回调链式注册，允许日志模块与指标收集器同时监听睡眠状态切换'
