exercises:
- contents:
  - 阅读 `tools/server/server-queue.cpp` 中 `server_queue::post()`（25-69行）和 `server_queue::start_loop()`（137-212行）。
  - 1. 分析 `mutex_tasks` 和 `condition_tasks` 如何配合实现生产者-消费者模式
  - 2. 解释为什么 `start_loop` 中使用两次 `lock.unlock()` 和 `lock.lock()` 来缩小临界区
  - 3. 思考：如果 `callback_update_slots()` 执行时间较长，如何避免新任务饥饿？
  'no': 1
  title: 分析任务队列的线程安全机制
- contents:
  - 基于 `server_queue::defer()`（71-77行）和 `pop_deferred_task()`（85-110行）的实现。
  - 1. 编写单元测试：提交三个任务（id=1,2,3），其中任务2指定 id_slot=5，其余默认
  - 2. 先 defer 所有任务，然后调用 `pop_deferred_task(5)`，验证是否只有任务2被激活
  - 3. 再调用一次 `pop_deferred_task(999)`，观察是否按 FIFO 顺序弹出剩余任务
  - 4. 思考：这种设计如何优化 KV Cache 的局部性？
  'no': 2
  title: 实现延迟队列的槽位亲和性测试
- contents:
  - 以 `server_response::send()`（327-340行）和 `remove_waiting_task_id()`（247-260行）为对象。
  - 1. 绘制 `waiting_task_ids` 与 `queue_results` 的数据流图，说明结果如何被筛选
  - 2. 分析 `remove_waiting_task_id` 中 `std::remove_if` 的遍历效率与一致性保证
  - 3. 当服务器收到客户端断开连接时，如何通过此方法防止已删除任务的结果泄漏到无关请求？
  'no': 3
  title: 理解 server_response 的结果匹配与清理
- contents:
  - 对比 `server_response_reader::next()`（381-408行）与 `wait_for_all()`（410-426行）的实现差异。
  - 1. 解释 `next()` 中 `result->update(states[idx])` 如何实现增量状态聚合（如聊天上下文）
  - 2. `wait_for_all()` 中 `batch_res.results[idx] = std::move(res)` 为何使用移动语义？
  - 3. 思考：在流式场景下，如果客户端提前断开，`stop()` 如何保证服务端推理立即停止并释放 KV Cache？
  'no': 4
  title: 对比流式与批量响应的内存管理
- contents:
  - 研究 `server_response_reader::stop()`（428-445行）与 `server_queue::cleanup_pending_task()`（214-225行）的协作。
  - 1. 说明为什么取消任务要设置 `front=true` 插入队列头部
  - 2. 追踪 `SERVER_TASK_TYPE_CANCEL` 从 `post()` 到 `cleanup_pending_task()` 的完整路径
  - 3. 设计实验：同时提交 A、B、C 三个任务，在 B 执行途中调用 `reader.stop()`，验证 C 是否被阻止执行，以及是否避免了已分配资源的泄漏
  'no': 5
  title: 设计取消任务的级联传播实验
learning_targets:
- 理解 server_queue 在并发推理中的核心职责与双端队列设计
- 掌握延迟队列（deferred queue）与槽位优先唤醒机制
- 理解主循环三阶段模型（处理新任务/更新槽位/等待睡眠）与空闲节能设计
- 掌握 server_response 的等待集合机制与生产者-消费者同步原语
- 理解 server_response_reader 的生成器模式与 RAII 资源管理
- 掌握任务取消的级联清理机制与异常路径安全保障
- 能独立实现基于条件变量的多线程任务调度器
life_analogy:
- 想象 llama-server 的并发系统是一座**现代化智能机场**：
- '- **server_queue** = 机场塔台调度系统，管理所有待起飞（待推理）的航班（任务）'
- '  - **双端队列** = 紧急航班（front）可插队优先起飞，普通航班按序排队（back）'
- '  - **延迟队列** = 停机坪等待区，因跑道（槽位）被占用而暂时等待的航班'
- '  - **pop_deferred_task** = 当指定跑道（id_slot）空闲时，优先安排使用该跑道的航班'
- '  - **start_loop** = 塔台值班循环：处理进港（新任务）→ 协调跑道使用（更新槽位）→ 空闲时进入节能模式（睡眠）'
- '- **server_response** = 行李分拣中心，确保每位乘客（任务）拿到自己的行李（结果）'
- '  - **waiting_task_ids** = 已登记等待行李的乘客名单'
- '  - **queue_results** = 行李传送带，按航班号匹配'
- '  - **remove_waiting_task_id** = 乘客离开时同时清理其遗留行李，防止传送带堵塞'
- '- **server_response_reader** = 自助行李提取终端，乘客（客户端）通过它取行李'
- '  - **生成器模式** = 乘客一件件提取行李（流式响应），直到提完为止'
- '  - **stop()** = 乘客紧急取消行程，系统立即清理其所有行李并通知地勤'
- '- **RAII 析构** = 乘客离开机场时自动注销登机牌，防止系统资源泄漏'
- 就像塔台需要精确协调跑道使用、处理紧急插队和夜间节能模式，server_queue 也需要管理任务优先级、槽位竞争和服务器空闲功耗。
'no': 82
summary:
- concept: '`server_queue`'
  desc: 并发任务调度的核心，采用双端队列+延迟队列设计，支持优先级插队与空闲睡眠节能
- concept: '`callback_new_task/update_slots`'
  desc: 主循环回调 hook，分离任务接收与槽位计算，实现关注点分离
- concept: '`defer/pop_deferred_task`'
  desc: 槽位竞争优化机制，暂存无法立即执行的任务，按槽位优先唤醒，提高 KV Cache 利用率
- concept: '`server_response::waiting_task_ids`'
  desc: 基于集合的任务注册机制，确保只处理有效活跃任务，防止脏数据
- concept: '`add_waiting_task_ids/remove_waiting_task_ids`'
  desc: 批量注册与批量移除等待任务，支撑多任务聚合场景的高效管理
- concept: '`recv/recv_with_timeout`'
  desc: 阻塞与超时接收策略，支持单任务与多任务聚合等待，适配流式与非流式场景
- concept: '`server_response_reader`'
  desc: 生成器模式封装，提供 next() 流式接口与 wait_for_all() 批量接口，自动管理任务生命周期
- concept: '`stop()` 级联取消'
  desc: 通过向队列前端插入 SERVER_TASK_TYPE_CANCEL 实现高优先级取消，触发 cleanup_pending_task 级联清理
- concept: RAII 析构与 RAII 状态
  desc: 析构自动调用 stop()，确保异常安全；task_result_state 跟踪生成上下文与增量结果
- concept: '`sleeping/req_stop_sleeping`'
  desc: 空闲睡眠机制，通过条件变量与回调通知实现零 CPU 占用的待机唤醒
- concept: '`std::terminate` 策略'
  desc: HTTP 线程无法优雅返回时的强制终止保护，防止服务端不一致状态
