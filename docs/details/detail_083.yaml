  name: 响应读取器 —— 面向客户端的「生成器模式」封装
  'no': 4
  points:
  - '**server_response_reader 的设计目标**'
  - '- 为上层（HTTP 处理层）提供简洁的迭代器风格 API，屏蔽底层队列交互细节'
  - '- 自动管理任务注册、状态跟踪、结果聚合与取消清理，遵循 RAII 原则'
  - '- 支持单任务模式（post_task）与批量任务模式（post_tasks），后者用于嵌套推理（如并行采样多个候选）'
  - '**流式与批量处理的双重支持**'
  - '- next() 方法实现生成器模式：每次调用返回一个 token/结果，适用于 SSE 流式响应'
  - '- wait_for_all() 收集所有结果到 batch_response，适用于非流式的 JSON 响应'
  - '- has_next() 结合 received_count 与 cancelled 标志，精确判断流是否结束'
  - '**状态跟踪与错误处理**'
  - '- 为每个任务创建 task_result_state（通过 create_state()），跟踪生成过程中的增量状态（如聊天上下文、工具调用）'
  - '- 收到错误结果（is_error()）时自动触发 stop()，取消剩余任务，防止无效计算'
  - '- next() 内部通过 result->update(states[idx]) 更新累积状态，实现增量式结果聚合'
