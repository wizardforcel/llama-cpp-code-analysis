  name: 主循环调度机制 —— 永不停歇的「任务处理引擎」
  'no': 2
  points:
  - '**start_loop 的三阶段工作模型**'
  - '- 阶段一：处理新任务（processing new tasks）—— 从队列取出任务，通过 callback_new_task 分发给推理引擎'
  - '- 阶段二：更新槽位（update slots）—— 触发 callback_update_slots 执行实际的 LLM 推理计算，这是整个循环中最耗时的部分'
  - '- 阶段三：等待新任务（waiting for new tasks）—— 空载时进入条件变量等待，支持空闲休眠（idle sleep）节能机制'
  - '**睡眠与唤醒的智能管理**'
  - '- 当 idle_sleep_ms 超时且无新任务时，进入 sleeping 状态，通过 callback_sleeping_state 通知外部模块'
  - '- wait_until_no_sleep() 允许外部线程请求唤醒，确保延迟敏感任务能及时执行'
  - '- 采用 max_wait_time（1秒）的轮询间隔，平衡响应速度与 CPU 占用'
  - '**优雅终止机制**'
  - '- terminate() 设置 running=false 并广播条件变量，确保所有等待线程能安全退出'
  - '- 在睡眠状态中被唤醒后，会二次检查 running 状态，避免虚假唤醒'
