exercises:
- contents:
  - 阅读 `tests/test-grammar-parser.cpp` 第 21-133 行 `verify_parsing()`，回答：
  - '- `print_all` lambda 生成的输出格式是什么？为什么它能直接作为新的测试代码替换旧期望值？'
  - '- 当 `symbol_ids.size() != expected.size()` 时，为什么先调用 `print_all()` 再 `assert`？这种「先输出修正建议再断言」的顺序有什么工程优势？'
  - '- 动手：设置 `TEST_GRAMMAR_PARSER_PRINT_ALL=1` 环境变量运行该测试，观察输出与源码中硬编码的期望值有何对应关系。'
  - '- 挑一个含 `LLAMA_GRETYPE_CHAR_RNG_UPPER` 的测试用例，说明字符范围（如 [a-z]）在 rules 中是如何用「下限字符
    + 上限类型」两个元素表示的。'
  'no': 1
  title: 解剖 GBNF 解析器测试的失败自愈机制
- contents:
  - 阅读 `tests/test-grammar-integration.cpp` 第 46-108 行，回答：
  - '- `token()` 为什么用 `0xff` 作为标记头？如果输入文本本身包含 0xff 字节会发生什么？'
  - '- `parse_tokens()` 中捕获 `std::invalid_argument` 后为什么用 0xFFFD（替换字符）而不是直接报错？这与实际分词器行为有何联系？'
  - '- `match_string()` 中 `stacks_cur.empty()` 与「stack 为空」分别代表什么含义？为什么最终还要遍历所有 stack
    检查是否存在空栈？'
  - '- `test()` 为什么要在每次测试前保存 `stacks_org` 快照？如果省略这步会发生什么？'
  - '- 动手：构造一个含特殊 token 的 GBNF 语法（如 `start: "a" [0] "b"`），写一个通过串和一个失败串，预测并用代码验证结果。'
  'no': 2
  title: 追踪 token 编码与语法栈推进的完整链路
- contents:
  - 对比 `tests/test-grammar-integration.cpp` 的 `match_string()` 与 `tests/test-grammar-llguidance.cpp`
    的 `match_string()`，回答：
  - '- 前者直接操作语法栈（llama_grammar_accept_token），后者通过采样器 logit 判定（logit >= 0），这两种验证路径在「拒绝不合法输入」的时机上有何本质差异？'
  - '- llguidance 测试为什么需要一个真实的 vocab（vocab_only 模型），而集成测试不需要？'
  - '- `one_hot()` 中把选中 token 的 logit 设为 100.0f，这个数值的选择有什么讲究？设为 1.0f 或 1000.0f 会影响测试结果吗？'
  - '- `test_sampler_chain()` 中把 llg 采样器和 `llama_sampler_init_dist(42)` 串联，如果语法拒绝了某个
    token，dist 采样器还能选中它吗？用代码验证你的结论。'
  'no': 3
  title: 对比两种语法验证范式：Grammar 直连 vs 采样约束
- contents:
  - 阅读 `tests/test-regex-partial.cpp` 第 174-208 行 `test_regex_to_reversed_partial_regex()`，回答：
  - '- 为什么 `abc` 会转换成 `^((?:(?:c)?b)?a)`？请画出其「从右向左逐字符可选」的推导过程。'
  - '- `a(bc|de)` 转换为 `^((?:(?:(?:c)?b|(?:e)?d))?a)` 时，分支 `|` 两侧的逆序是如何保持独立性的？'
  - '- `ab{2,4}c` 的转换结果 `^((?:(?:(?:(?:c)?b?)?b?)?b)?a)` 中，为什么出现嵌套的 `b?` 而不是 `{2,4}`？量词在逆向转换中是如何处理的？'
  - '- 动手：手工推导 `[a-z]\w+` 的逆部分正则，再与源码中 `^((?:\w+)?[a-z])` 对照，解释二者的等价性。'
  'no': 4
  title: 逆向工程：逆部分正则转换规律
- contents:
  - 阅读 `tests/test-json-partial.cpp` 第 18-194 行 `test_json_healing()`，回答：
  - '- `parse_all` 对输入字符串做全前缀截断（i 从 1 到 size-1），为什么这种「暴力截断」是测试修复能力的黄金标准？'
  - '- 测试用例 `{"code` 被修复为 `{"code$foo":1}`，而 `{"code\` 被修复为 `{"code\$foo":1}`，这两种修复策略的差异揭示了
    healing_marker 插入位置的什么规则？'
  - '- 为什么部分字面量（如 `[tru`、`[23.2`）无法保留原值，只能修复为 `["$foo"]`？这与 JSON 词法分析的什么特性有关？'
  - '- Unicode 代理对测试（`\ud800` 半截输入自动补 `\udc00`）为什么必须成对出现？如果输入是 `\ud800x`（非代理对后缀），修复器应如何处理？请设计一个测试用例验证你的猜想。'
  - '- `healing_marker` 选择 `"$llama.cpp.json$"` 这种特殊字符串有什么好处？它与测试里的 `$foo` 标记在验证逻辑上如何配合（`string_starts_with`
    检查）？'
  'no': 5
  title: JSON 修复的边界侦探
learning_targets:
- 掌握 GBNF 语法解析器（llama_grammar_parser）的单元测试设计方法，理解符号表与规则表的验证逻辑
- 理解 GBNF 校验器如何将文本转为 Unicode 码点并通过 llama_grammar_accept 逐字符验证语法合法性
- 掌握 JSON Schema → GBNF Grammar 转换的测试框架（TestCase、verify、test_all）与典型场景（数值范围、字符串长度、对象属性、正则模式）
- 理解语法集成测试如何通过 token 编码（0xff 前缀 + 大端序）与 match_string 验证合法/非法字符串
- 掌握 llguidance 采样约束测试：llama_sampler_init_llg、one_hot 分布、采样器链（llama_sampler_chain）的协作机制
- 理解 common_regex 的三种匹配状态（FULL/PARTIAL/NONE）与 regex_to_reversed_partial_regex 逆部分正则转换
- 掌握 common_json_parse 的 JSON 修复能力与 healing_marker（$llama.cpp.json$）机制，覆盖截断字符串、Unicode
  转义、代理对等场景
life_analogy:
- 想象 llama.cpp 的结构化生成质检体系是一家**海关+翻译局联合办公大厅**：
- '- **GBNF 语法解析器测试（test-grammar-parser）** = **语法书的排版校对员**：逐条核对每一页语法条文（symbol_ids/rules）是否与标准模板一字不差，一旦出错还能自动生成修正稿（TEST_GRAMMAR_PARSER_PRINT_ALL）'
- '- **GBNF 校验器（test-gbnf-validator）** = **边检柜台**：旅客（输入文本）逐字递交通行证，检查官按语法规则一节节盖章（llama_grammar_accept），任何不合规的字符都会被红笔（ANSI
  红色高亮）圈出来'
- '- **JSON Schema → Grammar 转换测试** = **翻译局**：把一份结构化合同（JSON Schema）精准翻译成另一种语言（GBNF
  Grammar），TestCase 是双语对照的「标准答案册」，还要验证译稿本身语法正确（verify_expectation_parseable）'
- '- **语法集成测试（test-grammar-integration）** = **实战演习场**：把翻译好的语法直接用于通关演练，合法文本（passing_strings）放行、非法文本（failing_strings）拦截，特意构造的特殊
  token（0xff 前缀）就像加密通行证'
- '- **llguidance 采样约束测试** = **考官给考生划答题范围**：每个 token 都是一道选择题，one_hot 相当于「标准答案卡」，语法采样器负责把超纲选项直接判零分（logit
  < 0）'
- '- **正则部分匹配测试** = **拼图游戏**：即使图案没拼完（PARTIAL），也能确认它是某个完整图案的一部分；逆部分正则就是把拼图反过来从最后一块往回看'
- '- **JSON 修复测试** = **文物修复师**：面对残缺的 JSON 碎片，用「$llama.cpp.json$」作为隐形修补钉，把断裂处接合得天衣无缝，连
  Unicode 代理对这种「双面壁画」都能补全'
'no': 104
summary:
- concept: '`verify_parsing()`'
  desc: GBNF 解析器测试核心：逐条对比 symbol_ids 与 rules，失败可自动生成修正代码
- concept: '`verify_failure()`'
  desc: 验证畸形文法解析失败，断言 rules.empty() 防止虚假成功
- concept: '`llama_gretype`'
  desc: 语法元素类型枚举：CHAR / CHAR_NOT / CHAR_RNG_UPPER / RULE_REF / ALT / END
- concept: '`llama_grammar_validate()`'
  desc: GBNF 校验器核心：UTF-8 → 码点序列 → 逐字符 accept，捕获意外字符/意外结束
- concept: '`print_error_message()`'
  desc: ANSI \033[1;31m 红色高亮定位错误字符的调试利器
- concept: '`TestCase` 结构'
  desc: JSON Schema 测试契约：name + expected_status + schema + expected_grammar
- concept: '`TestCase::verify()` / `verify_expectation_parseable()` / `verify_status()`'
  desc: 三重验证：文本一致性、Grammar 可解析性、状态符合预期
- concept: '`test_all()`'
  desc: 全量 Schema 转换测试：整数范围、字符串长度、枚举、正则、$ref、allOf/anyOf 全覆盖
- concept: '`__main__` (test-json-schema-to-grammar)'
  desc: 多语言交叉验证指挥：协调 C++/Python/JavaScript 三端 Schema→Grammar 一致性测试
- concept: '`token()`'
  desc: 5 字节 token 编码：0xff 标记头 + 32 位 ID 大端序，用于在文本中嵌入特殊 token
- concept: '`parse_tokens()`'
  desc: 解析 token/UTF-8 混合流，无效 UTF-8 回退为 0xFFFD 替换字符
- concept: '`match_string()`（integration）'
  desc: 通过 llama_grammar_accept_token 逐 token 推进语法栈，空栈即匹配完成
- concept: '`stacks_org` 快照'
  desc: test() 保存初始语法栈，每个测试字符串后重置，实现用例隔离
- concept: '`test_build_grammar_fails()` / `test_failure_*()`'
  desc: 负向测试体系：左递归、缺失 root、缺失引用等畸形文法必须解析失败
- concept: '`llama_sampler_init_llg()`'
  desc: 初始化 llguidance 采样器，支持 Lark 语法或 %llguidance + %json 前缀的 JSON Schema
- concept: '`match_string()`（llguidance）'
  desc: 采样视角验证：llama_sampler_apply 后检查目标 token logit 是否 ≥ 0
- concept: '`one_hot()`'
  desc: 构造 one-hot logit 分布（selected=100），强制采样器暴露语法屏蔽行为
- concept: '`test_sampler_chain()`'
  desc: llg 语法采样器 + dist(42) 随机采样器的链式协同，验证混合调度正确性
- concept: '`common_schema_info`'
  desc: JSON Schema $ref 解析与类型归约工具，resolves_to_string 判断最终类型
- concept: '`common_regex` 三态匹配'
  desc: FULL（完整匹配）/ PARTIAL（前缀部分匹配）/ NONE（不匹配），附精确位置边界
- concept: '`regex_to_reversed_partial_regex()`'
  desc: 逆部分正则转换：abc → ^((?:(?:c)?b)?a)，支持嵌套、量词、分支结构
- concept: '`common_json_parse` + `healing_marker`'
  desc: 残缺 JSON 修复：在截断处插入 $llama.cpp.json$ 标记，支持数组/对象/字符串/Unicode 截断
- concept: Unicode 代理对修复
  desc: \ud800 半截代理对自动补全 \udc00，确保 UTF-16 转义序列闭合
- concept: '`assert_equals()` 模板'
  desc: 泛型断言工具：不等时打印 Expected/Actual 并抛 runtime_error
