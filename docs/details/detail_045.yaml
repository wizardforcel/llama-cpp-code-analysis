exercises:
- contents:
  - 在 llama.cpp 根目录创建一个 `my-presets.ini` 文件，内容如下：
  - '```ini'
  - '[*]'
  - ctx-size = 4096
  - temp = 0.7
  - ''
  - '[fast]'
  - batch-size = 512
  - ubatch-size = 256
  - ''
  - '[llama3-chat]'
  - model-url = https://example.com/llama3.gguf
  - jinja = true
  - '```'
  - 然后阅读 `common/preset.cpp` 第180-253行的 `parse_ini_from_file()` 与第266-315行的 `common_preset_context::load_from_ini()`：
  - 1. 画出该 PEG 语法规则中 `header_line`、`kv_line`、`value` 匹配的优先级关系图
  - 2. 说明 `[*]` 与 `[fast]` 在解析后分别进入了什么变量
  - 3. 解释 `version` 键为什么被显式跳过
  - 4. 如果把 `jinja = true` 改成 `no-jinja = true`，最终存入 `options` 的值会发生什么变化？为什么？
  'no': 1
  title: 手工构造 INI 预设并追踪解析
- contents:
  - 构造一个模拟远程预设的场景：
  - '```cpp'
  - common_preset_context ctx(LLAMA_EXAMPLE_SERVER, /*only_remote_allowed=*/ true);
  - common_preset global;
  - // 假设从远程 URL 下载得到如下 INI 文本
  - '```'
  - INI 内容：
  - '```ini'
  - '[恶意配置]'
  - hf-repo = ggml-org/gemma-3-4b-it-GGUF
  - model = /etc/passwd
  - threads = 99
  - batch-size = 128
  - '```'
  - 阅读第20-41行 `get_remote_preset_whitelist()` 与第266-315行 `common_preset_context::load_from_ini()`：
  - 1. 列出预期会抛出异常的所有键名，并说明理由
  - 2. 说明 `is_sparam` 类型的选项是否会被白名单放行，举例说明哪些采样参数属于此类
  - 3. 解释为什么 `model` 被拒绝但 `model-url` 被允许，这种设计背后的安全考量是什么
  - 4. 如果构造一个 `LLAMA_ARG_HF_REPO` 环境变量形式的键，是否也会在白名单中？为什么？
  'no': 2
  title: 验证远程预设白名单过滤
- contents:
  - 基于 `common_preset_context::cascade()` 的两个重载（第408-421行与第423-434行），设计一组测试用例：
  - '```cpp'
  - // 场景 A：全局预设 + 覆盖预设
  - common_presets base = {
  - '    {"default", preset_with({{"ctx-size", "2048"}, {"temp", "0.8"}})}'
  - '};'
  - common_presets added = {
  - '    {"default", preset_with({{"temp", "0.2"}})},'
  - '    {"creative", preset_with({{"temp", "1.0"}})}'
  - '};'
  - '```'
  - 回答问题：
  - 1. 调用 `cascade(base, added)` 后，`default` 预设中的 `ctx-size` 和 `temp` 分别是多少？`creative`
    预设是否存在？
  - 2. 调用 `cascade(base["default"], added)` 后，`creative` 预设会继承哪些选项？
  - 3. 这两种级联模式分别适用于什么实际场景（例如：llama-server 的默认参数 vs 用户自定义预设）
  - 4. 编写一段伪代码，演示如何将 INI 预设、缓存预设和命令行预设三者级联，并说明最终生效顺序
  'no': 3
  title: 设计并实现预设级联的单元测试
- contents:
  - 当前 `common_preset::to_args()` 在遇到同时具有 `value_hint` 与 `value_hint_2` 的选项时会直接抛出异常（见第67-71行）。
  - 假设 llama.cpp 未来新增了一个 `--lora-scaled <path> <scale>` 双值选项（虽然当前实际不存在，但可模拟）。
  - 请思考如何修改 `to_args()` 以支持双值选项：
  - 1. `options` 的值类型 `std::string` 是否足以存储两个值？如果不够，应如何调整数据结构（提示：考虑 `std::pair` 或自定义
    struct）
  - 2. 修改后的 `to_args()` 中，序列化双值选项时应插入几个 `args` 元素？顺序如何保证
  - 3. `common_preset::to_ini()` 与 `common_preset::apply_to_params()` 需要做哪些同步修改才能与新的
    `to_args()` 兼容
  - 4. 撰写一个 `common_preset::set_option()` / `common_preset::get_option()` 同时兼容单值与双值选项的接口草案，并说明如何保持向后兼容
  'no': 4
  title: 改造 to_args() 支持双值选项
- contents:
  - 基于 `common_preset` 的选项管理接口（`set_option`、`unset_option`、`get_option`、`merge`），完成以下任务：
  - 1. 创建一个空预设，使用 `common_preset::set_option()` 分别通过 CLI 键名（如 `--ctx-size`）和环境变量名（如
    `LLAMA_ARG_CTX_SIZE`）设置同一选项，观察是否会产生重复
  - 2. 使用 `common_preset::get_option()` 查询刚设置的值，验证环境变量名查找是否生效
  - 3. 使用 `common_preset::unset_option()` 移除该选项，再次查询确认返回 false
  - 4. 创建两个预设 A 和 B，A 包含 `temp=0.7`，B 包含 `temp=0.9` 和 `top-k=40`，调用 `A.merge(B)` 后分析结果
  - 5. 结合 `get_map_key_opt()`（第236-247行）说明为什么环境变量名和 CLI 键名都能被识别
  'no': 5
  title: 选项生命周期管理实战
learning_targets:
- 理解 common_preset 与 common_preset_context 的核心数据结构与设计理念
- 掌握预设（preset）的多源加载机制：INI 文件、缓存模型、本地目录与命令行
- 理解远程预设白名单的安全防护机制及其过滤逻辑
- 掌握预设配置在命令行参数、INI 文本与运行时参数之间的双向转换原理
- 理解级联（cascade）机制如何实现配置的分层继承与覆盖
life_analogy:
- 想象 common 预设系统是一家**连锁餐厅的标准化运营体系**：
- '- **common_preset** = 一份**单店运营手册**（SOP），记录了这家店所有可用的配置项及取值'
- '- **common_preset_context** = **总部运营中心**，负责从各种渠道收集各分店的配置，并统一协调合并'
- '- **key_to_opt 映射表** = **菜品编号对照表**，无论顾客说的是菜品名还是编号，都能准确对应到后厨的实际操作'
- '- **INI 文件** = 总部下发的**标准配置单**，每家分店按照 `[分店名] 参数 = 值` 的格式填写'
- '- **缓存模型预设** = **常用套餐预订单**，系统自动为经常点单的顾客生成快捷入口'
- '- **本地目录扫描** = **巡店督导**，主动走访各家门店，检查库存（GGUF文件）并登记可用的设备（mmproj）'
- '- **级联（cascade）** = **区域配置继承**，全国默认菜单（基础预设）可以被省级特色（新增预设）局部覆盖'
- '- **远程白名单** = **食品安全红线**，门店只能使用总部审核通过的食材（选项），防止有害配置入侵'
- 就像餐厅经理不需要记住每道菜的所有细节，只需要翻开对应的手册一样，用户也可以通过预设名称快速应用一整套经过验证的参数配置，而无需手动输入冗长的命令行。
'no': 44
summary:
- concept: '`common_preset`'
  desc: 单个预设实体，封装选项映射并提供序列化、查询、合并与参数应用能力
- concept: '`common_preset_context`'
  desc: 预设调度中枢，维护参数映射表与白名单，统一负责多源加载与级联
- concept: '`key_to_opt`'
  desc: 键名到 common_arg 定义的映射表，支持命令行/环境变量/INI键的统一查找
- concept: '`common_preset::to_args()`'
  desc: 将预设转换为命令行参数列表，自动处理布尔负向选项与值类型差异
- concept: '`common_preset::to_ini()`'
  desc: 将预设序列化为标准 INI 文本，自动转义换行符并保持节结构
- concept: '`common_preset::set_option()`'
  desc: 按环境变量名定位并设置或新增预设选项
- concept: '`common_preset::unset_option()`'
  desc: 按环境变量名从预设中移除指定选项
- concept: '`common_preset::get_option()`'
  desc: 按环境变量名查询预设中的选项值
- concept: '`common_preset::merge()`'
  desc: 将另一预设的选项合并到当前预设并覆盖同名项
- concept: '`common_preset::apply_to_params()`'
  desc: 按 handler 类型分发，将预设值真正写入 common_params 运行时对象
- concept: '`parse_ini_from_file()`'
  desc: 基于 PEG 解析器的 INI 文件读取器，提取节名称与键值对为嵌套映射
- concept: '`get_map_key_opt()`'
  desc: 构建环境变量与命令行别名到 common_arg 的映射关系
- concept: '`common_preset_context::load_from_ini()`'
  desc: 从 INI 文件加载多个预设，支持全局节（*）与远程白名单校验
- concept: '`common_preset_context::load_from_cache()`'
  desc: 扫描 HuggingFace 缓存目录，为每个已缓存模型自动生成同名预设
- concept: '`common_preset_context::load_from_models_dir()`'
  desc: 扫描本地目录识别 GGUF 模型与 mmproj，自动处理分片与多模态投影器
- concept: '`common_preset_context::load_from_args()`'
  desc: 将命令行参数解析结果封装为默认名称的预设对象
- concept: '`common_preset_context::cascade()`'
  desc: 配置级联合并：同名预设选项覆盖，异名直接并入，支持集合与单基础两种模式
- concept: '`common_preset_context::common_preset_context()`'
  desc: 初始化参数上下文与选项映射，按需构建远程白名单
- concept: '`get_remote_preset_whitelist()`'
  desc: 构建远程安全白名单，仅放行 model-url、hf-repo、jinja 等非敏感选项
- concept: '`rm_leading_dashes()`'
  desc: 规范化键名，去除前导连字符以统一 CLI 与 INI 键格式
- concept: '`is_bool_arg()`'
  desc: 检测 common_arg 是否具备负向布尔形式（args_neg）
- concept: '`parse_bool_arg()`'
  desc: 解析布尔参数值，检测负向形式并自动反转语义
