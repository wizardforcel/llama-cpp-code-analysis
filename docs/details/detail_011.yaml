  - '**项目定位与核心使命**：llama.cpp 是一个用纯 C/C++ 实现的大语言模型推理引擎，主打「零依赖、单文件即可运行」的极简哲学，目标是「最小化设置、最广泛的硬件支持、业界领先的性能」（详见
    `README.md` 顶部 Description 部分）'
  - '**「零依赖」与跨平台设计**：不依赖任何第三方库（除单文件库外），可在 macOS、Linux、Windows 上从源码编译；同时支持 Apple Silicon（Metal/Accelerate）、x86（AVX/AVX2/AVX512/AMX）、RISC-V（RVV/ZVFH/ZFH）、CUDA、HIP、Vulkan、SYCL
    等多种架构'
  - '**量化与推理优化**：支持 1.5-bit、2-bit、3-bit、4-bit、5-bit、6-bit、8-bit 等多种整数量化（Q4_K、Q5_K、Q6_K、IQ
    系列），并支持 CPU+GPU 混合推理，可在显存不足时部分卸载模型'
  - '**作为 ggml 试验场**：llama.cpp 是 ggml 库新功能的「主试验场」，二者在 GitHub 上分属 `ggml-org/llama.cpp`
    与 `ggml-org/ggml` 两个仓库，但深度联动'
  - '**多模态与服务化**：通过 mtmd 模块支持 LLaVA、Qwen2-VL、GLM-EDGE 等多模态模型；通过 `llama-server` 提供
    OpenAI 兼容的 HTTP API，并自带 WebUI 前端'
