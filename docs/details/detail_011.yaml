  - '**四大核心 C 对象**：以不透明指针的形式暴露给 C 端调用方：`struct llama_vocab`（词表）、`struct llama_model`（模型）、`struct
    llama_context`（推理上下文）、`struct llama_sampler`（采样器）'
  - '**数据类型与位置类型**：定义 `llama_token`（int32 token id）、`llama_pos`（int32 序列位置）、`llama_seq_id`（int32
    序列 id）三种核心基础类型；以及 `enum llama_vocab_type`（SPM/BPE/WPM/UGM/RWKV/PLAMO2）、`enum llama_token_type`、`enum
    llama_token_attr` 等枚举'
  - '**模型文件类型枚举**：`enum llama_ftype` 定义了 0~40+ 种量化文件类型（F32/F16/Q4_0/Q4_K/Q5_K/Q6_K/IQ
    系列/MXFP4_MOE/NVFP4 等），外加 `LLAMA_FTYPE_GUESSED=1024`（自动推断）'
  - '**RoPE 与注意力类型**：`enum llama_rope_type`（NONE/NORM/NEOX/MROPE/IMROPE/VISION）支持多种旋转位置编码；`enum
    llama_attention_type`（CAUSAL/NON_CAUSAL）支持编码器-解码器模型'
  - '**内存句柄与回调**：通过 `llama_memory_t`（实际为 `llama_memory_i*`）暴露 KV 缓存；`llama_progress_callback`
    用于模型加载进度回调（返回 false 可中止加载）'
  - '**C++ 智能指针封装**：`include/llama-cpp.h` 用 `std::unique_ptr` 与自定义 deleter 封装了 `llama_model_ptr`、`llama_context_ptr`、`llama_sampler_ptr`、`llama_adapter_lora_ptr`，避免手动
    free'
  - '**采样器接口与扩展点**：`struct llama_sampler_i` 定义了 `name/accept/apply/reset/clone/free`
    等虚函数指针，并通过 `backend_apply/backend_accept` 支持「后端采样」（[EXPERIMENTAL]），让 GPU 直接参与
    token 选择'
  - '**采样器工厂入口**：通过 `llama_sampler_chain_init()` 构造采样器链；各类具体采样策略通过 `llama_sampler_init_*`
    工厂函数创建，再通过 `llama_sampler_chain_add` 组装到链中'
