life_analogy:
- 想象 llama.cpp 是一座「大模型推理工厂」的总控制室，每个文件都是不同的「设施部门」：
- '- README.md = 工厂的「产品说明书与能力清单」，告诉你这座工厂能造什么、运到哪些平台'
- '- include/llama.h = 工厂的「大门与接待处」，只有四个不透明指针（模型、上下文、词表、采样器）对外暴露，内部完全封装'
- '- include/llama-cpp.h = 工厂提供的「自动回收垃圾车」，用 unique_ptr + 自定义 deleter 确保资源不泄漏'
- '- llama_backend_init / supports_* = 工厂的「动力与基础设施检查」，启动前确认电力（后端）、网络（RPC）、门禁（mmap/mlock）是否就绪'
- '- llama_params_fit = 工厂的「智能排产调度器」，当显存放不下时自动缩减上下文、调整 GPU 层数、把 MoE 专家权重退回内存'
- '- llama_model_load 系列 = 工厂的「多入口装卸码头」，分别对应本地路径、文件指针、分片集合和用户自定义张量四种入库方式'
- '- llama_split_path / prefix = 工厂的「集装箱拆装工程师」，按 "%05d-of-%05d.gguf」命名规则把巨型模型拆成标准集装箱'
- '- src/llama.cpp 全局作用域（__main__）= 工厂的「门牌与操作手册」，头文件是原材料清单，constexpr/enum/异常类是车间规约'
- 就像工厂经理需要在开工前检查设备、分配任务、预留产能，llama.cpp 也在每次推理前精细规划内存与计算资源。
