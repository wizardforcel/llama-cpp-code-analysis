summary:
- concept: llama.cpp 项目定位
  desc: 纯 C/C++ 零依赖 LLM 推理引擎，支持 17 种后端与 1.5~8bit 量化，是 ggml 库的主试验场
- concept: 四大核心 C 对象
  desc: llama_model / llama_context / llama_vocab / llama_sampler，全部不透明指针封装
- concept: llama_token/pos/seq_id
  desc: 均为 int32_t，分别代表 token id、序列位置、序列标识
- concept: enum llama_ftype
  desc: 0~40+ 种量化文件类型（F32/F16/Q4_K/Q5_K/Q6_K/IQ 系列/MXFP4_MOE/NVFP4 等），GUESSED=1024
    表示自动推断
- concept: enum llama_rope_type
  desc: NONE/NORM/NEOX/MROPE/IMROPE/VISION，覆盖主流旋转位置编码变体
- concept: llama_batch
  desc: 推理输入载体，包含 token/embd/pos/seq_id/logits 五个数组，n_tokens 决定批次大小
- concept: llama_model_params
  desc: 模型加载参数：devices/n_gpu_layers/split_mode/main_gpu/tensor_split/progress_callback/kv_overrides
    等
- concept: llama_context_params
  desc: 上下文参数：n_ctx/n_batch/n_ubatch/n_seq_max/线程数/RoPE 配置/samplers 采样器链
- concept: llama_sampler_i
  desc: 采样器虚函数表：name/accept/apply/reset/clone/free，外加 [EXPERIMENTAL] backend_init/backend_apply/backend_accept/backend_set_input
- concept: llama_backend_init()
  desc: 调用 ggml_time_init() 并通过 ggml_init 初始化 f16 查找表，是任何 llama.cpp 程序的第一行
- concept: llama_supports_*()
  desc: mmap/mlock/gpu_offload/rpc 四个布尔函数，运行前判断系统能力避免硬编码后端假设
- concept: llama_params_fit
  desc: 自适应降级工具：二分查找 + 线性外推缩小 n_ctx、调整 n_gpu_layers/tensor_split，稠密层优先放显存、MoE 专家层回退内存
- concept: llama_model_load 四阶段流水线
  desc: load_arch → load_hparams → load_vocab → load_tensors，统一处理 file/ptr/splits/init_from_user
    四种加载路径
- concept: 设备选择策略
  desc: GPU 按 device_id 去重，RPC 服务器插入列表最前减少网络传输，仅当无其他设备时才启用 IGPU
- concept: 模型加载函数家族
  desc: llama_model_load_from_file/_from_file_ptr/_from_splits/_init_from_user 四个入口分别对应路径、FILE*、分片、用户自定义张量场景
- concept: 模型保存与分割
  desc: llama_model_save_to_file() 通过 llama_model_saver 序列化回 GGUF；llama_split_path/llama_split_prefix
    实现 "%05d-of-%05d" 命名规范的路径生成与反向提取
- concept: llama-cpp.h 智能指针
  desc: unique_ptr + 自定义 deleter（llama_model_deleter/llama_context_deleter/llama_sampler_deleter/llama_adapter_lora_deleter）
- concept: README 支持的 17 种后端
  desc: Metal/BLAS/BLIS/SYCL/OpenVINO/MUSA/CUDA/HIP/ZenDNN/Vulkan/CANN/OpenCL/zDNN/WebGPU/RPC/Hexagon/VirtGPU
- concept: README 支持的模型矩阵
  desc: 文本模型（LLaMA/Qwen/DeepSeek/Gemma/Mamba/RWKV 等）+ 多模态模型（LLaVA/Qwen2-VL/GLM-EDGE/LFM2-VL
    等）
- concept: src/llama.cpp 全局作用域（__main__）
  desc: 文件级代码：头文件包含、#pragma warning 条件编译、constexpr int64_t MiB、enum layer_fraction_t、class
    llama_params_fit_exception，是参数适配与设备调度的规约层
