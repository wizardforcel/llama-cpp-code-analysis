  name: 后端与底层基础设施 —— 推理引擎的「硬件调度室」
  'no': 4
  points:
  - '**文件全局作用域与实现框架（__main__）**：src/llama.cpp 的顶部是全部头文件包含与条件编译（`#pragma warning`），并定义了文件级常量
    `constexpr int64_t MiB`、枚举 `enum layer_fraction_t`（LAYER_FRACTION_ATTN/UP/GATE/MOE）与异常类
    `class llama_params_fit_exception`，构成整个参数适配与设备调度代码的规约层'
  - '**支持的后端全家福**：在 README 的「Supported backends」表格中列出了 17 种后端：Metal（Apple Silicon）、BLAS/BLIS（全平台）、SYCL（Intel/Nvidia
    GPU）、OpenVINO、MUSA（摩尔线程）、CUDA/HIP/ZenDNN（AMD CPU）、Vulkan、CANN（昇腾）、OpenCL（Adreno）、IBM
    zDNN、WebGPU、RPC、Hexagon（Snapdragon）、VirtGPU 等'
  - '**后端探测机制**：通过 `ggml_backend_dev_count()` 与 `ggml_backend_dev_get(i)` 枚举所有可用设备，再按
    `ggml_backend_dev_type`（CPU/ACCEL/GPU/IGPU）分类：GPU 优先按 `device_id` 去重，RPC 服务器插入到列表最前以减少网络传输'
  - '**设备能力查询**：`ggml_backend_dev_memory(dev, &free, &total)` 获取设备剩余内存；当返回 0 时回退到
    CPU 后端内存（修复 issue #18577）；`ggml_backend_dev_get_props` 获取 `device_id/description`
    等信息'
  - '**单 GPU 模式裁剪**：当 `split_mode == LLAMA_SPLIT_MODE_NONE` 时，清空设备列表只保留 `main_gpu`，否则报「invalid
    value for main_gpu」'
  - '**设备加载日志**：每个被选中的设备都会打印 `using device %s (%s) (%s) - %zu MiB free`，便于排查硬件调度问题'
  - '**模型加载多入口家族**：`llama_model_load_from_file_impl` 是所有模型加载路径的统一入口，内部委托给 `llama_model_load`；四个公开接口分别覆盖路径（`_from_file`）、文件指针（`_from_file_ptr`）、多分片（`_from_splits`）、用户自定义张量（`_init_from_user`）四种场景'
  - '**参数适配（llama_params_fit）**：`llama_params_fit` 是当默认参数装不下设备时的「自适应降级」工具：通过二分查找 +
    线性外推，逐步缩小 `n_ctx`、调整 `n_gpu_layers/tensor_split/tensor_buft_overrides`，把稠密层优先放在显存、稀疏
    MoE 层回退到内存'
  - '**模型加载四阶段流水线**：`llama_model_load` 依次调用 `load_arch/load_hparams/load_vocab/load_tensors`，每个阶段都有独立异常捕获；`load_tensors`
    返回 false 表示取消（-2），其他异常返回 -1'
  - '**退出与取消**：模型加载的 progress_callback 返回 false 会被识别为「-2 取消」；`llama_model_free` 由
    llama-cpp.h 的 unique_ptr deleter 负责'
