  name: 后端初始化与能力探测 —— GGML 的「握手协议」
  'no': 3
  points:
  - '**全局初始化入口**：`llama_backend_init()` 调用 `ggml_time_init()` 并通过 `ggml_init` 初始化
    f16 查找表，是任何 llama.cpp 程序的「第一行」'
  - '**NUMA 优化开关**：`llama_numa_init(enum ggml_numa_strategy numa)` 通过 `ggml_backend_reg_get_proc_address(reg,
    "ggml_backend_cpu_numa_init")` 动态获取 ggml-cpu 后端的 NUMA 初始化函数指针，避免 NUMA 策略被硬链接'
  - '**能力查询接口**：`llama_supports_mmap/mlock/gpu_offload/rpc()` 四个布尔函数让客户端在运行前判断系统是否支持对应能力，避免硬编码后端假设'
  - '**设备容量探测**：`llama_max_devices()`（默认 16）、`llama_max_parallel_sequences()`、`llama_max_tensor_buft_overrides()`（默认
    4096）用于内存缓冲区预分配'
  - '**模型默认参数工厂**：通过 `llama_model_default_params`、`llama_context_default_params`、`llama_sampler_chain_default_params`、`llama_model_quantize_default_params`
    四个工厂函数获取带合理默认值的参数结构体'
  - '**全局日志钩子**：`llama_log_set/get` 提供全局日志回调注册机制，状态是全局的因此「非线程安全」，主要用于把日志转发到 GUI 或测试框架'
  - '**打印系统信息**：`llama_print_system_info()` 遍历所有已注册的 ggml 后端（`ggml_backend_reg_count`），通过
    `ggml_backend_get_features` 拉取每个后端的特性（CUDA 版本、Metal 设备等），拼成一段字符串'
  - '**资源释放**：`llama_backend_free()` 调用 `ggml_quantize_free()` 释放量化相关全局资源（用于 MPI 等场景）'
