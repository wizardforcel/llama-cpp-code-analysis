  name: 基础算术与一元激活函数 —— 张量加工的「数学工具箱」
  'no': 3
  points:
  - '**基础算术运算（支持广播与in-place）**'
  - '- ggml_add / sub / mul /div：逐元素操作，形状必须完全相同（或通过广播）'
  - '- in-place版本：后缀 _inplace，通过 ggml_view_tensor 创建，避免新分配内存'
  - '**一元逐元素操作完整名单**'
  - '- 符号与绝对值：ggml_sgn、ggml_neg、ggml_abs'
  - -苏打与开方：ggml_sqr、ggml_sqrt
  - '- 对数与指数：ggml_log、ggml_exp、ggml_expm1（安全版exp-1）'
  - '- 三角函数：ggml_sin、ggml_cos、ggml_tanh'
  - '- 阶跃函数：ggml_step（x > 0 ? 1 : 0）'
  - '- 取整函数：ggml_floor、ggml_ceil、ggml_round、ggml_trunc（向零取整）'
  - '**激活函数大家族**'
  - '- 线性整流：ggml_relu、ggml_leaky_relu（可调negative_slope）'
  - '- Sigmoid家族：ggml_sigmoid、ggml_hardsigmoid'
  - '- Swish族：ggml_silu（x*sigmoid(x)）、ggml_hardswish'
  - '- 指数线性单位：ggml_elu、ggml_softplus（softplus是更平滑的relu）'
  - '- GELU：三个版本——ggml_gelu（快速）、ggml_gelu_erf（精确）、ggml_gelu_quick（极快）'
  - '**统一实现模板**'
  - '- 大多数一元算子用 ggml_unary (op=GGML_OP_UNARY, 并在op_params中存op枚举)'
  - '- 函数内部逻辑：创建result->置op->写op_params->挂src'
  - '**缩放与偏置**'
  - '- ggml_scale: result = x * s'
  - '- ggml_scale_bias: result = x * s + b'
  - '**反向传播接口**'
  - '- ggml_silu_back: SILU反向传播，用于训练'
