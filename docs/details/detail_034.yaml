  name: 归约、归一化与矩阵运算 —— 深度学习的「计算核心」
  'no': 4
  points:
  - '**归约操作**'
  - '- ggml_sum: 所有元素求和→标量（1x1）'
  - '- ggml_sum_rows: 按行求和，[a,b,c,d]→[1,b,c,d]'
  - '- ggml_mean: 行均值'
  - '- ggml_argmax: 每行最大值索引'
  - '- ggml_count_equal: 统计两张量相等的元素数'
  - '- ggml_cumsum: 累加和（前缀和）'
  - '**归一化三大剑客**'
  - '- ggml_norm: L2归一化'
  - '- ggml_rms_norm: 均方根归一化（RMSNorm），LLaMA首选'
  - '- ggml_l2_norm: 欧几里得范数归一化'
  - '- ggml_group_norm: 组归一化（Stable Diffusion）'
  - '- 所有norm都有 inplace 变体，通过 ggml_view_tensor 实现'
  - '**矩阵运算**'
  - '- ggml_mul_mat: A[m,k]@B[k,n]→C[m,n]，用于attention、FFN等核心计算'
  - '- ggml_mul_mat_id: 稀疏混合专家（MoE），根据ids路由到不同专家矩阵'
  - '- ggml_out_prod: 向量的外积'
  - '- ggml_solve_tri: 解三角矩阵方程'
  - '**GLU门控线性单元家族**'
  - '- ggml_glu/glu_split: 通用API，分单输入/双输入版'
  - '- 单输入的模式：ggml_reglu / geglu / swiglu / geglu_erf / geglu_quick等'
  - '- 双输入split版本：separate gate和value张量，如ggml_swiglu_split'
  - '- 门控交换：ggml_*_swapped，切换gate和value的位置'
  - '- 特殊变体：ggml_swiglu_oai (带alpha和limit参数)'
  - '**附加操作**'
  - '- ggml_repeat / repeat_4d / repeat_back：重复与缩并'
  - '- ggml_concat: 沿指定维度拼接两个张量'
