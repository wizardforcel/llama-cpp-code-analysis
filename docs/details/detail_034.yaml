  name: 张量与计算图基础 —— 乐高积木的砖块与图纸
  'no': 1
  points:
  - '**ggml_tensor：张量的核心结构'
  - '- 包含：type（类型）、ne[4]（形状）、nb[4]（步长）、op（操作符）、src[]（源张量）、view_src（视图源）、data（数据指针）及其标志位flags'
  - '- 特殊参数存储：op_params，通过ggml_set_op_params_i32/f32进行序列化存储'
  - '**计算图基础设施：ggml_cgraph**'
  - '- 组成：节点数组nodes、叶子节点leafs、梯度grads、访问哈希表visited_hash_set'
  - '- 图遍历的顺序、use_counts（引用计数）、order标志'
  - '**张量生命周期管理**'
  - '- ggml_init: 创建上下文，初始化内存池'
  - '- ggml_free/reset: 释放或重置上下文'
  - '- ggml_new_tensor/new_tensor_*d: 创建新张量（只分配元数据，数据由后续分配）'
  - '- ggml_dup_tensor/view_tensor：复制或创建视图'
  - '- ggml_set_input/output/param/loss：张量角色标记'
  - '**核心遍历与查找**'
  - '- ggml_get_first_tensor / get_next_tensor: 遍历上下文中的张量'
  - '- ggml_get_tensor: 按名称查找'
  - '- ggml_get_data/get_data_f32: 访问张量数据指针'
  - '**构建图的三句口诀**：'
  - 1. 用 ggml_build_forward_expand：从输出回溯到叶子
  - 2. 用 ggml_visit_parents_graph：DFS遍历，标记 visited_hash_set
  - 3. 用 ggml_build_backward_expand：为反向传播创建梯度计算子图
