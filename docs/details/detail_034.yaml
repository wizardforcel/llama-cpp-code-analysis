  name: 内存管理与缓冲区抽象 —— 高效的「仓库与运输系统」
  'no': 10
  points:
  - '**分配器三个等级**：'
  - '- ggml_tallocr: 简单线性分配器，适合单缓冲、结构已知情况'
  - '- ggml_dyn_tallocr: 动态张量分配器，支持多chunk和最佳适应算法'
  - '- ggml_gallocr: 图级分配器，理解整个计算图，智能复用内存'
  - '**虚拟缓冲区（vbuffer）**'
  - '- 位于 ggml_gallocr 内部，支持最多16个chunk'
  - '- 每个chunk是实际的物理内存块，可以容纳多个张量'
  - '**ggml_gallocr核心算法**'
  - '- 生命周期分析：追踪每个张量的n_children（需要其作为输入的其他节点数）'
  - '- in-place复用：当ggml_op_can_inplace且形状兼容时，复用父张量内存'
  - '- 视图共享：view张量无需独立内存，直接使用view_src的内存基址+offset'
  - '- 释放机制：当张量的最后一个子节点完成且没有view引用时，释放内存'
  - '**缓冲区类型（ggml_backend_buffer_type_t）**'
  - '- 定义了这块内存的特性：名字、对齐、主动内存管理（是否为主机内存）'
  - '- get_alloc_size：计算张量在该buft上需要多少字节'
  - '**缓冲区（ggml_backend_buffer_t）**'
  - '- 物理内存容器：alloc_buffer/free_buffer/init_tensor'
  - '- 用途标记：COMPUTE（计算用）或WEIGHTS（权重）'
  - '- 监控使用量：get_used_bytes'
  - '**ggml_backend_tensor_copy**'
  - '- 跨后端复制张量：在不同设备（CPU/GPU）之间安全搬运数据'
  - '- 同后端的直接memcpy；跨后端需要通过主机中转'
  - '**ggml_backend_tensor_alloc**'
  - '- 为张量在指定缓冲区中分配内存'
  - '- 使用ggml_backend_buffer_init_tensor初始化元数据'
  - '**GGML上下文与张量内存类型**'
  - '- ggml_backend_alloc_ctx_tensors：一次性为整个上下文分配缓冲区'
  - '- 用于快速初始化模型权重'
