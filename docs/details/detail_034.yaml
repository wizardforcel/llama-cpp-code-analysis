exercises:
- contents:
  - 如今已理解GGML算子的核心构建模板，现在验证学习方法是否能应用到全部算子：
  - 选择三个算子进行分析：
  - 1. `ggml_add`（二元算术）及`ggml_add_inplace`
  - 2. `ggml_silu`（一元激活）及`ggml_silu_inplace`
  - 3. `ggml_reshape_2d`（形状变换）
  - ''
  - 需要回答：
  - '- 三类算子的共同点：都是如何创建结果张量的？（dup_tensor/view_tensor)当使用 `inplace` 版本时，张量的 op 变成什么？'
  - '- 简述op_params数组在每类算子中的作用'
  - '- 画一个3步计算例子：a → silu(a) → reshape(2,x) → add(b,.)，说明每一步返回张量的类型和关系'
  'no': 1
  title: 阅读GGML算子实现：统一模板分析
- contents:
  - '`ggml_build_backward_expand`是训练流程的核心。请阅读其实现，重点理解：'
  - 1. 如何生成ggml_tensor的grad_accs（梯度累积器）
  - 2. `ggml_compute_backward`中各算子分支的梯度计算公式
  - 3. 对比前向图与反向图的创建差异
  - ''
  - 实践任务：
  - '- 手写一个简单的2层感知机（x→silu→matmul→silu），构建其前向图与反向图'
  - '- 手动计算每个参数的梯度，检验与代码逻辑是否一致'
  - '- 思考题：为什么softmax的反向传播这么复杂？梯度如何分解为两部分？'
  'no': 2
  title: 理解反向传播的梯度计算
- contents:
  - '`ggml_gallocr` 是GGML中的图级内存分配器，负责分析计算图并优化内存使用。'
  - 1. 阅读 `ggml/src/ggml-alloc.c` 中的 `ggml_gallocr_allocate_node` 函数
  - 2. 理解in-place复用的条件（n_children==0+layout匹配+not_output）
  - 3. 学习视图张量（view）的内存共享如何不额外分配内存
  - ''
  - 任务：
  - '- 对比两个图：一个使用 ggml_mul + ggml_mul（创建新内存）'
  - '- 另外一个：使用 ggml_mul_inplace'
  - '- 在两种情况下用 `ggml_gallocr_get_buffer_size` 统计需要的缓冲区大小'
  - '- 输出比较报告，比较内存差异和第2个图可进行in-place复用的位置'
  'no': 3
  title: 图分配器内存优化
- contents:
  - 该练习聚焦GGUF文件的实际操作：
  - 1. 读取：用 `gguf_init_from_file` + 遍历 `gguf_get_n_kv` / `gguf_get_val_*` 读取模型元数据
  - 2. 写入：用 `gguf_init_empty` + `gguf_set_val_*` 构建最小化GGUF文件并保存
  - 3. 修改：读取现有GGUF，改动某个关键参数（如rope_freq_base），再写回
  - ''
  - 思考问题：
  - '- GGUF文件头的四个字节是什么？'
  - '- 对齐参数(alignment)为何通常为32或64？'
  - '- KV分区与张量数据区的分界是什么标记？'
  - '- 如何在写入、追加权限之外加入密码或版本控制？'
  'no': 4
  title: GGUF文件格式：读写与遍历
- contents:
  - 研究 `ggml_backend_sched_split_graph` 的三阶段拆分逻辑：
  - '1. Phase 1: 从缓冲区到节点分配后端（权重通常在GPU）'
  - '2. Phase 2: 从当前后端向下传播（让附近节点在同后端）'
  - '3. Phase 3: 从当前后端向上传播（向用户节点传递）'
  - ''
  - 实践任务：
  - '- 构造一个混合计算图：一个在GPU上的mul_mat → 节点B（不指定后端）→ softmax'
  - '- 使用 `ggml_backend_sched_print_assignments` 打印每个节点的后端分配'
  - '- 手动调整开关：只用GPU for matmul，其他全部CPU，重新编译并重新打印分配'
  - '- 根据结果分析调度决策逻辑是否合理，尤其是当某个算子仅CPU支持时会发生甚么？'
  'no': 5
  title: 多后端调度器实战
- contents:
  - GGML的核心之一是量化技术，支持从FP32到各种量化格式：
  - 1. 阅读 `ggml_quantize_chunk` 支持的全部类型
  - 2. 理解量化块（block）的结构：缩放因子(d)、量化值、最小值(m)
  - 3. 阅读量化函数（如quantize_q4_0）的实现原理
  - ''
  - 实践：
  - '- 写一个测试脚本：创建一个 [128] 的随机FP32张量，量化到 Q4_0 并再反量化'
  - '- 计算量化误差：平均绝对误差（MAE）、信噪比（SNR）'
  - '- 画出误差分布直方图并分析分量特点'
  - '- 尝试 Q2_K、Q4_K、Q6_K、Q8_0 ，比较压缩比与精度平衡关系'
  'no': 6
  title: 量化与精度：从FP32到Q4_0
- contents:
  - 综合所学知识，走完一个完整的推理流程：
  - 1. 用 ggml_init创建上下文
  - 2. 加载模型权重：从 GGUF 读取并构建 张量池
  - 3. 构建Libgraph：包含embedding→transformer blocks→LM head
  - 4. 使用 ggml_backend_sched 进行多后端调度
  - 5. 执行 ggml_backend_sched_graph_compute 完成推理
  - 6. 提取 logits，用 ggml_soft_max 计算概率
  - 7. argmax 选择最优token
  - ''
  - 提示：可以参考 llama.cpp 的 simple infer 执行流程，理解上面这个宏观流程如何映射到具体 GGML 函数调用
  'no': 7
  title: 一个完整推理示例：LLaMA文本生成
learning_targets:
- 掌握GGML张量（ggml_tensor）的核心结构定义：类型、形状、步长、操作类型、源张量、视图关系
- 掌握张量属性查询函数族：is_scalar、is_vector、is_matrix、is_3d、is_contiguous、is_transposed、is_permuted等判别逻辑
- 掌握GGML算子的统一构建模式：dup_tensor/view_tensor → 设置op_params → 链接src
- 掌握元素级一元算子（abs/neg/sin/cos/tanh）、二元算术（add/sub/mul/div）、归约（sum/mean/argmax）的实现机制
- 掌握in-place版本的实现原理：通过ggml_view_tensor共享内存并标记为GGML_OP_*_INPLACE
- 掌握GLU门控机制的全部变体：ReGLU、GEGLU、SwiGLU及其split/oai/swapped版本
- 掌握卷积、池化、填充、插值等CV相关算子的构建逻辑
- 掌握FlashAttention、RoPE等注意力机制相关核心算子
- 掌握图形化反向传播：build_forward_expand、build_backward_expand的梯度图构建
- 掌握内存管理基础设施：aligned_malloc、动态分配器、图分配器、缓冲区抽象
- 掌握GGUF文件格式的读写：元数据KV、张量信息、序列化与反序列化
life_analogy:
- 想象GGML是一个**精密机床加工仓库**，负责将原始材料（张量数据）加工成最终的复杂工件（计算结果）：
- ''
- '**仓库与图纸（ggml_cgraph）**'
- '- 每张图纸标注了加工步骤（op）、源材料位置（src）、目标形状（ne）'
- '- 图纸不是立即执行的工单，而是设计蓝图——延迟计算的核心优势'
- ''
- '**两台关键机床类型**：'
- '- **VIP加急机床（In-place）**：直接改造原材料，无需额外空间 → ggml_view_tensor'
- '- **标准复制机床**：将材料完整加工到新产品 → ggml_dup_tensor'
- ''
- '**精密量具（属性检查）**'
- '- 卡尺（ggml_is_contiguous）：检查材料是否连续排列'
- '- 角度仪（ggml_is_transposed）：检查是否旋转了90°'
- '- 三维扫描仪（ggml_n_dims）：测量有多少个维度'
- ''
- '**模具家族（激活函数）**'
- '- 不同形状的模具可压制出相同原料的不同形状'
- '- GELU有三种模具：精确版（Slow）、近似版（Fast）、ERF版'
- '- SwiGLU是双通道模具：一部分决定开关（sigmoid）、一部分是通道'
- ''
- '**专家分配系统（MoE）**'
- '- ggml_mul_mat_id：根据客户需求（ids）把工单分配给不同车间'
- '- 每个车间（Expert）有自己的工艺，最后合并结果'
- ''
- '**质量检测（反向传播）**'
- '- ggml_build_backward_expand：反向检查工件，计算每个工序的误差'
- '- 从最终产品逐步回溯到原材料'
- ''
- '**仓储管理系统**'
- '- ggml_tallocr：简单的线性货架，适合预先知道所有商品大小的场景'
- '- ggml_dyn_tallocr：动态段落式架，支持多个货架段，按需借用'
- '- ggml_gallocr：智能管理员，分析整个仓库的最佳布局，支持跨架利用'
- ''
- '**集装箱格式（GGUF）**'
- '- 国际通用集装箱：头部有规格说明 + 货物清单 + 实际商品'
- '- 任何港口（CPU/GPU）都能识别和处理这种集装箱'
- ''
- '**总控中心（调度器）**'
- '- ggml_backend_sched：多车间协调中心，将工单分配到不同车间'
- '- 平衡负载、优化传输、支持并行生产'
'no': 33
summary:
- concept: ggml_tensor
  desc: 张量核心结构：包含类型(type)、形状(ne[4])、步长(nb[4])、操作符(op)、源张量(src[])、视图关系(view_src)、数据指针(data)
- concept: ggml_cgraph
  desc: 计算图：包含节点(nodes)、叶子节点(leafs)、梯度(grads)、use_counts、visited_hash_set
- concept: ggml_tensor 构建模式
  desc: 核心三部曲：分配dup_tensor/view_tensor → 设置op_params → 链接src
- concept: ggml_dup_tensor vs view_tensor
  desc: dup复制元数据但独立内存；view共享内存（零拷贝），是in-place操作的基础
- concept: ggml_unary/unary_impl
  desc: 一元算子的统一实现：所有激活函数、三角函数等都通过该函数创建
- concept: ggml_is_contiguous家族
  desc: 连续性检查：影响后端优化路径选择，全流程的重要判别条件
- concept: ggml_is_transposed/is_permuted
  desc: transposed比较nb[0]>nb[1]，permuted更宽泛，影响形状变换策略
- concept: in-place算子
  desc: 通过ggml_view_tensor标记，在ggml_op_can_inplace中列出可原位执行的操作
- concept: GLU家族
  desc: ReGLU/GEGLU/SwiGLU三大变体，分别使用ReLU/GELU/SiLU作为门控激活函数
- concept: ggml_mul_mat
  desc: 矩阵乘法核心算子，A[m,k] @ B[k,n] → C[m,n]，支持广播
- concept: ggml_mul_mat_id
  desc: MoE专家路由算子，根据ids将输入路由到对应的专家矩阵
- concept: RoPE
  desc: 旋转位置编码，通过ggml_rope及其多版本支持YaRN外推和多维度分节
- concept: flash_attn_ext
  desc: 融合Attention计算，支持mask、ALiBi、scale、softcap等参数
- concept: soft_max_ext
  desc: 可扩展softmax，支持mask、scale、ALiBi最大偏置
- concept: ggml_conv系列
  desc: 1D/2D/3D卷积，深度卷积(dw)、转置卷积，基于im2col+mul_mat实现
- concept: ggml_im2col
  desc: 图像块展开，将卷积转为矩阵乘法，深度卷积核心
- concept: ggml_tallocr/gallocr
  desc: 张量及图级内存分配器，从简单线性分配到图感知分配
- concept: ggml_dyn_tallocr
  desc: 动态张量分配器，支持多chunk、最佳适应、内存合并
- concept: vbuffer
  desc: 虚拟缓冲区，最多支持16个chunk（多缓冲区）的组合管理
- concept: ggml_backend_buft/dev/backend
  desc: 设备缓冲区类型/设备/后端三层抽象，屏蔽硬件差异
- concept: ggml_backend_sched
  desc: 调度器，支持三阶段图拆分：预分配、向下扩展、向上传播
- concept: ggml_backend_multi_buffer
  desc: 多缓冲区，由多个子缓冲区合并成的复合缓冲区
- concept: gguf_context
  desc: GGUF文件内存映像，包含version、kv列表、tensor信息、对齐等
- concept: gguf_reader
  desc: 低级文件读取器，处理对齐、长度前缀、字节序等细节
- concept: gguf_writer_buf/file
  desc: 序列化写入器，支持内存缓冲区和文件两种写入目标
- concept: gguf_kv
  desc: 键值对结构，支持所有标量、数组、字符串、混合类型
- concept: IQ系列量化
  desc: Inexact量化（IQ2_XXS等），通过预定义的kdefaults_*查找表实现
- concept: ggml_build_forward_expand
  desc: 从输出张量反向DFS遍历，将所有依赖的父节点加入计算图
- concept: ggml_build_backward_expand
  desc: 生成反向传播子图，为每个可训练参数计算梯度
- concept: ggml_compute_backward
  desc: 核心反向传播实现，按op类型分发到对应的梯度计算公式
- concept: ggml_add_or_set
  desc: 梯度累加或初次设置，配合grad_accs实现跨batch梯度累积
- concept: op_params机制
  desc: 每个算子可在op_params字段中嵌入参数，无需额外数据结构
- concept: ggml_opt_系列
  desc: 训练优化框架：数据集、优化器（AdamW/SGD）、训练循环
- concept: ggml_opt_dataset
  desc: 训练数据集，支持分片打乱、批次提取
- concept: ggml_opt_step_adamw/sgd
  desc: 优化器一步更新算子，直接修改模型参数的权重张量
- concept: graph 反向传播
  desc: llama_opt_build的反向图构建：复制前向图+grad_accs管理+optimizer_step插入
- concept: MPI与NULL_DATA
  desc: los_sel采样中，MPI解析用于识别处理图案的精确边缘，NULL_DATA表示跳过的模式，达到全图范围的低复杂分发效果
