  name: 注意力机制与位置编码 —— 序列模型的「注意力之链」
  'no': 7
  points:
  - '**Softmax及其扩展**'
  - '- ggml_soft_max: 基础Softmax，x / sum(exp(x))'
  - '- ggml_soft_max_ext: 扩展版，支持mask、scale、ALiBi max_bias'
  - '- ggml_soft_max_ext_back: 反向传播'
  - '- ggml_soft_max_add_sinks: 为attention sink添加支持'
  - '**Flash Attention**：高性能注意力合成'
  - '- ggml_flash_attn_ext: 融合算子，一次完成Q@K^T、softmax、@V三步'
  - '- ggml_flash_attn_ext_set_prec: 设置精度'
  - '- ggml_flash_attn_ext_add_sinks: 添加注意sink'
  - '- ggml_flash_attn_back: 反向传播'
  - '**RoPE（旋转位置编码）**'
  - '- ggml_rope: 基础版，仅频率参数'
  - '- ggml_rope_ext: 外推版本，支持YaRN风格外推'
  - '- ggml_rope_multi: 多维RoPE（多模态场景，如图像patch位置）'
  - '- ggml_rope_yarn_corr_dims: 计算YARN外推的维度修正'
  - '- ggml_rope_ext_back / rope_multi_back: 反向传播'
  - '**辅助函数**'
  - '- ggml_clamp: 将张量值夹在[min, max]范围内'
  - '- ggml_get_rel_pos / add_rel_pos: 相对位置编码'
  - '- ggml_timestep_embedding: 生成时间步嵌入（Diffusion模型常用）'
  - ''
  - '**关键概念解释**'
  - '- ALiBi (Attention with Linear Biases): 通过线性偏置代替rope'
  - '- YARN: 一种RoPE外推技术，可以在训练短序列后推理更长序列'
  - '- Attention sinks: 缓解稀疏注意力的质量问题'
  - '- softmax不用于flash_attn计算部分，因为它被融合'
