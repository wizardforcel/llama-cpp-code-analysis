  name: 张量属性查询与诊断 —— 张量形状检查大全
  'no': 2
  points:
  - '**形状判定**'
  - '- ggml_is_scalar/vector/matrix/3d：逐段检测维度是否符合 [1,1,1,1] → [1,1,n,m] → [1,n,m,x]等'
  - '- ggml_n_dims: 返回实际维度数（去除尾随的1）'
  - '**内存结构判定**'
  - '- ggml_is_contiguous: 标准连续（nb[i] == nb[i-1] * ne[i-1]）'
  - '- ggml_is_contiguous_0/1/2：从第0/1/2维开始的连续性'
  - '- ggml_is_contiguous_rows / is_contiguous_channels：行/通道连续性'
  - '- ggml_is_transposed/is_permuted：检测是否转置（nb[0]>nb[1]）或任意置换'
  - '**尺寸计算**'
  - '- ggml_nelements: 元素总数，累乘各维度'
  - '- ggml_nbytes: 占用字节数，考虑量化块与步长'
  - '- ggml_nbytes_pad: 对齐到GGML_MEM_ALIGN（64字节）'
  - '- ggml_blck_size / type_size / row_size：量化块和类型有关'
  - '**类型与算子查询**'
  - '- ggml_is_quantized: 检查是量化类型'
  - '- ggml_type_name / op_name / op_symbol / unary_op_name / glu_op_name: 名称查询'
  - '- ggml_op_desc: 算子完整描述'
  - '**张量关系**'
  - '- ggml_are_same_shape: 形状相同'
  - '- ggml_are_same_stride: 步长相同'
  - '- ggml_can_repeat: 可以重复广播'
  - '- ggml_is_view: 是否为视图'
  - '**高级工具**'
  - '- ggml_ftype_to_ggml_type: 文件类型到GGML数据类型的映射'
  - '- ggml_element_size: 单个元素大小'
  - '- ggml_tensor_overhead: 元数据开销'
