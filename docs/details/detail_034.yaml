  name: 状态空间与循环模型 —— RNN和Mamba的「状态追踪」
  'no': 8
  points:
  - '**状态空间模型（SSM）或“结构化状态空间”**'
  - '- ggml_ssm_conv: 状态空间模型的卷积计算'
  - '- ggml_ssm_scan: 状态空间模型的scan操作，用于训练'
  - '- 这两个是Mamba等新型架构的核心'
  - '**RWKV家族**'
  - '- ggml_rwkv_wkv6: RWKV-v6的WKV（Weighted Key-Value）计算'
  - '- ggml_rwkv_wkv7: RWKV-v7版本'
  - '- 状态保存在state张量中，循环地在序列上传播'
  - '**门控线性注意力**'
  - '- ggml_gated_linear_attn: 带门控的线性注意力机制'
  - '- ggml_gated_delta_net: DeltaNet变体与门控结合'
  - '**权重更新与优化**'
  - '- ggml_fill/fill_inplace: 用常数填充张量'
  - '- ggml_cross_entropy_loss: 交叉熵损失函数及反向'
  - '- ggml_opt_step_adamw: AdamW优化器单步更新'
  - '- ggml_opt_step_sgd: SGD优化器单步更新'
  - '**共性特征**'
  - '- 这些算子通常接受状态张量（state）作为输入，输出新状态'
  - '- 允许跨序列递归处理长时间依赖'
  - '- 与标准Transformer不同，不需要全部历史'
