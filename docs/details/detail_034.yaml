  'no': 9
  points:
  - '**自定义算子：突破GGML内置算子限制**'
  - '- ggml_map_custom1/2/3: 一元、二元、三元自定义算子，支持指定线程数'
  - '- ggml_map_custom*_inplace: in-place版本，节省内存'
  - '- ggml_custom_4d: 最高自由度算子，指定输出形状和任意数量输入'
  - '- ggml_custom_inplace: 在已有张量上原地执行自定义操作'
  - '**训练框架（ggml-opt.h/ggml-opt.cpp）**'
  - '- ggml_opt_dataset: 训练数据集管理'
  - '  - dataset_init: 初始化（数据和标签张量）'
  - '  - dataset_shuffle: 随机打乱（用于epoch之间）'
  - '  - dataset_get_batch: 提取一个mini-batch'
  - '- ggml_opt_context: 优化上下文'
  - '  - opt_init/opt_free: 创建和释放'
  - '  - opt_reset: 重置梯度'
  - '  - opt_build: 构建传播图和优化算子'
  - '  - opt_eval: 执行前向+反向'
  - '- ggml_opt_result: 交叉验证/测试结果记录'
  - '- ggml_opt_epoch_callback: 每batch后的回调'
  - '- ggml_opt_fit: 完整训练过程（多个epoch）'
  - '**优化器选择**'
  - '- GGML_OPT_OPTIMIZER_TYPE_ADAMW: Adam优化器（带weight_decay）'
  - '- GGML_OPT_OPTIMIZER_TYPE_SGD: 随机梯度下降'
  - '**推理与验证**'
  - '- ggml_opt_result_accuracy: 计算准确率'
  - '- ggml_opt_result_loss: 提取损失值'
  - '- 支持训练/验证集分割'
  - '**图复制与梯度**'
  - '- map_tensor / dup_graph: 为训练目的复制计算图'
  - '- 梯度累积：通过grad_accs数组，支持大的有效批次size'
