  name: 形状变换、视图与数据移动 —— 乐高积木的「重塑师」
  'no': 5
  points:
  - '**连续化（cont）与重塑（reshape）**'
  - '- ggml_cont: 使张量内存连续（不复制数据）'
  - '- ggml_cont_1d/2d/3d/4d: 连续化同时改变形状'
  - '- ggml_reshape系列: 改变形状（必须连续且总元素数不变），返回view'
  - '**视图变换**'
  - '- ggml_view_1d/2d/3d/4d: 创建视图，指定偏移和步长，数据共享'
  - '- ggml_permute: 置换维度顺序（如 [a,b,c,d]→[a,d,c,b]）'
  - '- ggml_transpose: swap dim 0/1 二维转置（实际是特殊的permute）'
  - '**数据设置与复制**'
  - '- ggml_set系列: 将b的值嵌入到a的指定位置（set_1d/set_2d等）'
  - '- ggml_set_inplace: 直接在原位置修改'
  - '- ggml_cpy: 复制 a→b'
  - '- ggml_cast: 类型转换（FP32→FP16等）'
  - '**特殊视图操作**'
  - '- ggml_diag: 从向量创建对角矩阵'
  - '- ggml_diag_mask_inf/zero: 创建上三角或下三角mask'
  - '- ggml_get_rows/get_rows_back: 行提取与反向'
  - '- ggml_set_rows: 按行索引赋值'
  - '**窗口操作**'
  - '- ggml_win_part: 将图像分割为固定大小的窗口'
  - '- ggml_win_unpart: 逆操作，将窗口重组为完整图像'
  - '**关键设计：view与dup的平衡**'
  - '- view: 零拷贝、零开销，只需记录新形状和偏移'
  - '- dup: 完全复制（包括数据和元数据），适合需要独立副本的场景'
  - '- in-place算子的技术基础：view + 直接修改'
