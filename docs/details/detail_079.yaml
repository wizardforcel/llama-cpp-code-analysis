  name: 统一令牌容器与提示词处理 —— server_tokens 这座'多模态装箱工厂'
  'no': 2
  points:
  - '**server_tokens 的完整生命周期管理**'
  - '- 构造函数支持从 `mtmd::input_chunks` 批量导入或从纯文本 token 列表初始化，拷贝操作被显式删除（`= delete`），移动操作默认启用，确保资源所有权清晰'
  - '- 析构函数默认实现，依赖智能指针自动管理 `mtmd::input_chunk_ptr` 资源'
  - '- `operator[]`、`size()`、`empty()`、`clear()` 提供标准容器接口，`clear()` 同时清空 token 列表和媒体映射表'
  - '**多态插入与位置映射机制**'
  - '- `push_back(llama_token)` 添加普通文本 token，拒绝空 token；`push_back(const mtmd_input_chunk*)`
    处理媒体块，自动插入占位符并记录索引映射；`push_back(server_tokens&)` 合并另一个容器，重建索引映射'
  - '- `insert()` 仅在非多模态模式下批量插入 token 列表'
  - '- `pos_next()` 与 `size_up_to_pos()` 实现 token 索引与推理位置（position）的双向换算，处理多模态场景下
    token 数与位置数不一致的问题（一个图像块可能对应多个 position）'
  - '**缓存优化与验证机制**'
  - '- `get_common_prefix()` 计算两个 server_tokens 的公共前缀长度，多模态模式下比较 chunk ID 和 token
    数量，用于 KV 缓存复用'
  - '- `keep_first()` 在截断时保护媒体块完整性，确保不在 chunk 中间切断，防止越界访问'
  - '- `validate()` 确保媒体占位符（LLAMA_TOKEN_NULL）与媒体块映射一致，所有文本 token 在词汇表范围内'
  - '- `clone()` 深拷贝整个对象，复制所有媒体块'
  - '**投机解码与调试支持**'
  - '- `get_text_tokens()` 和 `set_token()` 支持投机解码场景下的 token 访问与修改'
  - '- `str()` 生成调试字符串，展示 token 序列和媒体索引分布'
  - '- `find_chunk()` 根据索引查找媒体块，抛出异常处理未找到的情况'
