  name: 协议翻译与格式转换 —— OpenAI、Anthropic 与 SSE 的'联合国翻译官'
  'no': 3
  points:
  - '**OpenAI 兼容参数解析**'
  - '- `oaicompat_completion_params_parse()` 处理 /completions 端点，解析 prompt、stop、max_tokens
    等参数，处理不支持的 best_of 和 suffix 参数报错'
  - '- `oaicompat_chat_params_parse()` 处理 /chat/completions，支持多模态内容（图像 URL、base64）、工具调用、JSON
    schema 响应格式'
  - '- `handle_media()` 统一处理 HTTP URL、本地文件（file://）和 base64 数据三种媒体来源，带安全校验'
  - '**跨协议转换引擎**'
  - '- `convert_responses_to_chatcmpl()` 将 OpenAI Responses API 转换为 Chat Completion
    格式，处理 input_text、input_image、function_call、reasoning 等复杂输入项，合并连续的 assistant 消息'
  - '- `convert_anthropic_to_oai()` 将 Anthropic Messages API 转换为 OpenAI 格式，处理 system
    提示、thinking 块转 reasoning_content、tool_use 转 tool_calls、tool_result 处理等'
  - '- 两者都处理工具定义的格式差异，确保函数调用能力跨协议兼容'
  - '**响应格式化与 SSE 编码**'
  - '- `format_embeddings_response_oaicompat()` 生成 OpenAI 风格的嵌入响应，支持 base64 编码的 embedding
    返回'
  - '- `format_response_rerank()` 格式化重排序结果，支持 TEI 格式和 OpenAI 格式，按分数排序并截断 top_n'
  - '- `format_oai_sse()` 生成 OpenAI 标准 SSE 格式（`data: {...}\n\n`），`format_anthropic_sse()`
    和 `format_oai_resp_sse()` 处理带 `event:` 类型的 SSE 格式'
  - '- `tokens_to_output_formatted_string()` 处理不完整 UTF-8 字节的特殊格式化，显示为 `byte: \xXX`'
  - '**专用提示词构造**'
  - '- `format_prompt_infill()` 构造 FIM（Fill-In-Middle）提示，处理前缀、后缀、额外上下文，支持 SPM 和 FIM
    两种模式，控制 token 数量在 n_batch 限制内'
  - '- `format_prompt_rerank()` 构造重排序提示，支持自定义模板或默认的 [BOS]query[EOS][SEP]doc[EOS] 格式'
  - '**LoRA 适配器动态管理**'
  - '- `lora_all_alora()` 检查是否所有启用的 LoRA 都是 Alora 类型'
  - '- `lora_should_clear_cache()` 判断切换 LoRA 时是否需要清空 KV 缓存，基于当前和目标的 Alora 状态'
  - '- `parse_lora_request()` 解析 JSON 请求中的 LoRA 配置'
  - '- `are_lora_equal()` 和 `lora_get_enabled_ids()` 提供 LoRA 集合的比较与查询'
