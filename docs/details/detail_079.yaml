life_analogy:
- 想象 llama-server 的 `server.cpp` 是一家**高可用银行**的应急指挥中心：
- '- **`signal_handler`** = 双重警报系统，第一次警报启动有序疏散（优雅退出），第二次警报触发紧急破门（立即终止）'
- '- **`ex_wrapper`** = 每位柜台的防弹玻璃罩，无论内部业务（路由处理函数）发生什么爆炸（异常），都能将其转化为标准错误回执单（HTTP 500
  响应），不让柜台外的客户看到火光'
- '- **`main()`** = 行长，依靠这些安全设施，才能在早晨大胆开门营业（启动服务），在晚上安心拉闸（清理资源）'
- 这些全局保护机制让 HTTP 路由层可以专注于业务逻辑，而不必每个端点都手写 try-catch 和信号处理。
- 而 `server_tokens` 则是这家银行的**智能运钞车与多币种金库管理系统**：
- '- **`pos_next()` / `size_up_to_pos()`** = 精确计算运输路线长度（位置）与实际货币箱数（token），特别是处理外币（多模态块）时汇率换算（token数与位置数不一致）'
- '- **`push_back()` 家族** = 三种入库方式：普通钞票（单token）、整箱外币（chunk）、整辆运钞车（另一个server_tokens）'
- '- **`keep_first()` / `get_common_prefix()`** = 库存优化算法，保留最常用的货币面额，快速识别重复运钞路线'
- '- **`process_chunk()`** = 外币兑换窗口，将黄金、珠宝（图像/音频）按汇率折算成标准货币单位（token embedding）'
- '`server-http.cpp` 则是银行的**大堂经理与安保系统**：'
- '- **`init()`** = 营业时间前的准备工作：开启保险库（SSL）、安装监控（中间件）、安排大堂布局（静态资源）'
- '- **`get()` / `post()`** = 设立不同业务窗口（路由），有的办理取款（GET），有的办理存款（POST）'
- '- **`process_handler_response()`** = 快递打包台，根据客户要求选择普通包裹（普通响应）或冷链物流（流式响应）'
- 协议转换层（`convert_*` 系列）则是**多语言翻译中心**：
- '- **`convert_responses_to_chatcmpl()`** = 将 Responses API 的''外文单据''翻译成内部统一的''标准票据''（Chat
  Completion格式）'
- '- **`convert_anthropic_to_oai()`** = Anthropic 格式与 OpenAI 格式之间的''双语词典''，处理思考块、工具调用等特殊语法'
- '- **`format_*_sse()`** 系列 = 实时翻译耳机，将内部推理结果转换成不同协议驱动的''语音流''（SSE）'
- 基础工具函数（Base64/UTF-8/JSON 校验）则是**精密测量工具组**：
- '- **`validate_utf8()` / `is_valid_utf8()`** = 货币验钞机，确保每一张''文本钞票''都不是残次品（非法编码）'
- '- **`fnv_hash()`** = 金库条形码机，给每批多模态数据打上唯一标识'
- '- **`json_value()` / `json_is_array_of_*()`** = 票据格式校验器，确保 incoming requests 符合标准格式'
