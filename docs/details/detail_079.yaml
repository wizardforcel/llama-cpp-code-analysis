  name: 服务端基础设施与优雅退出 —— server.cpp 全局作用域的'安全气囊'
  'no': 1
  points:
  - '**server.cpp 的全局保护机制**'
  - '- `shutdown_handler` 函数指针作为''总电闸''，由 `main()` 在启动时安装，在信号到来时触发'
  - '- `signal_handler()` 使用 `is_terminating` 原子标志实现双重检测：首次 SIGINT/SIGTERM 触发优雅退出（停止
    HTTP、释放模型），二次信号直接 `exit(1)` 强制终止'
  - '- 这种设计避免了用户在服务无响应时疯狂按 Ctrl+C 导致的资源泄漏'
  - '**异常到 HTTP 响应的统一转换**'
  - '- `ex_wrapper()` 是一个高阶函数，为每个路由处理函数戴上''防毒面具'''
  - '- 它将 `std::invalid_argument` 映射为 400（客户端错误），其他异常映射为 500（服务器错误）'
  - '- 通过 `format_error_response` 生成符合 OpenAI/Anthropic 风格的 JSON 错误体，确保 API 调用方总能收到结构化响应而非
    HTML 错误页'
  - '**main() 函数如何依赖这些基础设施**'
  - '- `main()` 在启动阶段即注册信号处理器，确保从模型加载到主循环退出的全生命周期都可被安全中断'
  - '- 通过 `ex_wrapper` 包装所有路由处理器，使路由注册代码保持简洁，无需在每个端点重复错误处理逻辑'
