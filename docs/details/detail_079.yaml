summary:
- concept: '`__main__` (server.cpp)'
  desc: 全局作用域基础设施，包含 shutdown handler 声明、原子终止标志和信号处理函数
- concept: '`signal_handler()`'
  desc: 信号处理函数，利用 `is_terminating` 原子标志实现首次 SIGINT/SIGTERM 优雅退出、二次信号立即终止的双重机制
- concept: '`ex_wrapper()`'
  desc: 路由处理函数的异常安全包装器，将各种 C++ 异常转换为带状态码的 JSON 错误响应
- concept: '`main()`'
  desc: 服务端总入口，组织参数解析、HTTP 初始化、双模式路由注册、模型加载与启动主循环
- concept: '`server_tokens` 类'
  desc: 统一文本 token 与多模态媒体块的容器，支撑提示词处理与 KV 缓存管理，含完整的构造、移动、验证生命周期
- concept: '`server_tokens.process_chunk()`'
  desc: 调用 MTMD 辅助器编码单个图像或音频块，是多模态输入进入推理前的关键处理节点
- concept: '`server_tokens.push_back()` 家族'
  desc: 多态插入接口，支持单 token、media chunk 或整个 server_tokens 对象的合并，自动维护索引映射
- concept: '`server_tokens.get_common_prefix()`'
  desc: 计算两个 token 序列的公共前缀长度，用于 KV 缓存复用优化，特别处理多模态 chunk ID 比对
- concept: '`server_http_context`'
  desc: HTTP 服务器上下文，基于 Pimpl 模式封装 cpp-httplib，管理 SSL、中间件和路由
- concept: '`server_http_context.init()`'
  desc: HTTP 初始化方法，配置 API 密钥校验、CORS、静态资源服务和线程池
- concept: '`format_error_response()`'
  desc: 将内部错误类型转换为标准化 JSON 错误响应，统一 API 错误格式
- concept: '`lora_should_clear_cache()`'
  desc: LoRA 动态切换时判断是否需清空 KV 缓存，确保生成结果一致性
- concept: '`oaicompat_chat_params_parse()`'
  desc: OpenAI 兼容聊天补全请求的参数解析器，提取模型、消息、工具、流式等参数
- concept: '`convert_responses_to_chatcmpl()`'
  desc: 将 OpenAI Responses API 请求体转换为 Chat Completion 格式，处理输入项、工具调用和推理内容
- concept: '`convert_anthropic_to_oai()`'
