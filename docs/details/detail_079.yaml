  name: HTTP 服务与启动编排 —— server.cpp 与 server-http.cpp 如何搭起'前台大厅'
  'no': 5
  points:
  - '**server.cpp 是整台服务器的导演**'
  - '- 先解析命令行参数、初始化日志与后端，再创建 `server_http_context`'
  - '- 然后按模式选择''单模型直连''还是''router 代理多模型''，利用单元 1 中的全局异常包装器保护所有端点'
  - '- 最后把一整套 REST 端点逐个注册进 HTTP 服务，并在退出时优雅收尾'
  - '**server-http.cpp 把网络细节收进一个干净壳子里**'
  - '- `server_http_context::init()` 负责 SSL、API key 校验、服务就绪检查、线程池和静态资源挂载，是服务启动前的''安检门''，配置
    CORS 中间件处理 OPTIONS 预检请求'
  - '- `server_http_context::get()` / `post()` 把路由注册成统一回调，屏蔽 httplib 的复杂度，自动完成请求/响应对象转换（`server_http_req`/`server_http_res`）'
  - '- `process_handler_response()` 同时支持普通响应与流式响应（chunked transfer），让聊天补全、嵌入、工具输出都能复用同一套输出机制，流式响应通过
    lambda 捕获保持请求和响应对象的生命周期'
  - '**从工程角度看，这一层解决的是''可运维性''**'
  - '- 它把鉴权、健康检查、CORS、日志、异常兜底等都放在门口处理'
  - '- 让上层业务逻辑专注推理本身，不必反复处理网络层边角问题'
  - '- 这也是 llama.cpp 服务端能同时服务本地调试、WebUI 和外部集成的关键'
  - '**请求响应的抽象封装**'
  - '- `server_http_req` 封装路径参数、查询参数、请求头、请求体，提供 `get_param()` 便捷访问'
  - '- `server_http_res` 区分普通响应（data 字段）和流式响应（next 回调），`is_stream()` 判断响应类型'
  - '- Pimpl 模式（`Impl` 类）隐藏 `httplib::Server` 实现细节，便于未来替换底层 HTTP 库'
