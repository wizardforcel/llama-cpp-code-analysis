  name: 基础工具与数据编码 —— 服务端运行的'精密仪器库'
  'no': 4
  points:
  - '**JSON 安全访问与校验**'
  - '- `json_value()` 模板函数提供带默认值的 JSON 安全提取，自动处理类型不匹配并记录警告日志'
  - '- `json_is_array_of_numbers()`、`json_is_array_of_mixed_numbers_strings()`、`json_is_array_and_contains_numbers()`
    提供快速的 JSON 数组类型检查'
  - '- `json_get_nested_values()` 支持路径式（如 `key1/key2`）的嵌套 JSON 值提取'
  - '**Base64 与哈希工具**'
  - '- `base64_decode()` 实现标准的 Base64 解码，处理填充字符 `=` 和非标准长度，将 4 字符组转换为 3 字节'
  - '- `fnv_hash()` 实现 FNV-1a 哈希算法，为二进制数据生成 64 位哈希字符串，用于媒体内容唯一标识'
  - '**UTF-8 编码验证**'
  - '- `validate_utf8()` 检查字符串末尾的 UTF-8 序列完整性，返回最后一个完整字符的位置，用于流式处理中截断不完整的字符'
  - '- `is_valid_utf8()` 检查整个字符串的 UTF-8 有效性，验证 1-4 字节序列的格式正确性'
  - '**ID 生成与随机数**'
  - '- `random_string()` 生成 32 字符的随机字母数字字符串，使用 `std::random_device` 和 `std::mt19937`'
  - '- `gen_chatcmplid()` 生成带 `chatcmpl-` 前缀的聊天完成 ID'
  - '- `gen_tool_call_id()` 生成随机的工具调用 ID'
  - '**错误标准化与字符串工具**'
  - '- `format_error_response()` 将内部错误类型（ERROR_TYPE_INVALID_REQUEST、ERROR_TYPE_AUTHENTICATION
    等）映射为标准的 JSON 错误响应，包含 code、message、type 字段，符合 OpenAI 错误格式'
  - '- `safe_json_to_str()` 使用 `error_handler_t::replace` 安全地将 JSON 序列化为字符串，处理非法 UTF-8'
  - '- `tokens_to_str()` 系列函数将 token 序列转换回文本字符串'
  - '**多模态提示词处理**'
  - '- `process_mtmd_prompt()` 处理包含 base64 媒体数据的提示词，调用 MTMD 库进行图像/音频编码，生成 server_tokens'
  - '- `tokenize_mixed()` 处理字符串、token ID 数组或混合数组的输入分词'
  - '- `tokenize_input_prompts()` 处理多个子提示，支持批量处理'
  - '**语法触发器封装**'
  - '- `server_grammar_trigger` 类封装 `common_grammar_trigger`，提供 JSON 序列化和反序列化能力，用于结构化输出控制'
