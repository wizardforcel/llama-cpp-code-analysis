  - '**三明治架构**：上层应用（CLI/Server/Examples）→ 中间层（Common 工具库）→ 核心引擎（llama.cpp + ggml），层次分明且可独立使用'
  - '**模型即文件**：GGUF 格式统一封装模型权重、词表、架构元数据，实现「一次转换，到处运行」的跨平台模型分发'
