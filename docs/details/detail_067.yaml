learning_targets:
- 理解 llama.cpp 项目「零依赖、跨平台」的设计哲学与工程实现
- 掌握支持文本、多模态、扩散等百余种模型架构的统一接口设计
- 熟悉 llama-cli、llama-completion、llama-server 等核心工具链的功能边界与使用场景
- 能够独立完成从模型下载、量化到部署推理的全流程操作
- 理解 GGUF 格式作为「通用集装箱」在模型分发中的核心作用
- 掌握基于 server_context 的 CLI 交互式推理架构与流式响应处理机制
- 理解 CLI 工具的信号处理机制与命令行自动补全实现
- 掌握 completion 工具的文件检查与会话管理辅助函数
life_analogy:
- 想象 llama.cpp 是一座「万能发电站」：
- '- **GGUF 模型文件** = 标准化的燃料棒（统一封装，即插即用）'
- '- **跨平台后端（Metal/CUDA/Vulkan）** = 多种发电机组（苹果/英伟达/AMD 等都能用）'
- '- **llama-cli / llama-completion** = 控制面板与仪表（用户直接操作的入口）'
- '- **server_context** = 中央调度室（管理并发请求、KV 缓存、采样策略）'
- '- **量化工具（llama-quantize）** = 燃料精炼厂（把 FP32 压缩成 Q4/Q8，减重不减效）'
- '- **多模态支持（mtmd）** = 多燃料兼容系统（既能烧煤/文本，也能烧天然气/图像音频）'
- '- **信号处理与自动补全** = 电站的安全阀与智能控制台（保障操作安全，提升交互效率）'
- 就像发电站需要精密调度燃料、涡轮和电网，llama.cpp 也需要协调模型加载、内存管理与推理计算，才能在不同硬件上高效「发电」。
'no': 66
summary:
- concept: 零依赖设计
  desc: 纯 C/C++ 实现，无外部库依赖，单文件可编译，移植性极强
- concept: GGUF 格式
  desc: 统一封装权重、词表、元数据的「模型集装箱」，实现跨平台一次转换到处运行
- concept: 三明治架构
  desc: 上层应用（CLI/Server）→ 中间层（Common 工具库）→ 核心引擎（llama.cpp + ggml）的层次化设计
- concept: llama-cli
  desc: 现代交互式聊天客户端，基于 server_context 支持多轮对话、多媒体输入与流式输出
- concept: llama-completion
  desc: 经典文本生成工具，展示最基础的 prompt→tokenize→generate→sample 四步流水线
- concept: llama-server
  desc: OpenAI 兼容 API 服务，支持多模型路由、并发槽位、RPC 远程推理
- concept: llama-quantize
  desc: 模型量化工具，支持 Q4_0/Q4_K/Q8_0 等数十种精度，平衡性能与体积
- concept: 多模态支持
  desc: 通过 mmproj（多模态投影器）桥接视觉/音频编码器与 LLM，支持 LLaVA/Qwen-VL 等
- concept: 流式生成
  desc: CLI 中基于 server_response_reader 的异步结果拉取，实现边生成边显示
- concept: 会话缓存
  desc: prompt cache 机制复用历史 KV 状态，加速重复前缀的推理
- concept: Self-Extend
  desc: 通过分组注意力（grp_attn）扩展上下文窗口，突破训练长度限制
- concept: 抗提示词（antiprompt）
  desc: 反向提示词触发停止或交互模式切换，实现对话流程控制
- concept: 信号处理机制
  desc: should_stop/signal_handler/sigint_handler 三层中断处理，支持优雅退出与强制退出
- concept: 命令行自动补全
  desc: 基于文件系统遍历与命令前缀匹配的智能补全，提升 CLI 交互体验
- concept: 文件输入处理
  desc: load_input_file/file_exists/file_is_empty 构成完整的文件输入验证与加载体系
- concept: 聊天模板格式化
  desc: format_chat 将消息历史转换为 Jinja 模板，支持 reasoning_format 与 thinking 标签
