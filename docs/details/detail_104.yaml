life_analogy:
- 量化测试体系就像**精密仪器的质检流水线**：
- '- **量化函数测试（test-quantize-fns）** = **出厂前的精度校准室**'
- '  - 三维误差检测 = 显微镜下的多维度质检（总量化误差、参考对比、点积精度）'
- '  - 不同类型阈值 = 不同产品的精度等级标准（军工级/民用级）'
- '  - 合成测试数据 = 标准件（0.1+2*cos函数），保证测试可重现'
- '- **量化性能基准（test-quantize-perf）** = **生产线速度测试**'
- '  - L1/L2/L3缓存测试 = 不同规模仓库的存取速度测试'
- '  - CPU周期计数 = 秒表精确计时（纳秒级）'
- '  - 吞吐量计算 = 每小时处理多少货物（GB/s）'
- '  - 内存对齐偏移 = 测试不同货架摆放方式对效率的影响'
- '- **量化统计分析（test-quantize-stats）** = **误差大数据分析中心**'
- '  - 1024桶直方图 = 把误差分成1024个格子精细统计'
- '  - 分位数计算 = 找出95%产品的误差上限'
- '  - 多线程分块 = 多条质检线同时工作'
- '- **量化类型选择快照** = **产品规格档案库**'
- '  - 远程模型元数据 = 从总部获取产品图纸'
- '  - 模拟张量构建 = 搭建1:1模型样品'
- '  - 快照文件对比 = 与历史标准档案核对'
- '- **分词器测试** = **翻译人员的双语对照考试**'
- '  - 往返一致性 = 中→英→中翻译结果必须一致'
- '  - Unicode全覆盖 = 所有语言的字符都要测试'
- '  - HF对齐测试 = 与行业金牌翻译官（AutoTokenizer）对比'
- '  - CFFI封装 = Python与C/C++库之间的外交官（LibLlama/LibLlamaModel）'
- '  - 生成器家族 = 自动化出题机器人（各种边界、随机、Unicode组合）'
- '  - Python-HF基准测试（test-tokenizer-0.py） = 用金牌翻译官的标准答案做对照参考'
- '- **浮点精度测试** = **高精度与低精度天平的对照实验**'
- '  - 32位全遍历 = 测试所有可能的重量组合'
- '  - round_orig vs round_float = 药物天平 vs 厨房秤'
- '  - nextafterf = 相邻刻度之间的误差容许'
