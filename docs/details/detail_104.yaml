  name: HuggingFace分词对齐测试 —— 与「黄金标准」对标
  'no': 7
  points:
  - '**为什么需要HF对齐？** llama.cpp的分词器必须与HuggingFace Transformers行为一致，否则用户会得到不同的结果'
  - '**LibLlama CFFI封装**：通过Python cffi直接调用libllama.so（LibLlama.__init__ + _load_libllama_cffi），避免进程间通信开销'
  - '**LibLlamaModel资源管理**：__init__ 加载模型+vocab_only模式创建context，tokenize/detokenize封装底层API并自动扩容缓冲区，free()释放资源'
  - '**测试用例生成器家族**：（1）预定义边界用例（generator_custom_text/edge_cases）、（2）全Unicode遍历（generator_unicodes）、（3）ASCII左右剥离组合（generator_ascii_lr_strip）、（4）撇号组合（generator_apostrophe）、（5）词表单词遍历（generator_vocab_words）、（6）特殊token剥离（generator_added_lr_strip）、（7）随机生成变体（generator_random_*）'
  - '**TokenizerGroundtruth**：包装AutoTokenizer，自动检测BOS/EOS添加行为（__init__ + encode +
    decode），作为黄金标准'
  - '**TokenizerLlamaCpp**：llama.cpp分词器封装（__init__ + encode + decode），与LibLlamaModel绑定'
  - '**Python-HF基准对比（test-tokenizer-0.py）**：使用AutoTokenizer.from_pretrained加载HF模型，encode文本并统计耗时（t_start/t_end），输出token
    ID序列到.tok文件作为对照参考'
  - '**分词性能统计**：分别统计encode/decode耗时，对比llama.cpp与HF实现的性能差异（compare_tokenizers中的t0-t4计时）'
  - '**错误差异定位**：`find_first_mismatch` 找到首个不一致的位置，便于定位问题'
  - '**__main__入口**：遍历多种tokenizer（llama-spm/phi-3/gemma/baichuan/bert-bge等），批量执行测试'
