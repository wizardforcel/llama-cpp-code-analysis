  name: 浮点精度一致性测试 —— double到float的「无形之手」
  'no': 8
  points:
  - '**为什么关心浮点精度转换？** 某些关键函数（如quantize_row_q4_0_ref）使用double计算再转float，必须确保转换不改变结果'
  - '**32位浮点全遍历**：从UINT32_MAX递减到0，通过位模式转换生成所有可能的float值（包括NaN、Inf、非正规数）'
  - '**round_orig vs round_float**：对比 `round(double)` + 8 与 `roundf(float)` + 8 的整数部分差异'
  - '**F16C指令集条件测试**：仅在支持F16C指令时测试SILU激活函数，通过 `_cvtsh_ss`/`_cvtss_sh` 在FP16和FP32间转换'
  - '**nextafterf邻近检查**：当FP16转换后的结果不匹配时，验证它们是否是相邻的浮点数（最近邻原则）'
  - '**GELU不测试原因**：GELU本身就是tanh近似，精度要求低，因此不在本测试范围'
