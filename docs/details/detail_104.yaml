  name: 量化函数质量防线 —— 确保压缩不「失真」
  'no': 1
  points:
  - '**为什么需要量化误差测试？** 量化是模型压缩的核心，但必须确保压缩后的权重不会显著影响推理精度'
  - '**三种误差度量维度**：总量化误差（roundtrip RMSE）、参考实现误差（与ggml原始参考对比）、点积误差（量化后向量点积精度）'
  - '**多类型差异化阈值**：不同量化类型（Q1_0/Q2_K/TQ1_0/NVFP4等）有不同的误差容忍上限，体现精度与压缩率的权衡'
  - '**合成测试数据生成**：使用 `0.1 + 2*cosf(i + offset)` 生成确定性的测试向量，保证测试可重现（generate_data）'
  - '**ggml_type_traits 接口**：通过 `from_float`、`to_float`、`vec_dot` 等统一接口测试所有量化类型的往返一致性'
  - '**基础工具函数**：`array_rmse` 计算两数组RMSE、`dot_product` 计算float参考点积，为误差测量提供数学基础'
