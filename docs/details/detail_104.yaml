- contents:
  - 阅读 `tests/test-quantize-fns.cpp` 第39-91行，理解三种误差测试的实现差异：
  - 1. `total_quantization_error()` 如何进行完整的量化-反量化往返？
  - 2. `reference_quantization_error()` 为什么要做两次 `from_float`？（FIXME注释提示）
  - 3. `dot_product_error()` 中 `qfns_cpu->vec_dot` 与 `dot_product()` 参考计算的差异是什么？
  - 思考问题：
  - '- 为什么测试数据使用 `0.1 + 2*cosf(i + offset)` 而不是随机数？'
  - '- `MAX_QUANTIZATION_TOTAL_ERROR`、`MAX_QUANTIZATION_REFERENCE_ERROR`、`MAX_DOT_PRODUCT_ERROR`
    在源码中的定义位置和典型值是多少？'
  - '- 不同量化类型（Q1_0/Q2_K/TQ1_0/NVFP4）的误差阈值为什么不同？'
  - '- `array_rmse()` 为什么先对差值做double累加再开平方？'
  - '- `generate_data()` 在test-quantize-fns.cpp和test-quantize-perf.cpp中的作用是什么？'
