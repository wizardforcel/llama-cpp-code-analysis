- 学习量化误差的统计分析方法（直方图、分位数、多线程并行统计）
- 理解量化类型选择快照机制（远程模型元数据获取、模拟张量构建、快照文件对比、命令行入口参数解析）
- 掌握BPE/SPM分词器的往返一致性测试原理与Unicode全覆盖验证
- 学习tokenizer与HuggingFace对齐测试方法（CFFI封装、LibLlamaModel初始化与缓冲区管理、性能对比、错误定位）
