  name: XXH32/XXH64 经典哈希 —— 流式状态管理的"双子星"
  'no': 4
  points:
  - '**XXH32/XXH64 非流式一次性接口**'
  - '- `XXH32()` / `XXH64()` 直接计算输入数据的 32/64 位哈希值'
  - '- 内部根据对齐检查和强制对齐标志选择最优路径（XXH32_endian_align / XXH64_endian_align）'
  - '**流式状态生命周期管理**'
  - '- `XXH32_createState()` / `XXH64_createState()` 分配状态对象'
  - '- `XXH32_reset()` / `XXH64_reset()` 用种子初始化 4 个累加器 v[0..3]'
  - '- `XXH32_update()` / `XXH64_update()` 流式消费输入，缓冲不满 16/32 字节时暂存不处理'
  - '- `XXH32_digest()` / `XXH64_digest()` 合并 4 个累加器并处理尾部字节，输出最终哈希'
  - '- `XXH32_freeState()` / `XXH64_freeState()` 释放状态内存'
  - '- `XXH32_copyState()` / `XXH64_copyState()` 通过 memcpy 复制状态'
  - '**规范化表示（Canonical）转换**'
  - '- `XXH32_canonicalFromHash()` / `XXH64_canonicalFromHash()` 把哈希值转为大端序规范表示'
  - '- `XXH32_hashFromCanonical()` / `XXH64_hashFromCanonical()` 从大端序规范还原为本机格式'
  - '- 解决跨平台存储和传输时的字节序兼容问题'
  - '**底层读取与字节序原语**'
  - '- `XXH_read32()` 未对齐内存的 32 位读取，有多种条件编译变体'
  - '- `XXH_readLE32()` 小端序读取、按平台自动选择交换或直接读取'
  - '- `XXH_readBE32()` 大端序读取'
  - '- `XXH_readLE32_align()` 按对齐状态选择最优路径'
  - '- `XXH_isLittleEndian()` 通过联合体运行时检测字节序'
  - '- `XXH_swap32()` 无内建时的手动字节交换'
  - '`XXH_writeLE64()` 按小端序写入 64 位值'
