exercises:
- contents:
  - 阅读 `examples/gguf/gguf.cpp` 中 `to_string()`、`gguf_ex_write()`、`gguf_ex_read_0()`、`gguf_ex_read_1()`
    四个函数。
  - 梳理以下问题：
  - 1. `to_string()` 模板函数在哪些场景被使用？
  - 2. 写入了哪些类型的元数据？
  - 3. 数组元数据和张量元数据分别如何注册？
  - 4. 只读元数据与完整加载在参数配置上有何差别？
  - 5. `check_data` 分支是如何验证张量数据一致性的？
