  - 2. `canonicalFromHash` 和 `hashFromCanonical` 解决了什么跨平台问题？
  - 3. XXH64_update 内部如何处理不满 32 字节的尾部数据？
  - 4. 流式状态结构中 `memsize` 和 `total_len` 各自追踪什么？
