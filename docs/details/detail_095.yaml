  name: XXH3 内核与 SIMD 多后端 —— 极速哈希的"六引擎赛车"
  'no': 5
  points:
  - '**XXH3 长度分派策略**'
  - '- `XXH3_64bits_internal()` 按输入长度精确分派：0-16B 走 `XXH3_len_0to16_64b`、17-128B 走 `XXH3_len_17to128_64b`、129-240B
    走 `XXH3_len_129to240_64b`、超长走 hashLong 路径'
  - '- `XXH3_len_0to16_64b` 进一步细分为 0B、1-3B（`XXH3_len_1to3_64b`）、4-8B（`XXH3_len_4to8_64b`）、9-16B（`XXH3_len_9to16_64b`）'
  - '- `XXH3_len_17to128_64b` 通过组合多个 16 字节混合（`XXH3_mix16B`）覆盖中长度'
  - '- `XXH3_len_129to240_64b` 用循环 + 最终雪崩处理中长输入'
  - '**长输入条纹处理**'
  - '- `XXH3_hashLong_internal_loop()` 按块和条纹循环处理长输入，周期性扰乱累加器'
  - '- `XXH3_mergeAccs()` 合并 8 个累加器通道并执行最终雪崩，内部调用 `XXH3_mix2Accs()` 逐对处理'
  - '- `XXH3_mix2Accs()` 将两个累加器通道与 secret 异或后通过 128 位乘法折叠为单个 64 位值'
  - '- `XXH3_hashLong_64b_internal()` 是长输入 64 位哈希的通用内部实现'
  - '- `XXH3_hashLong_64b_default()` 使用内置默认 secret'
  - '- `XXH3_hashLong_64b_withSecret()` 使用调用方提供的 secret'
  - '- `XXH3_hashLong_64b_withSeed()` / `XXH3_hashLong_64b_withSeed_internal()` 按
    seed 生成或复用 secret'
  - '**64 位哈希四种调用变体**'
  - '- `XXH3_64bits()` 无种子、默认 secret'
  - '- `XXH3_64bits_withSeed()` 使用 64 位种子'
  - '- `XXH3_64bits_withSecret()` 使用自定义 secret'
  - '- `XXH3_64bits_withSecretandSeed()` 同时使用两者'
  - '**SIMD 六路并行加速**'
  - '- `XXH3_accumulate_512_scalar()` + `XXH3_scalarRound()` 标量回退路径'
  - '- `XXH3_accumulate_512_sse2()` / `XXH3_scrambleAcc_sse2()` SSE2 128 位向量'
  - '- `XXH3_accumulate_512_avx2()` / `XXH3_scrambleAcc_avx2()` AVX2 256 位向量'
  - '- `XXH3_accumulate_512_avx512()` / `XXH3_scrambleAcc_avx512()` AVX512 512 位向量'
  - '- `XXH3_accumulate_512_neon()` / `XXH3_scrambleAcc_neon()` ARM NEON，含 `XXH_vld1q_u64`/`XXH_vmlal_low_u32`/`XXH_vmlal_high_u32`
    向量原语'
  - '- `XXH3_accumulate_512_vsx()` / `XXH3_scrambleAcc_vsx()` PowerPC VSX，含 `XXH_vec_revb`/`XXH_vec_loadu`/`XXH_vec_mulo`/`XXH_vec_mule`'
  - '- `XXH3_accumulate_512_sve()` / `XXH3_accumulate_sve()` ARM SVE 可伸缩向量'
  - '**标量核心原语**'
  - '- `XXH3_scalarRound()` 单通道累加：读入、异或 secret、乘加'
  - '- `XXH3_scalarScrambleRound()` 单通道扰乱：异或移位、secret 混合、乘素数'
  - '- `XXH3_scrambleAcc_scalar()` 遍历所有通道'
  - '- `XXH_mult32to64()` / `XXH_mult64to128()` / `XXH3_mul128_fold64()` 不同宽度乘法'
  - '- `XXH_mult32to64_add64()` 32 位乘加融合，AArch64 用 UMADDL 内联汇编'
  - '- `XXH_xorshift64()` 基础异或移位'
  - '- `XXH3_avalanche()` 最终雪崩，适合已部分混合的输入'
  - '- `XXH3_rrmxmx()` 更强混合，适合未预先混合的输入'
  - '**内存管理**'
  - '- `XXH_malloc()` / `XXH_free()` 标准内存分配释放'
  - '- `XXH_alignedMalloc()` 通过偏移记录实现对齐内存分配'
  - '- `XXH_alignedFree()` 通过对齐偏移还原并释放'
