learning_targets:
- 掌握 GGUF 文件的写入流程，包括元数据、张量信息与数据的写入方式
- 理解 GGUF 的两种读取模式：仅读取元数据与同时加载张量数据
- 掌握 gguf-hash 工具如何实现张量级与模型级哈希校验
- 理解 xxh64、SHA-1、SHA-256 与 UUIDv5 在模型完整性校验中的作用
- 了解 SHA-1、SHA-256、XXH3 的流式哈希实现思路
- 掌握 XXH32/XXH64 经典哈希的流式状态管理与规范化表示转换
- 理解 XXH3 按输入长度分派的短/中/长路径及 SIMD 多后端实现
- 掌握 llama2.c checkpoint 到 GGUF 的转换流程与权重重排方式
- 理解 GGUF 词表双源加载与 SentencePiece 空白转义策略
- 了解 deprecation-warning 与 gen-docs 工具在项目生态中的辅助作用
life_analogy:
- 把本章整套工具想成一个**模型集装箱与质检工厂**：
- '- **GGUF 文件** = 标准集装箱，元数据是箱单，张量数据是货物本体'
- '- **gguf.cpp** = 装箱/拆箱演练场，教你怎么写清单、装货和验货'
- '- **gguf-hash** = 指纹识别中心，一箱货物可以整箱验，也可以逐件验'
- '- **manifest** = 官方验收单，用来对照指纹是否一致'
- '- **SHA-1 / SHA-256 / xxh64** = 三种不同风格的指纹机器，安全和速度取舍不同'
- '- **XXH32/XXH64 经典流式 API** = 可以逐批投入的指纹采集器，支持 createState/reset/update/digest 四步流程'
- '- **XXH3 SIMD 多后端** = 指纹工厂里不同型号的高速流水线（AVX512/AVX2/SSE2/NEON/VSX/SVE），根据硬件自动选最优'
- '- **XXH3_mix2Accs / XXH3_mergeAccs** = 指纹工厂的总装车间，把 8 条独立流水线的半成品最终合并为成品指纹'
- '- **UUIDv5** = 给集装箱发全球唯一的"身份证号码"'
- '- **llama2.c 转 GGUF** = 把原始矿石送进精炼炉，重新编号、归类、标准化'
- '- **词表加载** = 翻译字典入库，既要装词，也要装每个词的分数'
- '- **deprecation-warning** = 旧窗口的迁址告示牌，提醒你去新窗口办事'
- '- **gen-docs** = 自动写说明书的文员，把参数表整理成统一文档'
- 这一章的核心不是模型推理本身，而是围绕模型文件建立一套"可写、可读、可校验、可迁移、可维护"的基础工具链。
