  title: 追踪 gguf-hash 的双层哈希与清单校验链路
- contents:
  - 阅读 `deps/xxhash/xxhash.h` 中与 XXH32 和 XXH64 相关的函数：`XXH32()`、`XXH32_createState()`、`XXH32_reset()`、`XXH32_update()`、`XXH32_digest()`、`XXH32_freeState()`、`XXH32_copyState()`、`XXH32_canonicalFromHash()`、`XXH32_hashFromCanonical()`，以及
    XXH64 对应的完整函数组。
  - 完成以下分析：
