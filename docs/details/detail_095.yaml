  - 2. `hash_print_usage()` 列出了哪些命令行选项？
  - 3. `hash_params_parse()` 与 `hash_params_parse_ex()` 的分工是什么？
  - 4. 每种哈希算法的状态对象是如何创建与复用的？
  - 5. 张量级哈希与模型级哈希分别覆盖什么范围？
  - 6. manifest 什么时候返回 Ok、Mismatch、NotFound？
