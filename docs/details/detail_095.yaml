  name: XXH3 流式状态与 Secret 生成 —— 哈希工厂的"流水线控制室"
  'no': 6
  points:
  - '**流式状态生命周期**'
  - '- `XXH3_createState()` 通过 `XXH_alignedMalloc` 分配 64 字节对齐的状态对象'
  - '- `XXH3_freeState()` 通过 `XXH_alignedFree` 释放对齐内存'
  - '- `XXH3_copyState()` 通过 memcpy 完整复制状态'
  - '**状态重置四种变体**'
  - '- `XXH3_reset_internal()` 内部统一重置：清零缓冲区、初始化 8 个累加器、设置 seed/secret/条纹参数'
  - '- `XXH3_64bits_reset()` 使用默认 secret、无种子'
  - '- `XXH3_64bits_reset_withSeed()` 使用种子，seed==0 时等同默认'
  - '- `XXH3_64bits_reset_withSecret()` 使用调用方提供的 secret，校验最小尺寸'
  - '- `XXH3_64bits_reset_withSecretandSeed()` 同时使用两者'
  - '**流式更新与摘要**'
  - '- `XXH3_consumeStripes()` 消费条纹：处理完整块（含扰乱）后处理剩余部分'
  - '- `XXH3_update()` 通用流式更新：缓冲不足时暂存，缓冲满时触发条纹消费'
  - '- `XXH3_64bits_update()` 对外暴露的 64 位更新入口'
  - '- `XXH3_digest_long()` 在不修改原始状态的前提下生成临时累加器并处理尾部'
  - '- `XXH3_64bits_digest()` 完成 64 位流式哈希，短输入走 buffered 路径，长输入走 mergeAccs'
  - '**自定义 Secret 生成**'
  - '- `XXH3_initCustomSecret_scalar()` 标量实现：交替对默认 secret 加/减 seed'
  - '- `XXH3_initCustomSecret_sse2()` SSE2 实现：128 位向量循环'
  - '- `XXH3_initCustomSecret_avx2()` AVX2 实现：256 位向量手工展开 6 块'
  - '- `XXH3_initCustomSecret_avx512()` AVX512 实现：512 位向量循环'
  - '- `XXH3_generateSecret()` 从自定义种子生成高熵 secret：先填充，再用 XXH128 多轮哈希扰动'
  - '- `XXH3_generateSecret_fromSeed()` 从 64 位种子生成默认大小的 secret'
