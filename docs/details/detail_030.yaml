  name: RWKV6 基础构建器 —— 时间与通道混合的「双重奏」
  'no': 1
  points:
  - '**`llm_build_rwkv6_base` 是什么？**'
  - '- RWKV6 图构建器的基类，封装时间混合（time-mix）与通道混合（channel-mix）两大核心子图'
  - '- 继承自 `llm_graph_context`，可通过子类复用 RWKV 的循环状态与线性注意力计算'
  - '**`build_rwkv6_channel_mix` 解析**'
  - '- 通过 `x_prev - cur` 计算「token shift」差异 `sx`'
  - '- 用 `lerp_k/lerp_r` 两个可学习权重控制当前与前一时刻的混合比例'
  - '- `receptance = sigmoid(W_r · xr)`、`key = relu(W_k · xk)^2`、`value = r ⊙ W_v
    · k` 构成通道混合公式'
  - '- `LLM_ARCH_RWKV6` 分支专用，其他架构直接 GGML_ABORT'
  - '**`build_rwkv6_time_mix` 解析**'
  - '- 输入张量维度计算：`n_embd / head_size` 得到头数，`n_head_kv` 支持 GQA 风格的多头键值'
  - '- **QRWKV 识别**：当 `layer.time_mix_first == nullptr` 时切换到 sigmoid 门控与 `gated_linear_attn`
    算子'
  - '- **Fused lerp**：若存在 `time_mix_lerp_fused`，则一次性投影出 5 路（W/K/V/R/G），通过 `view_2d`
    切片获取'
  - '- **Legacy lerp**：否则逐项 `lerp_w/k/v/r/g` 与 `sx` 混合（兼容旧权重）'
  - '- **多头键值广播**：`n_head_kv != n_head` 时通过 `repeat` 把 K/V 复制到所有注意力头'
  - '- **WKV 算子**：`w = exp(-exp(w1→tanh→w2 + decay))` 形成指数衰减权重'
  - '- **QRWKV vs RWKV6**：前者用 `ggml_gated_linear_attn(k, v, r, w, state, scale)`，后者用
    `ggml_rwkv_wkv6(k, v, r, first, w, state)`'
  - '- **状态持久化**：`build_rs` 读取 `s_l` 状态、`ggml_cpy` 回写到对应 kv_head 槽位'
  - '- **GroupNorm**：RWKV6（非 QRWKV）在头部维度做 group norm 并附加 `time_mix_ln / time_mix_ln_b`
    缩放偏移'
