  name: Qwen3Next 混合架构 —— DeltaNet + Attention 的「双层交响」
  'no': 7
  points:
  - '**架构核心**'
  - '- 奇数层用 Linear Attention（DeltaNet），偶数层用标准 Attention'
  - '- 通过 `hparams.is_recurrent(il)` 区分两种层类型'
  - '- 残差结构：`cur = linear/attn_out + inpSA`，`ffn_residual = cur`（保留 MoE 残差位置）'
  - '**`build_layer_attn`（标准 Attention）**'
  - '- **联合 QG 投影**：`Qcur_full = wq · cur`，reshape 为 `[head_dim*2, n_head, n_tokens,
    1]`'
  - '- **拆分 Q/Gate**：`Qcur` 取前半，`gate` 取后半，通过 `view_4d` 实现零拷贝'
  - '- **Q/K Norm**：Q 与 K 都做 RMSNorm（Qwen 系列特点）'
  - '- **Gated Attention**：`cur = sigmoid(gate) * attn_output`，最后用 `wo` 投影回 n_embd'
  - '**`build_layer_attn_linear`（线性注意力）**'
  - '- **`build_qkvz`**：根据是否存在 `wqkv` 选择 fused 路径或 legacy 路径'
  - '- **Fused 路径**：`qkv_mixed = wqkv · cur`、`z = wqkv_gate · cur`，性能更优'
  - '- **Legacy 路径**：`ssm_in` 一次性投影出 Q/K/V/Z，再通过 `view_4d` 切片'
  - '- **β/α 投影**：`ssm_beta_alpha` 投影出 β 与 α，β 用 sigmoid 门控，α 经 softplus 与 dt_bias'
  - '- **Gate = -A_log · softplus(α + dt_bias)**：实现 delta rule 的衰减因子'
  - '- **Conv1d**：把 `conv_states` 与 `qkv_mixed` 拼接后用 `ggml_ssm_conv` 做因果卷积'
  - '- **L2 Normalization**：Q/K 做 `ggml_l2_norm(eps)` 提升训练稳定性'
  - '- **多头广播**：若 K 头数 ≠ V 头数，对 Q/K 做 repeat 广播（兼容 fused GDN 的广播配置）'
  - '- **`build_delta_net`**：调用基础类的方法，自动选择 AR/Fused/Chunking 模式'
  - '- **输出门控**：`build_norm_gated(ssm_norm)` 把 z 通过 SiLU 后与 RMSNorm 结果相乘'
  - '- **Conv 状态回写**：`ggml_cpy` 把 `last_conv_states` 写回 `conv_states_all` 对应槽位'
  - '**`build_layer_ffn` 支持 MoE + 共享专家**'
  - '- MoE：`build_moe_ffn` 路由 + 专家并行，激活函数 SiLU，gating SOFTMAX'
  - '- Shared Expert：单独构建 SwiGLU FFN 并通过 `ffn_gate_inp_shexp` 做 sigmoid 门控'
  - '- Dense FFN：用于非 MoE 层（Qwen3Next 当前未启用）'
