  name: RWKV6 主模型图构建 —— 经典 RWKV 的「完整推理骨架」
  'no': 2
  points:
  - '**`llm_build_rwkv6` 概览**'
  - '- 在基类基础上完成 token embedding、归一化、N 层循环与最终 output 的完整推理图'
  - '- 校验 `token_shift_count == 2`，表示每层需要保存 attention 与 FFN 两个上一时刻 token'
  - '**Token shift 状态加载**'
  - '- 通过 `build_rwkv_token_shift_load` 读取上一时刻的 token shift 缓存'
  - '- 切分为 `att_shift` 与 `ffn_shift` 两个独立张量，分别给时间混合与通道混合使用'
  - '**`x_prev` 拼接**'
  - '- 把上一时刻 token shift 与当前时刻 `[0..n_seq_tokens-1]` 拼接，形成包含「历史 + 当前」的输入'
  - '- 这是 RWKV 类线性注意力实现「类 RNN 推理」的关键技巧'
  - '**双层结构：Time-Mix + Channel-Mix**'
  - '- `att_norm → time_mix → ffn_inp(+inpL) → ffn_norm → channel_mix → ffn_out(+ffn_inp)`'
  - '- `time_mix` 由 `build_rwkv6_time_mix` 完成；`channel_mix` 调用基类的 `build_rwkv6_channel_mix(LLM_ARCH_RWKV6)`'
  - '**Token shift 状态存储**'
  - '- 取 `att_norm` 与 `ffn_norm` 的最后一个时间步作为下一时刻的 shift 输入'
  - '- 通过 `build_rwkv_token_shift_store` 把结果写回 `r_l` 缓存'
  - '**Rescale 缩放与控制向量**'
  - '- `rescale_every_n_layers != 0` 时每隔 N 层将输出乘以 0.5（训练稳定性技巧）'
  - '- `build_cvec` 注入控制向量（control vector）以支持 Activation Steering'
  - '**最终输出**'
  - '- `output_norm` → `output (lora_mm)` → `t_logits`，并通过 `ggml_build_forward_expand`
    把 logits 加入前向图'
