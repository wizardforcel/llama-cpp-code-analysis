  name: Kimi-Linear 混合架构 —— KDA 自回归 + MLA 的「双剑合璧」
  'no': 9
  points:
  - '**Kimi-Linear 是什么？**'
  - '- 月之暗面（Moonshot）Kimi 模型的线性注意力实现'
  - '- **核心特点**：交替使用 KDA（Kimi Delta Attention）和 MLA（Multi-head Latent Attention）'
  - '- KDA 是 DeltaNet 的变体（KDA：gate per-element；GDA：gate per-head）'
  - '**`causal_conv1d` 工具函数**'
  - '- 对 Q/K/V 分别做 causal conv1d 处理'
  - '- **QKV 状态共享**：conv_state_all 共享一个大张量 `[3*conv_state_size, n_seqs]`，按 Q/K/V 切片'
  - '- **状态回写**：`last_conv_x` 取拼接后最后 `d_conv-1` 行写回对应 kv_head 的槽位'
  - '- **权重 reshape**：`[d_conv, 1, d_inner, 1]` → `[d_conv, d_inner]` 适配 `ggml_ssm_conv`'
  - '**KDA 自回归层**'
  - '- **g1 计算**：`g1 = softplus(f_b · f_a(cur) + dt_bias) * A_log`'
  - '- **A_log 已被预处理**：convert_hf_to_gguf.py 中已经做过 `-exp(A_log)`，所以直接相乘'
  - '- **beta 计算**：`beta = sigmoid(ssm_beta · cur)`'
  - '- **L2 Normalization**：Q/K 做 `ggml_l2_norm(eps_norm)`'
  - '- **DeltaNet 调用**：通过 `build_delta_net(Qcur, Kcur, Vcur, g1, beta, state, il)`
    自动选 AR/Chunking 路径'
  - '- **输出门控 g2**：`g2 = g_b · g_a(cur_2d)`'
  - '- **Sigmoid Gating（注意不是 SiLU）**：`gated = RMSNorm(out) * sigmoid(g2)`'
  - '- **KV Head 状态回写**：`ggml_cpy(new_state → ssm_states_all[kv_head*size])`'
  - '**MLA 层（带 KV 缓存）**'
  - '- **KV 压缩**：`kv_cmpr_pe = wkv_a_mqa · cur` → `[kv_lora_rank + qk_rope_head_dim,
    n_tokens]`'
  - '- **kv_c 归一化**：`build_norm(kv_cmpr, attn_kv_a_norm, RMS)`'
  - '- **MLA 缓存路径（wk_b && wv_b）**：`q_nope = Qcur[:qk_nope] · wk_b → kv_lora_rank`，与
    `q_pe` 拼接'
  - '- **MLA 无缓存路径**：退化为 MHA，KV 通过 `wkv_b` 解压，`k_pe` 通过 `repeat` 广播到所有头'
  - '- **无 RoPE**：Kimi MLA 不使用位置编码（与标准 MLA 不同）'
  - '**FFN：Dense + MoE 混合**'
  - '- 前 `n_layer_dense_lead` 层用标准 SwiGLU FFN（`LLM_FFN_SILU`）'
  - '- 之后用 MoE：`build_moe_ffn` + 共享专家（无 sigmoid 门控）'
  - '- **MoE Renormalize**：传入 `true` + `expert_weights_scale` 做权重归一化'
