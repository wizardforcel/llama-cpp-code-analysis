  name: Qwen3.5 与 Qwen3.5-MoE —— MRoPE 加持的工业级 DeltaNet 落地
  'no': 8
  points:
  - '**Qwen3.5 vs Qwen3Next 关键差异**'
  - '- 引入 IMRoPE（Interleaved MRoPE），通过 `hparams.rope_sections` 控制多模态 RoPE'
  - '- 所有线性层显式支持 LoRA 缩放（`*_s` 参数），方便在运行时动态调整'
  - '- 优化后的 `build_qkvz`：直接用 `wqkv` 与 `wqkv_gate`，没有 legacy 路径'
  - '**`build_layer_attn`（标准 Attention）**'
  - '- 与 Qwen3Next 类似，但 Q/K Norm 与 RoPE 都使用 IMRoPE（`ggml_rope_multi`）'
  - '- **Q 拆分**：`Qcur = view_3d(Qcur_full, head_dim, n_head, n_tokens)` 取前半'
  - '- **Gate 拆分**：`gate = view_3d` 取后半，再用 `cont_2d` 整理为 `[head_dim*n_head, n_tokens]`'
  - '- **`ggml_rope_multi` 旋转**：传入 `sections` 数组实现多模态位置编码'
  - '**`build_layer_attn_linear`（DeltaNet 层）**'
  - '- 与 Qwen3Next 类似，但输入投影单独：`ssm_beta`、`ssm_alpha` 不再共用权重'
  - '- **Gate 公式**：`-A_log · softplus(alpha + dt_bias)`（与 Qwen3Next 一致）'
  - '- **Conv1d + SiLU + L2 Norm**：标准的 causal conv → SiLU → L2 norm 流程'
  - '- **多头广播优化**：只在 `!fused_gdn_ar || !fused_gdn_ch` 时才做 repeat，否则由 fused 算子内部广播'
  - '**Qwen3.5 Dense FFN（`build_layer_ffn`）**'
  - '- `GGML_ASSERT(ffn_gate_inp == nullptr)`：Qwen3.5 标准版不含 MoE'
  - '- 显式传入 `*_s` LoRA 缩放参数：`ffn_up_s / ffn_gate_s / ffn_down_s`'
  - '- SwiGLU 并行门控（`LLM_FFN_SILU` + `LLM_FFN_PAR`）'
  - '**Qwen3.5-MoE 变体**'
  - '- 与 Qwen3Next 类似但使用 `build_qkvz`（fused-only）+ 单独的 `ssm_beta/ssm_alpha`'
  - '- **MoE 增强**：传入 `ffn_up_exps_s / ffn_gate_exps_s / ffn_down_exps_s` 等 LoRA 缩放'
  - '- Shared Expert 同样支持 sigmoid 门控'
  - '- 整体结构与 Qwen3Next 一致（linear + attn 交替 + MoE）'
