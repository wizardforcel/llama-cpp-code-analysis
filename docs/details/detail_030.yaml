  name: DeltaNet 基础构建器 —— 线性注意力的「三种实现模式」
  'no': 6
  points:
  - '**DeltaNet 是什么？**'
  - '- 用 delta rule 替代传统 softmax 注意力的线性注意力机制，复杂度从 O(n²) 降到 O(n)'
  - '- 通过 `q, k, v, g(ate), b(eta), s(tate)` 六个输入张量驱动，门控与衰减因子由输入决定'
  - '**三种模式的入口：`build_delta_net`**'
  - '- `n_seq_tokens == 1` → 自动回归模式（`build_delta_net_autoregressive`，单 token 解码）'
  - '- `n_seq_tokens > 1` + `fused_gdn_ch == true` → 融合算子模式（`build_delta_net_fused`）'
  - '- 否则 → 分块模式（`build_delta_net_chunking`，分块并行计算）'
  - '**KDA vs GDA 判定**'
  - '- `kda = (g->ne[0] == S_k && g->ne[1] == H_k)`：gate 维度等于 K 维度时为 KDA（Kimi Delta
    Attention）'
  - '- 否则为 GDA：gate 只有 1 个通道（per-head 标量门控）'
  - '**Chunking 模式（`build_delta_net_chunking`）**'
  - '- **Pad + Reshape**：把 n_tokens 补齐到 CS（KDA=16, GDA=64）的整数倍'
  - '- **β 调制**：K/V 与 β 相乘得到 `k_b/v_b`，引入 delta rule 的混合因子'
  - '- **Cumsum G**：对 g 做 cumsum 得到 `g_cs`，后续用 `g_j - g_i` 构造指数衰减 mask'
  - '- **KDA 三步矩阵构造**：`decay_mask = exp(tri(g_j - g_i))`，分别与 `k_b`、`q` 相乘得 Akk、Kq'
  - '- **Tri-Solve**：`lhs = I + tri(attn)`，`lin_solve = solve_tri(lhs, -tri(attn))`
    解三角矩阵'
  - '- **状态更新**：`s_new = s * g_last + (k_g_diff) · v_new` 实现 O(1) 递推'
  - '- **逐 chunk 处理**：循环遍历 n_chunks，对每个 chunk 做 `v_prime = k_cd · s`、attention 加权和、状态更新'
  - '**Autoregressive 模式（`build_delta_net_autoregressive`）**'
  - '- 假设 `n_tokens == 1`，把 QKV 重排后直接用矩阵乘 + sum_rows 计算'
  - '- **状态缩放**：`s = s * exp(g)`（按 gate 缩放历史状态）'
  - '- **Delta 更新**：`d = (v - s · k) * b` → `s = s + k · d` → `o = sum_rows(s · q)`'
  - '**Fused 模式（`build_delta_net_fused`）**'
  - '- 调用 `ggml_gated_delta_net(q, k, v, g, b, s)` 一站式算子'
  - '- 输出张量通过 `view_4d` 切分为 `output` 与 `new_state` 两部分'
  - '- 算子内部根据 `n_tokens == 1` 自动选择 AR/Chunking 路径'
