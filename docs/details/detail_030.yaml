  name: RWKV7 基础构建器 —— 改进版 RWKV 的「进化引擎」
  'no': 4
  points:
  - '**RWKV7 vs RWKV6 的关键差异**'
  - '- 引入 delta 规则（data-dependent decay），通过 `k_k`、`k_a`、`a` 三个动态权重生成状态更新步长'
  - '- 引入 Value Residual（`first_layer_value`）：首层 V 通过 sigmoid 加权残差注入到后续层'
  - '- 引入 LoRA 风格的动态 `g1/g2` 门控与 `v0/v1/v2` 线性变化'
  - '**`build_rwkv7_channel_mix` 极简化**'
  - '- 不再有 receptance 门控，只保留 key 与 value 两组线性层'
  - '- `xk = lerp_k * sx + cur` → `k = relu(W_k · xk)^2` → `cur = W_v · k`'
  - '**`build_rwkv7_time_mix` 重点解析**'
  - '- **5/6 路 fused lerp**：通过 `time_mix_lerp_fused` 与 `repeat` 把 x_prev 复制成 [n_embd,
    n_seq_tokens, n_seqs, 5 or 6]'
  - '- **可学习 W 衰减**：`w = sigmoid(w2 · tanh(w1 · xw) + w0) * exp(-0.606531)`（固定常数相当于
    log(2) 缩放）'
  - '- **Value 残差**：`v_first` 不为空时，`v = v + sigmoid(v0 + v2·(v1·xv)) · (v_first -
    v)`'
  - '- **Gating**：`g = g2 · sigmoid(g1 · xg)`（可选），最终用于输出缩放'
  - '- **Delta rule 矩阵 a**：`a = sigmoid(a0 + a2·(a1·xa))`'
  - '- **L2 Normalization**：`kk = l2_norm(k * k_k)`、`k = k + a * (k * k_a) - k * k_a`'
  - '- **WKV7 算子**：`ggml_rwkv_wkv7(r, w, k, v, -kk, kk*a, state)` 把所有动态量一次性交给优化算子'
  - '- **值-键积注入**：`rk = sum_rows(k * r * r_k)`、`cur += v · rk`（额外的非线性）'
  - '- **Group Norm**：可选（`time_mix_ln && time_mix_ln_b` 才启用）'
  - '**first_layer_value 跨层传递**'
  - '- 通过 `ggml_tensor*& first_layer_value` 引用，让第一层 V 在每层中以 sigmoid 权重残差注入'
