    method_or_func: llm_build_rwkv6qwen2::llm_build_rwkv6qwen2()
  name: RWKV6Qwen2 混合架构 —— RWKV 与 Transformer 的「跨界融合」
  'no': 3
  points:
  - '**为什么需要 RWKV6Qwen2？**'
  - '- 把 RWKV 的时间混合（线性注意力）与 Qwen2 的标准 FFN 拼接在一起'
  - '- 让部分层使用 RWKV 时间复杂度 O(n) 的优势，保留 SwiGLU FFN 的高质量特征提取'
  - '**整体结构差异**'
  - '- 不做 token 归一化（`inpL = build_inp_embd` 后直接进入主循环），与标准 RWKV6 不同'
  - '- 使用 RMSNorm（`LLM_NORM_RMS`）而非 RWKV6 的默认 Norm'
  - '- **token_shift_count == 1**：每层只需要保存一个 token shift（去掉 ff_shift）'
  - '**Token shift 与 time_mix**'
  - '- 把 `token_shift` 直接作为 `x_prev` 与 `att_norm` 拼接'
  - '- `build_rwkv6_time_mix` 输出后再加上 `inpL` 形成残差'
  - '**FFN 标准 Qwen2 风格**'
  - '- `build_ffn` 用 `LLM_FFN_SILU` 激活 + `LLM_FFN_PAR` 并行门控（SwiGLU）'
  - '- 包含 `ffn_up / ffn_gate / ffn_down` 三组权重，无 bias 项（与 Qwen2 保持一致）'
  - '**残差与输出**'
  - '- `cur = ffn_out + ffn_inp` 形成标准 Transformer 残差'
  - '- `inp_out_ids` 用于最后一层只输出部分 token（speculative decoding 等场景）'
  - '- 最终 RMSNorm + output projection 输出 logits'
