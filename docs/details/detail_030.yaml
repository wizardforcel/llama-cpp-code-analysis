learning_targets:
- 理解RWKV6/7的token shift机制与时间混合（time-mix）、通道混合（channel-mix）原理
- 掌握RWKV7的数据依赖delta规则与first_layer_value跨层残差机制
- 理解DeltaNet线性注意力的三种实现模式（AR/Fused/Chunking）及其自动选择策略
- 掌握KDA（Kimi Delta Attention）vs GDA的差异以及chunk-based并行的三角矩阵求解
- 理解Qwen3Next/Qwen3.5中DeltaNet+Attention混合架构与IMRoPE位置编码
- 掌握Kimi-Linear的KDA自回归层+MLA无RoPE的混合注意力机制
- 理解causal_conv1d如何在DeltaNet中处理Q/K/V并维护卷积状态
- 了解循环式记忆（recurrent state）与KV缓存的区别，以及state持久化机制
life_analogy:
- 想象 RWKV/DeltaNet 的世界是一个**带记忆的流水线工厂**：
- '- **token_shift（令牌平移）** = 工厂传送带上的「上一站记忆」'
- '  - 每个工位（层）在处理新物料前，都会回头看一眼上一站留下的「影子」，把两者的差异 `sx = x_prev - cur` 作为时间信号'
- '- **time_mix（时间混合）** = 流水线上按时间衰减的「记忆混合机」'
- '  - 老记忆按指数 `w = exp(-exp(tanh(w1·xw)·w2 + decay))` 逐渐褪色（RWKV6）'
- '  - RWKV7引入数据相关衰减，让每个数据自己决定保留多少历史'
- '- **channel_mix（通道混合）** = 工位内的「特征加工机」'
- '  - 把当前特征和上一站特征 lerp 混合，再走 ReLU²→Value 的标准配方'
- '- **delta rule（增量规则）** = 工厂的「错账本」'
- '  - 每来一个新订单 `k`，就在账本上记录「与历史的差异 `β(v-s·k)`」，而不是覆盖历史'
- '  - 这样账本永远在「增量更新」，既能记住过去，又能适应新变化'
- '- **state（循环状态）** = 工厂的「永久档案柜」'
- '  - 每个工位都有自己的档案柜（s_l/r_l），下班时（每一步推理）归档，第二天上班时（下一步）取出'
- '  - 这就是为什么 RNN 类架构不需要像 Transformer 那样缓存所有 K/V，只需保存一个状态'
- '- **build_delta_net 三模式选择** = 「流水线调度员」'
- '  - 单件生产（n_tokens==1）→ 走AR单工位（手工精加工）'
- '  - 大批量 + fused算子 → 走Fused专线（高速自动化）'
- '  - 大批量无fused → 走Chunking分块线（分批并行加工）'
- '- **QRWKV vs RWKV6** = 「两种不同的记忆算法」'
- '  - RWKV6：用 `wkv6` 算子，标准指数衰减'
- '  - QRWKV：用 `gated_linear_attn` 算子，门控线性注意力（更现代的变体）'
- '- **build_norm_gated** = 「加权质检仪」'
- '  - RMSNorm 把特征标准化，sigmoid(gate) 当作「质检权重」，最后相乘输出'
- '  - Qwen3Next用SiLU，Kimi用sigmoid（细节差异体现模型个性）'
'no': 29
