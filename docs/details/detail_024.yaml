  name: 作用域计时器 —— 代码块的「秒表医生」
  'no': 2
  points:
  - '**RAII 风格的耗时统计**：`time_meas` 构造时记录起始时间（`ggml_time_us()`），析构时自动累加差值到外部传入的 `t_acc`
    引用'
  - '**构造函数细节**：通过初始化列表 `t_start_us(disable ? -1 : ggml_time_us())` 实现禁用模式开关'
  - '**支持禁用模式**：通过 `disable=true` 将 `t_start_us` 设为 -1，析构时跳过累加，常用于条件性计时'
  - '**析构条件累加**：`if (t_start_us >= 0) t_acc += ggml_time_us() - t_start_us`'
  - '**微秒级精度**：底层依赖 `ggml_time_us()`，提供比毫秒更细粒度的性能采样'
  - '**典型应用**：`llama_model_load` 中通过 `time_meas tm(model.t_load_us)` 自动记录整个加载过程的耗时'
