  name: 日志系统探微 —— 引擎的「传声筒」与「播报员」
  'no': 1
  points:
  - '**为什么需要日志系统？**作为底层推理引擎，llama.cpp 需要把内部状态（加载进度、量化信息、内存告警等）暴露给上层 CLI、Server 和工具'
  - '**LLAMA_LOG 宏家族**：通过 `LLAMA_LOG_INFO/WARN/ERROR/DEBUG/CONT` 五个宏统一调用 `llama_log_internal`，屏蔽可变参数与日志级别'
  - '**LLAMA_ATTRIBUTE_FORMAT 编译期校验**：通过 GCC/Clang 的 `__attribute__((format))` 在编译阶段校验
    printf 格式字符串，避免运行时崩溃'
  - '**日志状态结构 `llama_logger_state`**：保存当前回调函数指针与 user_data，全局唯一实例 `g_logger_state`
    位于 `llama-impl.cpp` 的全局代码段'
  - '**日志回调注册机制**：`llama_log_set` 通过全局静态变量 `g_logger_state` 保存用户回调，默认实现 `llama_log_callback_default`
    将内容写入 stderr'
  - '**日志回调查询接口**：`llama_log_get` 用于获取当前注册的回调与 user_data，与 `llama_log_set` 构成对称 API'
  - '**变长参数优雅处理**：`llama_log_internal_v` 内部使用栈缓冲（128 字节）与堆缓冲自动扩容，确保长消息不丢内容'
  - '**公开入口封装**：`llama_log_internal` 通过 va_start/va_end 包装变长参数并转发到 `_v` 版本'
  - '**辅助模板与结构**：`no_init<T>` 用于跳过值初始化（性能敏感路径），`buffer_view<T>` 提供指针+长度的轻量视图（含 `has_data`
    判空）'
  - '**特殊张量名常量**：`LLAMA_TENSOR_NAME_FATTN / FGDN_AR / FGDN_CH` 用于标记特殊计算节点的输出张量'
