  name: 推理精度的“显微镜” —— 跨引擎 Logprobs 对比与语料工程
  'no': 2
  points:
  - '**语料处理的“流水线”**'
  - '- `get_remote_corpus`：从远程 URL 或本地文件获取原始文本，智能分词并循环扩展至目标长度，过滤特殊 token 与空字符串'
  - '- 支持 llama.cpp 默认测试语料（如 server 源码 README），确保测试可复现'
  - '**双引擎 logits 采集与适配**'
  - '- `dump_logits`：通过 OpenAI 兼容 API 发送请求（temperature=0, top_k=1），按 pattern（获取/跳过单词数）分段收集'
  - '- 自动标记 `__index` 便于后续对齐调试，支持 API Key 认证'
  - '- `get_token_logprobs`：智能识别 llama.cpp（`content` 字段嵌套 `top_logprobs`）与 vLLM（扁平
    `tokens`/`token_logprobs`）响应格式差异'
  - '**数据清洗与报告生成**'
  - '- `clean_text`：Markdown 表格安全处理，转义换行符（\n）、制表符（\t）、竖线（\|）等敏感字符'
  - '- `compare_logits`：逐行对比两个日志文件，计算 logprob 绝对差值，动态计算列宽生成对齐的 Markdown 表格'
  - '- 支持索引错位警告（Mismatched indices），确保数据一致性'
  - '- `parse_pattern`：支持灵活的采样模式（如 ''10,1000,10,4000,10''），精确控制获取与跳过的词数'
  - '**命令行接口设计**'
  - '- `parse_args` 与 `main`：支持 dump（采集）与 compare（对比）双模式，参数校验与错误处理'
