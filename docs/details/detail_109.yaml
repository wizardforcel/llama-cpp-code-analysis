  name: 基准数据的“时光机” —— 基于SQLite的跨提交性能对比与可视化
  'no': 1
  points:
  - '**LlamaBenchData 基类的设计哲学**'
  - '- 通过抽象基类统一基准数据处理接口（llama-bench 与 test-backend-ops 双模式支持）'
  - '- 集成 GitPython 实现基于 Git 历史的自动父提交查找（`find_parent_in_data`）与精细哈希管理（`get_commit_hexsha8`）'
  - '- 内置 `_builds_init` 构建初始化与 `_check_keys` 数据完整性校验机制，强制要求 build_commit、test_time、avg_ts
    等核心字段'
  - '- 通过抽象方法 `builds_timestamp` 与 `get_rows` 定义数据访问契约，子类需实现具体存储逻辑'
  - '- 辅助方法 `get_commit_name` 与 `get_all_parent_hexsha8s` 支持人类可读名称与完整提交链查询'
  - '**多数据源适配的“变形金刚”**'
  - '- LlamaBenchDataSQLite3：内存数据库模式，动态创建表结构，支持复杂 SQL 聚合查询（`_get_rows_llama_bench`
    与 `_get_rows_test_backend_ops`）'
  - '- LlamaBenchDataSQLite3File：持久化 SQLite 文件读取，自动识别表结构（`valid_format` 静态预检）'
  - '- LlamaBenchDataJSONL/JSON/CSV：流式解析文本格式，逐行/逐条插入内存数据库，实现异构数据统一查询'
  - '- 统一使用 `_builds_init` 解决不同长度提交哈希的兼容性问题'
  - '**性能指标的“翻译官”**'
  - '- `format_flops`：智能自动缩放单位（FLOPS/kFLOPS/MFLOPS/GFLOPS/TFLOPS），优化人类可读性'
  - '- `format_flops_for_table`：配合表格列头单位显示，避免数值过长'
  - '- `get_flops_unit_name`：基于数值分布动态选择最合适单位，保持表格一致性'
  - '**科学计算可视化**'
  - '- 支持 `--plot` 参数触发 matplotlib 图表生成，支持多子图布局（`make_axes`）'
  - '- 自动分组机制：按测试名、模型参数等维度聚合数据点，支持对数坐标轴'
  - '- 输出 PNG 高清图表（300 DPI），同时支持 tabulate 库生成 ASCII/Markdown 表格'
