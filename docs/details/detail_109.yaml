  - 1. 运行 `test-backend-ops support --output csv > docs/ops/CUSTOM.csv` 生成新的后端支持数据（或模拟构造CSV数据），然后执行
    `create_ops_docs.py` 生成文档。观察生成的Markdown表格结构。
  - 2. 修改 `DocsGenerator` 类，使其除了生成Markdown外，还能输出JSON格式的支持矩阵（包含原始布尔值而非表情符号）。
  - 3. 分析 `collect_hf_model_test_parameters` 函数（第48-72行），解释为什么 `ast.literal_eval`
    比 `eval()` 更安全？在什么情况下它会抛出 `ValueError`？
  - 4. 编写一个新的pytest测试文件，使用 `@pytest.mark.parametrize` 定义包含 `hf_repo` 和 `hf_file` 参数的两个测试用例，然后运行
    `fetch_server_test_models.py` 验证你的测试文件是否能被正确解析。
