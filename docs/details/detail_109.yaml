exercises:
- contents:
  - 阅读 `scripts/compare-llama-bench.py` 中 LlamaBenchData 及其子类的实现（第291-626行），回答以下问题：
  - 1. 基类 `LlamaBenchData` 中的 `find_parent_in_data` 方法使用堆（heapq）而非队列管理Git提交历史，这种选择解决了什么性能问题？
  - 2. `LlamaBenchDataSQLite3` 与 `LlamaBenchDataJSONL` 在数据初始化流程上有何本质差异？为什么 JSONL 采用逐行插入而非批量加载？
  - 3. `_check_keys` 方法如何确保数据完整性？如果数据缺少 build_commit 或 avg_ts 会发生什么？
  - 4. 如果要支持新的数据格式（如 Parquet 或 Protobuf），需要修改哪些类和方法？请画出类图并说明修改点。
  'no': 1
  title: 分析多数据源适配器模式与Git历史追溯
- contents:
  - 阅读 `scripts/compare-logprobs.py` 第36-269行，完成以下任务：
  - 1. 绘制 `dump_logits` 函数的执行流程图，特别关注 pattern 参数（如 '10,1000,10,4000,10'）如何控制语料分段采集。
  - 2. `get_token_logprobs` 如何区分 llama.cpp 与 vLLM 两种响应格式？请用伪代码写出统一适配层的核心逻辑。
  - 3. `clean_text` 函数为什么要转义换行符和竖线？在 Markdown 表格中不转义会导致什么后果？
  - 4. 假设你要对比三个引擎（llama.cpp, vLLM, TensorRT-LLM）的logits，当前代码需要做哪些重构？请提出你的设计方案。
  'no': 2
  title: 跨引擎Logits对比与语料工程实践
