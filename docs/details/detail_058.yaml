code_map:
- gguf-py/gguf/gguf_reader.py
- '├── ReaderField (NamedTuple)        # GGUF字段核心数据结构'
- '│   ├── offset                      # 字段在文件中的偏移量'
- '│   ├── name                        # 字段名称'
- '│   ├── parts                       # numpy数组分片列表'
- '│   ├── data                        # 数据索引映射'
- '│   ├── types                       # 类型链（嵌套类型）'
- '│   └── contents(index_or_slice)    # 按需提取字段内容'
- '├── ReaderTensor (NamedTuple)       # 张量信息结构'
- '│   ├── name                        # 张量名称'
- '│   ├── tensor_type                 # 量化类型'
- '│   ├── shape                       # 张量形状'
- '│   ├── n_elements                  # 元素总数'
- '│   ├── n_bytes                     # 字节总数'
- '│   ├── data_offset                 # 数据物理偏移'
- '│   ├── data                        # 实际张量数据'
- '│   └── field                       # 对应的ReaderField'
- '├── GGUFReader                      # 核心读取器类'
- '│   ├── __init__(path, mode)        # 初始化：内存映射+魔数校验+字节序检测'
- '│   ├── get_field(key)              # 按键名获取字段'
- '│   ├── get_tensor(idx)             # 按索引获取张量'
- '│   ├── _get(offset, dtype, count, override_order) # 底层字节读取原语'
- '│   ├── _push_field(field, skip_sum) # 字段注册与去重校验'
- '│   ├── _get_str(offset)            # 字符串读取（长度+数据）'
- '│   ├── _get_field_parts(orig_offs, raw_type) # 递归解析字段数据'
- '│   ├── _get_tensor_info_field(orig_offs) # 解析单个张量信息'
- '│   ├── _build_fields(offs, count)  # 批量解析元数据字段'
- '│   ├── _build_tensor_info(offs, count) # 批量解析张量信息'
- '│   └── _build_tensors(start_offs, fields) # 构建张量数据列表'
