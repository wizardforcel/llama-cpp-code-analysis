  'no': 3
  points:
  - '**_get()：内存映射的「精准手术刀」**'
  - '- 基于 `numpy.memmap` 切片视图（`view`）实现零拷贝读取，避免重复内存分配'
  - '- 通过 `newbyteorder` 动态切换字节序视图，兼容大端（`S`）与小端（宿主）数据'
  - '- 支持 `override_order` 参数强制使用特定端序（如文件头固定为小端），确保跨平台一致性'
  - '**_get_str()：变长字符串的「测量仪」**'
  - '- 先读取8字节无符号整数作为字符串长度，再按长度读取 `uint8` 字节流，返回长度与数据二元组'
  - '- 将「长度前缀+数据」的 GGUF 字符串协议抽象为原子操作'
  - '**_get_field_parts()：类型递归的「解码器」**'
  - '- **字符串处理**：直接调用 `_get_str` 读取长度与数据，`data` 索引设为 `[1]` 指向实际内容'
  - '- **标量处理**：通过 `gguf_scalar_to_np` 映射表将 GGUF 类型转为 `numpy` 类型，读取后标记索引 `[0]`'
  - '- **数组处理**：递归调用自身解析子类型，通过 `data_idxs` 记录每个数组元素在 `parts` 列表中的实际索引位置，实现「扁平化存储，索引化访问」'
  - '- 返回四元组（总字节数、分片列表、索引映射、类型链），为上层构建 `ReaderField` 提供完整素材'
  - '**_push_field()：键值注册的「守门员」**'
  - '- 严格校验重复键名并抛出 `KeyError`，防止恶意构造的重复键破坏数据一致性'
  - '- 通过 `skip_sum` 参数控制是否返回字段总字节数，优化 `_build_fields` 中的偏移计算'
