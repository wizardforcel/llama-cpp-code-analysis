  name: ReaderField 与 ReaderTensor —— 数据基石与智能快递员
  'no': 1
  points:
  - '**ReaderField：GGUF 的「最小单元」**'
  - '- 使用 `NamedTuple` 定义，包含字段偏移量、名称、数据分片（`parts`）、数据索引（`data`）及类型信息（`types`）'
  - '- `types` 列表记录嵌套类型（如 `ARRAY` 内嵌 `STRING`），为复杂数据结构提供类型线索'
  - '- `parts` 存储原始 `numpy` 数组片段，避免立即解码，实现按需加载'
  - '**contents()：数据的「精准提取器」**'
  - '- 支持按索引（`int`）或切片（`slice`）提取数据，灵活应对单值或批量读取'
  - '- 针对字符串类型自动执行 UTF-8 解码（`tobytes()` → `str`）'
  - '- 针对数组类型通过 `data` 索引映射（`self.parts[idx]`）递归提取嵌套内容'
  - '- 对标量类型直接调用 `tolist()` 返回 Python 原生类型'
  - '**ReaderTensor：张量的「身份证」**'
  - '- 封装张量名称、量化类型（`GGMLQuantizationType`）、形状（`shape`）、元素数与字节数'
  - '- 通过 `data_offset` 记录张量在文件内的物理偏移，解耦元数据与实际数据'
