  - '- 确保即使之前以错误方式加载过，也能刷新为正确的包对象，暴露 `GGUFReader`、`GGUFWriter` 等公共接口'
  - '**设计哲学**：以极小的代码代价维持 API 兼容，避免旧教程、旧脚本失效，同时引导新用户使用标准包导入'
