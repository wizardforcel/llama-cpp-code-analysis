learning_targets:
- 理解推测解码（Speculative Decoding）的核心原理与实现机制
- 掌握经典双模型推测解码（Draft & Verify）的完整工作流程
- 了解基于 n-gram 缓存的 Lookup 推测解码实现方式
- 深入理解 Lookahead 解码的 Jacobi 迭代并行生成算法
- 学会使用 llama.cpp 提供的推测解码相关 API 与工具
- 掌握 KV Cache 管理与序列操作在推测解码中的应用
- 理解不同推测解码策略的性能特征与适用场景
life_analogy:
- 想象推测解码是一家**快递分拣中心的智能加速系统**：
- '- **目标模型** = 经验丰富的质检员（准确但慢）'
- '- **草稿模型** = 初级分拣员（快速但可能出错）'
- '- **推测解码** = 分拣员先快速分类，质检员批量抽检'
- '- **n-gram 缓存** = 历史常见包裹的记录本（查阅模式加速）'
- '- **Lookahead 解码** = 同时开多条分拣线，选择最优路径'
- '- **KV Cache 管理** = 仓库货架的空间调度（保留有用、清理无用）'
- ''
- 就像快递中心通过「先粗分再精检」的方式提升效率，推测解码让小模型先「大胆猜测」，大模型再「严格把关」，在保证质量的前提下大幅提升生成速度。
'no': 92
summary:
- concept: Speculative Decoding
  desc: 推测解码：小模型起草，大模型验证的加速推理技术
- concept: Target Model
  desc: 目标模型：负责最终验证的大型模型
- concept: Draft Model
  desc: 草稿模型：快速生成候选 token 的小型模型
- concept: n-gram Cache
  desc: n-gram 缓存：基于历史模式的快速草稿生成
- concept: Lookahead Decoding
  desc: Lookahead 解码：基于 Jacobi 迭代的并行生成算法
- concept: '`llama_memory_seq_cp`'
  desc: 序列复制：在 KV Cache 中复制序列状态
- concept: '`llama_memory_seq_rm`'
  desc: 序列删除：清理冗余的 KV Cache 空间
- concept: '`llama_memory_seq_keep`'
  desc: 序列保留：保留最优序列的 KV Cache
- concept: '`common_speculative_init`'
  desc: 推测器初始化：创建推测解码上下文
- concept: '`common_speculative_draft`'
  desc: 草稿生成：调用草稿模型生成候选序列
- concept: '`common_sampler_sample_and_accept_n`'
  desc: 批量采样接受：目标模型验证并接受的 token 数
- concept: '`common_ngram_cache_load/save`'
  desc: 缓存读写：加载/保存 n-gram 缓存文件
- concept: '`common_ngram_cache_update`'
  desc: 缓存更新：将新 token 序列添加到 n-gram 缓存
- concept: '`common_ngram_cache_draft`'
  desc: 缓存草稿：基于 n-gram 缓存生成候选 token
- concept: '`common_ngram_cache_merge`'
  desc: 缓存合并：将多个 n-gram 缓存聚合
- concept: ngram_data / ngram_container
  desc: Lookahead 核心数据结构：存储已观测的 n-gram
- concept: W / N / G 参数
  desc: Lookahead 核心参数：前瞻窗口 / n-gram 长度 / 验证数量
- concept: Accept Rate
  desc: 接受率：衡量推测解码效率的关键指标
