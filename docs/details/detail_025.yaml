summary:
- concept: time_meas
  desc: RAII 风格作用域计时器，进入作用域自动开始，析构或 get() 时返回毫秒耗时
- concept: format()
  desc: 线程安全的 printf 风格字符串格式化，替代 std::to_string 拼接
- concept: replace_all()
  desc: 字符串全量替换，常用于张量名与路径名的标准化
- concept: llama_format_tensor_shape
  desc: 把 ggml 张量形状 [ne, ne, ne, ne] 转为 [1024, 4096] (f16) 形式的可读字符串
- concept: gguf_data_to_str
  desc: 将 GGUF 二进制标量值（UINT8/FLOAT32/STRING/ARRAY 等）格式化为字符串
- concept: gguf_kv_to_str
  desc: 将 GGUF KV 元数据对格式化为可读字符串，常用于打印模型元信息
- concept: llama_io_write_i
  desc: 抽象写接口基类，屏蔽缓冲区、文件、虚拟目标之间的差异
- concept: llama_io_read_i
  desc: 抽象读接口基类，与 write_i 对称，统一数据源访问方式
- concept: llama_io_write_buffer
  desc: 写入 std::vector<uint8_t> 的具体实现，常用于内存中构建 GGUF 数据
- concept: llama_io_write_file
  desc: 写入本地文件的具体实现，封装 fwrite/ftell 与文件句柄生命周期
- concept: llama_io_write_dummy
  desc: 写入即丢弃的桩实现，用于测试、基准与不希望产生实际副作用的场景
- concept: llm_build_mamba_base
  desc: 状态空间模型图构建基类，build_mamba_layer/build_mamba2_layer 供 Falcon-H1/Nemotron-H/Granite-Hybrid/Jamba/Plamo2
    复用
- concept: llm_build_delta_net_base
  desc: 线性注意力图构建基类，提供 chunking/autoregressive/fused 三种模式并由 build_delta_net 自动选择
- concept: llm_build_rwkv6_base
  desc: RWKV6 图构建基类，build_rwkv6_channel_mix 与 build_rwkv6_time_mix 构成 RWKV 核心算子
- concept: llm_build_rwkv7_base
  desc: RWKV7 图构建基类，在 RWKV6 基础上改进，build_rwkv7_time_mix 新增 first_layer_value 参数
- concept: llm_build_kimi_linear
  desc: Kimi 线性模型图构建类，build_kda_autoregressive 与 build_kda_chunking 实现 KDA 两种模式
- concept: llm_build_qwen3next / qwen35 / qwen35moe
  desc: Qwen3 系列线性注意力图构建类，build_qkvz/build_norm_gated/build_layer_attn/build_layer_attn_linear/build_layer_ffn
    构成完整层流水线
- concept: llm_build_gemma3n_iswa
  desc: Gemma3n AltUp 多通道图构建类，calc_magnitude/gaussian_topk/altup_*/laurel 等方法实现 AltUp
    投影与稀疏激活
- concept: llm_build_gemma4_iswa
  desc: Gemma4 每层嵌入图构建类，view_2d_slice/get_per_layer_inputs/project_per_layer_inputs
    支持每层嵌入投影
- concept: llm_build_granite / granite_hybrid
  desc: Granite 系列图构建类，build_attention_layer/build_layer_ffn 封装残差缩放逻辑，hybrid 版额外支持
    MoE FFN
- concept: llm_build_plamo2
  desc: Plamo2 混合架构图构建类，build_plamo2_mamba_layer 与 build_plamo2_attn_layer 展示 Mamba+Attention
    混合实现
- concept: llm_build_nemotron_h
  desc: Nemotron-H 混合架构图构建类，build_ffn_layer 与 build_attention_layer 提供 H 系列特有的混合前馈网络
