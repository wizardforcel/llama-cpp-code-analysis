  name: 模型图构建基类 —— 百模共用的「脚手架」
  'no': 2
  points:
  - '**基类的定位**：`src/models/models.h` 定义了多个模型图构建基类（llm_build_mamba_base、llm_build_delta_net_base、llm_build_rwkv6_base、llm_build_rwkv7_base
    等），它们为数十种具体模型提供可复用的图构建方法，是「一次实现、到处复用」的工程典范。'
  - '**Mamba 基类**：`llm_build_mamba_base::build_mamba_layer` 与 `build_mamba2_layer`
    封装了状态空间模型的卷积+扫描核心逻辑，被 Falcon-H1、Nemotron-H、Granite-Hybrid、Jamba、Plamo2 等混合架构复用。'
  - '**DeltaNet 基类**：`llm_build_delta_net_base` 提供 `build_delta_net_chunking`（分块模式）、`build_delta_net_autoregressive`（自回归模式）与
    `build_delta_net_fused`（融合算子）三种实现，并由 `build_delta_net` 根据 token 数自动选择，支撑 Qwen3Next、Qwen3.5、Qwen3.5-MoE、Kimi-Linear
    等线性注意力模型。'
  - '**RWKV6 基类**：`llm_build_rwkv6_base::build_rwkv6_channel_mix`（通道混合）与 `build_rwkv6_time_mix`（时间混合）构成
    RWKV 系列的核心算子，被 RWKV6、RWKV6Qwen2 复用。'
  - '**RWKV7 基类**：`llm_build_rwkv7_base` 在 RWKV6 基础上改进，`build_rwkv7_time_mix` 新增 `first_layer_value`
    参数处理首层值，被 RWKV7、ARWKV7 继承。'
  - '**Kimi-Linear 的 KDA 实现**：`llm_build_kimi_linear::build_kda_autoregressive` 与
    `build_kda_chunking` 实现 Kimi 线性模型的自回归与分块 KDA（K Delta Attention）模式，配合 causal_mask、identity、diag_mask
    等掩码张量。'
  - '**Qwen3Next / Qwen3.5 的线性注意力**：`build_qkvz`（返回 qkv 与 z 对）、`build_norm_gated`（门控归一化）、`build_layer_attn`（标准注意力）、`build_layer_attn_linear`（线性注意力）、`build_layer_ffn`
    构成完整层构建流水线，Qwen3.5 额外支持 `sections` 参数实现多段注意力。'
  - '**Gemma3n 的 AltUp 多通道**：`calc_magnitude`、`gaussian_topk`、`altup_compute_router_modalities`、`altup_predict`、`altup_correct`、`laurel`、`view_2d_slice`、`get_per_layer_inputs`、`project_per_layer_inputs`
    九个方法共同实现 Gemma3n 的 AltUp 投影、Laurel 残差与高斯 TopK 稀疏激活。'
  - '**Gemma4 的每层嵌入**：`llm_build_gemma4_iswa` 的 `view_2d_slice`、`get_per_layer_inputs`、`project_per_layer_inputs`
    支持每层嵌入投影，`n_embd_per_layer` 成员变量记录嵌入维度。'
  - '**Granite 系列的残差缩放**：`llm_build_granite` 与 `llm_build_granite_hybrid` 的 `build_attention_layer`、`build_layer_ffn`
    封装了残差缩放逻辑，hybrid 版额外支持 MoE FFN。'
  - '**Plamo2 的混合架构**：`llm_build_plamo2` 的 `build_plamo2_mamba_layer` 与 `build_plamo2_attn_layer`
    展示了 Mamba+Attention 混合的另一种实现范式。'
  - '**Nemotron-H 的混合 FFN**：`llm_build_nemotron_h::build_ffn_layer` 与 `build_attention_layer`
    提供 H 系列特有的混合前馈网络。'
