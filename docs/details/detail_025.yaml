learning_targets:
- 理解 llama.cpp 内部基础设施模块（llama-impl、llama-io）的职责边界
- 掌握字符串格式化、张量形状描述、GGUF 元数据转字符串等辅助函数
- 熟悉作用域计时器 time_meas 的使用模式与实现机制
- 能够阅读并理解 I/O 抽象接口（llama_io_write_i / llama_io_read_i）的设计
- 了解系统诊断信息的输出范围
- 理解 models.h 中模型图构建基类（Mamba/DeltaNet/RWKV/AltUp 等）的设计意图与方法职责
- 掌握线性注意力（DeltaNet/KDA）三种实现模式（chunking/autoregressive/fused）的适用场景
- 能够阅读并修改基类方法以支持新模型架构
life_analogy:
- 想象 llama.cpp 的源码世界是一座庞大的推工厂，那么 `src/llama-impl.*` 与 `src/llama-io.*` 就是这座工厂的「后勤保障部门」：
- '- **time_meas** = 工厂车间墙上的「计时秒表」，每道工序开始时按一下、结束时再按一下，自动算出耗时'
- '- **format / replace_all** = 工厂的「万能文本胶带」，把零散的零件名、张量名拼接成统一格式'
- '- **llama_format_tensor_shape** = 工厂的「零件铭牌打印机」，把 [1024, 4096] 这种干巴巴的数字变成「[1024,
  4096] (f16)」这样人类可读的标签'
- '- **gguf_data_to_str / gguf_kv_to_str** = 工厂的「说明书翻译官」，把二进制 GGUF 元数据翻译成人类可读的字符串'
- '- **llama_io_write_i / llama_io_read_i** = 工厂的「集装箱装卸平台」，抽象出统一的读写接口，让内存、文件、虚拟缓冲区都能用同一种方式搬运'
- 就像工厂可以没有后勤部门勉强开工，但有了它们才能高效协同、稳定运行；llama.cpp 缺了这些基础设施模块也能跑，但有了它们才能优雅地日志、可移植地序列化、准确地诊断性能。
- ''
- 而 `src/models/models.h` 中的基类则是工厂的「公共模具车间」：
- '- **llm_build_mamba_base** = 状态空间模型的「标准冲压机」，把 Mamba/Mamba2 的卷积+扫描压成统一形状，供 Falcon-H1、Nemotron-H、Granite-Hybrid、Jamba、Plamo2
  复用'
- '- **llm_build_delta_net_base** = 线性注意力的「三档变速器」（chunking / autoregressive / fused），根据
  token 数自动换挡，支撑 Qwen3Next、Qwen3.5、Kimi-Linear'
- '- **llm_build_rwkv6_base / rwkv7_base** = RWKV 的「时间混合双引擎」（channel_mix + time_mix），RWKV7
  额外增加 first_layer_value 参数处理首层值'
- '- **build_qkvz** = Qwen3 系列的「张量分拣机」，把 QKV 与 z 拆成对，配合 build_norm_gated 实现门控归一化'
- '- **llm_build_gemma3n_iswa** = AltUp 的「多通道调度台」，管理预测（altup_predict）、激活（gaussian_topk）、修正（altup_correct）三条流水线，外加
  Laurel 残差与每层输入投影'
- '- **llm_build_granite(_hybrid)** = Granite 系列的「残差缩放器」，在注意力与 FFN 中统一注入缩放因子'
- '- **llm_build_plamo2** = Plamo2 的「混合架构演示器」，展示 Mamba+Attention 混合的另一种实现范式'
- 就像工厂不会为每个产品重新设计螺丝刀，这些基类让数十种模型避免了「重复造轮子」——新模型只需继承基类、覆写特定方法，就能快速接入推理引擎。
