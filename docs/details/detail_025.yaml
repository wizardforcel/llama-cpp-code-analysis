  name: 基础设施全貌 —— 走进 llama.cpp 的「后勤保障部」
  'no': 1
  points:
  - '**基础设施的定位**：src/llama-impl.* 与 src/llama-io.* 构成了 llama.cpp 的「无名英雄」模块——它们不直接参与推理计算，却为字符串处理、计时统计、I/O
    序列化提供基础支撑。'
  - '**作用域计时器 time_meas**：基于 RAII 的轻量计时类，进入作用域自动开始计时，析构时自动结束，get() 返回毫秒数，to_string()
    返回人类可读的耗时字符串，是性能统计与基准测试的基石。'
  - '**字符串处理工具集**：format() 是线程安全的 printf 风格格式化器，replace_all() 支持全局字符串替换，string_split()
    按分隔符拆分，string_equals() / string_starts_with() 等字符串判断函数，让上层代码摆脱手写循环。'
  - '**张量形状描述器 llama_format_tensor_shape**：把 ggml 张量的原始形状 [ne_x, ne_y, ne_z, ne_w]
    转换为人类可读的 [1024, 4096] (f16) 形式，是 print_info 与日志输出的关键格式化工具。'
  - '**GGUF 元数据字符串化**：gguf_data_to_str() 把二进制标量值转为字符串，gguf_kv_to_str() 把 KV 对格式化为可读输出，配合
    fmt_data_type() / fmt_arr_data_type() 共同支撑 GGUF 文件的诊断与打印。'
  - '**I/O 抽象是「集装箱装卸平台」**：llama_io_write_i 与 llama_io_read_i 定义统一的读写接口，llama_io_write_buffer
    写入 std::vector<uint8_t>，llama_io_write_file 写入本地文件，llama_io_write_dummy 写入即丢弃，让序列化层与具体存储介质解耦。'
  - '**数值与位操作辅助**：fp16_to_fp32() / fp32_to_fp16() 完成半精度与单精度的转换，swap_bytes() 处理字节序翻转，align_to()
    进行字节对齐，是跨平台序列化的底层工具。'
  - '**系统诊断基础**：LLAMA_MAX_N_THREADS、debug_prints、LLAMA_ASSERT 等宏与常量，提供了线程数探测、调试输出与断言的基础设施。'
