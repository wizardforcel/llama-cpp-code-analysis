exercises:
- contents:
  - 打开 `src/llama-impl.h` 与 `src/llama-impl.cpp`，通读字符串处理与 time_meas 相关代码，回答以下问题：
  - 1. `time_meas` 类的构造函数与析构函数分别做了什么？它是基于 RAII 的吗？
  - 2. `time_meas::get()` 返回的时间单位是什么？`time_meas::to_string()` 返回什么格式？
  - 3. `format()` 函数是如何保证线程安全的？与 `snprintf` 有何差异？
  - 4. `replace_all()` 是原地修改还是返回新字符串？它在源码中被哪些地方调用？
  - 5. `string_split()` 默认按什么分隔符拆分？它在模型加载流程中扮演什么角色？
  - 6. 找出 `llama_format_tensor_shape` 的实现，思考它为什么需要同时输出形状与数据类型？
  - 7. `fp16_to_fp32()` 与 `fp32_to_fp16()` 如何处理舍入误差？
  - 8. `swap_bytes()` 在跨平台字节序转换中扮演什么角色？它主要用于哪些场景？
