exercises:
- contents:
  - 使用 debug-template-parser 工具分析一个真实 GGUF 模型文件中的聊天模板：
  - 1. 找到一个包含 `tokenizer.chat_template` 的 GGUF 文件（如 Llama-3-8B-Instruct）
  - 2. 运行命令：`./debug-template-parser model.gguf --input-message=all --output=both`
  - 3. 观察 `read_gguf_chat_template()` 的调试输出，记录 GGUF 中模板的长度
  - ''
  - 回答问题：
  - '- `read_gguf_chat_template()` 中 `no_alloc=true` 参数的作用是什么？如果不设置会怎样？'
  - '- 当模板成功加载后，`main()` 函数中的 `common_chat_try_specialized_template()` 返回了什么？这意味着该模型使用专用解析器还是通用解析器？'
  - '- 如果 GGUF 文件缺少 `tokenizer.chat_template` 键，程序会抛出什么异常？如何修改代码使其回退到默认模板？'
  'no': 1
  title: GGUF 模板提取与验证
- contents:
  - 修改 debug-template-parser.cpp，添加对以下混合场景的测试支持：
  - 1. 多轮推理场景：user → assistant(reasoning) → user → assistant(reasoning + tool_call)
  - 2. 伪工具调用边界测试：assistant 只有 content 但 content 中包含看起来像工具调用的 JSON 字符串
  - 3. 空工具调用数组：assistant 的 tool_calls 是空数组 [] 而非 null
  - ''
  - 实现要求：
  - '- 扩展 `build_reasoning_tool_call_message()` 或新建函数构造上述 JSON'
  - '- 在 `render_all_scenarios()` 中添加对应的 `render_if` 分支'
  - '- 使用 `--input-message=all` 验证新场景能被正确触发'
  - ''
  - 思考问题：
  - '- 为什么 `build_content_fake_tool_call_message()` 要故意不提供 `tool_calls` 字段？这测试了模板的什么边界行为？'
  - '- 当 `add_generation_prompt=true` 且最后一条是 assistant 时，代码为什么要自动追加一条 user 消息？如果不追加会发生什么？'
  'no': 2
  title: 七场景消息构建器实战
- contents:
  - 使用 template-analysis 工具对比两个 DeepSeek 系列模板（如 deepseek-chat 和 deepseek-reasoner）：
  - 1. 运行 `./template-analysis --template deepseek`，观察 9 组对照实验的输出
  - 2. 重点关注 Test 3（with_tools vs without_tools）和 Test 5（reasoning on/off）的 diff 输出
  - 3. 分析 `print_diff_split()` 输出的 Common Prefix 和 Left Diff 部分
  - ''
  - 实践任务：
  - '- 修改 `analyze_template()` 函数，将 diff 结果保存到 JSON 文件而非仅控制台输出'
  - '- 添加统计信息：计算每个模板在 9 组实验中产生差异的实验数量（diff_count）'
  - '- 对比两个模板在推理变量探测（`check_reasoning_variables`）阶段的差异：哪个模板查询了更多隐式变量？'
  - ''
  - 思考问题：
  - '- `diff_split` 算法为什么要分别计算 Common Prefix 和 Common Suffix？只计算一次差异会导致什么问题？'
  - '- ANSI 颜色编码中，为什么左边差异用绿色（ANSI_GREEN）而右边用橙色（ANSI_ORANGE）？这种设计对快速定位差异有什么帮助？'
  'no': 3
  title: 模板差异对比与原因分析
- contents:
  - 深入分析 `check_reasoning_variables()` 的实现原理，并扩展其能力：
  - 1. 研究 `jinja::context.is_get_stats` 的工作机制：为什么要在执行前设置这个标志？
  - 2. 理解「污染标记法」：代码将候选变量设为 `value_undefined_t`，这是一种什么设计模式？
  - 3. 添加对以下新变量的探测支持：`enable_tool_call`、`strict_mode`、`max_recursion_depth`
  - ''
  - 实现要求：
  - '- 修改 `candidate_vars` 列表，添加至少 3 个你感兴趣的变量名'
  - '- 修改代码使其能检测模板是否**修改**了这些变量（而不仅是读取）'
  - '- 输出格式化为 Markdown 表格：变量名 | 是否被查询 | 是否被修改 | 使用位置（如果可追踪）'
  - ''
  - 思考问题：
  - '- 为什么不能直接检查变量是否为 undefined 来判断模板是否使用了它？`is_get_stats` 的必要性是什么？'
  - '- 如果模板使用了 `{% if enable_thinking is not defined %}` 这种防御性写法，当前探测机制能否检测到？为什么？'
  - '- 这种「静默探测」机制与直接解析模板 AST 查找变量引用相比，各有什么优劣？'
  'no': 4
  title: 推理变量探测机制逆向工程
- contents:
  - 结合两个工具的能力，构建一个自动化的模板质量检测流水线：
  - 1. 编写一个 Shell/Python 脚本，自动运行：
  - '   - `template-analysis --all` 生成所有内置模板的差异报告'
  - '   - 对差异最大的 3 个模板，分别运行 `debug-template-parser --input-message=all --output=both`'
  - 2. 解析输出日志，提取以下关键指标：
  - '   - 模板是否支持 tool_calls（从 jinja::caps 输出解析）'
  - '   - 生成的 GBNF Grammar 是否成功通过 `llama_grammar_init_impl()` 验证'
  - '   - 每个模板在 7 种场景下的渲染输出长度'
  - ''
  - 最终交付：
  - '- 生成一份 Markdown 报告，包含：支持的模板列表、每个模板的特性矩阵（7x7 表格：7 种场景 × 7 种能力）、以及语法验证通过率'
  - '- 指出哪些模板在「content_fake_tool_call」场景下会产生意外输出（这表明它们可能不支持伪工具调用）'
  - ''
  - 思考问题：
  - '- 为什么需要同时验证 PEG Parser 和 GBNF Grammar？它们在结构化输出中分别扮演什么角色？'
  - '- 如果某个模板在 `analysis` 模式下正常但在 `template` 模式下渲染失败，可能的原因是什么？'
  'no': 5
  title: 构建自定义模板调试流水线
learning_targets:
- 掌握 debug-template-parser 与 template-analysis 两大模板调试工具的定位差异与协作关系
- 理解 Jinja 聊天模板从文件/GGUF 加载到渲染输出的完整调试流水线
- 熟练使用 diff_split 算法分析模板在不同配置下的行为差异
- 能够通过污染标记法探测模板对 enable_thinking 等隐式变量的依赖
- 具备验证模板生成 PEG Parser / GBNF Grammar 合法性的工程能力
- 能利用 7 种消息场景构建器系统测试模板的多模态、工具调用与推理链特性
life_analogy:
- 想象 llama.cpp 的聊天模板工具链是一家**多语言翻译质量检测中心**：
- ''
- '**debug-template-parser（X光透视仪）** = 同声传译的质量检测仪'
- '- 模板文件/GGUF = 待检测的翻译耳机设备'
- '- 7种消息场景 = 7种语言组合测试（中英互译、英法互译、带方言的粤语等）'
- '- render_scenario = 实际试音：把标准测试语句通过设备播放，检查输出是否清晰'
- '- prepare_params = 检测设备参数（音量、降噪等级、信道）'
- '- PEG Parser / GBNF Grammar = 检测该设备支持的「语言规则手册」，确保它说的每句话都符合语法规范'
- ''
- '**template-analysis（对比显微镜）** = 多译本差异对比仪'
- '- diff_split 算法 = 版本对比高亮笔：自动标出两个译本的相同开头（紫色）、相同结尾（青色）、真正不同的中间部分（左绿右橙）'
- '- check_reasoning_variables = 隐性方言探测器：故意在上下文中放入生僻词（enable_thinking），看模板是否会去查询它的含义'
- '- 9组对照实验 = 压力测试：同一段中文，分别测试「带工具调用 vs 不带」「带思维链 vs 不带」时的翻译差异'
- ''
- 就像质检员需要同时检测单个耳机的音质（debug）和对比不同品牌耳机的差异（analysis），llama.cpp 需要同时验证单个模板的渲染正确性和不同模板家族的行为一致性，确保
  Llama、DeepSeek、Gemma 等不同「翻译官」都能准确理解用户的对话意图。
'no': 73
summary:
- concept: debug-template-parser
  desc: 单模板深度调试工具，支持GGUF/文件双通道加载、7种消息场景渲染、PEG/Grammar生成验证
- concept: template-analysis
  desc: 多模板差异分析工具，通过三组对照实验和diff_split算法定位模板行为差异
- concept: read_gguf_chat_template()
  desc: 零拷贝GGUF元数据提取：no_alloc=true只读tokenizer.chat_template，不加载张量数据
- concept: 消息构建器家族
  desc: 乐高化JSON构造器：覆盖content_only到reasoning_tool_call等7种助手消息形态
- concept: render_scenario()
  desc: 单场景渲染流水线：拼装消息→设置generation_prompt/enable_thinking→调用common_chat_template_direct_apply
- concept: prepare_params()
  desc: autoparser参数打包：转换工具开关、推理格式、tool_choice为generation_params结构
- concept: diff_split算法
  desc: 三段式文本差异分解：Common Prefix(紫)/Common Suffix(青)/Left-Right Diff(绿/橙)
- concept: check_reasoning_variables()
  desc: 污染标记探测法：将候选变量设为undefined，通过is_get_stats检测模板是否查询enable_thinking等隐式变量
- concept: jinja::caps能力检测
  desc: 模板特性矩阵：supports_tools/supports_tool_calls/supports_reasoning等标准化接口
- concept: 9组对照实验
  desc: template-analysis核心流程：对比工具数量/推理开关/多轮对话等9种配置下的模板输出差异
- concept: PEG Parser/GBNF Grammar
  desc: 模板逆向工程产物：从Jinja模板生成语法解析器与上下文无关文法，用于结构化约束
- concept: common_chat_try_specialized_template
  desc: 专用解析器探测：检测模板是否匹配Llama-3/Gemma等预置优化路径
