learning_targets:
- 理解 DeepSeek V1/V2 系列 MoE 架构的图构建逻辑，包括稠密到稀疏的层切换策略
- 掌握 MLA（Multi-head Latent Attention）的吸收优化原理与 YaRN RoPE 预缩放技巧
- 理解 Qwen2MoE 与 Qwen3MoE 在共享专家机制上的不同设计思路
- 掌握 DBRX 单矩阵 QKV + Clamp、Arctic 稠密+MoE 双 FFN 等细粒度专家路由实现
- 理解 Grok 双后归一化与 GELU 激活、Olmoe Q/K Norm、Grovemoe 双层路由等 MoE 变体
- 掌握 ERNIE 4.5 的 n_moe_layer_step 间隔式 MoE、EXAONE-MoE 的 ISWA + Q/K Norm 组合
- 理解 OpenAI-MOE 的 Attention Sink 机制与 SwiGLU-OAI 定制激活
- 掌握 LLaDA-MoE 作为扩散语言模型如何通过无缓存注意力实现双向注意力
- 能识别各 MoE 模型在门控函数、专家权重归一化、激活函数、归一化位置上的设计差异
life_analogy:
- 想象 MoE 模型是一家**大型专科医院**，每层 Transformer 都是一次门诊流程：
- '- **标准注意力** = 全科分诊台（每个患者都要挂号）'
- '- **路由专家（MoE FFN）** = 各科专家医生（神经科、骨科、心脏科...），患者按病情被分配到对应专家'
- '- **共享专家** = 全科医生（基础保健，人人必看）'
- '- **n_layer_dense_lead** = 急诊室（所有患者必须先经过的初诊区）'
- '- **MLA（潜空间注意力）** = 病历压缩术：医生把厚厚的病历压缩到一张小卡片（低秩 KV），需要时再展开'
- '- **吸收优化（absorbed）** = 边走边问：在走廊里就把部分问诊做完，到诊室只需问关键问题'
- '- **ISWA 双 KV 缓存** = 大病历柜 + 小病历柜：近期病历放小柜（快速查），远期放大柜'
- '- **Attention Sink（attn_sinks）** = 医院导诊图：无论走到哪里，先看导诊图找到方向'
- '- **n_moe_layer_step** = 周期性专家会诊：不是每层都请专家，而是每隔几层集中会诊一次'
- '- **分组专家（Grovemoe）** = 双层路由：先按病情大类分诊，再在大类内选具体专家'
- 就像医院需要平衡专家资源与初诊效率，MoE 模型也需要平衡稠密路径与稀疏专家的计算成本。
