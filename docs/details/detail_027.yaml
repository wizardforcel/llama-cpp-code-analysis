summary:
- concept: DeepSeek V1 稠密→MoE 切换
  desc: 前 n_layer_dense_lead 层用稠密 FFN，后续切换为 MoE+共享专家并行的标准范式
- concept: DeepSeek V2 MLA 吸收优化
  desc: 把 KV 压缩到低秩空间，通过 wk_b 与 Q 相乘实现 MQA 化，避免显式解压 K/V
- concept: YaRN RoPE 预缩放
  desc: 撤销 yarn_attn_factor_adjust 后用 mscale 修正长上下文下的注意力幅值
- concept: DeepSeek2OCR 纯 MHA 分支
  desc: OCR 变体走标准 MHA，固定 RoPE_TYPE_NEOX 且 freq_base≈10000
- concept: Qwen2MoE 独立门控共享专家
  desc: 共享专家通过 sigmoid(silu(x)/x) 独立调节贡献，与 MoE 输出相加
- concept: Qwen3MoE Q/K Norm + 缩放专家
  desc: Q/K 做 RMSNorm，通过 _exps_s 缩放张量在 build_moe_ffn 内做专家权重归一化
- concept: DBRX 单矩阵 QKV + Clamp
  desc: wqkv 单矩阵输出 Q/K/V，ggml_clamp 限制数值，view_3d 偏移切分
- concept: Arctic 稠密+MoE 双 FFN
  desc: 每层同时存在稠密 FFN 与 MoE FFN，三路相加（dense + moe + residual）
- concept: Grok GELU 激活 + √2/2 缩放
  desc: MoE 用 LLM_FFN_GELU，稠密 FFN（可选）与 MoE 输出以 √2/2 缩放相加
- concept: Grok final_logit_softcapping
  desc: 输出 logits 前用 tanh 软上限截断（f_final_logit_softcapping）
- concept: Olmoe Q/K 双 Norm + 纯 MoE
  desc: Q/K 各做 RMSNorm 再 RoPE，纯 MoE 结构（expert_weights_norm=false）
- concept: Grovemoe 双层路由
  desc: n_chunk_expert 分组，两次 build_moe_ffn 共享 probs 概率张量
- concept: ERNIE 4.5 间隔式 MoE
  desc: is_moe_layer = (il >= n_layer_dense_lead) && ((il+1) % n_moe_layer_step ==
    0)
- concept: EXAONE-MoE ISWA + Q/K Norm
  desc: build_attn_inp_kv_iswa + Q/K RMSNorm，仅 SWA 层做 RoPE
- concept: OpenAI-MOE Attention Sink
  desc: 通过 attn_sinks 传入 build_attn 实现注意力吸收点机制
- concept: OpenAI-MOE SwiGLU-OAI 激活
  desc: LLM_FFN_SWIGLU_OAI_MOE 特殊激活函数，SOFTMAX_WEIGHT 门控
- concept: LLaDA-MoE 扩散双向注意力
  desc: build_attn_inp_no_cache 实现非因果双向注意力，纯 MoE 无共享专家
