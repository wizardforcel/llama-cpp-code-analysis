  'no': 6
  points:
  - '**ERNIE 4.5：标准稠密的稳健派**'
  - '- 纯稠密 FFN，每层用 `build_ffn` + `LLM_FFN_SILU`'
  - '- Q/K/V 可选偏置（`bq`/`bk`/`bv`），Q 输出投影无偏置'
  - '- 最后层通过 `ggml_get_rows` 过滤未使用 token'
  - '- 是 MoE 路线的「对照组」，展现稠密 LLM 的标准范式'
  - '**ERNIE 4.5 MoE：n_moe_layer_step 的间隔式 MoE**'
  - '`is_moe_layer = (il >= n_layer_dense_lead) && ((il+1) % n_moe_layer_step == 0)`'
  - '- 不是「前 N 层稠密后全 MoE」，而是按步长间隔插入 MoE 层'
  - '- 共享专家可选（`n_ff_shexp > 0` 才构建）'
  - '- 专家偏置 `ffn_exp_probs_b` 通过 `build_moe_ffn` 传入'
  - '- 每层都通过 `attn_out` 回调单独观察'
  - '**EXAONE-MoE：ISWA + Q/K Norm + 滑动窗口**'
  - '- 使用 `build_attn_inp_kv_iswa`：支持滑动窗口 + 全局注意力双 KV 缓存'
  - '- 通过 `hparams.is_swa(il)` 判断当前层是否使用 SWA'
  - '- 仅 SWA 层做 RoPE（`is_local_layer` 判断），全注意力层跳过 RoPE'
  - '- Q/K 都做 RMSNorm（`attn_q_norm`/`attn_k_norm`）'
  - '- `nextn_predict_layers` 跳过预测层'
  - '- MoE 与稠密 FFN 共存（根据 `ffn_gate_inp` 是否为 null 判断）'
  - '- 共享专家作为可选分支，与 MoE 输出相加'
