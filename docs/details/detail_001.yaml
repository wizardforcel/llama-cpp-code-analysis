  - '- 一个命令即可从 Hugging Face 直接下载并运行模型（`-hf` 参数）'
  - '**README 中的「模型宇宙」有多庞大？**'
  - '- 文本模型覆盖 LLaMA、Mistral、Qwen、DeepSeek、Mamba、RWKV 等上百种架构'
  - '- 多模态家族包含 LLaVA、Qwen2-VL、LFM2-VL、GLM-4V 等视觉/音频模型'
