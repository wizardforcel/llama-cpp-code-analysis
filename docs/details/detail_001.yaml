  - '- Plain C/C++ 实现，无任何外部依赖，零门槛跨平台'
  - '- Apple Silicon 一等公民（NEON、Accelerate、Metal 深度优化）'
  - '- 同时支持 x86 AVX/AVX2/AVX512/AMX 与 RISC-V RVV/ZVFH 等指令集'
  - '- 提供 1.5~8 bit 整数量化与 GGML 生态全栈加速'
  - '**README 的「项目蓝图」告诉我们什么？**'
