  name: HF → GGUF 转换器家族概览 —— 三套「模型打包工具」
  'no': 2
  points:
  - '**为什么需要 convert_hf_to_gguf.py？**'
  - '- llama.cpp 只识别 GGUF 格式，需要一个中央调度台把 HuggingFace 模型统一转换'
  - '- 支持文本模型（TextModel）与多模态投影器（MmprojModel）两大类'
  - '**convert_llama_ggml_to_gguf.py 在做什么？**'
  - '- 把旧版 GGML/GGMF/GGJT 三种格式迁移到 GGUF，是历史包袱的搬运工'
  - '- 支持从独立目录加载 HuggingFace 配置覆盖旧 GGML 的缺失参数'
  - '**convert_lora_to_gguf.py 的角色是什么？**'
  - '- LoRA 适配器以 .lora_a / .lora_b 张量对形式写入 ADAPTER 类型 GGUF'
