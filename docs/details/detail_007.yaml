exercises:
- contents:
  - 阅读 `examples/convert_legacy_llama.py` 第 300-580 行，理解以下惰性加载的核心设计：
  - 1. `LazyTensor` 的 `_load` 回调是如何实现「只在需要时才读取磁盘」的？
  - 2. `LazyUnpickler.persistent_load()` 中的 `LazyStorage` 是如何按需读取 zip 内特定偏移的？
  - 3. `lazy_load_safetensors_file()` 与 `lazy_load_torch_file()` 的 mmap 策略有何不同？
  - 回答问题：
  - '- 如果一个 70B 模型有 100 个分片，`merge_sharded()` 在不加载完整张量的情况下如何知道每个分片的形状？'
  - '- `LazyTensor.astype()` 的惰性转换是如何在加载链上叠加多个操作的？'
  'no': 1
  title: 分析惰性加载的核心设计
- contents:
  - 阅读 `examples/convert_legacy_llama.py` 第 65-90 行和第 815-870 行，理解 Q8_0 量化的完整路径：
  - 1. `Q8_0QuantizedDataType.quantize()` 的分块量化算法是如何工作的？
  - 2. `GGMLFileType.type_for_tensor()` 如何决定每个张量的输出精度？
  - 3. `bounded_parallel_map()` 在 `MostlyQ8_0` 模式下为什么切换为 `ProcessPoolExecutor`？
  - 回答问题：
  - '- 如果输入是 F16 模型但输出选择 Q8_0，`convert_to_output_type()` 与 `maybe_do_quantize()` 的调用顺序是怎样的？'
  - '- 为什么 1D 张量（如 bias）在 `type_for_tensor()` 中强制转换为 F32？'
  'no': 2
  title: 追踪 Q8_0 量化的完整路径
- contents:
  - 阅读 `tools/mtmd/legacy-models/` 下的三个手术脚本，对比它们的分离策略：
  - 1. `glmedge-surgery.py`：如何从 GLM 模型中分离视觉部分？
  - 2. `llava_surgery_v2.py`：`clean_vision_tower_from_checkpoint()` 与 `find_relevant_checkpoints()`
    的协作流程是怎样的？
  - 3. `minicpmv-surgery.py`：Resampler 投影器的 `scale_emb` 缩放是在哪里处理的？
  - 回答问题：
  - '- 为什么 GLM-Edge 需要两个脚本协作，而 LLaVA v2 可以在一个脚本中完成？'
  - '- MiniCPM-V 的 `vpm.*` 与 LLaVA 的 `model.vision_tower` 在命名上有何本质区别？'
  'no': 3
  title: 对比三种多模态分离方案
- contents:
  - 基于本章所学，为一个假想的「LLaMA v1 + CLIP 视觉塔」遗留模型设计转换验证方案：
  - 1. 写出完整的转换流水线步骤（从 PyTorch checkpoint 到可用的 mmproj GGUF）
  - 2. 列出至少 5 个关键的「转换正确性检查点」（如：张量数量、形状、词表大小、元数据完整性）
  - 3. 说明在哪些环节最容易出现「静默错误」（即转换成功但模型不可用）
  - 回答问题：
  - '- 如果 checkpoint 中同时存在 `model.embed_tokens.weight` 和 `tok_embeddings.weight`，`Params.guessed()`
    会优先选择哪一个？'
  - '- `convert_model_names()` 中的 `skip_unknown` 参数在什么场景下应该开启？开启后可能带来什么风险？'
  'no': 4
  title: 设计一个遗留模型转换的测试用例
learning_targets:
- 理解旧版 LLaMA 转换器的核心机制：惰性加载、参数猜测、Q8_0 量化与 GGMLFileType 选择策略
- 掌握 convert_legacy_llama.py 中 Params、LazyTensor、OutputFile 三大核心类的设计哲学与协作流程
- 掌握视觉编码器转换器的张量命名规范（HF→GGUF 翻译表）与元数据写入机制
- 理解多模态模型分离与重组的「手术刀」式处理流程（GLM-Edge / LLaVA / MiniCPM-V 三套方案）
- 了解 LazyStorage + LazyUnpickler 如何实现 PyTorch checkpoint 的零依赖惰性反序列化
- 理解 bounded_parallel_map 的限流并发机制与 ProcessPoolExecutor 在 Q8_0 量化中的应用
- 能阅读并修改遗留模型转换脚本以适配新的 checkpoint 格式
life_analogy:
- 想象遗留模型转换工具集是一家**「老照片修复工作室」：**
- '- **convert_legacy_llama.py** = 老照片修复师，能把 decades 前的 PyTorch checkpoint 逐步修复成可读的
  GGUF 格式'
- '- **惰性加载（LazyTensor/LazyStorage）** = 按需翻阅的放大镜，只在需要时才从底片（zip/safetensors）中读取特定区域'
- '- **Params.guessed()** = 老照片修复中的「凭痕迹推测」，通过张量名称的磨损程度（embed_tokens/W_pack/layers）反推模型的
  n_layer、n_head'
- '- **Q8_0 量化与 GGMLFileType** = 老照片的数字化压缩，AllF32/MostlyF16/MostlyQ8_0 三种精度选择就像三种不同的扫描分辨率'
- '- **convert_image_encoder_to_gguf.py** = 视觉神经的「移植手术」，把 CLIP/SigLIP 的视觉部分从 HuggingFace
  的躯体中完整取出'
- '- **GLM-Edge 双脚本协作** = 分身术第一阶段（surgery.py）把视觉部分从原 LLM 中物理分离，第二阶段（convert）把分离出来的视觉部分封装为可被
  mtmd 加载的 mmproj'
- '- **LLaVA surgery v1/v2** = 拆弹专家的两种武器：v1 是「一刀切」只读最后一个分片，v2 是「多文件侦探」跨所有分片搜索 projector
  与 newline'
- '- **MiniCPM-V 转换器** = 多版本兼容的拼装工厂，通过 minicpmv_version 参数自动识别 7 种不同版本的 Resampler
  与视觉塔结构（同时内嵌了一份 SigLIP 的纯 NumPy 复刻定义）'
- '- **bounded_parallel_map** = 限流并发的交通警察，最多同时启动 N 个线程但每个线程只缓冲 1 个结果，Q8_0 时切换 ProcessPoolExecutor
  真正利用多核'
- 就像修复师需要根据照片的年代、材质、破损程度选择不同的修复策略，遗留转换工具也需要根据模型的版本、格式、模态选择不同的提取与打包方案。
'no': 7
summary:
- concept: '`Params.guessed()`'
  desc: 通过 tensor 名称反推 n_layer/n_head/n_ff，三级回退（HF→Original→Guessed）保证兼容
- concept: '`LazyTensor/LazyStorage`'
  desc: 按需加载机制，70B 模型无需一次性装入内存，支持 PyTorch zip 与 safetensors 双格式
- concept: '`permute/part/permute_part`'
  desc: QKV 拆分与 head 维度重排，处理 HF 与 LLaMA 布局差异及 Baichuan W_pack 打包
- concept: '`merge_sharded`'
  desc: 分片模型拼接：tok_embeddings/wo/w2 按列拼接，其他按行拼接，1D 张量直接复用
- concept: '`DataType.elements_to_bytes()`'
  desc: 按 dtype.itemsize 计算字节数，非量化类型的通用接口
- concept: '`QuantizedDataType.elements_to_bytes()`'
  desc: 按 block_size 整除计算字节数，量化类型的接口
- concept: '`QuantizedDataType.quantize()`'
  desc: 量化抽象方法，由 Q8_0QuantizedDataType 用 NumPy 实现分块量化
- concept: '`Q8_0QuantizedDataType.quantize()`'
