  name: OutputFile 与 bounded_parallel_map：写入 GGUF 的「流水线工厂」
  'no': 3
  points:
  - '**OutputFile：GGUF 文件的「打包机」**'
  - '- `add_meta_model()` 通过启发式（4096→LLaMA v2）+ metadata 决定模型名'
  - '- `add_meta_arch()` 写入 vocab_size、n_layer、n_head、RoPE 等架构元数据'
  - '- `add_meta_vocab()` 与 `add_meta_special_vocab()` 抽取词表与特殊 token'
  - '- `extract_vocabulary_from_model()` 统一从 vocab.all_tokens() 取三元组'
  - '- `add_tensor_info()` 注册张量形状/类型信息到 GGUF'
  - '- `write_meta()` / `write_tensor_info()` 分阶段刷新文件'
  - '**OutputFile 静态流水线节点**'
  - '- `OutputFile.do_item` 从 LazyTensor 中真正加载并解包为 ndarray'
  - '- `OutputFile.maybe_do_quantize` 按 dt 类型决定是否调用量化函数'
  - '- `write_tensor_data()` 用 bounded_parallel_map 串接两步处理'
  - '**bounded_parallel_map：限流并发的「交通警察」**'
  - '- 同时启动 N 个线程，但每个线程最多缓冲 1 个结果，避免内存堆积'
  - '- Q8_0 量化时切换为 ProcessPoolExecutor 真正利用多核'
  - '**convert_model_names：张量重命名的「翻译官」**'
  - '- 对 MoE 模型的 expert 0/1/2 张量打包为单一 3D experts 权重'
  - '- 对 HF Q_proj/K_proj 进行 permute，对 Baichuan W_pack 拆分 Q/K/V'
  - '- 使用 `gguf.TensorNameMap` 完成 HF→GGUF 的命名规范化'
  - '- 通过 `skip_unknown` 兼容 LLaVA 等非主流架构'
  - '**精度选择与权重统计**'
  - '- `pick_output_type()` 根据 wq 张量类型自动选择 F16/F32'
  - '- `convert_to_output_type()` 调用 `type_for_tensor()` 决定每个张量的输出精度'
  - '- `per_model_weight_count_estimation()` 估算总参/共享参/expert 参数量'
  - '- `default_convention_outfile` / `default_outfile` 实现 GGUF 标准命名规范'
  - '**vocab 兼容处理**'
  - '- `check_vocab_size()` 校验 vocab 完整性，支持 `--pad-vocab` 自动补全'
  - '- `VocabFactory` 提供 SPM/BPE/HFFT 词表的统一加载入口'
  - '**顶层入口与 dump 模式**'
  - '- `OutputFile.write_vocab_only()` 仅写词表（适合 tokenizer-only 转换）'
  - '- `OutputFile.write_all()` 是完整流水线入口'
