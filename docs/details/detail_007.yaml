  name: LazyStorage 与 LazyTensor：按需加载的「记忆宫殿」
  'no': 2
  points:
  - '**为什么需要惰性加载？**'
  - '- 70B 模型可能上百 GB，无法一次性装入内存'
  - '- `LazyTensor` 只在真正需要时才从磁盘读取特定张量'
  - '**permute 与 part：拆分 QKV 的「手术刀」**'
  - '- LLaMA 的 QKV 与 HF 命名布局不同，需要通过 `permute` 调整 head 维度顺序'
  - '- Baichuan 等模型的 W_pack 把 QKV 打包在一起，需要 `permute_part` / `part` 拆分'
  - '- 三个 `*_lazy` 包装函数让 permute/part 操作也保持惰性'
  - '**LazyStorage + LazyUnpickler：模拟 torch.load 的「伪装者」**'
  - '- 通过 pickle 反序列化拦截 storage 类，按需读取 zip 内的 .pkl 文件'
  - '- `persistent_load` 根据 (module, name) 路由到对应的 LazyStorageKind'
  - '- `lazy_rebuild_tensor_v2` 进一步包装为 LazyTensor，附 description 描述'
  - '- `find_class` 通过 CLASSES 表替换 torch.* 类，零依赖完成反序列化'
  - '**safetensors mmap 加载：零拷贝读取**'
  - '- `lazy_load_safetensors_file` 用 mmap 将数据区映射到内存'
  - '- 通过 data_offsets 直接切片，无需分配中间缓冲'
  - '**格式自动识别与多文件加载**'
  - '- `lazy_load_file` 用 `@lru_cache` 缓存读取结果'
  - '- 前两字节 `PK` 判定 zip，否则按前 8 字节大小判定 safetensors'
  - '- `find_multifile_paths` 支持 `.00.pth`、`-00001-of-N.bin`、`x.bin.1` 三种命名模式'
  - '**merge_sharded：分片模型的「拼图师」**'
  - '- tok_embeddings / wo / w2 按列拼接，其他按行拼接（遵循原 LLaMA 分片策略）'
  - '- 自动识别「跨文件重复的 1D 张量」并直接复用第一份'
  - '- `merge_multifile_models` 同时处理 HF 与 LLaMA 分片两种策略'
