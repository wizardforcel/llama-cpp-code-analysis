  name: convert_legacy_llama.py：旧 LLaMA 转换器 —— 解剖「远古时代」的转换手术刀
  'no': 1
  points:
  - '**为什么需要这个脚本？**'
  - '- 它是 llama.cpp 最早期的转换器，专门处理 Meta LLaMA v1/v2、CodeLlama、Mixtral 等「老前辈」模型的 PyTorch
    checkpoint'
  - '- 即使有了 convert_hf_to_gguf.py，这些早期格式仍需要专门工具来兼容'
  - '**Params：超参数的「猜猜乐游戏」**'
  - '- `Params.guessed()` 像侦探一样通过 tensor 名称（embed_tokens/W_pack/layers）反推 n_layer、n_head'
  - '- `loadHFTransformerJson()` 与 `loadOriginalParamsJson()` 分别处理现代 HF config.json
    与 LLaMA v2 时代的 params.json'
  - '- 通过 norm_eps 与 rope_theta 等启发式判断 LLaMA v1/v2/CodeLlama/Mixtral 版本'
  - '- `Params.load()` 实现三级回退：HF→Original→Guessed'
  - '**核心数据类型：DataType 与 Q8_0QuantizedDataType**'
  - '- `UnquantizedDataType`（F16/F32/I32/BF16）负责原始数组'
  - '- `QuantizedDataType` 引入 block_size 概念，`Q8_0QuantizedDataType` 用 NumPy 实现了简易
    Q8_0 量化'
  - '- `DataType.elements_to_bytes()` 与 `QuantizedDataType.elements_to_bytes()` 分别处理非量化与量化类型的字节数计算'
  - '- `QuantizedDataType.quantize()` 是量化抽象方法，由 Q8_0 子类实现'
  - '**GGMLFileType：旧版文件格式枚举**'
  - '- `AllF32 / MostlyF16 / MostlyQ8_0` 三种输出精度选择'
  - '- 通过 `type_for_tensor()` 自动将 1D 张量统一为 F32（兼容老旧算子）'
  - '**Tensor 抽象与 BF16/FP32 转换**'
  - '- `Tensor` 抽象基类定义了 astype/permute/permute_part/part/to_ggml 五个钩子'
  - '- `UnquantizedTensor` 实现具体行为，并在 astype 时自动调用 `bf16_to_fp32` 还原位模式'
  - '**顶层 main 入口与命令行参数**'
  - '- `main()` 是 argparse 入口与全流程编排入口'
