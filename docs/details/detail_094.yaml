exercises:
- contents:
  - 运行 embedding 示例，使用相同输入文本，分别指定：
  - 1. --pooling none  2. --pooling cls  3. --pooling mean
  - 观察并回答：
  - '- 三种池化方式输出的向量维度有何差异？'
  - '- 对于句子『The quick brown fox』，CLS 和 MEAN 池化生成的向量在语义上有何不同倾向？'
  - '- NONE 池化模式下，每个 token 输出一个向量，这些向量之间有什么关联性？'
  - 进阶：修改代码，在 batch_decode() 中打印每个 token 的原始嵌入值，观察哪个 token 对 CLS 池化贡献最大。
  'no': 1
  title: 嵌入池化策略对比实验
- contents:
  - 基于 retrieval 示例，完成以下任务：
  - 1. 准备一个多主题文档（如混合技术文档、小说、新闻），用 chunk_file() 切分
  - 2. 分别测试 chunk_size=64、chunk_size=256、chunk_size=512 对检索结果的影响
  - 3. 实现一个简易的「混合检索」：同时使用余弦相似度和关键词重叠率（BM25 简化版）
  - 思考问题：
  - '- 分块过小会导致什么问题？（语义不完整）'
  - '- 分块过大会导致什么问题？（噪声干扰、 Embedding 稀释）'
  - '- 为什么在检索前进行 L2 归一化后，余弦相似度可以简化为点积？'
  - 提示：修改 batch_process() 中的 embd_norm 参数，观察不归一化时的相似度分布差异。
  'no': 2
  title: RAG 检索精度调优
- contents:
  - 深入 passkey.cpp 的 main() 函数，分析 SelfExtend 实现：
  - 1. 推导位置映射公式：给定 n_grp=2，原始位置 pos=100，压缩后的位置是多少？
  - 2. 画图表示 selfExtend 模式下，KV 缓存中位置 ID 的分布变化（前段、中段、末端）
  - 3. 修改代码：将 n_grp 从 2 改为 4，观察 n_ctx 的变化公式如何调整
  - 4. 验证实验：固定 n_junk=250，逐步增加 i_pos（passkey 位置），记录模型成功提取的最大距离
  - 思考问题：
  - '- SelfExtend 为什么要把最近的 n_keep 个 token 保留完整位置？'
  - '- seq_div(mem, 0, start, end, n_grp) 中的除法操作对注意力分数计算有何影响？'
  - '- 如果 n_grp 过大，会出现什么精度问题？（位置分辨率损失）'
  - '- passkey.cpp 的 main() 与其他示例的 __main__ 宏有何本质区别？'
  'no': 3
  title: SelfExtend 机制的数学推导与验证
- contents:
  - 对比 embedding 和 retrieval 两个示例的批处理实现：
  - 1. 在 batch_decode() 和 batch_process() 中添加时间戳，统计：
  - '   - 纯推理时间（llama_decode）'
  - '   - 嵌入提取时间'
  - '   - 归一化时间'
  - 2. 调整 n_batch 参数（如 512 → 2048），观察吞吐量变化曲线
  - 3. 分析 memory clear 的开销：注释掉 llama_memory_clear()，观察结果误差与性能变化
  - 思考问题：
  - '- 为什么嵌入场景需要清空 KV 缓存，而文本生成不需要？'
  - '- 当 n_seq（序列数）远大于 n_batch（批大小）时，如何设计流水线避免内存溢出？'
  - '- common_batch_add() 中的 position ID 为什么必须是连续的？如果不连续会发生什么？'
  'no': 4
  title: 批处理性能瓶颈分析
learning_targets:
- 理解文本嵌入的完整计算流程——从原始文本到向量表示
- 掌握多种池化策略（NONE、RANK、CLS、MEAN）的实现差异与应用场景
- 深入 llama_batch 批处理机制，实现多序列并行嵌入计算
- 掌握向量归一化（L2/L∞）与余弦相似度计算的工程实现
- 理解简易 RAG 系统的骨架：文档分块 → 向量化 → 相似度检索
- 剖析 SelfExtend 技术如何通过位置映射压缩突破上下文长度限制
- 掌握 KV 缓存的动态管理策略：llama_memory_seq_add/div/rm 的协同使用
life_analogy:
- 想象 llama.cpp 的嵌入与检索系统是一个**大型图书馆的智能化改造**：
- '- **embedding.cpp** = 图书的「语义编码室」——每本书（文本）经过处理，得到一个「语义身份证」（向量）'
- '- **池化策略** = 身份证的生成规则：'
- '  - NONE = 逐页拍照（每个 token 一个向量）'
- '  - CLS = 只看封面总结全书'
- '  - MEAN = 取全书所有页的平均印象'
- '  - RANK = 用于分类评级的特殊编码'
- '- **retrieval.cpp** = 智能检索台——你把问题（查询）也编码成向量，然后在整个图书馆中找「最近邻」的书籍段落'
- '- **余弦相似度** = 语义距离的量尺：两个向量的夹角越小，语义越接近'
- '- **passkey.cpp** = 一场「大海捞针」的极限测试：在 250 条无关新闻中藏入一条密码，看模型能否在「记忆宫殿」中准确定位'
- ''
- SelfExtend 技术就像一个**聪明的图书管理员**：当书架（上下文）不够长时，他把旧书按「每 n 本合并一格」的方式压缩摆放，让有限的空间容纳更多的知识，同时保证最近的书（位置信息）仍然完整可寻。
'no': 93
summary:
- concept: llama_pooling_type
  desc: 池化类型决定嵌入提取方式，NONE=逐token / CLS=取首token / MEAN=平均 / RANK=分类头
- concept: llama_get_embeddings_ith/seq
  desc: 嵌入提取双入口：ith 用于 NONE 池化，seq 用于 CLS/MEAN/RANK 序列级池化
- concept: common_embd_normalize
  desc: L2/L∞ 向量归一化，消除量纲影响，适配余弦相似度计算
- concept: llama_batch / common_batch_add
  desc: 批处理核心结构，支持多序列并行推理，通过 seq_id 区分不同序列
- concept: llama_memory_clear
  desc: 嵌入场景无需历史状态，每次解码前清空 KV 缓存避免干扰
- concept: chunk_file
  desc: 文档分块策略：按分隔符（如句号）智能切分，保留文件偏移元数据
- concept: common_embd_similarity_cos
  desc: 余弦相似度计算：dot(a,b) / (|a|*|b|)，值域 [-1,1]，越大越相似
- concept: SelfExtend / n_grp
  desc: 位置压缩技术：pos_in_group = pos / n_grp，突破训练时上下文限制
- concept: llama_memory_seq_add / seq_div
  desc: KV 缓存位置动态调整：add 平移位置，div 等比压缩，实现 SelfExtend
- concept: llama_memory_seq_rm / n_keep
  desc: 缓存清理策略：保留前 n_keep 个 token（注意力汇聚点），移除中间段释放空间
- concept: RAG 骨架
  desc: 检索增强生成的最简实现：文档向量化预计算 + 查询时余弦相似度匹配
- concept: 贪心采样 llama_sampler_init_greedy
  desc: passkey 测试使用确定性解码，排除采样随机性，专注验证上下文记忆能力
- concept: main() vs __main__
  desc: passkey.cpp 使用标准 main() 函数作为入口，区别于其他示例的 __main__ 命名约定
