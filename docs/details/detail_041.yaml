summary:
- concept: '`ggml_backend_rpc_init/start_server/add_server`'
  desc: RPC 后端三大入口：客户端初始化、服务端启动、注册远程设备，用于跨网络分发计算任务
- concept: '`struct rpc_tensor` / `serialize_tensor()` / `rpc_server::deserialize_tensor()`'
  desc: RPC 张量传输协议：将本地 ggml_tensor 转换为网络字节流格式（包含 ID、形状、缓冲区间接引用），在服务端反序列化重建
- concept: '`graph_cache.is_cached()` / `ggml_backend_rpc_graph_compute()`'
  desc: RPC 图缓存优化：客户端记录已执行的计算图节点哈希，若本次调用与上次完全一致则发送 `GRAPH_RECOMPUTE` 命令跳过序列化与重建
- concept: '`set_tensor_hash()` / `HASH_THRESHOLD`'
  desc: RPC 大权重传输优化：超过 10MB 的张量先计算 FNV 哈希并查询服务端缓存，命中则免传输
- concept: '`get_socket()` / `send_rpc_cmd()` / `recv_msg()`'
  desc: RPC Socket 管理：连接缓存（weak_ptr）、命令封装发送、消息大小校验接收
- concept: '`rpc_server::rpc_server()` / `rpc_server::hello()` / `rpc_server::alloc_buffer()`
    / `rpc_server::set_tensor()` / `rpc_server::graph_compute()` / `rpc_server::graph_recompute()`'
  desc: RPC 服务端核心处理：构造初始化、hello 握手、alloc_buffer、set/get_tensor、graph_compute、graph_recompute
    等
- concept: '`rpc_server::buffer_get_base()` / `rpc_server::get_alignment()` / `rpc_server::get_max_size()`
    / `rpc_server::get_alloc_size()`'
  desc: RPC 设备属性查询服务：基地址、对齐、最大尺寸、分配大小的远程获取
- concept: '`ggml_backend_rpc_device_*` / `ggml_backend_rpc_reg_*`'
  desc: RPC 设备与注册表接口：设备名称/描述/内存/算子支持、注册表名称/设备计数/进程地址获取
- concept: '`apir_serialize_tensor()` / `apir_add_tensor()` / `apir_serialize_graph()`'
  desc: VirtGPU 前端序列化：将 GGML 张量/计算图编码为 APIR 协议所需的字节流，通过共享内存或临时缓冲区送往 Host
- concept: '`apir_deserialize_tensor()` / `apir_create_node()` / `apir_deserialize_graph()`'
  desc: VirtGPU 后端反序列化：在 Host 侧重建 ggml 上下文和计算图，准备执行
- concept: '`apir_track_backend_buffer()` / `apir_decode_ggml_buffer()`'
  desc: VirtGPU 缓冲区句柄安全校验：跟踪已分配的 Host 缓冲区，防止 Guest 传入伪造指针
- concept: '`apir_backend_initialize()` / `apir_backend_dispatcher()` / `apir_backend_deinit()`'
  desc: VirtGPU 后端生命周期：动态加载真实后端库、按命令索引分发表、卸载资源
- concept: '`apir_encoder` / `apir_decoder`'
  desc: VirtGPU 编解码基础设施：内存安全的读写指针、fatal 错误标志、多种基本类型（uint32_t/size_t/bool/指针/数组）的编解码
- concept: '`apir_encoder::apir_new_encoder()` / `apir_encoder_write()` / `apir_encoder_set_fatal()`
    / `apir_decoder::apir_new_decoder()` / `apir_decoder_read()` / `apir_decoder_peek()`
    / `apir_decoder_use_inplace()`'
  desc: VirtGPU 编码器/解码器核心方法：构造、写入、错误标记、读取、预读、原地访问等内存安全操作
- concept: '`apir_encode_uint32_t()` / `apir_encode_size_t()` / `apir_encode_bool_t()`
    / `apir_encode_char_array()` / `apir_encode_blob_array()` 及对应 decode 函数'
  desc: VirtGPU 基础类型编解码函数族：支持 uint32/uint64/size_t/bool/char*/blob 等类型的双向转换
- concept: '`REMOTE_CALL_PREPARE` / `REMOTE_CALL` / `remote_call_finish()`'
  desc: VirtGPU 远程调用三步曲：准备编码器 → 执行 hypercall → 解码响应
- concept: '`virtgpu_shmem_create()` / `virtgpu_shmem_destroy()`'
  desc: VirtGPU 共享内存管理：通过 DRM ioctl 创建 Host/Guest 共享的 blob 资源并映射到用户空间，实现零拷贝数据传输
- concept: '`RemotingCodebaseGenerator.__init__()` / `RemotingCodebaseGenerator.regenerate_codebase()`
    / `main()`'
  desc: VirtGPU 代码自动化：生成器初始化（加载 YAML 配置）、从配置读取函数列表自动生成 `apir_backend.gen.h`、`backend-dispatched.gen.h`、`virtgpu-forward.gen.h`
    三份协议头文件的核心方法；`main()` 是脚本入口，负责创建生成器并执行代码库重生成
- concept: '`current_time_ms()`'
  desc: VirtGPU 计时工具：获取纳秒级时间戳，用于性能统计
- concept: '`backend-dispatched.gen.h` 中的 25 个命令处理函数声明'
  desc: VirtGPU 自动生成的命令分发表：device/buffer-type/buffer/backend 四类命令的函数指针映射
- concept: '`virtgpu::cleanup()`'
  desc: VirtGPU 资源清理：释放设备名称、描述、缓冲区名称并销毁互斥锁
- concept: '`include/apir_hw.h` 中的 `virgl_renderer_capset_apir`'
  desc: VirtGPU 硬件能力集结构：定义 APIR 版本与 blob 资源支持标志
- concept: '`ggml_backend_zdnn_buffer_init_tensor()` / `ggml_zdnn_load_tensor()`'
  desc: zDNN 缓冲区初始化：为 IBM Z NNPA 创建标准 zTensor 描述符，并通过 `zdnn_transform_ztensor()` 完成格式转换
- concept: '`ggml_zdnn_compute_forward()` / `ggml_zdnn_mul_mat_f()`'
  desc: zDNN 计算入口：只处理 `GGML_OP_MUL_MAT`，调用 NNPA 硬件的 `zdnn_matmul_transpose_op()` 完成矩阵乘加
- concept: '`ggml_zdnn_supports_op()`'
  desc: zDNN 算子支持检查：仅接受 F32/F16/BF16 类型、矩阵形状、连续布局的 MUL_MAT 操作，且有批次上限
- concept: '`ggml_backend_zdnn_device_acq()` / `rel()`'
  desc: zDNN 设备引用计数：acq 增加引用并初始化 NNPA 参数块格式，rel 减少引用，归零时清理
- concept: '`ggml_zendnn_matmul<>()` / `zendnnl::lowoha::matmul::matmul_direct()`'
  desc: ZenDNN 核心矩阵乘：模板函数封装 ZenDNN 库的 matmul_direct API，支持 FP32 和 BF16 数据路径
- concept: '`ggml_zendnn_compute_forward_mul_mat()`'
  desc: ZenDNN MUL_MAT 前向：处理批量维度循环，必要时将 FP32 输入先转换为 BF16 再执行
- concept: '`ggml_zendnn_compute_forward_mul_mat_id()` / `mmid_row_mapping`'
  desc: ZenDNN MoE 分组策略：按专家 ID 将输入行分组（mmid_row_mapping 记录原始位置），每组独立调用矩阵乘，最后将结果按原始位置散回
- concept: '`ggml_backend_zendnn_context`'
  desc: ZenDNN 上下文：存储线程数配置和工作缓冲区（std::unique_ptr<char[]>），用于 MoE 场景的输入类型转换与临时矩阵存储
- concept: '`ggml_backend_zendnn_device_supports_op()`'
  desc: ZenDNN 算子过滤：仅支持 MUL_MAT 和 MUL_MAT_ID（且专家数 ≤ 32），以及基础形状重排操作
- concept: '`ggml_backend_zendnn_set_n_threads()`'
  desc: ZenDNN 线程控制：允许用户设置后端内部线程数，影响 OpenMP 并行度
