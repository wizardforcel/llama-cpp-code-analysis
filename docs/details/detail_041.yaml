  title: 对比四种后端的设备注册与算子支持策略
learning_targets:
- 理解 RPC 后端的架构设计：如何通过「命令字节 + 长度 + 数据」协议将 GGML 计算图跨网络传输到远程服务器执行
- 掌握 RPC 客户端/服务端的握手协议（HELLO 版本检查）、Socket 连接管理、缓冲区管理和张量序列化/反序列化机制
- 理解 graph_cache 缓存优化：如何通过节点比对实现「图重计算」快进模式，避免重复传输计算图
- 掌握 VirtGPU API Remoting 的实现原理：如何通过共享内存、APIR 协议和代码生成实现 Guest → Host 的透明远程调用
- 理解 VirtGPU 前后端分离架构：前端序列化（apir_cs_ggml-rpc-front）与后端反序列化（apir_cs_ggml-rpc-back）的对称设计
- 掌握 VirtGPU 编码器/解码器的内存安全机制：apir_encoder/apir_decoder 如何防止缓冲区溢出和整数溢出
- 理解 VirtGPU 代码自动生成机制：从 YAML 配置到三份协议头文件的自动化生成流程（RemotingCodebaseGenerator）
- 理解 zDNN 后端如何利用 IBM Z NNPA 加速器执行矩阵乘法：张量描述符、zTensor 转换和专用缓冲区管理
- 掌握 ZenDNN 后端的 AMD CPU 优化路径：matmul_direct 调度、BF16/FP32 混合支持与 MoE 专家分组策略
- 理解 ZenDNN 上下文管理与行映射机制：ggml_backend_zendnn_context 的工作缓冲区生命周期与 mmid_row_mapping 的
  MoE 行追踪
- 能阅读并分析四种后端的设备注册、缓冲区类型定义、算子支持检查、图计算入口等关键接口
life_analogy:
- 想象 GGML 的四种「边界后端」是四家风格迥异的**跨国物流与加工服务**：
- '- **RPC 后端** = 顺丰国际快递：把计算任务「打包快递」到远程仓库，对方签收后拆包执行，再把结果寄回来'
- '  - `serialize_tensor()` = 打包员把货物装入标准集装箱'
- '  - `set_tensor_hash()` = 之前寄过的大宗货物直接走「电子签收」，不用拆箱检查'
- '  - `graph_cache` = 老客户复购清单，同样订单直接发货不用重新打包'
- '- **VirtGPU** = 虚拟办公室里的同层协作文档：即使你在子公司的虚拟办公室（Guest），也能通过共享白板（共享内存）直接在母公司（Host）的资源库上操作，就像在同一张桌子上工作'
- '  - `apir_serialize_graph()` = 把工作计划书整理成投屏格式'
- '  - `virtgpu_shmem_create()` = 申请一块共享白板区域'
- '  - `backend_dispatch_initialize()` = 接通母公司内部资源系统'
- '  - `apir_encoder/apir_decoder` = 双向翻译官，确保 Guest 和 Host 说的「语言」完全一致'
- '  - `RemotingCodebaseGenerator` = 行政秘书，定期按模板（YAML）自动生成最新通讯录（头文件），确保两个办公室的电话号码完全同步'
- '- **zDNN 后端** = IBM 专属「矩阵快餐店」：只接受标准盒子（zTensor）装好的食材，只能做特定套餐（MUL_MAT），但出餐速度极快'
- '  - `ggml_backend_zdnn_buffer_init_tensor()` = 把散装食材装进标准盒'
- '  - `zdnn_transform_ztensor()` = 后厨预处理（切割、腌制）'
- '  - `ggml_zdnn_mul_mat_f()` = 按下「矩阵套餐」按钮，NNPA 加速器出餐'
- '- **ZenDNN 后端** = AMD 厨房专用的「高效炉灶」：专为 AMD CPU 优化，擅长大锅菜（MUL_MAT）和分锅小炒（MUL_MAT_ID
  MoE）'
- '  - `ggml_zendnn_matmul()` = 调用 ZenDNN 炉灶的标准菜谱'
- '  - `ggml_zendnn_compute_forward_mul_mat_id()` = 把不同顾客的订单按口味分组，分别下锅再合并上菜'
- '  - `ggml_backend_zendnn_context` = 厨师的工作台，放着随时取用的临时食材（工作缓冲区）'
- '  - `mmid_row_mapping` = 每道菜的分工单，记录这道菜原本属于哪桌客人（专家 ID、批次位置）'
- 四者共同印证一个道理：**不是所有计算都要在本地完成，有时是网络传输更划算，有时是虚拟化穿透更高效，有时是专用硬件更省电，有时是 CPU 优化库更懂你的数据类型。**
