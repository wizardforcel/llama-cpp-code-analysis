  name: ZenDNN 后端 —— AMD CPU 的「矩阵发动机」
  'no': 4
  points:
  - '**为什么需要 ZenDNN？**'
  - '- 专为 AMD CPU 优化的矩阵乘法库，替代纯 CPU 的通用实现'
  - '- 主要聚焦 `MUL_MAT` 与 `MUL_MAT_ID`（MoE）两大算子'
  - '- 通过 ZenDNN 库的 `matmul_direct` 接口直接调用底层优化 kernel'
  - '**核心计算路径**'
  - '- `ggml_zendnn_matmul<>()` 模板函数封装 `zendnnl::lowoha::matmul::matmul_direct()`'
  - '- 支持 F32 与 BF16 的组合：`<float,float,float>`、`<bf16,bf16,bf16>`、`<bf16,bf16,float>`'
  - '- `ggml_zendnn_sgemm()` 根据 A/B/C 三个矩阵的实际类型分发到对应的模板实例'
  - '- `ggml_zendnn_compute_forward_mul_mat()` 处理批量维度循环与类型转换（FP32→BF16）'
  - '**MoE 的「分组对齐」策略**'
  - '- `ggml_zendnn_compute_forward_mul_mat_id()` 先把输入按专家 ID 分组'
  - '- `mmid_row_mapping` 记录每行的原始位置（expert_id, batch_idx）'
  - '- 每个专家执行独立的矩阵乘法，结果先写到临时缓冲区 `dst_cur`'
  - '- 最后根据 `mmid_row_mapping` 把结果散回原始位置'
  - '**工作缓冲区管理**'
  - '- `ggml_backend_zendnn_context` 维护一个可增长的工作缓冲区 `work_data`'
  - '- 如果输入类型与权重类型不匹配，需要先在 `work_data` 中完成类型转换'
  - '- MoE 场景下，`work_data` 需容纳转换后的输入、分组后的临时矩阵和结果'
  - '**上下文与行映射的隐式管理**'
  - '- `ggml_backend_zendnn_context` 通过隐式构造/析构管理线程数配置和 `std::unique_ptr<char[]> work_data`'
  - '- 工作缓冲区按需扩展（`work_size` 记录当前容量），避免重复分配'
  - '- `mmid_row_mapping` 结构体隐式定义 `i1`（输入批次索引）和 `i2`（专家/样本索引），用于 MoE 分组后的行位置恢复'
  - '**后端接入与设备能力**'
  - '- `ggml_backend_zendnn_init()` 创建后端并注册到设备 0'
  - '- `ggml_backend_zendnn_graph_compute()` 遍历计算图，只处理 MUL_MAT/MUL_MAT_ID'
  - '- 其他算子（如 reshape/view）直接跳过，由其他后端处理'
  - '**线程与并发控制**'
  - '- `ggml_backend_zendnn_set_n_threads()` 允许用户控制线程数'
  - '- 影响 OpenMP 并行循环的线程数量'
  - '**设备能力查询**'
  - '- `ggml_backend_zendnn_device_supports_op()` 过滤不支持的算子'
  - '- 仅支持 MUL_MAT、MUL_MAT_ID（专家数 ≤ 32）、基础重排操作'
  - '- `ggml_backend_zendnn_device_supports_buft()` 只支持主机缓冲区'
  - '- `ggml_backend_zendnn_device_get_buffer_type()` 返回 CPU 缓冲区类型'
  - '**注册表接口**'
  - '- `ggml_backend_zendnn_reg()` 返回静态注册表，包含一个设备'
  - '- `ggml_backend_zendnn_reg_get_device()` 返回静态设备对象'
  - '- `ggml_backend_zendnn_get_proc_address()` 目前只暴露 `ggml_backend_set_n_threads`'
