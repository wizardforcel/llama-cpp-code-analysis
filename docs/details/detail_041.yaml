  name: zDNN 后端 —— IBM Z 的「矩阵加速器」
  'no': 3
  points:
  - '**IBM Z NNPA 的特殊「口味」**'
  - '- zDNN 后端面向 IBM Z 系列 NNPA 加速器，只接受特定布局的张量'
  - '- 支持 F32/F16/BF16 的矩阵乘法，偏硬件原生数据流'
  - '- 不支持的算子会被拒绝，由其他后端处理'
  - '**缓冲区与张量描述**'
  - '- `ggml_backend_zdnn_buffer` 里维护 `ztensor` 与 `pre_tfm_desc`'
  - '- `init_tensor()` 会根据算子类型准备 zDNN 张量描述'
  - '- 对 `MUL_MAT` 额外分配 bias 缓冲区（`zdnn_bias_buffer`）'
  - '**张量数据的「预加工」**'
  - '- `buffer_set_tensor()`：先把数据拷贝到张量，再 `zdnn_transform_ztensor()` 转成 zTensor'
  - '- 如果已转换过，需要先 `zdnn_reset_ztensor()` 再重新加载'
  - '- `ggml_zdnn_load_tensor()` 完成实际的格式转换'
  - '**图执行只认核心算子**'
  - '- `ggml_zdnn_graph_compute()` 遍历图中所有节点'
  - '- 跳过 reshape/view/permute/transpose 等非计算节点'
  - '- 对 `GGML_OP_MUL_MAT` 调用 `ggml_zdnn_compute_forward_mul_mat()`'
  - '- 底层调用 `zdnn_matmul_transpose_op()` 利用 NNPA 硬件'
  - '**设备注册与生命周期管理**'
  - '- `ggml_backend_zdnn_device_acq()` 引用计数式设备获取'
  - '- `ggml_backend_zdnn_device_rel()` 释放时减少引用，归零时清理'
  - '- `ggml_backend_zdnn_reg()` 注册后端并用 `atexit()` 做清理'
  - '- `ggml_backend_zdnn_reg_device_count()` 运行时检测 NNPA 是否安装'
  - '**算子支持检查**'
  - '- `ggml_zdnn_supports_op()` 只允许 F32/F16/BF16、连续布局的 MUL_MAT'
  - '- 检查批次大小是否超过 NNPA 的 `max_dim_idx_size` 上限'
  - '- 不支持 view、量化类型、非连续张量'
