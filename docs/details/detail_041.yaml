  - 1. 阅读 `ggml_backend_zdnn_device_acq()` 和 `ggml_backend_zdnn_reg_device_count()`，说明设备数量是如何在运行时决定的，为什么需要
    `zdnn_is_nnpa_installed()` 检查？
  - 2. 阅读 `ggml_backend_zdnn_buffer_init_tensor()`，画出从 `ggml_tensor` 到 `zdnn_buffer`
    再到 `ztensor` 的创建链路，指出 `tensor->extra` 指针的作用
  - 3. 问题：`ggml_zdnn_supports_op()` 为什么对 weights 和 inputs 都要求「连续布局」（`ggml_is_contiguous()`）？如果传入
    permute 后的非连续张量会发生什么？
  - 4. 思考 zDNN 的「只支持 MUL_MAT」对其他算子（如 ADD、SOFTMAX）意味着什么？在 llama.cpp 的多后端调度中，这些不支持的算子会被调度到哪里去？
  'no': 6
  title: 分析 zDNN 的「惰性初始化」与类型限制
- contents:
  - ZenDNN 后端的 `MUL_MAT_ID` 实现了高效的专家路由计算。
  - 1. 阅读 `ggml_zendnn_compute_forward_mul_mat_id()`（267-379 行），用纸笔画出「输入张量 → 按专家分组
    → 分组矩阵乘 → 散回输出」的数据流
  - 2. 计算：假设有 8 个专家、批次大小 16、每个 token 选 2 个专家，矩阵维度 d_model=1024。`matrix_row_counts`
    数组的最大可能值是多少？`ggml_zendnn_sgemm()` 会被调用多少次？
  - 3. 为什么 ZenDNN 选择「先按专家分组，再按行收集到 `wdata_cur`，最后结果散回」这个三段式策略，而不是直接在原输入上按行计算多次？
  - 4. 思考题：`ggml_backend_zendnn_device_supports_op()` 中对 `MUL_MAT_ID` 的专家数限制 `max_experts
    = 32` 可能来源于什么硬件约束或性能考虑？
