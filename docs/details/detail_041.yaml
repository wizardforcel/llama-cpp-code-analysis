exercises:
- contents:
  - 假设你有一个包含 3 个节点的计算图（MUL → ADD → SILU），需要发送到远程 RPC 后端执行。
  - 1. 阅读 `ggml_backend_rpc_graph_compute()` 函数（880-900 行），画出客户端的执行流程图，标注 `graph_cache.is_cached()`
    的判断分支
  - 2. 追踪 `serialize_graph()` 生成的字节流结构，写出其内存布局（device | n_nodes | nodes[] | n_tensors
    | tensors[] 各占多少字节）
  - 3. 回答：如果两次调用传入完全相同数量、相同形状的节点（仅数据不同），会走哪个命令？为什么这是合理的优化？
  - 4. 思考题：`rpc_server::graph_compute()` 中使用 `stored_graphs[device].buffer` 做什么？为什么需要预分配上下文内存？
  'no': 1
  title: 追踪一次完整的 RPC 图执行
- contents:
  - VirtGPU 后端采用编码器/解码器对称设计。请完成以下分析：
  - 1. 打开 `apir_cs_ggml-rpc-front.cpp` 的 `apir_serialize_tensor()` 和 `backend/apir_cs_ggml-rpc-back.cpp`
    的 `apir_deserialize_tensor()`，逐行对比两者处理的字段：type、ne[]、nb[]、op、src[]、view_src 等
  - 2. 特别观察 `data` 字段：前端为什么将 `tensor->data` 转换为「相对于缓冲区基址的偏移量」？后端又是如何还原的？
  - 3. 思考问题：为什么要用 `BUFFER_TO_HOST_HANDLE()` 宏转换缓冲区指针？如果不在 Guest/Host 之间使用句柄映射，直接传指针会有什么问题？
  - 4. 阅读 `apir_create_node()` 函数，解释它为什么要先用 `tensor_map.find(id)` 检查，再递归创建子节点？这解决了图中的什么拓扑问题？
  'no': 2
  title: 对比 VirtGPU 前端序列化与后端反序列化的对称性
- contents:
  - VirtGPU 后端的初始化过程涉及多次跨进程通信。请回答：
  - 1. 阅读 `virtgpu.cpp` 中的 `virtgpu_handshake()` 函数，说明握手阶段交换了哪些信息？为什么要检查 `APIR_PROTOCOL_MAJOR/MINOR`
    版本号？
  - 2. 阅读 `virtgpu_load_library()` 和 `backend_dispatch_initialize()`，描述从「Guest 发起
    LOADLIBRARY 命令」到「Host 侧 dlopen 后端库并返回设备数」的完整流程
  - 3. 阅读 `backend.cpp` 中的 `apir_backend_dispatcher()`，说明它如何根据 `cmd_type` 索引 `apir_backend_dispatch_table[]`
    并调用对应的处理函数
  - 4. 思考题：`apir_backend_dispatch_table[]` 中的函数指针顺序是如何保证与前端 `virtgpu-forward.gen.h`
    中的声明一一对应的？为什么要用代码生成器维护这个映射？
  'no': 3
  title: 分析 VirtGPU 远程调用的三次握手与命令分发
- contents:
  - VirtGPU 的 `apir_encoder` 和 `apir_decoder` 提供了内存安全的序列化接口。请分析：
  - 1. 阅读 `backend/shared/apir_cs.h`，解释 `apir_decoder_use_inplace()` 和 `apir_decoder_peek()`
    的区别：前者何时使用？后者何时使用？
  - 2. 说明 `apir_decoder_set_fatal()` 的作用：当解码器检测到越界读取或不一致状态时，会发生什么？如何避免恶意 Guest 构造畸形数据导致
    Host 崩溃？
  - 3. 阅读 `backend/shared/apir_cs_ggml.h` 中的 `apir_decode_ggml_buffer()`，解释为什么要调用
    `apir_decoder_set_fatal(dec)` 并返回 NULL？这在安全防护中扮演什么角色？
  - 4. 思考题：`apir_encode_ggml_tensor_inline()` 为什么不支持带有 `tensor->extra` 的张量？如果要支持，需要在前端/后端之间传递哪些额外信息？
  - 5. 进阶：阅读 `apir_encode_uint32_t()` / `apir_decode_uint32_t()`、`apir_encode_size_t()`
    / `apir_decode_size_t()`、`apir_encode_bool_t()` / `apir_decode_bool_t()` 的实现，理解为什么需要对基本类型做对齐和尺寸断言？
  'no': 4
  title: 分析 VirtGPU 编码器/解码器的内存安全机制
- contents:
  - VirtGPU 使用 `regenerate_remoting.py` 自动生成三份协议头文件。请分析该流程：
  - 1. 阅读 `RemotingCodebaseGenerator.__init__()`，说明它如何加载 YAML 配置文件并检查 clang-format
    可用性
  - 2. 阅读 `regenerate_codebase()`，描述从读取配置到生成 `apir_backend.gen.h`、`backend-dispatched.gen.h`、`virtgpu-forward.gen.h`
    的完整步骤
  - 3. 阅读 `generate_apir_backend_header()`，解释如何为每个函数生成枚举值并分配命令索引
  - 4. 思考题：`main()` 函数作为脚本入口，如何捕获异常并退出？如果在生成过程中某个头文件写入失败，会发生什么？
