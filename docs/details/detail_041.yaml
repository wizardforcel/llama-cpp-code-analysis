  name: RPC 后端 —— 跨网络的「算力传送门」
  'no': 1
  points:
  - '**为什么需要 RPC 后端？**'
  - '- 单机算力不足时，需要把 GGML 计算图远程分发到另一台主机'
  - '- 类比：把「图纸」带到隔壁更强的「工坊」去执行，再把结果带回来'
  - '- 将本地后端变成网络服务，让 GGML 在不感知网络的前提下完成远端执行'
  - '**客户端/服务端协议设计**'
  - '- 协议头包含版本号（`RPC_PROTO_MAJOR/MINOR/PATCH`），`HELLO` 握手做兼容性检查'
  - '- 所有命令都走「命令字节 + 长度 + 数据」的统一序列化格式'
  - '- `RPC_CMD_*` 枚举覆盖缓冲区、张量传输、图执行、设备查询等 15 类操作'
  - '**Socket 管理与连接缓存**'
  - '- `get_socket()` 维护 endpoint → socket 的弱指针缓存，避免重复连接'
  - '- `send_data()` / `recv_data()` 支持超过 1 GiB 的大数据分块传输'
  - '- `check_server_version()` 在连接建立时执行版本握手'
  - '**缓冲区与张量的远程管理**'
  - '- `ggml_backend_rpc_buffer_*` 接口把远端缓冲区包装成本地对象'
  - '- `serialize_tensor()` / `deserialize_tensor()` 负责张量元数据与缓冲区的编码解码'
  - '- 服务端通过 `rpc_server::set_tensor_hash()` 利用 FNV 哈希缓存避免重复传输大权重'
  - '**图执行的「快进模式」**'
  - '- `graph_cache` 对比节点序列判断是否重复执行同一图'
  - '- 若一致则走 `RPC_CMD_GRAPH_RECOMPUTE` 直接重算，跳过图重建开销'
  - '- 否则走 `RPC_CMD_GRAPH_COMPUTE`，将整张图序列化后发给服务端重建执行'
  - '**服务的启动与设备注册**'
  - '- `ggml_backend_rpc_start_server()` 启动 socket 监听并接收客户端连接'
  - '- 客户端通过 `ggml_backend_rpc_add_server()` 注册远程 endpoint'
  - '- `ggml_backend_rpc_reg()` 提供统一注册表入口，完成设备发现与后端接入'
  - '**设备接口的细节**'
  - '- `ggml_backend_rpc_device_get_memory()` 通过 RPC 调用查询远程设备内存'
  - '- `ggml_backend_rpc_device_supports_op()` 默认支持所有算子（透传）'
  - '- `ggml_backend_rpc_device_supports_buft()` 检查缓冲区类型是否匹配同一 endpoint 和 device'
  - '**服务端设备属性查询服务**'
  - '- `rpc_server::get_alloc_size()` 在服务端计算张量的实际分配大小（考虑后端特殊需求）'
  - '- `rpc_server::get_alignment()`、`rpc_server::get_max_size()`、`rpc_server::buffer_get_base()`
    提供设备缓冲区属性查询'
