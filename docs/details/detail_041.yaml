  name: VirtGPU API Remoting —— 虚拟化里的「隐形传送带」
  'no': 2
  points:
  - '**为什么需要 VirtGPU 远程调用？**'
  - '- 在虚拟化环境中，Guest 想使用 Host 上真实 GPU 执行 GGML 计算'
  - '- 通过 virtio-GPU 把后端 API 「远程化」，像在本地调用一样透明'
  - '- 类比：在虚拟机里放了一条直通宿主机的「传送带」'
  - '**前端初始化与设备发现**'
  - '- `apir_initialize()` 创建 virtgpu 对象并缓存设备信息（名称、描述、内存）'
  - '- `ggml_backend_virtgpu_reg()` 返回注册表，内部调用 `ggml_backend_remoting_reg_init_devices()`'
  - '- `ggml_backend_remoting_get_device()` 根据索引返回设备'
  - '**前端序列化：把图和张量打包带走**'
  - '- `apir_serialize_tensor()` 将张量元数据、buffer 句柄、data 偏移安全编码'
  - '- `apir_add_tensor()` 递归收集依赖，避免重复序列化'
  - '- `apir_serialize_graph()` 将整张计算图切成字节流供传输'
  - '**共享内存：Guest/Host 的「零拷贝」通道**'
  - '- `virtgpu_shmem_create()` 通过 DRM ioctl 创建 Host/Guest 共享的 blob 资源'
  - '- 图计算数据优先走共享内存（`gpu->data_shmem`），避免多次复制'
  - '- `apir_backend_graph_compute()` 在解码后完成重建并执行图计算'
  - '**后端分发：命令到达后的「分工台」**'
  - '- `apir_backend_initialize()` 在 Host 侧加载真实后端库（如 CUDA、Metal）'
  - '- `backend_dispatch_initialize()` 注册后端、获取设备、初始化后端实例'
  - '- `apir_backend_dispatcher()` 用命令类型索引 `apir_backend_dispatch_table[]` 分发请求'
  - '- `backend-dispatched-*` 系列函数按设备/缓冲区/图计算分类处理'
  - '- `backend-dispatched.gen.h` 由代码生成器自动维护 25 个命令处理函数的映射关系'
  - '**后端反序列化：Host 侧的「拆包重建」**'
  - '- `apir_deserialize_tensor()` 重建 ggml_tensor，验证缓冲区句柄'
  - '- `apir_create_node()` 递归创建依赖节点，利用 tensor_map 去重'
  - '- `apir_deserialize_graph()` 重建完整的 ggml_cgraph'
  - '**编码器/解码器：双向翻译的「安全卫士」**'
  - '- `apir_encoder` / `apir_decoder` 维护读写指针和 fatal 错误标志'
  - '- `apir_encoder::apir_new_encoder()` / `apir_encoder_write()` / `apir_encoder_set_fatal()`
    构成编码核心'
  - '- `apir_decoder::apir_new_decoder()` / `apir_decoder_read()` / `apir_decoder_peek()`
    / `apir_decoder_use_inplace()` 构成解码核心'
  - '- 提供数十种基本类型（uint32_t、size_t、bool、指针、数组、字符串、blob）的编解码函数'
  - '- `apir_decode_ggml_buffer()` 校验缓冲区句柄是否在 Host 跟踪集合中，防止伪造指针'
  - '**自动化代码生成：协议一改，代码全同步**'
  - '- `regenerate_remoting.py` 根据 YAML 配置自动生成头文件，入口为 `main()` 函数'
  - '- 输出 `apir_backend.gen.h`、`backend-dispatched.gen.h`、`virtgpu-forward.gen.h`'
  - '- 保证前端/后端协议索引一致，降低手工维护成本'
  - '**远程调用的三次握手与资源清理**'
  - '- `virtgpu_handshake()` 交换 APIR 协议版本'
  - '- `virtgpu_load_library()` 触发 Host 侧 dlopen 真实后端库'
  - '- `apir_backend_deinit()` 释放所有跟踪的缓冲区并卸载库'
  - '- `virtgpu::cleanup()` 释放设备名称、描述等缓存字符串并销毁互斥锁'
  - '**硬件抽象层定义**'
  - '- `include/apir_hw.h` 定义 `virgl_renderer_capset_apir` 结构体，声明 APIR 版本和 blob 资源支持'
