  title: 推导 ZenDNN 的 MoE 分组逻辑
- contents:
  - ZenDNN 的 `ggml_backend_zendnn_context` 承载了关键的运行时状态。请分析：
  - 1. 阅读 `ggml_backend_zendnn_context` 结构体定义（15-19 行），说明 `n_threads` 和 `work_data`
    / `work_size` 的作用
  - 2. 阅读 `ggml_zendnn_compute_forward_mul_mat_id()` 中 `if (ctx->work_size < total_size)`
    这段逻辑，解释为什么要按需扩展工作缓冲区，而不是每次分配固定大小？
  - 3. 阅读 `mmid_row_mapping` 结构体（262-265 行），说明 `i1` 和 `i2` 分别代表什么含义，它们如何帮助在 MoE 分组后恢复原始的
    token 顺序？
  - 4. 思考题：`ggml_backend_zendnn_set_n_threads()` 更新的线程数，在 `ggml_zendnn_matmul()` 的
    OpenMP 并行循环中如何生效？如果线程数设置过多会发生什么？
  'no': 8
  title: 分析 ZenDNN 的上下文与工作缓冲区管理
- contents:
  - 四种后端（RPC、VirtGPU、zDNN、ZenDNN）都实现了 ggml_backend_reg_t 接口，但注册时机和设备模型各不相同。
  - 1. 列出每个后端的 `ggml_backend_*_reg()` 或 `ggml_backend_*_init()` 函数，标注：何时被调用？返回的是动态创建还是静态变量？
  - 2. 分析 RPC 后端的 `ggml_backend_rpc_add_server()` 为什么使用 `static std::unordered_map<std::string,
    ggml_backend_reg_t> reg_map` 做进程级缓存？这在多线程场景下有什么风险和保护机制？
  - 3. 对比 zDNN 的「引用计数设备管理」（`acq/rel`）与 ZenDNN 的「单例初始化」：为什么 IBM NNPA 需要引用计数，而 AMD CPU
    优化库不需要？
  - 4. 思考题：如果让你为某种新的「远程 TPU」设计后端，你会选择 RPC 的「显式服务器」模式，还是 VirtGPU 的「共享内存+前端转发」模式？各有什么权衡？
