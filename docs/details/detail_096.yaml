learning_targets:
- 理解扩散语言模型的核心原理：与自回归模型的本质区别，以及「从掩码到文本」的逆向生成范式
- 掌握 diffusion-cli 示例程序的整体架构：参数解析、模型加载、扩散生成、结果输出的完整流程
- 深入理解置信度计算算法：CONFIDENCE_BASED、ENTROPY_BASED、MARGIN_BASED、RANDOM、ORIGIN 五种策略的实现与适用场景
- 掌握步进调度机制：TIMESTEP_BASED 与 BLOCK_BASED 两种调度策略的数学原理与工程权衡
- 理解 Gumbel 噪声注入技术：温度控制、逆变换采样、对 logits 的平滑处理
- 掌握扩散生成的可视化反馈：进度条渲染、清屏 ANSI 转义序列、token 实时反解码
- 学习输入处理的双路径：纯文本 prompt vs 聊天模板组装（common_chat_templates）
- 理解 CFG（Classifier-Free Guidance）在扩散生成中的作用与配置方法
life_analogy:
- 想象扩散语言模型是一位**考古学家修复破碎文物**：
- '- **初始文物碎片** = 完全掩码的 token 序列（全是 [MASK]，像打碎的陶片）'
- '- **修复过程** = 每个时间步解掩部分 token（逐步拼凑，而不是从左到右拼接）'
- '- **置信度评分** = 文物专家的鉴定意见（哪些碎片位置最确定就先修复哪里）'
- '- **五种鉴定方法** = 不同专家的评估角度：'
- '  - CONFIDENCE_BASED = 直接看这块碎片的完整度'
- '  - ENTROPY_BASED = 分析这块区域的不确定性（信息熵）'
- '  - MARGIN_BASED = 比较两个最可能选项的差距'
- '  - RANDOM = 抽签决定（纯随机）'
- '  - ORIGIN = 回到最初的直觉判断'
- '- **调度策略** = 修复计划表：'
- '  - TIMESTEP_BASED = 按时间均匀推进（考古队工作进度表）'
- '  - BLOCK_BASED = 按剩工作量分配（根据碎片多少动态调整）'
- '- **Gumbel噪声** = 给专家加入一点「不确定性直觉」，避免过度武断'
- '- **可视化反馈** = 修复过程的实时直播，观众能看到文物逐渐成形'
- 就像考古学家需要先规划修复顺序、评估每块碎片的确定性、再逐步拼合，扩散模型也需要精心调度每步解掩的token数量与位置。
'no': 95
summary:
- concept: '`diffusion_params`'
  desc: 扩散参数结构体：算法、步数、掩码token、调度、温度等超参数集合
- concept: '`calculate_confidence()`'
  desc: 置信度评估器：五种算法（置信度/熵/边际/随机/原始）计算token确定程度
- concept: '`calculate_transfer_count()`'
  desc: 调度核心：根据时间步或分块策略计算当前步骤应解掩的token数量
- concept: '`get_num_transfer_tokens()`'
  desc: 均匀分配算法：余数前向分配，保证总和精确且方差最小
- concept: '`add_gumbel_noise()`'
  desc: Gumbel噪声注入：通过温度控制的随机化，平滑概率分布
- concept: '`diffusion_step_callback()`'
  desc: 进度可视化：ANSI清屏+进度条+实时token反解码显示
- concept: '`format_input_text()`'
  desc: 输入格式化：支持纯文本与聊天模板（system+user+assistant）双模式
- concept: '`diffusion_generate()`'
  desc: 扩散引擎主函数：完整执行从全掩码到全文本的逆向生成流程
- concept: '`common_chat_templates`'
  desc: 聊天模板引擎：兼容Jinja模板，格式化多轮对话历史
- concept: '`llama_set_causal_attn(ctx, false)`'
  desc: 禁用因果注意力：扩散模型需要双向上下文理解
- concept: '`llama_token_data_array`'
  desc: 采样结果容器：存储token概率分布与选中索引
- concept: '`entropy`'
  desc: 信息熵：概率分布的不确定性度量，熵越低置信度越高
- concept: '`margin`'
  desc: 边际差值：最高概率与次高概率的差距，越大越确定
- concept: '`TIMESTEP_BASED`'
  desc: 时间步调度：基于t参数计算转移比例，平滑递进
- concept: '`BLOCK_BASED`'
  desc: 分块调度：均分剩余掩码，支持自定义分配数组
- concept: '`mask_token_id`'
  desc: 掩码标识：[MASK] token在词表中的ID，代表待生成位置
- concept: '`CFG（Classifier-Free Guidance）`'
  desc: 分类器无关引导：通过双路径采样提升生成质量
