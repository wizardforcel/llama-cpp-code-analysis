- codes:
  - file: examples/diffusion/diffusion-cli.cpp
    line: 49-87
    method_or_func: calculate_confidence()
  name: 置信度计算算法 —— 评审团的交锋
  'no': 3
  points:
  - '**什么是置信度计算？**'
  - '- 在选择哪些掩码 token 解掩时，需要一个度量标准'
  - '- 置信度越高，该位置越可能是模型「确定」的位置'
  - '- 不同算法从不同角度估计这个置信度'
  - '**五种算法各显神通**'
  - '- `CONFIDENCE_BASED`：直接用采样 token 的概率，最直观'
  - '- `ENTROPY_BASED`：计算分布的熵（负数），熵越低置信度越高'
  - '- `MARGIN_BASED`：最高概率与次高概率的差值，差距越大越确定'
  - '- `RANDOM`：完全随机选择，无规律'
  - '- `ORIGIN`：回到采样token 的概率（与 CONFIDENCE_BASED 相同）'
  - '**实现细节**'
  - '- 使用 `llama_token_data_array` 存储采样结果'
  - '- `cur_p.data[cur_p.selected].p` 获取被选中 token 的概率'
  - '- 采用 epsilon（1e-10）防止 log(0) 导致 NaN'
  - '- MARGIN_BASED 需要词表大小 > 1 才有效（防御性编程）'
- codes:
  - file: examples/diffusion/diffusion-cli.cpp
    line: 90-118
    method_or_func: calculate_transfer_count()
  name: 步进调度策略 —— 控制节奏的设计师
  'no': 4
  points:
  - '**为什么需要调度算法？**'
  - '- 扩散不是一次性解出所有掩码，而是分步进行'
  - '- 每步应该解掩多少个 token？影响生成质量和速度'
  - '- 两种调度哲学：时间步均匀 vs 分块均匀'
  - '**TIMESTEP_BASED（时间步调度）**'
  - '- 基于扩散的时间参数 t（从 1 逐渐减小）'
  - '- 计算当前时刻与下一时刻的掩码速率差'
  - '- 公式：`(1.0 - s/t)` 计算应该转移多少比例'
  - '- 最后一步强制解出所有残留掩码（`p_transfer = 1.0`）'
  - '**BLOCK_BASED（分块调度）**'
  - '- 将剩余的掩码数量均匀分配到剩余步骤'
  - '- 若提供 `num_transfer_tokens` 数组则按数组分配'
  - '- 否则用 `remaining / remaining_steps` 均分'
  - '**两个参数的配合**'
  - '- `total_steps` 控制总迭代次数'
  - '- `eps` 微调步长（防止除零）'
- codes:
  - file: examples/diffusion/diffusion-cli.cpp
    line: 189-200
    method_or_func: get_num_transfer_tokens()
  name: 均匀分配技巧 —— 余数的巧妙分配
  'no': 5
  points:
  - '**问题背景**'
  - '- mask_count = 10, steps = 3，怎么分配？'
  - '- 整数除法：10/3 = 3 余 1'
  - '- 策略：前 remainder 个步骤各加 1'
  - '- 结果：[4, 3, 3] 而不是 [3, 3, 4]'
  - '**算法实现**'
  - '- `base = mask_count / steps`：整数商'
  - '- `remainder = mask_count % steps`：余数'
  - '- 前面 i < remainder 的步骤分配 base+1'
  - '- 后面步骤分配 base'
  - '**为什么这样分配？**'
  - '- 保证总和恰好等于 mask_count'
  - '- 让差异最小（余数均匀分布）'
  - '- 前向友好：较早的步骤解出更多 token'
  - '**实际效果**'
  - '- 避免最后一步突然需要解出大量 token'
  - '- 平滑过渡每个步骤的难度'
- codes:
