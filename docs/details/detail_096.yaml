exercises:
- contents:
  - 阅读 `examples/diffusion/diffusion-cli.cpp` 第49-87行的 `calculate_confidence()` 函数实现。
  - 完成以下任务：
  - 1. 手工计算：给定概率分布 [0.5, 0.3, 0.15, 0.05]，分别用五种算法计算置信度得分
  - 2. 分析边界情况：
  - '   - 当所有token概率相等时（均匀分布），ENTROPY_BASED会返回什么值？'
  - '   - 当词表大小=1时，MARGIN_BASED的逻辑分支会如何处理？为什么需要防御性编程？'
  - '   - RANDOM模式下，置信度与模型输出是否完全解耦？这对生成质量有何影响？'
  - 3. 修改代码：添加一个新的置信度算法 `TOP_K_ENTROPY`，只计算前K个候选的熵值，并实现一个命令行参数 `--confidence-algorithm`
    允许用户选择算法
  - 4. 深度思考：为什么 ORIGIN 与 CONFIDENCE_BASED 的实现相同但保留为独立枚举？是否存在历史版本差异？
  - '**进阶挑战：** 查阅论文《Large Language Diffusion Models with Confidence-Based Decoding》（假设存在），对比理论与实现的差异。'
  'no': 1
  title: 对比五种置信度算法的数学特性
- contents:
  - 研究 `calculate_transfer_count()`（第90-118行）与 `get_num_transfer_tokens()`（第189-200行）的协同关系。
  - 当前问题：BLOCK_BASED模式是静态均分，如果某些掩码位置的置信度极高，本可以提前解出，但算法仍会按固定节奏推进。
  - 任务目标：
  - 1. 设计一个 `ADAPTIVE_BASED` 新调度策略，核心思想：根据每个掩码位置的置信度动态调整解掩顺序
  - 2. 实现要求：
  - '   - 在 `diffusion_generate()` 内部维护一个优先级队列（置信度降序排列）'
  - '   - 每步从队列头部取 top-K 位置解掩，而非按顺序处理'
  - '   - 动态更新剩余位置的置信度（因为部分解掩后，上下文改变，原置信度可能失效）'
  - 3. 性能评估：
  - '   - 对比三种调度模式在同一prompt上的生成质量（BLEU/ROUGE分数）'
  - '   - 对比三种模式的耗时（测量 `diffusion_generate()` 的执行时间）'
  - '   - 绘制置信度-步数关系曲线，观察ADAPTIVE是否能在前期更快收敛'
  - 4. 代码实现提示：
  - '   - 使用 `std::priority_queue<std::pair<float, int32_t>>` 存储（置信度，token索引）'
  - '   - 每步解掩后重新计算剩余位置的置信度（可选优化：只更新相邻位置）'
  - 5. 扩展思考：如果模型支持置信度预测的「置信头」（confidence head），能否将其作为额外的评分信号？
  'no': 2
  title: 实现自适应步长调度算法
