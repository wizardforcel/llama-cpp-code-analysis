  name: Gumbel 噪声与温度采样 —— 概率世界的随机化
  'no': 7
  points:
  - '**什么是 Gumbel 噪声？**'
  - '- Gumbel 分布用于离散采样，配合 soft max 实现「Gumbel-Softmax」'
  - '- 添加噪声背景让分布更平滑，避免过度确定'
  - '- 温度参数控制「混沌程度」'
  - '**算法流程**'
  - '- 若温度 0，直接返回（无噪声）'
  - '- 生成均匀分布随机数 noise ∈ (0, 1)'
  - '- 应用变换 `-log(noise)^temperature`'
  - '- 最后 `exp(logits) / gumbel_noise` 获得加噪概率'
  - '**为什么用 `-log(noise)` 变换？**'
  - '- 这是逆变换采样的标准形式'
  - '- 生成 Gumbel 分布样本恰好需要这种变换'
  - '- 纸张上写为：gumbel ~ -log(-log(uniform))'
  - '**效果分析**'
  - '- 温度越高，噪声影响越大，分布越平坦'
  - '- 温度越低，噪声影响越小，分布越尖锐'
  - '- 温度 1.0 是标准采样，0.0 是贪心'
