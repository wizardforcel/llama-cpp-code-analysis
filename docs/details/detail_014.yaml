  - '- `llm_graph_input_attn_k`：仅 K 缓存的注意力（V-less 优化）'
  - '- `llm_graph_input_attn_kv_iswa`：ISWA 双缓存（基+SWA）注意力（Gemma3、Gemma4）'
  - '- `llm_graph_input_attn_cross`：跨注意力（T5 decoder）'
  - '**混合内存输入：把 attn 与 rs 打包**'
