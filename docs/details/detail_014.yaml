  name: 张量按设备分配策略 —— 把"楼层"分给"租户"
  'no': 3
  points:
  - '**设备分配的"自动分租"机制**'
  - '- `make_cpu_buft_list` 按优先级把 ACCEL → Host → CPU Extra → CPU 的 buft 顺序装入'
  - '- `make_gpu_buft_list` 在 GPU 上叠加 split 模式与 extra 缓冲'
  - '- `tensor_split` 可以是全零（按可用内存自动分配）或自定义比例'
  - '- 默认 split 模式下 `splits[i] = free_memory`，最后做归一化累积'
  - '**层设备表的的"楼层分配"**'
  - '- `dev_input` 永远放在 CPU（嵌入层极小，offload 收益低）'
  - '- `dev_layer[i]` 通过 `upper_bound` 在 `splits` 累积数组中查表'
  - '- `dev_output` 跟随最后一层的设备'
  - '**buft 选择：操作能力 + 设备亲和**'
  - '- `select_buft` 用一个简单的 ggml_add 算子来测试设备能力'
  - '- `buft_supported` 通过临时 ctx 创建算子并调用 `ggml_backend_dev_supports_op`'
  - '- 在多 buft list 中按顺序挑选第一个支持当前 op 的 buft'
