learning_targets:
- 理解 llama_model 类的整体架构、生命周期（构造、析构、Pimpl 模式）以及与 llama_hparams、llama_vocab、llama_layer
  的关系
- 掌握模型元数据的四阶段加载流水线（load_arch → load_hparams → load_vocab → load_tensors）的协作机制
- 理解张量按设备分配策略（make_cpu_buft_list / make_gpu_buft_list / select_buft）的实现原理
- 熟悉 llama_layer 与各子结构体（posnet、convnext、shortconv、nextn）如何承载 80+ 架构的张量差异
- 掌握 build_graph 如何根据 arch 路由到对应 llm_build_* 类的实现，以及 create_memory 的多种缓存分配
- 了解 RoPE 双源频率切换（hparams vs cparams）与 LongRoPe 长短因子自动选择机制
- 理解模型信息查询接口（arch_name/type_name/desc/print_info 等）的输出格式与调试用途
- 理解 llm_graph_input_i 家族如何抽象不同模型架构的计算图输入并支持图复用
- 掌握 llm_graph_result 如何承载图构建产物与 can_reuse 机制复用已有计算图
- 了解 llm_graph_context 提供的 build_norm/build_ffn/build_moe_ffn/build_attn_mha 等公共子图构造函数
- 熟悉 graph 类型枚举（DEFAULT/ENCODER/DECODER）与 T5 等 encoder-decoder 架构的分发逻辑
- 理解图构建中的归一化、注意力、FFN、循环状态、池化、采样等模块化协作方式
life_analogy:
- 想象 llama_model 是一座**大型图书馆**的核心管理机构：
- '- **arch / type** = 图书馆的牌匾与分类号（LLaMA 类、Gemma 类、MoE 类）'
- '- **hparams** = 馆藏目录（层数、卷册数、开本尺寸等基础编目信息）'
- '- **vocab** = 索引卡柜（所有 Token 与词典信息）'
- '- **layers** = 楼层办公室的**集装箱**（每层存放归一化、注意力、FFN 各种零件）'
- '- **pimpl** = 地下仓库（存放 mmap、mlock、buffer、device 等 重资源，对外只暴露层）'
- '- **load_arch / load_hparams / load_vocab / load_tensors** = **四阶段审阅流程**：先验牌匾、再核目录、再查索引、最后清点藏书'
- '- **make_cpu_buft_list / make_gpu_buft_list** = **分配货架**（按 ACCEL→Host→Extra→CPU
  优先级摆放）'
- '- **select_buft** = **临时试放货物**，看哪条货架能装下这个大家伙'
- '- **build_graph** = 依据图纸书把藏书重新装订成**一本书**（计算图）'
- '- **create_memory** = **阅览室**：标准阅览室、滑动窗口阅览室（ISWA）、循环阅览室（RNN）、混合阅览室'
- '- **get_rope_factors** = **翻书节奏**：短诗用短节奏、长篇用长节奏'
- ''
- 想象 llama_graph 系统是一套**印刷厂的装订流水线**：
- '- **llm_graph_input_i 家族** = 不同类型的**纸张输入口**（正文纸、插图纸、索引纸），各司其职'
- '- **llm_graph_context** = **装订工坊**，持有所有工具与半成品'
- '- **build_norm / build_ffn / build_attn_mha / build_moe_ffn** = 流水线上的**通用机器**（裁切机、装订机、压膜机）'
- '- **llm_graph_result** = 最终装订好的**书册**（含 logits、embeddings 等成品章节）'
- '- **can_reuse** = 如果新订单内容与旧订单相同，**复用旧书**（跳过装订）'
- '- **build_pooling / build_sampling / build_dense_out** = 最后的**封面包装**与**书签插入**工序'
- 就像图书馆馆长需要按楼层、书架、读者类型精心分配每本书的位置，llama_model 也要精确规划每个张量在哪个设备、哪个 buffer 上安家；而装订工坊则需要把不同类型的纸张与零件按图组装成最终可印刷的成品书。
'no': 13
summary:
- concept: '`llama_model`'
  desc: 模型状态中央枢纽，持有 hparams/vocab/layers/pimpl 等所有推理期状态
- concept: '`Pimpl 模式`'
  desc: 将 mappings/mlock/ctxs_bufs/dev_layer 等重资源隐藏在 impl 中，头文件保持轻量
- concept: '`load_arch`'
  desc: 读取模型架构枚举，未知架构直接抛异常
- concept: '`load_hparams`'
  desc: 把 GGUF KV 先全量字符串化到 gguf_kv，再用结构化读取派生 n_layer/n_head/n_embd 等 等数值字段
- concept: '`load_tensors`'
  desc: 按架构 switch（80+）逐层填充 llama_layer 张量，最后统一加载 .scale 与 .input_scale 通用 pass
- concept: '`make_cpu_buft_list`'
  desc: 按 ACCEL→Host→Extra→CPU 优先级装配 CPU 缓冲类型候选
- concept: '`make_gpu_buft_list`'
  desc: 装配 GPU 缓冲类型，支持 split 模式并追加 CPU fallback
- concept: '`dev_layer`'
  desc: 通过 upper_bound 在累积 split 数组中查表，把每一层分配到合适的设备
- concept: '`select_buft`'
  desc: 通过临时 ggml_add 算子测试设备能力，返回第一个支持当前 op 的 buft
- concept: '`buft_supported`'
  desc: 构造临时算子与缓冲，调用 ggml_backend_dev_supports_op 判断设备能力
- concept: '`llama_layer`'
  desc: 容纳 attn/ffn/moe/ssm/rwkv/rope/altup 等几十上百个张量指针的容器
- concept: '`llama_layer_posnet`'
  desc: WavTokenizer PosNet 的 4 类 block 子结构（resnet×4 + attn + norm）
- concept: '`llama_layer_convnext`'
  desc: ConvNeXt 的 dw/norm/pw1/pw2/gamma 子结构
- concept: '`llama_layer_shortconv`'
  desc: LFM2 短卷积的 in_proj/conv/out_proj 三件套
- concept: '`build_graph`'
  desc: 依据 arch 路由到对应 llm_build_* 类实例化，追加 pooling/sampling/dense_out，返回 ggml_cgraph
- concept: '`create_memory`'
  desc: 依据 arch 分发到 nullptr/recurrent/hybrid/iswa/kv_cache 五种内存实现
- concept: '`get_rope_freq_base/scale`'
  desc: SWA 层使用训练期频率，否则使用 cparams 当前频率
- concept: '`get_rope_factors`'
  desc: LongRoPe 短长因子按 n_ctx_seq 自动切换
- concept: '`print_info`'
  desc: 输出架构/层数/头数/专家配置/SSM 参数等完整诊断报告
- concept: '`llm_graph_input_*`'
  desc: 图输入抽象类家族，按注意力类型分为 no_cache/kv/k/1kv_iswa/cross 等
- concept: '`llm_graph_result`'
  desc: 图构建产物，承载 logits/embd/embd_pooled 与 can_reuse 复用机制
- concept: '`llm_graph_params::allow_reuse`'
  desc: 通过比较 ubatch/samplers/cparams/arch 判断图拓扑是否可复用
- concept: '`llm_graph_input_i::can_reuse`'
  desc: 子类可重写以检查 hparams/cparams/ubatch 等参数是否兼容复用
- concept: '`llm_graph_input_mem_hybrid_*`'
  desc: 混合内存输入，组合 attn 与 rs 两种输入以支持 Transformer+RNN 混合架构
- concept: '`llm_graph_context::build_moe_ffn`'
  desc: MoE FFN 的统一子图构造函数，支持带/不带 bias 与归一化变体
- concept: '`llm_graph_context::build_attn_mha`'
  desc: 多头注意力的统一子图构造函数，支持 ALiBi、sinks、MLA 等扩展
- concept: '`llm_graph_context::build_rs`'
  desc: 循环状态（R/S）的读写子图，支持视图与副本操作以避免不必要拷贝
- concept: '`llm_graph_type`'
  desc: 图类型枚举，区分 DEFAULT/ENCODER/DECODER 以支持 T5 等 encoder-decoder 架构
- concept: '`llama_model_rope_type`'
  desc: 依据 arch 返回 NORM/NEOX/MROPE/IMROPE/NONE 等 RoPE 类型
- concept: '`llama_model_meta_*`'
  desc: 对外元数据查询接口（val_str/count/key/val_by_index）便于调试与日志输出
- concept: '`llama_internal_get_tensor_map`'
  desc: 返回内部张量名映射，供测试与调试使用
