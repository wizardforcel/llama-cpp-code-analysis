  name: 层结构体与张量映射 —— "千面模型"的"零件仓库"
  'no': 4
  points:
  - '**`llama_layer`：层是张量指针的"集装箱"**'
  - '- 容纳归一化（attn_norm、attn_q_norm、attn_k_norm、attn_post_norm）、注意力（wq/wk/wv/wo）、FFN（ffn_gate/up/down）、可选
    bias、RoPE 因子等几十个指针'
  - '- MoE 专用：ffn_gate_inp、ffn_gate_exps、ffn_down_exps、ffn_up_exps、ffn_exp_probs_b，以及共享专家
    ffn_gate_shexp 等'
  - '- 包含 AltUp/Laurel、Gemma4 per-layer、SSM、Mamba、RWKV、KDA 等多种特殊张量'
  - '- 内嵌 `llama_layer_posnet`、`llama_layer_convnext`、`llama_layer_shortconv`、`llama_layer_nextn`
    四个子结构体支持 WavTokenizer、ConvNeXt、T5、NextN 等'
  - '**子结构体：把"专项零件"打包管理**'
  - '- `llama_layer_posnet` 容纳 WavTokenizer PosNet 的 4 类 block（resnet/resnet/attn/...）'
  - '- `llama_layer_convnext` 容纳 ConvNeXt 的 dw/pw1/pw2/gamma'
  - '- `llama_layer_shortconv` 容纳 LFM2 的 in_proj/conv/out_proj'
  - '- `llama_layer_nextn` 容纳 GLM/EXAONE/BailingMoe2 等的 NextN 预测层（eh_proj、embed_tokens、enorm/hnorm
    等）'
  - '**switch (arch) 的的"百架构的工坊"**'
  - '- load_tensors 内一个超长 switch 处理 80+ 种架构'
  - '- 每种架构都按 attn/ffn/moe/ssm 各自的张量名约定填充 `layer.*` 字段'
  - '- 通过 `TENSOR_NOT_REQUIRED` 标记可选张量，`TENSOR_DUPLICATED` 让 output 复用 tok_embd'
