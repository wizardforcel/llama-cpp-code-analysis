  name: RoPE 频率与因子获取 +位置编码的的"调音台"
  'no': 6
  points:
  - '**RoPE 参数的"双轨制"**'
  - '- `rope_freq_base_train` 与 `rope_freq_scale_train` 来自训练阶段 (hparams)'
  - '- `rope_freq_base` 与 `rope_freq_scale` 来自推理上下文 (cparams)，运行时可调'
  - '- 滑动窗口层 (SWA) 有独立的 `rope_freq_base_train_swa` 与 `rope_freq_scale_train_swa`'
  - '**get_rope_freq_base / get_rope_freq_scale 的的"双源切换"**'
  - '- 若 `hparams.is_swa(il)` 为真，使用训练时的 SWA 频率'
  - '- 否则使用 cparams 中的当前频率'
  - '**LongRoPe 短长因子自动切换**'
  - '- `get_rope_factors`：当 `rope_freqs` 张量存在时优先使用'
  - '- 否则若当前序列长度 `n_ctx_seq` 超过 `n_ctx_orig_yarn`，使用 `rope_long` 因子'
  - '- 否则回退到 `rope_short` 因子'
  - '- 这是实现"短上下文用短因子、长上下文用长因子"的"自动调音"机制'
