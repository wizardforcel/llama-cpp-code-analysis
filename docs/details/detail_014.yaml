  name: 模型信息查询与打印 ++"产品说明书"与"体检报告"
  'no': 7
  points:
  - '**模型状态查询的"窗口台"**'
  - '- `arch_name()` / `type_name()`：返回字符串标识'
  - '- `desc()`：拼接 "arch type ftype" 形成可读描述'
  - '- `n_tensors()` / `n_devices()` / `size()`：张量数、设备数、文件大小'
  - '- `n_gpu_layers()`：若参数未指定，则等于 n_layer+1（全 offload）'
  - '- `n_elements()`：参数总量'
  - '- `memory_breakdown()`：按 buft 汇总缓冲大小'
  - '- `dev_layer(int il)` / `dev_output()`：查某层或 output 在哪个设备上'
