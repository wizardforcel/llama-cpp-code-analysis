  name: 计算图产物与复用 +llm_graph_result 的的"成品书"
  'no': 9
  points:
  - '**llm_graph_result：图构建的"成品仓库"**'
  - '- 保存图输入对象数组（`inputs`）、`ggml_context` 计算上下文、`ggml_cgraph` 图指针'
  - '- 持有 `t_inp_tokens / t_inp_embd / t_logits / t_embd / t_embd_pooled` 等关键输出张量'
  - '- 持有 `t_sampled_logits / t_candidates / t_sampled / t_sampled_probs` 四张按 seq_id
    索引的采样张量表'
  - '**复用机制：can_reuse 的的"双层校验"**'
  - '- `llm_graph_result::can_reuse`：综合 `inputs` 各自 `can_reuse` 的结果'
  - '- `llm_graph_params::allow_reuse`：通过比较 ubatch/samplers/cparams/arch 等判断图拓扑是否可复用'
  - '- 只有两层都返回 true 时才真正复用旧图'
  - '**输入复用检查**'
  - '- `llm_graph_input_embd/pos/out_ids` 等会重写 `can_reuse` 检查 n_tokens/n_outputs 是否一致'
  - '- `llm_graph_input_attn_kv/iswa` 会重写检查 KV cache context 是否变化'
  - '- `llm_graph_input_sampling` 会重写检查 sampler map 是否一致'
  - '**输出装配线**'
  - '- `set_inputs(ubatch)`：把当前 batch 数据写入 input 张量'
  - '- `set_outputs()`：标记哪些张量作为图输出（logits/embeddings 等）'
  - '- `reset()` / `~llm_graph_result()`：释放图与上下文'
