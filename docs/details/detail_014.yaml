  name: 构建计算图 +build_graph 的的"调度总指挥"
  'no': 5
  points:
  - '**build_graph 是"模型 → GGML 计算图"的总装车间**'
  - '- 第二个超长 switch 根据 `arch` 选择对应的 `llm_build_*` 类实例化'
  - '- 同一架构可能有多个模板特化，例如 Gemma3 通过 `<iswa>` 区分 SWA 与非 SWA'
  - '- T5 等 encoder-decoder 通过 `params.gtype` 在 `llm_build_t5_enc` 与 `llm_build_t5_dec`
    之间分流'
  - '**统一的"尾部装配线"**'
  - '- `llm->build_pooling(cls, cls_b, cls_out, cls_out_b, cls_norm)`：把分类头接入'
  - '- `llm->build_sampling()`：若启用 backend sampling，把采样器接进图'
  - '- `llm->build_dense_out(...)`：处理 SentenceTransformers 等的 dense 投影'
  - '- `llm->res->set_outputs()`：标记哪些张量作为图输出（logits/embeddings 等）'
  - '**返回 ggml_cgraph 给推理循环**'
  - '- `get_gf()` 把构建好的 cgraph 返回给 `llama_context::decode`/`encode`'
  - '- 调度器 ggml_backend_sched 会按图拓扑拆分到各后端执行'
  - '**`create_memory` 与 build_graph 协同**'
  - '- 提前在 create_memory 中分配好 KV cache、recurrent state、hybrid 缓存'
  - '- build_graph 中的 `mctx` 指针读取已分配好的内存上下文'
