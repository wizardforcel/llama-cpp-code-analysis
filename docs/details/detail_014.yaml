  name: 模型元数据加载流水线 —— 四阶段"档案审阅"的接力
  'no': 2
  points:
  - '**四阶段流水线：load_arch → load_hparams → load_vocab → load_tensors**'
  - '- `load_arch`：从 `llama_model_loader` 中读取 `llm_arch`，非法则抛异常'
  - '- `load_hparams`：先把 GGUF 元数据全部转字符串存进 `gguf_kv`，再按 KV 名逐项解析为 `hparams` 字段'
  - '- `load_vocab`：调用 `vocab.load(ml, kv)` 把 tokenizer 字段装入 `llama_vocab`'
  - '- `load_tensors`：是最重的一步，负责把 GGUF 张量元数据映射到 `llama_layer` 数组'
  - '**GGUF 元数据的双重用途**'
  - '- 一方面通过 `gguf_kv` 保留原始键值对，供后续 `llama_model_meta_*` 等接口按名查询'
  - '- 另一方面通过结构化读取（`ml.get_key`、`ml.get_key_or_arr`）派生出 `hparams.n_layer`、`n_head`、`n_embd`
    等数值字段'
  - '- 特殊架构 KV（如 Gemma 的 attention_logit_softcap、Mamba 的 ssm_d_state）通过巨大的 switch
    分支精确解析'
  - '**load_tensors 是模型灵魂的"组装车间"**'
  - '- 先建立 CPU/GPU 的 buffer type 列表（make_cpu_buft_list / make_gpu_buft_list）'
  - '- 按按设备划分 dev_layer、dev_input、dev_output'
  - '- 通过庞大的 switch (arch) 语句为每个架构创建对应张量（attn_norm、wq/wk/wv/wo、ffn_*）'
  - '- 末尾调用通用 pass 加载 `.scale` 与 `.input_scale` 张量（NVFP4 等量化场景）'
