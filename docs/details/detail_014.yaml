  name: 计算图上下文与公共子图 +llm_graph_context 的的"装订工坊"
  'no': 10
  points:
  - '**llm_graph_context：装订工坊的"工具箱"**'
  - '- 持有 hparams.hparams/cparams/ubatch 等构造等与 sched/cvec/loras/mctx/samplers 等 运行时上下文'
  - '- 通过 cb_func 回调把每个算子登记到 backend scheduler'
  - '- 提供 `ctx0` (ggml_context) 与 `gf` (ggml_cgraph) 给 build_* 系列使用'
  - '**公共子图构造函数：通用机器**'
  - '- `build_norm(cur, w, b, type, il)`：根据 type 切换 LN/RMSNorm/GroupNorm'
  - '- `build_ffn(...)`：根据 type_op (SILU/GELU/RELU 等) 与 type_gate (SEQ/PAR) 拼装 FFN'
  - '- `build_moe_ffn(...)`：两个重载支持带/不带 bias 版本，处理路由 + 专家加权求和'
  - '- `build_attn_mha(q, k, v, kq_b, kq_mask, sinks, v_mla, kq_scale, il)`：多头注意力核心'
  - '- `build_rs(s, main, extra, ...)`：循环状态读写，支持自定义 get_rows 函数'
  - '**输入构建助手：纸张装入工坊**'
  - '- `build_inp_embd(tok_embd)` / `build_inp_pos()` / `build_inp_attn_scale()` 等'
  - '- `build_inp_out_ids()` / `build_inp_mean()` / `build_inp_cls()`：输出位置选择'
  - '- `build_inp_cross_embd()` / `build_inp_pos_bucket_enc/dec()`：T5 encoder/decoder
    专用'
  - '**attn 输入工厂**'
  - '- `build_attn_inp_no_cache/kv/k/kv_iswa/cross`：根据 mctx 类型分发到对应 attn 输入类'
  - '- `build_inp_mem_hybrid/k/iswa`：组合 attn 与 rs 输入形成混合内存输入'
  - '- `build_rs_inp()`：构建循环状态输入'
  - '**输出与采样**'
  - '- `build_pooling(cls, cls_b, cls_out, cls_out_b, cls_norm)`：把分类头接入图'
  - '- `build_sampling()`：若 sampler 非空，构建 backend sampling 子图'
  - '- `build_dense_out(dense_2, dense_2_b, dense_3)`：把 SentenceTransformers dense
    投影接入图'
  - '**LoRA 适配**'
  - '- `build_lora_mm(w, cur, w_s)`：矩阵乘并可选应用 LoRA 与 per-tensor scale'
  - '- `build_lora_mm_id(w, cur, ids)`：带索引的矩阵乘（专家路由场景）'
  - '- `build_cvec(cur, il)`：把控制向量 (cvec) 应用到指定层'
