  name: llama_model 类骨架与生命周期 —— 模型对象的"主入口"与"幕后管家"
  'no': 1
  points:
  - '**`llama_model` 是 llama.cpp 中所有模型状态的"中央枢纽"**'
  - '- 持有 `llm_type type`（如 LLM_TYPE_7B）与 `llm_arch arch`（如 LLM_ARCH_LLAMA）两大身份标识'
  - '- 聚合超参数 `llama_hparams hparams`、词表 `llama_vocab vocab` 与层数组 `std::vector<llama_layer>
    layers`'
  - '- 嵌入/输出张量（tok_embd、output_norm、output）、分类头（cls、cls_out）、Dense 输出层（dense_2_out_layers
    等）都直接挂在模型对象上'
  - '- `tensors_by_name` 是张量名 → 张量指针的映射，供量化、调试、量化统计等模块按名查找'
  - '- `loras` 集合跟踪已关联的 LoRA 适配器，确保析构时统一释放'
  - '**Pimpl 模式隔离实现细节**'
  - '- `std::unique_ptr<impl> pimpl` 隐藏 `mappings`、`mlock_bufs`、`ctxs_bufs`、`dev_layer`
    等重资源'
  - '- 构造函数 `llama_model(const llama_model_params&)` 记录参数并初始化 pimpl'
  - '- 析构函数遍历 `loras` 调用 `delete` 保证适配器被回收'
  - '**单元名词表：化身"模型档案馆"**'
  - '- 类比：llama_model 像一座"模型档案馆"——`arch/type` 是档案馆门牌号，hparams 是规格清单，layers 是楼层办公室，pimpl
    是地下仓库'
