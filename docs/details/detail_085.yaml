  name: server_slot：单请求的"独立工位"
  'no': 1
  points:
  - '**核心设计理念**：每个推理请求独占一个槽位（slot），独立管理其KV缓存、采样状态和生成进度，通过状态机（IDLE/STARTED/PROCESSING_PROMPT/GENERATING）实现请求间的隔离与并发控制'
  - '**提示词生命周期管理**：通过prompt_save/prompt_load与server_prompt_cache交互，实现KV缓存的序列化持久化；prompt_clear使用llama_memory_seq_rm精确清除指定序列的缓存'
