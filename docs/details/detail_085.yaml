learning_targets:
- 掌握 server_slot 的完整生命周期管理：从提示词保存/加载（prompt_save/load）到状态重置（reset）与释放（release）的状态机转换
- 理解 server_metrics 的双维度统计模型：区分总累计值（_total）与周期性桶值（bucket），掌握 on_prompt_eval/on_prediction/on_decoded
  的指标采集时机
- 精通 ServerContext 类的任务调度体系：包括任务分发（process_single_task）、槽位启动（launch_slot_with_task/launch_slots_with_parent_task）、批次构建与更新（update_slots）
- 掌握 server_context_impl 的核心调度逻辑：模型加载（load_model）、槽位分配（get_available_slot）、空闲槽位清理（try_clear_idle_slots）与休眠状态管理
- 理解 server_context 的 Pimpl（Pointer to Implementation）设计模式：通过门面接口隐藏 server_context_impl
  的实现细节，保证 ABI 稳定性
- 掌握 server_res_generator 的响应封装机制：统一处理 ok/error 响应格式，支持睡眠旁路（bypass_sleep）控制
- 精通 server_routes 的 REST 端点实现：包括补全（handle_completions_impl）、嵌入（handle_embeddings_impl）、槽位持久化（handle_slots_save/restore/erase）等路由注册与处理
- 理解 LoRA 适配器与推测解码的集成：aLoRA 检测（launch_slot_with_task）、推测解码配置（can_speculate/get_n_draft_max）与缓存复用机制
- 掌握全局作用域的任务处理逻辑：SLOT_SAVE/RESTORE/ERASE/GET_LORA/SET_LORA 等任务类型的文件级处理流程与 KV 缓存持久化机制
life_analogy:
- 想象 llama-server 是一家**高级餐厅的中央厨房调度系统**：
- '- **server_slot** = 独立厨师工作台，每个工位有自己的食材备料区（KV缓存）、专属工具（采样器）和当前订单（task），工位之间互不干扰但可共享中央炉灶（GPU）；支持推测解码的工位还配有「助理厨师」（草稿模型）帮忙预切配菜'
- '- **server_metrics** = 餐厅经理的实时监控大屏，既显示累计营业额（_total），也显示当前营业时段的翻台率（bucket），帮助管理者了解厨房负载'
- '- **server_context_impl** = 厨房总指挥官的私人助理，负责接收订单（任务分发）、调度空闲厨师（槽位分配）、协调多个厨师同时做菜（连续批处理），以及在食材不足时动态调整菜单（上下文移位
  ctx_shift）'
- '- **ServerContext** = 厨房的实际操作团队，直接处理食材准备（tokenize）、烹饪过程监控（process_token）、菜品装盘（send_*_response）等具体执行任务'
- '- **server_context** = 餐厅前台接待，对外提供标准化的服务窗口（API），隐藏后厨复杂的操作流程（Pimpl模式），顾客只需知道能点到菜，无需了解厨师怎么炒菜'
- '- **server_res_generator** = 传菜员手中的智能餐盘，能根据餐厅当前是否歇业（sleep状态）决定立即上菜还是等待开业，支持单点上菜（非流式）或边做边上（SSE流式）'
- '- **server_routes** = 餐厅的点餐系统菜单，将顾客的 HTTP 请求（/completion, /embeddings, /slots）准确路由到对应的厨房工位，并确保每份订单都有对应的取餐号（任务ID）；支持「菜品暂存」（/slots/save）与「回锅」（/slots/restore）服务'
- '- **__main__（文件作用域）** = 餐厅的标准操作程序（SOP）手册，定义了如何处理特殊订单类型：菜品暂存（SLOT_SAVE）、回锅加热（SLOT_RESTORE）、丢弃剩菜（SLOT_ERASE）、查询配料表（GET_LORA）和调整配方（SET_LORA）'
'no': 84
summary:
- concept: server_slot
  desc: 单请求隔离容器，通过状态机（IDLE→STARTED→PROCESSING_PROMPT→GENERATING）管理KV缓存、采样状态与生成进度，实现请求级隔离
- concept: prompt_save/load/clear
  desc: KV缓存生命周期管理三剑客，通过llama_memory_seq_rm实现缓存的精确清除与复用，支持提示词持久化到内存缓存
- concept: init_sampler
  desc: 初始化采样器并回填历史token，确保生成连续性；若任务不需要采样（如嵌入任务）则跳过
- concept: can_batch_with / can_split
  desc: 批处理兼容性检查双保险：前者确保LoRA配置一致，后者根据内存模块和池化类型（LLAMA_POOLING_TYPE_LAST）判断是否支持批次分割
- concept: get_n_draft_max
  desc: 动态计算推测解码草稿token数，综合考虑剩余上下文(n_ctx)与生成预算(n_predict)，防止超出边界并确保最小草稿数量
- concept: server_metrics
  desc: 双维度指标系统，同时维护总累计值(_total)与周期性桶值(bucket)，支持Prometheus风格监控与速率计算
- concept: server_context_impl
  desc: 服务端核心大脑，负责模型加载（含多模态投影器与草稿模型）、槽位池化管理、LCP+LRU双策略槽位分配
- concept: get_available_slot
  desc: 智能槽位分配策略，结合基于提示词相似度(LCP)的缓存亲和性（slot_prompt_similarity）与LRU均衡策略，优化KV缓存命中率
- concept: ServerContext::process_single_task
  desc: 任务分发中枢，根据SERVER_TASK_TYPE（COMPLETION/EMBEDDING/RERANK/CANCEL/SLOT_SAVE等）路由到具体处理器
- concept: ServerContext::update_slots
  desc: 推理主循环，实现两阶段批次构建（先处理GENERATING状态的草稿/解码，再处理STARTED/PROCESSING_PROMPT状态的新请求），支持ctx_shift动态上下文移位与缓存复用（n_cache_reuse）
- concept: launch_slot_with_task
  desc: 槽位启动核心，处理aLoRA（适配器激活令牌）检测、LoRA配置应用、采样器初始化与任务状态切换
- concept: send_partial/final_response/embedding/rerank
  desc: 结果发送家族，支持流式SSE输出、最终完成响应、嵌入向量（支持不同池化类型与归一化）以及重排序分数计算
- concept: server_context
  desc: Pimpl惯用法的门面接口，通过unique_ptr隐藏server_context_impl，保证ABI稳定性与编译防火墙
- concept: server_res_generator
  desc: 响应生成器，统一处理睡眠旁路逻辑（bypass_sleep）与流式/非流式协议适配，支持OpenAI chat/completion与Anthropic消息格式
- concept: server_routes
  desc: REST端点注册中心，提供/slots/save/restore/erase等KV缓存持久化接口，集成多模态预处理流水线与路径安全验证(fs_validate_filename)
- concept: handle_embeddings_impl
  desc: 嵌入处理实现，支持OpenAI兼容格式，处理embd_normalize参数（默认L2归一化）与多输入批量处理
- concept: handle_slots_save/restore/erase
  desc: 槽位持久化三剑客，通过llama_state_seq_save/load_file实现KV缓存的磁盘持久化与恢复，支持文件名安全验证
- concept: __main__ (文件作用域任务处理)
  desc: 全局任务处理块，实现SLOT_SAVE/RESTORE/ERASE和GET/SET_LORA等任务的完整逻辑，包括文件I/O、KV缓存序列化与LoRA配置热更新
