exercises:
- contents:
  - 阅读 `tools/server/server-context.cpp` 中 server_slot 类的完整实现（163-604行），绘制状态转换图，重点分析以下方法：
  - 1. `reset()` 方法中清理了哪些状态字段？为什么必须显式调用 `llama_set_sampler(ctx, id, nullptr)`？
  - 2. `release()` 方法中状态从 PROCESSING 到 IDLE 的切换条件是什么？`task_prev = std::move(task)`
    的设计意图是什么？
  - 3. `copy_state_to()` 方法如何使用 `llama_memory_seq_cp` 实现 KV 缓存的跨槽位复制？这在什么业务场景下会被触发（提示：考虑批量处理或故障转移）？
  - 4. `can_split()` 与池化类型（pooling_type）的关系是什么？为什么嵌入任务在特定条件下不能分割批次？
  - 思考问题：
  - '- 如果两个槽位的 LoRA 配置不同，`can_batch_with()` 会如何阻止它们被合并到同一批次？这体现了什么样的并发控制设计原则？'
  - '- `get_n_draft_max()` 中的 `n_ctx - prompt.n_tokens() - 2` 这个减 2 的操作是为了防止什么边界条件？'
  'no': 1
  title: 槽位状态机与生命周期追踪
- contents:
  - 深入研读 `ServerContext::update_slots()`（约2185-2792行）与 `server_context_impl::get_available_slot()`（1018-1062行），绘制执行流程图：
  - 1. 上下文移位（ctx_shift）触发条件：当 `slot.prompt.n_tokens() + 1 >= slot.n_ctx` 时，代码如何通过
    `llama_memory_seq_rm` 和 `llama_memory_seq_add` 实现「丢弃中段、保留头尾」的滑动窗口效果？
  - 2. 两阶段批次构建策略：为什么先收集所有 GENERATING 状态的槽位构建草稿/解码批次，再处理 STARTED/PROCESSING_PROMPT
    状态的新请求？这种顺序对吞吐量有何影响？
  - 3. 推测解码集成：当 `can_speculate()` 返回 true 时，`i_batch_dft` 数组如何记录草稿 token 在全局批次中的位置？`common_speculative_draft()`
    的调用时机与结果截断逻辑是什么？
  - 4. 缓存复用优化：`n_cache_reuse` 参数如何控制 KV 缓存的块级复用？`while (head_c < slot.prompt.tokens.size()...)`
    这段代码实现了什么样的匹配算法？为什么需要 `llama_memory_can_shift` 检查？
  - 5. 槽位选择策略：`get_available_slot` 中 LCP（最长公共前缀）相似度与 LRU 策略的优先级如何？`slot_prompt_similarity`
    阈值的作用是什么？
  - 实践任务：尝试修改代码，在 `update_slots()` 的适当位置添加日志，打印每次批次的实际组成（各槽位贡献的 token 数），观察在不同并发负载下的批处理行为。
  'no': 2
  title: 连续批处理、上下文移位与缓存复用
- contents:
