  - '**流式与非流式统一**：通过server_response_reader机制，既支持SSE（Server-Sent Events）的增量推送，也支持阻塞式的wait_for_all()批量获取，适配OpenAI/Anthropic不同协议需求'
  - '**旁路机制**：bypass_sleep标志允许某些紧急请求跳过睡眠检查，实现零延迟响应'
