  - 3. `populate_token_probs()` 的两种模式：采样后（post_sampling=true）与采样前（false）在数据来源和概率计算上有何差异？
  - 4. `process_single_task()` 的任务类型分发逻辑：COMPLETION、EMBEDDING、RERANK 三种任务在槽位分配和资源需求上的差异是什么？
