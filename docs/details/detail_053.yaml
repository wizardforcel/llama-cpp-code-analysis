  name: 部分 JSON 解析与修复 —— 残缺输入的"智能创可贴"
  'no': 1
  points:
  - '**流式场景下的 JSON 为何需要"创可贴"？**'
  - '- 大模型流式输出时，JSON 经常因长度限制或网络中断而被截断'
  - '- 直接丢弃整个 JSON 太过浪费，应尽量挽救已生成的部分'
  - '- 修复策略核心：定位错误位置，推断缺失结构，智能补全闭合符号'
  - '**json_error_locator：SAX 解析的事件监听器**'
  - '- 继承 nlohmann::json_sax，通过重写回调函数感知解析进度'
  - '- 使用栈结构跟踪当前嵌套深度（对象{}、数组[]、键值对）'
  - '- `parse_error` 回调在出错时精确记录位置、最后 token 及异常信息'
  - '**close_value()：栈状态维护的精密操作**'
  - '- 在每个值解析完成（null/bool/number/string/binary）后调用'
  - '- 确保键（key）元素在值结束后正确弹出，维持栈结构的准确性'
  - '- 为后续推断缺失的闭合括号提供精确的上下文环境'
  - '**common_json_parse 的双重接口设计**'
  - '- 字符串版本：便捷入口，内部转换为迭代器范围处理'
  - '- 迭代器版本：核心逻辑，支持从任意位置开始解析，适合流式缓冲'
  - '- healing_marker 机制：在修复处插入特殊标记，便于后续识别原始边界'
  - '**修复策略的实现细节**'
  - '- 尝试补全缺失的闭合括号 `}` 和 `]`'
  - '- 处理键名截断：补全引号和冒号，使用空字符串作为值'
