exercises:
- contents:
  - 基于 json-partial.cpp 中的 common_json_parse 实现，设计测试用例覆盖以下场景：
  - '1. 截断在对象键的引号中间：{"name": "Alice", "age":'
  - '2. 截断在数组元素中间：[1, 2, {"key": "val'
  - '3. 截断在字符串中间：{"message": "Hello, wor'
  - 4. 完全空对象和空数组的边界：{} 和 []
  - 思考问题：
  - '- 当解析在字符串中间截断时，healing_marker 应该插入在什么位置？'
  - '- 如何确保修复后的 JSON 与原始意图尽可能一致？'
  - '- 如果修复位置后还有内容（如 ..."age": 25 [截断] "city": "NYC"），应该如何处理？'
  'no': 1
  title: 实现 JSON 修复的边界条件测试
- contents:
  - 阅读 json-schema-to-grammar.cpp 中关于 STRING_FORMAT_RULES 和 _visit_pattern() 的实现，
  - '尝试为 Schema 添加对 "format": "date-time" (RFC 3339) 的支持：'
  - 1. 分析现有 format 处理逻辑是如何映射到 GBNF 规则的
  - 2. 设计一个支持 YYYY-MM-DDTHH:mm:ss.sssZ 格式的正则模式
  - 3. 在 _visit_pattern() 中添加对日期组件（年份、月份、日期、小时等）的范围约束
  - 思考问题：
  - '- 如何处理闰年和平年的 2 月天数差异？'
  - '- 如何在不回溯的情况下验证 24 小时制时间？'
  - '- build_min_max_int() 能否复用于日期组件的范围限制？'
  'no': 2
  title: 扩展 JSON Schema 支持日期时间格式
- contents:
  - 参考 llguidance.cpp 中 llama_sampler_llg_apply() 的实现，编写一个简化版的语法约束采样器：
  - 1. 手动构造一个简单的 GBNF 语法（如仅允许 "yes", "no", "maybe" 三个 token）
  - 2. 实现 apply() 函数：遍历候选 token，将不在白名单中的 token 的 logit 设为 -INFINITY
  - 3. 对比使用位掩码（位运算）与使用 std::unordered_set 查找的性能差异
  - 4. 实现 clone() 方法，确保多线程采样时状态独立
  - 思考问题：
  - '- 为什么使用位掩码（uint32_t 数组）而非布隆过滤器或哈希表？'
  - '- 当词表大小为 128k 时，掩码数组需要多少内存？'
  - '- 如何处理 LLGuidance matcher 报错的情况（llg_matcher_get_error）？'
  'no': 3
  title: 构建自定义采样器验证 LLGuidance 掩码
- contents:
  - 基于 common_schema_info::resolves_to_string() 的实现，扩展功能以支持更复杂的 Schema 类型推断：
  - 1. 支持 allOf 场景：确保所有条件都满足字符串类型
  - 2. 支持嵌套 $ref 与 oneOf 的组合（引用一个包含 oneOf 的定义）
  - '3. 处理 {"type": ["string", "null"]} 这种可空字符串的情况'
  - 4. 添加 cycle detection（循环引用检测），记录已访问的引用路径
  - 思考问题：
  - '- 如何处理 {"$ref": "#/definitions/A"} 其中 A 又引用 B，B 又引用 A 的情况？'
  - '- 当 oneOf 中既有字符串又有数字时，resolves_to_string 应该返回什么？'
  - '- 为什么使用 unordered_set 存储 visited_refs 而不是直接使用栈？'
  'no': 4
  title: 设计支持 oneOf 条件的类型推断器
- contents:
  - 基于 common_schema_converter 的 _add_rule() 和 visit() 方法，设计一个钩子（Hook）系统：
  - 1. 允许外部代码注册监听器，在每次添加新规则时收到通知
  - 2. 实现一个调试钩子，打印规则名和规则内容的映射关系
  - 3. 实现一个验证钩子，检查生成的规则名是否符合 GBNF 命名规范（字母、数字、下划线、连字符）
  - 4. 利用 check_errors() 机制，在发现无效规则名时记录警告而非直接失败
  - 思考问题：
  - '- 如何避免钩子函数导致的性能下降？'
  - '- 是否可以在不修改 common_schema_converter 源码的情况下通过继承或组合实现该功能？'
  'no': 5
  title: 实现 Schema 转换的钩子系统
learning_targets:
- 理解流式 JSON 解析中的错误定位与修复机制，掌握 SAX 解析器的栈状态管理
- 掌握 JSON Schema 到 GBNF 语法的转换原理，包括规则注册、引用解析、正则模式转换和整数范围匹配
- 理解 LLGuidance 语法约束引擎的集成方式，掌握 Tokenizer 构建、掩码计算与 Logit 修正的实现
- 学会在采样器链中集成语法约束，实现结构化的可控文本生成
- 掌握启发式 JSON 修复策略（Healing Marker）的设计思路与边界处理
- 理解 Schema 信息探测与类型推断的实现机制，包括循环引用安全处理与移动语义设计
life_analogy:
- 想象一位**智能编辑**面对一份被撕掉一半的旅游攻略（部分 JSON）：
- '- **json_error_locator** = 编辑拿着荧光笔一边读一边做笔记（SAX 回调），读到撕破的地方（parse_error）就记下位置和最后看到的词'
- '- **close_value()** = 每读完一个完整的句子（值），编辑就把对应的段落标签（键名）从书签堆里拿出来，保持书签堆（栈）永远准确'
- '- **Healing Marker** = 编辑在补写完结尾后，贴上一张便利贴标记"此处之后是推测补全的"，方便读者区分原文与修复内容'
- ''
- 想象把一份**菜谱（JSON Schema）翻译成烹饪机器人的指令语言（GBNF）**：
- '- **common_schema_converter** = 翻译官，把"需要 3-5 克盐"（整数范围）转换成机器人能懂的语法规则（build_min_max_int）'
- '- **_resolve_ref()** = 处理"参考前文第 3 章的做法"（$ref 引用），确保不会陷入无限循环引用'
- '- **_build_object_rule()** = 把"必须有盐和糖，可选有醋"（required/optional）编排成严格的语法产生式'
- '- **_not_strings()** = 生成一个"除了这些违禁词之外都可以"的排除规则，像海关的违禁品清单'
- ''
- 想象一位**严格的交通警察（LLGuidance）站在生成引擎旁边**：
- '- **llama_sampler_llg_apply()** = 每当时刻 t 准备生成下一个 token（车辆）时，警察举起牌子（掩码 mask）示意："只有这些车道（合法
  token）可以通行"'
- '- **llama_sampler_llg_new_tokenizer()** = 事先为整个城市的道路（词汇表）绘制详细地图，建立缓存，避免每次重复测量'
- '- **位掩码技术** = 用 32 位整数的一个 bit 表示一个 token 是否合法，实现 O(1) 复杂度的快速查询'
- ''
- 想象一位**图书分类员（common_schema_info）快速判断一本书的类型**：
- '- **resolves_to_string()** = 翻阅书籍的简介（Schema），判断它是否属于"小说类"（字符串类型），即使书皮上写着"可能是小说也可能是诗集"（oneOf）'
- '- **resolve_refs()** = 遇到"参见附录 A"时，安全地翻到对应章节，同时用书签记录已翻过的页码防止反复打转'
'no': 52
summary:
- concept: json_error_locator
  desc: SAX 解析错误定位器，用栈跟踪 JSON 嵌套结构，精确记录解析中断位置
- concept: close_value()
  desc: 值解析完成后弹出键名，维护栈状态以辅助推断缺失的闭合符号
- concept: common_json_parse
  desc: 启发式 JSON 修复入口，支持迭代器范围与字符串输入，通过补全括号/占位符修复截断 JSON
- concept: healing_marker
  desc: 修复标记机制，在补全位置插入特殊标记，区分原始内容与修复内容
- concept: common_schema_converter
  desc: JSON Schema 到 GBNF 的核心转换器，支持 $ref、oneOf、正则、数值范围等复杂特性
- concept: _visit_pattern()
  desc: 正则表达式转 GBNF 语法，处理字符类、分组、重复等复杂模式
- concept: _build_object_rule()
  desc: 构建对象属性规则，区分 required 与 optional，处理 additionalProperties
- concept: build_min_max_int()
  desc: 生成整数范围匹配规则，支持正负数与固定位数的精确匹配
- concept: _resolve_ref() / resolve_refs()
  desc: 安全解析 Schema 内部引用，防止循环引用导致的无限递归
- concept: _not_strings()
  desc: 生成排除特定字符串列表的匹配规则，用于 enum/const 的否定形式
- concept: _generate_constant_rule()
  desc: 将常量值转换为 GBNF 字面量规则
- concept: _add_primitive()
  desc: 注册基础类型规则（如 string、number、integer）及其依赖
- concept: check_errors()
  desc: 收集转换过程中的错误并抛出异常，确保语法有效性
- concept: format_grammar()
  desc: 将内部规则表格式化为标准 GBNF 语法文本
- concept: common_schema_info
  desc: Schema 探测辅助类，提供引用解析与字符串类型推断能力，采用 Pimpl 与移动语义设计
- concept: common_schema_info() / ~common_schema_info()
  desc: 构造与析构函数，管理内部实现与资源生命周期
- concept: operator=
  desc: 移动赋值运算符，转移 Schema 信息对象的所有权
- concept: resolves_to_string()
  desc: 递归判断 Schema 是否解析为字符串类型，支持 oneOf/allOf/enum/const 等复杂场景
- concept: json_schema_to_grammar()
  desc: 对外主接口，根据编译选项决定输出 GBNF 或 LLGuidance JSON
- concept: build_grammar()
  desc: 构建器模式接口，允许调用方通过回调自定义规则添加逻辑
- concept: common_grammar_builder
  desc: 构建器回调结构体，封装 add_rule、add_schema、resolve_refs 三个函数指针
- concept: common_grammar_options
  desc: 语法构建选项结构体，控制 dotall 等正则匹配模式
- concept: llama_sampler_llg
  desc: LLGuidance 采样器封装，集成语法约束到 llama.cpp 采样流程
- concept: llama_sampler_llg_apply()
  desc: 计算并应用 Token 掩码，将非法 token 的 logit 设为 -INFINITY
- concept: llama_sampler_llg_new_tokenizer()
  desc: 构建并缓存 LLGuidance Tokenizer，预计算所有 token 的字节表示
- concept: llama_sampler_llg_clone()
  desc: 深拷贝采样器状态，支持采样器链的独立分支与回退
- concept: llama_sampler_llg_reset()
  desc: 重置 matcher 状态到初始位置，用于新的生成会话
- concept: llama_sampler_llg_free()
  desc: 释放 LLGuidance matcher 和 tokenizer 资源
