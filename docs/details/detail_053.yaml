  name: llguidance 语法约束集成 —— 采样时的"语法警察"
  'no': 4
  points:
  - '**LLGuidance 是什么？**'
  - '- 高效的语法约束引擎，可将 GBNF 等语法编译为 token 掩码'
  - '- 与 llama.cpp 采样器链集成，在生成时实时过滤非法 token'
  - '- 支持 Lark/JSON Schema 等多种语法描述格式'
  - '**llama_sampler_llg 的数据结构**'
  - '- 封装 LlgTokenizer 与 LlgMatcher 指针，管理语法匹配状态'
  - '- 保存词表（vocab）指针与语法类型/数据，支持克隆与重置'
  - '- 条件编译：仅在启用 LLAMA_USE_LLGUIDANCE 时提供完整实现'
  - '**采样器生命周期管理**'
  - '- `llama_sampler_llg_new()`：创建 matcher，处理初始化错误，支持日志级别环境变量'
  - '- `llama_sampler_llg_name()`：返回采样器名称 "llguidance"'
  - '- `llama_sampler_llg_accept_impl()`：通知 matcher 已接受的 token，推进语法状态'
  - '- `llama_sampler_llg_reset()`：重置 matcher 到初始状态，重新开始约束匹配'
  - '- `llama_sampler_llg_free()`：释放 matcher、tokenizer 和上下文资源'
  - '**掩码计算与 logit 修正**'
  - '- `llama_sampler_llg_apply()`：获取当前语法状态的合法 token 位掩码'
  - '- 遍历候选 token，将掩码为 0 的项的 logit 设为 -INFINITY'
  - '- 位运算优化：token / 32 定位到 uint32 单元，token % 32 确定位偏移'
  - '**Tokenizer 构建与缓存策略**'
  - '- `llama_sampler_llg_new_tokenizer()`：将 llama 词表转换为 LLGuidance 格式'
  - '- 预计算所有 token 的字节表示与长度，构建连续内存块'
  - '- 实现缓存机制：同一词表复用 tokenizer，避免重复构建开销'
  - '- `llama_sampler_llg_tokenize_fn()：tokenizer 回调，处理字节到 token 的转换'
  - '**初始化入口**'
  - '- `llama_sampler_init_llg()`：创建采样器实例，注册到 llama_sampler 接口'
  - '- 验证词表大小与掩码字节大小的一致性（32 位对齐检查）'
