  name: JSON Schema 转 GBNF —— 结构化输出的"语法翻译官"
  'no': 2
  points:
  - '**common_schema_converter：Schema 到文法的编译器**'
  - '- 核心职责：将 JSON Schema 的类型约束转换为 GBNF 产生式规则'
  - '- 维护规则映射表（_rules），处理命名冲突与规则去重'
  - '- 支持复杂特性：$ref 引用、oneOf/anyOf 联合类型、正则模式、数值范围约束'
  - '**规则生成的基础组件**'
  - '- `_add_rule()`：规则注册与去重，处理非法字符替换，确保规则名唯一'
  - '- `_generate_union_rule()`：将 oneOf/anyOf 转换为 GBNF 的选择分支（| 分隔）'
  - '- `_generate_constant_rule()`：将常量值（const）转换为字面量规则'
  - '- `_add_primitive()`：注册基础类型规则（string, number, integer, boolean, null, array,
    object）'
  - '**复杂 Schema 结构的处理**'
  - '- `_build_object_rule()`：对象属性编排，区分 required 与 optional，处理 additionalProperties'
  - '- `_visit_pattern()`：正则到 GBNF 的转换，处理字符类、分组、重复等复杂语法'
  - '- `_not_strings()`：生成排除特定字符串的规则，用于处理负向约束'
  - '- `build_repetition()`：构建重复次数规则（minItems/maxItems），支持分隔符'
  - '- `build_min_max_int()`：整数范围的精确匹配，支持正负数、固定位数的数字序列'
  - '**引用解析与递归**'
  - '- `_resolve_ref()`：处理 Schema 内部引用（$ref），防止循环引用'
  - '- `resolve_refs()`：递归遍历整个 Schema，解析所有引用并展开'
  - '- `visit()`：递归下降访问 Schema 节点，分发到具体类型处理器'
  - '**辅助工具与全局代码**'
  - '- `replacePattern()`：正则表达式替换工具，支持自定义替换函数'
  - '- `format_literal()` / `gbnf_format_literal()`：将字符串字面量格式化为 GBNF 兼容格式，转义特殊字符'
  - '- `__main__` 全局区域：包含静态断言、常量定义及全局辅助代码，支撑模块级功能'
  - '**对外接口与 LLGuidance 桥接**'
  - '- `json_schema_to_grammar()`：核心入口，根据编译选项决定输出 GBNF 或 LLGuidance JSON'
  - '- `build_grammar()`：构建器模式，允许调用方通过回调自定义规则添加逻辑'
  - '- `common_schema_info`：辅助类，提供 Schema 引用解析与类型推断能力'
