learning_targets:
- 理解 GBNF 语法元素的统一抽象（llama_gretype 枚举与 llama_grammar_element 二元组结构）
- 掌握 GBNF 解析器从文本到规则数组的完整流水线（parse_space → parse_name → parse_token → parse_sequence
  → parse_alternates → parse_rule）
- 了解字符范围、token 字面、重复量词（*/+/?/{m,n}）的解析机制与左递归检测
- 理解下推自动机栈推进模型（llama_grammar_advance_stack）的多 ALT 分支展开与去重
- 掌握候选 token 过滤（llama_grammar_reject_candidates）如何把语法约束映射到 logits
- 熟悉延迟触发语法（lazy grammar）的 await 状态机、token 与正则触发条件及回放机制
- 能阅读、修改并扩展自定义 GBNF 语法规则
life_analogy:
- 把 GBNF 语法系统想象成一个**出行检查站**：
- '- **token（单词）** = 一位位旅客，每个人随身携带着行李（字符/码点）'
- '- **llama_gretype 枚举** = 行李安检的几种检查类型（X 光机 / 人工开包 / 嗅探犬 / 通行章）'
- '- **llama_grammar_element** = 每张行李清单上的单项标签（{类型, 编号}）'
- '- **parse 解析** = 把贴在墙上的「安检规则」逐条读懂并转写成机器可识别的清单'
- '- **重复量词 `*` / `+` / `{m,n}`** = 给某条规则批量生成子规则的复印机（复印太多就熔断保险丝）'
- '- **左递归检测** = 检查规则中有没有「请把 A 规则再查一次自己」的死循环陷阱'
- '- **llama_grammar_advance_stack** = 把「指向规则名」的标签展开为「具体要检查的物品」清单'
- '- **下推栈（stack）** = 当前手头正在等待检查的物品序列，处理完一项就 pop 下一项'
- '- **match_char / match_token** = 真正去翻看物品是否符合规则的判断器'
- '- **reject_candidates** = 把候选 token 一一过安检，不合规的就贴上「-∞」拒绝登机'
- '- **lazy 延迟触发** = 闸口平时开放，谁走过都放行；一旦识别到「触发关键词/正则」，闸机立刻落下开始严格检查'
- '- **trigger_buffer + trigger_buffer_positions** = 闸口前的缓冲带，同时记录「文本快照」和「旅客编号」，触发后按编号精准回放'
- 整套机制的设计哲学是：**先把规则「翻译」成机器可遍历的元素流，再用栈推进模拟推导出所有合法序列，最后在采样阶段把不合法的 token 拒之门外。**
'no': 20
summary:
- concept: '`llama_gretype`'
  desc: 9 类语法元素枚举，统一字符/token/规则/区间/集合的标签体系
- concept: '`llama_grammar_element`'
  desc: '{type, value} 二元组，是规则的最小积木'
- concept: '`struct llama_grammar`'
  desc: 运行时语法实例，聚合 vocab/rules/stacks/触发器等所有状态
- concept: '`struct llama_grammar_trigger_pattern`'
  desc: 正则触发器，封装 pattern + std::regex 编译对象与 find 方法
- concept: '`decode_utf8`'
  desc: 单字符/字符串双版本，支持跨 token 部分 UTF-8 续接
- concept: '`parse_space / parse_name / parse_int`'
  desc: '词法跳过与命名识别，理解 # 行注释'
- concept: '`parse_char / parse_hex`'
  desc: 处理 \x/\u/\U/\t/\r/\n/\\ 等字面与十六进制转义
- concept: '`parse_token`'
  desc: 支持 <[id]> 直接 ID 与 <piece> 词表反查两种 token 字面
- concept: '`llama_grammar_parser`'
  desc: 解析器类，封装 vocab / symbol_ids / rules 与解析入口
- concept: '`get_symbol_id`'
  desc: 显式命名 → 数字 ID 的查表分配
- concept: '`generate_symbol_id`'
  desc: 匿名规则用 name_N 形式合成新符号 ID
- concept: '`add_rule`'
  desc: 按 rule_id 自动扩容 rules 容器并写入规则
- concept: '`parse_alternates`'
  desc: 递归下降完成 `name ::= seq | seq | ...` 的选项组装
- concept: '`parse_sequence`'
  desc: 序列元素（含字面串、字符集、token、量词、分组）解析主循环
- concept: '`parse_rule`'
  desc: 解析单条 `name ::= alternates` 规则
- concept: '`parse`'
  desc: 顶层入口，校验所有规则非空、所有 RULE_REF 指向已存在规则
- concept: '`print`'
  desc: 反向建立 symbol_id_names 后批量打印 GBNF 文本
- concept: '`c_rules`'
  desc: 将 vector<vector<element>> 转换为 vector<element*> 的 C 接口数据
- concept: 重复量词翻译逻辑（位于 parse_sequence 内的 lambda）
  desc: 把 */+/?/{m,n} 量词翻译为多条合成规则（name_N），并设置 2000 阈值防爆
- concept: '`MAX_REPETITION_THRESHOLD = 2000`'
  desc: 防止恶意/错误语法生成的规则数爆炸
- concept: '`print_rule / print_rule_binary`'
  desc: 人类可读 GBNF 文本 / 类型标签调试输出
- concept: '`llama_grammar_is_end_of_sequence`'
  desc: 识别 END/ALT 这两个栈推进终止哨兵
- concept: '`llama_grammar_match_char`'
  desc: 字符级匹配，支持 [a] / [a-z] / [abc] / . 四类语法
- concept: '`llama_grammar_match_partial_char`'
  desc: 用区间 [low, high] 判断部分 UTF-8 是否能补全为合法字符
- concept: '`llama_grammar_match_token`'
  desc: token ID 等值匹配，支持 TOKEN_NOT 反向匹配
- concept: '`llama_grammar_advance_stack`'
  desc: 将 RULE_REF 展开为具体元素序列，按指针地址去重防止指数级栈爆炸
- concept: '`llama_grammar_detect_left_recursion`'
  desc: 三色 DFS 检测左递归，并顺便计算每条规则是否能推导出空串
- concept: '`llama_grammar_accept_chr`'
  desc: 单字符驱动单栈推进，忽略 token 类型元素
- concept: '`llama_grammar_accept`'
  desc: 单字符驱动所有栈并行推进
- concept: '`llama_grammar_accept_str`'
  desc: 字符串版本，按码点逐字符 accept 并维护 partial_utf8
- concept: '`llama_grammar_reject_candidates_for_stack`'
  desc: 单栈过滤：遍历候选 token 的码点序列，逐字符判断
- concept: '`llama_grammar_reject_candidates`'
  desc: 多栈交集过滤，多栈都拒绝的 token 才最终拒绝
- concept: '`llama_grammar_apply_impl`'
  desc: 把被拒绝 token 的 logit 设为 -INFINITY，直接喂给采样器
- concept: '`llama_grammar_init_impl`（数组/字符串双版本）'
  desc: 构造运行时 grammar 实例，把 vec_rules 用 std::move 送进对象以保证栈指针有效
- concept: '`llama_grammar_clone_impl`'
  desc: 四重循环重定向栈中指针到新 rules 内存，完成深拷贝
- concept: '`llama_grammar_free_impl`'
  desc: delete grammar，所有数据成员均为 RAII 自管
- concept: '`llama_grammar_accept_impl`'
  desc: 含 lazy 状态机的 token 接受入口，处理触发与正常两种路径
- concept: '`llama_grammar_accept_token`'
  desc: 单 token 推进所有栈，按栈顶类型分别匹配 token / 字符码点
- concept: '`llama_grammar_get_rules / get_stacks`'
  desc: 暴露 rules 与 stacks 给测试代码的访问器
- concept: '`partial_utf8`'
  desc: 维护跨 token 边界的 UTF-8 续接状态，避免多字节字符被错误切分
- concept: '`awaiting_trigger` 状态机'
