learning_targets:
- 理解mtmd-debug工具的双模调试设计哲学（编码与预处理分离）
- 掌握合成测试数据（纯色/棋盘格/正弦波）在多模态调试中的应用方法
- 熟悉内部调试接口的隔离设计原则与cb_eval回调机制
- 了解废弃二进制命令的优雅迁移策略与跨平台路径处理
- 掌握基于SentenceTransformer的语义相似度计算在端到端测试中的应用
- 理解Python测试脚本的路径解析与资源管理最佳实践
life_analogy:
- 想象多模态模型是一家**精密仪器制造厂**，mtmd-debug工具就是厂里的**「质量检测仪」**：
- '- **合成图像/音频** = 标准测试件（纯白、纯黑、棋盘格如同标准的灰度卡、色块）'
- '- **encode模式** = 成品性能测试（检验最终输出是否符合规格）'
- '- **preproc模式** = 原材料检验（检查进料是否符合加工标准）'
- '- **cb_eval回调** = 生产线上的透明观察窗（可以看到每个工序的中间状态）'
- '- **deprecation-warning** = 旧设备上的「此设备已淘汰，请使用新型号」标签'
- '- **DeepSeek-OCR测试** = 与进口设备（HuggingFace）进行「对表」验证，确保测量结果一致'
- 就像质检员不会直接拆解成品来检查内部结构，而是通过标准测试信号观察中间过程，mtmd-debug也是通过标准输入和回调机制来「听诊」模型内部状态。
'no': 77
summary:
- concept: mtmd-debug工具
  desc: 多模态管线听诊器，支持encode/preproc双阶段调试
- concept: 合成测试信号
  desc: black/white/gray/cb(图像)与one/zero/half/1010/440(音频)，用于隔离验证特定功能
- concept: cb_eval回调注入
  desc: 强制注入common_debug_cb_eval<false>，实现非侵入式中间张量观测
- concept: 调试接口矩阵
  desc: encode/preproc × image/audio 四接口组合，覆盖两种数据类型与两种处理阶段
- concept: 优雅弃用策略
  desc: 打印警告+EXIT_FAILURE，而非静默失败，引导用户迁移至llama-mtmd-cli
- concept: 跨平台路径处理
  desc: 同时匹配/与\分隔符，确保argv[0]解析在Windows与Unix一致
- concept: 语义相似度验证
  desc: 使用SentenceTransformer计算余弦相似度，替代strict文本匹配，容忍措辞差异
- concept: 双模式OCR测试
  desc: 同时验证Free OCR与Markdown OCR两种任务，确保全部达标才算通过
- concept: 防御性locale设置
  desc: setlocale(LC_NUMERIC, "C")确保数字格式化不受系统区域设置影响
- concept: 最小侵入式调试
  desc: 通过回调输出中间值而非修改返回值，保持被测代码逻辑纯净
- concept: 路径资源管理
  desc: 基于__file__的相对路径解析，确保测试脚本可在任意工作目录运行
