- contents:
  - 阅读 `tools/mtmd/debug/mtmd-debug.cpp` 第52-195行 `__main__` 函数，重点分析：
  - 1. `params.prompt` 如何决定执行路径（encode vs preproc）？默认行为是什么？
  - 2. 在encode模式下，为什么图像使用`std::vector<std::vector<float>>`而preproc模式使用`std::vector<uint8_t>`？
  - 3. `inp_size`参数在图像和音频场景中分别代表什么含义？
  - 4. 尝试扩展代码：添加一个新的合成图像类型`gradient`（从左到右0.0到1.0渐变），需要修改哪些分支？
