  - '**双模调试设计哲学**'
  - '- 同时支持 `encode`（编码/前向传播）与 `preproc`（预处理）双阶段调试'
  - '- `--image`/`--audio` 统一入口，内部自动区分图像与音频路径'
  - '- 通过 `-n` 参数统一控制输入尺寸（图像边长或音频样本数）'
  - '**合成输入类型：极简主义的测试信号**'
  - '- 图像：`black`/`white`/`gray`（纯色棋盘）与 `cb`（棋盘格），用于验证基础色彩响应与空间结构'
  - '- 音频：`one`/`zero`/`half`（直流偏置）与 `1010`（方波交替），检测直流响应与高频特性'
  - '- 音频特别支持：`440` 生成 440Hz 正弦波，用于验证频谱特征提取（如梅尔滤波器组）'
  - '**上下文初始化的特殊处理**'
  - '- 强制要求 `--mmproj` 多模态投影文件，视觉/音频模型为必需参数'
  - '- 调试回调强制注入：`cb_eval = common_debug_cb_eval<false>`，捕获中间张量值'
  - '- 线程与 GPU 配置透传：`n_threads`、`use_gpu`、`flash_attn_type` 等参数继承自通用配置'
  - '**执行分流逻辑**'
  - '- `encode` 模式：图像使用 `float` RGB 格式（0.0-1.0），音频使用 `float` PCM；直接调用 `mtmd_debug_encode_*`'
  - '- `preproc` 模式：图像使用 `uint8_t` RGB（0-255），音频使用 `float` PCM；调用 `mtmd_debug_preprocess_*`'
  - '- 模式选择依据：`params.prompt == "preproc"` 为预处理，否则默认或 `encode` 为编码'
