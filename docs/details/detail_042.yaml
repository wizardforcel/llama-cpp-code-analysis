- concept: '`reorder_qw_*()`'
  desc: 权重量化布局重排，将GGML量化格式转换为Intel XMX优化的连续布局
- concept: '`ggml_backend_sycl_split_buffer_type()`'
  desc: 多GPU张量分割，将权重按行分割到多个SYCL设备，支持内存受限场景
- concept: '`flash_attn_tile_iter()`'
  desc: Flash Attention Tile内核迭代，使用共享内存加载KV并计算KQ/VKQ
- concept: '`vec_dot_q4_0_q8_1_impl_mmq()`'
  desc: Q4_0与Q8_1混合精度点积，使用dp4a指令实现8元素并行计算
- concept: '`rope_norm/neox/multi/vision()`'
  desc: RoPE四种变体实现，支持标准、NeoX、多模态（M-RoPE）和视觉位置编码
- concept: GGML后端统一接口
  desc: ggml_backend_i/device_i/reg_i三件套接口，实现所有后端的统一注册和调度
- concept: 算子能力边界
  desc: 每个后端通过supports_op声明支持的算子子集，实现『选择性卸载』和CPU回退
- concept: 量化格式适配差异
  desc: BLAS反量化/CANN转NZ/SYCL重排XMX/OpenVINO提取重构，四种不同的硬件适配策略
