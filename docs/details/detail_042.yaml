  name: OpenVINO 后端 —— Intel AI PC的『图优化大师』
  'no': 3
  points:
  - '**OpenVINO的策略：整图编译与优化**'
  - '- 与CANN的逐个算子映射不同，OpenVINO后端的策略是将整个GGML计算图（`ggml_cgraph`）转换为一个完整的OpenVINO模型(`ov::Model`)，然后编译并执行这个模型。'
  - '- 这个过程更复杂，但能利用OpenVINO强大的图优化能力，适用于Intel CPU、GPU和NPU（AI PC）。'
  - '**核心桥梁：GgmlOvDecoder**'
  - '- `ggml-decoder.h` 中定义的 `GgmlOvDecoder` 类是整个转换流程的核心。它扮演一个『解码器』的角色，向OpenVINO前端逐个节点地暴露GGML图的拓扑结构和张量信息。'
  - '- `compute_llm_params()` 和 `set_input_output()` 等函数负责解析LLM特有的结构，如KV缓存、RoPE参数、序列长度等，并将它们转化为OpenVINO的模型参数和输入。'
  - '- `compute_op_case()` 方法决定了优化路径：它分析每个算子的输入结构，输出一个优化代码（如op_case 1/2/3），指导后续的翻译器选择最优实现。'
  - '**算子映射与图变换Pass**'
  - '- `translate_session.cpp` 和 `op_table.cpp` 负责实际的『翻译』工作。它们通过 `visit_subgraph()`
    遍历GGML图，并使用一系列 `translate_*` 函数（如 `translate_mulmat`, `translate_rope`）将GGML算子映射为OpenVINO算子。'
  - '- `apply_transformations()` 在初始模型生成后，会执行一系列OpenVINO的图优化Pass：'
  - '  - `EliminateZeroPoints`：消除量化零点，简化计算图'
  - '  - `FuseToSDPA`：融合为SDPA（Scaled Dot-Product Attention）算子'
  - '  - `SqueezeMatmul`：压缩MatMul维度，提升矩阵乘效率'
  - '**执行与缓存机制**'
  - '- `utils.cpp` 中的 `ov_graph_compute()` 是执行入口。它区分动态图（CPU/GPU）和静态图（NPU）路径。'
  - '- 为了避免重复转换和编译的开销，该后端实现了对解码器(`GgmlOvDecoder`)和编译后的模型(`ov::InferRequest`)的缓存机制，通过
    `graph_key` 来判断计算图是否已存在，实现高效复用。'
  - '**量化权重的特殊处理**'
  - '- `ggml-quants.cpp` 负责解包GGML的量化权重（如Q4_0, Q4_K, Q6_K等）。'
  - '- `extract_q4_0_data()` 等函数将GGML量化格式拆分为权重、缩放和零点三部分。'
  - '- `make_int4_weights()` 和 `requantize_to_buffers()` 支持将权重重构或重新量化为适合OpenVINO的格式，包括NPU特定的requantization。'
  - '**多渠道与形状支持**'
  - '- 动态图路径支持动态形状推导（dynamic shapes），适用于CPU和GPU。'
  - '- 静态图路径针对NPU优化，使用固定形状以最大化性能，并支持分块预填充（chunk processing）策略。'
  - '- 支持状态化管理（stateful execution），可以跨调用保持KV缓存状态。'
