learning_targets:
- 理解BLAS后端作为『CPU外援』的角色定位：只加速矩阵乘法和外积，不管理内存，并掌握其基于线程数的性能调优机制
- 掌握CANN后端将GGML算子翻译为ACLNN调用的完整流程，包括张量格式转换（ND/NZ）、广播处理、RoPE缓存管理和ACL图捕获优化
- 深入理解OpenVINO后端的『整图转换』策略，掌握GgmlOvDecoder如何充当GGML与OpenVINO之间的桥梁，以及动/静态图在CPU/GPU/NPU上的执行差异
- 熟悉SYCL后端的庞大算子库，掌握针对Intel GPU的各种优化技术：XMX检测、权重重排（reorder）、Flash Attention内核选择（Tile
  vs Vec）、多设备分割（split buffer）
- 掌握多后端集成到GGML框架的统一接口模式（ggml_backend_i, ggml_backend_device_i, ggml_backend_reg_i）以及各后端能力边界的描述方式（supports_op）
- 了解不同后端在量化权重处理上的差异策略：BLAS的反量化、CANN的NZ格式转换、SYCL的reorder优化、OpenVINO的量化解包
- 理解OpenVINO对动态形状（CPU/GPU）和静态形状（NPU）的差异化处理策略，包括分块预填充（chunk processing）和状态化管理
- 掌握各后端算子级别的实现细节：RoPE的多种变体（普通、NeoX、M-RoPE、Vision）、Flash Attention的优化路径、GLU系列的融合算子
life_analogy:
- 想象GGML的多后端系统是一个**国际物流中心网络**：
- ''
- '- **BLAS后端 = 本地快递站的『最后一公里』**'
- '  - 只负责最常见的标准包裹（FP32大矩阵乘法），利用现有的城市道路（CPU缓存）快速配送'
- '  - 不建仓库（不管理内存），只做纯搬运，知道什么时候小件包裹不值得用人（min_batch阈值）'
- ''
- '- **CANN后端 = 华为昇腾的『海关清关中心』**'
- '  - 需要把国际标准包裹（GGML张量）翻译成华为ACLNN能理解的『报关单』格式'
- '  - 有专门的『保税仓库』（内存池）管理NPU显存，支持优先级和虚拟内存管理'
- '  - 货物进入前可能需要重新打包：`transform_q4_0()` 把标准量化格式转成昇腾喜欢的NZ布局'
- ''
- '- **OpenVINO后端 = Intel AI PC的『智能翻译局』**'
- '  - 不像CANN逐个文件翻译，而是把整个『项目计划书』（计算图）整体编译优化'
- '  - 像专业翻译团队：`GgmlOvDecoder` 读懂GGML的『源语言』，`TranslateSession` 生成OpenVINO的『目标语言』'
- '  - 有专门的『校对编辑』（图优化Pass）：`EliminateZeroPoints` 消除冗余零点、`FuseToSDPA` 融合注意力算子'
- ''
- '- **SYCL后端 = Intel GPU的『全能军工厂』**'
- '  - 不是简单翻译，而是从底层『锻造』针对Intel GPU优化的专用武器'
- '  - 有几十种专用工具：量化GEMM（mmq.cpp）、DMMV反量化乘（dmmv.cpp）、Flash Attention（tile/vec两种）'
- '  - 会智能选择最优『工艺』：检测XMX硬件扩展，决定是否重排（reorder）权重布局'
- '  - 支持『多工厂协同』（split buffer）：大工件（权重）分割到多个GPU并行处理'
- ''
- 就像物流中心经理需要根据包裹类型（张量类型）、目的地（硬件平台）、时效要求（性能需求）选择不同的配送方式，GGML的多后端框架也根据算子特性、硬件能力、内存布局动态选择最优的执行路径。
'no': 41
summary:
- concept: '`ggml_backend_blas_mul_mat()`'
  desc: BLAS后端的矩阵乘法，处理非F32类型转换后调用cblas_sgemm，支持多线程并行
- concept: '`ggml_backend_blas_device_supports_op()`'
  desc: BLAS能力边界：仅支持连续FP32 MUL_MAT和OUT_PROD，且有最小批量阈值(min_batch=32)
- concept: '`ggml_cann_create_tensor()`'
  desc: CANN核心桥接函数，将GGML张量转换为ACL格式，处理维度反转、步长计算和偏移
- concept: '`ggml_cann_compute_forward()`'
  desc: CANN算子调度中枢，根据op类型分发到aclnn具体实现，支持融合算子优化
- concept: '`ggml_backend_cann_graph_compute()`'
  desc: 支持ACL Graph模式的图执行，通过LRU缓存复用已捕获的图避免重复构建开销
- concept: '`ggml_backend_cann_transform_q4_0()`'
  desc: 将GGML Q4.0量化格式转换为昇腾NPU的NZ布局，实现硬件加速
- concept: '`ggml_cann_rope_cache_preload()`'
  desc: RoPE缓存预加载，在图捕获前计算sin/cos张量，避免主机-设备同步开销
- concept: '`ggml_cann_op_add_rms_norm_fused()`'
  desc: 算子融合示例：将ADD和RMS_NORM合并为单个ACLNN调用，减少kernel启动开销
- concept: GgmlOvDecoder
