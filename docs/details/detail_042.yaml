  name: CANN NPU 后端 —— 华为昇腾的『算子翻译官』
  'no': 2
  points:
  - '**CANN后端的角色：连接GGML与华为昇腾NPU**'
  - '- 该后端的核心任务是将GGML的计算图操作『翻译』成华为昇腾AI处理器能理解的ACLNN (Ascend Computing Language) 算子调用。'
  - '- `ggml_backend_cann_init()` 和 `ggml_backend_cann_reg()` 负责初始化ACL环境、发现NPU设备并注册到GGML框架，并支持多设备管理。'
  - '**张量转换与内存管理**'
  - '- `acl_tensor.cpp` 中的 `ggml_cann_create_tensor()` 是关键转换器，它负责将GGML的张量描述（维度、步长、类型、偏移）转换为ACL张量格式，是所有算子调用的基础。'
  - '- 实现了多种内存池策略（如基于优先级的 `ggml_cann_pool_buf_prio` 和基于虚拟内存的 `ggml_cann_pool_vmm`），以高效管理NPU上的显存，降低碎片。'
  - '**算子调度与高级特性**'
  - '- `ggml_cann_compute_forward()` 是一个庞大的调度器，根据算子类型(`GGML_OP_*`)分发到具体的实现函数，支持50+种算子。'
  - '- `ggml_backend_cann_graph_compute()` 是图执行入口，它可选地使用CANN的Graph模式（ACL Graph）进行捕获和优化，显著提升重复性图执行的效率。'
  - '- 对于量化权重，`ggml_backend_cann_transform_q4_0()` 和 `ggml_backend_cann_transform_q8_0()`
    等函数负责将GGML的量化格式转换为CANN计算的特定布局（NZ format），以利用NPU的硬件加速。'
  - '**RoPE、Flash Attention与融合优化**'
  - '- `aclnn_ops.cpp` 包含了大量算子的具体实现，包括RoPE（`ggml_cann_rope`）的缓存预加载机制（`ggml_cann_rope_cache_preload`）以支持图模式。'
  - '- 支持复杂的算子如 Flash Attention（`ggml_cann_flash_attn_ext`）、门控线性注意力（`ggml_cann_gated_linear_attn`）和
    MoE（`ggml_cann_mul_mat_id`）。'
  - '- 实现了算子融合优化，例如 `ggml_cann_op_add_rms_norm_fused()` 可以将 ADD 和 RMS_NORM 融合为单个ACLNN调用，减少内核启动开销。'
