learning_targets:
- 理解聊天消息（common_chat_msg）的核心字段设计：role、content、content_parts、reasoning_content、tool_calls
  的职责划分与互斥规则
- 掌握 OpenAI 兼容 JSON 格式的双向转换机制：消息解析（common_chat_msgs_parse_oaicompat）与序列化（to_json_oaicompat）
- 理解流式场景下的增量差异计算：string_diff 前缀提取逻辑与 compute_diffs 的完整流程
- 掌握 common_chat_template 的构造与能力检测：词法分析、语法解析、bos/eos_token 存取与 original_caps 查询
- 理解 Jinja 模板直接渲染机制：common_chat_template_direct_apply_impl 的上下文构造、override 参数注入
- 掌握七大模型专用模板适配策略：Ministral-3 的思维块封装、GPT-OSS 的通道标记、Gemma 4 的回合构建器等
- 理解模板变通（workaround）机制：map_developer_role_to_system、system_message_not_supported、requires_non_null_content、func_args_not_string
  四大适配器的触发条件
- 掌握 PEG 解析器的分层设计：build_chat_peg_parser 的组合子构建、通用与 Gemma4 特化 mapper 的差异、partial parse
  的流式恢复
- 理解 common_chat_parser_params 的双构造函数职责：默认构造与从 common_chat_params 派生 format/generation_prompt
- 掌握消息验证与格式化接口：common_chat_verify_template、common_chat_format_single、common_chat_format_example、common_chat_template_direct_apply
  等
- 理解 common_chat_templates_deleter 的 RAII 资源管理设计及其与 common_chat_templates_free 的协作
- 理解 __main__ 全局代码中关于 thinking 内容块的构造逻辑与消息转换责任
life_analogy:
- 想象 llama.cpp 的聊天系统是一家**国际快递公司**：
- '- **common_chat_msg** = 标准化的快递面单：包含收件人（role）、物品清单（content）、分包明细（content_parts）、特殊备注（reasoning_content）、附加服务单（tool_calls）'
- '- **to_json_oaicompat** = 面单打印机：把内部数据结构「翻译」成 OpenAI 标准格式的物流标签'
- '- **string_diff** = 快递追踪系统的增量上报：只发送「新增了什么」而非全量重新投递'
- '- **七大专用模板** = 七个不同国家的海关申报系统：每个国家（Ministral/GPT-OSS/Gemma4等）有自己的申报规则，需要专门的「翻译官」进行格式转换'
- '- **workaround 适配器** = 清关时的特殊处理通道：如果模板不支持 system 角色，就把系统消息「贴」到下一条消息上；如果参数是字符串，就先解析成
  JSON'
- '- **gemma4_model_turn_builder** = 快递分拣机器人：把「助手下单→工具响应→助手确认」三段流程合并成一个完整的包裹'
- '- **__main__ 中的 thinking 块构造** = 特殊的「海关申报单填制说明」：指导如何把 reasoning_content 打包成 {type:
  thinking} 的标准格式'
- '- **common_chat_parser_params** = 分拣机器人的「工作手册」：记录输出格式规范（format）和生成起始标记（generation_prompt），指导
  PEG 解析器如何拆解模型输出'
- '- **foreach_function/foreach_parameter** = 快递单审核员：逐个检查每个工具调用的参数是否完整、必需字段是否齐全'
- 正如国际快递需要处理不同国家的海关规则，llama.cpp 的聊天系统也需要为每个模型「翻译」其特有的消息格式，确保无论是 Jinja 模板渲染还是 PEG 解析输出，最终都能准确提取
  'assistant在想什么' 和 '要调用什么工具'。
'no': 45
summary:
- concept: common_chat_msg
  desc: 聊天消息标准载体，支持纯文本、分段内容、工具调用和推理内容四种信息形态
- concept: to_json_oaicompat
  desc: OpenAI 兼容序列化：处理 content 与 content_parts 互斥，media_marker 不加换行
- concept: common_chat_msg::empty
  desc: 空消息检测：content、content_parts、tool_calls、reasoning_content、tool_name、tool_call_id
    全为空
- concept: common_chat_msg::set_tool_call_ids
  desc: 工具调用 ID 管理：复用缓存 ID 或调用生成器填充，确保跨消息 ID 一致
- concept: string_diff
  desc: 前缀增量计算，流式场景只返回新增部分，大幅节省带宽
- concept: compute_diffs
  desc: 消息差异计算：检测 content、reasoning_content、tool_calls 变化，工具调用减少时抛异常
- concept: common_chat_template
  desc: Jinja 模板封装：构造时执行词法分析与语法解析，缓存 caps 能力集与 bos/eos token
- concept: common_chat_parser_params
  desc: 解析参数载体：双构造函数支持默认初始化和从 common_chat_params 派生 format 与 generation_prompt
- concept: common_chat_templates_deleter
  desc: 自定义删除器：为 unique_ptr 提供 common_chat_templates_free 调用，实现 RAII 管理
- concept: common_chat_templates_init
  desc: 模板工厂：优先用覆盖参数，否则从模型提取，最后用 CHATML 默认模板
- concept: common_chat_template_direct_apply_impl
  desc: Jinja 直接渲染：构造上下文→注入变量→执行 runtime→收集字符串结果
- concept: common_chat_params_init_ministral_3
  desc: 'Ministral-3 适配：将 reasoning_content 转换为 {type: thinking} 内容块'
- concept: common_chat_params_init_gpt_oss
  desc: GPT-OSS 适配：处理 <|channel|> 等通道标记，工具调用时清除冗余 content
- concept: gemma4_model_turn_builder
  desc: Gemma4 回合构建器：将 (assistant→tool→assistant) 序列合并为单条消息
- concept: common_chat_params_init_functionary_v3_2
  desc: Functionary v3.2 适配：解析 >>>all 普通内容与 >>>${recipient} 工具调用
- concept: common_chat_params_init_kimi_k2
  desc: Kimi K2 适配：处理 <|tool_calls_section_begin|> 区段与 functions.<name>:<index> 调用
    ID
- concept: workaround 四大适配器
  desc: 模板能力补偿：developer→system 映射、system 消息合并、强制非空 content、参数字符串转 JSON
- concept: common_chat_try_specialized_template
  desc: 专用模板分发：通过源码特征标记（如 [SYSTEM_PROMPT]、<|channel|>）识别七大模型
- concept: common_chat_templates_apply_jinja
  desc: Jinja 应用主路径：生成两份 prompt 并计算差值作为 generation_prompt
- concept: common_chat_peg_parse
  desc: PEG 解析执行：支持 partial parse、流式恢复、通用与 Gemma4 双 mapper AST 映射
- concept: common_chat_params
  desc: 聊天参数集合：包含 prompt、format、parser、generation_prompt、supports_thinking 等
- concept: supports_thinking / enable_thinking
  desc: 思维链能力标记：通过模板试渲染检测，控制 reasoning 内容提取
- concept: format_time
  desc: 时间格式化工具：将系统时间转换为指定格式的本地时间字符串
- concept: safe_args_parse
  desc: 安全参数解析：尝试 JSON 解析，失败时返回原始字符串
- concept: has_content_or_tool_calls
