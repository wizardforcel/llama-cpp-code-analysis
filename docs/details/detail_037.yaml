  name: 内存范围跟踪与图重排 —— 让 GPU 像「厨房多灶台」一样并发工作
  'no': 6
  points:
  - '**`ggml_mem_range` 是并发安全的地籍图**'
  - '- `ggml-metal-common.cpp/.h` 这套东西的目的是：在 Metal 后端编码阶段判断两个节点能不能并发执行'
  - '- 说白了就是给每张张量划地块：谁是源、谁是目的、区间有没有重叠，重叠了就说明不能并排放，得加 barrier 或先落串行'
  - ''
  - '**为什么这么重要**'
  - '- GPU 和 CPU 最大的不同是：只要任务互不冲突，就能把它们尽量并发地丢出去跑'
  - '- llama.cpp 之所以在 Metal 上做得很好，一个关键就是不是“一条条排队做”，而是会把大批量可并发的中小算子尽量 parallelize'
  - ''
  - '**`ggml_graph_optimize()` 是整章的调度大脑之一**'
  - '- 它会先做节点融合，再进行 reorder，最后把融合节点展开放回图里'
  - '- 先融合，再重排，再展开的流程很像先做“套餐打包”，再根据厨房灶台位置调整出菜顺序'
  - ''
  - '**`h_safe` 白名单很说明问题**'
  - '- 不是所有算子都能参与重排，像 concat、copy、view 这类算子不能随便移动'
  - '- 只有相对“可交换”的算子，才允许做并发重排；这就是对图语义的保守保护'
  - ''
  - '**为什么要先优化再编码**'
  - '- 你在 `ggml_backend_metal_graph_optimize()` 看到的只是入口动作，真正的“排产智慧”都藏在 `ggml-metal-common.cpp`
    里'
  - '- 这一层的价值就在于：让后面的 encoder 面对的是一个已经被整理过、减少冲突的图，而不是原始乱序图'
