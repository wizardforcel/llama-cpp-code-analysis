  - '**Flash Attention 是 Metal 后端的核心快车道**'
  - '- `ggml_metal_op_flash_attn_ext()` 会按 `has_mask`、`has_sinks`、`has_bias`、`has_scap`、`has_kvpad`
    等条件选择不同的实现'
  - '- 这实际是在说明：GPU 上最重要的算子会被高度特化，不同 head size / 序列布局 / 额外输入会走不同内核'
  - ''
  - '**`extra_pad` / `extra_blk` / `extra_tmp` 是为了周边辅助区**'
  - '- Flash Attention 很多时候不只是算 attention score 本身，还要为了 mask padding、block 记录、临时 reduce
    结果预留额外缓冲'
  - '- 这也是 GPU 写法很典型的地方：主 kernel 之外，辅助缓冲和辅助 kernel 同样重要'
  - ''
  - '**MoE 也不是一次性大锅炖**'
  - '- `ggml_metal_op_mul_mat_id()` 会在专家映射、token 分组和矩阵乘之间做分离设计'
  - '- `ggml_metal_op_mul_mat_id_extra_tpe()` 和 `ggml_metal_op_mul_mat_id_extra_ids()`
    就是在给专家路由和 token 映射预留额外空间'
  - ''
  - '**这一单元的核心价值**'
  - '- 你会看到，性能最高的 GPU 后端不是“大而全写一个通用 kernel”，而是把最重的算子拆成多个专门路径'
  - '- 对 llama.cpp 来说，这种特化尤其重要，因为 LLM 推理里 attention 和 MoE 占了大量时间'
