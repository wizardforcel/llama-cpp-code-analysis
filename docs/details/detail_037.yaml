  - ''
  - '**一个总开关，三种租约**'
  - '- `ggml_backend_metal_buffer_type_alloc_buffer()` 是分配总入口：根据是否要 shared，转到共享或私有
    buffer'
  - '- 但具体到每种仓库，名字、对齐、最大容量、是否主机可访问，都有各自说明，就像同一个仓库公司在不同地段开了三种门店'
  - ''
