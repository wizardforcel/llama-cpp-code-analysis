learning_targets:
- 理解 GGML Metal 后端在 Apple Silicon 上的整体架构与调用链路
- 掌握 Metal 后端公共入口、后端生命周期和注册机制的源码组织方式
- 熟悉 Metal 设备、缓冲区、上下文和事件管理的核心接口设计
- 理解 Metal pipeline 的按需编译、缓存与按算子分发机制
- 掌握 ggml_graph_optimize 中算子融合、图重排与并发安全判断的实现原理
- 能够阅读 Metal 后端中 concat、mul_mat、flash_attn_ext、rope 等算子的编码流程
- 理解 Flash Attention、MoE 等重算子在 Metal 上的特化优化思路
- 理解 pipeline 缓存容器（ggml_metal_pipelines）的完整生命周期管理：创建、注册、查询与释放
life_analogy:
- 把 Metal 后端想象成一座 **Apple GPU 专用智能工厂**：
- '- **ggml-metal.h** = 工厂大门和总开关，只告诉外界这座工厂能开工、能调度、能接单'
- '- **ggml_metal_context** = 整座工厂的中控室，负责设备、同步、事件、数据传输、图执行'
- '- **ggml-metal-device** = 仓库管理员，负责登记设备、分配显存、管理 shared/private/mapped buffer'
- '- **buffer type 注册表** = 仓库的租赁窗口，根据设备能力帮你选择合适的存储套餐'
- '- **pipeline** = 各种专属加工模具，遇到不同的算子就取不同的 Metal shader 来加工'
- '- **pipeline 缓存（ggml_metal_pipelines）** = 模具预热架的出入库登记簿：init 是开架，add 是上货，get 是按编号取货，free
  是关库时整架清仓'
- '- **ggml-metal-ops** = 施工队，把 ggml 图上的每个节点翻译成一条条 Metal 命令'
- '- **mem_range 跟踪** = 车间的地块登记簿，先确认两块工单不会抢同一块地，才能安排并行施工'
- '- **graph optimize + reorder** = 工厂的排产调度器，先把能合并的工序打包，再把互不冲突的活尽量排到一起做'
- '- **FlashAttention / MoE 特化** = 高速专线机床，专门处理最耗时、最重的核心工序'
- '- **kernel 参数结构体（ggml-metal-impl.h）** = 工单的格式模板，告诉 GPU 每个算子需要读哪些张量、怎么加工'
