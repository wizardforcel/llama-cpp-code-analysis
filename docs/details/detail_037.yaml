  name: 管线注册与按需编译 —— 每个算子都有自己的「冲压模具」
  'no': 5
  points:
  - '**pipeline 是 Metal 后端的模具库**'
  - '- `ggml-metal-device.cpp` 里大量 `*_get_pipeline_*` 函数，会根据操作类型、类型、维度、是否支持融合等条件返回合适的
    compute pipeline'
  - '- 也就是说，Metal 不是直接“写死一个 shader”，而是按需求动态选择/编译对应内核'
  - ''
  - '**`ggml_metal_pipelines_t` 是模具仓库本身的「出入库登记簿」**'
  - '- 在讲缓存“取出来用”之前，得先看这个容器怎么被管理：`ggml_metal_pipelines_init()` 开架、`ggml_metal_pipelines_add()`
    以名称为键上架、`ggml_metal_pipelines_get()` 按名取货（未命中返回 `nullptr`，这正是上层决定要不要现场编译的信号）、`ggml_metal_pipelines_free()`
    关库时遍历所有条目逐个 `ggml_metal_pipeline_free()` 再销毁容器'
  - '- 这四个函数共同构成 pipeline 缓存的完整生命周期：它们离每个 `get_pipeline_*` 最近，因为所有 pipeline 查找的第一步都是查这本登记簿'
  - ''
  - '**为什么要有这层缓存**'
  - '- 它的作用就像模具仓库里的货架：同一个内核如果已经编译过，就直接取出来，不必每次都从源码生成'
  - '- 这能极大降低开销，因为 Metal pipeline 创建本身代价不低'
  - ''
  - '**`ggml_metal_library_get_pipeline_*` 家族是分发台**'
  - '- 例如 `cpy`、`sum_rows`、`soft_max`、`norm`、`rope`、`conv_2d`、`flash_attn_ext`、`mul_mv`、`mul_mm`、`argsort`
    等，每个 pipeline 名都包含类型、融合标记、c4 优化、ncpsg/nsg 等元信息'
  - '- 这体现的是一个非常工程化的策略：内核不是一刀切，而是“按图施工”'
  - ''
  - '**实现思想可以这么记**'
  - '- `pipeline name` 负责定位模具'
  - '- `function constants / cv` 负责把运行时参数固化到编译结果里'
  - '- `shared memory / smem` 负责给某些归约类内核留出块内工作区'
  - ''
  - '**框架层细节别忘了看**'
  - '- `ggml_metal_device_deleter`、`ggml_metal_pipelines_init/free/add/get` 这些基础工具，共同决定了设备与
    pipeline 生命周期怎么被安全维护'
  - '- 你可以把它理解成“先把仓库钥匙、货架、出入库登记簿都准备好，后面每个模具才能顺利进出”'
