  name: 设备与缓冲管理 —— 把「显存仓库」打理得井井有条
  'no': 3
  points:
  - '**device 模块是设备通讯录**'
  - '- `ggml-metal-device.cpp/.h` 负责 Metal 设备单例获取、内存统计、设备能力检查、缓冲区创建、映射、销毁等'
  - '- 你可以把它理解成仓库管理员：知道哪台 GPU，有多少可用内存，支持什么操作，给不同 buffer 分类存放'
  - ''
  - '**shared / private / mapped 三种缓冲思路**'
  - '- 共享缓冲：适合主机和设备都能比较方便访问的场景'
  - '- 私有缓冲：更偏设备侧独占，性能上往往更激进'
  - '- 映射缓冲：直接把一片宿主内存映射给设备使用，像一个“桥接仓”'
  - ''
  - '**为什么要区分 buffer type**'
  - '- 因为不同算子、不同平台、不同路径对内存的要求不一样'
  - '- `ggml_backend_metal_buffer_type_get_alloc_size()` 还会为 `MUL_MAT_ID`、`FLASH_ATTN_EXT`、`CUMSUM/ARGSORT`
    之类的操作额外补空间，说明 Metal 后端在分配时会为复杂算子预留“扩展仓”'
  - ''
  - '**读源码时最值得盯的点**'
  - '- `ggml_metal_buffer_map()`、`ggml_metal_buffer_set_tensor()`、`ggml_metal_buffer_get_tensor()`
    这三条主线，理解数据在主机和设备之间怎么进出'
  - '- `ggml_backend_buffer_is_metal()` 用来判断 buffer 是否归 Metal 后端管理，是接口层的“门禁卡”'
