  'no': 1
  points:
  - '**定位导读**'
  - '- ggml-metal 是 llama.cpp 在 Apple 设备上的 GPU 加速后端，本质是把 `ggml_cgraph` 一段段翻译成 Metal
    命令缓冲区去执行'
  - '- 公共入口头文件只负责暴露最高层 API：初始化后端、判断是否 Metal 后端、设置 abort callback、查询 family 支持、触发 capture、后端注册'
  - '- 也就是说，应用层通常不需要直接碰 Objective-C/Metal，只需要拿这个后端入口把 CPU 图搬到 GPU 跑'
  - ''
  - '**公共头文件像「总开关」**'
  - '- `ggml/include/ggml-metal.h` 里声明的是最顶部、最稳定的那层接口'
  - '- 更像“门牌号”：告诉你 Metal 后端存在，能做什么，但不告诉你厨房里具体怎么炒菜'
  - '- 这里最重要的是 `ggml_backend_metal_init()`、`ggml_backend_is_metal()`、`ggml_backend_metal_capture_next_compute()`
    这几个入口'
  - ''
  - '**为什么先讲它？**'
  - '- 因为它是整条链路的“发令枪”：先有后端对象，后面才有 device、context、buffer、pipeline、encoder、graph compute'
  - '- 如果你把 Metal 后端想成一条流水线，那么头文件这一层就是大门开门的钥匙；后面章节里的设备管理、内核编译、算子编码、图执行，全都在这把钥匙以下运行'
