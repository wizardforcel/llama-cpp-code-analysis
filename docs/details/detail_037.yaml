  name: 算子编码与命令分发 —— 每个 GGML 算子都变成一段「Metal 指令」
  'no': 7
  points:
  - '**`ggml-metal-ops.cpp` 是本章真正的施工图纸**'
  - '- 它把 GGML 图里的节点（node）逐个翻译成 Metal 命令编码'
  - '- 比如 `ggml_metal_op_concat()`、`ggml_metal_op_cpy()`、`ggml_metal_op_mul_mat()`、`ggml_metal_op_flash_attn_ext()`、`ggml_metal_op_norm()`、`ggml_metal_op_rope()`
    等等'
  - ''
  - '**一个大而清晰的模式**'
  - '- 先取 node / tensor / pipeline'
  - '- 构造 `ggml_metal_kargs_*` 参数结构体'
  - '- 把 buffer 绑定到 encoder 的对应槽位'
  - '- 设置 threadgroup / smem / dispatch 维度'
  - '- 最后把命令封装进 Metal encoder'
  - ''
  - '**`ggml_metal_op_encode()` 是分发枢纽**'
  - '- 它根据 `node->op` 把流量导到不同的专骸函数'
  - '- 这也是 Metal 后端的“总台调度”：图上每来一个节点，它都先判断类型，再跳到相应编码逻辑'
  - ''
  - '**调试与融合也在这里完成**'
  - '- 代码里能看到 `use_capture`、`debug_graph`、fusion 计数等逻辑，说明作者把可观测性和性能融合一起考虑进去了'
  - '- 对于学习 Metal 后端的人来说，这一层最能看出“怎么把计算图落到硬件”'
  - ''
  - '**别忘了参数结构体那座桥**'
  - '- `ggml/src/ggml-metal/ggml-metal-impl.h` 里的宏和结构体，是所有 encode 函数都依赖的“工单格式”'
  - '- 没有这层统一定义，Metal kernel 就无法知道张量形状、步长、标量参数和辅助输入长什么样'
