  'no': 2
  points:
  - '**ggml_metal_context 是运行中枢**'
  - '- `ggml/src/ggml-metal/ggml-metal-context.h` 暴露的是整套 Metal 执行上下文 API'
  - '- 它不负责具体某个算子，而是负责整套计算资源：初始化、销毁、同步、异步数据搬运、graph compute、graph optimize、event record/wait、family
    支持检查'
  - ''
  - '**backend 层把公共接口落地成具体执行**'
  - '- `ggml/src/ggml-metal/ggml-metal.cpp` 把这些能力包装成 `ggml_backend` 体系可识别的后端实现'
  - '- 典型接口包括 `ggml_backend_metal_init()`、`ggml_backend_metal_free()`、`ggml_backend_metal_synchronize()`、`ggml_backend_metal_graph_compute()`'
  - '- 这相当于把“Metal 上下文能力”塞进 ggml 的统一后端抽象里，让调度器和上层代码不感知 Metal 细节'
  - ''
  - '**生命周期理解方式**'
  - '- 先建 device / context，再注册到 backend registry，再创建 backend，再提交图执行，最后释放资源'
  - '- 对读者最重要的是：Metal 不是单步 debug 式一点点跑，而是“准备缓冲区 → 编码命令 → 提交执行 → 同步结果”的一整套闭环'
