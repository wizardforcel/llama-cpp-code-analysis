  name: 后端注册与系统探测 —— 把 Metal 能力挂进 GGML 的「营业厅」
  'no': 9
  points:
  - '**注册表决定谁能进入系统视野**'
  - '- `ggml/src/ggml-metal/ggml-metal.cpp` 里的 registry 逻辑，就是 Metal 后端对 ggml 框架的“官方挂名”'
  - '- `ggml_backend_metal_reg()` 负责注册设备、暴露特性、返回可用 device 数量和能力列表'
  - ''
  - '**设备能力查询像体检报告**'
  - '- `ggml_backend_metal_device_get_props()`、`ggml_backend_metal_device_supports_op()`、`ggml_backend_metal_device_offload_op()`
    等接口，让框架知道某台设备能跑哪些算子、是否适合 offload、是否支持异步/host buffer/event'
  - '- 这一步决定了 Metal 后端在多后端框架里的“可用性画像”'
  - ''
  - '**和具体计算层衔接得很紧**'
  - '- 例如 `ggml_backend_metal_graph_compute()` 最终会把控制转给 `ggml_metal_graph_compute(ctx,
    cgraph)`'
  - '- 这说明 Metal 后端不是单独一套“私有体系”，而是遵守 ggml 后端标准、把 Metal 驱动能力接入统一调度面'
  - ''
  - '**本章的收束点**'
  - '- 走到这里，你已经能看清整条主线：公共入口 → backend 生命周期 → device/buffer 管理 → pipeline 编译 → graph
    优化 → op 编码 → registry 接入'
  - '- 这就是 Metal 后端在 llama.cpp 里的完整分工，也是 Apple Silicon GPU 直通车能跑起来的原因'
