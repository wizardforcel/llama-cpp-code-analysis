  name: 服务层设计模式 —— 无状态的「远程代理外交官」
  'no': 3
  points:
  - '**Service 层的无状态哲学**'
  - '- 所有方法均为 `static`，直接操作后端 API 或处理数据转换，便于测试和复用'
  - '- 统一的 `ApiFetchOptions` 接口支持 `authOnly` 标志，控制是否携带 Authorization 头'
  - '**ChatService：流式对话的「指挥官」**'
  - '- `sendMessage()` 构建请求体、发送请求、处理流式/非流式响应'
  - '- `handleStreamResponse()` 逐行解析 SSE 数据流，聚合内容、推理内容与工具调用增量'
  - '- `convertDbMessageToApiChatMessageData()` 将数据库消息（含附件）转换为 OpenAI API 格式'
  - '- `mergeToolCallDeltas()` 合并流式传输中的工具调用增量，确保参数完整性'
  - '**ModelsService：模型路由的「调度中心」**'
  - '- `parseModelId()` 解析模型 ID，提取组织名、参数量、量化格式（如 Q4_K_M、BF16）'
  - '- 支持 Router 模式（多模型动态加载）的 `load()`、`unload()`、`listRouter()` 方法'
  - '**PropsService 与 ParameterSyncService：配置的「同步使者」**'
  - '- `ParameterSyncService` 将服务器默认值与本地设置合并，处理浮点数精度问题（`roundFloatingPoint`）'
  - '- `SYNCABLE_PARAMETERS` 常量表定义哪些参数可在服务器和客户端之间同步'
  - '**MCPService：外部工具协议的「翻译官」**'
  - 封装 MCP SDK Client，支持 WebSocket 和 HTTP 传输
  - '- 提供 `callTool`、`listTools`、`readResource` 等原子操作，以及 `isSessionExpiredError` 会话过期检测'
