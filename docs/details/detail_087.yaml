  name: Markdown 管线与内容处理 —— 富文本的「炼金术」
  'no': 8
  points:
  - '**LaTeX 保护机制**'
  - '- `preprocessLaTeX` 通过占位符替换保护代码块与数学公式，防止 Markdown 解析器误解析'
  - '- `maskInlineLaTeX` 使用启发式规则（前后字符检测）区分货币金额与数学公式'
  - '**Rehype 插件生态**'
  - '- `enhance-code-blocks.ts` 直接操作 HAST 树，为代码块添加头部栏（语言标签、复制按钮）'
  - '- `table-html-restorer.ts` 恢复表格单元格中的 `<br>` 和 `<ul>` 等 HTML 标签'
  - '- `literal-html.ts` 将原始 HTML 节点转换为纯文本节点，保留缩进并处理块级合并'
  - '**代码高亮与检测**'
  - '- `code.ts` 集成 highlight.js，支持自动语言检测与回退转义'
  - '- `detectIncompleteCodeBlock` 识别未闭合的代码块，支持流式渲染场景'
