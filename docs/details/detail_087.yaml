learning_targets:
- 掌握基于 SvelteKit + Vite 的静态站点构建配置，理解 hash 路由与 adapter-static 在嵌入式 WebUI 中的工程价值
- 理解自定义 Vite 插件（llamaCppBuildPlugin）如何通过构建后处理实现前端产物与后端静态目录的无缝集成
- 掌握 TypeScript 全局类型提升、API 协议映射与数据库 Schema 设计的分层契约体系
- 深入理解 Svelte 5 Runes ($state/$derived/$effect) 驱动的响应式状态管理模式及其跨 Store 协作机制
- 掌握基于 Dexie 的 IndexedDB 消息树（分支/分叉）持久化设计与 CRUD 操作封装
- 理解 MCP（Model Context Protocol）服务的连接生命周期管理、工具路由与 Agentic 循环实现原理
- 熟悉 Barrel Export 模式与基于 bits-ui 的无障碍组件库封装策略
- 掌握 OpenAI 兼容 API 的流式（SSE）响应处理与前后端协议适配技巧
- 解析复杂工具函数（URI 模板引擎、LaTeX 保护、Markdown 管线、文件类型检测）的算法实现
life_analogy:
- 想象 llama-server WebUI 是一座现代化的**智能机场塔台系统**：
- '- **构建配置与 Vite 插件** = 机场的**地下行李处理系统**：自动分拣（构建）、打包（bundle）、贴标签（favicon 内嵌），将货物（静态文件）准确送达停机坪（`../public`）。'
- '- **类型契约层** = 机场的**航空法规手册**：TypeScript 定义了所有「航班计划」（API 接口）和「行李标签」（数据库 Schema），确保塔台与地勤（前后端）沟通零歧义。'
- '- **Service 层** = 塔台的**无线电通信员**：无状态、按标准协议（OpenAI/MCP）发送指令，实时翻译雷达回波（SSE 流式响应）。'
- '- **Svelte Stores** = 塔台的**态势感知屏幕**：基于 Svelte 5 Runes 的响应式系统，任何航班（消息/会话）状态变化实时高亮，无需手动刷新。'
- '- **IndexedDB 消息树** = 机场的**航班记录档案馆**：不仅保存当前航班，还保存完整的飞行路径历史（消息树分支），支持随时调取任意航段（对话分叉与回溯）。'
- '- **MCP 与 AgenticStore** = 地面**特种车辆调度中心**：通过标准协议调度外部服务（工具），支持多轮协作（Agentic 循环），并监控车辆健康状态（Health
  Check）。'
- '- **工具函数与 Markdown 管线** = 行李**安检与分拣流水线**：对货物（文本/文件）进行 X 光检查（URI 解析、LaTeX 保护、文件类型检测），最终干净地送达旅客手中。'
'no': 86
summary:
- concept: SvelteKit + adapter-static + hash 路由
  desc: 构建纯静态 SPA 并输出到 ../public，通过 hash 路由实现零配置内嵌托管，由 llama-server 直接服务
- concept: Vite 构建后处理（llamaCppBuildPlugin）
  desc: closeBundle 钩子延迟 100ms 确保文件写入，完成 favicon 内嵌、bundle 重命名与使用指南注入
- concept: 全局类型声明（app.d.ts）
  desc: 通过 declare global 将 API、Database、Settings 等类型注入全局命名空间，实现跨模块免 import 类型访问
- concept: Service 层无状态设计
  desc: ChatService、DatabaseService 等仅提供静态方法，专注协议转换与数据持久化，状态管理交由 Store 层
- concept: Svelte 5 Runes 响应式系统
  desc: 基于 $state、$derived、$effect 的细粒度响应原语，替代传统 Store 并实现跨组件自动更新
- concept: IndexedDB 消息树结构
  desc: 基于 Dexie 的 parent/children 树形存储，支持消息分支（branching）与对话分叉（forking）
- concept: MCP 协议与 Agentic 循环
  desc: MCPStore 管理外部工具连接生命周期，AgenticStore 实现多轮 LLM-Tool 调用循环与结果聚合
- concept: SSE 流式响应处理
  desc: handleStreamResponse 逐行解析 Server-Sent Events，聚合内容、推理过程与工具调用增量
- concept: TTL 缓存与响应式 Map
  desc: TTLCache 与 ReactiveTTLMap 提供带过期时间的缓存机制，自动清理非活跃会话状态
- concept: URI 模板引擎（RFC 6570）
  desc: expandTemplate 支持 {var}、{+var}、{/segments} 等操作符，实现 MCP 资源 URI 的动态展开
- concept: LaTeX 保护与代码块隔离
  desc: preprocessLaTeX 通过占位符替换与启发式规则，防止货币金额被误识别为数学公式
- concept: 多模态文件处理管线
  desc: processFilesToChatUploaded 与 convert-files-to-extra 识别图像、PDF、音频、文本，并转换为统一附件格式
