  name: Svelte 5 Runes 状态管理 —— 响应式业务的「中枢神经」
  'no': 4
  points:
  - '**ChatStore：聊天业务的「心脏」**'
  - '- 使用 `$state` 管理 `activeMessages`、`isLoading`、`currentResponse` 等核心状态'
  - '- `sendMessage()` 创建用户消息 → 创建助手占位符 → 启动 `streamChatCompletion()` 流式接收'
  - '- `editMessageWithBranching()` 与 `regenerateMessageWithBranching()` 实现消息树的分支编辑与重生成'
  - '- 集成 Agentic 流程：当检测到 MCP 工具调用时，通过 `agenticStore.runAgenticFlow()` 进入多轮工具调用循环'
  - '- `syncLoadingStateForChat()` 与 `cleanupConversationState()` 管理多会话并发状态清理'
  - '**ConversationsStore：对话历史的「图书管理员」**'
  - '- `buildConversationTree()` 将扁平会话列表构建为树形结构，支持分叉会话的层级展示'
  - '- `forkConversation()` 从某条消息分叉新对话，复制消息路径并重建父子引用'
  - '- `navigateToSibling()` 实现消息分支间的导航切换'
  - '**MCPStore 与 AgenticStore：外部工具的「编排器」**'
  - '- `MCPStore` 管理多个 MCP 服务器的连接生命周期（`ensureInitialized`、自动重连 `autoReconnect`、健康检查）'
  - '- `AgenticStore` 执行多轮 LLM-Tool 调用循环，通过 `extractBase64Attachments()` 处理工具返回的 base64
    图片'
  - '**ModelsStore 与 SettingsStore：资源与配置的「管理器」**'
  - '- `ModelsStore` 管理模型列表、加载状态轮询（`pollForModelStatus`）、模型属性缓存（TTL）'
  - '- `SettingsStore` 通过 `syncWithServerDefaults()` 对比本地设置与服务器默认值，管理用户覆盖（userOverrides）'
