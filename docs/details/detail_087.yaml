  - 1. 解释 `closeBundle()` 钩子中 `setTimeout(..., 100)` 的必要性，如果移除会导致什么问题？
  - 2. 为什么需要将 `bundle.[hash].js` 重命名为固定的 `bundle.js`？这对 llama-server 的静态文件服务有什么好处？
  - 3. 分析 favicon 转 base64 内嵌的实现逻辑，这种方案相比外链 favicon 在嵌入式部署中的优势是什么？
