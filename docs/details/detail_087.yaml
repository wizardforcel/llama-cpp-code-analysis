  name: 核心工具函数 —— 业务逻辑的「瑞士军刀」
  'no': 7
  points:
  - '**网络与请求基础设施**'
  - '- `api-fetch.ts` 封装 `fetch` 请求，支持自动添加 Authorization 头与错误解析（`parseErrorMessage`）'
  - '- `api-headers.ts` 统一生成 JSON 请求头与认证头'
  - '- `cors-proxy.ts` 构建通过 CORS 代理的 URL，解决跨域资源访问'
  - '**取消与并发控制**'
  - '- `abort.ts` 提供 `throwIfAborted`、`isAbortError`、`createLinkedController`，实现流式请求的可中断性'
  - '**消息树导航算法**'
  - '- `branching.ts` 提供 `filterByLeafNodeId`（根到叶路径回溯）、`getMessageSiblings`（兄弟节点计算）、`findDescendantMessages`（级联查找）'
  - '**URI 模板引擎**'
  - '- `uri-template.ts` 实现 RFC 6570 简化版，支持 `expandTemplate` 变量展开、`extractTemplateVariables`
    变量提取、`normalizeResourceUri` URI 规范化'
  - '**文件类型与多模态处理**'
  - '- `file-type.ts` 与 `attachment-type.ts` 提供 MIME 类型与扩展名到文件分类（IMAGE/AUDIO/PDF/TEXT）的双向映射'
  - '- `convert-files-to-extra.ts` 将上传文件转换为消息附件格式，支持 SVG/WebP 转 PNG、PDF 文本提取'
  - '**剪贴板与格式化**'
  - '- `clipboard.ts` 实现剪贴板内容的序列化/反序列化，支持 MCP Prompt 附件的解析'
  - '- `formatters.ts` 提供文件大小、性能时间、参数量等的友好格式化'
