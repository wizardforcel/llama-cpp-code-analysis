  name: UI 组件库架构 —— 可复用的「乐高积木」
  'no': 5
  points:
  - '**Barrel Export 模式：模块导出的「集散中心」**'
  - '- `index.ts` 文件作为公共 API 出口，集中导出目录下的所有组件和工具'
  - '- 例如 `components/app/chat/index.ts` 导出 20+ 个聊天相关组件（ChatForm、ChatMessage、ChatSidebar
    等）'
  - '**Bits-UI 封装策略：无障碍功能的「基础设施」**'
  - '- 基础 UI 组件（Dialog、Dropdown、Tooltip 等）基于 `bits-ui` 库封装，提供统一的样式与事件处理'
  - '- `ui/sidebar/context.svelte.ts` 通过 `setSidebar`/`useSidebar` 实现跨组件状态共享'
  - '**复杂业务组件：从原子到分子**'
  - '- `ChatMessage` 系列组件处理消息渲染、编辑、分支导航，集成 Markdown 渲染与附件展示'
  - '- `McpResourceBrowser` 构建资源树结构，支持搜索过滤与递归渲染'
  - '- `ModelsSelector` 支持搜索、收藏、状态标识，适配 Router/单模型双模式'
