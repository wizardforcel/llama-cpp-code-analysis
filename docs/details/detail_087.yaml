  points:
  - '**SvelteKit 静态站点配置：hash 路由 + 静态适配器**'
  - '- `svelte.config.js` 使用 `adapter-static` 将构建产物输出到 `../public` 目录，由 llama-server
    直接内嵌服务'
  - '- 采用 `hash` 路由（`#/chat/xxx`），避免服务器端路由配置，适合纯静态托管场景'
  - '- 通过 `mdsvex` 支持 Markdown 格式的页面和组件，增强内容创作能力'
  - '**Vite 构建后处理：llamaCppBuildPlugin 的「开箱即用」魔法**'
  - '- 自定义插件在构建完成后自动执行：将 favicon 转为 data URL、重命名 bundle 文件为固定名称'
  - '- 将 `../public/_app/immutable/bundle.[hash].js` 复制为 `../public/bundle.js`，简化后端引用路径'
  - '- 在 `index.html` 头部插入使用指南注释，便于部署者快速上手'
  - '**ESLint 与 Prettier 协同配置**'
  - '- 集成 Svelte、TypeScript、Storybook 三套规则集，通过 `includeIgnoreFile` 自动读取 `.gitignore`'
  - '- 关闭 `svelte/no-at-html-tags` 以允许在聊天消息中渲染原始 HTML（Markdown 产物）'
  - '**Storybook 配置：组件的「展示厅」**'
  - '- `.storybook/main.ts` 配置 stories 目录与 addons（a11y、docs、vitest）'
  - '- `.storybook/preview.ts` 注入 `ModeWatcherDecorator` 和 `TooltipProviderDecorator`，提供主题切换与
    Tooltip 上下文'
