    与 `test_merge_free_block` 的实现。
  - 分析：`can_reuse_memory` 在哪些场景允许内存重叠？它与 `get_view_source` 如何合作？
  - 动手尝试：修改 `test_merge_free_block` 中 `max_buffer_size` 为 40 与 SIZE_MAX，观察分配日志与 `allocated_total`
    的差异。
  - 思考问题：
  - '- 为什么 `dummy_backend_init(32)` 时初始化较小的缓冲区有助于暴露分配问题？'
  - '- `make_input_with_size(ctx, 16)` 在 dummy backend 中占据多少个 chunk？'
  - '- 如果 GGML 改为使用 buddy allocator，`test_merge_free_block` 的预期输出会有什么变化？'
