  name: 内存分配器的"沙盘推演" —— gallocr 极限测试
  'no': 3
  points:
  - '**虚拟后端的设计理念**'
  - '- dummy_backend 的作用：模拟受限内存环境（16B/32B/40B 等）'
  - '- 接口完备性：实现 ggml_backend_buffer_type_t 全部必需方法'
  - '- 分配追踪：通过 `allocated_total()` 累计已分配内存'
  - '**共享内存的场景**'
  - '- `test_max_size_too_many_tensors()`：张量数量超缓冲区容量 → 新缓冲区分配'
  - '- `test_max_size_tensor_too_large()`：剩余空间不足 → 开辟新缓冲区'
  - '- `test_tensor_larger_than_max_size()`：单张量超大 → 增大缓冲区'
  - '**高级分配策略**'
  - '- `test_fill_leftover_space()`：空隙填充与最佳适配'
  - '- `test_reuse_and_free()`：释放-复用循环验证'
  - '- `test_merge_free_block()`：相邻空闲块合并'
  - '- `test_prefer_already_allocated_memory()`：优先复用已释放区块'
  - '**复杂场景：多缓冲区协作**'
  - '- `test_multiple_buffer_types()`：模拟 CPU+GPU 双设备的内存分配'
  - '- `test_buffer_size_zero()`：零大小缓冲区的边界处理'
  - '- `test_reallocation()`：同一张图的多次分配复用'
  - '**in-place 操作的允许条件**'
  - '- `can_reuse_memory()`：判断节点之后是否仍被引用'
  - '- `get_view_source()`：追溯视图张量的本源'
  - '- `check_no_overlap()`：全局内存冲突检查'
  - '**测试入口的调试技巧**'
  - '- `make_context()`：ggml_context 初始化（48 * tensor_overhead + graph_overhead）'
  - '- `assign_names()`：统一命名便于调试（x0, x1, x2...）'
  - '- `get_leaf_id()` / `get_node_id()`：按名称定位张量位置'
