learning_targets:
- 理解 llama.cpp "零依赖、单文件可运行" 的设计哲学与项目整体目标
- 掌握 llama.cpp 覆盖的硬件后端谱系，并能区分"核心后端"与"工具脚本"在生态中的分工
- 鸟瞰 tests/ 目录的测试分层：从内存分配、算子一致性到并发稳定性，理解一级防御体系
- 掌握 PEG 解析器测试套件的注册机制与六大测试模块的分工逻辑
- 认识 build/ 自动生成的元数据文件（license、CompilerId、build-info）在构建调试中的角色
- 熟悉 Python 辅助脚本家族（compare/verify/sync/bench）的用途，理解它们如何驱动 CI 与性能回归
- 能够通过 tests/test-gguf.cpp 的 handcrafted 文件测试，理解 GGUF 格式解析的可靠性验证方法
- 深入掌握 test-backend-ops 中全部测试基类、辅助函数、熔断器机制和 60+ 具体算子测试类的完整结构
- 理解量化、状态恢复、架构验证等各类测试函数在保障正确性中的作用
- 初步建立"代码变更 → 对应测试 → 定位问题"的推理链条，为后续深入源码阅读做准备
life_analogy:
- llama.cpp 的测试体系就像一个**现代化质检工厂的质量管理中心**：
- '- **C++ 测试程序** = 车间质检员（Dimsender 精确计量尺寸）'
- '- **Python 测试脚本** = 自动机械臂（Compare 对比标准件、确保偏差在允差内）'
- '- **build/ 自动文件** = 产品钢印与批号（可追溯生产环境与编译参数）'
- '- **GGUF 手工测试** = 包装完整性的 X 光透视（检测隐性折角和漏填充）'
- '- **算子测试矩阵** = 破坏性试验台（测试各种极端温度/压力下的材料性能）'
- '- **PEG 解析器测试** = 口语指令模拟器（确保各地方言都能被正确识别）'
- '- **server-bench.py** = 性能跑轮（测试固定载荷下的持续运转速度）'
- '- **tool_bench.py** = 自动化动作捕手（绘制每次任务的成功率-温度热力图）'
'no': 99
summary:
- concept: 测试框架主入口
  desc: test-*.cpp 的 main() 函数为每个测试域提供独立可执行入口
- concept: 内存分配器验证
  desc: test-alloc.cpp 通过虚拟后端验证 gallocr 的边界条件、复用与合并策略
- concept: 算子正确性测试
  desc: test-backend-ops.cpp 提供 60+ 测试类覆盖 unary/norm/conv/mul_mat/flash_attn 等算子的正确性与性能评估
- concept: GGUF 格式校验
  desc: test-gguf.cpp 手工构造受损文件与随机上下文，验证解析器鲁棒性
- concept: 采样器测试
  desc: test-backend-sampler.cpp 验证贪心/温度/Top-K/Top-P/Min-P/偏置等 14 种采样策略
- concept: 并发与状态恢复
  desc: test-thread-safety.cpp 与 test-state-restore-fragmented.cpp 模拟多线程与碎片化内存场景
- concept: 量化精度验证
  desc: test-quantize-fns.cpp 与 test-quantize-stats.cpp 通过 roundtrip 计算 RMSE、max-error、分位数
- concept: PEG 解析测试
  desc: test-peg-parser.cpp 整合六大单元测试验证结构化 JSON/GBNF/Python Dict 解析
- concept: Python 性能对比
  desc: compare-llama-bench.py 支持 Git 版本对比、图表生成、SQL 存储的综合基准分析
- concept: Server 功能测试
  desc: server-test-function-call.py 提供工具调用多轮交互、耗费统计与超时管理
- concept: 模板渲染工具
  desc: jinja-tester.py 基于 PySide6 实现互式模板开发与调试
- concept: 构建元数据
  desc: build/license.cpp 与 build-info.cpp 提供运行时合规性与环境追踪能力
- concept: 文档自动生成
  desc: create_ops_docs.py 从 CSV 自动生成 ops.md 支持矩阵
- concept: Unicode 支持
  desc: gen-unicode-data.py 从官方数据源生成分词所需的大小写映射与类别信息
