  points:
  - '**llama.cpp 的核心定位与发展历程**'
  - '- 从 2023 年初的个人项目演变为覆盖工业界的 C/C++ 推理引擎标准'
  - '- "零依赖"哲学：不依赖 Python/PyTorch，一行编译即可运行'
  - '- 跨平台覆盖：从 Apple Watch 到企业级 GPU 集群'
  - '**后端生态系统图谱**'
  - '- CPU 家族：x86 (AVX512/AMX)、ARM (NEON/SVE/SME)、RISC-V、WASM'
  - '- GPU 三巨头：CUDA (NVIDIA)、Metal (Apple)、Vulkan (通用)'
  - '- 新兴力量：SYCL (Intel)、HIP (AMD)、MUSA (摩尔线程)、CANN (华为)'
  - '- 远程与专用：RPC、OpenVINO、ZenDNN、zDNN、WebGPU'
  - '**核心工具链分工**'
  - '- llama-cli：交互式终端对话'
  - '- llama-server：OpenAI 兼容 HTTP 服务'
  - '- llama-bench：性能基准与回归测试'
  - '- llama-quantize：模型压缩与量化'
  - '- llama-imatrix：重要性矩阵生成'
  - '**GGUF 格式的战略意义**'
  - '- 统一模型容器：元数据 + 词表 + 权重一体化'
  - '- 与 HuggingFace、PyTorch、ONNX 等生态的桥梁作用'
