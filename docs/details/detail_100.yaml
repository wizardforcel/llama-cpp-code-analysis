  name: 算子测试的"军械库" —— test-backend-ops 框架全解析
  'no': 4
  points:
  - '**测试框架的三大支柱**'
  - '- test_result：结果封装（时间、FLOPS、带宽、内存）'
  - '- test_operation_info：操作详情（错误、梯度、MAA 误差）'
  - '- printer 抽象基类：支持 Console/SQL/CSV 三种输出格式'
  - '**数据生成工具集**'
  - '- `init_tensor_uniform()`：均匀分布随机初始化（支持赋值并行）'
  - '- `init_tensor_kq_mask()`：生成 KQ 掩码（块状 -INF/0）'
  - '- `init_tensor_tril()`：下三角矩阵生成'
  - '- `init_set_rows_row_ids()`：set_rows 索引初始化'
  - '- `init_mul_mat_id_tensors()`：MoE ID 张量初始化'
  - '**误差计算指标**'
  - '- `nmse()`：归一化均方误差（核心指标）'
  - '- `jdst()`：Jaccard 距离（用于集合型算子如 Top-K）'
  - '- `mean_abs_asymm()`：平均绝对不对称性'
  - '**参数格式化系列**'
  - '- `var_to_str()` 重载：支持 std::string、数值、数组、ggml_type、ggml_prec、op_pool、scale_mode、input_tensor、op_params
    等'
  - '- 递归处理 std::array 和 C 风格数组'
  - '**辅助判断工具**'
  - '- `is_non_contiguous()`：检查张量是否为非连续布局'
  - '- `ggml_is_view_op()`：判断是否为视图操作'
  - '- `backend_has_feature()`：查询后端特性'
  - '- `_isinf()`/`isinf_or_max()`：无穷大检测（兼容 SYCL）'
  - '**测试用例基类 test_case**'
  - '- 五大评估模式：`eval()`（正确性）、`eval_perf()`（性能）、`eval_support()`（支持性）、`eval_grad()`（梯度）、`expr_evaluation()`（表达式评估）'
  - '- 哨兵机制：自动添加哨兵张量检测内存溢出'
  - '- 名称匹配：`matches_filter()` 支持 op_name(op_params) 精确匹配'
  - '- 熔断与梯度：`fusion_test_nodes()`、`run_whole_graph()` 控制执行粒度'
  - '**算子测试分类（60+ 类）**'
  - '- 基础一元/激活：unary、glu、split_glu、swiglu_oai、silu_back、xielu、leaky_relu、floor/ceil/round/trunc、fill'
  - '- 归一化：norm、rms_norm、group_norm、l2_norm、norm_mul_add、rms_norm_mul_add、rms_norm_mul_rope、add_rms_norm'
  - '- 索引操作：get_rows、get_rows_back、set_rows、argsort、top_k、topk_moe'
  - '- 数学函数：log、sin、cos、sqr、sqrt、softcap'
  - '- 张量操作：concat、sum、sum_rows、mean、repeat、repeat_back、pad、pad_ext、pad_reflect_1d、roll、arange、upscale、interpolate、diag、tri、diag_mask_inf、acc、set、dup、cpy、cont、transpose'
  - '- 卷积家族：conv_2d、conv_3d、conv_2d_dw、conv_transpose_1d、conv_transpose_2d、im2col、im2col_3d、pool1d、pool2d'
  - '- 矩阵乘：mul_mat、mul_mat_id、mul_mat_id_fusion、out_prod、mul_mat_vec_fusion、add_id'
  - '- 注意力：rope、rope_set_rows、flash_attn_ext'
  - '- 状态空间：ssm_conv、ssm_scan、rwkv_wkv6、rwkv_wkv7、gated_delta_net、gla'
  - '- 优化器：opt_step_adamw、opt_step_sgd'
  - '- LLM 集成：test_llm、test_llama、test_falcon'
  - '- 高级融合：bin_bcast、emb_norm、mul_mat_vec_fusion'
  - '**测试生成器'
  - '- `make_test_cases_eval()`：组合参数生成完整评估套件（约300个用例）'
  - '- `make_test_cases_perf()`：高质量性能测试配置'
  - '- `make_test_cases_from_file()`：从 export-graph-ops 序列化文件加载'
  - '**命令行控制**'
  - '- `list_all_ops()`：枚举所有 GGML 算子'
  - '- `show_test_coverage()`：显示测试覆盖率百分比'
  - '- `usage()`：输出模式、过滤器、输出格式说明'
