exercises:
- contents:
  - 阅读 `tests/test-arg-parser.cpp` 第 1-160 行与 `common/arg.cpp` 中的参数解析实现。
  - 回答问题：
  - 1. 为什么测试要求短参数必须排在长参数之前？这防止了哪类解析歧义？
  - 2. 在 CSV 解析测试中，`"file3""3"".gguf"` 为什么能被正确解析为包含双引号的文件名？
  - 3. 如果要添加一个新的布尔类型参数 `--feature-x`，需要注意哪些与 `LLAMA_ARG_NO_*` 环境变量的兼容性问题？
  'no': 1
  title: 命令行解析器的边界探索
- contents:
  - 深入分析 `tests/test-llama-grammar.cpp` 中手工构造的 13 条规则（rule 0-12）。
  - 动手任务：
  - 1. 在纸上画出 `root`（rule 0）→ `root_1`（rule 1）→ `expr`（rule 2）的完整推导树，标注每个 `LLAMA_GRETYPE_*`
    元素在栈中的行为。
  - 2. 解释为什么栈中同时存在 `CHAR 61`（'='）和 `RULE_REF 7`（表达式后续）时，候选拒绝列表会排除 37-47 号 code point。
  - 3. 如果要把语法改为支持 `==` 双字符比较符，需要修改哪些 rule 和哪些预期拒绝表？
  'no': 2
  title: 语法栈的状态机推演
- contents:
  - 阅读 `tests/test-opt.cpp` 的 `test_gradient_accumulation()` 函数（616-712 行）。
  - 设计实验：
  - 1. 假设 `ndata=6`，`nbatch_physical=2`，`loss_type=SUM`，手动计算第 2 个 epoch 结束后 `weights`
    的理论值，并与代码中的断言比对。
  - 2. 修改代码让 `nbatch_physical=3`，重新编译运行测试，观察哪些断言会失败，并解释为什么梯度累积的数学期望会发生变化。
  - 3. 在 `helper_get_test_opt_pars` 中将 `beta1` 改为 0.9，预测 `test_forward_backward` 中
    `weights_after_forward_backward` 的期望值会如何变化？
  'no': 3
  title: 优化器梯度累积的数学验证
- contents:
  - 研究 `tests/test-rope.cpp` 第 108-226 行的测试逻辑。
  - 思考问题：
  - 1. 为什么 `r0 -> r1`（先编码到 100 再转回 -67）在数学上严格等于 `r2`（直接编码到 33）？用旋转矩阵的乘法性质解释。
  - 2. 如果 `n_past_0=100` 且 `n_past_2=200`（即未来位置在前），测试是否仍然会通过？为什么？
  - 3. MROPE 的 `sections={16, 24, 24, 0}` 意味着什么？如果将其改为 `{32, 32, 0, 0}` 会对位置编码的维度产生什么影响？
  'no': 4
  title: RoPE 的 Context Swap 数学证明
