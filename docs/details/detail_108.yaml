  'no': 2
  points:
  - '**为什么这个测试要“手工搭文法”？**'
  - '- `test-llama-grammar.cpp` 不是从文本规则自动解析，而是直接构造 `parsed_grammar.symbol_ids` 和 `rules`'
  - '- 这相当于先人工铸好一台语法机器的零件，再验证装配后的机器是否严格按图纸运转'
  - '**`llama_grammar_init_impl()` 是点火开关**'
  - '- 它把手工构造的 grammar rules 和 symbol 表变成真正可运行的 `llama_grammar` 对象'
  - '- 测试重点不是“能不能编译”，而是编译后能否稳定暴露正确的内部状态'
  - '**语法栈为什么是核心观察窗口？**'
  - '- `llama_grammar_get_stacks()` 暴露当前推导栈，测试逐一比对栈中元素的 `type` 和 `value`'
  - '- 这相当于检查编译器在某一时刻脑子里到底记住了哪些“待匹配符号”'
  - '**候选 token 拒绝机制像门卫**'
  - '- `llama_grammar_reject_candidates_for_stack()` 会对一堆 code point 候选进行筛选'
  - '- 测试用 23 个连续 code point 候选去验证哪些该被拦下，精确对应某条栈状态下的合法输入空间'
  - '**为什么值要这么“碎”？**'
  - '- 预期栈、预期拒绝表都被硬编码得非常细，说明语法系统的正确性依赖高度确定性的状态推进'
  - '- 这类测试是在守护 grammar 模块最底层、最容易被后续优化悄悄改坏的部分'
  - '**资源释放同样是语义一部分**'
  - '- 手动 `delete[] candidate.code_points` 和 `llama_grammar_free_impl()` 明示了 grammar/candidate
    生命周期管理边界'
  - '- 这对 C ABI 风格 API 尤其重要，测试也在守护内存所有权约定'
