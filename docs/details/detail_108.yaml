learning_targets:
- 掌握 `common_params_parse` 的防御性测试策略：重复参数检测、类型校验、环境变量覆盖与优先级规则
- 理解 `llama_grammar` 的手工构造测试方法：符号表建立、语法栈状态追踪与候选 token 的精确拒绝机制
- 学会使用 `mtmd` C API 处理多模态输入：统一 chunk 抽象、文本与图像块的差异化访问及资源生命周期管理
- 深入 `ggml-opt` 优化器测试体系：数据集分片、梯度累积、前向/反向传播验证、高级 API（epoch）与低级 API（fit）的一致性对拍
- 掌握推理控制组件的测试方法：reasoning budget 状态机的强制触发验证与 UTF-8 流式边界安全性检查
- 理解 RoPE 的数值正确性验证：多模式（Standard/NeoX/MROPE/Vision/IMROPE）、路径无关性（context swap）与相对误差容忍度控制
life_analogy:
- 想象 llama.cpp 的测试体系是一座**大型国际机场的安检与调度中心**：
- '- **test-arg-parser** = **行李分拣系统的入口安检**：'
- '  - 重复参数检测 = 防止两个行李牌贴同一个箱子（冲突检测）'
- '  - 环境变量 vs 命令行 = VIP 通道与普通通道的优先级仲裁'
- '  - 远程下载测试 = 行李 X 光机的尺寸/重量超标拦截'
- '- **test-llama-grammar** = **海关边检的护照核验**：'
- '  - 手工语法规则 = 预先录入的签证类型数据库'
- '  - 语法栈 = 边检官员脑中记住的当前查验流程（先看护照→再看签证→最后盖章）'
- '  - 候选拒绝 = 精确识别哪些旅客证件类型不被允许入境'
- '- **test-mtmd-c-api** = **货运站的集装箱分拣**：'
- '  - 统一 chunk = 标准尺寸的集装箱（文本/图像混装）'
- '  - 类型检查 = 开箱查验是普货（文本 token）还是危险品（图像元数据）'
- '- **test-opt** = **飞行学员的模拟训练舱**：'
- '  - helper_ctx_data = 每次训练前重置的座舱环境（数据集、仪表盘、油门）'
- '  - Gradient Accumulation = 多个教官指令的叠加效果验证'
- '  - Epoch vs Fit = 自动驾驶仪与手动驾驶的操作结果一致性校验'
- '  - Regression = 最终考核：能否让飞机沿预定航线（a*x+b）平稳飞行'
- '- **test-reasoning-budget** = **飞机燃油管理系统**：'
- '  - 预算耗尽 = 燃油报警触发时强制返航（forcing token）'
- '  - UTF-8 边界 = 确保无线电通讯在跨时区（多字节字符）时不会断在半个字'
- '- **test-rope** = **惯性导航系统的陀螺仪校准**：'
- '  - Context Swap = 飞机掉头后，航迹推算应与从新起点直接计算完全一致'
- '  - 多模式（MROPE/VISION）= 经度/纬度/高度/时间的多维坐标系同时校准'
'no': 107
summary:
- concept: '`common_params_parse`'
  desc: 命令行参数解析的防御性测试，覆盖无效输入、环境变量覆盖与 CSV 多值解析
- concept: '`LLAMA_ARG_*` 环境变量'
  desc: 第二命令行通道，测试 CLI 优先级高于环境变量，支持否定语义（如 LLAMA_ARG_NO_PERF）
- concept: '`llama_grammar_init_impl`'
  desc: 从手工构造的 symbol_ids 和 rules 实例化可运行的语法状态机
- concept: '`llama_grammar_get_stacks`'
  desc: 暴露语法推导栈的当前状态，用于验证解析器在特定位置的内部状态正确性
- concept: '`llama_grammar_reject_candidates_for_stack`'
  desc: 基于当前栈状态精确过滤候选 token，实现语法约束的逐字符拒绝机制
- concept: '`mtmd_input_chunk`'
  desc: 多模态输入的统一抽象，支持文本 token 序列与图像空间元数据（nx/ny/id）的差异化访问
- concept: '`helper_ctx_data`'
  desc: 优化器测试的上下文容器，封装数据集、张量、后端 buffer 与结果对象的全生命周期
- concept: '`ggml_opt_epoch` vs `ggml_opt_fit`'
  desc: 高层训练循环 API 与低层拟合 API 的语义一致性对拍验证
- concept: '`test_gradient_accumulation`'
  desc: 验证不同 physical batch size 与 loss 类型（SUM/MEAN）下的梯度累积数学正确性
- concept: '`test_regression`'
  desc: 端到端验证：带噪声线性回归数据拟合，测试优化器能否收敛到真实参数 a 和 b
- concept: '`common_reasoning_budget`'
  desc: 推理预算采样器的状态机，通过强制将 logits 设为 -inf 实现思考链条的硬性截断
- concept: '`common_utf8_is_complete`'
  desc: UTF-8 流式安全边界检测，确保多字节字符不会在 chunk 边界处被截断
- concept: '`ggml_rope` 路径无关性'
  desc: Context Swap 性质：rope(x, p0)→rope(r0, p1) ≡ rope(x, p2)，验证位置编码的线性对称性
- concept: '`ggml_rope_multi`'
  desc: 多维 RoPE 支持（MROPE/VISION/IMROPE），处理 4D 位置张量与 sections 分区
- concept: 相对误差校验（rel err）
  desc: RoPE 测试接受 1e-4 级别的浮点误差，通过 sum0/sum1/diff 统计量验证数值一致性
units:
- codes:
  - file: tests/test-arg-parser.cpp
    line: 1-160
    method_or_func: __main__
  name: 测试命令行竞技场 —— 从重复参数侦察到远程下载拦截
  'no': 1
  points:
  - '**为什么要先手撕重复参数？**'
  - '- `test-arg-parser.cpp` 一开始不急着跑推理，而是先对所有 `LLAMA_EXAMPLE_*` 场景做参数注册检查'
  - '- 通过 `seen_args` / `seen_env_vars` 两个 `unordered_set`，把同一个命令行参数或环境变量被重复绑定的问题提前抓出来'
  - '- 本质上是在给整个 CLI 生态做“重名路口排查”，避免不同 handler 抢同一个入口'
  - '**为什么参数还有顺序要求？**'
  - '- 代码额外检查短参数必须排在长参数之前，连 `args_neg` 这种否定参数也要遵守同样规则'
  - '- 这像是车站安检口的排队规则：先短后长，既便于解析器扫描，也减少歧义'
  - '**`common_params_parse()` 的“边界感”从哪来？**'
  - '- 测试覆盖了缺值、类型错误、非法枚举、跨示例不可用参数、否定参数等多类坏输入'
  - '- 说明 `common_params_parse()` 不只是“能解析”，还必须“会拒绝”非法输入'
  - '**CSV 参数解析是隐藏考点**'
  - '- `--lora` 的多值输入不是简单逗号切分，而是能识别引号包裹、转义引号、逗号嵌套'
  - '- 这体现了解析器对“参数是一个结构化字符串而非裸字符串”的理解'
  - '**环境变量是第二命令行**'
  - '- 测试显式验证 `LLAMA_ARG_MODEL`、`LLAMA_ARG_THREADS` 等环境变量可生效'
  - '- 还验证了“命令行覆盖环境变量”的优先级，以及否定环境变量如 `LLAMA_ARG_NO_PERF` 的兼容路径'
  - '**远程下载函数也不是边角料**'
  - '- `common_remote_get_content()` 被直接拿来测 200、404、超大响应限制'
  - '- 说明 llama.cpp 的参数系统天然和远程模型获取能力绑在一起，不只是命令行糖衣'
