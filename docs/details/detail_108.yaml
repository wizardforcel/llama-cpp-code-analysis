  name: 旋转坐标试验塔 —— 五种 RoPE 模式的旋转变换勘误
  'no': 6
  points:
  - '**RoPE 测试为什么强调“路径无关”？**'
  - '- `main()` 构造了 `r0 -> r1` 与直接 `r2` 两条路径，结果理当一致'
  - '- 这验证的是旋转位置编码的线性对称性：先转再反向“忘记过去”，应等于从最近位置直接编码'
  - '**标准 RoPE 与 NeoX 是最基础的两种姿态**'
  - '- 前两个 mode 分别对应 `GGML_ROPE_TYPE_NORMAL` 与 `GGML_ROPE_TYPE_NEOX`'
  - '- 测试用同一输入、不同模式检查“context swap”后能否对齐参考结果'
  - '**MROPE / VISION / IMROPE 属于多维位置家族**'
  - '- 后三个 mode 走 `ggml_rope_multi()`，位置张量不再是单一标量序列，而是 4 维扩展'
  - '- 这反映了多模态、视觉或新型插值模式下位置编码不再只是一条时间轴'
  - '**测试手工堆出了一个小型数值实验室**'
  - '- `frand()`、`irand()`、`get_random_dims()`、`get_random_tensor_f32()` 生成随机输入'
  - '`ggml_graph_compute_helper()` 负责为计算图分配临时工作区并执行'
  - '**误差比对方式很工程化**'
  - '- 不是逐点严格相等，而是统计 `sum0/sum1/diff` 的相对误差'
  - '- 这说明 RoPE 测试接受浮点微小偏差，但必须控制在 `1e-4` 级别以内'
  - '**这个文件守护的是推理正确性的“角度”**'
  - '- 很多模型一旦 RoPE 错了，输出表面还能生成文本，但语义会迅速漂移'
  - '- 所以这里专测数值一致性，防止位置编码细节在后端演进中被悄悄带偏'
