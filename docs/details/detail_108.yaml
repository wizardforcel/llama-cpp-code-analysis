  - '- 它把文本与图像混排输入拆成统一 chunk 序列，供后续遍历'
  - '- 测试关心的是：这个装配线既能产出块，而且每块必须可被再次取回'
  - '**文本块与图像块共享同一条流水带**'
  - '- 对每个 chunk 调 `mtmd_input_chunk_get_type()`，再按类型走不同访问器'
  - '- 这体现出 mtmd 的抽象重点：统一容器，异构内容'
  - '**文本 chunk 的重点是 token 序列**'
  - '- `mtmd_input_chunk_get_tokens_text()` 返回 token 数组和长度'
  - '- 测试逐 token 校验非负，确保文本侧已经彻底切到模型可消费的 token 世界'
  - '**图像 chunk 的重点是空间元信息**'
  - '- 图像侧不仅要看 token 数，还要看 `nx/ny/id`'
  - '- 这说明图像 token 不是“一维标签串”，而是带有分辨率、身份标识的空间结构'
  - '**释放资源不是形式动作**'
  - '- `mtmd_input_chunks_free()` 验证 C API 的所有权边界'
  - '- 对多模态输入这种“大块内存 + 多次传递”的结构来说，释放路径必须和创建路径一样可靠'
