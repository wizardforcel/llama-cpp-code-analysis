  name: 优化器试炼场 —— 从数据分片到回归收敛的全链路压测
  'no': 4
  points:
  - '**`helper_ctx_data` 像一间实验准备室**'
  - '- 它把 dataset、静态图上下文、计算图上下文、优化器参数、结果对象、后端 buffer 全部装在一个结构里'
  - '- 好处是每个测试子函数都像进了一间设备齐全的实验室，不必临时东拼西凑'
  - '**`helper_get_ctx_data()` 承担了绝大多数“布景工作”**'
  - '- 构造监督数据集、无监督数据集、输入/权重/输出张量、后端 buffer、优化器上下文'
  - '- 这意味着测试真正关心的是优化器行为，而不是被初始化样板代码淹没'
  - '**为什么要自定义 `helper_get_test_opt_pars()`？**'
  - '- 测试把 AdamW 的 `beta1/beta2/eps/wd` 清零、把学习率设为 1，是为了让数学结果可预测'
  - '- 这相当于把优化器调回“教学模型”，方便断言每一步更新是否符合手算结果'
  - '**`test_dataset()` 验证的是“取批”与“洗牌”的可信度**'
  - '- 它分别测试不同 shard、不同 batch、有无 shuffle 三种组合'
  - '- 核心不是性能，而是：数据标签对应关系不能乱、每个样本该出现一次就只能出现一次'
  - '**`test_grad()` 盯住的是梯度累计轨迹**'
  - '- 每次喂一个样本，取回 `weights` 的累加梯度写入 `grad_history`'
  - '- 该测试把梯度累积看成一条时间序列，验证它是否按预期逐个累加'
  - '**`test_forward_backward()` 是主干剧情**'
  - '- 它比较前向结果、前向+反向结果、权重变化、loss/uncertainty 的统计值'
  - '- 还在高层 `ggml_opt_epoch()` 与低层手工循环之间对拍，确保两条 API 路径语义一致'
  - '**`test_epoch_vs_fit()` 像两把刻度尺互校**'
  - '- 一个走高层 epoch 接口，一个走低层 `ggml_opt_fit()`'
  - '- 最终只比一个数：权重是否完全一致，直接验证“便捷封装没有偷偷换逻辑”'
  - '**`test_idata_split()` 检查训练/验证分流**'
  - '- 前 2/3 用于反传训练，后 1/3 只前向评估'
  - '- 这模拟了真实训练中 train/valid 切分后结果对象、loss 统计、参数更新必须分明'
  - '**`test_gradient_accumulation()` 是优化器微观行为审判庭**'
  - '- 分别测 `SUM` / `MEAN` 两种 loss 和不同 `physical batch size`'
  - '- 官司焦点是：梯度到底是按样本求和还是按批归一，权重更新是否严格匹配理论值'
  - '**`test_regression()` 把测试拉回真正学习任务**'
  - '- 用带噪声的线性回归数据去拟合 `a*x + b`'
  - '- 这是从“算子正确”跨到“能学出模型参数”的关键一跳'
  - '**`main()` 的后端遍历策略很有工程味**'
  - '- 先 `ggml_backend_load_all()` 拉齐所有设备，再按 optimizer×device 组合全部过一遍'
  - '- 若某后端不支持对应优化 op，就明确 `SKIPPED`，区分“未支持”与“做错了”'
