  name: 推理节制阀与字符闸门 —— 预算强制落幕与 UTF-8 完整性哨兵
  'no': 5
  points:
  - '**`test_reasoning_budget()` 测的是“什么时候该闭嘴”**'
  - '- 它构造 start/end/forced token 和预算值，观察推理预算采样器何时开始强制输出'
  - '- 本质上是在验证一套“思考额度用完后，必须收尾”的行为约束'
  - '**为什么用 mock vocab？**'
  - '- 测试没有加载真实模型，而是手工构造一段 token 词表和 logits'
  - '- 这样可以把 sampler 状态机和真实模型行为彻底解耦，专盯控制逻辑'
  - '**有限 logit 数就是强制开关的灯**'
  - '- 当 forcing 生效时，除了一个 token 外其它 logit 都应变成 `-inf`'
  - '- 测试正是通过 `finite_count == 1` 来识别强制阶段开始的'
  - '**5 个场景拼出完整状态机**'
  - '- 自然结束、预算耗尽、立即激活、未配置 start/end、计数后强制，这 5 组覆盖了 reasoning budget 的主要分支'
  - '- 说明这个 sampler 不是简单截断，而是有明确的“何时开始逼停”的状态跃迁规则'
  - '**`test_utf8_boundary_detection()` 是流式文本的安全闸**'
  - '- 它验证 `common_utf8_is_complete()` 对完整字符、半截多字节、混合文本的判断'
  - '- 这对流式输出尤其关键，因为一个 UTF-8 字符可能被拆在两次回调之间'
  - '**ASCII + 多字节混排是重点边界**'
  - '- 比如 `hello\xC3` 应判定为不完整，而 `hello\xC3\xA9` 判定完整'
  - '- 这个测试守护的是“模型输出流最后几个字节能否安全渲染”的底线'
