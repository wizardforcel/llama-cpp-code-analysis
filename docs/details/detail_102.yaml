  name: 张量初始化与误差度量工具箱 —— 质检员的度量衡
  'no': 5
  points:
  - init_tensor_uniform(tensor, min, max) 是默认初始化器，内部并发生成均匀分布随机数，再按 tensor->type 写回（FP32/FP16/I32/量化类型等）
  - 针对 KQ mask 的 init_tensor_kq_mask 专门生成 F16 块级 -INF / 0 掩码，确保注意力掩码测试有真实稀疏结构
  - init_tensor_tril 为下三角生成非零对角线，用于 solve_tri 等三角矩阵算子的数值稳定性测试
  - init_set_rows_row_ids 为 set_rows / get_rows 类算子生成每行互不重复的随机行索引子集，并兼容 I32/I64 两种索引类型
  - init_mul_mat_id_tensors 把 ids 张量填充为模 n_mats 后打乱的随机专家 ID，兼顾随机性与覆盖完整性
  - 误差度量函数：nmse（归一化均方误差，mse(a,b)/mse(a,0)）、jdst（Jaccard distance，多重集合差异）、mean_abs_asymmetric（可按期望值过滤）
  - var_to_str 模板与重载系列把字符串、原生数组、std::array、ggml_type、ggml_prec、ggml_op_pool、ggml_scale_mode、input_tensor
    向量、op_params 数组全部统一转成格式化字符串
  - backend_has_feature 通过 ggml_backend_reg_get_proc_address 动态查询 ggml_backend_get_features
    接口，识别后端特定能力（如 Blackwell 原生 FP4）
  - is_non_contiguous 通过对比实际 stride 与理论连续 stride，判定张量是否是视图；isinf_or_max 判断 Inf 或 FLT_MAX
    形式的无穷标记
