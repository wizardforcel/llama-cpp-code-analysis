  name: 四大评估流程引擎 —— 正确性、性能、支持度、梯度的裁判
  'no': 4
  points:
  - eval() 正确性比对：初始化 ggml_context，调用 build_graph，先检查 backend1/2 是否支持图中所有 op，再分配张量、调用
    initialize_tensors，最后通过 ggml_backend_compare_graph_backend 在两个后端间逐节点比对
  - eval() 内部回调同时校验哨兵张量完整性、NaN/Inf 检测与数值误差，任何异常都会汇总到 test_result 的 passed 与 error_message
  - eval_perf() 性能模式：先做一次 warmup，再按算子特征估算 n_runs（计算或访存驱动的重复次数），循环执行直到总耗时超过 1 秒，输出平均
    us、FLOPs、GB/s
  - eval_support() 只做支持探测：构建图后调用 ggml_backend_supports_op，把结果与 device_desc、backend_reg_name
    一并写入 test_result
  - eval_grad() 梯度校验：构建 forward 与 backward 两份图，使用有限差分（grad_eps 步长，grad_precise 决定
    2 点或 4 点）逐个参数验证解析梯度
  - matches_filter() 支持两种过滤器语法：纯算子名精确匹配，或 name(params) 完整形式（含括号参数）精确匹配，逗号分隔多条过滤规则
