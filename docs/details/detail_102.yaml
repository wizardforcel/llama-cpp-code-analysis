learning_targets:
- 掌握GGML后端算子测试框架的核心架构与设计理念
- 理解test_result和printer体系如何实现测试结果的封装与多格式输出
- 学会test_case基类的四大评估模式（eval、eval_perf、eval_support、eval_grad）的工作原理
- 熟悉张量初始化工具（init_tensor_uniform、init_tensor_kq_mask等）针对特定算子的差异化填充策略
- 掌握归一化、矩阵乘法、注意力、SSM、卷积、排序等各类算子测试的构图思路与误差控制方法
- 理解通用算子回放（test_generic_op）与导出工具（export-graph-ops）的协同机制
- 掌握构造函数、op_size、max_err、输出格式转换等基础设施方法的覆盖范围
- 能够扩展新的GGML算子测试用例并配置合适的误差阈值与梯度策略
life_analogy:
- 想象GGML后端算子测试体系是**一所严谨的质检学院**：
- '- **test_case** = **考题模板**：每个算子是一张试卷，包含 build_graph（出题）、initialize_tensors（备料）、eval（阅卷）'
- '- **test_result** = **考试成绩单**：记录每次考试的时间、成绩、是否通过、错题原因'
- '- **printer家族** = **多语种新闻发言人**：同一份成绩单可翻译成口语（console）、档案文本（CSV）、数据库SQL（SQL）'
- '- **四大评估模式** = **四位考官**：'
- '    - eval = **阅卷老师**：比对标准答案，看对错'
- '    - eval_perf = **计时员**：看做题速度，算FLOPs/带宽'
- '    - eval_support = **资格审查员**：先确认考生有没有资格进考场'
- '    - eval_grad = **反向推导员**：用微积分验证解析梯度是否与数值微分一致'
- '- **哨兵张量** = **考场监控**：在试卷前后放哨，检测是否有越界作弊（内存越界）'
- '- **init_tensor_*家族** = **食材科**：不同科目（算子）发不同原料，如三角矩阵给 solve_tri，掩码给 flash_attn'
- '- **构造函数与vars()** = **准考证信息**：每个算子类都通过自己的构造函数记录考生（参数配置），vars() 生成唯一可读的准考证号'
- '- **make_test_cases_*工厂** = **教务出卷组**：系统批量生成考卷（地毯式覆盖）'
- '- **export-graph-ops** = **实况摄像师**：把真实模型的计算图录下来，变成离线可回放的考卷'
- '- **main()** = **院长**：统筹调度，汇总各考场结果，宣布整体通过情况'
- 就像质检学院既能出标准考卷也能回放真实场景，test-backend-ops 既能地毯式覆盖算子矩阵，也能通过 --test-file 精确复现线上出现的问题。
'no': 101
summary:
- concept: '`test_result`'
  desc: 单次算子测试的完整档案，包含性能、状态、错误信息
- concept: '`test_operation_info`'
  desc: 细粒度诊断信息，记录梯度异常、MAA误差、比较失败等
- concept: '`printer`基类'
  desc: 统一的输出接口，支持console/SQL/CSV三种格式
- concept: '`console_printer`'
  desc: 面向人类的彩色输出，性能模式自动切换FLOPs/带宽显示
- concept: '`test_result::get_values`'
  desc: 将所有字段批量转为字符串向量，供各打印器统一消费
- concept: '`test_case`'
  desc: 所有算子测试的抽象基类，约定构图、初始化、误差、梯度四大接口
- concept: '`add_sentinel`'
  desc: 哨兵张量机制，在测试图前后插入标记检测内存越界
- concept: '`eval()`'
  desc: 正确性评估主流程，支持检查、图比对、回调逐节点验证
- concept: '`eval_perf()`'
  desc: 性能基准，warmup后按算子特征估算重复次数直到1秒
- concept: '`max_nmse_err()`'
  desc: 各算子自定义的误差容忍阈值，FlashAttention按kv长度缩放
- concept: '`max_err()/err()`'
  desc: 顶层误差入口，可按算子覆写为jdst等自定义距离
- concept: '`fusion_test_nodes()`'
  desc: 声明融合测试中必须被整图对比的节点集合
- concept: '`grad_eps/grad_precise`'
  desc: 控制有限差分精度的梯度验证参数，对数值敏感算子启用4点法
- concept: '`init_tensor_uniform`'
  desc: 通用均匀分布初始化，支持所有量化类型
- concept: '`init_tensor_kq_mask`'
  desc: 专用于Flash Attention的块级-INF/0掩码生成器
- concept: '`init_set_rows_row_ids`'
  desc: 为set_rows/get_rows生成每行不重复的随机行索引
- concept: '`test_bin_bcast`'
  desc: 最通用二元广播测试，支持最多16次融合与内存重叠场景
- concept: '`test_mul_mat`'
  desc: 重量级矩阵乘测试，支持量化类型组合与Blackwell特性探测
- concept: '`test_mul_mat_id`'
  desc: MoE专用矩阵乘测试，init_mul_mat_id_tensors保证专家ID均匀覆盖
- concept: '`test_topk_moe`'
  desc: MoE路由测试，自定义err()绕过top-k顺序差异
- concept: '`test_flash_attn_ext`'
  desc: 最复杂的单算子测试，支持GQA、MLA视图、吸收矩阵、KV缓存视图
- concept: '`test_conv_2d`'
  desc: 2D卷积测试，内置calc_conv_output_size闭包精确估算FLOPs
- concept: '`test_llama/test_falcon`'
  desc: 真实Transformer单层整合测试，验证端到端计算图正确性
- concept: '`test_generic_op`'
  desc: 通用回放测试，可反序列化任意导出的算子进行离线重演
- concept: '`make_test_cases_eval/perf`'
  desc: 测试用例工厂，地毯式组合生成算子-类型-形状-参数的测试矩阵
- concept: '`export-graph-ops`'
  desc: 从真实模型导出算子图谱生成离线测试文件的辅助工具
- concept: '`matches_filter`'
  desc: 支持纯算子名或name(params)完整格式的逗号分隔过滤器
- concept: '`backend_has_feature`'
  desc: 动态查询后端特性（如Blackwell FP4），用于差异化误差容忍
- concept: '`var_to_str家族`'
  desc: 递归把std::string、数组、ggml_type、ggml_prec、scale_mode等转成形式化参数串
- concept: '`output_format_str/from_str`'
  desc: 输出格式枚举与字符串的双向转换，驱动--output CLI参数
- concept: '`is_non_contiguous`'
  desc: 通过对比实际stride与默认连续stride判定张量是否为视图布局
