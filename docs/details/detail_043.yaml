  name: 核心数据结构 —— CPU、采样、模型与训练参数的"控制面板"
  'no': 3
  points:
  - '**common_params 系列是 common 模块的中枢神经**'
  - '- cpu_params、common_params_sampling、common_params_model、common_params、common_params_speculative、common_params_vocoder、common_params_diffusion
    等结构体，把推理所需的各类配置集中收纳'
  - '- 它们像一块块控制面板：线程数、采样策略、模型位置、LoRA 配置、扩散参数、语音合成参数都能在这里找到位置'
  - '- 这样上层程序就不必在代码中到处散落参数对象，工程一致性很强'
  - ''
  - '**为什么这些结构体长成现在这样？**'
  - '- 大量参数来自真实使用场景，字段设计会天然偏向"够用且好读"'
  - '- 例如 common_params_sampling 里既有基础采样参数，也有语法、logit_bias 等约束配置'
  - '- common_params_model 需要同时兼容本地路径、URL、Hugging Face 仓库等不同来源'
  - '- common_init_result 则封装了模型、上下文、采样器、LoRA 资源的生命周期，体现典型的资源聚合设计'
  - ''
  - '**训练相关结构的价值**'
  - '- lr_opt 让训练/微调场景可以表达学习率衰减策略'
  - '- common_adapter_lora_info、common_control_vector_data 描述了适配器、控制向量这类增强行为所需的元信息'
  - '- 这些结构共同说明 common 模块并不是"纯粹工程杂件"，而是为推理与训练两类工作提供统一骨架'
