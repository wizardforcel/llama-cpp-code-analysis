  name: 模型资源与适配器管理 —— 采样器、LoRA 与控制向量的"中控室"
  'no': 5
  points:
  - '**common_init_result 是资源生命周期管理者**'
  - '- 它把 model、context、sampler、LoRA 适配器等核心对象集中托管'
  - '- 通过 Pimpl 风格的 impl 类隐藏资源细节，避免实现和接口强耦合'
  - '- 构造函数里完成模型加载、上下文创建、采样器初始化，形成一条完整装配线'
  - ''
  - '**采样器为什么要单独管理？**'
  - '- sampler() 按 seq_id 精确拿取采样器，说明很多场景是多序列、多会话并发推进'
  - '- reset_samplers() 则承担了状态清洗职责，保证重复实验中参数可控'
  - '- 这背后体现的是"会话恢复"和"多路复用"的实际需求'
  - ''
  - '**LoRA 与控制向量体现 common 的开放扩展性**'
  - '- common_set_adapter_lora 负责把适配器挂在上下文上'
  - '- lora() 与 common_control_vector_load 则说明 common 模块并不只管基础推理，还管理增强层能力'
  - '- 这部分内容让 common 成了''中控室''：既能调度模型，也能调度行为修饰器'
  - ''
  - '**嵌入向量与训练优化是进阶工具**'
  - '- common_embd_normalize 和 common_embd_similarity_cos 为嵌入任务提供数学基础'
  - '- lr_opt、common_opt_dataset_init、common_opt_lr_pars、common_opt_get_optimizer
    构成轻量级训练支持'
  - '- 从这些函数能看出 common 不仅服务推理，还考虑了微调和个性化训练的工程需求'
