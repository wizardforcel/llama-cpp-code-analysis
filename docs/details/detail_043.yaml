  name: 通用推理接口 —— 初始化、分词、批处理与状态回放的"流水线"
  'no': 4
  points:
  - '**common_init 把平台初始化统一收进来**'
  - '- Windows 下设置 UTF-8 控制台输出'
  - '- 统一接入 llama_log_set，确保日志走向固定'
  - '- 打出关键构建信息，方便排查环境问题'
  - '- 这类初始化函数像流水线的总开关，先保证运行环境可控'
  - ''
  - '**参数转换是两段式桥接**'
  - '- common_model_params_to_llama、common_context_params_to_llama 将 common 层的配置翻译成
    llama 原生参数'
  - '- 这层桥接很关键：上层应用面对的是通用参数集，底层引擎保持自己的接口演进自由度'
  - '- 它避免了"上层参数穿透到底层后耦合过深"的老问题'
  - ''
  - '**批处理、分词、反分词是常用三件套**'
  - '- common_batch_clear、common_batch_add 让 batch 填充更直观'
  - '- common_tokenize、common_token_to_piece、common_detokenize 将文本与 token 的来回转换包装得更顺手'
  - '- 配合 common_prompt_batch_decode 和 common_replay_last_token，可以处理 prompt+state
    的恢复、续推等场景'
  - '**这套流水线的价值在于稳定和可复用**'
  - '- 上层应用不用重复造轮子，也不容易在细节上翻车'
  - '- 对推理引擎来说，这种基础设施决定了开发体验和可靠性下限'
