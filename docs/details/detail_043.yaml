  name: common 模块的定位 —— llama.cpp 的"随身工具箱"
  'no': 1
  points:
  - '**common 模块解决什么痛点？**'
  - '- 大模型推理不只需要核心引擎，还需要参数管理、日志打印、字符串处理、终端交互、批处理、分词等大量周边能力'
  - '- 如果每个 CLI、server、工具程序都各自实现这些逻辑，整个项目会迅速失控'
  - '- common 模块相当于把这些高频可复用能力集中收纳，成了 llama.cpp 的"随身工具箱"'
  - '- README 里体现了这种工程诉求：项目强调零依赖、易上手、跨平台，这正是 common 模块存在的土壤'
  - ''
  - '**为什么把它看成"瑞士军刀"？**'
  - '- 它不直接决定模型结构，而是负责把各种基础能力打磨得足够顺手'
  - '- 上层应用只需要打开工具箱，就能拿到初始化、采样封装、文件系统、映射转换等通用功能'
  - '- 这种"基础设施层"的思路，能把业务逻辑和细节杂活儿分开'
  - '- 也让 llama.cpp 在复杂生态中保持清爽、可组合、可扩展'
