learning_targets:
- 理解 common 模块在 llama.cpp 生态中的定位与价值，掌握「基础设施层」的设计哲学
- 掌握 cpu_params、common_params 等核心数据结构的设计思路与字段语义
- 熟悉 CPU 检测、进程优先级设置、字符串处理、文件系统操作等公共底层能力的实现
- 理解 common_init_result 如何通过 Pimpl 模式管理模型、上下文、采样器与 LoRA 适配器的生命周期
- 掌握 common_batch_add、common_tokenize、common_detokenize 等高频推理接口的使用方法
- 能够阅读并扩展 common 模块中的工具函数，为自定义推理应用提供支撑
life_analogy:
- 想象 llama.cpp 的 common 模块是一个**随身携带的多功能工具箱**：
- '- **cpu_params / common_params** = 工具箱的**控制面板**（每个旋钮对应一种配置）'
- '- **common_init_result** = 工具箱的**总电源开关**（一启动就装配好模型、上下文、采样器）'
- '- **string_format、string_strip** = 工具箱里的**螺丝刀、钳子**（处理各种字符串小活儿）'
- '- **fs_create_directory_with_parents、fs_list** = 工具箱的**文件收纳格**（整理磁盘路径）'
- '- **common_tokenize、common_detokenize** = 工具箱的**翻译官**（文本 ↔ token 互转）'
- '- **common_batch_add、common_batch_clear** = 工具箱的**流水线工人**（批量装货卸货）'
- '- **LoRA 适配器、控制向量** = 工具箱的**插件槽**（随时扩展新功能）'
- '- **Pimpl 模式** = 工具箱的**外壳**（把内部复杂结构藏起来，只暴露简洁接口）'
- '- **postprocess_cpu_params、set_process_priority** = 工具箱的**性能调优师**（根据硬件自动调校）'
- ''
- 就像工匠出门干活必备一个工具箱，llama.cpp 的每个上层应用（CLI、server、benchmark）都依赖这个 common 工具箱，避免重复造轮子，也把「杂活」和「核心业务」分离开来。
'no': 42
summary:
- concept: common 模块
  desc: llama.cpp 的「随身工具箱」，集中管理参数、日志、字符串、文件系统、模型初始化等高频可复用能力
- concept: cpu_params
  desc: CPU 线程数、亲和性掩码、调度优先级的参数封装
- concept: common_params
  desc: 总控制面板，聚合采样、模型、投机解码、扩散、LoRA 等所有配置
- concept: common_init_result
  desc: 模型资源生命周期管理器（Pimpl 模式），持有 model/context/sampler/LoRA 指针
- concept: Pimpl 模式
  desc: Pointer to Implementation，用 impl 指针隐藏实现细节，降低耦合
- concept: cpu_get_num_math
  desc: 推荐数学计算线程数（避开 Intel E 核，减少超线程干扰）
- concept: is_hybrid_cpu
  desc: 检测 CPU 是否为混合架构（P 核 + E 核）
- concept: postprocess_cpu_params
  desc: CPU 参数后处理：补全默认值、校验掩码与线程数匹配
- concept: set_process_priority
  desc: 跨平台进程优先级设置（Windows SetPriorityClass / POSIX setpriority）
- concept: string_format
  desc: printf 风格格式化字符串（两次 vsnprintf 计算长度 + 填充）
- concept: string_process_escapes
  desc: 处理 \\n/\\t/\\xNN 等转义序列，转为实际字符
- concept: string_parse_kv_override
  desc: 解析 key=type:value 格式的模型元数据覆盖配置
- concept: fs_create_directory_with_parents
  desc: 递归创建目录（类似 mkdir -p），跨平台实现
- concept: fs_get_cache_directory
  desc: 获取缓存目录，优先 LLAMA_CACHE 环境变量，否则按平台约定
- concept: fs_validate_filename
  desc: 文件名校验：UTF-8 合法性、长度限制、非法字符检测
- concept: glob_match
  desc: 支持 * ? ** [] 的简单 Glob 模式匹配（递归实现）
- concept: tty_can_use_colors
  desc: 检测终端是否支持彩色输出（尊重 NO_COLOR 和 TERM=dumb）
- concept: common_model_params_to_llama
  desc: 参数桥接：将 common_params 转为 llama_model_params
- concept: common_context_params_to_llama
  desc: 参数桥接：将 common_params 转为 llama_context_params
- concept: common_tokenize
  desc: 文本 → token 向量，两次调用 llama_tokenize 处理未知长度
- concept: common_token_to_piece
  desc: token → 文本片段，动态调整缓冲区大小
- concept: common_detokenize
  desc: token 向量 → 文本，处理负返回值动态扩容
- concept: common_batch_add
  desc: 向 llama_batch 添加 token/位置/序列 ID/logits 标志
- concept: common_batch_clear
  desc: 清空批处理（n_tokens = 0）
- concept: common_prompt_batch_decode
  desc: 批量解码提示词，支持中途保存状态
- concept: common_replay_last_token
  desc: 重放最后一个 token，用于恢复会话状态后续推
- concept: common_embd_normalize
  desc: 嵌入向量归一化（L2/p-norm/max/不归一化）
- concept: common_embd_similarity_cos
  desc: 计算两个嵌入向量的余弦相似度
- concept: common_set_adapter_lora
  desc: 将 LoRA 适配器列表与缩放系数应用到上下文
- concept: common_control_vector_load
  desc: 从多个 GGUF 文件加载控制向量并累加合并
- concept: common_init_from_params
  desc: 完整的模型资源初始化流程（含 warmup、LoRA、控制向量）
- concept: common_init_sampler_from_model
  desc: 从模型元数据读取采样参数（仅填充未显式指定的项）
- concept: get_model_endpoint
  desc: 获取模型下载端点（MODEL_ENDPOINT/HF_ENDPOINT 环境变量优先级）
- concept: lr_opt
  desc: 学习率优化器，支持指数衰减与最小学习率限制
- concept: common_opt_dataset_init
  desc: 从 token 序列创建训练数据集（ggml_opt_dataset）
- concept: common_opt_lr_pars
  desc: 学习率调度回调，将 lr_opt 适配到 ggml 优化器
- concept: common_opt_get_optimizer
  desc: 解析优化器类型（adamw/sgd），大小写不敏感
- concept: common_time_meas
  desc: RAII 计时器：构造时记录开始时间，析构时累加耗时
- concept: string_get_sortable_timestamp
  desc: 生成 YYYY_MM_DD-HH_MM_SS.NNNNNNNNN 可排序时间戳
- concept: ggml_threadpool_params_from_cpu_params
  desc: 将 cpu_params 转换为 ggml 线程池参数（线程数/掩码/优先级）
- concept: common_init
  desc: 初始化公共环境：Windows UTF-8 代码页 + 日志回调
- concept: common_params_get_system_info
  desc: 生成包含线程数、硬件并发、llama 系统信息的描述字符串
