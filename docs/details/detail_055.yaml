  points:
  - '**为什么需要双字母表设计？**'
  - '- 标准 Base64 使用 `+/` 字符，但在 URL 和文件名中会导致转义问题'
  - '- URL安全字母表用 `-_` 替换，使 Base64 可直接嵌入 URI 和文件路径'
  - '- 自动检测模式通过特征字符反推输入使用的字母表类型'
  - ''
  - '**编码核心：三字节到四字符的位魔术**'
  - '- 每 3 字节（24位）拆分为 4 个 6 位组，通过位掩码 `& 0x3f` 提取'
  - '- 不足 3 字节时用 `=` 填充保持 4 字符边界'
  - '- 模板化迭代器接口同时支持 `std::string` 和原始指针'
  - ''
  - '**解码反向工程：6位到8位的重组**'
  - '- 逐字符解析 Base64 值，通过左移和掩码操作恢复原始字节'
  - '- `bits` 计数器跟踪当前累积的比特位数'
  - '- `last` 保存前一个值以处理跨边界的位模式'
  - ''
  - '**就地解码技术**'
  - '- `decode_inplace` 直接在原字符串上操作，返回解码后的新长度'
