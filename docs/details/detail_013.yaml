  name: 模型加载器 llama_model_loader —— GGUF 的「拆箱流水线」
  'no': 3
  points:
  - '**加载器承担的核心职责**'
  - '- 打开主 GGUF 与所有 split 文件，建立 ggml_context 与文件句柄的映射'
  - '- 遍历所有张量构建 `weights_map`，把 `tensor_name → (file_idx, offs, ggml_tensor)` 绑定'
  - '- 通过 `n_split` + 文件名前缀自动发现剩余 split 文件'
  - '- 统计 `n_elements` / `n_bytes`，根据类型分布猜测 ftype'
  - '...'
  - '**Split 文件的自动发现机制**'
  - '- `llama_get_list_splits` 根据 `<name>-00002-of-00004.gguf` 推导出全部 4 个 split'
  - '- `llama_split_prefix` 提取前缀，`llama_split_path` 生成单文件路径'
  - '- 校验每个 split 的 `LLM_KV_SPLIT_NO` 与文件名中的 idx 一致'
  - '- 用户显式给出 splits 时仍需校验数量与 `n_split` 一致'
  - '...'
  - '**Direct I/O 与 mmap 的互斥策略**'
  - '- `use_direct_io=true` 时尝试 Direct I/O，若不支持则降级到 buffered I/O'
  - '- `use_mmap && use_direct_io` 同时开启时强制关闭 mmap 并打印 WARN'
  - '- Direct I/O 与 mmap 同时存在会让 mmap 失去意义，因为 mmap 仍然走页缓存'
  - '...'
  - '**FTYPE 推断与 override 链**'
  - '- 遍历所有张量统计 ggml_type 出现次数，最高者作为猜测的 `ftype`'
  - '- 再读取 `LLM_KV_GENERAL_FILE_TYPE`，如果存在则覆盖猜测结果'
  - '- `LLAMA_FTYPE_GUESSED` 标志位标识 ftype 是猜测出来的'
  - '...'
  - '**KV/Tensor 元数据转储**'
  - '- 加载完成后把所有 KV 对打印出来（值截断到 40 字符）'
  - '- 类型用 `GGUF_TYPE_ARRAY[T,n]` 的格式表达数组维度'
  - '- 同时输出每个张量类型的张量数统计'
  - '- `print_info()` 输出文件格式、类型、大小与 BPW'
