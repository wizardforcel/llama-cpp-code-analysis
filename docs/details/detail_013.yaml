  name: GGUF 元数据访问器 —— 类型安全的「键值翻译官」
  'no': 2
  points:
  - '**为什么需要 GGUFMeta::GKV 模板体系？**'
  - '- GGUF 的元数据支持多种基本类型 + 数组类型，调用方希望用 C++ 原生类型'
  - '- 通过模板特化为每种类型生成对应的 `gt` 类型常量与 `getter` 函数'
  - '- 在 `get_kv` 中统一做类型校验，避免业务代码到处写 switch'
  - '...'
  - '**ArrayInfo 与嵌套数组的递归访问**'
  - '- `ArrayInfo` 一次性把数组类型、长度与数据指针取出'
  - '- 通过 `gguf_get_arr_n` 取出长度，`gguf_get_arr_data` 取原始指针'
  - '- 字符串数组特殊处理：数据指针为空，调用 `gguf_get_arr_str` 按下标取'
  - '...'
  - '**KV 覆盖（override）的优先级机制**'
  - '- `GKV::set` 先尝试 `try_override`，命中即返回，跳过文件读取'
  - '- `try_override` 通过 SFINAE 区分 bool、整型、浮点、字符串四种类型'
  - '- 覆盖值的类型不匹配时输出 WARN 日志而不抛异常'
  - '- `validate_override` 负责打印 override 命中的详细日志'
  - '...'
  - '**按 KV 枚举取值的统一入口**'
  - '- `get_key(enum llm_kv, T&, bool)` 把 llm_arch 的 key 名空间自动展开'
  - '- `get_arr_n` 支持 `std::string` 与 `enum llm_kv` 两种 key 形式'
  - '- `get_arr` 自动展开 vector 与 std::array 两种返回容器'
  - '- `get_key_or_arr` 允许标量自动广播为指定长度的数组'
