  name: 张量创建与多缓冲区分配 —— 「按层分配内存」的调度员
  'no': 4
  points:
  - '**为什么需要 `create_tensor` 这么复杂的工厂？**'
  - '- 不同模型架构、层类型、是否复用决定了张量应该放在哪种 buffer type 上'
  - '- 输入张量、输出张量、循环层张量要分别走 input/output/layer 三类 buft 列表'
  - '- 同一 buft 上的张量共享一个 ggml_context，避免反复分配'
  - '...'
  - '**`select_weight_buft` 的能力探测**'
  - '- 通过 `weight_buft_supported` 构造一个最小算子调用 `supports_op`'
  - '- 对 GET_ROWS / MUL_MAT / MUL_MAT_ID / ROPE / SSM_CONV / SSM_SCAN / RWKV_WKV6
    / IM2COL / SCALE 等算子分别构造测试张量'
  - '- 在 buft 上分配 0 字节的临时 buffer 仅用于能力探测，用后即释放'
  - '...'
  - '**`ctx_map` 与每种 buffer 的 ggml_context**'
  - '- 使用 `std::map` 按 buft 名字排序，保证分配顺序确定性'
  - '- 预留的张量数：`n_tensors + 1`（重复 output）+ `n_layer * 2`（rope freqs）'
  - '- 在没有文件句柄时额外预留 `n_layer * 256` 张量，避免动态扩容'
  - '...'
  - '**Duplicated token embedding 的特殊路径**'
  - '- 很多架构把 `token_embd` 与 `output` 共享同一份权重'
  - '- `TENSOR_DUPLICATED` 标志位 + `LLM_TENSOR_TOKEN_EMPD → LLM_TENSOR_OUTPUT` 切换'
  - '- 在重复路径下 `size_data` 会重新计算以反映真实写入量'
  - '...'
  - '**`create_tensor_as_view` 的零拷贝视图**'
  - '- 当一个张量是另一个张量的子区域时（如 RoPE 因子）创建视图'
  - '- 通过 `ggml_view_4d` 指定 offset 和 stride，类型必须与 base 一致'
  - '- 视图不分配新内存，节省大模型的 DRAM 占用'
  - '**`done_getting_tensors` 的校验**'
  - '- 比较 `n_created` 与 `n_tensors`，不一致时抛出运行时错误'
  - '- 若有张量被迫移动 buffer，打印第一条移动信息与总数'
