  name: 底层文件与内存映射 —— 跨平台的「读写管道工」
  'no': 1
  points:
  - '**为什么需要自己的 `llama_file` 抽象？**'
  - '- 直接用 `FILE*` 难以跨平台支持 O_DIRECT、NUMA 提示与对齐块读取'
  - '- 把 Direct I/O、对齐块读取、DMA 缓冲区回退统一封装在一个 Pimpl 类中'
  - '- 同时支持文件路径打开与已存在的 `FILE*` 接管两种入口'
  - '- `llama_file::file_id()` 统一暴露底层 fd/HANDLE，供 mmap 与 mlock 使用'
  - '...'
  - '**Direct I/O（O_DIRECT）的工程价值**'
  - '- 通过 `init_fd()` 用 `open(O_RDONLY | O_DIRECT)` 绕过系统页缓存'
  - '- 在 NVMe 等高速设备上减少 double buffering 与 CPU 拷贝'
  - '- 通过 `read_aligned_chunk()` 把任意偏移对齐到块设备边界，避免 DMA 越界'
  - '- `read_raw()` 根据 `has_direct_io()` 自动选择对齐读取或裸读取'
  - '...'
  - '**POSIX mmap 与 NUMA 优化**'
  - '- `llama_mmap::impl` 使用 `MAP_SHARED` 把整个文件映射进虚拟地址'
  - '- 通过 `posix_fadvise(POSIX_FADV_SEQUENTIAL)` 提示顺序预取'
  - '- 通过 `MAP_POPULATE + posix_madvise(WILLNEED)` 实现主动预取'
  - '- `numa=true` 时切换到 `POSIX_MADV_RANDOM` 防止跨节点页面污染'
  - '- `align_range()` 把取消映射的首尾边界对齐到页边界'
  - '...'
  - '**Windows 平台的 mmap 等价物**'
  - '- 用 `CreateFileMappingA` + `MapViewOfFile` 实现只读映射'
  - '- 通过 `PrefetchVirtualMemory`（Win8+）主动预取'
  - '- `unmap_fragment()` 在 Windows 上是空实现（仅记录）'
