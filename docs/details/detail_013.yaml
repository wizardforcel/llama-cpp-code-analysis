  name: 设备内存自适应 llama_params_fit —— 「自动算账」的预算管家
  'no': 7
  points:
  - '**为什么需要自动参数适配？**'
  - '- 用户给出的 GPU 卸载层数与上下文大小经常超出设备显存'
  - '- llama.cpp 应当自动把参数收缩到能塞进设备为止'
  - '- 多设备场景还要考虑 tensor_split 与 buft_override 的协调'
  - '...'
  - '**Step 1：基线测量**'
  - '- 用 `no_alloc + use_mmap=false + use_mlock=false` 加载模型'
  - '- `llama_init_from_model` 触发实际内存分配，统计各 buffer type 占用'
  - '- `ggml_backend_dev_memory` 拿到 free/total，对 0 内存设备回退到 CPU'
  - '- 设备返回 free=0 且 total=0 时回退到 CPU 后端的内存数据'
  - '...'
  - '**Step 2：缩小上下文**'
  - '- 当 n_ctx=0（自动模式）且 `n_ctx_train > n_ctx_min` 时按比例缩减'
  - '- 多设备场景考虑「层不能跨设备」的浪费，按 `model_per_layer` 预留安全余量'
  - '- 把 n_ctx 按 256 对齐，避免 CUDA 后端的奇怪行为'
  - '...'
  - '**Step 3：dense 模型的 back-to-front 层分配**'
  - '- 用 false position（试位法）求解每个设备能容纳的层数下界'
  - '- `low=0层`、`high=剩余层`，线性插值逼近目标 memory'
  - '- 直到差值只剩 1 层时停止，返回刚好满足的下界'
  - '- 最后一设备的 output 层必须始终是完整层'
  - '...'
  - '**Step 4：MoE 模型的 dense-only → full 升级**'
  - '- 先把所有 MoE tensor 用正则移动到 CPU buffer（pattern_moe_all）'
  - '- 计算 dense-only 能容纳的总层数 `global_surplus_cpu_moe`'
  - '- 如果有富余，把后端的 dense-only 层逐步升级为 full 层'
  - '- 升级后溢出部分按 `LAYER_FRACTION_UP/GATE/ATTN` 三级渐进'
  - '- 尝试把下一设备的部分层以 UP/GATE/ATTN 溢出到相邻设备或系统内存'
  - '...'
  - '**异常分类与状态返回**'
  - '- `llama_params_fit_exception`：用户配置冲突（如 tensor_split 已设置）'
  - '- `std::runtime_error`：底层 ggml 错误'
  - '- 状态码 `SUCCESS/FAILURE/ERROR` 区分可恢复与不可恢复'
  - '- 同时暴露 `llama_max_devices()` 与 `llama_max_tensor_buft_overrides()` 上限'
  - '...'
  - '**顶层入口与能力查询**'
  - '- `llama_load_model_from_file` 兼容旧 API 直接转调 `llama_model_load_from_file`'
  - '- `llama_flash_attn_type_name` 输出 FlashAttention 模式的人类可读字符串'
  - '- `llama_supports_mmap/mlock/gpu_offload/rpc` 通过静态常量与后端注册表判定能力'
