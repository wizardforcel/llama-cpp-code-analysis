  name: 异步加载与数据上传 —— 「并行搬运」的工程艺术
  'no': 5
  points:
  - '**`load_all_data` 的多策略加载路径**'
  - '- mmap 路径：直接把 mapping 地址赋给 `cur->data`，零拷贝'
  - '- 文件读取路径：通过 `read_raw` 顺序读取到 host buffer'
  - '- 异步上传路径：把分片读入 host pinned buffer，再异步拷贝到 GPU'
  - '...'
  - '**4 个 buffer 轮转的 staged upload**'
  - '- 使用 `n_buffers = 4` 个 pinned buffer 轮转避免同步等待'
  - '- `buffer_size = 64MB + 2*alignment` 兼顾 I/O 效率与内存占用'
  - '- 每个 buffer 通过 event 跟踪上传完成状态，复用前等待上一轮完成'
  - '- `buffer_idx %= n_buffers` 保证循环复用'
  - '...'
  - '**对 Direct I/O 文件的对齐读取**'
  - '- 计算 `aligned_offset` 与 `offset_from_alignment`，把数据起点对齐到块边界'
  - '- `read_raw_unsafe` 把整个对齐块读入 pinned buffer'
  - '- 通过 `ptr_data` 偏移跳过首尾的对齐 padding，只把真实数据上传'
  - '- `bytes_read == 0` 时跳过首部 padding，最后一块减去尾部 padding'
  - '...'
  - '**异步能力探测**'
  - '- `upload_backend` lambda 探测 device 是否同时支持 async + host_buffer + events'
  - '- 必须使用 device 的默认 buffer type（不能是 host 类型）'
  - '- 失败时静默降级到同步路径，不影响模型可用性'
  - '...'
  - '**验证与取消支持**'
  - '- 通过 `std::async` 并行触发 `ggml_validate_row_data` 验证每个张量'
  - '- 进度回调返回 false 时立即终止后续张量加载'
  - '- 加载完成后对未使用的 mmap 区域调用 `unmap_fragment` 回收虚拟地址'
  - '- 上传完成后释放 event 与 host buffer，关闭 upload_backend'
