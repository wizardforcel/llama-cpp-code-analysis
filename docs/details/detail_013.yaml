summary:
- concept: '`llama_file`'
  desc: Pimpl 模式的跨平台文件抽象，统一支持 buffered I/O 与 Direct I/O，并按块设备对齐读取
- concept: '`O_DIRECT` / `read_aligned_chunk`'
  desc: 绕过页缓存的 DMA 读取，通过 posix_memalign 把任意偏移对齐到块边界
- concept: '`llama_mmap`'
  desc: POSIX mmap + fadvise/madvise 预取，NUMA 下切到 RANDOM 防跨节点污染，Windows 用 CreateFileMapping
    等价
- concept: '`llama_mlock`'
  desc: 按页粒度把模型锁进物理内存，POSIX 检查 RLIMIT_MEMLOCK 输出建议，Windows 调 working set
- concept: '`unmap_fragment`'
  desc: POSIX 上按页 munmap 并跟踪 mapped_fragments，Windows 上未实现
- concept: '`GGUFMeta::GKV<T>`'
  desc: 模板体系为每种类型生成 getter + 统一 type 校验，业务代码无需 switch
- concept: '`GGUFMeta::ArrayInfo`'
  desc: 把数组类型/长度/数据指针一次性打包，字符串数组特殊处理（数据指针为空）
- concept: '`try_override` / SFINAE'
  desc: 按 bool/整型/浮点/string 派发 override，类型不匹配只 WARN 不抛异常
- concept: '`llama_get_list_splits`'
  desc: 根据 `<name>-00002-of-00004.gguf` 自动推导所有 split 路径，校验 idx
- concept: '`use_mmap && use_direct_io` 互斥'
  desc: Direct I/O 与 mmap 同时存在时强制关闭 mmap，因为 mmap 仍走页缓存
- concept: '`ftype` 推断与 GUESSED 标志'
  desc: 统计最高频 ggml_type 作为猜测，再用 LLM_KV_GENERAL_FILE_TYPE 覆盖猜测结果
- concept: '`weight_buft_supported`'
  desc: 构造最小算子调用 supports_op，对 GET_ROWS/MUL_MAT/MUL_MAT_ID/ROPE/SSM_SCAN/RWKV_WKV6/IM2COL/SCALE
    等做能力探测
- concept: '`select_weight_buft`'
  desc: 在 buft_list 中挑选首个能力支持的 buft 分配张量
- concept: '`ctx_map` / `ggml_backend_buft_comparator`'
  desc: 按 buft 名字排序的 ggml_context map，每种 buffer 共享一个 context
- concept: '`create_tensor` + TENSOR_DUPLICATED'
  desc: TOKEN_EMBD 复用为 OUTPUT 时切换张量类型并重新计算 size_data
- concept: '`create_tensor_as_view`'
  desc: 通过 ggml_view_4d 创建零拷贝视图，类型必须与 base 一致
- concept: '`load_all_data` 三套路径'
  desc: mmap zero-copy / host buffer read_raw / 4-buffer 轮转的 async upload
- concept: '`staged upload`'
  desc: n_buffers=4 pinned buffer 轮转 + event 同步，避免等待 GPU 完成
- concept: '`alignment padding`'
  desc: 对齐块首尾加 padding，ptr_data 偏移跳过 padding 只把真实数据上传
- concept: '`mmap_used` + `unmap_fragment`'
  desc: 记录每个文件实际被引用的区间，加载完成后回收首尾未使用片段
- concept: '`progress_callback` 取消'
  desc: 回调返回 false 立即终止后续张量加载，已分配资源会被自动释放
- concept: '`llama_model_saver_supports_arch`'
  desc: 白名单机制：显式排除 Gemma3/Gemma3N/Qwen3Next/Qwen35/BitNet/T5/Step35/Plamo3 等未实现 save
    的架构
- concept: '`add_kv` 模板分发'
  desc: 按 Container::value_type 分发到 uint8/int8/uint32/int32/float/string 不同的 gguf
    调用
- concept: '`per_layer=true` 优化'
  desc: 检查所有层是否同值，同值则降级为标量，节省 GGUF 体积
- concept: '`add_tensor` 去重'
  desc: rope_freqs/rope_factors_long/rope_factors_short 在 GGUF 中只写一次
- concept: '`llama_params_fit` Step 1-4'
  desc: 基线测量 → 缩小 ctx → dense 层 back-to-front 填充 → MoE 升级
- concept: '`false position` 试位法'
  desc: 用 mem[low] 与 mem[high] 线性插值逼近 target，直到 delta=1 时返回下界
- concept: '`LAYER_FRACTION_*` 三级渐进'
  desc: ATTN < UP < GATE < MOE，按权重粒度逐级释放空间
- concept: '`llama_params_fit_status`'
  desc: SUCCESS=完成、FAILURE=用户配置冲突、ERROR=底层 ggml 错误
- concept: '`llama_supports_*` 能力查询'
  desc: mmap/mlock/gpu_offload/rpc 通过静态 SUPPORTED 常量与后端注册表运行时探测
- concept: '`llama_split_path` / `llama_split_prefix`'
  desc: '`<name>-00002-of-00004.gguf` 与前缀的双向转换，供 split 自动发现使用'
- concept: '`llama_model_save_to_file`'
  desc: 一行入口：add_kv_from_model → add_tensors_from_model → save，与加载器严格镜像
