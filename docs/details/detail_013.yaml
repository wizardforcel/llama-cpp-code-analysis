exercises:
- contents:
  - 阅读 `src/llama-mmap.cpp` 第 157-165 行 `impl(const char*, const char*, bool)`、第 168-182
    行 `init_fd()`，第 258-276 行 `read_aligned_chunk()`，理解：
  - 1. 为什么 `O_DIRECT` 需要把任意 offset 对齐到块设备边界？
  - 2. 当 `EFAULT/EINVAL` 触发时，`read_raw_unsafe()`（第 218-256 行）如何回退到 buffered I/O？
  - 3. 在 `llama_model_loader` 构造函数中，`use_mmap && use_direct_io` 同时为 true 时为什么必须强制关闭
    mmap？
  - 阅读 `src/llama-mmap.cpp` 第 398-430 行 `llama_mmap::impl::impl()`，回答：
  - 4. `MAP_POPULATE + POSIX_MADV_WILLNEED` 组合使用的目的是什么？
  - 5. 当 `numa=true` 时为什么要把 `prefetch` 置 0 并切到 `POSIX_MADV_RANDOM`？
  - 动手：在你的 Linux 工作站上用 `strace -e trace=mmap,read,openat llama-cli -m model.gguf`
    观察真实加载行为，记录 mmap 调用次数与 Direct I/O 是否生效。
  'no': 1
  title: 理解 Direct I/O 与 mmap 的工程取舍
- contents:
  - 阅读 `src/llama-model-loader.cpp` 第 128-244 行 `GGUFMeta` 命名空间，回答：
  - 1. `GKV_Base_Type` 与 `GKV_Base` 的分层设计是如何把「类型 → gguf_type → getter 函数」三步合一的？
  - 2. `GKV_Base<std::string>` 为什么不能复用 `GKV_Base_Type`？
  - 3. `ArrayInfo` 为什么把数据指针单独存？字符串数组的数据指针为什么强制为 nullptr？
  - 4. `GKV<T>::set()` 中 `try_override` 与文件读取的优先级是怎样的？
  - 5. `try_override` 通过 SFINAE 派分了哪 4 种 override 类型？类型不匹配时会怎样？
  - 动手实验：写一段小程序，构造一个 `bool` 字段 + 一个 `int32_t` 字段，然后用一个 `LLAMA_KV_OVERRIDE_TYPE_STR`
    的 override 去覆盖 `int32_t` 字段，观察日志输出。
  'no': 2
  title: 理解 GGUFMeta::GKV 模板体系
- contents:
  - 阅读 `src/llama-model-loader.cpp` 第 85-107 行 `llama_get_list_splits` 与第 490-630
    行构造函数，回答：
  - 1. `llama_split_prefix` 是如何从 `<name>-00002-of-00004.gguf` 反推出前缀的？
  - 2. 构造时如果 `n_split > 1` 但 splits 为空，函数会做什么？
  - 3. 加载 split 文件时为什么要校验 `LLM_KV_SPLIT_NO` 与文件 idx 一致？
  - 4. `use_direct_io=true` 但内核不支持 O_DIRECT 时，构造函数如何降级？
  - 5. ftype 的推断是先读 KV 还是先统计张量类型？两者的优先级是什么？
  - 动手：把一个模型用 `llama-gguf-split` 切成 4 份，再用 `strace` 跟踪 `llama_model_load_from_splits`
    的 `open`/`mmap` 调用，确认加载顺序是否先主文件后从文件。
  'no': 3
  title: 理解模型加载器与 split 文件自动发现
- contents:
  - 阅读 `src/llama-model-loader.cpp` 第 770-1010 行，回答：
  - 1. `weight_buft_supported` 为不同算子（GET_ROWS / MUL_MAT / MUL_MAT_ID / ROPE / SSM_SCAN）构造测试张量时为什么要用
    0 字节的临时 buffer？
  - 2. `ctx_for_buft` 计算 `max_n_tensors` 时为什么在没有 files 时额外预留 `n_layer * 256`？
  - 3. `buft_for_tensor` 中的 `TENSOR_DUPLICATED` 路径为什么要把 `LLM_TENSOR_TOKEN_EMBD` 切换为
    `LLM_TENSOR_OUTPUT`？
  - 4. `tensor_buft_overrides` 与 `use_mmap` 同时开启时为什么要 WARN「consider using --no-mmap」？
  - 5. `create_tensor_as_view` 为什么要求 `cur->type == base->type`？零拷贝视图节省了多少内存？
  - 动手：打开一个 7B 的 Q4_K 模型，在 `create_tensor` 入口打日志，记录每个张量被分配到了哪种 buft，观察 token_embd
    与 output 是否共享同一份 buffer。
  'no': 4
  title: 理解 create_tensor 的多缓冲区调度
- contents:
  - 阅读 `src/llama-model-loader.cpp` 第 1110-1330 行 `load_all_data`，回答：
  - 1. 4 个 pinned buffer 轮转的目的什么？为什么是 64MB+2*alignment 而不是更大的尺寸？
  - 2. `upload_backend` lambda 探测 async/host_buffer/events 三个 cap 的目的是什么？
  - 3. Direct I/O 文件在 GPU 路径下，`aligned_chunk`、`offset_from_alignment`、`ptr_data` 三个变量分别起什么作用？
  - 4. 为什么 `bytes_read == 0` 时跳过首部 padding，而最后一块要减去尾部 padding？
  - 5. `ggml_backend_event_synchronize` 与 `buffer_idx %= n_buffers` 是如何保证 buffer 不被并发重用的？
  - 动手：用 `nsys profile` 或 `rocm-smi --progs` 跟踪一次 70B Q4_K 模型在 ROCm 后端的加载过程，统计 pinned
    buffer 的分配次数与同步等待时间占比。
  'no': 5
  title: 理解 staged upload 与 Direct I/O 对齐读取
- contents:
  - 阅读 `src/llama-model-saver.cpp` 第 15-35 行 `llama_model_saver_supports_arch`、第 75-260
    行，回答：
  - 1. 哪些架构被显式排除？为什么这些架构目前不支持 save？
  - 2. `add_kv<Container>` 在 `per_layer=true` 时如何检测「全层同值」并降级为标量？
  - 3. `add_kv(vector<string>)` 为什么需要先转成 `vector<const char*>`？
  - 4. `add_tensor` 中 GGUF 已存在同名张量时会跳过，rope_freqs 为什么被特殊处理？
  - 5. `add_kv_from_model` 写入了多少个 hparams + vocab 字段？这些字段与 llama-quantize 的写入是否一致？
  - 动手：尝试把一个不支持的架构（如 Gemma3）传入 `llama_model_saver` 构造，观察是否立即抛出断言。
  'no': 6
  title: 理解 llama_model_saver 的镜像逻辑
- contents:
  - 阅读 `src/llama.cpp` 第 60-460 行，回答：
  - 1. Step 1 中如果设备返回 free=0 且 total=0，函数会怎么处理？
  - 2. Step 2 缩小 n_ctx 时为什么要按 256 对齐？为什么多设备下要预留 `model_per_layer * (nd+1) / (2 or
    6)` 的余量？
  - 3. Step 3 dense 层 back-to-front 填充时，为什么 `low=0层`、`high=剩余层`？
  - 4. Step 4 MoE 升级中，`global_surplus_cpu_moe > 0` 的判定为什么需要先做一次「把所有 MoE tensor 移走」的探测？
  - 5. `LAYER_FRACTION_UP` 与 `LAYER_FRACTION_GATE` 的区别是什么？为什么 ATTN 是最弱的升级？
  - 动手：把一个 70B Q4_K 模型放到一台只有 16GB 显存的 GPU 上，开启 `--fit-params`，观察 n_gpu_layers 从 80
    缩到多少、n_ctx 缩到多少。
  'no': 7
  title: 理解 llama_params_fit 的四步预算
learning_targets:
- 理解 llama.cpp 自研的 llama_file / llama_mmap / llama_mlock 跨平台抽象及其 Direct I/O、NUMA、mlock
  等高级特性的实现原理
- 掌握 GGUFMeta::GKV 模板体系如何为不同的元数据类型提供类型安全的访问接口
- 理解 llama_model_loader 的拆箱流程：从文件打开、多 split 文件自动发现、Direct I/O 与 mmap 互斥、KV/Tensor
  元数据加载到 ftype 推断
- 深入 create_tensor / create_tensor_as_view 的多缓冲区调度与 zero-copy 视图机制
- 了解 load_all_data 中 mmap、staged upload、Direct I/O 对齐读取三套加载路径的工程取舍
- 理解 llama_model_saver 如何作为加载器的镜像把内存中的模型写回 GGUF，以及它的 KV 类型分发、per_layer 优化、张量去重逻辑
- 掌握 llama_params_fit 如何按设备内存自动收缩 GPU 层数与上下文大小，并对 MoE 模型做 dense-only → full 的渐进升级
- 了解 Direct I/O 与 mmap 的工程权衡、对齐读取的回退机制以及平台差异（POSIX/Windows/macOS）的处理策略
- 掌握 llama_file / llama_mmap / llama_mlock 全部公开接口与内部 impl 的协作关系
- 理解 GGUFMeta 模板体系中 GKV_Base、ArrayInfo、get_kv、try_override、validate_override 的完整调用链
- 掌握 llama_model_loader 的权重索引、张量元信息查询、形状校验与创建全链路
- 理解 llama.cpp 中模型加载入口、后端初始化、能力查询与系统信息打印的顶层流程
life_analogy:
- 想象 GGUF 文件是一座**巨型立体仓库**，而 llama.cpp 的模型加载/保存模块就是这座仓库的**门卫 + 装卸队 + 自动分拣机器人**
- '- **GGUF 文件** = 一座多楼层仓库（KV 元数据在门口，张量在货架上）'
- '- **llama_file** = 仓库的**卷帘门**：既能推开（新文件）也能接管已有的卷帘门（FILE*）'
- '- **Direct I/O (O_DIRECT)** = 给卷帘门加了**直通快车道**，绕过前台缓存直达货架'
- '- **read_aligned_chunk** = 叉车按**托盘尺寸**搬货，块没对齐就重新码齐'
- '- **llama_mmap** = 给仓库装了一扇**全景观光窗**（MAP_SHARED），不用开门就能看货架'
- '- **posix_madvise(WILLNEED)** = 提前跟仓库说「明天这批货要发，请先摆好」'
- '- **posix_madvise(RANDOM)** = NUMA 模式下「别让货乱窜到隔壁仓库」'
- '- **unmap_fragment** = 把**暂时用不到的货架**用幕布拉上，腾出虚拟地址空间'
- '- **llama_mlock** = 把最常用的货架**焊死**在仓库地板上，不准被踢到回收站'
- '- **VirtualLock + WorkingSet** = Windows 上的「把货架钉在承重墙」'
- '- **GGUFMeta::GKV<T>** = 仓库门口的**翻译官**：把仓库里「五花八门的标签」翻译成统一的 C++ 类型'
- '- **try_override** = 翻译官手里的**优先通行证**，可绕过文件直接用对讲机告诉装卸队'
- '- **llama_model_loader** = **拆箱流水线**：核对门牌（arch）→ 登记货架（权重表）→ 决定装卸策略（mmap/Direct
  I/O）'
- '- **llama_get_list_splits** = 看到一节车厢的车号，自动派出剩下 N 节'
- '- **ctx_map** = 给每种搬运设备（CPU/GPU/host）分配**独立的临时库房**'
- '- **select_weight_buft** = 给每个货架试一下「这台叉车能不能搬」（supports_op 探测）'
- '- **create_tensor_as_view** = 给某个货架贴个**副标签**，零成本引用同一堆货'
- '- **staged upload（4 buffer 轮转）** = **4 个传送带接力赛**：每个传送带搬运时其他传送带还在跑'
- '- **alignment padding + ptr_data** = 给货品包上一层**泡沫塑料**保证叉车不伤货，搬到目标后再撕掉'
- '- **llama_model_saver** = 装卸队的**回程班列**：把内存里的仓库按原样重新装车'
- '- **add_tensor 去重（rope_freqs）** = 装车时发现「这箱货和前面那箱一样」，直接跳过'
- '- **per_layer 优化** = 装车时发现「全车层都一样」，压缩成一箱'
- '- **llama_params_fit** = 仓库**自动算账员**：先把全部货架摆进去看会不会挤爆，再一排一排往后挪'
- '- **false position（试位法）** = 算账员拿尺子量「再挪一格就刚好塞下」'
- '- **MoE 升级（dense-only → full）** = 先把所有**专家箱**搬到 CPU 仓库，腾出 GPU 空间，最后再把专家一件件搬回来'
- '- **LAYER_FRACTION_UP/GATE/ATTN** = 三档精度的**专家搬家工具**：UP 只推上半身，GATE 推上下半身，ATTN 全推走'
- 就像一位优秀的仓库经理既要让大卡车（GPU）跑得快，又要让货架（模型权重）摆得下，llama.cpp 的加载与保存模块就是用 Direct I/O、mmap、mlock、staged
  upload 等工程技巧在「I/O 速度」、「内存占用」、「跨平台兼容」三者之间精妙平衡。
