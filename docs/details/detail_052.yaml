  - '**finalize_file 的三级策略**'
  - '- 首选：创建相对路径符号链接（blobs/<oid> → snapshots/<commit>/<path>）'
  - '- 降级一： rename 移动文件（同一文件系统内高效）'
  - '- 降级二： copy 复制（跨文件系统或 Windows 权限受限时）'
  - '- `symlinks_disabled` 静态标志避免重复尝试失败的链接方案'
  - '**旧版缓存格式的问题**'
  - '- 旧版：`~/.cache/llama.cpp/<owner>_<repo>_<filename>` + manifest=xxx.json'
  - '- 新版：标准 HF 缓存结构，与 transformers/huggingface_hub 生态互通'
  - '**迁移流程的严谨性**'
  - '- `parse_manifest_name` 从 manifest 文件名提取 owner/repo'
  - '- `make_old_cache_filename` 还原旧文件名，`collect_file` 校验 SHA256、大小、冲突'
  - '- `collect_files` 处理多分片文件的成组收集'
  - '- `migrate_file` 执行实际移动并调用 `finalize_file` 建立快照链接'
  - '- 全部成功后删除旧 manifest，失败则保留现场不破坏数据'
