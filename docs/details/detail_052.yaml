learning_targets:
- 理解统一下载抽象层的设计：common_remote_params、common_download_model_opts、common_download_model_result、common_cached_model_info
  四大核心数据结构与 __main__ 类型别名
- 掌握 HTTP 基础设施：URL 解析（common_http_parse_url）、客户端工厂（common_http_client）、安全掩码显示与通用内容获取（common_remote_get_content）
- 深入单文件下载引擎：临时文件+原子重命名、ETag 读写与 304 协商、断点续传、离线降级、状态码判定与失败重试
- 理解多任务进度条系统：ANSI 转义序列、并发下载的行号管理、TTY 检测与静默降级、禁用拷贝语义
- 掌握 GGUF 分片与智能选择策略：分片命名解析、量化位数提取、同组分片收集、模型文件甄别、mmproj 配对与可用文件清单
- 熟悉 Hugging Face 集成流程：repo:tag 语法解析、hf_plan 构建、URL 任务展开、并发任务调度与缓存模型列表汇总
- 了解 Docker Registry 支持：OCI Manifest 解析、GGUF 层识别、blob 下载流程
- 掌握 HF 缓存目录管理：多级环境变量优先级、目录命名互转规则、路径与凭据的安全防护校验、原子写文件
- 理解 HF API 交互层：统一 api_get 封装、分支解析、文件树递归获取、本地 refs 读取与离线缓存扫描
- 了解缓存落盘与旧版迁移：符号链接三级降级策略、manifest 解析、逐文件校验收集与迁移执行
life_analogy:
- 想象 llama.cpp 的模型下载系统是一家**智能物流调度中心**：
- '- **下载抽象层（download.h）** = 货运总柜台（统一受理 HF 专线、URL 直送、Docker 集装箱三种托运单）'
- '- **ETag 缓存** = 快递单号比对（已签收过的包裹不再重复取件）'
- '- **断点续传（Range 请求）** = 搬家中途休息（记住已搬到第几箱，下次接着搬）'
- '- **ProgressBar** = 多条流水线的电子看板（同时显示 8 个包裹的配送进度）'
- '- **mmproj 配对** = 为相机选配镜头（同品牌、焦距越接近越好）'
- '- **HF 缓存目录** = 标准化仓库货架（models--user--repo 的统一编码）'
- '- **finalize_file** = 包裹上架策略（优先挂链接牌→同区搬运→跨区快递）'
- '- **旧版迁移** = 老仓库改造（先验货、再搬入新货架、最后撕旧标签）'
- 就像物流中心需要处理多种运输方式、确保包裹安全送达、管理库存货架，llama.cpp 的下载系统也需要统一调度多种模型来源、保证文件完整性、管理本地缓存。
'no': 51
