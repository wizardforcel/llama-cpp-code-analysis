  - '- `common_remote_params`：HTTP 层可配参数（headers、timeout、max_size）'
  - '- `common_download_model_opts`：下载行为开关（offline、download_mmproj）'
  - '- `common_download_model_result`：统一返回模型路径与可选 mmproj 路径'
  - '- `common_cached_model_info`：缓存模型列表的 DTO（Data Transfer Object），`to_string()`
    输出 `repo:tag`'
  - '**头文件的『门面』布局**'
  - '- `__main__` 区域集中了 `#include`、`common_header` / `common_header_list` 类型别名与前置声明'
  - '- 所有对外 API（下载、列表、Docker 解析）以纯函数声明形式暴露，隐藏实现细节'
