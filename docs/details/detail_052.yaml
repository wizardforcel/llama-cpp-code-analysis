  'no': 1
  points:
  - '**为什么需要统一的下载抽象层？**'
  - '- llama.cpp 支持多种模型来源：Hugging Face 仓库、直接 URL、Docker Registry、本地路径'
  - '- 用户期望的透明性：无论来源如何，最终都是本地路径 + 可选 mmproj'
  - '- 命令行体验的统一：`-hf user/repo:tag`、`-m model.gguf`、`docker://...` 等语法糖'
