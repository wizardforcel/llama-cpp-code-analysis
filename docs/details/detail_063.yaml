  'no': 2
  points:
  - '**双格式兼容设计**：同时支持"慢速"格式（vocab.json + added_tokens.json分离存储）和"快速"格式（tokenizer.json内嵌model字段），自动识别并回退'
  - '**强制字节回退校验**：在快速格式中验证`byte_fallback=False`和`decoder[''type'']==''ByteLevel''`，确保符合GPT-2标准BPE规范，防止不兼容的
    tokenizer 混入'
  - '**ID连续性守卫**：严格要求新增令牌（added_tokens）的ID必须紧接基础词表之后连续排列（list(range(vocab_size, vocab_size+len))），否则抛出ValueError，保证词汇表紧凑性'
  - '**令牌类型标记体系**：基础BPE令牌标记为NORMAL，新增令牌统一标记为CONTROL且赋予极低分数（-1000.0）作为"外来户"标识，便于后续处理区分'
  - '**迭代器输出协议**：实现`all_tokens`生成器，先产出基础BPE令牌（得分0.0），再产出新增令牌，统一返回(bytes, float, TokenType)三元组供GGUFWriter消费'
  - '**统计信息展示**：`__repr__` 清晰展示基础令牌和新增令牌的数量，便于快速验证加载结果'
