exercises:
- contents:
  - 阅读 `SpecialVocab._set_special_token()` 方法（117-127行）和 `SpecialVocab.__repr__()`（57-60行），回答以下问题：
  - 1. 当遇到以下情况时，代码分别会采取什么行为？（抛出异常/警告/忽略）
  - '   - 特殊令牌 ID 为负数'
  - '   - 特殊令牌 ID 大于等于 n_vocab'
  - '   - 重复设置同一类型的特殊令牌'
  - 2. 为什么需要 `n_vocab` 参数？如果设置为 None 会发生什么？
  - 3. `__repr__` 中如何展示 merges、special_token_ids 和 add_special_token 的状态？这种设计对调试有什么帮助？
  - 4. 思考这种防御性设计在实际模型转换中能避免哪些潜在错误
  'no': 1
  title: SpecialVocab 的防御性编程分析
- contents:
  - 对比阅读 `BpeVocab.__init__()` 中处理慢速格式（vocab.json）和快速格式（tokenizer.json）的代码逻辑（283-324行），以及
    `BpeVocab.__repr__()`（341-342行），回答：
  - 1. 两种格式分别如何获取 added_tokens？
  - 2. 在快速格式中，哪三个条件必须同时满足才被认为是合法的 GPT-2 BPE 分词器？
  - 3. 为什么快速格式要求 `decoder['type'] == 'ByteLevel'`？这与字节回退（byte_fallback）有什么关系？
  - 4. `__repr__` 展示的 vocab_size_base 和 added_tokens_list 长度有什么关系？
  - 5. 假设你有一个自定义分词器文件，尝试构造一个会导致 `ValueError` 的 ID 不连续场景
  'no': 2
  title: BPE 词表的双格式侦探游戏
- contents:
  - 深入分析 `MistralVocabConverter.extract_vocab_merges_from_model()` 方法（843-900行）的算法逻辑：
  - 1. 解释如何通过遍历 `_mergeable_ranks` 找到每个合并令牌的最优分割点（二分策略）？
  - 2. 注意到代码中 `local = sorted(local, key=..., reverse=False)` 的排序逻辑，这是基于什么优先级来确定合并顺序的？
  - 3. `bytes_to_unicode()` 函数（553-574行）中，为什么将空格等特殊字符映射到 `chr(ord(c) + 256)`？这种设计解决了
    BPE 处理中的什么痛点？
  - 4. 尝试手工推演：给定两个字节序列 b'he' 和 b'llo' 可以合并为 b'hello'，如果它们各自的秩分别为 100 和 200，合并后秩为 300，在
    Tekken 提取过程中会如何被处理？
  - 5. 对比 `MistralVocabConverter._tekken_tokens()`（765-786行）中特殊令牌与普通令牌的生成顺序，解释为什么需要
    `num_special_tokens` 偏移量
  'no': 3
  title: MistralVocab 的 Tekken 合并规则逆向工程
- contents:
  - 本章定义了四种词表类（BpeVocab、SentencePieceVocab、LlamaHfVocab、MistralVocabConverter），它们都遵循统一的
    Vocab 协议（272-273行）。基于源码回答：
  - 1. 这些类是如何通过 `all_tokens()` 方法向 GGUFWriter 提供统一迭代接口的？返回值的共同结构是什么？
  - 2. 对比四种实现对"新增令牌"（added_tokens）的处理差异：
  - '   - BpeVocab 将其标记为什么类型？'
  - '   - SentencePieceVocab 标记为什么类型？（参考 `SentencePieceVocab.added_tokens` 和 `__repr__`）'
  - '   - LlamaHfVocab 的 `get_token_score` 返回什么值？为什么？'
  - '   - MistralVocabConverter 在 Tekken 模式下如何处理特殊令牌的 ID 偏移？'
  - 3. 如果你需要为一个新的分词器格式实现适配器，应该参考哪个类的设计？为什么？（考虑 `NoVocab` 的极简设计）
  - 4. 观察 `LlamaHfVocab` 的 `has_newline_token()` 方法（527-528行），思考为什么需要单独检查换行符 `<0x0A>`
    而不是普通字符 `\n`？
  'no': 4
  title: 跨词表类型的适配器模式实践
learning_targets:
- 理解 SpecialVocab 如何统一管理和校验 BOS/EOS/UNK 等特殊令牌及其 ID
- 掌握 BPE 分词器（慢速/快速格式）的加载逻辑与 ID 连续性校验机制
- 理解 SentencePiece 模型的双路径查找策略与原生类型映射原理
- 掌握 LlamaHfVocab 如何利用 Transformers 库实现 HF 生态的词表适配
- 深入 MistralVocab 对 SPM 与 Tekken 双引擎分词器的动态路由机制
- 理解 MistralVocab 内部 SPM/Tekken 令牌生成方法（_sentencepiece_tokens/_tekken_tokens）的具体实现
- 理解 Tekken 模型中 BPE 合并规则的逆向提取算法与字节级 Unicode 编码转换
- 掌握 GGUF 词表写入的接口协议（add_to_gguf）与令牌类型标记体系
life_analogy:
- 想象**多语言海关通关系统**的运作流程：
- '- **SpecialVocab** = 海关的**证件核验科**：专门处理 VIP 证件（BOS/EOS 等外交护照），检查签证有效期（ID 范围校验），并决定是否放行（写入
  GGUF 元数据）'
- '- **BpeVocab** = **欧美护照通道**：识别标准蓝本护照（vocab.json）和电子护照（tokenizer.json），严格检查护照号码是否连续（ID
  连续性），区分普通旅客（NORMAL）和外交人员（CONTROL）'
- '- **SentencePieceVocab** = **亚太证件通道**：需要专用识别设备（sentencepiece 库），能精确区分证件类型（IsUnknown→UNKNOWN、IsControl→CONTROL），保留原始评分（Score）'
- '- **LlamaHfVocab** = **万能翻译官**：借助外交部认证系统（AutoTokenizer），能识别特殊加密字符（BYTE 类型的 <0x00>
  格式），处理兼容新旧外交规则'
- '- **MistralVocab** = **双引擎检查闸机**：根据持有的证件类型（SPM 或 Tekken 芯片）自动切换识别模式（内部集成 _sentencepiece_tokens
  和 _tekken_tokens 两套处理流水线），特殊通道号码需要加上偏移量才能得到完整通行证号'
- '- **bytes_to_unicode** = **字符熔炉**：将特殊的控制字符和空格"熔炼"成高位 Unicode（编码到 256+ 区间），就像把易燃易爆品装入特殊容器，防止在通关系统中引发混乱'
'no': 62
summary:
- concept: SpecialVocab
  desc: 特殊令牌户籍管理员，负责 BOS/EOS/UNK 等 ID 校验、多源配置加载与 GGUF 写入路由
- concept: BpeVocab
  desc: GPT-2 词表解析专家，双格式兼容（vocab.json/tokenizer.json），严格校验新增令牌 ID 连续性
- concept: SentencePieceVocab
  desc: SPM 模型类型侦探，双路径查找策略，原生映射 UNKNOWN/CONTROL/UNUSED/BYTE 类型
- concept: LlamaHfVocab
  desc: HF 生态统一适配器，集成 AutoTokenizer，通过正则识别字节令牌（BYTE），拒绝 Llama3 格式
- concept: MistralVocab
  desc: Mistral 分词器入口，负责文件发现与类型识别（SPM/Tekken），内部集成双引擎令牌生成方法
- concept: MistralVocab._sentencepiece_tokens
  desc: Mistral SPM 模式令牌生成器，遍历原生 SPM 模型精确映射 UNKNOWN/CONTROL/UNUSED/BYTE 类型
- concept: MistralVocab._tekken_tokens
  desc: Mistral Tekken 模式令牌生成器，处理特殊令牌偏移与字节级 BPE 令牌转换
- concept: MistralVocabConverter
  desc: 双引擎转换器，处理 SPM/Tekken 令牌生成、特殊令牌属性及 BPE 合并规则逆向
- concept: BaseVocab/Vocab
  desc: 协议基类，定义词表类的标准接口（tokenizer_model、name、all_tokens）
- concept: NoVocab
  desc: 无词表占位符，用于标记无集成词汇表的模型
- concept: extract_vocab_merges_from_model
  desc: BPE 合并规则逆向工程，从 _mergeable_ranks 反推最优二分合并路径
- concept: bytes_to_unicode
  desc: 字节级 Unicode 熔炉，将敏感字节映射到 256+ 高位编码避免解析歧义
- concept: TokenType 映射体系
  desc: GGUF 令牌类型标准：NORMAL（普通）、CONTROL（控制）、BYTE（字节）、USER_DEFINED（自定义）
- concept: ID 连续性守卫
  desc: 强制要求新增令牌 ID 必须紧接基础词表连续排列，防止词汇表碎片化
