  name: MistralVocabConverter：Tekken核心的"转换引擎"
  'no': 6
  points:
  - '**SPM令牌生成**：`_sentencepiece_tokens` 遍历SPM模型词汇，使用原生IsUnknown/IsControl/IsUnused/IsByte方法精确分类，保留原始分数'
  - '**Tekken令牌生成**：`_tekken_tokens` 处理Tekken格式，特殊令牌（0到num_special_tokens-1）标记为CONTROL，普通令牌从`num_special_tokens`开始，通过`token_bytes_to_string`转换字节为Unicode字符串'
  - '**ID空间偏移处理**：`get_token_id` 在查询时自动为Tekken令牌加上`num_special_tokens`偏移量，对外表现为连续ID空间；SPM模式直接返回索引'
  - '**特殊令牌属性族**：提供`bos_id`/`eos_id`/`pad_id`/`unk_id`等属性快捷访问特殊令牌ID，以及`bos_token`/`eos_token`/`pad_token`/`unk_token`反向查询字符串表示，pad_token缺失时自动回退到eos_token'
  - '**统一输出接口**：`all_tokens` 根据tokenizer类型路由到SPM或Tekken生成器，向GGUFWriter提供一致的(bytes,
    float, TokenType)迭代器'
  - '**BPE合并规则逆向工程**：`extract_vocab_merges_from_model` 从Tekken模型的`_mergeable_ranks`（字节串→秩映射）反向推导合并规则，通过遍历所有可能的二分点找到最优分割（基于秩的和最小化），按秩排序后重建BPE训练时的合并优先级'
  - '**字节级Unicode编码**：`bytes_to_unicode` 生成256个字节到Unicode字符的映射表，避开空白字符和控制字符，使用高位Unicode（256+）表示空格等敏感字符，解决BPE处理空格时的歧义问题；`token_bytes_to_string`
    利用此映射将原始字节串转换为可打印字符串'
