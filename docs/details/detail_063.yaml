  'no': 1
  points:
  - '**核心职责定位**：专门负责处理模型中的"身份象征"令牌（BOS/EOS/UNK/SEP/PAD等），以及聊天模板和合并规则，是连接配置元数据与GGUF文件的桥梁'
  - '**多源加载策略**：`_load` 方法按优先级依次尝试从 tokenizer.json（包含merges和post_processor）、config.json（补充缺失的token
    id）、merges.txt（备选BPE规则）中加载，形成冗余容错机制'
  - '**新增令牌范围校验**：`_set_special_token` 严格检查ID有效性，拒绝负数和超出n_vocab范围的ID，防止越界访问导致的内存错误'
  - '**BPE合并规则格式兼容**：处理merges.txt的注释行跳过逻辑，处理旧格式空格分隔和新格式（transformers 4.45+）的列表嵌套结构，特别处理空格字符的Unicode编码转换（chr(ord(c)+256)）'
  - '**聊天模板优先级**：优先使用chat_template.jinja文件，其次chat_template.json，最后tokenizer_config.json中的定义，支持additional_chat_templates目录下的多模板管理'
  - '**GGUF写入接口**：`add_to_gguf` 通过动态方法调用（getattr(gw, f''add_{typ}_token_id'')）将特殊令牌ID、添加标志和聊天模板注册到GGUFWriter，实现类型自动路由'
  - '**调试支持**：`__repr__` 提供 merges 数量、特殊令牌 ID 映射和添加标志的概览，便于开发调试'
