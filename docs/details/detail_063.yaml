  - '**条件化依赖加载**：在模块级别（__main__）尝试导入mistral_common，若失败则设置标志位，类的初始化时才真正抛出错误，提供友好的错误提示'
  - '**智能文件发现**：扫描目录下所有文件，优先选择tekken.json，其次选择版本号最高的spm模型文件，支持通过`get_one_valid_tokenizer_file`（新版API）或`_filter_valid_tokenizer_files`（旧版兼容）两种策略'
  - '**类型动态路由**：根据加载的tokenizer实例类型（Tekkenizer vs SentencePieceTokenizer）动态设置MistralTokenizerType，决定后续使用`_tekken_tokens`还是`_sentencepiece_tokens`生成逻辑'
  - '**GGUF语义映射**：`gguf_tokenizer_model` 属性将SPM类型映射到"llama"模型类型，Tekken类型映射到"gpt2"模型类型，确保GGUF文件中的元数据与llama.cpp推理引擎的预期匹配'
  - '**SPM令牌生成实现**：`_sentencepiece_tokens` 直接访问Mistral内部封装的SentencePiece模型（`self.tokenizer._model`），遍历词汇表，利用原生IsUnknown/IsControl/IsUnused/IsByte方法进行类型映射，保留原始分数'
  - '**Tekken令牌生成实现**：`_tekken_tokens` 处理Tekken格式，特殊令牌（0到num_special_tokens-1）标记为CONTROL，普通令牌通过`token_bytes_to_string`将字节串转换为Unicode字符串后标记为NORMAL'
  - '**名称标识**：`tokenizer_name` 属性组合 "mistral-" + 类型 + 版本号，提供唯一的分词器标识'
