exercises:
- contents:
  - 阅读 examples/json_schema_to_grammar.py 第449-530行与第232-244行，追踪以下 Schema 转换的完整调用链：
  - '1. {"type": "object", "properties": {"name": {"type": "string", "minLength":
    1}}, "required": ["name"]}'
  - '2. {"oneOf": [{"type": "string"}, {"type": "number"}]}'
  - 回答问题：
  - '- 上述 Schema 会调用 visit() 中的哪些分支？'
  - '- _build_object_rule 如何处理 required 属性？'
  - '- 最终生成的 GBNF 规则文本大概是什么样子？'
  'no': 1
  title: 追踪 JSON Schema 到 GBNF 的转换全过程
- contents:
  - 阅读 examples/json_schema_to_grammar.py 第312-430行的 _visit_pattern 方法，尝试理解以下正则的转换：
  - 1. ^[A-Z][a-z]+$（大写开头的单词）
  - 2. ^\d{3}-\d{4}$（电话号码格式）
  - 3. ^(.+)\1$（带反向引用的复杂模式）
  - 回答问题：
  - '- join_seq() 函数如何合并连续字面量？为什么需要优化？'
  - '- sub_rule_ids 缓存机制在 {m,n} 量词中如何复用规则？'
  - '- 第三个模式会被正确转换吗？为什么不支持反向引用？'
  'no': 2
  title: 深入正则翻译器
- contents:
  - 阅读 examples/pydantic_models_to_grammar.py 第60-100行的类型映射函数：
  - 1. 编写一个包含 str、int、float、Enum、list[str]、Optional[int]、Union[int, str] 的 Pydantic
    模型
  - 2. 调用 generate_gbnf_grammar_and_documentation 生成 GBNF
  - 3. 调用 get_primitive_grammar 追加依赖规则
  - 回答问题：
  - '- format_model_and_field_name 如何处理 MyEnum 这种缩写？'
  - '- list[str] 和 set[str] 生成的规则有何区别？'
  - '- 为什么 Optional[T] 和 Union[T, None] 会生成不同的规则名前缀？'
  'no': 3
  title: Pydantic 到 GBNF 的类型映射实验
- contents:
  - 阅读 examples/pydantic_models_to_grammar.py 第743-790行的 create_dynamic_model_from_function：
  - 1. 编写一个带类型注解和 Google 风格 docstring 的 Python 函数
  - 2. 用 create_dynamic_model_from_function 转换为 Pydantic 类
  - 3. 用 add_run_method_to_dynamic_model 验证 run() 方法可用
  - 回答问题：
  - '- 缺少类型注解或 docstring 时会抛出什么错误？'
  - '- docstring_parser.parse 支持哪些 docstring 风格？'
  - '- 转换后的模型如何与 generate_gbnf_grammar_and_documentation 衔接？'
  'no': 4
  title: 动态模型工厂的工作流
- contents:
  - 阅读 examples/json_schema_pydantic_example.py 全文与 examples/pydantic_models_to_grammar_examples.py
    第218-273行的 example_concurrent：
  - 1. 启动本地 llama-server
  - 2. 运行 example_concurrent，观察输出的多个函数调用
  - 3. 尝试修改 expected 字典中的某个参数值，再次运行观察报错信息
  - 回答问题：
  - '- create_completion 如何把 Pydantic 模型转换为 JSON Schema？'
  - '- TypeAdapter 与直接 model.schema() 的区别是什么？'
  - '- 如果 LLM 输出不符合预期，客户端会得到什么反馈？'
  'no': 5
  title: 结构化输出的端到端实验
learning_targets:
- 理解 SchemaConverter 如何将 JSON Schema 递归转换为 GBNF 文法
- 掌握正则表达式到 GBNF 的翻译机制（_visit_pattern 状态机）
- 熟悉 Pydantic 模型到 GBNF 的类型映射规则（map_pydantic_type_to_gbnf）
- 了解动态模型工厂如何从 Python 函数/字典生成 Pydantic 类
- 掌握结构化输出示例中 schema 注入与 JSON 校验的完整链路
- 理解嵌入服务并发测试如何验证 /embedding 端点的稳定性
life_analogy:
- 想象 GBNF 是一套语法警察的执法手册，而 JSON Schema 是嫌疑人的画像：
- '- SchemaConverter = 画像分析师，把模糊的画像（JSON Schema）翻译成清晰的执法手册条目（GBNF 规则）'
- '- _visit_pattern = 指纹比对师，把 ECMA-262 指纹（正则）转译为执法手册中的特征描述（GBNF 字符类与量词）'
- '- _build_object_rule = 档案整理员，处理必填项+可选项+额外项的复杂排列组合'
- '- PRIMITIVE_RULES = 执法手册的基础法条（true/false/null/string/number/object/array）'
- '- SPACE_RULE = 防止嫌疑人无限申诉的字数限制器，约束空格最多 1-2 个换行+20 个制表符'
- '- Pydantic 转换器 = 模型锻造厂，把 Python 装饰器（BaseModel）铸造成 GBNF 形状的标准化产品'
- '- 动态模型工厂 = 变形金刚，把普通 Python 函数和 OpenAI 字典变形为统一形态的 Pydantic 类'
- '- 文档生成器 = 翻译官，把 GBNF 技术语法翻译成 LLM 看得懂的 Markdown 说明书'
- '- server_embd = 质检员，反复按门铃（并发请求）测试大门（/embedding）是否每次都给出相同的回应（相似度≈1）'
'no': 8
summary:
- concept: '`SchemaConverter`'
  desc: JSON Schema 到 GBNF 的中央转换器，递归遍历 Schema 构建文法规则
- concept: '`BuiltinRule`'
  desc: 内置规则容器，封装字符串规则内容与依赖列表
- concept: '`PRIMITIVE_RULES`'
  desc: 6 种 JSON 基础类型预定义规则（string/number/boolean/null/object/array）
- concept: '`STRING_FORMAT_RULES`'
  desc: uuid/date/time/date-time 等特殊字符串格式规则
- concept: '`SPACE_RULE`'
  desc: 空格约束规则，限制模型生成过多空白
- concept: '`DOTALL/DOT`'
  desc: 正则 . 元字符匹配字符集（DOTALL 含换行，DOT 不含 \n\r）
- concept: '`RESERVED_NAMES`'
  desc: 保留名称集合，防止与内置规则重名
- concept: '`_build_repetition`'
  desc: 生成 {min,max} 重复规则，支持可选分隔符
- concept: '`_generate_min_max_int`'
  desc: 按位生成整数区间规则，支持负数与小数位数控制
- concept: '`_format_literal`'
  desc: 对字面量进行转义，生成符合 GBNF 的 "..." 字符串
- concept: '`not_literal`'
  desc: 生成否定字面量规则，如 [^a] 或递归的非匹配结构
- concept: '`_not_strings`'
  desc: 基于 Trie 树的非匹配字符串生成，用于 additionalProperties 的 key 约束
- concept: '`_add_rule`'
  desc: 规则去重与命名，自动添加数字后缀避免冲突
- concept: '`resolve_refs`'
  desc: '解析 $ref 字段，支持内部 # 指针与 HTTPS 远程加载'
- concept: '`_generate_union_rule`'
  desc: 生成 oneOf/anyOf 联合类型规则，使用 alternative- 前缀
- concept: '`_visit_pattern`'
  desc: 正则到 GBNF 翻译器，使用状态机+join_seq 字面量合并+sub_rule_ids 缓存
- concept: '`_resolve_ref`'
  desc: '引用规则解析，将 #fragment 转为 ref-name 规则'
- concept: '`_generate_constant_rule`'
  desc: const/enum 字面量生成，使用 json.dumps 处理嵌套结构
- concept: '`_add_primitive`'
  desc: 注入基础规则到规则表，自动递归添加依赖
- concept: '`visit`'
  desc: Schema 入口分发，按 type/oneOf/allOf/pattern 等字段路由到不同处理函数
- concept: '`_build_object_rule`'
  desc: 对象规则构建，处理必选/可选/额外属性的所有合法组合
- concept: '`format_grammar`'
  desc: 按规则名排序输出最终的 GBNF 规则文本
- concept: '`regex_to_grammar.py`'
  desc: 正则到 GBNF 的轻量子进程包装，构造最小结构调用主转换器
- concept: '`PydanticDataType`'
  desc: Pydantic 支持的数据类型枚举（含 triple_quoted_string 等扩展类型）
- concept: '`map_pydantic_type_to_gbnf`'
  desc: Python 类型到 GBNF 规则名的递归映射函数
- concept: '`format_model_and_field_name`'
  desc: 驼峰名转 kebab-case 格式
- concept: '`generate_list_rule`'
  desc: 生成 "," 分隔的列表规则模板
