exercises:
- contents:
  - 阅读 `tools/cli/cli.cpp` 与 `tools/mtmd/mtmd-cli.cpp` 中的类与代码片段，理解为什么 `cli_context`
    和 `mtmd_cli_context` 的方法会「无法被检测」但实际上是存在的：
  - 1. 观察 `cli_context` 的定义：它是如何封装的？它的数据成员（defaults, input_files 等）是如何被初始化的？
  - 2. 搜索关键方法的应用点，例如 `generate_completion(`, `load_input_file(`, `init_vision_context(`，看看它们在哪些地方被调用，由谁调用（是使用
    `.` 还是 `->`）？
  - 3. 理解 C++ 中，当你看到 `ptr->method()` 时，如何在头文件中找到对应的 `ClassName::methodName()` 定义？
  - 思考问题：
  - '- 为什么这些方法的「mapper」（对应的核心功能）是一样的，但「名称」的匹配规则需要优化？'
  - '- 如果给你一个不认识的 C++ 项目，你如何快速定位一个「在这行代码里调用了 `generate_xxx()` 」对应的类的名字？'
  'no': 1
  title: 类方法识别：从智能指针到声明
- contents:
  - 分析 `tools/cli/cli.cpp` 中的 `cli_context::generate_completion()`（行 100-205），理解其异步交互与可视化机制：
  - 1. `server_response_reader` 是如何工作的？`rd.next()` 返回的是什么？
  - 2. `dynamic_cast` 在这段代码中的作用是什么？为什么需要分别处理 `server_task_result_cmpl_partial` 和 `server_task_result_cmpl_final`？
  - 3. 观察 `console::set_display(DISPLAY_TYPE_REASONING)` 与 `console::log`，理解「推理过程」与「最终答案」是如何在终端上区分显示的。
  - 4. `should_stop()` 在这个循环中是怎么起作用的？与 `mtmd-cli` 中的 `g_is_generating` 有什么设计上的相通之处？
  - 回答问题：
  - '- 为什么要区分 ``（推理内容）与常规内容？在哪些类型的模型中，移除推理内容的显示会变得不可用？'
  - '- `verbose_prompt` 变量在生成前后是怎么改变控制台输出的？这对用户调试有什么价值？'
  'no': 2
  title: llama-cli 的流式生成可视化
- contents:
  - 分析 `tools/mtmd/mtmd-cli.cpp` 中 `mtmd_cli_context` 的完整生命周期以及媒体 bucked 与 KV cache
    的关系：
  - 1. 构造函数（行 74-104）中初始化了哪些组件？的顺序为什么重要？（例如：先初始化 model/ctx 再初始化 vision）
  - 2. 析构函数（行 106-109）负责释放什么？为什么需要显式调用 `llama_batch_free` 和 `common_sampler_free`？
  - 3. `init_vision_context()` 中 `mparams` 的字段分别代表什么意义？（例如 `image_min_tokens`, `flash_attn_type`,
    `mmproj_use_gpu`）
  - 4. `load_media()` 与 `check_antiprompt()` 在多模态流中分别扮演什么角色？它们如何与 `generate_response()`
    中的停止条件协同工作？
  - 5. `eval_message()` 中通过 `mtmd_tokenize` 和 `mtmd_helper_eval_chunks` 的处理过程是什么样的？为什么需要
    `chunks` 而不是直接处理？
  'no': 3
  title: llama-mtmd-cli 的多模态资源管理
- contents:
  - 对比三个工具的输入处理逻辑，理解通用性与特异性的设计选择：
  - 1. `llama-cli`：分析 `main()` 中如何处理命令行参数（`params.prompt`）与交互输入？两者如何结合？`console::readline`
    与 `params.multiline_input` 的关系是什么？
  - 2. `llama-completion`：`main()` 中的多行输入控制逻辑？`is_interacting` 与 `waiting_for_first_input`
    的状态机如何流转？`input_prefix`/`input_suffix` 在什么阶段被应用？
  - 3. `llama-tokenize`：为什么支持三种互斥输入（--prompt, --file, --stdin）？`read_prompt_from_file`
    以二进制模式打开文件有什么好处？`ingest_args` 在 Windows 上解决了什么核心问题？
  - 思考问题：
  - '- 如果你要为 llama.cpp 设计一个全新的「批量处理工具」，你会如何设计它的输入接口？命令行参数？

    - 在什么场景下，llama-completion 的使用比 llama-cli 更合适？它有哪些功能是 llama-cli 没有的？'
  'no': 4
  title: 三种 CLI 工具的输入处理对比
learning_targets:
- 掌握基于智能指针的 C++ 类方法识别方法，理解通过 `->` 操作符调用的类成员函数
- 深入理解 llama-cli 中 cli_context 的完整实现，包括构造、流式生成、文件输入和聊天模板格式化
- 剖析 llama-mtmd-cli 中 mtmd_cli_context 的生命周期管理、视觉上下文初始化与媒体加载机制
- 对比分析不同工具中命令行交互组件的设计模式与实现差异
life_analogy:
- 想象你正在学习一个复杂的「智能家居系统」的说明书。有时候，说明书上写的功能名称和它内部真正的「零件名」看起来不一样，但功能是一样的。
- '- **cli_context** = **空调遥控器的内部芯片**：你按下「制冷」按钮（方法调用），芯片（类）就知道去启动压缩机。虽然按钮上没写「压缩机启动」，但功能是一样的。'
- '- **mtmd_cli_context** = **智能电视的「大脑」**：负责协调屏幕（视觉）、音响（音频）和网络（文本输入）。构造它就像给电视装上大脑，能处理图像和声音，理解你的语音指令。'
- 在这个例子里，说明书（细纲）在描述「智能遥控系统」（功能），而我们手里拿的是电路板（具体代码）。我们需要把电路板上的每个电阻、电容、芯片（类方法）都识别出来，并知道它们提供了「智能遥控」里的哪些功能。
'no': 67
summary:
- concept: cli_context
  desc: llama-cli 的中央控制器：封装 server_context，管理消息历史、输入文件，提供聊天与会话管理接口
- concept: generate_completion()
  desc: 异步流式生成的核心，server_response_reader 逐 token 输出，集成推理可视化和 should_stop 中断
- concept: load_input_file()
  desc: 统一文件输入处理：文本读取为字符串，媒体以 raw_buffer 存储并标记，支持命令行与交互命令双路径
- concept: mtmd_cli_context
  desc: 多模态运行时核心：集成 LLM 上下文、视觉/音频编码器、聊天模板，管理位图与反提示词令牌
- concept: init_vision_context()
  desc: 视觉模型加载入口：配置 GPU、FlashAttention、图像 token 限制，调用 mtmd_init_from_file 完成加载
- concept: generate_response()
  desc: 多模态生成主循环：从采样器到解码，再到 EOG/反提示词/中断检测的完整流程
- concept: session_tokens
  desc: llama-completion 的会话状态载体，实现上下文前缀复用与 KV 缓存持久化
- concept: vocab_only
  desc: llama-tokenize 的轻量加载模式，仅加载词汇表不加载权重，实现秒级分词响应
