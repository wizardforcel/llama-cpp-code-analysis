    API 到传统 Chat Completion 的降级转换，支持 `instructions`（系统提示）、`input`（字符串或结构化消息列表）、`tools`（函数调用）、`reasoning`（思考链）等字段的语义映射'
  - '**Anthropic → OpenAI** `convert_anthropic_to_oai()`：解析 Anthropic 特有的 `system`
    提示（字符串或内容块数组）、`messages` 中的 `thinking`/`image`/`tool_use`/`tool_result` 块类型，转换为
    OpenAI 的 `messages`/`tools`/`tool_choice` 格式，并处理 `stop_sequences`→`stop`、`max_tokens`
    默认值 4096 的键名映射'
  - '**Grammar 触发器封装** `server_grammar_trigger`：包装 common_grammar_trigger 提供 JSON
    序列化/反序列化能力，支持词法触发、token触发与完整文本触发三种模式'
