  name: HTTP 服务器核心 —— 基于 cpp-httplib 的"地基承重墙"
  'no': 9
  points:
  - '**Pimpl 模式封装**：`server_http_context` 通过 `Impl` 内部类隐藏 `httplib::Server` 实现细节，对外暴露简洁接口'
  - '**构造与析构**：`server_http_context()` 初始化 Pimpl 指针；`~server_http_context()` 使用 default
    让 unique_ptr 自动管理资源'
  - '**初始化 `init()`**：配置 SSL（可选证书/密钥）、设置读写超时、注册全局 404/500 错误处理器、设置 socket 选项（SO_REUSEPORT）；构建双重中间件链——`middleware_validate_api_key`（支持多
    API Key 与公共端点白名单）与 `middleware_server_state`（未就绪时返回 503 或 loading.html）；配置 HTTP
    线程池（默认 n_parallel+4 线程）；注册 WebUI 静态资源（内嵌 index.html/bundle.js/bundle.css 或外部 public_path）'
  - '**启动与停止 `start()`/`stop()`**：支持 Unix Socket（.sock 后缀）与 TCP 端口绑定；自动端口分配（port=0
    时）；创建监听线程并等待 ready'
  - '**路由注册 `get()`/`post()`**：将底层 httplib Request/Response 转换为内部 `server_http_req`/`server_http_res`
    抽象，委托给 handler 后由 `process_handler_response()` 统一处理'
