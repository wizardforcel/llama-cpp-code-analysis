  name: HTTP 请求响应抽象与桥接 —— 跨协议统一的"数据胶囊"
  'no': 10
  points:
  - '**`server_http_req` 结构体**：聚合 `params`（路径+查询参数合并）、`headers`、`path`、`query_string`、`body`、`should_stop`
    回调；`get_param()` 提供默认值保护的参数访问'
  - '**`server_http_res` 结构体**：支持两种模式——非流式（`data` 字段完整响应体）与流式（`next` 回调函数逐块生成）；`is_stream()`
    方法判定响应类型'
  - '**请求日志** `log_server_request()`：过滤高频端点（/health、/models、/props、/metrics）避免日志刷屏，DEBUG
    级别记录完整请求/响应体'
  - '**数据转换层**：`set_headers()` 批量设置响应头；`get_params()` 合并路径参数与查询参数；`get_headers()`
    提取请求头 map；`build_query_string()` 构建 URL 编码的查询字符串'
  - '**响应处理器桥接** `process_handler_response()`：流式响应使用 `httplib::DataSink` 的 `set_chunked_content_provider`
    逐块写入，通过 `std::shared_ptr` 在 lambda 捕获中安全管理请求/响应生命周期，流结束时自动 reset；非流式响应直接 `set_content()`'
