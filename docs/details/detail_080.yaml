  name: 响应格式化与 SSE 流式输出 —— 数据包装的"多格式打印机"
  'no': 7
  points:
  - '**Embedding 响应封装** `format_embeddings_response_oaicompat()`：支持两种返回格式——浮点数组或 base64
    编码字符串，自动统计 `tokens_evaluated` 总数注入 usage 字段'
  - '**Rerank 响应封装** `format_response_rerank()`：按相关性分数降序排序，支持 TEI 格式（纯数组）与 OpenAI
    兼容格式（带 model/usage 元数据），`return_text` 控制是否返回原文'
  - '**Token 概率提取** `get_token_probabilities()`：从上下文 logits 提取指定索引的候选 token 列表，支持采样候选（`llama_get_sampled_candidates_ith`）与全词表两种模式，执行数值稳定
    softmax（减最大值防溢出）后按概率排序'
  - '**OpenAI 标准 SSE** `format_oai_sse()`：生成 `data: <json>\n\n` 格式，支持数组批量或单对象单条发送，遵循
    RFC 8895（空行终止）'
  - '**OpenAI Responses SSE** `format_oai_resp_sse()`：在标准 SSE 基础上增加 `event: <type>`
    字段，支持 `response.output_item` 等事件类型的区分'
  - '**Anthropic SSE** `format_anthropic_sse()`：自动检测输入是否包含 `event`/`data` 字段，若有则按
