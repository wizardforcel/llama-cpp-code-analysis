  name: server_tokens 类 —— 多模态 Token 的"集装箱式"封装
  'no': 1
  points:
  - '**双层数据结构设计**：`tokens` 数组承载文本 token 序列（`LLAMA_TOKEN_NULL` 占位媒体 token），`map_idx_to_media`
    建立 token 索引到 `mtmd::input_chunk_ptr` 的映射，实现文本与多模态内容的统一托管'
  - '**构造与生命周期管理**：默认构造、从 `mtmd::input_chunks` 或 `llama_tokens` 的构造、移动语义支持；删除拷贝构造防止意外复制；`clear()`
    显式清空两个关联容器；`empty()`/`size()` 状态查询'
  - '**位置与 Token 的双向映射**：`pos_next()` 与 `size_up_to_pos()` 处理多模态块的位置数（`n_pos`）与 token
    数（`n_tok`）差异，解决 Transformer 位置编码在图像/音频注入时的非对齐问题'
  - '**容器操作全家桶**：`push_back()` 三重载（单token/媒体块/另一tokens对象）、`insert()` 批量插入、`set_token()`
    定点修改、`get_text_tokens()` 提取纯文本序列'
  - '**索引访问与调试**：`operator[]` 提供安全的下标访问（const与非const版本），`str()` 生成调试字符串展示token与媒体索引分布'
  - '**边界安全与媒体管理**：`keep_first()` 支持 KV 缓存截断时安全清理孤立媒体块；`find_chunk()` 提供带异常保护的块查找；`get_common_prefix()`
    实现高效前缀比较（复用媒体块 ID 与大小校验）'
  - '**校验与序列化**：`validate()` 确保 token 在词汇表范围内且多模态块完整；`detokenize()` 过滤 `LLAMA_TOKEN_NULL`
    占位符；`process_chunk()` 调用 mtmd_helper 编码处理媒体数据；`clone()` 实现深拷贝（复制底层 chunk 指针）'
