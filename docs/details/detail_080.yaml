    FNV 哈希、调用 `mtmd_tokenize()` 分词，最终返回 `server_tokens` 对象'
  - '**混合输入解析** `tokenize_mixed()`：支持字符串、token数组、混合数组三种 JSON 输入格式，处理 `add_special`/`parse_special`
    标志，自动处理首段特殊标记'
  - '**子提示与多提示** `tokenize_input_subprompt()`/`tokenize_input_prompts()`：支持纯文本、纯 token、字符串+token混合、含
    `prompt_string` + `multimodal_data` JSON 的四种提示格式，批量处理返回 `server_tokens` 向量'
