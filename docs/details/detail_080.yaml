  - '**格式错误标准化** `format_error_response()`：将内部错误码映射为 OpenAI 兼容的 JSON 错误结构（`invalid_request_error`/`authentication_error`/`server_error`
    等），统一 HTTP 状态码（400/401/403/404/500/501/503）'
