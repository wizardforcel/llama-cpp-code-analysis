  - '**Base64 解码** `base64_decode()`：标准 Base64 字符串转原始字节流，支持 4 字节组块式解码与尾部填充处理（`=`  padding）'
  - '**FNV 哈希生成媒体 ID** `fnv_hash()`：基于 FNV-1a 算法（64 位）为图像/音频数据生成唯一标识，用于多模态块的重复检测与缓存键'
