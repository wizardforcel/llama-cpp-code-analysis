  'no': 11
  points:
  - '**代理请求构造** `proxy_request()`：从查询参数获取目标 URL，使用 `common_http_parse_url()` 解析；三层安全校验——Host
    非空、禁止 password 认证信息、协议白名单（仅 http/https）；自动补全空路径为 `/`'
  - '**头部清洗与转发**：遍历请求头，移除 `x-proxy-header-` 前缀（允许客户端通过 `X-Proxy-Header-Authorization`
    传递真实认证头），构造 `server_http_proxy` 对象并设置 600 秒（10 分钟）读写超时'
  - '**路由处理器**：`proxy_handler_post()` 与 `proxy_handler_get()` 分别注册 POST/GET 方法到 `/proxy`
    或 `/cors-proxy` 端点，统一委托给 `proxy_request()` 处理'
