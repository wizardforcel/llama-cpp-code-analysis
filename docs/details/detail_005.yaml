learning_targets:
- 理解 ModelBase 通用转换框架的核心流程：构造、index_tensors、dequant_model、prepare_tensors、prepare_metadata、write
- 掌握反量化入口 dequant_model() 如何处理 BitNet、FP8、GPTQ、compressed-tensors、ModelOpt 等多类已量化
  checkpoint
- 理解 NVFP4 静态打包 _nvfp4_pack / _repack_nvfp4 的超级块重排逻辑与 trivial scale 处理
- 理解 NVFP4 专家张量流式生成 _generate_nvfp4_tensors / _flush_nvfp4_experts 如何节流 MoE 内存峰值
- 掌握 tensor_force_quant 在不同子类（Dbrx、Mmproj、InternVision、Qwen3VL、Gemma3n、Phi4 Vision）中的精细化定制策略
- 理解 ModelBase.prepare_tensors() 的总流水线：1D / _norm.weight 收口 F32 与 TQ 退化 F16 的工程动机
- 理解 GptOssModel.dequant_model 的 MXFP4 短路逻辑及 MmprojModel.tensor_force_quant 对 mmproj
  模型的强制量化策略
- 熟悉 ModelBase.format_tensor_name / match_model_tensor_name / map_tensor_name 三件套在张量命名中的作用
- 掌握 Gemma3Model.norm_shift / Gemma3NModel.norm_shift / Gemma4Model.norm_shift 的差异及对量化精度的影响
- 理解 ModelBase 工厂方法与注册器机制如何把架构名映射到对应模型类
- 理解 TextModel/MmprojModel 子类的 set_vocab / set_gguf_parameters / modify_tensors 三大钩子如何协同工作
- 掌握 BertModel、DeepseekV2Model、Gemma3Model 等典型子类的张量重排（permute）与专家合并（modify_tensors）策略
life_analogy:
- 想象 GGML 的算子库是一家「工厂的车间矩阵」，每个算子是一台独立机床：
- '- **基础运算（add/mul/sub/div）** = 通用装配机，对形状完全相同的「物料箱」做逐件加工'
- '- **mul_mat** = 重型冲压机，把二维重量矩阵和向量矩阵压成新矩阵——深度学习的核心机床'
- '- **silu / relu / gelu** = 表面处理喷漆机，给线性输出加上非线性光泽'
- '- **rms_norm** = 标准化质检台：先量长度再按比例归一，避免个别超长零件拖垮整条流水线'
- '- **rope** = 角度编码转盘，让传送带上的零件根据「位置」转一个精确的角度，注入时空信息'
- '- **in-place 操作** = 原地翻新车间，旧零件不搬走直接改造，省一半搬运成本'
- '- **view 操作** = 透明容器贴标签——一个仓库，多个发货单，零额外库存'
- '- **量化（NVFP4/Q4_K/IQ）** = 压缩打包机：把浮点零件压成 4 位紧包装，到客户端再解压还原'
- '- **NVFP4 超级块** = 集装箱式包装：每 4 个 UE4M3 比例尺配 32 个 4-bit 货物，36 字节一箱'
- '- **专家路由（MoE 流式 flush）** = 流水线分拣站：先把所有「专家」分桶攒齐，再一次性打包发出，避免同时堆满 128 个专家箱'
- '- **tensor_force_quant** = 车间的「特殊工件处理单」：喷漆件要 F16 + 嵌入件要 F32，1D 细长件不能压太狠'
- '- **format_tensor_name / match_model_tensor_name / map_tensor_name** = 车间的「三维零件编号表」：每个零件都有
  ① 类型代码 ② 模具规格 ③ 完整料号，三者共同决定它走上哪条流水线'
- '- **prepare_tensors 总装车间** = 总调度长：先把外购压缩件（NVFP4）解包、内购压缩件（FP8/GPTQ）反量化；再按图图纸决定 1D
  件留 F32、敏感件按规则升级到 F16/F32；最后才把已整形的零件按统一规格入库'
- '- **Gemma norm_shift** = 工厂预补偿台：Gemma3 PyTorch 在 norm 后乘 (1+weight)，所以 GGUF 必须在
  quantize 前把 weight+1，让推理时 fused kernel 再乘 (1+(weight+1)) 还原正确值'
- ''
- 就像工厂经理要决定「哪些工件走精加工、哪些走压缩打包、哪些直接在原位翻新」，dequant_model / NVFP4 / tensor_force_quant
  也在为每个张量精打细算——既保住模型精度，又把内存峰值压在可承受范围内。
'no': 4
summary:
- concept: '`ModelBase.__init__`'
  desc: 转换器构造入口：load_hparams → index_tensors → 启发式 ftype → GGUFWriter 初始化；检测 NVFP4/MXFP4
    标志位
- concept: '`from_model_architecture`'
  desc: 工厂方法：把 HF 的 architectures  字符串映射到已注册的 ModelBase 子类
- concept: '`register` 装饰器'
  desc: 把子类注册到 _model_classes 索引；MMPROJ 与 TEXT 分桶管理
- concept: '`dequant_model()`'
  desc: 反量化入口，按 quant_method（bitnet/fp8/gptq/compressed-tensors/modelopt）分支解出 FP 主体，删去无用的
    scale 兄弟
- concept: '`dequant_simple()`'
  desc: weight * scale，按 block_size 广播；FP8 与 ModelOpt FP8 的共用反量化函数
- concept: '`dequant_gptq()`'
  desc: 解析 bits∈{2,4,8}，按 pack_dtype_bits 解包为 int 权重，再用 g_idx 索引 scales；bits=3 显式抛
    NotImplementedError
- concept: '`dequant_packed()`'
  desc: compressed-tensors pack-quantized 反向 unpack，按 num_bits/group_size 还原权重并 broadcast
    scale
- concept: '`dequant_bitnet()`'
  desc: 拆 uint8 为 4 个 nibble → 转为 (-1,0,1) → 除以 scale，1.58-bit 解包为 FP 主体
- concept: '`_nvfp4_pack()`'
  desc: ModelOpt nibble → ggml 超级块重排：4 个 UE4M3 scales + 32 个 4-bit qs = 36 字节/64 元素
- concept: '`_nvfp4_scale2_is_trivial()`'
  desc: 判定 scale2 / input_scale 是否接近 1.0，trivial 时跳过以节省 GGUF 张量数
- concept: '`_repack_nvfp4()`'
  desc: NVFP4 张量写入 GGUF（raw_dtype=NVFP4 绕过量化循环）+ 处理非平凡 scale2/input_scale + 剥离 language_model.
    前缀
- concept: '`_generate_nvfp4_tensors()`'
  desc: NVFP4 专家张量流式生成入口，按 (bid, proj) 分桶并 flush；非 NVFP4（如 FP8）跳过 ndim<2 标量 scale
- concept: '`_flush_nvfp4_experts()`'
  desc: 凑齐 n_experts 专家后 np.stack 成 [n_expert, out, in_super*64] 一次性写入，避免 MoE 内存爆峰值
- concept: '`tensor_force_quant()`'
  desc: per-tensor 强制量化策略，返回 GGMLQuantizationType 覆盖 ftype；Mmproj/Dbrx/InternVision/Gemma3n/Qwen2VL/Audio/Conformer
    各有定制
- concept: '`prepare_tensors()` 协作流'
  desc: NVFP4 → dequant → tensor_force_quant → 1D/_norm.weight 收口 F32 → TQ 退化 F16
    → 量化循环
- concept: '`GptOssModel.dequant_model()`'
  desc: MXFP4 短路：让 NVFP4/专属 repack 路径接管，不走通用反量化分支
- concept: '`format_tensor_name()`'
  desc: 按 MODEL_Tensor 枚举 + 可选 bid 槽位，生成标准 GGUF tensor 名（带 .weight/.bias 后缀）
- concept: '`match_model_tensor_name()`'
  desc: 反向匹配：当前 GGUF 名是否对应到指定 MODEL_Tensor + bid，常在 prepare_tensors / modify_tensors
    中判定
- concept: '`map_tensor_name()`'
  desc: 通过 gguf.TensorNameMap 把 HF tensor 名查表映射到 GGUF tensor 名，失败抛 ValueError
- concept: '`MmprojModel.tensor_force_quant`'
  desc: patch_embd.weight/patch_merger.weight 强制 F16/F32，忽略其它视觉张量
- concept: '`DbrxModel.tensor_force_quant`'
  desc: 所有 n_dims > 1 张量均允许走通用量化，便于专家权重大批量进入 Q4_K
- concept: '`Gemma3VisionModel.tensor_force_quant`'
  desc: input_projection → F16 + .embeddings. → F32；其余走默认 ftype
- concept: '`Gemma3nVisionAudioModel.tensor_force_quant`'
  desc: input_projection/input_proj → F16 + embeddings/stem → F32；MobileNetV5 stem
    不量化
- concept: '`ConformerAudioModel.tensor_force_quant`'
  desc: 音频 conv / depthwise / pointwise conv.weight 一律 F32，避免 BN 折叠后数值漂移
- concept: '`HunyuanOCRVisionModel.tensor_force_quant`'
  desc: 视觉塔 mm.0/mm.2 conv.weight 强制 F16/F32，避免 Metal IM2COL 的 BF16 bug
- concept: '`Gemma3Model.norm_shift` / `Gemma3NModel.norm_shift` / `Gemma4Model.norm_shift`'
  desc: 三种 RMSNorm 偏移值（1.0 / 0.0 / 0.0），决定 convert 时是否给 norm.weight +1，与运行时 fused
    kernel 一致
- concept: '`ModelBase.load_hparams`'
  desc: 静态方法：AutoConfig.from_pretrained → config.to_dict，失败回退 config.json；支持 InternVL/GlmASR/DeepSeekOCR
    等 text_config 重命名
- concept: '`ModelBase.index_tensors`'
  desc: 扫描 safetensors / pytorch_model.bin / 远端 HuggingFace 仓库 → model_tensors dict；支持
    lazy 与 eager 两种模式
- concept: '`TextModel.set_vocab` / `_set_vocab_*`'
  desc: 词表家族：GPT-2 BPE、SentencePiece SPM、Qwen 合并规则、Llama-HF、Mistral、PLaMo、InternS1、GLM、GLM-Edge、RWKV-World、Builtin
    GPT-NeoX/Llama-SPM、None、WPM 等 12 种加载路径
- concept: '`TextModel.set_gguf_parameters`'
  desc: 通用超参数写入：block_count、context_length、embedding_length、feed_forward_length、head_count/kv、rope_scaling、norm_eps、expert_count
    等
- concept: '`TextModel.get_vocab_base_pre`'
  desc: 按 chkhsh 哈希匹配 BPE 预分词器 → 写入 tokenizer.ggml.pre
- concept: '`TextModel._try_set_pooling_type`'
  desc: 读取 sentence_transformers modules.json 中 Pooling 模块配置，映射到 MEAN/CLS/LAST
- concept: '`TextModel.does_token_look_special`'
  desc: 启发式判断 token 是否为 CONTROL（<pad>/<mask>/<|...|>/<unused...> 等）
- concept: '`MmprojModel.set_gguf_parameters`'
  desc: 写入视觉/音频超参数：clip_has_vision_encoder / audio_encoder、image_size、patch_size、block_count、head_count、image_mean/std
    等
- concept: '`MmprojModel.find_vparam / find_aparam / _find_param`'
  desc: 在 hparams_vision / hparams_audio / dict 三种作用域下按候选 key 顺序查找参数
- concept: '`Gemma3NModel.set_gguf_parameters`'
  desc: 写入 altup_active_idx、altup_num_inputs、embedding_length_per_layer_input、shared_kv_layers、activation_sparsity_scale、sliding_window_pattern
- concept: '`Gemma4Model.generate_extra_tensors`'
  desc: 为 full_attention 层生成 proportional RoPE → ROPE_FREQS 张量（n_rot 维 1 + 剩余维 1e30）
- concept: '`DeepseekV2Model.set_gguf_parameters`'
  desc: 写入 MLA（kv_lora_rank、q_lora_rank、qk_nope/rope_head_dim、v_head_dim）、MoE 专家参数、YaRN
    log_mul
- concept: '`DeepseekV2Model.modify_tensors`'
  desc: 视觉过滤 + e_score_correction_bias 重命名 + kv_b_proj 拆分（K 部分转置） + 专家合并
- concept: '`LlamaModel.permute`'
  desc: 反转 HF 风格的 Q/K 拼接排列（reshape(n_head, 2, ...) → swapaxes → reshape）
- concept: '`LlamaModel.modify_tensors`'
  desc: VL 前缀过滤 + 语言模型前缀剥离 + undo_permute Q/K + block_sparse_moe.experts 三张量 3D 堆叠
- concept: '`StableLMModel._stack_qk_norm`'
  desc: 将 per-head q_layernorm / k_layernorm 收集齐后 stack 成单一 2D 张量
- concept: '`BaichuanModel._reverse_hf_permute*`'
  desc: W_pack 拆分为 Q/K/V 三段，每段分别做反向 HF permute
- concept: '`XverseModel._reverse_hf_permute`'
  desc: q/k_proj 单独反向 HF permute
- concept: '`FalconModel.modify_tensors`'
  desc: query_key_value 三段重排为 GGML 友好的 Q/K/V 连续布局
- concept: '`MPTModel.modify_tensors`'
  desc: act.scales 重命名（scales → act.scales）
- concept: '`MambaModel.modify_tensors`'
  desc: A_log 取负 exp、SSM_CONV1D squeeze、token_embd/output 等同检查后省略 output
- concept: '`Mamba2Model.modify_tensors`'
  desc: A_log → -exp、dt_bias → dt_proj.bias、SSM_NORM reshape 为 (n_group, d_inner/n_group)
- concept: '`BertModel._xlmroberta_set_vocab`'
  desc: XLM-RoBERTa 词表特殊加载：处理 precompiled_charsmap、tokenizer.model v1 区分、position_offset
    偏移
- concept: '`LazyTorchTensor`'
  desc: gguf.LazyBase 的 torch 后端实现：numpy() / from_safetensors_slice() / from_local_tensor()
    / from_remote_tensor() / __torch_function__()
- concept: '`get_model_architecture`'
  desc: 从 hparams.architectures 或 sub-config.architectures 解析架构名；非 HF Mamba/Mamba2
