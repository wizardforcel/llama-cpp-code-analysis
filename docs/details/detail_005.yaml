  name: 张量强制量化策略 —— tensor_force_quant 的「特种指令」
  'no': 6
  points:
  - '**为什么需要 per-tensor 强制策略？**'
  - '- LlamaModel.permute 之后 MoE 专家矩阵已 3D 化，常规 ftype 决策可能把专家量化压缩，但某些敏感性张量（如 attn v）应该走
    Q8_0'
  - '- 子类通过重写 tensor_force_quant 可以针对具体张量名/维度返回 GGMLQuantizationType 或 False'
  - '**典型用法盘点**'
  - '- DbrxModel：所有 >1D 张量强制可量化（让专家可以走 Q4_K）'
  - '- MmprojModel 默认规则：patch_embd / patch_merger 强制 F16/F32，避免视觉投影精度损失'
  - '- InternVision / Qwen2VL：position_embd 一律 F32'
  - '- Gemma3 / Gemma3n：input_projection 强制 F16，embeddings 强制 F32'
  - '- ConformerAudioModel：所有 audio conv.weight 强制 F32'
  - '- HunyuanOCRVisionModel：mm.0/mm.2 conv.weight 强制 F16/F32（规避 Metal IM2COL 的 BF16
