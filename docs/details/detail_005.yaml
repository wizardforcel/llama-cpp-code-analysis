  name: NVFP4 静态打包 —— 把 ModelOpt 布局塞进 ggml 超级块
  'no': 3
  points:
  - '**NVFP4 是什么？**'
  - '- NVIDIA Blackwell 时代的 4-bit 浮点量化（FP4 E2M1），ModelOpt 用 nibble 打包 + per-block
    UE4M3 scale + per-tensor scale2 + per-tensor input_scale'
  - '- llama.cpp 的 GGML 期望『4 个 UE4M3 scale + 32 个 4-bit qs』= 36 字节的「超级块」按 64 元素排列，因此必须重排'
  - '**_nvfp4_pack：把 ModelOpt 布局重排为 ggml 超级块**'
  - '- 把 weight reshape 成 (out, n_blocks, 8)，按 nibble 拆 lo/hi 并 stack → (out, n_blocks,
    16)'
  - '- scale 视为 E4M3，清掉符号位后当成 UE4M3（`& 0x7F`）'
  - '- qs 按列重排：每 4 个相邻 block 合成一组，得到 (out, n_super, 4 scales + 32 qs) = 36 列'
  - '**_repack_nvfp4：写入 GGUF + 处理非平凡 scale**'
  - '- 把 raw 数据当成 np.uint8 写入，raw_dtype=NVFP4，避免量化循环'
  - '- scale2 / input_scale 若接近 1.0（_nvfp4_scale2_is_trivial），跳过；否则另存为同名 `.scale`/`.input_scale`
    F32 张量'
  - '- 自动剥离 `language_model.` 前缀以匹配 GGUF 命名'
