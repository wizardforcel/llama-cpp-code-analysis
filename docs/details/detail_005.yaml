  name: 反量化入口 —— 把「已量化模型」还原成浮点原料
  'no': 2
  points:
  - '**为什么需要 dequant_model()？**'
  - '- HF checkpoint 经常以量化形式分发（BitNet、FP8、GPTQ、compressed-tensors、ModelOpt 等），llama.cpp
    的 GGUF 张量必须以 FP/BF 形态承载，否则会丢精度或触发后端不支持'
  - '- 这条入口位于 ModelBase.prepare_tensors() 中 NVFP4 处理之后，专做「把量化张量解出 FP 主体、把附属 scale/zero
    列入删除名单」两件事'
  - '**识别 quantization_config 的 quant_method 分支**'
  - '- bitnet：按位宽把 weight.uint8 拆成 4 个 nibble、转为 (-1, 0, 1) 再除以 scale'
  - '- fp8：使用 `_scale_inv` 或 `qscale_weight` 后缀做 `weight * scale`（按 block_size 广播）'
  - '- gptq：解析 bits∈{2,4,8}，把 qweight/qzeros 解包成 int 权重，再乘以按 g_idx 索引的 scales'
  - '- compressed-tensors：支持 float-quantized/int-quantized/naive-quantized（dequant_simple）和
    pack-quantized（按 num_bits/group_size 反向 unpack）'
  - '- modelopt：处理 NVFP4 之外的 FP8 通道缩放，并丢弃未用的 k/v scale'
  - '**辅助张量清理**'
  - '- 把 .k_scale/.v_scale/.activation_scale/.qscale_act 视为推理时不需要，一并 del'
  - '- 通过 tensors_to_remove + new_tensors 字典就地修改 self.model_tensors，避免引入额外内存峰值'
  - '**GptOssModel 的 MXFP4 短路**'
  - '- `GptOssModel.dequant_model` 重写后，若 `_is_mxfp4` 为真，直接 return，让 NVFP4/专属 repack
    路径（`repack_mxfp4` / `generate_extra_tensors`）接管'
