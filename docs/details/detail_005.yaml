  name: NVFP4 专家张量流式生成 —— 让 MoE 不爆显存
  'no': 4
  points:
  - '**为什么不能一次性合并专家？**'
  - '- 一个 128 专家 × 4 维 × 隐藏层规模的 MoE，一次 stack 会占用占数十 GB 临时内存'
  - '- _generate_nvfp4_tensors 采用「按 (layer, proj) 分桶、收集齐后一次性 flush」的策略，节流内存峰值'
  - '**专家识别与按层索引**'
  - '- 用正则 `experts.(\d+)\.(gate_proj|up_proj|down_proj)` 抽 expert_id、proj_type'
  - '- 用 `layers.(\d+)` 抽 layer id；同一 (bid, proj) 的所有 expert 入同一 expert_blocks 桶'
  - '**按桶 flush：_flush_nvfp4_experts**'
  - '- 当桶内 expert  达到 n_experts → 立即 np.stack 并 add_tensor，shape 标记 `[n_expert, out,
    in_super*64]`'
  - '- per-expert 的 scale2 / input_scale 也单独 flush 成 `[n_expert]` 的 F32 张量（仅在不全为 1
    时）'
  - '- flush 完成后清理桶，允许后续层复用同一组容器'
  - '**完成阶段清理**'
  - '- 循环结束再 flush 一次残余桶（应对 n_experts 推断失败的情况）'
  - '- 删除 consumed 张量避免被 prepare_tensors 二次量化'
