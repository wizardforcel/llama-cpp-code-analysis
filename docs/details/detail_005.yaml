  - '- detect NVFP4：解析 `quantization_config.quant_algo` 或 `hf_quant_config.json` 的
    `quantized_layers`，判断全局 / per-layer NVFP4，并设置 `_is_nvfp4` / `_is_mxfp4` 标志'
  - '- 若 `_is_mxfp4` 由 quant_method=“mxfp4”触发；per-tensor 混合精度下扫描 quantized_layers
