  name: ModelBase 通用转换框架 —— 整座「HF → GGUF」中央调度台
  'no': 1
  points:
  - '**ModelBase 在哪里？**'
  - '- 位于 convert_hf_to_gguf.py 的根级，所有 TextModel / MmprojModel / 视觉模型 / 文本模型都通过继承它获得通用能力'
  - '- 该单元聚焦于通用框架：`__init__` / `register` / `from_model_architecture` / `index_tensors`
    / `find_hparam` / `load_hparams` / `add_prefix_to_filename` / `set_type` / `set_gguf_parameters`
    / `write_vocab` / `write` / `generate_extra_tensors` / `modify_tensors`'
  - '**注册器与工厂方法**'
  - '- `@ModelBase.register("LlamaForCausalLM", ...)` 把子类挂到 `_model_classes[ModelType.TEXT][arch_name]`
    索引'
  - '- `from_model_architecture(arch)` 是工厂：arch 字符串 → 模型类；失败抛 NotImplementedError'
  - '- `print_registered_models()` 是 `--print-supported-models` 调试入口'
  - '**构造与启发式 ftype**'
  - '- `__init__` 中先 `load_hparams`（含 text_config 合并），再 `index_tensors`（含 lazy / remote
    加载），再按「第一个 >1D tensor 的 dtype」启发式设置 ftype'
  - '- 若启发式判定失败（无 >1D tensor），默认回退 MOSTLY_F16'
  - '**张量索引（index_tensors）**'
  - '- 优先扫描 `model-*.safetensors`；若无则扫描 `pytorch_model-*.bin`'
  - '- `model.safetensors.index.json` 的 weight_map 决定 part_names 与张量索引完备性检查'
  - '- `lazy=True` 时张量是 `LazyTorchTensor`；`lazy=False` 时直接 materialize 成 `torch.from_numpy(...)`'
  - '**辅助方法**'
  - '- `find_hparam(keys, optional=False)`：按候选 key 顺序找值，缺失时按 optional 决定抛 KeyError
    或返回 None'
  - '- `load_hparams(dir_model, is_mistral_format)`：AutoConfig.from_pretrained 失败时回退
    config.json；自动重命名 llm_config / thinker_config / language_config / lm_config /
    lfm 到 text_config'
  - '- `add_prefix_to_filename(path, prefix)`：用于 LoRA 适配器等场景'
  - '**抽象钩子与生命周期**'
  - '- `set_gguf_parameters()`、`write_vocab()` 在基类是抽象，子类必须实现'
  - '- `set_type()` 默认写 `GGUFType.MODEL`，MmprojModel 覆写为 `GGUFType.MMPROJ`'
  - '- `generate_extra_tensors()` 默认返回空；Llama3 / Gemma4 在此产生 ROPE_FREQS'
  - '- `write()` 是顶层入口：prepare_tensors → prepare_metadata → gguf_writer.write_header_to_file
    → write_kv_data_to_file → write_tensors_to_file → close'
  - '**generate_extra_tensors 与 modify_tensors 的协作**'
  - '- `prepare_tensors()` 主循环 `for name, data_torch in chain(generate_extra_tensors(),
    get_tensors())`：先吃 extra 再吃主张量'
  - '- `modify_tensors(data_torch, name, bid)` 默认实现 = `[(map_tensor_name(name), data_torch)]`；子类可重命名、拆分、过滤（如
    vision 投影、QKV 拆分、专家合并）'
