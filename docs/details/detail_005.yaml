    误伤'
  - '- 然后调 `dequant_model()` 处理剩余的 FP8 / GPTQ / compressed-tensors / modelopt FP8'
  - '- 再走 `chain(generate_extra_tensors(), get_tensors())` 主循环：逐张量走过 modify_tensors
    → tensor_force_quant → F32/F16 收口 → TQ 退化 → quantize → add_tensor'
  - '**1D 张量与 _norm.weight 收口 F32**'
  - '- `if n_dims <= 1 or new_name.endswith("_norm.weight"): data_qtype = GGMLQuantizationType.F32`'
  - '- 这是 GGML 算子库的硬约束：mul_mat 等算子只接受 F32 的 norm 输入'
  - '**FFN_GATE_INP / POS_EMBD / SSM_CONV1D / TIME_MIX_* / ALTUP_* / SSM_CONV1D_{Q,K,V}
