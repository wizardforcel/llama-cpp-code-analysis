exercises:
- contents:
  - 阅读 `./convert_hf_to_gguf.py` 中 `ModelBase.dequant_model()`（约 300-540 行），理解其 quant_method
    分发结构。
  - 1. `dequant_bitnet()` — 把 uint8 拆 4 个 nibble、转为 (-1, 0, 1)、再除以 scale
  - 2. `dequant_simple()` — FP8 / ModelOpt FP8 的 weight * scale（按 block_size 广播）
  - 3. `dequant_gptq()` — 解析 bits∈{2,4,8}，按 pack_dtype_bits 解包再用 g_idx 索引 scales
  - 4. `dequant_packed()` — compressed-tensors pack-quantized 反向 unpack
  - 5. modelopt 分支 — 只处理 FP8 通道缩放，删除 .量化_scale / .v_scale 附属子
  - 回答问题：
  - '- 为什么 `tensors_to_remove` 与 `new_tensors` 字典要分别就地修改 `self.model_tensors`？'
  - '- bits=3 的 GPTQ 为何被显式 `raise NotImplementedError`？这反映了哪些维护考量？'
  - '- `compressed-tensors` 中 `len(groups) > 1` 为何直接抛错？多组权重量化会带来什么额外难题？'
  - '- modelopt 分支处理 NVFP4 与 FP8 的策略差异是什么？'
  - '- `GptOssModel.dequant_model()` 中 `_is_mxfp4` 短路的作用是什么？它如何与 `generate_extra_tensors()`
    的 MXFP4 repack 协作？'
  'no': 1
  title: 解读反量化分支体系
- contents:
  - 阅读 `./convert_hf_to_gguf.py` 中 `_nvfp4_pack`（680-710 行）、`_nvfp4_scale2_is_trivial`（710-720
    行）、`_repack_nvfp4`（720-760 行），并对照 `_generate_nvfp4_tensors`（760-840 行）和 `_flush_nvfp4_experts`（840-890
    行）的调用关系。
  - 回答问题：
  - '- ModelOpt 布局 `weight.shape == (out, n_blocks, 8)` 经 nibble 拆 lo/hi 后为什么 reshape
    成 `(out, n_blocks, 16)`？'
  - '- 为什么 `scale.view(torch.uint8).numpy() & 0x7F` 把 E4M3 当作 UE4M3 使用？符号位在 GGML 推理时会怎样处理？'
  - '- 超级块重排 `[4 scales + 32 qs] = 36 字节/64 元素` 与 GGML 的 `block_q4_0` 36 字节布局有什么关系？'
  - '- `_nvfp4_scale2_is_trivial` 用 `<= 1` 元素 + `<1e-6` 容差，是出于什么工程考量？'
  - '- `_repack_nvfp4` 在写 raw_dtype=NVFP4 后为什么要立即处理非平凡 scale2 / input_scale？'
  - '- `_flush_nvfp4_experts` 中按 `sorted(key=lambda x: x[0])` 排序专家 ID 是为了什么？'
  - '- 当 `n_experts` 推断失败时，`_generate_nvfp4_tensors` 末尾的二次 flush 循环如何兜底？'
  - '- `_LinearAttentionVReorderBase._transform_nvfp4_weight` 在 NVFP4 + 线性注意力（Qwen3.5）场景下做了什么？为什么要把
    V head 从 grouped 重排到 tiled？'
  'no': 2
  title: 追踪 NVFP4 超级块重排
- contents:
  - 阅读 `ModelBase.tensor_force_quant`（约 670-675 行）及其在 `MmprojModel`、`DbrxModel`、`InternVisionModel`、`Qwen2VLVisionModel`、`Gemma3VisionModel`、`Gemma3nVisionAudioModel`、`Qwen25OmniModel`、`SmolVLMModel`、`GlmASRWhisperEncoderModel`、`Qwen2AudioEncoderModel`、`ConformerAudioModel`、`DeepseekOCRVisionModel`、`HunyuanOCRVisionModel`、`Gemma4VisionAudioModel`、`NemotronNanoV2VLModel`、`AudioFlamingo3WhisperEncoderModel`
    等子类中的重写版本。同时阅读 `prepare_tensors()`（约 890-1010 行）中 F32/F16 强制收口与 TQ 退化逻辑。
  - 回答问题：
  - '- 为什么 `n_dims <= 1 or new_name.endswith("_norm.weight")` 一律收口 F32？这是 GGML 算子库的硬约束吗？'
  - '- `FFN_GATE_INP / POS_EMBD / SSM_CONV1D / TIME_MIX_* / ALTUP_* / SSM_CONV1D_{Q,K,V}`
    列表强制 F32，是出于精度、动态范围、还是后端兼容性考虑？'
  - '- 在 TQ1_0 / TQ2_0 模式下，`TOKEN_EMBD / OUTPUT / ALTUP_ROUTER / LAUREL_{L,R}` 退化为
    F16 而非 Q4_K，是因为什么统计分布特性？'
  - '- `MmprojModel.tensor_force_quant` 为什么只对 `patch_embd.weight / patch_merger.weight`
    强制 F16/F32，而忽略其它视觉张量？'
  - '- `DbrxModel.tensor_force_quant` 直接返回 `n_dims > 1`，是为了让所有 >1D 张量都「可量化」，这样做的工程动机是什么？'
  - '- `Gemma3VisionModel.tensor_force_quant` 对 `input_projection` 强制 F16 是为了解决哪个已知
    issue？'
  - '- `Gemma3nVisionAudioModel.tensor_force_quant` 对 `stem` 也强制 F32 是为什么？'
  - '- `ConformerAudioModel.tensor_force_quant` 对 `_conv / .conv.weight` 强制 F32 与
    BN 折叠（`modify_tensors`）如何配合？'
  - '- `DeepseekOCRVisionModel.tensor_force_quant` 对 `neck / net_ / rel_pos` 强制 F32
    是出于什么考量？'
  - '- `HunyuanOCRVisionModel.tensor_force_quant` 对 `mm.0mm.2 conv` 强制 F16/F32 是为了规避哪个硬件后端的
    bug？'
  - '- `GptOssModel.dequant_model` 在 `_is_mxfp4` 时直接 return，是为了让哪个后处理路径生效？'
  - '- `format_tensor_name` / `match_model_tensor_name` / `map_tensor_name` 在 `prepare_tensors`
    与 `modify_tensors` 中如何协同工作？它们之间的关系是什么？'
  - '- `Gemma3Model.norm_shift` 返回 1.0、`Gemma3NModel.norm_shift` 与 `Gemma4Model.norm_shift`
    返回 0.0，这种差异在量化与运行时如何体现？'
  'no': 3
  title: 解码 tensor_force_quant 与 prepare_tensors 协作
