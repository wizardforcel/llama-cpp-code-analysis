  name: Gemma 家族 norm_shift —— RMSNorm 偏移值的差异化定制
  'no': 8
  points:
  - '**norm_shift 是什么？**'
  - '- Gemma 系列在 RMSNorm 之后乘以 `(1.0 + weight)`，所以 convert 时若直接把 weight 写入 GGUF，推理时
    fused kernel 又会再乘 (1+weight)，结果不对'
  - '- 为此 convert 时需要「预补偿」：`weight → weight + norm_shift`，使推理时 fused kernel 乘 (1+(weight+norm_shift))
    还原正确'
  - '**三种 norm_shift 值**'
  - '- `Gemma3Model.norm_shift` 返回 1.0：因为 Gemma3 的 PyTorch RMSNorm 内部乘 `(1.0 + self.weight.float())`'
  - '- `Gemma3NModel.norm_shift` 返回 0.0：Gemma3n 内部使用 `Gemma3p5RMSNorm` 但计算公式不同，无需预补偿'
  - '- `Gemma4Model.norm_shift` 返回 0.0：Gemma4 与 Gemma3n 一致'
  - '**对量化精度的影响**'
  - '- 偏移值会改变 weight 的数值范围：F32 时无影响，但若先 quantize 再加 shift 会出错，所以 norm_shift 必须在 quantize
    之前'
  - '- `prepare_tensors` 主循环里 `f_shift = self.norm_shift(name); if f_shift != 0.0:
