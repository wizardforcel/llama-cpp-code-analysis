  name: TextModel 通用框架 —— 词表、超参数与张量重排
  'no': 9
  points:
  - '**TextModel 的角色**'
  - '- 文本模型通用基类，继承自 ModelBase'
  - '- 主要添加：rope_parameters 镜像、block_count 计算、tensor_map 构建'
  - '- __init_subclass__ 检查子类是否声明 model_arch'
  - '**词表家族（_set_vocab_*）**'
  - '- `_set_vocab_gpt2`：调用 get_vocab_base + SpecialVocab'
  - '- `_set_vocab_sentencepiece` / `_create_vocab_sentencepiece`：处理 SPM 词表、added_tokens.json、tokenizer_config.json'
  - '- `_set_vocab_qwen`：处理 Qwen mergeable_ranks + 合并规则还原'
  - '- `_set_vocab_llama_hf`：使用 gguf.LlamaHfVocab'
  - '- `_set_vocab_mistral`：支持 SPM 与 Tekken 双模式'
  - '- `_set_vocab_plamo`：JSONL 格式处理'
  - '- `_set_vocab_interns1` / `_set_vocab_glm` / `_set_vocab_glmedge`：特殊家族定制'
  - '- `_set_vocab_builtin`：GGML 兼容词表加载'
  - '- `_set_vocab_rwkv_world`：RWKV 词表特殊处理'
  - '- `_set_vocab_none`：纯无词表模型'
  - '**通用超参数写入（set_gguf_parameters）**'
  - '- 写入 block_count、context_length、embedding_length、feed_forward_length、head_count、head_count_kv'
  - '- 处理 RoPE 类型（linear/yarn/longrope/dynamic/llama3）'
  - '- 处理 norm_eps / rms_norm_eps、expert_count、expert_used_count 等'
  - '**modify_tensors 默认实现**'
  - '- `new_name = self.map_tensor_name(name)`，然后返回 `[(new_name, data_torch)]`'
  - '- 子类通过 yield from super().modify_tensors(...) 链式调用'
  - '**get_vocab_base_pre**'
  - '- 加密 hash 匹配预分词器类型，写入 tokenizer.ggml.pre'
  - '- 自动生成的哈希表，由 convert_hf_to_gguf_update.py 维护'
  - '**get_vocab_base**'
  - '- 通过 AutoTokenizer.from_pretrained 加载'
  - '- 处理 added_vocab、added_tokens_decoder、UNUSED 填充'
  - '**辅助工具方法**'
  - '- `_try_set_pooling_type`：从 sentence_transformers modules.json 提取 MEAN/CLS/LAST'
  - '- `does_token_look_special`：启发式识别 CONTROL token'
