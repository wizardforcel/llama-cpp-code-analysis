summary:
- concept: '`Metadata.id_to_title`'
  desc: 连字符分隔的模型ID转标题格式，保留原有大小写结构
- concept: '`Metadata.get_model_id_components`'
  desc: 启发式解析模型ID六元组（名称/组织/基名/微调类型/版本/规模），处理40+种边界情况
- concept: '`apply_metadata_heuristic`'
  desc: 多源元数据融合（模型卡片/HF配置/目录路径），支持base_model三态（ID/URL/字典）
- concept: '`GGMLQuants`'
  desc: 基于ctypes的C库封装，配置25+种量化/反量化函数原型，实现Python对libggml的调用
- concept: '`ggml_quantize_chunk`'
  desc: C端核心量化函数，支持imatrix重要性矩阵，返回字节级压缩结果
- concept: '`compare_tensors`'
  desc: 位级对比算法，通过异或和unpackbits诊断差异，NaN视为特殊情况
- concept: '`quant_shape_to_byte_shape`'
  desc: 形状转换工具，确定量化后的字节张量维度
- concept: '`do_test`'
  desc: 主测试循环，三阶段验证（量化一致性/反量化一致性/随机f16鲁棒性）
- concept: K-quants/IQ-quants
  desc: 高级量化类型，测试时需注意大小写转换（q4_k→q4_K）
- concept: LoRA模式
  desc: 负参数量触发，自动从名称中剔除"LoRA"关键词避免冗余
