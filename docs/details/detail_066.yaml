  - 1. 解释第100-101行的 `t1.view(np.uint8) ^ t2.view(np.uint8)` 如何用于检测差异。
  - 2. 分析NaN处理的特殊逻辑（第103-105行）：为什么位级相等但数组不等时可以判定为通过？
  - 3. 设计一个场景：假设两个量化张量在最后一个块（block）的最后一位不同，描述 `compare_tensors` 会输出的诊断信息结构。
  - 4. 思考：为什么测试使用 `np.random.randn(8, 1024, 1024)` 作为基准数据，并将第一个通道置零（第117行）？
