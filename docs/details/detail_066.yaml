  - '- `compare_tensors` 是测试框架的"法官"，负责对 Python 与 C 的输出进行像素级审查'
  - ''
  - '**对比逻辑**：'
  - '- **快速路径**：使用 `np.array_equal` 进行整体比较，若一致直接返回'
  - '- **慢速路径（不一致时）**：进入字节级分析模式'
  - ''
  - '**位差异分析**：'
  - '- **重塑为块结构**：'
  - '  - 浮点张量：按量化块大小（block_size）重塑，每行代表一个量化块'
  - '  - 字节张量：按类型大小（type_size）重塑'
  - '- **异或运算找差异**：`t1 ^ t2` 生成差异掩码，逐位展开（`np.unpackbits`）统计'
  - '- **特殊场景识别**：NaN 处理'
  - '  - 若位级完全一致但数组不等，判定为包含 NaN（NaN != NaN），视为通过'
  - '- **诊断信息输出**：'
  - '  - 坏块数量与百分比'
  - '  - 最坏块的 ID、具体位差异数、原始数据样本'
  - '  - 总位差异统计（用于评估误差规模）'
  - ''
  - '**工程意义**：'
  - '- 当测试失败时，开发者能快速定位是全局性错误还是局部边界问题'
  - '- 位级对比比浮点容差比较更严格，确保跨语言实现的绝对一致性'
