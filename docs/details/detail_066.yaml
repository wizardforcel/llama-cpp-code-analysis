exercises:
- contents:
  - 阅读 `gguf-py/tests/test_metadata.py` 第22-96行，理解 `get_model_id_components` 的测试用例设计：
  - 1. 分析以下测试用例的设计意图：
  - '   - `Mixtral-8x7B-Instruct-v0.1`（标准场景）'
  - '   - `Meta-Llama-3-8B`（数字与基名混合）'
  - '   - `Qwen1.5-MoE-A2.7B-Chat`（子规模标签）'
  - '   - `llama-161M-100B`（权重规模与数据规模区分）'
  - 2. 思考：如果要支持 `Gemma-2-9b-it-SimPO` 这种新格式，需要在第几行添加测试？预期输出是什么？
  - 3. 检查LoRA相关测试（第92-95行），解释为什么负数total_params会触发不同的解析逻辑。
  'no': 1
  title: 元数据解析的边界探索
- contents:
