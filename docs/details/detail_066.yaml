learning_targets:
- 理解GGUF元数据机制的测试策略与验证方法
- 掌握`Metadata`类核心静态方法（`id_to_title`、`get_model_id_components`、`apply_metadata_heuristic`）的测试用例设计
- 理解多源元数据（模型卡片/HF配置/目录路径）融合策略的测试覆盖
- 掌握跨语言（Python/C）量化一致性的二进制级验证方法
- 了解基于`ctypes`的C动态库封装与函数原型配置技巧
- 理解位级差异分析在浮点数据对比中的诊断价值
life_analogy:
- 想象GGUF格式的测试体系是一家**精密仪器质检实验室**：
- '- **元数据测试** = **产品铭牌校验机**：检查每个出厂产品的标签（模型ID）是否能被准确拆解为厂商、型号、规格等结构化信息，即使标签印刷模糊（缺失字段）或格式怪异（特殊符号）也能容错处理。'
- '- **量化一致性测试** = **双盲对照实验**：Python实现和C实现像两位独立的化验员，对同一批样本（随机张量）进行压缩（量化）和还原（反量化），只有两人结果完全一致（位级相同）才算通过。'
- '- **compare_tensors** = **显微镜下的差异分析**：不仅判断"是否合格"，还要在不合格时放大到分子级别（位级别），报告具体是哪个数据块（block）的第几位（bit）出现了偏差。'
- '- **GGMLQuants类** = **翻译官**：通过ctypes这座桥梁，让Python测试脚本能够直接调用C语言编写的底层量化算法，实现跨语言的"握手协议"。'
- 就像质检实验室不仅验证产品功能，还要验证生产标准的可重复性，这套测试体系确保了GGUF作为通用模型格式的**跨语言、跨平台、位级一致**的可信度。
