learning_targets:
- 理解异步日志系统的生产者-消费者模式与环形缓冲区设计原理
- 掌握跨平台终端控制技术（Windows API与POSIX termios）的差异处理
- 熟练运用ANSI颜色代码与UTF-8/UTF-16编码处理实现终端美化
- 深入理解高级行编辑功能（历史记录、自动补全、光标管理）的实现机制
- 分析双模式设计（简单IO vs 高级显示）在兼容性与功能性之间的权衡
- 掌握多线程环境下终端输出的同步与互斥策略
- 理解UTF-8解码/编码、字符宽度计算与光标移动的字节级实现
- 掌握C风格API与C++类封装之间的桥接设计模式
- 辨析静态自由函数与类静态方法在控制台模块中的混合设计
- 理解控制台显示状态管理与颜色配置的懒更新策略
life_analogy:
- 想象llama.cpp的日志与控制台系统是一家**高端餐厅的后厨与前厅协作系统**：
- '- **异步日志(common_log)** = **传菜员与订单系统**'
- '  - 厨师（推理线程）做好菜（生成日志）后，直接放到**环形传送带**（环形缓冲区）上，不用亲自跑前厅'
- '  - **传菜员**（后台工作线程）专门盯着传送带，有新菜就按顺序送到顾客桌上（打印到终端/文件）'
- '  - 如果生意太好（缓冲区满），就换一条**更长的传送带**（自动扩容2倍），保证不丢单'
- '- **C接口桥接函数** = **餐厅的标准服务用语**'
- '  - 后厨（C++类）有很多专业术语和操作流程，但服务员（C接口）只需要说标准话术（函数调用）'
- '  - 这样即使后厨改造（重构），前厅服务（API）也不需要改变'
- '- **控制台显示(console)** = **餐厅的灯光与氛围系统**'
- '  - **display_type** = 不同场景的灯光模式：顾客指令是**暖黄色(PROMPT)**，思考过程是**灰色(REASONING)**，错误是**红色警报(ERROR)**'
- '  - 灯光师(set_display)只在需要切换场景时才调整灯光，避免频繁闪烁'
- '- **行编辑(readline)** = **顾客的个性化点单台**'
- '  - **简单模式(console::readline_simple)** = 快餐柜台：顾客写纸条，收银员直接录入'
- '  - **高级模式(::readline_advanced)** = 日式铁板烧：厨师（光标）在顾客面前现场操作，可以**左移右移**(Ctrl+方向键)、**回看上一条**(历史记录)、**自动补全**(Tab键推荐菜品)'
- '  - **统一入口(console::readline)** = 餐厅总调度，根据店面档次自动选择服务模式'
- '- **历史记录(history_t)** = **常客的点单记忆**'
- '  - 系统记住常客上次点的菜（历史条目），按上下键就能**翻阅老菜单**'
- '  - 如果顾客说"跟上次一样"，就直接复用；如果说"不要了"，就清空临时记录(end_viewing)'
- '- **UTF-8处理** = **多语言菜单翻译**'
- '  - 中文、日文、Emoji都是复杂的**组合字符**（多字节），需要专门的**翻译官**（decode_utf8/append_utf8）'
- '  - 就像餐厅服务员要准确理解外国顾客的手势（字节序列），并正确记录上菜顺序（光标位置）'
- '- **进度指示器(spinner)** = **等位时的转圈圈动画**'
- '  - 就像餐厅等位时的旋转灯，告诉顾客"菜在做，请稍等"（模型加载中）'
- '  - 独立的**灯光师**（线程）专门负责转灯，不影响后厨（主线程）做菜'
- 整个系统的精髓在于：**后厨（计算）与前厅（IO）分离，用缓冲区解耦，用颜色提升体验，用历史记录记住常客习惯**。
