summary:
- concept: common_log
  desc: 异步日志核心类，基于环形缓冲区与生产者-消费者模式实现线程安全日志
- concept: common_log_entry
  desc: 单条日志的封装，包含级别、前缀、时间戳和消息内容
- concept: 环形缓冲区(ring buffer)
  desc: 固定大小循环数组，实现O(1)入队出队，满时自动2倍扩容
- concept: C接口桥接
  desc: 通过common_log_init/add/flush等C函数封装C++类，提供稳定ABI
- concept: display_type
  desc: 终端显示类型枚举，定义RESET/INFO/PROMPT/REASONING/USER_INPUT/ERROR六种模式
- concept: set_display()
  desc: 懒更新式颜色设置，仅在颜色变化时输出ANSI转义序列
- concept: console::readline() vs ::readline_advanced()
  desc: 统一入口与高级编辑实现：前者是console命名空间的分发接口，后者是全局静态自由函数实现具体编辑逻辑
- concept: history_t
  desc: 历史记录管理器，支持双向浏览、防重复添加与浏览状态恢复
- concept: UTF-8处理三剑客
  desc: decode_utf8/append_utf8/prev_next_char_pos，处理多字节字符的编解码与定位
- concept: widths[]数组
  desc: 记录每个字符显示宽度，解决中文等宽字符的光标精确定位问题
- concept: getchar32()
  desc: 跨平台UTF-32字符读取，处理Windows高/低代理项与POSIX宽字符
- concept: spinner
  desc: 进度指示器，通过独立线程与退格符实现原地旋转动画
- concept: console::init/cleanup
  desc: 跨平台终端初始化与恢复，处理Windows API与POSIX termios差异
- concept: move_cursor/word_left/word_right
  desc: 光标移动与单词跳转，处理多字节字符与单词边界
- concept: common_log_flush
  desc: 通过pause+resume实现强制刷新，确保日志输出时序
- concept: common_log_verbosity_thold
  desc: 全局日志级别阈值，控制日志输出的详细程度
