exercises:
- contents:
  - 阅读 `common/log.cpp` 第151-207行（add方法）和第209-238行（resume方法），回答：
  - 1. 环形缓冲区满时的扩容策略是什么？为什么要把旧数据迁移到新数组？
  - 2. `add()` 和后台线程之间通过什么机制同步？为什么用 `cv.notify_one()` 而不是 `notify_all()`？
  - 3. `pause()` 方法中设置的 `is_end` 标记有什么作用？如果不设置会发生什么？
  - 4. 试估算：如果缓冲区默认256条，每条消息平均256字节，内存占用大约是多少？扩容后呢？
  'no': 1
  title: 分析异步日志的线程安全机制
- contents:
