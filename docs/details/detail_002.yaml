  name: TextModel：文本模型转换的中枢 —— 「超参数+词表+张量映射」的装配车间
  'no': 2
  points:
  - '**TextModel 如何从 `hparams` 提取关键超参数？**'
  - '- `block_count` 使用 `find_hparam(["n_layers", "num_hidden_layers", "n_layer",
    "num_layers"])` 容错查找'
  - '- `embedding_length / head_count / head_count_kv / feed_forward_length` 各自对应一组候选键'
  - '- 这种「候选键列表」模式让 TextModel 让 TextModel 能兼容 LLaMA、Mistral、Qwen 等不同家族的的命名差异'
  - '**RoPE 参数为什么放在 `rope_parameters`？**'
  - '- `self.rope_parameters = self.hparams.get("rope_parameters", self.hparams.get("rope_scaling"))
    or {}`'
  - '- 同时支持旧版 `rope_scaling` 与新版 `rope_parameters`，并镜像 `rope_theta`/`rope_type`'
  - '- `local_rope_theta` 用于「全局+滑动窗口」双 RoPE 配置（如 Step35）'
  - '**TextModel 默认走哪种词表方案？**'
  - '- `set_vocab()` 默认调用 `_set_vocab_gpt2()`，对应 GPT-2 BPE 风格词表'
  - '- 子类通过重写 `set_vocab` 选择 SPM（SentencePiece）、Mistral Tekken、PLaMo jsonl 等不同方案'
  - '**词表方案族（_set_vocab_*）各司各为？**'
  - '- `_set_vocab_gpt2()`：GPT-2 BPE，配合 `get_vocab_base()` 与 `get_vocab_base_pre()`
    哈希识别'
  - '- `_set_vocab_sentencepiece()` + `_create_vocab_sentencepiece()`：SPM 模型解析，输出
    token/score/type'
  - '- `_set_vocab_llama_hf()`：借助 LlamaHfVocab 屏蔽 transformers 底层复杂度'
  - '- `_set_vocab_mistral()`：spm/tekken 双模式，输出 BOS/EOS/UNK/PAD'
  - '- `_set_vocab_plamo()`：解析 jsonl 格式的 PLaMo 词表'
  - '- `_set_vocab_rwkv_world()` / `_set_vocab_glmedge()` / `_set_vocab_glm()` / `_set_vocab_interns1()`：专用词表'
  - '- `_set_vocab_builtin()`：无词表文件时回落内置 gpt-neox / llama-spm 词表'
  - '- `_set_vocab_none()`：占位方案（如 WavTokenizer 解码器）'
  - '**`get_vocab_base_pre()` 的哈希识别机制是什么？**'
  - '- 用一段固定校验文本编码后的 sha256 哈希唯一标识 BPE pre-tokenizer'
  - '- 命中则写入 `tokenizer.ggml.pre`（如 `llama-bpe`、`qwen2`、`deepseek-v3`、`tekken`）'
  - '- 未命中抛 `NotImplementedError`，提示更新 `convert_hf_to_gguf_update.py`'
  - '**`super().set_gguf_parameters()` 的复用模式如何工作？**'
  - '- 基类先调用 `super()` 完成通用写入（block_count、context_length、head_count 等）'
  - '- 子类再追加特殊参数（如 LLaMA 的 `rope_dimension_count`、Qwen 的 `mrope_section`）'
  - '- 这种「先父后子」的链式调用避免了字段重复写入'
  - '**prepare_metadata / write_vocab 的特化处理？**'
  - '- `TextModel.prepare_metadata()` 推导输出文件名（目录→naming_convention，模板→fill_templated_filename）'
  - '- `write_vocab()` 是仅写词表的特化流程，要求 `len(tensors) == 1`'
