  name: MmprojModel：多模态投影器转换 —— 「视觉/音频塔」独立打包术
  'no': 3
  points:
  - '**MmprojModel 与 TextModel 的根本区别是什么？**'
  - '- `model_type = ModelType.MMPROJ`，`model_arch = gguf.MODEL_ARCH.MMPROJ` 固定不变'
  - '- 通过 `raise TypeError` 强制子类必须设置 `模型_arch = MODEL_MODEL_ARCH.MMPROJ`'
  - '- 输出文件名自动加 `mmproj-` 前缀，与文本模型文件解耦'
  - '**它如何处理「视觉+音频」双编码器？**'
  - '- `has_vision_encoder / has_audio_encoder` 两个布尔标志控制各编码器是否启用'
  - '- 双编码器时 `block_count = 128`（占位值），单编码器时从 hparams 读取真实层数'
  - '- `hparams_vision` 与 `hparams_audio` 分别独立存储视觉/音频配置，互互不干扰'
  - '**`global_config` 的「时光机」机制是什么？**'
  - '- `self.global_config = copy.deepcopy(self.hparams)` 在初始化时备份原始 hparams'
  - '- `hparams = self.hparams_vision or self.hparams_audio or self.hparams` 之后只取某一子子配置'
  - '- 后续需要访问「未被覆盖的全局字段」（如 `norm_eps`）时，可回看 `global_config`'
  - '**子子配置隔离（get_vision_config / get_audio_config / find_vparam / find_aparam）？**'
  - '- `get_vision_config()` 读取 `vision_config`（或 mistral 格式的 `vision_encoder`）'
  - '- `get_audio_config()` 读取 `audio_config` / `whisper_config`'
  - '- `find_vparam()` / `find_aparam()` 各自在对应子子配置中做候选键容错查找'
  - '- `_find_param()` 是它们的通用底座，避免代码重复'
  - '**预处理配置（preprocessor_config）如何被读取？**'
  - '- 优先读取优先读取 `preprocessor_config.json`，其次 `processor_config.json`'
  - '- 自动展平嵌套字段（如 `media_proc_cfg`、`image_processor`）到根级别'
  - '- Mistral 格式直接复用 `mistral-common` 的 DATASET_MEAN/STD 常量'
  - '**`tensor_force_quant` 为何对视觉塔特殊？**'
  - '- `.patch_embd.weight` 和 `.patch_merger.weight` 强制 F16/F32，避免量化损失视觉细节'
  - '- 子类可重写此方法针对特定子子子模块（如 Gemma3V 的 `input_projection`）定制量化策略'
  - '**set_type / prepare_metadata / write_vocab 的特化？**'
  - '- `set_type()` 写入 `GGUFType.MMPROJ`，与 TextModel 的的 MODEL 类型区分'
  - '- `prepare_metadata()` 给输出文件名前加 `mmproj-` 前缀'
  - '- `write_vocab()` 直接抛错：MmprojModel 不支持独立写词表'
