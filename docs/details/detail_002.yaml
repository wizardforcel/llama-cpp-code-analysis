  name: ModelBase：转换器的心脏 —— 编排一切的的「调度中枢」
  'no': 1
  points:
  - '**为什么 ModelBase 不能直接实例化？**'
  - '- 通过 `type(self) is ModelBase` 断言防止基类被直接使用，强制子类必须继承并实现 `model_arch` 与 `block_count`'
  - '- `model_arch: gguf.MODEL_ARCH` 是子类的身份标识，决定 GGUF 写入器使用哪种架构字符串'
  - '- `block_count: int` 与 `tensor_map: gguf.TensorNameMap` 由子类初始化，前者从 hparams 推导层数，后者按架构+层数生成张量名映射'
  - '**它如何识别模型归属 TEXT 还是 MMPROJ？**'
  - '- `_model_classes` 是 `dict[ModelType, dict[str, type[ModelBase]]]` 两级注册表'
  - '- `ModelType.TEXT`（值1）对应纯文本解码器，`ModelType.MMPROJ`（值2）对应多模态投影器'
  - '- `register()` 装饰器按 `modelcls.model_arch == gguf.MODEL_ARCH.MMPROJ` 自动决定放入哪个子表'
  - '**from_model_architecture 如何做到「架构名→模型类」自动匹配？**'
  - '- 工厂方法直接查表 `cls._model_classes[model_type][arch]`，找不到时抛出 `NotImplementedError`'
  - '- 调用方在 `main()` 中通过 `get_model_architecture()` 从 `config.json` 推断架构名（如 `LLaMAForCausalLM`）'
  - '**为什么需要惰性张量？**'
  - '- 默认 `lazy = not eager or remote_hf_model_id is not None`'
  - '- 大模型动辄数百 GB，eager 模式一次性加载全部权重会 OOM'
  - '- LazyTorchTensor 把每个权把每个 safetensors 分片包装成「按需生成」的代理，仅在实际读取时才执行 `numpy()` 转换'
  - '**GGUFWriter 是何时是何时配置的？**'
  - '- 在 `__init__` 末尾通过 `gguf.GGUFWriter(path=None, arch=..., endianess=..., ...)`
    创建'
  - '- `path=None` 表示先写入临时文件，最后由 `write()` 落盘到 `fname_out`'
  - '- `split_max-tensors` 与 `split_max-size` 控制分片策略（>0 时触发多文件输出）'
  - '**方法链 `write → prepare_tensors → prepare_metadata` 揭示了怎样的工作流？**'
  - '- `prepare_tensors` 负责所有张量处理（量化、反量化、张量名映射、专家合并、NVFP4 打包等）'
  - '- `prepare_metadata` 负责元数据装配（参数量统计、size_label、tokenizer 信息）'
  - '- `write` 是顶层入口：调 prepare → 写头 → 写 KV → 写 tensors → close'
  - '**张量命名体系（format_tensor_name / match_model_tensor_name / map_tensor_name）如何协同？**'
  - '- `format_tensor_name(key, bid, suffix)` 按 `MODEL_T_MODEL_TENSORS[arch]` 表 +
    层号生成标准 GGUF 张量名'
  - '- `match_model_tensor_name` 支持 `{bid}` 模板的双向匹配，量化决策与融合判断都依赖它'
  - '- `map_tensor_name` 通过 `TensorNameMap` 把 HF 原名（如 `model.layers.0.self_attn.q_proj.weight`）转为
    GGUF 命名空间'
  - '**modify_tensors 钩子与 tensor_force_quant 的局部覆盖是什么？**'
  - '- 基类 `modify_tensors` 只做改名，子类可重写以拆分/重排/融合张量（如 Baichuan 拆 QKV、Qwen2MoE 合并 experts）'
  - '- `fuse_gate_up_exps` 模式下把 `FFN_GATE_EXP` + `FFN_UP_EXP` 缓存并拼接为 `FFN_GATE_UP_EXP`'
  - '- `tensor_force_quant` 返回 `False` 跟随全局 ftype，返回 `GGMLQuantizationType` 则强制指定（如
    MmprojModel 对 patch_embd 强制 F16/F32）'
  - '**dequant_model 支持哪些反量化路径？**'
  - '- `bitnet`：1.58-bit 权重 + scale 反量化'
  - '- `fp8` / `compressed-tensors`：按 block_size 广播 scale'
  - '- `gptq`：g_idx + qweight + qzeros + scales 四件套还原'
  - '- `modelopt`：NVFP4 交给 `_generate_nvfp4_tensors`，FP8 走简单反量化'
  - '**NVFP4 打包链（_nvfp4_pack → _repack_nvfp4 → _generate_nvfp4_tensors → _flush_nvfp4_experts）**'
  - '- `_nvfp4_pack` 把 ModelOpt nibble 权重 + UE4M3 scale 重排为 36B 超级块'
  - '- `_repack_nvfp4` 处理单张量，顺带输出非平凡的 scale2 / input_scale'
  - '- `_generate_nvfp4_tensors` 全局扫描，识别 experts 张量并按层缓冲'
  - '- `_flush_nvfp4_experts` 在收齐某层所有专家后流式写出，避免显存爆炸'
  - '**prepare_tensors 中的量化决策链？**'
  - '- 先 NVFP4 重打包 → dequant_model → 逐张量调用 `tensor_force_quant`'
  - '- `n_dims <= 1` 或 `_norm.weight` 强制 F32；特定张量（TOKEN_EMBD/OUTPUT 等）按 ftype 选 F16'
  - '- 最终 `gguf.quants.quantize(data, data_qtype)`，失败回退 F16'
  - '**prepare_metadata 装配了哪些元数据？**'
  - '- `get_total_parameter_count()` 统计 total/shared/expert 参数量'
  - '- `Metadata.load()` 加载作者、模型名名、size_label 推导'
  - '- NVFP4/MXFP4 场景下 ftype 动态升级为 MOSTLY_NVFP4 / MOSTLY_MXFP4_MOE'
  - '**模块入口（main / parse_args / get_model_architecture / split_str_to_n_bytes）**'
  - '- `get_model_architecture` 处理 `architectures` / `ssm_cfg` / `text_config` 三级回退'
  - '- `main()` 走「打印支持列表 → 解析参数 → 查表取类 → 实例化 → write」流程'
  - '- `parse_args` 管理 --remote / --mmproj / --mistral-format / --fuse-gate-up-exps
    等开关'
  - '- `split_str_to_n_bytes` 解析 K/M/G 后缀，供 --split-max-size 使用'
