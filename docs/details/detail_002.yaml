  name: TextModel 的文本模型子类 —— 各显神通的「架构特战队」
  'no': 6
  points:
  - '**LlamaModel 如何承载多家族？**'
  - '- 一个类同时承载 LLaMA / Mistral / Mixtral / VLlama3 / Llava / Voxtral / IQuestCoder
    等'
  - '- 通过 `permute()` 反向 HF 的 Q/K 权重置换'
  - '- `set_vocab()` 中按需走 SentencePiece / Llama-HF / GPT-2 等不同分支'
  - '- `generate_extra_tensors()` 处理 Llama3/YARN 的 `rope_freqs` 频率生成'
  - '- 专家张量 `_experts` 缓冲后 `torch.stack` 为 3D 张量'
  - '**GPTNeoXModel 与 BloomModel 如何处理 QKV？**'
  - '- 二者都通过 `modify_tensors()` 把 query_key_value 拆分为 Q/K/V 三个独立张量'
  - '- 按 `n_head, 3, n_embed // n_head, n_embed` 形状 reshape 后 cat'
  - '- BloomModel 还会去掉 `transformer.` 前缀'
  - '**MPTModel / StableLMModel / RefactModel 等小众架构的差异处理？**'
  - '- MPTModel：`scales` 改名 `act.scales`；`_set_vocab_gpt2()` 失败时回退 SPM'
  - '- StableLMModel：按层缓冲 `_q_norms` / `_k_norms`，堆叠为统一 q/k norm 权重'
  - '- RefactModel：把合并的 `kv.weight` 切分为 ATTN_K 和 ATTN_V；FFN 切分为 GATE 和 UP'
  - '**BaichuanModel / XverseModel / FalconModel 的反置换与分拆？**'
  - '- BaichuanModel：拆 `W_pack` 为 ATTN_Q/K/V，按 `_reverse_hf_permute` 反置换'
  - '- XverseModel：使用 `model.layers.X.self_attn.q_proj.weight` 的反置换'
  - '- FalconModel：把 query_key_value 按 GQA 分组重新排序为标准 Q/K/V 布局'
  - '**Qwen 系如何做架构适配？**'
  - '- Qwen2Model：在 `modify_tensors` 中跳过 `mlp`/`vision_model`/`audio_tower` 等多模态字段'
  - '- Qwen2MoeModel：合并专家权重为 3D 张量，并支持聚合 gate_up_proj 拆分'
  - '- Qwen3MoeModel / Qwen3NextModel：在 Qwen2MoeModel 基础上继续扩展特殊张量转换'
  - '**DeepseekV2Model 的 MLA + MoE 复合战场？**'
  - '- `__init__` 加载原始架构用于 DeepseekOCR 等特殊变体'
  - '- 合并 routed experts 为 3D 张量并跳过 MTP 层'
  - '- 把 `kv_b_proj` 拆分为 `k_b_proj`（转置）与 `v_b_proj`'
  - '- 写入 `kv_lora_rank` / `q_lora_rank` / `key_length_mla` / `value_length_mla` 等
    MLA 参数'
  - '**Gemma 家族四部曲？**'
  - '- GemmaModel：RMS 权重 +1、；写入 head_dim 与 causal_attention=False'
  - '- Gemma3Model：通过 `norm_shift` 返回 1.0 实现 Gemma3RMSNorm 偏移'
  - '- Gemma3NModel：补充 altup_projections / altup_unembed_projections 的 3D 堆叠'
  - '- Gemma4Model：支持共享 KV 层、滑动窗口模式与 proportional RoPE'
  - '**Mamba/Mamba2 SSM 张量如何转换？**'
  - '- `A_log → -torch.exp(...)` 还原 A 矩阵'
  - '- `dt_bias` 改名 `dt_proj.bias`，`conv1d.weight` 去掉挤压维'
  - '- Mamba2Model 还需把 A、D 升维到 (...,1)，把 norm reshape 为 (n_group, d_inner // n_group)'
  - '**BertModel 系（DistilBert/Roberta/XLM-RoBERTa/NomicBERT/EuroBERT/ModernBERT）？**'
  - '- `set_vocab()` 默认走 `get_vocab_base()`，并加 phantom space（U+2581 前缀）'
  - '- XLM-RoBERTa 用 `sentencepiece.bpe.model` 的 proto 字段构造词表'
  - '- NomicBERT 支持 MoE 模式（`mlp.experts.mlp.w1/w2` 升维为 3D）'
  - '- RobertaModel 对 position_embeddings 做 `pad_token_id+1` 偏移'
