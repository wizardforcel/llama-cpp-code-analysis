  name: 注册器机制与模型分发 —— @ModelBase.register 的「中央调度室」
  'no': 4
  points:
  - '**为什么用装饰器而不是显式 `register()` 调用？**'
  - '- `@ModelBase.register("GPTNeoXForCausalLM")` 把模型类与 HF 架构名直接绑定'
  - '- 类定义后立即生效，无需额外手动加载注册表步骤'
  - '- `register` 是 classmethod，可以在基类上定义，子类共享同一注册表'
  - '**注册器如何同时支持「文本+多模态」两种归属？**'
  - '- `func` 内部通过 `modelcls.model_arch == gguf.MODEL_ARCH.MMPROJ` 判断归属'
  - '- 文本模型（如 LLaMA）自动进 `_model_classes[ModelType.TEXT]`'
  - '- mmproj 模型（如 Llava）自动进 `_model_classes[ModelType.MMPROJ]`'
  - '**一个类可以注册多个架构名吗？**'
  - '- 可以：`@ModelBase.register("LLaMAForCausalLM", "LlamaForCausalLM", "MistralForCausalLM",
    "MixtralForCausalLM", ...)`'
  - '- `for name in names: cls._model_classes[model_type][name] = modelcls` 遍历写入'
  - '- 这是 LLaMA 家族能同时承载 Mistral、Mixtral、IQuestCoder 等「近亲」的关键'
  - '**`print_registered_models` 有什么用？**'
  - '- 当用户传入未注册的架构名时，`--print-supported-models` 打印所有可用模型'
  - '- 帮助用户快速确认「我的模型是否被支持」'
  - '- 实际是 CLI 参数 `--print-supported-models` 触发的诊断工具'
  - '**工厂方法 `from_model_architecture` 是如何避免循环依赖的？**'
  - '- 它只依赖注册表（一个字典），不依赖任何具体模型类'
  - '- 因此可以在 main() 中先调用 `from_model_architecture` 再加载权重'
  - '- 这种「注册-查表」模式与 Java SPI、Python `entry_points` 异曲同工'
  - '**为什么注册表是 `dict` 而非 `Enum`？**'
  - '- 不同模型类（如 LlamaModel 与 Llama4Model）共享同一个 MODEL_ARCH.LLAMA 但行为差异大'
  - '- 用字符串键（架构名）索引比用 enum 灵活，能 1:N 映射'
  - '**`get_model_architecture()` 如何推断架构名？**'
  - '- 优先取 `hparams["architectures"][0]`'
  - '- SSM 模型回退到 `ssm_cfg.layer + "ForCausalLM"`'
  - '- 多模态模型回退到 `text_config.architectures[0]` / `vision_config.architectures[0]`'
