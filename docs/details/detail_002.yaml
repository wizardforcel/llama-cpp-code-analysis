learning_targets:
- 理解 ModelBase 作为转换器中央调度器的设计哲学与不可实例化的防御性编程机制
- 掌握 TextModel 通过「候选键列表」与「先父后子链式调用」兼容多种模型家族的工程技巧
- 理解 MmprojModel 如何通过 global_config「时光机」机制实现视觉/音频双编码器的解耦处理
- 熟悉注册器装饰器 @ModelBase.register 与 from_model_architecture 工厂方法的「注册-查表」解耦模式
- 掌握 LazyTorchTensor 通过操作树延迟求值解决大模型 OOM 问题的核心原理
- 了解模型归属判断（TEXT vs MMPROJ）与 LlamaModel 一类多注册的架构共用模式
- 掌握张量命名体系（format_tensor_name / match_model_tensor_name / map_tensor_name）的协同机制与 TensorNameMap
  查表原理
- 理解 modify_tensors 钩子与 tensor_force_quant 的局部量化覆盖策略
- 掌握 dequant_model 的多路径反量化（bitnet / fp8 / gptq / compressed-tensors / modelopt）
- 理解 NVFP4 打包链路（_nvfp4_pack → _repack_nvfp4 → _generate_nvfp4_tensors → _flush_nvfp4_experts）与
  MoE 专家权重的流式生成
- 掌握 prepare_tensors 的量化决策链（tensor_force_quant → ftype → dtype）与 prepare_metadata
  的元数据装配、size_label 推导
- 熟悉 TextModel 的多套词表方案（GPT-2 / SPM / Llama-HF / RWKV / PLaMo / Mistral / GLM 等）与 get_vocab_base_pre
  的 BPE pre-tokenizer 哈希识别机制
- 了解模块入口函数（main / parse_args / get_model_architecture / split_str_to_n_bytes）的协作流程与
  CLI 开关管理
life_analogy:
- 想象 convert_hf_to_gguf.py 是一座**「国际集装箱中转站」**——把 Hugging Face 仓库里各式样的零散货物（Hugging Face
  模型权重）打包成统一的 GGUF 集装箱，让 llama.cpp 这艘「远洋货轮」能跨平台、零依赖地搬运：
- '- **ModelBase 总调度中心** = 中转站的中央控制塔，负责识别货物类别、调度搬运机器人、维护集装箱装载规则'
- '- **TextModel 装配车间** = 文本集装箱专区，负责核对超参数标签、贴词表封条、记录张量仓位'
- '- **MmprojModel 多模态仓库** = 冷藏箱与危险品仓库专区，分别处理视觉图像与音频频谱，独立打包成 mmproj- 前缀集装箱'
- '- **_model_classes 两级注册表** = 仓库楼层索引：TEXT 在一楼，MMPROJ 在二楼，每类货物都有专属的「架构名→货架号」对照表'
- '- **@ModelBase.register 装饰器** = 货物入库时贴上的 RFID 标签，让分拣机器人一扫码就能定位到正确的货架与搬运流程'
- '- **from_model_architecture 工厂方法** = 仓库门口的「扫码枪」，扫一下模型架构名就能立刻调出对应的搬运流程'
- '- **LazyTorchTensor 延迟张量** = 「按需拆封的真空包装」：货物先以「货箱信息卡」形式登记，真正要装装时才从冷库里取出实物，大幅降低冷库（内存）占用'
- '- **global_config 时光机** = 多模态仓库的「备份磁带」：完整保留视觉/音频配置快照，万一后续流程覆盖了关键字段，还能倒带找回'
- '- **write → prepare_tensors → prepare_metadata 流水线** = 标准的「清点→打包→报关」流程，先核对货物（（张量），再贴报关单（元数据），最后封箱装装'
- '- **张量命名体系（map_tensor_name / format_tensor_name）** = 仓库的「条码系统」：每件货物从 HF 原名换标成 GGUF
  标准名，分拣机才能一眼识别'
- '- **modify_tensors 钩子** = 「改装工位」：某些货物（如 Baichuan 的 QKV、Qwen2MoE 的 experts）要在装箱前拆解或融合'
- '- **tensor_force_quant 局部覆盖** = 「特殊货物处理区」：某些高价值货物（如视觉 patch_embd）不走默认压缩，单独加保护层'
- '- **dequant_model 反量化** = 「拆封质检」：bitnet/fp8/gptq 等已压缩货物，先在中转站内还原成可打包的原始形态'
- '- **NVFP4 打包链** = 「真空压缩流水线」：把 ModelOpt 的 NVFP4 货物重排成 GGML 超级块，逐层收齐专家后流式封箱，避免爆仓'
- '- **TextModel 词表方案族** = 「多语种多语言封条工厂」：GPT-2 BPE、SentencePiece、LLaMA-HF、Mistral tekken、PLaMo
  jsonl 各有专线，靠 get_vocab_base_pre 的哈希指纹区分'
- '- **get_model_architecture / main / parse_args** = 「闸口与调度屏」：扫一眼 config.json 的 architectures，调度屏就派出对应的搬运流程'
'no': 1
summary:
- concept: '`ModelBase`'
  desc: 转换器抽象基类，通过 `type(self) is ModelBase` 断言禁止直接实例化，强制子类声明 model_arch
- concept: '`_model_classes`'
  desc: 两级注册表 dict[ModelType, dict[arch, class]]，按 TEXT/MMPROJ 分类管理所有模型类
- concept: '`@ModelBase.register(*names)`'
  desc: 装饰器工厂，按 model_arch 自动归类，支持一类多注册（如 LlamaModel 同时承载 Mistral/Mixtral）
- concept: '`from_model_architecture(arch)`'
  desc: 查表工厂方法，未找到时抛 NotImplementedError；main() 先调用此方法再加载权重
- concept: '`find_hparam([keys])`'
  desc: 候选键容错查找，依次尝试 `n_layers`/`num_hidden_layers`/`n_layer`/`num_layers` 等别名
- concept: '`map_tensor_name(name)`'
  desc: 通过 TensorNameMap 把 Hugging Face 张量名转换为 GGUF 命名空间
- concept: '`format_tensor_name(key, bid, suffix)`'
  desc: 按 MODEL_TENSORS[arch] 表 + 层号拼装标准 GGUF 张量名
- concept: '`match_model_tensor_name()`'
  desc: 支持 `{bid}` 模板的张量名双向匹配，用于量化决策与融合判断
- concept: '`super().set_gguf_parameters()`'
  desc: 先父后子的链式调用模式，父类写入通用字段，子类追加架构特有字段
- concept: '`modify_tensors()`'
  desc: 张量改名/融合钩子；基类仅改名，子类可拆分 QKV、融合 gate/up、合并 experts
- concept: '`tensor_force_quant()`'
  desc: 局部量化覆盖：返回 False 跟随全局 ftype，返回 GGMLQuantizationType 则强制指定
- concept: '`generate_extra_tensors()`'
  desc: 生成派生张量（如 Llama3/YARN 的 `rope_freqs`、MiniCPM 的 long/short factors）
- concept: '`dequant_model()`'
  desc: 多路径反量化：bitnet（1.58-bit）、fp8/compressed-tensors（block scale）、gptq（g_idx 四件套）、modelopt（NVFP4/FP8）
- concept: '`_nvfp4_pack()`'
  desc: 把 ModelOpt nibble 权重 + UE4M3 scale 重排为 36B 超级块（4 scales + 32 qs bytes / 64
    元素）
- concept: '`_repack_nvfp4()`'
  desc: 单张量 NVFP4 重打包，非平凡时额外输出 per-tensor scale2 / input_scale
- concept: '`_generate_nvfp4_tensors()`'
  desc: 全局扫描 NVFP4 张量，识别 experts 并按 (layer, proj) 缓冲，避免全量驻驻显存
- concept: '`_flush_nvfp4_experts()`'
  desc: MoE 专家权重流式写出：收齐某层全部后立即打包，支持 n_experts 未知的兜底
- concept: '`prepare_tensors()`'
  desc: 量化决策主入口：NVFP4 重打包 → dequant → 逐张量 tensor_force_quant → ftype→dtype 映射 → quantize（失败回退
    F16）
- concept: '`prepare_metadata()`'
  desc: 元数据装配：get_total_parameter_count 统计、Metadata.load 加载、size_label 推导、NVFP4/MXFP4
    动态升级 ftype
- concept: '`TextModel.set_vocab()`'
  desc: 词表方案调度器，默认走 `_set_vocab_gpt2()`，子类可重写为 SPM / Mistral / PLaMo 等
- concept: '`TextModel._set_vocab_sentencepiece()`'
  desc: SentencePiece 模型加载，输出 token/score/type 三元组
- concept: '`TextModel._set_vocab_mistral()`'
  desc: Mistral 专有分词器分词器双模式：spm 走 SentencePiece，tekken 走自定义合并表
- concept: '`TextModel.get_vocab_base_pre()`'
  desc: BPE pre-tokenizer 哈希识别：用 sha256 指纹查表决定 `tokenizer.ggml.pre`，未命中抛 NotImplementedError
- concept: '`MmprojModel.global_config`'
  desc: 在 __init__ 时 deepcopy 原始 hparams，后续覆盖后仍可回看未覆盖字段（如 norm_eps）
- concept: '`MmprojModel.get_vision_config()`'
  desc: 从 global_config 提取视觉子配置（vision_config / vision_encoder）
- concept: '`MmprojModel.find_vparam()`'
  desc: 在视觉子配置中做候选键容错查找，用于写入 vision_* 字段
- concept: '`LazyTorchTensor`'
  desc: 延迟张量框架，构建「操作树」按需生成；meta_with_dtype_and_shape 创建 meta 张量保留元信息
- concept: '`LazyTorchTensor.__torch_function__()`'
  desc: 拦截所有 torch 算子并经 `_wrap_fn` 包装为延迟操作，真正计算在 numpy() 时触发
- concept: '`get_model_architecture()`'
  desc: 从 config.json 推断 HF 架构名，三级回退：architectures → ssm_cfg → text_config
- concept: '`main()`'
  desc: 入口流水线：print_supported_models → parse_args → from_model_architecture 查表 → 实例化
    → write/write_vocab
