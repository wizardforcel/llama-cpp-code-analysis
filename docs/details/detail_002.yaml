  name: 延迟张量与远程加载 —— LazyTorchTensor的「按需读取」魔法
  'no': 5
  points:
  - '**LazyTorchTensor 是如何工作的？**'
  - '- 继承自 `gguf.LazyBase`，所有操作（索引、算术、转置）都被 `_wrap_fn` 拦截并构建「操作树」'
  - '- 真实计算延迟到生成到 `numpy()` 调用时才触发，按链式调用逆序执行'
  - '- `meta_with_dtype_and_shape` 创建 meta device 上的空张量，仅保存 dtype+shape 元信息'
  - '**为什么需要 `_tensor_type = torch.Tensor` 和 `_dtype_map`？**'
  - '- `_tensor_type` 让基类知道如何构造 wrapper'
  - '- `_dtype_map` 把 torch.dtype 映射到 numpy 类型，确保最终写出 GGUF 时类型正确'
  - '- `_dtype_byteswap_map` 在大小端转换时保证字节序正确'
  - '**`from_safetensors_slice` 与 `from_local_tensor` 有什么区别？**'
  - '- 前者把 safetensors 的内存切片 `st_slice[...]` 延迟生成为 torch.Tensor'
  - '- 后者把 `LocalTensor` 通过 `mmap_bytes()` 内存映射，配合 `torch.from_numpy` 零拷贝读取'
  - '- 二者返回的都是 lazy 代理，真正读取发生在 `.numpy()` 时'
  - '**远程模式 `--remote` 是如何不下载整个模型就工作的？**'
  - '- `SafetensorRemote.get_list_tensors_hf_model()` 通过 HF Hub API 仅获取张量元信息列表'
  - '- 每个 RemoteTensor 在 `from_remote_tensor` 中被包装成 lazy 代理'
  - '- 实际权重数据通过 HF Hub 的 Range 请求按需下载（HTTP Range 头）'
  - '**`__torch_function__` 如何拦截 torch 算子？**'
  - '- 重写 `torch.Tensor.__torch_function__` 协议，对 `torch.Tensor.numpy` 特判直接转发'
  - '- 其余算子经 `_wrap_fn` 包装为延迟操作节点，追加到操作树中'
  - '- 这使 LazyTorchTensor 能像普通 torch.Tensor 一样参与 reshape、推理、推理、读取时'
  - '**`prepare_tensors` 中如何「提前生成」关键张量？**'
  - '- 对 NVFP4/MXFP4 等需要全局视图的张量，用时，使用 `LazyTorchTensor.to_eager()` 立即计算'
  - '- 普通张量保持 lazy 状态，避免占用过多内存'
  - '- `model_tensors` 字典的 value 是 `Callable[[], Tensor]`，每次调用一次都返回新的 lazy 代理'
  - '**`to_eager` 与 `e_to_meta` 的对称设计是？**'
  - '- `to_eager(self)` 把 lazy 张量立即求值为真实 torch.Tensor'
  - '- `e_to_meta(self)` 把真实张量转回 meta 张量（保留 dtype+shape）'
  - '- 这对组合在 NVFP4 处理中被反复使用，确保按层合并时不丢失元信息'
