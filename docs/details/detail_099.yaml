  name: 量化点积性能基准 —— 量化计算的「百米计时赛」
  'no': 2
  points:
  - '**为什么是「百米计时赛」？**'
  - '- 这组 POC 的本质不是追求完整推理，而是盯着量化向量的点积性能做专项冲刺：谁算得快、谁数值稳、谁更接近理想结果。'
  - '- 其核心目标有两个：一是测性能，二是验数值一致性。'
  - ''
  - '**vdot.cpp 与 q8dot.cpp 的分工**'
  - '- `pocs/vdot/vdot.cpp` 更偏「标准对比实验」：用高斯随机浮点向量、量化块、标量实现和 ggml CPU 后端实现做并列比较。'
  - '- `pocs/vdot/q8dot.cpp` 则更聚焦：直接比较「简单自定义 Q4_0/Q4_1 × Q8_0 点积」与 ggml 类型 traits
    提供的 `vec_dot` 路径。'
  - '- 两者都像赛道计时器：同一条跑道（量化数据），不同跑法（简单实现 vs 库实现）。'
  - ''
  - '**全局定义与数据结构（__main__）**'
  - '- 两个文件都在文件头部（`__main__` 区域）定义了核心量化块结构：`block_q4_0`、`block_q4_1`、`block_q8_0`。'
  - '- 通过 `static_assert` 强制校验内存布局（如 `sizeof(block_q4_0) == sizeof(float) + QK4_0/2`），确保
    POC 层面的结构与 GGML 内部定义二进制兼容。'
  - '- 这体现了量化优化的基本心智：先弄清内存布局，再谈 SIMD 加速。'
  - ''
  - '**随机数据生成工具**'
  - '- `drawFromGaussianPdf()` 使用 Box-Muller 变换从均匀分布生成高斯分布随机数，并缓存第二个结果以减少计算。'
  - '- `fillRandomGaussianFloats()` 基于上述函数填充浮点向量，作为量化前的原始数据。'
  - '- `fillQ4blocks()`（模板函数）与 `fillQ80blocks()` 分别用随机数填充 Q4_0/Q4_1 和 Q8_0 量化块；其中
    Q8_0 版本会预计算块内元素和 `s` 并存储，为后续点积优化做准备。'
  - '- 高斯分布更接近真实模型权重/激活的统计特性，避免均匀分布导致的性能测试失真。'
  - ''
  - '**量化参考实现：quantize_row_q8_0_reference**'
  - '- 这是浮点到 Q8_0 的参考量化实现：遍历每个块，找到绝对值最大值 `amax`，计算缩放因子 `d = amax / 127`，然后四舍五入到 8
    位整数。'
  - '- 作为基准实现，它用于验证 GGML 库函数 `from_float` 的正确性，也是性能对比的「手工计时」基准。'
  - ''
  - '**标量点积的「查表艺术」**'
  - '- `dot()`：针对 Q4_0 + 浮点向量的标量实现，用 16 项查找表和位掩码提取 nibble，再逐项累加。'
  - '- `dot3()`：进一步优化，把「一个量化字节」映射到一对浮点值（共 256 种组合），减少分支和重复计算，是典型的「空间换时间」策略。'
  - '- `dot41()`：Q4_1 版本，额外把 `m` 参与累加，处理非对称量化的偏置项。'
  - '- `dot_q4_q8()`：Q4_0 与 Q8_0 的直接整数乘累加，最后统一乘 scale，展示纯整数运算路径。'
  - ''
  - '**simpleDot：Q4×Q8 的极简实现**'
  - '- `simpleDot()` 两种重载分别处理 Q4_0 和 Q4_1，核心思想：从 4 位 nibble 解出索引值，与 Q8_0 的整数相乘累加，最后乘上各自的
    scale / 偏移修正。'
  - '- 这是理解混合精度点积（Mixed Precision Dot）的最小可行实现。'
  - ''
  - '**统计与验证逻辑**'
  - '- `Stat` 类通过 `addResult()` 累加时间、结果、时间平方和最大值，`reportResult()` 计算并输出均值与标准差。'
  - '- 两个 `main()` 都遵循相同的对比逻辑：生成数据 → 自定义实现计时 → ggml `vec_dot` 计时 → 输出统计结果，形成「手工作坊
    vs 工业流水线」的闭环验证。'
