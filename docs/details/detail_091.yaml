exercises:
- contents:
  - 基于 `examples/simple/simple.cpp`，扩展命令行参数支持以下采样配置：
  - 1. `--temp <float>`：温度采样（替换贪心采样）
  - 2. `--top-k <int>`：Top-K 采样
  - 3. `--top-p <float>`：Top-P（nucleus）采样
  - 要求：
  - '- 当指定任一采样参数时，替换默认的 `llama_sampler_init_greedy()`'
  - '- 采样器链按 Top-K → Top-P → Temperature → Distribution 的顺序组装'
  - '- 输出每次采样后的实际概率值（使用 `llama_sampler_get_logit_bias` 或其他 API 观测）'
  - 思考问题：
  - '- 为什么 Temperature 必须放在 Top-K/Top-P 之后？'
  - '- 如何将采样器配置序列化保存到文件，实现推理可复现？'
  'no': 1
  title: 修改 simple 示例：支持自定义采样参数
- contents:
  - 基于 `examples/eval-callback/eval-callback.cpp`，实现以下功能：
  - 1. 在 `common_debug_cb_eval` 回调中检测所有包含 `attn` 或 `attention` 的张量名称
  - 2. 当检测到注意力矩阵（形状通常为 `[n_head, n_tokens, n_tokens]`）时：
  - '   - 打印该张量的形状、类型、前 8 个元素值'
  - '   - 将完整注意力矩阵保存为 CSV 文件（行=查询位置，列=键位置）'
  - 3. 增加 `--save-attention <dir>` 命令行参数控制输出目录
  - 进阶挑战：
  - '- 使用 ASCII 热力图在终端可视化注意力权重（例如 `@#*+=~-.` 映射强度）'
  - '- 统计各层注意力熵值，判断哪些头更「聚焦」、哪些更「分散」'
  - 思考问题：
  - '- 回调中如何区分前向计算与反向计算？'
  - '- 如何避免回调开销掩盖了真实的推理性能？'
  'no': 2
  title: 扩展 eval-callback：实现注意力权重可视化
- contents:
  - 基于 `examples/simple-chat/simple-chat.cpp`，实现对话历史持久化：
  - 1. 每轮对话结束后，将 `messages` 数组序列化为 JSON 文件（`chat_history.json`）
  - 2. 程序启动时检测是否存在历史文件，若存在则自动加载并恢复对话
  - 3. 增加 `--reset` 参数清空历史记录，重新开始对话
  - 4. 增加 `--export <file>` 将对话历史导出为 markdown 格式（带时间戳与角色标记）
  - 进阶挑战：
  - '- 结合 KV 缓存保存/恢复功能（`llama_state_save_file/load_file`），实现断点续聊'
  - '- 对比「重新 tokenization 全部历史」与「恢复 KV 缓存」两种方案的首 token 延迟差异'
  - 思考问题：
  - '- 当上下文窗口接近极限时，应该如何裁剪历史消息？有哪些策略？'
  - '- 如何保证恢复后的上下文与原始生成完全一致（确定性）？'
  'no': 3
  title: 基于 simple-chat 构建多轮对话状态持久化工具
- contents:
  - 基于 `examples/idle/idle.cpp`，探究 GPU 空闲唤醒与批处理大小的交互影响：
  - 1. 修改代码支持扫描两个维度：
  - '   - 空闲时间：0ms, 100ms, 500ms, 1000ms, 2000ms, 4000ms'
  - '   - 批大小：1, 4, 16, 64, 128, 256 token'
  - 2. 对每个组合执行 5 次测试，记录均值、标准差、P95 延迟
  - 3. 输出 CSV 格式结果，便于用 pandas/matplotlib 绘制热力图
  - 4. 增加 `--gpu-wait` 参数：在 decode 之间插入 `ggml_backend_synchronize` 确保 GPU 完全空闲
  - 思考问题：
  - '- 为什么在某些硬件上，大批次反而在空闲后首次执行时延迟更低？'
  - '- 如何区分「GPU 唤醒延迟」与「计算图编译/预处理延迟」？'
  - '- 在生产部署中，应该选择「常驻 GPU」还是「按需唤醒」？如何量化决策？'
  'no': 4
  title: 扩展 idle 示例：GPU 唤醒延迟与批大小的关系
- contents:
  - 基于 `examples/debug/debug.cpp`，实现一个模型量化前后对比工具：
  - 1. 接受两个模型路径参数：`-m baseline.gguf -m2 quantized.gguf`
  - 2. 对相同 prompt 分别执行推理，保存两个模型的 logits（二进制格式）
  - 3. 计算并输出以下指标：
  - '   - 余弦相似度（cosine similarity）'
  - '   - 归一化均方误差（NMSE）'
  - '   - Top-1 token 是否一致'
  - '   - Top-5 token 重叠率'
  - '   - KL 散度（Kullback–Leibler divergence）'
  - 4. 将对比结果输出为 JSON 报告
  - 进阶挑战：
  - '- 支持批量 prompt 对比（从文件读取多行输入）'
  - '- 增加分层对比：仅比较某一层输出（利用 eval-callback）'
  - 思考问题：
  - '- 为什么 NMSE 比 MSE 更适合衡量模型输出的相对差异？'
  - '- 当 Top-1 token 改变但整体分布相似时，对下游任务可能有何影响？'
  'no': 5
  title: 基于 debug 示例构建 logits 差异分析工具
- contents:
  - 基于 `examples/debug/debug.cpp` 的 `print_tokenized_prompt()` 和 `run()` 函数，构建交互式调试器：
  - 1. 在 `print_tokenized_prompt()` 基础上，增加逐 token 的概率分布打印（Top-10 tokens + 概率值）
  - 2. 实现 `--interactive` 模式：每生成一个 token 暂停，等待用户输入命令：
  - '   - `continue`：继续生成下一个 token'
  - '   - `inspect <layer>`：使用 eval-callback 打印指定层的激活值'
  - '   - `sampling <temp>`：动态修改当前采样温度'
  - '   - `save`：保存当前 logits/embeddings（复用 `save_output_data()`）'
  - 3. 利用 `has_pooling()` 自动检测 embedding 模式，在非 pooling 模式下显示逐 token 嵌入向量范数
  - 思考问题：
  - '- 如何在交互式调试中保持 KV 缓存一致性？'
  - '- 为什么动态修改采样器参数需要重建 sampler 而非原地修改？'
  'no': 6
  title: 扩展 debug 示例：实现逐 token 交互式调试器
learning_targets:
- 掌握 llama.cpp 示例程序的统一骨架：后端初始化 → 模型加载 → 上下文创建 → 推理执行 → 资源释放的完整生命周期
- 理解 simple 示例中两阶段 tokenization、贪心采样与自回归生成循环的实现机制
- 理解 simple-chat 示例中聊天模板增量渲染、消息历史管理与上下文溢出检测的工程实践
- 掌握 eval-callback 示例中通过 cb_eval 回调挂钩计算图执行过程的观测手段
- 理解 idle 示例中 GPU 空闲状态性能测试的设计思路与统计方法（均值、标准差）
- 掌握 debug 示例中 logits/embeddings 数据的提取、归一化与二进制/文本双格式保存流程
- 理解 debug 示例中 has_pooling 检测、print_tokenized_prompt 调试输出与 print_usage 模板化用法说明的辅助函数设计
- 能够基于示例骨架开发自定义推理应用（如指定层输出、自定义采样策略、性能剖析）
life_analogy:
- 把 llama.cpp 的推理流程想象成一家**咖啡店的点单-制作-出餐流水线**：
- '- **模型加载** = 打开咖啡机电源并放入咖啡豆（权重文件），机器自检完成'
- '- **tokenization** = 把顾客的自然语言点单翻译成配方编号（token ID）'
- '- **llama_decode** = 按配方执行萃取、打奶泡等工序（计算图前向传播）'
- '- **采样器** = 口味偏好选择器：贪心 = 永远选招牌推荐；Min-P + Temperature = 根据心情随机微调'
- '- **llama_sampler_sample → batch 反馈** = 上一道工序的产出决定下一道工序的输入（自回归）'
- '- **llama_vocab_is_eog** = 出餐完成标志（遇到 EOG token 停止接单）'
- '- **eval-callback** = 后厨监控摄像头：实时观察每道工序的中间产物（张量）'
- '- **idle 测试** = 测量咖啡机从休眠到唤醒再到出品的时间，评估电源管理策略'
- '- **debug 示例** = 把每一杯的配方、萃取参数、出品照片（logits/embeddings）存档用于复盘'
- 就像咖啡师需要理解从豆到杯的每个环节，开发者也只有掌握这条流水线，才能稳定、高效地驾驭 llama.cpp。
'no': 90
summary:
- concept: 示例程序骨架
  desc: 统一遵循「后端初始化→模型加载→上下文创建→推理→采样→资源释放」六步流程
- concept: ggml_backend_load_all()
  desc: 动态加载所有可用硬件后端（CPU/CUDA/Metal/Vulkan），为推理选择最优执行路径
- concept: llama_model_load_from_file()
  desc: 从 GGUF 文件加载模型权重与元数据，支持 GPU 卸载层数配置（n_gpu_layers）
- concept: 两阶段 tokenization
  desc: 先 `llama_tokenize(..., NULL, 0, ...)` 探测 token 数量，再分配数组实际填充，避免二次内存分配
- concept: llama_context_params
  desc: 配置上下文窗口（n_ctx）、批大小（n_batch）、性能统计开关（no_perf）
- concept: llama_init_from_model()
  desc: 基于模型和参数创建推理上下文（KV 缓存、计算图预留、后端绑定）
- concept: llama_batch_get_one()
  desc: 快速构造单序列批次，内部自动处理 token/pos/seq_id/logits 标志
- concept: llama_decode()
  desc: 执行一次前向计算，驱动计算图从输入 token 生成 logits
- concept: llama_sampler 采样器链
  desc: 通过 `llama_sampler_chain_add` 组合贪心、Min-P、温度、分布采样等策略，按顺序依次作用
- concept: llama_sampler_sample()
  desc: 从指定位置（通常 -1 即最后一个）采样下一个 token，并自动接受该 token 更新内部状态
- concept: llama_vocab_is_eog()
  desc: 判断采样结果是否为 End-Of-Generation token，用于终止生成循环
- concept: llama_token_to_piece()
  desc: 将 token ID 转换回文本片段，用于流式输出与用户展示
- concept: Encoder-Decoder 分支
  desc: 通过 `llama_model_has_encoder()` 检测 T5/BART 类模型，先 `llama_encode()` 再从 decoder_start_token
    开始生成
- concept: llama_chat_apply_template()
  desc: 将消息历史渲染为模型期望的对话格式字符串，支持增量渲染（prev_len）避免重复编码
- concept: 增量渲染优化
  desc: 利用 `prev_len` 与前一次渲染结果，仅处理新增对话部分，显著降低长对话的 tokenization 开销
- concept: llama_memory_seq_pos_max()
  desc: 查询 KV 缓存中指定序列的最大位置，用于上下文溢出检测与生成状态判断
- concept: common_debug_cb_eval
  desc: 评估回调函数，在计算图每个节点执行时被触发，用于观测中间张量、调试 NaN、收集统计
- concept: params.cb_eval / cb_eval_user_data
  desc: 回调函数指针与用户数据指针，通过 common_params 传递给后端调度器
- concept: params.warmup = false
  desc: 跳过预热推理，让回调在真实数据上立即生效
- concept: llama_synchronize()
  desc: 阻塞等待所有后端计算完成，确保计时与数据读取的准确性
- concept: llama_time_us()
  desc: 微秒级时间戳，用于手动性能测量（idle/debug 示例）
- concept: 空闲性能测试
  desc: 通过不同 sleep 时长模拟 GPU 空闲，测量唤醒延迟与解码时间的相关性
- concept: output_data 结构体
  desc: 封装 logits/embeddings 数据指针、大小、类型后缀，支持可选归一化与多格式导出
- concept: llama_get_logits_ith()
  desc: 获取第 i 个位置的 logits 数组（未归一化概率分布），长度为词表大小
- concept: llama_get_embeddings() / llama_get_embeddings_seq()
  desc: 分别获取逐 token 嵌入矩阵与序列级池化嵌入向量
- concept: has_pooling()
  desc: 通过 `llama_pooling_type()` 判断上下文是否启用池化，决定 embedding 输出形状
- concept: common_embd_normalize()
  desc: 对 embedding 向量执行 L2/p 范数归一化，提升语义相似度计算的稳定性
- concept: print_tokenized_prompt()
  desc: 将输入文本的 token ID 序列与文本片段逐一打印，用于调试分词正确性
- concept: print_usage()
  desc: 打印示例程序的命令行用法说明，支持模板替换（{prog} 替换为实际程序名）
- concept: llama_perf_context_print()
  desc: 打印上下文维度性能统计：prompt 处理速度、生成速度、各阶段耗时
- concept: llama_perf_sampler_print()
  desc: 打印采样器性能统计：采样次数、耗时
- concept: 资源释放顺序
  desc: 遵循逆序释放原则：sampler → context → model → backend，防止悬垂指针与资源泄漏
- concept: llama_log_set()
