learning_targets:
- 理解聊天 PEG 解析器的三段式设计（推理内容、正文、工具调用）与装配流水线架构
- 掌握 builder 模式如何组合原子解析器（literal、until、schema）构建复杂状态机
- 学会使用差分分析技术（calculate_diff_split、compare_variants）自动逆向推断聊天模板的隐藏结构
- 掌握 common_chat_peg_mapper 将 AST 节点映射为结构化 common_chat_msg 的职责
- 理解三种工具调用格式（JSON_NATIVE、TAG_WITH_JSON、TAG_WITH_TAGGED）的解析策略
- 掌握触发器（trigger marker）与延迟语法（grammar_lazy）在流式解析中的应用
- 了解 JSON 转义规范化与括号深度计算的实现细节
- 掌握 Gemma4 专用映射器处理特殊工具调用语法树的机制
life_analogy:
- 想象聊天 PEG 解析器是一个**智能包裹分拣中心**：
- '- **差分分析器（analyze_*）** = **逆向工程侦探**：通过对比「有推理内容 vs 无推理内容」的包裹样本，推断出包装规则'
- '- **common_chat_peg_builder** = **流水线装配工**：根据侦探报告搭建分拣线（推理线、正文线、工具线）'
- '- **tool_open / tool_close 等标签** = **彩色标签贴纸**：贴在关键位置，告诉机器人「这里是工具名」「这里是参数」'
- '- **common_chat_peg_mapper** = **数据翻译官**：把贴满标签的包裹（AST）翻译成标准快递单（common_chat_msg）'
- '- **触发标记（trigger marker）** = **警报器**：扫描到 `<tool_call>` 时才激活复杂解析规则，节省资源'
- '- **增量解析与 args_buffer** = **暂存货架**：包裹只来一半时，先把零件放货架，等剩余部分到了再组装'
- '- **normalize_quotes_to_json** = **包装标准化机**：把 Python 单引号统一换成 JSON 双引号'
- '- **Gemma4 映射器** = **专用翻译通道**：针对特殊包装格式，有专门的分拣员和翻译规则'
'no': 48
summary:
- concept: common_chat_peg_builder
  desc: PEG 解析器构建器，组合原子解析器构建复杂解析规则
- concept: common_chat_peg_mapper
  desc: AST 到结构化数据的映射器，处理推理、内容和工具调用
- concept: common_chat_peg_gemma4_mapper
  desc: Gemma4 专用映射器，通过递归 visit 和 JSON 转换处理特殊工具格式
- concept: autoparser / analyze_template
  desc: 模板自动分析器，通过差分分析逆向推断模板隐藏结构
- concept: analyze_reasoning
  desc: 推理内容分析器，检测推理标记的位置与触发条件
- concept: analyze_content
  desc: 正文内容分析器，判断内容是否被标记包裹
- concept: analyze_tools
  desc: 工具调用分析器，识别 JSON_NATIVE / TAG_WITH_JSON / TAG_WITH_TAGGED 三种格式
- concept: calculate_diff_split
  desc: 差异分割算法，计算最长公共前后缀定位变化部分
- concept: trigger_marker / grammar_lazy
  desc: 延迟语法触发机制，按需激活工具调用语法规则
- concept: pending_tool_call / args_buffer
  desc: 流式解析状态缓冲区，支持不完整工具调用逐步累积
- concept: build_json_tools_*
  desc: JSON 工具调用的三种布局构建策略
