  'no': 1
  points:
  - '**为什么需要 JNI 封装层？**'
  - '- Android 应用基于 Java/Kotlin，而 llama.cpp 是 C++ 库，需要 JNI 作为跨语言桥梁'
  - '- 封装模型加载、推理、采样等复杂逻辑，对上层暴露简洁的 Java 接口'
  - '- 管理全局状态（g_model、g_context、g_sampler 等），确保线程安全与资源正确释放'
  - '**后端动态加载机制的设计哲学**'
  - '- `ggml_backend_load_all_from_path()` 从指定目录加载所有 CPU 后端变体（如 ARM NEON、x86 AVX 等）'
  - '- `llama_backend_init()` 初始化后端，允许运行时动态选择最优计算路径'
  - '- 日志回调 `aichat_android_log_callback` 将 ggml 日志重定向到 Android Logcat，便于调试'
  - '**上下文初始化与多线程优化**'
  - '- `init_context()` 根据设备 CPU 核心数自动计算最优线程数（保留余量避免系统卡顿）'
  - '- 检查模型训练时的上下文长度，防止用户设置超出模型能力导致错误'
  - '- 设置 `n_batch` 与 `n_ubatch` 实现批量推理，提升吞吐效率'
  - '**系统提示词与用户提示词的处理流程**'
  - '- 通过 `common_chat_format_single()` 应用 Jinja 聊天模板，确保符合模型训练格式'
  - '- 分词（tokenize）后检查长度，防止超出上下文窗口（CONTEXT_SIZE - OVERFLOW_HEADROOM）'
  - '- 调用 `decode_tokens_in_batches()` 分批解码，每批不超过 BATCH_SIZE（512）'
  - '**上下文滑动窗口：无限对话的关键技术**'
  - '- 当位置接近上下文上限时，`shift_context()` 丢弃系统提示词之后的中间内容'
  - '- 通过 `llama_memory_seq_rm()` 与 `llama_memory_seq_add()` 移动剩余 token，保持 KV 缓存连续性'
  - '- 这种「滑动注意力」机制允许无限长对话，但会遗忘早期上下文'
  - '**逐 Token 生成与 UTF-8 有效性校验**'
  - '- `generateNextToken()` 每次生成一个 token，通过 `common_sampler_sample()` 采样'
  - '- 累积 `cached_token_chars` 直到形成完整 UTF-8 字符（可能多个字节组成一个汉字），再返回 Java 层'
  - '- 检测 EOG（End of Generation）token 自动停止生成，并保存助手回复到聊天历史'
  - '**基准测试：衡量设备推理性能**'
  - '- `benchModel()` 分别测试 Prompt Processing（PP）与 Text Generation（TG）速度'
  - '- 计算平均值与标准差，生成 Markdown 表格展示模型大小、后端类型、吞吐量（t/s）'
  - '- 帮助开发者评估不同模型在特定 Android 设备上的表现'
