exercises:
- contents:
  - 阅读 `ai_chat.cpp` 第 269-277 行的 `shift_context()` 函数，回答以下问题：
  - 1. 为什么只丢弃 `system_prompt_position` 之后的内容，而不是从开头丢弃？
  - 2. `llama_memory_seq_rm()` 和 `llama_memory_seq_add()` 分别承担什么角色？
  - 3. 如果 `current_position` 为 4000，`system_prompt_position` 为 500，会丢弃多少 Token？
  - 4. 这种滑动窗口机制与 Transformer 的 Sliding Window Attention（SWA）有何异同？
  - 5. 思考：为什么系统提示词需要保留？如果丢弃会有什么后果？
  'no': 1
  title: 分析上下文滑动窗口的实现细节
- contents:
  - 阅读 `ai_chat.cpp` 第 404-438 行的 `generateNextToken()` 函数和第 365-394 行的 `is_valid_utf8()`
    函数，回答问题：
  - 1. 为什么需要 `cached_token_chars` 缓存？直接用 `common_token_to_piece()` 返回不行吗？
  - 2. `is_valid_utf8()` 如何判断一个字节序列是 1/2/3/4 字节字符？（提示：观察前几位二进制模式）
  - 3. 如果一个汉字（3 字节 UTF-8）被分成 3 个 Token 生成，这个流程是如何处理的？
  - 4. 为什么选择返回空字符串而不是等待完整字符？这对用户体验有何影响？
  - 5. 绘制流程图：从 `common_sampler_sample()` 到最终返回 `jstring` 的完整路径
  'no': 2
  title: 追踪 UTF-8 字符的完整生命周期
- contents:
  - 分析 `logging.h` 中的日志系统设计，完成以下任务：
  - 1. 解释 `LOG_MIN_LEVEL` 在 Debug/Release 构建中的默认行为差异
  - 2. 为什么使用宏而不是函数来控制日志级别？（提示：考虑编译期优化）
  - 3. `ai_should_log()` + `__android_log_is_loggable()` 的组合有什么优势？仅使用 `if (level >=
    LOG_MIN_LEVEL)` 有何不足？
  - 4. 设计一个改进方案：支持运行时动态调整日志级别，但不重新编译代码（提示：考虑使用全局变量或 SharedPreferences）
  - 5. 如果要在日志中添加线程 ID，你会修改哪些部分？
  'no': 3
  title: 设计一个更智能的日志级别控制机制
- contents:
  - 对比本章的 Android JNI 实现（`ai_chat.cpp`）与第 68 章的 `llama-cli` 桌面实现（`tools/cli/cli.cpp`），回答：
  - 1. 线程数配置策略有何不同？为什么移动端要保留 `N_THREADS_HEADROOM`？
  - 2. 批处理大小（BATCH_SIZE）的选择考虑了什么因素？移动端与桌面端应该一致吗？
  - 3. Android 版本的 `benchModel()` 与 `llama-bench` 的输出格式有何异同？各自适合什么场景？
  - 4. 如果让你为 iOS 开发类似的 JNI 封装，你会复用哪些设计？需要改变什么？
  - 5. 阅读 `init_context()` 中的 `llama_model_n_ctx_train()` 调用，思考：如果用户强制设置超大上下文会发生什么？
  'no': 4
  title: 对比移动端与桌面端的推理策略差异
- contents:
  - 当前的 `ls-sycl-device.cpp` 只有 4 行核心代码，功能较为简单。设计一个增强版本：
  - 1. 添加命令行参数支持：`--verbose` 显示详细信息，`--json` 输出 JSON 格式
  - 2. 除了打印设备名称，还应输出：设备内存、计算单元数、驱动版本、是否支持 FP16 等
  - 3. 如何检测 SYCL 设备是否支持当前模型的量化格式（如 Q4_0、Q8_0）？
  - 4. 设计返回值约定：检测到可用设备返回 0，无设备返回 1，检测到但配置错误返回 2
  - 5. 思考：为什么需要在运行 `llama-cli` 之前先运行设备查询工具？这个工具应该在 CI/CD 流程中扮演什么角色？
  'no': 5
  title: 扩展 SYCL 设备查询工具
- contents:
  - 参考 `ai_chat.cpp` 中的 `chat_add_and_format()` 和 `reset_long_term_states()`，实现一个独立的聊天历史管理器：
  - 1. 支持最多保存 N 轮对话（用户+助手为一轮），超出后自动丢弃最早的对话
  - 2. 提供 `get_formatted_history()` 方法，返回应用了聊天模板的完整提示词
  - 3. 计算当前历史的总 Token 数，并在接近上下文上限时发出警告
  - 4. 思考：如何与 `shift_context()` 配合，在滑动窗口时同步更新聊天历史？
  - 5. 如果用户要求「清除历史但保留系统提示词」，你的实现应该如何处理？
  'no': 6
  title: 实现一个简化的聊天历史管理器
learning_targets:
- 理解 JNI 在 llama.cpp Android 集成中的桥梁作用与生命周期管理
- 掌握 llama.cpp 后端动态加载机制与多线程上下文初始化策略
- 理解上下文滑动窗口（Context Shifting）的实现原理与无限对话机制
- 掌握逐 Token 生成流程中的 UTF-8 有效性校验与缓存机制
- 了解跨平台日志系统的设计：GGML 日志到 Android Logcat 的映射
- 熟悉 SYCL 设备查询工具的作用与异构计算环境验证方法
life_analogy:
- 想象 llama.cpp 的 Android 集成是一位**跨国翻译官**的工作日常：
- '- **JNI 层** = 翻译官本人，负责在 Java（客户）和 C++（引擎）之间传递指令'
- '- **后端动态加载** = 翻译官根据现场情况选择最合适的翻译设备（CPU/GPU/DSP）'
- '- **上下文滑动窗口** = 记忆宫殿的「记忆整理术」：当对话太长时，丢弃中间部分，保留开头和结尾'
- '- **UTF-8 校验** = 质量检查员：确保每次递交给 Java 的文字都是完整无缺的（半个汉字不能交付）'
- '- **日志系统** = 同声传译耳机：把底层引擎的「方言」（GGML 日志）转换成 Android 能听懂的「普通话」（Logcat）'
- '- **SYCL 设备查询** = 开工前的设备检查：确认 Intel GPU 这台「高级翻译机」是否就绪'
- 就像翻译官需要管理大量资料（KV 缓存）、控制翻译节奏（Token 生成）、并确保每次输出都准确无误（UTF-8 校验），llama.cpp 的 Android
  集成也需要精细的状态管理和跨语言协作。
'no': 96
summary:
- concept: JNI 桥梁
  desc: Java 与 C++ 之间的翻译层，管理 llama.cpp 生命周期
- concept: ggml_backend_load_all_from_path()
  desc: 动态加载所有可用后端，支持运行时选择最优计算路径
- concept: init_context()
  desc: 初始化推理上下文，自动计算最优线程数，校验模型训练上下文长度
- concept: shift_context()
  desc: 上下文滑动窗口：丢弃中间部分，保留系统提示词，实现无限对话
- concept: decode_tokens_in_batches()
  desc: 分批解码 Token，每批不超过 BATCH_SIZE（512），接近上限时触发滑动
- concept: is_valid_utf8()
  desc: 校验 UTF-8 完整性，确保多字节字符（如汉字）完整后才返回 Java
- concept: cached_token_chars
  desc: 缓存不完整的 UTF-8 字节，直到形成完整字符再输出
- concept: chat_add_and_format()
  desc: 使用 Jinja 模板格式化聊天消息，确保符合模型训练时的格式
- concept: common_sampler_sample()
  desc: 采样下一个 Token，支持温度、Top-K/P 等多种采样策略
- concept: llama_memory_seq_rm/add()
  desc: KV 缓存的删除与移动操作，支撑上下文滑动的内存管理
- concept: aichat_android_log_callback()
  desc: 日志回调函数，将 GGML 日志重定向到 Android Logcat
- concept: android_log_prio_from_ggml()
  desc: 日志级别映射函数，将 GGML 日志级别转换为 Android 日志优先级
- concept: ai_should_log()
  desc: 运行时日志级别检查，结合编译期与运行期双重过滤
- concept: LOG_MIN_LEVEL
  desc: 编译期日志级别控制，Release 版本自动裁剪低级别日志
- concept: ggml_backend_sycl_print_sycl_devices()
  desc: 打印所有可用 SYCL 设备，用于验证 Intel GPU 环境配置
- concept: benchModel()
  desc: 性能基准测试，分别测试 Prompt Processing 和 Text Generation 速度
- concept: EOG Token
  desc: End of Generation 标记，检测到后自动停止生成并保存助手回复
- concept: reset_short_term_states()
  desc: 重置生成相关状态：停止位置、UTF-8 缓存、助手回复流
- concept: reset_long_term_states()
  desc: 重置对话相关状态：聊天历史、位置追踪、KV 缓存（可选）
- concept: new_sampler()
  desc: 基于温度参数创建采样器实例，控制生成多样性
