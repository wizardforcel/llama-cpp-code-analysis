  points:
  - '**为什么需要统一的日志封装？**'
  - '- llama.cpp 使用 ggml 日志系统，Android 使用 Logcat，需要桥接层转换格式'
  - '- 通过宏定义 `LOGv/LOGd/LOGi/LOGw/LOGe` 提供与 Android 原生日志一致的 API'
  - '- 编译期通过 `LOG_MIN_LEVEL` 控制日志级别，Debug 版本输出 VERBOSE，Release 版本仅 INFO 及以上'
  - '**日志级别映射机制**'
  - '- `android_log_prio_from_ggml()` 将 ggml 的日志级别（ERROR/WARN/INFO/DEBUG）映射到 Android
    优先级'
  - '- `ai_should_log()` 检查当前日志是否满足最低输出级别，避免不必要的字符串格式化开销'
  - '**日志回调注册流程**'
  - '- `aichat_android_log_callback` 作为函数指针传递给 `llama_log_set()`，接管所有 ggml 日志输出'
  - '- 使用 `__android_log_write()` 直接写入 Logcat，支持 TAG 过滤与级别筛选'
  - '**条件编译优化性能**'
  - '- 通过 `#if LOG_MIN_LEVEL <= ANDROID_LOG_VERBOSE` 在预处理阶段裁剪低级别日志代码'
  - '- Release 版本中 VERBOSE/DEBUG 日志被编译为空操作 `((void)0)`，零运行时开销'
