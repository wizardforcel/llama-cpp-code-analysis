learning_targets:
- 理解 Gemma 家族从初代到 Gemma4 的演进脉络及各代架构的核心差异
- 掌握 RMSNorm + RoPE + Self-Attention + SwiGLU/GeLU FFN 的标准 Transformer 构建模式
- 理解 ISWA（Intermittent Sliding Window Attention）双层缓存与按层 RoPE 频率的实现
- 理解 attn_q_norm / attn_k_norm / attn_post_norm / ffn_post_norm 等'夹心'归一化的工程意义
- 掌握 AltUp 多通道并行表示的 predict / correct 机制及其与单通道的形状转换
- 理解 Gemma4 中共享 KV 层（has_kv == false）与 V 投影省略的极致稀疏化设计
- 理解 per-layer embedding 在每层动态注入额外信息的实现原理
- 掌握 f_final_logit_softcapping 通过 tanh 平滑 logits 的实现手法
- 掌握 laurel 低秩残差块与 gaussian_topk 稀疏门控的实现
- 能阅读并修改自定义模型构建器，理解 llm_graph_context 的构图 API
life_analogy:
- 想象 Gemma 家族是一组**Google 出品的智能翻译工厂**，每一代都在解决不同的工业难题：
- '- **Gemma 初代 = 标准流水线工厂**：RMSNorm → RoPE → Attention → FFN，每一步都是教科书级别的标准作业'
- '- **Gemma Embedding = 双轨装卸码头**：既能处理文本 token（标准集装箱），也能直接接收视觉嵌入（整箱到货），通过 ubatch.token
  判断走哪种卸货通道'
- '- **Gemma2-ISWA = 双层仓库**：一部分层只看最近的小窗口（短期仓库），另一部分层看完整历史（长期仓库），大幅节省存储'
- '- **Gemma3 模板类 = 工厂设计院**：通过 iswa 模板参数，一个设计图纸同时画两套工厂（带/不带滑动窗），编译时再决定具体建哪种'
- '- **Gemma3n-ISWA = 并行假设实验中心**：同时维护 n_altup 个''平行宇宙''，每层只更新其中一条（active），最后用路由器投票决定哪个宇宙最靠谱'
- '   - **laurel = 实验中心的草稿本**：在正式实验前先用低秩近似快速演算一遍（L(R(x))），再把草稿笔记加入结果'
- '   - **gaussian_topk = 实验素材的''优选筛''**：把低于均值的素材统统扔掉（ReLU 截断），只保留高于均值 f_sparsity_std_mul
  倍标准差的优质原料'
- '   - **calc_magnitude = 实验数据的能量表**：计算每个平行宇宙的''信号强度'' sqrt(sum(x²))，用来归一化宇宙间的相对影响'
- '- **Gemma4-ISWA = 极致共享仓库**：'
- '   - **共享 KV Cache** = 多层共用同一批历史货物（不再每层都备货）'
- '   - **V 投影省略** = 把 K 当 V 用（偷懒但还能用）'
- '   - **每层嵌入注入** = 每层都额外塞一份''定制小纸条''（per-layer embedding）'
- '   - **MoE 自定义路由** = 多个专家分担不同货物处理，主路由+辅助专家分工合作'
- '- **f_final_logit_softcapping = 末端正负能量限制器**：通过 tanh 把 logits 限制在 ±c 范围内，防止极端值爆炸'
- 就像 Google 不断在工程化上做减法：让同样的工厂能处理更多品种、占用更少仓库、产出更快更稳。
'no': 27
summary:
- concept: llm_build_gemma
  desc: Gemma 初代经典解码器，标准 pre-norm Transformer + sqrt(n_embd) 嵌入缩放
- concept: llm_build_gemma_embedding
  desc: Gemma 嵌入模型，ubatch.token 三元判断支持原始向量输入，引入 Q/K post_norm
- concept: llm_build_gemma2_iswa
  desc: Gemma2 滑动窗口版，build_attn_inp_kv_iswa() + 按层 RoPE + 最终 logit 软帽
- concept: llm_build_gemma3<iswa>
  desc: Gemma3 模板类，std::conditional_t 编译期分叉 ISWA/标准内存输入
- concept: llm_build_gemma3n_iswa
  desc: Gemma3n AltUp 多通道，n_altup 个并行通道每层只更新 active 一条，路由投票融合
- concept: altup_predict / altup_correct
  desc: 多通道先预测后修正的两阶段机制，类似 MoE 的稀疏激活思路
- concept: altup_compute_router_modalities
  desc: 通过 tanh(Linear(RMSNorm(x))) 计算每个通道的路由权重
- concept: laurel
  desc: 低秩增量块 tmp = L(R(x)) + x，补充主干的细粒度特征
- concept: gaussian_topk
  desc: 基于均值+标准差阈值的稀疏门控，f_sparsity_std_mul 控制稀疏度
- concept: calc_magnitude
  desc: 计算向量幅值 sqrt(sum(x²))，用于多通道幅值归一化
- concept: view_2d_slice
  desc: 从 3D 张量按第 3 维切片取 2D 视图，多通道架构的常用辅助方法
- concept: llm_build_gemma4_iswa
  desc: Gemma4 极致稀疏化，共享 KV 层 + V 投影省略 + 每层嵌入注入 + MoE 支持
- concept: has_kv(il)
  desc: 判断当前层是否为本层计算 KV 的层，复用更早层的 KV Cache
- concept: rope_freqs
  desc: 比例 RoPE 频率因子，全局层（非 SWA）使用以实现更平滑的频率调度
- concept: ffn_gate_inp / ffn_gate_up_exps
  desc: Gemma4 的 MoE 路由与合并 gate_up 矩阵实现
- concept: per_layer_inp_gate → GELU → mul → per_layer_proj
  desc: 每层嵌入注入流程：门控 → 激活 → 乘 per-layer 输入 → 投影 → 后归一化
- concept: out_scale
  desc: 层残差缩放因子，类似 DeepSeek 的残差缩放机制
- concept: f_final_logit_softcapping
  desc: logits 软帽：scale → tanh → scale 三步平滑输出分布
- concept: build_attn_inp_kv_iswa
  desc: ISWA 双层 KV 缓存输入接口，将 SWA 与非 SWA 层分开管理
- concept: build_attn_inp_no_cache
