  - 2. `laurel(cur, il)` 为什么需要 `laurel_post_norm`？为什么不在 laurel_r 后立即加？
  - 3. `gaussian_topk(x)` 的阈值 `cutoff_x = mean + f_sparsity_std_mul * std` 是如何计算的？最终激活函数为何选用
