  - '- 多模态场景下，视觉编码器输出已经是向量，直接传入跳过 tokenize'
  - '- 通过 `ubatch.token` 三元判断决定是否乘以 sqrt(n_embd)'
  - '- 引入 attn_q_norm 与 attn_k_norm 在 RoPE 之前做归一化'
  - '- 引入 attn_post_norm 和 ffn_post_norm 形成"pre-norm + post-norm"夹心结构'
