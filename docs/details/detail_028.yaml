  name: Gemma4 共享 KV 与每层嵌入 —— 「极致稀疏化」的工业实践
  'no': 6
  points:
  - '**为什么 Gemma4 更激进地共享 KV？**'
  - '- 大部分层不计算 K/V，直接复用更早层的 KV Cache'
  - '- 通过 `hparams.has_kv(il)` 区分是否为本层的 KV 计算层'
  - '- 全局层（non-SWA）使用 `rope_freqs` 频率因子实现比例 RoPE'
  - '- V 投影可选省略：若 wv 不存在则直接复用 K 作为 V'
  - '- 引入 MoE 支持：`ffn_gate_inp` 存在时走专家路由'
  - '- 路由 logits 由 attn_out（而非 norm 后的 cur）计算'
  - '- MoE 场景支持单独的 `ffn_gate_up_exps`（合并的 up/gate 矩阵）'
  - '- 缩放专家：`ffn_gate_up_exps_s`、`ffn_down_exps_s` 提供 per-channel scale'
  - '- 每层嵌入投影：`per_layer_inp_gate → GELU → mul → per_layer_proj → post_norm`'
  - '- `out_scale` 层缩放因子实现类似 DeepSeek 的残差缩放'
  - '- V 投影用 `ggml_rms_norm` 而非 build_norm（细节差异）'
