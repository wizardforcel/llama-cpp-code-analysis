exercises:
- contents:
  - 阅读 `src/models/gemma.cpp`、`src/models/gemma2-iswa.cpp`、`src/models/gemma3.cpp`、`src/models/gemma3n-iswa.cpp`、`src/models/gemma4-iswa.cpp`，对比五份源码中每一层调用
    `build_norm()` 的次数与对象。
  - 回答问题：
  - 1. Gemma 初代每层有几次 RMSNorm？分别是什么？
  - 2. Gemma2-ISWA 在 Gemma 基础上新增了哪些 post-norm？
  - 3. Gemma3n 中的 RMSNorm 次数最多，请列出至少 8 处使用 build_norm 的位置（含 altup_router_norm、laurel_post_norm、per_layer_post_norm
    等）
  - 4. Gemma4 中 V 投影后的归一化用的是什么算子？为什么不用 build_norm？
  - 5. 这五个模型中，attn_q_norm 和 attn_k_norm 何时被引入？
