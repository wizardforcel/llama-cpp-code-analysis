  name: Gemma3n 多通道 AltUp —— 「并行假设空间」的图构建
  'no': 5
  points:
  - '**什么是 AltUp（Alternating Updates）？**'
  - '- 同时维护 n_altup 个并行表示通道，每层只更新其中一条（active）'
  - '- 通过 `altup_predict` 用 router 计算所有通道的预测值'
  - '- 通过 `altup_correct` 用 router 计算修正后的多通道'
  - '- 入参嵌入（inp_per_layer）单独投影到 n_embd_altup 维度'
  - '- 多通道拼接：`ggml_concat(inpL, altup_added, 2)`'
  - '- 输出时通过 `altup_unembd_proj` 投影回单一通道'
  - '- 共享 KV 层（`hparams.has_kv(il)` 为 false）复用之前的 KV Cache'
  - '- V 投影在 shared KV 层被省略（`if (hparams.has_kv(il))` 分支）'
  - '- Gaussian TopK 激活稀疏化（`f_sparsity_std_mul` 控制阈值）'
  - '- Laurel 残差块：`tmp = L(R(x)) + x` 的低秩增量'
  - '- calc_magnitude 计算 sqrt(sum(x²)) 用于幅值归一化'
  - '- view_2d_slice 从 3D 张量切出 active 通道的 2D 视图'
