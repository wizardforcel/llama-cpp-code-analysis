  - 5. `altup_correct` 中 `ggml_scale_bias(all_coefs, 1.0f, 1.0f)` 的作用是什么？为什么要 +1.0？
  - 6. `altup_predict` 中 `cur_permuted` 经过 `ggml_permute(ctx0, cur, 1, 2, 0, 3)` 后变成什么形状？为什么需要
