  name: Gemma 初代基础构建 —— 经典解码器的「通用骨架」
  'no': 1
  points:
  - '**为什么 Gemma 初代的实现可以作为后续家族的参考模板？**'
  - '- 标准的 RMSNorm + RoPE + Self-Attention + FFN 流水线'
  - '- 唯一的特色是用 sqrt(n_embd) 对 embedding 做缩放（与 LLaMA 一致）'
  - '- 注意力缩放通过 1.0f / sqrtf(float(n_embd_head)) 显式计算'
  - '- 没有 attn_q_norm/attn_k_norm 这种前置归一化'
  - '- 没有 attn_post_norm 和 ffn_post_norm 的"夹心"结构'
  - '- 是理解后续 gemma2 / gemma3 / gemma3n / gemma4 的进化起点'
