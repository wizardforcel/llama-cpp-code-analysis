  - '- CUDA 内核需要针对不同的头维度（head_size）、量化类型（Q4_0/Q8_0 等）和列数组合生成大量特化版本'
  - '- 手动维护数百个 .cu 文件不可行，脚本化生成是工业级解决方案'
