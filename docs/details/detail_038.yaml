  desc: HIP 平台缺失的 CUDA 饱和减法指令，软件模拟实现
- concept: __vcmpeq4/__vcmpne4
  desc: HIP 平台字节比较掩码生成，用于量化内核
- concept: MUSA 适配层
  desc: 摩尔线程 GPU 的 CUDA API 映射，国产 GPU 支持
- concept: 厂商兼容层设计
  desc: 同一套 ggml-cuda 源码，三家 GPU 厂商无缝编译
