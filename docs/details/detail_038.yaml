  - '- __vcmpeq4/__vcmpne4：4 路 uint8 比较并生成掩码'
  - '- 这些在 ROCm 早期版本中缺失，需要软件实现以兼容 CUDA 内核'
  - '**性能提示：**'
  - '- 使用 __forceinline__ 确保内联，避免函数调用开销'
