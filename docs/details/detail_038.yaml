  - '- FlashAttention Tile 实例：根据 HEAD_SIZES_KQ 生成 dk/dv 组合的 tile 内核'
  - '- FlashAttention Vec 实例：根据 TYPES_KV 生成不同量化类型的向量内核'
  - '- FlashAttention MMA 实例：针对 Tensor Core 的矩阵乘加（MMA）生成多列特化版本'
  - '**特殊处理逻辑：**'
  - '- head_size_kq == 576（DeepSeek-V2 MLA）单独处理 dv=512'
  - '- ncols2 > ncols 的组合直接跳过，避免无效内核'
  - '- 特定 head_size 只支持特定 ncols2 配置（如 512 只支持 4/8 列）'
  - '**清理旧文件：**'
  - '- 生成前先删除所有 *.cu 文件，确保无残留'
