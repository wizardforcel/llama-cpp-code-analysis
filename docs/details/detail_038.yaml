exercises:
- contents:
  - 阅读 `ggml/src/ggml-cuda/template-instances/generate_cu_files.py` 第69-110行，运行该脚本并观察输出：
  - 1. 统计生成的 .cu 文件总数，按类型分类（fattn-tile / fattn-vec / fattn-mma / mmq / mmf）
  - 2. 修改 HEAD_SIZES_KQ 列表，添加一个自定义 head_size（如 256），重新生成并观察变化
  - 回答问题：
  - '- 为什么 ncols2 > ncols 的组合被跳过？这与 GPU 线程块组织有什么关系？'
  - '- head_size_kq == 576 时为什么 dv 固定为 512？查阅 DeepSeek-V2 MLA 架构论文理解原因'
  'no': 1
  title: 追踪模板生成流程
- contents:
  - 对比阅读三个厂商头文件的差异：
  - 1. `ggml/src/ggml-cuda/vendors/cuda.h`（NVIDIA 原生）
  - 2. `ggml/src/ggml-cuda/vendors/hip.h`（AMD ROCm）
  - 3. `ggml/src/ggml-cuda/vendors/musa.h`（摩尔线程）
  - 回答问题：
  - '- 三个文件分别解决了什么平台特定问题？'
  - '- HIP 平台为什么需要软件模拟 __vsubss4 等指令？这些指令在哪类 CUDA 内核中被使用？'
  - '- MUSA 平台对 bfloat16 的处理与 CUDA 有何不同？'
  'no': 2
  title: 分析厂商兼容层差异
- contents:
  - 基于 `ggml/include/ggml-cuda.h` 的 API 设计，尝试为一个虚构的 GPU 厂商（如 "XYZ GPU"）设计类似的兼容层：
  - 1. 定义 XYZ GPU 的厂商宏（类似 GGML_USE_HIP / GGML_USE_MUSA）
  - 2. 列出需要映射的核心 CUDA API（至少 10 个）到 XYZ GPU 的对应函数
  - 3. 考虑 XYZ GPU 不支持 FP8 的情况，设计降级策略
  - 思考问题：
  - '- 为什么 ggml 选择宏开关而非运行时分发？这种设计的优缺点是什么？'
  - '- 如果 XYZ GPU 有独特的硬件特性（如更大的共享内存），如何在兼容层中暴露这些特性？'
  'no': 3
  title: 设计最小化跨平台 GPU 后端
- contents:
  - 参考 `hip.h` 中 __vsubss4 的实现模式，尝试为 HIP 平台实现另一个缺失的 CUDA 指令：
  - 1. 选择 __vaddss4（4路 int8 饱和加法）或 __vabs4（4路 int8 绝对值）
  - 2. 使用 __builtin_elementwise_* 系列函数（如果可用）或手动循环实现
  - 3. 确保使用 __forceinline__ 和正确的类型转换
  - 验证要求：
  - '- 编写简单的测试用例，对比你的实现与 CUDA 原生指令的结果'
  - '- 思考：为什么饱和运算在量化神经网络中如此重要？'
  'no': 4
  title: 实现缺失的 HIP 内联函数
learning_targets:
- 理解 generate_cu_files.py 的模板生成机制与批量代码生产策略
- 掌握 ggml-cuda.h 作为跨厂商 GPU 后端的统一 API 设计哲学
- 熟悉 CUDA/HIP/MUSA 三大 GPU 厂商的兼容层实现差异
- 了解 CUDA 版本兼容处理与 FP8/FP4 新特性引入机制
- 理解 HIP 平台缺失 CUDA 指令的软件模拟实现原理
life_analogy:
- 想象 llama.cpp 的 GPU 后端体系是一个**跨国汽车制造商的全球生产网络**：
- '- **generate_cu_files.py** = 总部的**车型配置自动生成系统**'
- '  - 根据车身长度（head_size）、发动机类型（量化类型）、座位布局（ncols）自动批量生成数百种车型图纸（.cu 文件）'
- '- **ggml-cuda.h** = **品牌统一销售展厅**'
- '  - 无论客户买的是奔驰（CUDA）、宝马（ROCm）还是红旗（MUSA），销售顾问用同一套话术和流程接待'
- '- **vendors/cuda.h** = **奔驰原厂技术规范**'
- '  - 确认车型年份（CUDA 版本），2022年后标配激光雷达（FP8），2024年后新增自动驾驶（FP4）'
- '- **vendors/hip.h** = **宝马车的奔驰零件翻译手册**'
- '  - 宝马工厂缺少某些奔驰专用工具（CUDA 指令），需要手工打造替代件（软件模拟 __vsubss4 等）'
- '- **vendors/musa.h** = **红旗车的本土化适配指南**'
- '  - 将奔驰的设计图纸（CUDA API）翻译成红旗的生产标准（MUSA API），支持国产供应链'
- 就像车企需要一套灵活的系统来管理全球多品牌、多配置、多工厂的生产，llama.cpp 需要这套机制向上层提供统一的 GPU 加速能力，屏蔽底层硬件差异。
'no': 37
