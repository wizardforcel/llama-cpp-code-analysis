  name: API 协议转换 —— OpenAI 与 Anthropic 的「同声传译」
  'no': 4
  points:
  - '**为什么需要协议转换层？**'
  - '- OpenAI 与 Anthropic 采用不同的消息格式与参数约定'
  - '- llama.cpp 只需支持一种内部协议，并通过翻译器兼容多厂商 API'
  - '**convert_anthropic_to_oai 的「结构重塑」**'
  - '- system 参数到 messages 数组的转换：Anthropic 用独立字段，OpenAI 用 role=system 消息'
  - '- 内容块（content blocks）的智能映射：text、image、tool_use、tool_result、thinking 等类型逐一转换'
  - '- 特殊字段适配：stop_sequences→stop、max_tokens 保持、thinking_budget_tokens 保留'
  - '**消息合并与分离的艺术**'
  - '- 相同 role 的连续消息合并：避免 OpenAI API 的冗余，Anthropic 允许分块'
  - '- tool_result 块转换为独立的 role=tool 消息，保持 OpenAI 的一对一关系'
  - '- reasoning_content 保留原始思考过程，供后续调试与展示'
  - '**不支持特性的显式拒绝**'
  - '- previous_response_id：llama.cpp 不支持跨请求的 stateful 上下文关联'
  - '- input_file / file_url：受限于推理引擎的能力'
  - '- 通过清晰的错误信息告知用户，而非静默失败'
