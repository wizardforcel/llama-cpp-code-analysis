  - '**随机 ID 生成器**'
  - '- random_string：生成 32 字符的随机字母数字字符串，使用 std::mt19937 生成器'
  - '- gen_chatcmplid / gen_tool_call_id：封装随机字符串生成，添加语义化前缀'
  - '**Base64 编解码**'
  - '- base64_decode：将 Base64 字符串解码为原始字节数组，支持多模态数据的内联传输'
  - '**JSON 数组类型判断**'
  - '- json_is_array_of_numbers：检查数组是否全部为整数'
  - '- json_is_array_of_mixed_numbers_strings：检查是否混合了字符串和数字'
  - '- json_is_array_and_contains_numbers：检查数组是否包含至少一个数字'
  - '**JSON 嵌套值提取**'
  - '- json_get_nested_values：根据路径列表（如 ["a/b/c", "d/e"]）批量提取嵌套 JSON 值'
  - '- 使用路径分隔符 / 逐层深入，支持部分路径存在的情况'
  - '**UTF-8 验证**'
  - '- validate_utf8：验证字符串是否为合法 UTF-8，返回有效字节长度'
  - '- is_valid_utf8：完整验证字符串，不做截断处理'
