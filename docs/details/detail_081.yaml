  name: 多模态令牌容器 —— 文本与图像的「双层集装箱」
  'no': 2
  points:
  - '**server_tokens 的设计哲学**'
  - '- 同时维护纯文本 token 列表与多模态媒体块（map_idx_to_media），实现统一容器'
  - '- has_mtmd 标志区分纯文本与多模态模式，两者的位置计算逻辑完全不同'
  - '- **拷贝控制策略**：禁用拷贝构造与拷贝赋值（=delete），仅允许移动语义，防止媒体块资源意外复制导致的性能与生命周期问题'
  - '**位置转换的「空间换算术」**'
  - '- pos_next：在多模态场景中，图像占用多个逻辑位置但仅一个 token 索引，需要精确转换'
  - '- 遍历 map_idx_to_media，对每个媒体块加上其位置数（n_pos），非媒体 token 占位 1'
  - '- size_up_to_pos 执行反向转换：从位置反推 token 索引，用于流式处理'
  - '**get_common_prefix 的「公共前缀查重」**'
  - '- 纯文本模式：逐 token 对比直到出现差异'
  - '- 多模态模式：图像块需同时比较 ID 与 token 数量，实现真正语义等价判断'
  - '- 该结果用于 KV 缓存复用，识别哪些推理历史可以保留'
  - '**validate 与 process_chunk 的「安检与通关」**'
  - '- validate：确保所有文本 token 在词表范围内，多模态块与其 token 占位一一对应'
  - '- process_chunk 调用 mtmd_helper_eval_chunk_single 将图像/音频送入视觉编码器，'
  - '  生成对应的嵌入表示，为多模态推理建立桥梁'
