  name: 参数解析与 LoRA 管理 —— 翻译请求的「词汇表管理员」
  'no': 1
  points:
  - '**为什么需要双层参数解析？**'
  - '- OpenAI API 支持灵活的 JSON 结构，包括字符串、token 数组、混合数组等多种 prompt 格式'
  - '- llama.cpp 需要将这些异构输入统一为内部的 llama_tokens 或 server_tokens 对象'
  - '- 该模块承担了「翻译官」职责，将 OpenAI 风格请求映射为 llama.cpp 内部参数'
  - '**oaicompat_completion_params_parse 的「激素脸」机制**'
  - '- 严格校验 prompt 必需性，处理 stop 序列的字符串/数组两种情况'
  - '- 拒绝 echo、best_of、suffix 等不支持参数，向用户明确报错而非静默忽略'
  - '- 透传所有其余参数到内部 llama_params，保留用户的完整意图'
  - '**tokenize_mixed：混合输入的「分词魔法」**'
  - '- 支持三种 prompt 格式：纯字符串、token 数组、字符串与 token 混合数组'
  - '- 对混合数组，字符串部分通过 common_tokenize 动态分词，token 直接调用'
  - '- 首个元素自动应用 add_special 注入 BOS 等特殊 token，后续元素禁用避免重复'
  - '**LoRA 适配器的「生命周期管理」**'
  - '- lora_all_alora：检查是否所有适配器都使用 Alora（应用层 LoRA），影响 KV 缓存策略'
  - '- lora_should_clear_cache：基于 Alora 集合差异智能决策是否清除缓存，在保证正确性与性能间权衡'
  - '- parse_lora_request / are_lora_equal / lora_get_enabled_ids：提供 LoRA 配置的解析、对比与查询能力'
