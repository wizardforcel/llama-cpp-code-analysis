  name: SSE 流式响应与 JSON 工具 —— 实时数据的「广播员」
  'no': 5
  points:
  - '**为什么 SSE 是流式推理的标准？**'
  - '- 支持单向服务器→客户端推送，完美匹配 LLM 生成的 token-by-token 特性'
  - '- 基于 HTTP/HTTPS 协议，无需额外的 WebSocket 握手，与 RESTful API 无缝集成'
  - '**三种 SSE 格式的「方言」差异**'
  - '- format_oai_sse：OpenAI 原生格式，data: {...}\n\n，事件边界清晰'
  - '- format_openai_sse：OpenAI 兼容 SSE，简洁的 data 前缀格式'
  - '- format_oai_resp_sse：Responses API 特有的 event + data 双层结构'
  - '- format_anthropic_sse：Anthropic 风格，通过 event 字段指定事件类型，数据更灵活'
  - '**RFC 8895 规范的遵循**'
  - '- 每个事件以空行（\n\n）结尾，表示消息终止'
  - '- data: 前缀标识数据行，event: 前缀标识事件类型（可选）'
  - '- safe_json_to_str 确保序列化过程对特殊字符进行替换，防止 JSON 解析错误'
  - '**从 token 到 SSE 的流水线**'
  - '- get_token_probabilities 提取 logits 进行 softmax，获取概率分布'
  - '- tokens_to_output_formatted_string 处理不完整 UTF-8 字符的字节级输出'
  - '- 这些工具函数为流式响应提供「原料」，SSE 格式化器负责「包装」'
  - '**server_grammar_trigger：结构化输出的触发器**'
  - '- 包装 common_grammar_trigger，提供 JSON 序列化/反序列化能力'
  - '- 支持三种触发类型：word（关键词）、pattern（正则模式）、token（特定 token）'
