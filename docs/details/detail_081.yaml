learning_targets:
- 掌握 llama.cpp 服务端如何处理多协议兼容的推理请求
- 理解 server_tokens 容器如何统一文本与多模态数据
- 深入 API 协议转换的架构设计与实现细节
- 掌握 SSE 流式响应的格式化规范与最佳实践
- 理解 Embedding 与 Rerank 等特殊任务的响应构造
- 了解多模态媒体处理的完整流水线
- 掌握 JSON 工具函数与字符串处理在服务端开发中的应用
life_analogy:
- llama.cpp 服务端是一套**全能翻译与装配流水线**：
- '- **server_tokens** = **快递分拣员**，同时处理**包裹单据**（文本 token）和**特殊货物**（图像/音频块），'
- '  两样东西要分别存储，但最终要合并成一张**统一的运单**供下一步处理'
- '- **server_tokens 的拷贝控制** = **贵重物品的专属保险柜**，禁止随意复制（=delete），'
- '  但允许整体搬运（move），确保资源不会意外泄漏'
- '- **tokenize_mixed()** = **智能包装机器**，遇到**大箱套小箱**（字符串中混入 token ID）时，'
- '  能自动拆开并合并成标准格式'
- '- **handle_media()** = **采购员的采买清单**，支持三种渠道：'
- '  **网购 URL**（HTTP 下载）、**本地自提**（file:// 邮编验证）、**加急快递**（Base64 内联）'
- '- **convert_anthropic_to_oai()** = **跨语言的专业翻译**，把 Anthropic 的**措辞和句子结构**'
- '  完整改写成 OpenAI 的格式，同时保留所有**细节与语气**（temperature、top_p 等参数）'
- '- **format_oai_sse()** = **实时直播的字幕机**，每产生一个 token 就装进**数据包**（data: {...}\n\n），'
- '  按 RFC 8895 规范的**通信协议**逐个发送，确保客户端能**边接收边显示**'
- '- **format_response_rerank()** = **成绩单反馈员**，把学生作业（文档）与**题目**（query）对比后，'
- '  按**得分排序**，以**标准 JSON 格式**呈现给上层应用'
- '- **process_mtmd_prompt()** = **多语种文件柜**，先将图像转为**FNV 哈希指纹**，然后统一**整理装箱**，'
- '  与文本 prompt 融合成**一体化的多模态表示**供模型理解'
'no': 80
summary:
- concept: oaicompat_completion_params_parse
  desc: OpenAI 兼容请求参数解析，处理 stop 序列、拒绝不支持的参数，透传所有用户意图
- concept: tokenize_mixed
  desc: 混合输入分词：字符串、token 数组、混合数组统一为 llama_tokens 序列
- concept: server_tokens
  desc: 文本与多模态数据的统一容器，支持位置转换、媒体块映射、验证与深拷贝，禁用拷贝构造确保资源安全
- concept: server_tokens::pos_next() / size_up_to_pos()
  desc: 位置与 token 索引的双向转换，多模态模式下的核心算法
- concept: server_tokens::get_common_prefix()
  desc: 比较两个 server_tokens 的公共前缀，用于 KV 缓存复用与状态恢复
- concept: server_tokens::push_back() 三重重载
  desc: 统一入口支持单 token、媒体块、另一个 server_tokens 的追加，自动维护索引映射
- concept: process_mtmd_prompt()
  desc: 多模态提示处理主管：调用 MTMD 编码器生成嵌入、按 FNV 哈希标记媒体
- concept: handle_media()
  desc: 媒体多源支持：HTTP 远程下载（10MB 限制）、本地文件（需明确启用）、Base64 解码
- concept: convert_anthropic_to_oai()
  desc: Anthropic API 转 OpenAI 格式：消息、工具调用、思考过程的智能映射
- concept: convert_responses_to_chatcmpl()
  desc: OpenAI Responses API 转 Chat Completion：输入结构化转换为消息数组
- concept: format_oai_sse() / format_anthropic_sse() / format_openai_sse()
  desc: SSE 流式响应格式化：data+event 结构，遵循 RFC 8895 规范，支持增量传输
- concept: format_embeddings_response_oaicompat()
  desc: Embedding 响应生成：支持 base64 编码减少 JSON 大小，自动统计 token 计费
- concept: format_response_rerank()
  desc: Rerank 响应格式化：TEI 或 OpenAI 兼容双模式，按分数降序排序，支持 top_n 截断
- concept: format_prompt_infill()
  desc: Fill-In-Middle 提示词构建：正确处理前缀、后缀、额外上下文，支持多个 FIM 特殊 token
- concept: format_prompt_rerank()
  desc: Rerank 提示词生成：优先使用模型内嵌模板，退化为标准的 [BOS] query [EOS] [SEP] doc [EOS] 结构
- concept: lora_all_alora() / lora_should_clear_cache()
  desc: LoRA 缓存决策：判断是否需要清空 KV 缓存，平衡正确性与性能
- concept: json_value<T>() / json_get_nested_values()
  desc: 类型安全的 JSON 值提取与嵌套路径访问，支持默认值与类型错误警告
- concept: server_tokens::validate() / process_chunk()
  desc: 多模态验证与处理：确保 token 合法性、调用 MTMD 生成嵌入表示
- concept: is_valid_utf8() / validate_utf8()
  desc: UTF-8 编码合法性验证：确保输出文本在字节边界处截断，避免乱码
- concept: server_grammar_trigger
  desc: 语法触发器包装器：支持 type/value/token 的 JSON 序列化与反序列化，用于结构化输出
