  name: SSE 流式压测执行 —— 逐 token 记录的「快递追踪员」
  'no': 7
  points:
  - default() 是 k6 的主测试函数，每次迭代执行一次：从 SharedArray 随机选取对话（data[exec.scenario.iterationInInstance
    % data.length]），构造包含 system 和 user 消息的 POST 请求体
  - 'payload 包含 stream: true 和 stream_options.include_usage: true，要求服务器以 SSE 流式返回并包含
    usage 统计'
  - 启动 SSE 连接：sse.open(`${server_url}/chat/completions`, params, callback)，在 callback
    中监听 client.on('event') 事件
  - 三段式时间戳记录：startTime（请求发送前）、promptEvalEndTime（首个 SSE 事件到达时，即 TTFB）、endTime（流结束时），分别用于计算
    promptEvalTime 和 completion_time
  - 事件处理逻辑：首个事件到来时记录 promptEvalEndTime 并添加 llamacpp_emit_first_token_second 指标；解析
    event.data 为 JSON，提取 chunk.usage.prompt_tokens 和 chunk.usage.completion_tokens
    记录到 Trend 和 Counter 指标；捕获 finish_reason 判断是 'length'（截断）还是 'stop'（正常结束）
  - 最终指标计算：llamacpp_prompt_processing_second = prompt_tokens / (promptEvalEndTime
    - startTime) * 1000，llamacpp_tokens_second = completions_tokens / (endTime - promptEvalEndTime)
    * 1000
  - 'check(res, {''success completion'': (r) => r.status === 200}) 验证响应状态码为 200，该检查结果会被
    k6 统计为 root_group.checks.success completion.passes'
  - sleep(0.3) 模拟用户阅读响应的间隔，避免请求过于密集导致服务器过载
