learning_targets:
- 掌握 k6 + Prometheus 基准测试编排器 bench.py 的完整生命周期：参数解析→服务器启动→双阶段就绪探测→k6 压测执行→Prometheus
  指标采集→GitHub Actions 环境变量输出
- 理解 bench.py 中 start_server() 的双阶段健康检查策略：is_server_listening() 做 TCP 端口探测，is_server_ready()
  轮询 /health 端点，以及 CI 环境重试上限翻倍的工程设计
- 掌握 start_benchmark() 的 k6 子进程调用机制：环境变量注入、BENCH_K6_BIN_PATH 自定义路径、--summary-export
  结果导出
- 掌握 start_server_background() 的子进程创建细节：llama-server 参数组装（--hf-repo/--hf-file/--ctx-size/--parallel/--n-predict/--cont-batching/--metrics/--flash-attn）、LLAMA_SERVER_BIN_PATH
  覆盖、stdout/stderr 双线程日志分流
- 理解 script.js 的 k6 脚本结构：SharedArray 数据集共享、SSE 流式请求解析、Trend/Counter/Rate 指标记录、三段式时间戳的
  TTFB/TPOT 计算
- 掌握 escape_metric_name() 的命名规范化逻辑：re.sub 非字母数字字符转下划线并转大写，适配 GitHub env 变量命名规则
- 理解 results.github.env 文件的写入格式：BENCH_RESULTS/BENCH_ITERATIONS/BENCH_GRAPH_TITLE/BENCH_GRAPH_XLABEL
  等 CI 字段
- 掌握 __main__ 入口的模块设计与 main() 中服务器优雅终止流程（SIGINT → 500ms 超时 → force kill → 端口释放轮询）
- 理解 Windows 与 POSIX 系统下信号处理的差异（CTRL_C_EVENT vs SIGINT）
life_analogy:
- '- 想象 bench.py 是一位**全科医生**，负责给 llama-server 做全面体检：'
- '  - start_server() = 被叫上门的医生，先按门铃（TCP 探测 is_server_listening），再等患者开门（HTTP /health
  探测 is_server_ready）'
- '  - 双阶段就绪探测 = 先确认人在家（端口通），再确认人清醒（服务健康）——就像敲门后要听到回应才进屋'
- '  - start_server_background() = 医生的出诊准备：拎起医疗箱（组装 llama-server 参数）、打开记录仪（双线程日志分流）、选择交通工具（LLAMA_SERVER_BIN_PATH
  自定义路径）'
- '  - escape_metric_name() = 医生把所有测量指标翻译成标准病历格式——把 "llamacpp_prompt_processing_second"
  这种驼峰式名称转为 "LLAMACPP_PROMPT_PROCESSING_SECOND" 的标准化格式，方便医院信息系统（GitHub Actions）统一归档'
- '  - main() 的服务器关闭逻辑 = 体检结束后的病房整理：先温柔唤醒（SIGINT），等 500ms 如果还不醒就强制关机（force kill），最后还要确认设备完全断电（while
  is_server_listening 轮询）'
- '  - __main__ 入口 = 门铃按钮，按下后整个体检流程自动启动'
- '- 想象 script.js 是**快递员的工作记录仪**：'
- '  - SharedArray 数据集 = 快递员手里的包裹清单，所有虚拟用户（VU）共享同一份清单但各自取不同的包裹'
- '  - default() 函数 = 快递员每次取件的动作：随机选一个包裹（conversation），送到服务器（POST /chat/completions），记录送达时间（startTime）、客户开门时间（promptEvalEndTime）、客户签收时间（endTime）'
- '  - Trend 指标 = 快递员的小本本，记录每次送货的耗时统计'
- '  - Rate 指标 = 退货率记录，检查包裹是否被拒收（truncated）或正常签收（stop）'
- '  - setup() = 快递员上岗前的晨会，大声念出今天的送货地址（server_url）、包裹数量（n_prompt）和车型（model）'
'no': 89
summary:
- concept: bench.py main()
  desc: 基准测试总控编排器：argparse 解析 20+ 参数→start_server 启动 llama-server→start_benchmark
    执行 k6 压测→读取 k6-results.json 写入 results.github.env→Prometheus 采集五大指标生成 JSON/JPG/Mermaid→输出
    BENCH_RESULTS 等 CI 变量
- concept: start_server
  desc: 双阶段就绪探测协调器：先调用 is_server_listening() 做 TCP 端口连通性检查（connect_ex），再调用 is_server_ready()
    轮询 /health HTTP 端点，CI 环境重试上限翻倍至 1200 次
- concept: start_server_background
  desc: 子进程创建器：组装 llama-server 完整参数链（--hf-repo/--hf-file/--n-gpu-layers/--ctx-size/--parallel/--batch-size/--ubatch-size/--n-predict/--cont-batching/--metrics/--flash-attn），subprocess.Popen
    启动并用双线程分流 stdout/stderr
- concept: start_benchmark
  desc: k6 压测执行器：构造 SERVER_BENCH_* 环境变量注入 k6 进程，通过 subprocess.run 执行 k6 run 命令并导出
    k6-results.json
- concept: is_server_listening
  desc: TCP 端口探测：socket.connect_ex 连接服务器，返回 0 表示已监听，打印 "server is listening on {fqdn}:{port}..."
    日志
- concept: is_server_ready
  desc: HTTP 健康检查：GET http://{fqdn}:{port}/health，返回 status_code == 200 判定服务器就绪
- concept: escape_metric_name
  desc: 指标名规范化：re.sub('[^A-Z0-9]', '_', metric_name.upper())，将非字母数字字符替换为下划线并转为大写，适配
    GitHub env 变量命名规范
- concept: __main__
  desc: 全局入口点：当直接执行脚本时调用 main()，启动整个基准测试流程
- concept: 服务器优雅关闭
  desc: main() 中 try/finally 块确保 llama-server 进程被安全清理：SIGINT（或 Windows CTRL_C_EVENT）→
    500ms 超时 → force kill → while is_server_listening 轮询确认完全退出
- concept: script.js SharedArray
  desc: k6 的数据共享机制：所有虚拟用户（VU）共享同一份 ShareGPT 数据集，通过 JSON.parse(open(dataset_path))
    加载并预处理
- concept: script.js default()
  desc: k6 主测试函数：从 SharedArray 选取对话→构造 POST 请求→通过 sse.open 发送 SSE 流式请求→在 event 回调中记录
    TTFB 和 token 统计→最终计算 llamacpp_prompt_processing_second 和 llamacpp_tokens_second
- concept: script.js 三段时间戳
  desc: startTime（请求发送）→promptEvalEndTime（首个 SSE 事件到达，即 TTFB）→endTime（流结束），分别用于计算
    promptEvalTime 和 completion_time
- concept: script.js 指标族
  desc: Trend（llamacpp_prompt_tokens/llamacpp_completion_tokens/llamacpp_tokens_second
    等）记录分布，Counter（llamacpp_prompt_tokens_total_counter/llamacpp_completion_tokens_total_counter）累计总数，Rate（llamacpp_completions_truncated_rate/llamacpp_completions_stop_rate）记录比例
- concept: script.js options
  desc: k6 测试配置：thresholds 设置截断率 >80% 时中断测试，duration 默认 10 分钟，vus 默认 8 个虚拟用户
units:
- codes:
  - file: tools/server/bench/bench.py
    line: 28-217
    method_or_func: main()
  - file: tools/server/bench/bench.py
    line: 294-295
    method_or_func: escape_metric_name()
  name: bench.py 生命周期编排 —— 从启动到终止的「全科医生」
  'no': 1
  points:
  - main() 总控流程：argparse 解析 --name/--runner-label/--branch/--commit/--host/--port/--model-path-prefix/--n-prompts/--max-prompt-tokens/--max-tokens/--hf-repo/--hf-file/--n-gpu-layers/--ctx-size/--parallel/--batch-size/--ubatch-size/--scenario/--duration
    等 20+ 参数，start_time 记录起始时间戳，start_server() 启动 llama-server 子进程，start_benchmark()
    执行 k6 压测
  - 读取 k6-results.json 并解析 metrics 对象，将每个指标的数值字段（float/int）四舍五入到两位小数后写入 results.github.env，格式为
    {escape_metric_name(metric_name)}_{escape_metric_name(metric_metric)}={value}
  - iterations 提取自 data['root_group']['checks']['success completion']['passes']，代表成功完成的请求次数
  - 服务器优雅终止：server_process.send_signal(interrupt) 发送 SIGINT（Windows 为 CTRL_C_EVENT），server_process.wait(0.5)
    等待 500ms，超时则 server_process.kill() 强制终止，最后 while is_server_listening() 轮询确认端口完全释放
  - Prometheus 指标采集：如果 0.0.0.0:9090 端口监听（Prometheus 服务），则查询 prompt_tokens_seconds/predicted_tokens_seconds/kv_cache_usage_ratio/requests_processing/requests_deferred
    五大指标，生成原始 JSON 文件、matplotlib JPG 图表和 Mermaid xychart 格式文件
  - GitHub Actions 集成：最终写入 results.github.env 的 BENCH_RESULTS={json.dumps(bench_results)}
    汇总 req/pp/tg 的 p95/avg 指标，BENCH_ITERATIONS={iterations}，BENCH_GRAPH_TITLE 和 BENCH_GRAPH_XLABEL
    用于 CI 图表标题
  - escape_metric_name() 使用 re.sub('[^A-Z0-9]', '_', metric_name.upper()) 将指标名转为大写下划线格式，如
    "llamacpp_prompt_processing_second" → "LLAMACPP_PROMPT_PROCESSING_SECOND"
- codes:
  - file: tools/server/bench/bench.py
    line: 262-279
    method_or_func: start_server_background()
  name: 子进程孵化与日志引流 —— 服务器启动的「产房护士长」
  'no': 2
  points:
  - start_server_background() 确定 llama-server 可执行文件路径：默认 '../../../build/bin/llama-server'，可通过
    LLAMA_SERVER_BIN_PATH 环境变量覆盖，适配不同构建目录结构
  - 组装完整的服务器参数链：--host/--port（网络监听）、--hf-repo/--hf-file（模型源）、--n-gpu-layers/--ctx-size/--parallel/--batch-size/--ubatch-size（性能配置）、--n-predict
    args.max_tokens * 2（预测上限设为两倍留下安全边际）、--cont-batching（连续批处理）、--metrics（Prometheus
    指标暴露）、--flash-attn（Flash Attention 加速）
  - 使用 subprocess.Popen 创建子进程，stdout 和 stderr 均通过 subprocess.PIPE 捕获，不直接继承父进程的控制台输出
  - 启动两个独立线程分别分流日志：thread_stdout 负责将子进程 stdout 转发到 sys.stdout，thread_stderr 负责将子进程
    stderr 转发到 sys.stderr，实现无阻塞的实时日志透传
  - 内部定义 server_log() 函数使用 iter(in_stream.readline, b'') 哨兵模式逐行读取字节流，解码为 UTF-8 后打印，直到子进程关闭流时自然退出
  - 返回 server_process 对象给调用者 start_server()，供后续就绪探测和最终终止使用——此函数本身不等待服务器就绪，职责单一
