  - start_server() 函数调用 start_server_background() 创建子进程后，进入双阶段等待循环：第一阶段调用 is_server_listening()
    检查 TCP 端口是否可连接，第二阶段调用 is_server_ready() 检查 HTTP /health 端点是否返回 200
  - is_server_listening() 使用 socket.socket(socket.AF_INET, socket.SOCK_STREAM) 创建
    TCP socket，connect_ex((server_fqdn, server_port)) 尝试连接，返回 0 表示成功监听，打印 "server
    is listening on {fqdn}:{port}..." 并返回 True
  - is_server_ready() 使用 requests.get(f"http://{server_fqdn}:{server_port}/health")
    发起 HTTP GET 请求，返回 response.status_code == 200 判定服务器完全就绪
  - max_attempts 默认为 600 次（每次间隔 0.5 秒，总计 300 秒），但在 CI 环境（检测 GITHUB_ACTIONS 环境变量）翻倍至
    1200 次，适应 GitHub Actions 虚拟机启动较慢的场景
  - '两阶段循环都打印 "bench: waiting for server to start ..." 或 "bench: waiting for server
