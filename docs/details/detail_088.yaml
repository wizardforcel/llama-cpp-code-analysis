- contents:
  - 阅读 `tools/server/webui/tests/stories/fixtures/` 目录下的 `ai-tutorial.ts` 和 `math-formulas.ts`，
  - 创建一个新的夹具文件 `custom-code.ts`，包含以下内容：
  - 1. 一个包含 Python 装饰器语法的代码块
  - 2. 一个包含中文与 Emoji 混排的段落
