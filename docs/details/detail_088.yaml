learning_targets:
- 理解 Storybook 测试夹具的设计原则：如何通过独立的 Markdown 内容文件模拟真实 LLM 输出场景
- 掌握 Vitest 与 Storybook 的集成机制：setProjectAnnotations 如何合并预览配置与 a11y 插件
- 学会构建类型安全的测试 Mock：通过 Partial<T> 模式灵活覆盖 Store 状态而不破坏类型约束
- 解析 Agentic 消息结构的测试策略：从原始 DatabaseMessage 到结构化 Section 的转换验证
- 理解剪贴板数据的序列化与反序列化：JSON 结构化格式与纯文本模式的边界处理
- 掌握 LaTeX 与货币符号的区分算法：基于启发式规则的文本预处理与保护机制
- 学习模型 ID 解析与 URI 模板处理：从字符串解析到资源定位的完整链路
- 了解前端测试金字塔：单元测试、组件测试与 E2E 测试的分层协作
life_analogy:
- 想象 llama.cpp WebUI 的测试体系是一家**电影特效工作室的质检部门**：
- '- **Markdown 夹具** = 特效镜头剧本库（AI 教程、API 文档、博客文章等不同风格的测试剧本）'
- '- **Storybook 环境** = 摄影棚灯光调试（确保不同布景下演员肤色一致，即配置统一）'
- '- **Mock 工具函数** = 替身演员与绿幕（无需真实服务器即可模拟各种模态场景）'
- '- **Agentic 消息测试** = 剧本结构分析（将对话解构成推理、工具调用、文本段落等标准化镜头）'
- '- **剪贴板格式化** = 海关安检（确保数据进出时格式合规，JSON 或纯文本的正确转换）'
- '- **LaTeX 保护** = 货币防伪检测（区分 $5 美元符号与 $x$ 数学符号，防止误伤）'
- '- **模型 ID 解析** = 身份证识别器（从 `meta-llama/Llama-3.1-8B-Q4_K_M` 中提取组织、参数量、精度）'
- '- **测试金字塔** = 质检流水线（单元测试是零件检查，组件测试是整车测试，E2E 是路测）'
- 就像特效部门需要为每一场戏准备精确的剧本和替身，前端测试也需要为每一种 UI 状态准备真实的 Markdown 内容与 Mock 数据，确保最终渲染效果万无一失。
'no': 87
summary:
- concept: Markdown Fixtures
  desc: 独立的内容夹具文件，提供多样化真实文本样本测试 Markdown 渲染边界
- concept: setProjectAnnotations
  desc: Storybook 测试环境配置合并机制，确保单元测试与 Storybook 行为一致
- concept: mockServerProps / mockConfigs
  desc: Store 状态注入工具与预定义配置，通过 Partial<T> 实现灵活的服务器属性模拟
- concept: deriveAgenticSections
  desc: 消息结构解析器，将原始对话转换为文本、推理、工具调用等标准化段落
- concept: formatMessageForClipboard
  desc: 智能剪贴板序列化，根据附件类型自动切换纯文本/JSON 结构化格式
- concept: parseClipboardContent
  desc: 剪贴板反序列化，支持格式自动识别与非法输入的优雅降级
- concept: maskInlineLaTeX / preprocessLaTeX
  desc: LaTeX 保护机制，区分货币符号与数学公式，防止 Markdown 渲染冲突
- concept: parseModelId
  desc: 模型标识解析器，从字符串提取组织名、参数规模、量化类型等元数据
- concept: normalizeModelName
  desc: 模型名称规范化，统一处理 HuggingFace 路径与本地文件路径
- concept: URI Template Utils
  desc: RFC 6570 模板处理工具集，支持变量提取、展开、完整性校验与 URI 规范化
- concept: reasoningContent
  desc: 推理内容独立字段，与消息主体分离以支持隐私过滤与结构化处理
- concept: TestWrapper / vitest-browser-svelte
  desc: 组件级冒烟测试工具，验证 Svelte 组件在测试环境中的基础渲染能力
