  - '- 健壮性处理：截断 JSON、非法附件类型、空字符串的优雅降级'
  - '- 往返一致性（Round-trip）：format → parse 应还原原始数据'
  - ''
  - '**边界场景覆盖**'
  - '- Unicode 字符（中日韩文字与 Emoji）在 JSON 序列化中的保真'
  - '- 转义字符（换行、引号、反斜杠）在双引号 JSON 中的正确编码'
  - '- 附件过滤：自动过滤非文本附件（image、pdf）保护剪贴板整洁'
