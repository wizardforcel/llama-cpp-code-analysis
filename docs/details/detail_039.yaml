  - '**`htp_iface_open()` / `htp_iface_start()` / `htp_iface_stop()` / `htp_iface_close()`**
    是 DSP 车间的「开工/收工四部曲」。它们负责给 HVX/HMX 硬件上电、分配 VTCM 内存、创建工作线程池，为接收任务做好准备。'
