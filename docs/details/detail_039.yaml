  name: Buffer 与量化重排 —— DSP 内存的「打包魔术」
  'no': 2
  points:
  - '**共享内存（Buffer）** 是主机与 DSP 之间的「共享停车场」。`ggml_backend_hexagon_buffer_context` 在构造时通过
    `rpcmem_alloc2()` 申请一块物理内存，再用 `rpcmem_to_fd()` 拿到文件句柄，最后用 `fastrpc_mmap()` 将其映射到
    DSP 的虚拟地址空间。'
  - '**量化重排（Repacking）** 是一种性能魔术。GGML 的标准 Q4_0 格式不适合 DSP 的 HVX 单元一次性读取。因此，主机在将数据发送给
    DSP 之前，会通过 `repack_row_q4x4x2()` 将其转换为「x4x2」布局，该布局将 8 个量化块和 8 个缩放因子交织在一起，极大提升了
    DSP 的数据吞吐效率。'
  - 这个过程涉及 `quantize_f32_q8x4x2()`（激活）和 `repack_*`（权重）两个方向，确保所有进入 DSP 核心计算单元的数据都已按照最优格式排列。
