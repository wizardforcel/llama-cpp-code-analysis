  name: DMA、Worker Pool 与小工具 —— DSP 后端的「后勤三剑客」
  'no': 10
  points:
  - '**`worker-pool.c`**: 这是 DSP 多线程计算的「人力资源部」，负责创建、管理和调度多个工作线程，让 `matmul` 这样的重体力活能被拆分并行完成。'
  - '**`hex-dma.c/h`**: 这是 DSP 内部的「高速传送带」，提供了一套完整的 API 来管理 DDR（主存）和 VTCM（片上高速缓存）之间的数据搬运，并且支持乒乓缓冲（ping-pong
    buffering）来掩盖传输延迟。'
  - '**`hex-*` 小工具**: `hex-fastdiv.h` 用乘法和位移来代替昂贵的除法运算，`hex-utils.h` 提供对齐和计算周期等辅助功能，`hex-dump.h`
    和 `hmx-profile.h` 则是调试和性能分析的「显微镜」。'
  - 这些底层设施虽然不像具体算子那样起眼，但它们共同构成了一个高效、可靠的后勤保障系统，是 DSP 后端高性能的基石。
