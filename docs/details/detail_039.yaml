  name: 位置编码、复制与索引 —— 序列数据的「交通指挥」
  'no': 9
  points:
  - 这部分代码是模型中的「交通系统」，负责数据的定向移动、格式转换和位置标记。
  - '**RoPE（旋转位置编码）** 在 `rope-ops.c` 中实现。它会先通过 `rope_cache_init()` 预计算好旋转角度，然后在 `rope_job_f32()`
    中利用 DMA 多次搬运数据到 VTCM，再用 HVX 指令 `hvx_rope_f32_aa()` 完成旋转，高效地为每个 token 注入位置信息。'
  - '**复制与索引** (`cpy-ops.c`, `get-rows-ops.c`, `set-rows-ops.c`, `binary-ops.c`) 则是数据柔性流动的保证。它们处理了
    F32/F16 类型转换、张量广播、按索引读写行等各种复杂的数据重排任务，确保数据能正确匹配到下一层网络的输入要求。'
