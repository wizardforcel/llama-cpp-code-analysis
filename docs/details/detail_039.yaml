summary:
- concept: '`htpdrv_init()` + `libdl.h`'
  desc: 动态加载 libcdsprpc 库并通过 dlsym 绑定 FastRPC, rpcmem, dspqueue 等函数指针，是主机与 DSP 通信的入口。
- concept: '`htp_tensor` / `htp_general_req` / `htp_general_rsp`'
  desc: HTP 协议的结构体基础，分别描述张量元数据、计算请求（含 op、flags、src/dst）以及带性能统计的执行回执。
- concept: '`htp_t_block_size()` / `htp_type_nbytes()`'
  desc: 将 GGML 的数据类型映射为 DSP 中对应的块大小和字节数，用于计算 VTCM 和 DMA 的内存需求。
- concept: '`ggml_backend_hexagon_reg()` / `ggml_hexagon_init()`'
  desc: Hexagon 后端的注册入口，负责初始化全局配置（环境变量、架构号等）并创建设备会话。
- concept: '`ggml_hexagon_session`'
  desc: 管理单个 DSP 设备的生命周期，包括 dspqueue 的创建、VTCM 分配、FastRPC 句柄以及请求队列的 `enqueue()` 和 `flush()`
    方法。
- concept: '`ggml_backend_hexagon_buffer_context`'
  desc: 主机端缓冲区对象，通过 `rpcmem_alloc2()` 分配内存，再用 `fastrpc_mmap()` 映射到 DSP 域，实现共享内存访问。
- concept: '`repack_q4_0_q4x4x2()` / *x4x2 family'
  desc: 主机端的量化格式重排函数，将标准 q4_0/q8_0/mxfp4 块转换为适合 DSP 高效读取的 x4x2 布局。
- concept: '`ggml_backend_hexagon_graph_compute()`'
  desc: 图执行主引擎，遍历计算图，使用 `init_*_req` 模板将 ggml 算子转换为 HTP 请求，并处理量化和早醒等优化。
- concept: '`htp_packet_callback()` + `proc_*_req()`'
  desc: DSP 侧的请求处理中心，`htp_packet_callback()` 从队列读取请求并根据操作码分发给 `proc_matmul_req`、`proc_binary_req`
    等具体处理函数。
- concept: '`op_matmul()` / `op_matmul_id()`'
  desc: DSP 上的矩阵乘法核心。根据输入类型（量化或 FP16）选择路径，先调用 `quantize_f32_q8x4x2` 量化激活，再将任务分配给多个工作线程执行
    `matmul_2d` 或 `matvec_2d`。
- concept: '`vec_dot_*` (Q4/Q8/IQ4/MXFP4)'
  desc: HVX 向量点积核心，将量化值（如 int4）和浮点 scale 通过 `vrmpy` 等指令完成低精度高吞吐的点积计算。
- concept: '`hmx_mat_mul_permuted_*`'
  desc: 利用 HMX 硬件进行矩阵乘法的路径，包括批量矩阵乘、激活和输出的 DMA 重排，以及量化权重的解码。
- concept: '`worker_pool_run_func()`'
  desc: DSP 侧的多线程执行基础，将一个函数和数据分发给多个 worker 线程并行执行。
- concept: '`dma_queue_push/pop`'
  desc: DMA 传输的核心接口，用于在 DDR 和 VTCM 之间高效搬运数据，支持 1D/2D 以及缓存复用。
- concept: '`hvx-*` 工具库'
  desc: 一套基于内存对齐（aa/au/ua/uu）自动分配最优化实现的 HVX 向量操作基础库，涵盖算术、拷贝、归约等。
