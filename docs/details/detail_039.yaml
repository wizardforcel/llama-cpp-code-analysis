exercises:
- contents:
  - 阅读 `ggml/src/ggml-hexagon/htp-drv.cpp` 的 `htpdrv_init()` 函数（287-327行）和 `ggml/src/ggml-hexagon/htp/htp-msg.h`
    中的 `htp_general_req` 结构体定义（107-120行）。
  - '回答以下问题：

    - `htpdrv_init()` 试图加载哪个动态库？如果 `rpcmem_alloc2` 符号不存在会怎样？

    - 一个 `htp_general_req` 最多能携带多少个输入张量？它的 `op_params` 字段有什么用途？

    - `HTP_OPMASK_QUANTIZE` 和 `HTP_OPFLAGS_SKIP_QUANTIZE` 在 `ggml_backend_hexagon_graph_compute()`
    中是如何被用于控制量化流程的？'
  'no': 1
  title: 调试 FastRPC 初始化与消息协议
- contents:
  - 阅读 `ggml/src/ggml-hexagon/ggml-hexagon.cpp` 中 `ggml_backend_hexagon_buffer_context`
    的构造函数（267-292行）和 `repack_q4_0_q4x4x2()` 函数（498-526行）。
  - '回答以下问题：

    - `ggml_backend_hexagon_buffer_context` 在分配内存后，为什么要调用 `rpcmem_to_fd()`？

    - `repack_q4_0_q4x4x2` 为什么要使用中间缓冲区 `buf_pd` 和 `buf_rp`？直接转换不行吗？

    - 修改 `init_row_q4x4x2` 的逻辑，使其不是将量化值置为8（解包后为0），而是置为0（解包后为-8），这对模型输出会有什么影响？'
  'no': 2
  title: 分析量化重排与缓冲区管理
- contents:
  - 假设你要为 HTP 添加一个 `HTP_OP_CLAMP` 算子，参考 `init_unary_req()` 和 `proc_unary_req()` 的实现。
  - '回答以下问题：

    - 在主机侧（`ggml-hexagon.cpp`），你需要在哪个 `init_*_req` 函数中添加 `HTP_OP_CLAMP` 的映射，并正确设置
    `src0, src1, dst` 的数量和标志位吗？

    - 在 DSP 侧（`htp/main.c` 和 `htp/unary-ops.c`），分别需要修改 `htp_packet_callback` 的哪个 `case`，以及实现哪个
    `*_per_thread` 函数？

    - 请简要描述 `op_unary` 函数内部如何使用 VTCM 和 DMA 完成计算。'
  'no': 3
  title: 设计一个新的 DSP 算子
learning_targets:
- 掌握 FastRPC 驱动的动态加载机制：理解 `htpdrv_init()` 如何通过 `dlsym` 绑定 `rpcmem_*`、`fastrpc_*`、`dspqueue_*`
  等符号，构建 host 与 DSP 的通信桥梁。
- 精通 HTP 消息协议：掌握 `htp_tensor`、`htp_general_req`、`htp_general_rsp` 三大结构体的定义，以及 `htp_t_block_size()`/`htp_type_nbytes()`
  的类型换算逻辑。
- 理解 DSP 会话生命周期：掌握 `htp_iface_open/start/close/stop` 的完整流程，包括电源管理（HVX/HMX）、VTCM 分配、DSP
  队列导入与工作线程池的建立。
- 掌握主机端缓冲区管理：理解 `ggml_backend_hexagon_buffer_context` 的构造与析构，以及 `rpcmem_alloc2` 和
  `fastrpc_mmap` 的共享内存分配与映射流程。
- 深入量化重排机制：掌握 `q4_0`、`q8_0`、`iq4_nl`、`mxfp4` 四种格式如何被转换为 DSP 优化的 `x4x2` 布局，包括 `repack_row_*`
  与 `unpack_row_*` 的实现。
- 理解图调度与请求构造：学习 `ggml_backend_hexagon_graph_compute()` 如何通过 `init_binary_req()`、`init_rope_req()`
  等模板函数将 `ggml_tensor` 翻译为 `htp_general_req`，并通过会话队列进行分发。
- 掌握 DSP 侧请求处理：理解 `htp_packet_callback()` 如何轮询 `dspqueue` 并调用 `proc_*_req` 系列函数处理矩阵乘、激活、Softmax、RoPE
  等算子。
- 掌握 HVX/HMX 计算核心：深入 `matmul-ops.c` 与 `hmx-matmul-ops.c`，理解量化点积与 tile 化矩阵乘的实现。
- 精通 HVX 工具库：了解 `hvx-base.h` 至 `hvx-arith.h` 中对齐分发与原子向量操作的设计，以及 `hex-dma.h` 和 `worker-pool.c`
  提供的底层并发与搬运支持。
life_analogy:
- 想象整个 ggml-hexagon 后端是一家「高通 DSP 智能工厂」：
- '- **`htpdrv_init()`** 是厂门的保安，负责检查并加载 `libcdsprpc` 这把「万能钥匙」，随后打开 `rpcmem`、`fastrpc`、`dspqueue`
  这三把重要的工具柜。'
- '- **`htp-msg.h`** 是厂里的「标准作业单」，`htp_tensor` 是物料标签（类型、尺寸、步长），`htp_general_req` 是任务卡（操作码、标志位、输入输出），`htp_general_rsp`
  是回执（状态、耗时、周期数）。'
- '- **`ggml-hexagon.cpp`** 是厂长办公室里的调度中心，`ggml_hexagon_registry` 掌管车间，`ggml_hexagon_session`
  是流水线班长，负责将主机下达的 `ggml` 指令翻译成 DSP 能听懂的 `htp_general_req`。'
- '- **`htp/main.c`** 是 DSP 车间的收发室，`htp_iface_open/start` 是每天早上给 HVX/HMX 上电并分配 VTCM
  工位，`htp_packet_callback` 则是分拣员，负责把收到的包裹（请求）分发给不同的工种（`proc_*_req`）。'
- '- **`matmul-ops.c` 与 `hmx-matmul-ops.c`** 是车间里的「核心冲压机」与「特快专机」，前者用 HVX 向量点积处理重量，后者用
  HMX 硬件做矩阵乘法。'
- '- **`hvx-*.h`** 系列是工具的「万用螺丝刀组」，无论加减乘除、指数对数、拷贝重排，都按内存对齐方式（aa/au/ua/uu）自动匹配最合适的工具头。'
- '- **`worker-pool.c`** 是「多工位并联系统」，保证每个计算任务都能被多个 DSP 线程瓜分；**`hex-dma.c/h`** 则是「传送带与升降机」，负责在
  DDR 和 VTCM 仓库之间搬运物料。'
