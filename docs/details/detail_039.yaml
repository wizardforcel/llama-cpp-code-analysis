    结构体中，并通过 `htp_req_buff_init()` 设置好 DMA 缓冲区。'
  - 最后，通过 `ggml_hexagon_session.enqueue()` 将填好的订单放入 DSP 队列，`flush()` 则会等待 DSP 完成所有任务并返回结果。
