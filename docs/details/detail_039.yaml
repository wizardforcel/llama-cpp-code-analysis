  - '**`proc_*_req()` 函数族** 是对应工种的「老师傅」。例如，收到 `HTP_OP_MUL_MAT` 的包裹，`htp_packet_callback`
    就会将其交给 `proc_matmul_req()`；收到 `HTP_OP_ROPE`，则交给 `proc_rope_req()`。这些老师傅会解包，然后根据内容调用相应的计算函数（如
    `op_matmul()`）。'
