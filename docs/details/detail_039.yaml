    SiLU, GELU, SwiGLU 等不同激活公式的计算任务分发给多个 DSP 线程并行处理。'
  - '**`softmax-ops.c`** 实现了高效的 Softmax。`hvx_fast_softmax_f32()` 会在 HVX 向量寄存器中完成减最大值、计算指数、求和、归一化等所有步骤，最大限度地减少了内存读写。'
  - '**`unary-ops.c`** 则处理了更基础的一元运算，如 RMS Norm, Scale, Sqr 等，每个操作都有对应的 `*_f32_per_thread()`
    版本，充分利用 HVX 的向量处理能力。'
