  - '- 普通 FFN：SwiGLU 激活 + PAR 并行模式 + 可选 bias'
  - '- MoE FFN：使用 `LLAMA_EXPERT_GATING_FUNC_TYPE_SOFTMAX` 门控'
  - '- MoE + 共享专家（`ffn_shexp`）：当 `hparams.n_ff_shexp > 0` 时启用'
  - '- 输出前再次 `ggml_scale(cur, hparams.f_residual_scale)` 缩放残差'
  - ''
  - '**`f_logit_scale`：输出 logits 的最终缩放**'
  - '- 在 `build_lora_mm(model.output, cur)` 之后检查 `hparams.f_logit_scale`'
  - '- 若配置了缩放因子，则 `ggml_scale(ctx0, cur, 1.0f / hparams.f_logit_scale)`'
  - '- 这是 Granite 架构特有的 logits 调整策略，用于控制输出分布的方差'
  - ''
  - '**残差结构：attention/SSM 残差 + FFN 残差**'
  - '- `inpSA = inpL` 保存进入层时的输入'
  - '- `build_layer_ffn` 内部 `ggml_add(ctx0, cur, inpSA)` 完成 FFN 残差'
  - '- 与标准 Transformer 完全一致的两段残差结构'
