  - '**`Qcur` 与 `Kcur` 的预归一化 + RoPE**'
  - '- 与 PLaMo2 类似，PLaMo3 也在 RoPE 之前对 Q/K 做 RMS Norm'
  - '- `attn_q_norm` 与 `attn_k_norm` 是每层独立的归一化权重'
  - '- 这种「Q/K Norm → RoPE」是 StableLM 之后流行的现代 Transformer 设计'
  - ''
  - '**双残差 + 后归一化的标准化结构**'
  - '- `attn_residual = ggml_add(ctx0, cur, residual)`：注意力残差'
  - '- `ffn_residual = ggml_add(ctx0, cur, residual)`：FFN 残差'
  - '- 每个子层前后都有独立的 RMS Norm（attn_norm/attn_post_norm/ffn_norm/ffn_post_norm）'
  - '- 这是 PLaMo 系列的标志性架构，PLaMo3 延续了这一设计'
  - ''
  - '**为什么显式模板实例化？**'
  - '- 与函数模板不同，类模板需要在使用前显式实例化'
  - '- 文件末尾的两行 `template struct ...` 让编译器生成对应类型的二进制代码'
  - '- 这种方式避免了隐式实例化在不同编译单元间的链接问题'
  - '- 是大型 C++ 项目处理模板的标准实践'
