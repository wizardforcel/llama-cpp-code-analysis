  - '- 与 Jamba 按层切换不同，Falcon-H1 每层同时计算 Attention 和 Mamba2'
  - '- 两者结果通过 `ggml_add` 加和，再经过 FFN 输出'
  - '- 这种「并行混合」在保持 SSM 线性复杂度的同时，提供了 Attention 的精确位置建模能力'
  - ''
  - '**`build_attn` 与 `build_mamba2_layer` 的独立调用**'
  - '- `inp = build_inp_mem_hybrid()` 同时为 Attention 和 Mamba 提供输入'
  - '- Attention 分支：wq/wk/wv → reshape → `ggml_rope_ext` → `build_attn`'
  - '- 注意 RoPE 配置完整：`n_rot`、`rope_type`、`freq_base`、`freq_scale`、`ext_factor` 等'
  - '- Mamba2 分支：复用基类的 `build_mamba2_layer`'
  - ''
  - '**`kq_scale` 的双重来源**'
  - '- `hparams.f_attention_scale == 0.0f` 时使用标准的 `1.0f / sqrtf(float(n_embd_head))`'
  - '- 否则使用 `hparams.f_attention_scale`，允许模型自定义注意力缩放因子'
  - '- 这种条件判断兼容了「未配置」与「已配置」两种状态'
  - ''
  - '**Aggregation 节点：attn_out + ssm_out**'
  - '- `cur = ggml_add(ctx0, attn_out, ssm_out)`：两个分支的输出汇合'
  - '- `inpSA = ggml_add(ctx0, cur, inpSA)`：再加上残差'
  - '- 这与 Gemma3 的「post-norm + pre-FFN」结构类似，但 FFN 前没有再次归一化'
  - ''
  - '**FFN 层的 Bias 支持**'
  - '- `build_ffn` 调用中传入了 `ffn_up_b`、`ffn_gate_b`、`ffn_down_b`'
  - '- 表明 Falcon-H1 的 FFN 使用了带 bias 的实现，与标准 SwiGLU FFN 略有差异'
  - '- 最终 `cur = ggml_add(ctx0, cur, inpSA)` 加入残差并作为下一层的输入'
