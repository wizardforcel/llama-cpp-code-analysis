  - '**`llm_build_granite_hybrid` 的混合模式**'
  - '- 与 Nemotron-H 类似的二分结构：`is_recurrent(il)` 判断是 Mamba2 还是 Attention'
  - '- 但与 Nemotron-H 不同，Granite-Hybrid 的 MoE 在 FFN 中处理，不与 SSM 层耦合'
  - '- 这种「线性层（SSM/Attn） + FFN（含 MoE）」的二段设计更接近标准 Transformer 风格'
  - ''
  - '**`rope_finetuned` 标志：按需启用 RoPE**'
