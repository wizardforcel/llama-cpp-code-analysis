  - '  - `ffn_exp_probs_b`：专家概率偏置'
  - '  - `LLAMA_EXPERT_GATING_FUNC_TYPE_SIGMOID`：Sigmoid 门控（区别于 Softmax）'
  - '  - `ffn_shexp`：共享专家分支，独立于 MoE 路由专家'
  - '- 这种「MoE + 共享专家」是 Nemotron 系列的核心架构创新'
  - ''
  - '**残差结构的简洁性**'
  - '- 只有一层 `cur = ggml_add(ctx0, cur, inpSA)`：在 SSM/Attn/FFN 输出之后'
  - '- 与 Falcon-H1 不同，没有中间的「attn + ssm」聚合节点'
  - '- 因为 Nemotron-H 每层只走一条路径（recurrent/attention/ffn）'
  - ''
  - '**`GGML_ASSERT(n_embd_head == n_embd_head_k())` 的设计意图**'
  - '- 在构造函数开头断言，确保 K 与 V 使用相同的 head 维度'
  - '- 这是模型架构的硬约束，若不满足则在图构建时就失败'
  - '- 体现了「早失败」的工程哲学'
