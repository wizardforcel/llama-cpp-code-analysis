  - '- 这种方式让 C++ 编译器自动为不同模板参数生成两份独立的类，零运行时开销'
  - ''
  - '**`std::conditional_t<iswa, llm_graph_input_attn_kv_iswa, llm_graph_input_attn_kv>`
    的类型分支**'
  - '- `inp_attn_type` 根据模板参数决定实际类型'
  - '- 这允许在 KV Cache 和 ISWA KV Cache 之间无缝切换'
  - '- `if constexpr (iswa)` 在编译期决定调用 `build_attn_inp_kv_iswa()` 或 `build_attn_inp_kv()`'
  - ''
  - '**每层 RoPE 参数的差异化**'
  - '- `freq_base_l` 和 `freq_scale_l` 根据模板参数决定来源'
  - '- ISWA 模式下使用 `model.get_rope_freq_base(cparams, il)`（每层可配置）'
  - '- 标准模式使用全局的 `freq_base` 和 `freq_scale`'
  - '- 这种设计允许 ISWA 模型在不同层使用不同的 RoPE 频率'
