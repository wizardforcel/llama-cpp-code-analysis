  - '- 通过 `hparams.is_recurrent(il)` 判断该层是否是循环层（Mamba2）'
  - '- 否则 `hparams.n_ff(il) == 0` 时为纯 Attention 层'
  - '- 否则为 FFN 层（包含普通 FFN 和 MoE FFN）'
  - '- 这种设计允许模型在同一架构中混用三种层类型'
  - ''
  - '**`build_attention_layer`：标准 Attention + 可选 bias**'
  - '- Q/K/V 都通过 `build_lora_mm` 计算，并可选加上 `bq/bk/bv` bias'
  - '- Q/K/V reshape 成 `(n_embd_head, n_head/n_head_kv, n_tokens)`'
  - '- 调用 `build_attn` 组合 wo 与 bo：bias 加到最终输出'
  - '- 与 Falcon-H1 不同，这里使用 `inp->get_attn()` 而不是 RoPE 后的位置输入'
  - ''
  - '**`build_ffn_layer` 的 MoE + 共享专家设计**'
