  - '- `n_head_kv == 0` 表示该层没有 KV 头，即为纯 SSM 层'
  - '- 否则为标准 Self-Attention 层，执行 QKV 投影 + `build_attn`'
  - ''
  - '**混合输入的获取：`build_inp_mem_hybrid`**'
  - '- 与纯 Transformer 不同，Jamba 需要同时管理 KV Cache 和 SSM 状态'
  - '- `inp_hybrid->get_recr()` 返回 `llm_graph_input_rs*`，用于循环层'
  - '- `inp_hybrid->get_attn()` 返回 `llm_graph_input_attn_kv*`，用于注意力层'
  - '- 这两种输入对象分别维护各自的状态机，互不干扰'
  - ''
  - '**MoE 与 FFN 的双分支结构**'
  - '- 通过 `model.layers[il].ffn_gate_inp == nullptr` 判断该层是否使用 MoE'
  - '- 普通 FFN 使用 `build_ffn`（SwiGLU 激活 + PAR 并行模式）'
  - '- MoE FFN 使用 `build_moe_ffn`，支持专家路由（`LLAMA_EXPERT_GATING_FUNC_TYPE_SOFTMAX`）'
  - '- MoE 参数支持 `expert_weights_scale`（专家权重缩放因子）'
  - ''
  - '**「无 RoPE」的 Jamba 注意力层**'
  - '- 注意 `build_attn` 调用时所有 mask/freqs 参数都传 `NULL`'
  - '- 因为 Jamba 是一种「位置无关」的注意力变体，不使用 RoPE 位置编码'
  - '- 这一设计简化了计算图构建，但与标准 Transformer 在注意力层并不完全相同'
  - ''
  - '**残留连接的双层结构**'
  - '- 第一层 `cur = ggml_add(ctx0, inpL, cur)`（attn/ssm 的残差）'
  - '- 第二层 `ffn_inp` 是上一层的输出，再加一次 FFN 输出'
  - '- 这种「attn 残差 + ffn 残差」结构是 Transformer 类模型的经典设计'
