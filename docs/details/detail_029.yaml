  name: PLaMo2 混合架构 —— 日本模型的"Mamba + 自定义注意力"
  'no': 7
  points:
  - '**`llm_build_plamo2` 的独特结构：双残差 + 后归一化**'
  - '- 与 Falcon-H1/Jamba 不同，PLaMo2 实现了「pre-mixer-norm + post-mixer-norm」'
  - '- 每个 block 由两个子层组成：mixer（SSM 或 Attn）和 FFN，每个子层都前后归一化'
  - '- 这种结构类似于 LLaMA 的 RMSNorm 设计，但 mixer 也有独立的 post_norm'
  - ''
  - '**`is_mamba_layer = hparams.is_recurrent(il)` 的层类型判断**'
  - '- 通过超参数判断该层是 Mamba 还是 Attention'
  - '- 调用 `build_plamo2_mamba_layer` 或 `build_plamo2_attn_layer`'
  - '- 两种层共享 `residual` 残差基线，但内部结构差异巨大'
  - ''
  - '**`build_plamo2_attn_layer`：组合 QKV + Q/K 归一化**'
  - '- 使用单一 `wqkv` 张量，通过 `ggml_view_3d` 拆分为 Q/K/V'
  - '- 与多数 Transformer 不同，PLaMo2 对 Q 和 K 做了独立的 RMS Norm'
  - '- Norm 后才应用 RoPE：`ggml_rope_ext`'
  - '- 这种「norm-then-rope」是某些模型（如 StableLM 系）的特殊设计'
  - ''
  - '**`build_plamo2_mamba_layer`：定制化 Mamba2 变体**'
  - '- 与基类 `build_mamba2_layer` 不同，PLaMo2 的实现有自己的特点：'
  - '  - `zx` 通过 `ggml_permute + ggml_cont_4d` 重新布局为 `(head_dim*2, n_heads, n_seq_tokens,
    n_seqs)`'
  - '  - `dt_dim = std::max(64, int(hparams.n_embd / 16))`：动态 dt 维度'
  - '  - 在 SSM 前对 B/C/dt 都做 RMS Norm'
  - '- `get_ssm_rows` lambda 复用基类的 SSM 扫描逻辑'
  - '- 状态保存：`ggml_view_1d` 精确定位状态切片'
  - ''
  - '**`ggml_swiglu_split` 与「y + D*x」的门控融合**'
  - '- `y = ggml_add(ctx0, y, ggml_mul(ctx0, x, D))`：跳跃连接加 D 参数'
  - '- `D = ggml_reshape_2d(ctx0, model.layers[il].ssm_d, 1, n_heads)`：D 广播成多头'
  - '- 最后 `ggml_swiglu_split(ctx0, ggml_cont(ctx0, z), y)`：z 与 y 门控融合'
  - ''
  - '**FFN 子层：SwiGLU + SEQ 串行**'
  - '- `build_ffn` 使用 `LLM_FFN_SWIGLU` 激活 + `LLM_FFN_SEQ` 串行布局'
  - '- 与并行 PAR 模式不同，SEQ 模式先 gate 再 up 再 down'
  - '- 这是 PLaMo2 区别于其他模型的 FFN 设计选择'
