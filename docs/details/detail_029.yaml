learning_targets:
- 理解 Mamba/Mamba2 SSM 循环层的两段式构建流水线（Conv1D + SSM 扫描 + 门控融合）
- 掌握 build_mamba_layer 与 build_mamba2_layer 在状态管理、维度布局和分组 RMS Norm 上的差异
- 理解混合架构（Hybrid）中三种 SSM+Attention 组合策略：按层切换（Jamba）、并行融合（Falcon-H1）、三分支（Nemotron-H）
- 掌握混合输入管理：build_rs_inp 与 build_inp_mem_hybrid 如何分别管理纯循环与混合状态
- 理解模板类显式实例化（如 llm_build_plamo3<iswa>）的 C++ 工程实践与 ISWA 复用机制
- 了解 PLaMo 系列预归一化（attn_q_norm/attn_k_norm）以及后归一化（attn_post_norm/ffn_post_norm）的设计哲学
- 掌握 Granite-Hybrid 的残差缩放（f_residual_scale）和 logits 缩放（f_logit_scale）等架构特性
life_analogy:
- 想象 SSM 与 Attention 的混合架构是一场**"特种部队的协同作战"**：
- '- **Mamba（SSM 循环层）** = 高速公路巡逻队，擅长长距离快速扫描，对历史信息有"记忆缓存"'
- '- **Attention（注意力层）** = 精准狙击手，能锁定任意位置的关键信息，但每次行动成本较高'
- '- **Jamba（按层切换）** = 班长调度员，按地形决定派哪支队伍上场（SSM 层 / Attention 层交替）'
- '- **Falcon-H1（并行融合）** = 双警组同时出动，一队巡逻一队狙击，情报汇总后联合决策'
- '- **Nemotron-H（三分支）** = 三军种联合作战，可全 SSM、全 Attention 或纯 FFN 任意搭配'
- '- **Granite-Hybrid** = 强调"作战日志标准化"的部队，所有行动都按统一的残差缩放比例记录'
- '- **PLaMo2/PLaMo3** = 强调"前后检查站"的精锐部队，每个动作前后都有独立的安全检查（post-norm）'
- '- **状态缓存（conv state / ssm state）** = 巡逻队的"交接班记录本"，下一班直接继承上一班的工作'
- '- **get_ssm_rows lambda** = "按需调阅"机制——只调取未修改部分，避免重复劳动'
- '- **ISWA（Intermittent Sliding Window Attention）** = 滑动窗口哨兵，重要路段加强巡逻，普通路段常规处理'
'no': 28
summary:
- concept: '`llm_build_mamba_base`'
  desc: SSM 循环层构建的共同基类，提供 build_mamba_layer 与 build_mamba2_layer 两个核心方法
- concept: '`llm_build_mamba_base::llm_build_mamba_base()`'
  desc: 基类构造函数，仅将 llm_graph_params 透传给 llm_graph_context，无额外初始化逻辑
- concept: '`build_mamba_layer`'
  desc: Mamba1 三段式流水线（Conv1D + SSM 扫描 + 门控融合），支持 ssm_dt_b_c_rms 条件归一化
- concept: '`build_mamba2_layer`'
  desc: Mamba2 多头分组设计，n_head = ssm_dt_rank，引入分组 RMS Norm
- concept: '`build_rs`'
  desc: 获取循环状态缓存（conv state / ssm state），通过 lambda 实现按需复用
- concept: '`ggml_ssm_conv`'
  desc: SSM 模型的 1D 卷积算子，与历史状态拼接形成 d_conv-1+n_seq_tokens 长度
- concept: '`ggml_ssm_scan`'
  desc: SSM 核心并行关联扫描算子，实现 Mamba 论文 Annex D 的优化
- concept: '`ggml_swiglu_split`'
  desc: 将 z 分支与 y 分支做门控融合，是 Mamba 系列的标志性输出方式
- concept: '`build_inp_mem_hybrid`'
  desc: 混合输入管理，同时支持 KV Cache 与循环状态（SSM）
- concept: '`llm_build_mamba`'
  desc: Mamba/Mamba2 主模型构造函数，由 model.arch 分发到 build_mamba_layer 或 build_mamba2_layer
- concept: '`llm_build_jamba`'
  desc: AI21 Jamba 按层切换 Mamba/Attention，无 RoPE 的 Attention 变体
- concept: '`llm_build_falcon_h1`'
  desc: Falcon-H1 并行融合 Attention 与 Mamba2，ggml_add 聚合两路输出
- concept: '`llm_build_nemotron_h`'
  desc: Nemotron-H 三分支（SSM/Attention/FFN）混合架构，支持 MoE + 共享专家
- concept: '`LLM_FFN_RELU_SQR`'
  desc: Nemotron 特色的 ReLU 平方激活函数
- concept: '`LLAMA_EXPERT_GATING_FUNC_TYPE_SIGMOID`'
  desc: Nemotron 使用的 Sigmoid 门控（区别于 Softmax）
- concept: '`ffn_shexp`'
  desc: Nemotron/Granite 的共享专家分支，独立于 MoE 路由专家
- concept: '`llm_build_granite_hybrid`'
  desc: IBM Granite-Hybrid，f_residual_scale 残差缩放 + f_logit_scale logits 缩放
- concept: '`rope_finetuned`'
  desc: Granite 条件启用 RoPE 的标志，配合 get_rope_factors 支持 YaRN
- concept: '`llm_build_plamo2`'
  desc: PLaMo2 双归一化结构（pre/post-mixer-norm），Q/K 独立 RMS Norm 后再 RoPE
- concept: '`build_plamo2_mamba_layer`'
  desc: PLaMo2 定制化 Mamba2，dt_dim 动态调整，B/C/dt 三者都做 RMS Norm
- concept: '`llm_build_plamo3<iswa>`'
  desc: 模板化 PLaMo3，通过显式实例化复用 ISWA 与标准 KV Cache
- concept: '`std::conditional_t<iswa, ...>`'
  desc: C++ 类型分支技巧，根据 iswa 决定 attn 输入类型
- concept: '`if constexpr (iswa)`'
  desc: 编译期条件分支，为模板参数生成不同二进制代码
- concept: '`template struct ...`'
  desc: 显式模板实例化，避免隐式实例化跨编译单元链接问题
- concept: '`attn_q_norm / attn_k_norm`'
  desc: Q/K 预归一化权重，PLaMo 系列在 RoPE 之前归一化的特殊设计
- concept: '`attn_post_norm / ffn_post_norm`'
  desc: PLaMo 风格的后归一化，每个 mixer 子层后独立归一化
- concept: '`build_attn_inp_kv_iswa`'
  desc: 构建 ISWA 注意力输入对象，支持 SWA 与非 SWA 双 KV Cache
- concept: '`kq_scale`'
  desc: 注意力 QK 缩放因子，可由 hparams.f_attention_scale 自定义
