  - '- 通过 `model.get_rope_factors(cparams, il)` 取得每层的 rope 缩放因子'
  - '- 这种「条件 RoPE」设计适配了 Granite 系列不同版本的多种位置编码策略'
  - ''
  - '**`build_attention_layer` 的 RoPE 与 bias 处理**'
  - '- 只有 `use_rope = hparams.rope_finetuned` 为真时才应用 RoPE'
