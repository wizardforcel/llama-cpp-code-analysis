  name: Mamba 基础构建器 —— SSM 循环层的"万能工厂"
  'no': 1
  points:
  - '**`llm_build_mamba_base` 的角色：Mamba 系列的"共同基因"**'
  - '- 作为 Mamba/Mamba2/Jamba/Falcon-H1 等模型的共同基类，它提供了 SSM 层的核心构建方法'
  - '- 通过 `build_mamba_layer` 和 `build_mamba2_layer` 两个关键方法，支持两代 SSM 架构的差异'
  - '- 内部通过 `hparams`（模型超参数）、`ctx0`（ggml 计算图）、`gf`（前向图）、`inp`（输入）来完成构图'
  - ''
  - '**基类构造函数：`llm_build_mamba_base()` 的透传哲学**'
  - '- 基类构造函数仅接收 `llm_graph_params` 并透传给父类 `llm_graph_context`'
  - '- 这种"空构造"设计体现了"基类只提供骨架，子类填充血肉"的工程哲学'
  - '- 所有超参数、张量指针、后端缓冲都在 `llm_graph_context` 父类中持有'
  - ''
  - '**`build_mamba_layer` 的三段式流水线：Conv1D + SSM 扫描 + 门控融合**'
  - '- **Conv1D 阶段**：通过 `build_rs` 取出循环状态缓存，与当前输入拼接形成 `d_conv - 1 + n_seq_tokens`
    长度的序列，再用 `ggml_ssm_conv` 完成 1D 卷积'
  - '- **SSM 阶段**：`ssm_x` 投射出 `dt + B + C`，与 A 矩阵、状态一起送入 `ggml_ssm_scan`，这是 SSM 的核心并行扫描算子'
  - '- **门控阶段**：通过 `ggml_swiglu_split` 把 z 分支与 y 分支做门控融合，再由 `ssm_out` 投射回 `n_embd`
    维度'
  - ''
  - '**`build_mamba2_layer` 与 Mamba1 的核心差异**'
  - '- Mamba2 采用「分组 + 多头」设计：`n_head = ssm_dt_rank`，`head_dim = d_inner / n_head`'
  - '- 把 `xBCdt` 一次性投出，分为 z、xBC、dt 三个张量；`dt` 不再经过 `dt` 矩阵投射，而是直接由输入投射'
  - '- 引入「分组 RMS Norm」：通过 `ssm_norm` 对 `n_group` 个组分别归一化，提升多组 SSM 的训练稳定性'
  - '- 把 `ssm_d`（跳跃连接）广播成与 `x` 同形的多头张量'
  - ''
  - '**状态管理的关键细节**'
  - '- 通过 `get_r_l(il)` 和 `get_s_l(il)` 获取当前层的卷积状态和 SSM 状态缓冲区'
  - '- 在 `ggml_cpy` 时通过 `kv_head * ... * ggml_element_size(...)` 精确定位到该序列的状态槽位'
