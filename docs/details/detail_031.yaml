learning_targets:
- 理解 BERT、ModernBERT、NeoBERT、EuroBERT 等编码器家族的图构建差异（Post-Norm vs Pre-Norm、QKV 融合 vs
  独立、FFN 激活函数）
- 掌握 T5 编码器-解码器架构中相对位置桶偏置（Relative Position Bias）的实现原理
- 理解 M-RoPE 在 PaddleOCR 中的四段式应用方式（时间/高度/宽度）
- 掌握 Pangu-Embedded 标准 Pre-Norm Transformer 的完整偏置流（Q/K/V + FFN + Output）
- 了解 WavTokenizer 解码器的 ConvNeXt + PosNet 双阶段音频生成流程
- 理解 llm_graph_context 基础设施方法（build_inp_*, build_attn_inp_*, build_attn, build_ffn,
  build_norm, build_pos_bias, build_cvec）是如何被所有编码器模型复用
life_analogy:
- 想象编码器模型家族是一家**各具特色的"理解型餐厅厨房"**：
- '- **BERT = 经典老派厨房**：坚持 Post-Norm（先炒菜再调味）、可选拼盘（qkv 融合或独立）、主厨特选酱汁（GELU/SiLU/GEGLU
  按菜品切换）'
- '- **ModernBERT = 现代改良厨房**：改用 Pre-Norm（先备料再下锅）、只走 QKV 拼盘流水线、按楼层定制火候（per-layer RoPE）'
- '- **NeoBERT = 精简版快餐厨房**：RMSNorm 统一调料、SWIGLU 顺序门控、只产出半成品（t_embd 不算账）'
- '- **EuroBERT = 全定制私房菜**：每道菜独立 Q/K/V 火眼（独立权重）、SiLU 并行双灶台、强调个性化'
- '- **T5 = 双厅联动餐厅**：前台（编码器）接单并记住位置感（相对位置桶），后厨（解码器）边做菜边查菜谱（交叉注意力），同时支持 ReLU 老菜单和 GELU
  新菜单（Flan-T5）'
- '- **PaddleOCR = OCR 专窗**：与 Qwen2VL 共用骨架但偏置可选（看顾客预算），时间/高度/宽度分段旋转（M-RoPE）'
- '- **Pangu-Embedded = 昇腾嵌入式厨房**：全套带偏置的标准化流程，从切菜到装盘（Q/K/V + FFN + output）一丝不苟'
- '- **WavTokenizer = 音频解码糕点店**：PosNet 是上裱花机（6 层异构），ConvNeXt 是精修模具（残差 + gamma 缩放），全程要不停翻面（transpose）'
- 就像不同餐厅各有自己的招牌菜，llama.cpp 的每个编码器模型都通过精心组合 Pre-Norm / Post-Norm、QKV 融合方式、FFN 激活、RoPE
  策略等"调味料"，形成自己独特的"风味"。
'no': 30
summary:
- concept: '`llm_build_bert::llm_build_bert()`'
  desc: 经典 BERT：Post-Norm、绝对位置嵌入、可选 type_embd、qkv 融合 + 独立双路径、按架构切换 GELU/GEGLU/SiLU
- concept: '`llm_build_modern_bert::llm_build_modern_bert()`'
  desc: 现代 BERT：Pre-Norm、强制 wqkv 融合、per-layer RoPE、GEGLU + SEQ、末端 output_norm
- concept: '`llm_build_neo_bert::llm_build_neo_bert()`'
  desc: 精简 BERT：RMSNorm + SWIGLU + 全局 RoPE、无中间层 norm、仅产 embedding
- concept: '`llm_build_eurobert::llm_build_eurobert()`'
  desc: 独立 QKV 编码器：Pre-Norm + RMSNorm、SiLU + PAR、RMSNorm 统一、逐层调用基础设施
- concept: '`llm_build_t5_enc::llm_build_t5_enc()`'
  desc: T5 编码器：相对位置桶偏置（attn_rel_b_enc）、ReLU vs GELU 双 FFN、控制向量 cvec
- concept: '`llm_build_t5_dec::llm_build_t5_dec()`'
  desc: T5 解码器：自注意 + 交叉注意 + 位置桶、双产物（t_embd + t_logits）
- concept: '`llm_build_paddleocr::llm_build_paddleocr()`'
  desc: Qwen2VL 变体：M-RoPE 四段、Q/K/V/Out 偏置可选、SwiGLU + 控制向量
- concept: '`llm_build_pangu_embedded::llm_build_pangu_embedded()`'
  desc: 昇腾嵌入：Pre-Norm + RMSNorm、全 Q/K/V/FFN/Output 偏置、SwiGLU + PAR
- concept: '`llm_build_wavtokenizer_dec::llm_build_wavtokenizer_dec()`'
  desc: 音频解码：PosNet 6 层异构（4 卷积 + 1 注意力 + 1 norm）+ ConvNeXt 残差（gamma 缩放）
- concept: '`ggml_view_3d` 切分 Q/K/V'
  desc: wqkv 融合权重按字节偏移取出 Q/K/V，零拷贝视图
- concept: '`ggml_rope_multi`'
  desc: 多段 RoPE，支持 M-RoPE 时间/高度/宽度分段频率
- concept: '`build_attn_inp_no_cache`'
  desc: 无缓存注意力输入，编码器专用（双向注意力，不需 KV Cache），来自 llm_graph_context 基类
- concept: '`build_attn_inp_kv`'
  desc: 带 KV 缓存的自注意力输入，来自 llm_graph_context 基类
- concept: '`build_attn_inp_cross`'
  desc: 交叉注意力输入，K/V 来自编码器输出，来自 llm_graph_context 基类
- concept: '`build_pos_bias`'
  desc: 构建 T5 相对位置偏置，将位置桶映射到 attention bias，来自 llm_graph_context 基类
- concept: '`build_cvec`'
  desc: 在每层 FFN 后注入控制向量（cvec）以调节模型行为，来自 llm_graph_context 基类
- concept: '`build_inp_pos / build_inp_embd`'
  desc: 位置与 token 嵌入输入构建基础设施，被几乎所有模型复用，来自 llm_graph_context 基类
- concept: '`build_norm`'
  desc: 通用归一化入口，支持 LLM_NORM / LLM_NORM_RMS / LLM_NORM_GROUP 等类型，来自 llm_graph_context
    基类
- concept: '`build_ffn`'
  desc: 通用前馈网络入口，支持 SEQ/PAR 模式与多种激活函数，来自 llm_graph_context 基类
- concept: '`build_attn`'
  desc: 通用注意力入口，统一调度 KV 缓存、Flash Attention、QKV bias 等，来自 llm_graph_context 基类
