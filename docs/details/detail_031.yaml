  name: WavTokenizer-Dec —— 音频解码的「ConvNeXt + PosNet」
  'no': 9
  points:
  - '**WavTokenizer 的双重使命**：将离散音频 token 转回连续波形'
  - '- PosNet 负责上采样生成频谱帧'
  - '- ConvNeXt 负责精修频谱细节'
  - '**PosNet 六层异构设计**'
  - '- 前两层/三四层（0,1,3,4）：纯卷积残差块（norm → sigmoid → conv → norm → sigmoid → conv）'
  - '- 第二层（2）：中间自注意力层（conv Q/K/V → transpose → 注意力 → conv 输出）'
  - '- 第五层（5）：仅 norm，无后续变换（聚合层）'
  - '**GLU 风格的激活函数**'
  - '- `cur = ggml_mul(sigmoid(cur), cur)`：GLU 激活'
  - '- 这与标准 LLM 的 GELU/SiLU 完全不同'
  - '**ConvNeXt 残差块**'
  - '- 逐通道卷积（dw） → transpose → norm → GELU FFN → gamma 缩放 → 残差'
  - '- `LLM_FFN_GELU` + `LLM_FFN_SEQ`：标准 FFN 调用'
  - '- `layer.gamma` 作为可学习缩放因子'
  - '**transpose 的必要性**'
  - '- 多个地方需要 `ggml_cont(ctx0, ggml_transpose(...))`'
  - '- 因为 `ggml_conv_1d_ph` 要求特定内存布局'
  - '- 这种显式 transpose 是音频模型的典型工程负担'
  - '**解码器的输出头**'
  - '- 最终 norm → lm_head（`model.output`） → 加 `output_b`'
  - '- 输出 `t_embd` 即可重建波形信号'
