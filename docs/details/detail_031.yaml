- contents:
  - 阅读 `src/models/modern-bert.cpp`、`src/models/neo-bert.cpp`、`src/models/eurobert.cpp`，对比三种
    Pre-Norm 编码器的实现差异：
  - 1. ModernBERT 的 per-layer RoPE 与 NeoBERT/EuroBERT 的全局 RoPE 实现区别是什么？
  - 2. 三者中谁的 FFN 调用了 `LLM_FFN_SEQ`，谁调用了 `LLM_FFN_PAR`？为什么？
  - 3. 哪些模型保留了 `attn_out_norm`/`layer_out_norm` 中间层 norm，哪些省略？
  - 回答问题：
  - '- 如果让你设计一个新的编码器，你会优先选择哪种 FFN 模式？为什么？'
  - '- ModernBERT 通过 `model.get_rope_freq_base/scale(cparams, il)` 实现了什么高级能力？'
