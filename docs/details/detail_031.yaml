  name: ModernBERT —— 新派编码器的「Pre-Norm 改良派」
  'no': 2
  points:
  - '**为什么需要 ModernBERT？** 在 BERT 基础上引入 Pre-Norm、RoPE、SwiGLU 等现代优化'
  - '- 与传统 BERT 的 Post-Norm 相比，Pre-Norm 训练更稳定、收敛更快'
  - '**输入嵌入流程**'
  - '- 通过 `build_inp_pos()` 获取位置嵌入输入'
  - '- 通过 `build_inp_embd(model.tok_embd)` 构建 token 嵌入'
  - '- `build_norm` 对 `tok_norm` 做嵌入层归一化'
  - '**关键简化：纯 QKV 融合**'
  - '- 强制使用 `wqkv` 融合权重，不再支持 wq/wk/wv 三独立路径'
  - '- 通过 `ggml_view_3d` 切分 Q/K/V，字节偏移由 `type_size` 动态决定'
  - '**Per-layer RoPE 频率**'
  - '- 调用 `model.get_rope_freq_base/scale` 获取逐层独立的旋转频率'
  - '- 这是现代长上下文扩展的关键：低层高频细节，高层低频全局'
  - '**Pre-Norm + 残差设计**'
  - '- 每个子层（注意力、FFN）前都有独立的 `build_norm`（`attn_norm` / `ffn_norm`）'
  - '- 残差连接：`cur = cur + inpL`、`cur = cur + ffn_inp`'
  - '- 这与经典 BERT 的 Post-Norm「先注意再 Norm 再残差」完全相反'
  - '**FFN 结构：GEGLU 平行门控**'
  - '- 使用 `LLM_FFN_GEGLU` + `LLM_FFN_SEQ`，即门控线性单元'
  - '- `ffn_up` 与 `ffn_gate` 并行计算后逐元素相乘'
  - '**省略中间层 Norm**'
  - '- 不再有 `attn_out_norm`/`layer_out_norm`，进一步简化图结构'
  - '- 直接在末端做 `output_norm` 即可'
