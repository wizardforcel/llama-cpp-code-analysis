  name: OpenELM：苹果的「层级缩放」实验场
  'no': 2
  points:
  - OpenELM 每层可拥有不同的 `n_head / n_head_kv`，支持层级粒度的容量分配
  - '`n_head_qkv = 2*n_head_kv + n_head` 是 QKV 拼接尺寸的显式声明，避免运行时歧义'
  - Q/K 在 RoPE 之前先经过 `LLM_NORM_RMS` 归一化（`attn_q_norm`/`attn_k_norm`），提升数值稳定性
  - FFN 使用 SwiGLU 风格的并行门控（`ffn_gate`），是较新的激活范式
  - 残差直接以 `residual + cur` 形式叠加，无 post-norm 后置层，是 post-norm 风格 LLaMA 的变体
