  name: Falcon 与 StableLM：「非主流开源」的工程变体
  'no': 3
  points:
  - '**Falcon-40B 双归一化分支**：`attn_norm_2` 存在时，注意力路径使用第二份归一化结果而非主 norm'
  - Falcon FFN 使用 `attn_norm`（注意力的归一化结果）作为输入，而非残差后的张量，节省一次归一化
  - Falcon 通过 `cur + ffn_inp + inpL` 的三路累加保留多层残差
  - '**StableLM 的「并行残差」**：`ffn_norm` 缺失时，FFN 直接复用 `inpSA`，是并行分支的实现'
  - StableLM 支持可选的 `attn_q_norm / attn_k_norm`，与 Qwen 系模型类似
  - 二者均采用 QKV 分离投影，Falcon 用 NeoX 风格 RoPE，StableLM 则遵循 LLaMA 风格
