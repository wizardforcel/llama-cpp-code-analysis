life_analogy:
- 想象本章的模型家族是一座**大模型博物馆的'长尾展厅'**：
- '- **GPT-2 / GPT-NeoX** = 博物馆入口处的''复古老爷车''——经典设计、位置嵌入或并行残差是早期工艺'
- '- **OpenELM** = 苹果出品的''可调节层高书架''——每层高度（head 数）可独立调节，最大化空间利用'
- '- **Falcon / StableLM** = ''双车道高速公路''——attn_norm_2 或 ffn_norm 缺失时允许车辆并行通过'
- '- **MPT / Refact** = ''带安全阀的压力容器''——f_clamp_kqv 截断数值、Refact 极致精简是''安全且极简''的工程哲学'
- '- **Bloom / CodeShell** = ''博物馆的化石标本''——token 级前置归一化、CodeShell 是代码专用分支'
- '- **Cohere2-ISWA / Command-R** = ''双层玻璃幕墙''——ISWA 提供内外双层缓存，SWA 层透光（不 RoPE）'
- '- **EXAONE 系列** = LG 推出的''三代折叠屏手机''——三代演进（基础→MoE→模板化 ISWA）'
- '- **Granite / Nemotron** = ''精密工业仪器''——残差缩放、ReLU² 激活是工程师对精度的极致追求'
- '- **OLMo 系列** = ''开源科学的实验笔记本''——无显式权重、模板化 ISWA、Softmax gating 三连发'
- '- **Phi 系列** = ''微软的精打细算小车''——Q 缩放防精度漂移、模板化 ISWA 兼顾灵活性'
- '- **StarCoder / JAIS** = ''代码生成器与多语种翻译机''——位置嵌入到 RoPE 的演进、阿拉伯语特化'
- '- **PLM / MiniCPM3** = ''压缩行李箱''——MLA 压缩 KV/Q、多层缩放节省空间'
- '- **SmolLM3** = ''会跳绳的舞者''——隔层去 RoPE 是节奏感的体现'
- '- **BitNet / Apertus** = ''实验室原型机''——1-bit 量化、xIELU 激活是数学家的玩具'
- '- **AFMoE / Dream / Deci** = ''AI 界的实验剧场''——门控注意力、扩散、层级自由组合各有看头'
- '- **Orion / Xverse / MainCoder / Plamo / Seed-OSS / Minimax-M2** = ''长尾展厅里的小众藏品''——每个都有独特的故事'
- 就像博物馆策展人需要为每件展品挑选最合适的展台与灯光，llama.cpp 的作者也为每个模型家族精心设计了专属的图构建器。
