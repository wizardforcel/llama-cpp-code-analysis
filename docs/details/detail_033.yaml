  name: GPT 家族：早期解码器的「复古双打」
  'no': 1
  points:
  - '**GPT-2：带位置嵌入的''老派''范式**——`pos_embd` 张量在嵌入层之后被加到输入上'
  - GPT-2 使用 `attn_norm_b` 偏置归一化，QKV 共享一个 `wqkv` 大矩阵后通过 `ggml_view_3d` 切片
  - GPT-2 FFN 用标准 `LLM_FFN_GELU + LLM_FFN_SEQ`（无门控），是早期 Transformer 的经典配方
  - '**GPT-NeoX：并行残差的早期实验**——`use_par_res` 控制 Attention 与 FFN 是否在同一分支并行计算'
  - GPT-NeoX 在 RoPE 上使用 NeoX 风格的 `rope_type`，并显式调用 `ggml_rope_ext` 注入位置信息
  - 二者都不使用位置嵌入作为唯一信号，依赖 RoPE 完成 token 间相对位置感知
