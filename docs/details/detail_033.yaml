  - 5. Plamo 的 `sa_inp = cur` 复用意味着 attn_norm 的输出被 FFN 复用，这与 StableLM 的 `inpSA` 设计有何异奇同工？
  - 回答问题：
  - '- 三路累加（Plamo）比两路累加（标准）多一次 `ggml_add`，它是否影响推理并行度？'
  - '- post-RoPE 归一化（MainCoder）与 pre-RoPE 归一化（OpenELM）在数学上是否等价？请推导。'
  'no': 12
  title: 深入小众架构：Plamo / Seed-OSS / MainCoder / Minimax-M2
