  - '**common.py：核心工具库**'
  - '- **环境变量管理**：get_model_name_from_env_path 统一处理 MODEL_PATH/CONVERTED_MODEL 路径解析'
  - '- **张量调试**：'
  - '  - summarize()：模拟 llama.cpp 调试输出格式，支持 2D/3D/4D 张量，显示首尾序列值'
  - '  - debug_hook()：注册 PyTorch forward hook，自动打印模块输入输出'
  - '- **RoPE 调试**：setup_rope_debug 猴子补丁 apply_rotary_pos_emb 函数，追踪旋转位置编码的 Q/K 变化'
  - '- **版本检查**：'
  - '  - get_model_transformers_version 读取 config.json 中的版本要求'
  - '  - show_version_warning 判断版本兼容性并给出警告'
  - '  - exit_with_warning 在发现版本不匹配时优雅退出'
  - ''
  - '**inspect-org-model.py：Safetensors 解剖刀**'
  - '- 支持多文件模型（model.safetensors.index.json）和单文件模型'
  - '- 张量列表模式：显示归一化名称（层号替换为#）、dtype、shape、大小'
  - '- 单张量检查：读取 safetensors header 获取元数据，打印前 N 个数值'
  - '- 张量大小计算：优先使用 data_offsets，否则按 dtype*shape 推算'
  - '- 便捷功能：'
  - '  - format_size()：人类可读的字节格式化（KB/MB/GB）'
  - '  - normalize_tensor_name()：将具体层号抽象为模式，便于对比不同层'
  - '  - get_all_tensor_names() 与 find_tensor_file()：快速定位张量所在文件'
  - '  - read_safetensors_header()：底层读取 safetensors 二进制头部'
  - ''
