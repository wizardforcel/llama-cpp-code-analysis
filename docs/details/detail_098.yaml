  - '**评估流程**'
  - 1. 加载参考 logits（PyTorch）和测试 logits（llama.cpp）
  - 2. 检查形状匹配（Shape mismatch 直接报错）
  - 3. 计算 MSE、NMSE、最大/平均绝对误差
  - 4. 根据阈值给出 PASS/NEEDS REVIEW 结论及修复建议
