  - '- **NMSE（归一化均方误差）**：MSE / 参考方差，消除数据规模影响'
  - '- 分级解读：Perfect (<1e-6) → Excellent (<1e-4) → Good (<1e-2) → Acceptable (<0.1)
    → Poor (>1.0)'
  - '- 支持多种输入格式：.npy（NumPy）、.bin（原始二进制）、文本文件（带索引）'
  - '- 输出 dB 值（10*log10(NMSE)）便于信号处理视角分析'
