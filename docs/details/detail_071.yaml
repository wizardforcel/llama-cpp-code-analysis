  name: 均值法：最简单的方向提取 —— 「平均即方向」
  'no': 6
  points:
  - '**mean 命名空间与 run 函数**'
  - '- `mean.hpp` 定义了 `mean` 命名空间，包含核心函数 `run()`'
  - '- 输入：每层差异矩阵（`[n_embd, n_samples]`）'
  - '- 输出：每层方向向量（写入 `direction.{i}`）'
  - '**核心算法**'
  - '- 对每列（每个样本的嵌入维度）计算均值'
  - '- 对方向向量做 L2 归一化，使其长度为 1'
  - '**优点与适用场景**'
  - '- 计算简单、无需迭代'
  - '- 适合样本量较小或方向一致性较高的场景'
  - '**与 PCA 的对比**'
  - '- 均值法只取「平均方向」，而 PCA 取「最大方差方向」'
  - '- 若数据分布较均匀，两者效果接近；若存在多个子方向，PCA 更优'
