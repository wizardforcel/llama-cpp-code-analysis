  name: PCA 降维：幂迭代法 —— 用 ggml 计算图求主成分
  'no': 7
  points:
  - '**为什么选择幂迭代法？**'
  - '- 传统 PCA 需计算协方差矩阵 + 特征分解，复杂度高'
  - '- 幂迭代法通过反复矩阵乘法逼近最大特征向量，适合用 ggml 在 GPU 上加速'
  - '**核心步骤**'
  - '- 计算协方差矩阵：`square = input^T * input`（仅第一次迭代需要）'
  - '- 幂迭代：`eigenvector = square * eigenvector`，归一化后重复'
  - '- 每次迭代计算新旧特征向量的距离，若小于阈值则提前收敛'
  - '**pca_model：封装后端与张量**'
  - '- 构造函数自动选择 CUDA 或 CPU 后端'
  - '- 管理 `dev_input`、`dev_square`、`dev_eigenvector` 三个核心张量'
  - '- 随机初始化特征向量并归一化'
  - '**析构函数**'
  - '- 释放 ggml 上下文、后端缓冲区与后端资源'
