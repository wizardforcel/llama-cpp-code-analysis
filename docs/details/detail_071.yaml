learning_targets:
- 理解控制向量（Control Vector）的基本原理与「行为调节」机制
- 掌握基于正负提示对的激活差异采集方法
- 熟悉 llama.cpp 回调机制（cb_eval）在隐藏层捕获中的应用
- 理解均值法与 PCA 幂迭代法在降维中的实现与适用场景
- 掌握使用 ggml 构建 PCA 计算图并在 GPU/CPU 后端执行的技巧
- 能够将控制向量导出为 GGUF 并在推理时加载应用
life_analogy:
- 想象控制向量生成器是一位「行为调音师」：
- '- **正负提示对** = 两组对照实验（快乐 vs 悲伤）'
- '- **隐藏层捕获** = 在模型大脑里安装监听器，记录每层的反应'
- '- **差异计算** = 对比两次实验的脑电波波形，提取行为信号'
- '- **均值法** = 把所有反应取平均，像个粗略但快速的调音旋钮'
- '- **PCA 幂迭代** = 找到最主要的频率，就像调准乐器的基音'
- '- **GGUF 导出** = 把调好的旋钮打包成标准配件，供模型加载使用'
'no': 70
summary:
- concept: cb_eval 回调
  desc: 在推理时拦截指定张量，收集每层隐藏状态
- concept: 正负提示对
  desc: 构造对比实验，提取行为方向的基础输入
- concept: tokenized_prompt
  desc: 封装并填充正负提示 token 序列，保证长度一致
- concept: callback_data
  desc: 存储并计算正/负激活差异的数据结构
- concept: filter_nonzero_rows
  desc: 过滤 padding 行，保留有效激活样本
- concept: train_context
  desc: 汇总所有提示对差异的「训练仓库」
- concept: build_v_diff
  desc: 将临时字节流构建成二维差异矩阵
- concept: mean::run
  desc: 取每层差异均值并归一化的方向提取方法
- concept: PCA 幂迭代
  desc: 用 ggml 图迭代求主成分方向的降维方法
- concept: build_graph_piter
  desc: 构建包含批量迭代的 PCA 计算图
- concept: compute_piter
  desc: 执行图计算并提取特征向量与距离
- concept: power_iteration
  desc: 多轮迭代直至收敛的主循环
- concept: export_gguf
  desc: 将最终控制向量写入 GGUF 供推理使用
