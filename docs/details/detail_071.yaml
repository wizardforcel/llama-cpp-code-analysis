  'no': 4
  points:
  - '**calc_diff：计算正负差异**'
  - '- 对每一层，执行 `v_pos[i] -= v_neg[i]`，得到差异张量'
  - '- 调用 `filter_nonzero_rows` 去除全零行（即未参与当前 token 的 padding 部分）'
  - '**filter_nonzero_rows：只保留有效行**'
  - '- 遍历每一行，若所有元素都接近零（< 1e-6），则视为无效'
  - '- 将有效行拷贝到新张量，尺寸为 `[n_embd, n_nonzero_rows]`'
  - '- 这一步确保后续 PCA/均值计算不受 padding 干扰'
  - '**reset：清理资源**'
  - '- 释放 `v_pos`、`v_neg`、`v_diff_filtered` 中所有张量的数据'
  - '- 销毁临时 ggml 上下文，为下一对提示做准备'
