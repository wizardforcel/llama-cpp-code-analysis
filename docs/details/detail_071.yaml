  name: 控制向量生成器总览 —— 模型行为的「隐形遥控器」
  'no': 1
  points:
  - '**什么是控制向量（Control Vector）？**'
  - '- 通过对比「正提示」与「负提示」在模型各隐藏层的激活差异，提取出能代表某种行为方向的向量'
  - '- 例如：让模型更「诚实」、更「快乐」、更「简洁」等，只需在推理时将此向量加到对应层'
  - '- 类似于给模型安装一个「行为调节器」，无需重新训练'
  - '**核心工作流程**'
  - '- 加载模型 → 读取正负提示对文件 → 逐对推理获取隐藏层输出 → 计算差异 → 降维（PCA/均值） → 导出 GGUF'
  - '- 最后生成的 `control_vector.gguf` 可在 llama.cpp 中通过 `--control-vector` 加载使用'
