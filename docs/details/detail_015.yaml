  name: BPE 分词器实现 —— GPT/LLaMA 家族的「rank 表驱动合并」
  'no': 5
  points:
  - '**为什么 BPE 用 rank 而非 score？**'
  - '- BPE（Byte Pair Encoding）按「合并规则的出现顺序」分配 rank，rank 小的 pair 优先合并'
  - '- 训练阶段把所有相邻 token pair 按频次排序写入 merges.txt；推理时按 rank 合并即可保证一致性'
  - '`llm_tokenizer_bpe` 构造函数：为每个 `LLAMA_VOCAB_PRE_TYPE_*` 绑定专属 `regex_exprs`（如 LLaMA3
    用 `(?i:''s|...)`）'
  - '`llm_tokenizer_bpe_session::tokenize` 关键点：'
  - '- 先用 `unicode_regex_split` 按 regex 切分文本为 word 集合（可选 `byte_encode` GPT-2 字节编码）'
  - '- 每个 word 内部建立字符级符号链表，循环 `add_new_bigram` 加入优先级队列'
  - '- 合并时校验 `left_token+right_token == bigram.text` 防止过期 bigram 误用'
  - '- 合并后通过 `symbols_final` 跨 word 维护 next/prev 链表，最终输出保持原始顺序'
  - '`llm_tokenizer_bpe_session::append_bos/append_eos/check_double_bos_eos` 处理自动
    BOS/EOS 注入与重复警告'
  - '`llama_priority_queue::pop_move` 提供移动语义的 pop，避免大对象拷贝'
