  name: 正则表达式分词 —— 模型预分词的「自定义加速器」
  'no': 2
  points:
  - '**为什么需要为不同模型定制正则分词？**'
  - '- 标准 `std::regex` 对 Unicode 类别（`\p{L}` 等）支持有限，且性能较差；每种模型有独特的预分词规则'
  - '- GPT-2 分词器用 `''s|''t|''re|''ve|''m|''ll|''d| ?\p{L}+| ?\p{N}+| ?[^\s\p{L}\p{N}]+|\s+(?!\S)|\s+`
    把文本切成单词、数字、标点三大类'
  - '- LLaMA-3 在 GPT-2 基础上增加数字定长（`\p{N}{1,3}`）、行尾换行处理、大小写不敏感等扩展'
  - '- Kimi-K2 用 Han 字符优先匹配，并支持大小写不敏感的英文子词（含撇号缩写）'
  - '- AFMOE 数字按 `digit_count % 3` 分组（1/2 + 3+3+...），模拟十进制分组的可读性'
  - '- Gemma4 仅按 `\n` 切分（BPE 内部不允许 token 跨换行）'
  - '- 通过 `unicode_regex_split_custom` 分发器自动选择对应实现，未匹配时回退到 `std::regex`'
