  name: SPM 分词器实现 —— SentencePiece 的「优先级队列合并」
  'no': 4
  points:
  - '**为什么 SPM 用优先级队列而非 BPE 的 rank？**'
  - '- SPM（SentencePiece）按 token 的 `score`（对数概率）排序，score 高的 pair 优先合并；与 BPE 的固定 rank
    表形成对比'
  - '`llm_tokenizer_spm_session::tokenize` 三阶段流程：'
  - '- **初始化符号链表**：按码点切分文本，每个符号含 prev/next 指针维护双向链表'
  - '- **种子队列**：扫描所有相邻字符对，调用 `try_add_bigram` 检查是否在 vocab 中'
  - '- **贪心合并**：循环 pop 队列顶 bigram，若两符号未被合并且长度匹配则合并右侧到左侧'
  - '`resegment` 兜底逻辑：当合并后的子串仍不在 vocab 中时，先查 `rev_merge` 缓存尝试再分，否则按字节回退'
  - '`try_add_bigram` 同时维护 `work_queue` 和 `rev_merge`（文本→(left,right) 映射），是 resegment
    的逆向索引'
  - '`llm_bigram_spm::comparator` 排序规则：`(l.score < r.score) || (l.score == r.score
    && l.left > r.left)`'
