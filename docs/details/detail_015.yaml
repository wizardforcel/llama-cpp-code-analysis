  name: WPM / UGM / RWKV / PLaMo2 分词器 —— 百花齐放的「专用工具箱」
  'no': 6
  points:
  - '**为什么需要多种专用分词器？**'
  - '- WPM（WordPiece）用于 BERT 类编码器模型，靠最长前缀匹配 + `token_unk` 兜底'
  - '- UGM（Unigram）用于 T5 等基于 SentencePiece 的 LM，用 Viterbi 算法找全局最优分词路径'
  - '- RWKV 通过 `naive_trie` 字典树实现 O(n) 的最长匹配查找'
  - '- PLaMo2 用 Trie 表 + 动态规划（`scores`/`path` 数组）实现基于后缀表的贪心匹配'
  - '`llm_tokenizer_wpm_session::preprocess` 完成 NFD 规范化、小写化、标点/汉字分词预处理，再按 `max_token_len`
    贪心匹配'
  - '`llm_tokenizer_ugm_session` 通过 XCDA（XOR-compressed Double Array）实现 O(1) 前缀规范化查表
    + Viterbi 反向回溯'
  - '`llm_tokenizer_ugm_session::normalize_prefix` 通过 `xcda_array_view` 位运算解码 BASE/LCHECK/LEAF'
  - '`llm_tokenizer_rwkv_session` 通过 `naive_trie::traverse` 找到最长匹配 token，未匹配则返回 unk'
  - '`llm_tokenizer_plamo2::build` 构造 `tokens_`/`bytes_`/`to_suffix_id_`/`table_`
    四张表'
  - '`llm_tokenizer_plamo2::encode` 从后向前 DP 回溯，未匹配则回退到字节token'
