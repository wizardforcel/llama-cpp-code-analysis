  name: Unicode 支持：编码与规范化 —— 文本与 Token 的「第一道翻译官」
  'no': 1
  points:
  - '**为什么需要 utf8 ↔ codepoint 的双向通道？**'
  - '- Tokenizer 的最小操作单位是 Unicode 码点而非字节，因此必须先把 UTF-8 字节流拆成码点序列'
  - '- 通过 `unicode_cpt_to_utf8()` / `unicode_cpt_from_utf8()` 实现字节与码点的互转，错误输入用 `0xFFFD`
    替换避免异常向上传播'
  - '- NFD 规范化（`unicode_cpts_normalize_nfd`）解决「音标复合字符」在不同源数据中的形态差异，是 SPM/WPM 分词器稳定性的前提'
  - '- 大小写转换（`unicode_tolower`）支持 LLaMA3 等大小写不敏感的预分词正则（如 `''(?i:''s|...)`）'
  - '- 汉字识别（`unicode_cpt_is_han`）为 Kimi-K2 等模型提供 CJK 字符的快速判别，配合正则 `\p{Han}+` 完成中文分词'
