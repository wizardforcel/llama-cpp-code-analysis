  name: 分词与反分词 —— 文本与 Token 的「双向翻译官」
  'no': 7
  points:
  - '**为什么分词/反分词要严格对称？**'
  - '- 推理服务需要把用户输入文本转成 token ID 给模型，再把模型输出的 token ID 还原成文本回传'
  - '`llama_vocab::impl::tokenize` 主入口：'
  - '- 先用 `tokenizer_st_partition` 切出特殊 token（按 cache 长度倒序匹配）'
  - '- 按 vocab 类型分发到 SPM/BPE/WPM/UGM/RWKV/PLaMo2 的 session::tokenize'
  - '- BPE 额外处理 `escape_whitespaces`（`▁` ↔ 空格转换）和 `byte_encode`（GPT-2 字节映射）'
  - '`llama_vocab::impl::detokenize` 三遍清理：'
  - '- 第一遍去掉 `?`,`!`,`.`,`,` 前的多余空格'
  - '- 第二遍处理被空格包围的撇号 `'' ''`'
  - '- 第三遍处理 `''s`,`''m`,`''re`,`''ve` 等英语缩写前的空格'
  - '`token_to_piece_for_cache` 在 load 时预生成所有 token→文本缓存，避免推理时重复计算'
  - '`token_to_piece` 按 vocab 类型差异化还原：SPM `▁`↔空格、BPE 字节token解码、RWKV 转义解码'
  - C API 层（`llama_tokenize`/`llama_detokenize`/`llama_token_to_piece`）将 C++ 接口暴露给
    C 用户
