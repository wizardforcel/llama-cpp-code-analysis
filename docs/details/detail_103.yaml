learning_targets:
- 理解后端采样器（GPU/CPU）的测试框架设计与生命周期管理
- 掌握贪心、Top-K、Top-P、Min-P、Temperature 及 Temperature-Ext 等采样策略的验证方法
- 学会构建多序列混合采样（后端+CPU）的测试场景与动态切换机制
- 掌握采样器动态清除、替换与重新挂载的技术细节
- 理解 PEG 解析器在聊天模板结构化输出中的构建与验证流程
- 掌握 OpenAI 兼容层消息与工具定义的双向 JSON 序列化验证
- 学会使用 Diff Split 算法分析模板变体差异以识别推理/工具标记
- 掌握流式场景下的增量解析、消息差异计算与 UTF-8 安全截断
- 理解模板自动分析器（Auto-Parser）对 Seed-OSS、Cohere、Nemotron 等模型的格式检测原理
life_analogy:
- 想象 llama.cpp 的采样与聊天模板系统是一家**多语言新闻编辑室**：
- '- **后端采样测试** = 多语言播音员的一致性校验：确保中文（GPU）、英文（CPU）、法文（Metal）播音员对同一份新闻稿（logits）的播报结果（采样token）完全一致，即使他们有不同的发音习惯（硬件架构差异）。'
- '- **混合采样架构** = 主编与实习生的协作：GPU是经验丰富的主编（快速筛选/Top-P），CPU是细心的事实核查员（精确的Distribution采样），两者必须无缝配合产出最终稿件，且能随时互换角色（llama_set_sampler动态切换）。'
- '- **采样器生命周期管理** = 值班编辑的换岗机制：原来负责国际新闻的编辑（GPU采样器）被临时撤下（llama_set_sampler nullptr），由本地新闻编辑（CPU采样器）接手，验证新闻稿仍能正常产出，且随时能换回国庆特别报道组（重新设置后端采样器）。'
- '- **聊天模板测试** = 多语言排版室的格式校验：同一段采访内容（消息列表）需要被翻译成中文（Qwen模板）、阿拉伯文（回文方向）、代码（JSON结构化）等多种版面，确保关键信息（工具调用、推理内容）不丢失（重构验证）。'
- '- **PEG解析器构建器（peg_builder）** = 高级编辑的"结构化速记法"：提供standard_json_tools、tool_arg等组合子，让编辑能用声明式语法（.content().until()）快速搭建出能识别特定格式（XML、JSON）的速记规则，将语音流（模型输出）实时转录为带标点、分段、引用标记的规范文稿。'
- '- **模板自动分析器（Auto-Parser）** = 版面侦探：通过对比"有标题版"和"无标题版"（compare_variants），自动推断出哪里是导语（reasoning）、哪里是正文、哪里是图片说明（tool
  call），无需人工预先定义标记位置。'
- '- **Diff Split算法** = 文本比对扫描仪：精确计算两段文本的公共前缀与后缀，定位真正发生变化的中间部分（差异段），并智能处理标签边界（如未闭合的XML标签），确保切割点不会破坏语义完整性。'
