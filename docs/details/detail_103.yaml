  name: 采样器单元测试框架 —— 「概率分布的显微镜」
  'no': 4
  points:
  - '**sampler_tester 设计模式**'
  - '- 双构造函数支持：Logits 输入（自动 softmax）或显式概率输入'
  - '- 等概率初始化与显式概率注入两种模式，覆盖不同测试场景'
  - '- `apply()` 链式应用采样器，自动资源管理（llama_sampler_free）'
  - '- `check()` 验证最终概率分布与期望误差 < 1e-5，确保数学正确性'
  - '**经典采样算法数学验证**'
  - '- Temperature：验证 `softmax(logits/temp)` 缩放效果，包括 temp=0 退化为贪心'
  - '- Top-K：保留概率最高的 K 个候选，验证排序与截断正确性'
  - '- Top-P：核采样保留累积概率超过 P 的最小集合，验证动态截断'
  - '- Min-P：保留概率 > max_prob × p 的候选，验证相对阈值过滤'
  - '**高级采样器特性**'
  - '- XTC：排除尾部极低概率 token，验证阈值截断'
  - '- Typical：基于局部熵的自适应截断，验证信息论驱动的选择'
  - '- Penalties：重复惩罚与频率/存在惩罚的精确计算'
  - '- DRY (Dynamic Repetition penalty)：基于后缀自动机的重复模式检测与惩罚'
  - '**测试数据构造技巧**'
  - '- 手工构造概率分布验证边界情况（如全零、单峰、均匀分布）'
  - '- 使用 `llama_sampler_init_dry_testing` 注入测试历史，模拟长上下文重复'
