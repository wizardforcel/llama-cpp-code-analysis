- contents:
  - 阅读 `tests/test-backend-sampler.cpp` 第 861-920 行（`test_backend_set_sampler`）和第
    922-1010 行（`test_backend_cpu_mixed_batch`）。
  - 修改测试代码，在清除后端采样器后、重新设置前，尝试使用 `llama_get_sampled_logits_ith` 访问 logits，观察并记录返回值（应为
    nullptr）。
  - 设计一个新测试：连续切换 3 次采样器（GPU→CPU→GPU→CPU→GPU），验证每次切换后 `llama_decode` 是否仍能正确返回，且 token
    生成逻辑符合当前激活的采样器类型。
  - 思考问题：`llama_set_sampler(ctx, seq_id, nullptr)` 后，为什么必须重新 `decode` 或调用 `llama_sampler_sample`
    才能获取新的 token？`llama_get_sampled_token_ith` 在此状态下的行为预期是什么？
