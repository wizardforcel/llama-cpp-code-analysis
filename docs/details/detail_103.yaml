summary:
- concept: test_context
  desc: 后端采样测试的核心封装类，管理llama_context生命周期、多序列状态与批次信息映射
- concept: llama_get_sampled_token_ith
  desc: 从后端（GPU）获取已采样token的关键API，用于验证硬件计算结果与CPU的一致性
- concept: llama_set_sampler
  desc: 动态更换或清除（nullptr）序列采样器，实现GPU与CPU采样策略的热切换与降级
- concept: test_backend_temp_ext_sampling
  desc: 验证扩展温度采样（Delta/Exponent参数）在后端的正确性，包括边界温度处理
- concept: sampler_tester
  desc: 单元测试框架，通过logit输入与期望概率的微观对比（<1e-5）验证采样算法数学正确性
- concept: Backend/CPU 混合采样
  desc: 同一batch中部分序列使用GPU快速过滤，部分使用CPU精确采样，验证资源隔离与正确性
- concept: test_sampler_queue
  desc: 验证多采样器链（Top-K → Top-P → Min-P）组合后的候选集边界与排序正确性
- concept: peg_tester / peg_test_builder
  desc: 链式调用API（.test().reasoning_format().expect().run()），声明式验证模板解析与重构无损性
- concept: make_peg_parser
  desc: PEG解析器构造封装，应用聊天模板参数并加载arena，提供parse()入口
- concept: common_chat_msg_diff::compute_diffs
  desc: 计算消息增量差异的核心算法，支持流式场景下的工具调用参数累积与UTF-8安全截断
- concept: calculate_diff_split
  desc: 差分算法核心，计算公共前缀/后缀以定位模板变体间的推理标记与工具标记边界
- concept: compare_variants
  desc: 通过对比启用/禁用推理、工具、系统提示的模板输出，自动识别模板的reasoning和tool标记
- concept: common_chat_peg_builder组合子
  desc: content/until/optional/tool_arg等链式组合子，声明式构建复杂工具调用语法
- concept: standard_json_tools
  desc: 标准JSON工具调用解析器构建，支持OpenAI/Cohere/Function-as-Key三种主流格式
- concept: normalize_quotes_to_json
  desc: 处理模型输出中的单引号→双引号转换与转义，确保工具调用参数为合法JSON
- concept: 增量解析（Incremental Parsing）
  desc: 基于COMMON_PEG_PARSE_FLAG_LENIENT的部分输入容错机制，支持流式输出实时解析与差异计算
- concept: llama_sampler_init_dry_testing
  desc: DRY（Dynamic Repetition penalty）测试注入接口，验证基于后缀自动机的重复抑制算法
- concept: 128K词表性能基准
  desc: 使用ggml_time_us()在1<<17词表上测量Top-K/Top-P/Min-P等算法的微秒级耗时
- concept: llama_decode多输出检测
  desc: 边界测试：单序列多输出标记触发非零错误码，防止非法批处理配置导致的未定义行为
- concept: match_string / match_string_detailed
  desc: 语法匹配诊断工具，验证GBNF语法对输入字符串的接受/拒绝状态及失败位置
- concept: message_assist* 预定义消息
  desc: 预构造的助手消息常量（含推理、工具调用、ID等），作为测试断言的期望基准
- concept: read_file / read_templates
  desc: 模板文件加载与初始化工具，支持从文件系统读取Jinja模板并进行解析测试
- concept: test_peg_parser
  desc: PEG解析执行器，封装模板应用→arena加载→消息解析的完整流程，含UTF-8安全截断
- concept: operator<<重载族
  desc: common_chat_msg、common_chat_msg_diff等的流输出重载，提供人类可读的调试输出
- concept: autoparser.analyze_template
  desc: 模板自动分析核心，通过差分检测自动识别推理标记、内容标记与保留令牌
- concept: tool_argument / tool_definition
  desc: 工具调用的数据结构封装，定义参数schema与函数元信息
