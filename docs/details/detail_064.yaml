exercises:
- contents:
  - 编写Python代码解析一个本地safetensors文件：
  - 1. 读取文件前8字节，解析元数据长度（小端u64）
  - 2. 读取元数据JSON，打印所有张量名称及其shape
  - 3. 计算第一个张量的数据起始偏移量（data_start_offset + data_offsets[0]）
  - 4. 使用numpy.memmap读取该张量的前10个元素
  - 思考问题：
  - '- 为什么safetensors使用8字节固定长度存储元数据大小？'
  - '- data_offsets[1] - data_offsets[0]与np.prod(shape) * dtype_size的关系是什么？'
  'no': 1
  title: 分析safetensors文件结构
- contents:
  - 基于SafetensorRemote实现一个自定义的LazyRemoteTensor类：
  - 1. 添加__getitem__方法，支持切片访问（如tensor[0:10, :]）
  - 2. 切片时只下载所需的字节范围，而非整个张量
  - 3. 实现简单的LRU缓存，避免重复下载相同数据
  - 4. 添加进度条显示，在下载大张量时展示进度
  - 思考问题：
  - '- 如果网络中断，如何实现断点续传？'
  - '- 对于形状为[10000, 10000]的F32张量，下载第5000行需要多少字节？'
  'no': 2
  title: 实现远程张量 lazy loading
- contents:
  - 编写脚本批量处理GGUF文件命名：
  - 1. 给定一个包含GGUF文件的目录，解析每个文件的元数据
  - 2. 提取参数量、量化类型、finetune信息
  - 3. 使用naming_convention()生成标准化文件名
  - 4. 处理冲突（如两个文件生成相同名称时添加序号）
  - 5. 支持dry-run模式，预览重命名结果而不实际执行
  - 思考问题：
  - '- 如果元数据中缺少finetune信息，如何从文件名推断？'
  - '- 对于MoE模型，如何验证size_label与实际的expert_count一致？'
  'no': 3
  title: 批量重命名GGUF文件
- contents:
  - 设计实验对比SafetensorRemote与SafetensorsLocal的性能：
  - 1. 选择一个100MB左右的safetensors文件
  - 2. 记录远程读取元数据的时间（第一次vs第二次，观察缓存效果）
  - 3. 记录本地读取元数据的时间
  - 4. 对比读取单个张量的延迟（远程HTTP Range vs 本地mmap）
  - 5. 分析网络带宽对远程读取的影响
  - 思考问题：
  - '- 在什么场景下远程读取比本地读取更有优势？'
  - '- 如何设计混合策略，对小文件用远程、大文件先下载后本地？'
  'no': 4
  title: 对比远程与本地读取性能
learning_targets:
- 掌握GGUF模型文件命名规范与模板填充机制
- 理解模型参数量的人类友好格式化与MoE特殊命名规则
- 深入理解Safetensors文件的二进制结构（8字节头+JSON元数据+数据段）
- 掌握HTTP Range请求实现远程大文件按需读取的技术
- 学会使用内存映射（mmap）高效处理本地大型safetensors文件
- 理解远程与本地张量读取的统一抽象与差异化实现
life_analogy:
- 想象GGUF工具集是一个**智能快递分拣中心**：
- '- **命名规范工具** = 快递面单打印机'
- '  - fill_templated_filename = 自动填充面单模板（如''包裹-{类型}.gguf''）'
- '  - model_weight_count_rounded_notation = 重量单位转换器（克→千克→吨）'
- '  - size_label = 特殊包裹标记（''8x7B''表示8个专家各7B的拼装件）'
- '  - naming_convention = 完整面单生成器（品牌-规格-版本-包装类型）'
- ''
- '- **远程safetensors读取** = 跨境电商的''按需采购''：'
- '  - SafetensorRemote = 海外代购专员'
- '  - HTTP Range请求 = 只买需要的零件，不整柜进口'
- '  - get_metadata() = 先查看商品目录（前5MB），不买整个仓库'
- '  - check_file_exist() = 提前确认库存，避免空头支票'
- '  - HF_TOKEN = 海关通行证，没有它进不了保税仓'
- ''
- '- **本地safetensors读取** = 自家仓库的''货架管理''：'
- '  - SafetensorsLocal = 仓库管理员'
- '  - mmap_bytes() = 按需取货（只在需要时才把货物从货架搬到工作台）'
- '  - LocalTensorRange = 货架坐标（第几排第几列）'
- '  - 内存映射 = 透明玻璃墙，看得见货物但不占用过道空间'
'no': 63
summary:
- concept: fill_templated_filename
  desc: 文件名模板填充，支持{ftype}等占位符自动替换
- concept: model_weight_count_rounded_notation
  desc: 参数量智能缩写，自动选择K/M/B/T单位
- concept: size_label
  desc: MoE模型命名，格式为'{专家数}x{尺寸}'如8x7B
- concept: naming_convention
  desc: GGUF标准命名，组装base-size-finetune-version-type
- concept: SafetensorRemote
  desc: 远程safetensors读取器，基于HTTP Range按需下载
- concept: RemoteTensor
  desc: 远程张量元数据封装，data()方法实时下载
- concept: get_data_by_range
  desc: HTTP Range请求实现，支持任意字节范围读取
- concept: HF_TOKEN
  desc: HuggingFace认证令牌，用于访问私有模型仓库
- concept: SafetensorsLocal
  desc: 本地safetensors读取器，使用内存映射优化
- concept: mmap_bytes
  desc: numpy内存映射，避免大文件全量加载到内存
- concept: data_offsets
  desc: safetensors中记录张量数据位置的相对偏移量
- concept: __metadata__
  desc: safetensors中的特殊字段，存储额外元数据（非张量）
