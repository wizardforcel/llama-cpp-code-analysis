  name: 参数定义基石 —— common_arg 的「参数蓝图」
  'no': 1
  points:
  - '**为什么需要一个参数定义类？**'
  - '- llama.cpp 有数百个命令行参数，每个参数都需要：名称（可能多个别名）、类型（int/string/bool）、帮助文本、环境变量绑定、适用的示例类型、值处理回调'
  - '- `common_arg` 将这些元数据集中管理，像一个「参数身份证」'
  - '**头文件中的类骨架：common/arg.h**'
  - '- 构造函数家族：五种重载支持不同参数类型'
  - '- 链式配置方法声明：set_examples/set_env/set_sparam 等'
  - '- 内联运算符：operator< 和 operator== 直接在头文件实现（76-88行）'
  - '**五种处理器：handler_void / handler_int / handler_bool / handler_string / handler_str_str**'
  - '- 根据参数是否需要值、需要什么类型的值，选择不同的处理函数签名'
  - '- 例如 `--threads 4` 需要 int 处理器，`--no-mmap` 只需要 bool flag 切换'
  - '**链式配置的实现（arg.cpp）**'
  - '- 返回 `*this` 引用实现 Builder 模式，让参数注册一气呵成'
  - '- `set_examples` 限定参数只在特定示例（如 SERVER、EMBEDDING）中生效'
  - '- `set_env` 自动在帮助文本后追加环境变量信息'
