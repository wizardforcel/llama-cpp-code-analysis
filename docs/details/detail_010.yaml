learning_targets:
- 理解 convert_hf_to_gguf_update.py 脚本的设计动机：从 Hugging Face 自动同步预分词器哈希，避免人工维护
- 掌握 SHA-256 哈希作为「预分词器指纹」的工作原理与实现机制
- 熟悉 TOKENIZER_TYPE 枚举（SPM/BPE/WPM/UGM）四大分词器家族的差异
- 理解「增量同步」模式：如何通过正则解析 convert_hf_to_gguf.py 已存在的模型清单
- 掌握用正则表达式进行「外科手术式」源码原地替换（re.DOTALL + re.MULTILINE）
- 了解词表测试用例的设计思路与边界场景（空白、Emoji、连写、CJK、否定用例等）
- 熟悉 HF 鉴权机制：Bearer Token、环境变量 ~/.cache/huggingface/token 与命令行三种获取方式
- 能根据新增模型扩展脚本，将自定义分词器识别码纳入 llama.cpp 转换流水线
life_analogy:
- 想象 convert_hf_to_gguf_update.py 是一个**尽职尽责的仓库管理员**：
- '- **模型清单** = 仓库里的货架编号与商品目录'
- '- **Hugging Face Token** = 进入仓库的钥匙'
- '- **download_file_with_auth** = 快递员取件流程（凭证检查、签收、入库）'
- '- **CHK_TXT** = 一套精心设计的「口味测试套餐」（甜、咸、辣、异域风味全覆盖）'
- '- **SHA-256 哈希** = 每种预分词器的「唯一 DNA 鉴定报告」'
- '- **get_existing_models** = 仓库盘点员，扫描现有库存避免重复进货'
- '- **re.sub + Marker** = 仓库改造工人，按图纸（标记）精准替换某一区段的货架标签'
- '- **tests 列表** = 质检部门的抽样检测表，确保每批货都能经受住刁钻场景考验'
- 就像仓库管理员需要保证 SKU 编号与商品一一匹配，convert_hf_to_gguf_update.py 也需要保证每个模型的预分词器哈希与 convert_hf_to_gguf.py
  中的分支表严格对应。
'no': 9
summary:
- concept: 脚本入口
  desc: argparse + HF Token 三种获取方式（环境变量/文件/命令行）
- concept: TOKENIZER_TYPE 枚举
  desc: SPM/BPE/WPM/UGM 四大分词器家族区分
- concept: CHK_TXT 探测文本
  desc: 覆盖空白/Unicode/Emoji/CJK 等棘手边界的「口味测试套餐」
- concept: models 主清单
  desc: 60+ 模型的「模型名 → 仓库 URL → 分词器类型」三元组
- concept: pre_computed_hashes
  desc: 上游损坏或特殊的预计算哈希（glm4/falcon-h1/kimi-k2 等）
- concept: download_file_with_auth
  desc: Bearer Token 单文件下载器，requests.Session 全局复用
- concept: download_model
  desc: 根据 tokt 智能拉取文件（SPM→tokenizer.model, UGM→spiece.model）
- concept: get_existing_models
  desc: 正则扫描 convert_hf_to_gguf.py 已注册模型，避免重复处理
- concept: 增量同步
  desc: 默认仅处理未注册模型（--full 覆盖），保持与上游同步
- concept: SHA-256 哈希
  desc: 用探测文本喂给分词器，将 token ID 序列取哈希作为预分词器指纹
- concept: SPM/UGM 跳过
  desc: 这两种有显式 GGML 枚举值，无需计算哈希
- concept: 诊断日志输出
  desc: 打印 normalizer/pre_tokenizer/ignore_merges 便于人工核对
- concept: Marker 标记替换
  desc: '用 # Marker: Start/End 注释定位 + re.sub(DOTALL|MULTILINE) 原地替换源码'
- concept: src_func 代码生成
  desc: 自动生成完整的 get_vocab_base_pre 函数体，含 chkhsh → name 映射链
- concept: tests 词表测试用例
  desc: 覆盖空白/Emoji/CJK/数字/标点的边界场景，含否定用例 Cửa Việt
- concept: .gguf.inp/.gguf.out
  desc: 用 __ggml_vocab_test__ 分隔的输入/输出文件，供 llama.cpp test-tokenizer-* 程序对比
