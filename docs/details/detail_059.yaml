  name: 模型身份与统计工具 —— 模型的「户口本与体检报告」
  'no': 6
  points:
  - '**基础标识元数据**：`add_type`, `add_quantization_version`, `add_file_type` 定义文件的类型与格式版本，而
    `add_custom_alignment` 允许调整对齐边界，适应特殊硬件需求。'
  - '**来源与谱系追踪**：`add_name`, `add_author`, `add_url`, `add_doi`, `add_uuid`, `add_repo_url`
    等方法构建模型的身份档案，配合 `add_base_model_*` 和 `add_dataset_*` 系列支持多层级溯源。'
  - '**采样与生成参数**：`add_sampling_*` 系列（如 `top_k`, `top_p`, `temperature`, `mirostat`
    参数）记录模型推荐的推理配置，实现“开箱即用”的生成体验。'
  - '**参数量统计的智慧**：`get_total_parameter_count` 通过遍历张量信息，区分共享参数和专家参数（通过 `_exps.` 后缀识别），并处理
    LoRA 张量的特殊配对逻辑（`.lora_a` + `.lora_b`），为模型卡片提供准确的参数量报告。'
  - '**辅助工具**：`format_shard_names` 生成分片文件名，`format_n_bytes_to_str` 将字节数转换为人类可读格式（如
    1.5G / 2.3T）。'
