  - '**基础维度定义**：`add_vocab_size`, `add_context_length`, `add_embedding_length` 及其变体（`add_embedding_length_out`,
    `add_features_length`）定义模型的输入输出维度。'
  - '**层次结构描述**：`add_block_count`, `add_leading_dense_block_count`, `add_full_attention_interval`
    描述网络的深度与结构层次，支持混合架构（如 Gemma3 的局部/全局注意力）。'
  - '**前馈网络配置**：`add_feed_forward_length` 支持单层整数或每层数组，配合 `add_expert_*` 系列（`add_expert_feed_forward_length`,
    `add_expert_shared_feed_forward_length`, `add_expert_chunk_feed_forward_length`）描述
    MoE 架构的 FFN 变体。'
  - '**注意力机制细节**：`add_head_count` 与 `add_head_count_kv` 区分 Query 头与 Key/Value 头（GQA/MQA），`add_key_length`/`add_value_length`
    及其 MLA/SWA 变体精确描述注意力维度，`add_layer_norm_eps` 与 `add_layer_norm_rms_eps` 记录归一化参数。'
  - '**特殊结构标记**：`add_parallel_residual`, `add_swin_norm`, `add_causal_attention`,
