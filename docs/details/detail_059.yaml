  name: 权重数据写入与资源管理 —— 重型货物的「吊装与固定」
  'no': 5
  points:
  - '**write_tensor_data vs write_tensors_to_file**：前者用于流式单个写入（配合状态机检查），后者用于批量写入并支持进度条（tqdm），两者都处理字节序转换和对齐填充，但适用场景不同。'
  - '**进度条的 UX 设计**：当检测到多分片时，同时显示分片进度（`Shard (i/n)`）和总进度，让大模型导出过程可观测。'
  - '**临时文件的内存优化**：对于大模型，`use_temp_file` 将权重先写入临时文件，最后通过 `shutil.copyfileobj` 流式拷贝到目标文件，避免将所有权重同时加载到内存。'
  - '**资源清理生命周期**：`flush()` 确保系统缓冲区数据落盘，`close()` 显式释放文件句柄并置空引用，防止文件锁泄漏，确保即使发生异常也能通过上下文管理器安全释放资源。'
