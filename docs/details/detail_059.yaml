  points:
  - '**CLIP 与视觉编码器**：`add_clip_has_vision_encoder`, `add_clip_projector_type`, `add_vision_projector_type`,
    `add_vision_projection_dim` 等定义视觉编码器的存在性与投影维度。'
  - '**视觉预处理**：`add_vision_patch_size`, `add_vision_image_size`, `add_vision_image_mean/std`,
    `add_vision_max/min_pixels` 控制图像切块与归一化参数。'
  - '**视觉注意力架构**：`add_vision_block_count`, `add_vision_head_count`, `add_vision_attention_layernorm_eps`,
    `add_vision_use_gelu`, `add_vision_use_silu` 描述视觉 transformer 的结构。'
  - '**高级视觉特性**：`add_vision_n_wa_pattern` 与 `add_vision_wa_layer_indexes` 控制窗口注意力（Window
    Attention）与全局注意力的层间分配（如 Qwen2.5-VL, YoutuVL），`add_vision_is_deepstack_layers`
    标记深度堆叠层。'
  - '**音频编码器**：`add_clip_has_audio_encoder`, `add_audio_num_mel_bins`, `add_audio_embedding_length`,
    `add_audio_feed_forward_length`, `add_audio_block_count`, `add_audio_head_count`,
    `add_audio_attention_layernorm_eps`, `add_audio_projection_dim`, `add_audio_stack_factor`
    支持音频特征提取。'
  - '**特殊激活与扩散**：`add_xielu_alpha_p/n`, `add_xielu_beta`, `add_xielu_eps` 为 xIELU
    激活函数提供参数；`add_diffusion_shift_logits` 支持扩散模型的 logits 移位。'
