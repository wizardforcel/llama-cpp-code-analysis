  name: SSM与MoE架构 —— 状态空间与专家系统的「配置手册」
  'no': 9
  points:
  - '**State Space Model (SSM) 参数**：`add_ssm_conv_kernel`, `add_ssm_inner_size`, `add_ssm_state_size`,
    `add_ssm_time_step_rank`, `add_ssm_group_count`, `add_ssm_dt_b_c_rms` 完整描述 Mamba
    等 SSM 模型的卷积核、状态维度、时间步秩等关键配置。'
  - '**混合专家 (MoE) 路由**：`add_expert_count`, `add_expert_used_count`, `add_expert_shared_count`
    定义专家总数与实际使用数，`add_expert_group_count` 与 `add_expert_group_used_count` 支持细粒度分组路由。'
  - '**专家权重归一化**：`add_expert_weights_scale`, `add_expert_weights_norm`, `add_expert_gating_func`
    控制专家输出的缩放、归一化策略与门控函数（softmax/sigmoid）。'
  - '**MoE 频率与正则**：`add_moe_every_n_layers` 设置 MoE 层间隔，`add_experts_per_group` 设置每组专家数，`add_nextn_predict_layers`
    支持多步预测。'
  - '**SwiGLU 变体**：`add_swiglu_clamp_exp` 与 `add_swiglu_clamp_shexp` 为 SwiGLU 激活函数提供钳位参数，增强训练稳定性。'
  - '**RWKV 与 ShortConv 扩展**：`add_shortconv_l_cache` 记录 ShortConv 层的缓存长度，`add_wkv_head_size`
    定义 RWKV 的头部维度，扩展对循环架构的支持。'
