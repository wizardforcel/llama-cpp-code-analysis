  name: 写入状态机与整体架构 —— 集装箱流水线的「五段式装配线」
  'no': 1
  points:
  - '**为什么需要显式状态机？** GGUF 文件有严格的顺序依赖（文件头→元数据→张量信息→权重数据），WriterState 枚举（NO_FILE → EMPTY
    → HEADER → KV_DATA → TI_DATA → WEIGHTS）就像集装箱码头的安检闸门，防止“先装箱后报关”的顺序错误。'
  - '**TensorInfo 与 GGUFValue 数据类**：轻量级数据容器，分别封装张量的形状/数据类型/字节数，以及键值对的值/类型/子类型，是 GGUF
    规范的内存表示。'
  - '**构造函数的初始化逻辑**：`__init__` 不仅设置路径和架构，还初始化分片列表（`self.tensors = [{}]`）、处理小首片优化（`small_first_shard`），并立即调用
    `add_architecture()` 写入架构标识，体现“开箱即写”的设计哲学。'
  - '**临时文件机制**：`use_temp_file` 参数允许先将权重暂存在 `tempfile.SpooledTemporaryFile` 中，最后一次性写入目标文件，解决大模型内存占用与流式写入的矛盾。'
  - '**干运行模式**：`dry_run` 配合 `print_plan()` 可在不实际写盘的情况下预览文件结构和大小，是调试大型模型导出的安全阀。'
