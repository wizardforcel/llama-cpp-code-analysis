  - '**write_header_to_file 的“铅封”作用**：写入 Magic Number（`GGUF_MAGIC`）、版本号（`GGUF_VERSION`）、张量总数和
    KV 对数量，这四个字段构成 GGUF 文件的“身份证”，读取器首先解析它们以验证文件合法性。'
  - '**分片 KV 数据的自动注入**：`add_shard_kv_data()` 在检测到多分片时，自动为每个分片添加 `split.no`、`split.count`
    和 `split.tensors_count`，实现分布式模型文件的自描述。'
  - '**write_kv_data_to_file 的序列化策略**：将内存中的 `kv_data` 字典序列化为连续字节流，每个键值对按键名字符串 + 值类型
    + 值数据的顺序写入，体现“键值对紧密排列”的格式设计。'
  - '**张量信息写入与对齐**：`write_ti_data_to_file()` 遍历所有张量，写入名称、维度数、形状（逆序）、数据类型和偏移量，其中偏移量通过
    `ggml_pad()` 计算，确保后续数据按内存页对齐。'
