  name: 键值数据添加接口 —— 元数据的「类型安全报关单」
  'no': 2
  points:
  - '**add_key_value 的枢纽作用**：所有 `add_*` 方法最终都汇聚到 `add_key_value()`，它处理重复键警告（warning
    而非 error，保留向后兼容），并将数据封装为 `GGUFValue` 存入 `kv_data` 字典。'
  - '**类型方法族谱的完整性**：从 `add_uint8` 到 `add_bool`，11 个基础类型方法对应 GGUF 规范的全部值类型，形成“类型安全”的写入接口，避免手动构造二进制数据的错误。'
  - '**字符串与数组的特殊处理**：`add_string()` 会跳过空字符串（`if not val: return`），`add_array()` 拒绝空数组，这些防御性检查确保文件符合
    GGUF 规范要求。'
  - '**底层打包机制**：`_pack()` 处理字节序前缀（`<` 或 `>`），`_pack_val()` 递归处理复杂类型——字符串需先记录长度，数组需保证元素类型一致并记录子类型，这是
    GGUF 二进制格式的核心编码逻辑。'
