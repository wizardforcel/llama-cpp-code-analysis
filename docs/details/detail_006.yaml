  name: LoraTorchTensor 基础与属性 —— 「孪生张量」的算术魔法
  'no': 6
  points:
  - '**为什么要把 A/B 张量封装为一对？**'
  - '- LoRA 的 A (n_rank, row) 与 B (col, n_rank) 在计算中需要协同'
  - '- 合并公式：W_new = W + alpha/rank * B @ A'
  - '- 保持两者绑定可避免索引时错位'
  - '**__init__ 的双胞胎构造**'
  - '- 断言 len(A.shape) == len(B.shape) 保证维度对称'
  - '- 断言 A.shape[-2] == B.shape[-1] 保证秩一致'
  - '- dtype 不一致时自动统一到 float32，记录 rank = B.shape[-1]'
  - '**get_lora_A_B 解包方法**'
  - '- 返回原始 A、B 张量对，供 modify_tensors 拆分 .lora_a / .lora_b 时使用'
  - '**property 属性的合成语义**'
  - '- dtype：A 与 B 必须保持一致，否则断言失败'
  - '- shape：合成形状 = (*B.shape[:-1], A.shape[-1])'
  - '- size(dim=None)：包装 shape，等价 PyTorch 的 size() 接口'
  - '**张量操作的同步机制**'
  - '- contiguous：同时对 A、B 调用 contiguous()'
  - '- to(*args, **kwargs)：对 A、B 同时迁移 dtype/device'
  - '- view(*size)：内部调用 reshape，保持双胞胎同步'
  - '**reshape_as 的等价实现**'
  - '- 直接调用 reshape(*other.shape)，按目标张量的形状重塑自身'
  - '**__getitem__ 的复杂维度处理**'
  - '- 对最后维度做 A 索引，其余维度广播到 B'
  - '- 自动展开 Ellipsis 占位符到正确的切片数量'
  - '- 2D 与 N-D 张量的索引行为不同，需分别处理'
  - '**reshape 的形状约束**'
  - '- 总元素数必须保持不变（处理 -1 推断）'
  - '- A 重塑为 (..., rank, row)，B 重塑为 (..., col, rank)'
  - '- 不能跨越最后维度做 reshape，会破坏 LoRA 结构'
