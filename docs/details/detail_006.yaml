  desc: 标记 GGUFType.ADAPTER 并写入 Keys.Adapter.TYPE='lora'
- concept: '`LoraModel.set_vocab()`'
  desc: 空实现，禁用基类词表写入逻辑
- concept: '`LoraModel.set_gguf_parameters()`'
  desc: 写入 LORA_ALPHA 与 ALORA_INVOCATION_TOKENS
- concept: '`LoraModel.generate_extra_tensors`'
  desc: 返回空，禁止 RoPE 频率等额外张量写入
