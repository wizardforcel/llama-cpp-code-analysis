  desc: PartialLoraTensor 合并 → LoraTorchTensor
- concept: '`LoraModel.modify_tensors()`'
  desc: 拆分为 .lora_a / .lora_b
- concept: '`GGUFType.ADAPTER`'
  desc: 适配器文件类型标记 + Keys.Adapter.TYPE = 'lora'
