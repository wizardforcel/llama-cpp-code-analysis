learning_targets:
- 理解GGML 头部 magic 字节的识别机制与三代格式演进
- 掌握 Hyperparameters / Vocab / Tensor 三大数据结构的解析流程与初始化
- 熟悉 GGMLFType / GGMLFormat 枚举的全部量化与格式版本
- 熟悉 GGUF 写入流水线（参数/词表/张量）的装配顺序与 mmap 直传机制
- 理解 GQA 反推、params_override 校验、special_vocab 注入等关键约束
- 掌握 LoraTorchTensor 如何封装 A/B 张量对以模拟 PyTorch 接口的全部属性
- 理解 LoRA 适配器的 PartialLoraTensor 合并策略与命名清洗规则
- 掌握 LoraModel 子类的类型/词表/参数重写机制与 generate_extra_tensors 抑制
- 了解 aLoRA invocation tokens 的延迟编码机制与 off-by-one 修正
- 熟悉 load_hparams_from_hf 的 HF Hub 配置拉取流程与 parse_args CLI 解析
- 能够阅读并修改自定义 GGUF 转换器逻辑
life_analogy:
- 想象 GGML→GGUF 转换器是一座「**文物修复工厂**」，专门复活三个时代的旧模型档案：
- '- **GGMLFormat 三代头部** = 三种不同的封蜡方式（GGML 老式火漆/GGMF 钢印/GGJT 条码），用 magic 字节一秒识别年代'
- '- **GGMLFType 量化枚举** = 修复工坊的「工具箱标签」：每个量化方案都有专属代号（F32/F16/Q4_0/Q4_K/Q6_K...）'
- '- **Hyperparameters 7 元组** = 修复工坊收到的「配方卡」：一次性读取 7 个数字（词表/维度/头数/层数/旋转/格式）'
- '- **Hyperparameters.__init__** = 空白的「配方卡」：先把 7 个字段填 0，等待后续读取'
- '- **Vocab 长度前缀协议** = 档案柜的「标签箱」：每个抽屉先贴长度标签，再放内容（可选评分）'
- '- **Vocab.__init__** = 「空柜子准备」：决定是否装评分格（GGML 格式不带分数）'
- '- **Tensor 32 字节对齐** = 档案柜的「整齐码放」：每个卷宗结束都要补齐到 32 字节，方便卡车一箱箱搬运'
- '- **Tensor.__init__** = 「空卷宗封皮」：先写下名称长度、维度、对齐方式，等真正读取时再填内容'
- '- **GGMLModel.__init__** = 「工坊开工准备」：先摆放好 hp/vocab/tensors 四个空抽屉，等待装填'
- '- **GQA 反推** = 侦探从「分组因子」反推「KV 头数」：1~255 逐一排查，找到能让 n_head/x == gqa 的 x'
- '- **params_override 优先级** = 资深修复师的「权威判断」：一旦提供完整图纸，命令行参数全部靠边站'
- '- **add_tensors 维度转置** = 「卷宗调头」：GGML 习惯把维度 0/1 反着写，GGUF 要正过来，所以交换前两维'
- '- **add_vocab 字节 token 重编码** = 「古董符号翻译」：单字节字符按 0xXX 重新贴标签，让旧模型兼容新推理器'
- '- **LoraTorchTensor** = 永远成对出现的「双胞胎文件」：哥哥 A 是 (rank, row)，弟弟 B 是 (col, rank)，索引时必须联动'
- '- **LoraTorchTensor.shape/dtype/size** = 「双胞胎的合成身份」：对外只展示组合后的总维度，dtype 永远是共同的'
- '- **LoraTorchTensor.contiguous/to** = 「双胞胎同步搬家」：连续化或迁移设备时，必须同时搬运 A 和 B'
- '- **PartialLoraTensor 合并** = 整理「散装零件」：先把所有 A/B 按 base_name 分组入柜，再校验齐备才打包'
- '- **LoraModel.set_type / set_vocab** = 「特化车间印章」：标记文件是适配器（ADAPTER），并跳过基础词表设置'
- '- **LoraModel.generate_extra_tensors** = 「明确说不要赠品」：返回空，禁止注入 RoPE 频率等额外张量'
- '- **load_hparams_from_hf** = 「快递员代取基模型配置」：通过 huggingface_hub 直接拉 config.json 即可'
- '- **aLoRA invocation tokens** = 「激活口令本」：从 HF 配置拿口令词，让 tokenizer 现场编码，并把首 token
  撕掉（修补老版误差）'
- 就像文物修复师既要尊重原件的原始结构（老 GGML 格式），又要让它兼容现代设备（GGUF），这套转换器在「**忠实历史**」与「**面向未来**」之间精妙平衡。
'no': 5
summary:
- concept: '`GGMLFormat` 枚举'
  desc: 三代文件格式枚举（GGML/GGMF/GGJT），通过 magic 字节识别
- concept: '`GGMLFType` 枚举'
  desc: 文件类型枚举（F32/Q4_0/Q4_K/Q6_K），对应不同量化方案
- concept: '`Hyperparameters.__init__`'
  desc: 初始化 7 个数字字段为 0，ftype 默认 ALL_F32
- concept: '`Hyperparameters.__str__`'
  desc: 调试日志中友好打印全部超参数
- concept: '`Hyperparameters.load()`'
  desc: 用 struct.unpack('<7I') 一次性读取 7 个超参
- concept: '`Hyperparameters.set_n_ff()`'
  desc: 通过 w1.weight 第二维反向推断 FF 维度
- concept: '`Vocab.__init__`'
  desc: 根据是否带分数初始化，决定 load_scores 标志
- concept: '`Vocab.load()`'
  desc: 长度前缀协议：每个词条 = [uint32 长度] + [字节] + [可选分数]
- concept: '`Tensor.__init__`'
  desc: 设置默认值与 use_padding 对齐标志
- concept: '`Tensor.load()`'
  desc: 三段式读取：12字节头 + dims + name，附带 32 字节对齐
- concept: '`GGMLModel.__init__`'
  desc: 初始化 hp/vocab/tensor_map/tensors 四个空容器
- concept: '`validate_header()`'
  desc: 识别 lmgg/fmgg/tjgg magic 字节，秒判文件年代
- concept: '`validate_conversion()`'
  desc: 拦截 GGJTv2 前量化与 GGJTv3 旧 Q4/Q8 组合
- concept: '`GGMLToGGUF.save()`'
  desc: GGUF 写入 4 阶段：header → kv → tensors → close
- concept: '`add_params()`'
  desc: params_override 优先，校验 n_embd/n_layer/n_head 一致
- concept: '`add_vocab()`'
  desc: 智能推断特殊 token，字节 token 重编码为 <0xXX>
- concept: '`add_tensors()`'
  desc: mmap 直接切片写入，交换前两维适配 GGUF
- concept: '`handle_metadata()`'
  desc: 借助 HF config/params.json 修补古董 GGML 缺失参数
- concept: '`handle_args()`'
  desc: argparse 定义输入输出/GQA/eps/context-length/metadata 等参数
- concept: '`main()`'
  desc: 主流程：扫描 → 可选 metadata → 转换 → 写出
- concept: '`__main__`'
  desc: 模块入口调用 main()
- concept: '`LoraTorchTensor`'
  desc: 封装 A/B 张量对，模拟 PyTorch Tensor 接口
- concept: '`LoraTorchTensor.dtype`'
  desc: 一致性断言后返回 A、B 共同的 dtype
- concept: '`LoraTorchTensor.shape`'
  desc: 合成形状 = (*B.shape[:-1], A.shape[-1])
- concept: '`LoraTorchTensor.size`'
  desc: 包装 shape，无 dim 参数时等价
- concept: '`LoraTorchTensor.contiguous`'
  desc: 同时对 A 和 B 做 contiguous
- concept: '`LoraTorchTensor.to`'
  desc: 对 A、B 同时迁移 dtype/device
- concept: '`LoraTorchTensor.view`'
  desc: 包装 reshape 的别名
- concept: '`LoraTorchTensor.reshape_as`'
  desc: 按其他张量的 shape 重塑自身
- concept: '`LoraTorchTensor.__getitem__`'
  desc: 索引分离：A 仅最后维，其余维度广播到 B
- concept: '`LoraTorchTensor.reshape`'
  desc: 形状约束：最后维度不能跨越，保持总元素数不变
- concept: '`LoraTorchTensor.swapaxes`'
  desc: transpose 的语义别名
- concept: '`LoraTorchTensor.__torch_function__`'
  desc: 拦截 torch.permute/reshape/stack/cat 等函数调用
