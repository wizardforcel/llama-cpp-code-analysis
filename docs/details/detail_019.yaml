  name: 归一化与 LoRA 构建器 —— 基础组件的「工厂方法」
  'no': 11
  points:
  - '**build_norm：三种归一化统一接口**'
  - '- 通过 `llm_norm_type` 枚举分派：LLM_NORM、LLM_NORM_RMS、LLM_NORM_GROUP'
  - '- Group Norm 需要先 reshape 为 3D（最后一维拆为 group 数）再 reshape 回 2D'
  - '- 权重 mw 与偏置 mb 可选（部分模型如无参数化 LayerNorm）'
  - '- 通过 cb() 给 norm/norm_w 节点命名，便于调度器识别'
  - '**build_lora_mm：带 LoRA 的矩阵乘法**'
  - '- 主路径：`ggml_mul_mat(ctx0, w, cur)`'
  - '- LoRA 累加：对每个 lora 计算 `b @ (a @ cur) * scale` 后 `add` 到主结果'
  - '- scale 计算：`alpha ? adapter_scale * alpha / rank : adapter_scale`（alpha 归一化）'
  - '- 可选 per-tensor scale（`w_s`）：`ggml_mul` 应用于结果'
  - '**build_lora_mm_id：MoE 版本的 LoRA 矩阵乘**'
  - '- 与 build_lora_mm 类似但使用 `ggml_mul_mat_id`（带专家 ID）'
  - '- 适配 MoE 专家权重的 LoRA 微调场景'
  - '**build_cvec：控制向量应用**'
  - '- 将 cvec 张量按层号 il 应用到 cur 上'
  - '- 作为整个图的初始偏置注入'
  - '**枚举定义**'
  - '- `llm_ffn_op_type`：SILU/GELU/RELU/RELU_SQR/SWIGLU/GEGLU/REGLU/SWIGLU_OAI_MOE'
  - '- `llm_ffn_gate_type`：SEQ/PAR'
  - '- `llm_norm_type`：NORM/NORM_RMS/NORM_GROUP'
