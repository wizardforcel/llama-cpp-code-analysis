life_analogy:
- 想象 GGML 的计算图构建是一场精密的"建筑工程"：
- '- **llm_graph_context** = 工程指挥中心，集中存放设计图纸（hparams）、施工材料（ubatch）、施工场地（ctx0、gf）等所有资源'
- '- **llm_graph_input_i 派生类** = 各类"原料仓库"，分别保管 token 仓库（embd）、注意力掩码仓库（kq_mask）、状态仓库（s_copy）等'
- '- **llm_graph_input_i 抽象基类** = 仓库的"通用合同模板"：定义 set_input（装填货物）与 can_reuse（能否复用货架）两个标准动作'
- '- **llm_graph_input_ptr（unique_ptr）** = 仓库的"自动归还钥匙"：当图结果（result）析构时，所有输入仓库自动释放'
- '- **llm_graph_result** = 建筑成品，封装了从仓库到屋顶的全部管道电路，承载 logits、embeddings、采样结果等产出物'
- '- **build_norm / build_ffn / build_moe_ffn** = 模块化工厂车间，按规格生产标准件（归一化层、前馈层、专家层）'
- '- **build_attn_mha** = 精密装配车间，将 QKV 半成品组装为 Flash Attention 或传统注意力模块'
- '- **Flash Attention 路径** = 现代化流水线：原材料（QKV）一次性走完整套工艺，高效'
- '- **传统注意力路径** = 传统流水线：原材料分阶段处理，灵活但稍慢'
- '- **RoPE 旋转** = 给钢筋做"扭转加工"，通过 mul_mat_aux 完成空间位置编码'
- '- **MoE 专家路由** = 智能调度员，根据输入特征挑选最合适的几位专家工人协同作业'
- '- **allow_reuse / can_reuse** = 工程师的"图纸复用审批"，只有当新的施工需求与旧图纸完全兼容时才允许复用'
- '- **build_sampling** = 末端质检台，集成了后端采样器（图内执行）让 LLM 在算图中直接选出下一个 token'
- '- **静态辅助函数 build_attn_inp_kq_mask** = 掩码仓库的"批量生产机器"，统一规格后分发给各模块'
- '- **debug 字段** = 仓库的"日志记录仪"，env 变量开启后记录每次装填/复用的详细痕迹'
- 就像真正的建筑需要合理安排材料仓库、施工车间与质检台的位置，llama.cpp 的图构建也需要精心编排各类输入、构建器与输出，确保整张图高效执行并能跨次推理复用。
