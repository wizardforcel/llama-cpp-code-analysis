learning_targets:
- 理解 llm_graph_input_i 抽象基类的设计思想与多态管理机制
- 掌握各类图输入（embeddings、positions、attention masks、cross、rs）的构造与填充流程
- 理解 llm_graph_context 的核心字段与生命周期，明确其作为模型构建桥梁的角色
- 熟悉 build_norm、build_ffn、build_moe_ffn 等基础构建器的实现逻辑
- 掌握 build_attn_mha 的 Flash Attention 与传统注意力两条路径选择策略
- 理解 RoPE 应用、MLA 吸收优化、注意力温度缩放等高级特性的图构建方式
- 掌握 build_attn 五个重载如何对接五种不同的注意力输入类型
- 理解 build_rs 与 build_rwkv_token_shift 的 RNN 状态复制与 token shift 机制
- 了解 build_pooling 与 build_sampling 在图末端的差异化处理
- 理解 llm_graph_params.allow_reuse 与 llm_graph_result.can_reuse 的多维度复用判定策略
- 掌握所有输入构造器（build_inp_*）与注意力输入构造器（build_attn_inp_*）的工厂方法实现
