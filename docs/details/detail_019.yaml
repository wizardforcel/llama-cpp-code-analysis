  name: 图复用与 can_reuse 机制 —— 推理引擎的「节能开关」
  'no': 18
  points:
  - '**为什么需要图复用？**'
  - '- LLM 推理通常逐 token 生成，每步的图结构高度相似'
  - '- 重建 ggml_cgraph + ggml_alloc 分配的开销显著'
  - '- 通过比较新旧 params 判断是否可以复用旧图的拓扑'
  - '**llm_graph_params.allow_reuse 的多维度校验**'
  - '- ubatch 维度：equal_seqs、n_tokens、n_seq_tokens、n_seqs、n_seqs_unq'
  - '- 当 equal_seqs=true 时校验 seq_id_unq 是否一致（注意力流可能不同）'
  - '- samplers 集合：通过 samplers_equal 校验指针与集合大小'
  - '- cparams：embeddings/causal_attn'
  - '- 顶层：arch、gtype、cvec、loras、cross'
  - '**llm_graph_result.can_reuse 的逐输入校验**'
  - '- 先调 this->params.allow_reuse(params)'
  - '- 再对每个 input 调用 input->can_reuse(params)'
  - '- 调试输出：环境变量 LLAMA_GRAPH_RESULT_DEBUG 控制详细程度'
  - '**llm_graph_result 生命周期管理**'
  - '- 构造函数：读取 LLAMA_GRAPH_RESULT_DEBUG + 初始化 max_nodes'
  - '- reset()：清空所有 output/input 字段与上下文，重新分配图对象'
  - '- set_inputs()：遍历 inputs 调用 set_input(ubatch)'
  - '- set_outputs()：为所有输出张量调 ggml_set_output'
  - '- set_params()：保存 params 快照供下次 can_reuse 比对'
  - '- add_input()：用 unique_ptr 接管 input 对象'
  - '- 访问器：get_inp_tokens/get_logits/get_embd/get_embd_pooled/get_gf/get_ctx/get_max_nodes'
  - '**典型复用场景**'
  - '- decode 阶段 n_tokens=1、n_seqs=1：高度可复用'
  - '- n_batch 固定的多轮生成：每轮可复用'
  - '- 切换采样器：不可复用（指针变化）'
  - '- 切换 LoRA：不可复用（loras 指针变化）'
  - '**debug 字段的工程价值**'
  - '- `LLAMA_GRAPH_INPUT_DEBUG`：在 input->set_input 时输出额外日志'
  - '- `LLAMA_GRAPH_RESULT_DEBUG`：在 can_reuse 判定时输出每个 input 的结果'
  - '- 帮助排查复用失败的根本原因'
