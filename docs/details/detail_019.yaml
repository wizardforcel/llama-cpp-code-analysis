  - '- 派生类（具体模型构建器）只需继承即可获得全部上下文'
  - '- 通过引用避免大量拷贝，复用上层 llama_context 的资源'
  - '**构造函数的关键步骤**'
  - '- 构造函数接收 const llm_graph_params & 引用'
  - '- 从 params 复制所有基础类型字段'
  - '- 引用外部资源（避免生命周期问题）'
  - '- 自动调用 `res->set_params(params)` 保存图参数快照（用于 can_reuse 判定）'
  - '- 自动获取 ctx0（res->get_ctx()）与 gf（res->get_gf()）'
  - '**关键字段分类**'
  - '- 模型维度：n_embd、n_layer、n_head、n_head_kv、n_embd_head_k/v、n_expert'
  - '- RoPE/YaRN：freq_base、freq_scale、ext_factor、attn_factor、beta_fast/slow'
  - '- 归一化：norm_eps、norm_rms_eps'
  - '- 上下文：ctx0（图上下文）、gf（图对象）、sched（调度器）、backend_cpu'
  - '- 外部资源：cvec、loras、mctx、cross、samplers、cb_func'
  - '**析构函数**'
  - '- 默认虚析构 `~llm_graph_context() = default`'
  - '- 不释放任何资源（全部为引用）'
  - '**回调机制 cb()**'
  - '- 将 `ggml_tensor` 与层号 il 暴露给外部 cb_func'
  - '- 用于实现自定义后端分配、量化感知调度、可视化等'
