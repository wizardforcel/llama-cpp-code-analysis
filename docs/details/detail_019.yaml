  - '**两阶段签名（无 bias 与有 bias）**'
  - '- 第一阶段为不带 bias 的便捷入口，转发到带 bias 的完整实现'
  - '- gate_up_exps 表示融合的 gate+up 张量（部分模型优化），分离路径则用 up_exps+gate_exps'
  - '**专家路由流程**'
  - '- 第一步：`logits = gate_inp @ cur`（n_expert × n_tokens 路由分数）'
  - '- 第二步：gating 函数（softmax/sigmoid/softmax_weight）'
  - '- 第三步：可选 exp_probs_b 偏置（DeepSeek V3）'
  - '- 第四步：分组路由（DeepSeek-V3 风格的 n_group_used 选择）'
  - '- 第五步：`argsort_top_k` 选出 top-k 专家 ID'
  - '**权重归一化与缩放**'
  - '- norm_w=true 时通过 sum_rows + clamp + div 做权重归一化'
  - '- 避免除零：clamp 到 `6.103515625e-5`（F16 最小表示）'
  - '- w_scale 提供全局缩放（如某些模型的 0.1 校准）'
  - '**合并 vs 分离的专家权重**'
