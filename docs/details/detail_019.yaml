exercises:
- contents:
  - 阅读 `src/llama-graph.h` 第 60-85 行以及 `src/llama-graph.cpp` 第 995-1045 行，理解：
  - 1. `llm_graph_input_i` 基类的 `set_input` 与 `can_reuse` 虚函数约定
  - 2. `LLAMA_GRAPH_INPUT_DEBUG` 与 `LLAMA_GRAPH_RESULT_DEBUG` 两个环境变量的作用
  - 3. `llm_graph_params::allow_reuse` 的多维度校验逻辑
  - 回答问题：
  - '- 为什么 `can_reuse` 默认返回 `false` 而不是 `true`？'
  - '- `allow_reuse` 校验 `samplers_equal` 时为什么不能只比较 `size()`？'
  - '- 当 `cparams.embeddings == true` 但图实际只产出 logits 时，复用是否安全？'
  - '- 哪些情况会导致 `allow_reuse` 在 `ubatch.equal_seqs()` 校验阶段直接返回 `false`？'
  'no': 1
  title: 阅读 llm_graph_input_i 抽象基类与 can_reuse 判定
- contents:
  - 阅读 `src/llama-graph.cpp` 中 `llm_graph_input_attn_kv`、`attn_k`、`attn_kv_iswa`、`attn_no_cache`、`attn_cross`
    五个类的 `set_input` 与 `can_reuse` 实现（行号 440-820）。
  - 回答问题：
  - '- 这五种输入在 `set_input` 中各自调用了哪些内存上下文的方法？'
  - '- 为什么 `attn_kv_iswa` 需要校验两套 K 索引、SWA 掩码的形状？'
  - '- `attn_k` 的 V-less 设计省略了哪些张量？这对内存有何影响？'
  - '- 哪些输入会在 `set_input` 阶段调用 `set_input_k_rot`/`set_input_v_rot`？'
  - '- 对比 `can_reuse_kq_mask` 静态函数校验的四个维度，写出每种输入对应的 `n_stream` 取值。'
  'no': 2
  title: 对比五种注意力输入的复用条件
- contents:
  - 阅读 `src/llama-graph.cpp` 第 1395-1665 行 `build_moe_ffn` 的两个重载实现。
  - 回答问题：
  - '- 第一个重载（无 bias）是如何转发到第二个重载的？'
  - '- 路由分数（logits）的计算使用了哪个 GGML 算子？'
  - '- 三种 `gating_op`（SOFTMAX/SIGMOID/SOFTMAX_WEIGHT）分别如何处理 probs？'
  - '- `exp_probs_b` 在哪些场景会被使用？它和 `selection_probs` 的关系是什么？'
  - '- DeepSeek-V3 风格的分组路由（`n_expert_groups > 1`）具体实现了什么？'
  - '- `gate_up_exps` 合并路径与 `gate_exps/up_exps` 分离路径的区别是什么？'
  - '- Step35 的 per-layer clamp 是如何应用到 routed experts 的？'
  - '- 最后的专家聚合为何使用 `ggml_view_2d` + 多次 `ggml_add` 而不是一次 reduce？'
  'no': 3
  title: 阅读 build_moe_ffn 的完整专家路由流程
- contents:
  - 阅读 `src/llama-graph.cpp` 第 1975-2100 行 `build_attn_mha` 的完整实现。
  - 回答问题：
  - '- `n_stream` 是如何从 K 张量的 `ne[3]` 提取的？流式注意力的目的是什么？'
  - '- Flash Attention 路径下，为何要将 F32 的 K/V cast 到 F16？'
  - '- MLA 吸收优化（`v_mla`）在 Flash Attention 路径下的实现方式是什么？注释中说明了怎样的性能权衡？'
  - '- 传统注意力路径下，`use_alibi`、`attn_soft_cap`、`Grok tanh 限幅`、`kq_b` 偏置四种修饰的先后顺序是什么？'
  - '- `ggml_soft_max_ext` 与 `ggml_soft_max_add_sinks` 如何协同工作？'
  - '- `cparams.offload_kqv` 为 `false` 时，KQV 输出会怎样被调度？'
  'no': 4
  title: 剖析 build_attn_mha 的双路径选择
