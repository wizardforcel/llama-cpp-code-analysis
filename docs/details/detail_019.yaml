  points:
  - '**llm_graph_input_embd：双通道嵌入输入**'
  - '- 构造函数 llm_graph_input_embd(int64_t n_embd) 存储 n_embd_inp 维度'
  - '- 同时持有 tokens（I32 [n_batch]）与 embd（F32 [n_embd, n_batch]）两个占位张量'
  - '- `set_input` 根据 `ubatch.token`/`ubatch.embd` 是否为空来决定填哪一个通道'
  - '- `can_reuse` 检查两个张量的第一维是否匹配当前 ubatch 的 token 数'
  - '- 上层通过 `ggml_build_forward_select` 在运行时选择 token 或 vector 嵌入路径（PR #18550）'
  - '**llm_graph_input_pos：多维位置编码（支持 M-RoPE）**'
  - '- 构造函数存储 n_pos_per_embd（标准为 1，Qwen2-VL 等多模态模型为 4）'
  - '- `set_input` 在 M-RoPE 场景下将 1D 位置扩展为 4D（前三维相同，第四维为 0）'
  - '- `can_reuse` 校验第一维是否等于 `n_tokens * n_pos_per_embd`'
  - '**llm_graph_input_out_ids：输出 token 索引收集**'
  - '- 构造函数接收 hparams、cparams、n_outputs 三个参数'
  - '- 当 `n_outputs < n_tokens` 时构造，否则跳过此优化以保持拓扑稳定'
  - '- `set_input` 根据 `ubatch.output` 标记填充 I32 [n_outputs] 的索引张量'
  - '- `n_outputs == n_tokens` 时直接填 [0..n_tokens] 跳过扫描'
  - '- `can_reuse` 仅校验 `n_outputs` 是否一致，避免拓扑依赖 token 数（参考 PR #14275）'
