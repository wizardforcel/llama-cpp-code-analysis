  name: 图输入管理基础 —— GGML 世界的「原料仓库」
  'no': 1
  points:
  - '**为什么需要 llm_graph_input_i 抽象基类？**'
  - '- 计算图构建与执行是分离的：构图时只知道张量的形状与含义，执行时才知道具体数值'
  - '- 不同输入（embeddings、positions、attention masks 等）需要各自的填充规则与能否复用判定'
  - '- 通过基类统一管理 `set_input`（实际填值）与 `can_reuse`（能否复用已有图）'
  - '- 通过环境变量 `LLAMA_GRAPH_INPUT_DEBUG` 启用调试输出'
  - '- 基类析构函数声明为 `virtual = default`，保证通过基类指针安全删除派生对象'
  - '**can_reuse 默认实现的安全策略**'
  - '- 基类默认 `return false` 防止未实现复用的派生类被错误复用'
  - '- 派生类需要显式覆盖以表达"我能复用"的承诺'
  - '**智能指针封装的意义**'
  - '- `llm_graph_input_ptr = unique_ptr<llm_graph_input_i>` 让输入对象在 `llm_graph_result.inputs`
    中自动析构'
  - '- 多态调用 `set_input`/`can_reuse` 时通过基类指针访问派生类成员'
  - '- 派生类构造函数（如 llm_graph_input_embd(int64_t n_embd)）只存储必要参数，资源在图构造阶段才绑定'
  - '**基类的所有成员**'
  - '- 构造函数 `llm_graph_input_i()`：读取 LLAMA_GRAPH_INPUT_DEBUG 环境变量并初始化 debug 字段'
  - '- 虚析构 `~llm_graph_input_i() = default`：保证派生类正确析构'
  - '- 纯虚 `set_input(const llama_ubatch*)`：派生类必须实现的填值接口'
  - '- 虚 `can_reuse(const llm_graph_params&)`：默认返回 false 的复用判定'
  - '- 受保护字段 `debug`：由环境变量控制，辅助日志输出'
