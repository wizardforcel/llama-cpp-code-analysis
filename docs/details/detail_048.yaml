  name: PEG 执行引擎与竞技场管理 —— 文本匹配的「裁判与档案馆」
  'no': 2
  points:
  - '**三种结局的比赛：解析结果状态机**'
  - '- 每次匹配只会得到 `SUCCESS` / `FAIL` / `NEED_MORE_INPUT` 三种结果之一'
  - '- `NEED_MORE_INPUT` 配合 `lenient` 模式，让流式输入（模型边生成边解析）成为可能'
  - '**`parser_executor`：基于 `std::visit` 的类型分发裁判**'
  - '- 通过重载 `operator()` 为每种解析器变体（literal、sequence、choice、repetition、and/not、any、space、chars、string、until、schema、rule、tag、ref、atomic）定义匹配逻辑'
  - '**序列与选择：最基础的两种组合语义**'
  - '- 序列要求所有子解析器按顺序成功，任一失败整体失败，并忠实地累积 AST 节点'
  - '- 选择是「有序选择」：只取第一个成功的分支，这是 PEG 与 CFG 的关键差异'
  - '**重复与前瞻：PEG 的看家本领**'
  - '- 重复有上限保护，且当子解析器零消耗时立即中断，避免死循环'
  - '- `and`/`not` 是零消耗前瞻：`and` 只探测不前进，`not` 在子解析器失败时成功'
  - '**Unicode 感知的字符与字符串处理**'
  - '- `any`/`chars`/`string` 都通过 `common_parse_utf8_codepoint` 逐码点推进，而非逐字节'
  - '- `handle_escape_sequence` 支持 `\uXXXX` 形式的 Unicode 转义'
  - '**Trie + until_parser：高效多分隔符探测**'
  - '- `trie` 把多个终止字符串组织成前缀树，`check_at` 能在每个位置返回无匹配/部分匹配/完整匹配'
  - '- `until_parser` 利用它实现「读到任一分隔符为止」，是提取标记内容的核心'
  - '**AST 生成：`rule` 与 `tag` 节点的包装**'
  - '- 规则解析成功后，会把匹配区间、文本、子节点打包成带名称的 AST 节点存入 `common_peg_ast_arena`'
  - '- `atomic` 则相反：当结果是 `NEED_MORE_INPUT` 时清空已产生的节点，避免半成品污染上层'
  - '**竞技场的幕后工作：引用解析与结构转储**'
  - '- `resolve_refs()` 遍历所有解析器，把 `ref` 替换成真实规则 ID，并同样解析根节点'
  - '- `dump()`/`dump_impl()` 用 `visited` 集合检测循环，输出可读的解析器树'
