learning_targets:
- 理解PEG解析器的「句柄+竞技场」双层设计架构及其共享/递归支持机制
- 掌握组合子API（sequence/choice/repeat/optional）与运算符糖（+/|/<<）的使用与底层实现
- 深入解析执行引擎的三态结果（SUCCESS/FAIL/NEED_MORE_INPUT）与流式解析原理
- 掌握基于std::visit的类型分发机制及各类解析器（序列/选择/重复/前瞻）的匹配语义
- 理解Trie树在高效多分隔符探测（until_parser）中的应用
- 学会AST（抽象语法树）的构建、引用解析（resolve_refs）与arena内存管理
- 了解内置JSON/Python语法规则的递归构建技巧与GBNF代码生成流程
- 掌握解析器的JSON序列化/反序列化（to_json/from_json）实现机制
- 理解__main__全局代码的组织方式与模块初始化流程
life_analogy:
- 想象PEG解析器系统是一家**智能文档处理工厂**：
- '- **common_peg_parser（句柄）** = 加工机器的遥控器（持有机台编号，不存放机器本身）'
- '- **common_peg_arena（竞技场）** = 中央仓库（所有机器/解析器节点实际存放于此，按ID索引）'
- '- **common_peg_parser_builder** = 乐高拼装台（提供sequence/choice等标准积木块，自动优化结构/扁平化）'
- '- **parser_executor** = 质量检测流水线（根据工件类型/解析器类型，自动切换检测程序/std::visit分发）'
- '- **三态结果** = 质检报告：合格（SUCCESS）/报废（FAIL）/待补料（NEED_MORE_INPUT），支持流水线边生产边检测'
- '- **Trie树** = 多通道分拣器（同时监听多个结束标记，高效判断当前位置是否匹配任一分隔符）'
- '- **AST Arena** = 成品档案馆（解析生成的抽象语法树节点统一登记造册，支持按标签/规则检索）'
- '- **resolve_refs** = 设备联调（把设计图纸上的占位引用替换为实际机器ID，让流水线真正跑起来）'
- '- **__main__** = 工厂总控室的初始化面板（负责全局配置加载与系统自检）'
- 就像工厂经理用乐高积木搭建生产线，开发者用builder组合解析规则；就像质检员按工序分段验收，executor按顺序执行子解析器，任一环节失败即整体失败（PEG有序选择特性）。
'no': 47
summary:
- concept: common_peg_parser
  desc: 轻量级解析器句柄，仅持有ID和builder引用，真正的节点存储在arena中，支持共享与递归
- concept: common_peg_arena / common_peg_ast_arena
  desc: 解析器与AST的内存竞技场，集中管理所有节点，提供ID索引、引用解析与周期性内存回收
- concept: 组合子（Combinators）
  desc: sequence（顺序）、choice（有序选择）、repeat（重复）等基础构建块，支持自动扁平化嵌套结构
- concept: 运算符糖
  desc: +表示顺序、|表示选择、<<表示带空格的顺序，让语法规则书写接近BNF范式
- concept: 三态结果
  desc: SUCCESS（匹配成功）、FAIL（匹配失败）、NEED_MORE_INPUT（需更多输入，支持流式解析）
- concept: std::visit分发
  desc: parser_executor通过重载operator()为每种解析器变体（literal/sequence/choice等）定义匹配逻辑
- concept: 有序选择
  desc: choice解析器严格按顺序尝试分支，第一个成功即返回，这是PEG与CFG的关键差异
- concept: 前瞻（And/Not）
  desc: 零消耗探测，and只检测不前进，not在子解析器失败时成功，用于实现边界控制
- concept: Trie + until
  desc: 使用前缀树组织多个终止字符串，实现高效的多分隔符检测，用于提取标记内容
- concept: 规则与递归
  desc: rule()支持lambda占位回填，resolve_refs()在构建末期将所有ref替换为真实规则ID，实现递归语法
- concept: 原子操作（atomic）
  desc: 当子解析器返回NEED_MORE_INPUT时清空已产生节点，防止半成品AST污染上层结果
- concept: JSON序列化
  desc: to_json()/from_json()实现解析器图的持久化，便于缓存、传输与调试
- concept: GBNF生成
  desc: build_grammar()将PEG规则转换为GGUF BNF格式，支持懒加载与触发规则
- concept: Unicode感知
  desc: any/chars/string等解析器基于common_parse_utf8_codepoint逐码点处理，而非简单字节
- concept: __main__
  desc: 全局初始化入口，负责模块级配置与系统启动自检
