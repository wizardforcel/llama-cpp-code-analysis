exercises:
- contents:
  - 阅读 `common/peg-parser.cpp` 第1143-1213行（sequence/choice实现）与第1286-1350行（JSON解析器构建）。
  - 思考问题：
  - 1. `sequence()`和`choice()`为什么要对子节点进行「扁平化」处理？不扁平化会导致什么问题？
  - 2. `json_number()`中的`not_number_continuation`（负向前瞻）是为了解决什么具体场景的误匹配问题？
  - 3. 尝试使用`rule()`的lambda重载版本，编写一个能匹配成对括号（如`((()))`）的递归规则，并解释占位规则（placeholder）的工作机制。
  'no': 1
  title: 构建器组合子实践
- contents:
  - 阅读 `common/peg-parser.cpp` 第183-541行`parser_executor`类的各个`operator()`重载。
  - 完成以下任务：
  - 1. 对比`operator()(sequence)`与`operator()(choice)`在子节点失败处理逻辑上的差异，解释为什么这种差异体现了PEG的「有序选择」特性。
  - 2. 分析`operator()(repetition)`中的防死循环机制（`if (result.end == pos) break;`），说明在什么情况下会出现零消耗匹配。
  - 3. 解释`operator()(atomic)`在`NEED_MORE_INPUT`时清空`nodes`的设计意图，如果不清理会导致什么后果？
  'no': 2
  title: 执行器语义深度分析
- contents:
  - 阅读第46-77行`trie`类实现，以及第467-491行`until_parser`的执行逻辑。
  - 回答问题：
  - 1. `trie::check_at()`返回的三种状态（NO_MATCH/PARTIAL_MATCH/COMPLETE_MATCH）分别对应`until_parser`中的什么处理分支？
  - 2. 在`lenient`模式下（流式输入），当输入在`until`分隔符中间被截断时（如分隔符是`</tag>`但只收到`</t`），解析器会返回什么状态？为什么这样设计？
  - 3. `handle_unicode_escape`（第423-438行）如何确保`\uXXXX`格式的严格性？如果输入是`\u12`且`lenient=true`，会发生什么？
  'no': 3
  title: Trie与流式解析机制
- contents:
  - 阅读 `common/peg-parser.cpp` 第960-1006行（`resolve_refs`）和第1841-1992行（JSON序列化相关）。
  - 思考问题：
  - 1. `resolve_refs()`为什么必须在`build()`阶段调用？如果尝试在构建过程中（如`rule()`函数内部）就解析引用，会遇到什么困难？
  - 2. `to_json()`/`from_json()`使用`std::visit`处理`common_peg_parser_variant`的类型擦除，请描述序列化`common_peg_chars_parser`时需要保存哪些字段，为什么`ranges`必须序列化？
  - 3. `from_json()`在恢复`rules_`映射时进行了哪些合法性校验（第1964-1972行）？这些校验防止了什么潜在的内存安全问题？
  'no': 4
  title: Arena管理与序列化
- contents:
  - 阅读 `common/peg-parser.h` 第79-105行`common_peg_ast_arena`接口，以及 `common/peg-parser.cpp`
    第951-958行`dump()`实现。
  - 实践任务：
  - 1. 编写一段代码，使用`build_peg_parser`构建一个能解析简单算术表达式（如`1+2`）的解析器，要求包含`rule()`和`tag()`。
  - 2. 在解析成功后，使用`common_peg_ast_arena::find_by_tag()`查找特定标签的节点，并打印其对应的文本区间（`node.text`）。
  - 3. 启用调试模式（`ctx.flags |= COMMON_PEG_PARSE_FLAG_DEBUG`），观察`parser_executor`在解析`sequence`时的日志输出格式（注意`debug_indent()`如何体现递归深度）。
  'no': 5
  title: AST构建与调试
- contents:
  - 定位并阅读 `common/peg-parser.cpp` 中的 `__main__` 相关代码段（通常在文件头部或尾部）。
