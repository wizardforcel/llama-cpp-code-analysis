  - 2. 如果将 `__main__` 中的初始化逻辑改为惰性加载（lazy initialization），会对解析器的线程安全性产生什么影响？
  - 3. 尝试绘制 `__main__` 执行完成后的内存布局示意图，标注 arena、builder 和全局规则表的位置关系。
