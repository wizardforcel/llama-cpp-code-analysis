  name: PEG 解析器构建器 —— 语法规则的「乐高拼装台」
  'no': 1
  points:
  - '**为什么需要「句柄 + 竞技场」双层设计？**'
  - '- `common_peg_parser` 只是一个轻量级句柄（持有一个 id 和 builder 引用），真正的解析器节点存放在 `common_peg_arena`
    的 `parsers_` 数组里'
  - '- 这样做让解析器节点可以被多处共享，递归规则也能用「先占位、后回填」的方式表达'
  - '**组合子 API：`sequence` / `choice` / `repeat` / `optional`**'
  - '- `sequence`/`choice` 会自动「拍平」嵌套的同类节点，避免产生无意义的深层树'
  - '- `one_or_more`/`zero_or_more`/`optional` 都统一收敛到 `repeat(p, min, max)`，用 `-1`
    表示无上界'
  - '**运算符糖：`+`、`|`、`<<` 让规则读起来像 BNF**'
  - '- `a + b` 是顺序拼接，`a | b` 是分支选择，`a << b` 则在两者中间自动插入空格解析器'
  - '- 字符串字面量可以直接参与运算，内部自动转成 `literal` 解析器'
  - '**规则的命名与递归：`rule()` 与占位回填**'
  - '- `rule_name()` 用正则把非法字符替换成 `-`，保证生成的 GBNF 规则名合法'
  - '- 带 lambda 的 `rule()` 先注册一个 `any()` 占位规则，再执行 builder 函数生成真正的解析器并替换，从而支持自引用递归'
  - '**内置数据格式：JSON 与 Python 字面量全家桶**'
  - '- `json_number` 精心构造了整数/小数/指数三部分，并用负向前瞻 `not_number_continuation` 防止把 `123abc`
    误判为数字'
  - '- `json_object`/`json_array`/`json()` 通过互相 `ref` 引用构成递归语法，覆盖完整 JSON 规范'
  - '- `python_dict`/`python_array` 几乎是 JSON 的镜像，但布尔值是 `True/False`、空值是 `None`'
  - '**`marker()` 与 `json_member()`：面向聊天场景的特化**'
  - '- `marker()` 识别 `<...>` 或 `[...]` 形式的标记，常用于工具调用的定界'
  - '- `json_member(key, p)` 生成 `"key" : <parser>` 的固定成员匹配'
  - '**构建收尾：`set_root()` + `build()`**'
  - '- `build()` 会调用 `arena_.resolve_refs()` 把所有 `ref` 引用替换成真实的规则 ID，然后移动语义交出 arena'
