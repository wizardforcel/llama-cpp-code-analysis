  name: GGUF 拆分与合并 —— 模型仓库里的「装箱/拼箱」
  'no': 5
  points:
  - '**这个工具解决的是大模型「太大装不下」的现实问题**'
  - '- 支持把一个 GGUF 按张量数或字节大小拆成多个分片'
  - '- 也支持把多个分片再合并回一个完整文件'
  - ''
  - '**用户友好的命令行界面**'
  - '- `split_print_usage()` 提供详细的帮助信息，包括 `--split-max-tensors` 和 `--split-max-size`
    的用法'
  - '- `split_params_parse()` 作为包装器，负责异常处理和错误提示'
  - '- `split_params_parse_ex()` 是实际解析逻辑，支持 `--split`、`--merge`、`--dry-run` 等选项'
  - ''
  - '**拆分的核心是 `split_strategy`**'
  - '- 构造时会遍历全部张量，估算每个分片要承担多少数据'
  - '- 析构函数确保所有 `gguf_context` 被正确释放，防止内存泄漏'
  - '- 每创建一个新分片，都会把当前分片的 `SPLIT_NO`、`SPLIT_COUNT` 写进去'
  - ''
  - '**分片策略分两种**'
  - '- `MODE_SIZE`：按累计字节数超限后切分'
  - '- `MODE_TENSOR`：按张量数量阈值切分'
  - '- 进入新分片的判断统一由 `should_split()` 决定'
  - ''
  - '**写出过程非常朴素但高效**'
  - '- 先写元数据，再逐个张量从源文件定位偏移量并复制数据'
  - '- 必要的补齐用 `zeros()` 完成 GGUF 对齐'
  - '- `copy_file_to_file()` 实现高效的文件块复制'
  - ''
  - '**合并则更像「反向装配」**'
  - '- 先打开第 0 个分片，读出 `split count` 作为总分片数'
  - '- 逐个读取分片元数据并把所有张量追加到输出上下文'
