learning_targets:
- 掌握 llama-quantize 工具的命令行参数解析与量化配置组装流程
- 理解重要性矩阵（imatrix）的加载、过滤机制及其在量化中的指导作用
- 剖析 imatrix 采集器如何通过计算图回调捕获激活值平方统计
- 掌握 GGUF 模型文件按张量数或字节大小拆分与合并的实现原理
- 精通 LoRA 适配器合并技术的数学原理与工程实现（权重融合与 GGML 计算图）
- 了解 fit-params 工具如何基于可用内存自动推荐推理参数配置
- 掌握工具类中公共辅助函数（KV读取、字符串处理、内存管理）的设计模式
life_analogy:
- 想象这套模型处理工具链是一家**精密的汽车改装厂**：
- ''
- '**llama-quantize** = **车身轻量化车间**'
- '- 不是简单切割，而是根据蓝图（ftypes）选择不同压缩工艺（Q4_K/Q8_0/F16）'
- '- 支持局部改装（--tensor-type）和整体翻新，还能保留原车架结构（--keep-split）'
- '- 工具函数 striequals 像质检员，确保输入的「改装件编号」（类型名）不分大小写都能对上'
- ''
- '**imatrix** = **车辆应力测试与荷载分析**'
- '- 通过在真实路况（推理过程）中安装传感器（GGML 回调）'
- '- 记录每个零部件（张量）承受的压力分布（激活值平方和）'
- '- 生成「关键部位地图」，指导后续轻量化时该加强哪里、可以削减哪里'
- '- 统计展示功能像「实验室显微镜」，能看清每层材料的疲劳度、应力集中点和层间传导效率'
- ''
- '**gguf-split** = **大型设备的分体运输与组装**'
- '- 像把超宽设备拆成标准集装箱（按大小/数量拆分），到达目的地后再无损拼装'
- '- 每个集装箱都有编号（SPLIT_NO）和清单，split_print_usage 就像「装箱手册」教你怎么用'
- '- zeros 函数像打包时的「填充泡沫」，确保每个箱子严丝合缝（GGUF 对齐）'
- ''
- '**export-lora** = **精准的外科焊接手术**'
- '- 将选装件（LoRA 适配器）永久焊接到车身上，而不是每次使用时临时加装'
- '- 焊接前严格检查配件兼容性（元数据校验），计算融合公式（B×A^T），确保无缝集成'
- '- 各种 get_kv/zeros/load_gguf 工具函数是「手术器械包」，负责读取病历（元数据）和准备无菌环境'
- ''
- '**fit-params** = **智能车位规划师**'
- '- 根据车库实际大小（可用内存），自动规划最佳停车方案（context 长度、GPU 层数分配）'
- '- 输出结果像「停车指示牌」，直接告诉司机（用户）该怎么停（参数怎么设）'
'no': 68
summary:
- concept: '`QUANT_OPTIONS` / `LLM_KV_QUANTIZE_*`'
  desc: 量化类型注册表（27种量化方案）与元数据 Key 常量，定义了压缩工艺的「标准件规格」
- concept: '`striequals`'
  desc: 不区分大小写的字符串比较，处理 Q4_K_M 与 q4_k_m 等用户输入变体
- concept: '`try_parse_ftype`'
  desc: 量化类型解析器，支持字符串名称和整数编号两种输入模式
- concept: '`parse_ggml_type` / `parse_tensor_type`'
  desc: 张量级覆盖解析，将 'attn_q=q8_0' 转换为结构化配置
- concept: '`load_imatrix` / `load_legacy_imatrix`'
  desc: 双格式 imatrix 加载器，自动检测 GGUF 或 legacy 格式并做归一化
- concept: '`prepare_imatrix`'
  desc: imatrix 过滤器，按 include/exclude 白名单/黑名单筛选作用域
- concept: '`llama_model_quantize_params`'
  desc: 量化配置中枢，聚合 imatrix、张量覆盖、剪枝层等所有选项
- concept: '`IMatrixCollector`'
  desc: 重要性矩阵采集器，通过 GGML 回调钩子捕获 MUL_MAT/MUL_MAT_ID 激活统计
- concept: '`compute_imatrix`'
  desc: 激活统计主流程，处理文本输入、分块推理并触发周期性保存
- concept: '`process_logits`'
  desc: 多线程 PPL 计算器，并行处理 logits 计算负对数似然
- concept: '`softmax` / `log_softmax`'
  desc: 数值稳定的 softmax 实现，用于计算 token 概率分布与信息熵
- concept: '`tensor_comparer`'
  desc: 统计结果排序器，按张量名和激活总量排序以便展示
- concept: '`compute_statistics` / `compute_cossim`'
  desc: 统计指标计算（熵、标准差、活跃度）与相邻层余弦相似度分析
- concept: '`split_strategy`'
  desc: GGUF 拆分策略核心，管理分片元数据与张量分配逻辑（构造函数规划、析构清理）
- concept: '`should_split` / `copy_file_to_file`'
  desc: 拆分判断逻辑与文件块复制，实现零拷贝式高效分割
- concept: '`split_params_parse` 家族'
  desc: 命令行解析三件套（parse_ex 解析、parse 包装、print_usage 帮助）
- concept: '`gguf_split` / `gguf_merge`'
  desc: 模型文件分治操作，支持按大小/张量数拆分与无损合并
- concept: '`lora_merge_ctx`'
  desc: LoRA 合并上下文，通过构建临时 GGML 计算图执行 B×A^T 融合
- concept: '`merge_tensor`'
  desc: 单张量合并核心，处理反量化、缩放（alpha/rank）、图计算与结果写出
- concept: '`file_input`'
  desc: GGUF 文件读取抽象，提供张量元数据访问与原始数据加载，RAII 管理资源
- concept: '`get_kv_str/f32` / `zeros`'
  desc: 基础工具函数：类型安全的 KV 读取与文件零填充
- concept: '`llama_params_fit`'
  desc: 参数自动拟合接口，根据设备内存计算最优 n_ctx 与 GPU 层数
