  name: 量化选项与参数解析 —— 命令行上的「刀法清单」
  'no': 1
  points:
  - '**量化工具的第一印象是「可选刀法」**'
  - '- 入口先用 `QUANT_OPTIONS` 维护一张量化类型清单：Q1_0/Q4_0/Q4_K/IQ 系列/F16/BF16 等'
  - '- 每种类型都绑定 `llama_ftype` 枚举和一段说明文本，用于帮助输出和合法性校验'
  - '- 这让用户不是在「自由填类型字符串」，而是在受支持的「刀法表」里选一种压缩方式'
  - ''
  - '**跨平台的健壮性设计**'
  - '- `striequals()` 提供不区分大小写的字符串比较，支持用户输入 Q4_K_M 或 q4_k_m'
  - '- `try_parse_ftype()` 兼容字符串和枚举值两种输入，提高用户体验'
  - ''
  - '**命令行解析的目标是组装一份量化参数对象**'
  - '- `main()` 先创建 `llama_model_quantize_params`，再逐项填充高级选项'
  - '- 支持的选项包括 `--allow-requantize`、`--pure`、`--keep-split`、`--dry-run`、`--override-kv`
    等'
  - '- 这些开关分别控制是否允许二次量化、是否禁用混合量化、是否保留分片、是否只估算大小、是否覆盖元数据'
  - ''
  - '**张量级定制被拆成两类输入**'
  - '- 单项覆盖走 `--tensor-type tensor=type`，由 `parse_tensor_type()` 解析'
  - '- 批量覆盖走 `--tensor-type-file file`，由 `parse_tensor_type_file()` 逐条读入'
  - '- 输出张量和 embedding 张量也可分别指定类型，使用 `parse_ggml_type()` 转成 `ggml_type`'
  - ''
  - '**剪层和输入输出路径也是量化入口的一部分**'
  - '- `--prune-layers` 由 `parse_layer_prune()` 解析逗号分隔层号并排序去重'
  - '- 输入模型和输出模型路径与 ftype 的解析是兼容两种写法的：`<input> <ftype>` 或 `<input> <output> <ftype>`'
  - '- 这一步的关键作用是：把用户意图先翻译成一份结构化、可执行的量化任务单'
