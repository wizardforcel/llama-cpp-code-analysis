  name: imatrix 主动采集 —— 在推理时「看见激活分布」
  'no': 3
  points:
  - '**imatrix 的本质不是静态配置，而是运行时采出来的**'
  - '- 采集器 `IMatrixCollector` 通过计算图回调挂在模型推理路径上'
  - '- 遇到 `GGML_OP_MUL_MAT` 和 `GGML_OP_MUL_MAT_ID` 时，它会读取相关输入张量'
  - '- 对普通 dense 层和 MoE expert 层分别维护统计'
  - ''
  - '**灵活的参数配置**'
  - '- 通过 `set_params()` 注入公共参数，使用默认构造函数快速初始化'
  - '- `get_mstats()` 提供对内部统计表的只读访问，遵循最小权限原则'
  - ''
  - '**采集前先做「问答式筛选」**'
  - '- 回调的 `ask=true` 阶段决定这个张量值不值得统计'
  - '- 只收 `blk.*` 相关张量，或显式要求收 `output.weight`'
  - '- 还会检查维度、数据类型，避免把不合适的节点塞进统计表'
  - ''
  - '**真正的统计量是激活平方和**'
  - '- 对普通矩阵乘，按 `src1` 的各维遍历输入激活，把 `x[j] * x[j]` 累加到 `e.values`'
  - '- 对 MoE 的 `MUL_MAT_ID`，还要先读 expert id，再把样本分配到对应 expert 桶里'
  - ''
  - '**辅助函数支撑整个流程**'
  - '- `filter_tensor_name()` 剥离设备前缀，统一张量名称'
  - '- `process_tensor_name()` 解析层号和组件名，用于后续统计展示'
  - '- `softmax()` 和 `log_softmax()` 用于计算概率分布，支持 PPL 计算中的数值稳定性'
  - '- `process_logits()` 使用多线程并行处理 logits，计算 NLL 和概率历史'
  - ''
  - '**多专家场景里，counts 维度通常会扩展**'
  - '- 若一个张量第一次只有 1 个 bucket，后来又识别出多个 expert，会自动把 count 复制扩展'
  - '- 这保证了同一层下不同 expert 的统计都能分开保存'
  - ''
  - '**采集过程还负责「按块落盘」**'
  - '- 代码基于 chunk_size = n_ctx / n_parallel 统计已经处理到第几块'
  - '- 达到 `n_out_freq` 或 `n_save_freq` 阈值时触发 `save_imatrix()`'
