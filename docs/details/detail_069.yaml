  name: LoRA 合并执行器 —— 把增量「焊回」底座模型
  'no': 6
  points:
  - '**这个工具的目标很明确：把 LoRA 增量直接融进 base model**'
  - '- 输入是一个基础 GGUF 模型和一个或多个 LoRA adapter'
  - '- 输出是一个新的 F16 GGUF 文件'
  - ''
  - '**基础工具函数构建可靠地基**'
  - '- `get_kv_str()` 和 `get_kv_f32()` 提供类型安全的 GGUF 元数据读取'
  - '- `zeros()` 确保文件写入时满足对齐要求'
  - '- `ggml_ne_string()` 将张量维度格式化为可读字符串，用于调试输出'
  - '- `load_gguf()` 封装了 `gguf_init_from_file`，强制要求文件必须存在'
  - ''
  - '**先解决「能不能合并」的校验问题**'
  - '- `check_metadata_lora()` 会检查 `general.type=adapter`、`adapter.type=lora`'
  - '- 还要求 adapter 的 `general.architecture` 与 base model 一致'
  - ''
  - '**`run_merge()` 做的是全张量调度**'
  - '- 遍历 base model 里的每个张量，判断是否存在对应的 `.lora_a` 与 `.lora_b`'
  - '- 两者都缺：直接复制原张量；两者都有：走真正的合并计算'
  - ''
  - '**合并计算的公式很标准**'
  - '- 对一般线性层：`delta = B * A^T`（通过 transpose+contiguous 实现）'
  - '- 对 token embedding：由于布局不同，直接做 `B * A`'
  - '- `delta` 再乘缩放系数 `scale * alpha / rank` 后加回 base 权值'
  - ''
  - '**资源管理的 RAII 模式**'
  - '- `file_input` 和 `lora_merge_ctx` 的析构函数分别释放 gguf/ggml 上下文和 backend/gallocr'
  - '- 确保即使中途出错也不会泄漏内存'
  - ''
  - '**合并过程不是离线字符串拼接，而是真正的 GGML 计算**'
  - '- 使用 `ggml_new_graph()` 搭一个小计算图'
  - '- 最后把结果 cast 到输出需要的类型，写回文件'
