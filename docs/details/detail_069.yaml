  name: imatrix 读写与统计展示 —— 既会算，也会看
  'no': 4
  points:
  - '**保存格式不是单一的，而是 GGUF 和 legacy 双轨并行**'
  - '- 默认优先写 GGUF'
  - '- 如果用户指定 `--output-format dat`，就改走 `save_imatrix_legacy()`'
  - '- 文件名带 `.at_N` 后缀时，表示按 chunk 保存中间结果'
  - ''
  - '**GGUF 保存方式的组织更像「打包张量仓库」**'
  - '- 写入前先把所有待保存张量估出总内存，建一个 `ggml_context`'
  - '- 每个统计项生成两个张量：`*.in_sum2` 和 `*.counts`'
  - '- 同时写入 `general.type=imatrix`、datasets、chunk_count、chunk_size 等元数据'
  - ''
  - '**legacy 格式更像「紧凑二进制日志」**'
  - '- 先写 entry 数，再逐条写名字、调用次数、值数组'
  - ''
  - '**加载逻辑同样支持双格式**'
  - '- `load_imatrix()` 先试 GGUF，不成功再退回 legacy'
  - '- 读入后会合并到当前 `m_stats`，并更新 `m_last_chunk`'
  - ''
  - '**统计展示层的排序与过滤**'
  - '- `tensor_comparer` 提供排序逻辑：先按处理后的张量名（层号+短名），再按激活总量降序'
  - '- 这保证了展示结果对人类读者友好（同类型张量相邻，重要的排前面）'
  - ''
  - '**统计计算与可视化**'
  - '- `compute_statistics()` 计算每张量的 sum、mean、min、max、std、active ratio、entropy、z 分布等'
  - '- `compute_cossim()` 额外算相邻层同名张量之间的余弦相似度'
  - '- `show_statistics()` 负责把这些统计按层聚合、按排序规则打印成表格'
