learning_targets:
- 理解 OpenCL、Vulkan、WebGPU 三大通用 GPU 后端的初始化流程与设备管理机制
- 掌握 Adreno GPU 硬件识别（get_adreno_gpu_gen）与编译器版本检测的实现原理
- 理解 OpenCL 内核批量加载（load_cl_kernels）与嵌入式源码（GGML_OPENCL_EMBED_KERNELS）的编译机制
- 掌握量化张量在 OpenCL 设备端的存储结构（ggml_tensor_extra_cl_q4_0/q4_K 等）与内存池管理
- 理解算子融合（ggml_opencl_can_fuse / ggml_vk_can_fuse）与图优化（graph_optimize / graph_compute）在后端实现逻辑
- 掌握 Vulkan SPIR-V 着色器的批量生成（process_shaders）与 push constant 设计模式
- 理解 WebGPU 参数竞技场（webgpu_param_arena）与 WGSL 着色器库（ggml_webgpu_shader_lib）的缓存机制
- 了解着色器代码嵌入工具（embed_kernel.py / embed_wgsl.py）的源码打包原理
- 掌握跨平台 GPU 后端针对量化格式（Q4_0/Q4_K/Q6_K/MXFP4）的矩阵乘法优化策略
- 理解 Flash Attention 在各后端上的共享内存优化、GQA 分组、mask 处理与 split-k 分解策略
- 对比三大后端在算子支持矩阵（supports_op）上的约束差异与回退策略
- 掌握 Vulkan 后端中 push constants 的模板化初始化与快速除法（fastdiv）预计算机制
life_analogy:
- 想象 llama.cpp 的三大通用 GPU 后端是三条通往不同目的地的**高速公路系统**：
- '- **OpenCL** = 专为**高通 Adreno 移动 GPU** 优化的**方程式赛道**：'
- '  - *get_adreno_gpu_gen()* = 入口处的**车型识别员**，根据车牌号（设备名）识别是 A7X、A8X 还是 X1E 代际的超跑'
- '  - *use_adreno_kernels()* = **赛道准入门槛**，只有尺寸足够大的矩阵（ne0/ne1 ≥ 512/128）才能进入专用车道'
- '  - *ggml_tensor_extra_cl_q4_k* = **压缩货物的专用集装箱**，将量化后的权重（Q4_K 等）拆分成 ql/qh/s/d 多个隔间存放'
- '  - *Image1D 缓冲区* = 赛道旁的**高速传送带**，专门优化矩阵转置和数据搬运效率'
- ''
- '- **Vulkan** = **多厂商兼容的标准化高速公路网**（支持 AMD/NVIDIA/Intel）：'
- '  - *get_device_architecture()* = **地质勘探仪**，通过探测岩层（扩展特性）判断是 GCN 老矿区、RDNA 新矿区还是
  NVIDIA 的 Turing 富矿区'
- '  - *vulkan-shaders-gen* = **预制件工厂**，提前用 GLSL 图纸（.comp 文件）批量生产 SPIR-V 预制板（数百种着色器变体）'
- '  - *push constants* = **快递面单**，每次调度管线时只需填写少量关键参数（矩阵维度、步长）即可快速发车'
- '  - *ggml_vk_can_fuse()* = **拼车算法**，检测 RMS_NORM+MUL、ROPE+VIEW 等可以合并运输的货物，减少车次'
- '  - *split-k* = **多车道并行**，把大矩阵乘法拆成多段交给不同车道同时处理，最后汇总'
- ''
- '- **WebGPU** = **浏览器里的轻量级磁悬浮**：'
- '  - *webgpu_param_arena* = **共享充电宝站**，通过槽位（slot）机制快速借还 uniform 参数缓冲区，避免频繁申请'
- '  - *ggml_webgpu_shader_lib* = **自助图书馆**，根据当前操作（Flash Attention、矩阵乘）和硬件配置（subgroup_matrix
  支持）自动借阅对应的 WGSL 教材'
- '  - *embed_wgsl.py* = **电子书打包器**，把分散的 WGSL 章节（#include 指令）合并成单本电子书（C++ 字符串常量），并自动分卷（chunk）防止文件过大'
- '  - *pre_wgsl::Preprocessor* = **自动翻译机**，将 #define/#if 等条件编译指令翻译成最终的 WGSL 代码'
- ''
- 三条道路虽然路况（API 规范）不同，但目标一致：把 GGML 计算图这辆「货车」安全高效地从 CPU 娘家送到 GPU 婆家，并确保沿途的量化货物（Q4_0/Q4_K）和计算指令（着色器/内核）都能准确送达。
'no': 39
