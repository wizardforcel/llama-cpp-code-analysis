  - '**为什么 norm_shift = +1 是 Gemma 的标志？**'
  - '- Gemma RMSNorm 在 forward 时执行 `weight * (1.0 + w)`，因此存储时减去 1'
  - '- 在 `convert_hf_to_gguf.py` 中通过 `norm_shift()` 方法做反向补偿'
  - '- Gemma3 默认为 1.0，但 Gemma3N/Gemma4 关闭（0.0），因为其 NormScale shift 在 forward 已隐含'
