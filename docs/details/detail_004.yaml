  - '1. GemmaModel.modify_tensors 中 `if name.endswith("norm.weight"): data_torch =
    data_torch + 1` 是在做什么？为什么要做这一步？'
  - 2. GemmaModel.set_vocab 中为什么要显式注入 prefix/suffix/mq/fsep/eot 这五个特殊 token？它们对应的
    token ID 是多少？
  - 3. `add_space_prefix = False` 对 SentencePiece 词表有什么意义？如果不设置会怎样？
