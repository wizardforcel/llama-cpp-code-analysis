learning_targets:
- 理解 Gemma 家族在 GGUF 转换中的四代演进：基础款 norm.weight+1、Gemma3 的 vocab 截断与多模态分流、Gemma3N 的 AltUp
  多通道堆叠、Gemma4 的共享 KV 与比例 RoPE
- 掌握 Gemma 系列 norm_shift（+1 偏移）的反向补偿机制，以及 Gemma3N 为何关闭 norm_shift
- 理解 Gemma3N 视觉塔使用 MobileNetV5 双层 block 路径映射（bid.{sid}.suffix）的解析原理
- 了解 Gemma3N AltUp 投影张量的捕获与 3D 堆叠过程，以及 vision/audio token 嵌入 padding 到 262400 的工作机制
- 掌握 Gemma4 共享 KV 层标记、PL Embedding 维度、dual head_dim（global vs sliding）以及 Proportional
  RoPE 频率因子（partial_rotary_factor=0.25 + 1e30 哨兵）的实现细节
- 熟悉 Gemma3/Gemma4 的 sliding_window_pattern 与 layer_types 对齐机制，以及 Activation Sparsity
  Pattern 的 normal.icdf 还原方法
- 掌握 Gemma3/Gemma4 多模态转换器（mmproj）的实现差异，包括 Gemma3VisionModel 的 soft_emb_norm +1 与 Gemma3nVisionAudioModel
  的 MobileNetV5 block_tensor_mapping
- 熟悉 Gemma4VisionAudioModel 的 audio Conformer（softplus + per_dim_key_scale）与 vision（patch_embedder
  2D→4D conv）处理流程
life_analogy:
- 想象 Gemma 家族是一座「Google 大厦的四代升级工程」：
- '- **Gemma 基础款** = 一栋毛坯公寓，每间房（norm 层）需要开发商偷偷给家具加 1cm 垫片（norm.weight+1），搬进 GGML 大厦时必须把垫片拆加'
- '- **Gemma3** = 在公寓里加装智能家居系统，根据户型图（is_causal）决定要不要装安防摄像头（causal_attention），多余的房间号（OOV
  vocab）直接封掉'
- '- **Gemma3N** = 引入 AltUp「四胞胎平行电梯」，每个乘客（token）有 4 套独立通道，管家（_stack_matrices）把三块分散的电梯控制板拼成一块
  3D 总控屏'
- '- **Gemma3N 的 vision/audio 嵌入** = 大厦顶层留出 256 个「客房」（262144-262399）给访客住，本地居民（语言 token）走正门，访客走侧门（vision/audio
  独立路径）'
- '- **Gemma4** = 在顶层加盖「共享办公区」（shared_kv layers），最后 N 层共用会议室（KV cache），会议室按 global/sliding
  模式分大小（dual head_dim）'
- '- **Proportional RoPE** = 旋转门只转 25%（partial_rotary_factor），剩下 75% 用 1e30「液压墙」挡住，让
  ggml 知道这些维度不能转'
- '- **Gemma3n Vision 的 MobileNetV5** = 大厦装了一套 timm 牌「折叠家居」，每块家具用 {bid}.{sid} 双层编号（哪个抽屉的哪个格子），custom_map
  是一张自动翻译表'
- '- **Gemma4 Audio Conformer** = 语音管家用 softplus 给每个旋钮（per_dim_key_scale）加软化滤镜，让声音更圆润；patch_embedder
  则把 2D 拼图重新拼成 3D 立体画'
- 就像四代大厦不断迭代，大堂经理（norm_shift）从「+1 垫片」变成「不加垫片」，电梯工（AltUp）从无到有，旋转门工程师（RoPE）也在不断换新工艺。
'no': 3
summary:
- concept: GemmaModel.norm.weight+1
  desc: HF forward 在 RMSNorm 时乘 (1+w)，存储时已减去 1；转换时必须 +1 反向补偿给 GGML 端
- concept: Gemma3Model.vocab 截断
  desc: embed_tokens.weight 仅保留真实 vocab 大小（去掉 OOV），配合 is_causal/sliding_window 写入元数据
- concept: Gemma3NModel._altup_proj 堆叠
  desc: 捕获 .0./.1./.2. 三组 AltUp 投影矩阵，_stack_matrices 后产出 model.altup_*_projections.weight
    3D 张量
- concept: Gemma3NModel.vocab_size=262400
  desc: vocab_size_per_layer_input=262144 + 256 个 vision/audio token，embed_tokens
    末尾 zero-pad
- concept: Gemma3NModel.norm_shift=0.0
  desc: Gemma3p5RMSNorm 已隐含在 forward 中，存储时不再需要补偿偏移
- concept: Gemma3nVisionAudioModel.block_tensor_mapping
  desc: MobileNetV5 timm blocks.{bid}.{sid}.suffix 双层路径模板化映射到 v.blk.{bid}.{sid}.suffix
- concept: Gemma4Model.shared_kv_layers
  desc: add_shared_kv_layers 标记末尾 N 层共享 KV cache，配合 use_double_wide_mlp 让 FFN 翻倍
- concept: Gemma4Model.dual head_dim
  desc: global_head_dim (add_key_length) 与 head_dim (add_key_length_swa) 并存，运行时按 layer_types
    选择
- concept: Gemma4Model.Proportional RoPE FREQS
  desc: partial_rotary_factor=0.25，生成 (1.0)*n_rot + (1e30)*n_unrot 的 ROPE_FREQS，让
    ggml 跳过未旋转位置
- concept: Gemma4Model.per_expert_scale → FFN_DOWN_EXP.scale
  desc: MoE 路由的 per_expert_scale 标量被映射为专家 down 投影的的 .scale 后缀张量
- concept: Gemma3NModel.Activation Sparsity
  desc: normal.icdf(sparsity) 反推 multiplier 写入 add_activation_sparsity_scale，用于推理跳过低激活维度
- concept: Gemma3Model.sliding_window_pattern
  desc: 遍历 layer_types 生成布尔列表与 add_sliding_window_pattern 严格对齐，ISWA 双缓存策略依赖此标记
- concept: Gemma3VisionModel.soft_emb_norm+1
  desc: Gemma3 RMSNorm forward 公式 (1+w)，在 Gemma3 mmproj 中只有 soft_emb_norm 需要 +1，其他
    norm 来自 SigLIP 已正确
- concept: Gemma3NModel.set_vocab 覆盖
  desc: 临时删除 vocab_size_per_layer_input 强制读取 vocab_size=262400，让 SentencePiece/GPT2
    写出 262400 行 tokens
- concept: Gemma4VisionAudioModel.per_dim_key_scale softplus
  desc: audio 塔的 per_dim_key_scale 后用 softplus 激活并加 .weight 后缀映射为 F32 张量
- concept: Gemma4VisionAudioModel.patch_embedder 2D→4D
  desc: patch_embedder.input_proj 从 [n_embd, patch*patch*3] reshape 成 [n_embd, 3,
    patch, patch] 标准 conv2d 格式
- concept: Gemma3NModel.embed_tokens_per_layer padding
  desc: 不仅embed_tokens.weight，embed_tokens_per_layer 同样按 vocab_size - current_size
    末尾 zero-pad
- concept: Gemma4VisionAudioModel.is_audio_tensor
  desc: 通过 audio_tower/embed_audio 关键字判定走 audio Conformer 分支，否则走 vision ViT 分支
