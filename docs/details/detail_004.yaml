  - '- `modify_tensors` 中检查 `name.endswith("norm.weight")`'
  - '- `data_torch = data_torch + 1` 反向补偿回 GGML 端期望的值'
  - '- `set_vocab` 标记 `add_space_prefix = False`，符合 SentencePiece 规范'
  - '**Gemma3Model：因果 vs 非因果与 vocab 截断**'
  - '- 通过 `is_causal` 自动写入 `causal_attention` 元数据'
  - '- OOV 行裁剪：`embed_tokens.weight` 只保留真实 vocab 大小'
  - '- sliding_window_pattern != 1 时写入 `sliding_window` KV 元数据'
  - '**Gemma3NModel：AltUp 多通道与 vision/audio token 嵌入填充**'
  - '`_altup_proj` 与 `_altup_unembd` 缓冲三组 AltUp 投影矩阵，堆叠为 3D 张量：'
  - '- 通过 `if ".0." / ".1." / ".2."` 分支识别索引'
  - '- `_stack_matrices` 检测全部到齐后写入 `model.altup_*_projections.weight`'
  - '**Gemma3NModel：vision/audio 嵌入 padding 机制**'
  - '- 由于 `vocab_size_per_layer_input = 262144`，但实际含视觉 token 后总长 262400'
  - '- `embed_tokens.weight` 末尾追加 zero padding，让 vision 走独立路径'
  - '- `sliding_window_pattern` 列表与 `layer_types` 严格对齐'
  - '**Gemma4Model：共享 KV 层与 per-layer 输入嵌入**'
  - '- `add_shared_kv_layers(num_kv_shared_layers)` 标记最后 N 层为 KV 共享'
