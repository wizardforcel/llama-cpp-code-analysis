  name: Gemma4 共享 KV 与滑动窗口 —— 双缓存机制与 RoPE 比例
  'no': 4
  points:
  - '**为什么 Gemma4 有共享 KV 层？**'
  - '- 节省长推理的 KV cache 占用'
  - '- `hparams["num_kv_shared_layers"]` 标记末尾 N 层共享 KV'
  - '- `add_shared_kv_layers(...)` 让 C++ 端识别哪些层可以共享'
  - '**Gemma4 的 per-layer 输入嵌入（PL Embedding）**'
  - '- `hidden_size_per_layer_input` 是辅助输入的维度'
  - '- 通过 `add_embedding_length_per_layer_input` 写入'
  - '- 用于 `project_per_layer_inputs` 投影层'
  - '**dual head_dim：global vs sliding 双轨并行**'
  - '- `global_head_dim` 与 `head_dim` 在 Gemma4 中并存'
  - '- 写入 `add_key_length` (global) 与 `add_key_length_swa` (sliding)'
  - '- 运行时根据 layer_types 决定读哪个'
  - '**use_double_wide_mlp 与 FFN 双倍扩容**'
  - '- 当 `use_double_wide_mlp = True` 时，shared KV 层用 2 倍 FFN'
  - '- 动态生成 `n_ff_arr` 数组，写入 `add_feed_forward_length(n_ff_arr)`'
  - '- 让 C++ 端按 per-layer 维度调整'
  - '**Proportional RoPE 频率因子的精妙**'
  - '- `partial_rotary_factor = 0.25`，即只有 25% 维度参与旋转'
  - '- `freqs = 1.0 / (base ** (arange(0, dim, 2) / dim))` 生成基础频率'
  - '- 未旋转维度用 `1e30` 标记，让 ggml 在 RoPE 公式中跳过'
  - '**Gemma4VisionAudioModel.audio / vision 处理差异**'
  - '- audio 走 Conformer 路径，`is_audio_tensor` 区分 audio_tower / embed_audio'
  - '- vision 走 SigLIP 风格 ViT + Gemma4MultimodalEmbedder 投影头'
  - '- `_per_dim_key_scale` 后应用 `softplus(data_torch)` 变换'
  - '- `patch_embedder.input_proj` reshape 成 (n_embd, 3, patch_size, patch_size) 标准
    conv2d'
