  name: 递归下降解析器 —— 构建模板的'语法树'
  'no': 2
  points:
  - '**AST 构建流水线**'
  - '- parse 作为入口，循环调用 parse_any 分派到文本、注释、表达式或语句处理'
  - '- 使用 mk_stmt 模板方法创建 AST 节点，自动绑定源码位置信息用于错误报告'
  - '- 通过 peek/next/expect/expect_identifier 实现前瞻和断言，确保语法符合预期结构'
  - ''
  - '**控制结构解析**'
  - '- parse_if_statement：处理 if/elif/else/endif 嵌套，递归解析备选分支'
  - '- parse_for_statement：解析循环变量、in 迭代对象、循环体及可选的 else 块'
  - '- parse_macro_statement：捕获宏名称、参数列表和宏体'
  - '- parse_jinja_statement 中内联处理 call：支持带 caller 参数的宏调用'
  - '- parse_set_statement：支持变量赋值和多行 set 块'
  - '- parse_jinja_statement 中内联处理 filter：{% filter %} 块语句'
  - '- parse_jinja_statement 处理 break/continue 循环控制'
  - ''
  - '**表达式优先级链**'
  - '- 实现标准的优先级递归下降：parse_if_expression → parse_logical_or → parse_logical_and → parse_logical_negation
    → parse_comparison → parse_additive → parse_multiplicative → parse_test → parse_filter
    → parse_call_member → parse_member → parse_primary'
  - '- parse_expression_sequence 处理逗号分隔的表达式，自动生成元组字面量'
  - '- parse_args：处理位置参数、*args 展开和 key=value 关键字参数'
  - ''
  - '**字面量与基础访问**'
  - '- parse_primary_expression：处理数字、字符串、布尔/None、圆括号、数组、对象字面量'
  - '- parse_member_expression：解析点号访问和方括号索引'
  - '- parse_member_expression_arguments：解析方括号内的切片表达式'
  - '- is_type<T> 工具函数用于解析时的 AST 类型检查'
