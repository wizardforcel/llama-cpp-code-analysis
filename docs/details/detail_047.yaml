  desc: 递归下降解析，从 parse_expression 到 parse_primary_expression 的优先级链
- concept: parse_jinja_statement
  desc: 分派 {% %} 语句到具体处理器（if/for/macro/set/call/filter）
- concept: mk_stmt<T>
  desc: AST 节点工厂，自动绑定源码位置信息
- concept: peek/next/expect/is
  desc: 解析器原语：前瞻token、消费token、断言类型
- concept: context 类
  desc: 运行时变量环境，支持嵌套作用域
- concept: statement::execute/execute_impl
  desc: 统一执行入口与虚函数实现，异常包装附加位置信息
- concept: for_statement::execute_impl
  desc: 循环执行，支持数组/对象遍历、loop 元数据、else 空循环回退
- concept: binary_expression
  desc: 处理逻辑短路（and/or）、算术、比较、成员关系（in）运算
- concept: filter_expression
  desc: 管道语法实现，将值传递给内置过滤器
- concept: test_expression
  desc: is 测试实现，映射到 test_is_* 内置函数
- concept: property_expression
  desc: 属性访问表达式，记录统计信息（array_access/object_access）
