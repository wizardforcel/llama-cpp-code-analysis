  name: 强类型值系统 —— 数据与行为的'载体'
  'no': 4
  points:
  - '**类型层级与多态基座**'
  - '- 以 value_t 为抽象基类，定义类型查询、转换、比较、哈希等通用接口'
  - '- 派生出 value_int_t, value_float_t, value_string_t, value_bool_t, value_array_t,
    value_tuple_t, value_object_t, value_none_t, value_undefined_t, value_func_t,
    value_kwarg_t 共 11 种具体类型'
  - '- 使用 std::shared_ptr<value_t> 实现自动内存管理，通过 mk_val<T> 工厂函数创建实例'
  - '- is_val<T>/cast_val<T> 基于 extract_pointee 模板元编程提供安全的类型检查和向下转型'
  - ''
  - '**值类型语义实现**'
  - '- value_int_t/value_float_t：数值类型，自动同步 int64/double 表示，处理无穷大等特殊值'
  - '- value_bool_t：布尔类型，内部复用整数表示'
  - '- value_string_t：包装智能字符串（jinja::string），支持输入标记追踪'
  - '- value_array_t：可变数组，支持 push_back/pop_at/reverse'
  - '- value_tuple_t：继承自 value_array_t 但标记为不可变'
  - '- value_object_t：有序键值对存储，支持 insert/at/has_key'
  - '- value_none_t/value_undefined_t：特殊空值，undefined 可携带 hint 消息'
  - '- value_func_t：函数封装，通过 invoke 调用，支持绑定 this（arg0）实现方法调用'
  - '- value_kwarg_t：关键字参数包装'
  - ''
  - '**函数参数处理（func_args）**'
  - '- func_args 类封装参数列表，支持 get_pos（位置参数）和 get_kwarg（关键字参数）访问'
  - '- get_kwarg_or_pos 实现 Jinja 风格的灵活参数传递（优先关键字，回退位置）'
  - '- ensure_count/ensure_val/ensure_vals 提供编译期友好的参数数量和类型断言'
  - '- push_back/push_front 支持动态构建参数列表'
  - ''
  - '**内置函数绑定机制**'
  - '- 每个值类型实现 get_builtins() 返回函数映射表，通过 value_func_t 将成员函数暴露给模板'
  - '- global_builtins() 注册全局函数：range, strftime_now, raise_exception, namespace, tojson
    及 test_is_* 系列类型测试'
  - '- slice/empty_value_fn/test_type_fn/test_compare_fn/default_value/selectattr/tojson/string_startswith/string_endswith
    等模板工具函数简化内置实现'
  - ''
  - '**比较、哈希与等价性**'
  - '- value_compare 函数处理跨类型比较（数值 vs 字符串，布尔等），支持 eq/ne/ge/gt/lt 等操作'
  - '- unique_hash 为每个值生成唯一哈希，结合 hasher 类型指纹和内容，用于 unordered_map 键'
  - '- is_hashable 检查值是否可作为对象键（要求不可变且内部元素也可哈希）'
  - '- equivalent/nonequal 提供等价和严格不等比较'
  - '- value_hasher/value_equivalence/value_equality 是用于 STL 容器的谓词'
  - ''
  - '**JSON 与字符串序列化**'
  - '- from_json 将 nlohmann::ordered_json 递归转换为值系统'
  - '- global_from_json 将 JSON 对象注入到 context 全局变量'
  - '- value_to_json/value_to_json_internal 将值序列化为 JSON 字符串'
  - '- value_to_string_repr 生成值的调试字符串'
  - '- stats_t::mark_used 递归标记值已使用，用于能力探测统计'
