  desc: 强类型值系统，派生 int/float/string/bool/array/tuple/object/none/undefined/func/kwarg
- concept: mk_val<T>/is_val<T>/cast_val<T>
  desc: 类型安全的值创建、检查和转换工具
- concept: func_args
  desc: 函数参数封装，支持位置参数、关键字参数、*args 展开
- concept: get_builtins()
  desc: 每个值类型暴露的内置函数表
- concept: global_builtins()
  desc: 全局函数注册表（range/tojson/raise_exception/test_is_*）
- concept: value_compare
  desc: 跨类型比较逻辑，处理数值、字符串、布尔的比较
- concept: from_json/value_to_json/value_to_string_repr
  desc: JSON 与值系统的双向转换及调试表示
- concept: value_t::stats_t::mark_used
  desc: 递归标记值已使用，支持能力探测统计
- concept: string_part/string
  desc: 片段化字符串，is_input 标记区分模板静态文本和用户输入
- concept: mark_input_based_on
  desc: 输入标记传染机制，确保用户数据不被误认为是可信模板代码
- concept: caps 结构体与 caps_get
  desc: 能力探测入口，通过模拟执行推断模板特性
- concept: caps_try_execute/caps_print_stats
  desc: 模拟执行模板并输出统计追踪信息
- concept: hasher
  desc: FNV 变体哈希器，支持流式更新与最终摘要
- concept: peak_source/fmt_error_with_source
  desc: 错误定位工具，提取出错位置前后片段并标记指示符
- concept: get_line_col
  desc: 将字符偏移量转换为行列号的辅助函数
- concept: string_replace_all
  desc: 高效字符串全局替换工具
