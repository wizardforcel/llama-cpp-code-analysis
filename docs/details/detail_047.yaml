  name: 智能字符串系统 —— 追踪输入的'安全边界'
  'no': 5
  points:
  - '**片段化字符串设计**'
  - '- string_part 是携带 is_input 布尔标记的最小单元，区分模板静态文本（TMPL）和用户输入（INPUT），用于 XSS 防护或内容审计'
  - '- string 类由多个 string_part 组成，支持从 std::string/int/double 构造'
  - '- str() 拼接所有片段（单片段优化返回），length() 计算总字符长度'
  - '- hash_update 将各片段内容更新到 hasher，用于值系统的唯一哈希计算'
  - ''
  - '**大小写检查与标记追踪**'
  - '- string_part::is_uppercase/is_lowercase 检查片段是否全大写/小写（仅检查 ASCII 字母）'
  - '- string::is_uppercase/is_lowercase 要求所有片段满足条件'
  - '- all_parts_are_input() 检查是否所有片段都标记为用户输入'
  - ''
  - '**输入标记传播**'
  - '- mark_input() 将字符串所有片段标记为用户输入'
  - '- mark_input_based_on() 实现标记传染：若源字符串全是输入，则目标字符串也标记为输入'
  - '- 该机制确保用户提供的敏感数据（如工具调用参数）不会被误认为是可信模板代码'
  - ''
  - '**字符串变换**'
  - '- append() 追加字符串，合并片段（保留各自输入标记）'
  - '- uppercase()/lowercase()/capitalize()/titlecase()：通过 apply_transform 辅助函数统一实现，逐片段应用字符变换，保持片段结构'
  - '- strip(left, right, chars)：支持自定义字符集修剪两端，会修剪片段边界并删除空片段'
