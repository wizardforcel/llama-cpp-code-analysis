  name: 运行时执行引擎 —— 驱动模板的'虚拟机'
  'no': 3
  points:
  - '**上下文与作用域管理**'
  - '- context 类维持变量环境栈，构造函数自动注入 true/false/none（含大写变体）内置常量及当前时间戳'
  - '- 拷贝构造函数实现作用域继承：复制父上下文变量、时间戳、is_get_stats 标志和源码引用'
  - '- get_val/set_val 管理变量，print_vars 以 JSON 格式 dump 当前变量用于调试'
  - ''
  - '**AST 类型体系与工具函数**'
  - '- statement 作为所有 AST 节点基类，提供 type() 多态识别和 execute() 统一入口'
  - '- is_stmt<T>/cast_stmt<T>/chk_type 提供类型安全的 AST 节点检查与转换'
  - '- 字面量节点直接包装常量值'
  - '- 控制流信号（break_statement::signal, continue_statement::signal）通过异常实现非局部跳转'
  - ''
  - '**异常与错误增强**'
  - '- statement::execute 包装具体执行逻辑，捕获异常并附加源码位置（行列号）和代码片段'
  - '- rethrown_exception 保留原始错误上下文，raised_exception 用于主动抛出运行时错误'
  - ''
  - '**控制流执行**'
  - '- if_statement 根据条件值选择执行主体或备选分支'
  - '- for_statement 支持数组/对象遍历，自动处理 loop 元数据，支持 else 空循环回退'
  - '- set_statement 支持标识符赋值、元组解包赋值和成员赋值'
