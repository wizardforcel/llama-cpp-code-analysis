  desc: Token 类型枚举与字符串转换
- concept: lexer::tokenize
  desc: 核心词法分析，将模板源码转为 token 流
- concept: string_lstrip/string_rstrip
  desc: 辅助函数，实现 {{- 和 -}} 的空白控制
