learning_targets:
- 理解 Jinja 词法分析器（lexer）如何将模板源码切分为 token 序列，掌握 trim_blocks/lstrip_blocks 空白控制机制
- 掌握递归下降解析器（parser）构建 AST 的完整流程，理解表达式优先级链与控制结构解析
- 深入运行时执行引擎（runtime），理解上下文作用域管理、控制流执行与表达式求值机制
- 剖析强类型值系统（value_t 体系），理解类型多态、内置函数绑定与函数参数处理机制
- 了解智能字符串系统（string_part/string）的输入标记传播与文本变换实现
- 掌握能力探测机制（caps）如何通过模拟执行与统计追踪推断模板特性
- 熟悉基础设施组件（hasher、peak_source 等）在错误定位与哈希计算中的应用
life_analogy:
- 想象 Jinja 模板引擎是一家**智能邮件合并工厂**：
- '- **词法分析器（lexer）** = **信件分拣员**：将原始信件（模板文本）拆分成邮票（{{ }}）、地址标签（{% %}）和普通内容（文本）'
- '- **语法解析器（parser）** = **信件结构分析师**：理解信件格式，知道哪里是问候语（if 条件）、哪里是循环列表（for 循环），构建出标准信件模板（AST）'
- '- **运行时执行器（runtime）** = **信件生成器**：根据客户数据（context 变量）实际填写模板，处理循环展开、条件判断，输出最终信件'
- '- **值系统（value_t）** = **多功能文书工具箱**：提供各种数据类型（数字、文本、列表、字典）和对应的处理工具（过滤器、函数）'
- '- **智能字符串（string）** = **带安全标签的墨水**：区分打印好的文字（模板静态内容）和手写的敏感信息（用户输入），实现 XSS 防护'
- '- **能力探测（caps）** = **格式检测器**：预先试探信件模板支持哪些高级功能（工具调用、并行处理等），以便调整处理策略'
'no': 46
