learning_targets:
- 理解server_tool抽象基类如何定义工具的通用契约（JSON Schema + invoke接口）
- 掌握只读工具三剑客（read_file/glob_search/grep_search）的安全边界与实现原理
- 掌握写操作工具（write_file/edit_file/apply_diff）的精准编辑与原子化修改机制
- 理解exec_shell_command工具的多层安全围栏（超时/输出限制/权限标记）
- 掌握server_tools注册表的可插拔架构与HTTP端点暴露机制
- 能基于server_tool基类开发自定义Agent工具并注册到工具生态
life_analogy:
- 想象llama-server的Agent工具系统是一家**全能装修公司的工具箱体系**：
- '- **server_tool基类** = 工具的统一安全认证标准（就像电动工具都必须有3C认证），规定每件工具必须有「说明书」（get_definition）和「使用开关」（invoke）'
- '- **permission_write** = 工具上的红黄标签：绿色标签（read_file/grep_search）是测量工具，随便用；红色标签（write_file/exec_shell）是电钻切割机，必须业主签字确认'
- '- **只读三剑客** = 装修前的勘察装备：read_file是望远镜（看指定行范围）、glob_search是金属探测器（找文件位置）、grep_search是显微镜（搜细节内容）'
- '- **写操作三件套** = 施工装备梯度：write_file是推土机（整体重建）、edit_file是手术刀（精准行编辑）、apply_diff是专业焊枪（处理复杂补丁）'
- '- **exec_shell_command** = 租借的大型机械，不仅要红色标签，还要操作时限时（超时60秒）、限载（10MB输出），完工后强制熄火（kill进程）'
- '- **server_tools注册表** = 公司的工具调度室：tool清单在册（vector管理），按需启用（enabled_tools），对外服务窗口统一接单（handle_post），按单派工（invoke按名分发）'
- 就像装修公司不会让学徒直接操作切割机，llama.cpp通过权限分层与HTTP确认机制，确保LLM的每一次「动手」都在安全围栏之内。
'no': 85
summary:
- concept: server_tool
  desc: Agent工具的抽象基类，定义get_definition/invoke/to_json三大契约与permission_write安全标记
- concept: get_definition()
  desc: 返回OpenAI Function Calling格式的JSON Schema，向LLM描述工具参数与用法
- concept: invoke(json)
  desc: 统一输入输出接口，JSON入JSON出，屏蔽底层实现差异
- concept: permission_write
  desc: 布尔安全标记：false=只读工具自由调用，true=写操作需用户确认
- concept: read_file
  desc: 只读工具，支持start_line/end_line行范围读取与行号前缀
- concept: file_glob_search
  desc: 只读工具，基于glob模式递归搜索文件，返回相对路径列表
- concept: grep_search
  desc: 只读工具，正则表达式搜索，支持文件/目录模式与最大匹配数限制
- concept: write_file
  desc: 写工具，自动create_directories创建父目录后写入内容
- concept: edit_file
  desc: 写工具，replace/delete/append三种行级精准编辑，带行号合法性验证
- concept: apply_diff
  desc: 写工具，接收unified diff写临时文件后调用git apply原子应用
- concept: exec_shell_command
  desc: 高危写工具，通过run_process执行shell，默认60秒超时+10MB输出限制
- concept: run_process()
  desc: 进程执行基础设施，fork子进程、捕获stdout/stderr、超时强制kill
- concept: server_tools
  desc: 工具注册表，vector管理unique_ptr工具实例，setup筛选+HTTP路由注册
- concept: __main__ (build_tools)
  desc: 工厂函数，集中创建全部7个内置工具实例
- concept: handle_get/handle_post
  desc: HTTP处理器：GET返回工具Schema列表，POST按名分发工具调用
