exercises:
- contents:
  - 阅读 `tools/server/server-tools.cpp` 第184-469行，对比三个只读工具：
  - 1. `server_tool_read_file.invoke()` — 行范围读取
  - 2. `server_tool_file_glob_search.invoke()` — 递归glob匹配
  - 3. `server_tool_grep_search.invoke()` — 正则搜索
  - 回答问题：
  - '- read_file如何处理start_line/end_line越界的情况？'
  - '- grep_search的max_results默认值是多少，超过后如何截断？'
  - '- 三个工具的`permission_write`值是什么？如果改成true会在HTTP层触发什么不同的行为？'
  'no': 1
  title: 阅读只读工具的实现边界
- contents:
  - 阅读 `tools/server/server-tools.cpp` 第620-790行的 `server_tool_edit_file.invoke()`：
  - 1. 梳理replace/delete/append三种操作的行号验证流程
  - 2. 观察变更应用后如何重新组装文件内容
  - 3. 对比apply_diff（803-853行）的临时文件+git apply方案
  - 回答问题：
  - '- edit_file在哪些情况下会拒绝编辑并返回错误？'
  - '- apply_diff为什么要写临时文件而不是直接管道传输？'
  - '- 如果edit_file与apply_diff修改同一文件冲突，llama.cpp如何感知？'
  'no': 2
  title: 剖析写工具的编辑验证逻辑
- contents:
  - 阅读 `tools/server/server-tools.cpp` 第100-180行的 `run_process()` 与第483-544行的 `server_tool_exec_shell_command.invoke()`：
  - 1. 梳理子进程创建、stdout/stderr捕获、超时kill的完整链路
  - 2. 分析run_proc_result结构体中三个字段的填充时机
  - 3. 思考默认60秒超时与10MB输出限制的攻防意义
  - 回答问题：
  - '- 如果LLM请求执行`sleep 120`，run_process会如何表现？'
  - '- 输出超过max_output_bytes时是静默截断还是报错？'
  - '- 为何不直接用system()而要手写run_process？'
  'no': 3
  title: 攻破exec_shell_command的安全围栏
- contents:
  - 基于 `tools/server/server-tools.h` 第6-22行的契定，设计一个新工具 `server_tool_word_count`（统计文件字数）：
  - 1. 在头文件中声明类，继承server_tool
  - 2. 实现get_definition()，定义path与count_lines/count_chars参数
  - 3. 实现invoke()，读取文件并返回统计JSON
  - 4. 修改 `__main__` 中的工厂代码（856-863行）将新工具加入向量
  - 回答问题：
  - '- 新工具的permission_write应该设为true还是false？为什么？'
  - '- 如果enabled_tools参数未包含你的工具名，setup()会如何处理？'
  - '- handle_post收到未知工具名时返回什么格式的错误？'
  'no': 4
  title: 设计并注册一个自定义工具
- contents:
  - 阅读 `tools/server/server-tools.cpp` 第865-931行的 `server_tools.setup()` 与 `server_tools.invoke()`：
  - 1. 梳理GET /tools端点如何序列化所有启用工具的Schema
  - 2. 梳理POST /tools/call端点从JSON请求到工具invoke的调用链
  - 3. 观察 invoke() 中按名称匹配的线性查找实现
  - 回答问题：
