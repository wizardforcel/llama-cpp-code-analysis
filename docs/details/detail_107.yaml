    gallocr_reserve_n 的跨设备分配'
  - '- test_buffer_size_zero：验证 backend_b（SIZE_MAX）未被分配时保持 0 字节，不浪费资源'
  - '- test_reallocation：首次分配 40B，第二次图更大时 gallocr 复用分配器并重新分配，无泄漏'
  - '- run/main：测试套件的执行框架与断言汇总'
