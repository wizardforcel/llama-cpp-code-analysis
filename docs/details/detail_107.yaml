  name: gallocr 分配器行为测试矩阵 —— 内存策略的「十三道极限考题」
  'no': 2
  points:
  - '**缓冲区容量的极限挑战**'
  - '- test_max_size_too_many_tensors：7 个 8B 张量超过 16B 容量，验证自动分裂第二个缓冲区'
  - '- test_max_size_tensor_too_large：大张量跨越缓冲区剩余空间，验证「不够就新开」策略'
  - '- test_tensor_larger_than_max_size：单张量 24B 超过 16B 上限，验证分配器自动扩大缓冲区'
  - '- test_not_enough_chunks：17 个张量超过 16 个 chunk，验证动态增长 chunk 数或合并空闲块'
  - '**内存复用与碎片整理**'
  - '- test_view_inplace：reshape/permute/view 创建视图链，in-place add 复用内存，全程零额外分配'
  - '- test_reuse_and_free：释放 x2 后复用其空间给 x4，验证 free list 的正确性'
  - '- test_merge_free_block：相邻空闲块（x3/x4 释放后）合并为 32B 大块，容纳 28B 新张量'
  - '- test_prefer_already_allocated_memory：优先复用已释放的 24B 块而非剩余 8B 空间，减少实际分配'
