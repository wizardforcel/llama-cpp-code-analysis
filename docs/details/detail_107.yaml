  name: 虚拟后端与测试基础设施 —— 内存分配的「模拟沙盘与度量衡」
  'no': 1
  points:
  - '**为什么需要 dummy_backend_context 与 dummy_backend？**'
  - '- 真实 GPU/CPU 后端不可控且依赖硬件，测试需要可编程的「内存演练场」'
  - '- dummy_backend_context 通过 max_buffer_size 和 alignment 精确模拟显存受限、对齐要求等真实场景'
  - '- allocated_total() 实时统计已分配内存，是验证分配器行为正确性的核心断言依据'
  - '**ggml_backend_buffer 接口的空操作艺术**'
  - '- buffer_interface 全空操作实现（set/get/memset/clear），剥离硬件细节，专注验证 gallocr 的分配策略而非数据传输'
  - '- get_base() 返回固定地址 alloc_base，使得所有张量地址可预测，便于计算精确的内存布局断言'
  - '**测试夹具的标准化构造**'
  - '- make_context() 统一创建 48 倍张量开销的 ggml 上下文，确保所有测试在一致环境下运行'
  - '- make_input_1d/make_input_with_size 快速生成标记为 GGML_TENSOR_FLAG_INPUT 的标准输入张量'
  - '- assign_names/get_leaf_id/get_node_id 建立张量名称与图节点索引的映射，支撑多缓冲区类型的手动指定'
  - '**内存安全的三重校验机制**'
  - '- check_all_allocated 确保每个节点都关联了有效缓冲区（buffer != nullptr, data != nullptr）'
  - '- check_max_size 验证张量地址+大小不超出 buffer_type 的 max_size 限制'
  - '- memory_overlap/can_reuse_memory/check_no_overlap 构成图级内存安全网：检测区间交叠、判断引用生命周期、允许
    in-place 复用'
  - '- get_view_source 递归回溯 view_src，确保视图张量不会被误判为占用独立内存'
