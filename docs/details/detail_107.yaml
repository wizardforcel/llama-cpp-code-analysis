exercises:
- contents:
  - 打开 `tests/test-alloc.cpp`，精读以下两个函数：
  - 1. `test_max_size_too_many_tensors()`（第273-291行）
  - 2. `test_reuse_and_free()`（第388-406行）
  - ''
  - 画出每个测试的内存布局图，标注：
  - '- x[0]..x[n] 各自占用的缓冲区编号、起始偏移、大小'
  - '- 每次分配后空闲块的变化（哪些被使用，哪些被合并）'
  - '- 原地操作（in-place）张量复用了谁的内存'
  - ''
  - 然后回答：
  - '- 为什么 `test_max_size_too_many_tensors` 断言 `allocated_total() <= 16 + 16`？'
  - '- 在 `test_reuse_and_free` 中，x[6] 复用了哪个张量的内存？为什么 x[7] 没有额外内存？'
  - '- 如果把 `ggml_pad(ctx, x[0], 2, 0, 0, 0)` 改为 `ggml_pad(ctx, x[0], 4, 0, 0, 0)`，最多需要多大的
    max_buffer_size 才能保证该测试通过？'
  'no': 1
  title: 手工推演 gallocr 分配流程
- contents:
  - 打开 `tests/test-alloc.cpp` 第213-265行，精读以下函数：
  - '- `can_reuse_memory()`'
  - '- `memory_overlap()`'
  - '- `check_no_overlap()`'
  - '- `get_view_source()`'
  - ''
  - 构造并分析以下场景：
  - 1. 一个张量被标记为 OUTPUT，还能复用吗？
  - 2. 如果张量 t1 是 INPLACE 操作的输入且位于第 i 个节点，后续第 i+1 个节点也读取 t1，t1 的内存还能被当前节点复用吗？
  - 3. 构造一个视图链（view → view → view），验证 `check_no_overlap` 是否正确允许它们在视图源共享同一内存区块。
  - ''
  - 然后实现一个新的测试用例 `test_inplace_after_view()`：
  - '- 创建一个数据张量 x，对它做 view 得到 v'
  - '- 用 v 作为 in-place add 的第一个操作数'
  - '- 验证 `can_reuse_memory` 在这种情况下是否正确返回 false（防止覆写视图源）'
  'no': 2
  title: can_reuse_memory 边界场景分析
- contents:
  - 精读 `tests/test-llama-archs.cpp` 第391-491行 `test_backends()` 函数的完整实现，以及第30-46行的
    `nmse()` 函数。
  - ''
  - 回答以下问题：
  - 1. `test_backends` 中为什么先计算 CPU logits 作为基准，再逐个设备对比？如果把某个 GPU 作为基准会发生什么？
  - 2. NMSE 阈值为什么是 1e-4 而不是 1e-6？改成 1e-6 会导致哪些后端测试失败？为什么？（提示：考虑 FP16 vs FP32、SDPA
    精度差异）
  - 3. 为什么 `encode` 只对 `LLM_ARCH_T5` 为 true？T5 的输入路径与普通解码器有什么本质区别？
  - 4. 解释 `logits_roundtrip[i] != logits_dev[i]` 这个逐字节精确比对为何能捕获内存布局或序列化的细微差异。
  - 5. 统计 `moe_mandatory()` 中列出的架构数量，与 `llm_arch_all()` 总数对比，说明 MoE 架构在当前模型生态中的占比趋势。
  - ''
  - 扩展练习：尝试在本地（需有 GPU）运行该测试，验证 QWEN3MOE 架构在 CUDA 后端的 NMSE 值和 Roundtrip 结果。
