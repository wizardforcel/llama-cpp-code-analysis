  - 1. `num_models = gpu_dev_count + 2`，这多出的两个模型副本分别对应什么场景（split_mode 如何配置）？
  - 2. `std::atomic<bool> failed` 用在这里有什么意义？如果改用一个普通的 `bool failed` 会发生什么？
  - 3. 每个线程内部 sampler 和 batch 都是线程局部的，是否存在共享状态？如果有，是什么？它是线程安全的吗？为什么？
  - 4. 假设你只有一个 CPU，没有 GPU，这个测试退化成什么场景？结论是否仍然有效？
