learning_targets:
- 理解 gallocr 内存分配器的虚拟后端测试架构，包括 dummy_backend 与 dummy_backend_context 的设计意图、接口实现与内存统计机制
- 掌握 GGML 内存分配器的关键行为：缓冲区分裂、碎片整理、张量复用、视图零拷贝、多缓冲区类型分配与重新分配
- 理解线程池屏障同步的压力测试方法，包括动态线程数切换、多图交替计算的竞态与隔离性验证
- 掌握跨后端数值一致性验证的完整流程：随机权重 GGUF 构造、NMSE 误差度量、保存-加载往返测试与 MoE 架构分类
- 理解多模型 × 多上下文笛卡尔积并发测试的设计模式与原子标志位错误聚合机制
- 掌握模型加载取消与 KV 缓存碎片状态恢复的工程细节，以及日志库并发压力测试方法
- 能够独立编写针对内存分配器、并发场景和模型架构的白盒测试用例
life_analogy:
- 想象 llama.cpp 的测试体系是一个**综合质检实验室**：
- ''
- '**虚拟后端（dummy_backend）= 压力测试沙盘**'
- '- 就像工程师在风洞中测试飞机机翼而非直接装机试飞，dummy_backend 用纯内存模拟 GPU/CPU 硬件行为'
- '- 可精确配置最大缓冲区大小和对齐约束，如同调节风洞的气流参数，专测极端工况'
- ''
- '**gallocr 分配器 = 智能仓库管理员**'
- '- 张量 = 货物，缓冲区 = 货架，空闲块 = 空出的隔间'
- '- 管理员必须高效利用货架空间：满载时新建货架（缓冲区分裂）、相邻空格合并成更大空间（碎片整理）、优先重用腾出的空格（已分配复用）'
- '- 视图操作 = 给同一批货物贴不同标签，不需要新存储空间'
- '- get_view_source = 溯源系统，确保任何标签都能找回原始货物位置'
- ''
- '**屏障测试 = 交响乐团指挥考核**'
- '- 大量小算子 = 大量短音符，指挥必须在极短时间内精确同步所有乐手'
- '- 动态线程数切换 = 演出中途更换乐手数量，考验指挥的实时调度能力'
- '- 多图交替 = 同时指挥两首不同乐曲，防止乐谱（work_data）混淆'
- ''
- '**多线程推理 = 多车道高速收费站**'
- '- 每个上下文 = 一条独立车道，每个模型副本 = 一个收费站'
- '- 管理不善（缺乏线程安全）会导致车辆碰撞（数据竞争）或收费站崩溃（段错误）'
- ''
- '**模型加载取消 = 紧急制动**'
- '- 下载/加载大模型如同高速列车运行，用户点击「取消」时必须在 50% 进度时安全停车，不损轨道不浪费燃料（无内存泄漏）'
- ''
- '**KV 碎片恢复 = 碎片化的停车位**'
- '- 序列在 KV 缓存中交错停放，删除中间序列后形成不连续空位'
- '- 状态恢复必须能跨碎片重新组装完整序列，就像把一辆被拆分停放的卡车重新拼起来'
'no': 106
summary:
- concept: dummy_backend / dummy_backend_context
  desc: 虚拟后端沙盘，纯内存模拟硬件，可配置容量/对齐约束，专注测试分配策略逻辑
- concept: dummy_backend_buffer_type_*
  desc: 缓冲区类型接口家族：名称/对齐/大小/主机标识，定义虚拟后端的内存属性边界
- concept: dummy_backend_buffer_*
  desc: 缓冲区操作接口：分配/释放/基地址/初始化/读写清空，全空实现剥离硬件依赖
- concept: ggml_backend_buffer
  desc: GGML 缓冲区抽象，虚拟后端通过空接口实现记录分配行为，剥离真实硬件依赖
- concept: ggml_gallocr / gallocr
  desc: GGML 全局分配器，负责计算图内存的自动布局：缓冲区分裂、碎片整理、张量复用
- concept: make_context / make_input_1d / make_input_with_size
  desc: 测试夹具工厂：快速构建标准化 ggml 上下文与输入张量，确保测试一致性
- concept: assign_names / get_leaf_id / get_node_id
  desc: 图节点标识工具：统一命名与索引查找，支撑多缓冲区手动映射与调试
- concept: allocate_graph
  desc: gallocr 分配入口封装：设置输出、构建前向图、执行内存分配的一站式辅助
- concept: check_all_allocated / check_max_size
  desc: 分配完备性校验：确保所有张量已分配缓冲区且不超出后端容量限制
- concept: can_reuse_memory()
  desc: 引用生命周期分析：检查后续节点是否仍引用某张量，决定内存能否安全复用
- concept: memory_overlap() / check_no_overlap()
  desc: 内存安全警卫：严格校验张量区间是否交叠，仅允许声明 in-place 的算子复用
- concept: get_view_source()
  desc: 视图链溯源：沿 view_src 回溯到最终源张量，确保视图不占用新内存
- concept: 缓冲区分裂（test_max_size_too_many_tensors）
  desc: 当缓冲区容量耗尽时，gallocr 自动分配新缓冲区或更大缓冲区
- concept: 碎片整理（merge_free_block）
  desc: 相邻空闲块自动合并为更大可用块，减少碎片，提升大对象分配成功率
- concept: test_prefer_already_allocated_memory
  desc: 优先复用已释放内存块，减少真实分配开销，验证分配器的空间局部性优化
- concept: test_multiple_buffer_types
  desc: 多缓冲区类型手动映射测试，验证跨设备 leaf/node 分配策略的正确性
- concept: test_reallocation
  desc: gallocr 复用场景：不同图复用同一分配器时，自动检测块大小变化并重新分配
- concept: test_barrier（线程池压力测试）
  desc: 1000 层链式小算子图强制高频线程同步，暴露屏障开销的 ACM 复杂度
- concept: test_active（动态线程切换）
  desc: 每4轮在1线程和n线程间切换，验证 cplan 重建与数据竞争的线程安全性
- concept: test_multi_graph（多图交替）
  desc: 不同大小图交替计算，验证 work_data 缓冲区在图切换时的隔离正确性
- concept: set_tensor_data / get_tokens
  desc: 确定性测试数据生成器：基于名称哈希的随机权重与随机 token 序列，保证可复现性
- concept: get_gguf_ctx()
  desc: 架构-权重解耦的「空白模型」工厂，用随机权重+GGUF 元数据构造全部架构的可测试模型
- concept: get_model_and_ctx / get_logits
  desc: 模型-上下文创建与推理结果提取封装，屏蔽 llama_model 与 GGUF 的底层交互细节
- concept: NMSE（归一化均方误差）
  desc: 跨后端数值精度的度量衡：CPU vs GPU logits 对比，阈值 1e-4 判定一致性
- concept: moe_mandatory / moe_implemented
  desc: MoE 架构分类器：标记哪些架构必须启用专家路由、哪些可选，驱动测试矩阵生成
- concept: save_models / test_backends
  desc: 模型保存与后端验证双模式：支持批量生成 GGUF 或执行跨后端 NMSE 对比
- concept: 往返一致性（Roundtrip）
  desc: 模型保存→回载→推理，验证序列化/反序列化无损，确保保存操作不破坏权重精度
- concept: std::atomic<bool> failed（错误聚合）
  desc: 多线程测试的「安全网」：不立即 abort，让所有线程跑完收集完整错误信息
- concept: 进度回调取消（progress_callback）
  desc: 优雅的加载中断机制：返回 true 即触发取消，验证取消后无内存泄漏且返回 nullptr
- concept: KV 碎片状态恢复
  desc: llama_state_seq_set_data 支持非连续槽位写入，解决长期运行导致的缓存碎片化问题
- concept: 多模型×多上下文并发
  desc: 笛卡尔积压测：每个 GPU/CPU 设备各加载模型副本，每副本再派生多上下文并行推理，验证全矩阵稳定性
- concept: 自动释放（autorelease）
  desc: 在独立线程中执行完整 init/free 周期，验证全局状态在任意线程入口/出口处的清理正确性
- concept: 日志并发压力（test-log）
  desc: 8线程并发写入与配置热切换，验证日志库在高压环境下的线程安全性
