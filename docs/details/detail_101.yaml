  - 3. 当前策略在解析失败时是直接翻倍 chunk，这种「指数退避」有什么优缺点？
  - 4. 如果网络环境很差，多次下载失败，代码的容错机制是什么？
  - 5. 改进建议：如果要支持断点续传（resume），代码需要做哪些修改？
