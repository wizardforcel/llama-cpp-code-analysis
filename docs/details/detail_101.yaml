    `gguf_fetch_gguf_ctx()`。
  - 回答以下问题：
  - 1. 如何判断一个模型是分片的？关键字段是什么？
  - 2. 分片文件的命名约定是什么？如何构造第 N 个分片的文件名？
  - 3. `gguf_fetch_model_meta()` 和 `gguf_fetch_gguf_ctx()` 在处理分片时有什么不同？
  - 4. `split.tensors.count` 字段的作用是什么？代码如何验证张量数量是否完整？
  - 5. 为什么在 `gguf_fetch_gguf_ctx()` 的最后要将 `split.count` 设为 1？
  'no': 8
