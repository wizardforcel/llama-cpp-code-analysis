- contents:
  - 阅读 `tests/peg-parser/simple-tokenize.cpp` 的完整实现。
  - 完成以下分析：
  - 1. 当前的 `switch-case` 结构处理分隔符后，字符还会被 `current += input[i]` 添加，这是否正确？
  - 2. 如果输入字符串以分隔符结尾会发生什么？以分隔符开头呢？
  - 3. 当前实现区分大小写吗？如果需要不区分大小写，应该如何修改？
  - 4. 思考扩展：如果需要支持将分隔符本身作为 token 保留（如 `{`、`}`），应该如何重构代码？
