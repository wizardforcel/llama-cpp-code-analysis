exercises:
- contents:
  - 阅读 `tests/testing.h` 第100-128行，理解 `test()` 方法的完整实现。
  - 回答以下问题：
  - 1. `stack.push_back()` 和 `stack.pop_back()` 的作用是什么？
  - 2. 为什么要记录 `before_failures` 和 `before_assertions`？
  - 3. `run_with_exceptions()` 捕获了哪两类异常？它们有什么不同的处理方式？
  - 4. 如果将 `throw_exception` 设为 `true`，整个测试流程会发生什么变化？
  'no': 1
  title: 深入理解 testing 框架的执行流程
- contents:
  - 阅读 `tests/testing.h` 第130-164行的 `bench()` 方法实现。
  - 思考以下问题：
  - 1. 为什么使用 `std::chrono::high_resolution_clock` 而不是其他时钟？
  - 2. `duration` 为什么要累加而不是只记录最后一次？
  - 3. `rate` 变量是如何计算的？它的物理意义是什么？
  - 4. 如果 `iterations` 为 0，会发生什么？代码有没有防护？
  - 扩展任务：尝试修改 `bench()` 方法，使其输出每次迭代的耗时分布（如 min/max/p50/p99）。
  'no': 2
  title: 分析基准测试的计时机制
- contents:
  - 阅读 `tests/gguf-model-data.cpp` 第28-65行的 `gguf_buf_reader` 类实现。
  - 回答以下问题：
  - 1. `has_n_bytes()` 在每次读取前都被调用，这是为了避免什么问题？
  - 2. `read_val<T>()` 模板方法是如何实现类型安全的读取的？
  - 3. `read_str()` 为什么要先读取长度再读取内容？直接读取固定长度字符串会有什么问题？
  - 4. 如果 `skip()` 跳过的字节数超出缓冲区剩余量，会发生什么？
  - 5. 尝试写一个单元测试，验证 `gguf_buf_reader` 在边界情况下的行为是否正确。
  'no': 3
  title: 探索 gguf_buf_reader 的安全读取机制
- contents:
  - 阅读 `tests/gguf-model-data.h` 第1-26行的两个结构体定义。
  - 思考以下问题：
  - 1. `gguf_remote_tensor` 的 `ne[4]` 数组为什么初始化为 `{1, 1, 1, 1}`？这有什么特殊含义？
  - 2. `gguf_remote_model` 中的 `n_vocab` 为什么标注为「inferred from token_embd.weight ne[1]」？
  - 3. `n_split` 和 `n_split_tensors` 两个字段有什么区别？它们分别用于什么场景？
  - 4. 如果要添加一个新的元数据字段（如 `n_context`），应该在哪个结构体中添加？为什么？
  - 5. 这两个结构体的设计体现了什么样的数据封装思想？
  'no': 4
  title: 分析 gguf_remote_tensor 与 gguf_remote_model 的数据组织
- contents:
  - 阅读 `tests/gguf-model-data.cpp` 第218-348行的 `gguf_parse_meta()` 函数。
  - 回答以下问题：
  - 1. GGUF 文件头包含哪些字段？各占多少字节？
  - 2. `arch_prefix` 是如何构造的？它在后续解析中起什么作用？
  - 3. 为什么 `n_vocab` 是从 `token_embd.weight` 张量推断而不是从 KV 读取？
  - 4. 如果遇到未知的 KV 键，代码是如何处理的？为什么这样设计？
  - 5. 张量信息中为什么要检查 `n_dims > 4`？
  'no': 5
  title: 追踪 GGUF 元数据解析流程
- contents:
  - 假设你要为一个新功能 `my_feature()` 编写测试，该功能接收一个字符串并返回处理后的结果。
  - 完成以下任务（不需要编写完整代码，描述设计思路即可）：
  - 1. 如何使用 `testing` 类注册一个名为 `"my_feature basic"` 的测试用例？
  - 2. 如何在测试中使用 `assert_equal()` 验证函数输出与期望值一致？
  - 3. 如果要测试函数的性能，如何使用 `bench()` 方法进行基准测试？
  - 4. 如何通过命令行参数只运行名称包含 "my_feature" 的测试？（提示：考虑 `set_filter()`）
  - 5. 如果 `my_feature()` 可能抛出异常，框架会如何捕获并报告？
  'no': 6
  title: 设计一个基于 testing 框架的自定义测试
- contents:
