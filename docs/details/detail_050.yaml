exercises:
- contents:
  - 阅读 `common/reasoning-budget.cpp` 第 52-111 行（`common_reasoning_budget_accept` 函数），结合代码注释回答：
  - 1. 当状态处于 `REASONING_BUDGET_COUNTING` 且 `remaining` 减到 0 时，什么情况下会进入 `FORCING`，什么情况下会进入
    `WAITING_UTF8`？
  - 2. 为什么在进入 `FORCING` 状态时要调用 `ctx->end_matcher.reset()`？如果不重置会发生什么？
  - 3. 假设 `forced_tokens = {token_A, token_B}`，当前处于 `FORCING` 状态且 `force_pos=0`，当接受
    token_A 后，`force_pos` 和状态会如何变化？
  - 4. 在 `common_reasoning_budget_init` 的预填充版本中（194-219 行），如果 `prefill_tokens` 同时包含了
    `start_tokens` 和 `end_tokens`，初始状态应该是什么？这解决了什么实际场景问题？
  'no': 1
  title: 追踪 Reasoning Budget 状态机
- contents:
  - 阅读 `common/sampling.cpp` 第 189-374 行（`common_sampler_init` 函数），绘制采样链的组装流程图：
