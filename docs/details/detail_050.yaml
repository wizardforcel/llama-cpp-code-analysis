  title: 环形缓冲区边界条件测试
learning_targets:
- 掌握 `common_sampler` 的三元架构设计（Chain + Grammar + Budget），理解其如何统一封装采样器链、语法约束与推理预算
- 精通 `ring_buffer` 环形缓冲区的实现机制，理解其在 token 历史管理、内存恒定性与反向索引访问中的关键作用
- 深入 `common_sampler_init` 的装配逻辑，掌握如何按优先级动态组装 penalties、dry、temperature、top-k、top-p
  等 10+ 种采样器
- 理解 `common_reasoning_budget` 的五态状态机（IDLE/COUNTING/WAITING_UTF8/FORCING/DONE）及其对推理长度的硬性控制机制
- 掌握 `token_matcher` 的流式匹配算法，理解其单遍扫描、部分匹配回退与状态重置的实现细节
- 洞悉批量采样接口 `common_sampler_sample_and_accept_n` 如何支持 Speculative Decoding 的 draft
  token 交叉比对与自动截断
- 理解语法约束的惰性激活策略（`grammar_lazy`）及其与推理预算状态机的协同工作机制
- 学会运用 `common_perf_print` 分离采样耗时与模型计算耗时，进行推理性能瓶颈分析
- 掌握 `common_sampler_get_candidates` 获取当前概率分布快照的技巧及排序语义
life_analogy:
- 想象 llama.cpp 的采样系统是一场**高规格的「剧本杀」主持人（DM）工作台**：
- '- **`common_sampler`** = 主持人的总控台，集成了剧本规则手册（Grammar）、计时器（Reasoning Budget）、骰子塔（Chain）和玩家行动记录（History）'
- '- **`ring_buffer`** = **自动旋转的证据展示板**：固定 128 个卡槽，旧证据自动被新证据覆盖，支持倒序查看（`rat()`）以便快速检查最近的违规操作（重复惩罚）'
- '- **采样器链（Chain）** = **骰子塔的层层过滤机关**：先经过「重复惩罚筛子」剔除重复选项，再经过「温度调节器」控制随机性，接着是 Top-K/Top-P
  的「候选圈定器」，最后由「贪心/随机选择器」定夺'
- '- **`reasoning_budget`** = **严格的演讲计时器**：五盏状态灯（IDLE→COUNTING→WAITING_UTF8→FORCING→DONE）监控发言时长，时间到立即强制闭麦（强制输出结束标记），即使话说到一半（UTF-8
  字符不完整）也要等这句话说完再闭麦（WAITING_UTF8）'
- '- **`token_matcher`** = **关键词触发警报器**：像检票闸机一样逐个 token 扫描，一旦识别到预设的暗号序列（如 `</think>`），立即切换状态'
- '- **`grammar_lazy`** = **弹性监考模式**：推理阶段（思考中）允许自由发挥，只有正式答题（回复）时才启用严格监考'
- '- **`sample_and_accept_n`** = **速记员与预言家的对质**：预言家（Draft 模型）预先写出多个词，速记员（主模型）逐个核对，前面都猜对就直接采纳，猜错立即叫停并重新记录——这就是推测解码的赛马机制'
'no': 49
summary:
- concept: '`common_sampler`'
  desc: 采样系统总控台，封装 Chain（概率采样）+ Grammar（语法约束）+ Budget（推理预算）+ History（历史记录）
- concept: '`ring_buffer`'
  desc: 固定容量（默认128）的环形缓冲区，支持 O(1) 反向索引访问与自动覆盖最旧记录，内存占用恒定
- concept: '`common_sampler_init()`'
  desc: 组装流水线：按序创建 Grammar→Budget→Chain（penalties→dry→top_k→typical→top_p→min_p→xtc→temperature→dist）
- concept: '`common_reasoning_budget_state`'
  desc: 五态状态机（IDLE/COUNTING/WAITING_UTF8/FORCING/DONE），硬性限制推理阶段 token 数量
- concept: '`token_matcher`'
  desc: 轻量级流式序列匹配器，单遍扫描识别 start/end 标记，支持部分匹配失败回退（KMP 简化版）
- concept: '`grammar_should_apply()`'
  desc: 惰性语法激活策略：当 `grammar_lazy=true` 且 Budget 处于 IDLE/DONE 时才启用语法约束
- concept: '`common_sampler_sample()`'
  desc: 三段式采样流程：set_logits() → 应用 Budget/Grammar/Chain → 语法回退重采样（若接受失败）
- concept: '`common_sampler_sample_and_accept_n()`'
  desc: 推测解码专用批量接口，交叉比对 draft tokens 与采样结果，自动接受匹配前缀并在分歧处截断
- concept: '`common_reasoning_budget_accept()`'
  desc: 状态迁移引擎，处理预算递减、UTF-8 完整性检查、强制模式切换等核心逻辑
- concept: '`common_reasoning_budget_apply()`'
  desc: 强制模式下的 logits 掩码：将非 forced token 的 logit 置为 -INFINITY，确保必输出指定序列
- concept: '`common_perf_print()`'
  desc: 性能分析工具，分离采样耗时（sampling）与模型计算耗时（prompt eval/eval），支持内存分解打印
- concept: '`common_sampler_clone()`'
  desc: 深拷贝采样器完整状态（含历史、候选缓存、子采样器），支持并行分支推理与探索
- concept: '`common_sampler_prev_str()`'
  desc: 历史回看工具，将最近 n 个 token 还原为可读文本，用于调试与日志输出
- concept: '`common_sampler_type_to_chr/str()`'
  desc: 采样器类型的编解码器，支持人类可读标识与配置解析（如 'd'→dry, top_k→'k'）
- concept: '`common_sampler_get_candidates()`'
  desc: 获取当前候选 token 数组（llama_token_data_array），支持按概率原地排序（std::sort），用于查看采样前分布或调试
- concept: '`common_sampler_reset()`'
  desc: C 风格重置接口，封装 C++ 成员函数 reset()，清空 ring_buffer 历史并重置底层 chain 状态
