  name: 推理预算状态机 —— 控制推理长度的"计时器与熔断器"
  'no': 4
  points:
  - '**`token_matcher` 的流式序列匹配**'
  - '- 无需回溯的在线匹配算法，单遍扫描即可识别 start/end token 序列'
  - '- 部分匹配失败后自动回退到子串起始位置（KMP 简化版）'
  - '- `advance()` 返回 true 表示完整匹配，触发状态迁移'
  - '**`common_reasoning_budget_ctx` 的五态状态机**'
  - '- `IDLE`：等待推理起始标记（如 `<|im_start|>`）'
  - '- `COUNTING`：消耗预算，递减 `remaining` 计数器'
  - '- `WAITING_UTF8`：预算耗尽但 UTF-8 字符不完整，等待完整字符结束'
  - '- `FORCING`：强制输出结束标记序列，屏蔽其他所有候选'
  - '- `DONE`：推理完成，停止干预'
  - '**UTF-8 完整性保护机制**'
  - '- 通过 `common_token_to_piece()` 将 token 还原为文本片段'
  - '- `common_utf8_is_complete()` 检测是否为合法 UTF-8 字符边界'
  - '- 防止在半个汉字或 emoji 中间强制截断导致乱码'
  - '**预填充状态的初始化**'
  - '- 通过 `prefill_tokens` 识别已存在的推理开头，直接进入 COUNTING 状态'
  - '- 支持续写场景（如继续之前的推理）'
