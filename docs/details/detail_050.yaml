  - '- 同时更新 grammar（语法栈推进）、reasoning budget（token 计数）、token 历史缓冲区'
  - '- 确保多状态机之间的状态一致性'
  - '**批量采样与接受：`common_sampler_sample_and_accept_n`**'
  - '- 为推测解码（Speculative Decoding）设计的批量接口'
  - '- 将 draft tokens 与采样结果交叉比对，自动接受匹配前缀，分歧处截断'
