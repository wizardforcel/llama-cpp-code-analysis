  - '- read/write 都支持取消与 EOF 检测'
  - '- close_read 触发 broken pipe 通知，避免死锁'
  - '**请求与响应的转发细节**'
  - '- 保留原始 path/query，重写 Host 头'
  - '- 过滤 proxy、CORS 等特殊头，避免回环'
  - '- 通过独立线程异步发送并写回 pipe'
