  - '- is_child_server() 通过环境变量 LLAMA_SERVER_ROUTER_PORT 判断身份'
  - '- setup_child_server 在完成模型加载后向父进程回送 READY 消息'
  - '**状态同步机制**'
  - '- notify_router_sleeping_state() 向父进程报告睡眠/唤醒状态'
  - '- 通过标准输出（stdout）发送预定义命令字符串'
