- concept: '`setup_child_server()`'
  desc: 子进程初始化：发送READY信号，监控stdin退出命令
- concept: '`notify_router_sleeping_state()`'
  desc: 子进程通知父进程进入/退出睡眠状态
- concept: '`update_args()`'
  desc: 预设渲染：注入host/port/alias，生成最终启动参数
- concept: '`stopping_models`'
  desc: 停止信号集合，协调多线程安全退出
- concept: '`is_autoload()`'
  desc: 解析请求参数，判断是否自动加载未运行模型
- concept: '`CMD_*` 命令常量'
  desc: 父子进程间标准通信协议（READY/SLEEP/EXIT）
