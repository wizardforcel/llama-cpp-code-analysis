learning_targets:
- 理解 server_models 作为多模型「列车调度室」的核心职责与线程安全设计
- 掌握模型生命周期管理：加载（spawn）、监控（双保险线程）、卸载（优雅退出/强制杀死）
- 理解 LRU 淘汰策略与 models_max 并发上限的协同机制
- 掌握 HTTP 代理转发（server_http_proxy）与流式管道（pipe_t）的实现原理
- 熟悉跨平台兼容层：路径获取、环境变量、端口分配等系统调用的封装技巧
- 能阅读并修改模型路由 REST 端点（/models/load、/models/unload）
- 理解子进程与父进程间的命令通信协议（READY/SLEEP/EXIT）
- 掌握请求参数解析与模型自动加载（autoload）机制
- 掌握线程同步原语（mutex、condition_variable、atomic）在多进程管理中的应用
- 理解预设合并优先级与启动参数渲染机制
life_analogy:
- 想象 llama-server 的模型管理系统是一家**大型智能火车站的调度中心**：
- '- **server_models** = 列车调度总台（统一指挥所有车次的进出站）'
- '- **server_model_meta** = 每趟列车的「车牌档案」（记录着车型号、当前状态、停靠站台、最后发车时间）'
- '- **LRU 淘汰机制** = 站台容量管理（站台满了？让最久没发车的列车先回库休息）'
- '- **spawn 子进程** = 列车出站（调度台启动新车次，分配专属轨道 port，并派监控员跟车）'
- '- **双监控线程** = 随车安全员（一人看日志汇总车况，一人盯紧急制动信号，超时未归就强制拖回）'
- '- **pipe_t 管道** = 列车与调度中心的「专用对讲机」（流式传输实况，一喊停就断线）'
- '- **HTTP 代理转发** = 中转售票窗口（乘客在总服务台买票，后台自动转给具体车次窗口处理）'
- '- **状态机 UNLOADED/LOADING/LOADED/SLEEPING** = 列车状态（车库待命/正在出库/运行中/临时休眠）'
- '- **命令协议（READY/SLEEP/EXIT）** = 列车与调度台的「暗号」（标准应答信号，确保双方状态同步）'
- 就像调度中心需要精确控制每趟列车的进出时间、防止站台拥堵，server_models 通过互斥锁和条件变量确保多线程环境下模型加载、卸载、状态迁移互不干扰，实现高并发下的稳定调度。
'no': 81
