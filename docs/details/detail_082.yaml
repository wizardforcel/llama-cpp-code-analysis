exercises:
- contents:
  - 阅读 `tools/server/server-models.cpp` 第429-462行的 `unload_lru()` 函数与第463-597行的 `load()`
    函数。
  - 回答以下问题：
  - 1. `unload_lru()` 如何找到「最久未使用」的模型？为什么使用 `ggml_time_ms()` 而不是系统时间戳？
  - 2. `load()` 函数在调用 `unload_lru()` 后，为什么还要在持有锁的情况下重新检查 `count_active >= models_max`？这是为了防止什么并发问题？
  - 3. 如果两个线程同时调用 `load()` 加载不同模型，而系统已达到 `models_max`，会发生什么？描述时序。
  'no': 1
  title: LRU淘汰策略深度分析
- contents:
  - 阅读 `tools/server/server-models.cpp` 第463-597行的 `load()` 方法，重点关注启动的两个监控线程（log_thread
    和 stopping_thread）。
  - 回答以下问题：
  - 1. `log_thread` 如何识别子进程发送的 READY 和 SLEEP 信号？这些信号通过什么方式发送（stdout/stdin/共享内存）？
  - 2. `stopping_thread` 的退出条件有哪些？为什么需要 `cv_stop.wait_for` 循环检查而不是一次性等待？
  - 3. 子进程崩溃但父进程未收到信号时，`stopping_thread` 如何检测并处理？`subprocess_alive` 的作用是什么？
  'no': 2
  title: 子进程生命周期与双线程监控
