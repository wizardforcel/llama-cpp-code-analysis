  name: server_models 元数据与生命周期 —— 模型的「身份证」
  'no': 6
  points:
  - '**server_model_meta 结构详解**'
  - '- 存储 preset、别名、tags、port、状态、last_used、args、exit_code 等核心信息'
  - '- update_args 负责把预设渲染为最终启动参数，同时注入 host、port、alias'
  - '**状态机的三种状态**'
  - '- UNLOADED / LOADING / LOADED / SLEEPING，配合 is_running / is_ready 判断'
  - '- is_failed 判断是否为加载失败状态'
  - '**线程安全与并发**'
  - '- 大部分接口内部使用 std::lock_guard<std::mutex> 与 condition_variable 同步'
  - '- 通过 stopping_models 集合 + cv_stop 监控线程安全退出'
  - '**LRU 淘汰策略**'
  - '- 当活动实例数达到 models_max 时，淘汰 last_used 最小者并等待其退出'
  - '- 避免无限增长造成内存压力'
