summary:
- concept: ServerProcess
  desc: 服务器进程生命周期管理器，封装从启动命令构建、健康检查轮询到进程终止的完整流程
- concept: ServerPreset
  desc: 静态工厂方法集，提供tinyllama2、bert_bge_small等预配置模型测试环境
- concept: make_request / make_stream_request / make_any_request
  desc: HTTP客户端封装，支持同步JSON响应、SSE流式数据解析，以及自动聚合流式tool_calls的通用请求
- concept: conftest.py
  desc: pytest配置层，通过autouse fixture实现测试隔离与预设预加载
- concept: test_basic.py
  desc: 基础端点验证：/health健康检查、/props元数据、/models列表、/slots监控
- concept: test_chat_completion.py
  desc: Chat API全场景覆盖：流式增量、token计数、缓存命中、logprobs、上下文超限、response_format
- concept: test_completion.py
  desc: Legacy补全接口深度测试：种子确定性、并行槽位、提示词缓存、多格式输入、OpenAI SDK兼容
- concept: test_compat_anthropic.py
  desc: Anthropic Messages API兼容性：工具调用、视觉输入、思考块、流式事件序列、采样参数
- concept: test_compat_oai_responses.py
  desc: OpenAI Responses API验证：响应ID格式、流式事件顺序、输出文本一致性
- concept: test_tool_call.py
  desc: 工具调用闭环测试：强制工具选择、天气函数参数验证、计算结果整合、真实模型验证
- concept: test_speculative.py
  desc: 推测解码验证：草稿模型输出一致性、draft_min/max参数矩阵、上下文限制
- concept: test_lora.py
  desc: LoRA适配器动态控制：scale 0.0/1.0风格切换、多请求独立LoRA配置
- concept: test_ctx_shift.py
  desc: 上下文位移：长对话截断继续生成 vs 禁用时报错处理、短/长prompt差异
- concept: test_slot_save.py
  desc: KV缓存持久化：槽位状态保存/跨槽位恢复、缓存命中token数验证
- concept: test_kv_keep_only_active.py
  desc: 空闲槽位清理：新槽位启动时清理旧KV、cache-ram恢复机制、日志标记验证
- concept: test_vision_api.py
  desc: 多模态视觉验证：图像URL/base64输入、多模态嵌入确定性、能力标记
- concept: test_embedding.py
  desc: 嵌入服务测试：向量归一化、base64编码解码、多输入批量处理、池化策略、错误处理
- concept: test_rerank.py
  desc: Rerank排序验证：相关性得分排序、token计数、top_n参数、无效输入处理
- concept: test_tokenize.py
  desc: 分词测试：文本↔token往返、BOS特殊token、片段信息
- concept: test_template.py
  desc: 聊天模板测试：推理模式、日期注入、生成提示符控制
- concept: test_infill.py
  desc: 代码填充测试：FIM模式、额外输入验证、错误处理、多模型兼容
- concept: test_router.py
  desc: 模型路由治理：LRU淘汰策略、手动加载/卸载、API密钥认证（内聚于__main__测试块）
- concept: test_proxy.py
  desc: CORS代理：外部请求转发、内部API代理、启用/禁用切换
- concept: test_security.py
  desc: 服务安全：静态资源公开访问、错误/正确API密钥处理、CORS配置、Anthropic Header认证
- concept: test_sleep.py
  desc: 服务器睡眠唤醒：空闲超时检测、is_sleeping状态验证
- concept: LogReader
  desc: 测试辅助类，用于增量读取日志文件内容，验证服务器内部状态标记
- concept: is_slow_test_allowed
  desc: 环境变量检查函数，控制慢速测试的执行
- concept: ServerError
  desc: 自定义异常类，封装服务器返回的非200状态码错误，包含code和body属性
