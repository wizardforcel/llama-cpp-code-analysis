exercises:
- contents:
  - 阅读 `tools/server/tests/utils.py` 第 117-224 行的 `ServerProcess.start()` 方法
  - 深入理解以下实现细节：
  - 1. 命令行参数是如何根据 `server_args` 列表动态构建的？如何支持数十个可选参数（如 `--n-gpu-layers`, `--ctx-size`,
    `--api-key` 等）？
  - 2. 健康检查循环的实现逻辑：为什么使用 `while time.time() - start_time < timeout_seconds` 而不是简单的
    sleep？
  - 3. `server_instances.add(self)` 和 `server_instances.remove(self)` 在测试隔离中扮演什么角色？
  - 4. 如果服务器进程在超时前崩溃，代码如何检测并抛出 `RuntimeError`？
  - 回答问题：
  - '- 如果需要支持通过 Unix Socket 而非 TCP 端口连接服务器，需要修改 `start()` 方法中的哪些部分？'
  - '- `LLAMA_SERVER_BIN_PATH` 环境变量在什么场景下会被使用？'
  'no': 1
  title: 分析 ServerProcess 的启动与就绪检测机制
- contents:
  - 阅读 `tools/server/tests/unit/test_chat_completion.py` 第 42-59 行的 `test_chat_completion_cached_tokens()`
  - 以及 `tools/server/tests/unit/test_slot_save.py` 第 15-64 行的 `test_slot_save_restore()`
  - 完成以下任务：
  - 1. 分析 `prompt_tokens_details.cached_tokens` 字段的断言逻辑，理解 n_cache 数值（0, 76, 51, 47）是如何精确预测的
  - 2. 设计一个新的测试用例 `test_kv_cache_partial_hit_alignment`：构造两个 prompt，确保它们的相同前缀长度不是
    4 的倍数（例如 15 个 token），验证缓存对齐策略
  - 3. 扩展 `test_slot_save_restore`：在恢复槽位后，尝试发送一个与原 prompt 有 50% 重叠的新 prompt，断言 `prompt_n`
    是否符合预期
  - 思考问题：
  - '- 为什么在 `test_slot_save_restore` 中，第一次请求处理 21 个 token，而恢复后只需处理 6 个？'
  - '- `cache_prompt: True` 参数在服务端内部触发了什么机制？'
