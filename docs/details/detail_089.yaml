  name: 测试基座：ServerProcess 与 ServerPreset —— 服务器测试的『产房与托儿所』
  'no': 1
  points:
  - '**为什么需要 ServerProcess 类？**'
  - '- 每个测试都需要一个真实的 llama-server 进程实例，管理其生命周期（启动、就绪检测、终止）'
  - '- 封装了从环境变量读取配置（GPU 层数、端口、调试模式）的通用逻辑'
  - '- 提供 `make_request` / `make_stream_request` / `make_any_request` 等 HTTP 客户端封装，让测试专注于断言而非网络细节'
  - ''
  - '**ServerPreset 工厂模式的精妙之处**'
  - '- 通过 `@staticmethod` 定义 tinyllama2、bert_bge_small、stories15m_moe 等预设配置'
  - '- 每个预设配置了特定的模型仓库、上下文大小、槽位数等参数，实现『一键换模型』'
  - '- `load_all()` 方法会预启动所有预设服务器，提前下载模型到缓存，避免测试时网络等待'
  - ''
  - '**测试隔离的自动机制**'
  - '- `conftest.py` 中的 `stop_server_after_each_test` fixture 确保每个测试后自动清理服务器进程'
  - '- `do_something` fixture 在测试会话开始时预加载所有预设，确保模型文件已缓存'
  - ''
  - '**高级测试控制机制**'
  - '- `is_slow_test_allowed()` 函数通过环境变量控制慢速测试的执行，避免CI/CD超时'
  - '- `ServerError` 异常类封装服务器错误，提供结构化的错误信息处理（`__init__` 方法存储 code 和 body）'
  - '- `match_regex()` 工具函数支持灵活的正则表达式断言'
