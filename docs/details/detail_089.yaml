  'no': 4
  points:
  - '**基础与流式补全**'
  - '- `test_completion` 验证 `/completion` 端点的基本功能（timings、truncated、tokens 返回）'
  - '- `test_completion_stream` 检查 SSE 流式传输的 stop 标志、stop_type、generation_settings'
  - '- `test_completion_stream_vs_non_stream` 确保流式与非流式结果内容一致'
  - ''
  - '**确定性与随机性控制**'
  - '- `test_consistent_result_same_seed` 验证相同 seed 产生相同输出（可复现性）'
  - '- `test_different_result_different_seed` 验证不同 seed 产生不同输出'
  - '- `test_consistent_result_different_batch_size` 确保批处理大小不影响生成结果'
  - '- `test_cache_vs_nocache_prompt` 对比启用与禁用缓存的结果（标记为跳过）'
  - '- `test_nocache_long_input_prompt` 验证无缓存时超长输入的 400 错误'
  - ''
  - '**并行与缓存策略**'
  - '- `test_completion_parallel_slots` 测试多槽位并发处理，使用 `parallel_function_calls` 模拟并发请求'
  - '- `test_completion_unified` 验证统一 KV 缓存模式下的槽位共享'
  - '- `test_completion_prompt_cache` 测试主机内存缓存的命中与未命中统计'
  - ''
  - '**OpenAI SDK 兼容**'
  - '- `test_completion_with_openai_library` 与 `test_completion_stream_with_openai_library`
    验证 SDK 兼容性'
  - '- `test_completion_stream_with_openai_library_stops` 验证停止词处理（慢速测试）'
  - ''
  - '**输入格式灵活性**'
  - '- `test_completion_with_tokens_input` 支持 token 数组、字符串、混合类型的 prompt 输入'
  - '- `test_json_prompt_no_mtmd` / `test_json_prompt_mtm_error_when_not_supported`
    验证多模态 JSON prompt 的边界'
  - ''
  - '**高级功能测试**'
  - '- `test_n_probs` / `test_n_probs_stream` / `test_n_probs_post_sampling` 验证 token
    概率输出功能'
  - '- `test_completion_response_fields` 验证响应字段过滤功能'
  - '- `test_cancel_request` 验证请求取消机制与槽位释放'
  - '- `test_logit_bias` 验证 logit_bias 参数（token ID vs 字符串形式）'
