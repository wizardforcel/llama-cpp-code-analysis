  name: 张量分类与可量化判定 —— 量化策略的"分流闸门"
  'no': 1
  points:
  - '**为什么需要张量分类？**不同的张量（注意力 V、FFN、输出）对量化精度敏感度差异巨大，需要差异化处理'
  - tensor_category 枚举定义了 11 类张量：TOKEN_EMBD、ATTENTION_Q/V/K、ATTENTION_QKV、ATTENTION_KV_B、ATTENTION_OUTPUT、FFN_UP/GATE/DOWN、OUTPUT、OTHER
  - tensor_name_match_token_embd 通过 strcmp 精确匹配识别 token_embd.weight / per_layer_token_embd.weight
  - tensor_name_match_output_weight 通过 strcmp 精确匹配识别 output.weight
  - tensor_get_category 通过字符串匹配识别张量类别（attn_v.weight、ffn_down 等），为后续策略分发提供基础
  - category_is_attn_v 标识对量化更敏感的 V 类张量（V、QKV、KV_B），这些张量通常需要保留更多比特
  - '**tensor_allows_quantization 决策树**：先做维度检查（≥2D）、quick name check（以 weight 结尾）、排除归一化/位置嵌入/小型卷积/RWKV
    时序混合等敏感张量'
  - '**特殊保留列表**：norm.weight、ssm_conv1d、time_mix_*、attn_rel_b（T5）、SAM 多模态张量、altup/laurel（Gemma3n）等'
  - '**反量化预处理入口**：llama_tensor_dequantize_impl 支持 F16/BF16/各类量化格式到 F32 的多线程反量化'
  - '**FTYPE 与默认类型映射**：llama_ftype_get_default_type 把 LLAMA_FTYPE_MOSTLY_* 系列映射到对应的
    ggml_type 默认值（Q2_K 到 Q6_K、IQ 系列、TQ 系列、MXFP4 等）'
