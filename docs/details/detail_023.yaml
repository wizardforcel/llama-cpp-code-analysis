learning_targets:
- 理解 llama.cpp 量化系统中张量分类（tensor_category）的设计与识别原理
- 掌握 llama_tensor_get_type 如何综合张量类别、层位置、模型架构选择量化类型
- 了解 tensor_allows_quantization 的可量化判定逻辑与特殊保留列表
- 熟悉重要性矩阵（imatrix）在低比特量化中的作用与判定规则
- 掌握 llama_model_quantize_impl 的主流程：加载、分类、量化、写出 GGUF
- 理解 in-place / view 等内存优化技术在量化场景下的应用
- 能够阅读并修改自定义量化策略与张量类型覆盖逻辑
- 了解外部工具接口（llama-ext.h）如何暴露量化能力供第三方使用
- 掌握 quantize_state_impl 的状态管理（计数器、正则模式编译、共享嵌入检测）
- 理解 GGUF 文件占位-回填机制与最终元数据写入的协同
life_analogy:
- 想象 llama.cpp 的量化系统是一家**模型改造工厂的「瘦身车间」**
- '- **张量分类（tensor_category）** = 入厂前按品类分拣（Q类零件、V类零件、FFN类零件、装饰件）'
- '- **tensor_name_match_token_embd / tensor_name_match_output_weight** = 车间门口的「身份证核验机」，精确识别嵌入与输出两类特殊零件'
- '- **tensor_allows_quantization** = 安检门：太小的零件、特殊材质、稀有型号一律不改造'
- '- **llama_tensor_get_type** = 工艺工程师：根据零件类型、所在楼层、客户订单（ftype）决定用什么工艺'
- '- **attention V 升级到 Q5_K** = 关键轴承精度不能省，宁可多花点材料也要保住精度'
- '- **MXFP4_MOE 分流** = MoE 专家是「大件」，用专用工艺；其他零件走标准线'
- '- **imatrix** = 「零件重要性地图」，告诉工厂哪些角落误差容忍度更低'
- '- **tensor_type_fallback** = 紧急预案：原工艺不匹配时切换到备用方案（Q2_K → Q4_0）'
- '- **layer_info / use_more_bits** = 楼层优先级：底层、顶层、每 3 层的关键层要重点打磨'
- '- **prune_layers + remap_layer** = 「楼层拆除施工」，先标记要拆的，再给剩余楼层重新编号'
- '- **占位 + 回填** = 先搭脚手架（meta_size 零字节），施工完成后再补上竣工图纸'
- '- **quantize_state_impl 构造函数** = 车间开工准备会：一次性把客户定制规则（正则覆盖）编好，避免每次返工'
- '- **外部接口（llama_ext）** = 工厂的「对外接待窗口」：第三方无需进厂（加载真实权重）就能委托加工'
- 就像优秀的工厂经理需要在精度、体积、速度之间精妙平衡，llama.cpp 的量化系统也需要为每张张量找到最合适的精度档位。
'no': 22
