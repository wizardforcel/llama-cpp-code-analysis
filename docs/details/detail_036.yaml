summary:
- concept: ggml_get_type_traits_cpu
  desc: CPU量化操作的中央路由表，通过类型查询对应的向量化和量化函数
- concept: ggml_barrier
  desc: 基于原子操作的跨线程同步屏障，确保计算图阶段有序执行
- concept: NUMA策略
  desc: DISTRIBUTE/ISOLATE/NUMACTL三种模式，优化多路CPU内存访问
- concept: ggml_compute_forward_mul_mat
  desc: CPU矩阵乘法核心，处理分块、多线程和类型转换
- concept: vec_unary_op/vec_binary_op
  desc: 模板化元素级运算框架，统一处理F32/F16/BF16与类型转换
- concept: Flash Attention CPU
  desc: 带在线softmax、mask、sinks和分块tiling的高效注意力实现
- concept: ggml_vec_dot_*_generic
  desc: 量化格式的参考标量实现，确保正确性优先
- concept: Repack/Interleaving
  desc: 将量化块从线程布局转为4x4/8x8 SIMD交错布局，提升向量化效率
- concept: AMX TMUL
  desc: Intel Advanced Matrix Extensions，使用专用tile寄存器进行16x16矩阵乘
- concept: VNNI (_mm512_dpbusd_epi32)
  desc: AVX512向量神经网络指令，实现INT8量化值的快速点积累加
- concept: KleidiAI Kernel Selection
  desc: 根据ARM CPU特性（SME/SVE/DOTPROD）从内核表中选择最优矩阵乘实现
- concept: Spacemit IME
  desc: 基于RISC-V向量扩展的INT4/INT8混合精度GEMM内核
- concept: tinyBLAS (llamafile)
  desc: 跨平台小矩阵乘法库，通过模板特化支持多种架构和数据类型
- concept: Architecture Scoring
  desc: 通过CPUID（x86）、HWCAP（ARM）或hwprobe（RISC-V）检测硬件能力并评分
- concept: tensor_traits
  desc: 张量特质抽象基类，将自定义计算（compute_forward）与工作区计算（work_size）注入调度器
- concept: extra_buffer_type
  desc: 扩展缓冲区类型机制，允许AMX/Repack等注册特殊的内存布局和处理逻辑
- concept: Feature Detection Macros
  desc: GGML_USE_AVX512等编译时宏与运行时探测结合，实现最优代码路径选择
- concept: block_q4_0x4 / block_q8_0x4
  desc: 4行交错的量化块结构，将多个量化块打包以利于SIMD并行加载
- concept: quantize_row_q8_0/1/K
  desc: 将FP32行数据量化为Q8_0/Q8_1/Q8_K格式，支持多架构SIMD优化
- concept: 在线量化(quantize_mat)
  desc: 运行时即时量化激活值，减少内存占用而不牺牲计算精度
- concept: GEMV/GEMM模板系统
  desc: 通过模板参数RM/RN/BM控制微内核尺寸，适配不同硬件寄存器配置
- concept: PowerPC MMA
  desc: PowerPC矩阵乘法加速指令，通过向量寄存器实现高性能矩阵运算
- concept: RISC-V LMUL
  desc: RISC-V向量扩展的长度乘数控制，实现灵活的向量分组操作
- concept: ggml_cpu_init
  desc: CPU后端全局初始化，构建GELU查找表并探测架构特性
- concept: type_conversion_table
  desc: 模板化类型转换系统，为F16/BF16/F32提供统一的转换接口
