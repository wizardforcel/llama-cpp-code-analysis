learning_targets:
- 理解GGML CPU后端的类型特征表（type traits）作为量化计算入口路由的设计
- 掌握线程池、屏障同步和NUMA感知调度的实现机制
- 理解模板化元素级算子（unary/binary ops）的类型分发与连续/非连续路径优化
- 掌握量化点积（vec_dot）的解码-乘加-缩放四阶段流水线
- 理解Repack机制如何将量化权重重排为SIMD友好的交错布局（interleaving）
- 了解Intel AMX的tile矩阵乘法原理与VNNI指令集在量化矩阵乘中的应用
- 掌握KleidiAI与Spacemit等架构专属后端的内核选择策略（SME/DOTPROD/IME）
- 理解llamafile tinyBLAS的跨平台GEMM设计与微内核分块策略
- 掌握架构特性探测（cpuid/hwcap）与后端评分（score）的动态调度机制
- 能够阅读并修改自定义CPU算子，理解从通用实现到SIMD优化的演进路径
- 掌握CPU后端扩展缓冲区类型（extra buffer types）的注册与调度机制
- 理解src1激活值的在线量化（quantize_mat）与from_float转换流程
life_analogy:
- 想象GGML CPU后端是一个**跨国智能制造工厂**，它要在不同国家（x86/ARM/RISC-V）生产同样的产品（张量计算），但每个国家的工厂设备（SIMD指令集）不同。
- '- **类型特征表** = 产品身份证系统：每个张量类型（Q4_0/Q8_0）都有专属的加工手册（函数指针表）'
- '- **线程池与屏障** = 工厂的流水线调度室：多个工人（线程）同时加工不同部件，屏障确保所有工人完成当前工序再进入下一道'
- '- **NUMA** = 多厂房布局：根据原料仓库的位置调派最近的工人，减少搬运时间'
- '- **通用算子（ops）** = 标准加工车间：切割（reshape）、混合（add/mul）、质检（norm）'
- '- **RoPE/Softmax/FlashAttention** = 精密仪器车间：需要特殊的公式（算法）和预处理（mask/scale）'
- '- **量化点积（quants.c）** = 压缩包装车间：把笨重的原料（FP32）压缩成紧凑包装（INT4/INT8），运输（内存带宽）更快'
- '- **Repack机制** = 预分拣系统：把不同规格的箱子（Q4_0块）重新排列成4x4/8x8托盘，方便叉车（SIMD）一次搬运'
- '- **AMX** = 特种高精度机床：Intel独有的矩阵加工中心，一次能处理16x16的大块原料'
- '- **KleidiAI** = ARM原装进口设备：针对最新ARM机床（SME/SVE）的专用刀具（内核）'
- '- **Spacemit IME** = RISC-V定制流水线：针对国产芯片的特殊工艺优化'
- '- **llamafile SGEMM** = 通用质量基准线：无论哪个国家的工厂，都能达到的基础生产速度'
- '- **架构特性评分** = 设备性能评级系统：开机时检测机床型号（CPUID/HWCAP），自动选择最优生产线配置'
- '- **Extra Buffer Types** = 工厂的特殊材料通道：普通物料（标准CPU缓冲区）和精密物料（AMX/Repack/KleidiAI缓冲区）走不同的物流通道'
- '- **在线量化（quantize_mat）** = 生产过程中的即时打包：在计算前将原料临时压缩，用完即弃，节省存储空间'
