  - '**`llama_batch_get_one()` 用最小代码构造单序列批**'
  - '- 把 token 指针和数量包成 `llama_batch` 结构，其余字段全置 nullptr'
  - '- `n_seq_id/seq_id/pos/logits` 都为 nullptr，触发分配器的自动补全逻辑'
  - '- 适合「我就一个 prompt，往里塞就行」的简单场景'
  - '- **`llama_batch_init()` 是 C API 风格的批分配器**'
  - '- 根据 `embd != 0` 选择 token 或 embedding 分配方式'
  - '- 为 `pos/n_seq_id/logits` 各分配 `n_tokens_alloc` 长度'
  - '- 为 `seq_id` 分配「指针数组 + 每行 n_seq_max 个元素」'
  - '- 末尾 `seq_id[n_tokens_alloc] = nullptr` 作为释放时的终止哨兵'
  - '- **`llama_batch_free()` 对称释放所有 malloc 出来的内存**'
  - '- 通过 `seq_id[i] != nullptr` 哨兵正确释放二维结构'
  - '- 释放顺序与 `init` 分配顺序对应，确保无内存泄漏'
