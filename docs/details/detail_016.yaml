  points:
  - '**`llama_ubatch` 是计算图真正消费的「最小推理单元」**'
  - '- 与 `llama_batch`（用户输入的原始批数据）不同，`llama_ubatch` 是经过校验、补全与切分后的内部表示'
  - '- 持有 token、位置、序列 ID、输出标志等核心字段，每个字段都有内存语义说明（size / idx / val）'
  - '- 通过 `std::shared_ptr<data_t> data` 管理自有数据，外部数据则不持有所有权，实现零拷贝共享'
  - '- `b_equal_seqs` 标记所有序列集是否等长，是 MHA 等路径的重要分支依据'
  - '- `is_pos_2d()` 通过 `n_pos >= 3` 判断是否为 M-RoPE（如视觉位置 = y/x/other）场景'
  - '- `equal_seqs()` 返回 `b_equal_seqs != 0`，供调用方查询等长标志'
  - '- 内部 `data_t` 结构聚合所有 std::vector，`seq_id_data` 是连续的扁平存储区，`seq_id[i]` 通过指针算术指向其中片段'
  - '- **文件级类型别名共同构成批处理的数据基石**'
  - '- `using pos_set_t = std::set<llama_pos>`：每条序列出现过的位置集合（保证有序且唯一）'
  - '- `using seq_cpl_t = std::vector<bool>`：耦合序列矩阵的每一行（动态长度适配 LLAMA_MAX_SEQ）'
  - '- `using idx_vec_t = std::vector<int32_t>`：序列集对应的 token 索引列表（拆分阶段的核心数据结构）'
  - '- `using seq_set_t = std::bitset<LLAMA_MAX_SEQ>`：用位图表示 token 的序列归属集合（O(1) 重叠检测）'
