learning_targets:
- 理解 llama_ubatch 与 llama_batch 的语义区别，掌握微批次作为「最小推理单元」的数据布局
- 掌握 llama_batch_allocr 的 init 流程：输入校验、自动补全、统计分析与一致性检查
- 理解位置连续性、M-RoPE 特殊处理、耦合序列等约束条件的工程含义
- 掌握三种拆分策略（split_simple、split_equal、split_seq）的设计差异与适用场景
- 理解 ubatch_add 的内存编排机制：shared_ptr data_t 与扁平 seq_id_data 的指针算术
- 能阅读 LLAMA_BATCH_DEBUG 调试输出，定位批处理相关问题
life_analogy:
- 想象 llama.cpp 的批处理系统是一座**物流公司的调度中心**：
- '- **llama_batch** = 客户提交的「原始发货清单」（可能缺字段、可能填错位置）'
- '- **llama_batch_allocr** = 调度中心的「总调度员」（init 负责清点校验，split 负责分批装车）'
- '- **llama_ubatch** = 实际开上高速的「一辆装好货的卡车」（结构紧凑、字段齐全、附带 shared_ptr 货车所有权）'
- '- **类型别名（pos_set_t/seq_set_t/...）** = 调度中心的「标准容器规格」（统一用同一规格的箱子，避免尺寸混乱）'
- '- **私有状态字段（used/out_ids/n_used）** = 调度中心的「工作台账本」（记录哪些货已发、哪些待发、发给谁）'
- '- **init() 校验阶段** = 调度员对照发货单检查「地址是否合法」「重量是否超标」'
- '- **init() 补全阶段** = 调度员自动填上「默认收货地址」「默认发货时间」'
- '- **init() 统计阶段** = 调度员建立「哪些客户拼车」「哪些路线重合」的运筹表'
- '- **三种拆分策略** = 三种「拼车规则」：'
- '  - **split_simple** = 「来一辆空车塞到满就走」（最简单，不考虑拼车）'
- '  - **split_equal** = 「找几个终点相同方向的客户拼满一辆方阵车」（prompt processing 阶段最高效）'
- '  - **split_seq** = 「同一目的地的货物一节节车皮地发」（decode 阶段逐序列推进）'
- '- **ubatch_add() 内存编排** = 调度员把发货单抄写到「装车清单」（udata），用指针算术把多页发货单钉在一起'
- '- **shared_ptr<data_t>** = 「货车的所有权凭证」，确保卡车在运输途中不会被销毁'
- '- **seq_set 位图** = 「客户编号的位掩码」，让 O(1) 判断哪些客户可以拼车'
- 就像调度中心需要权衡「拼车效率」与「送达时效」，llama_batch_allocr 也在「KV 缓存复用」与「计算图效率」之间精妙平衡。
'no': 15
summary:
- concept: llama_ubatch
  desc: 推理图真正消费的「最小推理单元」，含 token/embd/pos/seq_id 等扁平字段
- concept: llama_batch_allocr
  desc: 批处理调度中枢，负责校验、补全、统计、拆分全流程
- concept: pos_set_t
  desc: std::set<llama_pos> 类型别名，存储每条序列出现过的位置集合
- concept: seq_cpl_t
  desc: std::vector<bool> 类型别名，存储耦合序列矩阵的每一行
- concept: idx_vec_t
  desc: std::vector<int32_t> 类型别名，存储序列集对应的 token 索引列表
- concept: seq_set_t
  desc: std::bitset<LLAMA_MAX_SEQ> 类型别名，用位图表示 token 的序列归属集合
- concept: seq_id_0
  desc: std::array<llama_seq_id,1>{{0}}，默认单序列 {0}，自动补全时使用
- concept: init()
  desc: 四阶段流水线：硬校验 → 自动补全 → 统计耦合 → 一致性检查
- concept: 自动补全
  desc: n_seq_id/seq_id/pos/logits 为空时按默认值或 KV 缓存续推位置
- concept: seq_cpl / has_cpl
  desc: 耦合序列矩阵，标记哪些序列在同一 token 上共享 KV 区间
- concept: seq_set / seq_set_map
  desc: 每个 token 的序列集位图 + 反向索引，支撑 O(1) 重叠检测
- concept: 位置连续性
  desc: 普通模型要求 Y=X+1；M-RoPE 模型允许位置向前跳跃（X<Y）或 embedding 重叠（X<=Y）
- concept: 耦合序列校验
  desc: coupled 序列在 KV 缓存中的 pos_min/pos_max 必须完全一致
- concept: 子集一致性
  desc: 禁止序列在不同 token 上归属于不兼容的序列集（cur_seq_set 交集空则拒）
- concept: 位置回退检查
  desc: 禁止同一序列的 pos[i] 小于此前见过的最大位置（cur_seq_pos）
- concept: split_simple
  desc: 贪心分单，凑够 n_ubatch 个 token 就停，不保证序列集整齐
- concept: split_equal
  desc: 方阵拆分：先挑无重叠序列集，再并行推进游标，equal_seqs=true 适合 MHA
- concept: split_seq
  desc: 单序列集拆分：每次只产出一个序列集，n_seqs=1，适合 decode 阶段逐序列处理
- concept: split_reset()
  desc: 清空 out_ids、n_used、used[]，为新一轮拆分重置状态
- concept: ubatch_reserve
  desc: 创建带 data 的空 ubatch，预分配字段 vector，常用于 decode 阶段预留空间
- concept: ubatch_add
  desc: 把 idxs 列表组装成完整 ubatch，token/embd 拷贝、seq_id_data 扁平化、out_ids 收集
- concept: shared_ptr<data_t>
  desc: ubatch 持有数据所有权，外部数据则不持有，零拷贝共享外部指针
- concept: used[] / n_used / out_ids
  desc: 拆分阶段的工作台账本：used 标记已用 token、n_used 计数、out_ids 记录需输出位置
- concept: M-RoPE 位置广播
  desc: 文本 token 把同一位置复制到所有 RoPE 段；embedding 则按段拷贝
- concept: LLAMA_BATCH_DEBUG
  desc: 环境变量控制调试日志（0/1/2 三档），无需重新编译
- concept: llama_batch_get_one
  desc: 单序列快捷构造，把 token 指针包成 batch，其余字段 nullptr
- concept: llama_batch_init
  desc: C 风格分配器，按 n_tokens_alloc+n_seq_max 二维分配 seq_id 数组
- concept: llama_batch_free
  desc: 通过 seq_id[i] != nullptr 哨兵正确释放二维结构，顺序与 init 对称
