  name: Llama 主体架构 —— 模板类统一处理嵌入与语言模型两种模式
  'no': 1
  points:
  - '**模板参数 `embed` 的双模式设计**：通过 `template <bool embed>` 让同一个 `llm_build_llama` 类同时支持纯语言模型（`embed=false`）与嵌入模式（`embed=true`），代码末尾
    `template struct llm_build_llama<false>;` 与 `template struct llm_build_llama<true>;`
    完成显式实例化'
  - '**注意力输入的差异化选择**：根据 `embed` 决定是用 `llm_graph_input_attn_no_cache`（无 KV 缓存，适合编码任务）还是
    `llm_graph_input_attn_kv`（标准自回归 KV 缓存），编译期通过 `if constexpr (embed)` 完成分支'
  - '**Q/K/V 投影三件套**：依次用 `build_lora_mm` 加载 `wq/wk/wv` 权重并支持可选的 `bq/bk/bk` 偏置，然后 `ggml_reshape_3d`
    切成 `[n_embd_head, n_head, n_tokens]` 形状'
  - '**RoPE 旋转位置编码**：`ggml_rope_ext` 同时对 Q 和 K 应用旋转，`rope_factors` 来自 `model.get_rope_factors()`，LLaMA3
    等长上下文模型会返回非空的 rope_scaling 因子'
  - '**Llama4 风格的 Q/K L2 归一化**：当 `hparams.use_kq_norm` 时使用 `ggml_rms_norm` 对 RoPE
    之后的 Q/K 重新归一化，这是从 Llama4 借鉴的稳定性技巧'
  - '**FFN 的双分支路由**：通过 `ffn_gate_inp == nullptr` 判定该层是稠密 FFN 还是 MoE；稠密走 `build_ffn`（SILU
    + PAR 布局），MoE 走 `build_moe_ffn`'
  - '**MoE 专家权重缩放**：注意 `hparams.expert_weights_scale` 与 `LLAMA_EXPERT_GATING_FUNC_TYPE_SOFTMAX`
    两个参数共同控制 MoE 行为'
  - '**输出层与 lm_head**：标准 RMSNorm + `build_lora_mm` 投影到词表；只有 `!embed` 模式下才计算 logits（嵌入模式只输出隐藏层表示）'
  - '**`inp_out_ids` 的最后层剪枝**：当批次中只有最后几个 token 需要输出时，用 `ggml_get_rows` 一次性挑出这些位置以节省后续计算'
