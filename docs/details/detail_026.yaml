learning_targets:
- 理解 GGML 计算图构建中各算子的组织方式，掌握 llm_graph_context 子类如何将模型架构转换为 GGML 图节点
- 掌握模板参数 `embed` 和 `iswa` 的编译期多态技巧，理解 `if constexpr` 如何生成两条独立实例化
- 深入理解 QKV 视图（view_3d）拆分、RoPE 旋转位置编码的应用时序，以及 `use_kq_norm` 与 `rope_factors` 的协同
- 掌握 MoE 路由专家与共享专家的混合策略，理解 `ffn_gate_inp == nullptr` 作为稠密/MoE 判定的工程意义
- 理解 NoPE 步进、滑动窗口注意力（ISWA/SWA）、M-RoPE、Q/K 归一化前置等架构差异如何体现在构图选择上
- 了解 `inp_out_ids`、`rope_factors`、`build_cvec`、`build_lora_mm` 等高层 API 在不同模型变体间的复用模式
life_analogy:
- 想象 GGML 的模型构建世界是一家「中央厨房」，每个模型文件都是一份菜谱：
- '- **llm_build_*** 厨师团队 = 每个家族模型（如 llama、qwen、mistral）的专属厨师长，负责按菜谱组装一道道工序'
- '- **build_norm** = 食材清洗员（RMSNorm / LayerNorm），把上一道工序的产出标准化'
- '- **build_lora_mm** = 切配厨师，按照 `wq/wk/wv/up/gate/down` 等矩阵对食材（张量）做线性变换'
- '- **ggml_reshape_3d** = 整形刀，把扁平的肉片重新切成 [头维度, 头数, token数] 的三维形状'
- '- **ggml_view_3d** = 玻璃窗（零拷贝视图），不搬动食材，只贴标签，让不同厨师从不同角度看同一块肉'
- '- **ggml_rope_ext / ggml_rope_multi** = 调料旋钮，按 token 位置给食材「加入时间风味」（位置编码）'
- '- **build_attn** = 主厨的秘制炒锅（Flash Attention / 标准注意力），把 QKV 三种食材快速翻炒'
- '- **build_ffn / build_moe_ffn** = 二级烹饪工序：稠密 FFN 是单人小炒，MoE 是多位厨师分工的「大锅炒」'
- '- **build_cvec** = 风味修正师（控制向量），在菜品出锅前微调风味'
- '- **inp_out_ids** = 出菜筛选器，只把最后几道菜（最后 token）呈给顾客'
- '- **template <bool embed/iswa>** = 「双模菜谱」，同一份菜谱可以做出两种版本（语言模型 / 嵌入模型，普通 KV / ISWA）'
- '- **if constexpr** = 厨房的「炒菜开关」，按下哪一档就启动哪条工序'
- 就像每家餐厅都有专属厨师团队处理招牌菜，llama.cpp 也为每个模型家族安排了专属的 `llm_build_*` 构造函数，把架构差异转化为 GGML 计算图的统一语言。
'no': 25
summary:
- concept: llm_build_llama 模板类
  desc: 用 template <bool embed> 统一支持语言模型与嵌入模式，编译期通过 if constexpr 分支
- concept: llm_build_llama_iswa
  desc: 在基础 Llama 上叠加 ISWA 注意力输入、NoPE 步进与 Sigmoid 路由的 MoE
- concept: llm_build_qwen/Qwen2VL
  desc: Qwen 原版用 view_3d 拆分打包 QKV，Qwen2VL 用 ggml_rope_multi 注入 M-RoPE
- concept: llm_build_qwen2 输出偏置
  desc: 通过 if (model.output_b != nullptr) 在 lm_head 后可选加偏置
- concept: llm_build_qwen2moe
  desc: MoE 路由专家 + 共享专家 + 双门控（sigmoid(silu(x)/x)）
- concept: llm_build_qwen3/Qwen3moe
  desc: Q/K 归一化前置（RoPE 之前），MoE 版额外传入 ffn_*_exps_s 缩放张量
- concept: llm_build_qwen3vl
  desc: M-RoPE + 前 n_deepstack_layers 层用 ggml_view_2d 注入视觉特征
- concept: llm_build_bailingmoe
  desc: 标准 MoE + 共享专家，reshape 用 n_rot 而非 n_embd_head
- concept: llm_build_bailingmoe2
  desc: QKV 打包 + Q/K 归一化 + 稠密/MoE 分层（n_layer_dense_lead）
- concept: llm_build_chatglm
  desc: wqkv 双模（== nullptr 时 reshape，否则 view_3d）+ SWIGLU+SEQ 前馈
- concept: llm_build_glm4
  desc: Post-Norm（attn/ffn 后归一化）+ use_mrope 二选一 + ubatch.embd 校验
- concept: llm_build_glm4_moe
  desc: GLM4 Post-Norm + MoE + Q/K 归一化前置 + 稠密/MoE 分层
- concept: llm_build_baichuan
  desc: model.type==LLM_TYPE_7B 走 RoPE，13B 完全跳过 RoPE（ALiBi 风格）
- concept: llm_build_internlm2
  desc: 标准 Pre-Norm + 分离 wq/wk/wv + 可选 bq/bk/bv
- concept: llm_build_hunyuan_dense
  desc: Q/K 归一化后置（RoPE 之后）
- concept: llm_build_hunyuan_moe
  desc: cur_mlp = build_ffn + cur_moe = build_moe_ffn(norm_topk_prob=true) 双轨相加
- concept: llm_build_mistral3
  desc: f_attn_temp_scale≠0 时构造 inp_attn_scale，Qcur = ggml_mul(Qcur, inp_attn_scale)
- concept: llm_build_arcee
  desc: 无 gate 的 ReLU² 激活（gate 参数为 NULL）
- concept: llm_build_step35_iswa
  desc: 每层 n_head/n_rot + wqkv_gate 头级 sigmoid 门控 + ISWA
- concept: llm_build_smallthinker
  desc: template <bool iswa> + 预计算路由概率 probs 传入 build_moe_ffn 末尾
