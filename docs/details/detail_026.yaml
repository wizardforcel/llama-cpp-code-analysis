  name: Qwen 家族全家桶 —— 从原始 Qwen 到 Qwen3-VL 的演进图谱
  'no': 3
  points:
  - '**Qwen 原始版：QKV 打包视图**：通过 `ggml_view_3d` 把单一 `wqkv` 张量拆成 Q/K/V 三个 3D 视图（偏移分别为
    `0*n_embd`、`1*n_embd`、`2*n_embd`），避免复制权重'
  - '**Qwen2 拆 QKV**：使用独立的 `wq/wk/wv` 矩阵分别做 LoRA 矩阵乘，再 reshape 为 `[n_embd_head, n_head,
    n_tokens]`，并在 lm_head 后可选加 `output_b` 偏置'
  - '**Qwen2MoE 的双门控共享专家**：先用 `ffn_gate_inp_shexp` 做 sigmoid 门控（`silu(x)/x`），再与 `ffn_shexp`
    的输出相乘，最后与 MoE 路由专家结果相加'
  - '**Qwen2-VL 的多模态 RoPE**：`ggml_rope_multi` 配合 `sections[4]` 数组实现 M-RoPE（Multimodal
    Rotary Position Embedding），分别对时间/高度/宽度维度编码'
  - '**Qwen3 的 Q/K 归一化前置**：`build_norm(Qcur, attn_q_norm, ...)` 在 RoPE **之前**对 Q/K
    做 RMSNorm，这与 Qwen2 在 RoPE 之后才归一化形成对比'
  - '**Qwen3MoE 的专家权重缩放**：使用 `expert_weights_scale` 与 `LLAMA_EXPERT_GATING_FUNC_TYPE_SOFTMAX`，并显式传入
    `ffn_*_exps_s` 缩放张量'
  - '**Qwen3-VL 的 DeepStack 融合**：每层在 `cur` 上加 `res->t_inp_embd` 的 `(il+1)*n_embd`
    偏移切片（`ggml_view_2d`），实现多模态视觉特征的逐层注入'
  - '**Qwen3-VL-MoE 的差异**：与普通 Qwen3MoE 类似但额外支持 DeepStack 注入，attention 路径沿用 Qwen3 的
    Q/K 归一化前置模式'
