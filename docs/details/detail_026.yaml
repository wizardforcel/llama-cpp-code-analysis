  name: Step35-ISWA 与 SmallThinker —— ISWA 的两种工程化模式
  'no': 9
  points:
  - '**Step35 的每层 n_head 与频率**：通过 `hparams.n_head(il)` 与 `hparams.n_head_kv(il)` 按层读取
    GQA 配置，`get_rope_freq_base/scale` 同样按层动态调整'
  - '**Step35 的 SWA 标志判定**：`is_swa = hparams.is_swa(il)` 用于决定 SWA 层不传 rope_factors（避免冗余计算）'
  - '**Step35 的每层旋转维度**：`n_rot_l = hparams.n_rot(il)` 按层设置部分 RoPE 的旋转维度'
  - '**Step35 的 Q/K RMSNorm**：RoPE 之后用 `build_norm` 做 RMSNorm（attn_q_norm/attn_k_norm），与
    Qwen3 的前置形成对比'
  - '**Step35 的头级注意力门控**：`wqkv_gate` 投影得到 `[n_head_l, n_tokens]` 的门控，sigmoid 后 reshape
    为 `[1, n_head_l, n_tokens]` 与注意力输出 `[n_embd_head_v, n_head_l, n_tokens]` 做逐头广播相乘'
  - '**Step35 的 MoE + 共享专家双轨**：MoE 路由专家通过 `build_moe_ffn`（带 `expert_weights_norm/scale/gating_func`），共享专家通过
    `build_ffn`（SILU+PAR）'
  - '**SmallThinker 的模板化 ISWA**：用 `template <bool iswa>` 让同一类支持普通 KV 与 ISWA 两种内存布局，编译期通过
    `iswa` 选择 `build_attn_inp_kv_iswa()` 或 `build_attn_inp_kv()`'
  - '**SmallThinker 的 NoPE 步进**：`use_rope = il % n_no_rope_layer_step != 0` 让特定层跳过
    RoPE'
  - '**SmallThinker 的预计算路由概率**：`probs = build_lora_mm(ffn_gate_inp, inpL)` 在进入 FFN
    之前就计算好路由概率，并传入 `build_moe_ffn(cur, nullptr, ..., probs)` 的最后一个参数'
  - '**SmallThinker 的 RELU 激活**：用 `LLM_FFN_RELU` 而非主流的 SwiGLU，这是该模型为追求低算力的选择'
