  name: Llama-ISWA —— 滑动窗口变体如何兼顾频率缩放与专家路由
  'no': 2
  points:
  - '**ISWA 注意力输入**：使用 `build_attn_inp_kv_iswa()` 而非普通 `kv` 版本，这是支持"间歇式滑动窗口注意力"（Intermittent
    Sliding Window Attention）的关键'
  - '**每层 RoPE 频率与缩放**：通过 `model.get_rope_freq_base(cparams, il)` 与 `model.get_rope_freq_scale(cparams,
    il)` 按层获取频率参数，这与基础版 Llama 的全模型共享频率形成对比'
  - '**温度调谐（Temperature Tuning）**：`inp_attn_scale = build_inp_attn_scale()` 作为可选输入，对未应用
    RoPE 的层使用 `ggml_mul(Qcur, inp_attn_scale)` 进行注意力温度调节'
  - '**RoPE 的条件启用**：`use_rope = (il+1) % hparams.n_no_rope_layer_step != 0`，通过 `n_no_rope_layer_step`
    让某些层跳过 RoPE，这与 NoPE（No Position Embedding）论文思想一致'
  - '**K 归一化的条件触发**：只有 `use_rope && hparams.use_kq_norm` 同时成立才进行 K 的 RMSNorm，避免对非
    RoPE 层做不必要的归一化'
  - '**共享专家网络**：MoE 分支单独构建 `ffn_shexp` 通过 `build_ffn` 走普通 SILU+PAR 路径，并与 `moe_out`
    相加形成 `ffn_moe_out_merged`'
  - '**Sigmoid 门控函数**：注意 ISWA 版本使用 `LLAMA_EXPERT_GATING_FUNC_TYPE_SIGMOID` 而非 SOFTMAX，这与
    DeepSeek-V2/V3 的 sigmoid 路由保持一致'
  - '**最后一层裁剪与残差**：保留与基础 Llama 相同的 `ggml_get_rows` 最后层剪枝和 `ggml_add` 残差连接模式'
