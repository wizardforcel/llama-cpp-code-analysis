  name: GLM/ChatGLM 系列 —— 清华系的分组注意与 M-RoPE 演进
  'no': 5
  points:
  - '**ChatGLM 的双模式 QKV**：通过 `wqkv == nullptr` 区分是分离的 `wq/wk/wv` 还是合并的 `wqkv`，前者 reshape、后者
    view_3d'
  - '**GQA 分组注意力的偏移计算**：V 视图的偏移是 `1*sizeof(float)*(n_embd + n_embd_gqa)`，这是为了在 K/V
    头数少于 Q 头时正确索引共享的 K/V 张量'
  - '**GLM4 的 Post-Norm 改造**：在注意力之后与 FFN 之后各加一次 `attn_post_norm` / `ffn_post_norm`
    的 RMSNorm，这与 Pre-Norm 经典 LLaMA 形成对比'
  - '**GLM4 的 M-RoPE 选择**：根据 `hparams.use_mrope()` 在 `ggml_rope_multi` 与 `ggml_rope_ext`
    间二选一，多模态走 multi、纯文本走 ext'
  - '**GLM4-MoE 的 Q/K 归一化前置**：在 RoPE 之前用 `build_norm` 做 RMSNorm，与 Qwen3 的做法一致'
  - '**GLM4-MoE 的稠密/MoE 切换**：`n_layer_dense_lead` 决定前几层是稠密 FFN，其余层用 `build_moe_ffn`
    走 MoE'
  - '**GLM4-MoE 的路由专家偏置**：传入 `ffn_exp_probs_b` 与 `expert_weights_norm`/`expert_weights_scale`
    实现精细化路由'
  - '**SWIGLU 序列式布局**：ChatGLM 与 GLM4 都用 `LLM_FFN_SWIGLU` + `LLM_FFN_SEQ` 而非 PAR，这意味着
    gate 与 up 在同一张量内连续排列'
