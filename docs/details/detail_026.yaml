  - 1. `n_transformer_layers` 与 `n_layer`、`hparams.nextn_predict_layers` 的关系是什么？为什么要跳过最后几层？
  - 2. `il < hparams.n_layer_dense_lead` 这条分支中，稠密 FFN 与 MoE 各用了哪些张量（`ffn_up` / `ffn_up_exps`
    等）？
  - 3. `ffn_exp_probs_b` 在 `build_moe_ffn` 调用中扮演什么角色？它和 `LLAMA_EXPERT_GATING_FUNC_TYPE_*`
    的关系是什么？
  - 4. QKV 视图中 K 偏移 `1 * sizeof(float) * n_embd`、V 偏移 `1 * sizeof(float) * (n_embd
    + n_embd_gqa)` 是如何保证 GQA 正确索引的？
