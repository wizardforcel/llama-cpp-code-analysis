  name: BailingMoe 与 BailingMoe2 —— 稀疏专家的"标准化模板"
  'no': 4
  points:
  - '**BailingMoe 的基础 MoE 结构**：标准自注意 + `build_moe_ffn` + 共享专家 `ffn_shexp` 三件套，路由使用
    `expert_weights_norm` 控制归一化；注意 reshape 时使用 `n_rot` 而非 `n_embd_head` 作为头维度'
  - '**BailingMoe2 的 QKV 打包 + Q/K 归一化**：先 `build_lora_mm(wqkv)` 一次得到拼接张量，再用 `ggml_view_3d`
    拆分（K 偏移 `1*n_embd`，V 偏移 `1*(n_embd+n_embd_gqa)`），随后对 Q/K 做 `build_norm` 归一化'
  - '**稠密/MoE 混合层**：通过 `il < hparams.n_layer_dense_lead` 决定该层是稠密 FFN 还是 MoE，前几层可以保留为稠密以稳定训练'
  - '**专家偏置项 `ffn_exp_probs_b`**：BailingMoe2 在 MoE 路由中传入 `ffn_exp_probs_b`，这是某些 MoE
    实现会给路由 logit 加偏置的工程细节'
  - '**NextN 预测层的跳过**：通过 `n_transformer_layers = n_layer - hparams.nextn_predict_layers`
    跳过最后一层（专门用于 multi-token prediction 的层）'
  - '**两种 MoE 门控函数**：BailingMoe2 用 `static_cast<llama_expert_gating_func_type>(hparams.expert_gating_func)`
    支持多种门控（softmax/sigmoid）'
