learning_targets:
- 理解 rpc_server_params 结构体的设计哲学：值语义、默认线程数策略与引用传递的解析模式
- 掌握跨平台路径处理的三大技巧：UTF-8到宽字符转换、目录分隔符宏统一、递归目录创建（含Windows盘符跳过）
- 学会多级回退的缓存目录探测策略：环境变量优先级链（LLAMA_CACHE → XDG_CACHE_HOME → HOME → getpwuid）及macOS/Windows平台规范
- 理解命令行参数解析的防御式设计：严格数值校验、正则分割设备列表、未识别参数立即报错退出
- 掌握设备选择的三级火箭策略：显式指定 → GPU优先自动探测 → CPU回退保底
- 理解动态加载的插件化架构：ggml_backend_load_all、ggml_backend_reg_by_name、ggml_backend_reg_get_proc_address
  的协作流程
- 认识RPC服务器的安全边界：无加密协议的风险警告与实验性功能定位
life_analogy:
- 想象 rpc-server 是一家**跨城算力快递公司的调度总站**：
- '- **rpc_server_params** = 快递站的「运营配置表」，写明仓库地址（host）、收货窗口号（port）、快递员人数（threads）、可用车辆列表（devices），一切配置集中在一处，一眼看全'
- '- **跨平台路径三兄弟**（utf8_to_wstring / DIRECTORY_SEPARATOR / fs_create_directory_with_parents）=
  不同城市的地址规则翻译官：有的城市用中文地址（UTF-8），有的用拼音（宽字符），有的用斜杠分隔街道，有的用反斜杠——翻译官确保无论哪种格式都能准确找到目的地'
- '- **fs_get_cache_directory 的多级回退** = 寄包裹时找临时仓储点：先看客户指定的仓库（LLAMA_CACHE），没有就看城市标准仓库（XDG_CACHE_HOME），再找用户家后院（$HOME/.cache），最后实在不行查户口本（getpwuid）——总有一个能放包裹'
- '- **参数解析的防御式设计** = 快递站的收货检查员：重量（端口号）超出范围立即拒收，看不懂的地址（未知参数）直接退回并附上格式说明（print_usage），绝不含糊放行'
- '- **设备三级火箭策略** = 快递分拣的车辆调度：优先用客户指定的专车（-d 参数），没指定就派出所有货车（GPU），货车都没了就用自行车（CPU）也得送'
- '- **动态加载启动函数** = 调度总站不亲自送货，而是通过电话（函数指针）联系各区域车队经理（RPC 后端），让他们自己组织车队出发——总站只负责传达指令'
- '- **安全警告** = 快递站门口的红色警示牌：「本服务无保险柜（无加密），请勿将贵重物品暴露给外人（非本地绑定）」——醒目、直接、不容忽视'
'no': 71
summary:
- concept: '`rpc_server_params`'
  desc: RPC 服务器配置中枢：host/port/threads/devices/cache 五要素的值语义封装
- concept: '`hardware_concurrency()/2`'
  desc: 保守线程数策略——只用一半核心，为系统和其他进程留喘息空间
- concept: '`utf8_to_wstring()`'
  desc: Windows 平台 UTF-8 → wstring 转换桥，解决 MultiByteToWideChar 两步调用
- concept: '`DIRECTORY_SEPARATOR`'
  desc: 跨平台路径分隔符宏，编译期消除 '\\' 与 '/' 的平台差异
- concept: '`fs_create_directory_with_parents()`'
  desc: 递归 mkdir 实现：逐级检查 + 创建，Windows 跳过盘符（C:），Unix 用 0755 权限
- concept: '`fs_get_cache_directory()`'
  desc: 多级回退缓存目录探测：LLAMA_CACHE → XDG_CACHE_HOME → $HOME/.cache → getpwuid → 平台规范路径
- concept: '`ensure_trailing_slash`'
  desc: 尾部斜杠归一化 Lambda，消除路径拼接的二义性
- concept: '`rpc_server_params_parse()`'
  desc: 防御式参数解析：端口 1-65535 校验、正则 [,/]+ 分割设备列表、未知参数立即报错
- concept: '`get_devices()`'
  desc: 三级设备选择：显式指定 → 非 CPU 全选 → CPU 回退保底
- concept: '`ggml_backend_load_all()`'
  desc: 动态加载所有计算后端插件，实现后端热插拔架构
- concept: '`ggml_backend_reg_by_name("RPC")`'
  desc: 按名称查找 RPC 后端注册表，实现主程序与后端实现的解耦
- concept: '`ggml_backend_reg_get_proc_address()`'
  desc: 动态获取后端函数指针，避免硬编码函数调用，支持插件化扩展
- concept: '`std::setlocale(LC_NUMERIC, "C")`'
  desc: 强制 C locale，防止欧洲逗号小数点等地区设置导致数值解析错误
- concept: 安全警告机制
  desc: 非 127.0.0.1 绑定时打印醒目警告，强调 RPC 无加密、仅限实验用途
- concept: 缓存目录惰性创建
  desc: 仅 --cache 启用时才创建 rpc/ 子目录，避免无意义的磁盘 IO
