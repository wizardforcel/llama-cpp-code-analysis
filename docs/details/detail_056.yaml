  name: 代码地图速览 —— 拆解 GGUF 的「海关架构」
  'no': 2
  points:
  - '**核心档案与索引**'
  - '- `constants.py` 是「术语词典」：定义了 `GGUF_MAGIC`（0x46554747）、版本号、模型架构枚举（MODEL_ARCH）和元数据键名（Keys），确保读写双方语言一致'
  - '- `gguf_reader.py` 是「拆箱专家」：基于内存映射（np.memmap）逐层解析二进制流，将字节还原为元数据字段（ReaderField）和张量信息（ReaderTensor）'
  - '- `gguf_writer.py` 是「装箱流水线」：通过状态机（WriterState）严格控制写入顺序，从文件头到 KV 数据再到张量权重，确保产出的文件符合规范'
  - '**数据整形与翻译**'
  - '- `quants.py` 是「压缩车间」：提供 Q4_0、Q4_K、IQ 系列、MXFP4 等量化算法的 NumPy 实现，负责把浮点权重「压模」成紧凑格式'
  - '- `tensor_mapping.py` 是「多语言翻译官」：维护 `TensorNameMap`，将 HuggingFace 的原始张量名（如 `model.layers.0.self_attn.q_proj`）映射为
    GGUF 标准名（`blk.0.attn_q.weight`）'
  - '**元数据与词表**'
  - '- `metadata.py` 是「档案管理员」：自动从 HuggingFace 模型卡和配置中提取作者、许可证、标签等信息，生成符合规范的元数据'
  - '- `vocab.py` 是「语言通行证办理处」：支持 BPE、SentencePiece、Mistral（Tekken）等多种分词器格式的导入与统一'
  - '- `utility.py` 提供「多功能工具」：包括远程 safetensors 读取、文件命名规范、参数量格式化等实用功能'
