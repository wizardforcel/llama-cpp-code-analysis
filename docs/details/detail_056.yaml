  name: GGUFWriter 核心机制 —— 装箱流水线的「智能调度中心」
  'no': 5
  points:
  - '**状态机与文件生命周期**'
  - '- `WriterState` 枚举定义了严格的写入顺序：NO_FILE → EMPTY → HEADER → KV_DATA → TI_DATA → WEIGHTS'
  - '- `open_output_file()` 作为第一道闸门，确保只有在EMPTY状态下才能打开文件句柄，并触发 `print_plan()` 打印分片计划'
  - '- `add_shard_kv_data()` 在分片模式下自动注入 `split.no` 和 `split.count` 元数据，支持模型拆分为多个GGUF文件（如model-00001-of-00002.gguf）'
  - '**KV元数据的类型安全封装**'
  - '- `add_key_value()` 是所有add方法的内部入口，负责去重检查和类型包装（GGUFValue）'
  - '- 非空校验：`add_string()` 和 `add_array()` 会静默跳过空值，防止写入无效字段'
  - '- 特定领域方法家族：`add_architecture()` 写入模型架构；`add_block_count()` 写入层数；`add_head_count()`
    支持单值或数组（用于GQA）；`add_rope_freq_base()` 配置旋转位置编码'
  - '**张量与权重的分治策略**'
  - '- `add_tensor_info()` 仅注册元数据（形状、类型、名称），计算对齐后的偏移量，为后续数据定位做准备'
  - '- `add_tensor()` 处理实际数据：如果 `use_temp_file=True`，先把数据写入 `SpooledTemporaryFile`；否则暂存在内存对象中'
  - '- `write_tensor_data()` 按TI_DATA注册的顺序，将张量数据写入物理文件，自动处理字节序转换（`byteswap`）'
  - '- `write_tensors_to_file()` 是最终汇总：先写TI_DATA区，再批量流式写入权重，配合tqdm显示进度，最后处理跨文件的张量分布'
  - '**底层序列化原语**'
  - '- `_pack()` 将值按字节序打包为二进制；`_pack_val()` 处理复杂类型（字符串、数组、嵌套类型）的递归序列化'
  - '- `flush()` 与 `close()` 管理文件句柄生命周期，确保数据落盘'
