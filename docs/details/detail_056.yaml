learning_targets:
- 理解GGUF作为「模型集装箱」的设计哲学与二进制布局规范
- 掌握gguf-py的模块化架构：constants/reader/writer/quants/vocab等子模块的职责边界
- 熟练运用GGUFReader解析文件头、KV元数据与张量信息
- 掌握GGUFWriter的状态机写入流程（HEADER→KV_DATA→TI_DATA→WEIGHTS）
- 理解ReaderField与ReaderTensor的懒加载与内存映射机制
- 掌握Metadata的多源启发式加载与启发式推断逻辑
- 理解TensorNameMap的静态/动态映射表与工厂函数
- 掌握量化接口（quantize/dequantize）与Lazy张量的交互机制
- 熟悉SpecialVocab对多种分词器格式的统一处理
life_analogy:
- 想象GGUF是一个**国际航运的标准集装箱体系**：
- '- **GGUF格式** = 集装箱的ISO标准尺寸（20尺/40尺柜），无论里面装的是Llama还是Qwen，箱子外形统一，港口（推理引擎）都能吊装'
- '- **GGUFWriter** = 专业的装箱流水线，必须按严格顺序作业：先封箱头（HEADER）→ 贴装箱单（KV_DATA）→ 装货物清单（TI_DATA）→
  最后装货（WEIGHTS），**WriterState**就是流水线的防呆闸门，跳步直接报警'
- '- **GGUFReader** = 海关的X光查验机，用内存映射（mmap）不拆箱就能扫描箱内物品清单（fields）和货物位置（tensor.data_offset)'
- '- **constants.py** = 海关的HS编码词典，定义了什么是「纺织品」（MODEL_ARCH）、什么是「易燃品」（量化类型），以及它们在报关单（元数据键）上的标准填法'
- '- **TensorNameMap** = multilingual翻译官，把各家模型的方言（PyTorch/HuggingFace张量名）翻译成标准GGUF术语（blk.0.attn_q等）'
- '- **metadata.py** = 报关单自动生成器，读取模型卡片（README）和配置（config.json），自动填写作者、许可证、尺寸标签等通关信息'
- '- **vocab.py** = 语言通行证办理处，支持多种「方言」（BPE/SentencePiece/Tekken），把它们统一转换成GGUF认可的「护照格式」（token列表+合并规则）'
- '- **utility.py** = 港口物流调度系统，**远程safetensors**就像用**无人机吊运**（HTTP Range按需读取），而不需要整船卸货'
'no': 55
summary:
- concept: '`GGUF_MAGIC` / `GGUF_VERSION`'
  desc: 文件头魔数0x46554747与版本号，Reader据此校验文件合法性
- concept: '`Keys` 类'
  desc: 元数据键名容器（General/LLM/Attention/Rope等），定义标准字段如`general.architecture`
- concept: '`MODEL_ARCH` / `GGMLQuantizationType`'
  desc: 模型架构枚举与张量量化类型枚举，支持Q4_0/Q4_K/IQ系列/MXFP4等
- concept: '`GGUFReader`'
  desc: 拆箱读取器，基于`np.memmap`懒加载，分`_build_fields`/`_build_tensor_info`/`_build_tensors`三阶段解析
- concept: '`ReaderField.contents()`'
  desc: 从字段parts中提取实际值，处理字符串/数组/标量的差异化解码
- concept: '`GGUFWriter` 状态机'
  desc: 严格限制写入顺序：NO_FILE→EMPTY→HEADER→KV_DATA→TI_DATA→WEIGHTS，防止生成损坏文件
- concept: '`add_tensor_info()` vs `add_tensor()`'
  desc: 前者注册元数据（名称/形状/类型），后者写入实际权重数据，支持分片与临时文件缓冲
- concept: '`write_header_to_file()`'
  desc: 写入Magic/Version/张量数/KV数，支持大端/小端字节序
- concept: '`quant_shape_to_byte_shape`'
