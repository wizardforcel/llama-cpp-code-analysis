  name: 元数据启发式提取 —— 从模型卡到「身份档案」
  'no': 8
  points:
  - '**多源加载流水线**'
  - '- `Metadata.load()` 是聚合入口，按优先级合并：模型卡（README.md YAML frontmatter）→ HF配置（config.json）→
    生成配置（generation_config.json）→ 用户覆盖JSON（metadata_override）'
  - '- `load_model_card()` 解析Markdown的YAML头部，处理「Norway问题」（制表符转义），提取author、license、tags等'
  - '- `load_hf_parameters()` 读取config.json，从中提取架构特定的超参数'
  - '- `load_generation_config()` 读取generation_config.json，提取采样相关参数'
  - '- `load_metadata_override()` 加载用户提供的JSON覆盖文件'
  - '- `apply_metadata_heuristic()` 实现智能推断：当显式元数据缺失时，从目录名、模型ID（如Mixtral-8x7B-Instruct-v0.1）解析出basename、size_label、finetune、version'
  - '**模型ID解构算法**'
  - '- `get_model_id_components()` 是核心解析器：使用正则表达式识别版本号（v0.1）、尺寸标签（7B/13B/70B）、微调后缀（Instruct/Chat）、量化类型（Q4_0）'
  - '- 智能纠错：处理用户输入中的 ../ 或 ./ 前缀，忽略路径分隔符，提取纯模型名'
  - '- 尺寸标签规范化：将 7b、7B、7b1 统一为 7B，并验证其与总参数量级是否匹配（防止将7B上下文的128k误认为7B参数）'
  - '**写入GGUF**'
  - '- `set_gguf_meta_model()` 将收集到的元数据按类别写入Writer：先采样参数，再作者信息，再许可证，最后标签列表'
  - '- 支持基础模型链（base_models）和数据集列表（datasets）的批量写入'
  - '- 模块级辅助代码处理复杂的字段映射和条件写入逻辑'
