  name: 快速上手 —— 第一次「开箱」与「装箱」实操
  'no': 3
  points:
  - '**读取示例：像查验货物一样检查 GGUF**'
  - '- `GGUFReader` 采用懒加载策略，初始化时仅解析头部和元数据，张量数据只在访问时通过内存映射读取'
  - '- `reader.fields` 是一个有序字典，存储所有键值对（KV），通过 `field.contents()` 或 `field.parts[field.data[0]]`
    可提取具体数值'
  - '- `reader.tensors` 包含张量元数据（名称、形状、量化类型），`tensor.data` 才是真正权重数据（可能是 numpy 数组或内存映射）'
  - '**写入示例：五步走完「打包」流程**'
  - '- **初始化**：`GGUFWriter("example.gguf", "llama")` 指定输出路径和模型架构，架构名会写入 `general.architecture`
    字段'
  - '- **填单子**：`add_block_count(12)` 等方法添加元数据，支持 uint32、float32、string、数组等多种类型'
  - '- **装货**：`add_tensor()` 注册张量，此时仅记录元信息或写入临时文件，支持 F16/F32 及量化后的字节流'
  - '- **封存**：依次调用 `write_header_to_file()` → `write_kv_data_to_file()` → `write_tensors_to_file()`，严格遵循
    GGUF 二进制布局顺序'
  - '- **状态机保护**：`WriterState` 枚举（NO_FILE → EMPTY → HEADER → KV_DATA → TI_DATA → WEIGHTS）确保你不会先写数据后写头，防止生成损坏的「集装箱」'
