  name: GGUFReader 深度拆解 —— 二进制文件的「无影灯」解析术
  'no': 4
  points:
  - '**内存映射与魔法校验**'
  - '- `GGUFReader.__init__` 首先通过 `np.memmap` 将文件映射到虚拟内存，避免一次性加载大文件'
  - '- 文件头校验：检查 `GGUF_MAGIC`（0x46554747）和版本号，自动检测字节序（通过读取version字段的异常值判断是否为Big-Endian）'
  - '- 如果检测到跨端序（`byte_order == ''S''`），后续所有 `_get()` 调用都会自动转换数据类型到正确端序'
  - '**字段解析流水线**'
  - '- `_get()` 是底层原语：从指定偏移量读取NumPy数组，支持显式覆盖字节序'
  - '- `_get_str()` 读取GGUF的变长字符串格式：先读8字节uint64长度，再读对应字节数据'
  - '- `_get_field_parts()` 递归解析复合类型：支持字符串、标量、以及数组（数组需递归解析每个元素）'
  - '- `_build_fields()` 遍历KV对，通过 `_push_field()` 建立有序字段表，防止重复键'
  - '**张量信息重建**'
  - '- `_get_tensor_info_field()` 解析单个张量的元数据：名称、维度数组（uint64）、量化类型、数据偏移量'
  - '- `_build_tensors()` 将元数据转化为 `ReaderTensor` 对象，根据 `ggml_type` 决定 `item_type`（如F16用float16，Q4_0用uint8）'
  - '- 对量化类型，调用 `quant_shape_to_byte_shape()` 计算实际字节形状，并通过 `data_offset` 建立从文件原始位置到NumPy数组的视图映射'
