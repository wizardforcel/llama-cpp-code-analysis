  name: GGUF 的物流集装箱哲学 —— 统一模型分发的「世界语」
  'no': 1
  points:
  - '**为什么需要「集装箱」？**'
  - '- 大模型世界早期就像没有标准集装箱的码头：PyTorch、Safetensors、HuggingFace 格式各自为政，装卸（加载）效率低下且易出错'
  - '- GGUF（GPT-Generated Unified Format）定义了标准化的「集装箱尺寸」（二进制布局）和「装箱单」（元数据），让任何模型都能装进统一的「箱子」里跨平台运输'
  - '- 在 llama.cpp 生态中，GGUF 是唯一的「官方货运标准」，从 CPU 到 CUDA 再到 Metal，所有后端都只认这个格式'
  - '**gguf-py 的「进出口权」**'
  - '- `gguf-py` 是 Python 世界的 GGUF 海关，负责「打包」（Writer）和「开箱」（Reader）'
  - '- 通过 `__init__.py` 的星号导入，它将 `constants`、`reader`、`writer` 等子模块聚合成统一的命名空间，就像海关大厅的各个服务窗口'
  - '- 这种设计让转换脚本（如 `convert_hf_to_gguf.py`）无需关心底层二进制细节，只需调用高层 API 即可完成「报关」'
