  name: 张量映射与远程工具 —— 跨框架的「翻译官」与「无人机」
  'no': 10
  points:
  - '**TensorNameMap：命名标准化引擎**'
  - '- 核心数据结构：`mappings_cfg`（架构无关静态映射）和 `block_mappings_cfg`（层级模板，含 `{bid}` 占位符），以及
    `arch_block_mappings_cfg`（架构特定覆盖）'
  - '- `__init__` 展开机制：根据模型架构（arch）和层数（n_blocks），将模板如 `blk.{bid}.attn_q.weight` 展开为
    `blk.0.attn_q.weight`、`blk.1.attn_q.weight` 等具体名称'
  - '- `get_type_and_name()` 是查询核心：先精确匹配，失败时尝试剥离 `try_suffixes`（如 .weight, .bias）后重试，支持返回
    GGUF 标准名和张量类型'
  - '- `get_name()` / `get_type()` 提供便捷访问'
  - '- `__getitem__` / `__contains__` / `__repr__` 实现字典协议'
  - '- `get_tensor_name_map()` 工厂函数简化实例化'
  - '**远程Safetensors读取**'
  - '- `SafetensorRemote.get_list_tensors_hf_model()` 智能识别单文件或多分片（通过检查 model.safetensors.index.json）'
  - '- `get_metadata()` 只读取文件前5MB，解析出JSON元数据头（含dtype、shape、data_offsets），避免下载完整大文件'
  - '- `get_data_by_range()` 使用HTTP Range请求按需下载特定字节区间，支持HF鉴权（HF_TOKEN环境变量）'
  - '- `check_file_exist()` 通过HEAD请求探测文件存在性'
  - '- `_get_request_headers()` 统一处理认证头'
  - '**本地Safetensors控制**'
  - '- `SafetensorsLocal` 直接解析本地文件头，提供 `LocalTensor` 对象的字节级内存映射视图（`mmap_bytes`），实现零拷贝读取'
  - '- `LocalTensorRange` 封装文件路径与偏移信息'
  - '- 上下文管理器协议（`__enter__`/`__exit__`）确保文件句柄正确释放'
  - '- `RemoteTensor.data()` 提供远程数据的便捷获取'
