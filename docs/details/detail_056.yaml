  name: 多源词表整合 —— 分词器的「巴别塔」
  'no': 9
  points:
  - '**SpecialVocab：特殊Token的中央枢纽**'
  - '- 职责：管理BOS（开始）、EOS（结束）、UNK（未知）、PAD（填充）等特殊token的ID，以及聊天模板（chat_template）'
  - '- 加载策略：优先尝试 `tokenizer.json`（包含完整的token列表和合并规则），失败则回退到 `config.json` 和 `merges.txt`'
  - '- 智能推断：通过分析 post_processor（如RobertaProcessing或TemplateProcessing）推断 add_bos/add_eos
    的布尔标志，无需显式配置'
  - '- `_set_special_token()` 统一处理边界检查与赋值'
  - '**BpeVocab与SentencePieceVocab**'
  - '- `BpeVocab` 处理GPT-2风格：读取 vocab.json（token→id映射），验证added_tokens的ID连续性，区分 NORMAL
    和 CONTROL（特殊）token类型，提供 `bpe_tokens()` 和 `added_tokens()` 迭代器'
  - '- `SentencePieceVocab` 使用 sentencepiece 库加载 .model 文件，通过 `IsUnknown`/`IsControl`/`IsUnused`/`IsByte`
    判断token类型，提供 `sentencepiece_tokens()` 迭代器'
  - '**LlamaHfVocab与MistralVocab**'
  - '- `LlamaHfVocab` 依赖 transformers 库，统一处理Llama 2/3的HF格式，自动识别字节级BPE（byte_fallback），提供
    `hf_tokens()`、`get_token_type()`、`get_token_score()`、`has_newline_token()` 等接口'
  - '- `MistralVocab` 处理SPM和Tekken两种格式，通过 `mistral_common` 库解析；`MistralVocabConverter`
    负责将Tekken的 BPE 合并规则转换为 GGUF 兼容格式'
  - '- `MistralVocabConverter` 提供 `extract_vocab_merges_from_model()`、`token_bytes_to_string()`、`get_token_id()`
    等工具方法'
  - '**辅助工具**'
  - '- `bytes_to_unicode()` 生成字节到Unicode的可逆映射表，解决BPE处理空白字符的问题（如将空格映射到Ġ）'
  - '- `NoVocab` 作为无词表模型的占位符'
  - '- `BaseVocab`/`Vocab` 协议定义统一接口规范'
