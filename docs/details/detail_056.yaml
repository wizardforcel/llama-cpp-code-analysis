  name: 量化引擎与懒加载 —— 字节压缩的「魔术空间」
  'no': 7
  points:
  - '**形状转换的数学基础**'
  - '- `quant_shape_to_byte_shape()` 是读写双方的「外交官」：根据量化类型（如Q4_0的32字节块）将逻辑形状（如[4096,4096]）转换为物理字节形状'
  - '- `quant_shape_from_byte_shape()` 是逆过程，用于从字节流重建逻辑形状'
  - '**__Quant 基类与注册工厂**'
  - '- `__Quant.__init__` 强制子类化，不能直接实例化'
  - '- `__init_subclass__` 自动收集所有子类（Q4_0、Q8_0等），建立类型到实现的映射表 `_type_traits`'
  - '- 懒加载包装：自动为子类包装 `LazyNumpyTensor` 支持，使量化操作可以延迟到实际访问时才执行'
  - '- `init_grid()` 为IQ系列初始化查找表网格，将十六进制字符串解码为多维数组，用于非线性量化值的快速查表'
  - '- `quantize()`/`dequantize()` 统一入口，`can_quantize()` 检查可行性'
  - '- `quantize_rows()`/`dequantize_rows()` 批量行处理，`quantize_blocks()`/`dequantize_blocks()`
    抽象接口由子类实现'
  - '**量化算法实现**'
  - '- 对称量化（Q4_0/Q8_0）：基于绝对最大值缩放，`np_roundf` 实现远离零舍入，块内数据压缩为低位整数'
  - '- 非对称量化（Q4_1/Q5_1）：额外存储最小值（min），通过 `d * (q - min)` 重建浮点值'
  - '- K-quant系列（Q2_K~Q6_K）：使用超块结构（QK_K=256），分离存储缩放因子（scales）和Quantized值，支持亚块（sub-block）精度'
  - '- IQ系列（IQ1_S~IQ4_XS）：基于查找表（grid）的矢量量化，利用网格点索引代替精确数值，实现极高压缩率'
  - '- 新锐格式：'
  - '  - TQ1_0/TQ2_0（三元量化：-1/0/1）'
  - '  - MXFP4（Open Compute FP4，e8m0缩放+e2m1尾数）'
  - '  - NVFP4（NVIDIA FP4，含ue4m3缩放因子，通过 `ue4m3_to_fp32` 和 `fp32_to_ue4m3` 转换）'
  - '- BF16：Brain Floating Point 16位格式量化'
  - '**全局API入口**'
  - '- `quantize(data, qtype)` 和 `dequantize(data, qtype)` 是模块级入口，根据类型自动分派到对应算法类'
  - '- `_apply_over_grouped_rows()` 提供高效的分组行处理机制'
