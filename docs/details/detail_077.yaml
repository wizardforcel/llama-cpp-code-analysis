exercises:
- contents:
  - 阅读以下实现并对比：
  - '- `tools/mtmd/models/llama4.cpp` 的 pixel shuffle 与 `ggml_im2col` 用法'
  - '- `tools/mtmd/models/minicpmv.cpp` 的 Resampler 查询式交叉注意力'
  - '- `tools/mtmd/models/gemma4v.cpp` 的 VisionPooler 平均池化与 `build_mm` 钳制'
  - '- `tools/mtmd/models/mobilenetv5.cpp` 的 MSFA 多尺度融合上采样'
  - '- `tools/mtmd/models/cogvlm.cpp` 的 SwiGLU 门控 FFN'
  - 思考：
  - 1. Pixel Shuffle 与 VisionPooler 在数学本质上有何异同（空间-通道转换 vs 空间平均）？
  - 2. Resampler 的 `mm_model_query` 是如何初始化的？为什么使用固定数量的查询向量？
  - 3. MobileNetV5 的 MSFA 为什么选择 Stage 2/3 特征而不是全部 Stage 进行融合？
  - 4. Gemma4V 的 `build_mm` 中 clamp_info 的输入/输出范围数值（如 [-9.0, 9.0]）有何物理意义？
  'no': 1
  title: 对比五种投影器的压缩与映射策略
- contents:
  - 对比阅读：
  - '- `tools/mtmd/models/qwen2vl.cpp` 或 `qwen3vl.cpp` 的 M-RoPE（`ggml_rope_multi`）'
  - '- `tools/mtmd/models/llama4.cpp` 的 2D RoPE（`build_rope_2d`，false 参数）'
  - '- `tools/mtmd/models/kimik25.cpp` 的 2D RoPE 与 3D 位置嵌入插值'
  - 实践与分析：
  - 1. M-RoPE 中 `mrope_sections[4] = {d_head/4, d_head/4, d_head/4, d_head/4}` 如何映射到
    H/W 两个轴？
  - 2. 为什么 Llama4 和 Kimi-K2.5 的 2D RoPE 选择将特征维度一分为二（前半 X 轴，后半 Y 轴）？
  - 3. Kimi-K2.5 的 `resize_position_embeddings_3d` 如何处理非正方形（矩形）位置嵌入的双三次插值？
  - 4. 绘制 M-RoPE 在 224x224 图像（14x14 patch，d_head=64）上的完整位置 ID 生成示意图
  'no': 2
  title: 深入 M-RoPE 与 2D-RoPE 的实现差异
- contents:
