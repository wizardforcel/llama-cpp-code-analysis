- contents:
  - 阅读 `tools/mtmd/models/mobilenetv5.cpp` 及其辅助函数：
  - 1. 分析 `build_edge_residual` 中 3x3 扩张卷积与 1x1 点卷积的组合方式（SAME Padding）
  - 2. 理解 `build_inverted_residual` 的倒残差结构：扩展（1x1 Conv）→ 深度可分离（DW-Mid）→ 投影（1x1 Conv）
  - 3. 剖析 `build_mobilenet_attn` 的多查询注意力（MQA）：K/V 下采样（stride=2）与 Q 的全分辨率处理
  - 4. 掌握 `rms_norm_2d` 如何将 [W,H,C,B] 张量转为 [C,W,H,B] 进行通道维度 RMS 归一化
  - 实践：绘制 MSFA 模块的数据流图，标注特征尺寸变化（如 32x32 与 16x16 特征如何融合到 16x16）
