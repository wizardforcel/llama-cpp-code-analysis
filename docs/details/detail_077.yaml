learning_targets:
- 理解视觉投影器（Projector）的核心作用与分类体系（MLP、Pixel Shuffle、Resampler、Perceiver、VisionPooler）
- 掌握 M-RoPE（多维旋转位置编码）与 2D-RoPE（含 NeoX 与交错模式）在视觉编码器中的实现差异
- 能够分析动态分辨率处理技术（窗口分区、像素重排、位置嵌入插值、3D 位置嵌入缩放）
- 理解音频编码器（Whisper/Conformer/MusicFlamingo）与视觉编码器的架构差异与特征提取流程
- 掌握特殊标记插入技术（IMG_BREAK、BOI/EOI、Image Newline）的实现原理与张量操作技巧
- 能够对比不同多模态架构（LLaVA、Qwen-VL、MiniCPM、Kimi、MobileNetV5、OCR 专用）的图构建策略
- 掌握 MobileNetV5 轻量化视觉编码器的构建逻辑（Edge Residual、Inverted Residual、Multi-Query Attention、MSFA）
- 理解 Gemma4V 可逆线性层（Clippable Linear）与视觉池化（VisionPooler）的钳制机制
life_analogy:
- 想象多模态模型是一家**跨国翻译公司**，负责将「图像」与「音频」这两种外语翻译成「文本」：
- '- **ViT 视觉编码器** = 外语听力理解部门（将图像像素/音频波形转换为特征向量）'
- '- **投影器（Projector）** = 专业术语翻译官（将视觉/音频特征映射到文本嵌入空间）'
- '- **M-RoPE / 2D-RoPE** = 位置坐标标记员（记录每个图像块的空间位置，支持任意长宽比）'
- '- **Pixel Shuffle / VisionPooler** = 文件压缩员（将 4 张 A4 纸内容缩印到 1 张，或平均池化减少 token 数）'
- '- **Resampler / Perceiver** = 摘要撰写员（用固定数量的查询向量提炼关键信息，交叉注意力压缩）'
- '- **IMG_BREAK / BOI/EOI / Newline** = 文件分页符/章节标记（告诉语言模型图像的边界结构）'
- '- **窗口注意力（Window Attention）** = 分区阅读法（将大幅面文档分成小窗口局部理解，再汇总）'
- '- **MobileNetV5** = 便携式扫描仪（轻量高效，适合移动设备，Edge/Invert Residual + MQA）'
- '- **Kimi 3D 位置嵌入** = 3D 地图导航（不仅记录平面位置，还记录深度/层级信息，支持动态分辨率）'
- '- **Conformer** = 音频速记员（先卷积压缩，再相对位置注意力，最后 1/2 残差聚合）'
- 就像翻译公司需要处理不同语言（LLaVA、Qwen、MiniCPM、Kimi、MobileNet、OCR 等方言）和文档类型（普通图像、高分辨率文档、音频），这些编码器也针对特定场景优化了特征提取与压缩策略。
'no': 76
summary:
- concept: MLP Projector
  desc: 简单的两层 GELU 激活 MLP，用于 LLaVA 等基础架构的特征映射，弥合视觉-文本模态差距
- concept: Pixel Shuffle / VisionPooler
  desc: Llama4/InternVL 通过 4D 张量重排实现空间压缩；Gemma4V 通过 2D 平均池化减少 token 数量
- concept: M-RoPE (Multi-dim RoPE)
  desc: Qwen2-VL/Qwen3-VL/YouTuVL/PaddleOCR 使用的 4 维位置编码，分别处理 H/W 方向，支持动态高宽比
- concept: 2D-RoPE (Interleaved/NeoX)
  desc: Gemma4V/Llama4/Kimi 系列使用的二维旋转位置编码，采用 NeoX 或交错模式处理块级空间关系
- concept: Resampler / Perceiver
  desc: MiniCPM-V 和 HunyuanOCR 使用的可学习查询机制，通过交叉注意力将变长视觉特征压缩为固定长度
- concept: Window Attention
  desc: Qwen2-VL、DeepSeek-OCR、YouTuVL 的局部窗口注意力机制，通过 window_partition/unpartition 降低长序列计算量
- concept: DeepStack
  desc: Qwen3-VL 的多层特征融合技术，在特定层提取中间特征并沿通道维度拼接，增强多尺度感知
- concept: Special Tokens (IMG_BREAK/BOI/EOI/Newline)
  desc: Pixtral 的图像行分隔符、CogVLM/GLM-Edge 的 Begin/End 标记、HunyuanOCR 的行尾换行符，保留二维空间结构
- concept: SAM+CLIP 双塔
  desc: DeepSeek-OCR 同时使用 SAM（窗口注意力+相对位置）提取局部细节和 CLIP（标准 ViT）提取全局语义特征
- concept: Relative Position Encoding
  desc: Conformer 和 DeepSeek-OCR 使用的相对位置编码（get_rel_pos），支持双线性插值，替代绝对位置嵌入
- concept: MobileNetV5 Blocks
  desc: Gemma3n 使用的轻量化块：Edge Residual（边缘扩张）、Inverted Residual（倒残差/深度可分离）、Multi-Query
    Attention（MQA）
- concept: MSFA (Multi-Scale Fusion Adapter)
  desc: MobileNetV5 的多尺度特征融合模块，收集 Stage 2/3 特征，通过最近邻上采样拼接，再池化到目标分辨率
- concept: 3D Position Embedding
  desc: Kimi-K2.5 使用的三维位置编码（[C,H,W]），支持双三次插值缩放（resize_position_embeddings_3d）适配动态分辨率
- concept: Clippable Linear
  desc: Gemma4V 的可逆线性层（build_mm），通过输入/输出钳制（clamp）防止数值溢出，提升数值稳定性
- concept: Whisper Conv1D Subsampling
  desc: Whisper 编码器的双层 1D 卷积（GELU_ERF 激活），将音频帧序列下采样 2 倍，支持多种自定义投影器
- concept: Conformer Block
  desc: 结合双 FFN（1/2 残差缩放）、相对位置自注意力（RelPos MHSA）和卷积模块（GLU+SSM Conv）的复合结构
- concept: Vision Feature Layer / Embedding Stack
  desc: LLaVA 系列支持从 ViT 中间层提取特征并通过 embedding_stack 拼接，保留多尺度抽象信息
