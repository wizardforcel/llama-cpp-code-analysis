  name: 音频编码器 —— Whisper 与 Conformer 的「声波雕刻师」
  'no': 11
  points:
  - '**Whisper 的预处理与投影器家族**'
  - '- 双 Conv1D 层：第一层 1D 卷积（padding=1）+ GELU_ERF，第二层 stride=2 下采样'
  - '- 位置嵌入选取：通过 `ggml_view_2d` 只取前 `n_pos` 个位置（n_frames/2），适配下采样后的长度'
  - '- 多投影器适配：Ultravox（SwiGLU+双层 RMS 归一化）、Qwen2A（纯线性+Bias）、Voxtral/MusicFlamingo（GELU_ERF
    FFN）、GLMA（LayerNorm+堆叠+BOI/EOI）'
  - '- Frame Stacking：`build_stack` 支持将多帧映射到单 token，用于进一步降采样'
  - ''
  - '**Conformer 的复合块结构**'
  - '- 前置卷积子采样：6 层卷积堆叠（Conv2D → ReLU → Depthwise Conv → Conv2D → ReLU → Depthwise
    Conv），实现高频特征压缩'
  - '- 相对位置自注意力（RelPos）：Q_bias_u/v 双偏置向量，`matrix_ac`（内容位置）+ `matrix_bd`（相对位置）分离计算后相加，支持长序列建模'
  - '- 卷积模块：Pointwise Conv → GLU（sigmoid 门控线性单元）→ SSM Conv（`ggml_ssm_conv`）→ Pointwise
    Conv，捕获局部时序特征'
  - '- 1/2 残差缩放：FFN 输出乘以 0.5 因子后与残差相加，稳定深层网络训练'
  - '- 音频适配器：最终通过 LayerNorm + GELU FFN 投影到 LLM 嵌入空间'
