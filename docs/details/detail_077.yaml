  name: MobileNetV5 与轻量化设计 —— 移动端的「节能先锋」
  'no': 8
  points:
  - '**三级残差块体系**'
  - '- **Edge Residual**：3x3 扩张卷积（SAME Padding）+ 1x1 点卷积，适合浅层特征提取与下采样'
  - '- **Inverted Residual**：深度可分离卷积（DW-Mid，stride 可选 2）+ 点卷积扩展（PW-Exp，1x1），平衡感受野与计算量'
  - '- **Multi-Query Attention (MQA)**：K/V 单头下采样（stride=2），Q 多头全分辨率，显著降低注意力计算量'
  - ''
  - '**MSFA 多尺度融合适配器**'
  - '- 特征收集：在 Stage 2 和 Stage 3 结束处收集中间特征（`intermediate_features`）'
  - '- 上采样对齐：使用 `ggml_upscale`（NEAREST 模式）将低分辨率特征放大到高分辨率对齐'
  - '- 通道融合：拼接后通过 1x1 卷积压缩（`msfa_ffn_expand/project_w`），平均池化到目标 16x16 分辨率'
  - ''
  - '**RMSNorm 2D 与 SAME Padding**'
  - '- `rms_norm_2d`：对 4D 特征图 [W,H,C,B] 进行通道维度（dim 2）的 RMS 归一化'
  - '- `pad_same_2d`：实现 TensorFlow 风格的 SAME Padding，支持非对称填充，确保卷积输出尺寸符合预期'
