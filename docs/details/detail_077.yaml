  - '- `tools/mtmd/models/qwen2vl.cpp` 的 `window_idx` / `inv_window_idx` 基于 `ggml_get_rows`
    的方案'
  - '- `tools/mtmd/models/deepseekocr.cpp` 的 `window_partition()` / `window_unpartition()`（reshape/permute
    方案）'
  - '- `tools/mtmd/models/youtuvl.cpp` 的线性搜索缩放与窗口注意力组合'
  - 深度思考：
  - 1. DeepSeek-OCR 的 `get_rel_pos` 中为什么需要对相对位置表进行双线性插值（BILINEAR 模式）？
  - 2. Qwen2-VL 中当 `flash_attn_type == CLIP_FLASH_ATTN_TYPE_ENABLED` 时，为什么 window_mask
    需要转为 F16 类型？
  - 3. 计算窗口大小为 14、图像 patch 数为 1024 时，注意力计算复杂度从 O(N^2) 降低到多少？
  - 4. DeepSeek-OCR 中 SAM（局部细节）和 CLIP（全局语义）特征如何在通道维度拼接（`ggml_concat(..., dim=0)`）？
