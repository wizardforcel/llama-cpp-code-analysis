exercises:
- contents:
  - 阅读 `tools/llama-bench/llama-bench.cpp` 第253-285行的 `parse_int_range()` 函数。
  - 回答以下问题：
  - '- 正则表达式 `^(\d+)(?:(\d+)(?:([\+|\*])(\d+))?)?(?:,|$)` 中每个捕获组（group）分别代表什么？'
  - '- 当输入为 `512-2048+512` 时，各捕获组的匹配结果是什么？'
  - '- 为什么要在循环中检查 `i <= prev_i`？这防御了什么类型的错误输入？'
  - '- 如果用户输入 `1-10*2,15,20-30+5`，输出结果是什么？'
  'no': 1
  title: 分析 parse_int_range 的正则表达式
- contents:
  - 阅读 `tools/llama-bench/llama-bench.cpp` 中的 printer 继承体系（1710-1982行）。
  - 回答以下问题：
  - '- `escape_csv()` 和 `escape_json()` 分别处理了哪些特殊字符？为什么 JSON 需要处理 ≤ 0x1f 的控制字符而 CSV
    不需要？'
  - '- `markdown_printer::print_header()` 中的字段过滤逻辑（对比默认值）如何减少输出噪音？用 `n_gpu_layers`
    举例说明。'
  - '- `sql_printer::get_sql_field_type()` 将哪些 C++ 类型映射为 `REAL`？为什么 `avg_ts` 是 FLOAT
    而 `avg_ns` 是 INT？'
  - '- 如果 `cmd_params.output_format = JSON` 但 `output_format_stderr = CSV`，运行一次测试会输出几个文件/流？内容有何不同？'
  'no': 2
  title: 对比 printer 各子类的输出差异
- contents:
  - 阅读 `tools/llama-bench/llama-bench.cpp` 的 `main()` 函数（2068-2233行）和 `test` 类（1520-1698行）。
  - 以 `llama-bench -m model.gguf -p 512 -n 128` 为例，追踪以下数据流向：
  - 1. 命令行参数 `512,128` 如何流入 `cmd_params` 的 `n_prompt` 和 `n_gen` 字段？
  - 2. `get_cmd_params_instances()` 如何将其展开为 `cmd_params_instance`？（简述嵌套循环的排列逻辑）
  - 3. `cmd_params_instance.to_llama_cparams()` 设置了哪些关键值？`cparams.n_ctx` 是如何计算的？
  - 4. `test` 构造函数从 `inst` 和 `lmodel` 中提取了哪些信息？`get_ts()` 的数学公式是什么？
  - 5. `samples_ns` 在循环中被 `t_ns` 填充了 `reps` 次。若 `reps=5`，`avg_ts()` 返回什么？
  'no': 3
  title: 追踪 llama-bench 单次测试的完整数据流
- contents:
  - 阅读 `tools/batched-bench/batched-bench.cpp` 的 `main()` 函数（19-223行），重点分析 PP 阶段。
  - 回答以下问题：
  - '- 当 `is_pp_shared=true` 且 `kv_unified=false` 时，代码执行了哪三步来完成 KV 共享？（提示：decode →
    seq_cp → dummy token）'
  - '- 为什么需要「dummy token」？`llama_memory_seq_rm(mem, 0, pp, -1)` 这行代码的作用是什么？'
  - '- `speed_pp` 和 `speed_tg` 的计算公式有何不同？为什么 `is_pp_shared=true` 时分子是 `pp` 而不是 `pl*pp`？'
  - '- 若 `pp=512, tg=128, pl=4`，且 `is_pp_shared=true`，`n_ctx_req` 如何计算？何时会触发 `continue`
    跳过测试？'
  'no': 4
  title: 理解 batched-bench 的共享前缀优化
- contents:
  - 阅读 `tools/perplexity/perplexity.cpp` 的 `process_logits()`（v1版本，90-121行）和 `perplexity()`
    主函数（560-700行）。
  - 回答以下问题：
  - '- `process_logits()` 中 `std::mutex` 保护的 `counter` 变量起什么作用？为什么使用 `std::unique_lock`
    而非 `std::lock_guard`？'
  - '- `local_nll` 和 `local_nll2` 为何先在线程局部累加，最后才一次性加到全局 `nll`/`nll2`？这种设计叫什么模式？'
  - '- `perplexity()` 中 `first = n_ctx / 2` 的含义是什么？为什么只计算后半部分的 log-likelihood？'
  - '- 若 `n_ctx=512, n_batch=2048`，则 `n_seq` 是多少？一次循环最多并行处理几个序列？'
  'no': 5
  title: 分析 perplexity 的多线程 NLL 计算
- contents:
  - 阅读 `tools/perplexity/perplexity.cpp` 的 `log_softmax()`（349-395行）和 `kl_divergence()`（713-803行）。
  - 回答以下问题：
  - '- `kl_divergence_result` 结构体中，`sum_kld`、`sum_p_diff`、`sum_p_diff2`、`sum_p_diff4`
    分别代表什么统计量？'
  - '- 为何 `base_log_prob` 使用 `uint16_t` 存储而非 `float`？`scale` 和 `min_log_prob` 的编码原理是什么？'
  - '- `n_same_top` 计数的是什么事件？它与模型的 top-1 accuracy 有何异同？'
  - '- `imax` 和 `imax_base` 分别代表什么？若 `imax == imax_base` 但 `p_diff` 很大，说明什么问题？'
  'no': 6
  title: 解读 KL 散度的多维度统计指标
- contents:
  - 基于你对 HellaSwag（776-1000行）和 Winogrande（280-424行）的理解，设计一个「4选1古诗词接龙」评估任务的伪代码框架。
  - 要求实现以下功能点：
  - '- 加载任务数据（每题4个选项，1个正确）'
  - '- 计算 common_prefix 以优化共享计算'
  - '- 使用 `decode_helper()` 进行批量推理'
  - '- 使用 `compute_logprobs()` 或 `eval_pairs` 计算各选项得分'
  - '- 输出准确率及95%置信区间'
  - 无需写完整代码，但需要标注关键函数调用点和数据结构流转伪代码。
