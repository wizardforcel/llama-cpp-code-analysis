  name: batched-bench 多序列批量解码测试 —— 并发推理的「交通流量模拟器」
  'no': 3
  points:
  - '**三维参数空间的枚举**'
  - '- n_pp（prompt 长度）、n_tg（生成长度）、n_pl（并行序列数）三重循环'
  - '- n_ctx_req 计算：考虑 is_pp_shared 时，prompt 阶段只需一份 KV，但根据 kv_unified 策略可能需 pl * pp'
  - '- 超出 n_kv_max 的组合自动跳过'
  - '**PP 阶段的共享前缀优化**'
  - '- is_pp_shared = true：只 decode 一次 prompt（seq_id = 0），然后通过 llama_memory_seq_cp
    复制到其他序列'
  - '- 若 kv_unified = false，需运行一次 dummy token 触发复制生效，再删除临时 token'
  - '- 大幅降低多序列相同前缀场景的计算量'
  - '**TG 阶段的两种调度模式**'
  - '- is_tg_separate = true：每个序列独立生成（seq0 完成 tg 次、seq1 完成 tg 次……）'
  - '- is_tg_separate = false：所有序列交错生成（每次 batch 包含所有序列的一步）'
  - '- 后者更接近真实并发场景，前者便于逐序列分析'
  - '**decode_helper() 的批量拆分与同步**'
  - '- 将大 batch 按 n_batch 拆分为多个小 batch_view'
  - '- synchronize 参数控制是否在每批后调用 llama_synchronize()（影响吞吐与延迟测量）'
  - '**性能指标计算**'
  - '- t_pp：prompt 处理耗时，速度 = (is_pp_shared ? pp : pl*pp) / t_pp'
  - '- t_tg：生成耗时，速度 = pl * tg / t_tg'
  - '- 总速度考虑共享与非共享的不同分子'
  - '- 输出表格（Markdown 风格）或 JSONL'
