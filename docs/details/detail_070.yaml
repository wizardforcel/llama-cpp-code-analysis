- concept: parse_int_range()
  desc: 支持 first-last、first-last+step、first-last*mult 的正则范围解析器
- concept: get_cmd_params_instances()
  desc: 笛卡尔积展开生成所有测试实例，智能排序减少模型重载
- concept: cmd_params_instance.to_llama_mparams/cparams
  desc: 将内部表示转换为llama模型/上下文参数，桥接CLI与推理引擎
- concept: test class
  desc: 性能数据封装：元数据 + samples_ns + 统计方法（avg_ts/stdev_ts）
- concept: printer继承体系
  desc: 策略模式：csv/json/jsonl/markdown/sql五种输出格式的统一抽象
- concept: escape_csv / escape_json
  desc: 特殊字符转义函数，确保输出格式正确性
- concept: test_prompt()
  desc: Prompt处理基准：批量推理+同步计时，可指定BOS首token
- concept: test_gen()
  desc: 文本生成基准：逐token循环解码，每次同步确保精度
- concept: fit_target / llama_params_fit()
  desc: 自动内存适配模式，根据设备内存计算最优ngl/tensor_split
- concept: ctx_state
  desc: KV缓存快照结构，实现跨测试的depth上下文复用
- concept: batched-bench三维枚举
  desc: npp×ntg×npl三重循环，系统性探索批处理参数空间
- concept: is_pp_shared / kv_unified
  desc: 共享前缀优化：只计算一次prompt，通过KV复制到多序列
- concept: is_tg_separate
  desc: 独立生成模式：逐序列完成所有token，便于单序列性能分析
- concept: llama_memory_seq_cp()
  desc: KV缓存序列复制，实现共享前缀的高效分发
- concept: decode_helper()
  desc: 批量拆分辅助：大batch按n_batch拆分+选择性同步
- concept: process_logits（v1/v2/kld）
  desc: 多线程NLL/KLD计算：mutex保护counter分摊任务，累加nll/nll2/kld
- concept: log_softmax+uint16
  desc: log概率量化存储：scale+min_log_prob编码，支持KL对比
- concept: kl_divergence_result
  desc: KL散度统计聚合：sum_kld/sum_p_diff矩/top-1一致率
- concept: hellaswag_score()
  desc: 4选项常识推理：common_prefix共享+批量构造+acc_norm评分
- concept: winogrande_score()
  desc: 2选项推理：CSV解析+choice跳过+批量评分+置信区间
- concept: multiple_choice_score()
  desc: N选项学术评测：任务反序列化+多线程准备+label匹配
- concept: compute_logprobs()
  desc: 统一logprob引擎：多线程分块+atomic取任务
- concept: common_prefix优化
  desc: 多序列共享前缀只计算一次logits，大幅降低评估成本
- concept: eval_pairs
  desc: (logits_offset, target_token)对，精确指定需计算的logprob位置
- concept: results nmse()
  desc: 归一化均方误差：Σ(a-b)²/Σ(a²)，阈值1e-6判定一致性
- concept: GGUF持久化
  desc: tokens+I32 + logits+F32 → GGUF格式，支持check模式验证
- concept: mean_and_uncertainty()
  desc: 统计计算：sum/n, sqrt(sum2/n - mean²)/(n-1)
- concept: covariance()
  desc: 协方差计算：(sum_xy - sum_x*sum_y/n) / (n-1)
- concept: create_printer()
  desc: 工厂函数：根据output_format枚举创建对应printer子类实例
- concept: devices_to_string() / parse_devices_arg()
  desc: 设备列表双向转换：字符串 ↔ ggml_backend_dev_t向量
- concept: print_usage()
  desc: 帮助信息打印：列出所有支持的命令行参数及默认值
- concept: perplexity main()
  desc: 命令行入口：解析参数、初始化模型、分发到各种评估模式
- concept: KL divergence file format
  desc: 二进制格式：_logits_魔数+n_ctx+n_vocab+n_chunk+tokens+量化的log_probs
