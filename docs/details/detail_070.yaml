learning_targets:
- 理解 llama-bench 参数体系：cmd_params 与 cmd_params_instance 的双层分离设计
- 掌握 parse_int_range 的正则范围解析（first-last、+step、*mult）
- 理解 get_cmd_params_instances 的笛卡尔积展开与智能排序策略
- 掌握 test 类如何封装性能数据（samples_ns、avg_ts、stdev_ts）
- 理解 printer 继承体系的策略模式：csv/json/jsonl/markdown/sql 五种输出
- 掌握 test_prompt 与 test_gen 的预热、batch 拆分与同步机制
- 理解 fit_target 模式如何通过 llama_params_fit 实现自动内存适配
- 掌握 llama-bench 的 KV 缓存复用与 context depth 管理
- 理解 batched-bench 三维参数空间枚举（npp/ntg/npl）与 PP/TG 阶段分离计时
- 掌握 perplexity 的块处理、多线程 log_softmax 计算与统计（NLL/NLL2）
- 理解 perplexity_v2 的 stride 滑窗机制与逐token PPL 计算
- 掌握 KL 散度计算：基线logits对比、top-1一致率、概率差值矩统计
- 理解 HellaSwag/Winogrande 的公共前缀优化、批量构造与 acc_norm 评分
- 掌握 multiple_choice（ARC/MMLU/TruthfulQA）的任务反序列化与批量评分
- 理解 results 工具的 NMSE 验证、GGUF 持久化与数字指纹概念
- 掌握 perplexity main() 的命令行解析与评估模式分发逻辑
- 能阅读并分析性能评估工具的参数解析、批处理、计时、输出全链路
life_analogy:
- 想象性能评估工具链是一座**精密钟表匠工坊**：
- '- **llama-bench** = 钟表匠手中的**精密测时仪**，用统一的标准测量不同「机芯」（模型/配置）的转速'
- '  - **cmd_params** = 试验配方清单（如「测试温度从-20°C到+50°C，每5°C一档」）'
- '  - **cmd_params_instance** = 单次实验的精确设置卡（温度=25°C，湿度=45%）'
- '  - **get_cmd_params_instances()** = 按配方清单排列组合，生成所有试管的分配方案'
- '  - **parse_int_range()** = 能快速写出「1-10, 12-20+2, 100-1000*10」的速记员'
- '  - **printer家族** = 不同语言的记录员（CSV会计、JSON翻译、Markdown排版、SQL档案员）'
- '  - **test_prompt/test_gen** = 标准动作测试员（上发条看转速 vs 摘下发条看惯性）'
- '- **batched-bench** = **多车道高速 traffic simulator**，同时安排多辆车在不同车道测试通行效率'
- '  - **PP阶段** = 车辆进入收费站加速过程（共享入口=多车道共用一个闸机）'
- '  - **TG阶段** = 车辆在高速上持续巡航（独立巡航 vs 编队巡航）'
- '- **perplexity** = **品酒师盲品会**，不知酒名（token）品尝味道（概率），评估一致性'
- '  - **perplexity_v2** = 快速小口品鉴（stride大步长）而非一饮而尽'
- '  - **KL散度** = 两位品酒师对同一瓶酒打分差异的量化'
- '- **HellaSwag/Winogrande** = **多选题快判官**，先看问题主干（common_prefix）一次，然后快速翻看多个选项打分'
- '- **results** = **指纹比对仪**，将本次「签名」（logits）与档案指纹（.bin）对比，差异超过阈值即报警'
- 正如钟表匠不会用同一把钥匙开所有锁，评估工具也根据不同场景（吞吐/延迟/精度/一致性）选择不同的测量策略和精度标准。
