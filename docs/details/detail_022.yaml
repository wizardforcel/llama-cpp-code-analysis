learning_targets:
- 理解控制向量（cvec）与 LoRA 适配器的数据结构设计及其在 GGML 计算图中的注入方式
- 掌握 llama_adapter_cvec 的 init / apply / apply_to 三阶段生命周期管理，包括按后端类型的懒分配策略
- 深入理解 LoRA 适配器的 GGUF 加载流水线、元数据校验、A/B 张量配对与形状校验
- 熟悉 LoRA 适配器的元数据查询接口、释放机制以及 aLoRA 调用 Token 的获取方法
- 掌握 llm_chat_template 枚举体系中 50+ 内置模板的分类与命名规范
- 理解 llm_chat_apply_template 如何通过手写分支渲染不同模板，避免 Jinja 解析的开销
- 掌握 llm_chat_detect_template 基于字符串指纹的启发式检测算法与降级策略
- 能阅读并修改自定义聊天模板与适配器数据流
life_analogy:
- 想象你是一位 **乐师**，正在为不同 LLM「调音」：
- '- **控制向量（cvec）** = 给每根琴弦（每层）单独贴一张「力度标签」，让音色整体偏移'
- '    - 标签存在仓库（ggml_context）的某个货架（backend buffer）上'
- '    - 第 0 层「不允许贴标签」（tensors[0]=nullptr），是协议约定的「保护层」'
- '    - 需要改变音色时只需更换标签内容（apply 重新写入），无需重买琴弦（重新训练）'
- '- **LoRA 适配器** = 一对可拆卸的「效果器踏板」'
- '    - A 踏板负责「升维」（rank × in_dim），B 踏板负责「降维」（out_dim × rank）'
- '    - `alpha/rank` 是效果器上的「强度旋钮」，决定信号放大倍数'
- '    - 多个踏板可以同时踩下（loras map），每个力度独立可调（float 缩放）'
- '- **aLoRA** = 「延迟触发踏板」，必须先听到特定乐句（invocation tokens）才激活'
- '- **GGUF 加载流程** = 「拆箱验货」流水线'
- '    - 检查外箱标签（general.type=adapter, adapter.type=lora）'
- '    - 验证物品型号（adapter.arch == model.arch）'
- '    - 把 A、B 两件物品成对摆上对应货架（按 buft 分配缓冲区）'
- '    - 读出物品清单（metadata）贴到档案柜（gguf_kv）'
- '- **聊天模板** = 不同餐厅的「点菜规矩」'
- '    - 通用 API 只接受「前菜/主菜/甜点」（system/user/assistant）'
- '    - 模板负责翻译成特定餐厅的暗语（ChatML / Llama-2 / Mistral 等）'
- '    - `llm_chat_detect_template` 像「侦探」看几眼菜单就猜出餐厅风格'
- '- **模板自动检测** = 看菜单里有没有「<|im_start|>」（ChatML 指纹）、「[INST]」（Mistral 指纹）等关键词'
- '- **UNKNOWN 模板** = 「这家餐厅太奇怪了，菜单读不懂」，提醒上层兜底'
'no': 21
summary:
- concept: '`llama_adapter_cvec`'
  desc: 控制向量，每层一个 F32 张量，通过 `ggml_add` 注入残差流，第 0 层永远为 nullptr
- concept: '`llama_adapter_cvec::init`'
  desc: 按后端缓冲区类型懒分配 ggml_context，统一清零初始状态
- concept: '`llama_adapter_cvec::apply`'
  desc: data==nullptr 即禁用，否则按层号偏移写入方向向量
- concept: '`llama_adapter_lora_weight`'
  desc: A 升维 + B 降维，get_scale 自动推导 `alpha*adapter_scale/rank`
- concept: '`llama_adapter_lora::ab_map`'
  desc: 张量名→A/B 对的哈希表，去除 .lora_a/.lora_b 后缀做 key
- concept: '`llama_adapter_lora::gguf_kv`'
  desc: 缓存 GGUF 元数据，供对外查询接口读取
- concept: '`llama_adapter_lora::alora_invocation_tokens`'
  desc: aLoRA 触发序列，必须是 uint32 token 数组
- concept: '`llama_adapter_lora_init_impl`'
  desc: 七步流水线：打开→校验→配对→校验形状→分配→回填→注册
- concept: '`llama_adapter_lora_init`'
  desc: 异常安全的入口，try/catch 失败时 delete 返回 nullptr
- concept: '`buft_extra` 兜底'
  desc: LoRA 落到 repacking buffer 时回退到 CPU，避免布局冲突
- concept: '`token_embd` 形状翻转'
  desc: 因 `llm_build_inp_embd` 会转置，A/B 维度与基础模型相反
- concept: '`_norm.weight` 忽略'
  desc: LoRA-norm 暂不支持，向下兼容旧模型
- concept: '`llama_adapter_lora_free`'
  desc: 先从 model.loras 擦除，再 delete，避免悬空指针
- concept: '`llama_adapter_meta_*` 接口'
  desc: 对称于模型元数据查询：单值 / 按索引 / 计数
- concept: '`llm_chat_template` 枚举'
  desc: 50+ 内置模板，覆盖主流 LLM 的对话格式
- concept: '`LLM_CHAT_TEMPLATES` map'
  desc: O(log n) 字符串→枚举查找，未命中抛异常
- concept: '`llm_chat_apply_template`'
  desc: 不用 Jinja，手写 50+ 分支渲染器，效率高但维护成本高
- concept: '`llm_chat_detect_template`'
  desc: 基于特征子串的启发式检测（ChatML/Mistral/Llama-2/Gemma 等）
- concept: '`LU8` 宏'
  desc: 兼容 C++17 的 u8 字面量，保证 UTF-8 字符串字面量
- concept: '`UNKNOWN` 兜底'
  desc: 检测不到时返回 UNKNOWN，应用层再回退到 Jinja 解析
- concept: '`llama_chat_builtin_templates`'
  desc: 对外暴露模板名清单，支持客户端枚举可用模板
