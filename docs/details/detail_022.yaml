  name: 聊天模板系统 —— LLM 的「对话礼仪教材」
  'no': 6
  points:
  - '**为什么需要聊天模板？**'
  - '- 每个 LLM 都期望特定格式的输入（特殊 token、角色标签、消息分隔符）'
  - '- 用户层只关心「system/user/assistant」三类消息，模板负责翻译成模型专属 prompt'
  - '**`llm_chat_template` 枚举：50+ 模板的大家庭**'
  - '- 从经典 ChatML、Llama-2、Mistral 到中英日韩各种地域化模板'
  - '- 包括 `LLM_CHAT_TEMPLATE_UNKNOWN` 作为降级选项'
  - '- 中文字符用 `LU8(x)` 宏保证 C++20 之前的 UTF-8 兼容性'
  - '**模板名 → 枚举：`llm_chat_template_from_str`**'
  - '- 用 `std::map` 实现 O(log n) 查找（而非 unordered_map，因为数据量小）'
  - '- `LLM_CHAT_TEMPLATES.at(name)` 找不到即抛 `out_of_range`'
  - '**`llm_chat_apply_template`：手写 50+ 模板渲染器**'
  - '- 不用 Jinja 解析，效率高但维护成本也高'
  - '- 严格按枚举分支，匹配到 `UNKNOWN` 返回 `-1` 提示不支持'
  - '- `add_ass` 决定是否追加 assistant 引导 token'
  - '- 对没有 system 角色的模型（Gemma），会把 system 合并到 user 第一条'
  - '- 对带工具调用的模型（EXAONE-4、Granite-4）增加了 `tool` 角色分支'
  - '**辅助工具：`trim()` 与 `LU8()`**'
  - '- `trim()` 去除字符串首尾空白，被多个模板调用'
  - '- `LU8()` 跨 C++ 标准地保证 UTF-8 字符串字面量'
