  name: LoRA 适配器权重对 —— A/B 张量的「双人舞」
  'no': 2
  points:
  - '**`llama_adapter_lora_weight`：A 升维 + B 降维**'
  - '- 标准的 LoRA 形式：`W'' = W + alpha/r * (B @ A)`'
  - '- `a` 张量形状 `(rank, in_dim)`，`b` 张量形状 `(out_dim, rank)`'
  - '- `get_scale()` 自动推导真实缩放因子：`alpha * adapter_scale / rank`'
  - '- 当 `alpha == 0` 时退化为纯 `adapter_scale`，兼容老旧 LoRA 写法'
  - '- 默认构造函数 `llama_adapter_lora_weight()` 用于在 ab_map 中先占位'
  - '- 双参构造器 `llama_adapter_lora_weight(a, b)` 用于一次性创建 A/B 对'
  - '**`llama_adapter_lora`：适配器外壳与模型绑定**'
  - '- 通过构造函数 `llama_adapter_lora(model)` 绑定到具体 `llama_model *`'
  - '- 默认析构函数 `~llama_adapter_lora()` 自动清理 `ab_map` 与 `ctxs`'
  - '- `ab_map`：用张量名（去掉 `.lora_a`/`.lora_b` 后缀）做 key'
  - '- `gguf_kv`：缓存 GGUF 元数据供 `llama_adapter_meta_*` 系列查询'
  - '- `alora_invocation_tokens`：支持 activated LoRA（aLoRA）的触发 token 序列'
  - '- `get_n_nodes()` 估算图节点数：每个 LoRA 对占 6 个节点（a/b/scale/add + 2*mul_mat）'
  - '- `get_weight(w)` 通过基础模型张量指针反查对应的 LoRA A/B 对'
  - '**类型定义：`llama_adapter_loras` 是带缩放的集合**'
  - '- `std::unordered_map<llama_adapter_lora*, float>`：键是适配器，值是它的缩放系数'
  - '- `llama_adapter_loras_ptr` 用 `unique_ptr` 封装，支持上下文独占持有'
