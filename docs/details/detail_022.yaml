  name: 模板自动检测 —— 看一眼字符串猜你是谁
  'no': 7
  points:
  - '**为什么需要自动检测？**'
  - '- GGUF 中可能只存了原始 Jinja 字符串，需要识别出对应的内置枚举'
  - '- 不同模型的模板字符串千差万别，但都有「指纹」特征'
  - '**`llm_chat_detect_template`：字符串指纹匹配**'
  - '- 先尝试精确名字匹配（`llm_chat_template_from_str`）'
  - '- 失败后用 `tmpl_contains` 在字符串中搜索特征子串'
  - '- **ChatML 系**：通过 `<|im_start|>` 识别，区分 PHI-4（带 `<|im_sep|>`）和 SmolVLM（带 `<end_of_utterance>`）'
  - '- **Mistral 系**：先判 `[INST]` 前缀，再区分 v7（带 `[SYSTEM_PROMPT]`）、v1（带单引号）、v3-tekken（带双引号）'
  - '- **Llama-2 系**：根据 `<<SYS>>`、`bos_token + ''[INST]``、`content.strip()` 三个特征细分四种变体'
  - '- **Gemma**：用 `<start_of_turn>` 唯一识别'
  - '- **DeepSeek-3 / Hunyuan**：利用中文特殊 token `<｜...|>`'
  - '- **Yandex**：通过俄语 `Ассистент:` 标识'
  - '**最后的降级**：所有特征都不匹配则返回 `LLM_CHAT_TEMPLATE_UNKNOWN`'
  - 这是「软启发式」的典型实践：宁可错漏也别阻塞，由上层再做兜底
