  name: 控制向量适配器 —— 模型行为的「隐形调音台」
  'no': 1
  points:
  - '**为什么需要 `llama_adapter_cvec`？**'
  - '- 让用户通过加在残差流上的方向向量「微调」模型行为，无需重新训练'
  - '- 每一个 transformer 层（除第 0 层）都可以拥有一个独立的 `n_embd` 长度 F32 张量'
  - '- 通过 `ggml_add` 在 `apply_to` 阶段注入到计算图中'
  - '- `tensor_for()` 通过层号边界检查决定是否激活，是「按需启用」的关键'
  - '**`init()` 的精髓：按缓冲区类型分配上下文**'
  - '- 用 `std::map<buft, ctx*>` 聚合，避免重复创建 ggml_context'
  - '- `ctx_for_buft` lambda 实现懒分配：第一次遇到某后端类型时初始化'
  - '- `no_alloc=true` 让 ggml 推迟内存分配到 buffer 阶段'
  - '- `tensors[0]` 永远为 `nullptr`，因为「第 0 层不应用控制向量」是协议约定'
  - '- 用 `ggml_backend_alloc_ctx_tensors_from_buft` 按后端类型一次性分配缓冲区'
  - '- `ggml_backend_buffer_clear(buf, 0)` 把内存清零，初始为「无影响」状态'
  - '**`apply_to()` 在计算图上注入方向向量**'
  - '- 由构图阶段调用，把控制向量张量通过 `ggml_add` 加到残差流节点上'
  - '- 第 0 层 `tensor_for(0) == nullptr` 会直接跳过 `ggml_add` 调用'
  - '**`apply()` 的双模式：传入 nullptr 即禁用**'
  - '- 校验 `n_embd` 与模型 `hparams.n_embd` 是否一致'
  - '- 通过 `layer_start` / `layer_end` 控制作用区间'
