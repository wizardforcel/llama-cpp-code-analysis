exercises:
- contents:
  - 阅读 `src/llama-adapter.cpp` 第 1-120 行（`llama_adapter_cvec` 全部实现），理解：
  - 1. `init()` 中的 `ctx_for_buft` lambda 是如何实现「按后端类型懒分配」的？
  - 2. 为什么 `tensors[0]` 必须是 `nullptr`？
  - 3. `apply()` 中传入 `data == nullptr` 的语义是什么？
  - 4. 第 il 层的张量数据在输入缓冲区中的偏移量是多少？为什么是这个公式？
  - 回答问题：
  - '- `ggml_backend_buffer_clear(buf, 0)` 的作用是什么？'
  - '- 为什么 `init()` 使用 `no_alloc=true` 而在最后才 `alloc_ctx_tensors_from_buft`？'
  - '- 如果模型有 32 层，`ctxs` 和 `bufs` 最多可能有多少个元素？'
  'no': 1
  title: 阅读控制向量适配器实现
- contents:
  - 阅读 `src/llama-adapter.cpp` 第 144-330 行（`llama_adapter_lora_init_impl`），按顺序梳理：
  - 1. **元数据校验阶段**：检查了哪些键？`general.type`、`adapter.type`、`adapter.lora.alpha` 分别是什么含义？
  - 2. **aLoRA 解析阶段**：`adapter.alora.invocation_tokens` 的 GGUF 类型约束是什么？数组元素类型是什么？
  - 3. **A/B 张量配对阶段**：使用什么函数判断后缀？`_norm.weight` 为什么被 `continue`？
  - 4. **形状校验阶段**：`token_embd.weight` 的校验为什么与其他张量相反？
  - 5. **buft_extra 兜底阶段**：什么情况下 LoRA 需要回退到 CPU？
  - 6. **缓冲区分配阶段**：为什么按 buft 分配而不是按张量分配？
  - 7. **数据回填阶段**：`llama_file` + `gguf_get_data_offset` 是如何精确定位张量数据的？
  - 回答问题：
  - '- 如果 LoRA 文件中存在未配对的 `.lora_a` 张量，会发生什么？'
  - '- 形状校验失败时抛出的错误信息对用户排查问题有什么帮助？'
  'no': 2
  title: 追踪 LoRA 加载的七步流水线
- contents:
  - 阅读 `src/llama-chat.cpp` 中 `llm_chat_apply_template` 函数（第 247 行起），对比以下三组模板：
  - 1. **ChatML / Llama-3 / DeepSeek-3**：它们各自用什么 token 包裹 user/assistant 消息？
  - 2. **Gemma / Orion / MiniCPM**：这三个模型都没有原生 `system` 角色，模板是如何处理 system 消息的？
  - 3. **Mistral-V7 / Mistral-V1 / Mistral-V3**：它们在 system 消息、turn 结构、尾部 token 上有何差异？
  - 回答问题：
  - '- `add_ass` 参数对哪些模板有实际意义？对哪些模板无效？'
  - '- `LLM_CHAT_TEMPLATE_UNKNOWN` 分支为什么返回 -1 而不是空字符串？'
  - '- 中文模板（DeepSeek-3 / Hunyuan / MiniCPM）如何利用 `LU8` 宏？'
  'no': 3
  title: 对比聊天模板分支
- contents:
  - 阅读 `src/llama-chat.cpp` 中 `llm_chat_detect_template` 函数（第 127 行起），理解其检测策略：
  - 1. 为什么要先尝试 `llm_chat_template_from_str` 精确匹配，失败后才进入启发式分支？
  - 2. ChatML 家族是如何通过 `<|im_sep|>` 和 `<end_of_utterance>` 区分 Phi-4 与 SmolVLM 的？
  - 3. Mistral 家族的四级分支（v7 / v1 / v3 / v3-tekken）的判定条件是什么？
  - 4. Llama-2 家族的四种变体（LLAMA_2 / SYS / SYS_BOS / SYS_STRIP）的判定顺序如何排列？
  - 回答问题：
  - '- 如果一个 GGUF 文件的模板字符串是空的，函数会返回什么？'
  - '- 启发式检测「宁可错漏也别阻塞」的设计哲学是如何体现的？'
