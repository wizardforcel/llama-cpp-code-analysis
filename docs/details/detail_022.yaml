  name: LoRA 加载流程 —— 从 GGUF 到张量的「拆箱流水线」
  'no': 3
  points:
  - '**入口：`llama_adapter_lora_init_impl` 的七步流水线**'
  - '- 用 `gguf_init_from_file(no_alloc=true)` 打开 GGUF 元数据'
  - '- **元数据校验**：检查 `general.type == adapter`、`adapter.type == lora`、`general.architecture`
    与基础模型一致'
  - '- 读取 `adapter.lora.alpha` 作为缩放因子'
  - '- 解析 aLoRA 的 `adapter.alora.invocation_tokens` 数组（必须是 `uint32` 数组）'
  - '- 遍历所有张量，按后缀缀 `lora_a` / `lora_b` 成对绑定到 `ab_map`'
  - '- **重要**：`_norm.weight` 被忽略（LoRA-norm 暂未支持，向下兼容旧模型）'
  - '- **关键约束**：必须是合法的 A/B 对，遇到其他后缀即抛异常'
  - '**设备感知的多缓冲区分配**'
  - '- 遍历 `ab_map`，按 `model.get_tensor(name)->buffer` 反查基础模型张量的后端类型'
  - '- `buft_extra` 列表：避免把 LoRA 放到 repacking 缓冲区，必要时回退到 CPU'
  - '- 通过 `ctx_for_buft` lambda 实现「按后端类型懒分配 ggml_context」'
  - '- **`token_embd` 的形状校验**：A/B 维度与基础模型相反（因为 `llm_build_inp_embd` 会转置）'
  - '- 其他张量的校验：A 的 `ne[0]`、`B` 的 `ne[1]` 必须与基础模型一致'
  - '- 用 `ggml_dup_tensor` 在目标设备的 context 中复制 A/B 结构'
  - '**数据回填与注册**'
  - '- 用 `llama_file` + 偏移直接定位到 GGUF 数据段，避免重新解析'
  - '- 对每个 A/B 对分别调用 `ggml_backend_tensor_set` 写入后端缓冲区'
  - '- 最后调用 `model.loras.insert(&adapter)` 把适配器注册到基础模型'
  - '**入口封装：异常安全的 `llama_adapter_lora_init`**'
  - '- try-catch 包裹整个加载过程'
  - '- 失败时 `delete adapter` 释放内存并返回 `nullptr`'
  - '- 上层调用方只需判断返回值是否为 `nullptr`'
