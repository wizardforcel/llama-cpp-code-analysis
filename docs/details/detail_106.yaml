exercises:
- contents:
  - 阅读 `tests/test-jinja.cpp` 第 2116-2123 行 `test_template()` 与第 1929-1960 行 `test_template_cpp()`。
  - 回答以下问题：
  - 1. `g_python_mode` 为 true 和 false 时，`test_template` 分别将测试委托给哪个函数？这种设计有何工程价值？
  - 2. `test_template_cpp` 中模板渲染的完整流水线包含哪几个关键步骤（提示：lexer → parser → runtime）？
  - 3. 如果要测试一个涉及浮点数精度边界的新特性，应该优先使用 `test_template_cpp` 还是 `test_template_py`？为什么？
  'no': 1
  title: 双轨测试机制解析
- contents:
  - 阅读 `tests/test-jinja.cpp` 第 94-119 行的 `test_whitespace_control()` 函数。
  - 构造以下测试场景并预测输出：
  - 1. 使用 `trim_blocks=true` 但模板中存在 `{% if true %}  \n  hello`（标签后有两个空格再换行）
  - '2. 使用 `{%- if true -%}` 但中间包含 `{# comment #}` 注释'
  - 3. 在 `for` 循环中使用 `loop.last` 并结合 `lstrip_blocks`
  - 思考问题：
  - '- `trim_blocks` 与 `lstrip_blocks` 同时开启时，对 `{% endfor %}\n` 的处理顺序是什么？'
  - '- 为什么需要同时测试 `{%- ... -%}` 和 `{{- ... -}}` 两种标记？'
  'no': 2
  title: 空白控制边界实验
- contents:
  - 阅读 `tests/test-jinja.cpp` 第 121-215 行的 `test_conditionals()` 函数。
  - 设计测试用例验证以下场景：
  - 1. `{% if [] %}`（空数组）、`{% if {} %}`（空对象）、`{% if '' %}`（空字符串）的 falsy 判定
  - 2. `a and b` 当 `a` 为 `undefined` 时的短路行为（是否报错）
  - 3. `0 == false` 与 `0 is eq(false)` 的区别
  - 4. 混合类型比较：`1 < '2'` 的结果（隐式转换或类型错误）
  - 思考问题：
  - '- 为什么 `is defined` 测试对模板健壮性至关重要？'
  - '- C++ 实现如何处理 Python 中 `None == None` 的语义？'
  'no': 3
  title: 真值表与短路求值验证
- contents:
  - 阅读 `tests/test-jinja.cpp` 第 339-499 行的 `test_filters()` 函数，重点关注 `tojson` 和 `indent`。
  - 完成以下实践任务：
  - 1. 构造一个包含中文、特殊字符和嵌套数组的字典，分别用 `tojson(ensure_ascii=true)` 和 `tojson(ensure_ascii=false)`
    输出，对比差异
  - 2. 使用 `sort(attribute='name')` 对对象数组排序，再用 `join(attribute='age')` 连接，观察键名不存在时的行为
  - 3. 测试 `indent(width='>>> ')` 对包含空行（`\n\n`）的多行文本的处理
  - 思考问题：
  - '- `tojson` 的 `separators` 参数与 `indent` 参数同时使用时，哪个优先级更高？'
  - '- 为什么 `upper` 过滤器可以递归处理数组和字典？'
  'no': 4
  title: 过滤器组合与 JSON 序列化陷阱
- contents:
  - 阅读 `tests/test-jinja.cpp` 第 570-590 行的 `test_macros()` 函数。
  - 编写宏实现以下功能并测试：
  - 1. 定义宏 `render_list(items, prefix='', suffix='')`，在循环中使用 `loop.first` 添加前缀
  - 2. 调用宏时使用乱序关键字参数：`render_list(suffix='>', items=[1,2], prefix='<')`
  - 3. 在宏内部使用 `namespace` 统计总字符数，并在宏外部访问该计数器
  - 思考问题：
  - '- 宏是否可以访问调用者上下文中的全局变量？这与 Python 函数的作用域规则有何异同？'
  - '- 如果宏的参数默认值是可变对象（如 `[]`），会发生什么？如何防御？'
  'no': 5
  title: 宏的高级参数传递与作用域
- contents:
  - 阅读 `tests/test-jinja.cpp` 第 2164-2395 行的 `test_fuzzing()` 函数及第 2429-2478 行的全局测试循环。
  - 基于 `random_string()` 和 `fuzz_test_template()` 的设计思路：
  - 1. 构造三个会导致模板解析深度嵌套的畸形输入（如 `{% if {% if ...` 或 `{{ 'a' * 10000 }}`）
  - 2. 测试对未定义值调用字符串方法（`undefined.upper()`）和数组方法的行为
  - 3. 分析 `fuzz_test_template` 中为什么捕获所有异常后返回 `true`（异常是否算测试通过）
  - 4. 查看 `test_template_py()` 如何通过子进程调用 Python Jinja2 进行交叉验证
  - 思考问题：
  - '- 模糊测试在模板引擎质量保证中的独特价值是什么（与普通单元测试对比）？'
  - '- 如果想发现 C++ 实现与 Python 实现的行为差异，应该优先测试哪些边界场景？'
  'no': 6
  title: 模糊测试与混沌工程实践
learning_targets:
- 掌握 Jinja2 模板引擎的空白控制机制（trim_blocks、lstrip_blocks、显式剥离标记）及其测试验证方法
- 理解条件语句（if/elif/else）、比较运算符与逻辑运算符的短路求值及真值判定规则
- 熟练运用变量访问路径（点号/方括号）、数组切片、负索引及三元表达式进行数据提取
- 掌握循环结构中的 loop 变量（index/first/last）、字典遍历、for-else 分支及 range 生成器
- 理解 set 赋值、namespace 可变状态管理及元组解包在模板中的作用域规则
- 熟悉字符串变换、序列操作、JSON 序列化等过滤器的链式调用与参数配置
- 掌握宏（macro）的定义、默认参数、关键字参数及乱序传参的解析机制
- 了解 is 测试的类型检测（odd/even/divisibleby/boolean 等）与集合成员测试（in）
- 熟悉 Python 风格的对象方法调用（字符串方法、数组方法、对象方法）在 C++ 实现中的映射
- 理解模板哈希、变量统计、Python 交叉验证及模糊测试（fuzzing）在质量保障中的作用
- 掌握统一测试入口 test_template 与 C++ 渲染核心 test_template_cpp 的双轨测试机制
life_analogy:
- 想象 C++ Jinja 模板引擎是一家**精密的新闻出版工厂**：
- '- **统一测试入口（test_template）** = 总调度台，根据开关（g_python_mode）决定是将任务派给「C++ 印刷车间」还是「Python
  母版校对室」'
- '- **C++ 渲染核心（test_template_cpp）** = 高速印刷机，将模板（油墨）与变量（纸张）高速压印成最终输出，并自动对比质检样张'
- '- **Python 交叉验证（test_template_py）** = 原厂母版校对，通过子进程将 C++ 的输出与 Python Jinja2 的标准件进行
  100% 比对'
- '- **空白控制（trim_blocks/lstrip_blocks）** = 排版车间的「自动裁边机」，精确切除每行文字多余的空白边距'
- '- **条件语句（if/elif/else）** = 编辑部的「内容审查官」，根据稿件质量（真值判断）决定刊登哪一版'
- '- **循环结构（for/loop.index）** = 印刷机的「重复印刷单元」，能自动编号（index）并识别第一张和最后一张纸（first/last）'
- '- **过滤器（filters）** = 文字加工流水线，依次进行「大写转换（upper）→ 修剪（trim）→ JSON 打包（tojson）」'
- '- **宏（macro）** = 预制好的「标准信件模板」，只需填入姓名和地址（参数）即可批量生成个性化信件'
- '- **namespace** = 编辑部的「共享记事板」，允许不同部门（循环）在板子上累计计数，突破单张纸的局限'
- '- **模糊测试（fuzzing）** = 质检部的「混沌工程实验」，故意往机器里扔奇形怪状的纸张（畸形输入），确保印刷机不会卡纸（崩溃）'
'no': 105
summary:
- concept: test_template
  desc: 统一测试入口，根据 g_python_mode 在 C++ 与 Python 双引擎间路由测试用例
- concept: test_template_cpp
  desc: C++ 渲染核心，封装词法分析→语法解析→运行时执行→结果断言的完整流水线
- concept: test_template_py
  desc: Python 交叉验证机制，通过子进程调用 Jinja2 确保 C++ 实现行为一致
- concept: trim_blocks / lstrip_blocks
  desc: 自动移除块标签后的换行与前导空白，保持输出纯净
- concept: '{%- ... -%}'
  desc: 显式空白剥离标记，手动精确控制模板边界
- concept: is defined / is not defined
  desc: 防御性编程测试，避免未定义变量导致的崩溃
- concept: loop.index / loop.first / loop.last
  desc: 循环状态变量，支持 1-based 索引与首尾边界检测
- concept: for ... else
  desc: Python 风格循环，空集合或 undefined 时执行 else 分支
- concept: namespace()
  desc: 突破模板作用域限制的可变对象，用于跨循环状态累积
- concept: '|default / |d'
  desc: 默认值过滤器，处理 undefined 或 falsy 值
- concept: '|tojson'
  desc: JSON 序列化过滤器，支持 ensure_ascii、sort_keys、indent 等精细化控制
- concept: '|indent'
  desc: 文本缩进过滤器，支持首行控制、空行处理及自定义缩进字符串
- concept: is odd / is even / is divisibleby
  desc: 数值特性测试，用于奇偶判断与整除检测
- concept: is iterable / is mapping / is sequence
  desc: 类型检测测试，区分数组、对象与字符串
- concept: reject / select + in
  desc: 集合过滤组合技，基于成员测试筛选元素
- concept: macro / endmacro
  desc: 模板函数封装，支持默认参数与关键字参数乱序传递
- concept: string.upper() / array.pop()
  desc: Python 风格方法调用，C++ 实现与 Python 语义对齐
- concept: fuzz_test_template
  desc: 混沌工程测试，对畸形输入与随机参数组合进行崩溃防护验证
