exercises:
- contents:
  - 阅读 `src/models/chameleon.cpp` 第 1-100 行（llm_build_chameleon 构造函数）：
  - 1. 找出 `img_token_start_idx` 和 `img_token_end_idx` 的取值
  - 2. 跟踪 `img_logits` 张量的创建流程：
  - '   - 使用了哪个 ggml 函数创建 1D 张量？'
  - '   - 使用了哪个 ggml 函数钳制数值范围？'
  - '   - 最终通过哪个函数注入到 `cur` logits 中？'
  - 3. 对比 RoPE 调用：Chameleon 用的是 `ggml_rope_ext` 还是 `ggml_rope`？Qwen2-VL 用的是哪个？
  - 回答问题：
  - '- Chameleon 的 logits 抑制与通常的 mask 操作有什么本质区别？'
  - '- 如果 `img_token_start_idx = 4`、`img_token_end_idx = 8196`、`vocab_size = 32000`，被抑制的
    token 占词表多大比例？'
  - '- 这种方法能否扩展到「抑制特定 text token」？如果要实现「禁止模型输出某个敏感词」，代码需要怎么改？'
  'no': 1
  title: 阅读 Chameleon 的 logits 抑制实现
- contents:
  - 阅读 `src/models/cogvlm.cpp` 第 1-50 行，理解输入判断逻辑：
  - 1. `is_text` 变量是如何判断的？依据是什么？
  - 2. 文本路径和图像路径分别使用哪些权重张量？
  - 3. 对比 Chameleon（只抑制 logits）和 CogVLM（切换整套权重）的设计思路。
  - 回答问题：
  - '- 为什么 CogVLM 选择「两套权重」而非「一套权重 + mask」？'
  - '- 如果在 `is_text=false`（图像输入）时使用了 `wqkv` 而非 `visexp_attn_wqkv`，会发生什么？'
  - '- 在工程实现上，「切换权重指针」与「运行时重组计算图」相比，各自的优缺点是什么？'
  'no': 2
  title: 对比 CogVLM 与 Chameleon 的输入分流
- contents:
  - 阅读 `src/models/qwen3vl.cpp` 第 1-100 行，定位 DeepStack 注入代码：
  - 1. `n_deepstack_layers` 从哪里获取？
  - 2. `ggml_view_2d(ctx0, res->t_inp_embd, n_embd, n_tokens, res->t_inp_embd->nb[1],
    (il + 1) * n_embd * sizeof(float))` 这一行的参数含义：
  - '   - `n_embd`、`n_tokens` 是输出形状的哪两个维度？'
  - '   - `res->t_inp_embd->nb[1]` 是源张量的哪个 stride？'
  - '   - `(il + 1) * n_embd * sizeof(float)` 这个偏移如何对应「第 il 层」？'
  - 3. 对比 Qwen2-VL（无 DeepStack）和 Qwen3-VL（有 DeepStack）的图结构差异。
  - 回答问题：
  - '- DeepStack 注入发生在「主路径之后」（cur + ffn_inp 之后）还是「FFN 之前」？'
  - '- 为什么只在 `il < n_deepstack_layers` 的层做注入，而不是所有层？'
  - '- 假设 `t_inp_embd` 总共有 4 层堆叠（n_deepstack_layers=3），最后一层堆叠有什么用途？'
  'no': 3
  title: 追踪 Qwen3-VL 的 DeepStack 注入路径
- contents:
  - 阅读 `src/models/llada.cpp` 与 `src/models/rnd1.cpp` 第 1-50 行：
  - 1. 两个模型都使用 `build_attn_inp_no_cache()`，这与 `build_attn_inp_kv()` 有何本质区别？
  - 2. 找出 LLaDA 和 RND1 在图构建上的所有差异：
  - '   - 是否使用 Q/K 归一化？'
  - '   - RoPE 调用是 ext 还是 multi？'
  - '   - FFN 是 dense 还是 MoE？'
  - '   - 输出层是否有 bo 偏置？'
  - 3. 对比 LLaDA 与 Qwen2-VL 的 RoPE 调用差异。
  - 回答问题：
  - '- 为什么扩散模型不需要 KV 缓存？数学上的解释是什么？'
  - '- RND1 是「Qwen3MoE 转扩散」，为什么 MoE 结构能在扩散范式下工作？'
  - '- 如果一个扩散模型的注意力错误地使用了因果掩码（causal mask），生成结果会出什么问题？'
  'no': 4
  title: 理解 LLaDA 与 RND1 的扩散注意力
- contents:
  - 阅读 `src/models/lfm2.cpp` 第 1-150 行：
  - 1. 模板参数 `iswa` 控制哪些类型的变化？
  - 2. `build_shortconv_block` 中：
  - '   - `n_chunks = 3` 的含义是什么？B/C/X 各代表什么？'
  - '   - `ggml_concat(conv, bx, 0)` 在哪个维度拼接？'
  - '   - `ggml_cpy(new_conv, ...)` 的目标偏移如何计算？'
  - 3. 主循环中：
  - '   - `is_recurrent(il)` 为 true 时调用哪个 block？'
  - '   - `n_layer_dense_lead` 控制 FFN 选择的规则是什么？'
  - 回答问题：
  - '- LFM2 模板的显式实例化 `template struct llm_build_lfm2<true>` 与 `template struct llm_build_lfm2<false>`
    起什么作用？'
  - '- 为什么短卷积需要单独维护 R 状态，而不能像注意力那样直接使用 KV 缓存？'
  - '- 如果在 dense FFN 的层错误地调用了 MoE FFN（或反之），会发生什么？代码会 panic 还是静默错误？'
  'no': 5
  title: 剖析 LFM2 的混合记忆与短卷积
learning_targets:
- 理解多模态模型中图像/视觉 token 抑制的实现机制（Chameleon）
- 掌握视觉-语言双权重架构的设计原理（CogVLM）
- 深入学习多段旋转位置编码 MRoPE 在视觉 token 上的应用（Qwen2-VL/Qwen3-VL）
- 理解 DeepStack 跨层特征融合在视觉-语言模型中的作用机制
- 掌握扩散语言模型使用非因果注意力的实现原理（LLaDA、RND1）
- 理解 ISWA 滑动窗口注意力在多模态长序列中的应用（MIMO2-ISWA）
- 掌握混合记忆架构中注意力与短卷积的协同方式（LFM2）
- 能区分图像 token logits 抑制、视觉专家分支、DeepStack 注入、扩散掩码、sinks 注意力等高级特性
life_analogy:
- 想象多模态模型是一座**翻译官 + 画家 + 秘书的复合办公室**：
- '- **Chameleon = 双重身份员工**——既能看懂图片，也能写文字。'
- '  为避免「不小心吐出乱码图片」，在打字阶段把图片对应位置的格子用「极低分」封死（-FLT_MAX），确保文字永远胜出。'
- '- **CogVLM = 两套衣服的员工**——处理文字穿「西装」（wqkv/wo），处理图像换「工装」（visexp_attn_wqkv）。'
- '  通过判断「这次来的是文字还是图像」自动换装，专业能力互不干扰。'
- '- **Qwen2-VL / Qwen3-VL = 三维坐标的导游**——MRoPE 把位置信息分成 4 段（时间、高度、宽度、其他），'
- '  让模型同时知道「这是视频的第几秒、像素的第几行、第几列」。DeepStack 则是让低层视觉特征能跨越多层注入，类似「透视眼镜」层层叠加。'
- '- **LLaDA / RND1 = 并行雕刻家**——传统 AI 是一个字一个字写（自回归），'
- '  它们则同时雕刻所有位置（扩散），所以不需要 KV 缓存这种「记忆便签」，所有位置一起改。'
- '- **LFM2 = 双技能工人**——既会用锤子（注意力），也会用扳手（短卷积）。'
- '  通过判断「这活儿是精细活还是批量活」自动选工具，工具之间还能配合。'
- '- **MIMO2-ISWA = 带缓冲的流水线**——滑动窗口让近期信息进「快速通道」，远期信息进「档案室」，'
- '  sinks 则是「重要便签」，防止长序列生成时模型跑题。'
- 就像现代办公室需要专业的多面手和精密的协作机制，多模态模型也需要在同一套硬件上协调图像、文本、扩散、循环等多种推理范式。
'no': 31
summary:
- concept: Chameleon
  desc: 早期多模态，用 ggml_set_1d 将图像 token logits 钳为 -FLT_MAX 实现纯文本输出
- concept: CogVLM
  desc: 视觉专家分支，根据 ubatch.token 是否存在选择文本/视觉两套权重
- concept: Qwen2-VL
  desc: MRoPE 多段旋转位置编码，4 段 sections 处理视频时空维度
- concept: Qwen3-VL
  desc: DeepStack 跨层注入，Q/K norm 在 RoPE 之前
- concept: Qwen3-VL-MoE
  desc: DeepStack + MoE FFN，softmax 门控
- concept: LLaDA
  desc: 扩散语言模型，非因果注意力（build_attn_inp_no_cache）
- concept: LFM2
  desc: 模板化混合记忆，注意力 + 短卷积（ssm_conv），前 N 层密集后续 MoE
- concept: MIMO2-ISWA
  desc: ISWA 滑动窗口 + 注意力 sinks + per-layer RoPE + sigmoid 门控 MoE
- concept: RND1
  desc: Qwen3MoE 转扩散，非因果注意力 + softmax 门控
- concept: ggml_rope_multi
  desc: 多段旋转位置编码，按 sections 数组分配不同维度的旋转
- concept: ggml_set_1d
  desc: 将 1D 张量写入 logits 指定偏移，Chameleon 抑制图像 token
- concept: ggml_view_2d/3d
  desc: 零拷贝视图切片，用于 DeepStack 嵌入提取与 QKV 拆分
- concept: build_attn_inp_no_cache
  desc: 非因果注意力输入，扩散模型专用，无 KV 缓存
- concept: build_attn_inp_kv_iswa
  desc: ISWA 滑动窗口 KV 输入，配合注意力 sinks 稳定长序列
- concept: build_inp_mem_hybrid[_iswa]
  desc: 混合内存输入，同时管理注意力 KV 与循环 R/S 状态
- concept: attn_sinks
  desc: 注意力 sink 向量，可学习的额外 logits 偏置
- concept: ssm_conv
  desc: 短卷积算子，LFM2 循环层核心
- concept: n_deepstack_layers
  desc: DeepStack 注入层数，前 N 层融合视觉嵌入
- concept: n_layer_dense_lead
  desc: 前导密集层数，LFM2 用其切换密集/MoE FFN
- concept: is_recurrent(il)
  desc: 判断某层是循环层（短卷积）还是注意力层
- concept: rope_sections
  desc: MRoPE 各段维度配置，从超参数复制
