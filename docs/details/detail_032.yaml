  'no': 2
  points:
  - '**CogVLM 如何区分文本与图像输入？**'
  - '- 通过 `ubatch.token` 是否存在来判断输入类型：文本或图像嵌入向量'
  - '- 文本输入使用标准权重（`wqkv`、`wo`、`ffn_*`）'
