  name: ISWA 混合内存 —— 滑动窗口 + RNN 的"终极组合"
  'no': 8
  points:
  - '**`llama_memory_hybrid_iswa` 的三模块架构**'
  - '- 内部包含 `llama_kv_cache_iswa`（双 base+swa cache）+ `llama_memory_recurrent`'
  - '- 是混合架构 + SWA 的终极组合，专为 Jamba、Falcon-H1 等模型设计'
  - '- `mem_attn->get_base()` 暴露非 SWA 部分，`mem_attn->get_swa()` 暴露 SWA 部分'
  - '**构造与初始化**'
  - '- 构造时同时创建 ISWA 与 Recurrent 两个子模块'
  - '- 默认 filter 与 hybrid 一致：`!is_recurrent` 与 `is_recurrent`'
  - '**`init_batch` 的三层 try-catch 链**'
  - '- 调用 `mem_recr->prepare` 先尝试 RNN 部分'
  - '- 再分别 `mem_attn->get_base()->prepare()` 与 `mem_attn->get_swa()->prepare()` 准备两份
    slot info'
  - '- 任一失败立即返回，三层失败才彻底放弃'
  - '- 构造的 context 同时持有 `llama_kv_cache_iswa_context` + `llama_memory_recurrent_context`'
  - '**`init_full` 与 `init_update`**'
  - '- attn 用 ISWA 的同名方法构造 ctx_attn'
  - '- recr 用 `llama_memory_recurrent::init_full/init_update` 构造 ctx_recr'
  - '- 状态用 `llama_memory_status_combine` 组合'
  - '**`seq_rm` 的失败优先策略**'
  - '- 先尝试 `mem_recr->seq_rm`：若失败直接返回 false，attn 不被修改'
  - '- 若成功，再调用 `mem_attn->seq_rm`'
  - '**`seq_cp` / `seq_keep` / `seq_add` / `seq_div` 透传**'
  - '- 分别透传到 ISWA 与 Recurrent'
  - '**`state_write/read` 的完整序列化**'
  - '- 与 hybrid 不同，hybrid_iswa 不支持 PARTIAL_ONLY 标志'
  - '- 必须完整序列化 ISWA（含 base+swa）与 recurrent 两部分'
  - '- 因为 ISWA 的 base 部分也需要跨调用保持一致'
  - '**`seq_pos_min/max` 与 hybrid 一致**'
  - '- `seq_pos_min` 取 `max(attn_min, recr_min)`'
  - '- `seq_pos_max` 取 `min(attn_max, recr_max)`'
  - '- ISWA 的 seq_pos 实际上等于 swa 的 seq_pos（base 是 superset）'
  - '**`get_mem_attn()` / `get_mem_recr()` 暴露子模块**'
  - '- 返回 ISWA 与 Recurrent 的 raw pointer'
  - '**`llama_memory_hybrid_iswa_context` 的构造与协同**'
  - '- 4 种构造：status（错误）/ full / update / success'
  - '- `next()` 同时推进两个子 ctx'
  - '- `apply()` 顺序执行两个子 ctx 的 apply'
  - '- `get_attn()` 返回 `llama_kv_cache_iswa_context*`（可进一步获取 base/swa ctx）'
  - '- `get_recr()` 返回 `llama_memory_recurrent_context*`'
  - '- 这三层嵌套 ctx 完整表达了 iswa+hybrid 的全部状态'
