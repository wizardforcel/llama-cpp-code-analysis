  - '- 内部维护两个独立的 `llama_kv_cache`：`kv_base`（非 SWA 层）+ `kv_swa`（SWA 层）'
  - '- 通过 `filter_base` / `filter_swa` 回调链式过滤：先应用上层 filter，再按 `hparams.is_swa(il)`
    分流'
  - '- SWA cache 大小由 `n_swa * (unified ? n_seq_max : 1) + n_ubatch` 计算，并 padding 到
    256 提升性能（参见 issue #17037）'
  - '- `swa_full` 选项强制 SWA cache 与 base cache 等大（仅推荐小 SWA 场景）'
  - '**`init_batch` 的双路尝试策略**'
  - '- 先用 `split_simple`（unified 模式）+ 同步两个缓存的 `prepare`'
  - '- 失败则降级为 `split_equal(!unified)`，支持非统一划分'
  - '- 两路都失败才返回 `FAILED_PREPARE`'
  - '- 两个子缓存的 `prepare` 都必须成功才推进'
  - '**`init_full` 与 `init_update`**'
  - '- `init_full()`：分别调用两个子缓存的 init_full'
  - '- `init_update()`：分别调用两个子缓存的 init_update'
  - '**`get_can_shift` 的严格约束**'
  - '- 需要 base 与 SWA 缓存大小完全相同才能支持 K-Shove（保证索引一致）'
  - '- 内部两个子缓存的 `get_can_shift` 都为 true 才返回 true'
  - '**`clear` 与 `seq_*` 透传**'
  - '- 所有 `clear/seq_rm/seq_cp/seq_keep/seq_add/seq_div` 都同时作用于两个子缓存'
  - '- 任何子缓存失败立即返回（仅 seq_rm 返回 bool）'
  - '**`seq_pos_min/max` 的 ISWA 特殊语义**'
  - '- `seq_pos_min`/`seq_pos_max` 委托给 `kv_swa`（base 是 superset，受 SWA 约束）'
  - '**`memory_breakdown` 的累加**'
  - '- 合并两个子缓存的 breakdown 映射'
  - '**`state_write/read` 的 PARTIAL_ONLY 标志**'
  - '- `LLAMA_STATE_SEQ_FLAGS_PARTIAL_ONLY`：只写/读 SWA 部分，跳过 base（用于部分状态保存）'
