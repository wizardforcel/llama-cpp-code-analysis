  name: 内存抽象接口 —— 推理引擎的"通用记忆契约"
  'no': 1
  points:
  - '**为什么需要 `llama_memory_i` 抽象接口？**'
  - '- 不同模型使用不同类型的"记忆"：Transformer 用 KV Cache、Mamba/RWKV 用循环 R/S 状态、混合模型需要同时管理两者'
  - '- 通过统一接口 `init_batch` / `init_full` / `init_update`，上层 `llama_context` 无需关心底层是哪种记忆'
  - '- `init_batch` 负责将 `llama_batch` 拆分为微批次 `llama_ubatch` 并验证能否装入缓存'
  - '- `init_full` 用于分配最坏情况下的计算缓冲区（预分配所有 cache slots）'
  - '- `init_update` 处理待处理的内存更新（如 shifts、copies）'
  - '**`llama_memory_context_i` 的角色**'
  - '- 是与具体内存类型绑定的"会话对象"，实现 `next()` / `apply()` / `get_ubatch()` / `get_status()`
    四件套'
  - '- `next()` 推进到下一个 ubatch，返回 false 表示批次结束'
  - '- `apply()` 是唯一允许修改内存状态和上下文状态的方法'
  - '- 多个 memory context 的状态通过 `llama_memory_status_combine` 组合（ISWA、Hybrid 都依赖此机制）'
  - '**`llama_memory_status` 状态机**'
  - '- `SUCCESS`：有更新且成功'
  - '- `NO_UPDATE`：无任何更新（用于优化跳过 K-Shove）'
  - '- `FAILED_PREPARE` / `FAILED_COMPUTE`：准备或计算阶段失败'
  - '**`llama_memory_status_combine` 的合并语义**'
  - '- 任何一个为 `FAILED_*` 直接返回该失败状态（短路）'
  - '- 否则检查两侧是否至少有一个 `SUCCESS`，有则返回 ` SUCCESS`，否则 `NO_UPDATE`'
  - '**`llama_memory_params` 构造参数**'
  - '- `type_k` / `type_v`：K/V 张量的量化类型'
  - '- `swa_full`：是否使用与 base 等大的 SWA 缓存（占用更多内存但管理更简单）'
  - '**层过滤与复用回调**'
  - '- `layer_filter_cb(il)` 返回 bool：决定 il 层是否纳入缓存'
  - '- `layer_reuse_cb(il)` 返回 int32：决定 il 层复用哪个其他层的 KV（< 0 表示不复用）'
