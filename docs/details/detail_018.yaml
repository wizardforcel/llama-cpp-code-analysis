  - '- 先用 range 形式收集活跃 cells（cell_ranges_t）'
  - '- 对 V 转置的 buffer 按行写：每行对应一个 embedding 维度'
  - '- 读回时利用 `sinfo.is_contiguous()` 走 fast path（单 memcpy），否则 scatter 写入'
