  name: 循环式记忆 —— Mamba/RWKV 的"持续状态"
  'no': 6
  points:
  - '**为什么 Mamba/RWKV 不需要 KV Cache？**'
  - '- 这类模型没有注意力机制，状态以循环形式（R/S tensor）保存'
  - '- 每个 cell 存储整个序列的状态，而非每个 token 的 KV 对'
  - '- 内存占用与上下文长度无关，只与 `n_embd_r * n_embd_s` 有关'
  - '**`llama_memory_recurrent` 的 mem_cell 结构**'
  - '- `pos`：该 cell 对应的最末位置'
  - '- `src` / `src0`：状态来源 cell 索引，用于构建 cp 图节点'
  - '- `tail`：序列 seq_id 在 cells 中的"尾巴位置"索引'
  - '- `seq_id` 集合：当前 cell 被哪些序列共享'
  - '**构造与张量分配**'
  - '- 按 buft 分组，每层创建 `r_l[il]` / `s_l[il]` 张量'
  - '- `clear(buf, 0)` 初始化 buffer 内容，避免 NaN'
  - '**`find_slot` 的连续性约束**'
  - '- 每个序列的状态必须存放在连续 cell 中（与 KV cache 分散存储不同）'
  - '- 通过 `gather and re-order` 阶段把分散的 tail 重排到 `[min, max]` 连续区间'
  - '- 维护 `rs_z`（零状态 cell）供新序列初始化使用'
  - '- `ubatch.equal_seqs()` 必须为 true（每个序列 token 数相同）'
  - '- 调试模式下用 `tails_verif` 校验 tail 一致性'
  - '**`seq_rm` 的特殊限制**'
  - '- Mamba/RWKV 不允许部分擦除序列末尾的状态（状态无法向后传播）'
  - '- `seq_id >= size` 直接返回 false（seq_id 越界）'
  - '- 若 range 包含 tail 的 pos 则直接返回 false，避免破坏状态连续性'
  - '- `seq_id < 0`（匹配所有序列）时只接受全范围或空范围'
  - '**`seq_cp` / `seq_keep` / `seq_add` / `seq_div` 的细节**'
  - '- `seq_cp` 直接把 tail 的 seq_id 集合复制（不需要 buffer copy）'
  - '- `seq_keep` 清理非目标 seq_id，更新 used/tail'
  - '- `seq_add / seq_div` 只修改 tail cell 的 pos，不涉及 shift 累积'
  - '**`init_batch` 与 KV cache 的差异**'
  - '- 不支持 `split_simple`，只支持 `split_equal(seq=true)` 与 `split_seq`'
  - '- `embd_all` 模式用 `split_seq`（按序列切分），否则用 `split_equal(seq=true)`'
  - '- 准备阶段 `prepare` 通过完整保存 `cells/used/head` 来支持回滚'
  - '**`init_full` 与 `init_update`**'
  - '- `init_full()`：返回 is_full=true 的 context'
  - '- `init_update()`：直接返回 NO_UPDATE（循环记忆不需要 K-Shove）'
  - '**`s_copy(i)` 的妙用**'
  - '- 返回 cell `i + head` 的 src0，用于构建 `ggml_cpy` 节点实现状态复制链'
  - '- 在图中按 src0 → i 的顺序串行复制，形成正确的状态传递路径'
  - '- rs_z 在 src0 中充当"零源"，让首段状态直接初始化'
  - '**`get_n_rs / get_head / get_rs_z / get_size`**'
  - '- 区分 full 模式（n=size, head=0, rs_z=0）和 batch 模式（动态计算）'
  - '- 这些数据用于构建图输入：n_rs 决定张量大小，head 决定状态起点'
  - '**`state_write/read` 的 R/S 张量序列化**'
  - '- R 和 S 都支持连续（每行一个 cell）和离散（按 cell 元素）两种布局'
  - '- 写入按 cell ranges 合并，读取通过 `ggml_backend_tensor_set` 批量恢复'
  - '- `state_write_meta` / `state_write_data` / `state_read_meta` / `state_read_data`
    分别负责元信息与数据'
  - '**`size_*_bytes` 内存统计**'
  - '- `size_r_bytes` / `size_s_bytes`：累加每层 R/S 张量大小'
  - '- `total_size`：累加 buffer 大小'
