  name: 混合内存 —— Transformer + RNN 的"双脑架构"
  'no': 7
  points:
  - '**`llama_memory_hybrid` 的双模块协作**'
  - '- 内部组合 `llama_kv_cache`（处理 attention 层）+ `llama_memory_recurrent`（处理 RNN 层）'
  - '- 通过 `filter_attn` / `filter_recr` 回调按层分发到对应模块'
  - '- 默认过滤规则：`!hparams.is_recurrent(il)` 分配到 KV，`hparams.is_recurrent(il)` 分配到 RNN'
  - '**构造与初始化**'
  - '- 构造时同时创建两个子模块，attn 默认 filter 为 `!is_recurrent`，recr 默认 filter 为 `is_recurrent`'
  - '**`init_batch` 的先 RNN 后 Attention 策略**'
  - '- 先调用 `mem_recr->prepare`：若失败立即返回 `FAILED_PREPARE`'
  - '- 再调用 `mem_attn->prepare`：失败同样立即返回'
  - '- 这样保证若 RNN 拒绝批内存的，KV cache 不会被部分修改'
  - '- `embd_all` 模式按序列切分，否则按 `unified` 决定是否使用非顺序等分'
  - '**`init_full` 与 `init_update`**'
  - '- 分别包装 attn 和 recr 的 init_full / init_update'
  - '- `get_can_shift` 直接委托给 mem_attn（RNN 天然支持 shift）'
  - '**`seq_rm` 的失败优先策略**'
  - '- 先尝试 `mem_recr->seq_rm`：若失败直接返回 false，KV cache 不被修改'
