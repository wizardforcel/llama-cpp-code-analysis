  name: 标准 KV Cache 实现 —— Transformer 的"记忆仓库"
  'no': 3
  points:
  - '**`llama_kv_cache` 的核心数据结构**'
  - '- `slot_info` 与 `slot_info_vec_t`：描述每个 ubatch 的目标 cell 位置（按 stream 组织）'
  - '- `stream_copy_info`：跨 stream 的 KV buffer 复制请求（`seq_cp` 时使用）'
  - '- `kv_layer` 结构体：记录每层的 layer index、k/v 张量指针、k_stream/v_stream 视图'
  - '- `map_layer_ids`：模型层索引到 KV cache 层索引的映射，支持层复用（layer reuse / SWA 共享）'
  - '- `v_cells`：`n_stream` 套独立的 cells（多 stream 模式下每个 stream 一套）'
  - '- `seq_to_stream`：序列 ID → 流 ID 的映射表'
  - '- `attn_rot_hadamard`：预计算的 Walsh-Hadamard 矩阵，用于 K/V 量化加速'
  - '**构造函数的多 buft 分配**'
  - '- 按 `ggml_backend_buft` 分组创建 ggml context，每个 buffer 类型独立分配'
  - '- `dev_layer(il)` 选择每层的物理设备（CPU/GPU offload）'
  - '- 通过 `filter` 回调决定哪些层加入缓存（ISWA、Hybrid 用）'
  - '- 通过 `reuse` 回调决定哪些层共享其他层的 KV（SWA 共享层）'
  - '- 检测 `LLAMA_ATTN_ROT_DISABLE` 环境变量决定是否启用 Hadamard 旋转加速'
  - '- 预计算 64/128/256... 的 Hadamard 矩阵缓存（直到 head 维度）'
  - '**静态辅助函数**'
  - '- `ggml_is_power_of_2(n)`：检测是否为 2 的幂'
  - '- `ggml_gen_hadamard(tensor)`：原地生成 Walsh-Hadamard 正交矩阵'
  - '- `ggml_mul_mat_aux(ctx, cur, rot)`：将 cur reshape 为 [n, N/n] 后乘 rot 再 reshape
    回原形状'
  - '**`init_batch` 流程（微批次调度）**'
  - '- 调用 `balloc.split_simple` 或 `split_equal` 将 batch 拆分为 ubatch 序列'
  - '- 通过 `prepare` 试运行每个 ubatch 寻找合适 slot，最后回滚 cells 到原始状态'
  - '- 若 `find_slot` 失败则返回 `LLAMA_MEMORY_STATUS_FAILED_PREPARE`'
  - '**`find_slot` 的智能搜索**'
  - '- 优先从当前 `head` 开始环形搜索，找到连续或分散的空位'
  - '- `head > used + 2*n_tokens` 时重置为 0：避免在尾部空转'
  - '- 支持 SWA 掩码：若 cell 超过 `n_swa` 窗口，即使被占用也可被复用'
  - '- 支持连续与非连续两种分配模式（`cont` 参数）'
  - '- `n_tested >= cells.size()` 时返回空 slot（无解）'
  - '**`apply_ubatch` 的位置一致性保证**'
  - '- 写入新 cell 前若发现位置冲突，触发 `rm` 清理旧 cell'
  - '- 通过 `seq_pos_max_rm[seq_id]` 追踪要覆盖的最大位置'
  - '- 若要写入的范围 < `seq_pos_min(seq_id)`，清理掉 seq_pos_min 到覆盖位置的旧 cell，保证 [min, max]
    连续性不变量'
  - '- 最后将 head 移动到 slot 末尾'
  - '**`prepare` 的原子性保证**'
  - '- 用 `state_t{sinfo, v_heads_old, v_cells_copy}` 在试运行前保存状态'
  - '- `apply_ubatch` 后反向遍历恢复所有 cells 与 head'
  - '- 任何失败都会彻底回滚，不污染 cache'
  - '**`update` 与 K-Shove**'
  - '- 先执行 `stream_copy_info` 中的跨 stream buffer 复制（仅 `n_stream > 1` 时有效）'
  - '- 当存在 `has_shift` 时构建 `llm_graph_input_k_shift` 计算图，应用 RoPE 反向-正向旋转'
  - '- `build_rope_shift`：先 `ggml_mul_mat_aux(K, rot)` 反向旋转 → `ggml_rope_ext` → 再
    `ggml_mul_mat_aux(K, rot)` 正向旋转'
  - '- 最后调用 `reset_shift()` 清除累积偏移'
  - '**`init_full` 与 `init_update`**'
  - '- `init_full()`：返回完整 cache 大小的 dummy context，用于最坏情况下的图构建'
  - '- `init_update()`：包装 `has_shift` 与 `sc_info` 到 update context'
