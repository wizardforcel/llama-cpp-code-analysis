  - '**`size_*_bytes / total_size` 内存统计**'
  - '- `size_k_bytes`：累加所有层的 K 张量大小'
  - '- `size_v_bytes`：累加所有层的 V 张量大小'
  - '- `total_size`：累加所有 buffer 大小'
