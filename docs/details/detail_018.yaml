  - '**`get_base()` / `get_swa()` 暴露子缓存**'
  - '- 返回内部子缓存的 raw pointer，供 Hybrid 架构使用'
  - '**`llama_kv_cache_iswa_context` 的协同**'
  - '- 包装两套独立的 `llama_kv_cache_context`（ctx_base / ctx_swa）'
  - '- 状态用 `llama_memory_status_combine` 合并'
  - '- `apply()` 时两个子 ctx 顺序执行，任何一个失败整体失败'
  - '- `get_base()` / `get_swa()` 返回底层 `llama_kv_cache_context*` 视图'
  - '- `next()` 同时推进两个子 ctx 的 ubatch 指针'
