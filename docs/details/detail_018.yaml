  name: KV 单元管理 —— Transformer 记忆的"原子细胞"
  'no': 2
  points:
  - '**`llama_kv_cells` 的核心职责**'
  - '- 维护 KV cache 中每个 cell 的元信息：位置 `pos`、扩展 2D 位置（M-RoPE）`ext`、累积偏移 `shift`、关联序列
    `seq`'
  - '- 支持一个 cell 被多个序列共享（如 beam search 中的复用）'
  - '- 通过 `used` 集合追踪当前正在使用的 cell 索引，加速 `find_slot` 时的空位查找'
  - '**关键操作解析**'
  - '- `pos_set` / pos_add / pos_div`：修改 cell 的位置并通过 `seq_pos` 索引维护序列位置范围'
  - '- `pos_add` 在 `pos + shift < 0` 时自动将 cell 标记为空（pos = -1）'
  - '- `pos_div` 修改 pos 并累积 shift，配合 K-Shove 批处理'
  - '- `seq_add` / `seq_rm` / `seq_keep`：管理 cell 与序列的关联，引用计数自动维护'
  - '- `cp` / `set`：批量复制/恢复 cells 状态，用于状态保存与恢复（state save/restore）'
  - '- `reset_shift` / `get_has_shift`：管理累积 shift，配合 K-Shove 批处理'
  - '- `used_min` / `used_max_p1` / `get_used` / `size` / `is_empty`：返回当前 cells 的统计信息'
  - '**2D 位置扩展（`llama_kv_cell_ext`）**'
  - '- 存储 x/y 两个空间坐标，专为 M-RoPE（如 Qwen2-VL）设计'
  - '- `is_2d_gt` 用于在 M-RoPE 因果掩码中正确比较 2D 位置'
  - '- `reset` 用 memset 清零，保证 trivially_copyable'
  - '**`seq_pos` 的数据结构选择**'
  - '- 使用 `std::map<llama_pos, int>` 而非 `std::set`：因为同一位置可能被多个 cell 占用（cache reuse、vision
    重复 pos）'
  - '- 通过计数实现 O(log n) 的 seq_pos_min/max 查询'
  - '- `seq_pos_dec/inc/rm/add` 辅助函数保证 seq_pos 与 cells.seq 严格同步'
  - '**查询接口**'
  - '- `pos_get(i)` / `ext_get(i)` / `ext_set(i,p)` / `get_shift(i)` / `pos_in(i,p0,p1)`：安全访问
    cell 状态'
  - '- `seq_pos_min(seq_id)` / `seq_pos_max(seq_id)`：获取序列在 cache 中的位置范围'
