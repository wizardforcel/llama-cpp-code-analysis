exercises:
- contents:
  - 阅读 `ggml/src/ggml-quants.c` 第72-104行的 `quantize_row_q4_0_ref` 函数，
  - 然后不看代码，自行实现一个简化版：
  - 1. 输入：float数组（长度必须是32的倍数）
  - 2. 对每个32元素块：
  - '   - 找到绝对值最大值（amax）'
  - '   - 计算scale = amax / -8.0（注意负号！）'
  - '   - 将每个元素量化到0-15范围：(x/scale + 8.5) 取整'
  - '   - 将两个4-bit值打包到一个uint8_t中（低4位+高4位）'
  - 3. 输出：block_q4_0数组
  - 验证：与参考实现对比，RMSE应小于0.1。
  'no': 1
  title: 手动实现一个简单的Q4_0量化器
- contents:
  - 阅读 `quantize_row_q2_K_ref`（851-924行）和 `dequantize_row_q2_K`（928-954行），回答：
  - 1. 为什么Q2_K需要16个sub-block（16元素）和2个FP16字段（d和dmin）？
  - 2. `scales`数组的每个字节如何同时存储scale和min？（提示：低4位和高4位）
  - 3. 反量化公式 `d * (sc & 0xF) * q - min * (sc >> 4)` 中，d、min、sc分别代表什么？
  - 4. 与Q4_0相比，Q2_K在内存占用和精度上的优劣是什么？计算每元素的bit数。
  - 延伸阅读：阅读 `make_qkx2_quants`（754-835行），理解它如何同时优化scale和min。
  'no': 2
  title: 分析K-quant的多级缩放设计
- contents:
  - 阅读 `iq2xs_init_impl`（约2729-2845行）和 `quantize_row_iq2_xxs_impl`（约2962-3130行），
  - 理解非均匀量化的实现：
  - 1. 为什么需要256/512/2048个预计算格点？这些格点是如何从`kgrid_2bit_256`等数组生成的？
  - 2. `kmap`映射表的作用是什么？如何实现O(1)时间复杂度的格点查找？
  - 3. 当输入向量不在格点上时（is_on_grid=false），`iq2_find_best_neighbour`（约2932-2960行）是如何搜索的？
  - 4. IQ2_XXS与Q2_K相比，在同样2-bit宽度下，哪个更灵活？为什么？
  - 5. 修改代码：尝试为IQ2_XXS增加网格密度（如512点），观察量化误差的改善。
  'no': 3
  title: 探索格点量化（IQ系列）的查表机制
- contents:
  - 参考 `quantize_row_mxfp4_ref`（310-335行）和 `best_index_mxfp4`（295-306行），
  - 实现一个简化的MXFP4量化函数：
  - 1. 计算指数：对绝对最大值amax取log2，减2后取整，存储为E8M0格式（bias=127）
  - 2. 预计算查找表：对索引0-15，预计算`kvalues_mxfp4[i]`（提示：正负对称的8个值×2）
  - 3. 量化：对每个输入值，线性搜索16个预定义值，找到最接近的索引
  - 4. 打包：将两个4-bit索引存入一个uint8_t（同Q4_0）
  - 思考题：
  - '- 为什么MXFP4使用E8M0 exponent而不是Q4_0的FP16 scale？'
  - '- `GGML_E8M0_TO_FP32_HALF`宏的作用是什么？为什么要除以2？'
  - 挑战：阅读 `dequantize_row_nvfp4`（526-551行），理解NVFP4的子块UE4M3缩放与MXFP4的差异。
  'no': 4
  title: 实现一个简单的MXFP4量化器
- contents:
  - 阅读 `ggml_validate_row_data`（5385-5467行）和 `validate_fp16`（5365-5375行），
