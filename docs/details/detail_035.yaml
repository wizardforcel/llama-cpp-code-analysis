learning_targets:
- 理解GGML中多种量化格式（Q1/Q4/Q5/Q8、K-quant、IQ系列、TQ、MXFP4/NVFP4）的设计哲学与适用场景
- 掌握量化块（block）的内存布局：scale/min/d字段的作用，以及位打包（bit-packing）技术的实现细节
- 理解参考实现（_ref）与优化实现（_impl）的分层架构，以及quant_weights（重要性矩阵）如何指导加权量化误差优化
- 掌握格点量化（IQ系列）的查表机制：网格初始化、近邻搜索、符号编码与尺度重估计的算法设计
- 理解K-quant超级块（super-block）的多级缩放结构与递归优化策略
- 熟悉MXFP4/NVFP4等新型微缩浮点格式的E8M0/UE4M3编码及其与现代硬件的协同设计
- 掌握数据校验机制：ggml_validate_row_data如何通过SIMD加速检测NaN/Inf
life_analogy:
- 想象GGML的量化系统是一座**精密质检与压缩工厂**：
- '- **原料检验科**：FP32（32位浮点数）原料进入，质检员（`ggml_validate_row_data`）检查是否有NaN或Inf残次品'
- '- **量化车间分区**：'
- '  - **经典区**（Q1/Q4/Q5/Q8）：像切水果，把连续值切成固定大小的块（对称/非对称），Q4_0是标准切割法，Q4_1多了偏移记录'
- '  - **K-quant精密区**：256元素超级块由16个小组长（sub-block）管理，每个组长配两把秤（scale和min），实现双重精度控制'
- '  - **IQ格点特区**：不做均匀切割，而是查**标准件字典**（grid lookup table）找最接近的预定义形状'
- '  - **微缩浮点特区**（MXFP4/NVFP4）：用科学计数法（E8M0/UE4M3指数），专为NVIDIA Blackwell等新硬件优化'
- '  - **TQ极限区**（TQ1_0/TQ2_0）：只允许-1/0/+1三个值，像简化到只有大中小三种包装'
- '- **工艺线分级**：`_ref`是慢速精确的手工线（易理解（清楚算法）、用于验证），`_impl`是带权重的高速流水线（考虑重要性，优先保护关键零件）'
- '- **还原车间**（反量化）：把压缩包拆回浮点数据，遵循`真实值 ≈ 缩放因子 × (量化值 - 偏移)`，虽略有损耗但体积只有原来的1/4甚至1/16'
