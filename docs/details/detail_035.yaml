summary:
- concept: quantize_row_q4_0_ref
  desc: 4-bit对称量化基础版，用amax归一化，无min偏移，适合一般权重
- concept: quantize_row_q4_1_ref
  desc: 4-bit非对称量化，记录min和max，精度更高但需额外存储min
- concept: quantize_row_q5_x_ref
  desc: 5-bit量化，用qh数组单独存储第5个有效位，兼容4-bit存储结构
- concept: quantize_row_q8_x_ref
  desc: 8-bit量化，Q8_1额外存储sum用于点积加速，是质量基准
- concept: quantize_row_q8_K_ref
  desc: 256元素超级块8-bit量化，每16元素存一个sum，用于点积优化
- concept: K-quant系列（Q2_K-Q6_K）
  desc: 256元素超级块+16子块二级量化，支持min/max和加权RMSE优化
- concept: IQ系列（IQ1-IQ4）
  desc: 格点量化（Grid Quantization），使用预计算查找表实现非均匀量化
- concept: MXFP4/NVFP4
  desc: 微缩浮点格式，使用E8M0/UE4M3指数编码，适配NVIDIA Blackwell等GPU
- concept: TQ1_0/TQ2_0
  desc: 三值量化（-1,0,1），Base-3编码5个值进1字节或2-bit存储，极限压缩
- concept: dequantize_row_*
  desc: 反量化函数，将低比特数据重建为FP32，遵循`值 = scale × (量化值 - 偏移)`
- concept: nearest_int
  desc: 魔数快速舍入，利用FP32表示特性（+12582912）实现无分支取整
- concept: make_qx_quants
  desc: RMSE优化核心，最小化量化误差，支持多种权重策略（x²、1、|x|、√|x|）
- concept: make_qkx2/quants
  desc: 加权最小二乘优化，同时优化scale和min以最小化加权误差
- concept: make_qp_quants
  desc: 带权重的尺度优化，通过迭代和网格搜索找到最优scale
- concept: quant_weights/imatrix
  desc: 重要性矩阵，指导量化算法优先保护对输出影响大的权重
- concept: iq2xs_init_impl
  desc: IQ格点初始化，构建256/512/2048个预计算格点、映射表和近邻表
- concept: iq2_find_best_neighbour
  desc: O(1)查表启动+近邻搜索，在非格点情况下找到加权误差最小的量化点
- concept: ggml_validate_row_data
  desc: 数据完整性守门员，SIMD加速检测NaN/Inf，支持所有量化类型
