    / pad_token_id=3 / unk_token_id=0` 这三个设置是为了兼容哪一类模型？
  - 2. `MPTModel.modify_tensors` 为什么把 `scales` 后缀改名成 `act.scales`？`attn_config.alibi`
    与 `clip_qkv` 分别映射到 GGUF 的什么字段？
  - 3. `OrionModel.set_gguf_parameters` 注释中提到 HF 声称 RMS Norm、实际是 Layer Norm，这种「名实不符」是如何被注释记录的？
  - 4. `StableLMModel.modify_tensors` 中 `_q_norms` 与 `_k_norms` 的数据结构是什么？为何用 `list[dict[str,
