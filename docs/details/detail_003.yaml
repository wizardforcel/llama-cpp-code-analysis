  name: 经典 LLaMA 系：LlamaModel —— 「Transformer 王朝的奠基者」
  'no': 1
  points:
  - '**为什么需要 `LlamaModel`？**'
  - '- 它是整个转换体系中最基础的模型类，承载着 LLaMA/Mistral/Mixtral 等主流架构'
  - '- 通过 `undo_permute = True` 类属性控制是否需要撤销 HF 的 QKV 权重旋转'
  - '- 专家合并机制 (`_experts` 缓存) 让 Mixtral 的稀疏专家变成单一 3D 张量'
  - '**`modify_tensors` 中的核心逻辑：**'
  - '- 跳过多模态张量（视觉/音频塔、投影器）'
  - '- 撤销 HF 对 Q/K 投影的维度排列（`LlamaModel.permute` 静态方法）'
  - '- 对 `block_sparse_moe.experts` 路径进行专家权重缓存与合并'
  - '**`generate_extra_tensors` 实现 Llama3 RoPE 频率：**'
  - '- 当 `rope_type == ''llama3''` 时，按原始公式计算 rope_factors'
  - '- 分别处理 `low_freq_factor` 与 `high_freq_factor` 之间的平滑过渡区间'
  - '**词表与超参数特例：**'
  - '- `set_vocab` 兼容 CodeLlama (FIM tokens) 与 Granite small (`vocab_size == 49152`)'
  - '- `set_gguf_parameters` 额外写入 `vocab_size` 与 `rope_dimension_count`'
