  'no': 8
  points:
  - '**BERTModel 的 phantom space 词汇：**'
  - '- 通过 `phantom` 函数把 `##` 前缀替换为 `▁`（phantom space）'
  - '- `##word` → `▁word`，对齐 WordPiece 词表格式'
  - '**`set_gguf_parameters` 关闭因果注意力：**'
  - '- `add_causal_attention(False)` 标志位'
  - '- `_try_set_pooling_type` 兼容 sentence-transformers'
  - '- `classifier_output_labels` 写入 `id2label` 转换后的分类标签'
  - '**DistilBERTModel 的 MLM 头剥离：**'
  - '- 固定 `layer_norm_eps = 1e-12`'
  - '- 跳过所有 `vocab_*` 开头的张量'
  - '**XLM-RoBERTa 的 tokenizer 重构：**'
  - '- `_xlmroberta_tokenizer_init` 处理 `pad_token_id` 偏移，并调整 `max_position_embeddings`'
  - '- `_xlmroberta_set_vocab` 兼容 BPE (sentencepiece_model_pb2) 与 Unigram (tokenizer.json)
    两种 SentencePiece 模型'
  - '- 兼容 `MoE` 版本的 `NomicBertModel` 也复用此逻辑'
