  name: Mamba / Mamba2：状态空间模型的转换 —— 「非 Transformer 的特殊处理」
  'no': 7
  points:
  - '**Mamba 的特殊张量布局：**'
  - '- `A_log` 需要取负指数（`-torch.exp(data_torch)`），因为 ggml 存储的是 A 而非 log(A)'
  - '- `SSM_CONV1D` 张量需要 `squeeze()` 把 `[d_inner, 1, d_conv]` 变成 `[d_inner, d_conv]`'
  - '- 自动检查 `token_embd.weight == output.weight`，省略冗余的 output 张量'
  - '**Mamba2 的差异：**'
  - '- 绕开 AutoConfig 直接读 config.json（HF 误判为 Mamba-Codestral）'
  - '- 用 `n_groups` / `d_inner` 显式存储维度信息'
  - '- `SSM_A` 与 `SSM_D` 需要 `reshape((..., 1))` 来适配广播语义'
  - '- `SSM_NORM` 需要 reshape 为 `(n_group, d_inner // n_group)`'
  - '**词表自动填充：**'
  - '- 通过 `pad_vocab_size_multiple` 自动对齐到指定倍数'
  - '- Mamba2 默认为 16，Mamba 默认为 8'
