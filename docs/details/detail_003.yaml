  name: Falcon / StarCoder / Refact / Baichuan / Xverse —— 「非主流但重要的张量布局专家」
  'no': 4
  points:
  - '**Falcon 独特的「kv 组」打包：**'
  - '- `query_key_value` 中包含 `n_head/n_head_kv` 个 Q，共享的 K 和 V'
  - '- 重排为 [所有 Q, 所有 K, 所有 V] 连续布局（`view + reshape + cat`）'
  - '- `set_gguf_parameters` 中通过 `tensor_data_layout = "jploski"` 标记此特殊布局'
  - '**Baichuan 的 QKV 三合一：**'
  - '- `W_pack` 把 Q/K/V 拼在一起，需要 `permute(0,1)` 切片并单独 permute'
  - '- `_reverse_hf_permute_part` 处理不同部分的 head 数量差异'
  - '- `_reverse_hf_part` 用于 V 部分（不需要 permute）'
  - '**Xverse 与 Baichuan 类似的 `_reverse_hf_permute` 处理：**'
  - '- 直接对 `q_proj.weight` 与 `k_proj.weight` 各自 permute，不合并 QKV'
  - '**Refact 模型特殊的 FFN 计算公式：**'
  - '- `ff_dim = multiple_of * ((hidden_dim + multiple_of - 1) // multiple_of)`，其中
    `hidden_dim = int(2 * inner_dim / 3)`'
  - '- 需要拆分合并的 `gate_up_proj` 与 `kv` 权重'
  - '- 显式声明 FIM 特殊 token (prefix/suffix/middle/eot)'
