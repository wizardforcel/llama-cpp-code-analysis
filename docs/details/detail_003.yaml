learning_targets:
- 理解 GGML 基础数学运算的实现原理
- 掌握神经网络专用算子（SiLU、RMSNorm、RoPE）的源码
- 了解内存优化技术（in-place、view、复用）的实现机制
- 能阅读并修改自定义算子
- 理解 LLaMA、Mistral、Mixtral 等主流模型的张量命名约定与转换策略
- 掌握 GPT-NeoX、Bloom 等 QKV 打包模型的拆解重排方法
- 理解 Falcon、Baichuan、Refact 等非主流架构的差异化张量布局处理
- 了解 Mamba/Mamba2 状态空间模型特有的 A_log、conv1d 张量转换
- 理解 BERT 系编码器模型的双向注意力与 phantom space 词汇处理
- 掌握 MoE 专家权重的 3D 合并与门控/上投影拆分技巧
life_analogy:
- 想象 GGML 的计算图是一家**智能工厂的生产流水线**：
- '- **张量** = 传送带上的物料箱（每个箱子装着不同形状的零件）'
- '- **运算操作** = 加工机器（加法机、乘法机、混合机、SiLU 染色机）'
- '- **内存池** = 仓库货架（预先规划好的存储空间）'
- '- **in-place 优化** = 原地改造（不搬动物料，直接加工）'
- '- **view 机制** = 贴标签（多个箱子共享同一批货物，只换标签不换内容）'
- '- **专家合并** = 把分散在 8 个小房间里的同款专家集中到一间大仓库（3D 张量叠放）'
- '- **QKV 重排** = 把三股交织的彩线拆开，按 [红-红-红, 蓝-蓝, 绿-绿] 顺序重新卷线'
- '- **RoPE 因子** = 调整时钟齿轮的变速比，让秒针走得快慢交替'
- '- **Llama3 RoPE** = 齿轮变速器：高频区不调速、中频区线性过渡、低频区倍速旋转'
- '- **LazyTorchTensor** = 订单延迟交付（仓库只收小票，零件真要拉走时才上架）'
- '- **NVFP4 超级块** = 4 个一组的快递箱（每箱内附 UE4M3 比例尺 + 32 件货）'
- 就像工厂经理需要精心安排每台机器的位置和物料流转，GGML 的计算图也需要精确规划每个算子的内存使用和计算顺序。
