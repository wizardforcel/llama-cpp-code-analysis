  name: Qwen 系：Qwen2Model 与 Qwen2MoeModel —— 「阿里系模型的标准化模板」
  'no': 5
  points:
  - '**Qwen2Model 的极简主义：**'
  - '- 直接复用 TextModel 的所有逻辑，只修改词表加载路径（SPM → GPT2 fallback）'
  - '- `_try_set_pooling_type` 兼容 sentence-transformers 风格的嵌入模型'
  - '- `modify_tensors` 跳过 mlp/multi_modal_projector/vision_model/audio_tower 等多模态前缀'
  - '**Qwen2MoeModel 的 3D 专家合并：**'
  - '- 缓存 `self._experts[bid][name]`，按 `n_experts * 3` 触发合并'
  - '- 输出形状为 `(n_expert, n_ff, n_embd)` 的 3D 张量'
  - '- 同时处理 NVFP4 量化的特殊路径（`_is_nvfp4` 标志）'
  - '**gate_up_proj 拆分：**'
  - '- 当 HF 存储的是 `[n_expert, 2*n_ff, n_embd]` 时，沿 `dim=-2` 拆分'
  - '- down_proj 不拆分但需保证正确映射到 GGML 维度'
  - '- 注意 GGML 维度顺序与 PyTorch 相反，需要仔细处理 shape'
