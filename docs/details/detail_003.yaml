  name: GPT-NeoX 与 Bloom：QKV 重排专家 —— 「把交错打包的张量重新解开」
  'no': 2
  points:
  - '**为什么 GPT-NeoX 与 Bloom 的 QKV 需要重排？**'
  - '- HF 把 Q/K/V 三组权重打包成 `(n_head, 3, head_dim, n_embed)` 的形状'
  - '- GGML 期望连续排列：[所有 Q, 所有 K, 所有 V]，所以需要 reshape + cat'
  - '- 同时需要处理对应的 bias 张量（QKV 偏置）'
  - '**`GPTNeoXModel.set_gguf_parameters` 的特别之处：**'
  - '- 通过 `rotary_pct` 计算 RoPE 维度（部分旋转）'
  - '- `parallel_residual` 参数描述 GPT-NeoX 的并行残差设计'
  - '**`BloomModel` 的差异：**'
  - '- 通过正则去掉 `transformer.` 前缀'
  - '- `seq_length` 与 `n_positions` 命名差异的兼容处理'
  - '- `feed_forward_length` 固定为 `4 * n_embed`'
  - '**QKV 重排的两种实现变体：**'
  - '- `BaichuanModel._reverse_hf_permute()`：`(n_head, 2, ..., n_embd) swapaxes(1,2)`
    撤销 HF 交织'
  - '- `BaichuanModel._reverse_hf_permute_part()`：切片版，按 `n_part` 划分 W_pack 再 permute'
  - '- `BaichuanModel._reverse_hf_part()`：V 部分纯切片，不做 permute'
  - '- `XverseModel._reverse_hf_permute()`：对 `q_proj.weight` / `k_proj.weight` 各自
    permute，不合并 QKV'
  - '**多模态前缀剥离（Qwen2 为代表）：**'
  - '- `Qwen2Model.modify_tensors()` 跳过 `mlp` / `multi_modal_projector` / `vision_model`
    / `audio_tower` 等前缀'
  - '- 剥离 `language_model.` 前缀以对齐单模态模型'
  - '- 同时兼容 `Qwen2Model`（HF 架构名）→ `model.` 前缀映射'
