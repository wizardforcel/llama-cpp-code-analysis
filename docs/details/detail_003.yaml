  'no': 6
  points:
  - '**MLA (Multi-head Latent Attention) 的拆分：**'
  - '- `kv_b_proj` 同时包含 K 与 V，需要按 `(qk_nope_head_dim, v_head_dim)` 拆分'
  - '- K 部分需要 `transpose(1, 2)` 用于吸收优化'
  - '- 通过把 MLA 转换成 MQA（1 个 KV 头），让 KV Cache 复用更高效'
  - '**`skip_mtp` 与 `merge_expert` 双标志：**'
  - '- 跳过 Multi-Token Prediction 层（这些是投机解码用的）'
  - '- 专家合并机制同 Qwen2MoE'
  - '**Kimi-VL/Kimi-K2.5/Youtu 等多模态前缀剥离：**'
  - '- 自动识别并跳过 `vision_tower` / `multi_modal_projector` / `sam_model` / `merger.`
    / `view_seperator` 等路径'
  - '- 剥离 `language_model.` 前缀以对齐单模态模型'
  - '**DeepseekOCR 特殊分支：**'
  - '- `__init__` 中根据 `origin_hf_arch == "DeepseekOCRForCausalLM"` 切换 `model_arch
    = DEEPSEEK2OCR`'
  - '- 跳过 MLA 相关设置，保留 `rope_theta` 默认值'
