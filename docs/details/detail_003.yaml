exercises:
- contents:
  - 阅读 `convert_hf_to_gguf.py` 第 2409-2531 行，理解 `LlamaModel` 的转换核心，回答以下问题：
  - 1. `LlamaModel.__init__` 中如何修正缺失的 `num_attention_heads`？哪些 HF 架构触发了 `origin_hf_arch`
    缓存？
  - 2. `LlamaModel.permute` 是 `staticmethod`，它的参数 `n_head_kv=None` 起什么作用？什么时候 n_head
    会被压缩到 n_kv？
  - 3. `modify_tensors` 中 `vision_prefixes` 列表列出了哪些前缀？它们如何与 Kimi-VL 等多模态变体协作？
  - 4. `_experts` 列表的字典结构是什么？何时触发 `n_experts * 3` 张量的合并？合并后的 3D 张量 shape 顺序与 GGML
    的 ne 顺序有何关系？
  - 5. `generate_extra_tensors` 中 Llama3 RoPE 因子的三段函数（高频/低频/过渡）各自的判定条件是什么？
  - '6. `prepare_tensors` 末尾的 `ValueError(f"Unprocessed experts: {experts}")` 是如何校验完整性的？'
  - 提示：重点关注 `is_multimodal_tensor` 判定、`block_sparse_moe.experts` 路径以及 rope_params
    的 `llama3` 分支。
  'no': 1
  title: 阅读 LLaMA/Mistral/Mixtral 家族转换逻辑
- contents:
  - 阅读 `convert_hf_to_gguf.py` 第 2684-3206 行，理解四类模型的 QKV 处理，回答以下问题：
  - 1. GPT-NeoX 与 Falcon 在 QKV 打包上的核心区别是什么？为什么 Falcon 要把 `qkv.view` 设计成 `(n_head_kv,
    n_head/n_head_kv+2, head_dim, head_dim*n_head)`？
  - 2. `GPTNeoXModel.set_gguf_parameters` 如何用 `rotary_pct` 计算部分旋转的 RoPE 维度？`parallel_residual`
    是什么？
  - 3. `BaichuanModel.modify_tensors` 如何把单个 `W_pack` 切成 Q/K/V 三份？`_reverse_hf_permute_part(weights,
    n_part, n_head, n_head_kv)` 中的 `n_part` 与 `n_head_kv` 各自的作用是什么？
  - 4. `XverseModel.modify_tensors` 为何只对 `q_proj.weight` 与 `k_proj.weight` 单独 permute，而不合并
    Q/K/V？
  - 5. `RefactModel.modify_tensors` 中 `transformer.h.{bid}.attn.kv.weight` 是如何拆分为
    ATTN_K 与 ATTN_V 的？`ff_dim` 的计算公式 `multiple_of * ((hidden_dim + multiple_of - 1)
    // multiple_of)` 是什么意思？
  - 6. `StableLMModel._stack_qk_norm` 如何判断一个层的所有 head norm 已收集完毕？`prepare_tensors`
    中的最终校验逻辑是怎样的？
  - 提示：在源码中搜索 `qkv_weights.reshape` 与 `qkv.view` 关键词，对比四种实现的差异，并追踪 `_q_norms` / `_k_norms`
    的生命周期。
