  name: 张量命名与架构关联 —— 模型权重的「字典」
  'no': 2
  points:
  - '- `enum llm_tensor` 定义了所有可能的张量类型（token_embd, attn_q, ffn_gate 等），为张量命名提供统一标识。'
  - '- `LLM_TENSOR_NAMES` 映射为每个张量类型提供格式化字符串（如 `blk.%d.attn_norm`），其中 `%d` 表示层号。'
  - '- `LLM_TN` 和 `LLM_TN_IMPL` 结构用于生成带架构和层号的完整张量名称，`LLM_TN` 是用户接口，`LLM_TN_IMPL` 包含实际名称和模型张量集合。'
  - '- `LLM_TN_IMPL` 通过 `operator std::string`、`operator==`、`operator!=` 提供与字符串的无缝互操作，便于查找与比较。'
  - '- `llm_get_tensor_names()` 根据架构返回该架构使用的张量集合，避免未知张量的引入，确保只加载模型实际需要的张量。'
  - '- `LLM_TENSOR_INFOS` 映射为每个张量指定其所属层类型（INPUT/REPEATING/OUTPUT）和使用的 GGML 算子，用于缓冲区分配和后端选择。'
  - '- `llm_tensor_info_for()` 提供从张量类型查询其元信息的接口。'
