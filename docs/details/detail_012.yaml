  name: 超参数派生计算 —— 模型配置的「计算器」
  'no': 5
  points:
  - '- `n_head(il)` 和 `n_head_kv(il)` 返回指定层的注意力头数，从数组中读取，若层索引越界则中止。'
  - '- `n_embd_head_k(il)` 根据层是否为 SWA 返回对应的 key 头维度，实现层特定的维度切换。'
  - '- `n_embd_k_gqa(il)` 计算 GQA 的 key 总维度：`n_embd_head_k(il) * n_head_kv(il)`，并提供了最大值和变量检测方法。'
  - '- `n_embd_r()` 根据模型类型（RWKV, LFM2, Kimi KDA, Mamba）计算滚动状态嵌入维度，为循环架构提供状态缓存大小。'
  - '- `is_swa(il)` 判断指定层是否启用滑动窗口注意力，`is_mla()` 判断模型是否使用多头潜在注意力（MLA）。'
  - '- `has_kv(il)` 和 `n_layer_kv()` 确定哪些层需要 KV 缓存，支持从起始层开始跳过 KV 缓存的配置。'
  - '- `n_pos_per_embd()` 在使用 M-RoPE/iRoPE 时返回 4，否则返回 1，与 `use_mrope()` 协同工作。'
  - '- `n_embd_s()` 计算循环状态嵌入维度（RWKV wkv 状态、Mamba ssm 状态、Kimi KDA 状态）。'
  - '- `is_masked_swa()` 是一个静态内联函数，根据 SWA 类型（STANDARD/CHUNKED/SYMMETRIC）判定两个位置是否需要掩码。'
