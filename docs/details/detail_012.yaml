  name: 架构类型识别 —— 模型家族的「分类器」
  'no': 6
  points:
  - '- `llm_arch_is_recurrent()` 检测架构是否为循环架构（如 Mamba, RWKV），用于选择合适的计算图和内存管理策略。'
  - '- `llm_arch_is_hybrid()` 检测是否为混合架构（如 Jamba, Falcon-H1, Qwen3Next），结合了 Transformer
    和状态空间模型的特点。'
  - '- `llm_arch_is_diffusion()` 检测是否为扩散模型（如 LLaDA, Dream），用于启用非因果注意力和迭代去噪。'
  - '- 这些函数在运行时根据架构枚举进行判断，为上层逻辑提供统一的架构分类接口。'
