  name: 架构枚举与名称映射 —— 模型世界的「身份证」
  'no': 1
  points:
  - '**为什么需要 `enum llm_arch`？** 用于统一标识 llama.cpp 支持的所有模型架构，避免字符串硬编码和魔法数字。'
  - '- `LLM_ARCH_NAMES` 映射将枚举值映射为可读的字符串，方便日志输出、序列化和用户界面显示。'
  - '- `llm_arch_name()` 和 `llm_arch_from_string()` 实现枚举与字符串的双向转换，便于从 GGUF 文件中的架构名查找对应的枚举值。'
  - '- `llm_arch_all()` 返回所有支持的架构列表，用于初始化、遍历和验证。'
