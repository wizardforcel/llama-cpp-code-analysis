  name: 超参数结构体定义 —— 模型属性的「容器」
  'no': 4
  points:
  - '- `struct llama_hparams` 将模型的所有超参数集中管理，包括维度、层数、注意力头数、前馈网络维度等基础参数。'
  - '- 区分 `n_embd_head_k_full`/`n_embd_head_k_swa` 和 `n_rot_full`/`n_rot_swa`，以支持滑动窗口注意力（SWA）中不同的头维度和
    RoPE 维度。'
  - '- MoE 相关字段：`n_expert`, `n_expert_used`, `n_ff_exp`, `n_ff_shexp`, `n_ff_chexp`
    等，覆盖路由专家、共享专家和分组专家的维度。'
  - '- SSM 相关字段：`ssm_d_conv`, `ssm_d_inner`, `ssm_d_state`, `ssm_dt_rank` 等，用于描述 Mamba/RWKV
    等状态空间模型的超参数。'
  - '- 数组字段如 `n_head_arr`, `n_head_kv_arr`, `n_ff_arr` 支持每层不同的超参数，通过 `n_head(il)`
    等方法访问。'
  - '- `static_assert` 强制 `llama_hparams` 是 trivially copyable，以便安全地在内存中序列化与传递。'
