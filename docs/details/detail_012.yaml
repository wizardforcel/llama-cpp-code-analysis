  name: GGUF 元数据键值系统 —— 模型配置的「密码本」
  'no': 3
  points:
  - '- `enum llm_kv` 列举了所有 GGUF 元数据键的逻辑标识，涵盖通用、词汇表、注意力、RoPE、分词器等领域。'
  - '- `LLM_KV_NAMES` 映射将逻辑键转换为字符串键名（如 `general.architecture`），部分键使用 `%s` 占位符插入架构名，实现架构特定的键名。'
  - '- `LLM_KV` 结构接受一个架构和可选后缀，其构造函数 `LLM_KV()` 初始化成员变量，`operator()` 生成带架构前缀的完整键名，如
    `%s.attention.head_count` 替换为 `llama.attention.head_count`。'
  - '- 这种设计允许同一逻辑键在不同架构下有不同的前缀，增强了元数据系统的灵活性和可扩展性。'
