exercises:
- contents:
  - 在 `gguf-py/gguf/constants.py` 的 `Keys` 类中，为混合专家（MoE）架构添加新的元数据键：
  - 1. 在 `Keys.LLM` 中添加 `EXPERT_FEED_FORWARD_LENGTH` 键，用于描述每个专家的FFN维度
  - 2. 在 `Keys.Attention` 中添加 `SLIDING_WINDOW_PATTERN` 键，用于描述滑动窗口注意力的模式
  - 3. 创建新的子类 `Keys.MoE`，包含 `EXPERT_COUNT`、`EXPERT_USED_COUNT`、`ROUTER_SCALING_FACTOR`
    等键
  - 注意遵循现有的命名风格（`{arch}.`前缀，全大写下划线命名）。
  - 思考问题：
  - '- 为什么MoE相关的键应该放在 `Keys.LLM` 还是新子类 `Keys.MoE` 中更合理？参考 `Keys.SSM` 的设计逻辑。'
  - '- 如果需要为每层指定不同的专家数量（如 `[4, 4, 8, 8]`），应该选择 `GGUFValueType` 中的哪种类型？'
  'no': 1
  title: 扩展Keys：为MoE架构添加路由相关元数据键
- contents:
  - 在 `gguf-py/gguf/tensor_mapping.py` 中，找到 `TensorNameMap.__init__` 方法。
  - 手动推演以下场景：假设初始化 `TensorNameMap(MODEL_ARCH.QWEN2, n_blocks=2)`，且 `mappings_cfg`
    包含 `MODEL_TENSOR.TOKEN_EMBD`，`arch_block_mappings_cfg` 包含 `MODEL_TENSOR.ATTN_Q`，`block_mappings_cfg`
    包含 `MODEL_TENSOR.FFN_UP`。
  - 1. 写出最终 `self.mapping` 中包含的所有键值对（注意区分 `mappings_cfg` 与 `block_mappings_cfg` 的处理差异）
  - 2. 解释 `get_name('model.layers.0.mlp.up_proj.weight', try_suffixes=['.weight'])`
    的完整执行流程，包括后缀剥离如何工作
  - 3. 如果要支持 `model.layers.0.mlp.experts.0.gate_proj` 这样的MoE专家名称，需要在 `mappings_cfg`
    还是 `arch_block_mappings_cfg` 中添加映射？写出具体的映射条目。
  'no': 2
  title: 追踪TensorNameMap对特殊架构的映射生成
- contents:
  - 查看 `GGMLQuantizationType` 枚举（约3934行）和 `LlamaFileType`（约3978行）。
  - 假设需要支持一种新的硬件加速器量化格式「HW_Q4」（硬件原生4-bit），请：
  - 1. 在 `GGMLQuantizationType` 中添加 `HW_Q4` 枚举值，选择合适的整数值并解释原因（是否利用预留空间，是否与现有类型冲突）
  - 2. 在 `LlamaFileType` 中添加 `MOSTLY_HW_Q4`，并说明它应该放在哪个位置以保持向后兼容
  - 3. 修改 `GGUFValueType.get_type()` 方法，使其能够正确处理 `numpy.uint4` 类型（假设存在），返回适当的 `GGUFValueType`
  - 4. 查阅 `MODEL_TENSORS` 中 `MODEL_ARCH.LLAMA` 的定义，说明「MOSTLY_HW_Q4」意味着哪些张量会被量化（提示：1D张量vs2D张量）
  - 5. 思考 `GGUF_ENDIAN` 在处理这种新型量化格式时的作用，是否需要特殊处理？
  'no': 3
  title: 设计支持NVFP4和动态量化的类型系统扩展
- contents:
  - 查看 `GGUFType` 枚举（MODEL/ADAPTER/IMATRIX/MMPROJ）。
  - 结合LlamaFileType，回答以下问题：
  - 1. 当转换一个纯LoRA适配器时，`GGUFType` 应该设置为什么值？此时 `LlamaFileType` 还有意义吗？为什么？
  - 2. 如果一个文件同时包含基础模型权重和LoRA权重（合并导出），应该选择哪种 `GGUFType`？
  - 3. `IMATRIX` 类型的文件与 `MODEL` 类型的文件在 `Keys` 的使用上有何差异？（提示：查看 `Keys.IMatrix` 与 `Keys.LLM`
    的键定义）
  - 4. 设计一个场景：你需要创建一个包含视觉编码器和语言模型的多模态文件，但只保存投影层（projector），你会如何组合使用 `GGUFType` 和相关
    `Keys`？
  'no': 4
  title: 分析GGUFType在实际转换流程中的应用
learning_targets:
- 掌握GGUF元数据键名（Keys）的分层设计与架构无关占位符模式，理解18个嵌套子类的职责划分
- 理解MODEL_ARCH/MODEL_TENSOR/MODEL_TENSORS/GGUFType如何构成模型架构的统一坐标系
- 深入量化类型（GGMLQuantizationType、LlamaFileType）与值类型（GGUFValueType）的类型系统
- 掌握TokenType、RopeScalingType、PoolingType、ExpertGatingFuncType、VisionProjectorType等专项枚举的设计
- 剖析TensorNameMap三层映射架构（mappings_cfg/arch_block_mappings_cfg/block_mappings_cfg）与动态生成机制
- 理解GGUF_ENDIAN字节序与GGUFValueType.get_type()自动类型推导的实现原理
life_analogy:
- 想象GGUF的常量体系是一个**全球化智能物流中心的标准化编码系统**：
- '- **Keys的18个子类** = 物流中心的**18个专业部门窗口**（收件部/分拣部/冷链部/国际部），每个部门（General/LLM/Attention/Tokenizer等）只处理特定类型的包裹信息，`{arch}`占位符就像「国家代码」，自动适配不同地区的格式要求'
- '- **GGUFType** = 包裹的**四种运输方式标识**（MODEL=标准货运/ADAPTER=外挂配件/IMATRIX=质检报告/MMPROJ=多模态集装箱），决定整个物流链的处理流程'
- '- **MODEL_ARCH** = 100+种**集装箱类型**（冷藏箱/油罐箱/框架箱/开顶箱），每种类型（llama/qwen/mamba/deepseek）都有唯一的ISO编码，新增型号只需注册新编码'
- '- **MODEL_TENSOR** = 集装箱内的**货物分类学**（电子产品/纺织品/食品/危险品），无论哪种箱子，内部货物都按统一标准分类贴标'
- '- **MODEL_TENSORS映射表** = 每种集装箱的**标准装箱清单**（Checking List），规定Qwen3必须装哪些货物，Mamba必须装哪些部件，DeepSeek需要哪些特殊设备'
- '- **TensorNameMap** = **多语言翻译官+自动贴标机**，既懂英文（PyTorch的`model.layers.0.self_attn.q_proj.weight`），也懂世界语（GGUF的`blk.0.attn_q.weight`），并能为100层的超大型集装箱自动生成每一层的标签（`{bid}`展开为0,1,2...99）'
- '- **量化类型** = 不同的**压缩包装工艺**（Q4_0是经济压缩，Q8_0是标准包装，F32是豪华精装，MXFP4是新型纳米压缩），LlamaFileType决定整个集装箱以哪种工艺为主，1D小件保持原包装'
- '- **GGUFValueType.get_type()** = **智能材质检测仪**，放入Python对象自动判断应贴哪种标签（str→STRING, int→INT32,
  list→ARRAY），避免人工填写错误'
'no': 56
summary:
- concept: '`Keys`'
  desc: GGUF元数据的「身份档案柜」，通过18个嵌套子类（General/LLM/Attention/Tokenizer/ClipVision等）组织500+标准键名，使用`{arch}`占位符实现架构无关设计
- concept: '`GGUFType`'
  desc: 文件类型「运输标识」，区分MODEL（标准模型）、ADAPTER（LoRA适配器）、IMATRIX（重要性矩阵）、MMPROJ（多模态投影）四种文件用途
- concept: '`MODEL_ARCH`'
  desc: 模型架构的「基因编码」，枚举100+种模型（LLaMA/Qwen/Mamba/DeepSeek/Falcon等），使用`auto()`自动生成唯一ID，支持REDEFINED_ARCH扩展
- concept: '`MODEL_TENSOR`'
  desc: 张量的「分类标签」，定义所有可能的张量类型（TOKEN_EMBD/ATTN_Q/FFN_DOWN/SSM_IN/TIME_MIX_W0等），作为跨架构的统一语言
- concept: '`MODEL_TENSORS`'
  desc: 架构到张量的「装箱清单」，声明每种架构必须包含的张量类型，用于转换器校验完整性与推理引擎内存分配
- concept: '`GGMLQuantizationType`'
  desc: 量化方案的「度量衡」，覆盖F32/F16/Q4_0/Q8_0/IQ系列/TQ系列/MXFP4/NVFP4/Q1_0等20+种压缩格式，支持新型硬件量化
- concept: '`LlamaFileType`'
  desc: 文件级量化策略，「MOSTLY_」前缀表示1D张量保持高精度、仅大矩阵量化的混合策略，包含MOSTLY_MXFP4_MOE等新型配置
- concept: '`GGUFEndian`'
  desc: 字节序「交通规则」，LITTLE（0）/BIG（1）枚举支持跨平台（x86/ARM/大型机）文件兼容
- concept: '`GGUFValueType`'
  desc: 元数据的「类型系统」，定义UINT8到FLOAT64等13种值类型，`get_type()`静态方法实现Python类型（str/int/float/list/bool）到GGUF类型的自动推导
- concept: '`TokenType`'
  desc: 分词单元的「身份标签」，区分NORMAL/UNKNOWN/CONTROL/USER_DEFINED/UNUSED/BYTE六种类型，影响tokenizer行为与特殊token处理
- concept: '`RopeScalingType`'
  desc: 长上下文「伸缩策略」，支持NONE/LINEAR/YARN/LONGROPE四种位置编码缩放模式，用于扩展模型上下文窗口
- concept: '`PoolingType`'
  desc: 嵌入模型的「聚合方式」，提供NONE/MEAN/CLS/LAST/RANK五种池化策略，适应不同下游任务（分类/检索/排序）
- concept: '`ExpertGatingFuncType`'
  desc: MoE的「路由算法」，SOFTMAX传统门控 vs SIGMOID现代门控（DeepSeek等），影响专家选择概率计算
- concept: '`VisionProjectorType`'
  desc: 多模态「视觉翻译器」，定义30+种视觉投影器类型（gemma3/qwen2vl_merger/internvl/cogvlm等），连接视觉与语言模型
- concept: '`TensorNameMap`'
  desc: 框架方言的「通用翻译官」，三层映射架构+后缀剥离算法实现PyTorch/HuggingFace命名到GGUF标准命名的自动转换
- concept: '`mappings_cfg`'
  desc: 静态映射「词典」，定义架构无关的通用张量映射（如embedding/output/norm等）
- concept: '`arch_block_mappings_cfg`'
  desc: 架构特定「补充协议」，处理Mamba的SSM层等特殊架构的专属张量映射
- concept: '`block_mappings_cfg`'
  desc: 动态映射「生成器」，通过`{bid}`占位符循环展开n_blocks层，自动生成所有层的映射关系
- concept: '`get_type_and_name()`'
  desc: 核心查询「算法」，支持后缀剥离重试（如处理.lora_A/.lora_B后缀），实现鲁棒的名称解析与类型推导
