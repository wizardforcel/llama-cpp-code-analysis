  name: TensorNameMap 映射引擎 —— 框架方言的「通用翻译官」
  'no': 5
  points:
  - '**为什么需要 TensorNameMap？**'
  - '- PyTorch/HuggingFace 使用 `model.layers.0.self_attn.q_proj.weight` 等命名'
  - '- GGUF 使用标准化名称 `blk.0.attn_q.weight`'
  - '- 不同框架（HF、Mamba、RWKV、T5）命名风格差异巨大，需要自动化映射机制'
  - '**三层映射架构设计**'
  - '- `mappings_cfg`（572-1400行）：静态映射，架构无关的通用张量（如 `token_embd`、`output`、`norm`）'
  - '- `arch_block_mappings_cfg`（1443-1708行）：架构特定补充，处理 Mamba 的 SSM 层、RWKV 的 time_mix
    等特殊结构'
  - '- `block_mappings_cfg`：动态生成，按 `{bid}` 占位符展开所有层（第0层到第n-1层）'
  - '**初始化流程深度解析（__init__）**'
  - '- 第一阶段：遍历 mappings_cfg，过滤出当前架构实际拥有的张量类型（通过 MODEL_TENSORS 校验）'
  - '- 第二阶段：处理架构特有的块映射（arch_block_mappings_cfg），合并到 block_mappings_cfg'
  - '- 第三阶段：循环 n_blocks 次，替换 `{bid}` 占位符，生成所有层的具体映射（如 `blk.0.attn_q`、`blk.1.attn_q`...）'
  - '**查询接口与后缀剥离算法**'
  - '- `get_type_and_name()`：核心查询，支持后缀剥离重试（如处理 `.lora_A`、`.lora_B`、`.weight` 后缀）'
  - '- `get_name()` / `get_type()`：便捷封装，分别返回标准名称或张量类型'
  - '- `__getitem__` / `__contains__`：字典式访问接口，支持 `map[''name'']` 语法'
  - '- `__repr__`：调试输出，直接展示内部映射字典'
  - '**工厂函数与使用模式**'
  - '- `get_tensor_name_map(arch, n_blocks)`：工厂函数，创建并返回配置好的映射实例'
  - '- 典型使用：转换器初始化时创建映射，遍历源模型张量时调用 `get_type_and_name` 查询目标名称'
