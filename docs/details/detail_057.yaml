  name: 量化类型、值类型与字节序 —— 数据世界的「度量衡体系」
  'no': 3
  points:
  - '**GGMLQuantizationType：模型的「瘦身方案库」**'
  - '- 从 F32/F16 全精度到 Q4_0/Q8_0 整数量化，再到 IQ2_XXS/IQ4_NL 非均匀量化（查找表）'
  - '- K-quant（Q2_K-Q6_K）：分组量化，在精度与体积间取得平衡'
  - '- 特殊格式：TQ1_0/TQ2_0（三元量化）、MXFP4/NVFP4（微缩放 FP4）、Q1_0（1-bit 实验性）'
  - '- 数值连续但非全连续（如缺少 4-5、31-33），预留扩展空间'
  - '**LlamaFileType：文件级的量化策略「总指挥」**'
  - '- 描述整个模型的主导量化类型（如 MOSTLY_Q4_K_M、MOSTLY_MXFP4_MOE）'
  - '- 「MOSTLY」前缀表示 1D 张量（如 bias、norm）保持 F32/F16 高精度，仅大矩阵（2D+）量化'
  - '- `GUESSED`：文件未指定时的推测策略'
  - '**GGUFValueType：元数据的「类型系统」**'
  - '- 定义 13 种值类型（UINT8 到 FLOAT64、STRING、ARRAY、BOOL）'
  - '- `get_type()` 静态方法实现 Python 类型自动推导：str→STRING，list→ARRAY，int→INT32，float→FLOAT32，bool→BOOL'
  - '- 明确区分有符号/无符号整数与不同位宽浮点数'
  - '**GGUFEndian：跨平台的「字节序翻译官」**'
  - '- LITTLE（0）：x86/x64/ARM 主流架构使用'
  - '- BIG（1）：网络字节序、部分嵌入式系统'
  - '- 读取时自动检测并转换，确保跨平台兼容性'
