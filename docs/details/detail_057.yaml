  name: 模型架构、文件类型与张量映射 —— 百种架构的「统一坐标系」
  'no': 2
  points:
  - '**GGUFType：文件用途的「身份标识」**'
  - '- `MODEL`：标准模型文件，包含完整权重与配置'
  - '- `ADAPTER`：适配器文件（如LoRA），仅包含增量权重，需配合基础模型使用'
  - '- `IMATRIX`：重要性矩阵文件，存储量化校准数据'
  - '- `MMPROJ`：多模态投影文件，连接视觉/音频编码器与语言模型'
  - '**MODEL_ARCH 枚举：架构的「基因编码」**'
  - '- 从 LLAMA、QWEN、FALCON、GPT2 到 DEEPSEEK、MAMBA、JAMBA，覆盖 100+ 种模型架构'
  - '- 使用 `auto()` 自动生成枚举值，新增架构无需手动编号，避免冲突'
  - '- `REDEFINED_ARCH`：支持需要重新定义的架构变体'
  - '- 每个架构对应唯一的字符串名称（如 `llama`、`qwen2`），通过 `MODEL_ARCH_NAMES` 映射'
  - '**MODEL_TENSOR 枚举：张量的「分类标签」**'
  - '- 定义所有可能的张量类型（TOKEN_EMBD、OUTPUT、ATTN_Q、ATTN_K、FFN_DOWN、SSM_IN、TIME_MIX_W0 等）'
  - '- 与架构无关，同一类型张量在不同架构中含义一致（如 `ATTN_Q` 对LLaMA和Mamba都表示注意力查询权重）'
  - '**MODEL_TENSORS 字典：架构到张量的「装箱清单」**'
  - '- 核心作用：声明每种架构「应该有哪些张量」，用于转换器校验源模型完整性与推理引擎内存分配'
  - '- 例如 LLAMA 架构需要 TOKEN_EMBD、ATTN_Q、ATTN_K、ATTN_V、ATTN_OUT、FFN_UP、FFN_DOWN 等'
  - '- Mamba 架构还需要 SSM_IN、SSM_OUT、SSM_DT 等特有张量'
  - '**TENSOR_NAMES 字典：张量的「标准命名规范」**'
  - '- 将 MODEL_TENSOR 映射为实际字符串（如 `token_embd.weight`、`blk.{bid}.attn_q.weight`）'
  - '- `{bid}` 占位符在运行时替换为具体层号（0, 1, 2...）'
