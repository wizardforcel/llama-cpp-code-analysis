  name: 特殊化枚举 —— 分词、池化、门控与视觉的「扩展词典」
  'no': 4
  points:
  - '**TokenType：分词单元的「身份标签」**'
  - '- `NORMAL`：普通 token，`UNKNOWN`：未知 token，`CONTROL`：控制符（如<|im_start|>）'
  - '- `USER_DEFINED`：用户自定义 token（如特殊领域术语），`UNUSED`：未使用保留位，`BYTE`：字节级 token（用于回退）'
  - '- 影响分词器的合并策略、特殊token处理与输出过滤'
  - '**RopeScalingType：长上下文的「伸缩策略」**'
  - '- `NONE`：不缩放，原生上下文窗口'
  - '- `LINEAR`：线性插值（如将4K扩展到8K）'
  - '- `YARN`：NTK-aware 缩放，保持高频信息（LongRoPE等）'
  - '- `LONGROPE`：微软长上下文扩展方案，支持128K+'
  - '**PoolingType：嵌入模型的「聚合方式」**'
  - '- `NONE`：取最后一层 hidden state（生成任务常用）'
  - '- `MEAN`：平均池化（取序列所有token均值，适合语义相似度）'
  - '- `CLS`：取 [CLS] token（BERT风格分类任务）'
  - '- `LAST`：取最后一个 token（因果语言模型特征）'
  - '- `RANK`：排序池化（用于检索排序任务）'
  - '**ExpertGatingFuncType：MoE 的「路由算法」**'
  - '- `SOFTMAX`：传统 softmax 门控（如 Mixtral），计算专家概率分布'
  - '- `SIGMOID`：sigmoid 门控（如 DeepSeek-V2），二值化选择专家，更高效'
  - '**VisionProjectorType：多模态的「视觉翻译器」**'
  - '- 定义 30+ 种视觉投影器类型（gemma3、qwen2vl_merger、internvl、cogvlm、deepseekocr 等）'
  - '- 每种类型对应不同的视觉-语言特征对齐架构（MLP、Cross-attention、Resampler 等）'
  - '- 支持音频（qwen2a、voxtral）与视频理解扩展'
