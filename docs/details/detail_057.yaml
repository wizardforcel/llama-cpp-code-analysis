  name: Keys 元数据键名体系 —— 模型的「身份档案柜」
  'no': 1
  points:
  - '**为什么需要 Keys 类的 18 个嵌套子类？**'
  - '- GGUF 文件是自描述的，所有模型属性都通过键值对存储，'
  - '- 键名需要全局统一，避免不同转换器产生命名冲突'
  - '- 按功能域划分子类：通用信息（General）、模型架构（LLM/Attention/RoPE）、特殊模块（SSM/KDA/WKV）、多模态（Clip/ClipVision/ClipAudio）、外部依赖（Tokenizer/Adapter/IMatrix）'
  - '- 使用 `{arch}` 占位符实现架构无关的键名模板，例如 `{arch}.context_length` 可展开为 `llama.context_length`
    或 `qwen2.context_length`'
  - '**核心子类详解**'
  - '- `General`：模型类型（MODEL/ADAPTER等）、架构名、量化版本、采样参数（temp/top_p等）'
  - '- `LLM`：大语言模型专属超参数（vocab_size、context_length、embedding_length、rope参数）'
  - '- `Attention`：注意力头数、KV头数、温度缩放、索引器（Indexer）参数'
  - '- `Tokenizer`：分词器模型（bpe/spm）、pre_tokenizer、merges、特殊token ID（bos/eos/pad）'
  - '**专业模块键名**'
  - '- `SSM`：状态空间模型参数（conv_kernel、inner_size、dt_b_c_rms）'
  - '- `KDA`：KDA模块的head_dim参数'
  - '- `WKV`：RWKV模型的位置编码参数（head_size）'
  - '- `ClipVision/ClipAudio`：视觉/音频编码器的完整配置（attention/projector/sam子类）'
  - '**扩展性设计**'
  - '- `Diffusion`：扩散模型的shift_logits参数'
  - '- `xIELU`：新型激活函数的alpha_p/alpha_n/beta/eps参数'
  - '- `ShortConv`：短卷积层的l_cache参数'
