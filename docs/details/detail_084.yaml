- concept: server_task_result_error
  desc: 错误封装：标准化错误类型与消息传递
- concept: server_task_result_metrics
  desc: 性能指标：槽位利用率与吞吐量统计
- concept: server_task_result_slot_*
  desc: 槽位管理：KV缓存槽位的保存/加载/擦除状态
- concept: server_task_result_*_lora
