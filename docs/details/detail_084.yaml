  desc: 流式状态机：增量diff计算与reasoning/content块跟踪
- concept: to_json_oaicompat_*
  desc: OpenAI兼容：文本/聊天/Responses三种API的序列化
- concept: to_json_anthropic
  desc: Anthropic适配：thinking/text/tool_use内容块组装
- concept: server_prompt_cache
  desc: KV缓存管理：LRU双限制淘汰与llama_state_seq_set_data_ext状态恢复
- concept: result_timings
  desc: 计时统计：Prompt处理与Token生成的性能指标
- concept: result_prompt_progress
  desc: 进度追踪：长提示词处理的实时进度反馈
