  - '- 聊天补全：to_json_oaicompat_chat生成chat.completion，支持finish_reason="tool_calls"标识'
  - '- Responses API：to_json_oaicompat_resp生成reasoning/item/response.completed三段式事件'
  - ''
  - '**Anthropic 内容块模型**'
  - '- to_json_anthropic将结果映射为content_blocks数组：thinking块（含signature字段）、text块、tool_use块'
  - '- tool_call.arguments作为JSON字符串解析为input字段（异常时fallback为空对象）'
  - '- stop_reason区分end_turn（自然停止）与tool_use（工具调用触发）'
  - ''
  - '**通用使用量统计**'
  - '- usage_json_oaicompat()标准化prompt_tokens/completion_tokens/total_tokens及cached_tokens详情'
