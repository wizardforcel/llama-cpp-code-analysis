  name: 任务参数解析 —— 从 JSON 请求到内部配置的「翻译官」
  'no': 1
  points:
  - '**为什么需要 task_params 这个中间层？**'
  - '- 外部协议的JSON字段与内部llama.cpp参数命名存在差异（如OpenAI用temperature而非temp）'
  - '- 需要统一处理采样参数、语法约束、LoRA适配器等异构配置的工厂模式'
  - '- params_from_json_cmpl作为静态工厂方法，实现了「协议JSON → 内部参数对象」的标准化转换'
  - ''
  - '**核心机制：静态工厂与默认参数继承**'
  - '- params_from_json_cmpl(vocab, params_base, n_ctx_slot, data)接收服务器全局默认参数base，允许请求级参数覆盖'
  - '- 通过defaults对象继承sampling、speculative等配置，确保未指定字段使用服务器默认值'
  - '- 处理采样器链（sampling.samplers）、推测解码参数、语法触发器等复杂结构'
  - ''
  - '**序列化与反向格式化**'
  - '- to_json(bool only_metrics)支持两种模式：完整配置回显（用于调试）或仅返回指标（用于响应）'
  - '- format_logit_bias将llama_logit_bias结构体数组转换为[{bias: 1.5, token: 123}]格式，满足OpenAI
    API契约'
