exercises:
- contents:
  - 阅读 `tools/server/server-task.cpp` 第185-393行的 `params_from_json_cmpl` 函数，理解参数继承机制：
  - 1. 分析 `defaults` 对象如何从 `params_base` 继承采样参数和推测配置
  - 2. 找出三个在请求JSON中被特殊处理的参数字段（非直接映射）
  - 3. 解释为什么需要同时处理 `sampling.samplers` 数组和单个采样器参数
  'no': 1
  title: 任务参数解析机制分析
- contents:
  - 阅读 `tools/server/server-task.h` 第155-248行和 `server-task.cpp` 相关实现：
  - 1. 绘制 `server_task::add_child()` 的任务树结构图，说明子任务ID与父任务ID的关系
  - 2. 解释 `seed += child_index` 的设计意图与潜在风险
  - 3. 分析 `get_list_id()` 在批量取消操作中的作用
  'no': 2
  title: 树状任务与并行生成
- contents:
  - 对比 `server_task_result_cmpl_partial::update()`（L1304-1327）与 `task_result_state::update_chat_msg()`（L110-178）：
  - 1. 绘制流式生成过程中的状态流转图（thinking_block_started, text_block_started, oai_resp_id等）
  - 2. 解释 `filter_tool_calls` 参数在工具调用流式输出中的过滤逻辑
  - 3. 说明为什么需要在 `update()` 中预计算下一次chunk的状态而非直接使用当前状态
  'no': 3
  title: 流式状态机追踪
- contents:
  - 对比 `to_json_oaicompat_chat()`（L864-901）与 `to_json_anthropic()`（L1075-1128）：
  - 1. 列出OpenAI `choices[0].message` 与 Anthropic `content_blocks` 的结构差异
  - 2. 分析 `usage_json_oaicompat()` 与 Anthropic `usage` 在token统计字段上的命名差异及原因
  - 3. 解释 Anthropic 格式中 `thinking` 块为什么需要 `signature` 字段（即使为空字符串）
  'no': 4
  title: 多协议序列化设计
- contents:
  - 阅读 `completion_token_output::probs_vector_to_json()`（L467-482）与 `logarithm()`（L484-488）：
  - 1. 解释 `logprob` 与 `prob` 两种模式的应用场景（`post_sampling_probs` 参数控制）
  - 2. 分析 `logarithm()` 中对 `0.0f` 的特殊处理解决了什么JSON序列化问题
  - 3. 说明 `str_to_bytes()` 为什么是确保多字节UTF-8字符安全传输的关键
  'no': 5
  title: Token概率数据处理
- contents:
  - 阅读 `server_prompt_cache::alloc()`（L1931-1965）与 `load()`（L1967-2007）：
  - 1. 绘制缓存命中时 `f_keep` 与 `sim` 双阈值的决策流程图
  - 2. 解释 `alloc()` 中内存分配失败后 `limit_size` 降至40%的自适应降级策略
  - 3. 分析 `load()` 末尾 `it_best->data.clear()` 配合 `states.erase()` 的移动语义所有权转移
  'no': 6
  title: 提示词缓存机制剖析
- contents:
  - 阅读 `server_task_result_embd`、`server_task_result_rerank`、`server_task_result_error`、`server_task_result_metrics`
    的声明与实现（L500-594）：
  - '1. 比较嵌入结果与重排序结果在JSON结构上的差异，解释为何嵌入需要`object: "list"`而重排序不需要'
  - 2. 分析`server_task_result_error`如何通过`err_type`字段区分客户端错误与服务器内部错误
  - 3. 说明`server_task_result_slot_save_load`与`server_task_result_slot_erase`为何需要独立的JSON结构而非复用通用结果格式
  'no': 7
  title: 结果类型族谱分析
learning_targets:
- 理解任务参数解析机制：JSON请求到内部配置的标准化转换流程
- 掌握server_task结构体的并行生成与树状任务管理能力
- 精通流式响应的增量状态机与多协议（OpenAI/Anthropic）序列化实现
- 理解Token输出封装中的概率数据处理与UTF-8安全传输机制
- 掌握提示词缓存（KV Cache）的LRU管理策略与状态恢复技术
- 理解结果类型族谱：从生成结果到错误、指标、嵌入与LoRA管理
- 掌握计时统计与进度追踪（result_timings与result_prompt_progress）的标准化输出
life_analogy:
- 想象llama.cpp服务器是一座**现代化中央厨房**：
- '- **task_params** = 顾客点菜单（OpenAI格式是西式摆盘，Anthropic是日式便当，内部都翻译成标准食谱）'
- '- **server_task** = 厨师的工单系统，支持主厨带学徒（父子任务）并行做菜'
- '- **completion_token_output** = 每道菜的分子料理标签，精确记录成分概率与字节级安全封装'
- '- **task_result_state** = 流水线上的增量装配员，确保思考过程（reasoning）与正文（content）像寿司一样逐一贯口呈现'
- '- **server_prompt_cache** = 智能备餐柜，相同的前菜（提示前缀）直接复用，省却重复切配时间'
- '- **server_task_result_family** = 出餐口的传菜员，根据顾客类型（OpenAI/Anthropic/内部）用不同餐具摆盘'
- 就像顶级餐厅需要精确协调前厅点菜与后厨出餐，llama.cpp的任务系统也需要精确管理参数解析、状态流转与缓存复用。
'no': 83
summary:
- concept: task_params
  desc: 参数翻译官：统一JSON请求到内部配置的标准化转换
- concept: params_from_json_cmpl
  desc: 静态工厂：基于默认参数实现请求级覆盖与继承
- concept: server_task
  desc: 任务工单：支持树状并行（add_child）与类型路由（need_*）
- concept: completion_token_output
  desc: Token档案：概率/logprob双模式与UTF-8安全字节封装
