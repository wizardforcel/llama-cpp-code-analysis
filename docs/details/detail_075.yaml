  name: 多模态资源编码与图像预处理基座 —— 数据整形的'美容工坊'
  'no': 4
  points:
  - '**编码与查询接口**'
  - '- `mtmd_encode_chunk()`：统一处理文本（无操作）、图像（走 `mtmd_encode`）和音频（直接 `clip_image_batch_encode`）chunk'
  - '- `mtmd_encode()`：针对 LLaVA/MiniCPM/GLM 等特殊模型逐张编码，或批量编码普通图像'
  - '- `mtmd_get_output_embd()`：获取编码后的嵌入向量指针'
  - '- `mtmd_decode_use_mrope()` / `mtmd_decode_use_non_causal()`：查询位置编码与注意力模式'
  - '**图像预处理基类与工具集**'
  - '- `mtmd_image_preprocessor::mtmd_image_preprocessor()` / `~mtmd_image_preprocessor()`：基类构造与析构'
  - '- `mtmd_image_preprocessor::preprocess()`：纯虚接口，由派生类实现具体预处理逻辑'
  - '- `mtmd_image_preprocessor::img_u8_to_f32()`（双重重载）：支持带 mean/std 归一化与不带归一化的转换'
  - '- `img_tool::resize()`：智能缩放（支持 BILINEAR/BICUBIC/PILLOW 算法，可选保持比例+填充）'
  - '- `img_tool::crop()` / `composite()` / `fill()`：图像裁剪、合成与纯色填充'
  - '- `img_tool::clip()` / `lerp()`：基础数学工具函数'
  - '**插值算法三剑客**'
  - '- `resize_bilinear()`：双线性插值，平衡速度与质量'
  - '- `resize_bicubic()`：双三次插值，更高质量的重采样'
  - '- `resize_bicubic_pillow()`：基于Pillow算法的可分离双三次插值，定点优化'
  - '**尺寸计算策略**'
  - '- `calc_size_preserved_ratio()`（overload 1）：根据最长边和对齐约束计算缩放尺寸'
  - '- `calc_size_preserved_ratio()`（overload 2）：根据最小/最大像素约束计算缩放尺寸（智能缩放）'
