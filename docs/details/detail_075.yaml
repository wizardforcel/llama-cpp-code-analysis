exercises:
- contents:
  - 阅读 `tools/mtmd/mtmd.cpp` 中 `mtmd_tokenizer` 的构造与核心方法（第508-978行），以及 `mtmd.h` 中的
    RAII 包装类（第254-288行），回答以下问题：
  - 1. 当输入文本包含 `<__media__>` 标记时，`tokenize()` 如何交替生成文本 chunk 与媒体 chunk？`add_image_media()`
    与 `add_audio_media()` 分别承担什么角色？
  - 2. `mtmd::bitmap` 的四个构造函数分别适用于什么场景？移动构造函数如何确保资源所有权的正确转移？
  - 3. `mtmd_input_chunk_get_n_pos()` 在处理 M-RoPE 图像时与普通文本有何不同？为什么要区分 n_tokens 和 n_pos？
  - 4. 如果模型同时启用了视觉与音频支持，`mtmd_context` 如何确保两种模态的嵌入维度兼容性？
  'no': 1
  title: 追踪多模态输入的完整生命周期
- contents:
  - 阅读 `tools/mtmd/mtmd-helper.cpp` 中 `decode_embd_batch` 的位置设置方法与资源加载函数，完成以下分析：
  - 1. 对比 `set_position_normal()` 与 `set_position_mrope_2d()`：对于一张 2x2 的图像 patch（共4个token），普通模式和
    M-RoPE 模式下的 `pos[]` 数组内容分别是什么？
  - 2. 解释为什么 `mtmd_helper_bitmap_init_from_buf()` 需要先检测音频 magic bytes？如果误判会导致什么后果？
  - 3. `get_view()` 方法在处理 M-RoPE 时为什么要重新组织 `pos_view`？如果不重新组织会发生什么错误？
  'no': 2
  title: 分析 M-RoPE 位置编码与资源加载机制
- contents:
  - 假设你要为一个新模型 "MyVLM" 实现图像预处理，要求：输入图像必须调整为 448x448，且宽高比保持为原图（不足部分填充黑色），并支持可选的网格切片（2x2）。
  - 参考 `tools/mtmd/mtmd-image.h` 和 `mtmd-image.cpp` 中的 `mtmd_image_preprocessor_fixed_size`、`mtmd_image_preprocessor_dyn_size`
    与 `mtmd_image_preprocessor_llava_uhd`：
  - 1. 你会选择继承哪个基类？为什么？需要重写哪些方法？
  - 2. 描述预处理流程：该如何组合 `img_tool::resize()`（带 padding）、`slice_image()` 与 `img_u8_to_f32()`？
  - 3. 在 `mtmd_context::init_vision()` 中，如何根据 `projector_type` 注册你的新预处理器？
  - 4. 如果该模型需要 M-RoPE 位置编码，`batch_f32` 中的 `grid_x` 和 `grid_y` 应该如何设置以配合 `decode_embd_batch`？
  'no': 3
  title: 设计一个新的图像预处理策略
- contents:
  - 阅读 `tools/mtmd/mtmd.h` 第232-288行的 deleter 与 RAII 包装类，以及 `mtmd.cpp` 中的 `mtmd_input_chunk_copy`
    与 `clone()` 方法：
  - 1. `mtmd::bitmap` 和 `mtmd::input_chunks` 使用了哪种智能指针模式？自定义 deleter 与默认 deleter 有何不同？
  - 2. `mtmd_input_chunk_copy()` 中对 `tokens_image` 和 `tokens_audio` 的深拷贝是如何实现的？为什么需要调用
    `clone()` 而不是简单的指针复制？
  - 3. 在什么情况下调用 `mtmd_bitmap_free()` 会导致双重释放错误？RAII 如何避免这类问题？如果上层应用混用 C API 与 C++
    包装类会发生什么？
  'no': 4
  title: 调试资源内存管理与深拷贝
learning_targets:
- 掌握 mtmd（multimodal）模块的公共 C API 与 C++ RAII 封装设计
- 理解 mtmd_context 如何统一管理视觉（CLIP）与音频编码器的初始化与生命周期
- 深入多模态输入的 Tokenization 机制：文本切割、媒体标记识别与 Chunk 生成
- 掌握 mtmd-helper 层如何实现 M-RoPE 多维位置编码与跨模态批处理解码
- 理解图像预处理（缩放、切片、归一化）与音频预处理（梅尔频谱、分块）的流水线
- 学会使用 mtmd_bitmap 等抽象处理图像与音频原始数据，并理解其内存管理策略
- 掌握智能指针包装类（deleter模式）与C API资源管理的最佳实践
life_analogy:
- 想象 mtmd 是一个**国际货运中心**（多模态处理中心）：
- '- **mtmd_context** = 货运中心的**总指挥调度室**，同时管理「图像集装箱码头」（视觉编码器）和「音频货运站」（音频编码器），确保不同模态的货物（数据）能统一换算成标准集装箱（嵌入向量）'
- '- **mtmd::bitmap / RAII** = **智能集装箱管理系统**，通过自动门禁（deleter）确保集装箱离开园区时自动归还，避免遗失（内存泄漏）'
- '- **mtmd_tokenizer** = **智能分拣流水线**，识别文本中的 `<__media__>` 标记（集装箱编号），将文本包裹与图像/音频集装箱交替排列，生成最终装船清单'
- '- **图像预处理家族** = **多种规格整形车间**，从固定尺寸（fixed_size）到动态规划（dyn_size），再到高精度切片（LLaVA-UHD/LFM2），满足不同货船的装载要求'
- '- **M-RoPE 位置编码** = **集装箱的立体坐标系统**（x轴、y轴、时间轴），确保二维图像空间或一维音频时间信息在运输过程中不丢失'
- '- **mtmd-helper** = **起重机操作员**，将编码后的集装箱（嵌入向量）按批次精准吊装到指定位置（KV Cache），并处理特殊集装箱（非因果注意力模式）'
- '- **图像/音频解码器（helper层）** = **海关检验与分类中心**，自动检测货物类型（通过magic bytes识别jpeg/png/wav/mp3），并调用对应的拆箱工具（stb_image/miniaudio）'
'no': 74
summary:
- concept: mtmd_context
  desc: 多模态处理核心上下文，统一管理视觉编码器（CLIP-V）与音频编码器（CLIP-A），校验嵌入维度兼容性，并按 projector_type 初始化模态专用预处理器
- concept: mtmd::bitmap / mtmd_bitmap
  desc: 原始多模态数据容器（图像RGB字节流/音频PCM浮点），C++层通过 unique_ptr + 自定义 deleter 实现 RAII 自动管理，支持ID标记追踪与零拷贝访问
- concept: mtmd::input_chunks
  desc: 输入块集合的C++包装，提供size()和operator[]访问，通过deleter自动释放资源，避免手动管理C API指针
- concept: mtmd_tokenizer
  desc: 多模态输入分词器，按 media_marker 切割文本，交替生成文本 chunk 与媒体 chunk，支持图像（image_media）与音频（audio_media）的独立处理路径，处理
    BOS/EOS 特殊标记插入
- concept: 图像预处理策略家族
  desc: 包含固定尺寸、动态尺寸、最长边、LLaVA-UHD切片、LFM2、Idefics3、InternVL、DeepSeekOCR、YouTuVL等多种策略，通过继承基类实现多态处理
- concept: 音频预处理流水线
  desc: PCM采样 → FFT（Cooley-Tukey）→ Mel滤波器组 → 对数压缩 → 分块（Whisper）或中心填充+预强调（Conformer），支持流式ISTFT重建
- concept: M-RoPE 位置编码
  desc: 多维旋转位置编码：图像使用 (t=0, y, x, 0) 四维表示空间位置；音频使用 (t, t, t, 0) 表示时间序列，通过 decode_embd_batch
    的 set_position_mrope_2d/1d 管理
- concept: mtmd_helper_eval_chunks
  desc: 高层评估接口：文本 chunk 直接 decode，媒体 chunk 先 encode 为嵌入再 decode，自动处理 micro-batch 分割与
    logits 标记，支持多模态混合输入
- concept: mtmd_helper_bitmap_init_from_buf/file
  desc: 智能资源加载入口：自动检测音频magic bytes，图像走stb_image解码，音频走miniaudio转PCM，统一输出mtmd_bitmap，实现格式无关的多模态输入
