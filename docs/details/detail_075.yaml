  name: 音频预处理与特征提取 —— 声音世界的'频谱分析师'
  'no': 6
  points:
  - '**mtmd_audio_cache：计算资源的''缓存仓库'''
  - '- `fill_sin_cos_table()`：预计算 FFT 所需的正弦/余弦查找表'
  - '- `fill_hann_window()`：生成汉宁窗函数（periodic/symmetric 可选）'
  - '- `fill_mel_filterbank_matrix()`：构建梅尔滤波器组（Slaney 刻度，_area 归一化）'
  - '**音频预处理器基类与双实现**'
  - '- `mtmd_audio_preprocessor::initialize()` / `preprocess()`：抽象基类接口定义'
  - '- `mtmd_audio_preprocessor_whisper::initialize()` / `preprocess()`：Whisper 风格，PCM
    → FFT → Mel → 对数压缩 → 按 3000 帧分块'
  - '- `mtmd_audio_preprocessor_conformer::initialize()` / `preprocess()`：Conformer
    风格，支持中心填充、预强调和自然对数'
  - '**流式 ISTFT：频谱到波形的''时光机'''
  - '- `mtmd_audio_streaming_istft::mtmd_audio_streaming_istft()`：构造函数，初始化 FFT 大小、跳步、重叠缓冲区'
  - '- `reset()`：重置内部状态与缓冲区'
  - '- `process_frame()`：处理单帧频谱（重叠相加法），输出 hop_length 个样本'
  - '- `flush()`：提取剩余缓冲区样本，完成流式处理'
