  name: mtmd-helper 高层评估与资源加载 —— 解密'模型输入'的最后一公里
  'no': 7
  points:
  - '**decode_embd_batch：M-RoPE 位置的''编排师''（含日志）'
  - '- 构造时分配 pos/seq_id/logits 数组，支持普通（1维）与 M-RoPE（4维）位置'
  - '- `set_position_normal()`：线性位置（pos_0 + i）'
  - '- `set_position_mrope_2d()`：图像二维位置 (t=0, y, x, 0)，nx/ny 为网格尺寸'
  - '- `set_position_mrope_1d()`：音频一维时间位置 (t, t, t, 0)'
  - '- `get_view()`：支持 micro-batch 拆分，M-RoPE 模式需重新组织 pos 视图（块列转置）'
  - '- `mtmd_helper_logger::log()` / `log_v()`：内部日志封装，支持变长参数与动态缓冲区'
  - '**资源加载与统计**'
  - '- `mtmd_helper_log_set()`：设置日志回调并同步到底层 mtmd'
  - '- `mtmd_helper_get_n_tokens()` / `mtmd_helper_get_n_pos()`：统计输入 token 与位置总数'
  - '- `mtmd_helper_bitmap_init_from_buf()` / `mtmd_helper_bitmap_init_from_file()`：自动检测类型并加载图像或音频资源（图像stb_image/音频miniaudio）'
  - '**评估与解码流水线**'
  - '- `mtmd_helper_eval_chunks()`：批量处理所有 chunk，自动分派文本与媒体'
  - '- `mtmd_helper_eval_chunk_single()`：单 chunk 评估，文本直接 decode，媒体先 encode 再 decode'
  - '- `mtmd_helper_decode_image_chunk()`：处理已编码的图像/音频嵌入，支持 M-RoPE 与非因果注意力'
