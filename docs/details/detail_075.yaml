  'no': 3
  points:
  - '**mtmd_tokenizer：多模态输入的''调度员'''
  - '- 构造时保存上下文、文本、位图数组及词汇表引用，并自动兼容旧版 image_marker 为 media_marker'
  - '- 按 `media_marker` (默认 `<__media__>`) 分割输入文本，交替生成文本 chunk 和媒体 chunk'
  - '**tokenize() 主流程与特殊标记处理**'
  - '- `split_text()`：按分隔符拆分字符串，保留分隔符作为独立部分'
  - '- 自动插入 BOS/EOS：根据词汇表配置在首尾添加特殊 token'
  - '- `add_text()`：将文本 token 追加到当前 chunk（连续文本自动合并）'
  - '**媒体处理双通道**'
  - '- `add_media()`：统一入口处理图像和音频，根据类型分发到图像或音频处理流程'
  - '- `add_image_media()`：处理图像输入，调用图像预处理器生成 token，处理切片模板与网格布局'
  - '- `add_audio_media()`：处理音频输入，调用音频预处理器生成梅尔频谱块，逐块封装为 audio chunk'
  - '**辅助函数与批量处理**'
  - '- `mtmd_tokenize_text_internal()`：处理 token 数量不确定的文本分词（动态扩容）'
  - '- `split_batch_to_chunk()`：将 `clip_image_f32_batch` 拆分为独立的图像 chunk（每 entry 一个
    chunk）'
