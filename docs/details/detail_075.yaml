  name: 专用图像预处理器家族 —— 各显神通的'整形外科医生'
  'no': 5
  points:
  - '**LLaVA-UHD：高分辨率图像的''切片大师'''
  - '- `mtmd_image_preprocessor_llava_uhd::mtmd_image_preprocessor_llava_uhd()`：构造函数初始化基类'
  - '- `preprocess()`：执行切片预处理，生成 overview + 多切片'
  - '- `get_slice_instructions()`：计算最佳切片策略（支持 pinpoints 候选分辨率或自动网格计算）'
  - '- `slice_image()`：按指令裁剪图像为多个切片（overview_first 控制顺序）'
  - '- `get_best_grid()` / `get_refine_size()` / `get_best_resize()`：网格布局优化与尺寸计算'
  - '- `resize_maintain_aspect_ratio()` / `select_best_resolution()` / `ensure_divide()`：比例保持与对齐'
  - '**LFM2 自适应网格切片**'
  - '- `get_slice_instructions()`：基于 tile_size 和容差判断是否需要切片'
  - '- `find_closest_aspect_ratio()`：在候选比例中寻找最接近原图的长宽比'
  - '- `get_target_ratios()` / `get_grid_layout()`：生成候选比例并选择最佳网格'
  - '**多样化预处理策略**'
  - '- `fixed_size`：强制缩放到固定正方形（如 448x448）'
  - '- `dyn_size`：基于 min/max_pixels 动态计算目标尺寸（保持比例）'
  - '- `longest_edge`：限制最长边长度并等比缩放'
  - '- `idefics3`：先按最长边约束缩放，再按 image_size 切分为 grid'
  - '- `internvl`：基于 pinpoints 候选分辨率选择最佳缩放，支持 overview 后置'
