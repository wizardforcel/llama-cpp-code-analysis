  name: mtmd 公共 C API 与 RAII 封装 —— 多模态世界的'智能集装箱系统'
  'no': 1
  points:
  - '**核心数据结构三剑客**'
  - '- `mtmd_bitmap`：原始图像/音频数据的''集装箱''，存储宽高、RGB字节流和可选ID'
  - '- `mtmd_input_chunk`：单个输入块，是文本token序列、图像tokens或音频tokens的''三通阀门'''
