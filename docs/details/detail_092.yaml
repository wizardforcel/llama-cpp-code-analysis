  - 2. 如果某条序列在第 3 轮触发 EOG，后续轮次中 `batch` 的结构会如何变化？
  - 3. 当所有序列都结束时，为什么 `batch.n_tokens == 0` 能作为退出条件？
  - 动手：在循环中添加日志，打印每轮 batch.n_tokens 和所有 i_batch 值的变化，观察 n_parallel = 4 时的批填充模式
