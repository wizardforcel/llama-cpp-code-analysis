learning_targets:
- 掌握批量推理的核心参数配置：n_kv_req 计算、n_batch 与 n_parallel 的平衡策略
- 理解 llama_batch 结构体的填充机制与 logits 标记策略
- 剖析多序列并行生成的主循环：采样、EOG 检测、批更新
- 掌握 continuous batching 的实现原理：client 状态机与动态槽位分配
- 理解共享系统提示词（is_sp_shared）与 KV 缓存复用（llama_memory_seq_cp）的优化
- 学习批分片视图（batch_view）技术：内存不足时的优雅降级策略
- 掌握推理状态持久化：llama_state_save_file / llama_state_load_file 的使用
- 理解跨上下文序列迁移：llama_state_seq_get_data / llama_state_seq_set_data
- 分析统一 KV 缓存模式（kv_unified）在单并行场景下的内存优化
- 熟悉辅助工具函数：trim、split_string、print_date_time 的日常用途
life_analogy:
- 想象 llama.cpp 的批量推理系统是一家**大型餐厅的中央厨房**：
- '- **llama_batch** = 一张大托盘，可以同时承载多份食材（token）'
- '- **n_parallel** = 同时服务的餐桌数量'
- '- **n_kv_req** = 厨房为所有餐桌预留的餐位总数'
- '- **采样器链** = 每张餐桌的专属调味师（Top-K→Top-P→Temp 流水线）'
- '- **i_batch[]** = 每桌菜在托盘上的座位号（logits 索引）'
- '- **EOG 检测** = 客人说"我吃饱了"，服务员撤掉该桌餐具（标记为 -1）'
- '- **continuous batching** = 翻台机制：一桌客人刚走，新客人立刻补上'
- '- **共享系统提示词** = 餐厅统一的餐前开胃菜，只需做一次，分发给所有桌'
- '- **batch_view 分片** = 托盘太大端不动？分成小盘分批上菜'
- '- **状态保存/恢复** = 把整桌菜品的烹饪进度拍照存档，换厨房后接着做'
- '- **序列级迁移** = 把 A 桌的菜品精确复制到 B 桌，连火候都一模一样'
- '- **~client()** = 客人离店时自动清理桌面，为下一波顾客做准备'
- '- **trim() / split_string()** = 备菜间的刀具，把整根萝卜切成均匀小块'
- 就像餐厅经理需要协调点菜、烹饪、上菜、翻台全流程，llama.cpp 的并行推理也需要精确管理批大小、KV 缓存、采样器与序列生命周期。
'no': 91
summary:
- concept: n_kv_req
  desc: KV 缓存需求总量 = prompt tokens + 生成 tokens × 并行数，决定 n_ctx 下限
- concept: n_batch = max(n_predict, n_parallel)
  desc: 批处理容量取预测长度与并行数的较大者，平衡内存与吞吐
- concept: batch.logits[last] = true
  desc: 仅标记最后一个 token 输出 logits，Prompt 编码的优化关键
- concept: i_batch[]
  desc: 记录每条序列在批中的逻辑索引，-1 表示该流已结束
- concept: llama_sampler_sample(ctx, i_batch[i])
  desc: 从指定批索引位置的 logits 中采样下一个 token
- concept: common_batch_clear / common_batch_add
  desc: 批处理的清空与填充原语，主循环的"呼吸节奏"
- concept: llama_model_has_encoder / llama_encode
  desc: 编码器-解码器架构的分离处理，需桥接 decoder_start_token_id
- concept: client 结构体
  desc: 封装客户端会话状态（seq_id、n_past、采样器构造与析构）
- concept: is_sp_shared / llama_memory_seq_cp
  desc: 系统提示词只编码一次，通过 KV 缓存复制广播给所有序列
- concept: cont_batching
  desc: 连续批处理：新请求立即填入空闲槽位，无需等待整批完成
- concept: n_junk
  desc: 随机插入干扰问答对，模拟真实场景的上下文污染
- concept: batch_view
  desc: llama_decode 失败时动态分片（n_batch /= 2），实现优雅降级
- concept: n_cache_miss
  desc: 记录批分片重试次数，衡量内存压力指标
- concept: llama_memory_seq_rm + seq_cp
  desc: 序列结束后清理旧 KV 并恢复共享系统提示词，实现槽位复用
- concept: common_prompt_batch_decode(..., state_file, true)
  desc: 编码 prompt 并同步保存 KV + RNG 状态到磁盘
- concept: llama_state_load_file
  desc: 跨上下文加载完整推理状态（KV 缓存 + 采样器状态）
- concept: common_replay_last_token
  desc: 状态恢复后重放最后一个 token，确保 logits 对齐
- concept: llama_state_seq_get_data / set_data
  desc: 单序列级状态提取与注入，支持跨上下文'手术式'迁移
- concept: llama_memory_clear(ctx, true)
  desc: 完全清空 KV 缓存，为序列迁移做准备
- concept: params.kv_unified
  desc: 单并行场景统一 KV 缓存布局，减少内存碎片
- concept: result0 == result1 == result2
  desc: 三重一致性校验：原始生成 ≡ 快照恢复 ≡ 序列迁移
- concept: trim / split_string
  desc: 字符串工具函数，前者去首尾空白，后者按分隔符切分字符串向量
- concept: print_date_time
  desc: 带颜色格式化的时间戳打印，用于日志追踪
- concept: print_usage
  desc: 打印程序使用说明与示例命令
- concept: __main__.main / __main__.print_usage
  desc: examples/batched/batched.cpp 的入口与帮助函数，本章核心解析对象
