  - '- 不立即转换数据，而是记录转换操作'
  - '- 生成新的元数据（基于原shape+新dtype），构造新的惰性张量'
  - '- 实际转换推迟到`to_eager()`被调用时执行'
  - '**`tofile` 的 eager 强制转换**'
  - '- 文件写入是''无法延迟''的IO操作'
  - '- 先调用`to_eager`确保数据已计算完毕，再执行NumPy原生的`tofile`'
