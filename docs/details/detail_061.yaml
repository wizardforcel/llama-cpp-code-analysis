  - '**与量化流程的协同**'
  - '- 在模型转换 pipeline 中，LazyNumpyTensor 作为中间表示'
  - '- 允许先构建完整的''张量操作图''（如permute→reshape→astype链），最后一次性执行'
  - '- 减少中间变量的内存分配，优化大规模模型转换的内存峰值'
