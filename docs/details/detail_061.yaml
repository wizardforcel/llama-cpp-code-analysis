  'no': 2
  points:
  - '**惰性张量的''出生证明''：__init__**'
  - '- 核心四元组：`meta`（形状类型元数据）、`func`（待执行函数）、`args/kwargs`（参数）、`data`（缓存结果）'
  - '- 设计哲学：要么已有数据（eager），要么有计算函数（lazy），二者必居其一'
  - '- 支持嵌套结构：`args`可以包含其他LazyBase实例，形成树状依赖'
  - '**`__init_subclass__`：子类的强制入职检查**'
  - '- 在类定义阶段（而非实例化时）自动触发，检查子类是否定义了`_tensor_type`属性'
  - '- 作用：确保每个具体的惰性张量实现都必须绑定到底层张量类型（如np.ndarray）'
  - '- 错误提前：在import阶段就暴露配置错误，避免运行时才发现类型不匹配'
  - '**`_recurse_apply`：结构保持的递归映射**'
  - '- 遍历嵌套的list/tuple结构，对叶子节点应用函数'
  - '- 保持容器结构不变（list还是list，tuple还是tuple）'
  - '- 实现`args`中惰性参数的批量提取与转换'
  - '**`_wrap_fn`：惰性求值的核心引擎**'
  - '- **元数据预演（Meta Propagation）**：先在元张量上执行`fn(*meta_args)`'
  - '- 捕获`NotImplementedError`：如果元数据无法计算（如特定backend不支持），标记`res=None`'
  - '- **类型分支处理**：'
  - '  - 返回张量：创建新的`LazyBase`实例，记录`func`和`args`推迟计算'
  - '  - 返回元组：处理多输出算子（如`split`），通过`shared_args`共享计算结果避免重复执行'
  - '  - 其他类型：立即调用`to_eager`强制执行（如`__len__`需要标量）'
  - '**`meta_with_dtype_and_shape`：抽象工厂方法**'
  - '- 定义为类方法，接收`dtype`和`shape`参数，返回轻量级''元张量'''
  - '- 当前为抽象实现（仅有`pass`），强制子类（如LazyNumpyTensor）提供具体实现'
  - '- 在`_wrap_fn`中被频繁调用：当`meta_noop`指定新dtype或shape变换时，用于生成新的元数据'
  - '- 是连接''逻辑形状推导''与''物理内存布局''的桥梁'
  - '**`to_eager`：延迟计算的最终引爆**'
  - '- 递归遍历操作树，自底向上执行所有缓存的`func`'
  - '- 类型不变式校验：确保计算结果的`dtype`和`shape`与`meta`一致'
  - '- 结果缓存：执行后的数据存入`_data`，后续访问直接返回'
  - '**`eager_to_meta`与`from_eager`**'
  - '- `eager_to_meta`：从真实张量提取轻量级元数据（仅shape+type）'
  - '- `from_eager`：双向转换入口，支持将NumPy数组转为惰性张量'
