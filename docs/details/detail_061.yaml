  name: LazyMeta 元类 —— 惰性张量的'自动包装工厂'
  'no': 1
  points:
  - '**元类的''魔法注入''原理**'
  - '- 通过重写`__new__`方法，在类创建时动态扫描并包装所有特殊方法'
  - '- 自动注入`__getattr__`拦截器，将属性访问路由到元数据（meta）层面'
  - '- 区分三类方法：二元运算（add/mul/matmul等）、一元运算（neg/abs/invert等）、特殊协议（getitem/setitem/len）'
  - '**`__getattr__`的转发机制**'
  - '- 当访问任意属性时，先尝试从`self._meta`（元张量）获取对应属性'
  - '- 如果属性是可调用的（如`reshape`、`transpose`），返回`_wrap_fn`包装后的惰性版本'
  - '- 如果属性是张量类型（如`shape`、`dtype`），包装为新的惰性张量返回'
  - '- 如果是普通值（如标量），直接返回不包装'
  - '**二元运算的批量包装策略**'
  - '- 预定义40余种二元操作符清单（算术、位运算、比较、矩阵乘等）'
  - '- 为每个操作符生成`__{op}__`方法（如`__add__`、`__matmul__`），设置`meta_noop=False`'
  - '- 这意味着二元运算需要在元数据层面真实执行以推导输出形状/类型'
  - '**一元运算的特殊优化**'
  - '- 对`__neg__`、`__abs__`、`__invert__`等设置`meta_noop=True`'
  - '- 这些操作不改变张量形状和类型，直接在元数据上标记为''无操作''，避免不必要的计算'
  - '**索引与长度协议**'
  - '- `__getitem__`/`__setitem__`/`__len__`被单独标记为`meta_noop=False`'
  - '- 因为切片操作会改变形状，必须在元数据上执行以获取正确的shape信息'
