  - '- 技巧：创建单元素数组，将所有维度的stride设为0，使所有索引指向同一内存位置'
  - '- 优势：无需为''元数据''分配实际内存，即可拥有任意shape和dtype的数组视图'
  - '- 应用：GGUF转换时可快速推导输出张量规格而不占用RAM'
