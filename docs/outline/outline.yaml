  - README.md
  'no': 8
  title: HTTP 服务器与 Web 用户界面
- chapters:
  - desc: 本章从全局视角鸟瞰 llama.cpp 项目中各类示例程序的组织结构和应用场景，理解 simple、batched、parallel、speculative
      等示例如何分别演示基础文本生成、批处理、并行序列和推测解码等核心能力，为后续深入学习各类应用模式奠定基础。
    name: llama.cpp 示例程序全景 —— 探索大模型推理的'代码样本库'
    'no': 91
    nodes:
    - desc: 认识 llama.cpp 项目结构和 examples 目录的组织方式，理解不同示例程序所覆盖的功能边界：基础生成、批处理、嵌入、检索、微调、推测解码等。
      name: 项目概览与示例分类
      'no': 1
      src:
      - README.md
      - examples/simple/simple.cpp
      - examples/simple-chat/simple-chat.cpp
    - desc: 剖析 simple 和 simple-chat 示例，理解 llama.cpp 最核心的'加载模型-初始化上下文-分词-生成循环'四步流程，建立推理编程的基本心智模型。
      name: 基础文本生成示例
      'no': 2
      src:
      - examples/simple/simple.cpp
      - examples/simple-chat/simple-chat.cpp
    - desc: 学习 eval-callback 示例如何通过回调函数挂钩模型解码过程，理解如何观测推理内部状态、收集性能指标。
      name: 评估与回调机制示例
      'no': 3
      src:
      - examples/eval-callback/eval-callback.cpp
      - examples/debug/debug.cpp
    - desc: 理解 idle 示例如何测试 GPU 空闲状态下的解码性能，作为性能基准测试方法的入门。
      name: 空闲性能与基准测试
      'no': 4
      src:
      - examples/idle/idle.cpp
  - desc: 本章深入理解 llama.cpp 中批量推理和并行序列处理的实现机制，包括如何利用单个上下文并发服务多个生成任务、KV 缓存共享和序列调度策略，揭示高效推理背后的并发设计模式。
    name: 批量与并行推理 —— 提升吞吐的'并发魔法'
    'no': 92
    nodes:
    - desc: 剖析 batched 示例中并行多序列生成的完整流程，掌握 llama_batch 结构、采样器配置和批处理提交流程。
      name: 批处理推理示例
      'no': 1
      src:
      - examples/batched/batched.cpp
    - desc: 理解 parallel 示例如何模拟多个客户端在单个上下文中并发提交请求，学习 KV 缓存复用与序列 ID 分配策略。
      name: 并行多客户端模拟
      'no': 2
      src:
      - examples/parallel/parallel.cpp
    - desc: 学习 save-load-state 示例如何持久化 KV 缓存和序列状态，理解推理状态迁移的实现原理。
      name: 推理状态保存与恢复
      'no': 3
      src:
      - examples/save-load-state/save-load-state.cpp
  - desc: 本章系统学习 llama.cpp 中的推测解码（Speculative Decoding）技术族，包括基础版和简易版的双模型协作机制、查找式推测解码以及
      Lookahead Decoding，理解如何用草稿模型加速主模型推理。
    name: 推测解码家族 —— 让推理'跑得更快'的草稿魔法
    'no': 93
    nodes:
    - desc: 剖析 speculative 示例中的双模型协作流程，理解草稿模型生成候选 token、目标模型验证与接受的完整树状分支结构。
      name: 经典推测解码实现
      'no': 1
      src:
      - examples/speculative/speculative.cpp
    - desc: 学习 speculative-simple 示例中更清晰的推测解码实现，掌握初始化、生成、验证与统计的核心 API 使用。
      name: 简易推测解码流程
      'no': 2
      src:
      - examples/speculative-simple/speculative-simple.cpp
    - desc: 理解 lookup 系列示例（lookup、lookup-create、lookup-merge、lookup-stats）如何基于 n-gram
        缓存实现无草稿模型的推测解码。
      name: 查找式推测解码
      'no': 3
      src:
      - examples/lookup/lookup.cpp
      - examples/lookup/lookup-create.cpp
      - examples/lookup/lookup-merge.cpp
      - examples/lookup/lookup-stats.cpp
    - desc: 学习 lookahead 示例中基于 Jacobi 迭代的并行解码方法，理解其与 n-gram 查找推测的异同。
      name: Lookahead Decoding
      'no': 4
      src:
      - examples/lookahead/lookahead.cpp
  - desc: 本章聚焦于 llama.cpp 在文本嵌入和语义检索方向的应用，理解如何将文本转化为向量、如何计算相似度、如何构建一个简易的 RAG 检索系统。
    name: 嵌入与语义检索 —— 向量世界的'语义罗盘'
    'no': 94
    nodes:
    - desc: 剖析 embedding 示例中分批 tokenize、模型推理和池化策略，理解多种池化方式（NONE、RANK、CLS、MEAN）的应用场景。
      name: 文本嵌入计算
      'no': 1
      src:
      - examples/embedding/embedding.cpp
    - desc: 学习 retrieval 示例如何将文档分块、向量化并基于余弦相似度检索，理解简易检索增强生成（RAG）的实现骨架。
      name: 语义检索系统
      'no': 2
      src:
      - examples/retrieval/retrieval.cpp
    - desc: 理解 passkey 示例如何通过 SelfExtend 技术扩展上下文窗口，让模型在大量干扰文本中提取关键 passkey 信息。
      name: Passkey 压力测试
      'no': 3
      src:
      - examples/passkey/passkey.cpp
  - desc: 本章深入学习 GGUF 文件格式以及模型转换生态，理解如何创建、读取、校验 GGUF 文件，如何将其他格式（如 llama2.c）转换为 GGUF，以及如何利用哈希机制验证模型完整性。
    name: GGUF 文件与模型转换 —— 模型格式的'集装箱体系'
