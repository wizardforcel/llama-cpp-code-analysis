- chapters:
  - desc: 本章从项目背景出发，鸟瞰 llama.cpp 的设计哲学与生态布局，理解它如何以「零依赖、单文件可运行」的极简思路承载大模型推理全流程，并引出其核心文件格式
      GGUF 与转换工具链。
    name: llama.cpp 概览 —— 认识这座「大模型推理引擎」
    'no': 1
    nodes:
    - desc: 用生活类比理解：一个能把庞大 AI 模型装进口袋的「压缩魔法盒」，跨平台、低门槛、极致性能。
      name: 什么是 llama.cpp
      'no': 1
      src:
      - README.md
    - desc: 介绍 GGUF 作为 llama.cpp 唯一认可的模型容器，以及围绕它构建的 Python 转换脚本家族（HF→GGUF、GGML→GGUF、LoRA→GGUF
        等）。
      name: GGUF 文件格式与转换工具链总览
      'no': 2
      src:
      - README.md
      - ./convert_hf_to_gguf.py
      - ./convert_llama_ggml_to_gguf.py
      - ./convert_lora_to_gguf.py
    - desc: 纵览 llama.cpp 支持的文本与多模态模型家族，理解转换器如何以统一框架承载差异化需求。
      name: 支持的模型架构与生态
      'no': 3
      src:
      - README.md
      - ./convert_hf_to_gguf.py
  - desc: 本章深入 convert_hf_to_gguf.py 的核心架构，剖析 ModelBase、TextModel、MmprojModel 三大基类如何协同完成从
      Hugging Face 到 GGUF 的全流程，理解注册器模式、张量生命周期与元数据装配机制。
    name: 主转换器架构 —— 解码「HF → GGUF」的中央调度台
    'no': 2
    nodes:
    - desc: 解析 ModelBase 抽象基类的核心方法链（write → prepare_tensors → prepare_metadata），理解通用转换流程。
      name: ModelBase：转换器的心脏
      'no': 1
      src:
      - ./convert_hf_to_gguf.py
    - desc: 剖析 TextModel 如何处理超参数、词汇表（GPT-2 / SentencePiece / Qwen 等多种格式）与张量映射。
      name: TextModel：文本模型转换的中枢
      'no': 2
      src:
      - ./convert_hf_to_gguf.py
    - desc: 理解视觉与音频编码器配置如何被独立打包为 mmproj 类型 GGUF 文件。
