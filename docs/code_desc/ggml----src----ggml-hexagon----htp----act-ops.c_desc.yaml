  - '            hvx_sigmoid_f32_aa((uint8_t *) dst_spad_ptr, (const uint8_t *) src0_spad_ptr,
    nc);'
  - '            hvx_mul_mul_f32_aa((uint8_t *) dst_spad_ptr, (const uint8_t *) src0_spad_ptr,
    (const uint8_t *) dst_spad_ptr,'
  - '                                (const uint8_t *) src1_spad_ptr, nc);'
  - '        }'
  - '        dma_queue_push_vtcm_to_ddr(dma_queue, dma_make_ptr(data_dst + (ir * dst_row_size),
    dst_spad), dst_row_size,'
  - '                                   dst_row_size_aligned, block_size);'
  - '        const uint32_t pref_block = (ir + BLOCK * 2);'
  - '        if (pref_block < src0_end_row) {'
  - '            const uint32_t pref_block_size = MIN(BLOCK, src0_end_row - pref_block);'
  - '            dma_queue_push_ddr_to_vtcm(dma_queue, dma_make_ptr(src0_spad, data_src0
