  name: htp_act_context
desc: 该文件是ggml库在Hexagon DSP平台上对激活函数操作的实现，提供了基于HVX向量指令和DMA传输的silu、gelu、swiglu、geglu等浮点激活函数的并行计算与性能优化实现。该文件实现了Hexagon
  DSP上的激活函数算子核心逻辑，包括GLU类激活函数（SWIGLU、GEGLU等）和通用激活操作的分派与执行。代码从第753行开始，涵盖了算子参数校验、内存布局计算、双缓冲调度以及多线程并行计算的主要流程。
file: ggml/src/ggml-hexagon/htp/act-ops.c
