  - '        }'
  - '    }'
  - '    dma_queue_flush(dma_queue);'
  - '    t2 = HAP_perf_get_qtimer_count();'
  - '    FARF(HIGH, "swiglu-f32 %d/%d: %ux%ux%ux%u (%u:%u) x %ux%ux%ux%u -> %ux%ux%ux%u
