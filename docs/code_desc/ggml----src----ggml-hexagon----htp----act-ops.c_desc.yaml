  - '        float * src0_spad = (float *) dma_queue_pop(dma_queue).dst;'
  - '        float * src1_spad = (float *) dma_queue_pop(dma_queue).dst;'
  - '        for (uint32_t ib = 0; ib < block_size; ib++) {'
  - '            const float * src0_spad_ptr = src0_spad + ib * (src0_row_size_aligned
    / sizeof(float));'
  - '            const float * src1_spad_ptr = src1_spad + ib * (src1_row_size_aligned
    / sizeof(float));'
  - '            float *       dst_spad_ptr  = dst_spad + ib * (dst_row_size_aligned
