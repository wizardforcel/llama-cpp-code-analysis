  name: parseClipboardContent
- code:
  - 'function isValidMcpPromptAttachment(obj: unknown): obj is {'
  - "\ttype: string;"
  - "\tname: string;"
  - "\tserverName: string;"
  - "\tpromptName: string;"
  - "\tcontent: string;"
  - "\targuments?: Record<string, string>;"
  - '} {'
  - "\tif (typeof obj !== 'object' || obj === null) {"
  - "\t\treturn false;"
  - "\t}"
  - ''
  - "\tconst record = obj as Record<string, unknown>;"
  - ''
  - "\treturn ("
  - "\t\t(record.type === AttachmentType.MCP_PROMPT || record.type === 'MCP_PROMPT')\
