  - "\t\t\treturn true;"
  - "\t\t}"
  - ''
  - "\t\t// Fallback for non-secure contexts"
  - "\t\tconst textArea = document.createElement('textarea');"
  - "\t\ttextArea.value = text;"
  - "\t\ttextArea.style.position = 'fixed';"
  - "\t\ttextArea.style.left = '-999999px';"
  - "\t\ttextArea.style.top = '-999999px';"
  - "\t\tdocument.body.appendChild(textArea);"
  - "\t\ttextArea.focus();"
  - "\t\ttextArea.select();"
  - ''
  - "\t\tconst successful = document.execCommand('copy');"
  - "\t\tdocument.body.removeChild(textArea);"
  - ''
