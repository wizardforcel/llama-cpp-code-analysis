  - export async function copyToClipboard(
  - "\ttext: string,"
  - "\tsuccessMessage = 'Copied to clipboard',"
  - "\terrorMessage = 'Failed to copy to clipboard'"
  - '): Promise<boolean> {'
  - "\ttry {"
  - "\t\t// Try modern clipboard API first (secure contexts only)"
  - "\t\tif (navigator.clipboard && navigator.clipboard.writeText) {"
  - "\t\t\tawait navigator.clipboard.writeText(text);"
