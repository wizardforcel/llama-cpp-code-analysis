- code:
  - export function formatMessageForClipboard(
  - "\tcontent: string,"
  - "\textras?: DatabaseMessageExtra[],"
  - "\tasPlainText: boolean = false"
  - '): string {'
  - "\t// Filter text-like attachments (TEXT, LEGACY_CONTEXT, MCP_PROMPT, and MCP_RESOURCE\
    \ types)"
  - "\tconst textAttachments ="
  - "\t\textras?.filter("
  - "\t\t\t("
  - "\t\t\t\textra"
  - "\t\t\t): extra is"
  - "\t\t\t\t| DatabaseMessageExtraTextFile"
  - "\t\t\t\t| DatabaseMessageExtraLegacyContext"
  - "\t\t\t\t| DatabaseMessageExtraMcpPrompt"
  - "\t\t\t\t| DatabaseMessageExtraMcpResource =>"
  - "\t\t\t\textra.type === AttachmentType.TEXT ||"
  - "\t\t\t\textra.type === AttachmentType.LEGACY_CONTEXT ||"
  - "\t\t\t\textra.type === AttachmentType.MCP_PROMPT ||"
  - "\t\t\t\textra.type === AttachmentType.MCP_RESOURCE"
  - "\t\t) ?? [];"
  - ''
  - "\tif (textAttachments.length === 0) {"
  - "\t\treturn content;"
  - "\t}"
  - ''
  - "\tif (asPlainText) {"
  - "\t\tconst parts = [content];"
  - "\t\tfor (const att of textAttachments) {"
  - "\t\t\tparts.push(att.content);"
  - "\t\t}"
  - "\t\treturn parts.join('\\n\\n');"
  - "\t}"
  - ''
  - "\tconst clipboardAttachments: ClipboardAttachment[] = textAttachments.map((att)\
    \ => {"
  - "\t\tif (att.type === AttachmentType.MCP_PROMPT) {"
  - "\t\t\tconst mcpAtt = att as DatabaseMessageExtraMcpPrompt;"
  - "\t\t\treturn {"
  - "\t\t\t\ttype: AttachmentType.MCP_PROMPT,"
  - "\t\t\t\tname: mcpAtt.name,"
  - "\t\t\t\tserverName: mcpAtt.serverName,"
  - "\t\t\t\tpromptName: mcpAtt.promptName,"
  - "\t\t\t\tcontent: mcpAtt.content,"
  - "\t\t\t\targuments: mcpAtt.arguments"
  - "\t\t\t} as ClipboardMcpPromptAttachment;"
  - "\t\t}"
  - "\t\treturn {"
  - "\t\t\ttype: AttachmentType.TEXT,"
  - "\t\t\tname: att.name,"
  - "\t\t\tcontent: att.content"
  - "\t\t} as ClipboardTextAttachment;"
  - "\t});"
  - ''
  - "\treturn `${JSON.stringify(content)}\\n${JSON.stringify(clipboardAttachments,\
    \ null, 2)}`;"
  - '}'
  desc: Formats a message and its text-like attachments (TEXT, LEGACY_CONTEXT, MCP_PROMPT,
    MCP_RESOURCE) into a clipboard string, either as plain text or as a JSON string
    followed by a JSON attachments array.
  line: 103-157
  name: formatMessageForClipboard
- code:
  - 'export function parseClipboardContent(clipboardText: string): ParsedClipboardContent
    {'
  - "\tconst defaultResult: ParsedClipboardContent = {"
  - "\t\tmessage: clipboardText,"
  - "\t\ttextAttachments: [],"
  - "\t\tmcpPromptAttachments: []"
  - "\t};"
  - ''
  - "\tif (!clipboardText.startsWith('\"')) {"
  - "\t\treturn defaultResult;"
  - "\t}"
  - ''
  - "\ttry {"
  - "\t\tlet stringEndIndex = -1;"
  - "\t\tlet escaped = false;"
  - ''
  - "\t\tfor (let i = 1; i < clipboardText.length; i++) {"
  - "\t\t\tconst char = clipboardText[i];"
  - ''
  - "\t\t\tif (escaped) {"
  - "\t\t\t\tescaped = false;"
  - "\t\t\t\tcontinue;"
  - "\t\t\t}"
  - ''
  - "\t\t\tif (char === '\\\\') {"
  - "\t\t\t\tescaped = true;"
  - "\t\t\t\tcontinue;"
  - "\t\t\t}"
  - ''
  - "\t\t\tif (char === '\"') {"
  - "\t\t\t\tstringEndIndex = i;"
  - "\t\t\t\tbreak;"
  - "\t\t\t}"
  - "\t\t}"
  - ''
  - "\t\tif (stringEndIndex === -1) {"
  - "\t\t\treturn defaultResult;"
  - "\t\t}"
  - ''
  - "\t\tconst jsonStringPart = clipboardText.substring(0, stringEndIndex + 1);"
  - "\t\tconst remainingPart = clipboardText.substring(stringEndIndex + 1).trim();"
  - ''
  - "\t\tconst message = JSON.parse(jsonStringPart) as string;"
  - ''
  - "\t\tif (!remainingPart || !remainingPart.startsWith('[')) {"
  - "\t\t\treturn {"
  - "\t\t\t\tmessage,"
  - "\t\t\t\ttextAttachments: [],"
  - "\t\t\t\tmcpPromptAttachments: []"
  - "\t\t\t};"
  - "\t\t}"
  - ''
  - "\t\tconst attachments = JSON.parse(remainingPart) as unknown[];"
  - ''
  - "\t\tconst validTextAttachments: ClipboardTextAttachment[] = [];"
  - "\t\tconst validMcpPromptAttachments: ClipboardMcpPromptAttachment[] = [];"
  - ''
  - "\t\tfor (const att of attachments) {"
  - "\t\t\tif (isValidMcpPromptAttachment(att)) {"
  - "\t\t\t\tvalidMcpPromptAttachments.push({"
  - "\t\t\t\t\ttype: AttachmentType.MCP_PROMPT,"
  - "\t\t\t\t\tname: att.name,"
  - "\t\t\t\t\tserverName: att.serverName,"
  - "\t\t\t\t\tpromptName: att.promptName,"
  - "\t\t\t\t\tcontent: att.content,"
  - "\t\t\t\t\targuments: att.arguments"
  - "\t\t\t\t});"
  - "\t\t\t} else if (isValidTextAttachment(att)) {"
  - "\t\t\t\tvalidTextAttachments.push({"
  - "\t\t\t\t\ttype: AttachmentType.TEXT,"
  - "\t\t\t\t\tname: att.name,"
  - "\t\t\t\t\tcontent: att.content"
  - "\t\t\t\t});"
  - "\t\t\t}"
  - "\t\t}"
  - ''
  - "\t\treturn {"
  - "\t\t\tmessage,"
  - "\t\t\ttextAttachments: validTextAttachments,"
  - "\t\t\tmcpPromptAttachments: validMcpPromptAttachments"
  - "\t\t};"
  - "\t} catch {"
  - "\t\treturn defaultResult;"
  - "\t}"
  - '}'
  desc: Parses raw clipboard text into a structured result containing the message,
    text attachments, and MCP prompt attachments, handling both plain text and the
    special JSON-based format produced by formatMessageForClipboard.
