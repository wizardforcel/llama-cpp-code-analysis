desc: 该脚本用于通过命令行创建 Hugging Face Collection，支持设置标题、描述、可见性和命名空间，并可选仅输出 collection 的
  slug。它首先检查环境中是否存在 HF_TOKEN 或 HUGGINGFACE_HUB_TOKEN 以进行身份验证，然后调用 huggingface_hub
  库的 API 创建 collection，并在成功或失败时给出相应的错误提示和退出码。
