  desc: 使用 Hugging Face API 创建新的 collection，支持自定义标题、描述、可见性和命名空间，并可选仅返回 collection
    的 slug。该函数首先检查环境中是否存在 HF_TOKEN 或 HUGGINGFACE_HUB_TOKEN，若不存在则打印错误并返回 None；若存在则初始化
    API，通过 whoami 验证身份，然后调用 create_collection 方法创建 collection，并在成功时打印相关信息（除非 return_slug
    为 True），最后返回 collection 对象。
