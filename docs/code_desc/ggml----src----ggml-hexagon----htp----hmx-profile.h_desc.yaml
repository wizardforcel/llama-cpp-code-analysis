desc: 该文件是 ggml 项目中面向 Hexagon 平台（HMX）的条件细粒度性能剖析头文件。它定义了一组基于 HAP（Hexagon Application
  Processor）计时器 API 的宏，用于测量子操作的延迟。通过开关宏 ENABLE_PROFILE_TIMERS 来控制代码的生效与否：定义后宏会展开为实际的计时语句；未定义时，所有计时宏展开为空操作，实现零开销。使用时，开发人员可通过
  TIMER_DEFINE 声明累计变量、TIMER_START 记录时间戳、TIMER_STOP 累计耗时，最后通过 TIMER_US 将时钟周期转换为微秒输出，方便在不影响发布版本性能的前提下进行性能分析。
