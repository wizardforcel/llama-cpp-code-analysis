- desc: A class that manages tensor name formatting, including handling of architecture-specific
    tensor mappings, suffixes, and indices.
  methods:
  - code:
    - LLM_TN_IMPL::LLM_TN_IMPL(llm_arch arch, llm_tensor tensor, const char * suffix,
      int bid, int xid)
    - '    : arch(arch), tensor(tensor), suffix(suffix), bid(bid), xid(xid),'
    - '      model_tensors(llm_get_tensor_names(arch)) {}'
    desc: Constructor that initializes the tensor name formatter with architecture,
      tensor type, optional suffix, and layer/block indices.
    line: 2571-2573
    name: LLM_TN_IMPL
  - code:
    - std::string LLM_TN_IMPL::str() const {
    - '    if (LLM_TENSOR_NAMES.find(tensor) == LLM_TENSOR_NAMES.end()) {'
    - '        GGML_ABORT("unknown tensor name for tensor id %d", static_cast<int>(tensor));'
    - '    }'
    - '    if (model_tensors.find(tensor) == model_tensors.end()) {'
    - '        const char * name = LLM_TENSOR_NAMES.at(tensor);'
    - '        if (suffix != nullptr || bid != -1 || xid != -1) {'
    - '            LLAMA_LOG_WARN("%s: cannot properly format tensor name %s with
      suffix=%s bid=%d xid=%d\n",'
    - '                __func__, name, suffix, bid, xid);'
    - '        }'
    - '        return name;'
    - '    }'
    - '    std::string name = ::format(LLM_TENSOR_NAMES.at(tensor), bid, xid);'
    - '    if (suffix != nullptr) {'
    - '        name += ".";'
    - '        name += suffix;'
    - '    }'
    - '    return name;'
    - '}'
    desc: Returns the formatted tensor name. If the tensor is not in the architecture's
      mapping, it returns the canonical name with a warning if formatting modifiers
      are provided.
