    an optional suffix.
  methods:
  - code:
    - 'LLM_KV::LLM_KV(llm_arch arch, const char * suffix) : arch(arch), suffix(suffix)
      {}'
    desc: Constructor that initializes the LLM_KV object with an architecture and
      an optional suffix.
    line: 2559-2559
    name: LLM_KV
  - code:
    - std::string LLM_KV::operator()(llm_kv kv) const {
    - '    std::string name = ::format(LLM_KV_NAMES.at(kv), LLM_ARCH_NAMES.at(arch));'
    - '    if (suffix != nullptr) {'
    - '        name += ".";'
    - '        name += suffix;'
    - '    }'
    - '    return name;'
    - '}'
    desc: Overloaded function call operator that formats a key-value name by substituting
      the architecture name, and appends the suffix if present.
