desc: 该文件是 llama.cpp 项目中的一个架构定义文件，定义了各种大语言模型架构的枚举值及其对应的名称字符串，以及模型中使用的各种键（用于读取元数据）和张量（用于存储权重）的名称映射。该文件是llama.cpp项目中负责定义LLM（大语言模型）架构相关张量名称映射和获取指定架构所需张量集合的源代码。它主要包含两个关键部分：一个是用于将张量枚举值映射到对应模型文件中的字符串名称的静态映射表，另一个是根据不同架构类型（如LLAMA、FALCON、BERT等）返回该架构所需的全部张量集合的函数。该文件是模型加载、权重匹配和推理过程中识别和管理模型参数的核心基础设施。该代码是
  llama.cpp 中定义大型语言模型（LLM）架构张量映射的核心部分。它通过一个大型的 switch-case 语句，为每种支持的模型架构（如 LLaMA、Mistral、Gemma、Mamba、DeepSeek、ChatGLM
  等）返回一个包含特定张量名称（如 token embedding、注意力权重、FFN 权重等）的列表。该代码的功能是作为模型架构与内部张量表示之间的桥梁，确保不同类型的模型在推理时能够正确加载权重，并映射到统一的内存布局中。The
  file llama-arch.cpp implements the architecture-specific tensor mapping and metadata
  for the llama.cpp engine. It defines functions and classes that map model architectures
  (llm_arch) to their respective tensor sets, provides tensor information (layer and
  operator) for buffer assignment, and offers utilities for querying architecture
  properties such as recurrent, hybrid, or diffusion models.
