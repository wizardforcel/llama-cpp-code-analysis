desc: 该文件实现了 ggml 库的 RPC (远程过程调用) 后端，允许将张量操作（如分配缓冲区、设置/获取张量数据、图计算等）通过网络发送到远程服务器执行，从而实现多设备或分布式计算。文件包含客户端和服务端的完整实现，包括
  socket 通信、协议序列化、图缓存和版本检查等功能。该文件是ggml RPC（远程过程调用）服务器的实现，通过socket通信为远程客户端提供ggml后端计算服务。它实现了Tensor的分配、释放、读写、复制，计算图的执行与重计算，以及设备内存查询等核心功能，并通过缓存机制优化大数据传输。该文件实现了RPC后端，提供远程过程调用能力。它包含RPC客户端和服务器功能，允许将GGML计算任务分发到远程设备上执行。主要包含设备接口、后端注册接口的实现，以及服务器启动、客户端连接处理等核心逻辑。
