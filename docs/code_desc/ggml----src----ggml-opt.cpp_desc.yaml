desc: 该文件实现了 ggml 库中的优化器功能，包括数据集管理（初始化、打乱、分批获取）、优化上下文管理（构建图、前向/反向/优化计算图的构建与执行）、多种损失函数支持（均值、求和、交叉熵、均方误差）、优化器参数管理（AdamW
  和 SGD），以及高层 API（如完整的训练 epoch 流程）。该代码实现了 ggml 优化训练流程中的训练与验证批次执行、进度条显示、完整模型拟合流程，以及优化器类型查询和名称转换功能。核心逻辑包括按批次执行前向与反向计算、统计损失和准确率、显示训练进度与预计剩余时间、配置数据集划分和优化器参数，并在训练结束后释放相关资源。
