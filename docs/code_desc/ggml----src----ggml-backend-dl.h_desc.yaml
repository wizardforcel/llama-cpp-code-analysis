desc: 该文件是 ggml 项目中的一个动态链接库（DLL/SO）加载的跨平台头文件封装。它通过预处理宏区分 Windows 和 Unix-like 平台，分别使用
  winevt.h 和 dlfcn.h 等系统库，并提供统一的接口来加载动态库、获取符号地址和获取错误信息。该文件定义了动态库句柄的智能指针类型，以及三个全局函数，用于屏蔽底层平台差异，方便上层代码进行跨平台的动态库操作。
file: ggml/src/ggml-backend-dl.h
