classes:
- desc: 负责构建Plamo模型完整计算图的推理类，继承llm_graph_context并实现模型前向传播的图构造逻辑。
  methods:
  - code:
    - 'llm_build_plamo::llm_build_plamo(const llama_model & model, const llm_graph_params
      & params) : llm_graph_context(params) {'
    - '    const int64_t n_embd_head = hparams.n_embd_head_v();'
    - '    GGML_ASSERT(n_embd_head == hparams.n_embd_head_k());'
    - '    GGML_ASSERT(n_embd_head == n_rot);'
    - '    ggml_tensor * cur;'
    - '    ggml_tensor * inpL;'
    - '    inpL = build_inp_embd(model.tok_embd);'
    - '    ggml_tensor * inp_pos = build_inp_pos();'
    - '    auto * inp_attn = build_attn_inp_kv();'
    - '    ggml_tensor * inp_out_ids = build_inp_out_ids();'
    - '    for (int il = 0; il < n_layer; ++il) {'
    - '        cur = build_norm(inpL, model.layers[il].attn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        cb(cur, "attn_norm", il);'
    - '        ggml_tensor * sa_inp = cur;'
    - '        {'
    - '            ggml_tensor * Qcur = build_lora_mm(model.layers[il].wq, cur);'
    - '            cb(Qcur, "Qcur", il);'
    - '            ggml_tensor * Kcur = build_lora_mm(model.layers[il].wk, cur);'
    - '            cb(Kcur, "Kcur", il);'
    - '            ggml_tensor * Vcur = build_lora_mm(model.layers[il].wv, cur);'
    - '            cb(Vcur, "Vcur", il);'
    - '            Qcur = ggml_reshape_3d(ctx0, Qcur, n_embd_head, n_head, n_tokens);'
    - '            Kcur = ggml_reshape_3d(ctx0, Kcur, n_embd_head, n_head_kv, n_tokens);'
    - '            Vcur = ggml_reshape_3d(ctx0, Vcur, n_embd_head, n_head_kv, n_tokens);'
    - '            Qcur = ggml_rope_ext(ctx0, Qcur, inp_pos, nullptr, n_embd_head,
      rope_type, n_ctx_orig, freq_base, freq_scale, ext_factor, attn_factor, beta_fast,
      beta_slow);'
    - '            Kcur = ggml_rope_ext(ctx0, Kcur, inp_pos, nullptr, n_embd_head,
      rope_type, n_ctx_orig, freq_base, freq_scale, ext_factor, attn_factor, beta_fast,
      beta_slow);'
    - '            cb(Qcur, "Qcur", il);'
    - '            cb(Kcur, "Kcur", il);'
    - '            cb(Vcur, "Vcur", il);'
    - '            cur = build_attn(inp_attn, model.layers[il].wo, NULL, Qcur, Kcur,
      Vcur, nullptr, nullptr, nullptr, 1.0f/sqrtf(float(n_embd_head)), il);'
    - '        }'
    - '        if (il == n_layer - 1 && inp_out_ids) {'
    - '            cur    = ggml_get_rows(ctx0,    cur, inp_out_ids);'
    - '            sa_inp = ggml_get_rows(ctx0, sa_inp, inp_out_ids);'
    - '            inpL   = ggml_get_rows(ctx0,   inpL, inp_out_ids);'
    - '        }'
    - '        ggml_tensor * sa_out = cur;'
    - '        cur = sa_inp;'
    - '        {'
    - '            cur = build_ffn(cur, model.layers[il].ffn_up, NULL, NULL, model.layers[il].ffn_gate,
      NULL, NULL, model.layers[il].ffn_down, NULL, NULL, NULL, LLM_FFN_SILU, LLM_FFN_PAR,
      il);'
    - '            cb(cur, "ffn_out", il);'
    - '        }'
    - '        cur = ggml_add(ctx0, cur, sa_out);'
    - '        cur = ggml_add(ctx0, cur, inpL);'
    - '        cur = build_cvec(cur, il);'
    - '        cb(cur, "l_out", il);'
    - '        inpL = cur;'
    - '    }'
    - '    cur = inpL;'
    - '    cur = build_norm(cur, model.output_norm, NULL, LLM_NORM_RMS, -1);'
    - '    cb(cur, "result_norm", -1);'
    - '    res->t_embd = cur;'
    - '    cur = build_lora_mm(model.output, cur);'
    - '    cb(cur, "result_output", -1);'
    - '    res->t_logits = cur;'
    - '    ggml_build_forward_expand(gf, cur);'
    - '}'
    desc: 构造函数，按层构建模型计算图，包括归一化、自注意力（含RoPE旋转位置编码）、前馈网络、残差连接及最终的输出归一化与logits生成。
    line: 5-73
    name: llm_build_plamo
  name: llm_build_plamo
desc: 该文件实现了Plamo模型的推理图构建逻辑，通过llm_build_plamo类继承llm_graph_context并重写构建过程，负责将输入嵌入转换为最终logits输出，包含RMS归一化、自注意力机制（QKV投影+RoPE）、前馈网络等核心模块，同时处理KV缓存和中间层输出裁剪以适配模型的序列生成需求。
