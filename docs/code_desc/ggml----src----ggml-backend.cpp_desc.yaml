desc: 该文件是 ggml 项目中的后端实现核心文件，提供了一系列关于后端设备、缓冲区、张量操作和计算图调度的 C 接口函数，实现多后端的内存管理和计算调度功能。它定义了缓冲区类型和缓冲区操作的封装，后端设备和后端注册表的接口，并通过一个调度器
  (scheduler) 来管理多后端上的计算图分割和执行。该文件是GGML框架的后端调度器（backend scheduler）核心实现，负责将计算图（cgraph）中的节点分配到不同的后端（如CPU或GPU）执行，并通过图分割、数据复制和异步计算等机制优化多后端并行执行效率。文件包含调度器的内存分配、节点后端分配、图分割和计算执行等核心逻辑。该代码位于
  ggml-backend.cpp 的后半部分，主要实现 GGML 后端调度器的状态管理、图分割与计算、后端及张量属性查询、张量和计算图复制与比较工具，以及 CPU
  后端缓冲区的分配、释放、读写、清零和外部指针映射功能。
