    name: llm_build_smallthinker
  name: llm_build_smallthinker
desc: 该文件实现了针对 SmallThinker 模型的神经网络图构建逻辑，定义了模板结构体 llm_build_smallthinker 的构造函数，负责按照
  Transformer 架构（含 MoE 混合专家层）逐层构建计算图，支持标准注意力与滑动窗口注意力（iswa 参数）两种模式，并最终生成模型的输出 logits
  与嵌入表示。
