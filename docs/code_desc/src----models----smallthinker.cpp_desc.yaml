classes:
- desc: 这是一个模板结构体，用于构建 SmallThinker 模型的计算图。它根据 iswa 模板参数决定使用标准 KV 缓存注意力还是 SWA（滑动窗口注意力）输入，在构造函数中完成从输入嵌入、位置编码到多层
    MoE Transformer 块的前向计算图构建。
  methods:
  - code:
    - template <bool iswa>
    - 'llm_build_smallthinker<iswa>::llm_build_smallthinker(const llama_model & model,
      const llm_graph_params & params) : llm_graph_context(params){'
    - '    const int64_t n_embd_head = hparams.n_embd_head_v();'
    - '    GGML_ASSERT(n_embd_head == hparams.n_embd_head_k());'
    - '    GGML_ASSERT(n_embd_head == n_rot);'
    - '    ggml_tensor * cur;'
    - '    ggml_tensor * inpL;'
    - '    inpL = build_inp_embd(model.tok_embd);'
    - '    ggml_tensor * inp_pos = build_inp_pos();'
    - '    using inp_attn_type = std::conditional_t<iswa, llm_graph_input_attn_kv_iswa,
      llm_graph_input_attn_kv>;'
    - '    inp_attn_type * inp_attn = nullptr;'
    - '    if constexpr (iswa) {'
    - '        inp_attn = build_attn_inp_kv_iswa();'
    - '    } else {'
    - '        inp_attn = build_attn_inp_kv();'
    - '    }'
    - '    ggml_tensor * inp_out_ids = build_inp_out_ids();'
    - '    for (int il = 0; il < n_layer; ++il) {'
    - '        const float freq_base_l  = model.get_rope_freq_base (cparams, il);'
    - '        const float freq_scale_l = model.get_rope_freq_scale(cparams, il);'
    - '        ggml_tensor * inpSA  = inpL;'
    - '        const bool use_rope = hparams.n_no_rope_layer_step == n_layer ||'
    - '                              il % hparams.n_no_rope_layer_step != 0;'
    - '        ggml_tensor * probs = build_lora_mm(model.layers[il].ffn_gate_inp,
      inpL);  // [n_expert, n_tokens]'
    - '        cb(probs, "ffn_moe_logits", il);'
    - '        cur = build_norm(inpL,model.layers[il].attn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        cb(cur, "attn_norm", il);'
    - '        {'
    - '            struct ggml_tensor * Qcur = build_lora_mm(model.layers[il].wq,
      cur);'
    - '            cb(Qcur, "Qcur", il);'
    - '            struct ggml_tensor * Kcur = build_lora_mm(model.layers[il].wk,
      cur);'
    - '            cb(Kcur, "Kcur", il);'
    - '            struct ggml_tensor * Vcur = build_lora_mm(model.layers[il].wv,
      cur);'
    - '            cb(Vcur, "Vcur", il);'
    - '            Qcur = ggml_reshape_3d(ctx0, Qcur, n_embd_head, n_head, n_tokens);'
    - '            Kcur = ggml_reshape_3d(ctx0, Kcur, n_embd_head, n_head_kv, n_tokens);'
    - '            Vcur = ggml_reshape_3d(ctx0, Vcur, n_embd_head, n_head_kv, n_tokens);'
    - '            if (use_rope) {'
    - '                Qcur = ggml_rope_ext(ctx0, Qcur, inp_pos, nullptr, n_rot, rope_type,
      n_ctx_orig, freq_base_l, freq_scale_l,'
    - '                                    ext_factor, attn_factor, beta_fast, beta_slow);'
    - '                Kcur = ggml_rope_ext(ctx0, Kcur, inp_pos, nullptr, n_rot, rope_type,
      n_ctx_orig, freq_base_l, freq_scale_l,'
    - '                                    ext_factor, attn_factor, beta_fast, beta_slow);'
    - '            }'
    - '            cb(Qcur, "Qcur", il);'
    - '            cb(Kcur, "Kcur", il);'
    - '            cur = build_attn(inp_attn,'
    - '                    model.layers[il].wo, model.layers[il].bo,'
    - '                    Qcur, Kcur, Vcur, nullptr, nullptr, nullptr, 1.0f / sqrtf(float(n_embd_head)),
      il);'
    - '        }'
    - '        if (il == n_layer - 1 && inp_out_ids) {'
    - '            cur = ggml_get_rows(ctx0, cur, inp_out_ids);'
    - '            inpSA = ggml_get_rows(ctx0, inpSA, inp_out_ids);'
    - '            probs = ggml_get_rows(ctx0, probs, inp_out_ids);'
    - '        }'
    - '        ggml_tensor * ffn_inp = ggml_add(ctx0, cur, inpSA);'
    - '        cb(ffn_inp, "ffn_inp", il);'
    - '        cur = build_norm(ffn_inp, model.layers[il].ffn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        cb(cur, "ffn_norm", il);'
    - '        ggml_tensor * ffn_out ='
    - '            build_moe_ffn(cur,'
    - '                    nullptr,'
    - '                    model.layers[il].ffn_up_exps,'
    - '                    model.layers[il].ffn_gate_exps,'
    - '                    model.layers[il].ffn_down_exps,'
    - '                    nullptr,'
    - '                    n_expert, n_expert_used,'
    - '                    LLM_FFN_RELU, true,'
    - '                    hparams.expert_weights_scale,'
    - '                    static_cast<llama_expert_gating_func_type>(hparams.expert_gating_func),'
    - '                    il, probs);'
    - '        cb(ffn_out, "ffn_out", il);'
    - '        cur = ffn_out;'
    - '        cur = ggml_add(ctx0, cur, ffn_inp);'
    - '        cur = build_cvec(cur, il);'
    - '        cb(cur, "l_out", il);'
    - '        inpL = cur;'
    - '    }'
    - '    cur = inpL;'
    - '    cur = build_norm(cur, model.output_norm, NULL, LLM_NORM_RMS, -1);'
    - '    cb(cur, "result_norm", -1);'
    - '    res->t_embd = cur;'
    - '    cur = build_lora_mm(model.output, cur);'
    - '    cb(cur, "result_output", -1);'
    - '    res->t_logits = cur;'
    - '    ggml_build_forward_expand(gf, cur);'
    - '}'
    desc: 构造函数，接收模型参数和图形上下文参数，初始化父类后，通过调用各种 build_* 辅助函数逐层构建模型的前向计算图，包括输入嵌入、注意力，层归一化，多头注意力和
      MoE 前馈网络。
