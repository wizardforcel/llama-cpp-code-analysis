  - static bool save_wav16(const std::string & fname, const std::vector<float> & data,
    int sample_rate) {
  - '    std::ofstream file(fname, std::ios::binary);'
  - '    if (!file) {'
  - '        LOG_ERR("%s: Failed to open file ''%s'' for writing.\n", __func__, fname.c_str());'
  - '        return false;'
  - '    }'
  - ''
  - '    wav_header header;'
  - '    header.sample_rate = sample_rate;'
  - '    header.byte_rate = header.sample_rate * header.num_channels * (header.bits_per_sample
    / 8);'
  - '    header.block_align = header.num_channels * (header.bits_per_sample / 8);'
  - '    header.data_size = data.size() * (header.bits_per_sample / 8);'
  - '    header.chunk_size = 36 + header.data_size;'
  - ''
  - '    file.write(reinterpret_cast<const char*>(&header), sizeof(header));'
  - ''
  - '    for (const auto & sample : data) {'
  - '        int16_t pcm_sample = static_cast<int16_t>(std::clamp(sample * 32767.0,
    -32768.0, 32767.0));'
  - '        file.write(reinterpret_cast<const char*>(&pcm_sample), sizeof(pcm_sample));'
  - '    }'
  - ''
  - '    return file.good();'
  - '}'
