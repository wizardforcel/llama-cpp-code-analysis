- code:
  - static void irfft(int n, const float * inp_cplx, float * out_real) {
  - '    int N = n / 2 + 1;'
  - ''
  - '    std::vector<float> real_input(N);'
  - '    std::vector<float> imag_input(N);'
  - '    for (int i = 0; i < N; ++i) {'
  - '        real_input[i] = inp_cplx[2 * i];'
  - '        imag_input[i] = inp_cplx[2 * i + 1];'
  - '    }'
  - ''
  - '    std::vector<float> real_output(n);'
  - '    std::vector<float> imag_output(n);'
  - ''
  - '    for (int k = 0; k < n; ++k) {'
  - '        real_output[k] = 0.0f;'
  - '        imag_output[k] = 0.0f;'
  - '        for (int m = 0; m < N; ++m) {'
  - '            float twiddle_real;'
  - '            float twiddle_imag;'
  - ''
  - '            twiddle(&twiddle_real, &twiddle_imag, k * m, n);'
  - ''
  - '            real_output[k] += real_input[m] * twiddle_real - imag_input[m] *
    twiddle_imag;'
  - '            imag_output[k] += real_input[m] * twiddle_imag + imag_input[m] *
    twiddle_real;'
  - '        }'
  - '    }'
  - ''
  - '    for (int i = 0; i < n; ++i) {'
  - '        out_real[i] = real_output[i] / N;'
  - '    }'
  - '}'
  desc: Computes inverse real-valued FFT from complex frequency domain to time domain
    samples
  line: 126-153
  name: irfft
- code:
  - static void fold(const std::vector<float> & data, int64_t n_out, int64_t n_win,
    int64_t n_hop, int64_t n_pad, std::vector<float> & output) {
  - '    int64_t output_height = n_out;'
  - '    int64_t kernel_w = n_win;'
  - '    int64_t stride_w = n_hop;'
  - '    int64_t width    = n_out;'
  - ''
  - '    output.resize(width, 0.0f);'
  - ''
  - '    int64_t col_idx = 0;'
  - '    for (int64_t w_col = 0; w_col < width; ++w_col) {'
  - '        int64_t start = w_col * stride_w - n_pad;'
  - '        int64_t end   = start + kernel_w;'
  - ''
  - '        for (int64_t w_im = start; w_im < end; ++w_im) {'
  - '            if (w_im >= 0 && w_im < output_height && col_idx < (int64_t) data.size())
    {'
  - '                output[w_im] += data[col_idx];'
  - '            }'
  - '            col_idx++;'
  - '        }'
  - '    }'
  - ''
  - '    output.resize(n_out - 2 * n_pad);'
  - '}'
  desc: Implements PyTorch-like fold operation for converting spectrogram frames back
    to audio waveform
  line: 165-187
  name: fold
- code:
  - static std::vector<float> embd_to_audio(
  - '        const float * embd,'
  - '        const int n_codes,'
  - '        const int n_embd,'
  - '        const int n_thread) {'
  - '    const int n_fft = 1280;'
  - '    const int n_hop = 320;'
  - '    const int n_win = 1280;'
  - '    const int n_pad = (n_win - n_hop)/2;'
  - '    const int n_out = (n_codes - 1)*n_hop + n_win;'
  - ''
  - '    std::vector<float> hann(n_fft);'
  - ''
  - '    fill_hann_window(hann.size(), true, hann.data());'
  - ''
  - '    int n_spec = n_embd*n_codes;'
  - ''
  - '    std::vector<float> E (n_spec);'
  - '    std::vector<float> S (n_spec);'
  - '    std::vector<float> ST(n_spec);'
  - ''
  - '    for (int l = 0; l < n_codes; ++l) {'
  - '        for (int k = 0; k < n_embd; ++k) {'
  - '            E[k*n_codes + l] = embd[l*n_embd + k];'
  - '        }'
  - '    }'
  - ''
  - '    for (int k = 0; k < n_embd/2; ++k) {'
  - '        for (int l = 0; l < n_codes; ++l) {'
  - '            float mag = E[(k           )*n_codes + l];'
  - '            float phi = E[(k + n_embd/2)*n_codes + l];'
  - ''
  - '            mag = exp(mag);'
  - ''
  - '            if (mag > 1e2) {'
  - '                mag = 1e2;'
  - '            }'
  - '            S[2*(k*n_codes + l) + 0] = mag*cosf(phi);'
  - '            S[2*(k*n_codes + l) + 1] = mag*sinf(phi);'
  - '        }'
  - '    }'
  - ''
  - '    for (int l = 0; l < n_codes; ++l) {'
  - '        for (int k = 0; k < n_embd/2; ++k) {'
  - '            ST[l*n_embd + 2*k + 0] = S[2*(k*n_codes + l) + 0];'
  - '            ST[l*n_embd + 2*k + 1] = S[2*(k*n_codes + l) + 1];'
  - '        }'
  - '    }'
  - ''
  - '    std::vector<float> res  (n_codes*n_fft);'
  - '    std::vector<float> hann2(n_codes*n_fft);'
  - ''
  - '    std::vector<std::thread> workers(n_thread);'
  - '    for (int i = 0; i < n_thread; ++i) {'
  - '        workers[i] = std::thread([&, i]() {'
  - '            for (int l = i; l < n_codes; l += n_thread) {'
  - '                irfft(n_fft, ST.data() + l*n_embd, res.data() + l*n_fft);'
  - '                for (int j = 0; j < n_fft; ++j) {'
  - '                    res  [l*n_fft + j] *= hann[j];'
  - '                    hann2[l*n_fft + j]  = hann[j] * hann[j];'
  - '                }'
  - '            }'
  - '        });'
  - '    }'
  - '    for (int i = 0; i < n_thread; ++i) {'
  - '        workers[i].join();'
  - '    }'
  - ''
  - '    std::vector<float> audio;'
  - '    std::vector<float> env;'
  - ''
  - '    fold(res,   n_out, n_win, n_hop, n_pad, audio);'
  - '    fold(hann2, n_out, n_win, n_hop, n_pad, env); // TODO: can be done once'
  - ''
  - '    for (size_t i = 0; i < audio.size(); ++i) {'
  - '        audio[i] /= env[i];'
  - '    }'
  - ''
  - '    return audio;'
  - '}'
  desc: Converts embedding codes to raw audio waveform using STFT inversion, windowing,
    and overlap-add
  line: 190-261
  name: embd_to_audio
