desc: 'This file implements a text-to-speech (TTS) system for OuteTTS models. It converts
  input text into audio waveforms using a two-stage LLM pipeline: text-to-codes (TTC)
  followed by codes-to-speech (CTS). The file includes terminal utilities, WAV file
  writing, audio signal processing (STFT/inverse FFT), text preprocessing, tokenization
  helpers, speaker profile handling, and the main inference loop.The file implements
  a Text-to-Speech (TTS) tool using LLaMA models. This code segment (starting from
  line 793) is the latter portion of the main function, containing the core inference
  loop for token generation with guide token support, batch decoding, audio code extraction
  and filtering, vocoder encoding, spectrogram-to-audio conversion via embeddings,
  and WAV file output. It orchestrates prompt evaluation, parallel sequence sampling,
  token post-processing, and final audio synthesis.'
file: tools/tts/tts.cpp
