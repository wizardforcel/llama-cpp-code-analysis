  name: MCPStore
desc: 该文件实现了一个基于 Svelte 5 Runes 的 MCP（Model Context Protocol）响应式状态存储（Store），作为 MCP
  架构中的 Host 角色，负责管理多个 MCP 服务器连接的生命周期（初始化、重连、关闭）、工具路由与冲突检测、OpenAI 兼容工具定义生成、图标处理及健康检查状态，协调
  MCPService 协议层与 UI 层之间的状态同步。该文件是MCP（Model Context Protocol）Store的核心实现，负责管理MCP服务器连接、健康检查、工具调用、资源订阅与管理等。它包含MCPStore类，封装了连接管理、健康检查、工具与资源操作、以及与外部MCP服务的交互逻辑。
