classes: []
desc: 此头文件定义 CUDA/ROCm/MUSA 后端的公共 API，作为 ggml 深度学习框架的 GPU 加速后端接口。它屏蔽了不同 GPU 平台（CUDA、ROCm、MUSA）的差异化实现，提供统一的
  GPU 后端初始化、设备管理、缓冲区分配和注册功能。文件核心职责是声明用于创建 GPU 后端实例、查询设备信息、管理主机/设备内存及后端注册的全局函数接口，使上层计算图调度器无需关心具体
  GPU 硬件细节，实现跨平台的高性能神经网络推理与训练支持。
