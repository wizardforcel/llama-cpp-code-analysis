- code:
  - 'export async function readFileAsText(file: File): Promise<string> {'
  - "\treturn new Promise((resolve, reject) => {"
  - "\t\tconst reader = new FileReader();"
  - ''
  - "\t\treader.onload = (event) => {"
  - "\t\t\tif (event.target?.result !== null && event.target?.result !== undefined)\
    \ {"
  - "\t\t\t\tresolve(event.target.result as string);"
  - "\t\t\t} else {"
  - "\t\t\t\treject(new Error('Failed to read file'));"
  - "\t\t\t}"
  - "\t\t};"
  - ''
