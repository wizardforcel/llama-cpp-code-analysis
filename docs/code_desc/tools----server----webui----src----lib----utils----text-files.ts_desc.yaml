- code:
  - export function isLikelyTextFile(
  - "\tcontent: string,"
  - "\toptions: Partial<BinaryDetectionOptions> = {}"
  - '): boolean {'
  - "\tif (!content) return true;"
  - ''
  - "\tconst config = { ...DEFAULT_BINARY_DETECTION_OPTIONS, ...options };"
  - "\tconst sample = content.substring(0, config.prefixLength);"
  - ''
  - "\tlet nullCount = 0;"
  - "\tlet suspiciousControlCount = 0;"
  - ''
  - "\tfor (let i = 0; i < sample.length; i++) {"
  - "\t\tconst charCode = sample.charCodeAt(i);"
  - ''
  - "\t\t// Count null bytes - these are strong indicators of binary files"
  - "\t\tif (charCode === 0) {"
  - "\t\t\tnullCount++;"
  - ''
  - "\t\t\tcontinue;"
  - "\t\t}"
  - ''
  - "\t\t// Count suspicious control characters"
  - "\t\t// Allow common whitespace characters: tab (9), newline (10), carriage return\
    \ (13)"
  - "\t\tif (charCode < 32 && charCode !== 9 && charCode !== 10 && charCode !== 13)\
    \ {"
  - "\t\t\t// Count most suspicious control characters"
  - "\t\t\tif (charCode < 8 || (charCode > 13 && charCode < 27)) {"
  - "\t\t\t\tsuspiciousControlCount++;"
  - "\t\t\t}"
  - "\t\t}"
  - ''
  - "\t\t// Count replacement characters (indicates encoding issues)"
  - "\t\tif (charCode === 0xfffd) {"
  - "\t\t\tsuspiciousControlCount++;"
  - "\t\t}"
  - "\t}"
  - ''
  - "\t// Reject if too many null bytes"
  - "\tif (nullCount > config.maxAbsoluteNullBytes) return false;"
  - ''
  - "\t// Reject if too many suspicious characters"
  - "\tif (suspiciousControlCount / sample.length > config.suspiciousCharThresholdRatio)\
    \ return false;"
  - ''
  - "\treturn true;"
  - '}'
  desc: Heuristically determines if content is likely from a text file by detecting
    binary indicators such as null bytes and suspicious control characters.
  line: 49-95
  name: isLikelyTextFile
