- code:
  - 'export function isTextFileByName(filename: string): boolean {'
  - "\tconst textExtensions = Object.values(FileExtensionText);"
  - ''
  - "\treturn textExtensions.some((ext: FileExtensionText) => filename.toLowerCase().endsWith(ext));"
  - '}'
