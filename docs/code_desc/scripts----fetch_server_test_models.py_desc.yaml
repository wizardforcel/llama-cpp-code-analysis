  name: collect_hf_model_test_parameters
- code:
  - 'if __name__ == ''__main__'':'
  - '    logging.basicConfig(level=logging.INFO, format=''%(levelname)s: %(message)s'')'
  - ''
  - '    models = sorted(list(set(['
  - '        model'
  - '        for test_file in glob.glob(''tools/server/tests/unit/test_*.py'')'
  - '        for model in collect_hf_model_test_parameters(test_file)'
  - '    ])), key=lambda m: (m.hf_repo, m.hf_file))'
  - ''
  - '    logging.info(f''Found {len(models)} models in parameterized tests:'')'
  - '    for m in models:'
  - '        logging.info(f''  - {m.hf_repo} / {m.hf_file}'')'
  - ''
  - '    cli_path = os.environ.get('
  - '        ''LLAMA_CLI_BIN_PATH'','
  - '        os.path.join('
  - '            os.path.dirname(__file__),'
  - '            ''../build/bin/Release/llama-cli.exe'' if os.name == ''nt'' else
    ''../build/bin/llama-cli''))'
  - ''
  - '    for m in models:'
  - '        if ''<'' in m.hf_repo or (m.hf_file is not None and ''<'' in m.hf_file):'
  - '            continue'
  - '        if m.hf_file is not None and ''-of-'' in m.hf_file:'
  - '            logging.warning(f''Skipping model at {m.hf_repo} / {m.hf_file} because
    it is a split file'')'
  - '            continue'
  - '        logging.info(f''Using llama-cli to ensure model {m.hf_repo}/{m.hf_file}
    was fetched'')'
  - '        cmd = ['
  - '            cli_path,'
  - '            ''-hfr'', m.hf_repo,'
  - '            *([] if m.hf_file is None else [''-hff'', m.hf_file]),'
  - '            ''-n'', ''1'','
  - '            ''-p'', ''Hey'','
  - '            ''--no-warmup'','
  - '            ''--log-disable'','
  - '            ''-st'']'
  - '        if m.hf_file != ''tinyllamas/stories260K.gguf'' and ''Mistral-Nemo''
    not in m.hf_repo:'
  - '            cmd += (''-fa'', ''on'')'
  - '        try:'
  - '            subprocess.check_call(cmd)'
  - '        except subprocess.CalledProcessError:'
  - '            logging.error(f''Failed to fetch model at {m.hf_repo} / {m.hf_file}
    with command:\n  {" ".join(cmd)}'')'
  - '            exit(1)'
