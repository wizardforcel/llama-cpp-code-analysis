desc: 该脚本用于从服务器测试文件中收集所有的Hugging Face模型参数，并预先使用llama-cli获取这些模型，以避免慢速测试因模型下载而超时。它通过AST解析测试文件中的参数化测试，提取模型repo和文件信息，然后逐一调用llama-cli确保模型已被下载。
file: scripts/fetch_server_test_models.py
funcs:
- code:
  - 'def collect_hf_model_test_parameters(test_file) -> Generator[HuggingFaceModel,
    None, None]:'
  - '    try:'
  - '        with open(test_file) as f:'
  - '            tree = ast.parse(f.read())'
  - '    except Exception as e:'
  - '        logging.error(f''collect_hf_model_test_parameters failed on {test_file}:
    {e}'')'
  - '        return'
  - ''
  - '    for node in ast.walk(tree):'
  - '        if isinstance(node, ast.FunctionDef):'
  - '            for dec in node.decorator_list:'
  - '                if isinstance(dec, ast.Call) and isinstance(dec.func, ast.Attribute)
    and dec.func.attr == ''parametrize'':'
  - '                    param_names = ast.literal_eval(dec.args[0]).split(",")'
  - '                    if "hf_repo" not in param_names:'
  - '                        continue'
  - ''
  - '                    raw_param_values = dec.args[1]'
  - '                    if not isinstance(raw_param_values, ast.List):'
  - '                        logging.warning(f''Skipping non-list parametrize entry
    at {test_file}:{node.lineno}'')'
  - '                        continue'
  - ''
  - '                    hf_repo_idx = param_names.index("hf_repo")'
  - '                    hf_file_idx = param_names.index("hf_file") if "hf_file" in
    param_names else None'
  - ''
  - '                    for t in raw_param_values.elts:'
  - '                        if not isinstance(t, ast.Tuple):'
  - '                            logging.warning(f''Skipping non-tuple parametrize
    entry at {test_file}:{node.lineno}'')'
  - '                            continue'
  - '                        yield HuggingFaceModel('
  - '                            hf_repo=ast.literal_eval(t.elts[hf_repo_idx]),'
  - '                            hf_file=ast.literal_eval(t.elts[hf_file_idx]) if
    hf_file_idx is not None else None)'
  desc: 解析指定测试文件的AST，从参数化测试装饰器中提取Hugging Face模型参数，生成HuggingFaceModel对象。如果遇到无法解析的代码或非预期的参数结构，会发出警告或错误日志并跳过。
