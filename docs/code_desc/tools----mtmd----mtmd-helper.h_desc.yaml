classes: []
desc: the file defines the stable-ish C API helper functions for the mtmd multimodal
  library. It provides auxiliary routines for logging configuration, bitmap loading
  from files or buffers, token/position counting from input chunks, batch evaluation
  (which orchestrates text decoding and image encoding followed by decoding), single-chunk
  evaluation, and image-chunk decoding with established embeddings. It is designed
  to sit on top of the core mtmd and llama APIs to simplify integration, while explicitly
  noting that these helpers may change without notice.
file: tools/mtmd/mtmd-helper.h
funcs:
- code:
  - MTMD_API void mtmd_helper_log_set(ggml_log_callback log_callback, void * user_data);
  desc: the function sets a callback for all future logging events. If not called,
    or NULL is supplied, all logs go to stderr. It also internally invokes mtmd_log_set()
    to apply the same callback at the lower level.
  line: 23-30
  name: mtmd_helper_log_set
- code:
  - MTMD_API mtmd_bitmap * mtmd_helper_bitmap_init_from_file(mtmd_context * ctx, const
    char * fname);
  desc: the function constructs a mtmd_bitmap from a file by delegating to mtmd_helper_bitmap_init_from_buf()
    internally. It returns nullptr on failure and is declared thread-safe.
  line: 31-34
  name: mtmd_helper_bitmap_init_from_file
- code:
  - MTMD_API mtmd_bitmap * mtmd_helper_bitmap_init_from_buf(mtmd_context * ctx, const
    unsigned char * buf, size_t len);
  desc: the function constructs a mtmd_bitmap from a buffer containing file data.
    It supports image formats via stb_image (jpg, png, bmp, gif) and audio formats
    via miniaudio (wav, mp3, flac). Audio is auto-detected from magic bytes, returns
    nullptr on failure, and is thread-safe.
  line: 35-42
  name: mtmd_helper_bitmap_init_from_buf
