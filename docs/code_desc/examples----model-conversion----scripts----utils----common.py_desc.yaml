- code:
  - 'def summarize(tensor: torch.Tensor, name: str, max_seq: int = 3, max_vals: int
    = 3):'
  - '    t = tensor.detach().to(torch.float32).cpu()'
  - ''
  - '    # Determine dimensions'
  - '    if t.ndim == 3:'
  - '        _, s, _ = t.shape'
  - '    elif t.ndim == 2:'
  - '        _, s = 1, t.shape[0]'
  - '        t = t.unsqueeze(0)'
  - '    elif t.ndim == 4:'
  - '        _, s, _, _ = t.shape'
  - '    else:'
  - '        print(f"Skipping tensor due to unsupported dimensions: {t.ndim}")'
  - '        return'
  - ''
  - '    ten_shape = t.shape'
  - ''
  - '    print(f"ggml_debug: {name} = (f32)  ... = {{{ten_shape}}}")'
  - '    print("                                     [")'
  - '    print("                                      [")'
  - ''
  - '    # Determine indices for first and last sequences'
  - '    first_indices = list(range(min(s, max_seq)))'
  - '    last_indices = list(range(max(0, s - max_seq), s))'
  - ''
  - '    # Check if there''s an overlap between first and last indices or if we''re
    at the edge case of s = 2 * max_seq'
  - '    has_overlap = bool(set(first_indices) & set(last_indices)) or (max_seq *
    2 == s)'
  - ''
  - '    # Combine indices'
  - '    if has_overlap:'
  - '        # If there''s overlap, just use the combined unique indices'
  - '        indices = sorted(list(set(first_indices + last_indices)))'
  - '        separator_index = None'
  - '    else:'
  - '        # If no overlap, we''ll add a separator between first and last sequences'
  - '        indices = first_indices + last_indices'
  - '        separator_index = len(first_indices)'
  - ''
  - '    for i, si in enumerate(indices):'
  - '        # Add separator if needed'
  - '        if separator_index is not None and i == separator_index:'
  - '            print("                                       ...")'
  - ''
  - '        # Extract appropriate slice'
  - '        vec = t[0, si]'
  - '        if vec.ndim == 2:  # 4D case: flatten heads × dim_per_head'
  - '            flat = vec.flatten().tolist()'
  - '        else:  # 2D or 3D case'
  - '            flat = vec.tolist()'
  - ''
  - '        # First and last slices'
  - '        first = flat[:max_vals]'
  - '        last = flat[-max_vals:] if len(flat) >= max_vals else flat'
  - '        first_str = ", ".join(f"{v:12.4f}" for v in first)'
  - '        last_str = ", ".join(f"{v:12.4f}" for v in last)'
  - ''
  - '        print(f"                                       [{first_str}, ..., {last_str}]")'
  - ''
  - '    print("                                      ],")'
  - '    print("                                     ]")'
  - '    print(f"                                     sum = {t.sum().item():.6f}\n")'
