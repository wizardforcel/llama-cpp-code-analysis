desc: 该代码是Nemotron-V2-VL视觉Transformer模型的图构建实现，用于构建特征提取的计算图。它接收图像输入，添加位置嵌入，拼接类嵌入（class
  embedding）作为寄存器标记，然后经过ViT骨干网络、补丁合并（patch merge）和最终的多层感知机（MLP）解码器，输出视觉特征向量。
