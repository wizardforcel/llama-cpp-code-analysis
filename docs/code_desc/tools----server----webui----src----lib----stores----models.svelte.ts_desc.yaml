desc: This file implements ModelsStore, a Svelte reactive store for managing machine
  learning models in both single-model (MODEL) and multi-model (ROUTER) server modes,
  handling model listing, selection, loading/unloading, modality tracking, caching
  of model properties with TTL, and favorite model persistence via localStorage.
