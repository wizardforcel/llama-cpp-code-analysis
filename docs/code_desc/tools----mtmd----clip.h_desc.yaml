classes: []
desc: The file is an internal header for the mtmd library, defining the interface
  for CLIP (Contrastive Language-Image Pre-training) model handling. It declares data
  structures (contexts, images, enums, parameters), memory management functions, image
  encoding/processing APIs, and model capability query functions. This header facilitates
  both vision and audio encoding through the CLIP model, supporting GPU acceleration,
  flash attention, and various model variants (like MiniCPM-V, GLM, LLaVA).
file: tools/mtmd/clip.h
