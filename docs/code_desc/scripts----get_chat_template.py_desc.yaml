desc: 该脚本用于从HuggingFace模型仓库中获取Jinja聊天模板。它支持通过模型ID和可选的变体名称来下载tokenizer_config.json文件，解析出聊天模板内容，并输出到标准输出设备。脚本优先使用huggingface_hub库进行下载，如果没有该库则通过HTTP请求获取，并处理了JSON格式异常和模型访问权限问题。
