  desc: 获取指定模型的聊天模板。该函数根据模型ID和可选的变体名称，从HuggingFace仓库下载tokenizer_config.json文件，解析其中的chat_template字段。如果模板是字典形式（多模板），则根据变体名称选择对应的模板；若未指定变体则使用'default'变体，否则抛出异常。
