- code:
  - template <int S_v, bool KDA>
  - void gated_delta_net_sycl(const float *     q,
  - '                          const float *     k,'
  - '                          const float *     v,'
  - '                          const float *     g,'
  - '                          const float *     beta,'
  - '                          const float *     curr_state,'
  - '                          float *           dst,'
  - '                          int64_t           H,'
  - '                          int64_t           n_tokens,'
  - '                          int64_t           n_seqs,'
  - '                          int64_t           sq1,'
  - '                          int64_t           sq2,'
  - '                          int64_t           sq3,'
  - '                          int64_t           sv1,'
  - '                          int64_t           sv2,'
  - '                          int64_t           sv3,'
  - '                          int64_t           sb1,'
  - '                          int64_t           sb2,'
  - '                          int64_t           sb3,'
  - '                          const sycl::uint3 neqk1_magic,'
  - '                          const sycl::uint3 rq3_magic,'
  - '                          float             scale) {'
  - '    auto           item_ct1 = sycl::ext::oneapi::this_work_item::get_nd_item<3>();'
  - '    const uint32_t h_idx    = item_ct1.get_group(2);'
  - '    const uint32_t sequence = item_ct1.get_group(1);'
  - '    // each warp owns one column, using warp-level primitives to reduce across
    rows'
  - '    const int      lane     = item_ct1.get_local_id(2);'
  - '    const int      col      = item_ct1.get_group(0) * item_ct1.get_local_range(1)
    + item_ct1.get_local_id(1);'
  - ''
  - '    const uint32_t iq1 = fastmodulo(h_idx, neqk1_magic);'
  - '    const uint32_t iq3 = fastdiv(sequence, rq3_magic);'
  - ''
  - '    const int64_t attn_score_elems = S_v * H * n_tokens * n_seqs;'
  - '    float *       attn_data        = dst;'
  - '    float *       state            = dst + attn_score_elems;'
  - ''
  - '    const int64_t state_offset = (sequence * H + h_idx) * S_v * S_v;'
  - '    state += state_offset;'
  - '    curr_state += state_offset;'
  - '    attn_data += (sequence * n_tokens * H + h_idx) * S_v;'
  - ''
  - '    constexpr int warp_size = ggml_sycl_get_physical_warp_size() < S_v ? ggml_sycl_get_physical_warp_size()
    : S_v;'
  - '    static_assert(S_v % warp_size == 0, "S_v must be a multiple of warp_size");'
  - '    constexpr int rows_per_lane = (S_v + warp_size - 1) / warp_size;'
  - '    float         s_shard[rows_per_lane];'
  - '#pragma unroll'
  - '    for (int r = 0; r < rows_per_lane; r++) {'
  - '        const int i = r * warp_size + lane;'
  - '        s_shard[r]  = curr_state[col * S_v + i];'
  - '    }'
  - ''
  - '    for (int t = 0; t < n_tokens; t++) {'
  - '        const float * q_t = q + iq3 * sq3 + t * sq2 + iq1 * sq1;'
  - '        const float * k_t = k + iq3 * sq3 + t * sq2 + iq1 * sq1;'
  - '        const float * v_t = v + sequence * sv3 + t * sv2 + h_idx * sv1;'
  - ''
  - '        const int64_t gb_offset = sequence * sb3 + t * sb2 + h_idx * sb1;'
  - '        const float * beta_t = beta + gb_offset;'
  - '        const float * g_t    = g    + gb_offset * (KDA ? S_v : 1);'
  - ''
  - '        const float beta_val = *beta_t;'
  - ''
  - '        if constexpr (!KDA) {'
  - '            const float g_val = sycl::native::exp(*g_t);'
  - ''
  - '            // kv[col] = (S^T @ k)[col] = sum_i S[i][col] * k[i]'
  - '            float kv_shard = 0.0f;'
  - '#pragma unroll'
  - '            for (int r = 0; r < rows_per_lane; r++) {'
  - '                const int i = r * warp_size + lane;'
  - '                kv_shard += s_shard[r] * k_t[i];'
  - '            }'
  - '            float kv_col = warp_reduce_sum<warp_size>(kv_shard);'
  - ''
  - '            // delta[col] = (v[col] - g * kv[col]) * beta'
  - '            float delta_col = (v_t[col] - g_val * kv_col) * beta_val;'
  - ''
  - '            // fused: S[i][col] = g * S[i][col] + k[i] * delta[col]'
  - '            // attn[col] = (S^T @ q)[col] = sum_i S[i][col] * q[i]'
  - '            float attn_partial = 0.0f;'
  - '#pragma unroll'
  - '            for (int r = 0; r < rows_per_lane; r++) {'
  - '                const int i = r * warp_size + lane;'
  - '                s_shard[r]  = g_val * s_shard[r] + k_t[i] * delta_col;'
  - '                attn_partial += s_shard[r] * q_t[i];'
  - '            }'
  - ''
  - '            float attn_col = warp_reduce_sum<warp_size>(attn_partial);'
  - ''
  - '            if (lane == 0) {'
  - '                attn_data[col] = attn_col * scale;'
  - '            }'
  - '        } else {'
  - '            // kv[col] = sum_i g[i] * S[i][col] * k[i]'
  - '            float kv_shard = 0.0f;'
  - '#pragma unroll'
  - '            for (int r = 0; r < rows_per_lane; r++) {'
  - '                const int i = r * warp_size + lane;'
  - '                kv_shard += sycl::native::exp(g_t[i]) * s_shard[r] * k_t[i];'
  - '            }'
  - ''
  - '            float kv_col = warp_reduce_sum<warp_size>(kv_shard);'
  - ''
  - '            // delta[col] = (v[col] - kv[col]) * beta'
  - '            float delta_col = (v_t[col] - kv_col) * beta_val;'
  - ''
  - '            // fused: S[i][col] = g[i] * S[i][col] + k[i] * delta[col]'
  - '            // attn[col] = (S^T @ q)[col] = sum_i S[i][col] * q[i]'
  - '            float attn_partial = 0.0f;'
  - '#pragma unroll'
  - '            for (int r = 0; r < rows_per_lane; r++) {'
  - '                const int i = r * warp_size + lane;'
  - '                s_shard[r]  = sycl::native::exp(g_t[i]) * s_shard[r] + k_t[i]
    * delta_col;'
  - '                attn_partial += s_shard[r] * q_t[i];'
  - '            }'
  - ''
  - '            float attn_col = warp_reduce_sum<warp_size>(attn_partial);'
  - ''
  - '            if (lane == 0) {'
  - '                attn_data[col] = attn_col * scale;'
  - '            }'
  - '        }'
  - ''
  - '        attn_data += S_v * H;'
  - '    }'
  - ''
  - '    // Write state back to global memory'
  - '#pragma unroll'
  - '    for (int r = 0; r < rows_per_lane; r++) {'
  - '        const int i          = r * warp_size + lane;'
  - '        state[col * S_v + i] = s_shard[r];'
  - '    }'
  - '}'
  desc: 核心SYCL模板内核函数，实现门控delta网络的单次状态更新和注意力计算。它使用warp-level原语处理每一列，根据KDA模板参数支持两种不同的计算路径（分别处理组gating和单gating），最终计算并存储注意力输出及更新后的状态。
