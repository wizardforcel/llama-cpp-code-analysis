desc: 该文件实现了基于SYCL的Gated Delta Net（门控德尔塔网络）算子，这是ggml推理框架中SYCL后端的一部分。该实现包含一个模板化内核函数，分别处理两种模式（KDA为true/false），以及负责资源管理和内核分发的发射函数。它执行融合的注意力计算和递归状态更新，专为SYCL
  GPU设备上的高效推理而优化。
