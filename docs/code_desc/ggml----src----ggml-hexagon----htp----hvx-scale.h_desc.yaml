desc: 该文件是 ggml 项目中针对 Qualcomm Hexagon 架构 HVX 向量扩展实现的浮点缩放（scale）和缩放偏移（scale+offset）运算的头文件。它利用
  HVX 硬件向量指令，通过宏定义和多个内联函数，针对目标缓冲区（dst）和源缓冲区（src）分别是否以 128 字节对齐（对应 HVX_Vector 或 HVX_UVector
  类型）的四种组合，提供了高效的批量向量化操作。
file: ggml/src/ggml-hexagon/htp/hvx-scale.h
