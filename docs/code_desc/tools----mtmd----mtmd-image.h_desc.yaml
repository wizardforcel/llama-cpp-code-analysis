desc: 该文件定义了用于多模态模型图像预处理的多个图像预处理器结构体。这些结构体继承自基类 mtmd_image_preprocessor，并实现了不同的图像预处理策略，包括
  LLava-UHD 切片、固定尺寸调整、动态尺寸调整以及针对特定模型（LFM2、Idefics3、InternVL、DeepSeekOCR、YouTuVL）的定制处理逻辑。文件还声明了图像格式转换、尺寸计算和切片等辅助方法。
