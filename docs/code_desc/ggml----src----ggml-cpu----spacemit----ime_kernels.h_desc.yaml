classes: []
desc: This header file defines the interface for SpacemiT IME (Intelligent Memory
  Engine) kernel functions and quantization routines in the ggml CPU backend. It declares
  a high-performance GEMM kernel for int8 quantized activations with int8 or int4
  weights, along with row-wise quantization utilities for converting float activations
  to int8 format, organized within nested namespaces for modularity.
file: ggml/src/ggml-cpu/spacemit/ime_kernels.h
