  desc: A high-performance General Matrix Multiply (GEMM) kernel for quantized neural
    network inference, computing C = A * B where A is int8 quantized activations and
    B is int8 or int4 quantized weights, with support for bias, scaling factors, zero
    points, and configurable strides and block lengths.
