desc: 该文件定义了一个用于n-gram哈希的轻量级数据结构common_ngram_mod，它是一种用于在文本处理或语言模型中创建和查询固定长度token序列（n-gram）哈希表的工具。该结构将n个连续token的序列作为键，通过组合哈希函数进行索引，并支持增、查、重置等操作，其存储方式为线性探测（或类似开放寻址）的哈希表，其中空槽位用EMPTY标记。
