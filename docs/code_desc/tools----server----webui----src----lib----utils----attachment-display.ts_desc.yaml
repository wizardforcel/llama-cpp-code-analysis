- code:
  - export function getAttachmentDisplayItems(
  - "\toptions: AttachmentDisplayItemsOptions"
  - '): ChatAttachmentDisplayItem[] {'
  - "\tconst { uploadedFiles = [], attachments = [] } = options;"
  - "\tconst items: ChatAttachmentDisplayItem[] = [];"
  - "\tfor (const file of uploadedFiles) {"
  - "\t\titems.push({"
  - "\t\t\tid: file.id,"
  - "\t\t\tname: file.name,"
  - "\t\t\tsize: file.size,"
  - "\t\t\tpreview: file.preview,"
  - "\t\t\tisImage: getUploadedFileCategory(file) === FileTypeCategory.IMAGE,"
  - "\t\t\tisMcpPrompt: isMcpPromptUpload(file),"
  - "\t\t\tisLoading: file.isLoading,"
  - "\t\t\tloadError: file.loadError,"
  - "\t\t\tuploadedFile: file,"
  - "\t\t\ttextContent: file.textContent"
  - "\t\t});"
  - "\t}"
  - "\tfor (const [index, attachment] of attachments.entries()) {"
  - "\t\tconst isImage = isImageFile(attachment);"
  - "\t\tconst isMcpPrompt = isMcpPromptAttachment(attachment);"
  - "\t\tconst isMcpResource = isMcpResourceAttachment(attachment);"
  - "\t\titems.push({"
  - "\t\t\tid: `attachment-${index}`,"
  - "\t\t\tname: attachment.name,"
  - "\t\t\tpreview: isImage && 'base64Url' in attachment ? attachment.base64Url :\
    \ undefined,"
  - "\t\t\tisImage,"
  - "\t\t\tisMcpPrompt,"
  - "\t\t\tisMcpResource,"
  - "\t\t\tattachment,"
  - "\t\t\tattachmentIndex: index,"
  - "\t\t\ttextContent: 'content' in attachment ? attachment.content : undefined"
  - "\t\t});"
  - "\t}"
  - "\treturn items.reverse();"
  - '}'
