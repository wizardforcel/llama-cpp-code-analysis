desc: 该文件定义了llama_memory_hybrid类及其对应的上下文类llama_memory_hybrid_context。llama_memory_hybrid实现了llama_memory_i接口，通过组合llama_kv_cache（用于注意力层）和llama_memory_recurrent（用于循环层）来支持混合架构模型，其中每层既可以是基于注意力的也可以是基于循环的。llama_memory_hybrid_context实现了llama_memory_context_i接口，负责在推理过程中管理混合内存的批次初始化和更新流程。
