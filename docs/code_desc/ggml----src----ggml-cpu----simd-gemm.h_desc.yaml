desc: 该文件实现了通用的单精度浮点矩阵乘法 C[M x N] += A[M x K] * B[K x N]，通过 SIMD 指令集（如 AVX、NEON 等）提供优化的矩阵乘法核心函数。代码根据编译平台选择
  SIMD 或标量路径，包含微内核函数和顶层的矩阵分块处理逻辑，旨在最大化缓存利用和并行度。
