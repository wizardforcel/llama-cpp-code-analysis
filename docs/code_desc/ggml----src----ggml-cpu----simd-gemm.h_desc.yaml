  - '    static constexpr int GEMM_RN = 2;'
  - '#endif'
  desc: 文件顶部的全局代码，定义 SIMD 路径的编译条件、分块常量（GEMM_RM 和 GEMM_RN），以及根据指令集选择不同配置。
