desc: 该头文件是 GGML CPU 后端的内部实现接口，负责定义 CPU 计算线程参数、跨平台 SIMD 类型与操作适配、ARM 32 位兼容实现、Power/LoongArch/RISC-V/WebAssembly
  等架构的向量辅助函数，以及线程池屏障和分块计数相关函数声明。文件主要通过条件编译统一不同处理器指令集的加载、归约、点积、查表和向量运算接口，不包含 C++ 类或类方法。
