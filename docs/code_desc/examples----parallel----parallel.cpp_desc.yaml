desc: 该文件是一个使用 llama.cpp 库的 C++ 应用程序的入口，它模拟了一个服务器与多个并发客户端交互的场景。服务器接收来自不同客户端的请求，并利用并行上下文（KV
  cache）同时处理这些请求，从而演示了批量处理、连续批处理（continuous batching）和共享或独立系统提示词等高级并行推理特性。程序通过一个主循环管理所有客户端的状态机，包括发起提示词、解码生成、处理批处理失败和最终结束序列。
