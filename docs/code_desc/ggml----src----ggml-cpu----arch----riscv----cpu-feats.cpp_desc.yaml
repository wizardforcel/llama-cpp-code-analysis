classes:
- desc: 一个内部辅助类，在构造时利用Linux的riscv_hwprobe系统调用探测并存储当前RISC-V处理器是否支持向量扩展（RVV），结果保存在成员变量has_rvv中。
  methods:
  - code:
    - struct riscv64_features {
    - '    bool has_rvv = false;'
    - '    riscv64_features() {'
    - '        struct riscv_hwprobe probe;'
    - '        probe.key = RISCV_HWPROBE_KEY_IMA_EXT_0;'
    - '        probe.value = 0;'
    - ''
    - '        int ret = syscall(__NR_riscv_hwprobe, &probe, 1, 0, NULL, 0);'
    - ''
    - '        if (0 == ret) {'
    - '            has_rvv = !!(probe.value & RISCV_HWPROBE_IMA_V);'
    - '        }'
    - '    }'
    - '};'
    desc: 构造函数，负责发起系统调用riscv_hwprobe，请求查询IMA扩展特性，并通过检查返回值中的RVV标志位来设置has_rvv成员。
    line: 6-22
    name: riscv64_features
  name: riscv64_features
desc: 该文件用于在64位RISC-V架构的CPU后端初始化时，通过Linux硬件探测系统调用检测处理器是否支持RVV（向量扩展）指令集，并据此计算一个用于后端排序的评分值。它通过条件编译（针对RVV支持）调整评分，最终通过宏导出评分函数给动态加载机制使用。
file: ggml/src/ggml-cpu/arch/riscv/cpu-feats.cpp
funcs:
- code:
  - static int ggml_backend_cpu_riscv64_score() {
  - '    int score = 1;'
  - '    riscv64_features rf;'
  - ''
  - '#ifdef GGML_USE_RVV'
  - '    if (!rf.has_rvv) { return 0; }'
  - '    score += 1 << 1;'
  - '#endif'
  - ''
  - '    return score;'
  - '}'
  desc: 全局静态函数，用于计算RISC-V 64位CPU后端的性能评分。它实例化riscv64_features来检查RVV支持，若编译时启用了RVV但硬件不支持则返回0，否则在基础分1上叠加RVV相关的加分。
  line: 24-35
  name: ggml_backend_cpu_riscv64_score
