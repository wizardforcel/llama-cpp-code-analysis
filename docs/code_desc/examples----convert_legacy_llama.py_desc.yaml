  GGUF 文件的写入等功能。该文件是llama模型转换为GGUF格式的核心转换脚本，实现了从PyTorch/HuggingFace格式加载模型、参数解析、张量名称映射、量化类型选择、GGUF元数据写入以及最终输出文件生成的完整流程，支持多种词汇表类型和并发处理。
