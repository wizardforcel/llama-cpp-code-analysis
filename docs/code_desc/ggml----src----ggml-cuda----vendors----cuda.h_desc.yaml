desc: 该文件是 CUDA 头文件的兼容性适配层，用于处理不同版本 CUDA 的 API 差异。它通过条件编译包含特定版本的 CUDA 数学库头文件（如 fp8、fp4），并为旧版本
  CUDA 定义了宏和类型别名，以确保代码在多个 CUDA 版本下能够编译和运行。
