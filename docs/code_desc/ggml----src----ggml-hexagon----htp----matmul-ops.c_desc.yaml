desc: 该文件是ggml库在Qualcomm Hexagon HTP（Hexagon Tensor Processor）上的矩阵乘法（matmul）优化实现，专注于量化格式（如Q4_0x4x2、Q8_0x4x2、IQ4_NL、MXFP4）的向量点积运算。它利用Hexagon的HVX（Hexagon
  Vector eXtensions）SIMD指令和查表（LUT）技术，实现了1x1、2x1和2x2的tile矩阵乘法内核，通过逐块并行处理、预计算查表表和快速除法来最大化计算吞吐量。该文件是ggml项目中针对Hexagon
  DSP架构的HTP（Hexagon Tensor Processor）后端的矩阵乘法运算实现，包含多种量化格式（如Q8_0x4x2、IQ4_NL、MXFP4）的向量点乘（vec_dot）优化内核，利用HVX向量指令集实现高效的1x1、2x1和2x2输出分块的矩阵乘法计算。该文件是
  ggml 项目中针对 Qualcomm Hexagon 处理器（HVX 向量扩展）实现的矩阵乘法（matmul）和矩阵向量乘法（matvec）内核代码。它包含多种量化格式（如
  mxfp4x4x2、q8x4x2）和数据类型（如 fp16、fp32）的向量点积（vec_dot）函数，以及调用这些函数的高层 2D/4D 矩阵乘法调度器（matmul_2d、matmul_4d、matvec_2d）。代码充分利用
  HVX SIMD 指令和 DMA 引擎进行数据传输，以优化在 Hexagon DSP 上的推理性能。This file contains the Hexagon
  Tensor Processor (HTP) implementation of matrix multiplication and matrix-vector
  multiplication operations, optimized for HVX vector extensions. It includes functions
  for preloading data into VTCM scratchpads, performing quantized and floating-point
  dot products, and handling dynamic quantization of input tensors.该文件实现了面向Hexagon
  DSP的矩阵乘法运算，包含标准matmul和带专家路由的matmul_id两种操作，负责量化、VTCM内存分配、工作线程调度及计算执行。
