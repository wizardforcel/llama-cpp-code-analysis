- code:
  - static inline HVX_Vector_x8 hvx_vec_load_iq4nlx4x8_partial(const uint8_t * restrict
    ptr, uint32_t n) {
  - '    const HVX_Vector * restrict vptr = (const HVX_Vector *) ptr;'
  - '    const uint32_t qk   = QK_Q4_0x4x2;'
  - '    const uint32_t nb   = n / qk;'
  - '    const uint32_t nloe = n % qk;'
  - '    const HVX_Vector mask_h4 = Q6_Vb_vsplat_R(0x0F);'
  - '    const HVX_Vector lut     = *(const HVX_Vector *) kvalues_iq4nl_lut;'
  - '    HVX_Vector_x8 r;'
  - '    uint32_t      i = 0;'
  - '    #pragma unroll(2)'
  - '    for (i = 0; i < nb; i++) {'
  - '        HVX_Vector v   = vptr[i];'
  - '        HVX_Vector v0  = Q6_V_vand_VV(v, mask_h4);'
  - '        HVX_Vector v1  = Q6_Vub_vlsr_VubR(v, 4);'
  - '        r.v[i * 2 + 0] = Q6_Vb_vlut32_VbVbI(v0, lut, 0);'
  - '        r.v[i * 2 + 1] = Q6_Vb_vlut32_VbVbI(v1, lut, 0);'
  - '    }'
  - '    if (nloe) {'
  - '        HVX_Vector     v      = vptr[i];'
  - '        HVX_Vector     v0     = Q6_V_vand_VV(v, mask_h4);'
  - '        HVX_Vector     v1     = Q6_Vub_vlsr_VubR(v, 4);'
  - '        HVX_VectorPair v0_1_p = Q6_W_vshuff_VVR(v1, v0, -1);'
  - '        r.v[i * 2 + 0]        = Q6_Vb_vlut32_VbVbI(Q6_V_lo_W(v0_1_p), lut, 0);'
  - '        r.v[i * 2 + 1]        = Q6_Vb_vlut32_VbVbI(Q6_V_hi_W(v0_1_p), lut, 0);'
  - '    }'
  - '    return r;'
  - '}'
  desc: 该函数用于加载IQ4_NL量化数据的部分块（可能不足1024个元素），通过循环和尾部处理来解包索引并查表。
