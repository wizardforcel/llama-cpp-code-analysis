    name: llm_build_command_r
  name: llm_build_command_r
desc: 该文件实现了基于Command-R架构的LLM图构建逻辑，核心功能是通过llm_build_command_r类构造函数，将Transformer解码器层的自注意力、前馈网络和归一化等算子串联成计算图，并支持KV缓存、输出目标筛选及logits缩放，用于推理阶段的模型前向传播。
file: src/models/command-r.cpp
