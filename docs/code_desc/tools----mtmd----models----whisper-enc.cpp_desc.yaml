    name: build
  name: clip_graph_whisper_enc
desc: 该文件定义了clip_graph_whisper_enc类的build方法，用于构建Whisper编码器的计算图。该方法接收原始音频输入，依次通过卷积层、Transformer编码器、可选的堆叠帧模块和多种投影器（如Ultravox、Qwen2A、Voxtral、MusicFlamingo或GLMA），最终输出投影后的特征表示，用于多模态模型的音频编码。
