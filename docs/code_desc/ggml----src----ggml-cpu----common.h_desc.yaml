desc: 该头文件为 ggml CPU 后端提供通用的类型转换、线程工作范围计算和 Flash Attention 分块配置工具。它定义了 FP16、BF16、FP32
  与 INT32 之间的便捷转换函数，并通过模板特化建立不同数据类型到 FP32 的转换映射；同时提供根据线程参数划分张量行范围的辅助函数，以及统一的 Flash
  Attention Q/KV tile 大小配置。
