classes: []
desc: This file, backend-convert.h, is a header file in the ggml-virtgpu backend of
  the GGML library. Its core functionality is to provide inline conversion helper
  functions that map GGML's high-level backend buffer handles and buffer type handles
  to the APIR (Abstraction and API for GPU resources) low-level host handles, facilitating
  the interface between the GGML backend API layer and the lower-level VirtGPU-specific
  APIR implementation.
file: ggml/src/ggml-virtgpu/backend/backend-convert.h
funcs:
- code:
  - static inline apir_buffer_host_handle_t ggml_buffer_to_apir_handle(ggml_backend_buffer_t
    buffer) {
  - '    // in the backend, the buffer handle is the buffer pointer'
  - '    return (apir_buffer_host_handle_t) buffer;'
  - '}'
  desc: This is a static inline global function that converts a GGML backend buffer
    pointer (ggml_backend_buffer_t) into an APIR buffer host handle (apir_buffer_host_handle_t)
    by directly casting the pointer, as the buffer handle in this backend is the buffer
    pointer itself.
  line: 6-9
  name: ggml_buffer_to_apir_handle
- code:
  - static inline apir_buffer_type_host_handle_t ggml_buffer_type_to_apir_handle(ggml_backend_buffer_type_t
    buft) {
  - '    // in the backend, the buffer handle is the buffer pointer'
  - '    return (apir_buffer_type_host_handle_t) buft;'
  - '}'
  desc: This is a static inline global function that converts a GGML backend buffer
    type pointer (ggml_backend_buffer_type_t) into an APIR buffer type host handle
    (apir_buffer_type_host_handle_t) by directly casting the pointer, ensuring type
    conversion between the two handle representations.
