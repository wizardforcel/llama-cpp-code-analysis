- code:
  - 'export async function convertToWav(audioBlob: Blob): Promise<Blob> {'
  - '    try {'
  - '        if (audioBlob.type.includes(''wav'')) {'
  - '            return audioBlob;'
  - '        }'
  - ''
  - '        const arrayBuffer = await audioBlob.arrayBuffer();'
  - ''
  - '        const audioContext = new (window.AudioContext || (window as any).webkitAudioContext)();'
  - ''
  - '        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);'
  - ''
  - '        const wavBlob = audioBufferToWav(audioBuffer);'
  - ''
  - '        audioContext.close();'
  - ''
  - '        return wavBlob;'
  - '    } catch (error) {'
  - '        console.error(''Failed to convert audio to WAV:'', error);'
  - '        return audioBlob;'
  - '    }'
  - '}'
  desc: Asynchronously converts any audio Blob to WAV format by decoding the audio
    data and re-encoding it as PCM WAV; returns original blob if already WAV or if
    conversion fails.
  line: 132-154
  name: convertToWav
- code:
  - 'function audioBufferToWav(buffer: AudioBuffer): Blob {'
  - '    const length = buffer.length;'
  - '    const numberOfChannels = buffer.numberOfChannels;'
  - '    const sampleRate = buffer.sampleRate;'
  - '    const bytesPerSample = 2;'
  - '    const blockAlign = numberOfChannels * bytesPerSample;'
  - '    const byteRate = sampleRate * blockAlign;'
  - '    const dataSize = length * blockAlign;'
  - '    const bufferSize = 44 + dataSize;'
  - ''
  - '    const arrayBuffer = new ArrayBuffer(bufferSize);'
  - '    const view = new DataView(arrayBuffer);'
  - ''
  - '    const writeString = (offset: number, string: string) => {'
  - '        for (let i = 0; i < string.length; i++) {'
  - '            view.setUint8(offset + i, string.charCodeAt(i));'
  - '        }'
  - '    };'
  - ''
  - '    writeString(0, ''RIFF'');'
  - '    view.setUint32(4, bufferSize - 8, true);'
  - '    writeString(8, ''WAVE'');'
  - '    writeString(12, ''fmt '');'
  - '    view.setUint32(16, 16, true);'
  - '    view.setUint16(20, 1, true);'
  - '    view.setUint16(22, numberOfChannels, true);'
  - '    view.setUint32(24, sampleRate, true);'
  - '    view.setUint32(28, byteRate, true);'
  - '    view.setUint16(32, blockAlign, true);'
  - '    view.setUint16(34, 16, true);'
  - '    writeString(36, ''data'');'
  - '    view.setUint32(40, dataSize, true);'
  - ''
  - '    let offset = 44;'
  - '    for (let i = 0; i < length; i++) {'
  - '        for (let channel = 0; channel < numberOfChannels; channel++) {'
  - '            const sample = Math.max(-1, Math.min(1, buffer.getChannelData(channel)[i]));'
  - '            view.setInt16(offset, sample * 0x7fff, true);'
  - '            offset += 2;'
  - '        }'
  - '    }'
  - ''
  - '    return new Blob([arrayBuffer], { type: MimeTypeAudio.WAV });'
  - '}'
  desc: Internal helper function that converts a Web Audio API AudioBuffer to a WAV
    format Blob by manually constructing the RIFF/WAVE header and encoding PCM audio
    data as 16-bit integers.
  line: 156-205
  name: audioBufferToWav
- code:
  - 'export function createAudioFile(audioBlob: Blob, filename?: string): File {'
  - '    const timestamp = new Date().toISOString().replace(/[:.]/g, ''-'');'
  - '    const extension = audioBlob.type.includes(''wav'') ? ''wav'' : ''mp3'';'
  - '    const defaultFilename = `recording-${timestamp}.${extension}`;'
  - ''
  - '    return new File([audioBlob], filename || defaultFilename, {'
  - '        type: audioBlob.type,'
  - '        lastModified: Date.now()'
  - '    });'
  - '}'
  desc: Creates a File object from an audio Blob with a timestamp-based filename (or
    custom name), automatically determining extension from MIME type.
  line: 212-221
  name: createAudioFile
