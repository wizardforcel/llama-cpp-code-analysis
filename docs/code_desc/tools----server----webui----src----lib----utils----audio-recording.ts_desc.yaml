classes:
- desc: A browser-based audio recording class that manages microphone access, recording
    state, and audio format optimization using the MediaRecorder API, with support
    for multiple audio formats and real-time state tracking.
  methods:
  - code:
    - 'async startRecording(): Promise<void> {'
    - '    try {'
    - '        this.stream = await navigator.mediaDevices.getUserMedia({'
    - '            audio: {'
    - '                echoCancellation: true,'
    - '                noiseSuppression: true,'
    - '                autoGainControl: true'
    - '            }'
    - '        });'
    - ''
    - '        this.initializeRecorder(this.stream);'
    - ''
    - '        this.audioChunks = [];'
    - '        this.mediaRecorder!.start(100);'
    - '        this.recordingState = true;'
    - '    } catch (error) {'
    - '        console.error(''Failed to start recording:'', error);'
    - '        throw new Error(''Failed to access microphone. Please check permissions.'');'
    - '    }'
    - '}'
    desc: Initializes microphone access with audio enhancement settings (echo cancellation,
      noise suppression, auto gain control) and starts the recording process with
      a 100ms timeslice for data collection.
    line: 25-44
    name: startRecording
  - code:
    - 'async stopRecording(): Promise<Blob> {'
    - '    return new Promise((resolve, reject) => {'
    - '        if (!this.mediaRecorder || this.mediaRecorder.state === ''inactive'')
      {'
    - '            reject(new Error(''No active recording to stop''));'
    - '            return;'
    - '        }'
    - ''
    - '        this.mediaRecorder.onstop = () => {'
    - '            const mimeType = this.mediaRecorder?.mimeType || MimeTypeAudio.WAV;'
    - '            const audioBlob = new Blob(this.audioChunks, { type: mimeType });'
    - ''
    - '            this.cleanup();'
    - ''
    - '            resolve(audioBlob);'
    - '        };'
    - ''
    - '        this.mediaRecorder.onerror = (event) => {'
    - '            console.error(''Recording error:'', event);'
    - '            this.cleanup();'
    - '            reject(new Error(''Recording failed''));'
    - '        };'
    - ''
    - '        this.mediaRecorder.stop();'
    - '    });'
    - '}'
    desc: Stops the active recording session and returns a Promise resolving to the
      recorded audio Blob with the appropriate MIME type, handling cleanup and error
      states.
    line: 46-71
    name: stopRecording
  - code:
    - 'isRecording(): boolean {'
    - '    return this.recordingState;'
    - '}'
    desc: Returns the current recording state as a boolean indicating whether recording
      is in progress.
    line: 73-75
    name: isRecording
  - code:
    - 'cancelRecording(): void {'
    - '    if (this.mediaRecorder && this.mediaRecorder.state !== ''inactive'') {'
    - '        this.mediaRecorder.stop();'
    - '    }'
    - '    this.cleanup();'
    - '}'
    desc: Cancels the current recording by stopping the MediaRecorder (if active)
      and performing cleanup of all resources without returning the recorded data.
    line: 77-82
    name: cancelRecording
  - code:
    - 'private initializeRecorder(stream: MediaStream): void {'
    - '    const options: MediaRecorderOptions = {};'
    - ''
    - '    if (MediaRecorder.isTypeSupported(MimeTypeAudio.WAV)) {'
    - '        options.mimeType = MimeTypeAudio.WAV;'
    - '    } else if (MediaRecorder.isTypeSupported(MimeTypeAudio.WEBM_OPUS)) {'
    - '        options.mimeType = MimeTypeAudio.WEBM_OPUS;'
    - '    } else if (MediaRecorder.isTypeSupported(MimeTypeAudio.WEBM)) {'
    - '        options.mimeType = MimeTypeAudio.WEBM;'
    - '    } else if (MediaRecorder.isTypeSupported(MimeTypeAudio.MP4)) {'
    - '        options.mimeType = MimeTypeAudio.MP4;'
    - '    } else {'
    - '        console.warn(''No preferred audio format supported, using default'');'
    - '    }'
    - ''
    - '    this.mediaRecorder = new MediaRecorder(stream, options);'
    - ''
    - '    this.mediaRecorder.ondataavailable = (event) => {'
    - '        if (event.data.size > 0) {'
    - '            this.audioChunks.push(event.data);'
    - '        }'
    - '    };'
    - ''
    - '    this.mediaRecorder.onstop = () => {'
    - '        this.recordingState = false;'
    - '    };'
    - ''
    - '    this.mediaRecorder.onerror = (event) => {'
    - '        console.error(''MediaRecorder error:'', event);'
    - '        this.recordingState = false;'
    - '    };'
    - '}'
    desc: 'Private method that configures the MediaRecorder with optimal audio format
      selection (fallback chain: WAV → WebM Opus → WebM → MP4) and sets up event handlers
      for data collection and error handling.'
    line: 84-116
    name: initializeRecorder
  - code:
    - 'private cleanup(): void {'
    - '    if (this.stream) {'
    - '        for (const track of this.stream.getTracks()) {'
    - '            track.stop();'
    - '        }'
    - ''
    - '        this.stream = null;'
    - '    }'
    - '    this.mediaRecorder = null;'
    - '    this.audioChunks = [];'
    - '    this.recordingState = false;'
    - '}'
    desc: Private method that performs resource cleanup by stopping all media stream
      tracks, nullifying references, and resetting the recording state to false.
    line: 118-130
    name: cleanup
  name: AudioRecorder
desc: This file provides a comprehensive audio recording solution for browser environments
  using the MediaRecorder API. It includes an AudioRecorder class for capturing microphone
  input with enhanced audio processing, along with utility functions for converting
  audio to WAV format (via PCM encoding), creating File objects from audio blobs,
  and checking browser compatibility for audio recording features. The module handles
  format fallback across WAV, WebM, MP4, and AAC formats while managing proper resource
  cleanup and error states.
file: tools/server/webui/src/lib/utils/audio-recording.ts
