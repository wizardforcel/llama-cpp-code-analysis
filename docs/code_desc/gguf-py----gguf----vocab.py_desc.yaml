desc: 该文件定义了多种词汇表（vocabulary）处理类，用于从不同的分词器格式（如 BPE、SentencePiece、HuggingFace Transformers
  等）中提取和整理词汇信息，并转换为 GGUF 格式所需的统一接口。它包含了负责处理特殊词汇（如 BOS、EOS）的 SpecialVocab 类，以及针对特定模型架构的
  BpeVocab、SentencePieceVocab、LlamaHfVocab 和 MistralVocab 类，还定义了一个全局的 bytes_to_unicode
  工具函数。这些类都实现了统一的 Vocab 协议，能够输出令牌（token）、分数（score）和类型（type）的迭代器，以便后续在 GGUF 文件中构建词汇表。该代码是
  gguf-py 工具库中 vocab.py 的一部分，专注于 Mistral 分词器的词汇表（vocabulary）处理。它定义了一个类（根据上下文推断为 MistralVocab
  或类似名称），用于将 Mistral 分词器（支持 SentencePiece 和 Tekken 两种类型）的词汇信息提取并转换为 GGUF 格式所需的 token
  列表、token ID 映射及 token 合并规则（merges）。该类通过迭代生成 token 数据、提供特殊 token 的 ID 与字符串属性，并能从
  Tekken 模型中提取 BPE 合并对，最终服务于 GGUF 模型文件的生成。
