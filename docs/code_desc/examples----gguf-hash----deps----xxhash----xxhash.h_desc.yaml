desc: 'This is the xxHash header file, a comprehensive implementation of the extremely
  fast non-cryptographic hash algorithm family. It provides the complete API and implementation
  for three hash families: XXH32 (classic 32-bit), XXH64 (classic 64-bit), and XXH3
  (modern 64-bit and 128-bit). The file includes single-shot hashing functions, streaming
  API for incremental hashing, canonical representation conversion functions, and
  state management utilities. The implementation is highly optimized with conditional
  compilation support for various compilers and platforms.该文件是 xxHash 库的公共头文件片段，主要声明
  XXH64、XXH3 64 位和 128 位哈希算法的单次计算、流式计算、状态管理、种子与自定义 secret 支持、规范化表示及比较辅助 API，同时提供静态链接场景下的内部状态结构和实验性接口声明。代码仅包含
  C/C++ 类型、宏和函数声明，没有类、方法或函数实现。该代码是 xxHash 的 C 头文件实现片段，包含 XXH3 秘密值生成与带秘密值和种子的哈希接口声明，以及
  xxHash 内部实现所需的编译器适配、内存分配、内存复制、字节序检测、非对齐内存读取、字节交换和版本查询等底层函数。代码通过大量条件编译宏适配不同编译器、平台、优化级别和内存访问策略，并开始进入
  XXH32 哈希算法实现部分。这是一个实现了XXH32、XXH64和XXH3家族哈希算法的头文件，提供了非流式（一次性）和流式（分块更新）两种哈希计算接口，并支持跨平台的内存访问和SIMD向量化优化。The
  file is the xxhash.h header from the xxHash project, providing a high-performance
  non-cryptographic hash function implementation. It includes the XXH3 algorithm with
  various SIMD vectorization strategies (SSE2, AVX2, AVX512, NEON, VSX, SVE) and scalar
  fallback, supporting both 64-bit and 128-bit hash outputs. The code includes core
  hash functions, internal helper functions for multiplication and mixing operations,
  and platform-specific optimizations.该文件是xxhash哈希库的核心实现头文件（xxhash.h）的一部分，专注于XXH3哈希算法的内部实现，特别是基于不同SIMD指令集（AVX512、AVX2、SSE2、NEON、VSX、SVE）的加速计算函数，以及标量回退实现。文件中定义了多种硬件加速的累加（accumulate）和混淆（scramble）内部函数，用于处理长输入的高性能哈希计算。该文件是
  xxHash 库中 XXH3 哈希算法实现的一部分，主要提供 XXH3 的标量及按平台选择的向量化累加、扰乱、长输入哈希、64 位公开哈希接口、流式哈希状态管理，以及
  XXH3 128 位哈希算法的短输入处理逻辑。代码通过不同输入长度选择专用路径，并结合自定义 secret、seed、SIMD 后端和流式状态实现高性能哈希计算。该文件片段实现
  xxHash 的 XXH3 128 位哈希算法及其相关 API，包括针对不同输入长度的专用哈希路径、长输入的累积哈希、种子和自定义 secret 支持、流式哈希接口、128
  位哈希值比较与规范化转换，以及 secret 生成工具。代码通过不同位宽乘法、字节序处理、累积器合并和 avalanche 混合操作，在保证跨平台结果一致性的同时优化短输入和长输入的性能。'
