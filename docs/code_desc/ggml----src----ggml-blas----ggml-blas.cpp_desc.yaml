  - '    GGML_ASSERT(ne1 == ne11);'
  - '    GGML_ASSERT(ne2 == ne12);'
  - '    GGML_ASSERT(ne3 == ne13);'
  - ''
  - '    // we don''t support permuted src0 or src1'
  - '    GGML_ASSERT(nb00 == ggml_type_size(type));'
  - '    GGML_ASSERT(nb10 == ggml_type_size(src1->type));'
  - ''
  - '    // dst cannot be transposed or permuted'
  - '    GGML_ASSERT(nb0 == sizeof(float));'
  - '    GGML_ASSERT(nb0 <= nb1);'
  - '    GGML_ASSERT(nb1 <= nb2);'
  - '    GGML_ASSERT(nb2 <= nb3);'
  - ''
  - '    // broadcast factors'
  - '    const int64_t r2 = ne12/ne02;'
  - '    const int64_t r3 = ne13/ne03;'
  - ''
  - '    const int64_t ne_plane      = ne01*ne00;'
  - '    const size_t  desired_wsize = type == GGML_TYPE_F32 ? 0 : ne03*ne02*ne_plane*sizeof(float);'
  - ''
  - '    if (ctx->work_size < desired_wsize) {'
  - '        ctx->work_data.reset(new char[desired_wsize]);'
  - '        ctx->work_size = desired_wsize;'
  - '    }'
  - '    void * wdata = ctx->work_data.get();'
  - ''
  - '    // convert src0 to float'
  - '    if (type != GGML_TYPE_F32) {'
  - '        const auto * type_traits = ggml_get_type_traits(type);'
  - '        ggml_to_float_t const to_float = type_traits->to_float;'
  - ''
  - '        for (int64_t i03 = 0; i03 < ne03; i03++) {'
  - '            for (int64_t i02 = 0; i02 < ne02; i02++) {'
  - '                const void  *       x      = (char *)  src0->data + i02*nb02          +
    i03*nb03;'
  - '                      float * const wplane = (float *) wdata      + i02*ne_plane      +
    i03*ne02*ne_plane;'
  - ''
  - '                const int min_cols_per_thread = 4096;'
  - '                const int min_rows_per_thread = std::max((int)(min_cols_per_thread/ne00),
    1);'
  - '                const int n_threads = std::max(std::min(ctx->n_threads, (int)(ne01/min_rows_per_thread)),
    1);'
  - ''
  - '#ifdef GGML_USE_OPENMP'
  - '                #pragma omp parallel for num_threads(n_threads)'
  - '                for (int64_t i01 = 0; i01 < ne01; i01++) {'
  - '                    to_float((const char *) x + i01*nb01, wplane + i01*ne00,
    ne00);'
  - '                }'
  - '#else'
  - '                for (int i = 1; i < n_threads; i++) {'
  - '                    const int64_t start =       i*ne01/n_threads;'
  - '                    const int64_t end   = (i + 1)*ne01/n_threads;'
  - '                    if (start < end) {'
  - '                        ctx->tasks.push_back(std::async(std::launch::async, [=]()
    {'
  - '                            for (int64_t i01 = start; i01 < end; i01++) {'
  - '                                to_float((const char *) x + i01*nb01, wplane
    + i01*ne00, ne00);'
  - '                            }'
  - '                        }));'
  - '                    }'
  - '                }'
  - '                {'
  - '                    // reuse the current thread for the first task'
  - '                    const int64_t start = 0;'
  - '                    const int64_t end   = ne01/n_threads;'
  - '                    for (int64_t i01 = start; i01 < end; i01++) {'
  - '                        to_float((const char *) x + i01*nb01, wplane + i01*ne00,
    ne00);'
  - '                    }'
  - '                }'
  - '#endif'
  - '            }'
  - '        }'
  - ''
  - '#ifndef GGML_USE_OPENMP'
  - '        // wait for all tasks to finish'
  - '        for (auto & task : ctx->tasks) {'
  - '            task.get();'
  - '        }'
  - '        ctx->tasks.clear();'
  - '#endif'
  - '    }'
  - ''
  - '#if defined(GGML_BLAS_USE_OPENBLAS)'
  - '    openblas_set_num_threads(ctx->n_threads);'
  - '#elif defined(GGML_BLAS_USE_BLIS)'
  - '    bli_thread_set_num_threads(ctx->n_threads);'
  - '#elif defined(GGML_BLAS_USE_NVPL)'
