desc: The file provides a utility function for generating human-readable, uppercase
  file type labels from various input formats including MIME types (e.g., 'application/pdf'
  → 'PDF'), file names with extensions (e.g., 'document.pdf' → 'PDF'), vendor MIME
  subtypes (e.g., 'application/vnd.ms-excel' → 'EXCEL'), and plain type strings, defaulting
  to 'FILE' for undefined inputs.
file: tools/server/webui/src/lib/utils/file-preview.ts
funcs:
- code:
  - 'export function getFileTypeLabel(input: string | undefined): string {'
  - "\tif (!input) return 'FILE';"
  - ''
  - "\t// Handle MIME types (contains '/')"
  - "\tif (input.includes('/')) {"
  - "\t\tconst subtype = input.split('/').pop();"
  - "\t\tif (subtype) {"
  - "\t\t\t// Handle special cases like 'vnd.ms-excel' → 'EXCEL'"
  - "\t\t\tif (subtype.includes('.')) {"
  - "\t\t\t\treturn subtype.split('.').pop()?.toUpperCase() || 'FILE';"
  - "\t\t\t}"
  - "\t\t\treturn subtype.toUpperCase();"
  - "\t\t}"
  - "\t}"
  - ''
  - "\t// Handle file names (contains '.')"
  - "\tif (input.includes('.')) {"
  - "\t\tconst ext = input.split('.').pop();"
  - "\t\tif (ext) return ext.toUpperCase();"
  - "\t}"
  - ''
  - "\t// Handle AttachmentType or other plain strings"
  - "\treturn input.toUpperCase();"
  - '}'
