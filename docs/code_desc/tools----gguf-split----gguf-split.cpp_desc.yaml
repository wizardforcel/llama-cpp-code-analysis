  - '    if (str.back() == ''M'') {'
  - '        sscanf(str.c_str(), "%d", &n);'
  - '        n_bytes = (size_t)n * 1000 * 1000;'
  - '    } else if (str.back() == ''G'') {'
  - '        sscanf(str.c_str(), "%d", &n);'
  - '        n_bytes = (size_t)n * 1000 * 1000 * 1000;'
  - '    } else {'
  - '        throw std::invalid_argument("error: supported units are M (megabytes)
    or G (gigabytes), but got: " + std::string(1, str.back()));'
  - '    }'
  - '    if (n <= 0) {'
  - '        throw std::invalid_argument("error: size must be a positive value");'
  - '    }'
  - '    return n_bytes;'
  - '}'
