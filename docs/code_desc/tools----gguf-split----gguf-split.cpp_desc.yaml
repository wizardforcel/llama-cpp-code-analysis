- desc: Core class responsible for planning and executing the file splitting operation.
    It analyzes the input GGUF file's tensor structure, determines optimal partitioning
    based on configured limits, and manages the creation of output split files. This
    class encapsulates the entire splitting logic including planning, information
    display, and file writing operations.
