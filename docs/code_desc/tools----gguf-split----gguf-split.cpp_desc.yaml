desc: This file provides tools for splitting and merging GGUF model files, a crucial
  functionality for managing large language model weights that exceed file size limits.
  It implements operations to partition a single GGUF file into multiple smaller files
  based on either tensor count or byte size, and conversely, to merge split files
  back into a single unified file. The implementation supports advanced features like
  dry-run mode, custom split sizes, and metadata handling, making it essential for
  distributing or storing large models in manageable chunks.
file: tools/gguf-split/gguf-split.cpp
