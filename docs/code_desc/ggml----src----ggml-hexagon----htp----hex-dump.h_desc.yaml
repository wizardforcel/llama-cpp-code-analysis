classes: []
desc: 该文件是 ggml 项目中用于 Hexagon 平台的调试辅助头文件，提供了一系列静态内联函数，用于将不同数据类型（int8、uint8、uint32、int32、半精度浮点、单精度浮点）的一维数组数据格式化为可读的文本行，并通过
  FARF 宏输出到日志中，以便在开发或调试时快速查看数组内容。
file: ggml/src/ggml-hexagon/htp/hex-dump.h
funcs:
- code:
  - static inline void hex_dump_int8_line(char * pref, const int8_t * x, int n) {
  - '    char str[1024], *p = str, *p_end = str + sizeof(str);'
  - '    p += snprintf(p, p_end - p, "%s: ", pref);'
  - '    for (int i = 0; i < n && p < p_end; i++) {'
  - '        p += snprintf(p, p_end - p, "%d, ", x[i]);'
  - '    }'
  - '    FARF(HIGH, "%s\n", str);'
  - '}'
  desc: 将 int8_t 数组中的元素格式化为包含前缀的字符串，并通过 FARF 宏输出。
