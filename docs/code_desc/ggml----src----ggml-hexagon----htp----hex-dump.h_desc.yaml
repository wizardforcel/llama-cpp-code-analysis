- code:
  - static inline void hex_dump_f32(char * pref, const float * x, uint32_t n) {
  - '    uint32_t n0 = n / 16;'
  - '    uint32_t n1 = n % 16;'
  - ''
  - '    uint32_t i = 0;'
  - '    for (; i < n0; i++) {'
  - '        hex_dump_f32_line(pref, x + (16 * i), 16);'
  - '    }'
  - '    if (n1) {'
  - '        hex_dump_f32_line(pref, x + (16 * i), n1);'
  - '    }'
  - '}'
