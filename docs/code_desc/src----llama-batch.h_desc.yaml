desc: 'This header file defines two core data structures for batch processing in llama.cpp:
  llama_ubatch, a lightweight structure representing a unit batch (ubatch) of tokens/embeddings
  with their positions and sequence associations designed for efficient GPU inference;
  and llama_batch_allocr, a class that acts as a helper for sanitizing, fulfilling,
  and splitting larger input batches into multiple ubatches for processing, handling
  sequence continuation, memory constraints, and different splitting strategies.'
