desc: This file implements the GLU (Gated Linear Unit) and SwiGLU (Sigmoid-weighted
  Linear Unit) operations for the OpenVINO backend of the GGML inference engine. It
  translates GGML graph operations into equivalent OpenVINO operation graphs by slicing
  the input along the last dimension (to split it into two halves for the gating mechanism),
  optionally swapping the halves based on a parameter flag, computing the SiLU activation
  function on one half (which it defines as x * sigmoid(x)), and then multiplying
  the result with the other half to produce the gated output.
file: ggml/src/ggml-openvino/openvino/op/glu_swiglu.cpp
