funcs:
- code:
  - static void cpy_thread_sametype_sameshape(struct htp_copy_context * ct, struct
    htp_ops_context * octx, const int nth, const int ith) {
  - '    cpy_preamble;'
  - '    '
  - '    // parallelize by src0 rows'
  - '    const uint32_t dr  = ct->src0_nrows_per_thread;'
  - '    const uint32_t ir0 = dr * ith;'
  - '    const uint32_t ir1 = (ir0 + dr) < nr ? (ir0 + dr) : nr;'
  - '    '
  - '    // copy by rows'
  - '    for (uint32_t i03 = 0; i03 < ne03; i03++) {'
  - '        for (uint32_t i02 = 0; i02 < ne02; i02++) {'
  - '            #pragma unroll(2)'
  - '            for (uint32_t i01 = ir0; i01 < ir1; i01++) {'
  - '                uint8_t* dst_ptr  = (uint8_t*) dst->data  + i01*nb1  + i02*nb2  +
    i03*nb3;'
  - '                uint8_t* src0_ptr = (uint8_t*) src0->data + i01*nb01 + i02*nb02
    + i03*nb03;'
  - '                hex_l2fetch(src0_ptr, ne00 * ct->src0_type_size, nb01, 2);'
  - '                hvx_copy_uu(dst_ptr, src0_ptr, ne00, ct->src0_type_size);'
  - '            }'
  - '        }'
  - '    }'
  - '}'
