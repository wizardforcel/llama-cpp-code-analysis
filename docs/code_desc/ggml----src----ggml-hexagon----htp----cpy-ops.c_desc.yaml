  - static void cpy_thread_sametype_reshape(struct htp_copy_context * ct, struct htp_ops_context
    * octx, int nth, int ith) {
  - '    cpy_preamble;'
  - '    '
  - '    // parallelize by src0 rows'
  - '    const uint32_t dr  = ct->src0_nrows_per_thread;'
  - '    const uint32_t ir0 = dr * ith;'
  - '    const uint32_t ir1 = (ir0 + dr) < nr ? (ir0 + dr) : nr;'
  - '    '
  - '    // dst counters'
  - '    int64_t k10 = 0;'
  - '    int64_t i11 = 0;'
  - '    int64_t i12 = 0;'
  - '    int64_t i13 = 0;'
  - '    '
  - '    // number of blocks in a row'
  - '    const int64_t nk00 = ct->src0_blocks_per_row;'
  - '    const int64_t nk0  = ct->dst_blocks_per_row;'
  - '    '
  - '    for (int64_t i03 = 0; i03 < ne03; i03++) {'
  - '        for (int64_t i02 = 0; i02 < ne02; i02++) {'
  - '            k10 += nk00 * ir0;'
  - '            while (k10 >= nk0) {'
  - '                k10 -= nk0;'
  - '                if (++i11 == ne1) {'
  - '                    i11 = 0;'
  - '                    if (++i12 == ne2) {'
  - '                        i12 = 0;'
  - '                        if (++i13 == ne3) {'
  - '                            i13 = 0;'
  - '                        }'
  - '                    }'
  - '                }'
  - '            }'
  - '            for (int64_t i01 = ir0; i01 < ir1; i01++) {'
  - '                for (int64_t k00 = 0; k00 < nk00; k00++) {'
  - '                    const char * src0_ptr = ((char *) src0->data + k00*nb00 +
    i01*nb01 + i02*nb02 + i03*nb03);'
  - '                          char * dst_ptr  = ((char *)  dst->data + k10*nb0  +
    i11*nb1  + i12*nb2  + i13*nb3);'
  - '                    memcpy(dst_ptr, src0_ptr, ct->dst_type_size);'
  - '                    '
  - '                    if (++k10 == nk0) {'
  - '                        k10 = 0;'
  - '                        if (++i11 == ne1) {'
  - '                            i11 = 0;'
  - '                            if (++i12 == ne2) {'
  - '                                i12 = 0;'
  - '                                if (++i13 == ne3) {'
  - '                                    i13 = 0;'
  - '                                }'
  - '                            }'
  - '                        }'
  - '                    }'
  - '                }'
  - '            }'
  - '            k10 += nk00 * (ne01 - ir1);'
  - '            while (k10 >= nk0) {'
  - '                k10 -= nk0;'
  - '                if (++i11 == ne1) {'
  - '                    i11 = 0;'
  - '                    if (++i12 == ne2) {'
  - '                        i12 = 0;'
  - '                        if (++i13 == ne3) {'
  - '                            i13 = 0;'
  - '                        }'
  - '                    }'
  - '                }'
  - '            }'
  - '        }'
  - '    }'
  - '}'
