  name: cpy_work_func
- code:
  - int op_cpy(struct htp_ops_context * octx) {
  - '    cpy_preamble;'
  - '    '
  - '    const uint32_t n_threads = MIN(nr, octx->n_threads);'
  - '    '
  - '    struct htp_copy_context ct;'
  - '    ct.octx = octx;'
  - '    '
  - '    switch (src0->type) {'
  - '    case HTP_TYPE_F32: ct.src0_type_size = 4; ct.src0_block_size = 1; ct.src0_blocks_per_row
    = ne00 / 1; break;'
  - '    case HTP_TYPE_F16: ct.src0_type_size = 2; ct.src0_block_size = 1; ct.src0_blocks_per_row
    = ne00 / 1; break;'
  - '    default:'
  - '        return HTP_STATUS_NO_SUPPORT;'
  - '    }'
  - '    '
  - '    switch (dst->type) {'
  - '    case HTP_TYPE_F32: ct.dst_type_size = 4; ct.dst_block_size = 1; ct.dst_blocks_per_row
    = ne0 / 1; break;'
  - '    case HTP_TYPE_F16: ct.dst_type_size = 2; ct.dst_block_size = 1; ct.dst_blocks_per_row
    = ne0 / 1; break;'
  - '    default:'
  - '        return HTP_STATUS_NO_SUPPORT;'
  - '    }'
  - '    '
  - '    if (octx->flags & HTP_OPFLAGS_SKIP_COMPUTE) {'
  - '        return HTP_STATUS_OK;'
  - '    }'
  - '    '
  - '    const bool sametype   = (src0->type == dst->type);'
  - '    const bool transposed = (nb00 > nb01) || (nb0 > nb1);'
  - '    const bool sameshape  = !transposed && (ne00 == ne0 && ne01 == ne1 && ne02
    == ne2 && ne03 == ne3);'
  - '    '
  - '    ct.src0_nrows_per_thread = (nr + n_threads - 1) / n_threads;'
  - '    '
  - '    if (sametype && sameshape) {'
  - '        ct.copy = cpy_thread_sametype_sameshape;'
  - '    } else if (sameshape) {'
  - '        /**/ if (dst->type == HTP_TYPE_F16 && src0->type == HTP_TYPE_F32)'
  - '            ct.copy = cpy_thread_f16_f32_sameshape;'
  - '        else if (dst->type == HTP_TYPE_F32 && src0->type == HTP_TYPE_F16)'
  - '            ct.copy = cpy_thread_f32_f16_sameshape;'
  - '        else'
  - '            return HTP_STATUS_NO_SUPPORT;'
  - '    } else if (sametype) {'
  - '        ct.copy = cpy_thread_sametype_reshape;'
  - '    } else {'
  - '        return HTP_STATUS_NO_SUPPORT;'
  - '    }'
  - '    '
  - '    worker_pool_run_func(octx->ctx->worker_pool, cpy_work_func, &ct, n_threads);'
  - '    '
  - '    return HTP_STATUS_OK;'
  - '}'
