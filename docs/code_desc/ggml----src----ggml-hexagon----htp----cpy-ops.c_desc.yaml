- desc: 该结构体用于存储拷贝操作所需的上下文信息，包括源和目标张量的类型尺寸、块大小以及每行的块数量等元数据，并通过拷贝函数指针（copy）选择具体的实现策略。
  methods: []
  name: htp_copy_context
desc: 该文件实现了在Qualcomm Hexagon DSP上使用HVX向量指令的数据拷贝（copy）操作，支持同类型数据（F32/F16）的拷贝以及F16与F32之间的类型转换。通过多线程并行处理和L2缓存预取（hex_l2fetch）优化性能，并支持相同形状的直接拷贝和不同形状的reshape拷贝操作。
