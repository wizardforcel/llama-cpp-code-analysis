desc: The file test_basic.py is a pytest-based test suite for testing the basic functionality
  of a llm server built around tinyllama2, covering health checks, property endpoints,
  model listing, slot management, split model loading, webui enabling, and model aliases/tags
  handling. It leverages a global server fixture (ServerPreset.tinyllama2) and helper
  utilities such as match_regex to orchestrate and assert on server requests.
