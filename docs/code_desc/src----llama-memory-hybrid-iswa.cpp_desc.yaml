  name: llama_memory_hybrid_iswa_context
desc: 该文件实现了混合ISWA（滑动窗口注意力）内存管理器，将标准KV缓存（iswa变体）和循环内存缓存组合为一个统一的内存系统。它协调两种子缓存的分批处理、状态转换、序列管理和内存更新，并提供一个组合上下文对象来在推理过程中驱动两种缓存类型。
