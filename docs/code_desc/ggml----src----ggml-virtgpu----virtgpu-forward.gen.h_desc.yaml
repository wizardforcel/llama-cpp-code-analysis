classes: []
desc: This file is a generated forward-declaration header for the virtue-gpu (virtgpu)
  backend of GGML. It declares the public application programming interface (API)
  functions that the virtgpu backend exposes to GGML for device management, buffer
  type management, buffer operations (allocation, memory transfer, copying, clearing,
  freeing), and backend graph compute operations. It serves as the stable interface
  between the GGML core and the platform-specific virtgpu implementation, ensuring
  that the backend can be loaded and invoked through these function pointers.
file: ggml/src/ggml-virtgpu/virtgpu-forward.gen.h
