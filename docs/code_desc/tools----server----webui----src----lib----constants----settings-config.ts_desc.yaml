desc: 该文件定义了 WebUI 设置系统的核心常量配置，包含三个主要部分：SETTING_CONFIG_DEFAULT 定义了所有用户设置的默认值（涵盖 API
  密钥、系统消息、UI 偏好、采样参数、MCP 服务器配置等）；SETTING_CONFIG_INFO 提供了每个设置项的用户友好描述文本；SETTINGS_COLOR_MODES_CONFIG
  定义了主题颜色模式选项（系统、浅色、深色）。该文件不包含任何类或函数定义，仅包含三元组常量导出。
