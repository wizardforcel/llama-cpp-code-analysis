desc: 'The file serves as the main entry point for the chat interface components in
  a web-based AI chat application. It centrally exports a comprehensive collection
  of Svelte components organized into logical groups: Attachments (for displaying
  file and MCP prompt attachments), Form (for the chat input with file uploads, audio
  recording, and MCP pickers), Messages (for displaying user and assistant messages
  with editing, branching, and agentic content support), Screen (for the main chat
  container with drag-drop and header), Settings (for the application configuration
  panel), and Sidebar (for conversation history and management). The file uses detailed
  JSDoc comments to document the architecture, features, and APIs of each component,
  ensuring a structured and maintainable UI codebase.'
