desc: This file implements the device configuration and tensor layout extraction for
  the GGML OpenVINO backend. It includes a singleton device config class that manages
  device selection (CPU, GPU, NPU), remote context creation for GPU, compile configurations,
  and a function to extract optimized weight layouts for quantized tensors, including
  special NPU requantization handling.
