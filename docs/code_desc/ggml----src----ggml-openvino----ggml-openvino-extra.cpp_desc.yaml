- code:
  - ggml_openvino_tensor_extra * ggml_openvino_create_tensor_extra(const ggml_tensor
    * tensor, bool is_remote) {
  - '    ov::Shape shape;'
  - '    for (int i = GGML_MAX_DIMS - 1; i >= 0; --i) {'
  - '        shape.push_back(static_cast<size_t>(tensor->ne[i]));'
  - '    }'
  - '    ov::element::Type element_type;'
  - '    switch (tensor->type) {'
  - '    case GGML_TYPE_F32:'
  - '        element_type = ov::element::f32;'
  - '        break;'
  - '    case GGML_TYPE_F16:'
  - '        element_type = ov::element::f16;'
  - '        break;'
  - '    case GGML_TYPE_BF16:'
  - '        element_type = ov::element::bf16;'
  - '        break;'
  - '    case GGML_TYPE_I32:'
  - '        element_type = ov::element::i32;'
  - '        break;'
  - '    case GGML_TYPE_I64:'
  - '        element_type = ov::element::i64;'
  - '        break;'
  - '    default:'
  - '        // GGML_LOG_WARN("%s: unsupported tensor type for ov::Tensor: %s\n",
    __func__, ggml_type_name(tensor->type));'
  - '        return nullptr;'
  - '    }'
  - '    const auto & device_name = ggml_openvino_get_device_name();'
  - '    auto remote_context = ggml_openvino_get_remote_context();'
  - '    std::shared_ptr<ov::Tensor> ov_tensor;'
  - '    if (is_remote) {'
  - '        GGML_ASSERT(device_name == "GPU");'
  - '        auto gpu_context = remote_context->as<ov::intel_gpu::ocl::ClContext>();'
  - '        auto usm_tensor = gpu_context.create_tensor(element_type, shape, tensor->data);'
  - '        ov_tensor = std::make_shared<ov::intel_gpu::ocl::USMTensor>(std::move(usm_tensor));'
  - '    } else {'
  - '        ov_tensor = std::make_shared<ov::Tensor>(element_type, shape, tensor->data);'
  - '    }'
  - '    return new ggml_openvino_tensor_extra(ov_tensor);'
  - '}'
  desc: Creates an OpenVINO tensor extra object wrapping an ov::Tensor, supporting
