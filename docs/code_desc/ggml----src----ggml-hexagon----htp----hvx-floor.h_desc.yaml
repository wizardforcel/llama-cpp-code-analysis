desc: 该文件是Hexagon DSP处理器上针对HVX（Hexagon Vector eXtension）向量指令集实现的浮点数floor（向下取整）和truncate（截断）向量运算的头文件。实现了两个静态内联函数，分别用于对32位浮点数向量执行截断和向下取整操作，利用HVX的SIMD指令特性，通过位操作处理IEEE
  754单精度浮点格式，以优化在Hexagon DSP上的数学运算性能。
file: ggml/src/ggml-hexagon/htp/hvx-floor.h
funcs:
- code:
  - static inline HVX_Vector hvx_vec_truncate_f32(HVX_Vector in_vec) {
  - '    HVX_Vector mask_mant_v  = Q6_V_vsplat_R(IEEE_VSF_MANTMASK);'
  - '    HVX_Vector mask_impl_v  = Q6_V_vsplat_R(IEEE_VSF_MIMPMASK);'
  - '    HVX_Vector const_zero_v = Q6_V_vzero();'
  - ''
  - '    HVX_VectorPred q_negative = Q6_Q_vcmp_gt_VwVw(const_zero_v, in_vec);'
  - ''
  - '    HVX_Vector expval_v = in_vec >> IEEE_VSF_MANTLEN;'
  - '    expval_v &= IEEE_VSF_EXPMASK;'
  - '    expval_v -= IEEE_VSF_EXPBIAS;'
  - ''
  - '    // negative exp == fractional value'
  - '    HVX_VectorPred q_negexp = Q6_Q_vcmp_gt_VwVw(const_zero_v, expval_v);'
  - ''
  - '    HVX_Vector rshift_v = IEEE_VSF_MANTLEN - expval_v;         // fractional
    bits - exp shift'
  - ''
  - '    HVX_Vector mant_v = in_vec & mask_mant_v;                  // obtain mantissa'
  - '    HVX_Vector vout   = Q6_Vw_vadd_VwVw(mant_v, mask_impl_v);  // add implicit
    1.0'
  - ''
  - '    vout = Q6_Vw_vasr_VwVw(vout, rshift_v);                    // shift to obtain
    truncated integer'
  - '    vout = Q6_V_vmux_QVV(q_negexp, const_zero_v, vout);        // expval<0 ->
    0'
  - ''
  - '    HVX_Vector neg_vout = -vout;'
  - ''
  - '    vout = Q6_V_vmux_QVV(q_negative, neg_vout, vout);  // handle negatives'
  - ''
  - '    return (vout);'
  - '}'
  desc: 对输入的32位浮点向量执行截断（向零取整）操作，返回取整后的32位浮点向量，内部操作利用了HVX向量指令和IEEE 754单精度浮点数的位级表示。
