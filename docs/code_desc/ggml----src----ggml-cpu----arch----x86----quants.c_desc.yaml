desc: This file implements SIMD-optimized quantization and dot product functions for
  the GGML CPU backend, focusing on x86 architectures. It provides functions to quantize
  float vectors into various integer formats (like Q8_0, Q8_1, Q8_K) and compute dot
  products between quantized vectors, utilizing advanced SIMD instructions (AVX, AVX2,
  SSE) for performance. The file also includes a series of static inline helper functions
  for SIMD operations and several specialized dot product functions for different
  quantization schemes (e.g., Q4_0, Q4_1, MXFP4).该文件实现了ggml库中x86架构下的量化向量点积操作，针对MXFP4、Q5_0、Q5_1、Q8_0、TQ1_0、TQ2_0、Q2_K、Q3_K等多种量化格式，利用AVX2和AVX指令集进行SIMD优化，以加速神经网络推理中的矩阵乘法运算。该文件位于ggml项目的CPU后端，专注于在x86架构上为多种K-quant格式（Q2_K,
  Q3_K, Q4_K, Q5_K, Q6_K）提供向量点积（dot product）的SIMD优化实现。它通过AVX和AVX2指令集，将经过K-quant量化后的权重向量与Q8_K格式的激活向量进行高效的点积运算，以加速神经网络推理中的矩阵乘法。文件中定义了多个全局函数，每个函数针对特定的量化格式，利用SIMD指令并行处理数据，显著提高了计算吞吐量。该文件是
  ggml 库中针对 x86 架构的量化向量点积计算实现，专注于 IQ2 和 IQ3 系列低比特量化格式与 Q8_K 格式的内积运算。针对 AVX 和 AVX2
  指令集进行了深度优化，通过在循环中利用 SIMD 指令并行处理多个数据块，显著提升了矩阵乘法和神经网络推理的效率。文件中的函数均遵循相似的接口约定，对输入向量长度
  n 进行块级处理，并最终将结果写入输出指针 s。该文件是 ggml 库中针对 x86 架构的量化向量点积实现，包含多种 IQ 系列量化格式（如 IQ2_S、IQ3_XXS、IQ3_S、IQ1_S、IQ1_M）与
  Q8_K 格式之间的高性能点积运算函数。这些函数通过 AVX2 和 AVX 指令集进行 SIMD 优化，在不支持这些指令集时回退到通用实现。该代码是ggml-cpu/arch/x86/quants.c文件的一部分，专注于实现x86架构下不同量化格式（IQ1_M、IQ4_NL、IQ4_XS）的向量点积（vec_dot）功能。这些函数利用AVX2和AVX指令集进行SIMD优化，以加速量化矩阵乘法运算。每个函数针对特定的量化块格式（如block_iq1_m、block_q8_K、block_iq4_nl、block_q8_0等），通过将量化数据解包、扩展为整型或浮点向量，并执行乘加运算来计算点积结果，最终通过水平求和得到标量输出。
