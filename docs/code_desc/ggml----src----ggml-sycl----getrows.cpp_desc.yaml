desc: 该文件实现了SYCL后端中ggml_get_rows算子的核函数与调度逻辑，用于按索引从源张量中选取行并复制到目标张量。它支持浮点（FP16/FP32）以及Q4_0、Q4_1、Q5_0、Q5_1、Q8_0等量化类型的去量化行提取操作，通过SYCL并行计算在GPU等设备上高效执行。
