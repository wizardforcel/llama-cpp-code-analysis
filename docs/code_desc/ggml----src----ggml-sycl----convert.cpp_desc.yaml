classes: []
desc: 该文件是 ggml-sycl 项目中用于在 SYCL 设备上执行张量数据去量化和类型转换的核心实现。它提供了一系列模板函数，将各种量化格式（如 Q4_0、Q4_1、Q2_K
  等）的权重数据转换为浮点格式（fp16 或 fp32），并支持非连续内存布局的转换。文件中包含通用的去量化块函数、各量化类型的专用内核启动函数，以及负责根据张量类型分派到具体实现的接口函数。这些函数基于
  SYCL 异构计算模型实现，利用 GPU 并行加速深度学习模型的推理过程。
file: ggml/src/ggml-sycl/convert.cpp
funcs:
- code:
  - template <int qk, int qr, dequantize_kernel_t dequantize_kernel, typename dst_t>
