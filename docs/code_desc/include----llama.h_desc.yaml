desc: 该文件是llama.cpp库的核心公共C接口头文件，定义了llama.cpp的完整API，包括模型加载/保存、上下文管理、推理推理、tokenizer、采样、LoRA适配器等功能，涵盖所有必要的常量、枚举、结构体定义以及函数声明。此头文件是使用llama.cpp进行本地大语言模型推理的开发者需要总览了解的核心接口入口。该头文件是llama.cpp推理引擎的核心C
  API接口定义，定义了模型加载、上下文管理、分词、解码、采样、KV缓存控制、状态保存恢复等完整功能的函数接口，同时包含llama_sampler结构及其接口定义，用于实现自定义采样器功能。该文件是
  llama.cpp 项目的公共 API 头文件 (llama.h)，定义了 Llama 模型的上下文、模型、采样器、分词器等的初始化、配置、推理、采样、训练等核心功能的接口。它是外部应用与
  llama.cpp 库交互的主要入口。
