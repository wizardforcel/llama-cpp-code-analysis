  name: llama_memory_hybrid_context
desc: 该文件实现了llama_memory_hybrid类及其上下文类，它提供了一种混合内存管理机制，将传统的注意力KV缓存（llama_kv_cache）和递归内存（llama_memory_recurrent）结合起来，用于支持同时具有注意力层和递归层的混合架构模型（如RWKV等）。该类负责统一管理两种内存的初始化、批次准备、序列操作、状态读写等功能，确保两种内存能够协同工作以支持模型的推理过程。
