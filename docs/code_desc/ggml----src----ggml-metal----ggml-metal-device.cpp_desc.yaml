  name: ggml_metal_pipelines
desc: 该文件是 ggml 库中 Metal 后端设备管理与内核（pipeline）获取的实现。它定义了 Metal 设备单例获取、pipeline 缓存管理，以及根据张量操作类型和数据类型动态生成并获取对应
  Metal 计算内核（如矩阵乘、归一化、池化等）的多个辅助函数，是连接高层计算图操作与底层 Metal 着色器程序的桥梁。该文件是 ggml-metal 设备实现中关于
  Metal 计算库的管道（pipeline）获取与编译逻辑部分。它提供了一系列函数，用于根据 ggml 张量操作（如 flash attention、bin 操作、归一化、rope、卷积、upscale
  等）的不同配置，动态生成或获取对应的 Metal 计算着色器管道（pipeline），并设置相关参数（如线程组大小、共享内存等），是 ggml 在 Metal
  后端执行计算核心的关键调度层。
