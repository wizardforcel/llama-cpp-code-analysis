  - ggml_metal_pipeline_with_params ggml_metal_library_get_pipeline_bin(ggml_metal_library_t
    lib, const ggml_tensor * op, int32_t n_fuse) {
  - '    char base[256];'
  - '    char name[256];'
  - ''
  - '    int op_num = -1;'
  - ''
  - '    switch (op->op) {'
  - '        case GGML_OP_ADD: op_num = 0; break;'
  - '        case GGML_OP_SUB: op_num = 1; break;'
  - '        case GGML_OP_MUL: op_num = 2; break;'
  - '        case GGML_OP_DIV: op_num = 3; break;'
  - '        default: GGML_ABORT("fatal error");'
  - '    };'
  - ''
  - '    const char * t0_str = ggml_type_name(op->src[0]->type);'
  - '    const char * t1_str = ggml_type_name(op->src[1]->type);'
  - '    const char * t_str  = ggml_type_name(op->type);'
  - ''
  - '    const bool is_c4 = (op->src[0]->ne[0] % 4 == 0) && (op->src[1]->ne[0] % 4
    == 0);'
  - ''
  - '    const bool is_cb = op->src[0]->ne[0] != op->src[1]->ne[0];'
  - '    const bool is_rb = ggml_is_contiguous(op->src[0]) && ggml_is_contiguous(op->src[1])
    && (ggml_nrows(op->src[1]) == 1) && ggml_nelements(op) < 65536;'
  - ''
  - '    snprintf(base, 256, "kernel_bin_fuse_%s_%s_%s%s", t0_str, t1_str, t_str,
    is_c4 ? "_4" : "");'
  - '    snprintf(name, 256, "%s_op=%d_nf=%d_rb=%d_cb=%d", base, op_num, n_fuse, is_rb,
    is_cb);'
  - ''
  - '    ggml_metal_pipeline_with_params res = ggml_metal_library_get_pipeline(lib,
    name);'
  - '    if (!res.pipeline) {'
  - '        ggml_metal_cv_t cv = ggml_metal_cv_init();'
  - ''
  - '        ggml_metal_cv_set_int16(cv, op_num, FC_BIN + 0);'
  - '        ggml_metal_cv_set_int16(cv, n_fuse, FC_BIN + 1);'
  - '        ggml_metal_cv_set_bool (cv, is_rb,  FC_BIN + 2);'
  - '        ggml_metal_cv_set_bool (cv, is_cb,  FC_BIN + 3);'
  - ''
  - '        res = ggml_metal_library_compile_pipeline(lib, base, name, cv);'
  - ''
  - '        ggml_metal_cv_free(cv);'
  - '    }'
  - ''
  - '    res.c4  = is_c4;'
  - '    res.cnt = is_rb;'
  - ''
  - '    return res;'
  - '}'
