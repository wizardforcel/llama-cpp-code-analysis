  - '        case GGML_TYPE_F32:'
  - '        case GGML_TYPE_F16:'
  - '        case GGML_TYPE_BF16:'
  - '            {'
  - '                if (ne00 < 32) {'
  - '                    nsg = 1;'
  - '                    nr0 = 32;'
  - '                    nr1 = 1;'
  - '                    suffix = "_short";'
  - '                } else {'
  - '                    nsg = std::min(4, (ne00 + 127) / 128);'
  - '                    nr0 = 2;'
  - '                    nr1 = 1;'
  - '                    smem = 32*sizeof(float)*nr0;'
  - '                    suffix = ne00 % 4 == 0 ? "_4" : "";'
  - '                }'
  - '            } break;'
  - '        case GGML_TYPE_Q4_0:'
