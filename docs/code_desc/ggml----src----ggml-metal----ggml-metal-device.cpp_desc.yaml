  - ggml_metal_pipeline_with_params ggml_metal_library_get_pipeline_mul_mv(ggml_metal_library_t
    lib, const ggml_tensor * op) {
  - '    GGML_TENSOR_LOCALS( int32_t, ne0, op->src[0], ne);'
