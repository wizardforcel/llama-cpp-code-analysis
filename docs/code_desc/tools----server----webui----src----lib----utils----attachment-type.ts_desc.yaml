- code:
  - export function isTextFile(
  - "\tattachment?: DatabaseMessageExtra,"
  - "\tuploadedFile?: ChatUploadedFile"
  - '): boolean {'
  - "\tif (uploadedFile) {"
  - "\t\treturn getUploadedFileCategory(uploadedFile) === FileTypeCategory.TEXT;"
  - "\t}"
  - "\n\tif (attachment) {"
  - "\t\treturn ("
  - "\t\t\tattachment.type === AttachmentType.TEXT || attachment.type === AttachmentType.LEGACY_CONTEXT"
  - "\t\t);"
  - "\t}"
  - "\n\treturn false;"
  - '}'
