- code:
  - 'function getUploadedFileCategory(uploadedFile: ChatUploadedFile): FileTypeCategory
    | null {'
  - "\t// First try MIME type"
  - "\tconst categoryByMime = getFileTypeCategory(uploadedFile.type);"
  - "\n\tif (categoryByMime) {"
  - "\t\treturn categoryByMime;"
  - "\t}"
  - "\n\t// Fallback to extension (browsers don't always provide correct MIME types)"
  - "\treturn getFileTypeCategoryByExtension(uploadedFile.name);"
  - '}'
  desc: 根据上传的文件，判断其文件类型类别，优先通过 MIME 类型判断，若失败则通过文件扩展名判断。
