  - '        #endif'
  - '            cur_dir = std::filesystem::path(expanded_prefix).parent_path();'
  - '            cur_dir_str = "";'
  - '        } else if (!path_prefix.empty()) {'
  - '            cur_dir /= std::filesystem::path(path_prefix).parent_path();'
  - '        }'
  - '        std::error_code ec;'
