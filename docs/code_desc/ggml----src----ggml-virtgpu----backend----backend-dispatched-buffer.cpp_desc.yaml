- code:
  - static uint32_t validate_buffer_operation(size_t offset, size_t size, const char
    * operation) {
  - '    // Only check for critical integer overflow - no arbitrary size limits'
  - '    if (offset > SIZE_MAX - size) {'
  - '        GGML_LOG_ERROR(GGML_VIRTGPU_BCK "%s: Integer overflow in offset+size:
    %zu + %zu\n", operation, offset, size);'
  - '        return 1;'
  - '    }'
  - ''
  - '    return 0;  // Valid'
  - '}'
  desc: 静态辅助函数，用于检查缓冲区操作中 offset+size 是否发生整数溢出，防止安全漏洞。
