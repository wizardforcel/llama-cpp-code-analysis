desc: '该文件实现聊天消息、工具调用、推理内容和聊天模板的通用处理能力，兼容 OpenAI 风格 JSON 格式，并支持消息解析与序列化、增量差异计算、工具参数处理、模板初始化与验证、Jinja
  模板直接渲染，以及不同聊天格式和推理格式之间的转换。该文件片段实现了多种大语言模型聊天模板的参数初始化与输出解析逻辑，针对不同模型定义提示词生成、思维链提取、文本内容识别、工具调用解析、JSON
  Schema 响应格式约束、PEG 解析器和语法约束生成等功能。当前片段覆盖 GPT-OSS、Gemma 4、Functionary v3.2、Kimi K2、LFM2、LFM2.5
  以及 GigaChat v3 等模型格式，并根据工具选择、并行调用、推理格式和响应模式动态构建解析规则。The file implements the core
  chat templating system for the LLaMA ecosystem: it builds PEG-based parsers for
  chat formats, routes between Jinja autoparser and legacy templates, adapts tokenizer-based
  tool call structures, and finalizes the common_chat_params used by inference and
  streaming.'
