desc: 该文件是 agentic（智能体编排）功能的 TypeScript 类型声明文件，集中定义了 agentic 会话流所需的全部类型契约，包括编排配置（AgenticConfig）、按角色区分的消息联合类型（AgenticMessage）及其工具调用载荷（AgenticToolCallPayload）、每会话运行状态（AgenticSession）、流式执行回调集合（AgenticFlowCallbacks）、执行选项与参数（AgenticFlowOptions
  / AgenticFlowParams）以及执行结果（AgenticFlowResult），为多轮 LLM-工具调用循环提供强类型的数据结构与回调接口约束。
file: tools/server/webui/src/lib/types/agentic.d.ts
funcs:
- code:
  - import type { MessageRole } from '$lib/enums';
  - import { ToolCallType } from '$lib/enums';
  - import type {
  - "\tApiChatCompletionRequest,"
  - "\tApiChatCompletionToolCall,"
  - "\tApiChatMessageContentPart,"
  - "\tApiChatMessageData"
  - '} from ''./api'';'
  - import type { ChatMessageTimings, ChatMessagePromptProgress } from './chat';
  - import type { DatabaseMessage, DatabaseMessageExtra, McpServerOverride } from
    './database';
  - export interface AgenticConfig {
  - "\tenabled: boolean;"
  - "\tmaxTurns: number;"
  - "\tmaxToolPreviewLines: number;"
  - '}'
  - export type AgenticToolCallPayload = {
  - "\tid: string;"
  - "\ttype: ToolCallType.FUNCTION;"
  - "\tfunction: {"
  - "\t\tname: string;"
  - "\t\targuments: string;"
  - "\t};"
  - '};'
  - export type AgenticMessage =
  - "\t| { role: MessageRole.SYSTEM | MessageRole.USER; content: string | ApiChatMessageContentPart[];\
    \ }"
  - "\t| { role: MessageRole.ASSISTANT; content?: string | ApiChatMessageContentPart[];\
    \ tool_calls?: AgenticToolCallPayload[]; }"
  - "\t| { role: MessageRole.TOOL; tool_call_id: string; content: string | ApiChatMessageContentPart[];\
    \ };"
  - 'export type AgenticAssistantMessage = Extract<AgenticMessage, { role: MessageRole.ASSISTANT
    }>;'
  - export type AgenticToolCallList = NonNullable<AgenticAssistantMessage['tool_calls']>;
  - export type AgenticChatCompletionRequest = Omit<ApiChatCompletionRequest, 'messages'>
    & {
  - "\tmessages: AgenticMessage[];"
  - "\tstream: true;"
  - "\ttools?: ApiChatCompletionRequest['tools'];"
  - '};'
  - export interface AgenticSession {
  - "\tisRunning: boolean;"
  - "\tcurrentTurn: number;"
  - "\ttotalToolCalls: number;"
  - "\tlastError: Error | null;"
  - "\tstreamingToolCall: { name: string; arguments: string } | null;"
  - '}'
  - export interface AgenticFlowCallbacks {
  - "\tonChunk?: (chunk: string) => void;"
  - "\tonReasoningChunk?: (chunk: string) => void;"
  - "\tonToolCallsStreaming?: (toolCalls: ApiChatCompletionToolCall[]) => void;"
  - "\tonAttachments?: (messageId: string, extras: DatabaseMessageExtra[]) => void;"
  - "\tonModel?: (model: string) => void;"
  - "\tonAssistantTurnComplete?: (content: string, reasoningContent: string | undefined,\
    \ timings: ChatMessageTimings | undefined, toolCalls: ApiChatCompletionToolCall[]\
    \ | undefined) => Promise<void>;"
  - "\tcreateToolResultMessage?: (toolCallId: string, content: string, extras?: DatabaseMessageExtra[])\
    \ => Promise<DatabaseMessage>;"
  - "\tcreateAssistantMessage?: () => Promise<DatabaseMessage>;"
  - "\tonFlowComplete?: (timings?: ChatMessageTimings) => void;"
  - "\tonError?: (error: Error) => void;"
  - "\tonTimings?: (timings?: ChatMessageTimings, promptProgress?: ChatMessagePromptProgress)\
    \ => void;"
  - "\tonTurnComplete?: (intermediateTimings: ChatMessageTimings) => void;"
  - '}'
  - export interface AgenticFlowOptions {
  - "\tstream?: boolean;"
  - "\tmodel?: string;"
  - "\ttemperature?: number;"
  - "\tmax_tokens?: number;"
  - "\t[key: string]: unknown;"
  - '}'
  - export interface AgenticFlowParams {
  - "\tconversationId: string;"
  - "\tmessages: (ApiChatMessageData | (DatabaseMessage & { extra?: DatabaseMessageExtra[]\
    \ }))[];"
  - "\toptions?: AgenticFlowOptions;"
  - "\tcallbacks: AgenticFlowCallbacks;"
  - "\tsignal?: AbortSignal;"
  - "\tperChatOverrides?: McpServerOverride[];"
  - '}'
  - export interface AgenticFlowResult {
  - "\thandled: boolean;"
  - "\terror?: Error;"
  - '}'
  desc: 模块级代码：从 $lib/enums 及 ./api、./chat、./database 等本地模块导入类型与枚举，并导出 agentic 编排配置、agentic
    消息联合类型、工具调用载荷类型、agentic 会话状态、流式执行回调接口、执行选项/参数/结果等全部类型声明。
  line: 1-135
