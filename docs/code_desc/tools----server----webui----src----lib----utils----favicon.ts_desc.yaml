classes: []
desc: The file provides utility functions for extracting favicon URLs from given URLs
  using Google's favicon service, it extracts the root domain and returns a possibly
  proxied URL to the favicon, or null for invalid URLs.
file: tools/server/webui/src/lib/utils/favicon.ts
funcs:
- code:
  - /**
  - ' * Favicon utility functions for extracting favicons from URLs.'
  - ' */'
  - ''
  - import { getProxiedUrlString } from './cors-proxy';
  - import {
  - "\tGOOGLE_FAVICON_BASE_URL,"
  - "\tDEFAULT_FAVICON_SIZE,"
  - "\tDOMAIN_SEPARATOR,"
  - "\tROOT_DOMAIN_MIN_PARTS"
  - '} from ''$lib/constants'';'
  desc: Module-level code including module documentation, imports of favicon-related
    helper functions and constants from other project modules.
  line: 1-13
  name: __main__
- code:
  - 'export function getFaviconUrl(urlString: string, useProxy = true): string | null
    {'
  - "\ttry {"
  - "\t\tconst url = new URL(urlString);"
  - "\t\tconst hostnameParts = url.hostname.split(DOMAIN_SEPARATOR);"
  - "\t\tconst rootDomain ="
  - "\t\t\thostnameParts.length >= ROOT_DOMAIN_MIN_PARTS"
  - "\t\t\t\t? hostnameParts.slice(-ROOT_DOMAIN_MIN_PARTS).join(DOMAIN_SEPARATOR)"
  - "\t\t\t\t: url.hostname;"
  - ''
  - "\t\tconst googleFaviconUrl = `${GOOGLE_FAVICON_BASE_URL}?domain=${rootDomain}&sz=${DEFAULT_FAVICON_SIZE}`;"
  - "\t\treturn useProxy ? getProxiedUrlString(googleFaviconUrl) : googleFaviconUrl;"
  - "\t} catch {"
  - "\t\treturn null;"
  - "\t}"
  - '}'
  desc: Builds a Google favicon service URL for the root domain of the given URL,
    optionally routing it through a CORS proxy, returning null when the input URL
    is invalid.
  line: 22-36
  name: getFaviconUrl
