desc: 该文件是llama.cpp中适配器（adapter）相关的头文件，定义了cvec（continuous vector）和lora（low-rank adaptation）两种模型适配器的数据结构。cvec用于在推理过程中向特定层注入连续向量，lora用于通过低秩矩阵对模型权重进行轻量级微调。文件中的主要类包括llama_adapter_cvec、llama_adapter_lora_weight和llama_adapter_lora，提供了适配器的张量操作、权重管理、缩放计算和资源管理等功能。
