classes: []
desc: 该文件是 ggml 项目中 Hexagon DSP 后端 HVX 向量扩展的归约（reduce）操作头文件，针对 int32、fp32 和 fp16 数据类型实现了求和、最大值以及平方和等向量归约函数。它利用
  HVX 内置指令（如旋转、逐元素加法/最大值）在向量寄存器内进行并行归约，并提供了对齐和未对齐内存访问的变体以及顶层分发函数。
file: ggml/src/ggml-hexagon/htp/hvx-reduce.h
funcs:
- code:
  - static inline HVX_Vector hvx_vec_reduce_sum_n_i32(HVX_Vector in, unsigned int
    n) {
  - '    unsigned int total = n * 4;  // total vec nbytes'
  - '    unsigned int width = 4;      // int32'
  - ''
  - '    HVX_Vector sum = in, sum_t;'
  - '    while (width < total) {'
  - '        sum_t = Q6_V_vror_VR(sum, width);     // rotate right'
  - '        sum   = Q6_Vw_vadd_VwVw(sum_t, sum);  // elementwise sum'
  - '        width = width << 1;'
  - '    }'
  - '    return sum;'
  - '}'
