classes: []
desc: 该文件是 ggml 项目中的 SIMD 映射头文件，为不同 CPU 架构（ARM NEON、ARM SVE、x86 AVX/AVX512、Power9、RISC-V、WASM
  等）提供统一的 SIMD 操作宏定义和 FP16/FP32 转换函数，抽象出 GGML_F32_VEC 和 GGML_F16_VEC 系列宏，使上层计算代码可以无差别地调用向量加载、存储、加法、乘法、FMA
  和归约操作。该文件是 ggml 库中 CPU 后端 SIMD 指令映射头文件，通过条件编译为不同架构（WASM、SSE3、LASX、LSX、s390x、RISC-V）提供统一的向量运算宏接口，涵盖
  F32、F16 及部分 BF16 数据类型的加载、存储、乘加（FMA）、加法、乘法和归约操作，以简化跨平台 SIMD 代码的编写。
