  name: getFileTypeCategoryByExtension
- code:
  - 'export function getFileTypeByExtension(filename: string): string | null {'
  - "\tconst extension = filename.toLowerCase().substring(filename.lastIndexOf('.'));"
  - ''
  - "\tfor (const [key, type] of Object.entries(IMAGE_FILE_TYPES)) {"
  - "\t\tif ((type.extensions as readonly string[]).includes(extension)) {"
  - "\t\t\treturn `${FileTypeCategory.IMAGE}:${key}`;"
  - "\t\t}"
  - "\t}"
  - ''
  - "\tfor (const [key, type] of Object.entries(AUDIO_FILE_TYPES)) {"
  - "\t\tif ((type.extensions as readonly string[]).includes(extension)) {"
  - "\t\t\treturn `${FileTypeCategory.AUDIO}:${key}`;"
  - "\t\t}"
  - "\t}"
  - ''
  - "\tfor (const [key, type] of Object.entries(PDF_FILE_TYPES)) {"
  - "\t\tif ((type.extensions as readonly string[]).includes(extension)) {"
  - "\t\t\treturn `${FileTypeCategory.PDF}:${key}`;"
  - "\t\t}"
  - "\t}"
  - ''
  - "\tfor (const [key, type] of Object.entries(TEXT_FILE_TYPES)) {"
  - "\t\tif ((type.extensions as readonly string[]).includes(extension)) {"
  - "\t\t\treturn `${FileTypeCategory.TEXT}:${key}`;"
  - "\t\t}"
  - "\t}"
  - ''
  - "\treturn null;"
  - '}'
  desc: 依据文件扩展名，在给定的文件类型配置映射中查找，返回拼接了逻辑类别前缀与类型键的完整文件类型标识字符串（格式如 'image:png'）。
  line: 155-185
  name: getFileTypeByExtension
- code:
  - 'export function isFileTypeSupported(filename: string, mimeType?: string): boolean
    {'
  - "\t// Images are detected and handled separately for vision models"
  - "\tif (mimeType) {"
  - "\t\tconst category = getFileTypeCategory(mimeType);"
  - "\t\tif ("
  - "\t\t\tcategory === FileTypeCategory.IMAGE ||"
  - "\t\t\tcategory === FileTypeCategory.AUDIO ||"
  - "\t\t\tcategory === FileTypeCategory.PDF"
  - "\t\t) {"
  - "\t\t\treturn true;"
  - "\t\t}"
  - "\t}"
  - ''
  - "\t// Check extension for known types (especially images without MIME)"
  - "\tconst extCategory = getFileTypeCategoryByExtension(filename);"
  - "\tif ("
  - "\t\textCategory === FileTypeCategory.IMAGE ||"
  - "\t\textCategory === FileTypeCategory.AUDIO ||"
  - "\t\textCategory === FileTypeCategory.PDF"
  - "\t) {"
  - "\t\treturn true;"
  - "\t}"
  - ''
  - "\t// Fallback: treat everything else as text (inclusive by default)"
  - "\treturn true;"
  - '}'
  desc: 结合可选的 MIME 类型和文件扩展名进行分析，判断文件是否属于当前应用支持的类型；默认采取包含策略，对未识别类型视为文本并予以支持。
  line: 187-212
  name: isFileTypeSupported
