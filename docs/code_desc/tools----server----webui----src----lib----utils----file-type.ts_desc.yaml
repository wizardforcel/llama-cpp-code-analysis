desc: 该文件是一个 TypeScript 工具库，核心功能是根据文件的 MIME 类型或扩展名对文件进行智能分类，并判断文件类型是否为当前应用所支持。它将预定义的
  MIME 类型和文件后缀映射到图像、音频、PDF 及文本等逻辑类别中，从而为文件处理流程提供类型识别与判断能力。
file: tools/server/webui/src/lib/utils/file-type.ts
funcs:
- code:
  - 'export function getFileTypeCategory(mimeType: string): FileTypeCategory | null
    {'
  - "\tswitch (mimeType) {"
  - "\t\t// Images"
  - "\t\tcase MimeTypeImage.JPEG:"
  - "\t\tcase MimeTypeImage.PNG:"
  - "\t\tcase MimeTypeImage.GIF:"
  - "\t\tcase MimeTypeImage.WEBP:"
  - "\t\tcase MimeTypeImage.SVG:"
  - "\t\t\treturn FileTypeCategory.IMAGE;"
  - ''
  - "\t\t// Audio"
  - "\t\tcase MimeTypeAudio.MP3_MPEG:"
  - "\t\tcase MimeTypeAudio.MP3:"
  - "\t\tcase MimeTypeAudio.MP4:"
  - "\t\tcase MimeTypeAudio.WAV:"
  - "\t\tcase MimeTypeAudio.WEBM:"
