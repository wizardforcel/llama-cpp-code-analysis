desc: 此文件是GGUF（GPT-Generated Unified Format）格式的常量定义模块，用于定义GGUF文件格式的常量、元数据键、模型架构类型、张量名称等关键信息，是GGUF模型序列化和反序列化的基础配置。该文件是
  GGUF (GPT-Generated Unified Format) 格式的常量定义模块，它定义了模型架构、张量类型、视觉投影器类型等枚举，以及相应的命名映射字典和架构-张量关联表。这些常量用于统一规范不同
  AI 模型的张量名称和结构，是 GGUF 格式序列化和反序列化过程中的核心参考数据。该文件是 llama.cpp GGUF 格式中模型架构与张量类型映射关系的核心常量定义文件。它定义了
  MODEL_ARCH 枚举（标识不同模型架构）与 MODEL_TENSOR 枚举（标识张量类型）之间的一对多映射关系，通过一个名为 MODEL_TENSORS
  的字典，将每个模型架构映射到其对应的张量列表。此映射关系是 GGUF 文件读写、模型转换和权重加载的核心依据，确保模型架构与张量名称之间的正确对应。The file
  gguf-py/gguf/constants.py defines the core constants and data structures for the
  GGUF (GPT-Generated Unified Format) model serialization format. This specific section
  primarily contains the TensorName mapping, which establishes the relationship between
  different model architectures (MODEL_ARCH) and the tensor components they use, such
  as attention layers, feed-forward networks, and state-space model modules. It serves
  as a critical reference for the conversion and serialization of various neural network
  architectures into the GGUF format, ensuring consistent tensor naming across different
  model types.该文件是GGUF格式的核心常量定义模块，为GGUF（GPT-Generated Unified Format）模型文件格式提供全面的常量定义和映射关系。文件通过Python枚举类和字典定义了模型架构标识符、张量名称、量化类型、文件类型、键名常量等关键信息，并建立了模型架构与所需张量之间的映射关系，以及不同量化方法的数据布局规格。这些常量为GGUF格式的读写实现提供了统一的标准和基础架构支持。
