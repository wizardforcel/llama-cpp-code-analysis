    - int GgmlOvDecoder::compute_op_case(const ggml_tensor * node) const {
    - '    int op_case = 0;'
    - '    switch (node->op) {'
    - '    case GGML_OP_RESHAPE: {'
    - '        auto * src = node->src[0];'
    - '        if (src->op == GGML_OP_RESHAPE && src->src[0]->ne[0] == node->ne[0]
      && src->src[0]->ne[1] == node->ne[1]) {'
    - '            op_case = 4;'
    - '        } else if (node->ne[0] * node->ne[1] == src->ne[0]) {'
    - '            op_case = 1;'
    - '        } else if (src->ne[0] * src->ne[1] == node->ne[0]) {'
    - '            op_case = 2;'
    - '            if (src->ne[2] * src->ne[3] == node->ne[1]) {'
    - '                op_case = 5;'
    - '            }'
    - '        } else if (src->ne[0] * src->ne[1] == node->ne[1]) {'
    - '            op_case = 3;'
    - '        } else if (src->ne[1] * src->ne[2] == node->ne[1]) {'
    - '            op_case = 6;'
    - '        }'
    - '        break;'
    - '    }'
    - '    case GGML_OP_CONT: {'
    - '        if (node->src[0]->op == GGML_OP_PERMUTE) {'
    - '            op_case = 1;'
    - '        } else if (node->src[0]->op == GGML_OP_TRANSPOSE) {'
    - '            op_case = 2;'
    - '        } else if (node->src[0]->op == GGML_OP_VIEW) {'
    - '            op_case = 3;'
    - '        }'
    - '        break;'
    - '    }'
    - '    case GGML_OP_PERMUTE: {'
    - '        if (node->src[0]->op != GGML_OP_VIEW) {'
    - '            op_case = 1;'
    - '        } else if (node->src[0]->src[0]->op == GGML_OP_NONE) {'
    - '            // kv cache tensor'
    - '            std::string src_name(node->view_src->name);'
    - '            int layer = extract_layer_from_name(src_name);'
    - '            if (!is_swa_layer(layer)) {'
    - '                op_case = 2;'
    - '            } else {'
    - '                op_case = 3;'
    - '            }'
    - '        } else {'
    - '            // rope''ed query tensor'
    - '            op_case = 4;'
    - '        }'
    - '        break;'
    - '    }'
    - '    case GGML_OP_MUL_MAT: {'
    - '        if (node->src[0]->op == GGML_OP_CONT && node->src[0]->src[0]->op ==
      GGML_OP_TRANSPOSE) {'
    - '            op_case = 2;'
    - '        } else if (node->src[0]->op == GGML_OP_VIEW && node->src[1]->op ==
      GGML_OP_VIEW) {'
    - '            op_case = 3;'
    - '        }'
    - '        break;'
    - '    }'
    - '    case GGML_OP_GET_ROWS: {'
    - '        if (node->src[1]->op == GGML_OP_VIEW) {'
    - '            op_case = 2;'
    - '        }'
    - '        break;'
    - '    }'
    - '    case GGML_OP_ROPE: {'
    - '        if (node->src[0]->op == GGML_OP_VIEW) {'
    - '            op_case = 2;'
    - '        }'
    - '        break;'
    - '    }'
    - '    case GGML_OP_VIEW: {'
    - '        if (node->src[0]->op == GGML_OP_VIEW) {'
    - '            auto * src = node->src[0];'
    - '            if (ggml_nelements(node) != ggml_nelements(src)) {'
    - '                throw std::runtime_error("Unsupported VIEW case");'
    - '            }'
    - '            op_case = 2;'
    - '        }'
    - '        {'
    - '            auto * src = node->src[0];'
    - '            if ((ggml_nelements(node) != ggml_nelements(src)) && m_naive) {'
    - '                // Compare each dimension of node and src, if only one dimension
      differs then op_case=3'
    - '                int diff_count = 0;'
    - '                for (int i = 0; i < GGML_MAX_DIMS; i++) {'
    - '                    if (node->ne[i] != src->ne[i]) {'
    - '                        diff_count++;'
    - '                    }'
    - '                }'
    - '                if (diff_count == 1) {'
    - '                    op_case = 3;'
    - '                }'
    - '            }'
    - '        }'
    - '        break;'
    - '    }'
    - '    default:'
    - '        break;'
    - '    }'
    - '    return op_case;'
    - '}'
