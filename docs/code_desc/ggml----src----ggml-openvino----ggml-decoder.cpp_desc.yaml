  name: GgmlOvDecoder
desc: This file defines the GgmlOvDecoder class, which serves as the core bridge between
  the GGML compute graph and the OpenVINO inference engine. It is responsible for
  translating a ggml compute graph into an OpenVINO-compatible representation, managing
  the graph's input/output tensors, handling KV cache statefulness, and converting
  model weights into OpenVINO constant nodes. The class provides methods for graph
  validation, input/output computation, shape and type retrieval, and graph debugging,
  enabling the execution of large language models on OpenVINO-supported hardware.该文件是
  ggml-openvino 后端中 GgmlOvDecoder 类的实现部分，GgmlOvDecoder 是一个解码器类，用于将 ggml 计算图中的节点转换为
  OpenVINO IR 所需的中间表示。它通过维护节点信息列表（m_node_info_list）来提供对节点名称、输入输出名称、操作参数和操作类型的访问，并支持子图遍历和
  GGML 操作符到字符串名称的映射，是 ggml 模型到 OpenVINO 转换过程中的关键解码组件。
