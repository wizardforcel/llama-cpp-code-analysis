  - '            );'
  - '            currentParentId = assistantMsg.id;'
  - ''
  - '            // Create tool result messages for this turn'
  - '            for (let i = 0; i < turn.toolCalls.length; i++) {'
  - '                const tc = turn.toolCalls[i];'
  - '                const toolCallId = turnToolCalls[i]?.id || `legacy_tool_${toolCallIdCounter
    + i}`;'
  - ''
  - '                const toolMsg = await DatabaseService.createMessageBranch('
  - '                    {'
  - '                        convId,'
  - '                        type: MessageType.TEXT,'
  - '                        role: MessageRole.TOOL,'
  - '                        content: tc.result,'
  - '                        toolCallId,'
  - '                        timestamp: message.timestamp + turnIdx * 100 + i + 1,'
  - '                        toolCalls: '''','
  - '                        children: []'
  - '                    },'
  - '                    currentParentId'
  - '                );'
  - '                currentParentId = toolMsg.id;'
  - '            }'
  - '        }'
  - ''
  - '        // Re-parent any children of the original message to the last created
    message'
  - '        // (the original message''s children list was the next user message or
