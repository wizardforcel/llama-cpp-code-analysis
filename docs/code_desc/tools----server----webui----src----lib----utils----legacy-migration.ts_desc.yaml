  - '            content: firstTurn.textBefore,'
  - '            reasoningContent: reasoning || undefined,'
  - '            toolCalls: firstTurnToolCalls.length > 0 ? JSON.stringify(firstTurnToolCalls)
    : '''''
  - '        });'
