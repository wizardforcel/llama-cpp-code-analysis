  - '            );'
  - '            currentParentId = toolMsg.id;'
  - '        }'
  - ''
  - '        // Create messages for subsequent turns'
  - '        for (let turnIdx = 1; turnIdx < turns.length; turnIdx++) {'
  - '            const turn = turns[turnIdx];'
  - ''
