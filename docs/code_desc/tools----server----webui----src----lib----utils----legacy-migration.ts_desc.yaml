  - '                    type: MessageType.TEXT,'
  - '                    role: MessageRole.TOOL,'
  - '                    content: tc.result,'
  - '                    toolCallId,'
  - '                    timestamp: message.timestamp + i + 1,'
  - '                    toolCalls: '''','
  - '                    children: []'
  - '                },'
