desc: 该文件是 ggml 计算库中一元操作（unary operations）的前向计算函数的头文件，声明了所有支持的一元数学运算（如绝对值、正负号、激活函数、指数对数等）从输入张量计算输出张量的接口函数，供
  CPU 后端使用，并通过 extern "C" 支持 C 和 C++ 调用。
