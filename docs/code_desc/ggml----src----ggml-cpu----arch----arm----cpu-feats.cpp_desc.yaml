classes:
- desc: 用于封装AArch64架构支持的硬件特性标志，构造函数中通过平台相关的系统调用检测并初始化各特性字段，包含dotprod（向量点积）、fp16_va（半精度浮点向量算术）、sve（可扩展向量扩展）、sve2（SVE第二代）、i8mm（int8矩阵乘法）和sme（可扩展矩阵扩展）等特性。
  methods:
  - code:
    - aarch64_features() {
    - '#if defined(__linux__)'
    - '    uint32_t hwcap = getauxval(AT_HWCAP);'
    - '    uint32_t hwcap2 = getauxval(AT_HWCAP2);'
    - ''
    - '    has_dotprod = !!(hwcap & HWCAP_ASIMDDP);'
    - '    has_fp16_va = !!(hwcap & HWCAP_FPHP);'
    - '    has_sve     = !!(hwcap & HWCAP_SVE);'
    - '    has_sve2    = !!(hwcap2 & HWCAP2_SVE2);'
    - '    has_i8mm    = !!(hwcap2 & HWCAP2_I8MM);'
    - '    has_sme     = !!(hwcap2 & HWCAP2_SME);'
    - '#elif defined(__APPLE__)'
    - '    int oldp = 0;'
    - '    size_t size = sizeof(oldp);'
    - ''
    - '    if (sysctlbyname("hw.optional.arm.FEAT_DotProd", &oldp, &size, NULL, 0)
      == 0) {'
    - '        has_dotprod = static_cast<bool>(oldp);'
    - '    }'
    - ''
    - '    if (sysctlbyname("hw.optional.arm.FEAT_I8MM", &oldp, &size, NULL, 0) ==
      0) {'
    - '        has_i8mm = static_cast<bool>(oldp);'
    - '    }'
    - ''
    - '    if (sysctlbyname("hw.optional.arm.FEAT_SME", &oldp, &size, NULL, 0) ==
      0) {'
    - '        has_sme = static_cast<bool>(oldp);'
    - '    }'
    - ''
    - '    // Apple apparently does not implement SVE yet'
    - '#endif'
    - '}'
    desc: 构造函数，根据编译平台（Linux或Apple）通过getauxval或sysctlbyname查询硬件能力寄存器或系统属性，初始化对象中各特性标志位；Apple平台下未实现SVE检测。
    line: 26-60
    name: aarch64_features
  name: aarch64_features
desc: 该文件是GGML库中针对ARM AArch64架构的CPU特性检测模块，负责在运行时通过系统调用（Linux的getauxval或Apple的sysctlbyname）检测CPU对AMX、FP16、SVE、SVE2、I8MM、SME等指令集扩展的支持情况，并根据编译时启用的特性（如GGML_USE_DOTPROD等）计算架构评分，最终通过GGML_BACKEND_DL_SCORE_IMPL宏导出评分函数，用于动态加载时选择最优的CPU后端实现。
file: ggml/src/ggml-cpu/arch/arm/cpu-feats.cpp
funcs:
- code:
  - static int ggml_backend_cpu_aarch64_score() {
  - '    int score = 1;'
  - '    aarch64_features af;'
  - ''
  - '#ifdef GGML_USE_DOTPROD'
  - '    if (!af.has_dotprod) { return 0; }'
  - '    score += 1<<1;'
  - '#endif'
  - '#ifdef GGML_USE_FP16_VECTOR_ARITHMETIC'
  - '    if (!af.has_fp16_va) { return 0; }'
  - '    score += 1<<2;'
  - '#endif'
  - '#ifdef GGML_USE_SVE'
  - '    if (!af.has_sve) { return 0; }'
  - '    score += 1<<3;'
  - '#endif'
  - '#ifdef GGML_USE_MATMUL_INT8'
  - '    if (!af.has_i8mm) { return 0; }'
  - '    score += 1<<4;'
  - '#endif'
  - '#ifdef GGML_USE_SVE2'
  - '    if (!af.has_sve2) { return 0; }'
  - '    score += 1<<5;'
  - '#endif'
  - '#ifdef GGML_USE_SME'
  - '    if (!af.has_sme) { return 0; }'
  - '    score += 1<<6;'
  - '#endif'
  - ''
  - '    return score;'
  - '}'
  desc: 全局函数，根据编译时启用的特性宏检查对应的硬件特性是否支持，若缺失则返回0（表示不适用），否则累加不同的位移分值，最终返回一个代表特性和启用的整数评分。
  line: 62-84
