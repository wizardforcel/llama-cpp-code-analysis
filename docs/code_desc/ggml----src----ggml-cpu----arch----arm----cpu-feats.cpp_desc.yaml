- code:
  - GGML_BACKEND_DL_SCORE_IMPL(ggml_backend_cpu_aarch64_score)
  desc: 这是一个宏调用（非直接定义的函数），用于将上述静态评分函数导出为动态加载接口的可引用符号，其本质是代码生成宏，实际在编译期展开为特定命名和链接属性的函数定义。
  line: 86-86
