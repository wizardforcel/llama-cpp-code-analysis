desc: 该头文件定义了用于解析、生成、加载和合并 INI 预设的核心数据结构。common_preset 表示单个预设及其命令行选项，支持在命令行参数、INI
  格式和运行时参数之间转换；common_preset_context 则负责根据示例配置、INI 文件、缓存模型、本地模型目录或命令行参数创建预设，并提供多个预设之间的级联合并能力。
