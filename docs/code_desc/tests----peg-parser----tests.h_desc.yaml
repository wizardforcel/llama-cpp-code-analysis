desc: 该文件是测试头文件（tests.h），用于为 PEG 解析器测试套件提供通用的头文件包含和公共结构定义。它包含了所有测试文件所需的第三方库（如 nlohmann/json）和项目内部头文件（如
  testing.h、peg-parser.h 等），定义了一个公共的 bench_tool_call 结构体，用于表示基准测试中的工具调用数据，并声明了六个测试函数的原型，这些函数分别对应不同的测试场景（基础解析、JSON
  解析、GBNF 生成、Unicode 处理、JSON 序列化和 Python 字典解析）。
