  - '            __func__, cur_len,'
  - '            match_pos, pattern.size(), copy_max);'
  - ''
  - '    draft_tokens.reserve(copy_max);'
  - '    for (size_t j = 0; j < copy_max; ++j) {'
  - '        draft_tokens.push_back(tokens[match_pos + n_draft_min + j]);'
  - '    }'
  - '    return draft_tokens;'
  - '}'
