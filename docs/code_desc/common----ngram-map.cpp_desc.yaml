  - '        }'
  - '        if (match) {'
  - '            match_pos = j;'
  - '            break;'
  - '        }'
  - '    }'
  - '    if (match_pos == 0) {'
  - '        return draft_tokens;'
  - '    }'
  - ''
  - '    const size_t copy_max = std::min('
  - '            n_draft_max,'
  - '            cur_len - (match_pos + n_draft_min)'
  - '            );'
  - '    if (copy_max < n_draft_min) {'
  - '        return draft_tokens;'
  - '    }'
  - '    LOG_DBG("%s: #tokens = %zu: found matching pattern at pos %zu, length %zu,
