classes: []
desc: 该文件是 ggml 项目中 Metal 后端操作层（ops layer）的核心头文件，定义了 Metal 操作上下文（op context）的生命周期管理接口以及全部可用的图节点编码函数。这些函数将
  ggml 计算图中的各种算子（如矩阵乘法、卷积、归一化、注意力等）映射并编码到 Metal 命令缓冲区中，实现了 GPU 端的高效执行。
