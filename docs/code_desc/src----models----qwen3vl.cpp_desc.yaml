classes:
- desc: 专门用于qwen3vl模型的计算图构建类，继承自llm_graph_context，负责根据模型配置组装神经网络的计算流程，涵盖自注意力、前馈网络、深度堆叠等核心计算单元。
  methods:
  - code:
    - 'llm_build_qwen3vl::llm_build_qwen3vl(const llama_model & model, const llm_graph_params
      & params) : llm_graph_context(params) {'
    - '    const size_t n_deepstack_layers = hparams.n_deepstack_layers;'
    - '    const int64_t n_embd      = hparams.n_embd;'
    - '    const int64_t n_embd_head = hparams.n_embd_head_v();'
    - '    GGML_ASSERT(n_embd_head == hparams.n_embd_head_k());'
    - '    GGML_ASSERT(n_embd_head == n_rot);'
    - '    ggml_tensor * cur;'
    - '    ggml_tensor * inpL;'
    - '    inpL = build_inp_embd(model.tok_embd);'
    - '    int sections[4];'
    - '    std::copy(std::begin(hparams.rope_sections), std::begin(hparams.rope_sections)
      + 4, sections);'
    - '    ggml_tensor * inp_pos = build_inp_pos();'
    - '    auto * inp_attn = build_attn_inp_kv();'
    - '    ggml_tensor * inp_out_ids = build_inp_out_ids();'
    - '    for (int il = 0; il < n_layer; ++il) {'
    - '        ggml_tensor * inpSA = inpL;'
    - '        cur = build_norm(inpL, model.layers[il].attn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        cb(cur, "attn_norm", il);'
    - '        {'
    - '            ggml_tensor * Qcur = build_lora_mm(model.layers[il].wq, cur);'
    - '            cb(Qcur, "Qcur", il);'
    - '            ggml_tensor * Kcur = build_lora_mm(model.layers[il].wk, cur);'
    - '            cb(Kcur, "Kcur", il);'
    - '            ggml_tensor * Vcur = build_lora_mm(model.layers[il].wv, cur);'
    - '            cb(Vcur, "Vcur", il);'
    - '            Qcur = ggml_reshape_3d(ctx0, Qcur, n_embd_head, n_head,    n_tokens);'
    - '            Kcur = ggml_reshape_3d(ctx0, Kcur, n_embd_head, n_head_kv, n_tokens);'
    - '            Vcur = ggml_reshape_3d(ctx0, Vcur, n_embd_head, n_head_kv, n_tokens);'
    - '            Qcur = build_norm(Qcur, model.layers[il].attn_q_norm, NULL, LLM_NORM_RMS,
      il);'
    - '            cb(Qcur, "Qcur_normed", il);'
    - '            Qcur = ggml_rope_multi(ctx0, Qcur, inp_pos, nullptr, n_rot, sections,
      rope_type, n_ctx_orig, freq_base, freq_scale, ext_factor, attn_factor, beta_fast,
      beta_slow);'
    - '            Kcur = build_norm(Kcur, model.layers[il].attn_k_norm, NULL, LLM_NORM_RMS,
      il);'
    - '            cb(Kcur, "Kcur_normed", il);'
    - '            Kcur = ggml_rope_multi(ctx0, Kcur, inp_pos, nullptr, n_rot, sections,
      rope_type, n_ctx_orig, freq_base, freq_scale, ext_factor, attn_factor, beta_fast,
      beta_slow);'
    - '            cb(Qcur, "Qcur", il);'
    - '            cb(Kcur, "Kcur", il);'
    - '            cb(Vcur, "Vcur", il);'
    - '            cur = build_attn(inp_attn, model.layers[il].wo, model.layers[il].bo,
      Qcur, Kcur, Vcur, nullptr, nullptr, nullptr, 1.0f/sqrtf(float(n_embd_head)),
      il);'
    - '        }'
    - '        if (il == n_layer - 1 && inp_out_ids) {'
    - '            cur   = ggml_get_rows(ctx0,   cur, inp_out_ids);'
    - '            inpSA = ggml_get_rows(ctx0, inpSA, inp_out_ids);'
    - '        }'
    - '        ggml_tensor * ffn_inp = ggml_add(ctx0, cur, inpSA);'
    - '        cb(ffn_inp, "ffn_inp", il);'
    - '        cur = build_norm(ffn_inp, model.layers[il].ffn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        cb(cur, "ffn_norm", il);'
    - '        cur = build_ffn(cur, model.layers[il].ffn_up,   NULL, NULL, model.layers[il].ffn_gate,
      NULL, NULL, model.layers[il].ffn_down, NULL, NULL, NULL, LLM_FFN_SILU, LLM_FFN_PAR,
      il);'
    - '        cb(cur, "ffn_out", il);'
    - '        cur = ggml_add(ctx0, cur, ffn_inp);'
    - '        cur = build_cvec(cur, il);'
    - '        cb(cur, "l_out", il);'
    - '        if (il < (int) n_deepstack_layers) {'
    - '            ggml_tensor * ds = ggml_view_2d(ctx0, res->t_inp_embd, n_embd,
      n_tokens, res->t_inp_embd->nb[1], (il + 1) * n_embd * sizeof(float));'
    - '            cur = ggml_add(ctx0, cur, ds);'
    - '            cb(cur, "deepstack_out", il);'
    - '        }'
    - '        inpL = cur;'
    - '    }'
    - '    cur = inpL;'
    - '    cur = build_norm(cur, model.output_norm, NULL, LLM_NORM_RMS, -1);'
    - '    cb(cur, "result_norm", -1);'
    - '    res->t_embd = cur;'
    - '    cur = build_lora_mm(model.output, cur);'
    - '    cb(cur, "result_output", -1);'
    - '    res->t_logits = cur;'
    - '    ggml_build_forward_expand(gf, cur);'
    - '}'
    desc: 构造函数，初始化模型计算图中的各个组件。它读取模型的超参数，构建输入嵌入和位置信息，迭代组装每一层的自注意力机制和FFN，处理深度堆叠特性，最后生成输出。
