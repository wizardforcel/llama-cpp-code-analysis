desc: 该文件是llama.cpp项目中qwen3vl视觉语言模型的构建模块，定义了llm_build_qwen3vl类的构造函数。该构造函数根据模型的超参数（如嵌入维度、注意力头数、深度堆叠层数等）构建模型的完整计算图，包括输入嵌入、位置编码、自注意力机制、前馈网络、层归一化以及输出层，同时处理深度堆叠（deepstack）特性并对各层输出进行回调跟踪。
