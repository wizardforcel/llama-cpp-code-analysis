  name: findDescendantMessages
- code:
  - export function getMessageSiblings(
  - "\tmessages: readonly DatabaseMessage[],"
  - "\tmessageId: string"
  - '): ChatMessageSiblingInfo | null {'
  - "\tconst nodeMap = new Map<string, DatabaseMessage>();"
  - ''
  - "\t// Build node map for quick lookups"
  - "\tfor (const msg of messages) {"
  - "\t\tnodeMap.set(msg.id, msg);"
  - "\t}"
  - ''
  - "\tconst message = nodeMap.get(messageId);"
  - "\tif (!message) {"
  - "\t\treturn null;"
  - "\t}"
  - ''
  - "\t// Handle null parent (root message) case"
  - "\tif (message.parent === null) {"
  - "\t\t// No parent means this is likely a root node with no siblings"
  - "\t\treturn {"
  - "\t\t\tmessage,"
  - "\t\t\tsiblingIds: [messageId],"
  - "\t\t\tcurrentIndex: 0,"
  - "\t\t\ttotalSiblings: 1"
  - "\t\t};"
  - "\t}"
  - ''
  - "\tconst parentNode = nodeMap.get(message.parent);"
  - "\tif (!parentNode) {"
  - "\t\t// Parent not found - treat as single message"
  - "\t\treturn {"
  - "\t\t\tmessage,"
  - "\t\t\tsiblingIds: [messageId],"
  - "\t\t\tcurrentIndex: 0,"
  - "\t\t\ttotalSiblings: 1"
  - "\t\t};"
  - "\t}"
  - ''
  - "\t// Get all sibling IDs (including self)"
  - "\tconst siblingIds = parentNode.children;"
  - ''
  - "\t// Convert sibling message IDs to their corresponding leaf node IDs"
  - "\t// This allows navigation between different conversation branches"
  - "\tconst siblingLeafIds = siblingIds.map((siblingId: string) => findLeafNode(messages,\
    \ siblingId));"
  - ''
  - "\t// Find current message's position among siblings"
  - "\tconst currentIndex = siblingIds.indexOf(messageId);"
  - ''
  - "\treturn {"
  - "\t\tmessage,"
  - "\t\tsiblingIds: siblingLeafIds,"
  - "\t\tcurrentIndex,"
  - "\t\ttotalSiblings: siblingIds.length"
  - "\t};"
  - '}'
