desc: 该文件实现了消息分支工具函数集，用于处理对话树结构中的消息。它支持在对话分支中导航、查找消息关系（如父子关系、兄弟节点）、获取对话路径等功能，主要用于聊天应用中的消息分支管理，允许用户编辑消息并创建替代路径，同时保留原始对话流程。
