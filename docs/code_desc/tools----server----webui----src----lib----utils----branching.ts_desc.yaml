- code:
  - export function filterByLeafNodeId(
  - "\tmessages: readonly DatabaseMessage[],"
  - "\tleafNodeId: string,"
  - "\tincludeRoot: boolean = false"
  - '): readonly DatabaseMessage[] {'
  - "\tconst result: DatabaseMessage[] = [];"
  - "\tconst nodeMap = new Map<string, DatabaseMessage>();"
  - ''
  - "\t// Build node map for quick lookups"
  - "\tfor (const msg of messages) {"
  - "\t\tnodeMap.set(msg.id, msg);"
  - "\t}"
  - ''
  - "\t// Find the starting node (leaf node or latest if not found)"
  - "\tlet startNode: DatabaseMessage | undefined = nodeMap.get(leafNodeId);"
  - "\tif (!startNode) {"
  - "\t\t// If leaf node not found, use the message with latest timestamp"
  - "\t\tlet latestTime = -1;"
  - "\t\tfor (const msg of messages) {"
  - "\t\t\tif (msg.timestamp > latestTime) {"
  - "\t\t\t\tstartNode = msg;"
  - "\t\t\t\tlatestTime = msg.timestamp;"
  - "\t\t\t}"
  - "\t\t}"
  - "\t}"
  - ''
  - "\t// Traverse from leaf to root, collecting messages"
  - "\tlet currentNode: DatabaseMessage | undefined = startNode;"
  - "\twhile (currentNode) {"
  - "\t\t// Include message if it's not root, or if we want to include root"
  - "\t\tif (currentNode.type !== 'root' || includeRoot) {"
  - "\t\t\tresult.push(currentNode);"
  - "\t\t}"
  - ''
  - "\t\t// Stop traversal if parent is null (reached root)"
  - "\t\tif (currentNode.parent === null) {"
  - "\t\t\tbreak;"
  - "\t\t}"
  - "\t\tcurrentNode = nodeMap.get(currentNode.parent);"
  - "\t}"
  - ''
  - "\t// Sort: system messages first, then by timestamp"
  - "\tresult.sort((a, b) => {"
  - "\t\tif (a.role === MessageRole.SYSTEM && b.role !== MessageRole.SYSTEM) return\
    \ -1;"
  - "\t\tif (a.role !== MessageRole.SYSTEM && b.role === MessageRole.SYSTEM) return\
    \ 1;"
  - ''
  - "\t\treturn a.timestamp - b.timestamp;"
  - "\t});"
  - "\treturn result;"
  - '}'
  desc: 过滤消息以获取从根节点到特定叶子节点的对话路径，如果叶子节点不存在，则返回具有最新时间戳的路径
  line: 40-86
