- code:
  - 'export function findLeafNode(messages: readonly DatabaseMessage[], messageId:
    string): string {'
  - "\tconst nodeMap = new Map<string, DatabaseMessage>();"
  - ''
  - "\t// Build node map for quick lookups"
  - "\tfor (const msg of messages) {"
  - "\t\tnodeMap.set(msg.id, msg);"
  - "\t}"
  - ''
  - "\tlet currentNode: DatabaseMessage | undefined = nodeMap.get(messageId);"
  - "\twhile (currentNode && currentNode.children.length > 0) {"
  - "\t\t// Follow the last child (most recent branch)"
  - "\t\tconst lastChildId = currentNode.children[currentNode.children.length - 1];"
  - "\t\tcurrentNode = nodeMap.get(lastChildId);"
  - "\t}"
  - ''
  - "\treturn currentNode?.id ?? messageId;"
  - '}'
  desc: 查找给定消息分支的叶子节点（没有子节点的消息），沿着最后一个子节点一直向下遍历直到达到叶子节点
  line: 96-112
  name: findLeafNode
- code:
  - export function findDescendantMessages(
  - "\tmessages: readonly DatabaseMessage[],"
  - "\tmessageId: string"
  - '): string[] {'
  - "\tconst nodeMap = new Map<string, DatabaseMessage>();"
  - ''
  - "\t// Build node map for quick lookups"
  - "\tfor (const msg of messages) {"
  - "\t\tnodeMap.set(msg.id, msg);"
  - "\t}"
  - ''
  - "\tconst descendants: string[] = [];"
  - "\tconst queue: string[] = [messageId];"
  - ''
  - "\twhile (queue.length > 0) {"
  - "\t\tconst currentId = queue.shift()!;"
  - "\t\tconst currentNode = nodeMap.get(currentId);"
  - ''
  - "\t\tif (currentNode) {"
  - "\t\t\t// Add all children to the queue and descendants list"
  - "\t\t\tfor (const childId of currentNode.children) {"
  - "\t\t\t\tdescendants.push(childId);"
  - "\t\t\t\tqueue.push(childId);"
  - "\t\t\t}"
  - "\t\t}"
  - "\t}"
  - ''
  - "\treturn descendants;"
  - '}'
  desc: 查找给定消息的所有后代消息（子节点、孙节点等），用于级联删除以移除分支中的所有消息
