    - '                last_token_type == token::open_statement)'
    - '        ) {'
    - '            pos++;'
    - '            if (pos >= src.size()) break;'
    - '        }'
    - '        consume_while([](char c) { return std::isspace(static_cast<unsigned
      char>(c)); });'
    - '        if (pos >= src.size()) break;'
    - '        char ch = src[pos];'
    - '        bool is_closing_block = ch == ''-'' && next_pos_is( {''%'', ''}''}
      );'
