    - '        std::string str;'
    - '        while (predicate(src[pos])) {'
    - '            if (src[pos] == ''\\'') {'
    - '                ++pos;'
    - '                if (pos >= src.size()) {'
    - '                    throw lexer_exception("unexpected end of input after escape
      character", source, pos);'
    - '                }'
