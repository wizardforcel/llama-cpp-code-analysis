desc: 该文件实现了一个PEG（解析表达式语法）解析引擎，包括语法定义与匹配执行的功能。它定义了AST（抽象语法树）的内存管理、多种解析器原语（普通字符、序列、选择、重复等）、转义序列处理、Unicode字符支持，以及基于Trie的结构用于高效的多字符串匹配。该代码实现
  PEG 解析器抽象语法树与解析器竞技场的核心功能，包括解析器引用解析、解析器结构转储、解析器组合运算符、序列与选择扁平化、规则构建、JSON/Python 基础语法规则构造、字符串与标记解析，以及将
  PEG 规则转换为 GBNF 文法并收集可达规则。代码还包含若干用于字符类转义、排除模式生成和规则可达性分析的辅助函数。该代码实现了 PEG 解析器竞技场（arena）的
  JSON 序列化与反序列化功能，包括将各种解析器变体（如字面量、序列、选择、重复等）转换为 JSON 格式，以及从 JSON 数据恢复解析器结构，并提供了保存与加载整个解析器定义的方法。
