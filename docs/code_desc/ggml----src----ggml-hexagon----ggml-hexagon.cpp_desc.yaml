  - static void ggml_backend_hexagon_graph_optimize(ggml_backend_t backend, ggml_cgraph
    * gf) {
  - '    const int n = gf->n_nodes;'
  - '    constexpr int MAX_FUSE = 16;'
  - '    enum ggml_op ops[MAX_FUSE];'
  - '    std::vector<node_info> nodes;'
  - '    nodes.reserve(gf->n_nodes);'
  - '    for (int i = 0; i < n; i++) {'
  - '        node_info node = {'
  - '            /*.node =*/gf->nodes[i],'
  - '            /*.fused =*/{},'
  - '        };'
  - '        if (node.op() == GGML_OP_ADD || node.op() == GGML_OP_NORM || node.op()
    == GGML_OP_RMS_NORM) {'
  - '            ops[0] = node.op();'
  - '            int f = i + 1;'
  - '            while (f < n && f < i + MAX_FUSE) {'
  - '                if (gf->nodes[f]->op != GGML_OP_ADD && gf->nodes[f]->op != GGML_OP_MUL
    &&'
  - '                    gf->nodes[f]->op != GGML_OP_NORM && gf->nodes[f]->op != GGML_OP_RMS_NORM)
    {'
  - '                    break;'
  - '                }'
  - '                ops[f - i] = gf->nodes[f]->op;'
  - '                f++;'
  - '            }'
  - '            f -= i;'
  - '            for (; f > 1; f--) {'
  - '                if (ggml_can_fuse(gf, i, ops, f)) {'
  - '                    break;'
  - '                }'
  - '            }'
  - '            for (int k = 1; k < f; k++) {'
  - '                ++i;'
  - '                node.add_fused(gf->nodes[i]);'
  - '            }'
  - '        }'
  - '        nodes.push_back(std::move(node));'
  - '    }'
  - '    const auto order = ggml_hexagon_graph_optimize_reorder(nodes);'
  - '    {'
  - '        int j = 0;'
  - '        for (const auto i : order) {'
  - '            const auto & node = nodes[i];'
  - '            gf->nodes[j++] = node.node;'
  - '            for (auto * fused : node.fused) {'
  - '                gf->nodes[j++] = fused;'
  - '            }'
  - '        }'
  - '    }'
  - '}'
