classes: []
desc: 该文件实现了 ggml 中 RMSNorm 算子的 OpenVINO 转换，通过构建幂、均值、加法、开方、除法、乘法等 OpenVINO 算子组合来计算输入张量的
  RMS 归一化。
file: ggml/src/ggml-openvino/openvino/op/rms_norm.cpp
funcs:
- code:
  - OutputVector translate_rms_norm(const NodeContext & context) {
  - '    num_inputs_check(context, 1, 1);'
  - ''
  - '    auto input_node = context.get_input(0);'
  - '    auto square = std::make_shared<ov::op::v1::Power>('
  - '        input_node, ov::op::v0::Constant::create(ov::element::f32, ov::Shape{1},
    {2.0f}));'
  - ''
  - '    auto mean = std::make_shared<ov::op::v1::ReduceMean>('
  - '        square, ov::op::v0::Constant::create(ov::element::i64, ov::Shape{1},
    {-1}), true);'
  - ''
  - '    float eps;'
  - '    memcpy(&eps, context.get_output_op_params(), sizeof(float));'
  - ''
  - '    auto rms = std::make_shared<ov::op::v0::Sqrt>('
  - '        std::make_shared<ov::op::v1::Add>(mean, ov::op::v0::Constant::create(ov::element::f32,
    ov::Shape{1}, {eps})));'
  - ''
  - '    auto reciprocal ='
  - '        std::make_shared<ov::op::v1::Divide>(ov::op::v0::Constant::create(ov::element::f32,
    ov::Shape{1}, {1.0f}), rms);'
  - ''
  - '    auto res = std::make_shared<ov::op::v1::Multiply>(input_node, reciprocal);'
  - ''
  - '    return rename_outputs_with_suffix({res}, context.get_name());'
  - '}'
  desc: 将 ggml 的 RMSNorm 算子转换为 OpenVINO 算子图，计算输入张量在最后一维上的 RMS 归一化结果。
