classes: []
desc: 该文件定义了虚拟 GPU 后端的 APIR 命令分发表，通过枚举类型 ApirBackendCommandType 标识所有支持的后端操作命令（包括设备、缓冲区类型、缓冲区和后端操作），并提供
  apir_dispatch_command_name 函数将命令类型映射为可读的字符串名称，用于调试和日志记录。
file: ggml/src/ggml-virtgpu/backend/shared/apir_backend.gen.h
