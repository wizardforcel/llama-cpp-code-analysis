- code:
  - export const llamaModelInfo = async (config = {}) => {
  - '  if (!generation_settings) {'
  - '    const api_url = config.api_url?.replace(/\/+$/, '''') || "";'
  - '    const props = await fetch(`${api_url}/props`).then(r => r.json());'
