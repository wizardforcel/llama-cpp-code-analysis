- code:
  - template <float (*op)(float, float), typename src0_t, typename src1_t, typename
    dst_t>
  - static void apply_binary_op(const ggml_compute_params * params, ggml_tensor *
    dst) {
  - '    const ggml_tensor * src0 = dst->src[0];'
  - '    const ggml_tensor * src1 = dst->src[1];'
  - ''
  - '    GGML_ASSERT(ggml_can_repeat(src1, src0) && ggml_are_same_shape(src0, dst));'
  - ''
  - '    GGML_TENSOR_BINARY_OP_LOCALS'
  - ''
  - '    GGML_ASSERT( nb0 == sizeof(dst_t));'
  - '    GGML_ASSERT(nb00 == sizeof(src0_t));'
  - ''
  - '    const auto [ir0, ir1] = get_thread_range(params, src0);'
  - '    const bool is_src1_contiguous_rows = ggml_is_contiguous_rows(src1);'
  - ''
  - '#ifdef GGML_USE_ACCELERATE'
  - '    vDSP_fn_t vDSP_op = nullptr;'
  - '    if (src0->type == GGML_TYPE_F32 && src1->type == GGML_TYPE_F32 && dst->type
    == GGML_TYPE_F32) {'
  - '        if (op == op_add) {'
  - '            vDSP_op = vDSP_vadd;'
  - '        } else if (op == op_sub) {'
  - '            vDSP_op = vDSP_vsub;'
  - '        } else if (op == op_mul) {'
  - '            vDSP_op = vDSP_vmul;'
  - '        } else if (op == op_div) {'
  - '            vDSP_op = vDSP_vdiv;'
  - '        }'
  - '    }'
  - '#endif'
  - ''
  - '    for (int64_t ir = ir0; ir < ir1; ++ir) {'
  - '        const int64_t i03 = ir/(ne02*ne01);'
  - '        const int64_t i02 = (ir - i03*ne02*ne01)/ne01;'
  - '        const int64_t i01 = (ir - i03*ne02*ne01 - i02*ne01);'
  - ''
  - '        const int64_t i13 = i03 % ne13;'
  - '        const int64_t i12 = i02 % ne12;'
  - '        const int64_t i11 = i01 % ne11;'
  - ''
  - '        dst_t        * dst_ptr  = (dst_t  *)       ((char *)       dst->data  +
    i03*nb3  + i02*nb2  + i01*nb1 );'
  - '        const src0_t * src0_ptr = (const src0_t *) ((const char *) src0->data
    + i03*nb03 + i02*nb02 + i01*nb01);'
  - '        const src1_t * src1_ptr = (const src1_t *) ((const char *) src1->data
    + i13*nb13 + i12*nb12 + i11*nb11);'
  - ''
  - '        if (is_src1_contiguous_rows) {'
  - '            const int64_t nr0 = ne00 / ne10;'
  - ''
  - '            for (int64_t r = 0; r < nr0; ++r) {'
  - '#ifdef GGML_USE_ACCELERATE'
  - '                if constexpr (std::is_same_v<src0_t, float> && std::is_same_v<src1_t,
    float> && std::is_same_v<dst_t, float>) {'
  - '                    if (vDSP_op != nullptr) {'
  - '                        vDSP_op(src1_ptr, 1, src0_ptr + r*ne10, 1, dst_ptr +
    r*ne10, 1, ne10);'
  - '                        continue;'
  - '                    }'
  - '                }'
  - '#endif'
  - '                vec_binary_op_contiguous<op>(ne10, dst_ptr + r*ne10, src0_ptr
    + r*ne10, src1_ptr);'
  - '            }'
  - '        } else {'
  - '            vec_binary_op_non_contiguous<op>(ne0, ne10, nb10, dst_ptr, src0_ptr,
    src1_ptr);'
  - '        }'
  - '    }'
  - '}'
