desc: 该文件包含两个测试函数的实现：test_reasoning_budget 用于测试推理预算采样器的状态机和强制令牌行为，test_utf8_boundary_detection
  用于验证 UTF-8 编码完整性检测功能。通过构造模拟的词汇表和令牌序列，验证采样器在预算耗尽时的强制切换逻辑，以及在各种边界条件下的 UTF-8 字节序列完整性判断。主函数
  main 中运行了 5 个推理预算场景测试和 1 个 UTF-8 检测测试。
