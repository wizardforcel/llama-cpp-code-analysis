classes: []
desc: the file defines a global function to detect whether a keyboard event occurs
  during IME (Input Method Editor) composition, which helps prevent unintended form
  submission when confirming word selection in languages like Japanese or Chinese.
  It uses both the `isComposing` property and `keyCode` for Safari compatibility.
file: tools/server/webui/src/lib/utils/is-ime-composing.ts
funcs:
- code:
  - 'export function isIMEComposing(event: KeyboardEvent) {'
  - '    // Check for IME composition using isComposing property and keyCode 229 (specifically
    for IME composition on Safari, which is notorious for not supporting KeyboardEvent.isComposing)'
  - '    // This prevents form submission when confirming IME word selection (e.g.,
    Japanese/Chinese input)'
  - '    return event.isComposing || event.keyCode === 229;'
  - '}'
  desc: Checks if a KeyboardEvent is part of an IME composition by evaluating the
    `isComposing` property or the `keyCode` value of 229.
  line: 1-5
  name: isIMEComposing
