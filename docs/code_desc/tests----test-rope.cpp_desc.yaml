- code:
  - static struct ggml_tensor * get_random_tensor_f32(
  - '        struct ggml_context * ctx0,'
  - '        int ndims,'
  - '        const int64_t ne[],'
  - '        float fmin,'
  - '        float fmax) {'
  - '    struct ggml_tensor * result = ggml_new_tensor(ctx0, GGML_TYPE_F32, ndims,
    ne);'
  - ''
  - '    switch (ndims) {'
  - '        case 1:'
  - '            for (int i0 = 0; i0 < ne[0]; i0++) {'
  - '                ((float *)result->data)[i0] = frand()*(fmax - fmin) + fmin;'
  - '            }'
  - '            break;'
  - '        case 2:'
  - '            for (int i1 = 0; i1 < ne[1]; i1++) {'
  - '                for (int i0 = 0; i0 < ne[0]; i0++) {'
  - '                    ((float *)result->data)[i1*ne[0] + i0] = frand()*(fmax -
    fmin) + fmin;'
  - '                }'
  - '            }'
  - '            break;'
  - '        case 3:'
  - '            for (int i2 = 0; i2 < ne[2]; i2++) {'
  - '                for (int i1 = 0; i1 < ne[1]; i1++) {'
  - '                    for (int i0 = 0; i0 < ne[0]; i0++) {'
  - '                        ((float *)result->data)[i2*ne[1]*ne[0] + i1*ne[0] + i0]
    = frand()*(fmax - fmin) + fmin;'
  - '                    }'
  - '                }'
  - '            }'
  - '            break;'
  - '        case 4:'
  - '            for (int i3 = 0; i3 < ne[3]; i3++) {'
  - '                for (int i2 = 0; i2 < ne[2]; i2++) {'
  - '                    for (int i1 = 0; i1 < ne[1]; i1++) {'
  - '                        for (int i0 = 0; i0 < ne[0]; i0++) {'
  - '                            ((float *)result->data)[i3*ne[2]*ne[1]*ne[0] + i2*ne[1]*ne[0]
    + i1*ne[0] + i0] = frand()*(fmax - fmin) + fmin;'
  - '                        }'
  - '                    }'
  - '                }'
  - '            }'
  - '            break;'
  - '        default:'
  - '            assert(false);'
  - '    };'
  - ''
  - '    return result;'
  - '}'
  desc: 创建一个指定维度和范围（fmin 到 fmax）的随机 F32 类型张量。
