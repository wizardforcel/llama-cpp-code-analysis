  PydanticDataType，以及多个全局函数，用于处理类型映射、规则生成、文档生成等。该文件提供一组围绕 Pydantic 模型、JSON Schema
  和函数签名的工具，用于生成 GBNF 语法与模型文档、保存生成结果、清理文本，以及将字典或带类型注解的函数动态转换为 Pydantic 模型。代码还支持递归处理嵌套模型、数组、联合类型、枚举、必填字段和函数参数，并为动态模型附加
  run 方法。
