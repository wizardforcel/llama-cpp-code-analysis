  - '    (''float-3-1-2-1'', [''integer-part-max3-min1 ::= [0-9] [0-9] [0-9]?'', ''fractional-part-max2-min1
    ::= [0-9] [0-9]?'', ''float-3-1-2-1 ::= integer-part-max3-min1 "." fractional-part-max2-min]-min[0-9]?'')'
  - '    '
  - '    Note:'
  - '    GBNF stands for Generalized Backus-Naur Form, which is a notation technique
    to specify the syntax of programming languages or other formal grammars.'
  - '    """'
  - '    additional_rules = []'
  - '    '
  - '    # Define the integer part rule'
  - '    integer_part_rule = ('
  - '        "integer-part"'
  - '        + (f"-max{max_digit}" if max_digit is not None else "")'
  - '        + (f"-min{min_digit}" if min_digit is not None else "")'
  - '    )'
  - '    '
  - '    # Define the fractional part rule based on precision constraints'
  - '    fractional_part_rule = "fractional-part"'
  - '    fractional_rule_part = ""'
  - '    if max_precision is not None or min_precision is not None:'
  - '        fractional_part_rule += (f"-max{max_precision}" if max_precision is not
    None else "") + ('
  - '            f"-min{min_precision}" if min_precision is not None else ""'
  - '        )'
  - '        # Minimum number of digits'
  - '        fractional_rule_part = "[0-9]" * (min_precision if min_precision is not
    None else 1)'
  - '        # Optional additional digits'
  - '        fractional_rule_part += "".join('
  - '            [" [0-9]?"] * ((max_precision - ('
  - '                min_precision if min_precision is not None else 1)) if max_precision
    is not None else 0)'
  - '        )'
  - '        additional_rules.append(f"{fractional_part_rule} ::= {fractional_rule_part}")'
  - '    '
  - '    # Define the float rule'
  - '    float_rule = f"float-{max_digit if max_digit is not None else ''X''}-{min_digit
    if min_digit is not None else ''X''}-{max_precision if max_precision is not None
    else ''X''}-{min_precision if min_precision is not None else ''X''}"'
  - '    additional_rules.append(f''{float_rule} ::= {integer_part_rule} "." {fractional_part_rule}'')'
  - '    '
  - '    # Generating the integer part rule definition, if necessary'
  - '    if max_digit is not None or min_digit is not None:'
  - '        integer_rule_part = "[0-9]"'
  - '        if min_digit is not None and min_digit > 1:'
  - '            integer_rule_part += " [0-9]" * (min_digit - 1)'
  - '        if max_digit is not None:'
  - '            integer_rule_part += "".join([" [0-9]?"] * (max_digit - (min_digit
    if min_digit is not None else 1)))'
  - '        additional_rules.append(f"{integer_part_rule} ::= {integer_rule_part.strip()}")'
  - '    '
  - '    return float_rule, additional_rules'
