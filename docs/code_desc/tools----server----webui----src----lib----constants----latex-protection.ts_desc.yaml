classes: []
desc: 该文件定义了用于 LaTeX 内容处理的一系列正则表达式常量，包括：匹配 Markdown 代码块（围栏代码块和行内代码）的正则，用于在处理时排除代码区域；匹配未被反斜杠转义的
  LaTeX 数学定界符（\(...\) 和 \[...\]）同时捕获代码块以便跳过的正则；匹配包含换行符的 $$...\\...$$ 显示公式块的正则；以及用于替换
  mhchem 宏（\ce 和 \pu）的模式的映射表。这些常量主要用于在渲染 LaTeX 数学内容时保护代码块不被错误解析，并处理特定的化学公式语法。
file: tools/server/webui/src/lib/constants/latex-protection.ts
funcs:
- code:
  - /**
  - ' * Matches common Markdown code blocks to exclude them from further processing
    (e.g. LaTeX).'
  - ' * - Fenced: ```...```'
  - ' * - Inline: `...` (does NOT support nested backticks or multi-backtick syntax)'
  - ' *'
  - ' * Note: This pattern does not handle advanced cases like:'
  - ' *       `` `code with `backticks` `` or \\``...\\``'
  - ' */'
  - export const CODE_BLOCK_REGEXP = /(```[\s\S]*?```|`[^`\n]+`)/g;
  - ''
  - /**
  - ' * Matches LaTeX math delimiters \(...\) and \[...\] only when not preceded by
    a backslash (i.e., not escaped),'
  - ' * while also capturing code blocks (```, `...`) so they can be skipped during
    processing.'
  - ' *'
  - ' * Uses negative lookbehind `(?<!\\)` to avoid matching \\( or \\[.'
  - ' * Using the look‑behind pattern `(?<!\\)` we skip matches'
  - ' * that are preceded by a backslash, e.g.'
  - ' * `Definitions\\(also called macros)` (title of chapter 20 in The TeXbook)'
  - ' * or `\\[4pt]` (LaTeX line-break).'
  - ' *'
  - ' * group 1: code-block'
  - ' * group 2: square-bracket'
  - ' * group 3: round-bracket'
  - ' */'
  - export const LATEX_MATH_AND_CODE_PATTERN =
  - "\t/(```[\\S\\s]*?```|`.*?`)|(?<!\\\\)\\\\\\[([\\S\\s]*?[^\\\\])\\\\]|(?<!\\\\\
    )\\\\\\((.*?)\\\\\\)/g;"
  - ''
  - /** Regex to capture the content of a $$...\\\\...$$ block (display-formula with
    line-break) */
  - export const LATEX_LINEBREAK_REGEXP = /\$\$([\s\S]*?\\\\[\s\S]*?)\$\$/;
  - ''
  - /** map from mchem-regexp to replacement */
  - 'export const MHCHEM_PATTERN_MAP: readonly [RegExp, string][] = ['
  - "\t[/(\\s)\\$\\\\ce{/g, '$1$\\\\\\\\ce{'],"
  - "\t[/(\\s)\\$\\\\pu{/g, '$1$\\\\\\\\pu{']"
  - '] as const;'
  desc: 模块级别代码，导出四个正则表达式常量：CODE_BLOCK_REGEXP 用于匹配代码块；LATEX_MATH_AND_CODE_PATTERN 用于捕获
    LaTeX 数学表达式及代码块；LATEX_LINEBREAK_REGEXP 用于匹配含换行的显示公式；MHCHEM_PATTERN_MAP 提供 mhchem
    宏的正则替换映射。
  line: 1-43
  name: __main__
