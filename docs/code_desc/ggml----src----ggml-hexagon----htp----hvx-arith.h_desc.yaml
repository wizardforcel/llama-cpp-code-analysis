classes: []
desc: 该文件为Hexagon DSP（HVX）架构实现了矢量和标量算术运算，包括f32/f16类型的二进制加法、减法、乘法，以及标量运算（加、减、乘、min、clamp）和平方运算。通过宏定义生成针对不同内存对齐情况（对齐/未对齐）的多种变体函数，并根据运行时内存对齐状态动态分派到最优实现，以最大化SIMD执行效率，支持HVX版本小于79的兼容路径。
file: ggml/src/ggml-hexagon/htp/hvx-arith.h
