desc: This header file defines the core data structures and interfaces for the llama
  model, including the model type enumeration, layer structures for various architectures
  (e.g., posnet, convnext, MoE, Mamba, RWKV), the main llama_model class with its
  loading, memory management, and graph building methods, as well as utility functions
  for type naming and internal testing.
