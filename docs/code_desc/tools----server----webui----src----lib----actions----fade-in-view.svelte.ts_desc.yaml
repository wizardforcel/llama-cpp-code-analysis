desc: This file defines a Svelte action named fadeInView, which initially sets an
  element's opacity to 0 and optionally shifts it vertically, then smoothly animates
  it to full opacity and its original position when it enters the viewport. It leverages
  IntersectionObserver for efficient viewport detection, and provides an option to
  skip the animation entirely if the element is already visible when the action is
  attached.
file: tools/server/webui/src/lib/actions/fade-in-view.svelte.ts
funcs:
- code:
  - export function fadeInView(
  - '    node: HTMLElement,'
  - '    options: { duration?: number; y?: number; skipIfVisible?: boolean } = {}'
  - ) {
  - '    const { duration = 300, y = 0, skipIfVisible = false } = options;'
  - ''
  - '    if (skipIfVisible) {'
  - '        const rect = node.getBoundingClientRect();'
  - '        const isAlreadyVisible ='
  - '            rect.top < window.innerHeight &&'
  - '            rect.bottom > 0 &&'
  - '            rect.left < window.innerWidth &&'
  - '            rect.right > 0;'
  - ''
  - '        if (isAlreadyVisible) {'
  - '            return;'
  - '        }'
  - '    }'
  - ''
  - '    node.style.opacity = ''0'';'
  - '    node.style.transform = `translateY(${y}px)`;'
  - '    node.style.transition = `opacity ${duration}ms ease-out, transform ${duration}ms
    ease-out`;'
  - ''
  - '    $effect(() => {'
  - '        const observer = new IntersectionObserver('
  - '            (entries) => {'
  - '                for (const entry of entries) {'
  - '                    if (entry.isIntersecting) {'
  - '                        requestAnimationFrame(() => {'
  - '                            node.style.opacity = ''1'';'
  - '                            node.style.transform = ''translateY(0)'';'
  - '                        });'
  - '                        observer.disconnect();'
  - '                    }'
  - '                }'
  - '            },'
  - '            { threshold: 0.05 }'
  - '        );'
  - ''
  - '        observer.observe(node);'
  - ''
  - '        return () => {'
  - '            observer.disconnect();'
  - '        };'
  - '    });'
  - '}'
  desc: A Svelte action that fades in an element when it enters the viewport, optionally
    skipping the animation if the element is already visible upon attachment.
  line: 1-62
  name: fadeInView
