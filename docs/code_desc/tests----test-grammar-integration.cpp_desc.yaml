desc: 该文件是llama.cpp项目中用于测试GBNF语法与JSON Schema转换功能的集成测试代码。它验证了从JSON Schema生成GBNF语法的正确性，以及GBNF语法匹配各种有效和无效字符串的能力，涵盖了简单语法、复杂语法、特殊字符、量词、错误处理（缺失根节点、缺失引用、左递归等）以及JSON
  Schema的各种约束条件（最小/最大值、字符串长度、模式匹配、数组/对象属性等）。该文件是测试文件，用于测试JSON Schema到语法（grammar）的转换集成。它通过定义多个测试函数，验证了简单语法、复杂语法、特殊字符、量词、失败场景（如缺少根、引用、左递归、缺少根符号）以及自定义根符号检查等功能，最后在main函数中依次执行这些测试并输出结果。
file: tests/test-grammar-integration.cpp
