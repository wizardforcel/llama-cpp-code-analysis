desc: 该文件是 ggml 项目中 SYCL 后端实现矩阵向量乘法（matrix-vector multiplication）的核心代码，针对不同量化格式（如
  Q4_0、Q5_0、Q8_0、IQ2_XXS 等）提供了高效的 kernel 实现。文件定义了一系列模板函数和对应的调度函数，利用 SYCL 异构计算特性，通过分组、子组（subgroup）和向量化操作来优化量化矩阵与向量的乘加计算，将计算结果写入目标数组。该文件是
  ggml 库的 SYCL 后端实现，专注于矩阵-向量乘法的量化优化。它定义了一系列针对不同量化数据类型（Q4_0, Q5_0, Q2_K, IQ1_S, IQ4_NL
  等）的 SYCL 内核函数，以及一个统一的分发函数 ggml_sycl_op_mul_mat_vec_q，该函数根据源张量的数据类型选择并调度相应的优化内核，并在支持重排优化时调用重排版本的内核。
file: ggml/src/ggml-sycl/mmvq.cpp
funcs:
- code:
  - template <typename reorder_vec_dot_q_sycl>
  - static void mul_mat_vec_q_reorder(const void * __restrict__ vx, const void * __restrict__
    vy, float * __restrict__ dst,
  - '                                  const int ncols, const int nrows, const sycl::nd_item<3>
    & nd_item) {'
  - '    using block_type   = ggml_sycl_reordered::block_q_t<reorder_vec_dot_q_sycl::gtype>;'
  - '    using block_traits = typename block_type::traits;'
  - '    const auto sg           = nd_item.get_sub_group();'
  - '    const int  sg_range     = sg.get_group_linear_range();'
  - '    const int  workgroup_id = nd_item.get_group_linear_id();'
  - '    const int  sg_id        = sg.get_group_linear_id();'
  - '    const int  row          = workgroup_id * sg_range + sg_id;'
  - '    if (row >= nrows) {'
  - '        return;'
  - '    }'
  - '    const int     blocks_per_row              = ncols / block_traits::qk;'
  - '    constexpr int blocks_per_subgroup         = ceil_div(block_traits::vdr_mmvq
    * WARP_SIZE, block_traits::qi);'
  - '    constexpr int block_elements_per_subgroup = block_traits::qi / block_traits::vdr_mmvq;'
  - '    const int     nblocks                     = nrows * (ncols / block_traits::qk);'
  - '    static_assert(blocks_per_subgroup > 0);'
  - '    static_assert(block_elements_per_subgroup > 0);'
  - '    float partial_sum = 0.0f;'
  - '    for (int i = sg.get_local_linear_id() / block_elements_per_subgroup; i <
    blocks_per_row; i += blocks_per_subgroup) {'
  - '        const int ibx = row * blocks_per_row + i;  // x block index'
  - '        const auto         bx_offset      = block_type::get_block_offset(ibx,
    nblocks);'
  - '        const auto         d_offset       = block_type::get_d_offset(nrows, ncols,
    ibx);'
  - '        // Y block index that aligns with ibx'
  - '        const int iby = i * block_type::block_to_q8_1_ratio();'
  - '        const int8_t* q8_1_quant_ptr = (const int8_t*)vy + iby * QK8_1;'
  - '        const sycl::half2* q8_1_ds_ptr = (const sycl::half2*)((const char*)vy
    + ncols + iby * sizeof(sycl::half2));'
  - '#pragma unroll'
  - '        for (int elem = 0; elem < block_elements_per_subgroup; elem += WARP_SIZE)
    {'
  - '            // x block quant index when casting the quants to int'
  - '            const int iqs = elem + block_traits::vdr_mmvq * (sg.get_local_linear_id()
    % block_elements_per_subgroup);'
  - '            partial_sum += reorder_vec_dot_q_sycl()(vx, bx_offset, d_offset,
    q8_1_quant_ptr, q8_1_ds_ptr, iqs);'
  - '        }'
  - '    }'
  - '    auto sum = sycl::reduce_over_group(nd_item.get_sub_group(), partial_sum,
    std::plus<>());'
  - '    if (sg.leader()) {'
  - '        dst[row] = sum;'
  - '    }'
  - '}'
  desc: 模板函数，针对支持数据重排的量化类型，执行矩阵向量乘法的 SYCL kernel 逻辑。该函数利用子组（subgroup）并行处理多行，通过读取重排序后的量化矩阵
    vx 与量化向量 vy，计算部分和并归约写入 dst。
