  - '        const float exp_logit = expf(logit);'
  - '        sum_exp += exp_logit;'
  - '        probs[i] = exp_logit;'
  - '    }'
  - '    for (size_t i = 0; i < probs.size(); i++) {'
  - '        probs[i] /= sum_exp;'
  - '    }'
  - '    return probs;'
  - '}'
