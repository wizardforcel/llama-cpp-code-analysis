desc: 该文件实现了基于 llama.cpp 库的困惑度（Perplexity）计算工具，支持标准困惑度计算、带步长的困惑度计算、KL 散度计算以及 HellaSwag
  任务的评分，包含多个处理 logits 和计算概率的辅助函数。The file contains evaluation benchmarks (perplexity,
  hellaswag, winogrande, multiple choice), including data loading, batching, log-probability
  computation, and accuracy scoring for language models.This file implements a perplexity
  calculation tool for evaluating language models. It supports multiple evaluation
  modes including standard perplexity, KL divergence analysis, HellaSwag benchmark,
  Winogrande benchmark, and multiple choice tasks. The tool processes input text in
  chunks, computes log probabilities, and generates detailed statistical reports including
  perplexity values, KL divergence metrics, and token probability distribution comparisons.
file: tools/perplexity/perplexity.cpp
