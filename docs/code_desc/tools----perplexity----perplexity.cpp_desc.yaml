  - '            if (sentence[where] == ''_'') break;'
  - '        }'
  - '        if (where == int(sentence.size())) {'
  - '            LOG_ERR("%s: no _ in <%s>\n", __func__, sentence.c_str());'
  - '            continue;'
  - '        }'
  - '        std::istringstream stream(answer.c_str());'
  - '        int i_answer; stream >> i_answer;'
