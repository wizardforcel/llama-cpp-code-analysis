- code:
  - static results_perplexity perplexity_v2(llama_context * ctx, const common_params
    & params) {
  - '    // Download: https://huggingface.co/datasets/ggml-org/ci/resolve/main/wikitext-2-raw-v1.zip'
  - '    // Run `./perplexity -m models/7B/ggml-model-q4_0.bin -f wiki.test.raw`'
  - '    // Output: `perplexity: 13.5106 [114/114]`'
  - '    // BOS tokens will be added for each chunk before eval'
  - ''
  - '    const llama_model * model = llama_get_model(ctx);'
  - '    const llama_vocab * vocab = llama_model_get_vocab(model);'
  - ''
  - '    const bool add_bos = llama_vocab_get_add_bos(vocab);'
  - '    GGML_ASSERT(!llama_vocab_get_add_eos(vocab));'
  - ''
  - '    LOG_INF("%s: tokenizing the input ..\n", __func__);'
  - ''
  - '    std::vector<llama_token> tokens = common_tokenize(ctx, params.prompt, true);'
  - ''
  - '    const int n_ctx = llama_n_ctx(ctx);'
  - ''
  - '    if (int(tokens.size()) < 2*n_ctx) {'
  - '        LOG_ERR("%s: you need at least %d tokens to evaluate perplexity with
    a context of %d\n",__func__,2*n_ctx,'
  - '                n_ctx);'
  - '        LOG_ERR("%s: the data file you provided tokenizes to only %zu tokens\n",__func__,tokens.size());'
  - '        return {std::move(tokens), 0., {}, {}};'
  - '    }'
  - ''
  - '    std::vector<float> logit_history;'
  - '    std::vector<float> prob_history;'
  - ''
  - '    logit_history.resize(tokens.size());'
  - '    prob_history.resize(tokens.size());'
  - ''
  - '    if (params.ppl_stride <= 0) {'
  - '        LOG_ERR("%s: stride is %d but must be greater than zero!\n",__func__,params.ppl_stride);'
  - '        return {tokens, -1, logit_history, prob_history};'
  - '    }'
  - ''
  - '    const int calc_chunk = n_ctx;'
  - ''
  - '    LOG_INF("%s: have %zu tokens. Calculation chunk = %d\n", __func__, tokens.size(),
    calc_chunk);'
  - ''
  - '    if (int(tokens.size()) <= calc_chunk) {'
  - '        LOG_ERR("%s: there are only %zu tokens, this is not enough for a context
    size of %d and stride %d\n",__func__,'
  - '                tokens.size(), n_ctx, params.ppl_stride);'
  - '        return {tokens, -1, logit_history, prob_history};'
  - '    }'
  - ''
  - '    const int n_chunk_max = (tokens.size() - calc_chunk + params.ppl_stride -
    1)  / params.ppl_stride;'
  - ''
  - '    const int n_chunk = params.n_chunks < 0 ? n_chunk_max : std::min(params.n_chunks,
    n_chunk_max);'
  - '    const int n_batch = params.n_batch;'
  - ''
  - '    const int n_vocab = llama_vocab_n_tokens(vocab);'
  - ''
  - '    int count = 0;'
  - '    double nll = 0.0;'
  - ''
  - '    const int n_seq = std::max(1, n_batch / n_ctx);'
  - '    LOG_INF("%s: computing over %d chunks, n_ctx=%d, batch_size=%d, n_seq=%d\n",
    __func__, n_chunk, n_ctx, n_batch, n_seq);'
  - ''
  - '    for (int i = 0; i < n_chunk; ++i) {'
  - '        const int start =     i * params.ppl_stride;'
  - '        const int end   = start + calc_chunk;'
  - ''
  - '        const int num_batches = (calc_chunk + n_batch - 1) / n_batch;'
  - '        //LOG_DBG("%s: evaluating %d...%d using %d batches\n", __func__, start,
    end, num_batches);'
  - ''
  - '        std::vector<float> logits;'
  - ''
  - '        const auto t_start = std::chrono::high_resolution_clock::now();'
  - ''
  - '        // clear the KV cache'
  - '        llama_memory_clear(llama_get_memory(ctx), true);'
  - ''
  - '        llama_batch batch = llama_batch_init(n_batch, 0, 1);'
  - ''
  - '        for (int j = 0; j < num_batches; ++j) {'
  - '            const int batch_start = start + j * n_batch;'
  - '            const int batch_size  = std::min(end - batch_start, n_batch);'
  - ''
  - '            common_batch_clear(batch);'
  - '            for (int i = 0; i < batch_size; i++) {'
  - '                common_batch_add(batch, tokens[batch_start + i], j*n_batch +
    i, {0}, true);'
  - '            }'
  - ''
  - '            //LOG_DBG("    Batch %d: starts at %d, size is %d, n_past is %d\n",j,batch_start,batch_size,j
    * n_batch);'
  - '            if (llama_decode(ctx, batch)) {'
  - '                //LOG_ERR("%s : failed to eval\n", __func__);'
  - '                llama_batch_free(batch);'
  - '                return {tokens, -1, logit_history, prob_history};'
  - '            }'
  - ''
  - '            // save original token and restore it after eval'
  - '            const auto token_org = tokens[batch_start];'
  - ''
  - '            // add BOS token for the first batch of each chunk'
  - '            if (add_bos && j == 0) {'
  - '                tokens[batch_start] = llama_vocab_bos(vocab);'
  - '            }'
  - ''
  - '            const auto * batch_logits = llama_get_logits(ctx);'
  - '            logits.insert(logits.end(), batch_logits, batch_logits + size_t(batch_size)
    * n_vocab);'
  - ''
  - '            if (j == 0) {'
  - '                tokens[batch_start] = token_org;'
  - '            }'
  - '        }'
  - ''
  - '        llama_batch_free(batch);'
