- code:
  - 'async function getFileAsBuffer(file: File): Promise<ArrayBuffer> {'
  - "\treturn new Promise((resolve, reject) => {"
  - "\t\tconst reader = new FileReader();"
  - "\t\treader.onload = (event) => {"
  - "\t\t\tif (event.target?.result) {"
  - "\t\t\t\tresolve(event.target.result as ArrayBuffer);"
  - "\t\t\t} else {"
  - "\t\t\t\treject(new Error('Failed to read file.'));"
  - "\t\t\t}"
  - "\t\t};"
  - "\t\treader.onerror = () => {"
  - "\t\t\treject(new Error('Failed to read file.'));"
  - "\t\t};"
  - "\t\treader.readAsArrayBuffer(file);"
  - "\t});"
  - '}'
