desc: 该文件是 ggml 库的入口源码，主要功能是设置全局的未捕获异常处理器（terminate handler），以便在程序因未捕获异常而终止时打印调用栈（backtrace），辅助开发者调试。文件包含两个静态（文件局部）函数和一个通过
  Lambda 表达式初始化的静态全局代码块。
file: ggml/src/ggml.cpp
funcs:
- code:
  - static bool ggml_uncaught_exception_init = []{
  - '    const char * GGML_NO_BACKTRACE = getenv("GGML_NO_BACKTRACE");'
  - '    if (GGML_NO_BACKTRACE) {'
  - '        return false;'
  - '    }'
  - '    const auto prev{std::get_terminate()};'
  - '    GGML_ASSERT(prev != ggml_uncaught_exception);'
  - '    previous_terminate_handler = prev;'
  - '    std::set_terminate(ggml_uncaught_exception);'
  - '    return true;'
  - '}();'
  desc: 通过 Lambda 表达式初始化的静态变量，在程序启动时检查环境变量 GGML_NO_BACKTRACE，若未设置则安装自定义的 terminate
    handler，并保存之前的 handler。
  line: 15-24
  name: __main__
- code:
  - GGML_NORETURN static void ggml_uncaught_exception() {
  - '    ggml_print_backtrace();'
  - '    if (previous_terminate_handler) {'
  - '        previous_terminate_handler();'
  - '    }'
  - '    abort(); // unreachable unless previous_terminate_handler was nullptr'
  - '}'
  desc: 自定义的 terminate handler 函数，负责打印调用栈，然后调用之前保存的 terminate handler，若不存在则直接 abort。
  line: 8-13
  name: ggml_uncaught_exception
