classes:
- desc: 继承自 ggml::cpu::tensor_traits 的类，为 KleidiAI 后端提供张量运算的工作区大小计算和计算前向传播功能。
  methods:
  - code:
    - bool work_size(int /* n_threads */, const struct ggml_tensor * op, size_t &
      size) override {
    - '    if (op->op != GGML_OP_MUL_MAT) {'
    - '        return false;'
    - '    }'
    - '    std::array<ggml_kleidiai_kernels *, GGML_KLEIDIAI_MAX_KERNEL_SLOTS> kernel_chain;'
    - '    const int slot_count = kleidiai_collect_kernel_chain(op, kernel_chain);'
    - '    if (slot_count == 0) {'
    - '        return false;'
    - '    }'
    - '    const bool is_gemv = op->src[1]->ne[1] == 1;'
    - '    const size_t k = op->src[0]->ne[0];'
    - '    const size_t n = op->src[0]->ne[1];'
    - '    const size_t m = op->src[1]->ne[1];'
    - '    if (op->src[0]->type == GGML_TYPE_Q4_0 || op->src[0]->type == GGML_TYPE_Q8_0)
      {'
    - '        const size_t qk = (op->src[0]->type == GGML_TYPE_Q4_0) ? QK4_0 : QK8_0;'
    - '        size_t cursor = 0;'
    - '        bool any_slot = false;'
    - '        for (int slot = 0; slot < slot_count; ++slot) {'
    - '            ggml_kleidiai_kernels * kernels = kernel_chain[slot];'
    - '            lhs_packing_info * lhs_info = is_gemv ? &kernels->gemv_lhs_info
      : &kernels->gemm_lhs_info;'
    - '            kernel_info * kernel        = is_gemv ? &kernels->gemv : &kernels->gemm;'
    - '            if (!lhs_info || !lhs_info->packed_size_ex || !kernel) {'
    - '                return false;'
    - '            }'
    - '            const size_t mr = kernel->get_mr();'
    - '            const size_t kr = kernel->get_kr();'
    - '            const size_t sr = kernel->get_sr();'
    - '            const size_t packed = lhs_info->packed_size_ex(m, k, qk, mr, kr,
      sr);'
    - '            cursor = align_up(cursor, GGML_KLEIDIAI_PACK_ALIGN);'
    - '            cursor += packed;'
    - '            any_slot = true;'
    - '        }'
    - '        if (!any_slot) {'
    - '            return false;'
    - '        }'
    - '        size = cursor;'
    - '        return true;'
    - '    }'
    - '    if (op->src[0]->type == GGML_TYPE_F16) {'
    - '        const int64_t lhs_batch_size0 = op->src[1]->ne[2];'
    - '        const int64_t rhs_batch_size0 = op->src[0]->ne[2];'
    - '        GGML_ASSERT(rhs_batch_size0 > 0);'
    - '        const int64_t r = lhs_batch_size0 / rhs_batch_size0;'
    - '        size_t cursor = 0;'
    - '        bool any_slot = false;'
    - '        for (int slot = 0; slot < slot_count; ++slot) {'
    - '            ggml_kleidiai_kernels * kernels = kernel_chain[slot];'
    - '            lhs_packing_info * lhs_info = is_gemv ? &kernels->gemv_lhs_info
      : &kernels->gemm_lhs_info;'
    - '            kernel_info * kernel        = is_gemv ? &kernels->gemv : &kernels->gemm;'
    - '            if (!lhs_info || !lhs_info->packed_size_ex || !kernels->rhs_info.packed_size_ex
      || !kernel) {'
    - '                return false;'
    - '            }'
    - '            const size_t mr = kernel->get_mr();'
    - '            const size_t kr = kernel->get_kr();'
    - '            const size_t sr = kernel->get_sr();'
    - '            cursor  = align_up(cursor, GGML_KLEIDIAI_PACK_ALIGN);'
    - '            cursor += lhs_info->packed_size_ex(m * r, k, 0, mr, kr, sr);'
    - '            any_slot = true;'
    - '        }'
    - '        for (int slot = 0; slot < slot_count; ++slot) {'
    - '            ggml_kleidiai_kernels * kernels = kernel_chain[slot];'
    - '            kernel_info * kernel = is_gemv ? &kernels->gemv : &kernels->gemm;'
    - '            if (!kernel || !kernels->rhs_info.packed_size_ex) {'
    - '                return false;'
    - '            }'
    - '            cursor  = align_up(cursor, GGML_KLEIDIAI_PACK_ALIGN);'
    - '            cursor += kernels->rhs_info.packed_size_ex(n, k, kernel->get_nr(),
      kernel->get_kr(), 0);'
    - '        }'
    - '        cursor  = align_up(cursor, GGML_KLEIDIAI_PACK_ALIGN);'
    - '        cursor += k * n * sizeof(float);'
    - '        cursor  = align_up(cursor, GGML_KLEIDIAI_PACK_ALIGN);'
    - '        cursor += n * sizeof(float);'
    - '        if (!any_slot) {'
    - '            return false;'
    - '        }'
    - '        size = cursor;'
    - '        return true;'
    - '    }'
    - '    return false;'
    - '}'
    desc: 计算给定的 MUL_MAT 张量运算所需的临时工作区大小，支持量化（Q4/Q8）和 F16 两种数据类型。
    line: 421-503
    name: work_size
  - code:
    - bool compute_forward(struct ggml_compute_params * params, struct ggml_tensor
      * dst) override {
    - '    if (dst->op == GGML_OP_MUL_MAT) {'
    - '        if (dst->src[0]->type == GGML_TYPE_Q4_0 || dst->src[0]->type == GGML_TYPE_Q8_0)
      {'
    - '            return compute_forward_qx(params, dst);'
    - '        } else if (dst->src[0]->type == GGML_TYPE_F16) {'
    - '            return compute_forward_fp16(params, dst);'
    - '        }'
    - '    } else if (dst->op == GGML_OP_GET_ROWS) {'
    - '        if (dst->src[0]->type == GGML_TYPE_Q4_0 || dst->src[0]->type == GGML_TYPE_Q8_0)
      {'
    - '            return compute_forward_get_rows(params, dst);'
    - '        }'
    - '    }'
    - '    return false;'
    - '}'
    desc: 前向计算调度函数，根据运算类型（MUL_MAT 或 GET_ROWS）和数据类型（Q4/Q8 或 F16）将计算分发给对应的专门函数。
    line: 505-519
    name: compute_forward
  - code:
    - bool compute_forward_fp16(ggml_compute_params * params, struct ggml_tensor *
      dst) {
    - '    const ggml_tensor * src0 = dst->src[0];'
    - '    const ggml_tensor * src1 = dst->src[1];'
    - '    GGML_TENSOR_BINARY_OP_LOCALS'
    - '    ggml_kleidiai_kernels *kernels = ggml_kleidiai_select_kernels(ctx.features,
      dst);'
    - '    if (!kernels) {'
    - '        return false;'
    - '    }'
    - '    const bool is_gemv = src1->ne[1] == 1;'
    - '    kernel_info * kernel = is_gemv ? &kernels->gemv : &kernels->gemm;'
    - '    lhs_packing_info * lhs_info = is_gemv ? &kernels->gemv_lhs_info : &kernels->gemm_lhs_info;'
    - '    GGML_ASSERT(kernel);'
    - '    if (!kernels->rhs_info.pack_func_ex ||'
    - '        !kernel->get_lhs_offset_ex || !kernel->get_rhs_packed_offset_ex ||
      !kernel->run_kernel_ex) {'
    - '        return false;'
    - '    }'
    - '    const int nth = params->nth;'
    - '    const int ith = params->ith;'
    - '    const int64_t lhs_batch_size0 = ne12;'
    - '    const int64_t rhs_batch_size0 = ne02;'
    - '    const int64_t batch_size      = lhs_batch_size0;'
    - '    GGML_ASSERT(rhs_batch_size0 > 0);'
    - '    GGML_ASSERT(lhs_batch_size0 % rhs_batch_size0 == 0);'
    - '    const int64_t r = lhs_batch_size0 / rhs_batch_size0;'
    - '    const int64_t m_group = ne11;'
    - '    const int64_t m       = m_group;'
    - '    const int64_t n       = ne01;'
    - '    const int64_t k       = ne00;'
    - '    const size_t lhs_stride = src1->nb[1];'
    - '    const size_t rhs_stride = src0->nb[1];'
    - '    const size_t dst_stride = dst->nb[1];'
    - '    const int64_t mr = (int64_t) kernel->get_mr();'
    - '    const int64_t nr = (int64_t) kernel->get_nr();'
    - '    const int64_t kr = (int64_t) kernel->get_kr();'
    - '    const int64_t sr = (int64_t) kernel->get_sr();'
    - '    const size_t lhs_packed_size = lhs_info->packed_size_ex(m, k, 0, mr, kr,
      sr);'
    - '    const size_t rhs_packed_size = kernels->rhs_info.packed_size_ex(n, k, nr,
      kr, 0);'
    - '    const size_t kxn_size        = k * n * sizeof(float);'
    - '    const size_t bias_size       = n * sizeof(float);'
    - '    const size_t wsize_required = lhs_packed_size + rhs_packed_size + kxn_size
      + bias_size;'
    - '    GGML_ASSERT(wsize_required <= params->wsize);'
    - '    uint8_t * lhs_packed = static_cast<uint8_t *>(params->wdata);'
    - '    uint8_t * rhs_packed = lhs_packed + lhs_packed_size;'
    - '    uint8_t * rhs_kxn    = rhs_packed + rhs_packed_size;'
    - '    uint8_t * bias       = rhs_kxn + kxn_size;'
    - '    for (int64_t batch_idx = 0; batch_idx < batch_size; ++batch_idx) {'
    - '        const int64_t rhs_batch_idx = batch_idx / r;'
    - '        const uint8_t * rhs_batch_base = static_cast<const uint8_t *>(src0->data)
      + rhs_batch_idx * src0->nb[2];'
    - '        uint8_t * dst_batch_base = static_cast<uint8_t *>(dst->data) + batch_idx
      * dst->nb[2];'
    - '        {'
    - '            const int64_t m_roundup_mr = kai_roundup(m, mr);'
    - '            const int64_t num_threads  = KAI_MIN(m_roundup_mr / mr, nth);'
    - '            if (ith < num_threads) {'
    - '                const int64_t num_m_per_thread0   = round_down((size_t)(m_roundup_mr
      / num_threads), (size_t)mr);'
    - '                const int64_t num_m_per_threadN_1 = m - (num_threads - 1) *
      num_m_per_thread0;'
    - '                const int64_t m_start = ith * num_m_per_thread0;'
    - '                const int64_t m_count = (ith == num_threads - 1) ? num_m_per_threadN_1
      : num_m_per_thread0;'
    - '                const size_t base_packed_off  = lhs_info->get_packed_offset_ex(m_start,
      k, 0, mr, kr, sr);'
    - '                const size_t next_block_off   = lhs_info->get_packed_offset_ex(m_start
      + mr, k, 0, mr, kr, sr);'
    - '                const size_t row_stride_bytes = (next_block_off - base_packed_off)
      / (size_t)mr;'
    - '                int64_t remaining = m_count;'
    - '                int64_t cur       = m_start;'
    - '                while (remaining > 0) {'
    - '                    const int64_t row_in_group = cur;'
    - '                    const int64_t avail        = m_group - row_in_group;'
    - '                    const int64_t take         = std::min(avail, remaining);'
    - '                    const uint8_t * lhs_batch_base = static_cast<const uint8_t
      *>(src1->data) + batch_idx * src1->nb[2];'
    - '                    const void * src_ptr = lhs_batch_base + (size_t)row_in_group
      * lhs_stride;'
    - '                    const size_t dst_off = base_packed_off + (size_t)(cur -
      m_start) * row_stride_bytes;'
    - '                    void * dst_ptr       = lhs_packed + dst_off;'
    - '                    lhs_info->pack_func_ex(take, k, 0, mr, kr, sr, 0, src_ptr,
      lhs_stride, dst_ptr);'
    - '                    cur       += take;'
    - '                    remaining -= take;'
    - '                }'
    - '            }'
    - '        }'
    - '        if (ith == 0) {'
    - '            memset(bias, 0, (size_t)n * sizeof(float));'
    - '            transpose_f32kxn_f16nxk((size_t)n, (size_t)k,'
    - '                                    reinterpret_cast<float *>(rhs_kxn),'
    - '                                    reinterpret_cast<const uint16_t *>(rhs_batch_base),'
    - '                                    rhs_stride);'
    - '            kernels->rhs_info.pack_func_ex(1, n, k, nr, kr, sr, 0, n * sizeof(float),'
    - '                         rhs_kxn, bias, nullptr, rhs_packed, 0, nullptr);'
    - '        }'
    - '        ggml_barrier(params->threadpool);'
    - '        {'
    - '            const int64_t n_step  = (int64_t) kernel->get_n_step();'
    - '            int64_t num_threads_n = KAI_MIN(n / n_step, nth);'
    - '            if (num_threads_n <= 0) {'
    - '                num_threads_n = 1;'
    - '            }'
    - '            if (ith < num_threads_n) {'
    - '                const int64_t num_n_per_thread0   = round_down((size_t)(n /
      num_threads_n), (size_t)n_step);'
    - '                const int64_t num_n_per_threadN_1 = n - (num_threads_n - 1)
      * num_n_per_thread0;'
    - '                const int64_t n_start      = ith * num_n_per_thread0;'
    - '                const int64_t n_to_process = (ith == num_threads_n - 1) ? num_n_per_threadN_1
      : num_n_per_thread0;'
    - '                const size_t lhs_packed_offset0 = lhs_info->get_packed_offset_ex(0,
      k, 0, mr, kr, sr);'
    - '                const size_t rhs_packed_offset  = kernel->get_rhs_packed_offset_ex(n_start,
      k, 0);'
    - '                const size_t dst_offset         = kernel->get_dst_offset((size_t)0,
      (size_t)n_start, dst_stride);'
    - '                const void * lhs_ptr = lhs_packed + lhs_packed_offset0;'
    - '                const void * rhs_ptr = rhs_packed + rhs_packed_offset;'
    - '                float * dst_ptr      = reinterpret_cast<float *>(dst_batch_base
      + dst_offset);'
    - '                kernel->run_kernel_ex(m, n_to_process, k, 0, lhs_ptr, rhs_ptr,
      dst_ptr, dst_stride, sizeof(float), -FLT_MAX, FLT_MAX);'
    - '            }'
    - '        }'
    - '        if (batch_idx != batch_size - 1) {'
    - '            ggml_barrier(params->threadpool);'
    - '        }'
    - '    }'
    - '    return true;'
    - '}'
    desc: 执行 F16 类型的矩阵乘法前向计算，包括 LHS/RHS 的打包、变换和并行矩阵乘法运算。
    line: 521-648
    name: compute_forward_fp16
  - code:
    - bool compute_forward_qx(struct ggml_compute_params * params, struct ggml_tensor
      * dst) {
    - '    GGML_ASSERT(dst->src[0]->type == GGML_TYPE_Q4_0 || dst->src[0]->type ==
      GGML_TYPE_Q8_0);'
    - '    const ggml_tensor * src0 = dst->src[0];'
    - '    const ggml_tensor * src1 = dst->src[1];'
    - '    GGML_TENSOR_BINARY_OP_LOCALS'
    - '    const kleidiai_weight_header * header = kleidiai_weight_header_from_ptr(src0->data);'
    - '    const bool has_header = kleidiai_is_weight_header_valid(header);'
    - '    const bool is_gemv = src1->ne[1] == 1;'
    - '    std::array<ggml_kleidiai_kernels *, GGML_KLEIDIAI_MAX_KERNEL_SLOTS> kernel_chain;'
    - '    const int slot_total = kleidiai_collect_kernel_chain(dst, kernel_chain);'
    - '    auto weight_for_slot = [&](int slot_index, size_t & size_out) -> const
      uint8_t * {'
    - '        if (slot_index < 0 || slot_index >= slot_total) {'
    - '            return nullptr;'
    - '        }'
    - '        if (has_header) {'
    - '            if (slot_index < header->slot_count) {'
    - '                size_out = static_cast<size_t>(header->sizes[slot_index]);'
    - '                return kleidiai_weight_slot_ptr(header, slot_index);'
    - '            }'
    - '            return nullptr;'
    - '        }'
    - '        if (slot_index == 0) {'
    - '            size_out = ggml_nbytes(src0);'
    - '            return static_cast<const uint8_t *>(src0->data);'
    - '        }'
    - '        return nullptr;'
    - '    };'
    - '    struct runtime_slot {'
    - '        int slot_index;'
    - '        ggml_kleidiai_kernels * kernels;'
    - '        kernel_info * kernel;'
    - '        lhs_packing_info * lhs_info;'
    - '        size_t mr;'
    - '        size_t nr;'
    - '        size_t kr;'
    - '        size_t sr;'
    - '        size_t n_step;'
    - '        size_t lhs_packed_size;'
    - '        size_t lhs_offset;'
    - '        size_t n_offset;'
    - '        size_t n_cols;'
    - '        int assigned_threads;'
    - '        int thread_begin;'
    - '        int thread_end;'
    - '        const uint8_t * rhs_base;'
    - '    };'
    - '    std::array<runtime_slot, GGML_KLEIDIAI_MAX_KERNEL_SLOTS> runtime{};'
    - '    int runtime_count = 0;'
    - '    for (int slot = 0; slot < slot_total && runtime_count < GGML_KLEIDIAI_MAX_KERNEL_SLOTS;
      ++slot) {'
    - '        ggml_kleidiai_kernels * kernels = kernel_chain[slot];'
    - '        kernel_info * kinfo      = is_gemv ? &kernels->gemv : &kernels->gemm;'
    - '        lhs_packing_info * linfo = is_gemv ? &kernels->gemv_lhs_info : &kernels->gemm_lhs_info;'
    - '        if (!kinfo || !linfo || !linfo->packed_size_ex || !linfo->pack_func_ex
      || !linfo->get_offset ||'
    - '            !kinfo->get_rhs_packed_offset_ex || !kinfo->run_kernel_ex || !kinfo->get_dst_offset)
      {'
    - '            continue;'
    - '        }'
    - '        size_t rhs_size = 0;'
    - '        const uint8_t * rhs_ptr = weight_for_slot(slot, rhs_size);'
    - '        if (!rhs_ptr || rhs_size == 0) {'
    - '            continue;'
    - '        }'
    - '        runtime[runtime_count] = {'
    - '            slot,'
    - '            kernels,'
    - '            kinfo,'
    - '            linfo,'
    - '            kinfo->get_mr(),'
    - '            kinfo->get_nr(),'
    - '            kinfo->get_kr(),'
    - '            kinfo->get_sr(),'
    - '            kinfo->get_n_step(),'
    - '            0,'
    - '            0,'
    - '            0,'
    - '            0,'
    - '            0,'
    - '            0,'
    - '            0,'
    - '            rhs_ptr'
    - '        };'
    - '        ++runtime_count;'
    - '    }'
    - '    if (runtime_count == 0) {'
    - '        ggml_kleidiai_kernels * fallback = ggml_kleidiai_select_kernels(ctx.features,
      dst);'
    - '        if (!fallback) {'
    - '            return false;'
    - '        }'
    - '        kernel_info * kinfo      = is_gemv ? &fallback->gemv : &fallback->gemm;'
    - '        lhs_packing_info * linfo = is_gemv ? &fallback->gemv_lhs_info : &fallback->gemm_lhs_info;'
    - '        rhs_packing_info * rinfo = &fallback->rhs_info;'
    - '        if (!kinfo || !linfo || !linfo->packed_size_ex || !linfo->pack_func_ex
      ||'
    - '            !kinfo->get_rhs_packed_offset_ex || !kinfo->run_kernel_ex || !kinfo->get_dst_offset
      ||'
    - '            !rinfo || !rinfo->pack_func_ex || !rinfo->packed_size_ex) {'
    - '            return false;'
    - '        }'
    - '        kernel_chain[0] = fallback;'
    - '        runtime[0] = {'
    - '            0,'
    - '            fallback,'
    - '            kinfo,'
    - '            linfo,'
    - '            kinfo->get_mr(),'
    - '            kinfo->get_nr(),'
    - '            kinfo->get_kr(),'
    - '            kinfo->get_sr(),'
    - '            kinfo->get_n_step(),'
    - '            0,'
    - '            0,'
    - '            0,'
    - '            0,'
    - '            0,'
    - '            0,'
    - '            0,'
    - '            nullptr'
    - '        };'
    - '        size_t rhs_size_fallback = 0;'
    - '        const uint8_t * rhs_base = weight_for_slot(0, rhs_size_fallback);'
    - '        if (!rhs_base) {'
    - '            rhs_base = static_cast<const uint8_t *>(src0->data);'
    - '        }'
    - '        runtime[0].rhs_base = rhs_base;'
    - '        runtime_count = 1;'
    - '    }'
    - '    const int nth_total = params->nth > 0 ? params->nth : 1;'
    - '    const int ith_total = params->ith;'
    - '    int sme_slot = -1;'
    - '    for (int i = 0; i < runtime_count; ++i) {'
    - '        if ((runtime[i].kernels->required_cpu & CPU_FEATURE_SME) == CPU_FEATURE_SME)
      {'
    - '            sme_slot = i;'
    - '            break;'
    - '        }'
    - '    }'
    - '    const int sme_cap_limit = ctx.sme_thread_cap;'
    - '    const bool use_hybrid = sme_cap_limit > 0 &&'
    - '                             runtime_count > 1 &&'
    - '                             nth_total > sme_cap_limit;'
    - '    size_t min_cols_per_thread = 0;'
    - '    if (runtime_count > 0 && nth_total > 0) {'
    - '        min_cols_per_thread = (size_t) std::max<int64_t>(1, (int64_t)ne01 /
      (int64_t)nth_total);'
    - '    }'
    - '    const bool too_small_for_hybrid = (min_cols_per_thread < 2) || (ne11 <
      128);'
    - '    const bool hybrid_enabled = use_hybrid && !too_small_for_hybrid;'
    - '    if (!hybrid_enabled) {'
    - '        int chosen_slot = 0;'
    - '        if (too_small_for_hybrid && sme_slot != -1) {'
    - '            chosen_slot = sme_slot;'
    - '        } else if (runtime_count > 1 && ctx.sme_thread_cap > 0 && nth_total
      > ctx.sme_thread_cap) {'
    - '            chosen_slot = 1;'
    - '        }'
    - '        if (chosen_slot != 0 && chosen_slot < runtime_count) {'
    - '            runtime[0] = runtime[chosen_slot];'
    - '        }'
    - '        runtime_count = runtime_count > 0 ? 1 : 0;'
    - '        sme_slot = -1;'
    - '        if (runtime_count > 0 &&'
    - '            (runtime[0].kernels->required_cpu & CPU_FEATURE_SME) == CPU_FEATURE_SME)
      {'
    - '            sme_slot = 0;'
    - '        }'
    - '    }'
    - '    int sme_cap = kleidiai_sme_thread_cap();'
    - '    if (sme_cap < 0) {'
    - '        sme_cap = nth_total;'
