desc: 该文件是 ggml 项目中 KleidiAI 后端的核心实现，负责在 ARM CPU 上为 Q4_0、Q8_0 量化矩阵乘法和 F16 乘法提供高性能内核调度。它检测
  CPU 特性（SME/SVE/I8MM/DOTPROD），选择合适的内核，并实现了多线程混合调度策略，以在有 SME 和无 SME 的线程间分配工作。该文件实现了
  ggml CPU 后端中 KleidiAI 的集成，提供了量化张量（Q4_0/Q8_0）的自定义张量类型和缓冲区类型，利用 KleidiAI 的 kernl 库进行高效的矩阵乘法和行查找操作。它包含张量数据的重组（repack）、缓冲区分配、以及针对特定硬件能力的调度逻辑，最大化了运算性能。
