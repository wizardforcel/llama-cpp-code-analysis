  - void replace_all(std::string & s, const std::string & search, const std::string
    & replace) {
  - '    if (search.empty()) {'
  - '        return;'
  - '    }'
  - '    std::string builder;'
  - '    builder.reserve(s.length());'
  - '    size_t pos = 0;'
  - '    size_t last_pos = 0;'
  - '    while ((pos = s.find(search, last_pos)) != std::string::npos) {'
  - '        builder.append(s, last_pos, pos - last_pos);'
  - '        builder.append(replace);'
  - '        last_pos = pos + search.length();'
  - '    }'
  - '    builder.append(s, last_pos, std::string::npos);'
  - '    s = std::move(builder);'
  - '}'
  desc: Utility function that replaces all occurrences of a search string with a replacement
