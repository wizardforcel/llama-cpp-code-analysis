desc: The file implements an auto-scroll controller for scrollable containers in a
  Svelte web UI, automatically scrolling to the bottom during streaming/loading, detecting
  user scroll-up to pause auto-scroll, and resuming when scrolled back to the bottom,
  with support for both normal and column-reverse containers. It also provides a factory
  function to create controller instances.
