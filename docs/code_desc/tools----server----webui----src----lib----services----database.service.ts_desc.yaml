  - code:
    - 'static async deleteMessage(messageId: string): Promise<void> {'
    - "\tawait db.transaction('rw', db.messages, async () => {"
    - "\t\tconst message = await db.messages.get(messageId);"
    - "\t\tif (!message) return;"
    - ''
    - "\t\t// Remove this message from its parent's children array"
    - "\t\tif (message.parent) {"
    - "\t\t\tconst parent = await db.messages.get(message.parent);"
    - "\t\t\tif (parent) {"
    - "\t\t\t\tparent.children = parent.children.filter((childId: string) => childId\
      \ !== messageId);"
    - "\t\t\t\tawait db.messages.put(parent);"
    - "\t\t\t}"
    - "\t\t}"
    - ''
    - "\t\t// Delete the message"
    - "\t\tawait db.messages.delete(messageId);"
    - "\t});"
    - '}'
    desc: 删除单条消息，并从其父消息的 children 数组中移除该消息 ID 的引用。
