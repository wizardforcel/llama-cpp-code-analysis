    - static async deleteMessageCascading(
    - "\tconversationId: string,"
    - "\tmessageId: string"
    - '): Promise<string[]> {'
    - "\treturn await db.transaction('rw', db.messages, async () => {"
    - "\t\t// Get all messages in the conversation to find descendants"
    - "\t\tconst allMessages = await db.messages.where('convId').equals(conversationId).toArray();"
    - ''
    - "\t\t// Find all descendant messages"
    - "\t\tconst descendants = findDescendantMessages(allMessages, messageId);"
    - "\t\tconst allToDelete = [messageId, ...descendants];"
    - ''
    - "\t\t// Get the message to delete for parent cleanup"
    - "\t\tconst message = await db.messages.get(messageId);"
    - "\t\tif (message && message.parent) {"
    - "\t\t\tconst parent = await db.messages.get(message.parent);"
    - "\t\t\tif (parent) {"
    - "\t\t\t\tparent.children = parent.children.filter((childId: string) => childId\
      \ !== messageId);"
    - "\t\t\t\tawait db.messages.put(parent);"
    - "\t\t\t}"
    - "\t\t}"
    - ''
    - "\t\t// Delete all messages in the branch"
    - "\t\tawait db.messages.bulkDelete(allToDelete);"
    - ''
    - "\t\treturn allToDelete;"
    - "\t});"
    - '}'
    desc: 级联删除指定消息及其所有后代消息（整个分支），清理父节点引用后批量删除并返回所有被删除的消息 ID。
