  - code:
    - static async forkConversation(
    - "\tsourceConvId: string,"
    - "\tatMessageId: string,"
    - "\toptions: { name: string; includeAttachments: boolean }"
    - '): Promise<DatabaseConversation> {'
    - "\treturn await db.transaction('rw', [db.conversations, db.messages], async\
      \ () => {"
    - "\t\tconst sourceConv = await db.conversations.get(sourceConvId);"
    - "\t\tif (!sourceConv) {"
    - "\t\t\tthrow new Error(`Source conversation ${sourceConvId} not found`);"
    - "\t\t}"
    - ''
    - "\t\tconst allMessages = await db.messages.where('convId').equals(sourceConvId).toArray();"
    - ''
    - "\t\tconst pathMessages = filterByLeafNodeId(allMessages, atMessageId, true)\
      \ as DatabaseMessage[];"
    - "\t\tif (pathMessages.length === 0) {"
    - "\t\t\tthrow new Error(`Could not resolve message path to ${atMessageId}`);"
    - "\t\t}"
    - ''
    - "\t\tconst idMap = new Map<string, string>();"
    - ''
    - "\t\tfor (const msg of pathMessages) {"
    - "\t\t\tidMap.set(msg.id, uuid());"
    - "\t\t}"
    - ''
    - "\t\tconst newConvId = uuid();"
    - "\t\tconst clonedMessages: DatabaseMessage[] = pathMessages.map((msg) => {"
    - "\t\t\tconst newId = idMap.get(msg.id)!;"
    - "\t\t\tconst newParent = msg.parent ? (idMap.get(msg.parent) ?? null) : null;"
    - "\t\t\tconst newChildren = msg.children"
    - "\t\t\t\t.filter((childId: string) => idMap.has(childId))"
    - "\t\t\t\t.map((childId: string) => idMap.get(childId)!);"
    - ''
    - "\t\t\treturn {"
    - "\t\t\t\t...msg,"
    - "\t\t\t\tid: newId,"
    - "\t\t\t\tconvId: newConvId,"
    - "\t\t\t\tparent: newParent,"
    - "\t\t\t\tchildren: newChildren,"
    - "\t\t\t\textra: options.includeAttachments ? msg.extra : undefined"
    - "\t\t\t};"
    - "\t\t});"
    - ''
    - "\t\tconst lastClonedMessage = clonedMessages[clonedMessages.length - 1];"
    - "\t\tconst newConv: DatabaseConversation = {"
    - "\t\t\tid: newConvId,"
    - "\t\t\tname: options.name,"
    - "\t\t\tlastModified: Date.now(),"
    - "\t\t\tcurrNode: lastClonedMessage.id,"
    - "\t\t\tforkedFromConversationId: sourceConvId,"
    - "\t\t\tmcpServerOverrides: sourceConv.mcpServerOverrides"
    - "\t\t\t\t? sourceConv.mcpServerOverrides.map((o: McpServerOverride) => ({"
    - "\t\t\t\t\t\tserverId: o.serverId,"
    - "\t\t\t\t\t\tenabled: o.enabled"
    - "\t\t\t\t\t}))"
    - "\t\t\t\t: undefined"
    - "\t\t};"
    - ''
    - "\t\tawait db.conversations.add(newConv);"
    - ''
    - "\t\tfor (const msg of clonedMessages) {"
    - "\t\t\tawait db.messages.add(msg);"
    - "\t\t}"
    - ''
    - "\t\treturn newConv;"
    - "\t});"
    - '}'
