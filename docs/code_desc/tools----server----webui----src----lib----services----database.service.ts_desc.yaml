  name: DatabaseService
desc: 该文件实现了一个基于 Dexie（IndexedDB 封装库）的本地数据库服务层，用于管理 llama.cpp WebUI 中的对话（Conversation）与消息（Message）数据。它定义了数据库结构
  LlamacppDatabase，并提供静态服务类 DatabaseService，封装了对话的创建、查询、更新、删除，消息的创建（含分支、根消息、系统消息）、级联删除，以及对话导入和分叉（fork）等核心功能，支持树状消息分支结构的持久化存储。
