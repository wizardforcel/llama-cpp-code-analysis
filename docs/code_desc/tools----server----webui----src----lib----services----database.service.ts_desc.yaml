  - code:
    - static async deleteConversation(
    - "\tid: string,"
    - "\toptions?: { deleteWithForks?: boolean }"
    - '): Promise<void> {'
    - "\tawait db.transaction('rw', [db.conversations, db.messages], async () => {"
    - "\t\tif (options?.deleteWithForks) {"
    - "\t\t\t// Recursively collect all descendant IDs"
    - "\t\t\tconst idsToDelete: string[] = [];"
    - "\t\t\tconst queue = [id];"
    - ''
    - "\t\t\twhile (queue.length > 0) {"
    - "\t\t\t\tconst parentId = queue.pop()!;"
    - "\t\t\t\tconst children = await db.conversations"
    - "\t\t\t\t\t.filter((c) => c.forkedFromConversationId === parentId)"
    - "\t\t\t\t\t.toArray();"
    - ''
    - "\t\t\t\tfor (const child of children) {"
    - "\t\t\t\t\tidsToDelete.push(child.id);"
    - "\t\t\t\t\tqueue.push(child.id);"
    - "\t\t\t\t}"
    - "\t\t\t}"
    - ''
    - "\t\t\tfor (const forkId of idsToDelete) {"
    - "\t\t\t\tawait db.conversations.delete(forkId);"
    - "\t\t\t\tawait db.messages.where('convId').equals(forkId).delete();"
    - "\t\t\t}"
    - "\t\t} else {"
    - "\t\t\t// Reparent direct children to deleted conv's parent"
    - "\t\t\tconst conv = await db.conversations.get(id);"
    - "\t\t\tconst newParent = conv?.forkedFromConversationId;"
    - "\t\t\tconst directChildren = await db.conversations"
    - "\t\t\t\t.filter((c) => c.forkedFromConversationId === id)"
    - "\t\t\t\t.toArray();"
    - ''
    - "\t\t\tfor (const child of directChildren) {"
    - "\t\t\t\tawait db.conversations.update(child.id, {"
    - "\t\t\t\t\tforkedFromConversationId: newParent ?? undefined"
    - "\t\t\t\t});"
    - "\t\t\t}"
    - "\t\t}"
    - ''
    - "\t\tawait db.conversations.delete(id);"
    - "\t\tawait db.messages.where('convId').equals(id).delete();"
    - "\t});"
    - '}'
    desc: 删除指定对话及其全部消息；可选递归删除所有分叉（fork）子对话，或将子对话重新挂接到被删对话的父级。
