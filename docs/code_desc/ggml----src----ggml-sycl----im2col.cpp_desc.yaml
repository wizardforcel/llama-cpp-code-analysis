desc: 该文件是 ggml 框架中基于 SYCL 的 im2col 操作实现，用于将输入图像的像素块转换为矩阵列，支持半精度和单精度浮点数，并利用 SYCL 进行并行计算，核心功能是高效地将输入图像转换为神经网络卷积层所需的
  im2col 矩阵格式。
file: ggml/src/ggml-sycl/im2col.cpp
funcs:
- code:
  - template <typename T>
  - static void im2col_kernel(const float * x, T * dst, int64_t batch_offset, int64_t
    offset_delta, int64_t IC, int64_t IW,
  - '                          int64_t IH, int64_t OH, int64_t OW, int64_t KW, int64_t
    KH, int64_t pelements, int64_t CHW,'
  - '                          int s0, int s1, int p0, int p1, int d0, int d1, const
    sycl::nd_item<3> & item_ct1) {'
  - '    const int64_t work_group_size = item_ct1.get_local_range(2);'
  - '    const int64_t global_id       = item_ct1.get_local_id(2) + (work_group_size
    * item_ct1.get_group(2));'
  - ''
  - '    // make each work-item deal with more elements since sycl global range can
    not exceed max int'
  - '    for (int64_t i = global_id; i < pelements; i += (work_group_size * item_ct1.get_group_range(2)))
    {'
  - '        const int64_t ksize = OW * KH;'
  - '        const int64_t kx    = i / ksize;'
  - '        const int64_t kd    = kx * ksize;'
  - '        const int64_t ky    = (i - kd) / OW;'
  - '        const int64_t ix    = i % OW;'
  - ''
  - '        const int64_t oh    = item_ct1.get_group(1);'
  - '        const int64_t batch = item_ct1.get_group(0) / IC;'
  - '        const int64_t ic    = item_ct1.get_group(0) % IC;'
  - ''
  - '        const int64_t iiw = (ix * s0) + (kx * d0) - p0;'
  - '        const int64_t iih = (oh * s1) + (ky * d1) - p1;'
  - ''
  - '        const int64_t offset_dst = (((batch * OH + oh) * OW + ix) * CHW) + (ic
    * (KW * KH) + ky * KW + kx);'
  - ''
  - '        const int64_t offset_src_base = (ic * offset_delta) + (batch * batch_offset);'
  - '        const int64_t offset_src      = offset_src_base + (iih * IW) + iiw;'
  - ''
  - '        const bool  out_of_bounds = (iih < 0 || iih >= IH || iiw < 0 || iiw >=
    IW);'
  - '        const float src_val       = out_of_bounds ? 0.0f : x[offset_src];'
  - ''
  - '        if constexpr (std::is_same_v<T, sycl::half>) {'
  - '            dst[offset_dst] = sycl::half(src_val);'
  - '        } else if constexpr (std::is_same_v<T, float>) {'
  - '            dst[offset_dst] = src_val;'
  - '        }'
  - '    }'
  - '}'
  desc: SYCL 内核函数，执行 im2col 转换的核心计算逻辑，根据输入坐标计算输出坐标，并处理边界填充
  line: 22-57
  name: im2col_kernel
- code:
  - template <typename T>
  - static void im2col_sycl_internal(const float * x, T * dst, int64_t IW, int64_t
    IH, int64_t OW, int64_t OH, int64_t KW,
  - '                                 int64_t KH, int64_t IC, int64_t batch, int64_t
    batch_offset, int64_t offset_delta,'
  - '                                 int s0, int s1, int p0, int p1, int d0, int
    d1, queue_ptr stream) {'
  - '    const int64_t parallel_elements = OW * KW * KH;'
  - '    const int64_t num_blocks        = (parallel_elements + SYCL_IM2COL_BLOCK_SIZE
    - 1) / SYCL_IM2COL_BLOCK_SIZE;'
  - ''
  - '    // decrease global range when it exceeds the max int'
  - '    int64_t local_size = downsample_sycl_global_range(batch * IC * OH * num_blocks,
    SYCL_IM2COL_BLOCK_SIZE);'
  - ''
  - '    sycl::range<3> block_nums(batch * IC, OH, num_blocks);'
  - '    sycl::range<3> local_range(1, 1, local_size);'
  - ''
  - '    const int64_t CHW = IC * KH * KW;'
  - ''
  - '    stream->parallel_for(sycl::nd_range<3>(block_nums * local_range, local_range),
    [=](sycl::nd_item<3> item_ct1) {'
  - '        im2col_kernel<T>(x, dst, batch_offset, offset_delta, IC, IW, IH, OH,
    OW, KW, KH, parallel_elements, CHW, s0, s1,'
  - '                         p0, p1, d0, d1, item_ct1);'
  - '    });'
  - '}'
  desc: 内部模板函数，负责设置 SYCL 并行计算的维度并调用 im2col_kernel 内核执行实际转换
  line: 60-79
  name: im2col_sycl_internal
- code:
  - static void im2col_sycl_f16(const float * x, sycl::half * dst, int64_t IW, int64_t
    IH, int64_t OW, int64_t OH,
  - '                            int64_t KW, int64_t KH, int64_t IC, int64_t batch,
    int64_t batch_offset,'
  - '                            int64_t offset_delta, int s0, int s1, int p0, int
    p1, int d0, int d1, queue_ptr stream) {'
  - '    if (!stream->get_device().has(sycl::aspect::fp16)) {'
  - '        throw sycl::exception(sycl::make_error_code(sycl::errc::kernel_not_supported),'
  - '                              "Device does not support half precision (fp16)
    operations!");'
  - '    }'
  - '    im2col_sycl_internal<sycl::half>(x, dst, IW, IH, OW, OH, KW, KH, IC, batch,
    batch_offset, offset_delta, s0, s1, p0,'
  - '                                     p1, d0, d1, stream);'
  - '}'
