desc: 该文件实现了 ggml 后端 remoting 模式的适配层。它定义了 remoting 后端（基于 API remoting 模式）的接口，包括初始化、获取名称、释放、图计算与图优化等静态回调函数，并将这些回调组装到一个
  ggml_backend_i 接口结构中，最终对外提供 ggml_backend_remoting_device_init 函数以创建 remoting 后端实例。
