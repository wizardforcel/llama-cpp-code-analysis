  - static inline HVX_Vector hvx_vec_inverse_f32(HVX_Vector v_sf) {
  - '    HVX_Vector inv_aprox_sf = Q6_V_vsplat_R(0x7EEEEBB3);'
  - '    HVX_Vector two_sf       = hvx_vec_splat_f32(2.0);'
  - ''
  - '    // First approximation'
  - '    HVX_Vector i_sf = Q6_Vw_vsub_VwVw(inv_aprox_sf, v_sf);'
  - ''
  - '    HVX_Vector r_qf;'
  - ''
  - '    // Refine'
  - '    r_qf = Q6_Vqf32_vmpy_VsfVsf('
  - '        i_sf, Q6_Vsf_equals_Vqf32(Q6_Vqf32_vsub_VsfVsf(two_sf, Q6_Vsf_equals_Vqf32(Q6_Vqf32_vmpy_VsfVsf(i_sf,
    v_sf)))));'
  - '    r_qf = Q6_Vqf32_vmpy_Vqf32Vqf32('
  - '        r_qf, Q6_Vqf32_vsub_VsfVsf(two_sf, Q6_Vsf_equals_Vqf32(Q6_Vqf32_vmpy_VsfVsf(Q6_Vsf_equals_Vqf32(r_qf),
    v_sf))));'
  - '    r_qf = Q6_Vqf32_vmpy_Vqf32Vqf32('
  - '        r_qf, Q6_Vqf32_vsub_VsfVsf(two_sf, Q6_Vsf_equals_Vqf32(Q6_Vqf32_vmpy_VsfVsf(Q6_Vsf_equals_Vqf32(r_qf),
    v_sf))));'
  - ''
  - '    return Q6_Vsf_equals_Vqf32(r_qf);'
  - '}'
  desc: 计算fp32类型向量的逐元素倒数，采用初始近似结合三次牛顿-拉弗森迭代法，返回高精度的倒数向量。
