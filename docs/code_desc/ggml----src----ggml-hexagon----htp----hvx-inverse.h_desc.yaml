desc: 该文件是Hexagon HVX (Hexagon Vector eXtension) DSP指令集下的一个头文件，定义了使用HVX向量单元计算浮点数倒数（1/x）的高性能SIMD实现。核心功能包括：针对fp16和fp32两种浮点格式，利用多项式逼近和牛顿-拉弗森迭代法生成倒数，并包含对齐/非对齐内存访问的四种变体（aa/au/ua/uu）以及自动选择最优变体的分发器逻辑，覆盖了向量化计算、NaN/Inf守卫和尾数处理等关键环节。
