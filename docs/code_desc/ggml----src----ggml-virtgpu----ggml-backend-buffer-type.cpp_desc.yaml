classes: []
desc: 该文件实现了基于远程（remoting）协议的 GPU 后端缓冲区（buffer）类型接口，提供了缓冲区分配、命名、对齐、最大尺寸与分配尺寸查询等功能。它通过
  virtgpu 抽象层与 API 运行时（apir）进行交互，区分从主机指针创建缓冲区（from_ptr）和普通分配两种路径，并定义了两个后端缓冲区类型接口：标准接口与从指针创建接口。
file: ggml/src/ggml-virtgpu/ggml-backend-buffer-type.cpp
