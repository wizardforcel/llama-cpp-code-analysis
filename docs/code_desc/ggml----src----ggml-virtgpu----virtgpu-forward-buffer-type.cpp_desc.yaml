classes: []
desc: 该文件实现了virt-gpu转发层中buffer type相关操作的远程调用（RPC）封装，包括获取缓冲区类型名称、对齐、最大尺寸以及分配缓冲区等功能。每个函数通过编码命令参数、发起远程调用、解码返回结果，实现客户端与服务端之间的交互。
file: ggml/src/ggml-virtgpu/virtgpu-forward-buffer-type.cpp
funcs:
- code:
  - char * apir_buffer_type_get_name(virtgpu * gpu, apir_buffer_type_host_handle_t
    host_handle) {
  - '    apir_encoder *        encoder;'
  - '    apir_decoder *        decoder;'
  - '    ApirForwardReturnCode ret;'
  - ''
  - '    REMOTE_CALL_PREPARE(gpu, encoder, APIR_COMMAND_TYPE_BUFFER_TYPE_GET_NAME);'
  - ''
  - '    apir_encode_apir_buffer_type_host_handle(encoder, host_handle);'
  - ''
  - '    REMOTE_CALL(gpu, encoder, decoder, ret);'
  - ''
  - '    const size_t string_size = apir_decode_array_size_unchecked(decoder);'
  - '    char *       string      = (char *) apir_decoder_alloc_array(sizeof(char),
    string_size);'
  - '    if (!string) {'
  - '        GGML_LOG_ERROR(GGML_VIRTGPU "%s: Could not allocate the device name buffer\n",
    __func__);'
  - '        apir_decoder_set_fatal(decoder);'
  - '    }'
  - '    apir_decode_char_array(decoder, string, string_size);'
  - ''
  - '    remote_call_finish(gpu, encoder, decoder);'
  - ''
  - '    return string;'
  - '}'
  desc: 远程获取缓冲区类型的名称，返回字符串指针，失败时分配内存并记录错误。
  line: 5-25
  name: apir_buffer_type_get_name
