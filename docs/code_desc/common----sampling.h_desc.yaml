desc: 该文件是common/sampling.h头文件，主要定义了common_sampler结构体及其相关API函数的声明，用于提供统一的采样逻辑实现，包括语法（grammar）支持、自定义采样参数逻辑、最近接受令牌的历史记录以及性能指标等功能。该文件声明的函数旨在为llama.cpp示例程序提供可复用的采样接口，涵盖采样器的初始化、释放、接受令牌、重置、克隆、采样、获取候选令牌、打印性能信息等操作。
