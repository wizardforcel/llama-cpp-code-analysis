desc: The file mtmd.h defines the public C and C++ API for libmtmd, a library that
  provides multimodal support (image and audio) to llama.cpp. This header declares
  opaque types, context parameters, and a suite of functions for initializing the
  multimodal context, managing bitmaps (image/audio data), tokenizing input with media
  markers, encoding chunks, and retrieving embeddings, along with C++ RAII wrappers.
