classes:
- desc: PowerPC 架构特性检测类，封装了平台字符串、处理器版本号和 VSX 支持标志的检测逻辑
  methods:
  - code:
    - powerpc_features() {
    - '#if defined(__linux__)'
    - '    unsigned long auxval = getauxval(AT_PLATFORM);'
    - '    if (auxval) {'
    - '        platform = std::string(reinterpret_cast<const char*>(auxval));'
    - '        // TBD: Do systems exist that return this in uppercase?'
    - '        if (platform.substr(0, 5) == "power") {'
    - '            // Extractt a numeric suffix, if one exists'
    - '            int vpos = -1;'
    - '            for (int i = platform.length() - 1; i >= 0; i--) {'
    - '                if (std::isdigit(platform[i])) {'
    - '                    vpos = i;'
    - '                } else {'
    - '                    break;'
    - '                }'
    - '            }'
    - '            if (vpos > -1) {'
    - '                power_version = std::stoi(platform.substr(vpos));'
    - '            }'
    - '        }'
    - '    }'
    - '#endif'
    - '    if (power_version >= 9) {'
    - '        has_vsx = true;'
    - '    }'
    - '}'
    desc: 构造函数：在 Linux 系统下解析 AT_PLATFORM 辅助向量来提取平台名称和 Power 处理器版本号，并基于版本判断 VSX 支持能力
    line: 9-34
    name: powerpc_features
  name: powerpc_features
desc: 该文件实现针对 PowerPC 64 位架构的 CPU 后端特性检测与评分功能，通过解析 Linux 系统平台信息（AT_PLATFORM）来确定处理器版本（power_version）和
  VSX 指令集支持情况，并根据编译时宏（如 GGML_USE_POWER8、GGML_USE_VSX）计算后端性能评分，用于优化推理调度。
file: ggml/src/ggml-cpu/arch/powerpc/cpu-feats.cpp
funcs:
- code:
  - static int ggml_backend_cpu_powerpc_score() {
  - '    int score = 1;'
  - '    powerpc_features pf;'
  - ''
  - // Platform scores
  - '#if defined(GGML_USE_POWER7)'
  - '    if (pf.power_version < 7) { return 0; }'
  - '    score += 1<<1;'
  - '#endif'
  - '#if defined(GGML_USE_POWER8)'
  - '    if (pf.power_version < 8) { return 0; }'
  - '    score += 1<<2;'
  - '#endif'
  - '#if defined(GGML_USE_POWER9)'
  - '    if (pf.power_version < 9) { return 0; }'
  - '    score += 1<<3;'
  - '#endif'
  - '#if defined(GGML_USE_POWER10)'
  - '    if (pf.power_version < 10) { return 0; }'
  - '    score += 1<<4;'
  - '#endif'
  - '#if defined(GGML_USE_POWER11)'
  - '    if (pf.power_version < 11) { return 0; }'
  - '    score += 1<<5;'
  - '#endif'
  - ''
  - // Feature scores
  - '#if defined(GGML_USE_VSX)'
  - '    if (!pf.has_vsx) { return 0; }'
  - '    score += 1<<6;'
  - '#endif'
  - ''
  - '    return score;'
  - '}'
  desc: 静态评分函数：根据编译宏与检测到的 PowerPC 特性，返回后端支持分数（0 表示不支持），分数越高表示对当前硬件支持越好
  line: 36-63
  name: ggml_backend_cpu_powerpc_score
