desc: 该文件是 GGML CPU 后端在 ARM 架构下的量化内核实现，主要包含针对 ARM NEON 和 SVE 指令集优化的向量点积和量化函数。文件中的函数实现了不同比特精度（如
  1-bit、4-bit、5-bit、8-bit 等）的量化块之间的点积计算，以及将浮点数据量化为 8-bit 格式的函数。代码通过 NEON 或 SVE 的 SIMD
  指令实现高性能的并行计算，并针对不同的垂直量化格式（如 Q1_0、Q4_0、Q4_1、Q5_0、Q8_0、Q8_1、MXFP4、NVFP4 等）提供专门的实现。文件包含预计算的位扩展查找表以加速
  8-bit 到 8-byte 的转换，并在不支持 SIMD 的平台上提供标量 fallback 实现。该文件是ggml项目中Arm架构CPU的量化向量点积实现，包含多个针对不同量化格式（如Q5_0、Q5_1、Q8_0、TQ1_0、TQ2_0、Q2_K等）的SIMD优化点积函数，利用ARM
  NEON、SVE等指令集加速矩阵乘法运算。该文件是 ggml 库中针对 ARM 架构（SVE 和 NEON）实现的量化向量点积函数集合。它定义了多个向量点积函数（如
  ggml_vec_dot_q2_K_q8_K、ggml_vec_dot_q3_K_q8_K、ggml_vec_dot_q4_K_q8_K 等），用于在嵌入式 ARM
  处理器上高效执行 2-bit、3-bit、4-bit 等量化格式的矩阵乘法。文件利用 SVE（可扩展向量扩展）和 NEON SIMD 指令进行向量化优化，根据硬件能力动态选择最佳的指令集实现。该文件是
  ggml 项目中 ARM 架构下 CPU 量化内核的量化向量点积实现，专注于 K-quant 量化格式（Q4_K、Q5_K、Q6_K）与 Q8_K 格式的点积运算。代码包含多个全局函数，利用
  ARM NEON 和 SVE SIMD 指令集进行高度优化的向量计算，支持不同向量长度（128/256/512 位）的分支处理，并包含基于矩阵乘法指令（MMLA）和点积指令（DOT）的多种优化路径。该文件是
  ggml 项目中针对 ARM 架构的量化向量点积实现，专注于 Q5_K 与 Q8_K、以及 Q6_K 与 Q8_K 两种量化格式的矩阵乘法加速。文件利用 ARM
  NEON、SVE 和 MATMUL_INT8 指令集，通过精细的位操作和 SIMD 并行化，实现了高效的量化数据解码和点积计算，显著提升了性能。该文件是ggml项目中ARM架构下的量化向量点积计算实现，专注于在ARM
  NEON指令集上高效执行多种量化格式（如Q6_K、IQ2_XXS、IQ2_XS、IQ2_S、IQ3_XXS、IQ3_S、IQ1_S、IQ1_M等）的向量点积运算。文件利用NEON的SIMD指令和查表技术，对量化块数据进行解量化并与Q8_K格式的权重向量进行点积，同时提供了通用回退路径以确保在不同硬件上的兼容性。该文件是ggml库中ARM架构下的量化向量点积实现，包含多个针对不同量化格式（如IQ1_M、IQ4_NL、IQ4_XS）的SIMD优化点积函数，利用NEON指令集加速矩阵乘法运算。
