classes: []
desc: 该文件定义了 Metal 后端上下文的 C 语言公共接口，为 GGML 库提供了 GPU 资源管理与计算调度的抽象层。核心功能包括：初始化和释放 Metal
  设备上下文、同步缓冲数据、异步执行张量拷贝、提交计算图、管理事件同步，以及配置回调、设备族支持检测等底层能力。该头文件作为 C/C++ 边界，将高性能的 Metal
  计算能力封装为稳定的 API，供上层图形计算引擎调用。
file: ggml/src/ggml-metal/ggml-metal-context.h
