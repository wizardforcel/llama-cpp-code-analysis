desc: 该头文件定义了 SYCL 后端中量化张量重排操作的布局结构。它通过模板特化描述了不同量化类型（Q4_0, Q4_K, Q6_K, Q8_0）下，将量化权重（qs）和缩放因子（d）重新排列为连续内存区域时的偏移计算规则，以优化
  SYCL 设备上的内存访问模式。
