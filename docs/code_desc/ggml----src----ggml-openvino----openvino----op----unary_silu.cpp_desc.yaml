classes: []
desc: This file defines the OpenVINO translation of the GGML SILU (Sigmoid Linear
  Unit) operation as an operator implementation. It takes an input tensor, applies
  a sigmoid activation to it, multiplies the input by the sigmoid result, and returns
  the output while preserving naming conventions for the OpenVINO runtime.
file: ggml/src/ggml-openvino/openvino/op/unary_silu.cpp
funcs:
- code:
  - OutputVector translate_unary_silu(const NodeContext & context) {
  - '    num_inputs_check(context, 1, 1);'
  - '    auto input = context.get_input(0);'
  - '    auto sigmoid = std::make_shared<ov::op::v0::Sigmoid>(input);'
  - '    auto res = std::make_shared<ov::op::v1::Multiply>(input, sigmoid);'
  - '    return rename_outputs_with_suffix({res}, context.get_name());'
  - '}'
  desc: Translates a unary SILU (SiLU) operation from GGML to OpenVINO by creating
    a Sigmoid node and a Multiply node, then returns the result with appropriate output
    names.
  line: 14-20
  name: translate_unary_silu
