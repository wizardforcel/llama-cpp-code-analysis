desc: This file contains unit tests for the agentic utility functions `deriveAgenticSections`
  and `hasAgenticContent`. It defines two helper factory functions (`makeAssistant`
  and `makeToolMsg`) to create mock database messages, and includes comprehensive
  test suites that verify the correct derivation of agentic sections (text, reasoning,
  tool calls, streaming tool calls) from assistant messages across single-turn and
  multi-turn scenarios, as well as the detection of agentic content in messages.
