desc: 这个文件是tests/peg-parser/test-json-serialization.cpp，用于测试PEG解析器的JSON序列化功能。它主要构建一个原始PEG解析器，将其转换为JSON格式，再从JSON反序列化回解析器，然后对比原始解析器和反序列化后的解析器在复杂JSON输入上的解析结果是否一致，并执行反序列化的性能基准测试。
file: tests/peg-parser/test-json-serialization.cpp
