    - '    w = weight.reshape(out_features, n_blocks, 8)'
    - '    vals = torch.stack([w & 0x0F, w >> 4], dim=-1).reshape(out_features, n_blocks,
      16)'
    - '    d_ue = scale.view(torch.uint8).numpy().reshape(out_features, n_blocks)
      & 0x7F'
    - '    qs = (vals[:, :, :8] | (vals[:, :, 8:] << 4)).to(torch.uint8).numpy()'
    - '    n_super = n_blocks // 4'
    - '    d_grouped = d_ue.reshape(out_features, n_super, 4)'
    - '    qs_grouped = qs.reshape(out_features, n_super, 4, 8).reshape(out_features,
      n_super, 32)'
    - '    raw = np.concatenate([d_grouped, qs_grouped], axis=-1).reshape(out_features,
      n_super * 36)'
    - '    return raw, [out_features, n_super * 64]'
