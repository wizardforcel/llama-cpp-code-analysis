  name: htp_cumsum_context
desc: 该文件实现了基于Hexagon HVX DSP的cumsum（累加和）运算算子，针对单精度浮点数据提供了两种多线程处理路径：一种是使用DMA进行双缓冲数据搬运的优化版本，另一种是直接访问内存的直通版本。核心算法通过HVX矢量指令实现前缀扫描（prefix
  scan），支持批量计算张量每一行的累积和，并通过工作线程池实现多线程并行处理。
