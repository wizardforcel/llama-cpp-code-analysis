desc: 该文件定义了一个抽象基类GgmlDecoder，用于在OpenVINO前端中将GGML模型序列解析为OpenVINO的内部图结构。它声明了一系列纯虚函数，提供了对模型输入/输出形状、数据类型、操作参数、子图遍历、模型输入/权重映射以及状态管理等功能的统一访问接口，是GGML模型与OpenVINO框架之间转换的抽象层。
