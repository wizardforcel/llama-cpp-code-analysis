desc: This file defines comprehensive tests for GGML operations and backends. It includes
  setup utilities, data initialization functions, tensor conversion helpers, error
  calculation metrics, output formatting structures, and printer classes for different
  output formats (console, SQL, CSV). The code verifies consistency between multiple
  backends computing the same GGML ops, and supports forward pass, backward pass (gradient
  checking), and performance benchmarking modes.该文件是GGML框架的后端算子（backend ops）测试文件，定义了用于测试各种GGML算子在多个后端（如CPU、GPU等）上的支持性、正确性和性能的测试框架。它包含抽象测试基类test_case、多种输出格式的打印器（console/sql/csv），以及大量具体的GGML算子测试定义，通过统一接口评估算子的数值误差、梯度正确性、性能指标等。This
  file contains test cases for individual GGML backend operations, providing parameterized
  test classes deriving from test_case to build compute graphs for each op, initialize
  tensor data, and validate outputs (including gradients where applicable), as well
  as an init_set_rows_row_ids helper function.该文件是 ggml 库的后端操作测试文件，定义了多个测试用例类用于验证不同
  ggml 操作（如张量复制、连续、二元广播、归一化、矩阵乘法等）的正确性。每个测试类都继承自 test_case 基类，并实现了构建计算图和初始化张量的方法，用于在多种后端上测试操作的准确性和梯度计算。This
  file defines a comprehensive test suite for the ggml tensor backend operations.
  It contains multiple test case classes that systematically test various ggml operations
  including matrix multiplication (with and without IDs), softmax, rope (rotary position
  embeddings), pooling, convolution, and mathematical functions like sqrt, log, sin,
  cos, floor etc. Each test case class inherits from the test_case base class and
  implements methods to build computational graphs, initialize tensors, and validate
  results against reference implementations.该文件是 ggml 库的后端操作测试文件（tests/test-backend-ops.cpp）的部分内容，定义了多个测试用例类，用于验证各种
  ggml 操作（如 im2col、卷积、concat、argsort、top_k、MoE、mul_mat 融合、sum、mean、upscale、interpolate、group_norm
