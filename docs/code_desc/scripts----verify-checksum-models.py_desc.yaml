classes: []
desc: 该脚本用于验证指定目录（llama）下所有文件的SHA256校验和是否正确。它读取llama目录下的SHA256SUMS文件，该文件包含每行'哈希值  文件名'的格式。脚本计算每个文件的SHA256哈希，与预期值比较，并输出一个表格显示每个文件的验证结果（有效校验和标记为V，文件缺失标记为X）。
file: scripts/verify-checksum-models.py
funcs:
- code:
  - 'def sha256sum(file):'
  - '    block_size = 16 * 1024 * 1024  # 16 MB block size'
  - '    b = bytearray(block_size)'
  - '    file_hash = hashlib.sha256()'
  - '    mv = memoryview(b)'
  - '    with open(file, ''rb'', buffering=0) as f:'
  - '        while True:'
  - '            n = f.readinto(mv)'
  - '            if not n:'
  - '                break'
  - '            file_hash.update(mv[:n])'
  - '    return file_hash.hexdigest()'
  desc: 计算给定文件的SHA256哈希值。它使用16MB的块大小分块读取文件，存储为哈希并返回十六进制字符串。
