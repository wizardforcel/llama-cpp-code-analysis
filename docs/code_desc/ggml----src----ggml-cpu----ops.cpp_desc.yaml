desc: 该文件是 ggml CPU 后端的张量算子实现文件，主要负责张量复制、数据类型转换、量化与反量化，以及加法、带索引加法和标量加法等前向计算。实现通过模板、类型分派、行级多线程划分、连续内存快速路径、步长寻址和
  SIMD 向量操作来支持 F16、BF16、F32、I32 及多种量化类型。当前提供的代码片段在 ggml_compute_forward_add1_bf16_bf16
  函数中被截断。该代码片段来自 ggml CPU 后端算子实现文件 ops.cpp，主要负责在 CPU 上执行张量的标量加法、累加、求和、累积和、按行求和、均值、最大值索引、相等元素计数、张量重复、重复反向累加、张量拼接和
  GELU 激活等操作。实现针对 F32、F16、BF16、整数及多种量化类型提供类型分派，并通过张量步长、维度信息和线程范围实现多维数据访问与并行计算。该代码片段来自
  ggml CPU 后端算子实现文件 ops.cpp，主要负责在 CPU 上执行多种神经网络张量运算，包括 GELU、Fill、Tri、GELU-Erf、Quick-GELU、SiLU、Leaky
  ReLU、SiLU 反向传播，以及 ReGLU、GeGLU、SwiGLU 和 SwiGLU-OAI 等激活函数。实现通常按照 F32/F16 数据类型分派到底层向量化函数，并依据线程编号划分行区间以支持多线程计算，同时在调试构建中检查结果是否出现
  NaN 或 Inf。该文件是 ggml 库中 CPU 前向计算操作的核心实现，包含多个神经网络层的计算函数，如 GEGLU 激活函数、归一化操作（norm、rms_norm、group_norm、l2_norm）以及外积（out_prod）运算。文件中的每个函数负责在
  CPU 上高效地执行相应的张量运算，支持不同数据类型（如 F32、F16）和并行计算。该代码是 ggml 计算库中 CPU 前向传播操作的实现，包含 scale、set、cpy、cont、get_rows、set_rows、get_rows_back、diag、diag_mask_inf、diag_mask_zero、soft_max、soft_max_ext_back
  和 clamp 等张量运算的前向计算函数。每个操作根据输入张量的数据类型（如 F32、F16、BF16 和量化类型）进行分派，执行相应的数据处理、内存拷贝或元素级数学运算。该文件是
  ggml 库中 CPU 后端操作计算的实现文件（ops.cpp），核心功能是定义并实现各种张量操作的前向和反向计算函数，包括 RoPE 旋转位置编码、一维转置卷积、im2col
  图像到列转换及其反向传播等。这些函数作为计算图中的算子，针对不同的输入数据类型（如 F16、F32）进行分派和优化计算。该文件是 ggml 神经网络推理库中 CPU
  后端操作符实现的一部分，集中定义了卷积、池化等核心算子的前向计算函数。文件包含 2D/3D 卷积、2D 转置卷积、2D 深度可分离卷积、1D/2D 池化及池化反向等操作的实现，通过
  im2col 转换与矩阵乘法结合的方式高效执行运算，并对不同数据类型和内存布局进行了分别处理和优化。该文件定义了 ggml 库中 CPU 后端的各种张量操作（ops）的前向和反向计算函数，包括池化（pooling）、上采样（upscale）、填充（pad）、翻转（roll）、等差数列生成（arange）、时间步嵌入（timestep
  embedding）、排序（argsort）、Top-K 选择以及 Flash Attention 的扩展实现。这些函数通常以 'ggml_compute_forward_'
  开头，负责执行相应的数学运算，并支持多线程并行处理。该文件是ggml-cpu后端中处理多种神经网络算子的核心实现文件，主要包含flash attention（快速注意力机制）的前向和反向传播计算、SSM（状态空间模型）卷积操作等关键算法的CPU实现。该文件是
  ggml CPU 推理库中 ops.cpp 的一部分，实现了多种神经网络算子的前向计算函数，包括 SSM 卷积/扫描、窗口划分/合并、相对位置编码、RWKV 和
  GLA 等。这些函数根据张量类型分发到具体的浮点实现，并利用 SIMD 指令进行优化。该文件是ggml库中CPU后端的算子实现文件，包含多个神经网络前向计算算子的核心实现，如GLA（Gated
  Linear Attention）、gated_delta_net、RWKV-WKV7等新型注意力机制算子，以及cross_entropy_loss损失函数和AdamW、SGD优化器步进算子的forward计算逻辑。这些算子针对不同SIMD架构（如SVE、RVV）进行了优化，实现了高效的多线程并行计算。该文件实现了ggml计算图中的前向计算操作，专注于优化器步进操作（如AdamW和SGD）的核心计算逻辑。它根据源张量的数据类型（当前仅支持F32）分派到对应的具体实现，进行权重更新计算。
