  - '    for (int64_t q_head = ith; q_head < n_q_heads; q_head += nth) {'
  - '        float   M_final   = -INFINITY;'
  - '        float   S_final   = 0.0f;'
  - '        float * VKQ_final = thread_wdata;'
  - '        memset(VKQ_final, 0, DV * sizeof(float));'
  - ''
