  - ''
  - '    const int64_t partials_offset  = nth * (DK + 2*DV + CACHE_LINE_SIZE_F32);'
  - '    const int64_t partial_size     = 2 + DV;'
  - '    const float * partials_base    = (const float *) params->wdata + partials_offset;'
  - ''
