desc: 这个文件实现了 llama 模型加载器的核心功能，负责从 GGUF 格式的模型文件中读取元数据和张量信息，管理多个分片文件的加载，并提供了一系列用于查询和覆盖模型元数据的模板方法。它包含了
  GGUF 元数据访问模板类 GKV、模型加载器类 llama_model_loader，以及若干辅助的全局函数。该文件定义并实现了llama_model_loader类，用于加载和解析GGUF格式的LLaMA模型，包括读取模型元数据、创建张量、映射文件数据到内存以及加载模型权重数据，同时提供了张量缓冲区类型选择和异步加载等高级功能。该文件是llama模型加载器的一部分，实现了模型的底层加载、张量数据解析、校验和内存管理功能。它负责从模型文件中读取张量数据，通过异步上传机制将数据加载到后端缓冲区，并确保数据的完整性和正确性。
