desc: 该文件是 ggml 项目中 virtgpu 后端（ggml-virtgpu）的头文件，定义了远程内存访问（remoting）后端的设备上下文、缓冲区上下文结构体，以及相关的宏定义、外部接口声明和内联辅助函数。其核心功能是为
  GGML（ggerganov 的机器学习库）提供基于 virtgpu（虚拟 GPU）的远程内存后端支持，通过抽象设备、缓冲区类型和句柄转换机制，实现 GPU 加速的张量计算与内存管理。
