classes:
- desc: 该类的实例负责构建 Granite Hybrid 模型的计算图。它继承自 llm_build_mamba_base 基类，通过构造函数遍历所有层，根据层类型（recurrent
    或 attention）调用相应的构建函数，并最终生成 logits 输出。
  methods:
  - code:
    - 'llm_build_granite_hybrid::llm_build_granite_hybrid(const llama_model & model,
      const llm_graph_params & params) :'
    - '    llm_build_mamba_base(params) {'
    - '    const int64_t n_embd_head = hparams.n_embd_head_v();'
    - '    GGML_ASSERT(n_embd_head == hparams.n_embd_head_k());'
    - '    ggml_tensor * cur;'
    - '    ggml_tensor * inpL;'
    - '    inpL = build_inp_embd(model.tok_embd);'
    - '    auto * inp = build_inp_mem_hybrid();'
    - '    ggml_tensor * inp_out_ids = build_inp_out_ids();'
    - '    ggml_tensor * inp_pos = nullptr;'
    - '    if (hparams.rope_finetuned) {'
    - '        inp_pos = build_inp_pos();'
    - '    }'
    - '    for (int il = 0; il < n_layer; ++il) {'
    - '        struct ggml_tensor * inpSA = inpL;'
    - '        cur = build_norm(inpL, model.layers[il].attn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        cb(cur, "attn_norm", il);'
    - '        if (hparams.is_recurrent(il)) {'
    - '            cur = build_mamba2_layer(inp->get_recr(), cur, model, ubatch, il);'
    - '        } else {'
    - '            cur = build_attention_layer(cur, inp_pos, inp->get_attn(), model,
      n_embd_head, il);'
    - '        }'
    - '        if (il == n_layer - 1 && inp_out_ids) {'
    - '            cur   = ggml_get_rows(ctx0, cur, inp_out_ids);'
    - '            inpSA = ggml_get_rows(ctx0, inpSA, inp_out_ids);'
    - '        }'
    - '        cur = build_layer_ffn(cur, inpSA, model, il);'
    - '        inpL = cur;'
    - '    }'
    - '    cur = inpL;'
    - '    cur = build_norm(cur, model.output_norm, NULL, LLM_NORM_RMS, -1);'
    - '    cb(cur, "result_norm", -1);'
    - '    res->t_embd = cur;'
    - '    cur = build_lora_mm(model.output, cur);'
    - '    if (hparams.f_logit_scale) {'
    - '        cur = ggml_scale(ctx0, cur, 1.0f / hparams.f_logit_scale);'
    - '    }'
    - '    cb(cur, "result_output", -1);'
    - '    res->t_logits = cur;'
    - '    ggml_build_forward_expand(gf, cur);'
    - '}'
    desc: 构造函数：初始化模型计算图，依次构建输入嵌入、内存、输出 ID 和位置嵌入，然后循环构建每一层（包括注意力层、SSM 层和 FFN 层），最后构建归一化层和输出层，并设置最终的
      logits 张量。
    line: 3-38
    name: llm_build_granite_hybrid
  - code:
    - ggml_tensor * llm_build_granite_hybrid::build_attention_layer(ggml_tensor *             cur,
    - '                                                              ggml_tensor *             inp_pos,'
    - '                                                              llm_graph_input_attn_kv
      * inp_attn,'
    - '                                                              const llama_model
      &       model,'
    - '                                                              const int64_t             n_embd_head,'
    - '                                                              const int                 il)
      {'
    - '    ggml_tensor * Qcur = build_lora_mm(model.layers[il].wq, cur);'
    - '    cb(Qcur, "Qcur", il);'
    - '    if (model.layers[il].bq) {'
    - '        Qcur = ggml_add(ctx0, Qcur, model.layers[il].bq);'
    - '        cb(Qcur, "Qcur", il);'
    - '    }'
    - '    ggml_tensor * Kcur = build_lora_mm(model.layers[il].wk, cur);'
    - '    cb(Kcur, "Kcur", il);'
    - '    if (model.layers[il].bk) {'
    - '        Kcur = ggml_add(ctx0, Kcur, model.layers[il].bk);'
    - '        cb(Kcur, "Kcur", il);'
    - '    }'
    - '    ggml_tensor * Vcur = build_lora_mm(model.layers[il].wv, cur);'
    - '    cb(Vcur, "Vcur", il);'
    - '    if (model.layers[il].bv) {'
    - '        Vcur = ggml_add(ctx0, Vcur, model.layers[il].bv);'
    - '        cb(Vcur, "Vcur", il);'
    - '    }'
    - '    Qcur = ggml_reshape_3d(ctx0, Qcur, n_embd_head, hparams.n_head(il), n_tokens);'
    - '    Kcur = ggml_reshape_3d(ctx0, Kcur, n_embd_head, hparams.n_head_kv(il),
      n_tokens);'
    - '    Vcur = ggml_reshape_3d(ctx0, Vcur, n_embd_head, hparams.n_head_kv(il),
      n_tokens);'
    - '    const bool use_rope = hparams.rope_finetuned;'
    - '    if (use_rope) {'
    - '        ggml_tensor * rope_factors = model.get_rope_factors(cparams, il);'
    - '        Qcur = ggml_rope_ext(ctx0, Qcur, inp_pos, rope_factors, n_rot, rope_type,
      n_ctx_orig, freq_base, freq_scale,'
    - '                             ext_factor, attn_factor, beta_fast, beta_slow);'
    - '        Kcur = ggml_rope_ext(ctx0, Kcur, inp_pos, rope_factors, n_rot, rope_type,
      n_ctx_orig, freq_base, freq_scale,'
    - '                             ext_factor, attn_factor, beta_fast, beta_slow);'
    - '    }'
    - '    cb(Qcur, "Qcur", il);'
    - '    cb(Kcur, "Kcur", il);'
    - '    cb(Vcur, "Vcur", il);'
    - '    const float kq_scale ='
    - '        hparams.f_attention_scale == 0.0f ? 1.0f / sqrtf(float(n_embd_head))
      : hparams.f_attention_scale;'
    - '    cur = build_attn(inp_attn,'
    - '            model.layers[il].wo, model.layers[il].bo,'
    - '            Qcur, Kcur, Vcur, nullptr, nullptr, nullptr, kq_scale, il);'
    - '    cb(cur, "attn_out", il);'
    - '    return cur;'
    - '}'
    desc: 构建一个标准的注意力层。该函数接收输入张量，通过线性投影（LoRA）生成 Q、K、V 向量，进行 reshape，可选地应用 RoPE 位置编码，然后调用
      build_attn 执行注意力计算（包括输出投影）。
    line: 40-103
    name: build_attention_layer
  - code:
    - ggml_tensor * llm_build_granite_hybrid::build_layer_ffn(ggml_tensor *       cur,
    - '                                                        ggml_tensor *       inpSA,'
    - '                                                        const llama_model &
      model,'
    - '                                                        const int           il)
      {'
    - '    if (hparams.f_residual_scale) {'
    - '        cur = ggml_scale(ctx0, cur, hparams.f_residual_scale);'
    - '    }'
    - '    ggml_tensor * ffn_inp = ggml_add(ctx0, cur, inpSA);'
    - '    cb(ffn_inp, "ffn_inp", il);'
    - '    if (model.layers[il].ffn_gate_inp == nullptr) {'
    - '        cur = build_norm(ffn_inp, model.layers[il].ffn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        cb(cur, "ffn_norm", il);'
    - '        cur = build_ffn(cur,'
    - '                model.layers[il].ffn_up, model.layers[il].ffn_up_b, NULL,'
    - '                model.layers[il].ffn_gate, model.layers[il].ffn_gate_b, NULL,'
    - '                model.layers[il].ffn_down, model.layers[il].ffn_down_b, NULL,'
    - '                NULL, LLM_FFN_SILU, LLM_FFN_PAR, il);'
    - '        cb(cur, "ffn_out", il);'
    - '    } else {'
    - '        cur = build_norm(ffn_inp, model.layers[il].ffn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        cb(cur, "ffn_norm", il);'
    - '        ggml_tensor * moe_out ='
    - '            build_moe_ffn(cur,'
    - '                model.layers[il].ffn_gate_inp,'
    - '                model.layers[il].ffn_up_exps,'
    - '                model.layers[il].ffn_gate_exps,'
    - '                model.layers[il].ffn_down_exps,'
    - '                nullptr,'
    - '                n_expert, n_expert_used,'
    - '                LLM_FFN_SILU, true,'
    - '                hparams.expert_weights_scale,'
    - '                LLAMA_EXPERT_GATING_FUNC_TYPE_SOFTMAX,'
    - '                il);'
    - '        cb(moe_out, "ffn_moe_out", il);'
    - '        if (hparams.n_ff_shexp > 0) {'
    - '            ggml_tensor * ffn_shexp ='
    - '                build_ffn(cur,'
    - '                    model.layers[il].ffn_up_shexp, NULL, NULL,'
    - '                    model.layers[il].ffn_gate_shexp, NULL, NULL,'
    - '                    model.layers[il].ffn_down_shexp, NULL, NULL,'
    - '                    NULL, LLM_FFN_SILU, LLM_FFN_PAR, il);'
    - '            cb(ffn_shexp, "ffn_shexp", il);'
    - '            cur = ggml_add(ctx0, moe_out, ffn_shexp);'
    - '            cb(cur, "ffn_out", il);'
    - '        } else {'
    - '            cur = moe_out;'
    - '        }'
    - '    }'
    - '    if (hparams.f_residual_scale) {'
    - '        cur = ggml_scale(ctx0, cur, hparams.f_residual_scale);'
    - '    }'
    - '    cur = ggml_add(ctx0, cur, ffn_inp);'
    - '    cb(cur, "ffn_out", il);'
    - '    cur = build_cvec(cur, il);'
    - '    cb(cur, "l_out", il);'
    - '    return cur;'
    - '}'
    desc: 构建一个 FFN 层（Feed-Forward Network），可能包含 MoE 分支和共享专家（Shared Experts）。该函数首先处理残差连接（可选缩放），然后根据是否有门控专家输入（ffn_gate_inp）选择标准
      FFN 或 MoE FFN，最后叠加残差和进行控制向量处理。
    line: 105-160
    name: build_layer_ffn
  name: llm_build_granite_hybrid
desc: 该文件实现了 Granite Hybrid 模型的推理图构建逻辑。Granite Hybrid 是一种混合架构，在序列的不同层中交替使用 Mamba2
  状态空间模型（SSM）层和标准注意力层，同时包含 FFN（包括 MoE 变体）。该代码负责将这些层按特定顺序拼接成计算图，处理输入嵌入、位置编码（RoPE）、残差连接、归一化、logits
  输出等，并支持可选的 logit 和残差缩放调优参数。
