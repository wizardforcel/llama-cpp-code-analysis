    name: llm_build_mpt
  name: llm_build_mpt
desc: 该文件实现了 MPT（Mosaic Pretrained Transformer）模型的图构建逻辑，继承 llm_graph_context 类，在构造函数中通过一系列
  llm_build_ 工具函数构建模型的推理计算图，包括词嵌入、位置编码、多层自注意力和前馈网络，最终输出 logits。
