- desc: A structure that defines a single backend sampling test case with a name,
    a function pointer to the test implementation, and a flag indicating whether the
    test is enabled by default.
  methods: []
  name: backend_test_case
desc: This file is a test suite for the llama.cpp backend sampler functionality. It
  contains a series of test cases that verify the correctness of various sampling
  strategies (e.g., greedy, top-k, temperature, top-p, min-p, and distribution-based
  sampling) when performed on the GPU/CPU backend, including multi-sequence scenarios
  and hybrid (backend + CPU) sampling approaches.The file tests/test-backend-sampler.cpp
  contains backend sampling tests for the llama.cpp library, verifying that backend
  sampler chains work correctly with various sampling strategies including greedy,
  logit bias, temperature, top-k, top-p, min-p, distribution sampling, multi-sequence
  sampling, mixed CPU/backend sampling, and sampler lifecycle management (set, clear,
  reset). The test framework provides a command-line interface to select individual
  tests, collects them for execution, and validates correctness through assertions
  and debug output.
file: tests/test-backend-sampler.cpp
