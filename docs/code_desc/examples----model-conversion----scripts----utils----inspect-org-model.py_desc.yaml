desc: 该文件提供了一个命令行工具，用于检查和列举 Safetensors 格式机器学习模型的张量信息。它支持列出所有张量（完整或简化模式）、显示张量的数据类型、形状和大小，以及检查单个张量的具体信息（如数值）。该工具旨在帮助用户理解和分析模型结构，尤其在模型转换和调试过程中发挥作用。
