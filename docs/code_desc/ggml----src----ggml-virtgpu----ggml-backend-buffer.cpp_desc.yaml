desc: 该文件实现了ggml后端在virtgpu远程管理场景下的缓冲区接口，包含了一组静态函数用于缓冲区的基础地址获取、张量数据的读写、拷贝与清除操作，并通过两个全局缓冲区接口函数表（普通和从指针创建）分发这些操作。
