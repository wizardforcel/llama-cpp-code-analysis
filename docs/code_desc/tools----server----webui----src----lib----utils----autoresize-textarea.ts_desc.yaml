desc: 该文件提供了一个工具函数，用于根据内容自动调整 HTML textarea 元素的高度，确保输入框能够动态扩展以显示所有内容，避免滚动条的出现。
file: tools/server/webui/src/lib/utils/autoresize-textarea.ts
funcs:
- code:
  - 'export default function autoResizeTextarea(textareaElement: HTMLTextAreaElement
    | null): void {'
  - "\tif (textareaElement) {"
  - "\t\ttextareaElement.style.height = '1rem';"
  - "\t\ttextareaElement.style.height = textareaElement.scrollHeight + 'px';"
  - "\t}"
  - '}'
  desc: 自动调整 textarea 元素的高度以适应其内容，通过先将高度设置为最小值，再根据 scrollHeight 计算实际所需高度
  line: 6-12
  name: autoResizeTextarea
