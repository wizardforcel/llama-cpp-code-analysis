desc: 该文件是 llama-io.h，定义了两个抽象接口类 llama_io_write_i 和 llama_io_read_i，用于对模型数据的序列化写入与反序列化读取进行抽象。写入接口负责将字节数据或张量数据写入流，并统计已写字节数；读取接口负责从流中读取字节数据或张量数据，并统计已读字节数。两个接口都提供了字符串读写的便捷方法，以便于模型元数据（如字符串类型的头信息）的间接传递。该文件是
  llama.cpp 项目 I/O 抽象层次的核心头文件，供模型保存与加载模块实现具体功能。
