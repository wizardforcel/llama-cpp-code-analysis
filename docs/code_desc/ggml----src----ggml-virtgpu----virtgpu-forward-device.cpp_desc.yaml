classes: []
desc: 该文件是ggml VirtGPU前向设备实现的一部分，定义了通过远程过程调用(RPC)与主机端GPU服务通信的设备API函数。这些函数封装了设备查询、内存管理和缓冲区操作等基本功能，通过编码器-解码器模式实现序列化通信，使客户端能够以透明方式访问远程GPU设备能力。
file: ggml/src/ggml-virtgpu/virtgpu-forward-device.cpp
funcs:
- code:
  - int apir_device_get_count(virtgpu * gpu) {
  - '    apir_encoder *        encoder;'
  - '    apir_decoder *        decoder;'
  - '    ApirForwardReturnCode ret;'
  - ''
  - '    REMOTE_CALL_PREPARE(gpu, encoder, APIR_COMMAND_TYPE_DEVICE_GET_COUNT);'
  - '    REMOTE_CALL(gpu, encoder, decoder, ret);'
  - ''
  - '    int32_t dev_count = -1;'
  - '    apir_decode_int32_t(decoder, &dev_count);'
  - ''
  - '    remote_call_finish(gpu, encoder, decoder);'
  - ''
  - '    return dev_count;'
  - '}'
  desc: 获取远程GPU设备的数量，通过RPC调用主机端服务，将返回的int32值解码并返回。
