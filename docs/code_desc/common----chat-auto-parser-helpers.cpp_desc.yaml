  - diff_split calculate_diff_split(const std::string & left, const std::string &
    right) {
  - '    diff_split result;'
  - '    auto left_seg = segmentize_markers(left);'
  - '    auto right_seg = segmentize_markers(right);'
  - '    if (left_seg.empty()) {'
  - '        result.right = right;'
  - '        return result;'
  - '    }'
  - '    if (right_seg.empty()) {'
  - '        result.left = left;'
  - '        return result;'
  - '    }'
  - '    auto left_start = left_seg.begin();'
  - '    auto left_end = --left_seg.end();'
  - '    auto right_start = right_seg.begin();'
  - '    auto right_end = --right_seg.end();'
  - '    auto test = [&] () {'
  - '        return left_start != left_end && right_start != right_end;'
  - '    };'
  - '    bool left_fully_consumed = false;'
  - '    bool right_fully_consumed = false;'
  - '    while (test()) {'
  - '        bool advanced = false;'
  - '        if (*left_start == *right_start) {'
  - '            result.prefix.append(left_start->value);'
  - '            left_start++;'
  - '            right_start++;'
  - '            advanced = true;'
  - '        }'
  - '        if (*left_end == *right_end) {'
  - '            result.suffix = left_end->value + result.suffix;'
  - '            if (left_start != left_end) {'
  - '                left_end--;'
  - '            } else {'
  - '                left_fully_consumed = true;'
  - '            }'
  - '            if (right_start != right_end) {'
  - '                right_end--;'
  - '            } else {'
  - '                right_fully_consumed = true;'
  - '            }'
  - '            advanced = true;'
  - '        }'
  - '        if (!advanced) {'
  - '            break;'
  - '        }'
  - '    }'
  - '    if (left_start == left_end && right_start != right_end) {'
  - '        if (*left_start == *right_end) {'
  - '            result.suffix = right_end->value + result.suffix;'
  - '            right_end--;'
  - '            left_fully_consumed = true;'
  - '        } else if (*left_start == *right_start) {'
  - '            result.prefix.append(right_start->value);'
  - '            right_start++;'
  - '            left_fully_consumed = true;'
  - '        }'
  - '    } else if (right_start == right_end && left_start != left_end) {'
  - '        if (*left_end == *right_start) {'
  - '            result.suffix = left_end->value + result.suffix;'
  - '            left_end--;'
  - '            right_fully_consumed = true;'
  - '        } else if (*left_start == *right_start) {'
  - '            result.prefix.append(left_start->value);'
  - '            left_start++;'
  - '            right_fully_consumed = true;'
  - '        }'
  - '    } else if (left_start == left_end && right_start == right_end && *left_start
    == *right_start && left_start->type == segment_type::MARKER) {'
  - '        result.prefix.append(right_start->value);'
  - '        left_fully_consumed = true;'
  - '        right_fully_consumed = true;'
  - '    }'
  - '    auto eat_segment = [](std::string str, const segment & seg) -> std::string
    { return std::move(str) + seg.value; };'
  - '    bool can_have_text_suffix = left_end->type == segment_type::TEXT && right_end->type
    == segment_type::TEXT;'
  - '    bool can_have_text_prefix = right_start->type == segment_type::TEXT && left_start->type
    == segment_type::TEXT;'
  - '    std::string remainder_left = std::accumulate(left_start, left_fully_consumed
    ? left_end : ++left_end, std::string(), eat_segment);'
  - '    std::string remainder_right = std::accumulate(right_start, right_fully_consumed
    ? right_end : ++right_end, std::string(), eat_segment);'
  - '    size_t suffix_len = can_have_text_suffix ? common_suffix_len(remainder_left,
    remainder_right) : 0;'
  - '    size_t prefix_len = can_have_text_prefix ? common_prefix_len(remainder_left.substr(0,
    remainder_left.size() - suffix_len),'
  - '        remainder_right.substr(0, remainder_right.size() - suffix_len)) : 0;'
  - '    result.prefix.append(remainder_left.substr(0, prefix_len));'
  - '    result.suffix = remainder_left.substr(remainder_left.length() - suffix_len,
    suffix_len) + result.suffix;'
  - '    result.left = remainder_left.substr(prefix_len, remainder_left.length() -
    prefix_len - suffix_len);'
  - '    result.right = remainder_right.substr(prefix_len, remainder_right.length()
    - prefix_len - suffix_len);'
  - '    if (result.left == "" && result.right == "") {'
  - '        result.prefix = left;'
  - '        result.suffix = "";'
  - '    }'
  - '    if (result.left.empty() && !result.right.empty() &&'
  - '            left.size() <= right.size() &&'
  - '            right.substr(0, left.size()) == left) {'
  - '        result.prefix = left;'
  - '        result.suffix = "";'
  - '        result.right  = right.substr(left.size());'
  - '    }'
  - '    return result;'
  - '}'
