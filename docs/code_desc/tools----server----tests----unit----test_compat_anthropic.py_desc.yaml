desc: 该文件是针对 llama.cpp 服务器 Anthropic 兼容 API 端点的综合单元测试套件。它验证了消息传递、流式处理、工具调用、视觉支持、参数处理以及推理模型思维块输出等功能的正确性。测试利用一个模拟服务器进程夹具（ServerPreset）来启动配置的服务器实例，并通过
  HTTP 请求验证响应的结构、状态码和内容，从而确保 Anthropic 格式的 API 能被正确实现并与 OpenAI 格式有所区分。该文件是 Anthropic
  API 兼容性的单元测试文件，核心功能是对 tools/server 项目中 Anthropic 兼容端点进行测试，验证响应内容块（如文本块）的存在性和正确性，确保与
  Anthropic API 的返回格式一致。
