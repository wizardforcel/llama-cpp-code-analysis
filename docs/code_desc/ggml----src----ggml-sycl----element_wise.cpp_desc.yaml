  - '    const int64_t i12 = tmp / s12;'
  - '    tmp -= i12 * s12;'
  - '    const int64_t i11 = tmp / s11;'
  - '    tmp -= i11 * s11;'
  - '    const int64_t i10 = tmp;'
  - '    float val = x[i];'
