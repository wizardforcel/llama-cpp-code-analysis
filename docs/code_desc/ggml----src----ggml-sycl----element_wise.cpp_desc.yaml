desc: This file implements element-wise operations (unary, binary, and fused GLU variants)
  for the SYCL backend of ggml, defining kernels and dispatch functions for operations
  such as sigmoid, GELU, ReLU, arithmetic functions, accumulation, and gated linear
  units, supporting both half and float precision.该文件为 SYCL 后端实现了各种逐元素操作的 GPU 内核调度逻辑，覆盖多种数学函数（如
  sqrt、sin、cos、gelu、silu、exp、log 等）和融合门控激活函数（如 geglu、reglu、swiglu 等），每个操作通过统一的模板化调度机制将计算任务分发到
  SYCL 设备上执行。
