  - '    file_endian = reader.endianess.name'
  - '    if reader.byte_order == ''S'':'
  - '        host_endian = ''BIG'' if file_endian == ''LITTLE'' else ''LITTLE'''
  - '    else:'
  - '        host_endian = file_endian'
  - '    order = host_endian if args.order == "native" else args.order.upper()'
  - '    logger.info(f"* Host is {host_endian} endian, GGUF file seems to be {file_endian}
    endian")'
  - '    if file_endian == order:'
  - '        logger.info(f"* File is already {order} endian. Nothing to do.")'
  - '        sys.exit(0)'
  - '    logger.info("* Checking tensors for conversion compatibility")'
  - '    for tensor in reader.tensors:'
  - '        if tensor.tensor_type not in byteswap_tensors and \'
  - '           tensor.tensor_type not in ('
  - '                gguf.GGMLQuantizationType.F32,'
  - '                gguf.GGMLQuantizationType.F16,'
  - '                gguf.GGMLQuantizationType.BF16,'
  - '           ):'
  - '            raise ValueError(f"Cannot handle type {tensor.tensor_type.name} for
    tensor {repr(tensor.name)}")'
  - '    logger.info(f"* Preparing to convert from {file_endian} to {order}")'
  - '    if args.dry_run:'
  - '        return'
  - '    logger.warning("*** Warning *** Warning *** Warning **")'
  - '    logger.warning("* This conversion process may damage the file. Ensure you
