  - '    if order != host_endian:'
  - '        logger.warning("* Requested endian differs from host, you will not be
    able to load the model on this machine.")'
  - '    logger.warning("* The file will be modified immediately, so if conversion
    fails or is interrupted")'
  - '    logger.warning("* the file will be corrupted. Enter exactly YES if you are
    positive you want to proceed:")'
  - '    response = input("YES, I am sure> ")'
  - '    if response != "YES":'
  - '        logger.warning("You didn''t enter YES. Okay then, see ya!")'
  - '        sys.exit(0)'
  - '    logger.info(f"* Converting fields ({len(reader.fields)})")'
  - '    for idx, field in enumerate(reader.fields.values()):'
  - '        logger.info(f"- {idx:4}: Converting field {repr(field.name)}, part count:
    {len(field.parts)}")'
  - '        for part in field.parts:'
  - '            part.byteswap(inplace=True)'
  - '    logger.info(f"* Converting tensors ({len(reader.tensors)})")'
  - ''
  - '    for idx, tensor in enumerate(pbar := tqdm(reader.tensors, desc="Converting
    tensor")):'
  - '        log_message = ('
  - '            f"Converting tensor {repr(tensor.name)}, "'
  - '            f"type={tensor.tensor_type.name}, "'
  - '            f"elements={tensor.n_elements} "'
  - '        )'
  - ''
  - '        # Byte-swap each part of the tensor''s field'
  - '        for part in tensor.field.parts:'
  - '            part.byteswap(inplace=True)'
  - ''
  - '        # Byte-swap tensor data if necessary'
  - '        if tensor.tensor_type in byteswap_tensors:'
  - '            # first flatten structure'
  - '            oldshape = tensor.data.shape'
  - '            newshape = 1'
  - '            for i in tensor.data.shape:'
  - '                newshape *= i'
  - ''
  - '            tensor.data.resize(newshape)'
  - ''
  - '            block_size    = gguf.constants.GGML_QUANT_SIZES[tensor.tensor_type][1]'
  - '            byteswap_func = byteswap_tensors[tensor.tensor_type]'
  - ''
  - '            n_blocks = len(tensor.data) // block_size'
  - '            for block_num in (inner_pbar := tqdm(range(n_blocks), desc="Byte-swapping
    Blocks", leave=False)):'
  - '                block_offs = block_num * block_size'
  - ''
  - '                byteswap_func(tensor, block_offs)'
  - ''
  - '                if block_num % 100000 == 0:'
  - '                    inner_pbar.set_description(f"Byte-swapping Blocks [{(n_blocks
