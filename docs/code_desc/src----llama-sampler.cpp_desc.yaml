desc: The file defines the sampler framework and implementations for the llama inference
  engine. It provides the core API for creating, managing, and applying samplers,
  which are responsible for selecting the next token from a probability distribution.
  It implements a ring buffer utility, various sampling algorithms (greedy, distribution-based),
  and a chain mechanism to sequentially apply multiple samplers, including both CPU
  and backend-accelerated variants.该文件是 llama-sampler.cpp，实现了 llama.cpp 中的各种采样器（sampler），包括
  top-k、top-p、min-p、typical、temperature、temperature-ext 和 xtc 等采样策略，以及对应的后端（backend）采样实现，用于根据模型输出的
  logits 生成受限的 token 候选集。该文件实现了llama.cpp推理引擎中的采样器（sampler）模块，定义了多种token采样策略，包括XTC、Mirostat（v1/v2）、语法约束、重复惩罚、Top-N-Sigma和DRY去重等，每个采样器通过统一的接口（llama_sampler_i）实现初始化、应用、克隆、重置和释放操作。该文件实现了LLM推理中多种采样策略的采样器，包括DRY
  (Don't Repeat Yourself)、Adaptive-P、Logit-Bias和Infill，以及采样性能统计和种子获取等工具函数。每个采样器都遵循统一的llama_sampler接口，实现了名称获取、应用、接受、重置、克隆和释放等标准操作，部分采样器还支持硬件后端加速。
