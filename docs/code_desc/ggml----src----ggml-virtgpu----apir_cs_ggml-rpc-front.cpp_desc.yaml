classes: []
desc: 该文件位于ggml虚拟GPU后端，提供tensor和计算图的远程过程调用（RPC）序列化功能，用于将ggml张量及其依赖树转换为跨进程/机器传输的二进制数据，并支持通过缓冲区句柄进行张量数据偏移寻址。
file: ggml/src/ggml-virtgpu/apir_cs_ggml-rpc-front.cpp
funcs:
- code:
  - apir_rpc_tensor apir_serialize_tensor(const ggml_tensor * tensor) {
  - '    apir_rpc_tensor result;'
  - '    result.id   = reinterpret_cast<uint64_t>(tensor);'
  - '    result.type = tensor->type;'
  - '    if (tensor->buffer) {'
  - '        ggml_backend_buffer_t buffer = tensor->buffer;'
  - '        result.buffer = BUFFER_TO_HOST_HANDLE(buffer);'
  - '    } else {'
  - '        result.buffer = 0;'
  - '    }'
  - '    for (uint32_t i = 0; i < GGML_MAX_DIMS; i++) {'
  - '        result.ne[i] = tensor->ne[i];'
  - '        result.nb[i] = tensor->nb[i];'
  - '    }'
  - '    result.op = tensor->op;'
  - '    for (uint32_t i = 0; i < GGML_MAX_OP_PARAMS / sizeof(int32_t); i++) {'
  - '        result.op_params[i] = tensor->op_params[i];'
  - '    }'
  - '    result.flags = tensor->flags;'
  - '    for (uint32_t i = 0; i < GGML_MAX_SRC; i++) {'
  - '        result.src[i] = reinterpret_cast<uint64_t>(tensor->src[i]);'
  - '    }'
  - '    result.view_src  = reinterpret_cast<uint64_t>(tensor->view_src);'
  - '    result.view_offs = tensor->view_offs;'
  - '    result.data      = reinterpret_cast<uint64_t>(tensor->data);'
  - '    if (tensor->data) {'
  - '        if (!tensor->buffer) {'
  - '            GGML_ABORT("%s: tensor has data but not buffer", __func__);'
  - '        }'
  - '        // tensor->data is serialized as an offset to the buffer base address'
  - '        result.data -= reinterpret_cast<uint64_t>(BUFFER_TO_GGML_CONTEXT(tensor->buffer)->base);'
  - '    }'
  - '    snprintf(result.name, GGML_MAX_NAME, "%s", tensor->name);'
  - '    return result;'
  - '}'
  desc: 将单个ggml_tensor序列化为apir_rpc_tensor格式，提取张量的元数据（维度、步长、操作类型、参数、源张量、视图信息等），并将数据地址转换为相对于缓冲区基址的偏移量。
