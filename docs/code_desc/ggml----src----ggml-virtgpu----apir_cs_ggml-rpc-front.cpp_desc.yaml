- code:
  - void apir_add_tensor(ggml_tensor *                       tensor,
  - '                     std::vector<apir_rpc_tensor> &      tensors,'
  - '                     std::unordered_set<ggml_tensor *> & visited) {'
  - '    if (tensor == nullptr) {'
  - '        return;'
  - '    }'
  - '    if (visited.find(tensor) != visited.end()) {'
  - '        return;'
  - '    }'
  - '    visited.insert(tensor);'
  - '    for (int i = 0; i < GGML_MAX_SRC; i++) {'
  - '        apir_add_tensor(tensor->src[i], tensors, visited);'
  - '    }'
  - '    apir_add_tensor(tensor->view_src, tensors, visited);'
  - '    tensors.push_back(apir_serialize_tensor(tensor));'
  - '}'
  desc: 递归地将张量及其所有依赖（源张量和视图源）添加到序列化列表中，并使用访问集合避免重复添加，最终将每个张量通过apir_serialize_tensor转换为RPC格式。
  line: 55-71
  name: apir_add_tensor
- code:
  - void apir_serialize_graph(const ggml_cgraph * cgraph, std::vector<uint8_t> & output)
    {
  - '    uint32_t                          n_nodes = cgraph->n_nodes;'
  - '    std::vector<apir_rpc_tensor>      tensors;'
  - '    std::unordered_set<ggml_tensor *> visited;'
  - '    for (uint32_t i = 0; i < n_nodes; i++) {'
  - '        apir_add_tensor(cgraph->nodes[i], tensors, visited);'
  - '    }'
  - '    // serialization format:'
  - '    // | n_nodes (4 bytes) | nodes (n_nodes * sizeof(uint64_t) | n_tensors (4
    bytes) | tensors (n_tensors * sizeof(apir_rpc_tensor)) |'
  - '    uint32_t n_tensors = tensors.size();'
  - '    int      output_size ='
  - '        sizeof(uint32_t) + n_nodes * sizeof(uint64_t) + sizeof(uint32_t) + n_tensors
    * sizeof(apir_rpc_tensor);'
  - '    output.resize(output_size, 0);'
  - '    memcpy(output.data(), &n_nodes, sizeof(n_nodes));'
  - '    for (uint32_t i = 0; i < n_nodes; i++) {'
  - '        memcpy(output.data() + sizeof(n_nodes) + i * sizeof(uint64_t), &cgraph->nodes[i],
    sizeof(uint64_t));'
  - '    }'
  - '    uint32_t * out_ntensors = (uint32_t *) (output.data() + sizeof(n_nodes) +
    n_nodes * sizeof(uint64_t));'
  - '    *out_ntensors           = n_tensors;'
  - '    apir_rpc_tensor * out_tensors ='
  - '        (apir_rpc_tensor *) (output.data() + sizeof(n_nodes) + n_nodes * sizeof(uint64_t)
    + sizeof(uint32_t));'
  - '    memcpy(out_tensors, tensors.data(), n_tensors * sizeof(apir_rpc_tensor));'
  - '}'
