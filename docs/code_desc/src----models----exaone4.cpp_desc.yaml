classes:
- desc: 一个模板结构体，根据 iswa 布尔参数构建 Exaone4 模型的推理计算图，支持 SWA (Slide Window Attention) 和标准注意力模式。
  methods:
  - code:
    - 'llm_build_exaone4<iswa>::llm_build_exaone4(const llama_model & model, const
      llm_graph_params & params) :'
    - '    llm_graph_context(params) {'
    - '    const int64_t n_embd_head = hparams.n_embd_head_k();'
    - ''
    - '    GGML_ASSERT(n_embd_head == hparams.n_embd_head_v());'
    - '    GGML_ASSERT(n_embd_head == n_rot);'
    - ''
    - '    ggml_tensor * cur;'
    - '    ggml_tensor * inpL;'
    - ''
    - '    inpL = build_inp_embd(model.tok_embd);'
    - ''
    - '    // inp_pos - contains the positions'
    - '    ggml_tensor * inp_pos = build_inp_pos();'
    - ''
    - '    using inp_attn_type      = std::conditional_t<iswa, llm_graph_input_attn_kv_iswa,
      llm_graph_input_attn_kv>;'
    - '    inp_attn_type * inp_attn = nullptr;'
    - ''
    - '    if constexpr (iswa) {'
    - '        inp_attn = build_attn_inp_kv_iswa();'
    - '    } else {'
    - '        inp_attn = build_attn_inp_kv();'
    - '    }'
    - '    ggml_tensor * inp_out_ids = build_inp_out_ids();'
    - ''
    - '    for (int il = 0; il < n_layer; ++il) {'
    - '        ggml_tensor * inpSA = inpL;'
    - ''
    - '        // use RoPE for SWA layers or non-SWA models'
    - '        const bool use_rope = hparams.is_swa(il) || hparams.swa_type == LLAMA_SWA_TYPE_NONE;'
    - ''
    - '        cur = inpL;'
    - ''
    - '        // self-attention'
    - '        {'
    - '            ggml_tensor * rope_factors = model.get_rope_factors(cparams, il);'
    - ''
    - '            ggml_tensor * Qcur = build_lora_mm(model.layers[il].wq, cur);'
    - '            cb(Qcur, "Qcur", il);'
    - ''
    - '            ggml_tensor * Kcur = build_lora_mm(model.layers[il].wk, cur);'
    - '            cb(Kcur, "Kcur", il);'
    - ''
    - '            ggml_tensor * Vcur = build_lora_mm(model.layers[il].wv, cur);'
    - '            cb(Vcur, "Vcur", il);'
    - ''
    - '            Qcur = ggml_reshape_3d(ctx0, Qcur, n_embd_head, n_head, n_tokens);'
    - '            Kcur = ggml_reshape_3d(ctx0, Kcur, n_embd_head, n_head_kv, n_tokens);'
    - '            Vcur = ggml_reshape_3d(ctx0, Vcur, n_embd_head, n_head_kv, n_tokens);'
    - ''
    - '            Qcur = build_norm(Qcur, model.layers[il].attn_q_norm, NULL, LLM_NORM_RMS,
      il);'
    - '            Kcur = build_norm(Kcur, model.layers[il].attn_k_norm, NULL, LLM_NORM_RMS,
      il);'
    - '            cb(Qcur, "Qcur_normed", il);'
    - '            cb(Kcur, "Kcur_normed", il);'
    - ''
    - '            if (use_rope) {'
    - '                Qcur = ggml_rope_ext(ctx0, Qcur, inp_pos, rope_factors, n_rot,
      rope_type, n_ctx_orig, freq_base,'
    - '                                     freq_scale, ext_factor, attn_factor, beta_fast,
      beta_slow);'
    - ''
    - '                Kcur = ggml_rope_ext(ctx0, Kcur, inp_pos, rope_factors, n_rot,
      rope_type, n_ctx_orig, freq_base,'
    - '                                     freq_scale, ext_factor, attn_factor, beta_fast,
      beta_slow);'
    - '            }'
    - '            cb(Qcur, "Qcur", il);'
    - '            cb(Kcur, "Kcur", il);'
    - '            cb(Vcur, "Vcur", il);'
    - ''
    - '            cur = build_attn(inp_attn,'
    - '                    model.layers[il].wo, NULL,'
    - '                    Qcur, Kcur, Vcur, nullptr, nullptr, nullptr, 1.0f / sqrtf(float(n_embd_head)),
      il);'
    - '            cb(cur, "attn_out", il);'
    - '        }'
    - '        if (il == n_layer - 1 && inp_out_ids) {'
    - '            cur   = ggml_get_rows(ctx0, cur, inp_out_ids);'
    - '            inpSA = ggml_get_rows(ctx0, inpSA, inp_out_ids);'
    - '        }'
    - '        cur = build_norm(cur, model.layers[il].attn_post_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        cb(cur, "attn_post_norm", il);'
    - ''
    - '        ggml_tensor * ffn_inp = ggml_add(ctx0, cur, inpSA);'
    - '        cb(ffn_inp, "ffn_inp", il);'
    - ''
    - '        // feed-forward network'
    - '        cur = build_ffn(ffn_inp,'
    - '                model.layers[il].ffn_up, NULL, NULL,'
    - '                model.layers[il].ffn_gate, NULL, NULL,'
    - '                model.layers[il].ffn_down, NULL, NULL, NULL,'
    - '                LLM_FFN_SILU, LLM_FFN_PAR, il);'
    - '        cb(cur, "ffn_out", il);'
    - ''
    - '        cur = build_norm(cur, model.layers[il].ffn_post_norm, NULL, LLM_NORM_RMS,
      -1);'
    - '        cb(cur, "ffn_post_norm", -1);'
    - ''
    - '        cur = ggml_add(ctx0, cur, ffn_inp);'
    - ''
    - '        cur = build_cvec(cur, il);'
    - '        cb(cur, "l_out", il);'
    - ''
    - '        // input for next layer'
    - '        inpL = cur;'
    - '    }'
    - '    cur = inpL;'
    - ''
    - '    cur = build_norm(cur, model.output_norm, NULL, LLM_NORM_RMS, -1);'
    - ''
    - '    cb(cur, "result_norm", -1);'
    - '    res->t_embd = cur;'
    - ''
    - '    // lm_head'
    - '    cur = build_lora_mm(model.output, cur);'
    - ''
    - '    cb(cur, "result_output", -1);'
    - '    res->t_logits = cur;'
    - ''
    - '    ggml_build_forward_expand(gf, cur);'
    - '}'
    desc: 构造函数：初始化模型上下文，通过遍历所有层构建自注意力和前馈网络，并生成最终的归一化输出和 logits 张量。
    line: 5-90
    name: llm_build_exaone4
  name: llm_build_exaone4<iswa>
desc: 该文件定义了 llm_build_exaone4 模板结构体的构造函数实现，用于构建 Exaone4 模型的推理计算图。它利用 llama.cpp 的计算图构建原语（如线性层、归一化、注意力、前馈网络和旋转位置编码）处理
  token 嵌入，并通过循环逐层完成自注意力及 FFN 的计算，最终输出 logits 以用于模型推理。
