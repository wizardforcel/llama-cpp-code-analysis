classes: []
desc: 该文件是 MCP (Model Context Protocol) 资源浏览器组件的核心逻辑模块，负责将扁平的 MCP 资源列表构建为层级树结构，并提供资源搜索过滤、资源计数和子节点排序等功能。文件包含资源树节点接口定义、资源匹配辅助函数、资源树构建函数、资源计数函数和子节点排序函数，支持通过服务器名称和搜索查询来组织和筛选
  MCP 资源。
file: tools/server/webui/src/lib/components/app/mcp/McpResourceBrowser/mcp-resource-browser.ts
funcs:
- code:
  - 'function resourceMatchesSearch(resource: MCPResource, query: string): boolean
    {'
  - "\treturn ("
  - "\t\tresource.title?.toLowerCase().includes(query) || resource.uri.toLowerCase().includes(query)"
