classes: []
desc: 该文件是 ggml 库中的量化/反量化函数声明头文件（ggml-quants.h），定义了一系列用于不同数据类型（如 q4_0、q5_K、iq2_xxs
  等）的参考实现函数，包括基础量化（quantize_row_*_ref）、反量化（dequantize_row_*）以及基于重要性矩阵的量化（quantize_*）等，并为这些函数提供统一的
  API 声明。
