    - '    if (n_seq_tokens == 1) {'
    - '        if (cparams.fused_gdn_ar) {'
    - '            return build_delta_net_fused(q, k, v, g, b, s, il);'
    - '        }'
    - '        return build_delta_net_autoregressive(q, k, v, g, b, s, il);'
    - '    }'
    - '    '
    - '    if (cparams.fused_gdn_ch) {'
    - '        return build_delta_net_fused(q, k, v, g, b, s, il);'
    - '    }'
    - '    '
    - '    return build_delta_net_chunking(q, k, v, g, b, s, il);'
    - '}'
