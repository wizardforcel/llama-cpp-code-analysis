desc: 该文件是 llama.cpp 中 DeltaNet 模型的基础实现部分，包含了 DeltaNet 架构的核心计算图构建逻辑。它定义了 llm_build_delta_net_base
  类，提供了三种不同场景下的 DeltaNet 注意力机制实现（分块计算、自回归计算和融合计算），以及一个统一的分发函数。该代码实现了 DeltaNet 的线性注意力机制，通过状态
  s 来替代传统的 KV 缓存，实现高效的序列建模。
