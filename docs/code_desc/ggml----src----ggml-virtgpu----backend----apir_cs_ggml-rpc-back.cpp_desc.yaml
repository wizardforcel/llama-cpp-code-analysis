desc: 该文件是ggml虚拟GPU后端RPC通信的实现之一，提供了张量反序列化、计算图重建以及后端缓冲区跟踪的核心功能。它通过反序列化从RPC传输的apir_rpc_tensor数据，在本地ggml上下文中创建对应的计算图和张量节点，同时维护一个已注册的被跟踪后端缓冲区集合，用于验证传入张量数据中引用的缓冲区是否真实存在。
