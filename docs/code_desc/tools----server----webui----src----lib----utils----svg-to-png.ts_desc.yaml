desc: 该文件提供了 SVG 相关工具函数，包含将 SVG base64 数据 URL 转换为 PNG data URL 的函数，以及判断文件或 MIME 类型是否为
  SVG 的两个校验工具方法。
file: tools/server/webui/src/lib/utils/svg-to-png.ts
funcs:
- code:
  - export function svgBase64UrlToPngDataURL(
  - "\tbase64UrlSvg: string,"
  - "\tbackgroundColor: string = 'white'"
  - '): Promise<string> {'
  - "\treturn new Promise((resolve, reject) => {"
  - "\t\ttry {"
  - "\t\t\tconst img = new Image();"
  - ''
  - "\t\t\timg.onload = () => {"
  - "\t\t\t\tconst canvas = document.createElement('canvas');"
  - "\t\t\t\tconst ctx = canvas.getContext('2d');"
  - ''
  - "\t\t\t\tif (!ctx) {"
  - "\t\t\t\t\treject(new Error('Failed to get 2D canvas context.'));"
  - "\t\t\t\t\treturn;"
  - "\t\t\t\t}"
  - ''
  - "\t\t\t\tconst targetWidth = img.naturalWidth || 300;"
  - "\t\t\t\tconst targetHeight = img.naturalHeight || 300;"
  - ''
  - "\t\t\t\tcanvas.width = targetWidth;"
  - "\t\t\t\tcanvas.height = targetHeight;"
  - ''
  - "\t\t\t\tif (backgroundColor) {"
  - "\t\t\t\t\tctx.fillStyle = backgroundColor;"
  - "\t\t\t\t\tctx.fillRect(0, 0, canvas.width, canvas.height);"
  - "\t\t\t\t}"
  - "\t\t\t\tctx.drawImage(img, 0, 0, targetWidth, targetHeight);"
  - ''
  - "\t\t\t\tresolve(canvas.toDataURL(MimeTypeImage.PNG));"
  - "\t\t\t};"
  - ''
  - "\t\t\timg.onerror = () => {"
  - "\t\t\t\treject(new Error('Failed to load SVG image. Ensure the SVG data is valid.'));"
  - "\t\t\t};"
  - ''
  - "\t\t\timg.src = base64UrlSvg;"
  - "\t\t} catch (error) {"
  - "\t\t\tconst message = error instanceof Error ? error.message : String(error);"
  - "\t\t\tconst errorMessage = `Error converting SVG to PNG: ${message}`;"
  - "\t\t\tconsole.error(errorMessage, error);"
  - "\t\t\treject(new Error(errorMessage));"
  - "\t\t}"
  - "\t});"
  - '}'
  desc: 将 SVG 的 base64 数据 URL 转换为 PNG 数据 URL，可指定背景色。
