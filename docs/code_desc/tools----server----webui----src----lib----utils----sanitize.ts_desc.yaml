desc: 'This TypeScript utility module provides input sanitization helpers for key-value
  pair data, stripping unsafe control characters and capping lengths to prevent header
  injection issues and invalid identifier/header names. It relies on shared constants
  (regexes and max-length limits) from ''$lib/constants'' and exports two focused
  functions: one for keys (stricter) and one for values (allowing TAB and limiting
  length/value-specific controls).'
