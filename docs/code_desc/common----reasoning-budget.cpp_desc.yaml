desc: 该文件实现了一个用于控制模型推理区块长度的 llama sampler。它通过匹配推理起始和结束 token 序列，在空闲、计数、等待 UTF-8 完成、强制结束和完成等状态之间切换；当推理预算耗尽时，可等待当前
  UTF-8 字符完成，并通过限制 logits 强制生成指定的结束 token 序列。同时提供 sampler 的初始化、克隆、重置、释放和状态查询功能。
