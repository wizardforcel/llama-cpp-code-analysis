classes: []
desc: The file contains unit tests for the new reasoning content handling architecture,
  verifying that reasoning content is stored in a dedicated reasoningContent field
  on DatabaseMessage rather than embedded in content with tags, and that the API conversion
  logic correctly handles reasoning_content fields including exclusion scenarios.
file: tools/server/webui/tests/unit/reasoning-context.test.ts
funcs:
- code:
  - import { describe, it, expect } from 'vitest';
  - import { MessageRole } from '$lib/enums';
  - ''
  - /**
  - ' * Tests for the new reasoning content handling.'
  - ' * In the new architecture, reasoning content is stored in a dedicated'
  - ' * `reasoningContent` field on DatabaseMessage, not embedded in content with
    tags.'
  - ' * The API sends it as `reasoning_content` on ApiChatMessageData.'
  - ' */'
  - ''
  - describe('reasoning content in new structured format', () => {
  - "\tit('reasoning is stored as separate field, not in content', () => {"
  - "\t\t// Simulate what the new chat store does"
  - "\t\tconst message = {"
  - "\t\t\tcontent: 'The answer is 4.',"
  - "\t\t\treasoningContent: 'Let me think: 2+2=4, basic arithmetic.'"
  - "\t\t};"
  - ''
  - "\t\t// Content should be clean"
  - "\t\texpect(message.content).not.toContain('<<<');"
  - "\t\texpect(message.content).toBe('The answer is 4.');"
  - ''
  - "\t\t// Reasoning in dedicated field"
  - "\t\texpect(message.reasoningContent).toBe('Let me think: 2+2=4, basic arithmetic.');"
  - "\t});"
  - ''
  - "\tit('convertDbMessageToApiChatMessageData includes reasoning_content', () =>\
    \ {"
  - "\t\t// Simulate the conversion logic"
  - "\t\tconst dbMessage = {"
  - "\t\t\trole: MessageRole.ASSISTANT,"
  - "\t\t\tcontent: 'The answer is 4.',"
  - "\t\t\treasoningContent: 'Let me think: 2+2=4, basic arithmetic.'"
  - "\t\t};"
  - ''
  - "\t\tconst apiMessage: Record<string, unknown> = {"
  - "\t\t\trole: dbMessage.role,"
  - "\t\t\tcontent: dbMessage.content"
  - "\t\t};"
  - "\t\tif (dbMessage.reasoningContent) {"
  - "\t\t\tapiMessage.reasoning_content = dbMessage.reasoningContent;"
  - "\t\t}"
  - ''
  - "\t\texpect(apiMessage.content).toBe('The answer is 4.');"
  - "\t\texpect(apiMessage.reasoning_content).toBe('Let me think: 2+2=4, basic arithmetic.');"
  - "\t\t// No internal tags leak into either field"
  - "\t\texpect(apiMessage.content).not.toContain('<<<');"
  - "\t\texpect(apiMessage.reasoning_content).not.toContain('<<<');"
  - "\t});"
  - ''
  - "\tit('API message excludes reasoning when excludeReasoningFromContext is true',\
    \ () => {"
  - "\t\tconst dbMessage = {"
  - "\t\t\trole: MessageRole.ASSISTANT,"
  - "\t\t\tcontent: 'The answer is 4.',"
  - "\t\t\treasoningContent: 'internal thinking'"
  - "\t\t};"
  - ''
  - "\t\tconst excludeReasoningFromContext = true;"
  - ''
  - "\t\tconst apiMessage: Record<string, unknown> = {"
  - "\t\t\trole: dbMessage.role,"
  - "\t\t\tcontent: dbMessage.content"
  - "\t\t};"
  - "\t\tif (!excludeReasoningFromContext && dbMessage.reasoningContent) {"
  - "\t\t\tapiMessage.reasoning_content = dbMessage.reasoningContent;"
  - "\t\t}"
  - ''
  - "\t\texpect(apiMessage.content).toBe('The answer is 4.');"
  - "\t\texpect(apiMessage.reasoning_content).toBeUndefined();"
  - "\t});"
  - ''
  - "\tit('handles messages with no reasoning', () => {"
  - "\t\tconst dbMessage = {"
  - "\t\t\trole: MessageRole.ASSISTANT,"
  - "\t\t\tcontent: 'No reasoning here.',"
  - "\t\t\treasoningContent: undefined"
  - "\t\t};"
  - ''
  - "\t\tconst apiMessage: Record<string, unknown> = {"
  - "\t\t\trole: dbMessage.role,"
  - "\t\t\tcontent: dbMessage.content"
  - "\t\t};"
  - "\t\tif (dbMessage.reasoningContent) {"
  - "\t\t\tapiMessage.reasoning_content = dbMessage.reasoningContent;"
  - "\t\t}"
  - ''
  - "\t\texpect(apiMessage.content).toBe('No reasoning here.');"
  - "\t\texpect(apiMessage.reasoning_content).toBeUndefined();"
  - "\t});"
  - '});'
  desc: Test suite containing four test cases that verify reasoning content is stored
    separately from message content, properly converted to API format with reasoning_content
    field, excluded when excludeReasoningFromContext is true, and handles messages
    without reasoning content.
  line: 1-87
  name: __main__
