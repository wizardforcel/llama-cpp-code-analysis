desc: The file implements a deprecation warning utility for old binary names, displaying
  a message with the deprecated filename, its replacement name, and a link to documentation,
  while always returning an error code.
file: examples/deprecation-warning/deprecation-warning.cpp
funcs:
- code:
  - int main(int argc, char** argv) {
  - '    std::setlocale(LC_NUMERIC, "C");'
  - ''
  - '    std::string filename = "main";'
  - '    if (argc >= 1) {'
  - '        filename = argv[0];'
  - '    }'
  - ''
  - '    auto pos = filename.find_last_of("/\\");'
  - '    if (pos != std::string::npos) {'
  - '        filename = filename.substr(pos+1);'
  - '    }'
  - ''
  - '    auto replacement_filename = "llama-" + filename;'
  - ''
  - '    if (filename == "main") {'
  - '        replacement_filename = "llama-cli";'
  - '    }'
  - ''
  - '    fprintf(stdout, "\n");'
  - '    fprintf(stdout, "WARNING: The binary ''%s'' is deprecated.\n", filename.c_str());'
  - '    fprintf(stdout, " Please use ''%s'' instead.\n", replacement_filename.c_str());'
  - '    fprintf(stdout, " See https://github.com/ggml-org/llama.cpp/tree/master/examples/deprecation-warning/README.md
    for more information.\n");'
  - '    fprintf(stdout, "\n");'
  - ''
  - '    return EXIT_FAILURE;'
  - '}'
