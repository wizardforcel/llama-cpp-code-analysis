desc: The file provides a collection of utility functions for formatting various types
  of data into human-readable representations. It includes functions for formatting
  file sizes, model parameter counts, numbers with locale-specific separators, JSON
  strings, time values, performance durations, and attachment content for API requests.
file: tools/server/webui/src/lib/utils/formatters.ts
funcs:
- code:
  - 'export function formatFileSize(bytes: number | unknown): string {'
  - "\tif (typeof bytes !== 'number') return 'Unknown';"
  - "\tif (bytes === 0) return '0 Bytes';"
  - ''
  - "\tconst k = 1024;"
  - "\tconst sizes = ['Bytes', 'KB', 'MB', 'GB'];"
  - "\tconst i = Math.floor(Math.log(bytes) / Math.log(k));"
  - ''
  - "\treturn parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];"
  - '}'
  desc: Formats a file size in bytes into a human-readable string with units (Bytes,
    KB, MB, GB).
