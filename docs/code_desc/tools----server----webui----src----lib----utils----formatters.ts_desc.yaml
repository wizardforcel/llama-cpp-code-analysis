- code:
  - 'export function formatPerformanceTime(ms: number): string {'
  - "\tif (ms < 0) return '0s';"
  - ''
  - "\tconst totalSeconds = ms / MS_PER_SECOND;"
  - ''
  - "\tif (totalSeconds < SHORT_DURATION_THRESHOLD) {"
  - "\t\treturn `${totalSeconds.toFixed(1)}s`;"
  - "\t}"
  - ''
  - "\tif (totalSeconds < MEDIUM_DURATION_THRESHOLD) {"
  - "\t\treturn `${totalSeconds.toFixed(1)}s`;"
  - "\t}"
  - ''
  - "\tconst hours = Math.floor(totalSeconds / SECONDS_PER_HOUR);"
  - "\tconst minutes = Math.floor((totalSeconds % SECONDS_PER_HOUR) / SECONDS_PER_MINUTE);"
  - "\tconst seconds = Math.floor(totalSeconds % SECONDS_PER_MINUTE);"
  - ''
  - "\tconst parts: string[] = [];"
  - ''
  - "\tif (hours > 0) {"
  - "\t\tparts.push(`${hours}h`);"
  - "\t}"
  - ''
  - "\tif (minutes > 0) {"
  - "\t\tparts.push(`${minutes}min`);"
  - "\t}"
  - ''
  - "\tif (seconds > 0 || parts.length === 0) {"
  - "\t\tparts.push(`${seconds}s`);"
  - "\t}"
  - ''
  - "\treturn parts.join(' ');"
  - '}'
  desc: Formats milliseconds into a human-readable duration string for performance
    metrics (e.g., '4h 12min 54s', '45s', '0.5s').
  line: 100-130
  name: formatPerformanceTime
