desc: 该文件实现了用于Qualcomm Hexagon DSP的DMA队列管理功能，提供了DMA队列的创建、删除和刷新操作，以及内部的2次幂向上取整工具函数。队列使用环形缓冲区存储DMA描述符和指针，支持高效的2D
  DMA传输操作，适用于神经网络推理等需要快速数据搬运的场景。
file: ggml/src/ggml-hexagon/htp/hex-dma.c
