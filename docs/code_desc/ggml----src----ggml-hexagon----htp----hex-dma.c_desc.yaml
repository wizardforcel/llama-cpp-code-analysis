- code:
  - static inline uint32_t pow2_ceil(uint32_t x) {
  - '    if (x <= 1) {'
  - '        return 1;'
  - '    }'
  - '    int p = 2;'
  - '    x--;'
  - '    while (x >>= 1) {'
  - '        p <<= 1;'
  - '    }'
  - '    return p;'
  - '}'
  desc: 静态内联工具函数，计算给定32位无符号整数的2次幂向上取整值，最小返回1。
