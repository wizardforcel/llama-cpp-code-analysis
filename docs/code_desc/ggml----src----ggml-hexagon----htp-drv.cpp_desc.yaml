desc: 该文件是 ggml 项目中用于 Qualcomm Hexagon 数字信号处理器（DSP）的驱动接口实现，其核心功能是通过动态加载系统库（在 Windows
  上为 libcdsprpc.dll，在 Linux 上为 libcdsprpc.so）来获取并封装 FastRPC、rpcmem 和 dspqueue 等驱动程序
  API。该文件提供了三个主要功能模块：RPCMem 内存分配与释放接口、FastRPC 远程进程调用接口、DSP 队列通信接口，并通过 htpdrv_init
  函数进行驱动加载和符号解析，为上层 ggml-hex 后端提供与 Hexagon DSP 通信的统一访问层。
file: ggml/src/ggml-hexagon/htp-drv.cpp
