desc: 该文件实现了一个正则表达式封装类 common_regex，主要用于在给定输入字符串中搜索匹配的子串，并支持部分匹配检测。它通过将原始正则表达式转换成一个作用于反转字符串的特殊正则表达式来实现部分匹配功能，从而能够识别那些尚未完全匹配但已经匹配到模式前缀的情况。文件中包含了类的构造、搜索方法以及一个核心的正则表达式转换工具函数。
