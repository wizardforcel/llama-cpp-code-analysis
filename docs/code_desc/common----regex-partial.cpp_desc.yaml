- code:
  - std::string regex_to_reversed_partial_regex(const std::string & pattern) {
  - '    auto it = pattern.begin();'
  - '    const auto end = pattern.end();'
  - ''
  - '    std::function<std::string()> process = [&]() {'
  - '        std::vector<std::vector<std::string>> alternatives(1);'
  - '        std::vector<std::string> * sequence = &alternatives.back();'
  - ''
  - '        while (it != end) {'
  - '            if (*it == ''['') {'
  - '                auto start = it;'
  - '                ++it;'
  - '                while (it != end) {'
  - '                    if ((*it == ''\\'') && (++it != end)) {'
  - '                        ++it;'
  - '                    } else if ((it != end) && (*it == '']'')) {'
  - '                        break;'
  - '                    } else {'
  - '                        ++it;'
  - '                    }'
  - '                }'
  - '                if (it == end) {'
  - '                    throw std::runtime_error("Unmatched ''['' in pattern");'
  - '                }'
  - '                ++it;'
  - '                sequence->push_back(std::string(start, it));'
  - '            } else if (*it == ''*'' || *it == ''?'' || *it == ''+'') {'
  - '                if (sequence->empty()) {'
  - '                    throw std::runtime_error("Quantifier without preceding element");'
  - '                }'
  - '                sequence->back() += *it;'
  - '                auto is_star = *it == ''*'';'
  - '                ++it;'
  - '                if (is_star) {'
  - '                    if (it != end && *it == ''?'') {'
  - '                        ++it;'
  - '                    }'
  - '                }'
  - '            } else if (*it == ''{'') {'
  - '                if (sequence->empty()) {'
  - '                    throw std::runtime_error("Repetition without preceding element");'
  - '                }'
  - '                ++it;'
  - '                auto start = it;'
  - '                while (it != end && *it != ''}'') {'
  - '                    ++it;'
  - '                }'
  - '                if (it == end) {'
  - '                    throw std::runtime_error("Unmatched ''{'' in pattern");'
  - '                }'
  - '                auto parts = string_split(std::string(start, it), ",");'
  - '                ++it;'
  - '                if (parts.size() > 2) {'
  - '                    throw std::runtime_error("Invalid repetition range in pattern");'
  - '                }'
  - ''
  - '                auto parseOptInt = [&](const std::string & s, const std::optional<int>
    & def = std::nullopt) -> std::optional<int> {'
  - '                    if (s.empty()) {'
  - '                        return def;'
  - '                    }'
  - '                    return std::stoi(s);'
  - '                };'
  - '                auto min = parseOptInt(parts[0], 0);'
  - '                auto max = parts.size() == 1 ? min : parseOptInt(parts[1]);'
  - '                if (min && max && *max < *min) {'
  - '                    throw std::runtime_error("Invalid repetition range in pattern");'
  - '                }'
  - '                // Brutal but... let''s repeat at least min times, then ? for
    the delta between min & max (or * for unbounded)'
  - '                auto part = sequence->back();'
  - '                sequence->pop_back();'
  - '                for (int i = 0; i < *min; i++) {'
  - '                    sequence->push_back(part);'
  - '                }'
  - '                if (max) {'
  - '                    for (int i = *min; i < *max; i++) {'
  - '                        sequence->push_back(part + "?");'
  - '                    }'
  - '                } else {'
  - '                    sequence->push_back(part + "*");'
  - '                }'
  - '            } else if (*it == ''('') {'
  - '                ++it;'
  - '                if (it != end && *it == ''?'' && (it + 1 != end) && *(it + 1)
    == '':'') {'
  - '                    it += 2;'
  - '                }'
  - '                auto sub = process();'
  - '                if (*it != '')'') {'
  - '                    throw std::runtime_error("Unmatched ''('' in pattern");'
  - '                }'
  - '                ++it;'
  - '                auto & part = sequence->emplace_back("(?:");'
  - '                part += sub;'
  - '                part += ")";'
  - '            } else if (*it == '')'') {'
  - '                break;'
  - '            } else if (*it == ''|'') {'
  - '                ++it;'
  - '                alternatives.emplace_back();'
  - '                sequence = &alternatives.back();'
  - '            } else if (*it == ''\\'' && (++it != end)) {'
  - '                auto str = std::string("\\") + *it;'
  - '                sequence->push_back(str);'
  - '                ++it;'
  - '            } else if (it != end) {'
  - '                sequence->push_back(std::string(1, *it));'
  - '                ++it;'
  - '            }'
  - '        }'
  - ''
  - '        // /abcd/ -> ^(dcba|cba|ba|a) -> ^((?:(?:(?:(?:d)?c)?b)?a)'
  - '        // if n(=4) parts, opening n-1(=3) non-capturing groups after the 1 capturing
    group'
  - '        // We''ll do the outermost capturing group and final .* in the enclosing
    function.'
  - '        std::vector<std::string> res_alts;'
  - '        for (const auto & parts : alternatives) {'
  - '            auto & res = res_alts.emplace_back();'
  - '            for (size_t i = 0; i < parts.size() - 1; i++) {'
  - '                res += "(?:";'
  - '            }'
  - '            for (auto it = parts.rbegin(); it != parts.rend(); ++it) {'
  - '                res += *it;'
  - '                if (it != parts.rend() - 1) {'
  - '                    res += ")?";'
  - '                }'
  - '            }'
  - '        }'
  - '        return string_join(res_alts, "|");'
  - '    };'
  - '    auto res = process();'
  - '    if (it != end) {'
  - '        throw std::runtime_error("Unmatched ''('' in pattern");'
  - '    }'
  - ''
  - '    return "^(" + res + ")";'
  - '}'
