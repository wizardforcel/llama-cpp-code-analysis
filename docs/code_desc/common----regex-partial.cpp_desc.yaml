  - code:
    - common_regex_match search(const std::string & input, size_t pos, bool as_match)
      const {
    - '    std::smatch match;'
    - '    if (pos > input.size()) {'
    - '        throw std::runtime_error("Position out of bounds");'
    - '    }'
    - '    auto start = input.begin() + pos;'
    - '    auto found = as_match'
    - '        ? std::regex_match(start, input.end(), match, rx)'
    - '        : std::regex_search(start, input.end(), match, rx);'
    - '    if (found) {'
    - '        common_regex_match res;'
    - '        res.type = COMMON_REGEX_MATCH_TYPE_FULL;'
    - '        for (size_t i = 0; i < match.size(); ++i) {'
    - '            auto begin = pos + match.position(i);'
    - '            res.groups.emplace_back(begin, begin + match.length(i));'
    - '        }'
    - '        return res;'
    - '    }'
    - '    std::match_results<std::string::const_reverse_iterator> srmatch;'
    - '    if (std::regex_search(input.rbegin(), input.rend() - pos, srmatch, rx_reversed_partial,
      std::regex_constants::match_continuous)) {'
    - '        auto group = srmatch[1].str();'
    - '        if (group.length() != 0) {'
    - '            auto it = srmatch[1].second.base();'
    - '            // auto position = static_cast<size_t>(std::distance(input.begin(),
      it));'
    - '            if ((!as_match) || it == input.begin()) {'
    - '                common_regex_match res;'
    - '                res.type = COMMON_REGEX_MATCH_TYPE_PARTIAL;'
    - '                const size_t begin = std::distance(input.begin(), it);'
    - '                const size_t end = input.size();'
    - '                if (begin == std::string::npos || end == std::string::npos
      || begin > end) {'
    - '                    throw std::runtime_error("Invalid range");'
    - '                }'
    - '                res.groups.push_back({begin, end});'
    - '                return res;'
    - '            }'
    - '        }'
    - '    }'
    - '    return {};'
    - '}'
