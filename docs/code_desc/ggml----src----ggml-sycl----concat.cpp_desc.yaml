  - template<typename T>
  - static void concat_T_sycl_non_cont(
  - '    queue_ptr stream, const char *src0, const char *src1, char *dst,'
  - '    int64_t ne00, int64_t ne01, int64_t ne02, int64_t ne03, uint64_t nb00,'
  - '    uint64_t nb01, uint64_t nb02, uint64_t nb03, int64_t /*ne10*/,'
  - '    int64_t /*ne11*/, int64_t /*ne12*/, int64_t /*ne13*/, uint64_t nb10,'
  - '    uint64_t nb11, uint64_t nb12, uint64_t nb13, int64_t ne0, int64_t ne1,'
  - '    int64_t ne2, int64_t ne3, uint64_t nb0, uint64_t nb1, uint64_t nb2,'
  - '    uint64_t nb3, int32_t dim) {'
  - '  sycl::range<3> gridDim(ne3, ne2, ne1);'
  - '  stream->parallel_for(sycl::nd_range<3>(gridDim, sycl::range<3>(1, 1, 1)), [=](sycl::nd_item<3>
    item_ct1) {'
  - '      int64_t i3 = item_ct1.get_group(0);'
  - '      int64_t i2 = item_ct1.get_group(1);'
  - '      int64_t i1 = item_ct1.get_group(2);'
  - ''
  - '      int64_t o[4] = { 0, 0, 0, 0 };'
  - '      o[dim]       = dim == 0 ? ne00 : (dim == 1 ? ne01 : (dim == 2 ? ne02 :
    ne03));'
  - ''
  - '      const T * x;'
  - ''
  - '      for (int i0 = item_ct1.get_local_id(2); i0 < ne0; i0 += item_ct1.get_local_range(2))
    {'
  - '          if (i0 < ne00 && i1 < ne01 && i2 < ne02 && i3 < ne03) {'
  - '              x = (const T *) (src0 + (i3) *nb03 + (i2) *nb02 + (i1) *nb01 +
    (i0) *nb00);'
  - '          } else {'
  - '              x = (const T *) (src1 + (i3 - o[3]) * nb13 + (i2 - o[2]) * nb12
    + (i1 - o[1]) * nb11 +'
  - '                                   (i0 - o[0]) * nb10);'
  - '          }'
  - ''
  - '          T *y = (T *)(dst + i3 * nb3 + i2 * nb2 + i1 * nb1 + i0 * nb0);'
  - ''
  - '          *y = *x;'
  - '      }'
  - '  });'
  - '}'
  desc: A templated fallback SYCL kernel for non-contiguous tensors. It computes source
    offsets by iterating over all output elements and handling dimension offsets manually,
