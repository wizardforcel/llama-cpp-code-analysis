desc: 该文件实现了投机解码（Speculative Decoding）的核心机制，支持多种投机策略（如草稿模型、n-gram缓存、n-gram映射等），提供了兼容性检测、状态管理和解码流程控制等功能。该代码文件是
  speculative decoding（推测解码）功能的实现部分，定义了推测解码的通用接口和状态管理。它管理多个推测解码实现（如 prompt lookup、n-gram
  等），提供创建、释放、开始、生成草稿、接受 token 和打印统计信息的功能。该文件是 common 库的一部分，用于辅助 llama.cpp 中的推测解码功能。
