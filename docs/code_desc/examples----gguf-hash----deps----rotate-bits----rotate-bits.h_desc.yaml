desc: 该头文件定义了跨平台的整数位循环移位宏，包括 8 位、16 位、32 位和 64 位无符号整数的左循环移位与右循环移位操作。在 Microsoft 编译器环境下使用运行库提供的旋转函数，在其他环境下通过移位、掩码和按位或运算实现，并使用头文件保护避免重复包含。
