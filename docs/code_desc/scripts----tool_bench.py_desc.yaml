  - '    def stop():'
  - '        nonlocal sp'
  - '        if sp is not None:'
  - '            sp.stop()'
  - '            sp = None # type: ignore'
  - '    atexit.register(stop)'
  - '    yield sp'
  - '    stop()'
  desc: 一个上下文管理器，用于管理 ServerProcess 的生命周期，通过 atexit 注册停止函数以确保服务器在程序退出时被停止。
