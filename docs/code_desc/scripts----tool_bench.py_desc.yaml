desc: 这是一个用于对 llama-server 和 ollama 进行简单工具调用基准测试的脚本。它本质上是在不同温度、不同后端（当前 llama-server、基线
  llama-server 和 ollama）下运行 server/tools/server/tests/unit/test_tool_call.py 中的测试
  N 次，并绘制多次运行（来自同一 .jsonl 文件或多个文件）的结果，以成功率热图形式展示。
