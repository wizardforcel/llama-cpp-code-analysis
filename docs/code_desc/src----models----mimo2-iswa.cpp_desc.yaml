  name: llm_build_mimo2_iswa
desc: 该文件实现了名为MIMO2-ISWA的LLM架构的图构建逻辑。它定义了一个派生自llm_graph_context的类，并在其构造函数中，通过调用一系列构建辅助方法（如build_inp_embd、build_norm等），根据输入嵌入和位置信息，逐层构建自注意力、FFN或MoE模块的图节点，最终生成标准的language
  model前向计算图，包括输出正态化（t_embd）和逻辑回归头（t_logits）。
