desc: 该文件是 Hexagon DSP 的 HMX 内联工具头文件，提供 FP16 32x32 分块计算的低层辅助函数，包括设置输出缩放、加载分块到硬件加速器、消费累加器、点积计算以及基于顺序分配的
  VTCM 内存分配器，并封装了硬件特定的 asm 指令以优化矩阵运算性能。
