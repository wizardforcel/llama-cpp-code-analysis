  name: llm_build_llama<embed>
desc: 该代码文件实现了 LLaMA 架构的神经网络图构建过程，通过模板元编程支持嵌入（embedding）和标准生成（generation）两种模式，负责构建包含自注意力机制、前馈网络（含
  MoE 变体）和层归一化的完整 Transformer 解码器结构，并集成了 RoPE 位置编码、KQ 归一化等高级特性。
