desc: 该文件是ggml中针对Spacemit平台（RISC-V架构）的IME1内核实现，提供了高效的量化函数。主要功能是将浮点矩阵按行量化为8位整数，支持多种块大小（16,
  32, 64, 128, 256），利用了RISC-V向量指令集进行性能优化。该文件是ggml项目中针对Spacemit（spacemit）CPU架构的向量量化内核实现，专注于将浮点张量数据按块（BlkLen）量化为8位整数（int8）格式，并存储对应的缩放因子（scale），以支持高效的模型推理计算。代码通过RISC-V向量指令集（RVV）编写了高度优化的内联汇编，针对不同的块大小（16、32、64、128及更大）分别实现了量化循环，包括求绝对值最大值、计算缩放因子、浮点转定点、整数裁剪（clip）以及批量存储等操作。该文件是ggml项目中针对Spacemit平台（RISC-V架构）的CPU内核实现，包含针对4-bit量化矩阵乘法（SQ4BitGemm）的高性能手写RISC-V向量汇编内核。文件通过一系列宏定义封装了向量加载、乘加、存储等底层操作，实现两个模板函数，在不同量化配置（有无零点、fp16/float缩放）下，利用RISC-V向量扩展指令进行块大小为4x16的矩阵乘法运算，以提升llama.cpp中此类量化模型的推理性能。该文件实现Spacemit
  IME1 RISC-V平台的量化矩阵乘法（GEMM）内核，针对4位整数量化数据（SQ4BIT）提供RISC-V向量指令集优化。核心功能包括：针对不同块大小（BlkLen）和数据类型组合（有无零点、FP16或FP32缩放因子）选择最优汇编实现；包含数据加载、零点偏移、整数乘加、浮点累加和结果存储等完整流程；通过模板参数在编译期分派到不同的专用内核函数。该文件是
  ggml 项目中针对 RISC-V SpacemiT 平台的 ime1 内核实现，专注于 4-bit 量化矩阵乘法的底层内核。文件中包含大量内联汇编代码，利用
  RISC-V 向量扩展指令（如 vle、vfwcvt、vfmul 等）来高效执行量化矩阵运算，支持不同块大小和零点配置的矩阵乘法内核。该文件实现基于 Spacemit
  IME1 硬件加速的 int8 权重与 int4 激活矩阵乘法 kernel，支持 M=1 和 M=4 两种路径，自动在标量步长为 4（fp32）和 2（fp16）之间切换，并支持可选的零点补偿（zero
  point）。
