desc: The file ggml-opt.h defines the public C API for the GGML optimization module,
  providing high-level abstractions for training models. It includes structures and
  functions for managing datasets (shuffling, batching), optimization contexts (loss
  computation, gradient accumulation), optimizer parameters (AdamW and SGD), result
  tracking, and high-level training loops like epoch and fit functions.
