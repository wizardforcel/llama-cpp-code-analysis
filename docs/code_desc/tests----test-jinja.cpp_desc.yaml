desc: The file tests/test-jinja.cpp is a comprehensive test suite for the Jinja template
  engine C++ implementation. It defines a series of test functions covering various
  Jinja features such as whitespace control, conditionals, loops, expressions, set
  statements, filters, literals, comments, macros, namespaces, tests, and string/array/object
  methods. It also includes tests for hashing, statistics, and fuzzing. Each test
  function runs multiple test cases using a testing helper class, comparing template
  rendering results against expected outputs.该文件是jinja模板引擎的C++实现测试套件，包含针对数组操作、对象操作、哈希器、统计功能以及模糊测试等大量单元测试用例，用于验证模板引擎各种功能和边界条件下的正确性与健壮性。该文件是测试套件
  test-jinja.cpp 的一部分，专注于通过随机生成的模板表达式对 Jinja2 模板引擎的内置函数和方法进行模糊测试（fuzz testing），以验证引擎在多种参数组合下的鲁棒性与正确性。
