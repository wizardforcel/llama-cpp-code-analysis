- code:
  - 'def bytes_to_unicode():'
  - "    \"\"\"\n    Returns list of utf-8 byte and a corresponding list of unicode\
    \ strings.\n    The reversible bpe codes work on unicode strings.\n    This means\
    \ you need a large # of unicode characters in your vocab if you want to avoid\
    \ UNKs.\n    When you're at something like a 10B token dataset you end up needing\
    \ around 5K for decent coverage.\n    This is a significant percentage of your\
    \ normal, say, 32K bpe vocab.\n    To avoid that, we want lookup tables between\
    \ utf-8 bytes and unicode strings.\n    And avoids mapping to whitespace/control\
    \ characters the bpe code barfs on.\n    \"\"\""
  - '    bs = ('
  - '        list(range(ord("!"), ord("~") + 1))'
  - '        + list(range(ord("¡"), ord("¬") + 1))'
  - '        + list(range(ord("®"), ord("ÿ") + 1))'
  - '    )'
  - '    cs = bs[:]'
  - '    n = 0'
  - '    for b in range(2**8):'
  - '        if b not in bs:'
  - '            bs.append(b)'
  - '            cs.append(2**8 + n)'
  - '            n += 1'
  - '    cs = [chr(n) for n in cs]'
  - '    return dict(zip(bs, cs))'
  desc: Returns a mapping from bytes to unicode characters for BPE tokenization, avoiding
    control characters and whitespace issues.
  line: 392-413
  name: bytes_to_unicode
