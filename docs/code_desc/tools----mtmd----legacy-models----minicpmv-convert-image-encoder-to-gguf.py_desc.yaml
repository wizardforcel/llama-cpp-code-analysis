  - '    tensor: torch.Tensor, mean: float = 0.0, std: float = 1.0, a: float = -2.0,
    b: float = 2.0'
  - '):'
  - "    \"\"\"Fills the input Tensor with values drawn from a truncated\n    normal\
    \ distribution. The values are effectively drawn from the\n    normal distribution\
    \ :math:`\\mathcal{N}(\\text{mean}, \\text{std}^2)`\n    with values outside :math:`[a,\
    \ b]` redrawn until they are within\n    the bounds. The method used for generating\
    \ the random values works\n    best when :math:`a \\leq \\text{mean} \\leq b`.\n\
    \    NOTE: this 'tf' variant behaves closer to Tensorflow / JAX impl where the\n\
    \    bounds [a, b] are applied when sampling the normal distribution with mean=0,\
    \ std=1.0\n    and the result is subsequently scaled and shifted by the mean and\
    \ std args.\"\"\""
  - '    with torch.no_grad():'
  - '        _trunc_normal_(tensor, 0, 1.0, a, b)'
  - '        tensor.mul_(std).add_(mean)'
  desc: Fills a tensor with values drawn from a truncated normal distribution, scaling
