desc: This file defines the Siglip vision model architecture (configuration, embeddings,
  attention, MLP, encoder layers, and transformer) and provides a conversion script
  to export a MiniCPM-V vision encoder (based on Siglip/Idefics2) and optionally its
  projector to GGUF format. It includes utilities for tensor renaming, weight skipping,
  and positional embedding generation.该文件是一个将MiniCPM-V模型的图像编码器转换为GGUF格式的脚本，通过处理模型权重、重命名张量、进行数据类型转换（如float16/float32），最终写入GGUF文件。
