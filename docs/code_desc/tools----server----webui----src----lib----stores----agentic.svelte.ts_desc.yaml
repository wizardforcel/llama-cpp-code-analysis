  - code:
    - 'getConfig(settings: SettingsConfigType, perChatOverrides?: McpServerOverride[]):
      AgenticConfig {'
    - "\tconst maxTurns = Number(settings.agenticMaxTurns) || DEFAULT_AGENTIC_CONFIG.maxTurns;"
    - "\tconst maxToolPreviewLines ="
