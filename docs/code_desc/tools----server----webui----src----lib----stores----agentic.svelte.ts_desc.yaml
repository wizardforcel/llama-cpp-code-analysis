  - "\t\t\treturn {"
  - "\t\t\t\trole: MessageRole.ASSISTANT,"
  - "\t\t\t\tcontent: message.content,"
  - "\t\t\t\ttool_calls: message.tool_calls.map((call, index) => ({"
  - "\t\t\t\t\tid: call.id ?? `call_${index}`,"
  - "\t\t\t\t\ttype: (call.type as ToolCallType.FUNCTION) ?? ToolCallType.FUNCTION,"
  - "\t\t\t\t\tfunction: { name: call.function?.name ?? '', arguments: call.function?.arguments\
    \ ?? '' }"
  - "\t\t\t\t}))"
  - "\t\t\t} satisfies AgenticMessage;"
  - "\t\t}"
  - "\t\tif (message.role === MessageRole.TOOL && message.tool_call_id) {"
  - "\t\t\treturn {"
  - "\t\t\t\trole: MessageRole.TOOL,"
  - "\t\t\t\ttool_call_id: message.tool_call_id,"
  - "\t\t\t\tcontent: typeof message.content === 'string' ? message.content : ''"
  - "\t\t\t} satisfies AgenticMessage;"
  - "\t\t}"
  - "\t\treturn {"
  - "\t\t\trole: message.role as MessageRole.SYSTEM | MessageRole.USER,"
  - "\t\t\tcontent: message.content"
  - "\t\t} satisfies AgenticMessage;"
  - "\t});"
  - '}'
