    - "\treturn {"
    - "\t\tenabled: mcpStore.hasEnabledServers(perChatOverrides) && DEFAULT_AGENTIC_CONFIG.enabled,"
    - "\t\tmaxTurns,"
    - "\t\tmaxToolPreviewLines"
    - "\t};"
    - '}'
    desc: 根据全局设置与每会话覆盖项计算 Agentic 配置（是否启用、最大轮次、工具预览行数上限）。
    line: 180-189
    name: getConfig
  - code:
    - 'async runAgenticFlow(params: AgenticFlowParams): Promise<AgenticFlowResult>
      {'
    - "\tconst { conversationId, messages, options = {}, callbacks, signal, perChatOverrides\
      \ } = params;"
    - ''
    - "\tconst agenticConfig = this.getConfig(config(), perChatOverrides);"
    - "\tif (!agenticConfig.enabled) return { handled: false };"
    - ''
    - "\tconst initialized = await mcpStore.ensureInitialized(perChatOverrides);"
    - "\tif (!initialized) {"
    - "\t\tconsole.log('[AgenticStore] MCP not initialized, falling back to standard\
      \ chat');"
    - "\t\treturn { handled: false };"
    - "\t}"
    - ''
    - "\tconst tools = mcpStore.getToolDefinitionsForLLM();"
    - "\tif (tools.length === 0) {"
    - "\t\tconsole.log('[AgenticStore] No tools available, falling back to standard\
      \ chat');"
    - "\t\treturn { handled: false };"
    - "\t}"
    - ''
    - "\tconsole.log(`[AgenticStore] Starting agentic flow with ${tools.length} tools`);"
    - ''
    - "\tconst normalizedMessages: ApiChatMessageData[] = messages"
    - "\t\t.map((msg) => {"
    - "\t\t\tif ('id' in msg && 'convId' in msg && 'timestamp' in msg)"
    - "\t\t\t\treturn ChatService.convertDbMessageToApiChatMessageData("
    - "\t\t\t\t\tmsg as DatabaseMessage & { extra?: DatabaseMessageExtra[] }"
    - "\t\t\t\t);"
    - "\t\t\treturn msg as ApiChatMessageData;"
    - "\t\t})"
    - "\t\t.filter((msg) => {"
    - "\t\t\tif (msg.role === MessageRole.SYSTEM) {"
    - "\t\t\t\tconst content = typeof msg.content === 'string' ? msg.content : '';"
    - "\t\t\t\treturn content.trim().length > 0;"
    - "\t\t\t}"
    - "\t\t\treturn true;"
    - "\t\t});"
    - ''
    - "\tthis.updateSession(conversationId, {"
    - "\t\tisRunning: true,"
    - "\t\tcurrentTurn: 0,"
    - "\t\ttotalToolCalls: 0,"
    - "\t\tlastError: null"
    - "\t});"
    - "\tmcpStore.acquireConnection();"
    - ''
    - "\ttry {"
    - "\t\tawait this.executeAgenticLoop({"
    - "\t\t\tconversationId,"
    - "\t\t\tmessages: normalizedMessages,"
    - "\t\t\toptions,"
    - "\t\t\ttools,"
    - "\t\t\tagenticConfig,"
    - "\t\t\tcallbacks,"
    - "\t\t\tsignal"
    - "\t\t});"
    - "\t\treturn { handled: true };"
    - "\t} catch (error) {"
    - "\t\tconst normalizedError = error instanceof Error ? error : new Error(String(error));"
    - "\t\tthis.updateSession(conversationId, { lastError: normalizedError });"
    - "\t\tcallbacks.onError?.(normalizedError);"
    - "\t\treturn { handled: true, error: normalizedError };"
    - "\t} finally {"
    - "\t\tthis.updateSession(conversationId, { isRunning: false });"
    - "\t\tawait mcpStore"
    - "\t\t\t.releaseConnection()"
    - "\t\t\t.catch((err: unknown) =>"
    - "\t\t\t\tconsole.warn('[AgenticStore] Failed to release MCP connection:', err)"
    - "\t\t\t);"
    - "\t}"
    - '}'
    desc: Agentic 流程入口：校验配置与 MCP 初始化、规范化消息、初始化会话状态、执行循环并处理错误与连接释放。
    line: 191-253
    name: runAgenticFlow
