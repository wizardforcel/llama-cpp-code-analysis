  - code:
    - private buildFinalTimings(
    - "\tcapturedTimings: ChatMessageTimings | undefined,"
    - "\tagenticTimings: ChatMessageAgenticTimings"
    - '): ChatMessageTimings | undefined {'
    - "\tif (agenticTimings.toolCallsCount === 0) return capturedTimings;"
    - "\treturn {"
    - "\t\tpredicted_n: capturedTimings?.predicted_n,"
    - "\t\tpredicted_ms: capturedTimings?.predicted_ms,"
    - "\t\tprompt_n: capturedTimings?.prompt_n,"
    - "\t\tprompt_ms: capturedTimings?.prompt_ms,"
    - "\t\tcache_n: capturedTimings?.cache_n,"
    - "\t\tagentic: agenticTimings"
    - "\t};"
    - '}'
    desc: 私有方法，将捕获的 LLM 计时与 Agentic 聚合计时合并为最终计时对象；若无工具调用则直接返回原始计时。
    line: 573-586
    name: buildFinalTimings
  - code:
    - 'private normalizeToolCalls(toolCalls: ApiChatCompletionToolCall[]): AgenticToolCallList
      {'
    - "\tif (!toolCalls) return [];"
    - "\treturn toolCalls.map((call, index) => ({"
    - "\t\tid: call?.id ?? `tool_${index}`,"
    - "\t\ttype: (call?.type as ToolCallType.FUNCTION) ?? ToolCallType.FUNCTION,"
    - "\t\tfunction: { name: call?.function?.name ?? '', arguments: call?.function?.arguments\
      \ ?? '' }"
    - "\t}));"
    - '}'
    desc: 私有方法，将原始 API 工具调用对象规范化为带默认 id/type/空参数的 AgenticToolCallList。
    line: 588-595
    name: normalizeToolCalls
  - code:
    - 'private extractBase64Attachments(result: string): {'
    - "\tcleanedResult: string;"
    - "\tattachments: DatabaseMessageExtra[];"
    - '} {'
    - "\tif (!result.trim()) {"
    - "\t\treturn { cleanedResult: result, attachments: [] };"
    - "\t}"
    - ''
    - "\tconst lines = result.split(NEWLINE_SEPARATOR);"
    - "\tconst attachments: DatabaseMessageExtra[] = [];"
    - "\tlet attachmentIndex = 0;"
    - ''
    - "\tconst cleanedLines = lines.map((line) => {"
    - "\t\tconst trimmedLine = line.trim();"
    - ''
    - "\t\tconst match = trimmedLine.match(DATA_URI_BASE64_REGEX);"
    - "\t\tif (!match) {"
    - "\t\t\treturn line;"
    - "\t\t}"
    - ''
    - "\t\tconst mimeType = match[1].toLowerCase();"
    - "\t\tconst base64Data = match[2];"
    - ''
    - "\t\tif (!base64Data) {"
    - "\t\t\treturn line;"
    - "\t\t}"
    - ''
    - "\t\tattachmentIndex += 1;"
    - "\t\tconst name = this.buildAttachmentName(mimeType, attachmentIndex);"
    - ''
    - "\t\tif (mimeType.startsWith(MimeTypePrefix.IMAGE)) {"
    - "\t\t\tattachments.push({ type: AttachmentType.IMAGE, name, base64Url: trimmedLine\
      \ });"
    - ''
    - "\t\t\treturn `[Attachment saved: ${name}]`;"
    - "\t\t}"
    - ''
    - "\t\treturn line;"
    - "\t});"
    - ''
    - "\treturn { cleanedResult: cleanedLines.join(NEWLINE_SEPARATOR), attachments\
      \ };"
    - '}'
    desc: 私有方法，扫描工具结果中的 data URI base64 行，提取图片附件并以占位文本替换原始内容。
    line: 597-637
    name: extractBase64Attachments
  - code:
    - 'private buildAttachmentName(mimeType: string, index: number): string {'
    - "\tconst extension = IMAGE_MIME_TO_EXTENSION[mimeType] ?? DEFAULT_IMAGE_EXTENSION;"
    - ''
    - "\treturn `${MCP_ATTACHMENT_NAME_PREFIX}-${Date.now()}-${index}.${extension}`;"
    - '}'
    desc: 私有方法，根据 MIME 类型生成带时间戳与序号的附件文件名。
    line: 639-643
    name: buildAttachmentName
  name: AgenticStore
desc: 该文件实现了基于 Svelte 5 Runes 的 agenticStore 响应式状态存储，用于编排多轮 Agentic 循环：管理会话状态（运行状态、当前轮次、工具调用计数、错误）、LLM
  流式调用与工具调用检测、通过 mcpStore 执行 MCP 工具、从工具结果中提取 base64 附件、聚合各轮次与工具调用的计时统计，并通过导出的辅助函数简化对会话状态的访问。
