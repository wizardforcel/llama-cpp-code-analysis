  - '        type_adapter = TypeAdapter(response_model)'
  - '        schema = type_adapter.json_schema()'
  - '        messages = [{'
  - '            "role": "system",'
  - '            "content": f"You respond in JSON format with the following schema:
    {json.dumps(schema, indent=2)}"'
  - '        }] + messages'
  - '        response_format={"type": "json_object", "schema": schema}'
  - ''
  - '    data = requests.post(endpoint, headers={"Content-Type": "application/json"},'
  - '                         json=dict(messages=messages, response_format=response_format,
    **kwargs)).json()'
  - '    if ''error'' in data:'
  - '        raise Exception(data[''error''][''message''])'
  - ''
  - '    content = data["choices"][0]["message"]["content"]'
  - '    return type_adapter.validate_json(content) if type_adapter else content'
