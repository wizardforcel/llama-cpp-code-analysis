desc: The file demonstrates how to use Pydantic models to enforce structured JSON
  responses from an OpenAI-compatible chat completion endpoint. It defines a `create_completion`
  function that optionally takes a Pydantic model class to generate a JSON schema,
  injects the schema into the system prompt, sets the response format to `json_object`
  with the schema, sends the request, and validates the response content against the
  provided model using `TypeAdapter`. It includes an alternative commented-out branch
  using Instructor, and a `__main__` block that defines nested Pydantic models (`QAPair`
  and `PyramidalSummary`) to exemplify generating a hierarchical document summary.
file: examples/json_schema_pydantic_example.py
