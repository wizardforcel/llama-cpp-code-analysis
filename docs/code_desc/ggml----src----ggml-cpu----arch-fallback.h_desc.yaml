desc: 该头文件通过条件编译和宏重命名机制，为不同 CPU 架构或通用实现选择合适的量化、向量点积、矩阵向量乘法（GEMV）及矩阵乘法（GEMM）实现。当没有可用的原生优化实现时，将带有
  _generic 后缀的接口映射到对应的通用函数；针对 ARM、x86、PowerPC、LoongArch、RISC-V、S390x 和 WASM 等平台，则仅映射平台需要回退或兼容处理的函数。
file: ggml/src/ggml-cpu/arch-fallback.h
funcs:
- code:
  - '#pragma once'
  - ''
  - // Rename `_generic` functions if no native implementation is available.
  - // This effectively selects the generic implementation.
  - ''
  - '#if defined(GGML_CPU_GENERIC)'
  - '#define quantize_row_q8_0_generic quantize_row_q8_0'
  - '#define quantize_row_q8_1_generic quantize_row_q8_1'
  - '#define quantize_row_q8_K_generic quantize_row_q8_K'
  - '#define ggml_vec_dot_q4_0_q8_0_generic ggml_vec_dot_q4_0_q8_0'
  - '...'
  - '#elif defined(__aarch64__) || defined(__arm__) || defined(_M_ARM) || defined(_M_ARM64)'
  - '#define ggml_quantize_mat_q8_K_4x4_generic ggml_quantize_mat_q8_K_4x4'
  - '...'
  - '#elif defined(__x86_64__) || defined(__i386__) || defined(_M_IX86) || defined(_M_X64)'
  - '#define ggml_vec_dot_nvfp4_q8_0_generic ggml_vec_dot_nvfp4_q8_0'
  - '#define ggml_vec_dot_q1_0_q8_0_generic ggml_vec_dot_q1_0_q8_0'
  - '...'
  - '#elif defined(__POWERPC__) || defined(__powerpc__)'
  - '#define quantize_row_q8_K_generic quantize_row_q8_K'
  - '...'
  - '#elif defined(__loongarch64)'
  - '#define quantize_row_q8_K_generic quantize_row_q8_K'
  - '...'
  - '#elif defined(__riscv)'
  - '#define ggml_vec_dot_nvfp4_q8_0_generic ggml_vec_dot_nvfp4_q8_0'
  - '...'
  - '#elif defined(__s390x__)'
  - '#define quantize_row_q8_K_generic quantize_row_q8_K'
  - '...'
  - '#elif defined(__wasm__)'
  - '#define ggml_vec_dot_q4_1_q8_1_generic ggml_vec_dot_q4_1_q8_1'
  - '...'
  - '#endif'
