desc: 该文件是 llama.cpp 项目中量化的核心实现，专注于将模型权重从高精度格式（如 FP16）转换为低精度量化格式（如 Q4_0、Q5_K 等），以减小模型大小并提升推理性能。它定义了张量分类、类型选择、降级和最终量化操作等完整流程，同时支持
  imatrix 参数优化和人工指定的覆盖规则。该代码是 llama.cpp 项目中 llama-quant.cpp 文件的一部分，主要实现了模型量化驱动的核心逻辑。它定义了从给定模型文件（GGUF）中读取权重，根据参数决定量化类型，执行量化过程，并生成新的量化后
  GGUF 文件的功能。该文件还提供了一些供外部工具使用的辅助接口，如初始化量化状态、计算张量类型等功能。
