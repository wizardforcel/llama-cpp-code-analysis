classes: []
desc: 该文件是 ggml 库中 SYCL 后端的 Flash Attention Tiled 内核实现，针对 Intel GPU 等设备提供高效的注意力计算。文件定义了多个静态配置函数，用于根据
  DKQ（键/查询维度）、DV（值维度）和 ncols（列数）选择合适的线程数、占用率、批次大小等计算参数，并提供了共享内存加载和张量乘累加等底层内核函数。该文件是
  ggml SYCL 后端的 Flash Attention 分块（tile）计算内核实现，通过模板元编程在不同数据类型、头维度和批大小下，利用共享内存和向量化指令高效地完成注意力计算。它定义了将
  K/V 数据加载到 SRAM 并进行 VKQ 向量乘加累加的迭代函数 flash_attn_tile_iter，以及执行整个分块注意力的主设备函数 flash_attn_tile。此外，还包含多个根据
  GQA（Grouped Query Attention）比例和维度选择合适分块大小的启动分发函数，并声明了针对不同 (DKQ, DV) 组合的模板显式实例化。
file: ggml/src/ggml-sycl/fattn-tile.hpp
