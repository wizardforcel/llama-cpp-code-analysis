desc: 该文件是ggml项目中CANNPU后端的ACLNN算子实现文件，包含了大量基于昇腾CANNPU的算子封装函数。文件实现了张量的基础运算（加法、减法、乘法、除法）、归一化（LayerNorm、GroupNorm、RMSNorm）、池化（平均池化、最大池化）、激活函数（LeakyReLU）、数据处理（repeat、cast、concat、arange）、统计（sum、reduce_sum、cross_entropy_loss）等核心算子，通过对底层ACLNN
  API的封装，将ggml的计算图操作映射到CANNPU硬件上执行。文件中的函数分为静态帮助函数（供文件内其他函数调用）和全局函数（供外部调用），涵盖了从简单标量运算到复杂多维张量处理的完整算子集。该代码片段实现
  ggml CANN 后端的一组张量算子与辅助函数，负责池化、张量复制与类型转换、零值或标量填充、缓存张量管理、RMSNorm、对角线掩码、维度置换、1D/2D
  im2col、三角函数、时间步嵌入以及 ALiBi slope 计算等功能，并通过 ACLNN/CANN 算子完成设备端计算和内存操作。代码片段从文件第 798
  行开始，末尾的 aclnn_get_slope 函数在输入处被截断。该代码片段实现了 ggml CANN 后端的一组张量算子封装，依托 ACLNN 完成 ALiBi
  注意力偏置、Softmax、索引选取与索引复制、行获取与设置、元素重复、浮点及量化矩阵乘法、张量滚动等操作，并处理张量广播、数据类型转换、量化权重解码、批处理和临时内存分配。该文件片段实现了
  GGML CANN 后端中的 Rotary Position Embedding（RoPE）相关功能，包括通过 ACLNN 调用执行索引填充、构建并缓存 RoPE
  所需的 theta、Yarn ramp、位置映射、正弦和余弦张量，以及根据不同 RoPE 模式（Neox、mRoPE、i-mRoPE、Vision）对输入张量执行旋转位置编码。代码还声明了
  Ascend ACLNN 的 RotaryPositionEmbedding 接口，并包含针对 ASCEND_310P 的特殊输入滚动、符号缩放和张量融合逻辑。该文件片段实现了
  ggml CANN 后端的一组张量算子，包括 RoPE 旋转位置编码及其缓存预加载、ArgMax、转置一维卷积、ELU、Mean、反射填充、相等计数、Step，以及面向
  Mixture of Experts 的普通和量化矩阵乘法。实现重点是将 ggml 张量映射为 ACL/CANN 张量，处理 F16/F32 转换、非连续内存、尾部维度复制、专家索引选择、量化权重与缩放因子提取，并通过
  ACLNN 算子完成设备端计算。该代码实现了多个基于 CANN/ACLNN 的 ggml 后端算子，包括按索引执行矩阵乘法、扩展 Flash Attention、外积累加、状态空间模型的一维深度卷积、加法与
  RMSNorm 融合，以及门控线性注意力。代码主要负责将 ggml_tensor 转换为 ACL 张量，处理维度、步长、数据类型、临时缓冲区和必要的填充/转换，并调用
  Ascend CANN 算子完成计算。
