classes: []
desc: 该文件是 ggml 项目中 KleidiAI CPU 内核的适配层，用于将 Arm KleidiAI 微内核（包括 GEMM/GEMV 矩阵乘法、LHS/RHS
  打包和量化函数）集成到 ggml 的调度框架中。文件通过模板包装器将 KleidiAI 的函数签名统一为 ggml 期望的接口，并定义了针对不同数据类型（如 f32、f16、bf16、Q4_0、QSi8
  等）和 CPU 特性（如 SME、SVE、i8mm、dotprod）的静态内核注册表，包括用于数据反量化的辅助函数。该文件实现了基于 KleidiAI 库的 GGML
  矩阵乘法内核选择逻辑，通过预定义的内核表（gemm_gemv_kernels 和 gemm_gemv_kernels_q8）根据 CPU 特性和张量类型选择最优的
  GEMM/GEMV 内核，并提供了从浮点权重到量化格式（Q4_0、Q8_0）的运行时打包和计算支持。
