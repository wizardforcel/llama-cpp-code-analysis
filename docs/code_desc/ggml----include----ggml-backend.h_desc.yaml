classes: []
desc: 该文件是 GGML（GPU/CPU 机器学习库）的后端抽象接口头文件，定义了与后端（backend）交互的核心数据结构和函数接口，包括后端缓冲器类型、缓冲器、后端设备、事件、后端注册表以及后端调度器等。该接口允许上层代码（如模型推理）与不同计算后端（如
  CPU、GPU）进行抽象交互，并在多个后端间调度计算任务。
