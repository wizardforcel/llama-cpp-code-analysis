desc: 该文件实现了 ggml 计算图的内存范围跟踪与并发优化功能。它定义了表示物理内存区间（buffer、起始/结束地址、源/目的类型）的结构体 ggml_mem_range，以及管理这些区间的容器
  ggml_mem_ranges，并提供了对内存区间进行增删、查询和冲突检测的 API。在此基础上，该文件包含核心函数 ggml_graph_optimize，它通过融合兼容的操作节点，并利用内存范围冲突检测对节点进行重排序，从而提升图在
  Metal 后端上执行的并发性和缓存友好性。
