  - '            case GGML_OP_SSM_CONV:'
  - '            case GGML_OP_SSM_SCAN:'
  - '            case GGML_OP_CLAMP:'
  - '            case GGML_OP_TRI:'
  - '            case GGML_OP_DIAG:'
  - '            case GGML_OP_MUL:'
  - '            case GGML_OP_ADD:'
  - '            case GGML_OP_SUB:'
  - '            case GGML_OP_DIV:'
  - '            case GGML_OP_GLU:'
  - '            case GGML_OP_SCALE:'
  - '            case GGML_OP_UNARY:'
  - '            case GGML_OP_GET_ROWS:'
  - '            case GGML_OP_SET_ROWS:'
  - '            case GGML_OP_SET:'
