    name: EliminateZeroPoints
  name: EliminateZeroPoints
desc: 该代码定义了一个OpenVINO前端GGML子图中的图优化pass，用于消除模型中的零点（zero point）常量。它通过匹配特定模式（Multiply(scale,
  Subtract(Convert(data), Convert(zp)))），当数据的元素类型与零点值满足特定条件（如u4且zp=8，或u8且zp=128/32）时，将数据常量转换为有符号类型并将零点值直接融入数据中，从而去除多余的Subtract操作，减少内存占用和计算开销，提升推理效率。
file: ggml/src/ggml-openvino/openvino/pass/eliminate_zp.cpp
funcs: []
