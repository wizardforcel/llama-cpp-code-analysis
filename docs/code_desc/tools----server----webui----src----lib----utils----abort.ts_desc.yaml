  name: isAbortError
- code:
  - 'export function createLinkedController(...signals: (AbortSignal | undefined)[]):
    AbortController {'
  - "\tconst controller = new AbortController();"
  - ''
  - "\tfor (const signal of signals) {"
  - "\t\tif (!signal) continue;"
  - ''
  - "\t\t// If already aborted, abort immediately"
  - "\t\tif (signal.aborted) {"
  - "\t\t\tcontroller.abort(signal.reason);"
  - "\t\t\treturn controller;"
  - "\t\t}"
  - ''
  - "\t\t// Link to parent signal"
  - "\t\tsignal.addEventListener('abort', () => controller.abort(signal.reason), {\
    \ once: true });"
  - "\t}"
  - ''
  - "\treturn controller;"
  - '}'
  desc: 创建一个与多个父级 AbortSignal 关联的 AbortController，当任何父级信号中止时，该控制器也会中止。
  line: 75-93
  name: createLinkedController
- code:
  - 'export function createTimeoutSignal(ms: number): AbortSignal {'
  - "\treturn AbortSignal.timeout(ms);"
  - '}'
  desc: 创建一个在指定毫秒后经超时后中止的 AbortSignal。
  line: 105-107
  name: createTimeoutSignal
- code:
  - 'export async function withAbortSignal<T>(promise: Promise<T>, signal?: AbortSignal):
    Promise<T> {'
  - "\tif (!signal) return promise;"
  - ''
  - "\tthrowIfAborted(signal);"
  - ''
  - "\treturn new Promise<T>((resolve, reject) => {"
  - "\t\tconst abortHandler = () => {"
  - "\t\t\treject(new DOMException('Operation was aborted', 'AbortError'));"
  - "\t\t};"
  - ''
  - "\t\tsignal.addEventListener('abort', abortHandler, { once: true });"
  - ''
  - "\t\tpromise"
  - "\t\t\t.then((value) => {"
  - "\t\t\t\tsignal.removeEventListener('abort', abortHandler);"
  - "\t\t\t\tresolve(value);"
  - "\t\t\t})"
  - "\t\t\t.catch((error) => {"
  - "\t\t\t\tsignal.removeEventListener('abort', abortHandler);"
  - "\t\t\t\treject(error);"
  - "\t\t\t});"
  - "\t});"
  - '}'
  desc: 包装一个 Promise，使其在 AbortSignal 中止时拒绝，从而使不支持中止的操作能够响应取消信号。
  line: 128-148
  name: withAbortSignal
