  - "\tif (error instanceof Error && error.name === 'AbortError') {"
  - "\t\treturn true;"
  - "\t}"
  - "\treturn false;"
  - '}'
  desc: 检查给定的错误是否为 AbortError，用于区分用户主动取消和实际错误。
