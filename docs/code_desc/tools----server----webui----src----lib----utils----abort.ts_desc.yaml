desc: 该文件提供了一组用于 AbortSignal 传播和取消处理的工具函数，确保异步操作在需要时能够被正确地中止，实现统一的取消信号管理。
file: tools/server/webui/src/lib/utils/abort.ts
funcs:
- code:
  - 'export function throwIfAborted(signal?: AbortSignal): void {'
  - "\tif (signal?.aborted) {"
