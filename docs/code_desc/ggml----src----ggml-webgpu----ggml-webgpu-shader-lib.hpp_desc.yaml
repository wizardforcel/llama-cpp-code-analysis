  ggml_webgpu_shader_lib。它涵盖了诸如矩阵乘法、Flash Attention、归一化、复制、拼接等多种操作的 WGSL 着色器管线管理逻辑。This
  file defines the WebGPU shader library for ggml, providing methods to create and
  cache WebGPU compute pipelines for various neural network operations such as matrix
  multiplication, scaling, padding, and pooling. It includes a WebGPU shader library
  class with methods to retrieve or create pipelines for operations like matrix multiplication,
  scaling, padding, and pooling.该代码是 ggml 项目在 WebGPU 后端中实现着色器管线的缓存与生成核心逻辑。它定义了 shader_lib
  类，负责根据操作类型、数据类型、张量属性等参数，为不同的 GGML 运算（如一元运算、二元运算、concat、repeat、flash attention、copy、GLU、rope、softmax）创建对应的
  WebGPU 计算管线，并使用缓存机制存储这些管线，避免重复编译，提升运行效率。每个管线生成过程都会通过预处理阶段，基于运行时参数动态修改 WGSL 源代码并编译创建管线。
