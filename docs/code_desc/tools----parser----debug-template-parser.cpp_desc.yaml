desc: 该文件是llama.cpp中用于调试聊天模板解析器（debug template parser）的命令行工具。它加载模板（可以是普通文件或GGUF格式的模型文件），提供多种选项来控制渲染和解析过程，能够输出模板渲染结果、生成的PEG解析器、语法规则等调试信息，并支持多种预定义的输入消息场景（如普通内容、思考内容、工具调用等）以测试模板行为。它通过调用common_chat_template、autoparser等内部组件，帮助开发者分析和调试聊天模板的处理流程。
file: tools/parser/debug-template-parser.cpp
