  - ''
  - '    if (key_id == -1) {'
  - '        gguf_free(ctx);'
  - '        throw std::runtime_error("GGUF file does not contain chat template key:
    " + std::string(key));'
  - '    }'
  - ''
  - '    const char * template_str = gguf_get_val_str(ctx, key_id);'
  - '    if (template_str == nullptr) {'
  - '        gguf_free(ctx);'
  - '        throw std::runtime_error("GGUF file contains chat template key but value
    is null");'
  - '    }'
  - ''
  - '    std::string result = template_str;'
  - '    gguf_free(ctx);'
  - '    return result;'
  - '}'
