desc: 该文件是llama.cpp的测试文件，用于验证模型加载过程中取消功能的正确性。它通过命令行参数获取模型路径，使用特定的加载参数（禁用内存映射）并注册一个进度回调函数，该回调在加载进度超过50%时返回true以触发取消操作，最终验证模型加载是否因取消而返回空指针。
file: tests/test-model-load-cancel.cpp
funcs:
- code:
  - int main(int argc, char *argv[] ) {
  - '    auto * model_path = get_model_or_exit(argc, argv);'
  - '    auto * file = fopen(model_path, "r");'
  - '    if (file == nullptr) {'
  - '        fprintf(stderr, "no model at ''%s'' found\n", model_path);'
  - '        return EXIT_FAILURE;'
  - '    }'
  - ''
  - '    fprintf(stderr, "using ''%s''\n", model_path);'
  - '    fclose(file);'
  - ''
  - '    llama_backend_init();'
  - '    auto params = llama_model_params{};'
  - '    params.use_mmap = false;'
  - '    params.progress_callback = [](float progress, void * ctx){'
  - '        (void) ctx;'
  - '        return progress > 0.50;'
  - '    };'
  - '    auto * model = llama_model_load_from_file(model_path, params);'
  - '    llama_backend_free();'
  - '    return model == nullptr ? EXIT_SUCCESS : EXIT_FAILURE;'
  - '}'
