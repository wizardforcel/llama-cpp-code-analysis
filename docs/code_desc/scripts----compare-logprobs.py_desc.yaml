  - 'def get_remote_corpus(url: str, length: int) -> list[str]:'
  - '    response = requests.get(url)'
  - '    response.raise_for_status()'
  - '    corpus = response.text'
  - '    words = [w.strip() for w in corpus.strip().split(" ")]'
  - '    words = [w for w in words if "<" not in w] # make sure nothing looks like
    special tokens'
  - '    words = [w for w in words if len(w) > 0]  # filter out empty strings'
  - '    while len(words) < length:'
  - '        words += words'
  - '    return words[:length]'
  desc: 从远程URL或本地文件获取文本语料，将其分割为单词列表，并重复直到达到指定长度，用于作为模型的输入提示词。
