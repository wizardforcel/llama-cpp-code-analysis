desc: 该文件是一个用于比较两个不同推理引擎（如llama.cpp和vLLM）的logprobs（对数概率）输出的命令行脚本。它通过调用兼容OpenAI的API端点，分别从两个服务器上获取模型对于相同提示词的预测logits，再对结果进行比较并生成对比报告。脚本支持两种模式：'dump'模式用于从远程服务器获取并保存logits数据，'compare'模式用于读取两个已保存的日志文件，计算它们之间的差异，最后生成Markdown格式的对比报告。
