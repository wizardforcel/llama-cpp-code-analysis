  - '    parts = pattern.split(",")'
  - '    result = []'
  - '    for i, part in enumerate(parts):'
  - '        n = int(part)'
  - '        if i % 2 == 0:'
  - '            result.append((True, n))  # get n words'
  - '        else:'
  - '            result.append((False, n))  # skip n words'
  - '    return result'
  desc: 解析命令行中传入的pattern字符串（如'10,1000,10,4000,10'），将其转换为由布尔值和整数组成的元组列表，布尔值表示是否获取单词，整数表示单词数量。
