  - def dump_logits(
  - '    endpoint: str,'
  - '    output_path: Path,'
  - '    input_words: list[str],'
  - '    pattern: list[tuple[bool, int]],'
  - '    api_key=None,'
  - '):'
  - '    logger.info(f"Dumping logits to {output_path} from endpoint {endpoint}...")'
  - '    words = input_words'
  - '    curr_text = ""'
  - '    n_total = sum(n for get, n in pattern if get)'
  - '    n_done = 0'
  - '    i_cur = 0'
  - '    i_total = len(words)'
  - '    with output_path.open("w") as f:'
  - '        for get, n in pattern:'
  - '            if not get:'
  - '                # skip n words'
  - '                for i in range(n):'
  - '                    curr_text += words.pop(0) + " "'
  - '                    i_cur += 1'
  - '                continue'
  - '            # get n words'
  - '            for i in range(n):'
  - '                curr_text += words.pop(0) + " "'
  - '                payload = {'
  - '                    "prompt": curr_text.strip(),'
  - '                    "temperature": 0.0,'
  - '                    "top_k": 1,'
  - '                    "max_tokens": 1,'
  - '                    "logprobs": 1,'
  - '                    "stream": False,'
  - '                }'
  - '                response = requests.post('
  - '                    endpoint,'
  - '                    json=payload,'
  - '                    headers={"Authorization": f"Bearer {api_key}"} if api_key
    else {},'
  - '                )'
  - '                response.raise_for_status()'
  - '                data = response.json()'
  - '                data["__index"] = i_cur  # add index for easier debugging later'
  - '                data = json.dumps(data)'
  - '                f.write(f"{data}\n")'
  - '                n_done += 1'
  - '                i_cur += 1'
  - '                logger.info('
  - '                    f"\n\n{data}\n\n[Step: {n_done}/{n_total} | Word: {i_cur}/{i_total}]"'
  - '                )'
  - '    logger.info(f"Logits dumped to {output_path}")'
  desc: 根据给定的单词列表和模式，向指定的API端点发送请求以获取模型预测的logprobs数据，并将每次请求的原始响应（附带索引）追加写入输出文件中。
