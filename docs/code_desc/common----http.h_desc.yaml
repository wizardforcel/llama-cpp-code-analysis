  name: common_http_url
desc: 该文件是HTTP客户端工具模块，提供URL解析、客户端创建和URL掩码显示功能。它封装了cpp-httplib库，支持HTTP/HTTPS协议，解析URL中的scheme、认证信息、主机、端口和路径，并根据配置创建相应的HTTP客户端，同时提供安全的URL显示格式以隐藏用户凭据。
file: common/http.h
funcs:
- code:
  - static common_http_url common_http_parse_url(const std::string & url) {
  - '    common_http_url parts;'
  - '    auto scheme_end = url.find("://");'
  - ''
  - '    if (scheme_end == std::string::npos) {'
  - '        throw std::runtime_error("invalid URL: no scheme");'
  - '    }'
  - '    parts.scheme = url.substr(0, scheme_end);'
  - ''
  - '    if (parts.scheme != "http" && parts.scheme != "https") {'
  - '        throw std::runtime_error("unsupported URL scheme: " + parts.scheme);'
  - '    }'
  - ''
  - '    auto rest = url.substr(scheme_end + 3);'
  - '    auto at_pos = rest.find(''@'');'
  - ''
  - '    if (at_pos != std::string::npos) {'
  - '        auto auth = rest.substr(0, at_pos);'
  - '        auto colon_pos = auth.find('':'');'
  - '        if (colon_pos != std::string::npos) {'
  - '            parts.user = auth.substr(0, colon_pos);'
  - '            parts.password = auth.substr(colon_pos + 1);'
  - '        } else {'
  - '            parts.user = auth;'
  - '        }'
  - '        rest = rest.substr(at_pos + 1);'
  - '    }'
  - ''
  - '    auto slash_pos = rest.find(''/'');'
  - ''
  - '    if (slash_pos != std::string::npos) {'
  - '        parts.host = rest.substr(0, slash_pos);'
  - '        parts.path = rest.substr(slash_pos);'
  - '    } else {'
  - '        parts.host = rest;'
  - '        parts.path = "/";'
  - '    }'
  - ''
  - '    auto colon_pos = parts.host.find('':'');'
  - ''
  - '    if (colon_pos != std::string::npos) {'
  - '        parts.port = std::stoi(parts.host.substr(colon_pos + 1));'
  - '        parts.host = parts.host.substr(0, colon_pos);'
  - '    } else if (parts.scheme == "http") {'
  - '        parts.port = 80;'
  - '    } else if (parts.scheme == "https") {'
  - '        parts.port = 443;'
  - '    } else {'
  - '        throw std::runtime_error("unsupported URL scheme: " + parts.scheme);'
  - '    }'
  - ''
  - '    return parts;'
  - '}'
  desc: 解析URL字符串，提取scheme、用户、密码、主机、端口和路径等组成部分，并返回common_http_url结构体。支持HTTP和HTTPS协议，解析失败时抛出异常。
