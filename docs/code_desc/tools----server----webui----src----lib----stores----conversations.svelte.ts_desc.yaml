- code:
  - 'export function buildConversationTree(convs: DatabaseConversation[]): ConversationTreeItem[]
    {'
  - "\tconst childrenByParent = new SvelteMap<string, DatabaseConversation[]>();"
  - "\tconst forkIds = new SvelteSet<string>();"
  - "\tfor (const conv of convs) {"
  - "\t\tif (conv.forkedFromConversationId) {"
  - "\t\t\tforkIds.add(conv.id);"
  - "\t\t\tconst siblings = childrenByParent.get(conv.forkedFromConversationId) ||\
    \ [];"
  - "\t\t\tsiblings.push(conv);"
  - "\t\t\tchildrenByParent.set(conv.forkedFromConversationId, siblings);"
  - "\t\t}"
  - "\t}"
  - "\tconst result: ConversationTreeItem[] = [];"
  - "\tconst visited = new SvelteSet<string>();"
  - "\tfunction walk(conv: DatabaseConversation, depth: number) {"
  - "\t\tvisited.add(conv.id);"
  - "\t\tresult.push({ conversation: conv, depth });"
  - "\t\tconst children = childrenByParent.get(conv.id);"
  - "\t\tif (children) {"
  - "\t\t\tchildren.sort((a, b) => b.lastModified - a.lastModified);"
  - "\t\t\tfor (const child of children) {"
  - "\t\t\t\twalk(child, depth + 1);"
  - "\t\t\t}"
  - "\t\t}"
  - "\t}"
  - "\tconst roots = convs.filter((c) => !forkIds.has(c.id));"
  - "\tfor (const root of roots) {"
  - "\t\twalk(root, 0);"
  - "\t}"
  - "\tfor (const conv of convs) {"
  - "\t\tif (!visited.has(conv.id)) {"
  - "\t\t\twalk(conv, 1);"
  - "\t\t}"
  - "\t}"
  - "\treturn result;"
  - '}'
