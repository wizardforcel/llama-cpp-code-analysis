    - "\t\t\tconst newParent = deletedConv?.forkedFromConversationId;"
    - "\t\t\tthis.conversations = this.conversations"
    - "\t\t\t\t.filter((c) => c.id !== convId)"
    - "\t\t\t\t.map((c) =>"
    - "\t\t\t\t\tc.forkedFromConversationId === convId"
