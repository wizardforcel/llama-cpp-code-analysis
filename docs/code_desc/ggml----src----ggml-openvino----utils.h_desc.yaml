classes: []
desc: 该头文件（utils.h）是OpenVINO后端提供给ggml框架使用的核心工具集。它定义了用于在OpenVINO运行时上下文中管理、缓存和执行计算图的关键数据结构（如graph_key、ov_runtime_context）以及一系列用于张量处理、计算图分析和推理请求操作的辅助函数。该文件作为ggml与OpenVINO运行时之间的桥梁，支持静态与动态图计算，并包含预填充（prefill）和解码（decode）阶段的优化逻辑，旨在提升推理性能并简化后端集成。
file: ggml/src/ggml-openvino/utils.h
