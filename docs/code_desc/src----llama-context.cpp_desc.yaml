desc: 该文件实现了 llama_context 类的定义，负责管理 llama 模型的上下文状态，包括参数初始化、后端调度器、KV 缓存、内存管理、采样器以及计算图的预留等功能。它是模型推理的核心上下文对象，协调模型、后端设备和各种缓冲区之间的交互。该文件是
  llama.cpp 中 llama_context 类的核心实现，主要负责在给定代码段中的批处理（batch）处理、图构建与执行、编码（encode）和解码（decode）操作，以及采样、线程池管理、适配器（LoRA）和
  CVec 等功能的设置与访问。该文件是llama.cpp项目中llama_context类的核心实现，负责管理推理上下文，包括上下文初始化、批处理、计算图构建与执行、输出管理、KV缓存管理、内存管理、状态保存与加载以及训练优化等功能。代码涵盖了从输入预处理到输出生成的完整推理流程，以及与后端硬件（CPU/GPU）的交互。This
  file implements the C API for the llama.cpp context, providing functions for context
  creation, destruction, memory management, state management, encoding/decoding, performance
  profiling, and training. It acts as a thin wrapper around the internal llama_context
  class, exposing its functionality through a C-compatible interface for external
  consumers.
