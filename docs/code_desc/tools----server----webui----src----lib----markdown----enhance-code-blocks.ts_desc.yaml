desc: 该文件实现了一个 Rehype 插件（rehypeEnhanceCodeBlocks），用于在 Markdown 渲染过程中增强代码块的展示效果。它直接操作
  HAST（HTML AST）树，为每个 <pre><code> 代码块包裹一个容器，添加语言标签、复制按钮以及对 HTML 代码块的预览按钮，从而避免 HTML
  字符串化和重新解析带来的性能开销。
