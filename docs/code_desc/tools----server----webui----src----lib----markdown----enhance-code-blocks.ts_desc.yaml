- code:
  - 'function createHeader(language: string, codeId: string): Element {'
  - "\tconst actions: Element[] = [createCopyButton(codeId)];"
  - ''
  - "\tif (language.toLowerCase() === 'html') {"
  - "\t\tactions.push(createPreviewButton(codeId));"
  - "\t}"
  - ''
  - "\treturn {"
  - "\t\ttype: 'element',"
  - "\t\ttagName: 'div',"
  - "\t\tproperties: { className: [CODE_BLOCK_HEADER_CLASS] },"
  - "\t\tchildren: ["
  - "\t\t\t{"
  - "\t\t\t\ttype: 'element',"
  - "\t\t\t\ttagName: 'span',"
  - "\t\t\t\tproperties: { className: [CODE_LANGUAGE_CLASS] },"
  - "\t\t\t\tchildren: [{ type: 'text', value: language }]"
  - "\t\t\t},"
  - "\t\t\t{"
  - "\t\t\t\ttype: 'element',"
  - "\t\t\t\ttagName: 'div',"
  - "\t\t\t\tproperties: { className: [CODE_BLOCK_ACTIONS_CLASS] },"
  - "\t\t\t\tchildren: actions"
  - "\t\t\t}"
  - "\t\t]"
  - "\t};"
  - '}'
  desc: 创建代码块头部栏的 HAST Element 节点，包含语言标签和操作按钮（复制按钮，以及针对 HTML 代码块的预览按钮）。
