- code:
  - 'function extractLanguage(codeElement: Element): string {'
  - "\tconst className = codeElement.properties?.className;"
  - "\tif (!Array.isArray(className)) return 'text';"
  - ''
  - "\tfor (const cls of className) {"
  - "\t\tif (typeof cls === 'string' && cls.startsWith('language-')) {"
  - "\t\t\treturn cls.replace('language-', '');"
  - "\t\t}"
  - "\t}"
  - ''
  - "\treturn 'text';"
  - '}'
  desc: 从 code 元素的 class 属性中提取编程语言名称（解析 language-xxx 形式的类名），若未找到则返回 'text'。
  line: 121-132
  name: extractLanguage
- code:
  - 'function generateCodeId(): string {'
  - "\tif (typeof window !== 'undefined') {"
  - "\t\treturn `code-${(window.idxCodeBlock = (window.idxCodeBlock ?? 0) + 1)}`;"
  - "\t}"
  - "\t// Fallback for SSR - use timestamp + random"
  - "\treturn `code-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;"
  - '}'
  desc: 生成全局唯一的代码块 ID：浏览器端使用 window.idxCodeBlock 全局计数器，SSR 端使用时间戳加随机数作为回退方案。
  line: 137-144
  name: generateCodeId
- code:
  - 'export const rehypeEnhanceCodeBlocks: Plugin<[], Root> = () => {'
  - "\treturn (tree: Root) => {"
  - "\t\tvisit(tree, 'element', (node: Element, index, parent) => {"
  - "\t\t\tif (node.tagName !== 'pre' || !parent || index === undefined) return;"
  - ''
  - "\t\t\tconst codeElement = node.children.find("
  - "\t\t\t\t(child): child is Element => child.type === 'element' && child.tagName\
    \ === 'code'"
  - "\t\t\t);"
  - ''
  - "\t\t\tif (!codeElement) return;"
  - ''
  - "\t\t\tconst language = extractLanguage(codeElement);"
  - "\t\t\tconst codeId = generateCodeId();"
  - ''
  - "\t\t\tcodeElement.properties = {"
  - "\t\t\t\t...codeElement.properties,"
  - "\t\t\t\t'data-code-id': codeId"
  - "\t\t\t};"
  - ''
  - "\t\t\tconst header = createHeader(language, codeId);"
  - "\t\t\tconst wrapper = createWrapper(header, node);"
  - ''
  - "\t\t\t// Replace pre with wrapper in parent"
  - "\t\t\t(parent.children as ElementContent[])[index] = wrapper;"
  - "\t\t});"
  - "\t};"
  - '};'
  desc: 导出的 Rehype 插件主函数，返回一个转换器：通过 unist-util-visit 遍历 HAST 树，查找 <pre><code> 结构，提取语言、生成代码
    ID，并将其替换为带头部栏和操作按钮的包裹容器。
  line: 146-176
  name: rehypeEnhanceCodeBlocks
