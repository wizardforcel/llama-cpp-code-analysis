desc: 该文件定义了 OpenVINO 前端在 GGML 模型翻译过程中使用的 NodeContext 类，它封装了与 GGML 解码器交互的接口，并提供了节点输入输出张量、属性、形状和类型信息的访问方法，是前端开发者解析单个模型节点的核心上下文对象。
