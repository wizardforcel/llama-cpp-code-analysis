  name: llm_build_jais2
desc: 该文件实现了JAIS-2模型的图构建器（llm_build_jais2），主要功能是根据llama_model和llm_graph_params参数，通过llm_graph_context的辅助方法，逐步构建模型的神经网络计算图。图中包含LayerNorm归一化、relu2（ReLU平方）激活函数、独立的Q/K/V投影、RoPE位置编码以及残差连接等组件，最终生成包含logits输出的完整计算图。
