- desc: RPC服务器配置参数结构体，存储服务器运行所需的各项配置参数，包括监听地址、端口、缓存选项、线程数和设备列表。
  methods: []
  name: rpc_server_params
desc: 该文件是llama.cpp项目中RPC服务器的入口文件，实现了一个基于gRPC的远程过程调用服务器。它负责初始化RPC后端、解析命令行参数、获取可用的计算设备（优先非CPU设备，回退到CPU），并启动RPC服务器。服务器支持配置监听地址、端口、线程数、设备列表和本地缓存功能，适合用于分布式推理场景。
file: tools/rpc/rpc-server.cpp
