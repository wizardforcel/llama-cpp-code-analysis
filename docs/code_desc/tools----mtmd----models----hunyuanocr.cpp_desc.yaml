desc: 该文件实现了HunyuanOCR模型的视觉编码器图构建逻辑，包括Vision Transformer特征提取、感知器投影器（两个卷积层）、图像标记（newline）拼接、维度变换以及最终向LLM隐藏空间的投影，并封装了开始/结束标记和最终归一化层。
