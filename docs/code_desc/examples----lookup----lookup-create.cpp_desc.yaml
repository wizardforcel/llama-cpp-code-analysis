classes: []
desc: 该文件是一个用于创建 n-gram 查找缓存的命令行示例程序。程序解析命令行参数并初始化 llama.cpp 后端与模型上下文，将用户提供的提示词进行分词，使用分词结果更新静态
  n-gram 缓存，最后将缓存保存到指定文件中。
file: examples/lookup/lookup-create.cpp
funcs:
- code:
  - int main(int argc, char ** argv){
  - '    std::setlocale(LC_NUMERIC, "C");'
  - ''
  - '    common_params params;'
  - ''
  - '    common_init();'
  - ''
  - '    if (!common_params_parse(argc, argv, params, LLAMA_EXAMPLE_LOOKUP)) {'
  - '        return 1;'
  - '    }'
  - ''
  - '    // init llama.cpp'
  - '    llama_backend_init();'
  - '    llama_numa_init(params.numa);'
  - ''
  - '    // load the model'
  - '    auto llama_init = common_init_from_params(params);'
  - ''
  - '    auto * model = llama_init->model();'
  - '    auto * ctx = llama_init->context();'
  - ''
  - '    GGML_ASSERT(model != nullptr);'
  - ''
  - '    // tokenize the prompt'
  - '    std::vector<llama_token> inp;'
  - '    inp = common_tokenize(ctx, params.prompt, true, true);'
  - '    fprintf(stderr, "%s: tokenization done\n", __func__);'
  - ''
  - '    common_ngram_cache ngram_cache;'
  - '    common_ngram_cache_update(ngram_cache, LLAMA_NGRAM_STATIC, LLAMA_NGRAM_STATIC,
    inp, inp.size(), true);'
  - '    fprintf(stderr, "%s: hashing done, writing file to %s\n", __func__, params.speculative.lookup_cache_static.c_str());'
  - ''
  - '    common_ngram_cache_save(ngram_cache, params.speculative.lookup_cache_static);'
  - ''
  - '    return 0;'
  - '}'
