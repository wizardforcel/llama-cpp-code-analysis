  name: SqueezeMatmul
desc: This file defines the SqueezeMatmul pass, which optimizes quantized models by
  squeezing the activation from 4D to 3D before a MatMul operation and then unsqueezing
  the output back to 4D, to align with NPUW's expectations for DynamicQuantization
  (e.g., DQMatMulGQ2i).
