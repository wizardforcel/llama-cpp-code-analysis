desc: 该文件是 ggml 项目中 SYCL 后端处理 RoPE（旋转位置编码）相关操作的头部定义文件。它提供了三个核心函数的声明，分别用于执行标准 RoPE
  前向传播、RoPE 反向传播以及融合版本（fused）的 RoPE 操作，这些函数均在 SYCL 设备上运行。文件仅包含声明和常量宏定义（SYCL_ROPE_BLOCK_SIZE），没有类或全局函数体实现。
