    line: 41-45
    name: constructor
  - code:
    - 'get(key: K): V | null {'
    - '    const entry = this.cache.get(key);'
    - '    if (!entry) return null;'
    - ''
    - '    if (Date.now() > entry.expiresAt) {'
    - '        this.delete(key);'
    - '        return null;'
    - '    }'
    - ''
    - '    // Update last accessed time for LRU-like behavior'
    - '    entry.lastAccessed = Date.now();'
    - '    return entry.value;'
    - '}'
    desc: 获取指定键的缓存值；若键不存在或已过期（过期时顺带删除该键）则返回 null，否则更新最近访问时间并返回缓存值。
    line: 50-62
    name: get
  - code:
    - 'set(key: K, value: V, customTtlMs?: number): void {'
    - '    // Evict oldest entries if at capacity'
    - '    if (this.cache.size >= this.maxEntries && !this.cache.has(key)) {'
    - '        this.evictOldest();'
    - '    }'
    - ''
    - '    const ttl = customTtlMs ?? this.ttlMs;'
    - '    const now = Date.now();'
    - ''
    - '    this.cache.set(key, {'
    - '        value,'
    - '        expiresAt: now + ttl,'
    - '        lastAccessed: now'
    - '    });'
    - '}'
    desc: 向缓存中写入键值对，可携带自定义 TTL；当缓存已满且写入新键时先逐出最久未访问的条目，然后记录值、过期时间和最近访问时间。
    line: 67-81
    name: set
  - code:
    - 'has(key: K): boolean {'
    - '    const entry = this.cache.get(key);'
    - '    if (!entry) return false;'
    - ''
    - '    if (Date.now() > entry.expiresAt) {'
    - '        this.delete(key);'
    - '        return false;'
    - '    }'
    - ''
    - '    return true;'
    - '}'
    desc: 检查指定键是否存在且未过期；若已过期则删除该键并返回 false，否则返回 true。
    line: 86-97
    name: has
  - code:
    - 'delete(key: K): boolean {'
    - '    const entry = this.cache.get(key);'
    - '    if (entry && this.onEvict) {'
    - '        this.onEvict(key, entry.value);'
    - '    }'
    - '    return this.cache.delete(key);'
    - '}'
    desc: 删除指定键；若该键存在且注册了逐出回调，则先触发 onEvict 回调，再从底层 Map 中删除并返回删除结果。
    line: 102-108
    name: delete
  - code:
    - 'clear(): void {'
    - '    if (this.onEvict) {'
    - '        for (const [key, entry] of this.cache) {'
    - '            this.onEvict(key, entry.value);'
    - '        }'
    - '    }'
    - '    this.cache.clear();'
    - '}'
    desc: 清空缓存中的所有条目；若注册了逐出回调，则对每一个现存条目逐一触发 onEvict 后再清空底层 Map。
    line: 113-120
    name: clear
  - code:
    - 'get size(): number {'
    - '    return this.cache.size;'
    - '}'
    desc: 只读 getter 属性，返回缓存中当前条目数量（包含可能已过期但尚未清理的条目）。
    line: 125-127
    name: size
  - code:
    - 'prune(): number {'
    - '    const now = Date.now();'
    - '    let pruned = 0;'
    - ''
    - '    for (const [key, entry] of this.cache) {'
    - '        if (now > entry.expiresAt) {'
    - '            this.delete(key);'
    - '            pruned++;'
    - '        }'
    - '    }'
    - ''
    - '    return pruned;'
    - '}'
    desc: 主动遍历缓存，删除所有已过期的条目，并返回本次被清理的条目数量；适合周期性调用做提前清理。
    line: 133-145
    name: prune
  - code:
    - 'keys(): K[] {'
    - '    const now = Date.now();'
    - '    const validKeys: K[] = [];'
    - ''
    - '    for (const [key, entry] of this.cache) {'
    - '        if (now <= entry.expiresAt) {'
    - '            validKeys.push(key);'
    - '        }'
    - '    }'
    - ''
    - '    return validKeys;'
    - '}'
    desc: 遍历缓存并收集所有尚未过期的键，返回由有效键组成的数组。
    line: 150-161
    name: keys
  - code:
    - 'private evictOldest(): void {'
    - '    let oldestKey: K | null = null;'
    - '    let oldestTime = Infinity;'
    - ''
    - '    for (const [key, entry] of this.cache) {'
    - '        if (entry.lastAccessed < oldestTime) {'
    - '            oldestTime = entry.lastAccessed;'
    - '            oldestKey = key;'
    - '        }'
    - '    }'
    - ''
    - '    if (oldestKey !== null) {'
    - '        this.delete(oldestKey);'
    - '    }'
    - '}'
    desc: 私有方法，遍历整个缓存查找 lastAccessed 最小的（即最久未访问的）条目并将其删除，用于容量达到上限时的 LRU 式逐出。
    line: 166-179
    name: evictOldest
  - code:
    - 'touch(key: K): boolean {'
    - '    const entry = this.cache.get(key);'
    - '    if (!entry) return false;'
    - ''
    - '    const now = Date.now();'
    - '    if (now > entry.expiresAt) {'
    - '        this.delete(key);'
    - '        return false;'
    - '    }'
    - ''
    - '    entry.expiresAt = now + this.ttlMs;'
    - '    entry.lastAccessed = now;'
    - '    return true;'
    - '}'
    desc: 为已存在且未过期的键刷新过期时间与最近访问时间（不修改缓存值），实现续约效果；键不存在或已过期时返回 false。
