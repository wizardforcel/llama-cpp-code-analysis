  name: ReactiveTTLMap
desc: 该文件实现了一个基于 TTL（Time-To-Live）机制的内存缓存工具模块，用于在 Svelte Web 前端中管理带自动过期和容量限制的缓存数据，避免长时间运行时的内存膨胀。模块提供了通用的
  TTLCache 类（支持逐出回调、LRU 式清理、主动 prune、touch 续约等）以及基于 Svelte 响应式状态 ($state) 封装的 ReactiveTTLMap
  类，二者均支持自定义 TTL 和最大条目数。
file: tools/server/webui/src/lib/utils/cache-ttl.ts
funcs:
- code:
  - import { DEFAULT_CACHE_TTL_MS, DEFAULT_CACHE_MAX_ENTRIES } from '$lib/constants';
  - export interface TTLCacheOptions {
  - '    /** Time-to-live in milliseconds. Default: 5 minutes */'
  - '    ttlMs?: number;'
  - '    /** Maximum number of entries. Oldest entries are evicted when exceeded.
    Default: 100 */'
  - '    maxEntries?: number;'
  - '    /** Callback when an entry expires or is evicted */'
  - '    onEvict?: (key: string, value: unknown) => void;'
  - '}'
  - interface CacheEntry<T> {
  - '    value: T;'
  - '    expiresAt: number;'
  - '    lastAccessed: number;'
  - '}'
  desc: 模块顶层全局代码：导入缓存默认常量，声明 TTLCacheOptions 公共配置接口（TTL、最大条目数、逐出回调）以及内部使用的 CacheEntry
    缓存条目结构（值、过期时间、最近访问时间）。
  line: 1-31
  name: __main__
