desc: 该文件实现了百度文心4.5 MoE（Mixture of Experts）模型图构建逻辑。它继承自llm_graph_context，在构造函数中构建完整的Transformer模型图，包括embedding层、带旋转位置编码的多头自注意力层、门控MLP层以及MoE专家层，并针对MoE架构实现了稀疏激活与共享专家机制。
