desc: 该头文件定义了 ggml 的张量分配器和计算图分配器相关接口。它声明了后端缓冲区、后端对象及分配器句柄类型，提供单个张量内存分配、计算图缓冲区预留与分配、缓冲区大小查询，以及根据上下文和后端创建并分配张量缓冲区等功能。文件仅包含类型定义、结构体定义和
  C API 函数声明，没有类或函数实现。
