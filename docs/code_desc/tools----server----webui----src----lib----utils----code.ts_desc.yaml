- code:
  - 'export function detectIncompleteCodeBlock(markdown: string): IncompleteCodeBlock
    | null {'
  - "\t// Count all code fences in the markdown"
  - "\t// A code block is incomplete if there's an odd number of ``` fences"
  - "\tconst fencePattern = new RegExp(FENCE_PATTERN.source, FENCE_PATTERN.flags);"
  - "\tconst fences: number[] = [];"
  - "\tlet fenceMatch;"
  - ''
  - "\twhile ((fenceMatch = fencePattern.exec(markdown)) !== null) {"
  - "\t\t// Store the position after the ```"
  - "\t\tconst pos = fenceMatch[0].startsWith(NEWLINE) ? fenceMatch.index + 1 : fenceMatch.index;"
  - "\t\tfences.push(pos);"
  - "\t}"
  - ''
  - "\t// If even number of fences (including 0), all code blocks are closed"
  - "\tif (fences.length % 2 === 0) {"
  - "\t\treturn null;"
  - "\t}"
  - ''
  - "\t// Odd number means last code block is incomplete"
  - "\t// The last fence is the opening of the incomplete block"
  - "\tconst openingIndex = fences[fences.length - 1];"
  - "\tconst afterOpening = markdown.slice(openingIndex + 3);"
  - ''
  - "\t// Extract language and code content"
  - "\tconst langMatch = afterOpening.match(LANG_PATTERN);"
  - "\tconst language = langMatch?.[1] || DEFAULT_LANGUAGE;"
  - "\tconst codeStartIndex = openingIndex + 3 + (langMatch?.[0]?.length ?? 0);"
  - "\tconst code = markdown.slice(codeStartIndex);"
  - ''
  - "\treturn {"
  - "\t\tlanguage,"
  - "\t\tcode,"
  - "\t\topeningIndex"
  - "\t};"
  - '}'
  desc: 检查 Markdown 字符串末尾是否存在未闭合的代码块。若存在，则返回该代码块的语言、未完成代码内容及起始位置；否则返回 null。
