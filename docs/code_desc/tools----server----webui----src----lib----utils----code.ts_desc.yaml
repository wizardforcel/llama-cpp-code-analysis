- code:
  - 'export function highlightCode(code: string, language: string): string {'
  - "\tif (!code) return '';"
  - ''
  - "\ttry {"
  - "\t\tconst lang = language.toLowerCase();"
  - "\t\tconst isSupported = hljs.getLanguage(lang);"
  - ''
  - "\t\tif (isSupported) {"
  - "\t\t\treturn hljs.highlight(code, { language: lang }).value;"
  - "\t\t} else {"
  - "\t\t\treturn hljs.highlightAuto(code).value;"
  - "\t\t}"
  - "\t} catch {"
  - "\t\t// Fallback to escaped plain text"
  - "\t\treturn code"
  - "\t\t\t.replace(AMPERSAND_REGEX, '&amp;')"
  - "\t\t\t.replace(LT_REGEX, '&lt;')"
  - "\t\t\t.replace(GT_REGEX, '&gt;');"
  - "\t}"
  - '}'
  desc: 使用 highlight.js 对给定代码进行语法高亮并返回 HTML。若语言不受支持则自动识别语言，失败时回退为 HTML 转义后的纯文本。
