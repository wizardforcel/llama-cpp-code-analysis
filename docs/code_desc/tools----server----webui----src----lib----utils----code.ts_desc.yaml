desc: 该文件为 WebUI 工具提供代码高亮和 Markdown 不完整代码块检测功能。它基于 highlight.js 将代码渲染为带语法高亮的 HTML，并可在解析
  Markdown 时判断结尾是否存在尚未闭合的代码块，便于增量渲染或流式处理场景。
