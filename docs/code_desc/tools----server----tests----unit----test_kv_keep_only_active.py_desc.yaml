classes:
- desc: A helper class that reads log file content incrementally, tracking the read
    position to only return new content since the last drain.
  methods:
  - code:
    - 'def __init__(self, path):'
    - '    self.path = path'
    - '    self.pos = 0'
    desc: Initializes the LogReader with a file path and sets the read position to
      0.
    line: 12-14
    name: __init__
  - code:
    - 'def drain(self):'
    - '    with open(self.path) as f:'
    - '        f.seek(self.pos)'
    - '        content = f.read()'
    - '        self.pos = f.tell()'
    - '    return content'
    desc: Reads and returns the new content appended to the log file since the last
      read, updating the read position.
    line: 15-20
    name: drain
  name: LogReader
desc: This test file validates the KV cache keep-only-active behavior in the server,
  specifically testing that idle slots are cleared from KV cache when new slots are
  launched, can be restored from cache-ram, and that this feature can be disabled
  via the no_clear_idle flag.
file: tools/server/tests/unit/test_kv_keep_only_active.py
