  - '        "id_slot": 0,'
  - '        "cache_prompt": True,'
  - '    })'
  - '    assert res.status_code == 200'
  - ''
  - '    # Request on different slot — should NOT trigger clearing'
  - '    res = server.make_request("POST", "/completion", data={'
  - '        "prompt": "The quick brown fox",'
