desc: 该文件实现了基于Hexagon HVX向量扩展的Flash Attention算子，针对Q、K、V均为F16类型（Q也可为F32）的注意力计算进行了高度优化。它利用DMA预取、VTCM片内存储和分块（block）处理策略，实现了高效的在线softmax计算，并支持attention
  bias、logit softcap和ALiBi位置编码等特性。文件核心是`op_flash_attn_ext`入口函数和多线程处理函数`flash_attn_ext_f16_thread`，以及一系列HVX向量数学优化函数。
