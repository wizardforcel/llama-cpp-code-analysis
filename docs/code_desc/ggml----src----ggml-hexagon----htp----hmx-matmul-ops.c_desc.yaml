desc: 该文件是 ggml 项目中 Hexagon DSP 后端（HTP）的矩阵乘法运算实现，专注于将各种量化权重格式（Q4_0、Q8_0、IQ4_NL、MXFP4）高效地反量化为
  FP16，并搬运到 HVX 向量寄存器中，同时执行 FP16 矩阵乘法、处理 VTCM 内存分配与分批执行等核心运算逻辑。该文件实现了基于 Hexagon HVX/HMX
  硬件加速器的矩阵乘法运算，主要针对 fp16/f32 混合精度（权重重排序为 fp16，激活为 f32）以及 x4x2 量化权重的矩阵乘法。文件提供了批处理（batched）、分组（grouped，用于
  GQA）和普通路径的矩阵乘实现，涉及 VTCM 管理、DMA 传输、权重重排、激活加载、矩阵计算核心以及输出存储等完整流程，并对大矩阵场景采用了流水线和驻留输出（out-stationary）等优化策略。该文件实现了基于Hexagon
  DSP的矩阵乘法算子，专注于FP16精度的量化权重矩阵乘法（QK 0 d16a32 out-stationary）。它通过多级分块、异步DMA传输（权重和激活数据）、FP32到FP16的转换以及核心矩阵累加（MMA）运算，优化了在VTCM内存受限环境下的矩阵乘法性能。
