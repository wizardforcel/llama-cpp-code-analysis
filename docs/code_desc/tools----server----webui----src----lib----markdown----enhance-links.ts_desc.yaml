desc: This file defines a Rehype plugin for Markdown processing that enhances all
  anchor elements by adding security attributes (target="_blank" and rel="noopener
  noreferrer"), ensuring external links open in new tabs safely and preventing potential
  security vulnerabilities like tabnabbing.
file: tools/server/webui/src/lib/markdown/enhance-links.ts
funcs:
