  - "\treturn (tree: Root) => {"
  - "\t\tvisit(tree, 'element', (node: Element) => {"
  - "\t\t\tif (node.tagName !== 'a') return;"
  - ''
  - "\t\t\tconst props = node.properties ?? {};"
  - ''
  - "\t\t\t// Only modify if href exists"
  - "\t\t\tif (!props.href) return;"
  - ''
  - "\t\t\tprops.target = '_blank';"
  - "\t\t\tprops.rel = 'noopener noreferrer';"
  - "\t\t\tnode.properties = props;"
  - "\t\t});"
  - "\t};"
  - '};'
