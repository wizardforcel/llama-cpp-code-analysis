desc: 该文件实现了一个用于测试Python (PyTorch) 与llama.cpp嵌入模型之间语义相似性的命令行工具。它支持加载指定提示词（单个提示或文件），从二进制文件中读取两个模型的嵌入向量，并通过多种指标（如向量范数、余弦相似度、相似度矩阵差异）进行对比分析，最后给出相似性评估结论。
