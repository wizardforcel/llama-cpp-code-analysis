desc: 该文件定义了 VirtGPU 虚拟 GPU 的后端缓冲区操作的远程过程调用（RPC）客户端实现，用于在客户端环境中封装对远程或虚拟 GPU 设备缓冲区的操作请求，如获取基地址、读写张量数据、复制张量、清空和释放缓冲区。每个函数都通过编码器、解码器和宏
  REMOTE_CALL 与远程 virtgpu 服务通信，并处理共享内存的分配、同步和释放，以确保大数据传输的效率和线程安全。
