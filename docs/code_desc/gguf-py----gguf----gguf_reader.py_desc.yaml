- desc: GGUF 文件读取器，负责解析 GGUF 文件的头部信息、元数据字段和张量数据。支持不同的字节序和量化类型，并提供字段和张量的查询接口。
  methods:
  - code:
    - 'def __init__(self, path: os.PathLike[str] | str, mode: Literal[''r'', ''r+'',
      ''c''] = ''r''):'
    - '    self.data = np.memmap(path, mode = mode)'
    - '    offs = 0'
    - ''
    - '    # Check for GGUF magic'
    - '    if self._get(offs, np.uint32, override_order = ''<'')[0] != GGUF_MAGIC:'
    - '        raise ValueError(''GGUF magic invalid'')'
    - '    offs += 4'
    - ''
    - '    # Check GGUF version'
    - '    temp_version = self._get(offs, np.uint32)'
    - '    if temp_version[0] & 65535 == 0:'
    - '        # If we get 0 here that means it''s (probably) a GGUF file created
      for'
    - '        # the opposite byte order of the machine this script is running on.'
    - '        self.byte_order = ''S'''
    - '        temp_version = temp_version.view(temp_version.dtype.newbyteorder(self.byte_order))'
    - '    version = temp_version[0]'
    - '    if version not in READER_SUPPORTED_VERSIONS:'
    - '        raise ValueError(f''Sorry, file appears to be version {version} which
      we cannot handle'')'
    - '    if sys.byteorder == "little":'
    - '        # Host is little endian'
    - '        host_endian = GGUFEndian.LITTLE'
    - '        swapped_endian = GGUFEndian.BIG'
    - '    else:'
    - '        # Sorry PDP or other weird systems that don''t use BE or LE.'
    - '        host_endian = GGUFEndian.BIG'
    - '        swapped_endian = GGUFEndian.LITTLE'
    - '    self.endianess = swapped_endian if self.byte_order == "S" else host_endian'
    - '    self.fields: OrderedDict[str, ReaderField] = OrderedDict()'
    - '    self.tensors: list[ReaderTensor] = []'
    - '    offs += self._push_field(ReaderField(offs, ''GGUF.version'', [temp_version],
      [0], [GGUFValueType.UINT32]))'
    - ''
    - '    # Check tensor count and kv count'
    - '    temp_counts = self._get(offs, np.uint64, 2)'
    - '    offs += self._push_field(ReaderField(offs, ''GGUF.tensor_count'', [temp_counts[:1]],
      [0], [GGUFValueType.UINT64]))'
    - '    offs += self._push_field(ReaderField(offs, ''GGUF.kv_count'', [temp_counts[1:]],
      [0], [GGUFValueType.UINT64]))'
    - '    tensor_count, kv_count = temp_counts'
    - '    offs = self._build_fields(offs, kv_count)'
    - ''
    - '    # Build Tensor Info Fields'
    - '    offs, tensors_fields = self._build_tensor_info(offs, tensor_count)'
    - '    new_align = self.fields.get(''general.alignment'')'
    - '    if new_align is not None:'
    - '        if new_align.types != [GGUFValueType.UINT32]:'
    - '            raise ValueError(''Bad type for general.alignment field'')'
    - '        self.alignment = new_align.parts[-1][0]'
    - '        # Ensure alignment is a non-zero power of two'
    - '        if self.alignment == 0 or (self.alignment & (self.alignment - 1)) !=
      0:'
    - '            raise ValueError(''Invalid alignment: must be a non-zero power
      of two'')'
    - '    padding = offs % self.alignment'
    - '    if padding != 0:'
    - '        offs += self.alignment - padding'
    - '    self.data_offset = offs'
    - '    self._build_tensors(offs, tensors_fields)'
    desc: 构造函数，读取 GGUF 文件并解析其头部信息、字段和张量数据。
