  - code:
    - def _get(
    - '    self, offset: int, dtype: npt.DTypeLike, count: int = 1, override_order:
      None | Literal[''I'', ''S'', ''<''] = None,'
    - ') -> npt.NDArray[Any]:'
    - '    count = int(count)'
    - '    itemsize = int(np.empty([], dtype = dtype).itemsize)'
    - '    end_offs = offset + itemsize * count'
    - '    arr = self.data[offset:end_offs].view(dtype=dtype)[:count]'
    - '    return arr.view(arr.dtype.newbyteorder(self.byte_order if override_order
      is None else override_order))'
    desc: 内部方法，从指定偏移量读取指定类型的数据，并考虑字节序。
    line: 189-194
    name: _get
  - code:
    - 'def _push_field(self, field: ReaderField, skip_sum: bool = False) -> int:'
    - '    if field.name in self.fields:'
    - '        # TODO: add option to make this a warning and accept duplicate keys
      like below'
    - '        raise KeyError(f''Duplicate {field.name} already in list at offset
      {field.offset}'')'
    - ''
    - '        # logger.warning(f''Duplicate key {field.name} at offset {field.offset}'')'
    - '        # self.fields[field.name + ''_{}''.format(field.offset)] = field'
    - '    else:'
    - '        self.fields[field.name] = field'
    - '    return 0 if skip_sum else sum(int(part.nbytes) for part in field.parts)'
    desc: 内部方法，将字段添加到字段字典中，并返回字段数据的总字节数。
    line: 197-203
    name: _push_field
  - code:
    - 'def _get_str(self, offset: int) -> tuple[npt.NDArray[np.uint64], npt.NDArray[np.uint8]]:'
    - '    slen = self._get(offset, np.uint64)'
    - '    return slen, self._get(offset + 8, np.uint8, slen[0])'
    desc: 内部方法，从指定偏移量读取一个字符串，返回长度和数据。
    line: 205-206
    name: _get_str
  - code:
    - def _get_field_parts(
    - '    self, orig_offs: int, raw_type: int,'
    - ') -> tuple[int, list[npt.NDArray[Any]], list[int], list[GGUFValueType]]:'
    - '    offs = orig_offs'
    - '    types: list[GGUFValueType] = []'
    - '    gtype = GGUFValueType(raw_type)'
    - '    types.append(gtype)'
    - '    # Handle strings.'
    - '    if gtype == GGUFValueType.STRING:'
    - '        sparts: list[npt.NDArray[Any]] = list(self._get_str(offs))'
    - '        size = sum(int(part.nbytes) for part in sparts)'
    - '        return size, sparts, [1], types'
    - '    # Check if it''s a simple scalar type.'
    - '    nptype = self.gguf_scalar_to_np.get(gtype)'
    - '    if nptype is not None:'
    - '        val = self._get(offs, nptype)'
    - '        return int(val.nbytes), [val], [0], types'
    - '    # Handle arrays.'
    - '    if gtype == GGUFValueType.ARRAY:'
    - '        raw_itype = self._get(offs, np.uint32)'
    - '        offs += int(raw_itype.nbytes)'
    - '        alen = self._get(offs, np.uint64)'
    - '        offs += int(alen.nbytes)'
    - '        aparts: list[npt.NDArray[Any]] = [raw_itype, alen]'
    - '        data_idxs: list[int] = []'
    - '        # FIXME: Handle multi-dimensional arrays properly instead of flattening'
    - '        for idx in range(alen[0]):'
    - '            curr_size, curr_parts, curr_idxs, curr_types = self._get_field_parts(offs,
      raw_itype[0])'
    - '            if idx == 0:'
    - '                types += curr_types'
    - '            idxs_offs = len(aparts)'
    - '            aparts += curr_parts'
    - '            data_idxs += (idx + idxs_offs for idx in curr_idxs)'
    - '            offs += curr_size'
    - '        return offs - orig_offs, aparts, data_idxs, types'
    - '    # We can''t deal with this one.'
    - '    raise ValueError(f''Unknown/unhandled field type {gtype}'')'
    desc: 内部方法，递归解析字段数据，处理字符串、标量和数组类型，返回数据大小、分片、索引和类型。
    line: 208-229
    name: _get_field_parts
  - code:
    - 'def _get_tensor_info_field(self, orig_offs: int) -> ReaderField:'
    - '    offs = orig_offs'
    - ''
    - '    # Get Tensor Name'
    - '    name_len, name_data = self._get_str(offs)'
    - '    offs += int(name_len.nbytes + name_data.nbytes)'
    - ''
    - '    # Get Tensor Dimensions Count'
    - '    n_dims = self._get(offs, np.uint32)'
    - '    offs += int(n_dims.nbytes)'
    - ''
    - '    # Get Tensor Dimension Array'
    - '    dims = self._get(offs, np.uint64, n_dims[0])'
    - '    offs += int(dims.nbytes)'
    - ''
    - '    # Get Tensor Encoding Scheme Type'
    - '    raw_dtype = self._get(offs, np.uint32)'
    - '    offs += int(raw_dtype.nbytes)'
    - ''
    - '    # Get Tensor Offset'
    - '    offset_tensor = self._get(offs, np.uint64)'
    - '    offs += int(offset_tensor.nbytes)'
    - ''
    - '    return ReaderField('
    - '        orig_offs,'
    - '        str(bytes(name_data), encoding = ''utf-8''),'
    - '        [name_len, name_data, n_dims, dims, raw_dtype, offset_tensor],'
    - '        [1, 3, 4, 5],'
    - '    )'
    desc: 内部方法，解析单个张量的信息字段，包括名称、维度、类型和偏移量。
    line: 231-251
    name: _get_tensor_info_field
  - code:
    - 'def _build_fields(self, offs: int, count: int) -> int:'
    - '    for _ in range(count):'
    - '        orig_offs = offs'
    - '        kv_klen, kv_kdata = self._get_str(offs)'
    - '        offs += int(kv_klen.nbytes + kv_kdata.nbytes)'
    - '        raw_kv_type = self._get(offs, np.uint32)'
    - '        offs += int(raw_kv_type.nbytes)'
    - '        parts: list[npt.NDArray[Any]] = [kv_klen, kv_kdata, raw_kv_type]'
    - '        idxs_offs = len(parts)'
    - '        field_size, field_parts, field_idxs, field_types = self._get_field_parts(offs,
      raw_kv_type[0])'
    - '        parts += field_parts'
    - '        self._push_field(ReaderField('
    - '            orig_offs,'
    - '            str(bytes(kv_kdata), encoding = ''utf-8''),'
    - '            parts,'
    - '            [idx + idxs_offs for idx in field_idxs],'
    - '            field_types,'
    - '        ), skip_sum = True)'
    - '        offs += field_size'
    - '    return offs'
    desc: 内部方法，解析所有元数据字段。
    line: 253-268
    name: _build_fields
  - code:
    - 'def _build_tensor_info(self, offs: int, count: int) -> tuple[int, list[ReaderField]]:'
    - '    tensor_fields = []'
    - '    for _ in range(count):'
    - '        field = self._get_tensor_info_field(offs)'
    - '        offs += sum(int(part.nbytes) for part in field.parts)'
    - '        tensor_fields.append(field)'
    - '    return offs, tensor_fields'
    desc: 内部方法，解析所有张量的信息字段。
