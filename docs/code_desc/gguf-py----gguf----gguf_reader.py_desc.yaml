  name: GGUFReader
desc: 该文件实现了 GGUF 模型的读取和解析功能。它定义了 GGUFReader 类，用于读取 GGUF 格式的文件，解析其头部信息、元数据字段和模型张量，支持不同字节序和量化类型。同时定义了
  ReaderField 和 ReaderTensor 两个数据结构，分别用于存储字段和张量的解析结果。
file: gguf-py/gguf/gguf_reader.py
