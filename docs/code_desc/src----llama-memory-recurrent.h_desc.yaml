desc: The file defines the recurrent memory implementation for llama.cpp, managing
  recurrent neural network state (R and S tensors) across sequences. It provides a
  memory interface for batch initialization, sequence operations, state persistence,
  and slot allocation, along with a context class that holds per-ubatch state for
  graph computation.
