desc: 该文件是 gguf-py 包的量化测试脚本，用于验证 Python 实现的 gguf.quants 模块中的量化和反量化功能与 C 实现的 libggml
  库完全一致。它通过 ctypes 加载动态链接库，对多种量化类型逐一进行对比测试，包括对随机数据、全零块和随机 f16 数据（作为反量化输入）进行量化与反量化，并比较结果是否位级一致，输出详细的差异统计。
file: gguf-py/tests/test_quants.py
funcs:
- code:
  - 'def compare_tensors(t1: np.ndarray, t2: np.ndarray, qtype: GGMLQuantizationType)
    -> bool:'
  - '    same = np.array_equal(t1, t2)'
  - '    if same:'
  - '        return True'
  - '    else:'
  - '        block_size, type_size = gguf.GGML_QUANT_SIZES[qtype]'
  - '        if t1.dtype == np.float32:'
  - '            t1 = t1.reshape((-1, block_size))'
  - '            t2 = t2.reshape((-1, block_size))'
  - '        else:'
  - '            t1 = t1.reshape((-1, type_size))'
  - '            t2 = t2.reshape((-1, type_size))'
  - '        x = t1.view(np.uint8) ^ t2.view(np.uint8)'
  - '        diff_bits = np.count_nonzero(np.unpackbits(x, axis=-1), axis=-1)'
  - '        num_bad_blocks = np.count_nonzero(diff_bits, axis=0)'
  - '        if num_bad_blocks == 0 and t1.shape == t2.shape:'
  - '            logger.debug("Bits are equal, but arrays don''t match, likely contains
    NANs")'
  - '            return True'
  - '        logger.debug(f"{num_bad_blocks} bad blocks ({100 * num_bad_blocks / x.shape[0]:.6f}%)")'
  - '        bad_block_id = np.argmax(diff_bits, axis=0)'
  - '        logger.debug(f"Worst block id: {bad_block_id}")'
  - '        logger.debug(f"Sample bad block ({diff_bits[bad_block_id]} differing
    bits):\n{t1[bad_block_id]}\nReference:\n{t2[bad_block_id]}")'
  - '        sum_diff_bits = np.sum(diff_bits)'
  - '        logger.debug(f"{sum_diff_bits} bits differ ({100 * sum_diff_bits / (x.size
    * 8):.6f}%)")'
  - '        return False'
  desc: 比较两个 numpy 张量是否一致；对于不一致的浮点或字节张量，进一步按块分析位差异，诊断是否仅因 NaN 导致，并输出位差异统计。
  line: 90-110
  name: compare_tensors
- code:
  - 'def do_test(libggml_path: Path, quick: bool = False, user_type: GGMLQuantizationType
    | None = None):'
  - '    ggml_quants = GGMLQuants(libggml_path)'
  - '    np.set_printoptions(precision=None, threshold=(4 * 256) + 1, formatter={"int":
    lambda n: "0x%02X" % n})'
  - '    r = np.random.randn(8, 1024, 1024).astype(np.float32, copy=False)'
  - '    # test zero blocks'
  - '    r[0, 0, :] = 0'
  - '    for qtype in ((GGMLQuantizationType.F16, *gguf.quants._type_traits.keys())
    if user_type is None else (user_type,)):'
  - '        has_dequantize = False'
  - '        has_quantize = False'
  - '        try:'
  - '            gguf.dequantize(np.zeros((gguf.GGML_QUANT_SIZES[qtype][1]), dtype=np.uint8),
    qtype)'
  - '            has_dequantize = True'
  - '        except (NotImplementedError, AssertionError) as e:'
  - '            if isinstance(e, AssertionError):'
  - '                logger.error(f"Error with {qtype.name}: {e}")'
  - '                raise e'
  - '        try:'
  - '            gguf.quantize(np.zeros((gguf.GGML_QUANT_SIZES[qtype][0]), dtype=np.float32),
    qtype)'
  - '            has_quantize = True'
  - '        except (NotImplementedError, AssertionError) as e:'
  - '            if isinstance(e, AssertionError):'
  - '                logger.error(f"Error with {qtype.name}: {e}")'
  - '                raise e'
  - '        if not has_dequantize and not has_quantize:'
  - '            continue'
  - '        logger.info(f"Testing {qtype.name}")'
  - '        rc = r.copy(order="C")'
  - '        pyq = None'
  - '        ggq = None'
  - '        if has_quantize:'
  - '            logger.debug(f"Quantizing to {qtype.name} with Python")'
  - '            pyq = gguf.quants.quantize(rc, qtype)'
  - '            logger.debug(f"Quantizing to {qtype.name} with C")'
  - '            ggq = ggml_quants.quantize(rc, qtype)'
  - '            if qtype == GGMLQuantizationType.F16:'
  - '                pyq = pyq.view(np.uint8)'
  - '            quant_equal = compare_tensors(pyq, ggq, qtype)'
  - '            if not quant_equal:'
  - '                logger.error(f"Quantization to {qtype.name} does not match ❌")'
  - '            else:'
  - '                logger.info(f"Quantization to {qtype.name} matches exactly ✅")'
  - '        if has_dequantize:'
  - '            if ggq is None and not quick:'
  - '                logger.debug(f"Quantizing to {qtype.name} with C")'
  - '                ggq = ggml_quants.quantize(rc, qtype)'
  - '            if ggq is not None:'
  - '                logger.debug(f"Dequantizing from {qtype.name} with Python")'
  - '                pydq = gguf.quants.dequantize(ggq, qtype)'
  - '                logger.debug(f"Dequantizing from {qtype.name} with C")'
  - '                ggdq = ggml_quants.dequantize(ggq, qtype)'
  - '                dequant_equal = compare_tensors(pydq, ggdq, qtype)'
  - '                if not dequant_equal:'
  - '                    logger.error(f"Dequantization from {qtype.name} does not
    match ❌")'
  - '                else:'
  - '                    logger.info(f"Dequantization from {qtype.name} matches exactly
    ✅")'
  - '            rq_shape = gguf.quants.quant_shape_to_byte_shape((8, 1024, 1024 //
    2), qtype)'
  - '            rq = np.random.random(rq_shape).astype(np.float16).view(np.uint8)'
  - '            logger.debug(f"Dequantizing random f16 data as {qtype.name} with
    Python")'
  - '            pydq = gguf.quants.dequantize(rq, qtype)'
  - '            logger.debug(f"Dequantizing random f16 data as {qtype.name} with
    C")'
  - '            ggdq = ggml_quants.dequantize(rq, qtype)'
  - '            dequant_equal = compare_tensors(pydq, ggdq, qtype)'
  - '            if not dequant_equal:'
  - '                logger.error(f"Dequantization from random f16 data as {qtype.name}
    does not match ❌")'
  - '            else:'
  - '                logger.info(f"Dequantization from random f16 data as {qtype.name}
    matches exactly ✅")'
  desc: 主测试函数。加载 GGMLQuants 实例，生成随机测试数据（含全零块），对每种（或指定）量化类型执行 Python 与 C 的量化和反量化对比，并分别输出匹配结果。
  line: 112-151
  name: do_test
