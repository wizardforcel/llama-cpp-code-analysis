desc: 该文件提供了为 API 请求生成 HTTP 头部信息的工具函数，包含授权信息（如 Bearer Token）及 JSON 标准头，方便在前端进行接口访问认证与数据交互。
file: tools/server/webui/src/lib/utils/api-headers.ts
funcs:
- code:
  - 'export function getAuthHeaders(): Record<string, string> {'
  - "\tconst currentConfig = config();"
  - "\tconst apiKey = currentConfig.apiKey?.toString().trim();"
  - "\treturn apiKey ? { Authorization: `Bearer ${apiKey}` } : {};"
  - '}'
  desc: 获取带有授权信息的头部对象，如果配置了 API 密钥则返回包含 Authorization 的对象，否则返回空对象。
  line: 8-13
  name: getAuthHeaders
- code:
  - 'export function getJsonHeaders(): Record<string, string> {'
  - "\treturn {"
  - "\t\t'Content-Type': 'application/json',"
  - "\t\t...getAuthHeaders()"
  - "\t};"
  - '}'
  desc: 获取带有 JSON Content-Type 和（可选）Authorization 信息的请求头对象。
  line: 16-21
  name: getJsonHeaders
