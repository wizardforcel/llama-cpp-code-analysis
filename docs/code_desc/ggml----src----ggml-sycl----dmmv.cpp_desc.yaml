desc: 该文件实现了SYCL（异构编程框架）下的反量化矩阵-向量乘法（dequantize-matrix-multiply-vector）的内核函数，包含了多种量化格式（如FP16、FP32、Q2_K至Q6_K等）的处理逻辑，支持基于sub-group的并行归约，为SYCL后端提供高性能的计算内核。该文件实现了SYCL后端中多种量化格式（如Q4_0、Q4_1、Q5_0、Q5_1、Q8_0、Q2_K、Q3_K、Q4_K、Q5_K、Q6_K）下的反量化矩阵-向量乘法（dequantized
  matrix-matrix-vector multiplication, DMMV）内核及调度逻辑。通过利用SYCL的并行计算能力和子组（sub-group）协作机制，为每种量化格式提供专用的高性能实现，并通过ggml_sycl_op_dequantize_mul_mat_vec入口函数根据源张量的量化类型分派到相应的内核函数进行执行。
file: ggml/src/ggml-sycl/dmmv.cpp
