desc: 该文件实现了一组 CORS 代理工具函数，用于通过 llama-server 的 CORS 代理端点路由请求，提供构建代理 URL、包装请求头以及获取代理
  URL 字符串的功能，帮助前端绕过浏览器的跨域限制。
file: tools/server/webui/src/lib/utils/cors-proxy.ts
funcs:
- code:
  - 'export function buildProxiedUrl(targetUrl: string): URL {'
  - "\tconst proxyPath = `${base}${CORS_PROXY_ENDPOINT}`;"
  - "\tconst proxyUrl = new URL(proxyPath, window.location.origin);"
  - ''
  - "\tproxyUrl.searchParams.set(CORS_PROXY_URL_PARAM, targetUrl);"
  - ''
  - "\treturn proxyUrl;"
  - '}'
  desc: 构建通过 llama-server CORS 代理路由的 URL，将目标 URL 编码为查询参数附加到代理端点
  line: 12-19
  name: buildProxiedUrl
- code:
  - 'export function buildProxiedHeaders(headers: Record<string, string>): Record<string,
    string> {'
  - "\tconst proxiedHeaders: Record<string, string> = {};"
  - ''
  - "\tfor (const [key, value] of Object.entries(headers)) {"
  - "\t\tproxiedHeaders[`x-proxy-header-${key}`] = value;"
  - "\t}"
  - ''
  - "\treturn proxiedHeaders;"
  - '}'
  desc: 将原始请求头包装为代理格式，为每个键添加 x-proxy-header- 前缀，避免 llama.cpp 特定头与目标头重复冲突
  line: 26-34
  name: buildProxiedHeaders
- code:
  - 'export function getProxiedUrlString(targetUrl: string): string {'
