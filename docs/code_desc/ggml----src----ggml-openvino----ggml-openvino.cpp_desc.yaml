desc: 该文件实现了ggml后端中基于OpenVINO的设备支持，主要定义了缓冲区管理、设备信息查询和后端初始化等功能。它通过ov::Tensor和OpenCL
  USM技术提供了CPU/GPU/NPU上的权重存储与数据拷贝能力，并为上层计算图执行预留接口。该文件是 ggml 库的 OpenVINO 后端实现，主要功能是向
  ggml 库注册 OpenVINO 设备后端。它定义了一系列函数和数据结构来实现后端接口，包括设备操作支持检查、算子支持情况检查、后端注册等，以及与 OpenVINO
  SDK 的集成，从而让 ggml 能够利用 OpenVINO 进行硬件加速推理。
