- desc: 管理OpenVINO缓冲区上下文，负责为张量分配内存（主机或设备远程内存），并跟踪所有张量的附加信息以便统一清理。
  methods:
  - code:
    - 'ggml_backend_openvino_buffer_context(int device, size_t size, bool is_remote
      = false) :'
    - '    device(device),'
    - '    name(std::string(GGML_OPENVINO_NAME) + std::to_string(device)),'
    - '    id([]() {'
    - '        static std::atomic<size_t> next_id{1};'
    - '        return next_id.fetch_add(1);'
    - '    }()),'
    - '    data(nullptr),'
    - '    size(size),'
    - '    is_remote(is_remote) {'
    - '    if (size == 0) {'
    - '        return;'
    - '    }'
    - '    const auto & device_name = ggml_openvino_get_device_name();'
    - '    if (is_remote) {'
    - '        GGML_ASSERT(device_name == "GPU");'
    - '        auto remote_context = ggml_openvino_get_remote_context();'
    - '        auto gpu_context = remote_context->as<ov::intel_gpu::ocl::ClContext>();'
    - '        ov::intel_gpu::ocl::USMTensor usm_tensor ='
    - '            gpu_context.create_usm_device_tensor(ov::element::u8, ov::Shape{size});'
    - '        data = usm_tensor.get();'
    - '        ov_buffer = std::make_shared<ov::intel_gpu::ocl::USMTensor>(std::move(usm_tensor));'
    - '    } else {'
    - '        data = ggml_aligned_malloc(size);'
    - '        GGML_ASSERT(data);'
    - '        memset(data, 0, size);'
    - '        ov_buffer = std::make_shared<ov::Tensor>(ov::element::u8, ov::Shape{size},
      data);'
    - '    }'
    - '    if (data == nullptr) {'
    - '        GGML_LOG_ERROR("%s: failed to allocate %zu bytes\n", __func__, size);'
    - '        return;'
    - '    }'
    - '    if (reinterpret_cast<uintptr_t>(data) % TENSOR_ALIGNMENT != 0) {'
    - '        GGML_LOG_ERROR("%s: %s buffer is not aligned to %d bytes\n", __func__,
      device_name.c_str(), TENSOR_ALIGNMENT);'
    - '        GGML_ABORT("fatal error");'
    - '    }'
    - '}'
