  name: llm_build_grovemoe
desc: 该文件是llama.cpp中grovemoe模型的实现源文件，定义了llm_build_grovemoe类的构造函数，用于构建GroveMoE（Grouped
  MoE）模型的完整前向传播计算图。该模型使用分组专家混合（MoE）架构，在每一层中执行自注意力（Self-Attention）、多头注意力（Multi-Head
  Attention）以及动态的专家混合前馈网络（MoE-FFN），其中包含安全的MoE和相邻MoE两阶段处理，并支持RoPE位置编码、RMS归一化及输出投影等操作。
