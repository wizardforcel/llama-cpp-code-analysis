desc: 该文件是 ggml 库中 Metal 后端的公共接口头文件，定义了基于 Apple Metal 框架的 GPU 计算后端 API。其主要功能是提供一组函数，允许用户将
  ggml 计算图（ggml_cgraph）从 CPU 执行转移到 Metal GPU 上执行，从而实现加速。接口包括了后端初始化、类型检查、中止回调设置、特性支持查询和计算捕获等核心功能，并声明了与
  Metal 后端注册相关的机制。
file: ggml/include/ggml-metal.h
funcs:
- code:
  - '// Note: this description is outdated'
  - //
  - // An interface allowing to compute ggml_cgraph with Metal
  - //
  - // This is a fully functional interface that extends ggml with GPU support for
    Apple devices.
  - // A similar interface can be created for other GPU backends (e.g. Vulkan, CUDA,
    etc.)
  - //
  - // How it works?
  - //
  - // As long as your program can create and evaluate a ggml_cgraph on the CPU, you
    can use this
  - // interface to evaluate the same graph on the GPU. Instead of using ggml_graph_compute(),
    you
  - // use ggml_metal_graph_compute() (or ggml_vulkan_graph_compute(), etc.)
  - //
  - // You only need to make sure that all memory buffers that you used during the
    graph creation
  - // are mapped to the device memory with the ggml_metal_add_buffer() function.
    This mapping is
  - // used during the graph evaluation to determine the arguments of the compute
    kernels.
  - //
  - // Synchronization between device and host memory (for example for input and output
    tensors)
  - // is done with the ggml_metal_set_tensor() and ggml_metal_get_tensor() functions.
  - //
