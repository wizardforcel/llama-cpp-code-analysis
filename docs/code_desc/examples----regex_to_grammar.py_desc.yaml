classes: []
desc: 该文件是一个命令行工具脚本，用于将正则表达式模式转换为LLM的语法表示。它接收正则表达式作为命令行参数，调用同目录下的json_schema_to_grammar.py脚本，将正则表达式包装在JSON
  Schema的string类型定义中，并通过子进程传递，最终打印出转换后生成的语法规则到标准输出。
file: examples/regex_to_grammar.py
funcs:
- code:
  - import json, subprocess, sys, os
  - ''
  - assert len(sys.argv) >= 2
  - '[_, pattern, *rest] = sys.argv'
  - ''
  - print(subprocess.check_output(
  - '    ['
  - '        "python",'
  - '        os.path.join('
  - '        os.path.dirname(os.path.realpath(__file__)),'
  - '        "json_schema_to_grammar.py"),'
  - '        *rest,'
  - '        "-",'
  - '        "--raw-pattern",'
  - '    ],'
  - '    text=True,'
  - '    input=json.dumps({'
  - '        "type": "string",'
  - '        "pattern": pattern,'
  - '    }, indent=2)))'
  desc: 文件的主入口，负责解析命令行参数，构造JSON Schema结构，调用外部脚本进行正则到语法的转换，并输出结果。
  line: 1-20
  name: __main__
