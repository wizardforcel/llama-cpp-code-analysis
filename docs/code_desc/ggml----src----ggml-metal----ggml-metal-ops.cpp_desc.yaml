desc: 该文件是llama.cpp项目中ggml-metal后端的操作编码实现，负责将各种张量操作（如矩阵乘法、卷积、归一化、注意力等）编码为Metal计算管线的调用，支持融合、并发编码和调试追踪。The
  file ggml-metal-ops.cpp implements the Metal GPU backend operations for the GGML
  tensor library. It contains a large collection of functions that set up and dispatch
  Metal compute pipelines for various tensor operations including cumulative sum,
  data row fetching/setting, diagonal extraction, softmax, SSM convolution and scan,
  RWKV, gated delta networks, triangular solves, copy, pooling, and matrix multiplication.
  Each operation function extracts tensor metadata, prepares kernel arguments, selects
  the appropriate Metal pipeline, binds buffers, and dispatches threadgroups to the
  GPU.该文件是 ggml 库中 Metal 后端的操作实现文件，负责将各种神经网络算子（如矩阵乘法、加法、Flash Attention 等）映射为 Metal
  GPU 内核调用。它实现了从 ggml 中间表示到 Metal 计算管线的转换，包括参数解析、内存缓冲区绑定、线程组调度和内核分发等核心功能。该文件是 ggml
  项目中用于 Metal GPU 加速的操作实现文件，定义了各种张量运算（flash attention、归一化、卷积、填充等）的 Metal 编码函数，通过设置计算管线、缓冲区绑定和线程组调度来完成
  GPU 上的计算任务。该文件是 ggml 项目中 Metal 后端的算子实现文件，包含了在 Metal GPU 上执行的各种神经网络算子的实现，从 pad_reflect
  填充到 argmax、argsort 排序再到优化器 step 等。它通过统一的模式将 ggml 图节点转换为 Metal 计算着色器的调度，覆盖了张量操作、归约和优化算法的
  GPU 加速。
file: ggml/src/ggml-metal/ggml-metal-ops.cpp
