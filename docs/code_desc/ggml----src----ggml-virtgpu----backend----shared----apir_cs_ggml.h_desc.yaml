  - static inline const ggml_tensor * apir_decode_ggml_tensor_inplace(apir_decoder
    * dec) {
  - '    // it safe to remove the `const` qualifier here, we *do* want to'
  - '    // modify the shared memory data to fix the `src` pointers.'
  - '    ggml_tensor * tensor = (ggml_tensor *) (uintptr_t) apir_decoder_use_inplace(dec,
    sizeof(ggml_tensor));'
  - ''
  - '    // tensor->data is a pointer inside the device buffer. No need to touch it'
  - '    // tensor->buffer is a pointer to a buffer. Decode the buffer handle encoded
    in sequence.'
  - '    if (tensor->buffer) {'
  - '        tensor->buffer = apir_decode_ggml_buffer(dec);'
  - '    }'
  - ''
  - '    if (tensor->view_src) {'
  - '        ggml_tensor * tensor_view_src = (ggml_tensor *) (uintptr_t) apir_decoder_use_inplace(dec,
    sizeof(ggml_tensor));'
  - '        tensor->view_src              = tensor_view_src;'
  - '    }'
  - ''
  - '    for (int i = 0; tensor->src[i]; i++) {'
  - '        ggml_tensor * tensor_src = (ggml_tensor *) (uintptr_t) apir_decoder_use_inplace(dec,
    sizeof(ggml_tensor));'
  - '        tensor->src[i] = tensor_src;  // overwrite op->src[i] pointer with the
    actual location of the src tensor'
  - '    }'
  - ''
  - '    return tensor;'
  - '}'
