  name: sha256_t
desc: 该文件是SHA-256哈希算法的头文件，定义了SHA-256算法的上下文结构体（sha256_t），并声明了四个核心的哈希计算函数：初始化、更新（处理数据块）、最终化（生成摘要）和一次性哈希函数。它为使用SHA-256进行数据完整性校验提供了简洁的C语言接口。
