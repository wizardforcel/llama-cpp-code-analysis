desc: 该文件是 Hexagon DSP 平台（高通 HVX 向量处理器）的基础类型定义头文件。它通过宏定义了数据类型大小和向量长度常量，并提供了两个核心类型：一个联合体
  HVX_VectorAlias（将 128 字节 HVX 向量寄存器映射为字节/半字/字/浮点数组，便于标量访问），以及三个复合结构体 HVX_Vector_x2/x4/x8（用于组合多个
  HVX 向量，以支持宽数据路径和高吞吐量的 SIMD 运算）。这些类型和宏构成了 ggml 在 Hexagon 后端实现神经网络矩阵乘法和卷积等算子时的数据存储与访问基础。
file: ggml/src/ggml-hexagon/htp/hvx-types.h
