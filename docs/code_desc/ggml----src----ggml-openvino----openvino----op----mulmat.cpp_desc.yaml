classes: []
desc: 该文件定义了 OpenVINO 前端中 GGML 模型的 MulMat（矩阵乘法）算子转换逻辑，通过处理不同的操作模式（op_case）、批量大小不匹配和数据类型转换，将
  GGML 的 MulMat 算子映射为 OpenVINO 的 MatMul 算子，并处理必要的广播和重塑操作。
file: ggml/src/ggml-openvino/openvino/op/mulmat.cpp
funcs:
- code:
  - OutputVector translate_mulmat(const NodeContext & context) {
  - '    num_inputs_check(context, 2, 2);'
  - ''
  - '    int op_case = context.get_op_case();'
  - ''
  - '    ov::Output<Node> res;'
  - '    ov::Output<ov::Node> B = context.get_input(0);'
  - '    ov::Output<ov::Node> A = context.get_input(1);'
  - ''
  - '    bool transpose_b = true;'
  - '    if (op_case == 2) {'
  - '        B = B.get_node_shared_ptr()->input_value(0);'
  - '        transpose_b = false;'
  - '    } else if (op_case == 3) {'
  - '        B = process_view_input(context, 0);'
  - '        A = process_view_input(context, 1);'
  - '    }'
  - '    if (A.get_element_type() != B.get_element_type()) {'
  - '        B = std::make_shared<ov::op::v0::Convert>(context.get_input(0), context.get_input_type(1));'
  - '    }'
  - ''
  - '    auto B_shape = context.get_input_shape(0).to_shape();'
  - '    auto A_shape = context.get_input_shape(1).to_shape();'
  - '    int64_t A_batch = A_shape[1];'
  - '    int64_t B_batch = B_shape[1];'
  - ''
  - '    auto A_batch_larger = A_batch > B_batch;'
  - '    auto batch_large = A_batch_larger ? A_batch : B_batch;'
  - '    auto batch_small = A_batch_larger ? B_batch : A_batch;'
  - ''
  - '    Output<Node> Z = A_batch_larger ? B : A;'
  - '    int64_t factor = batch_large / batch_small;'
  - '    if (factor > 1 && batch_small > 1) {'
  - '        auto batch_large_node = ov::op::v0::Constant::create(ov::element::i64,
    {1}, std::vector<int64_t>{batch_large});'
  - '        auto batch_small_node = ov::op::v0::Constant::create(ov::element::i64,
    {1}, std::vector<int64_t>{batch_small});'
  - '        auto factor_node = ov::op::v0::Constant::create(ov::element::i64, {1},
    std::vector<int64_t>{factor});'
  - ''
  - '        auto unsqueeze_axes = ov::op::v0::Constant::create(ov::element::i64,
    Shape{}, {2});'
  - '        auto Z_unsqueezed = std::make_shared<ov::op::v0::Unsqueeze>(Z, unsqueeze_axes);'
  - ''
  - '        auto broadcast_shape = ov::op::v0::Constant::create('
  - '            ov::element::i64, {5}, {(int64_t) 1, (int64_t) 1, factor, (int64_t)
    1, (int64_t) 1});'
  - '        auto new_Z_shape = ov::op::v0::Constant::create(ov::element::i64, {4},'
  - '                                                        {(int64_t) 0, batch_large,
    (int64_t) -1, (int64_t) A_shape[3]});'
  - ''
  - '        auto Z_broadcasted = std::make_shared<ov::op::v3::Broadcast>(Z_unsqueezed,
    broadcast_shape,'
  - '                                                                     ov::op::BroadcastType::BIDIRECTIONAL);'
  - '        Z = std::make_shared<ov::op::v1::Reshape>(Z_broadcasted, new_Z_shape,
    true);'
  - '    }'
  - '    if (A_batch_larger) {'
  - '        B = Z;'
  - '    } else {'
  - '        A = Z;'
  - '    }'
  - ''
  - '    res = std::make_shared<ov::op::v0::MatMul>(A, B, false, transpose_b);'
  - ''
  - '    return rename_outputs_with_suffix({res}, context.get_name());'
  - '}'
  desc: 将 GGML 的 MulMat 算子转换为 OpenVINO 的 MatMul 算子，处理输入的形状、批量大小和数据类型调整。
