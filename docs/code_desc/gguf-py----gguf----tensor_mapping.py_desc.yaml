desc: This file defines a class named TensorNameMap that provides a mapping between
  GGUF model tensor names and the original framework-specific model tensor names,
  used for converting models from various frameworks (e.g., PyTorch, Hugging Face)
  to the GGUF format.该文件定义了GGUF模型转换过程中张量名称的映射关系，将不同模型架构中的张量名称映射到统一的GGUF张量标识（MODEL_TENSOR枚举）。它通过字典形式为每种GGUF张量类型提供了多个可能的源模型张量名称模式，支持多种模型架构（如Llama、Mistral、Qwen、T5、Mamba、RWKV、Vision等）的权重转换。文件中大量使用了'{bid}'作为占位符，代表层索引，以及注释标注了每种映射对应的模型架构。该文件定义了一个名为
  TensorNameMap 的类，其核心功能是建立模型架构中张量（tensor）与其在 GGUF 格式中标准名称之间的映射关系。它通过将架构特定的键（例如来自不同模型实现中的原始张量名称）映射到统一的
  MODEL_TENSOR 枚举和标准化的 GGUF 张量名称上，从而为模型转换过程提供解析服务。该类负责处理静态的架构级映射、动态的按层（block）级映射，并支持根据后缀查询张量类型和名称。
