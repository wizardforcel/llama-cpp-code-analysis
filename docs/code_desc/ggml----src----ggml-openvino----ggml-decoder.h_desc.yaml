desc: 该文件定义了 GGML 计算图在 OpenVINO 推理场景下的解码器头文件，包含模型参数和计算参数的结构体，以及 GgmlOvDecoder 类。该类通过实现
  OpenVINO GgmlDecoder 接口，将 GGML 计算图中的张量、节点和处理逻辑映射到 OpenVINO 的图中，并提供了模型输入输出管理、参数访问、图遍历、配置和调试辅助等核心功能，是实现从
  GGML 格式到 OpenVINO 推理格式转换的关键组件。
