    - '        return c - ''A'';'
    - '    } else if (c >= ''a'' && c <= ''z'') {'
    - '        return c - ''a'' + 26;'
    - '    } else if (c >= ''0'' && c <= ''9'') {'
    - '        return c - ''0'' + 52;'
    - '    }'
    - '    if (alphabet == alphabet::standard) {'
    - '        if (c == ''+'') {'
    - '            return 62;'
    - '        } else if (c == ''/'') {'
    - '            return 63;'
    - '        }'
    - '    } else if (alphabet == alphabet::url_filename_safe) {'
    - '        if (c == ''-'') {'
    - '            return 62;'
    - '        } else if (c == ''_'') {'
    - '            return 63;'
    - '        }'
    - '    } else {'
