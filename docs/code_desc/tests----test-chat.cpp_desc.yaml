desc: This file contains a comprehensive test suite for chat handling in llama.cpp,
  including PEG parser tests, grammar generation for tool calling, various template
  format testing, and a CLI interface for generating Markdown summaries of Jinja template
  formats.该文件是用于测试基于模板的聊天模板解析器的测试文件，主要功能包括通过 PEG 解析器对聊天消息进行增量解析、验证解析结果与预期消息的一致性、测试
  JSON 格式转换、以及通过构建器模式（builder pattern）构造测试用例并运行测试。This file contains extensive integration
  tests for the llama.cpp server's chat template engine. It validates that various
  model-specific Jinja chat templates correctly parse and reconstruct different types
  of assistant messages, including plain content, reasoning/thinking segments, tool
  calls, and combinations thereof. The tests cover a wide range of popular models
  (e.g., NVIDIA Nemotron, Cohere Command-R, Google Gemma, Qwen, DeepSeek, GLM, etc.)
  and ensure the parser handles edge cases like optional parameters, nullable types,
  enums, and special characters.该文件是 llama.cpp 项目中 tests/test-chat.cpp 测试文件，专注于针对多种不同的聊天模板（.jinja
  格式）进行 PEG 解析器的单元测试。它验证解析器对纯文本、思维链（reasoning）、工具调用（tool call）以及并行工具调用等复杂场景的解释是否准确，并确保能够正确重建原始输入。测试覆盖了
  DeepSeek、Kimi、LFM、MiniMax 等多种开源模型的模板格式，是保证聊天推理正确性的关键测试套件。This file contains the
  test suite for chat template functionality. It validates the PEG (Parsing Expression
  Grammar) based message parsing, reasoning format extraction, tool calling, structured
  output, message diff computation, and JSON conversion utilities within the chat
  templates module.
file: tests/test-chat.cpp
