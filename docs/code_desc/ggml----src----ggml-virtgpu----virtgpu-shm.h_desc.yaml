classes:
- desc: A struct representing a shared memory buffer in the virtgpu context, containing
    the resource ID, mapped size/pointer, and GEM handle for memory management.
  methods: []
  name: virtgpu_shmem
desc: The virtgpu-shm.h header file defines the virtgpu_shmem structure and declares
  the functions for creating and destroying shared memory buffers (shmem) within the
  virtgpu context. It provides the low-level memory management interface for sharing
  GPU memory regions between the host and guest, leveraging the virtgpu device abstraction.
file: ggml/src/ggml-virtgpu/virtgpu-shm.h
funcs:
- code:
  - int virtgpu_shmem_create(virtgpu * gpu, size_t size, virtgpu_shmem * shmem);
  desc: Creates a shared memory buffer of the specified size in the virtgpu context,
    storing the result in the provided shmem struct. Returns 0 on success or an error
    code on failure.
  line: '17'
  name: virtgpu_shmem_create
- code:
  - void virtgpu_shmem_destroy(virtgpu * gpu, virtgpu_shmem * shmem);
  desc: Destroys the shared memory buffer associated with the given shmem struct,
    cleaning up GPU resources and unmapping memory in the virtgpu context.
  line: '18'
  name: virtgpu_shmem_destroy
