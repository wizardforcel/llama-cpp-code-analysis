  - bool common_utf8_is_complete(const std::string & s) {
  - '    if (s.empty()) {'
  - '        return true;'
  - '    }'
  - '    for (int i = 1; i <= std::min(4, (int)s.size()); i++) {'
  - '        unsigned char c = s[s.size() - i];'
