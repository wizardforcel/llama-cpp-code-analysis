classes:
- desc: Opaque context structure for GGUF data, holding metadata key-value pairs and
    tensor information.
  methods: []
  name: gguf_context
- desc: Structure for initialization parameters passed to gguf_init_from_file_ptr
    and gguf_init_from_file, controlling memory allocation behavior.
  methods: []
  name: gguf_init_params
desc: This file defines the GGUF (GPT-Generated Unified Format) binary file format
  used by the ggml library for storing neural network models. It specifies the file
  structure, constants, enumerations for data types, and declares the entire public
  C API for creating, initializing, reading, modifying, and writing GGUF files. The
  header primarily serves as the interface definition for managing key-value pairs
  and tensor metadata, along with functions to serialize and deserialize this metadata
  to and from files.
file: ggml/include/gguf.h
