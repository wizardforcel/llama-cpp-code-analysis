desc: 该文件是 llama.cpp 项目中的命令行参数解析模块，实现了通用参数的定义、解析、验证、环境变量处理、远程预设下载、模型下载处理以及使用帮助和自动补全脚本的生成等功能。该文件实现了llama.cpp的命令行参数解析与配置初始化功能。它定义了ms_parser_init函数，根据不同的示例类型（如COMPLETION、MTMD、SERVER等）设置默认参数，加载动态后端，然后通过add_opt
  lambda和common_arg类构建了一个大规模的命令行选项注册表，涵盖了模型加载、推理控制、采样策略、性能调优、交互模式等众多参数，每个选项都包含默认值、帮助文本和值处理回调函数。common/arg.cpp
  文件是 llama.cpp 项目中用于解析和配置命令行参数的模块，该模块通过一系列 add_opt 调用注册各种参数选项（如采样参数、模型配置、设备管理等），并使用
  lambda 函数将用户提供的值赋给 common_params 结构体字段，从而实现灵活的参数配置与验证。该文件是 llama.cpp 项目中 common/arg.cpp
  的代码片段，定义了大量命令行参数选项，用于配置模型加载、推理、服务器、嵌入、检索等多种功能。它通过 common_arg 对象和 add_opt 函数注册参数，将命令行输入映射到
  common_params 结构体，并处理参数解析和验证逻辑。该文件是 llama.cpp 项目中的通用参数解析模块（common/arg.cpp），负责定义和注册所有命令行参数选项，将用户输入的命令行参数解析并映射到
  common_params 结构体中的字段，覆盖模型加载、推理、服务部署、微调训练、TTS 语音合成、扩散模型生成等多种功能场景。该文件通过一系列 add_opt(common_arg(...))
  调用构建完整的参数注册表，每个选项包含参数别名、类型说明、帮助文本和值处理回调函数，实现了灵活且可扩展的命令行接口。该文件是llama.cpp项目中的命令行参数解析模块，实现了大量预设模型配置选项的注册与管理，包括默认模型选择、参数设置及预设选项的添加功能，主要用于服务器和命令行工具的配置初始化。
