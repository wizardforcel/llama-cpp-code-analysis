- desc: 基于NumPy数组的惰性张量具体实现，提供元张量创建方法以及针对NumPy类型的astype和tofile操作。
  methods:
  - code:
    - 'def meta_with_dtype_and_shape(cls, dtype: DTypeLike, shape: tuple[int, ...])
      -> np.ndarray[Any, Any]:'
    - '    cheat = np.zeros(1, dtype)'
    - '    return np.lib.stride_tricks.as_strided(cheat, shape, (0 for _ in shape))'
    desc: 创建零填充的NumPy元数组，使用strided技巧共享内存以模拟指定形状。
    line: 214-219
    name: meta_with_dtype_and_shape
  - code:
    - 'def astype(self, dtype, *args, **kwargs):'
    - '    meta = type(self).meta_with_dtype_and_shape(dtype, self._meta.shape)'
    - '    full_args = (self, dtype,) + args'
    - '    return type(self)(meta=meta, args=full_args, kwargs=kwargs, func=(lambda
      a, *args, **kwargs: a.astype(*args, **kwargs)))'
    desc: 重写astype方法以支持惰性类型转换，返回新的LazyNumpyTensor实例。
    line: 221-224
    name: astype
