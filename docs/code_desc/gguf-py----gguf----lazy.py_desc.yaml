- desc: 惰性张量的抽象基类，定义了惰性评估的核心数据结构和操作逻辑，包括元数据存储、递归应用、函数包装、急切转换和抽象元张量创建等方法。
  methods:
  - code:
    - 'def __init__(self, *, meta: Any, data: Any | None = None, args: tuple = (),
      kwargs: dict[str, Any] | None = None, func: Callable[[Any], Any] | None = None):'
    - '    super().__init__()'
    - '    self._meta = meta'
    - '    self._data = data'
    - '    self._args = args'
    - '    self._kwargs = kwargs if kwargs is not None else {}'
    - '    self._func = func'
    - '    assert self._func is not None or self._data is not None'
    desc: 初始化惰性张量，存储元数据、实际数据或计算函数及其参数。
