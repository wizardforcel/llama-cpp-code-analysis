  - code:
    - 'def __init_subclass__(cls) -> None:'
    - '    if "_tensor_type" not in cls.__dict__:'
    - '        raise TypeError(f"property ''_tensor_type'' must be defined for {cls!r}")'
    - '    return super().__init_subclass__()'
    desc: 检查子类是否定义了必要的_tensor_type属性。
    line: 122-125
    name: __init_subclass__
  - code:
    - 'def _recurse_apply(o: Any, fn: Callable[[Any], Any]) -> Any:'
    - '    # TODO: dict and set'
    - '    if isinstance(o, (list, tuple)):'
    - '        L = []'
    - '        for item in o:'
    - '            L.append(LazyBase._recurse_apply(item, fn))'
    - '        if isinstance(o, tuple):'
    - '            L = tuple(L)'
    - '        return L'
    - '    elif isinstance(o, LazyBase):'
    - '        return fn(o)'
    - '    else:'
    - '        return o'
    desc: 静态递归辅助方法，遍历列表或元组中的每个元素并应用给定函数，保持结构不变。
    line: 127-137
    name: _recurse_apply
  - code:
    - 'def _wrap_fn(cls, fn: Callable, *, use_self: LazyBase | None = None, meta_noop:
      bool | DTypeLike | tuple[DTypeLike, Callable[[tuple[int, ...]], tuple[int, ...]]]
      = False) -> Callable[[Any], Any]:'
    - '    def wrapped_fn(*args, **kwargs):'
    - '        if kwargs is None:'
    - '            kwargs = {}'
    - '        args = ((use_self,) if use_self is not None else ()) + args'
    - ''
    - '        meta_args = LazyBase._recurse_apply(args, lambda t: t._meta)'
    - ''
    - '        if isinstance(meta_noop, bool) and not meta_noop:'
    - '            try:'
    - '                res = fn(*meta_args, **kwargs)'
    - '            except NotImplementedError:'
    - '                res = None'
    - '        else:'
    - '            assert len(args) > 0'
    - '            res = args[0]'
    - '            assert isinstance(res, cls)'
    - '            res = res._meta'
    - '            if meta_noop is not True:'
    - '                if isinstance(meta_noop, tuple):'
    - '                    dtype, shape = meta_noop'
    - '                    assert callable(shape)'
    - '                    res = cls.meta_with_dtype_and_shape(dtype, shape(res.shape))'
    - '                else:'
    - '                    res = cls.meta_with_dtype_and_shape(meta_noop, res.shape)'
    - ''
    - '        if isinstance(res, cls._tensor_type):'
    - '            return cls(meta=cls.eager_to_meta(res), args=args, kwargs=kwargs,
      func=fn)'
    - '        elif isinstance(res, tuple) and all(isinstance(t, cls._tensor_type)
      for t in res):'
    - '            shared_args: list = [args, None]'
    - ''
    - '            def eager_tuple_element(a: list[Any], i: int = 0, /, **kw) -> LazyBase:'
    - '                assert len(a) == 2'
    - '                if a[1] is None:'
    - '                    a[1] = fn(*a[0], **kw)'
    - '                return a[1][i]'
    - '            return tuple(cls(meta=cls.eager_to_meta(res[i]), args=(shared_args,
      i), kwargs=kwargs, func=eager_tuple_element) for i in range(len(res)))'
    - '        else:'
    - '            del res'
    - '            eager_args = cls.to_eager(args)'
    - '            return fn(*eager_args, **kwargs)'
    - '    return wrapped_fn'
    desc: 核心包装函数，接受原始操作函数并返回惰性版本的包装函数。处理元张量上的操作、异常恢复和元数据不变式。
    line: 139-174
    name: _wrap_fn
  - code:
    - 'def to_eager(cls, t: Any) -> Any:'
    - '    def simple_to_eager(_t: LazyBase) -> Any:'
    - '        if _t._data is not None:'
    - '            return _t._data'
    - '        assert _t._func is not None'
    - '        _t._args = cls._recurse_apply(_t._args, simple_to_eager)'
    - '        _t._data = _t._func(*_t._args, **_t._kwargs)'
    - '        assert _t._data is not None'
    - '        assert _t._data.dtype == _t._meta.dtype'
    - '        assert _t._data.shape == _t._meta.shape'
    - '        return _t._data'
    - '    return cls._recurse_apply(t, simple_to_eager)'
    desc: 将惰性张量（及其嵌套参数）转换为急切执行的实际张量，递归执行所有存储的惰性函数。
