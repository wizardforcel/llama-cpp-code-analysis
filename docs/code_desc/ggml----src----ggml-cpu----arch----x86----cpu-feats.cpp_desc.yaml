  name: cpuid_x86
desc: 该文件是 ggml CPU 后端中用于 x86/x64 架构特性检测的代码。它定义了一个名为 cpuid_x86 的类，该类通过执行 CPUID 指令来收集和处理
  CPU 的特性标志位（如 SSE、AVX、AVX512 等），并提供布尔方法返回这些特性的支持情况。此外，该文件还包含一个全局函数 ggml_backend_cpu_x86_score，它根据编译时的宏定义（例如
  GGML_AVX2）检查对应的 CPU 特性是否被支持，并为支持的指令集组合计算一个性能分数，用于后端选择排序。
file: ggml/src/ggml-cpu/arch/x86/cpu-feats.cpp
