  - '    if (!is.FMA()) { return 0; }'
  - '    score += 1;'
  - '#endif'
  - '#ifdef GGML_F16C'
  - '    if (!is.F16C()) { return 0; }'
  - '    score += 1<<1;'
  - '#endif'
