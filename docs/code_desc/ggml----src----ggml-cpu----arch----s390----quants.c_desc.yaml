desc: 该文件是 GGML（GGML Machine Learning）库中针对 s390（IBM System/390 架构）CPU 的量化内核实现，包含多种量化格式（如
  Q4_0、Q4_1、Q5_0、Q5_1、Q8_0、Q8_1、MXFP4、Q3_K、Q4_K、Q5_K 等）的向量点积运算和行量化函数，利用 s390 的向量扩展（VXE）指令集进行优化，并在不支持时回退到通用实现。该文件是ggml项目中针对s390架构（IBM
  Z系列）的量化向量点积函数实现，使用Vector Enhancements Facility (VXE)指令集对多种量化格式（如Q5_K、Q6_K、IQ4_NL、IQ4_XS）与Q8_K之间的点积运算进行了SIMD优化，并提供了非VXE架构下的通用回退实现。
