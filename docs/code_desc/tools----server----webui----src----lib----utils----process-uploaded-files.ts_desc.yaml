desc: The file defines a TypeScript utility module responsible for processing uploaded
  files in a web UI context, converting various file types (images, PDFs, audio, and
  text) into a standardized `ChatUploadedFile` format with appropriate previews and
  metadata. It handles format normalization (converting SVG and WebP to PNG), extracts
  text content from PDFs, generates base64 previews for images and audio, and provides
  a fallback text extraction for unknown file types. Additionally, it includes user
  interaction logic to suggest enabling PDF-to-image conversion when a vision-capable
  model is selected.
file: tools/server/webui/src/lib/utils/process-uploaded-files.ts
