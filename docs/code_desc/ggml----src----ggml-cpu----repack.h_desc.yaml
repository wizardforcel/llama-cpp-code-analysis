classes:
- desc: 模板结构体，用于存储 K 位量化且包含 N 个子块的量化块数据，包含 N 个 ggml_half 类型的缩放因子和打包的量化数据数组，是 Q4_0
    和 Q8_0 格式进行重打包的基础容器。
  methods: []
  name: block<4,4> / block<4,8> / block<4,16> / block<8,4> / block<8,8> / block<8,16>
- desc: 用于 Q4_K 格式的重打包结构体，包含 8 个子块的缩放因子（d）和最小值（dmin）、6 位量化的缩放数组（scales）以及 4 位量化数据（qs）。
  methods: []
  name: block_q4_Kx8
- desc: 用于 Q4_K 格式的重打包结构体，包含 16 个子块的缩放因子和最小值、6 位量化的缩放数组以及 4 位量化数据。
  methods: []
  name: block_q4_Kx16
- desc: 用于 Q2_K 格式的重打包结构体，包含 8 个子块的缩放因子和最小值、4 位量化的缩放数组以及 2 位量化数据。
  methods: []
  name: block_q2_Kx8
- desc: 用于 Q2_K 格式的重打包结构体，包含 16 个子块的缩放因子和最小值、4 位量化的缩放数组以及 2 位量化数据。
  methods: []
  name: block_q2_Kx16
- desc: 用于 Q5_K 格式的重打包结构体，包含 8 个子块的缩放因子和最小值、6 位量化的缩放数组、5 位量化数据的高位和低位数组。
  methods: []
  name: block_q5_Kx8
- desc: 用于 Q6_K 格式的重打包结构体，包含 8 个子块的缩放因子、6 位量化数据的缩放数组、低位和高位量化数组。
  methods: []
  name: block_q6_Kx8
- desc: 用于 Q8_K 格式的重打包结构体，包含 4 个 float 类型的缩放因子、8 位量化数据数组以及量化数据的和数组（bsums）。
  methods: []
  name: block_q8_Kx4
- desc: 用于 IQ4_NL 格式的重打包结构体，包含 4、8 或 16 个子块的半精度缩放因子和打包的 nibble（4 位）量化数据。
  methods: []
  name: block_iq4_nlx4 / block_iq4_nlx8 / block_iq4_nlx16
- desc: 用于 MXFP4 格式的重打包结构体，包含 4 或 8 个字节的指数（e）和打包的 4 位尾数量化数据。
  methods: []
  name: block_mxfp4x4 / block_mxfp4x8
desc: 该文件是 GGML（GPT-Generated Model Library）CPU 后端中负责量化张量数据重打包（repack）的头文件。它定义了多种量化块（block）的结构体，用于将不同量化格式（如
  Q4_0、Q8_0、Q2_K、Q4_K、Q5_K 等）的数据重新组织为适合向量化（SIMD）计算（如矩阵乘法和矩阵向量乘法）的布局，并声明了一系列用于量化、矩阵乘法和矩阵向量乘法的外部
  C 函数接口，这些接口提供了优化的重打包和计算内核，以及对应的通用（generic）回退实现。
