  name: llm_build_t5_dec
desc: 该文件实现了 T5 解码器（Decoder）的图构建逻辑。它定义了一个名为 llm_build_t5_dec 的类，构造函数中详细描述了如何从输入嵌入开始，依次构建自注意力层、交叉注意力层和前馈网络层，最终生成
  logits 输出的完整计算图。代码中还包含了位置编码偏置、RMSNorm 归一化以及 KV Cache 等细节处理。
