desc: 该文件是SYCL后端flash attention向量化实现的模板实例头文件，由generate_cu_files.py自动生成，不要手动编辑。它通过三次宏调用实例化三种不同头大小（64、128、256）的flash
  attention向量化计算场景，每种场景均使用Q4_0量化权重和F16精度的激活值/输出。该文件的作用是将通用模板函数在编译期固化为具体类型和尺寸的专用实例，供链接使用。项目自身不定义任何函数或类，仅展开include头文件中的宏。
