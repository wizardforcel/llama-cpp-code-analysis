desc: This file defines a minimal evaluation example for the llama.cpp library. It
  parses common parameters, initializes the backend and model, runs a single forward
  pass on a tokenized prompt, and prints performance statistics. The key feature is
  its use of the `common_debug_cb_eval` callback, which is registered to be invoked
  at each evaluation node, illustrating how to integrate and observe custom evaluation
  callbacks during graph computation.
file: examples/eval-callback/eval-callback.cpp
