desc: 该文件是llama.cpp中llguidance库的语法测试文件，通过定义一系列静态测试函数来验证llama_sampler结合llguidance语法和JSON
  schema的字符串匹配行为，包括基本语法、复杂语法、特殊字符、量词和JSON schema的测试用例。该文件为llguidance集成测试，验证llama.cpp中llguidance采样器与语法解析器的集成效果，通过多个测试函数覆盖简单语法、复杂语法、特殊字符、量词、JSON模式及采样器链的正常与异常场景，确保语法约束与token采样正确协同工作。
