  name: GGUFWriter
desc: 该文件定义了一个用于生成GGUF（GPT-Generated Unified Format）模型文件的GGUFWriter类。GGUF是一种用于存储LLM模型权重及元数据的二进制格式。该类负责按规范顺序写入文件头（magic、版本、张量及KV数据数量）、键值元数据、张量信息与权重数据，并支持模型分片、临时文件、字节序转换、数据对齐及多种模型架构的元数据添加。该文件是GGUF（GPT-Generated
  Unified Format）模型文件的写入器实现，提供了一系列方法用于向GGUF文件添加各类模型元数据，包括模型架构参数、注意力机制参数、RoPE（旋转位置编码）参数、SSM（状态空间模型）参数、分词器配置、视觉/音频模型参数以及扩散模型参数等，是模型导出和转换过程中的核心工具类。
