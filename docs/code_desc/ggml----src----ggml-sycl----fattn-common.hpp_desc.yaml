desc: The file ggml/src/ggml-sycl/fattn-common.hpp defines common utilities and kernels
  for flash attention on SYCL devices. It provides templated functions for vector
  dot products between quantized K and Q values, V dequantization, mask handling,
  and final result combination, along with kernel launch helpers and type-based dispatch
  functions.该文件是 ggml-sycl 后端中 Flash Attention 的公共头文件实现部分，负责在 SYCL 设备上执行 Flash Attention
  算法的启动和调度。核心功能包括：处理 K/V 张量的数据类型转换（如转换为 FP16）、计算 tile 划分和并行块数量、根据掩码（mask）和流式 K（stream_k）参数进行内核调度优化，以及最终启动
  Flash Attention 内核并处理需要的结果合并（combine/fixup）操作。
