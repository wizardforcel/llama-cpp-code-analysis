desc: 该文件是GGML框架中AMD ZenDNN后端的实现，利用ZenDNN优化库（针对AMD CPU优化的深度学习性能计算库）来加速矩阵乘法（MUL_MAT）和MoE专家混合矩阵乘法（MUL_MAT_ID）等运算。文件定义了后端上下文结构体、矩阵乘法核心模板函数、两种矩阵乘的前向计算实现（支持BF16与FP32类型转换），以及完整的后端接口层（包含backend、driver、reg三个层级的注册，使GGML能够动态加载并使用该AMD
  CPU加速后端）。
