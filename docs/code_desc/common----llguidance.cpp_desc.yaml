desc: 该文件实现了基于 LLGuidance 的 llama.cpp 语法约束采样器。在启用 LLAMA_USE_LLGUIDANCE 时，它负责创建和管理
  LLGuidance tokenizer 与 matcher，将语法约束转换为 token 掩码并应用到候选 logits，支持 token 接收、状态重置、采样器克隆和资源释放；未启用该功能时，则提供一个返回空指针并输出警告的降级初始化函数。
