classes:
- desc: MiniCPM3模型的计算图构建类，继承自llm_graph_context，负责将模型权重和输入转换为完整的推理计算图。
  methods:
  - code:
    - 'llm_build_minicpm3(const llama_model & model, const llm_graph_params & params)
      : llm_graph_context(params) {'
    - '    const int64_t n_embd_base = 256;'
    - '    const float scale_embd  = 12.0f;'
    - '    const float scale_depth = 1.4f;'
    - '    const float kq_scale = 1.0f / sqrtf(float(hparams.n_embd_head_k()));'
    - '    const uint32_t n_embd_head_qk_rope = hparams.n_rot();'
    - '    const uint32_t n_embd_head_qk_nope = hparams.n_embd_head_k() - hparams.n_rot();'
    - '    const uint32_t kv_lora_rank = hparams.n_lora_kv;'
    - '    ggml_tensor * cur;'
    - '    ggml_tensor * inpL;'
    - '    inpL = build_inp_embd(model.tok_embd);'
    - '    inpL = ggml_scale(ctx0, inpL, scale_embd);'
    - '    cb(inpL, "inp_scaled", -1);'
    - '    ggml_tensor * inp_pos = build_inp_pos();'
    - '    auto * inp_attn = build_attn_inp_kv();'
    - '    ggml_tensor * inp_out_ids = build_inp_out_ids();'
    - '    for (int il = 0; il < n_layer; ++il) {'
    - '        ggml_tensor * inpSA = inpL;'
    - '        ggml_tensor * rope_factors = model.get_rope_factors(cparams, il);'
    - '        cur = build_norm(inpL, model.layers[il].attn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        cb(cur, "attn_norm", il);'
    - '        {'
    - '            ggml_tensor * q = NULL;'
    - '            q = ggml_mul_mat(ctx0, model.layers[il].wq_a, cur);'
    - '            cb(q, "q", il);'
    - '            q = build_norm(q, model.layers[il].attn_q_a_norm, NULL, LLM_NORM_RMS,
      il);'
    - '            cb(q, "q", il);'
    - '            q = ggml_mul_mat(ctx0, model.layers[il].wq_b, q);'
    - '            cb(q, "q", il);'
    - '            ggml_tensor * q_nope = ggml_view_3d(ctx0, q, n_embd_head_qk_nope,
      n_head, n_tokens, ggml_row_size(q->type, hparams.n_embd_head_k()), ggml_row_size(q->type,
      hparams.n_embd_head_k() * n_head), 0);'
    - '            cb(q_nope, "q_nope", il);'
    - '            ggml_tensor * q_pe = ggml_view_3d(ctx0, q, n_embd_head_qk_rope,
      n_head, n_tokens, ggml_row_size(q->type, hparams.n_embd_head_k()), ggml_row_size(q->type,
      hparams.n_embd_head_k() * n_head), ggml_row_size(q->type, n_embd_head_qk_nope));'
    - '            cb(q_pe, "q_pe", il);'
    - '            ggml_tensor * kv_pe_compresseed = ggml_mul_mat(ctx0, model.layers[il].wkv_a_mqa,
      cur);'
    - '            cb(kv_pe_compresseed, "kv_pe_compresseed", il);'
    - '            ggml_tensor * kv_compressed = ggml_view_2d(ctx0, kv_pe_compresseed,
      kv_lora_rank, n_tokens, kv_pe_compresseed->nb[1], 0);'
    - '            cb(kv_compressed, "kv_compressed", il);'
    - '            ggml_tensor * k_pe = ggml_view_3d(ctx0, kv_pe_compresseed, n_embd_head_qk_rope,
      1, n_tokens, kv_pe_compresseed->nb[1], kv_pe_compresseed->nb[1], ggml_row_size(kv_pe_compresseed->type,
      kv_lora_rank));'
    - '            cb(k_pe, "k_pe", il);'
    - '            kv_compressed = build_norm(kv_compressed, model.layers[il].attn_kv_a_norm,
      NULL, LLM_NORM_RMS, il);'
    - '            cb(kv_compressed, "kv_compressed", il);'
    - '            ggml_tensor * kv = ggml_mul_mat(ctx0, model.layers[il].wkv_b, kv_compressed);'
    - '            cb(kv, "kv", il);'
    - '            ggml_tensor * k_nope = ggml_view_3d(ctx0, kv, n_embd_head_qk_nope,
      n_head, n_tokens, ggml_row_size(kv->type, n_embd_head_qk_nope + hparams.n_embd_head_v()),
      ggml_row_size(kv->type, n_head * (n_embd_head_qk_nope + hparams.n_embd_head_v())),
      0);'
    - '            cb(k_nope, "k_nope", il);'
    - '            ggml_tensor * v_states = ggml_view_3d(ctx0, kv, hparams.n_embd_head_v(),
      n_head, n_tokens, ggml_row_size(kv->type, (n_embd_head_qk_nope + hparams.n_embd_head_v())),
      ggml_row_size(kv->type, (n_embd_head_qk_nope + hparams.n_embd_head_v())*n_head),
      ggml_row_size(kv->type, (n_embd_head_qk_nope)));'
    - '            cb(v_states, "v_states", il);'
    - '            v_states = ggml_cont(ctx0, v_states);'
    - '            cb(v_states, "v_states", il);'
    - '            q_pe = ggml_rope_ext(ctx0, q_pe, inp_pos, rope_factors, n_rot,
      rope_type, n_ctx_orig, freq_base, freq_scale, ext_factor, attn_factor, beta_fast,
      beta_slow);'
    - '            cb(q_pe, "q_pe", il);'
    - '            k_pe = ggml_rope_ext(ctx0, k_pe, inp_pos, rope_factors, n_rot,
      rope_type, n_ctx_orig, freq_base, freq_scale, ext_factor, attn_factor, beta_fast,
      beta_slow);'
    - '            cb(k_pe, "k_pe", il);'
    - '            ggml_tensor * q_states = ggml_concat(ctx0, q_nope, q_pe, 0);'
    - '            cb(q_states, "q_states", il);'
    - '            ggml_tensor * k_states = ggml_concat(ctx0, k_nope, ggml_repeat(ctx0,
      k_pe, q_pe), 0);'
    - '            cb(k_states, "k_states", il);'
    - '            cur = build_attn(inp_attn, model.layers[il].wo, NULL, q_states,
      k_states, v_states, nullptr, nullptr, nullptr, kq_scale, il);'
    - '        }'
    - '        if (il == n_layer - 1 && inp_out_ids) {'
    - '            cur   = ggml_get_rows(ctx0,   cur, inp_out_ids);'
    - '            inpSA = ggml_get_rows(ctx0, inpSA, inp_out_ids);'
    - '        }'
    - '        const float scale_res = scale_depth/sqrtf(float(n_layer));'
    - '        cur = ggml_scale(ctx0, cur, scale_res);'
    - '        cb(cur, "hidden_scaled", il);'
    - '        ggml_tensor * ffn_inp = ggml_add(ctx0, cur, inpSA);'
    - '        cb(ffn_inp, "ffn_inp", il);'
    - '        {'
    - '            cur = build_norm(ffn_inp, model.layers[il].ffn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '            cb(cur, "ffn_norm", il);'
    - '            cur = build_ffn(cur, model.layers[il].ffn_up, NULL, NULL, model.layers[il].ffn_gate,
      NULL, NULL, model.layers[il].ffn_down, NULL, NULL, NULL, LLM_FFN_SILU, LLM_FFN_PAR,
      il);'
    - '            cb(cur, "ffn_out", il);'
    - '        }'
    - '        cur = ggml_scale(ctx0, cur, scale_res);'
    - '        cb(cur, "hidden_scaled_ffn", il);'
    - '        cur = ggml_add(ctx0, cur, ffn_inp);'
    - '        cur = build_cvec(cur, il);'
    - '        cb(cur, "l_out", il);'
    - '        inpL = cur;'
    - '    }'
    - '    cur = inpL;'
    - '    cur = build_norm(cur, model.output_norm, NULL, LLM_NORM_RMS, -1);'
    - '    cb(cur, "result_norm", -1);'
    - '    res->t_embd = cur;'
    - '    const float scale_lmhead = float(n_embd_base)/float(n_embd);'
    - '    cur = ggml_scale(ctx0, cur, scale_lmhead);'
    - '    cb(cur, "lmhead_scaling", -1);'
    - '    cur = build_lora_mm(model.output, cur);'
    - '    cb(cur, "result_output", -1);'
    - '    res->t_logits = cur;'
    - '    ggml_build_forward_expand(gf, cur);'
    - '}'
    desc: 构造函数，构建MiniCPM3模型的全计算图，包含嵌入处理、注意力计算、前馈网络和多层堆叠。
