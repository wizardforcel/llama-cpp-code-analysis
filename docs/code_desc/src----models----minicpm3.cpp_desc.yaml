  name: llm_build_minicpm3
desc: 该文件实现了MiniCPM3模型的计算图构建逻辑，通过继承llm_graph_context基类，定义了llm_build_minicpm3类的构造函数，用于搭建包含嵌入缩放、多头注意力机制（带LoRA
