  name: clip_graph_internvl
desc: 该文件定义了InternVL多模态模型的视觉编码器部分的图构建逻辑。它继承clip_graph类，并重写build()方法，将图像补丁序列与CLS token拼接后通过ViT（视觉Transformer）处理，再进行像素重排和投影层，最终生成模型所需的计算图。
