classes:
- desc: 用于构建InternVL模型视觉编码器部分的计算图类。
  methods:
  - code:
    - ggml_cgraph * clip_graph_internvl::build() {
    - '    GGML_ASSERT(model.class_embedding != nullptr);'
    - '    GGML_ASSERT(model.position_embeddings != nullptr);'
    - '    const int n_pos = n_patches + 1;'
    - '    ggml_tensor * inp = build_inp();'
    - '    inp = ggml_concat(ctx0, inp, model.class_embedding, 1);'
    - '    norm_type norm_t = (hparams.n_embd == 3200 && hparams.n_layer == 45)'
    - '        ? NORM_TYPE_RMS'
    - '        : NORM_TYPE_NORMAL;'
    - '    ggml_tensor * cur = build_vit('
    - '                            inp, n_pos,'
    - '                            norm_t,'
    - '                            hparams.ffn_op,'
    - '                            model.position_embeddings,'
    - '                            nullptr);'
    - '    cur = ggml_view_2d(ctx0, cur,'
    - '        n_embd, n_patches,'
    - '        ggml_row_size(cur->type, n_embd), 0);'
    - '    {'
    - '        const int scale_factor = model.hparams.n_merge;'
    - '        const int bsz    = 1;'
    - '        const int height = n_patches_y;'
    - '        const int width  = n_patches_x;'
    - '        GGML_ASSERT(scale_factor > 0);'
    - '        cur = ggml_reshape_4d(ctx0, cur, n_embd * scale_factor, height / scale_factor,
      width, bsz);'
    - '        cur = ggml_permute(ctx0, cur, 0, 2, 1, 3);'
    - '        cur = ggml_cont_4d(ctx0, cur,'
    - '            n_embd * scale_factor * scale_factor,'
    - '            height / scale_factor,'
    - '            width / scale_factor,'
    - '            bsz);'
    - '        cur = ggml_permute(ctx0, cur, 0, 2, 1, 3);'
    - '        cur = ggml_cont_2d(ctx0, cur,'
    - '            n_embd * scale_factor * scale_factor,'
    - '            cur->ne[1] * cur->ne[2]);'
    - '    }'
    - '    {'
    - '        cur = build_norm(cur, model.mm_0_w, model.mm_0_b, NORM_TYPE_NORMAL,
      1e-5, -1);'
    - '        cur = build_ffn(cur,'
    - '            model.mm_1_w, model.mm_1_b,'
    - '            nullptr, nullptr,'
    - '            model.mm_3_w, model.mm_3_b,'
    - '            FFN_GELU,'
    - '            -1);'
    - '    }'
    - '    ggml_build_forward_expand(gf, cur);'
    - '    return gf;'
    - '}'
    desc: 构建InternVL模型的计算图，执行CLS token添加、ViT处理和像素重排等核心操作。
