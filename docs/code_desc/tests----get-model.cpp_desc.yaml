classes: []
desc: 该文件实现了一个用于获取模型文件路径的辅助函数，该函数优先从命令行参数获取路径，否则从环境变量获取；如果两者都未提供，则输出警告并正常退出。
file: tests/get-model.cpp
funcs:
- code:
  - char * get_model_or_exit(int argc, char *argv[]) {
  - '    char * model_path;'
  - '    if (argc > 1) {'
  - '        model_path = argv[1];'
  - ''
  - '    } else {'
  - '        model_path = getenv("LLAMACPP_TEST_MODELFILE");'
  - '        if (!model_path || strlen(model_path) == 0) {'
  - '            fprintf(stderr, "\033[33mWARNING: No model file provided. Skipping
    this test. Set LLAMACPP_TEST_MODELFILE=<gguf_model_path> to silence this warning
    and run this test.\n\033[0m");'
  - '            exit(EXIT_SUCCESS);'
  - '        }'
  - '    }'
  - ''
  - '    return model_path;'
  - '}'
  desc: 用于从命令行参数或环境变量获取模型文件路径，如果都不可用则输出警告并退出程序。
