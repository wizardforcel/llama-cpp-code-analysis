desc: 该文件是服务器工具调用（tool calling）功能的单元测试集，用于验证服务器在处理不同类型的模型和聊天模板时，能够正确生成符合要求的工具调用（如函数调用）或拒绝在不需要时生成工具调用。测试覆盖了多种模型、多种模板（包括自定义模板和chatml），并同时支持流式（streamed）和非流式（normal）两种响应模式。该文件是工具服务器测试套件中的单元测试文件，主要用于验证大语言模型输出中携带的工具调用（tool
  call）格式是否符合预期。它校验工具调用的名称、参数中是否包含代码字段，并确保代码是打印'Hello, World!'的合法Python语句。通过正则和JSON解析等断言来保障工具调用的正确性。
