desc: 该文件实现了一个面向前端聊天界面的代理式（Agentic）消息展示工具模块：它将数据库中的助手消息由其持久化的推理内容、文本内容、工具调用（toolCalls）以及对应的工具结果消息（含附件）解析并组织成按顺序排布的展示区块（AgenticSection），同时支持单轮与多轮代理流程、流式（streaming）工具调用状态区分，以及将工具结果文本与图片附件进行匹配渲染。
file: tools/server/webui/src/lib/utils/agentic.ts
funcs:
- code:
  - /**
  - ' * Derives display sections from a single assistant message and its direct tool
    results.'
  - ' *'
  - ' * @param message - The assistant message'
  - ' * @param toolMessages - Tool result messages for this assistant''s tool_calls'
  - ' * @param streamingToolCalls - Partial tool calls during streaming (not yet persisted)'
  - ' */'
  - function deriveSingleTurnSections(
  - "\tmessage: DatabaseMessage,"
  - "\ttoolMessages: DatabaseMessage[] = [],"
  - "\tstreamingToolCalls: ApiChatCompletionToolCall[] = []"
  - '): AgenticSection[] {'
  - "\tconst sections: AgenticSection[] = [];"
  - ''
  - "\t// 1. Reasoning content (from dedicated field)"
  - "\tif (message.reasoningContent) {"
  - "\t\tsections.push({"
  - "\t\t\ttype: AgenticSectionType.REASONING,"
  - "\t\t\tcontent: message.reasoningContent"
  - "\t\t});"
  - "\t}"
  - ''
  - "\t// 2. Text content"
  - "\tif (message.content?.trim()) {"
  - "\t\tsections.push({"
  - "\t\t\ttype: AgenticSectionType.TEXT,"
  - "\t\t\tcontent: message.content"
  - "\t\t});"
  - "\t}"
  - ''
  - "\t// 3. Persisted tool calls (from message.toolCalls field)"
  - "\tconst toolCalls = parseToolCalls(message.toolCalls);"
  - "\tfor (const tc of toolCalls) {"
  - "\t\tconst resultMsg = toolMessages.find((m) => m.toolCallId === tc.id);"
  - "\t\tsections.push({"
  - "\t\t\ttype: resultMsg ? AgenticSectionType.TOOL_CALL : AgenticSectionType.TOOL_CALL_PENDING,"
  - "\t\t\tcontent: resultMsg?.content || '',"
  - "\t\t\ttoolName: tc.function?.name,"
  - "\t\t\ttoolArgs: tc.function?.arguments,"
  - "\t\t\ttoolResult: resultMsg?.content,"
  - "\t\t\ttoolResultExtras: resultMsg?.extra"
  - "\t\t});"
  - "\t}"
  - ''
  - "\t// 4. Streaming tool calls (not yet persisted - currently being received)"
  - "\tfor (const tc of streamingToolCalls) {"
  - "\t\t// Skip if already in persisted tool calls"
  - "\t\tif (tc.id && toolCalls.find((t) => t.id === tc.id)) continue;"
  - "\t\tsections.push({"
  - "\t\t\ttype: AgenticSectionType.TOOL_CALL_STREAMING,"
  - "\t\t\tcontent: '',"
  - "\t\t\ttoolName: tc.function?.name,"
  - "\t\t\ttoolArgs: tc.function?.arguments"
  - "\t\t});"
  - "\t}"
  - ''
  - "\treturn sections;"
  - '}'
  desc: 从单条助手消息及其直接工具结果消息中推导并组装单轮展示的代理区块（先推理、再文本、再持久化工具调用、再流式工具调用）。
