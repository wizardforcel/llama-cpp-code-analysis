- code:
  - /**
  - ' * Parse tool result text into lines, matching image attachments by name.'
  - ' */'
  - export function parseToolResultWithImages(
  - "\ttoolResult: string,"
  - "\textras?: DatabaseMessageExtra[]"
  - '): ToolResultLine[] {'
  - "\tconst lines = toolResult.split(NEWLINE_SEPARATOR);"
  - "\treturn lines.map((line) => {"
  - "\t\tconst match = line.match(ATTACHMENT_SAVED_REGEX);"
  - "\t\tif (!match || !extras) return { text: line };"
  - ''
  - "\t\tconst attachmentName = match[1];"
  - "\t\tconst image = extras.find("
  - "\t\t\t(e): e is DatabaseMessageExtraImageFile =>"
  - "\t\t\t\te.type === AttachmentType.IMAGE && e.name === attachmentName"
  - "\t\t);"
  - ''
  - "\t\treturn { text: line, image };"
  - "\t});"
  - '}'
  desc: 将工具结果文本按行拆分，对匹配附件保存标记的行查找对应的图片附件元数据并关联返回，便于前端图文混合渲染。
  line: 155-176
