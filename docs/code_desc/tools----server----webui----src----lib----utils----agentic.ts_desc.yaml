- code:
  - /**
  - ' * Safely parse the toolCalls JSON string from a DatabaseMessage.'
  - ' */'
  - 'function parseToolCalls(toolCallsJson?: string): ApiChatCompletionToolCall[]
    {'
  - "\tif (!toolCallsJson) return [];"
  - ''
  - "\ttry {"
  - "\t\tconst parsed = JSON.parse(toolCallsJson);"
  - ''
  - "\t\treturn Array.isArray(parsed) ? parsed : [];"
  - "\t} catch {"
  - "\t\treturn [];"
  - "\t}"
  - '}'
  desc: 安全解析数据库消息中 toolCalls 的 JSON 字符串字段，异常或非数组时返回空数组，保证后续遍历不中断。
  line: 178-192
  name: parseToolCalls
- code:
  - /**
  - ' * Check if a message has agentic content (tool calls or is part of an agentic
    flow).'
  - ' */'
  - export function hasAgenticContent(
  - "\tmessage: DatabaseMessage,"
  - "\ttoolMessages: DatabaseMessage[] = []"
  - '): boolean {'
  - "\tif (message.toolCalls) {"
  - "\t\tconst tc = parseToolCalls(message.toolCalls);"
  - ''
  - "\t\tif (tc.length > 0) return true;"
  - "\t}"
  - ''
  - "\treturn toolMessages.length > 0;"
  - '}'
  desc: 判断给定消息是否包含代理式内容（存在已解析的工具调用或关联的工具结果消息），用于界面渲染分支切换。
