- code:
  - /**
  - ' * Derives display sections from structured message data.'
  - ' *'
  - ' * Handles both single-turn (one assistant + its tool results) and multi-turn'
  - ' * agentic sessions (multiple assistant + tool messages grouped together).'
  - ' *'
  - ' * When `toolMessages` contains continuation assistant messages (from multi-turn'
  - ' * agentic flows), they are processed in order to produce sections across all
    turns.'
  - ' *'
  - ' * @param message - The first/anchor assistant message'
  - ' * @param toolMessages - Tool result messages and continuation assistant messages'
  - ' * @param streamingToolCalls - Partial tool calls during streaming (not yet persisted)'
  - ' * @param isStreaming - Whether the message is currently being streamed'
  - ' */'
  - export function deriveAgenticSections(
  - "\tmessage: DatabaseMessage,"
  - "\ttoolMessages: DatabaseMessage[] = [],"
  - "\tstreamingToolCalls: ApiChatCompletionToolCall[] = []"
  - '): AgenticSection[] {'
  - "\tconst hasAssistantContinuations = toolMessages.some((m) => m.role === MessageRole.ASSISTANT);"
  - ''
  - "\tif (!hasAssistantContinuations) {"
  - "\t\treturn deriveSingleTurnSections(message, toolMessages, streamingToolCalls);"
  - "\t}"
  - ''
  - "\tconst sections: AgenticSection[] = [];"
  - ''
  - "\tconst firstTurnToolMsgs = collectToolMessages(toolMessages, 0);"
  - "\tsections.push(...deriveSingleTurnSections(message, firstTurnToolMsgs));"
  - ''
  - "\tlet i = firstTurnToolMsgs.length;"
  - ''
  - "\twhile (i < toolMessages.length) {"
  - "\t\tconst msg = toolMessages[i];"
  - ''
  - "\t\tif (msg.role === MessageRole.ASSISTANT) {"
  - "\t\t\tconst turnToolMsgs = collectToolMessages(toolMessages, i + 1);"
  - "\t\t\tconst isLastTurn = i + 1 + turnToolMsgs.length >= toolMessages.length;"
  - ''
  - "\t\t\tsections.push("
  - "\t\t\t\t...deriveSingleTurnSections(msg, turnToolMsgs, isLastTurn ? streamingToolCalls\
    \ : [])"
  - "\t\t\t);"
  - ''
  - "\t\t\ti += 1 + turnToolMsgs.length;"
  - "\t\t} else {"
  - "\t\t\ti++;"
  - "\t\t}"
  - "\t}"
  - ''
  - "\treturn sections;"
  - '}'
  desc: 总入口函数：根据锚点助手消息与后续消息集合，推导并合并单轮或多轮代理会话的全部展示区块，支持流式工具调用的追加与收尾标记。
