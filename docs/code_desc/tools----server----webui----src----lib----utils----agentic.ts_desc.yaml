- code:
  - /**
  - ' * Collect consecutive tool messages starting at `startIndex`.'
  - ' */'
  - 'function collectToolMessages(messages: DatabaseMessage[], startIndex: number):
    DatabaseMessage[] {'
  - "\tconst result: DatabaseMessage[] = [];"
  - ''
  - "\tfor (let i = startIndex; i < messages.length; i++) {"
  - "\t\tif (messages[i].role === MessageRole.TOOL) {"
  - "\t\t\tresult.push(messages[i]);"
  - "\t\t} else {"
  - "\t\t\tbreak;"
  - "\t\t}"
  - "\t}"
  - ''
  - "\treturn result;"
  - '}'
  desc: 从指定索引开始连续收集角色为 TOOL 的消息，直到遇到非工具角色消息为止，用于界定一轮代理对话中的工具结果片段。
  line: 139-153
