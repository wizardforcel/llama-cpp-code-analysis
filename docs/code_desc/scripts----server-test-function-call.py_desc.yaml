desc: This file is a test script for verifying the tool calling capability of a chat
  completions endpoint. It defines multiple test cases, each with tool definitions,
  initial messages, mock tool responses, and validation logic, and runs them through
  an agentic loop that sends messages, processes tool calls, and checks the final
  output.该文件是一个用于测试 llama-server 工具调用（Tool Calling）能力的命令行脚本。它定义了一系列测试用例（如探索公司、健身教练、社区通知、地理位置和电动车队管理），每个用例包含系统提示词、用户问题和工具定义。脚本通过调用服务器的
  /v1/chat/completions 接口，并可选地进行流式或非流式测试，来验证模型能否正确调用工具。其中，EV 车队用例专门验证了模型能否按特定顺序（先查询股价）完成一个四步骤的管道操作。脚本最终输出所有测试用例的通过率。
