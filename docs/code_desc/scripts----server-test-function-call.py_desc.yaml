- code:
  - 'def run_agentic_loop(url, messages, tools, mock_tool_responses, stream, max_turns=6):'
  - '    msgs = list(messages)'
  - '    all_tool_calls: list[dict] = []'
  - '    for _ in range(max_turns):'
  - '        result = chat_completion(url, msgs, tools=tools, stream=stream)'
  - '        if result is None:'
  - '            return all_tool_calls, None'
  - '        tcs = result.get("tool_calls") or []'
  - '        content = result.get("content") or ""'
  - '        if not tcs:'
  - '            if content:'
  - '                _print(f"\n{DIM}{''·''*60}{RESET}")'
  - '                _print(f"{DIM}  model response:{RESET}\n")'
  - '            return all_tool_calls, content'
  - '        all_tool_calls.extend(tcs)'
  - '        assistant_msg: dict = {'
  - '            "role": "assistant",'
  - '            "content": content,'
  - '            "tool_calls": tcs,'
  - '        }'
  - '        reasoning = result.get("reasoning_content")'
  - '        if reasoning:'
  - '            assistant_msg["reasoning_content"] = reasoning'
  - '        msgs.append(assistant_msg)'
  - '        for tc in tcs:'
  - '            tool_name = tc["function"]["name"]'
  - '            try:'
  - '                args = json.loads(tc["function"]["arguments"])'
  - '            except json.JSONDecodeError:'
  - '                args = {}'
  - '            print_tool_call(tool_name, args)'
  - '            mock_fn = mock_tool_responses.get(tool_name)'
  - '            if mock_fn:'
  - '                tool_result = mock_fn(args)'
  - '            else:'
  - '                tool_result = json.dumps({"error": f"Unknown tool: {tool_name}"})'
  - '            print_tool_result(tool_result)'
  - '            msgs.append('
  - '                {'
  - '                    "role": "tool",'
  - '                    "tool_call_id": tc.get("id", ""),'
  - '                    "content": tool_result,'
  - '                }'
  - '            )'
  - '    return all_tool_calls, None'
  - ''
  desc: 'Drives the multi-turn tool-call loop: sends messages, executes mock tool
    calls, appends results, and repeats until no more tool calls or max turns reached.'
