  - 'def chat_completion(url, messages, tools=None, stream=False):'
  - '    payload = {'
  - '        "messages": messages,'
  - '        "stream": stream,'
  - '        "max_tokens": 4096,'
  - '    }'
  - '    if tools:'
  - '        payload["tools"] = tools'
  - '        payload["tool_choice"] = "auto"'
  - '    try:'
  - '        response = requests.post(url, json=payload, stream=stream)'
  - '        response.raise_for_status()'
  - '    except requests.exceptions.RequestException as e:'
  - '        body = e.response.content if (e.response is not None) else b""'
  - '        print_fail(f"Request error: {e} | body: {body}")'
  - '        return None'
  - '    full_content = ""'
  - '    reasoning_content = ""'
  - '    tool_calls: list[dict] = []'
  - '    if stream:'
  - '        for line in response.iter_lines():'
  - '            if not line:'
  - '                continue'
  - '            decoded = line.decode("utf-8")'
  - '            if not decoded.startswith("data: "):'
  - '                continue'
  - '            data_str = decoded[6:]'
  - '            if data_str == "[DONE]":'
  - '                break'
  - '            try:'
  - '                data = json.loads(data_str)'
  - '            except json.JSONDecodeError:'
  - '                continue'
  - '            choices = data.get("choices", [])'
  - '            if not choices:'
  - '                continue'
  - '            delta = choices[0].get("delta", {})'
  - '            if delta.get("reasoning_content"):'
  - '                reasoning_content += delta["reasoning_content"]'
  - '            if delta.get("content"):'
  - '                full_content += delta["content"]'
  - '                print_model_output(delta["content"])'
  - '            for tc in delta.get("tool_calls", []):'
  - '                idx = tc.get("index", 0)'
  - '                while len(tool_calls) <= idx:'
  - '                    tool_calls.append('
  - '                        {'
  - '                            "id": "",'
  - '                            "type": "function",'
  - '                            "function": {"name": "", "arguments": ""},'
  - '                        }'
  - '                    )'
  - '                if "id" in tc:'
  - '                    tool_calls[idx]["id"] += tc["id"]'
  - '                if "function" in tc:'
  - '                    if "name" in tc["function"]:'
  - '                        tool_calls[idx]["function"]["name"] += tc["function"]["name"]'
  - '                    if "arguments" in tc["function"]:'
  - '                        tool_calls[idx]["function"]["arguments"] += tc["function"]["arguments"]'
  - '    else:'
  - '        data = response.json()'
  - '        choices = data.get("choices", [])'
  - '        if choices:'
  - '            msg = choices[0].get("message", {})'
  - '            full_content = msg.get("content") or ""'
  - '            reasoning_content = msg.get("reasoning_content") or ""'
  - '            tool_calls = msg.get("tool_calls") or []'
  - '            if full_content:'
  - '                print_model_output(full_content)'
  - '    result = {"content": full_content, "tool_calls": tool_calls}'
  - '    if reasoning_content:'
  - '        result["reasoning_content"] = reasoning_content'
  - '    return result'
  - ''
