classes: []
desc: 这是 WebUI 工具的 ESLint 配置文件，用于定义项目的代码检查规则和插件配置，包括对 Svelte、TypeScript 和 Storybook
  文件的支持。
file: tools/server/webui/eslint.config.js
funcs:
- code:
  - // For more info, see https://github.com/storybookjs/eslint-plugin-storybook#configuration-flat-config-format
  - import storybook from 'eslint-plugin-storybook';
  - ' '
  - import prettier from 'eslint-config-prettier';
  - import { includeIgnoreFile } from '@eslint/compat';
  - import js from '@eslint/js';
  - import svelte from 'eslint-plugin-svelte';
  - import globals from 'globals';
  - import { fileURLToPath } from 'node:url';
  - import ts from 'typescript-eslint';
  - import svelteConfig from './svelte.config.js';
  - ' '
  - const gitignorePath = fileURLToPath(new URL('./.gitignore', import.meta.url));
  - ' '
  - export default ts.config(
  - "\tincludeIgnoreFile(gitignorePath),"
  - "\tjs.configs.recommended,"
  - "\t...ts.configs.recommended,"
  - "\t...svelte.configs.recommended,"
  - "\tprettier,"
  - "\t...svelte.configs.prettier,"
  - "\t{"
  - "\t\tlanguageOptions: {"
  - "\t\t\tglobals: { ...globals.browser, ...globals.node }"
  - "\t\t},"
  - "\t\trules: {"
  - "\t\t\t// typescript-eslint strongly recommend that you do not use the no-undef\
    \ lint rule on TypeScript projects."
  - "\t\t\t// see: https://typescript-eslint.io/troubleshooting/faqs/eslint/#i-get-errors-from-the-no-undef-rule-about-global-variables-not-being-defined-even-though-there-are-no-typescript-errors"
  - "\t\t\t'no-undef': 'off',"
  - "\t\t\t'svelte/no-at-html-tags': 'off',"
  - "\t\t\t// This app uses hash-based routing (#/) where resolve() from $app/paths\
    \ does not apply"
  - "\t\t\t'svelte/no-navigation-without-resolve': 'off'"
  - "\t\t}"
  - "\t},"
  - "\t{"
  - "\t\tfiles: ['**/*.svelte', '**/*.svelte.ts', '**/*.svelte.js'],"
  - "\t\tlanguageOptions: {"
  - "\t\t\tparserOptions: {"
  - "\t\t\t\tprojectService: true,"
  - "\t\t\t\textraFileExtensions: ['.svelte'],"
  - "\t\t\t\tparser: ts.parser,"
  - "\t\t\t\tsvelteConfig"
  - "\t\t\t}"
  - "\t\t}"
  - "\t},"
  - "\t{"
  - "\t\t// Exclude Storybook files from main ESLint rules"
  - "\t\tignores: ['.storybook/**/*']"
  - "\t},"
  - "\tstorybook.configs['flat/recommended']"
  - );
  desc: 这是文件的全局配置代码，设置 ESLint 的规则、插件和忽略文件，并导出最终的 ESLint 配置数组。
  line: 1-45
  name: __main__
