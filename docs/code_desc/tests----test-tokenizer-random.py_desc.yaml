- desc: 一个封装类，负责通过CFFI加载libllama共享库及其C头文件，初始化llama后端，并提供访问默认模型和上下文参数的方法。
  methods:
  - code:
    - 'def __init__(self, path_llama_h: str | None = None, path_includes: list[str]
      = [], path_libllama: str | None = None):'
    - '    path_llama_h = path_llama_h or self.DEFAULT_PATH_LLAMA_H'
    - '    path_includes = path_includes or self.DEFAULT_PATH_INCLUDES'
    - '    path_libllama = path_libllama or self.DEFAULT_PATH_LIBLLAMA'
    - '    (self.ffi, self.lib) = self._load_libllama_cffi(path_llama_h, path_includes,
      path_libllama)'
    - '    self.lib.llama_backend_init()'
    desc: 构造函数，根据提供的路径（或默认值）加载llama库，调用`llama_backend_init`初始化系统。
    line: 33-38
    name: __init__
  - code:
    - 'def _load_libllama_cffi(self, path_llama_h: str, path_includes: list[str],
      path_libllama: str) -> tuple[cffi.FFI, Any]:'
    - '    cmd = ["gcc", "-O0", "-E", "-P", "-D__restrict=", "-D__attribute__(x)=",
      "-D__asm__(x)="]'
    - '    cmd += ["-I" + path for path in path_includes] + [path_llama_h]'
    - '    res = subprocess.run(cmd, stdout=subprocess.PIPE)'
    - '    assert (res.returncode == 0)'
    - '    source = res.stdout.decode()'
    - '    ffi = cffi.FFI()'
    - '    if True:  # workarounds for pycparser'
    - '        source = "typedef struct { } __builtin_va_list;" + "\n" + source'
    - '        source = source.replace("sizeof (int)",    str(ffi.sizeof("int")))'
    - '        source = source.replace("sizeof (void *)", str(ffi.sizeof("void*")))'
    - '        source = source.replace("sizeof (size_t)", str(ffi.sizeof("size_t")))'
    - '        source = source.replace("sizeof(int32_t)", str(ffi.sizeof("int32_t")))'
    - '    ffi.cdef(source, override=True)'
    - '    lib = ffi.dlopen(path_libllama)'
    - '    return (ffi, lib)'
    desc: 使用gcc预处理llama.h头文件，通过CFFI的cdef和dlopen加载libllama共享库，并处理pycparser的兼容性问题。
    line: 40-52
    name: _load_libllama_cffi
  - code:
    - 'def model_default_params(self, **kwargs):'
    - '    mparams = self.lib.llama_model_default_params()'
    - '    for k, v in kwargs.items():'
    - '        setattr(mparams, k, v)'
    - '    return mparams'
    desc: 获取llama模型的默认参数，并允许通过关键字参数覆盖特定字段。
    line: 54-58
    name: model_default_params
  - code:
    - 'def context_default_params(self, **kwargs):'
    - '    cparams = self.lib.llama_context_default_params()'
    - '    for k, v in kwargs.items():'
    - '        setattr(cparams, k, v)'
    - '    return cparams'
    desc: 获取llama上下文的默认参数，并允许通过关键字参数覆盖特定字段。
