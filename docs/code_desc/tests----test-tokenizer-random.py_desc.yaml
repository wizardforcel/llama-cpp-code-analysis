- desc: 一个封装类，代表加载的llama模型和其上下文，提供tokenize和detokenize方法，并负责资源释放。
  methods:
  - code:
    - 'def __init__(self, libllama: LibLlama, path_model: str, mparams={}, cparams={}):'
    - '    self.lib: Any = libllama.lib'
    - '    self.ffi = libllama.ffi'
    - '    if isinstance(mparams, dict):'
    - '        mparams = libllama.model_default_params(**mparams)'
    - '    self.model = self.lib.llama_model_load_from_file(path_model.encode(), mparams)'
    - '    if not self.model:'
    - '        raise RuntimeError("error: failed to load model ''%s''" % path_model)'
    - '    if isinstance(cparams, dict):'
    - '        cparams = libllama.context_default_params(**cparams)'
    - '    self.ctx = self.lib.llama_new_context_with_model(self.model, cparams)'
    - '    if not self.ctx:'
    - '        raise RuntimeError("error: failed to create context for model ''%s''"
      % path_model)'
    - '    n_tokens_max = self.lib.llama_n_ctx(self.ctx)'
    - '    self.token_ids = self.ffi.new("llama_token[]", n_tokens_max)'
    - '    self.text_buff = self.ffi.new("uint8_t[]", 1024)'
    desc: 从gguf文件加载模型，创建上下文，并初始化用于存储token ID和文本数据的缓冲区。
    line: 67-81
    name: __init__
  - code:
    - 'def free(self):'
    - '    if self.ctx:'
    - '        self.lib.llama_free(self.ctx)'
    - '    if self.model:'
    - '        self.lib.llama_model_free(self.model)'
    - '    self.ctx = None'
    - '    self.model = None'
    - '    self.lib = None'
    desc: 释放llama模型和上下文占用的内存资源，并清空相关引用。
    line: 82-88
    name: free
  - code:
    - 'def tokenize(self, text: str, add_special: bool = False, parse_special: bool
      = False) -> list[int]:'
    - '    encoded_text: bytes = text.encode("utf-8")'
    - '    num = self.lib.llama_tokenize(self.model, encoded_text, len(encoded_text),
      self.token_ids, len(self.token_ids), add_special, parse_special)'
    - '    while num < 0 and len(self.token_ids) < (16 << 20):'
    - '        self.token_ids = self.ffi.new("llama_token[]", -2 * num)'
    - '        num = self.lib.llama_tokenize(self.model, encoded_text, len(encoded_text),
      self.token_ids, len(self.token_ids), add_special, parse_special)'
    - '    return list(self.token_ids[0:num])'
    desc: 调用底层llama_tokenize函数将文本编码为token ID列表，并在缓冲区不足时自动扩容。
    line: 90-97
    name: tokenize
  - code:
    - 'def detokenize(self, ids: list[int], remove_special: bool = False, unparse_special:
      bool = False) -> str:'
    - '    if len(self.token_ids) < len(ids):'
    - '        self.token_ids = self.ffi.new("llama_token[]", 2 * len(ids))'
    - '    for i, id in enumerate(ids):'
    - '        self.token_ids[i] = id'
    - '    num = self.lib.llama_detokenize(self.model, self.token_ids, len(ids), self.text_buff,
      len(self.text_buff), remove_special, unparse_special)'
    - '    while num < 0 and len(self.text_buff) < (16 << 20):'
    - '        self.text_buff = self.ffi.new("uint8_t[]", -2 * num)'
    - '        num = self.lib.llama_detokenize(self.model, self.token_ids, len(ids),
      self.text_buff, len(self.text_buff), remove_special, unparse_special)'
    - '    return str(self.ffi.buffer(self.text_buff, num), encoding="utf-8", errors="replace")  #
      replace errors with ''\uFFFD'' # pyright: ignore[reportArgumentType]'
    desc: 调用底层llama_detokenize函数将token ID列表解码为文本字符串，并在缓冲区不足时自动扩容。
    line: 99-109
    name: detokenize
