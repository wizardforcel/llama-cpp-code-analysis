desc: 该文件定义了混合内存实现类 llama_memory_hybrid_iswa 及其对应的上下文类 llama_memory_hybrid_iswa_context。该类整合了基于注意力的
  KV 缓存（llama_kv_cache_iswa，支持滑动窗口注意力 SWA）和基于递归的内存（llama_memory_recurrent），使模型能够支持部分层使用注意力机制、部分层使用递归机制的混合架构。它实现了
  llama_memory_i 和 llama_memory_context_i 接口，负责统一管理批处理初始化、状态更新、序列操作及内存状态持久化。
