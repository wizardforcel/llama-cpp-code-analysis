desc: 该文件是 TypeScript 类型声明文件（.d.ts），定义了项目中通用的工具类型和接口，包括键值对结构（KeyValuePair）、二进制文件检测配置项（BinaryDetectionOptions）、剪贴板文本附件格式（ClipboardTextAttachment）、剪贴板
  MCP 提示附件格式（ClipboardMcpPromptAttachment）、剪贴板附件联合类型（ClipboardAttachment）、剪贴板解析结果结构（ParsedClipboardContent）以及
  MIME 类型联合类型（MimeTypeUnion）。文件不包含任何类实现、方法或全局函数，纯粹提供类型定义供其他模块引用。
