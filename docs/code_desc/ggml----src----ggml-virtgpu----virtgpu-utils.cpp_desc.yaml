    - '    if (unlikely(!root)) {'
    - '        unsigned root_level = 0;'
    - '        uint64_t idx_iter   = idx >> node_size_log2;'
    - '        while (idx_iter) {'
    - '            idx_iter >>= node_size_log2;'
    - '            root_level++;'
    - '        }'
    - '        uintptr_t new_root = _util_sparse_array_node_alloc(arr, root_level);'
    - '        root               = _util_sparse_array_set_or_free_node(&arr->root,
