  - '    return ((sizeof(uint64_t) * 8 - 1) - __builtin_clzll(n | 1));'
  - '#else'
  - '    uint64_t pos = 0ull;'
  - '    if (n >= 1ull << 32) {'
  - '        n >>= 32;'
  - '        pos += 32;'
  - '    }'
  - '    if (n >= 1ull << 16) {'
  - '        n >>= 16;'
  - '        pos += 16;'
  - '    }'
  - '    if (n >= 1ull << 8) {'
  - '        n >>= 8;'
  - '        pos += 8;'
  - '    }'
  - '    if (n >= 1ull << 4) {'
  - '        n >>= 4;'
  - '        pos += 4;'
  - '    }'
  - '    if (n >= 1ull << 2) {'
  - '        n >>= 2;'
  - '        pos += 2;'
  - '    }'
  - '    if (n >= 1ull << 1) {'
  - '        pos += 1;'
  - '    }'
  - '    return pos;'
  - '#endif'
  - '}'
