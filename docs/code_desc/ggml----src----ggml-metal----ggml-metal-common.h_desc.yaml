classes: []
desc: 该文件是GGML金属后端的一个辅助函数头文件，提供了一系列用于内存范围跟踪、并发调度优化和计算图重排序的C接口。其核心功能是通过跟踪张量操作的读写内存范围，避免并发任务间的内存冲突，并提供一个通用的图优化函数来重新排序计算图中的节点，以提高在金属后端上的执行并发性。
file: ggml/src/ggml-metal/ggml-metal-common.h
