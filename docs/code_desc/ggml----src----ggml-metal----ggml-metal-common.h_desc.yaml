  desc: 将给定张量的源（src）或目标（dst）内存范围添加到跟踪器中，用于记录该操作占用的内存区域。
  line: '30'
  name: ggml_mem_ranges_add
- code:
  - bool ggml_mem_ranges_check(ggml_mem_ranges_t mrs, const struct ggml_tensor * tensor);
  desc: 检查给定张量的内存范围是否与现有跟踪器中的范围存在冲突，返回false表示存在冲突（新源范围与现有目标范围重叠，或新目标范围与任何现有范围重叠）。
