desc: 该文件实现了一个简单的全局临界区同步机制，用于保护共享资源。它定义了一个全局互斥锁，并提供两个全局函数分别用于加锁（进入临界区）和解锁（离开临界区），从而确保在同一时间只有一个线程可以执行关键的代码段。
file: ggml/src/ggml-threading.cpp
funcs:
- code:
  - void ggml_critical_section_start() {
  - '    ggml_critical_section_mutex.lock();'
  - '}'
  desc: 获取全局互斥锁，进入临界区。如果锁已被其他线程持有，则当前线程会阻塞等待。
  line: 5-7
  name: ggml_critical_section_start
- code:
  - void ggml_critical_section_end(void) {
  - '    ggml_critical_section_mutex.unlock();'
  - '}'
  desc: 释放全局互斥锁，离开临界区，允许其他等待的线程获取锁并进入。
  line: 9-11
  name: ggml_critical_section_end
