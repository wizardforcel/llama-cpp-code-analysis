classes:
- desc: A context structure that holds the operation context pointer, computed division
    values for index mapping, and thread count information needed during parallel
    execution.
  methods:
  - code:
    - static void get_rows_thread_f32_f32(unsigned int nth, unsigned int ith, void
      *data) {
    - '    struct get_rows_context * grctx = (struct get_rows_context *)data;'
    - '    struct htp_ops_context * octx = grctx->octx;'
    - '    get_rows_preamble;'
    - ''
    - '    // parallelize by src1 elements (which correspond to dst rows)'
    - '    const uint32_t dr  = grctx->src1_nrows_per_thread;'
    - '    const uint32_t ir0 = dr * ith;'
    - '    const uint32_t ir1 = (ir0 + dr < nr) ? (ir0 + dr) : nr;'
    - ''
    - '    const bool is_i32 = (octx->src1.type == HTP_TYPE_I32);'
    - ''
    - '    for (uint32_t i = ir0; i < ir1; ++i) {'
    - '        const uint32_t i12 = fastdiv(i, &grctx->get_rows_div_ne10_ne11);'
    - '        const uint32_t rem = i - i12 * ne11 * ne10;'
    - '        const uint32_t i11 = fastdiv(rem, &grctx->get_rows_div_ne10);'
    - '        const uint32_t i10 = rem - i11 * ne10;'
    - ''
    - '        const uintptr_t src1_addr = octx->src1.data + i10*nb10 + i11*nb11 +
      i12*nb12;'
    - ''
    - '        uint32_t i01 = is_i32 ? *(int32_t *)src1_addr : *(int64_t *)src1_addr;'
    - ''
    - '        if (i01 >= ne01) {'
    - '            // invalid index, skip for now to avoid crash'
    - '            continue;'
    - '        }'
    - ''
    - '        const uintptr_t src0_ptr = octx->src0.data + i01*nb01 + i11*nb02 +
      i12*nb03;'
    - '        const uintptr_t dst_ptr  = octx->dst.data  + i10*nb1  + i11*nb2  +
      i12*nb3;'
    - '        hvx_copy_f32_uu((uint8_t *)dst_ptr, (const uint8_t *)src0_ptr, ne00);'
    - '    }'
    - '}'
    desc: Thread worker function that processes a slice of the output rows in parallel.
      It extracts the destination row index from source1 tensor (handling both int32
      and int64 indices), copies the corresponding row from source0 to the destination
      tensor using HVX-optimized copy routines, and skips invalid indices to avoid
      memory access crashes.
