  name: get_rows_context
desc: The file implements the get-rows operation for Hexagon's HVX (Hexagon Vector
  eXtension) capabilities, providing a parallel implementation that retrieves rows
  from a source tensor based on indices provided in a second tensor. The primary function
  `op_get_rows` orchestrates the operation by validating tensor types, setting up
  parallel context, and dispatching to the worker pool, while the thread function
  `get_rows_thread_f32_f32` performs the actual row-copying work. The implementation
  focuses on performance-critical paths for float32 data with int32/int64 index tensors,
  using fast division to map flattened row indices to multi-dimensional coordinates,
  and handles boundary conditions by skipping invalid indices.
file: ggml/src/ggml-hexagon/htp/get-rows-ops.c
funcs:
- code:
  - int op_get_rows(struct htp_ops_context * octx) {
  - '    get_rows_preamble;'
  - ''
  - '    const uint32_t n_threads = MIN(nr, octx->n_threads);'
  - ''
  - '    if (octx->src0.type != HTP_TYPE_F32) {'
  - '        return HTP_STATUS_NO_SUPPORT;'
  - '    }'
  - ''
  - '    if (octx->dst.type != HTP_TYPE_F32) {'
  - '        return HTP_STATUS_NO_SUPPORT;'
  - '    }'
  - ''
  - '    if (octx->src1.type != HTP_TYPE_I32 && octx->src1.type != HTP_TYPE_I64) {'
  - '        return HTP_STATUS_NO_SUPPORT;'
  - '    }'
  - ''
  - '    if (octx->flags & HTP_OPFLAGS_SKIP_COMPUTE) {'
  - '        return HTP_STATUS_OK;'
  - '    }'
  - ''
  - '    struct get_rows_context grctx;'
  - '    grctx.octx = octx;'
  - '    grctx.get_rows_div_ne10      = init_fastdiv_values(octx->src1.ne[0]);'
  - '    grctx.get_rows_div_ne10_ne11 = init_fastdiv_values(octx->src1.ne[0] * octx->src1.ne[1]);'
  - ''
  - '    grctx.src1_nrows_per_thread = (nr + n_threads - 1) / n_threads;'
  - ''
  - '    worker_pool_run_func(octx->ctx->worker_pool, get_rows_thread_f32_f32, &grctx,
    n_threads);'
  - '    return HTP_STATUS_OK;'
  - '}'
  desc: The main entry point for the get-rows operation. It performs type validation
    for sources and destination tensors, checks for skip-compute flags, initializes
    the parallel context with fast division values, calculates the work distribution
    per thread, and launches the worker pool to execute the operation in parallel.
