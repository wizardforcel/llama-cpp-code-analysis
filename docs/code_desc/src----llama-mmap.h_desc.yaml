desc: 该文件是llama.cpp项目中用于内存映射文件（mmap）和文件锁定的平台抽象层头文件。它声明了三个核心类：llama_file（文件读写抽象，支持直接IO和内存对齐读操作）、llama_mmap（内存映射文件管理，支持分片映射和取消映射）、llama_mlock（内存锁定管理，用于将映射内存锁进物理内存），同时定义了存储这些对象容器的类型别名（llama_files、llama_mmaps、llama_mlocks），以及全局函数llama_path_max（返回系统路径最大长度）。该头文件体现了Pimpl（指针到实现）设计模式，隐藏平台相关的具体实现细节。
