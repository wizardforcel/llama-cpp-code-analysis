classes: []
desc: 该文件实现了OpenVINO后端中Flash Attention扩展算子的翻译逻辑，将GGML图节点中的Flash Attention操作转换为OpenVINO的ScaledDotProductAttention算子序列，包括Q矩阵的精度转换、K/V矩阵的头部扩展（tile）、注意力掩码的切片和预处理，以及最终输出布局的转置和精度恢复，以适配多头注意力机制在推理引擎中的执行需求。
file: ggml/src/ggml-openvino/openvino/op/flash_attn_ext.cpp
funcs:
- code:
  - OutputVector translate_flash_attn_ext(const NodeContext & context) {
  - '    num_inputs_check(context, 4, 4);'
  - '    auto q_f32 = context.get_input(0);'
  - '    auto k = context.get_input(1);'
  - '    auto v = context.get_input(2);'
  - '    auto mask = context.get_input(3);'
  - ''
  - '    float * params = reinterpret_cast<float *>(context.get_output_op_params());'
  - '    float scale = params[0];'
  - ''
  - '    auto q = std::make_shared<ov::op::v0::Convert>(q_f32, ov::element::f16);'
  - '    auto scale_node = std::make_shared<ov::op::v0::Constant>(ov::element::f16,
    ov::Shape{}, std::vector<float>{scale});'
  - ''
  - '    ov::Output<ov::Node> mask_sliced, res;'
  - '    std::string mask_name = "KQ_mask_sliced";'
  - '    if (context.get_input_names()[3].find("swa") != std::string::npos) {'
  - '        mask_name = "KQ_mask_swa_sliced";'
  - '    }'
  - '    if (context.has_input(mask_name)) {'
  - '        mask_sliced = context.get_input(mask_name);'
  - '    } else {'
  - '        auto zero = ov::op::v0::Constant::create(ov::element::i64, {1}, {0});'
  - '        auto one = ov::op::v0::Constant::create(ov::element::i64, {1}, {1});'
  - '        auto two = ov::op::v0::Constant::create(ov::element::i64, {1}, {2});'
  - '        auto token_len = get_dimensions(q, {2});'
  - '        mask_sliced = std::make_shared<ov::op::v8::Slice>(mask, zero, token_len,
    one, two);'
  - '    }'
  - ''
  - '    if (mask_sliced.get_element_type() != ov::element::f16) {'
  - '        mask_sliced = std::make_shared<ov::op::v0::Convert>(mask_sliced, ov::element::f16);'
  - '    }'
  - ''
  - '    auto tile_kv = [&](int64_t num_heads, int64_t num_heads_kv, int64_t head_size,
    ov::Output<Node> kv) {'
  - '        int64_t factor = num_heads / num_heads_kv;'
  - '        if (factor > 1 && num_heads_kv > 1) {'
  - '            ov::Output<ov::Node> kv_broadcast_shape, kv_unsqueezed, new_kv_shape;'
  - '            auto unsqueeze_axes = ov::op::v0::Constant::create(ov::element::i64,
    Shape{}, {2});'
  - '            kv_unsqueezed = std::make_shared<ov::op::v0::Unsqueeze>(kv, unsqueeze_axes);'
  - ''
  - '            kv_broadcast_shape = ov::op::v0::Constant::create('
  - '                ov::element::i64, {5}, {(int64_t) 1, (int64_t) 1, factor, (int64_t)
    1, (int64_t) 1});'
  - '            new_kv_shape ='
  - '                ov::op::v0::Constant::create(ov::element::i64, {4}, {(int64_t)
    0, num_heads, (int64_t) -1, head_size});'
  - ''
  - '            kv = std::make_shared<ov::op::v3::Broadcast>(kv_unsqueezed, kv_broadcast_shape,'
  - '                                                         ov::op::BroadcastType::BIDIRECTIONAL);'
  - '            kv = std::make_shared<ov::op::v1::Reshape>(kv, new_kv_shape, true);'
  - '        }'
  - '        return kv;'
  - '    };'
  - ''
  - '    auto q_shape = context.get_input_shape(0).to_shape();'
  - '    auto k_shape = context.get_input_shape(1).to_shape();'
  - '    k = tile_kv(q_shape[1], k_shape[1], q_shape[3], k);'
  - '    v = tile_kv(q_shape[1], k_shape[1], q_shape[3], v);'
  - ''
  - '    auto sdpa = std::make_shared<ov::op::v13::ScaledDotProductAttention>(q, k,
    v, mask_sliced, scale_node, false);'
  - '    res = std::make_shared<ov::op::v1::Transpose>(sdpa,'
  - '                                                  ov::op::v0::Constant::create(ov::element::i64,
    {4}, {0, 2, 1, 3}));'
  - '    res = std::make_shared<ov::op::v0::Convert>(res, ov::element::f32);'
  - '    return rename_outputs_with_suffix({res}, context.get_name());'
  - '}'
  desc: 将GGML的Flash Attention扩展节点翻译为OpenVINO的ScaledDotProductAttention算子，处理输入精度转换、K/V头部扩展、掩码切片及输出布局与精度调整。
