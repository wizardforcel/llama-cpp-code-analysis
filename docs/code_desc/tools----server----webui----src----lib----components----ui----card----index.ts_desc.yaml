desc: 该文件是 Card 组件的入口模块（index.ts），采用了 Barrel/Passthrough 模块模式。它从同一目录下的多个 .svelte 文件中导入
  Card 相关的各个子组件（Root、Content、Description、Footer、Header、Title、Action），并统一导出。同时，它提供了两套导出别名：一套是原始名称（Root、Content
  等），另一套是带 Card 前缀的别名（Card、CardContent 等），方便使用方在命名上更清晰地区分不同 Card 子组件的用途。
file: tools/server/webui/src/lib/components/ui/card/index.ts
