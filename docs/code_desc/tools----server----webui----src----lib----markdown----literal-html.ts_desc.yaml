  - 'export const remarkLiteralHtml: Plugin<[], Root> = () => {'
  - "\treturn (tree) => {"
  - "\t\tvisit(tree, 'html', (node, index, parent) => {"
  - "\t\t\tif (!parent || typeof index !== 'number') {"
  - "\t\t\t\treturn;"
  - "\t\t\t}"
  - ''
  - "\t\t\tconst replacement = createLiteralChildren(node.value);"
  - ''
  - "\t\t\tif (!PHRASE_PARENTS.has(parent.type as string)) {"
  - "\t\t\t\tconst paragraph: Paragraph = {"
  - "\t\t\t\t\ttype: 'paragraph',"
  - "\t\t\t\t\tchildren: replacement as Paragraph['children'],"
  - "\t\t\t\t\tdata: { literalHtml: true }"
  - "\t\t\t\t};"
  - ''
  - "\t\t\t\tconst siblings = parent.children as unknown as Content[];"
  - "\t\t\t\tsiblings.splice(index, 1, paragraph as unknown as Content);"
  - ''
  - "\t\t\t\tif (index > 0) {"
  - "\t\t\t\t\tconst previous = siblings[index - 1] as Paragraph | undefined;"
  - ''
  - "\t\t\t\t\tif ("
  - "\t\t\t\t\t\tprevious?.type === 'paragraph' &&"
  - "\t\t\t\t\t\t(previous.data as { literalHtml?: boolean } | undefined)?.literalHtml"
  - "\t\t\t\t\t) {"
  - "\t\t\t\t\t\tconst prevChildren = previous.children as unknown as PhrasingContent[];"
  - ''
  - "\t\t\t\t\t\tif (prevChildren.length) {"
  - "\t\t\t\t\t\t\tconst lastChild = prevChildren[prevChildren.length - 1];"
  - ''
  - "\t\t\t\t\t\t\tif (lastChild.type !== 'break') {"
  - "\t\t\t\t\t\t\t\tprevChildren.push({"
  - "\t\t\t\t\t\t\t\t\ttype: 'break'"
  - "\t\t\t\t\t\t\t\t} as Break as unknown as PhrasingContent);"
  - "\t\t\t\t\t\t\t}"
  - "\t\t\t\t\t\t}"
  - ''
  - "\t\t\t\t\t\tprevChildren.push(...(paragraph.children as unknown as PhrasingContent[]));"
  - ''
  - "\t\t\t\t\t\tsiblings.splice(index, 1);"
  - ''
  - "\t\t\t\t\t\treturn index;"
  - "\t\t\t\t\t}"
  - "\t\t\t\t}"
  - ''
