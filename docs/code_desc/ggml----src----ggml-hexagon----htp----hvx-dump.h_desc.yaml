desc: 该文件为HVX（Hexagon Vector eXtensions）向量数据类型提供了一系列调试和转储辅助函数，支持对半精度浮点（fp16）、单精度浮点（fp32）、有符号/无符号8位整数（int8/uint8）及32位整数（int32）向量进行格式化输出和逐字节比较，便于开发者诊断和验证HVX向量处理逻辑的正确性。
