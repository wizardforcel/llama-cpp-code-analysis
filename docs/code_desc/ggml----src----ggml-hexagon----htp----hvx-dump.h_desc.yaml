  - static bool hvx_vec_eq(HVX_Vector v0, HVX_Vector v1, size_t n) {
  - '    typedef union {'
  - '        HVX_Vector v;'
  - '        int8_t     d[128];'
  - '    } U;'
  - ''
  - '    U u0 = { .v = v0 };'
  - '    U u1 = { .v = v1 };'
  - ''
  - '    for (int i = 0; i < n; i++) {'
  - '        if (u0.d[i] != u1.d[i]) {'
  - '            return false;'
  - '        }'
  - '    }'
  - ''
  - '    return true;'
  - '}'
