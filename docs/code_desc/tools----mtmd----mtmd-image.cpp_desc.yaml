  - code:
    - static bool resize_bicubic(const clip_image_u8 & img, clip_image_u8 & dst, int
      target_width, int target_height) {
    - '    const int nx = img.nx;'
    - '    const int ny = img.ny;'
    - '    dst.nx = target_width;'
    - '    dst.ny = target_height;'
    - '    dst.buf.resize(3 * target_width * target_height);'
    - '    float Cc;'
    - '    float C[5] = {};'
    - '    float d0, d2, d3, a0, a1, a2, a3;'
    - '    int i, j, k, jj;'
    - '    int x, y;'
    - '    float dx, dy;'
    - '    float tx, ty;'
    - '    tx = (float)nx / (float)target_width;'
    - '    ty = (float)ny / (float)target_height;'
    - '    for (i = 0; i < target_height; i++) {'
    - '        for (j = 0; j < target_width; j++) {'
    - '            x = (int)(tx * j);'
    - '            y = (int)(ty * i);'
    - '            dx = tx * j - x;'
    - '            dy = ty * i - y;'
    - '            for (k = 0; k < 3; k++) {'
    - '                for (jj = 0; jj <= 3; jj++) {'
    - '                    d0 = img.buf[(clip(y - 1 + jj, 0, ny - 1) * nx + clip(x
      - 1, 0, nx - 1)) * 3 + k] - img.buf[(clip(y - 1 + jj, 0, ny - 1) * nx + clip(x,
      0, nx - 1)) * 3 + k];'
    - '                    d2 = img.buf[(clip(y - 1 + jj, 0, ny - 1) * nx + clip(x
      + 1, 0, nx - 1)) * 3 + k] - img.buf[(clip(y - 1 + jj, 0, ny - 1) * nx + clip(x,
      0, nx - 1)) * 3 + k];'
    - '                    d3 = img.buf[(clip(y - 1 + jj, 0, ny - 1) * nx + clip(x
      + 2, 0, nx - 1)) * 3 + k] - img.buf[(clip(y - 1 + jj, 0, ny - 1) * nx + clip(x,
      0, nx - 1)) * 3 + k];'
    - '                    a0 = img.buf[(clip(y - 1 + jj, 0, ny - 1) * nx + clip(x,
      0, nx - 1)) * 3 + k];'
    - '                    a1 = -1.0 / 3 * d0 + d2 - 1.0 / 6 * d3;'
    - '                    a2 =  1.0 / 2 * d0 +      1.0 / 2 * d2;'
    - '                    a3 = -1.0 / 6 * d0 -      1.0 / 2 * d2 + 1.0 / 6 * d3;'
    - '                    C[jj] = a0 + a1 * dx + a2 * dx * dx + a3 * dx * dx * dx;'
    - '                    d0 = C[0] - C[1];'
    - '                    d2 = C[2] - C[1];'
    - '                    d3 = C[3] - C[1];'
    - '                    a0 = C[1];'
    - '                    a1 = -1.0 / 3 * d0 + d2 - 1.0 / 6 * d3;'
    - '                    a2 =  1.0 / 2 * d0 +      1.0 / 2 * d2;'
    - '                    a3 = -1.0 / 6 * d0 -      1.0 / 2 * d2 + 1.0 / 6 * d3;'
    - '                    Cc = a0 + a1 * dy + a2 * dy * dy + a3 * dy * dy * dy;'
    - '                    const uint8_t Cc2 = std::min(std::max(std::round(Cc), 0.0f),
      255.0f);'
    - '                    dst.buf[(i * target_width + j) * 3 + k] = float(Cc2);'
    - '                }'
    - '            }'
    - '        }'
    - '    }'
    - '    return true;'
    - '}'
    desc: 使用双三次插值算法缩放图像，可裁剪部分区域以匹配纵横比。
    line: 1-280
    name: resize_bicubic
  - code:
    - static bool resize_bicubic_pillow(const clip_image_u8 & img, clip_image_u8 &
      dst, int target_width, int target_height) {
    - '    const int PRECISION_BITS = 32 - 8 - 2;'
    - '    auto bicubic_filter = [](double x) -> double {'
    - '        constexpr double a = -0.5;'
    - '        if (x < 0.0) { x = -x; }'
    - '        if (x < 1.0) { return ((a + 2.0) * x - (a + 3.0)) * x * x + 1; }'
    - '        if (x < 2.0) { return (((x - 5) * x + 8) * x - 4) * a; }'
    - '        return 0.0;'
    - '    };'
    - '    constexpr double filter_support = 2.0;'
    - '    auto clip8 = [](int val) -> uint8_t {'
    - '        if (val < 0) return 0;'
    - '        if (val > 255) return 255;'
    - '        return static_cast<uint8_t>(val);'
    - '    };'
    - '    auto precompute_weights = [&](int inSize, int outSize, std::vector<int>
      & bounds, std::vector<int32_t> & weights) -> int {'
    - '        double support, scale, filterscale, center, ww, ss;'
    - '        int xx, x, ksize, xmin, xmax, xcnt;'
    - '        filterscale = scale = (double)inSize / outSize;'
    - '        if (filterscale < 1.0) { filterscale = 1.0; }'
    - '        support = filter_support * filterscale;'
    - '        ksize = static_cast<int>(std::ceil(support)) * 2 + 1;'
    - '        std::vector<double> pre_weights(outSize * ksize);'
    - '        bounds.resize(outSize * 2);'
    - '        for (xx = 0; xx < outSize; xx++) {'
    - '            center = (xx + 0.5) * scale;'
    - '            ww = 0.0;'
    - '            ss = 1.0 / filterscale;'
    - '            xmin = static_cast<int>(center - support + 0.5);'
    - '            if (xmin < 0) { xmin = 0; }'
    - '            xmax = static_cast<int>(center + support + 0.5);'
    - '            if (xmax > inSize) { xmax = inSize; }'
    - '            xcnt = xmax - xmin;'
    - '            for (x = 0; x < xcnt; x++) {'
    - '                double w = bicubic_filter((x + xmin - center + 0.5) * ss);'
    - '                pre_weights[xx * ksize + x] = w;'
    - '                ww += w;'
    - '            }'
    - '            for (x = 0; x < xcnt; x++) {'
    - '                if (ww != 0.0) { pre_weights[xx * ksize + x] /= ww; }'
    - '            }'
    - '            for (; x < ksize; x++) { pre_weights[xx * ksize + x] = 0; }'
    - '            bounds[xx * 2 + 0] = xmin;'
    - '            bounds[xx * 2 + 1] = xcnt;'
    - '        }'
    - '        weights.resize(outSize * ksize);'
    - '        for (int i = 0; i < outSize * ksize; i++) {'
    - '            if (pre_weights[i] < 0) { weights[i] = static_cast<int32_t>(-0.5
      + pre_weights[i] * (1 << PRECISION_BITS)); }'
    - '            else { weights[i] = static_cast<int32_t>(0.5 + pre_weights[i] *
      (1 << PRECISION_BITS)); }'
    - '        }'
    - '        return ksize;'
    - '    };'
    - '    auto resample_horizontal = [&](const clip_image_u8 & imIn, clip_image_u8
      & imOut, int ksize, const std::vector<int> & bounds, const std::vector<int32_t>
      & weights) {'
    - '        imOut.ny = imIn.ny;'
    - '        imOut.buf.resize(3 * imOut.nx * imOut.ny);'
    - '        for (int yy = 0; yy < imOut.ny; yy++) {'
    - '            for (int xx = 0; xx < imOut.nx; xx++) {'
    - '                int xmin = bounds[xx * 2 + 0];'
    - '                int xcnt = bounds[xx * 2 + 1];'
    - '                int32_t ss0 = 1 << (PRECISION_BITS - 1);'
    - '                int32_t ss1 = 1 << (PRECISION_BITS - 1);'
    - '                int32_t ss2 = 1 << (PRECISION_BITS - 1);'
    - '                for (int x = 0; x < xcnt; x++) {'
    - '                    int src_idx = ((yy * imIn.nx) + (x + xmin)) * 3;'
    - '                    ss0 += static_cast<uint8_t>(imIn.buf[src_idx + 0]) * weights[xx
      * ksize + x];'
    - '                    ss1 += static_cast<uint8_t>(imIn.buf[src_idx + 1]) * weights[xx
      * ksize + x];'
    - '                    ss2 += static_cast<uint8_t>(imIn.buf[src_idx + 2]) * weights[xx
      * ksize + x];'
    - '                }'
    - '                int dst_idx = (yy * imOut.nx + xx) * 3;'
    - '                imOut.buf[dst_idx + 0] = clip8(ss0 >> PRECISION_BITS);'
    - '                imOut.buf[dst_idx + 1] = clip8(ss1 >> PRECISION_BITS);'
    - '                imOut.buf[dst_idx + 2] = clip8(ss2 >> PRECISION_BITS);'
    - '            }'
    - '        }'
    - '    };'
    - '    auto resample_vertical = [&](const clip_image_u8 & imIn, clip_image_u8
      & imOut, int ksize, const std::vector<int> & bounds, const std::vector<int32_t>
      & weight) {'
    - '        imOut.nx = imIn.nx;'
    - '        imOut.buf.resize(3 * imOut.nx * imOut.ny);'
    - '        for (int yy = 0; yy < imOut.ny; yy++) {'
    - '            int ymin = bounds[yy * 2 + 0];'
    - '            int ycnt = bounds[yy * 2 + 1];'
    - '            for (int xx = 0; xx < imOut.nx; xx++) {'
    - '                int32_t ss0 = 1 << (PRECISION_BITS - 1);'
    - '                int32_t ss1 = 1 << (PRECISION_BITS - 1);'
    - '                int32_t ss2 = 1 << (PRECISION_BITS - 1);'
    - '                for (int y = 0; y < ycnt; y++) {'
    - '                    int src_idx = ((y + ymin) * imIn.nx + xx) * 3;'
    - '                    ss0 += static_cast<uint8_t>(imIn.buf[src_idx + 0]) * weight[yy
      * ksize + y];'
    - '                    ss1 += static_cast<uint8_t>(imIn.buf[src_idx + 1]) * weight[yy
      * ksize + y];'
    - '                    ss2 += static_cast<uint8_t>(imIn.buf[src_idx + 2]) * weight[yy
      * ksize + y];'
    - '                }'
    - '                int dst_idx = (yy * imOut.nx + xx) * 3;'
    - '                imOut.buf[dst_idx + 0] = clip8(ss0 >> PRECISION_BITS);'
    - '                imOut.buf[dst_idx + 1] = clip8(ss1 >> PRECISION_BITS);'
    - '                imOut.buf[dst_idx + 2] = clip8(ss2 >> PRECISION_BITS);'
    - '            }'
    - '        }'
    - '    };'
    - '    const int src_width = img.nx;'
    - '    const int src_height = img.ny;'
    - '    dst.nx = target_width;'
    - '    dst.ny = target_height;'
    - '    bool need_horizontal = (target_width != src_width);'
    - '    bool need_vertical = (target_height != src_height);'
    - '    std::vector<int> bounds_horiz, bounds_vert;'
    - '    std::vector<int32_t> weights_horiz, weights_vert;'
    - '    int ksize_horiz = 0, ksize_vert = 0;'
