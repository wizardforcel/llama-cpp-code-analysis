  - code:
    - static clip_image_size calc_size_preserved_ratio(const clip_image_size & inp_size,
      const int align_size, const int min_pixels, const int max_pixels) {
    - '    GGML_ASSERT(align_size > 0);'
    - '    const int width  = inp_size.width;'
    - '    const int height = inp_size.height;'
    - '    auto round_by_factor = [f = align_size](float x) { return static_cast<int>(std::round(x
      / static_cast<float>(f))) * f; };'
    - '    auto ceil_by_factor  = [f = align_size](float x) { return static_cast<int>(std::ceil(x
      / static_cast<float>(f))) * f; };'
    - '    auto floor_by_factor = [f = align_size](float x) { return static_cast<int>(std::floor(x
      / static_cast<float>(f))) * f; };'
    - '    int h_bar = std::max(align_size, round_by_factor(height));'
    - '    int w_bar = std::max(align_size, round_by_factor(width));'
    - '    if (h_bar * w_bar > max_pixels) {'
    - '        const auto beta = std::sqrt(static_cast<float>(height * width) / max_pixels);'
    - '        h_bar = std::max(align_size, floor_by_factor(height / beta));'
    - '        w_bar = std::max(align_size, floor_by_factor(width  / beta));'
    - '    } else if (h_bar * w_bar < min_pixels) {'
    - '        const auto beta = std::sqrt(static_cast<float>(min_pixels) / (height
      * width));'
    - '        h_bar = ceil_by_factor(height * beta);'
    - '        w_bar = ceil_by_factor(width * beta);'
    - '    }'
    - '    return {w_bar, h_bar};'
    - '}'
    desc: 根据最小/最大像素数量和对齐大小计算保持纵横比的缩放尺寸（智能缩放）。
    line: 1-150
