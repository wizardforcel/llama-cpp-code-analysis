- desc: 静态工具类，提供图像缩放、裁剪、合成、填充等核心操作，内部实现多种插值算法。
  methods:
  - code:
    - static void resize(
    - '        const clip_image_u8 & src,'
    - '        clip_image_u8 & dst,'
    - '        const clip_image_size & target_resolution,'
    - '        resize_algo algo,'
    - '        bool add_padding,'
    - '        std::array<uint8_t, 3> pad_color) {'
    - '    dst.nx = target_resolution.width;'
    - '    dst.ny = target_resolution.height;'
    - '    dst.buf.resize(3 * dst.nx * dst.ny);'
    - '    if (dst.nx == src.nx && dst.ny == src.ny) {'
    - '        dst.buf = src.buf;'
    - '        return;'
    - '    }'
    - '    if (!add_padding) {'
    - '        switch (algo) {'
    - '            case RESIZE_ALGO_BILINEAR: resize_bilinear(src, dst, target_resolution.width,
      target_resolution.height); break;'
    - '            case RESIZE_ALGO_BICUBIC: resize_bicubic(src, dst, target_resolution.width,
      target_resolution.height); break;'
    - '            case RESIZE_ALGO_BICUBIC_PILLOW: resize_bicubic_pillow(src, dst,
      target_resolution.width, target_resolution.height); break;'
    - '            default: throw std::runtime_error("Unsupported resize algorithm");'
    - '        }'
    - '    } else {'
    - '        clip_image_u8 resized_image;'
    - '        float scale_w = static_cast<float>(target_resolution.width) / src.nx;'
    - '        float scale_h = static_cast<float>(target_resolution.height) / src.ny;'
    - '        float scale = std::min(scale_w, scale_h);'
    - '        int new_width  = std::min(static_cast<int>(std::ceil(src.nx * scale)),
      target_resolution.width);'
    - '        int new_height = std::min(static_cast<int>(std::ceil(src.ny * scale)),
      target_resolution.height);'
    - '        switch (algo) {'
    - '            case RESIZE_ALGO_BILINEAR: resize_bilinear(src, resized_image,
      new_width, new_height); break;'
    - '            case RESIZE_ALGO_BICUBIC: resize_bicubic(src, resized_image, new_width,
      new_height); break;'
    - '            case RESIZE_ALGO_BICUBIC_PILLOW: resize_bicubic_pillow(src, resized_image,
      new_width, new_height); break;'
    - '            default: throw std::runtime_error("Unsupported resize algorithm");'
    - '        }'
    - '        fill(dst, pad_color);'
    - '        int offset_x = (target_resolution.width  - new_width)  / 2;'
    - '        int offset_y = (target_resolution.height - new_height) / 2;'
    - '        composite(dst, resized_image, offset_x, offset_y);'
    - '    }'
    - '}'
    desc: 对图像进行缩放，支持保持纵横比并添加填充，或直接缩放到指定尺寸。
