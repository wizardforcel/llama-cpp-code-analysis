desc: 该文件实现了一个 TypeScript 防抖工具函数，通过包装目标函数并延迟指定毫秒数执行，若在延迟期内被重复调用则重置计时器，从而限制函数执行频率。
file: tools/server/webui/src/lib/utils/debounce.ts
funcs:
- code:
  - 'export function debounce<T extends (...args: Parameters<T>) => void>('
  - '    fn: T,'
  - '    delay: number'
  - '): (...args: Parameters<T>) => void {'
  - '    let timeoutId: ReturnType<typeof setTimeout> | null = null;'
  - '    return (...args: Parameters<T>) => {'
  - '        if (timeoutId) {'
  - '            clearTimeout(timeoutId);'
  - '        }'
  - '        timeoutId = setTimeout(() => {'
  - '            fn(...args);'
  - '            timeoutId = null;'
  - '        }, delay);'
  - '    };'
  - '}'
  desc: 防抖函数，接收目标函数和延迟毫秒数，返回一个可取消重复执行的包装函数
  line: 6-24
  name: debounce
