  name: LoraModel
desc: This file implements a converter that transforms Hugging Face PEFT LoRA adapter
  files into GGUF format for use with llama.cpp. It handles loading LoRA configurations
  and weights, maps them to the base model architecture, and exports them in the GGUF
  adapter format. The script uses lazy tensor operations and custom tensor classes
  to efficiently handle LoRA's low-rank matrix decomposition.
file: ./convert_lora_to_gguf.py
funcs:
- code:
  - 'def get_base_tensor_name(lora_tensor_name: str) -> str:'
  - '    base_name = lora_tensor_name.replace("base_model.model.", "")'
  - '    base_name = base_name.replace(".lora_A.weight", ".weight")'
  - '    base_name = base_name.replace(".lora_B.weight", ".weight")'
  - '    base_name = base_name.replace(".lora_embedding_A", ".weight")'
  - '    base_name = base_name.replace(".lora_embedding_B", ".weight")'
  - '    return base_name'
  desc: Converts a LoRA tensor name to the base model tensor name by removing prefixes
    and suffixes.
  line: 228-234
  name: get_base_tensor_name
