  name: llm_build_bitnet
desc: 该文件实现了llm_build_bitnet类的构造函数，用于构建BitNet模型的推理计算图。函数依次构建了嵌入层、位置编码、注意力机制（包括Q/K/V投影、RoPE旋转、注意力计算、输出投影）、归一层、以及前馈网络（包括上投影、门控、下投影），最终输出模型的logits结果，形成完整的BitNet模型前向传播流程。
