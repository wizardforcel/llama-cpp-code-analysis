classes: []
desc: 该文件是 Storybook 配置文件，用于配置 SvelteKit 项目的 Stories（故事）目录、插件（addons）以及自定义的 Vite 构建配置（特别是放宽文件系统访问权限，使
  Storybook 能够加载位于项目tests目录下的资源）。
file: tools/server/webui/.storybook/main.ts
funcs:
- code:
  - import type { StorybookConfig } from '@storybook/sveltekit';
  - import { dirname, resolve } from 'path';
  - import { fileURLToPath } from 'url';
  - ''
  - const __dirname = dirname(fileURLToPath(import.meta.url));
  - ''
  - 'const config: StorybookConfig = {'
  - '    stories: [''../tests/stories/**/*.mdx'', ''../tests/stories/**/*.stories.@(js|ts|svelte)''],'
  - '    addons: ['
  - '        ''@storybook/addon-svelte-csf'','
  - '        ''@chromatic-com/storybook'','
  - '        ''@storybook/addon-vitest'','
  - '        ''@storybook/addon-a11y'','
  - '        ''@storybook/addon-docs'''
  - '    ],'
  - '    framework: ''@storybook/sveltekit'','
  - '    viteFinal: async (config) => {'
  - '        config.server = config.server || {};'
  - '        config.server.fs = config.server.fs || {};'
  - '        config.server.fs.allow = [...(config.server.fs.allow || []), resolve(__dirname,
    ''../tests'')];'
  - '        return config;'
  - '    }'
  - '};'
  - export default config;
  desc: 该文件为全局执行的配置脚本，没有定义显式的函数或类。它引入了 Storybook 类型定义，配置了 stories 路径、addons 和 framework，并导出了一个名为
    config 的 StorybookConfig 对象，其中包含对 Vite 配置进行异步修改的 viteFinal 回调。
  line: 1-25
  name: __main__
