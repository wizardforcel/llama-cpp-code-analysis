desc: 该文件是 chat-auto-parser 的测试套件，用于测试自动解析器中的 diff 分割、公共前缀/后缀提取、标记分隔、模板变体比较以及多种 LLM
  模板（如 Seed-OSS、Nemotron、Cohere、SmolLM3）的工具调用分析功能。通过大量单元测试验证 calculate_diff_split、until_common_prefix、after_common_suffix、compare_variants
  及 segmentize_markers 等核心函数的正确性和边界情况处理。The file tests the auto-parser's ability to
  detect and categorize template features (reasoning, tools, content) by performing
  differential analysis on various chat templates, including Seed-OSS, Nemotron, Cohere,
  and SmolLM3, through a series of test functions that compare template variants.该文件是测试文件，针对聊天自动解析器（chat-auto-parser）中的模板分析和工具调用解析功能进行单元测试，包括
  SmolLM3 模板分析、standard_json_tools 的多种格式（OpenAI、Cohere、function-as-key）、normalize_quotes_to_json
  引号转换以及带有嵌入引号的 TAG_WITH_TAGGED 参数解析等场景。
