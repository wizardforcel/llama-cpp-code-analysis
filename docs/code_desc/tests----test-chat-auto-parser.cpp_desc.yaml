  - static std::string normalize_quotes_to_json(const std::string & input) {
  - '    std::string result;'
  - '    result.reserve(input.size() + 16);'
  - ''
  - '    bool in_single_quoted = false;'
  - '    bool in_double_quoted = false;'
  - ''
  - '    for (size_t i = 0; i < input.size(); ++i) {'
  - '        char c = input[i];'
  - ''
  - '        if (c == ''\\'' && i + 1 < input.size()) {'
  - '            char next = input[i + 1];'
  - ''
  - '            if (in_single_quoted) {'
  - '                if (next == ''\'''') {'
  - '                    result += ''\'''';'
  - '                    ++i;'
  - '                    continue;'
  - '                }'
  - '                if (next == ''"'') {'
  - '                    result += "\\\"";'
  - '                    ++i;'
  - '                    continue;'
  - '                }'
  - '                result += c;'
  - '                result += next;'
  - '                ++i;'
  - '                continue;'
  - '            }'
  - ''
  - '            if (in_double_quoted) {'
  - '                result += c;'
  - '                result += next;'
  - '                ++i;'
  - '                continue;'
  - '            }'
  - ''
  - '            result += c;'
  - '            continue;'
  - '        }'
  - ''
  - '        if (c == ''"'') {'
  - '            if (in_single_quoted) {'
  - '                result += "\\\"";'
  - '            } else {'
  - '                in_double_quoted = !in_double_quoted;'
  - '                result += c;'
  - '            }'
  - '        } else if (c == ''\'''') {'
  - '            if (in_double_quoted) {'
  - '                result += c;'
  - '            } else if (in_single_quoted) {'
  - '                in_single_quoted = false;'
  - '                result += ''"'';'
  - '            } else {'
  - '                in_single_quoted = true;'
  - '                result += ''"'';'
  - '            }'
  - '        } else {'
  - '            result += c;'
  - '        }'
  - '    }'
  - ''
  - '    return result;'
  - '}'
