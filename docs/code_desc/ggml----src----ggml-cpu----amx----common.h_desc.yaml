desc: the file common.h defines AMX (Advanced Matrix Extensions) CPU kernels related
  common utilities, including tile size constants, tile register indices, parallel
  execution helper functions (balance211 and parallel_for family) for OpenMP or std::thread
  backends, and a predicate function qtype_has_amx_kernels to determine whether a
  given quantized ggml type has dedicated AMX kernels.
