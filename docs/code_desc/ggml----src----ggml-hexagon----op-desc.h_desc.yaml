desc: 该文件定义了一个用于描述 ggml 张量运算布局信息的辅助结构体 op_desc，负责将张量（及其输入源张量）的维度、步长、类型、缓冲区和名称等属性格式化为可读的字符串，便于
  Hexagon 后端算子调试时输出运算详情。
