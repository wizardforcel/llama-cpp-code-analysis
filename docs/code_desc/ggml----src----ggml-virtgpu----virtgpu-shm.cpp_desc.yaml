  name: virtgpu_ioctl_gem_close
- code:
  - static void * virtgpu_ioctl_map(virtgpu * gpu, uint32_t gem_handle, size_t size)
    {
  - '    drm_virtgpu_map args = {'
  - '        .offset = 0,'
  - '        .handle = gem_handle,'
  - '        .pad    = 0,'
  - '    };'
  - ''
  - '    if (virtgpu_ioctl(gpu, DRM_IOCTL_VIRTGPU_MAP, &args)) {'
  - '        return NULL;'
  - '    }'
  - ''
  - '    void * ptr = mmap(NULL, size, PROT_READ | PROT_WRITE, MAP_SHARED, gpu->fd,
    args.offset);'
  - '    if (ptr == MAP_FAILED) {'
  - '        return NULL;'
  - '    }'
  - ''
  - '    return ptr;'
  - '}'
  desc: 通过 DRM ioctl 获取 mmap 偏移量，并将指定大小的 GPU 内存映射到用户空间，返回映射后的指针。
