classes: []
desc: 该文件实现了 virtgpu 共享内存（shm）的创建和销毁功能，通过 DRM ioctl 调用创建 blob 资源、映射到用户空间，并提供统一的资源管理与释放接口。
file: ggml/src/ggml-virtgpu/virtgpu-shm.cpp
funcs:
- code:
  - static uint32_t virtgpu_ioctl_resource_create_blob(virtgpu *  gpu,
  - '                                                   uint32_t   blob_mem,'
  - '                                                   uint32_t   blob_flags,'
  - '                                                   size_t     blob_size,'
  - '                                                   uint64_t   blob_id,'
  - '                                                   uint32_t * res_id) {'
  - '#ifdef SIMULATE_BO_SIZE_FIX'
  - '    blob_size = align64(blob_size, 4096);'
  - '#endif'
  - ''
  - '    drm_virtgpu_resource_create_blob args = {'
  - '        .blob_mem   = blob_mem,'
  - '        .blob_flags = blob_flags,'
  - '        .bo_handle  = 0,'
  - '        .res_handle = 0,'
  - '        .size       = blob_size,'
  - '        .pad        = 0,'
  - '        .cmd_size   = 0,'
  - '        .cmd        = 0,'
  - '        .blob_id    = blob_id,'
  - '    };'
  - ''
  - '    if (virtgpu_ioctl(gpu, DRM_IOCTL_VIRTGPU_RESOURCE_CREATE_BLOB, &args)) {'
  - '        return 0;'
  - '    }'
  - ''
  - '    *res_id = args.res_handle;'
  - '    return args.bo_handle;'
  - '}'
  desc: 通过 DRM ioctl 创建 virtgpu blob 资源，返回 gem 句柄，并通过输出参数返回资源 ID。
