- desc: A functor that quantizes float data to q8_1 format and reorders the output
    into a SoA (Structure of Arrays) layout, per row, for use in specific matrix multiplication
    operations.
  methods:
  - code:
    - __dpct_inline__ void operator()(const float * __restrict__ x, void * reordered_q8_tensor,
      const int kx,
    - '                                    const int kx_padded, const sycl::nd_item<1>
      & it) const {'
    - '        /*'
    - '        Quantizes and reorders the resultant q8 tensor in a per row fashion'
    - '        Each sub-group calculates one quant block. i.e. QK8_1 quant values
      and the d and sum values'
    - '    */'
    - '        auto subgroup_id = it.get_group(0);'
    - '        auto wi_id       = it.get_local_id(0);'
    - ''
    - '        sycl::vec<int8_t, ElementsPerWI> quantized_values;'
    - '        float                            d   = 0.0f;'
    - '        float                            sum = 0.0f;'
    - '        quantize_q8_1_impl<ElementsPerWI>(x, quantized_values, d, sum, it);'
    - ''
    - '        const int num_blocks_per_row = kx / QK8_1;'
    - '        auto      row                = subgroup_id / num_blocks_per_row;'
    - '        auto      col                = subgroup_id % num_blocks_per_row;'
    - '        auto      row_offset         = row * (kx_padded / QK8_1) * sizeof(block_q8_1);'
    - '        auto      col_offset         = QK8_1 * col + wi_id * ElementsPerWI;'
    - ''
    - '        auto quant_ptr = (int8_t *) ((char *) reordered_q8_tensor + row_offset
      + col_offset);'
    - '        *reinterpret_cast<sycl::vec<int8_t, ElementsPerWI> *>(quant_ptr) =
      quantized_values;'
    - ''
    - '        auto ds_ptr = (sycl::half2 *) ((char *) reordered_q8_tensor + row_offset
      + kx + col * sizeof(sycl::half2));'
    - '        if (wi_id == 0) {'
    - '            *ds_ptr = sycl::half2(sycl::half(d), sycl::half(sum));'
    - '        }'
    - '    }'
