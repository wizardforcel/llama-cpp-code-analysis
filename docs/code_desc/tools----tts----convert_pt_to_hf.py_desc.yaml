classes: []
desc: This script converts a raw WavTokenizer PyTorch checkpoint into a HuggingFace-style
  package. It loads the checkpoint, flattens and filters the tensor entries, renames
  selected keys, reshapes some tensors, saves the result as a safetensors file, and
  writes index and config JSON files next to the input model.
file: tools/tts/convert_pt_to_hf.py
