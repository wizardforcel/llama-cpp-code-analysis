desc: 该文件定义了llama.cpp中计算图（graph）的构建相关数据结构与接口，包括输入张量管理、图参数、结果容器和上下文构建器等，用于支持不同模型架构的推理计算图构建与复用。该文件定义了LLM图形构建的接口部分（llama-graph.h），包含llm_graph_input_mem_hybrid等混合内存管理类的相关接口，以及llm_graph_build类，用于构建神经网络的各个层（如池化、采样、密集输出等），并定义了位置相关桶的全局辅助函数llama_relative_position_bucket，为后续高效图形构建和位置编码计算提供基础支持。
