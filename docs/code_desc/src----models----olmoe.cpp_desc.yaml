  name: llm_build_olmoe
desc: 该文件实现了OlMoE模型在图计算图上下文中的构建器，负责将模型结构转换为llama.cpp中间表示，包括词嵌入、位置编码、多头注意力（含RMS归一化与旋转位置编码）、MoE前馈网络（含专家路由与激活）、残差连接及输出层，最终生成完整的计算图。
