desc: 该文件是 ggml 库中 CPU 后端的算子内核实现，专门负责所有一元（unary）操作的前向计算。它通过静态内联函数定义每种数学运算（如 abs、tanh、relu
  等），并利用 C++ 模板和类型转换表，根据输入/输出张量的数据类型（FP32、FP16、BF16）分发执行，支持针对每个张量行的多线程并行计算。文件中还提供了对带参数算子（如
  xielu）的仿函数支持，通过多个公开的 ggml_compute_forward_xxx 入口函数集成到整个引擎的计算流程中。
