  - ov::Output<ov::Node> rope_yarn_ramp_mix(int n_dims, const float corr_dims[2],
    float ext_factor) {
  - '    int half_n_dims = n_dims / 2;'
  - '    std::vector<float> dim_ids_vec(half_n_dims);'
  - '    std::iota(dim_ids_vec.begin(), dim_ids_vec.end(), 0);'
  - '    auto dim_ids = ov::op::v0::Constant::create(ov::element::f32, Shape{1, 1,
    1, (size_t) half_n_dims}, dim_ids_vec);'
  - '    auto corr_low = ov::op::v0::Constant::create(ov::element::f32, Shape{1, 1,
    1, 1}, {corr_dims[0]});'
  - '    auto corr_high = ov::op::v0::Constant::create(ov::element::f32, Shape{1,
    1, 1, 1}, {corr_dims[1]});'
  - '    auto denom = std::make_shared<ov::op::v1::Maximum>('
  - '        std::make_shared<ov::op::v1::Subtract>(corr_high, corr_low),'
  - '        ov::op::v0::Constant::create(ov::element::f32, Shape{1, 1, 1, 1}, {0.001f}));'
  - '    auto ramp_y ='
  - '        std::make_shared<ov::op::v1::Divide>(std::make_shared<ov::op::v1::Subtract>(dim_ids,
    corr_low), denom);'
  - '    auto ramp_clamped = std::make_shared<ov::op::v0::Clamp>(ramp_y, 0.0f, 1.0f);'
  - '    auto ext_factor_node = ov::op::v0::Constant::create(ov::element::f32, Shape{},
    {ext_factor});'
  - '    auto ramp_mix = std::make_shared<ov::op::v1::Multiply>(ramp_clamped, ext_factor_node);'
  - '    return ramp_mix;'
  - '}'
  desc: 计算RoPE的YaRN扩展开关因子，用于在上下文长度扩展时混合插值与外推。
  line: 82-102
  name: rope_yarn_ramp_mix
