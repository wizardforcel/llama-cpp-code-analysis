  Vector、AVX、SSE 等）的向量点积（dot product）、激活函数（SiLU、SwiGLU）、方差计算和 Softmax 等数值计算函数。文件通过宏和条件编译，为各种硬件架构提供高性能的优化实现，同时包含标量回退路径以保证通用性。此外，文件还定义了用于预计算
  GELU 激活函数查找表的全局数组。
