desc: 该文件是 SYCL 后端多乘多量化矩阵乘法（MMQ）的内核实现，针对不同量化格式（Q4_0、Q4_1、Q5_0、Q5_1、Q8_0、Q2_K、Q3_K
  Q4_K、Q5_K）定义了瓦片分配、数据加载和点积计算的模板函数，以及具体的向量点积核函数，以优化量化矩阵乘法性能。该文件是 ggml-sycl 的量化矩阵乘法实现
  (mmq.cpp)，定义了多种量化类型的多矩阵乘法（mul_mat）内核，包括 load_tiles、vec_dot 和 mul_mat 等模板函数，以及针对不同量化格式的入口函数。这些函数通过
  SYCL 并行计算实现高效的矩阵乘法，支持 q4_0、q4_1、q5_0、q5_1、q8_0、q2_K、q3_K、q4_K、q5_K、q6_K 等量化格式，并根据不同硬件选择不同的块大小和
  warp 数量。该文件实现了 SYCL 后端中多种量化格式（如 Q4_1、Q5_0、Q5_1、Q8_0、Q2_K、Q3_K、Q4_K 等）的矩阵乘法内核调度函数。每个函数根据
  GPU 的计算能力（compute_capability）选择不同的矩阵分块尺寸（mmq_x, mmq_y）和线程束数量（nwarps），然后提交 SYCL 并行内核执行量化矩阵乘法运算，并处理边界检查情况。该文件是
  ggml-sycl 后端的矩阵乘法实现，专门处理量化的矩阵乘法（mul_mat_q）。它提供了多个针对不同量化类型（如 Q4_0, Q4_1, Q5_0, Q5_1,
  Q8_0, Q2_K, Q3_K, Q4_K, Q5_K, Q6_K）的 SYCL 内核触发函数，以及一个统一的调度函数 ggml_sycl_op_mul_mat_q。这些函数根据
  GPU 的 compute capability 选择合适的线程块大小和内核参数，并通过 SYCL 流提交并行计算，实现了高效的量化矩阵乘法运算。
