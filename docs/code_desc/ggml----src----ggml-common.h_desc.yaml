desc: The file ggml-common.h is a header file that defines common data structures
  and lookup tables for the GGML tensor library. It includes platform-specific type
  definitions for half-precision floats and quantization block structures (e.g., q4_0,
  q5_K, iq2_xxs) for various backends (C, C++, Metal, CUDA, HIP, SYCL). It also defines
  static lookup tables (e.g., kmask_iq2xs, iq2xxs_grid) used in dequantization processes.该文件是ggml库中与量化技术相关的通用头文件，定义了多个用于量化/反量化操作的查找表(grid,
  kvalues等)，如iq1s、iq2xxs、iq3xxs、iq3s等网格表，以及i4nl、mxfp4等值表。这些表以GGML_TABLE_BEGIN/END宏管理，用于支持不同量化格式的数据编解码。The
  file `ggml/src/ggml-common.h` contains a massive static constant array of 32-bit
  unsigned integers. Based on the code structure and the hexadecimal patterns, it
  appears to be a precomputed lookup table or a set of constant data used within the
  GGML (Georgi Gerganov Machine Learning) library for tensor operations or low-level
  computations. The file's core functionality is to store this static constant data
  that will be used by other parts of the library.该文件是 ggml 库中用于定义和存储 IQ1S 量化网格查找表的头文件。它根据编译选项（如是否启用
  GPU）选择不同的数据类型（uint64_t 或 uint32_t）来存储网格值，并通过宏 GGML_TABLE_BEGIN 和 GGML_TABLE_END
  定义静态查找表，供量化/反量化操作使用。
