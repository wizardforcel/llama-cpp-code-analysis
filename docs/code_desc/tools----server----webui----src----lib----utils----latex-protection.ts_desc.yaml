desc: 该文件实现了 LaTeX 数学表达式与代码块的预处理和保护功能，主要用于在 Markdown 渲染前安全地处理 LaTeX 数学语法、防止货币金额（如
  $5.99）被误识别为数学公式、以及保护代码块不被数学解析干扰。
