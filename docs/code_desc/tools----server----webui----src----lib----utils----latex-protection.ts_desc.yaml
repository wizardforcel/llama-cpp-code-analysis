- code:
  - 'function escapeBrackets(text: string): string {'
  - "\treturn text.replace("
  - "\t\tLATEX_MATH_AND_CODE_PATTERN,"
  - "\t\t("
  - "\t\t\tmatch: string,"
  - "\t\t\tcodeBlock: string | undefined,"
  - "\t\t\tsquareBracket: string | undefined,"
  - "\t\t\troundBracket: string | undefined"
