- code:
  - 'export function maskInlineLaTeX(content: string, latexExpressions: string[]):
    string {'
  - "\tif (!content.includes('$')) {"
  - "\t\treturn content;"
  - "\t}"
  - "\treturn content"
  - "\t\t.split('\\n')"
  - "\t\t.map((line) => {"
  - "\t\t\tif (line.indexOf('$') == -1) {"
  - "\t\t\t\treturn line;"
  - "\t\t\t}"
  - ''
  - "\t\t\tlet processedLine = '';"
  - "\t\t\tlet currentPosition = 0;"
  - ''
  - "\t\t\twhile (currentPosition < line.length) {"
  - "\t\t\t\tconst openDollarIndex = line.indexOf('$', currentPosition);"
  - ''
  - "\t\t\t\tif (openDollarIndex == -1) {"
  - "\t\t\t\t\tprocessedLine += line.slice(currentPosition);"
  - "\t\t\t\t\tbreak;"
  - "\t\t\t\t}"
  - ''
  - "\t\t\t\t// Is there a next $-sign?"
  - "\t\t\t\tconst closeDollarIndex = line.indexOf('$', openDollarIndex + 1);"
  - ''
  - "\t\t\t\tif (closeDollarIndex == -1) {"
  - "\t\t\t\t\tprocessedLine += line.slice(currentPosition);"
  - "\t\t\t\t\tbreak;"
  - "\t\t\t\t}"
  - ''
  - "\t\t\t\tconst charBeforeOpen = openDollarIndex > 0 ? line[openDollarIndex - 1]\
    \ : '';"
  - "\t\t\t\tconst charAfterOpen = line[openDollarIndex + 1];"
  - "\t\t\t\tconst charBeforeClose ="
  - "\t\t\t\t\topenDollarIndex + 1 < closeDollarIndex ? line[closeDollarIndex - 1]\
    \ : '';"
  - "\t\t\t\tconst charAfterClose = closeDollarIndex + 1 < line.length ? line[closeDollarIndex\
    \ + 1] : '';"
  - ''
  - "\t\t\t\tlet shouldSkipAsNonLatex = false;"
  - ''
  - "\t\t\t\tif (closeDollarIndex == currentPosition + 1) {"
  - "\t\t\t\t\t// No content"
  - "\t\t\t\t\tshouldSkipAsNonLatex = true;"
  - "\t\t\t\t}"
  - ''
  - "\t\t\t\tif (/[A-Za-z0-9_$-]/.test(charBeforeOpen)) {"
  - "\t\t\t\t\t// Character, digit, $, _ or - before first '$', no TeX."
  - "\t\t\t\t\tshouldSkipAsNonLatex = true;"
  - "\t\t\t\t}"
  - ''
  - "\t\t\t\tif ("
  - "\t\t\t\t\t/[0-9]/.test(charAfterOpen) &&"
  - "\t\t\t\t\t(/[A-Za-z0-9_$-]/.test(charAfterClose) || ' ' == charBeforeClose)"
  - "\t\t\t\t) {"
  - "\t\t\t\t\t// First $ seems to belong to an amount."
  - "\t\t\t\t\tshouldSkipAsNonLatex = true;"
  - "\t\t\t\t}"
  - ''
  - "\t\t\t\tif (shouldSkipAsNonLatex) {"
  - "\t\t\t\t\tprocessedLine += line.slice(currentPosition, openDollarIndex + 1);"
  - "\t\t\t\t\tcurrentPosition = openDollarIndex + 1;"
  - ''
  - "\t\t\t\t\tcontinue;"
  - "\t\t\t\t}"
  - ''
  - "\t\t\t\t// Treat as LaTeX"
  - "\t\t\t\tprocessedLine += line.slice(currentPosition, openDollarIndex);"
  - "\t\t\t\tconst latexContent = line.slice(openDollarIndex, closeDollarIndex + 1);"
  - "\t\t\t\tlatexExpressions.push(latexContent);"
  - "\t\t\t\tprocessedLine += `<<LATEX_${latexExpressions.length - 1}>>`;"
  - "\t\t\t\tcurrentPosition = closeDollarIndex + 1;"
  - "\t\t\t}"
  - ''
  - "\t\t\treturn processedLine;"
  - "\t\t})"
  - "\t\t.join('\\n');"
  - '}'
  desc: 将文本中的行内 LaTeX 数学表达式（$...$）替换为占位符（如 <<LATEX_0>>），并通过启发式规则跳过看起来像货币金额或代码标识符的美元符号，避免误识别。
