classes: []
desc: 该文件实现了 ggml OpenVINO 前端中 get_rows 操作的翻译逻辑，将 ggml 的 get_rows 操作映射为 OpenVINO 的
  Gather、Squeeze、Unsqueeze 和 Convert 等算子组合。函数负责处理输入数据的维度规约、索引压缩、批量维度处理以及状态模式下的特化逻辑，确保不同输入形状（2维、3维、4维）都能正确执行行提取操作，并适配
  OpenVINO CPU 插件的已知缺陷。
file: ggml/src/ggml-openvino/openvino/op/get_rows.cpp
funcs:
- code:
  - OutputVector translate_get_rows(const NodeContext & context) {
  - '    num_inputs_check(context, 2, 2);'
  - ''
  - '    int op_case = context.get_op_case();'
  - ''
  - '    Output<Node> res;'
  - '    auto data = context.get_input(0);'
  - '    auto indices = context.get_input(1);'
  - ''
  - '    if (op_case == 2) {'
  - '        // The input comes from a VIEW'
  - '        indices = process_view_input(context, 1);'
  - '    }'
  - ''
  - '    // data[1,b,x,y] ind[1,1,b,x''] test-backend-ops case'
  - '    // data[x,y] ind[1,1,1,x''] normal case'
  - '    indices ='
  - '        std::make_shared<ov::op::v0::Squeeze>(indices, ov::op::v0::Constant::create(ov::element::i64,
    {2}, {0, 1}));'
  - '    if (data.get_partial_shape().rank() == 4) {'
  - '        if (!(data.get_partial_shape()[1].is_dynamic()) && data.get_partial_shape()[1].get_length()
    == 1) {'
  - '            // Work-around for a bug in ov cpu plugin for test-backend-ops'
  - '            data = std::make_shared<ov::op::v0::Squeeze>(data,'
  - '                                                         ov::op::v0::Constant::create(ov::element::i64,
    {2}, {0, 1}));'
  - '            auto axis = ov::op::v0::Constant::create(ov::element::i32, ov::Shape{},
    {0});'
  - '            res = std::make_shared<ov::op::v8::Gather>(data, indices, axis);'
  - '        } else {'
  - '            auto axis = ov::op::v0::Constant::create(ov::element::i32, ov::Shape{},
    {1});'
  - '            data ='
  - '                std::make_shared<ov::op::v0::Squeeze>(data, ov::op::v0::Constant::create(ov::element::i64,
    {1}, {0}));'
  - '            res = std::make_shared<ov::op::v8::Gather>(data, indices, axis, 1);'
  - '        }'
  - '    } else if (context.is_stateful() && data.get_partial_shape().rank() == 3)
    {'
  - '        auto axis = ov::op::v0::Constant::create(ov::element::i32, ov::Shape{},
    {1});'
  - '        res = std::make_shared<ov::op::v8::Gather>(data, indices, axis, 1);'
  - '    } else {'
  - '        auto axis = ov::op::v0::Constant::create(ov::element::i32, ov::Shape{},
    {0});'
  - '        res = std::make_shared<ov::op::v8::Gather>(data, indices, axis);'
  - '    }'
  - ''
  - '    if (res.get_element_type() != context.get_output_type()) {'
  - '        res = std::make_shared<ov::op::v0::Convert>(res, context.get_output_type());'
  - '    }'
  - '    if (!(context.is_stateful())) {'
  - '        res = std::make_shared<ov::op::v0::Unsqueeze>(res, ov::op::v0::Constant::create(ov::element::i64,
    {1}, {0}));'
  - '    }'
  - '    return rename_outputs_with_suffix({res}, context.get_name());'
  - '}'
  desc: 将 ggml 的 get_rows 操作转换为 OpenVINO 的 Gather 算子，并处理输入的维度变换、索引压缩、数据类型转换和输出维度恢复。该函数处理多种特殊情况，包括
    VIEW 输入、四维数据批量维度压缩、有状态模式下的三维数据，以及输出 Unsqueeze 的省略逻辑。
  line: 1-50
  name: translate_get_rows
