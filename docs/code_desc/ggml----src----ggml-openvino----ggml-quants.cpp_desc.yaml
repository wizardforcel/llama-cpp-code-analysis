- code:
  - void unpack_32_4(const uint8_t * data, uint8_t * dst) {
  - '    std::fill_n(dst, 16, 0);'
  - '    for (int j = 0; j < 16; ++j) {'
  - '        uint8_t x = (data[j] & 0x0F);'
  - '        uint8_t y = (data[j] >> 4);'
  - '        if (j % 2 != 0) {'
  - '            x <<= 4;'
  - '            y <<= 4;'
  - '        }'
  - '        dst[j / 2] |= x;'
  - '        dst[8 + j / 2] |= y;  // Last 16 weights are in the higher bits'
  - '    }'
  - '}'
