desc: 该文件实现了 OpenVINO 后端对 GGML 量化张量的处理逻辑，包括从量化的 GGML 张量中提取权重、缩放因子和零点，以及相应的反量化或重量化操作，并构建对应的
  OpenVINO 计算图节点。该文件是 ggml 库中 OpenVINO 后端量化相关的 C++ 实现，包含多个用于将浮点权重矩阵量化为 8-bit 整数表示的辅助函数，采用按块（block）计算缩放因子和零点的方式，支持对称和非对称量化模式，并针对不同量化格式（如
  Q8_0、Q8_1）提供差异化计算逻辑。
