desc: 该文件包含一个名为 normalizeModelName 的函数，用于规范化模型名称，确保其符合特定格式要求，例如 Hugging Face 的 "org/model"
  格式或仅保留文件名。此外，该文件还包含一个名为 isValidModelName 的函数，用于验证模型名称是否有效，即在规范化后是否非空。
file: tools/server/webui/src/lib/utils/model-names.ts
funcs:
- code:
  - 'export function normalizeModelName(modelName: string): string {'
  - '    const trimmed = modelName.trim();'
  - '    if (!trimmed) {'
  - '        return '''';'
  - '    }'
  - '    const segments = trimmed.split(/[\\/]/);'
  - '    if (segments.length === 2) {'
  - '        const [org, model] = segments;'
  - '        const trimmedOrg = org?.trim();'
  - '        const trimmedModel = model?.trim();'
  - '        if (trimmedOrg && trimmedModel) {'
  - '            return `${trimmedOrg}/${trimmedModel}`;'
  - '        }'
  - '    }'
  - '    const candidate = segments.pop();'
  - '    const normalized = candidate?.trim();'
  - '    return normalized && normalized.length > 0 ? normalized : trimmed;'
  - '}'
  desc: 规范化模型名称，根据名称中包含的路径分隔符，提取文件名或保留 Hugging Face 仓库格式。
  line: 14-45
  name: normalizeModelName
- code:
  - 'export function isValidModelName(modelName: string): boolean {'
  - '    return normalizeModelName(modelName).length > 0;'
  - '}'
  desc: 验证模型名称是否有效，即规范化后非空。
  line: 47-50
  name: isValidModelName
