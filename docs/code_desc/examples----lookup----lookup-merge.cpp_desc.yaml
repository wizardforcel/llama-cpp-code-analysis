classes: []
desc: 该文件是一个查找缓存合并工具，用于从命令行读取多个 lookup n-gram 缓存文件，将它们依次合并到第一个缓存中，并将合并结果保存到最后指定的输出文件；同时支持通过
  -h 或 --help 查看使用说明。
file: examples/lookup/lookup-merge.cpp
funcs:
- code:
  - static void print_usage(char* argv0) {
  - '    fprintf(stderr, "Merges multiple lookup cache files into a single one.\n");'
  - '    fprintf(stderr, "Usage: %s [--help] lookup_part_1.bin lookup_part_2.bin ...
    lookup_merged.bin\n", argv0);'
  - '}'
  desc: 输出 lookup 缓存合并工具的使用说明和命令行参数格式。
  line: 15-18
  name: print_usage
- code:
  - int main(int argc, char ** argv){
  - '    std::setlocale(LC_NUMERIC, "C");'
  - ''
  - '    if (argc < 3) {'
  - '        print_usage(argv[0]);'
  - '        exit(1);'
  - '    }'
  - ''
  - '    std::vector<std::string> args;'
  - '    args.resize(argc-1);'
  - '    for (int i = 0; i < argc-1; ++i) {'
  - '        args[i] = argv[i+1];'
  - '        if (args[i] == "-h" || args[i] == "--help") {'
  - '            print_usage(argv[0]);'
  - '            exit(0);'
  - '        }'
  - '    }'
  - ''
  - '    fprintf(stderr, "lookup-merge: loading file %s\n", args[0].c_str());'
  - '    common_ngram_cache ngram_cache_merged = common_ngram_cache_load(args[0]);'
  - ''
  - '    for (size_t i = 1; i < args.size()-1; ++i) {'
  - '        fprintf(stderr, "lookup-merge: loading file %s\n", args[i].c_str());'
  - '        common_ngram_cache ngram_cache = common_ngram_cache_load(args[i]);'
  - ''
  - '        common_ngram_cache_merge(ngram_cache_merged, ngram_cache);'
  - '    }'
  - ''
  - '    fprintf(stderr, "lookup-merge: saving file %s\n", args.back().c_str());'
  - '    common_ngram_cache_save(ngram_cache_merged, args.back());'
  - '}'
  desc: 解析命令行参数，加载多个 n-gram 查找缓存，将其合并后保存到指定输出文件。
