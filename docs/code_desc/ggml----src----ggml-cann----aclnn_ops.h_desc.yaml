desc: 该头文件为 ggml 的 CANN 后端定义了所有 aclnn 操作的 C++ 函数声明。这些函数将 ggml 张量运算（例如 Repeat、LeakyReLU、Concat、Arange、Clamp、Scale、ArgSort、Norm、L2Norm、CrossEntropyLoss、GroupNorm、Acc、SumRows、Sum、Upsample、Pad、Pool2d、Dup、RmsNorm、DiagMask、Im2col、TimestepEmbedding、Cpy、Softmax、GetRows、SetRows、MulMat、Rope、Argmax、Add、Sub、Mul、Div、Cos、Sin、ConvTranspose1d、Elu、Mean、PadReflect1d
  和 CountEqual）封装到 CANN 的 aclnn API 中。这些核心运算被实现为以 ggml_backend_cann_context 和 ggml_tensor
  为参数的全局函数，以便在华为 Ascend NPU 上执行。此外，还包括一个辅助函数 bcast_shape，用于为逐元素运算准备支持广播的张量。该文件最初包含
  MIT 许可证，并包含了实现描述、参数和运算公式的文档注释。This header file defines the CANN (Ascend Computing
  Language) backend operator implementations for the GGML tensor library. It provides
  declarations for various neural network operations including attention mechanisms,
  gated linear attention, matrix multiplication, normalization, and utility macros
  for calling Ascend CL operator functions. The file serves as an interface layer
  between GGML's tensor operations and Huawei's Ascend NPU hardware acceleration libraries.
