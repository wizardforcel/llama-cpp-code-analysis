desc: 该文件是 ggml 的 CANN 后端核心实现之一，负责管理昇腾 CANN 设备、初始化设备信息、切换当前设备、解析环境变量、实现多种设备内存池、维护张量写入跟踪状态、管理
  CANN 后端缓冲区，并提供量化张量数据在 GGML 格式与 CANN 计算格式之间的转换功能。当前代码片段在 Q8.0 转换函数定义处被截断。该文件是 GGML
  框架中 CANN (华为 Ascend NPU) 后端的核心实现文件，主要负责 CANN 后端的内存缓冲区管理、张量数据转换、以及各种计算操作的调度与执行。该文件实现了缓冲区接口，包括内存分配/释放、张量数据的设置/获取/复制、量化格式转换（Q4.0/Q8.0）、权重矩阵
  NZ 格式转换等功能，并通过统一的计算调度接口调用 CANN 底层 API 执行各种神经网络算子操作。该文件实现了基于华为昇腾CANN (Ascend CANN)
  的ggml后端，负责将ggml计算图中的各类运算映射到昇腾AI处理器的ACL运行时接口上。核心功能包括：通过ggml_backend_cann_context管理设备上下文和流；支持矩阵乘法、注意力、归一化、卷积等30余种神经网络算子；提供gemm运算加速和算符融合优化（如ADD+RMS_NORM）；并实现了异步算子调度、统一的CANN后端设备接口，以及可选的基于aclmdlRI的图执行模式（由USE_ACL_GRAPH宏控制），其中矩阵乘法部分使用了ACL的矩阵计算单元进行加速。该代码实现了
  ggml 的 CANN 后端设备与后端注册机制，负责管理昇腾 CANN 设备、创建和销毁后端实例、判断缓冲区类型与算子是否支持卸载、维护设备事件同步，并提供设备数量、描述信息和显存查询等公共接口。
