    - '        || proj_type == PROJECTOR_TYPE_MUSIC_FLAMINGO;'
    - '}'
    desc: 检查模型的投影类型是否为QWEN2A、VOXTRAL或MUSIC_FLAMINGO，以决定是否应用平均池化。
