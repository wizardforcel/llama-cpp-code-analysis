- desc: 该结构体定义了用于Gemma3n视觉编码器的扩展MobileNetV5网络块。它包含边缘残差、通用倒残差模块（深度可分离卷积、扩展投影）以及多查询注意力（MQA）组件的权重张量，以支持混合卷积和注意力结构。
