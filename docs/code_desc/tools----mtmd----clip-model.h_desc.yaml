desc: 该文件是核心头文件，定义了用于构建多模态（视觉、音频）模型编码器所需的多种数据类型和结构体。它涵盖了从通用视觉Transformer（如CLIP、Qwen3VL）到专门设计（如SAM、MobileNetV5、MobileVLM）的模型配置和权重存储结构。文件通过一系列枚举定义激活函数、归一化方式、图像缩放算法等，并通过多个结构体（如clip_hparams、clip_layer、mobilenetv5_block、clip_model）来实现对各类模型超参数、网络层权重以及复杂投影头的统一管理。
