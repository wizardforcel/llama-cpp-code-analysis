- desc: 该结构体是整个视觉（或音频）编码器模型的核心容器，保存了所有顶层参数（如类嵌入、位置嵌入、卷积权重）、层列表、各种投影头（如LLaVA、Yi、MobileVLM、MiniCPMV、Gemma3等）的权重，以及SAM、LFM2、MSFA等专用模块的权重成员。它还提供了一系列辅助方法来判断音频投影的类型。
