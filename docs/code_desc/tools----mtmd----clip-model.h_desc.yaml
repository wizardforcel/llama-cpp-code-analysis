- desc: 该结构体定义了一个视觉编码器中的单个Transformer层，包含查询、键、值、输出权重、前馈网络（上/下/门控）权重，以及各归一化层的权重和偏置。此外，它还支持多种变体，如层缩放、深度堆叠合并器（Qwen3VL）、SAM的相对位置偏差和LFM2模块。
