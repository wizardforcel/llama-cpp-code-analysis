desc: This file defines a utility function for the web UI that moves a given HTMLElement
  to the end of the document body (a 'portal' pattern). It safely handles cases where
  the DOM is unavailable and returns an object with a destroy() method to remove the
  node from the body, enabling cleanup when the component is unmounted.
file: tools/server/webui/src/lib/utils/portal-to-body.ts
funcs:
- code:
  - 'export function portalToBody(node: HTMLElement) {'
  - '  if (typeof document === ''undefined'') {'
  - '    return;'
  - '  }'
  - ''
  - '  const target = document.body;'
  - '  if (!target) {'
  - '    return;'
  - '  }'
  - ''
  - '  target.appendChild(node);'
  - ''
  - '  return {'
  - '    destroy() {'
  - '      if (node.parentNode === target) {'
  - '        target.removeChild(node);'
  - '      }'
  - '    }'
  - '  };'
  - '}'
  desc: Appends the given HTMLElement to the document body and provides a destroy
    method to remove it, facilitating portal-like behavior for overlay or modal components.
