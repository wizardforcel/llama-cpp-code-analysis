  - '    num_channels = 1'
  - '    bits_per_sample = 16'
  - '    bytes_per_sample = bits_per_sample // 8'
  - '    data_size = len(audio_data) * bytes_per_sample'
  - '    byte_rate = sample_rate * num_channels * bytes_per_sample'
  - '    block_align = num_channels * bytes_per_sample'
  - '    chunk_size = 36 + data_size  # 36 = size of header minus first 8 bytes'
  - ''
  - '    header = struct.pack('
  - '        ''<4sI4s4sIHHIIHH4sI'','
  - '        b''RIFF'','
  - '        chunk_size,'
  - '        b''WAVE'','
  - '        b''fmt '','
  - '        16,                # fmt chunk size'
  - '        1,                 # audio format (PCM)'
  - '        num_channels,'
  - '        sample_rate,'
  - '        byte_rate,'
  - '        block_align,'
  - '        bits_per_sample,'
  - '        b''data'','
  - '        data_size'
  - '    )'
  - ''
  - '    audio_data = np.clip(audio_data * 32767, -32768, 32767)'
  - '    pcm_data = audio_data.astype(np.int16)'
  - ''
  - '    with open(filename, ''wb'') as f:'
  - '        f.write(header)'
  - '        f.write(pcm_data.tobytes())'
