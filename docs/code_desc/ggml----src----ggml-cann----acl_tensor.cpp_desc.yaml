- code:
  - bool ggml_cann_need_bcast(const ggml_tensor * t0, const ggml_tensor * t1) {
  - '    for (int i = 0; i < GGML_MAX_DIMS; i++) {'
  - '        if (t1->ne[i] != t0->ne[i] && t1->ne[i] != 1) {'
  - '            return true;'
  - '        }'
  - '    }'
  - '    return false;'
  - '}'
