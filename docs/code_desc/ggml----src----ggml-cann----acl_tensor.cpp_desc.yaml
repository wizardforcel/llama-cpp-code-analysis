desc: 该文件是ggml中针对华为昇腾（Ascend）AI处理器的tensor（张量）操作实现，主要提供类型映射、tensor创建、int数组创建、scalar创建以及广播（bcast）形状计算等基础功能，为在昇腾设备上进行张量运算做准备。
file: ggml/src/ggml-cann/acl_tensor.cpp
funcs:
- code:
  - aclDataType ggml_cann_type_mapping(ggml_type type) {
  - '    switch (type) {'
  - '        case GGML_TYPE_F32:'
  - '            return ACL_FLOAT;'
  - '        case GGML_TYPE_F16:'
  - '            return ACL_FLOAT16;'
  - '        case GGML_TYPE_BF16:'
  - '            return ACL_BF16;'
  - '        case GGML_TYPE_I8:'
  - '            return ACL_INT8;'
  - '        case GGML_TYPE_I16:'
  - '            return ACL_INT16;'
  - '        case GGML_TYPE_I32:'
  - '            return ACL_INT32;'
  - '        case GGML_TYPE_Q4_0:'
  - '            return ACL_INT4;'
  - '        case GGML_TYPE_Q8_0:'
  - '            return ACL_INT8;'
  - '        case GGML_TYPE_I64:'
  - '            return ACL_INT64;'
  - '        default:'
  - '            return ACL_DT_UNDEFINED;'
  - '    }'
  - '}'
  desc: 将ggml的数据类型映射为昇腾计算语言（ACL）对应的数据类型
  line: 20-39
  name: ggml_cann_type_mapping
- code:
  - acl_tensor_ptr ggml_cann_create_tensor(const ggml_tensor * tensor,
  - '                                       int64_t *           ne,'
  - '                                       size_t *            nb,'
  - '                                       int64_t             dims,'
  - '                                       aclFormat           format,'
  - '                                       size_t              offset) {'
  - '    // If tensor is bcasted, Up to GGML_MAX_DIMS additional dimensions will be
    added.'
  - '    int64_t acl_ne[GGML_MAX_DIMS * 2], acl_stride[GGML_MAX_DIMS * 2];'
  - ''
  - '    if (ne == nullptr) {'
  - '        for (int i = 0; i < GGML_MAX_DIMS; i++) {'
  - '            acl_ne[i]     = tensor->ne[i];'
  - '            // The step size of acl is in elements.'
  - '            acl_stride[i] = tensor->nb[i] / ggml_element_size(tensor);'
  - '        }'
  - '    } else {'
  - '        // With bcast'
  - '        for (int i = 0; i < dims; i++) {'
  - '            acl_ne[i]     = ne[i];'
  - '            acl_stride[i] = nb[i] / ggml_element_size(tensor);'
  - '        }'
  - '    }'
  - ''
  - '    int64_t final_dims      = (dims == 0 ? GGML_MAX_DIMS : dims);'
  - '    int64_t acl_storage_len = 1;'
  - '    for (int i = 0; i < final_dims; i++) {'
  - '        acl_storage_len += (acl_ne[i] - 1) * acl_stride[i];'
  - '    }'
  - '    size_t elem_offset = offset / ggml_element_size(tensor);'
  - '    acl_storage_len += elem_offset;'
  - ''
  - '    // Reverse ne and stride.'
  - '    std::reverse(acl_ne, acl_ne + final_dims);'
  - '    std::reverse(acl_stride, acl_stride + final_dims);'
  - ''
  - '    aclTensor * raw = aclCreateTensor(acl_ne, final_dims, ggml_cann_type_mapping(tensor->type),
    acl_stride, elem_offset,'
  - '                                      format, &acl_storage_len, 1, tensor->data);'
  - ''
  - '    return acl_tensor_ptr(raw);'
  - '}'
