  name: llama_context
desc: This file defines the llama_context class, which serves as the central runtime
  state and execution engine in the llama.cpp library. It manages the model, context
  parameters, memory buffers, computation graphs, backends, and thread pools needed
  for text generation and embedding tasks. The class handles encode/decode operations,
  sampling, state saving/loading, performance metrics, and training loops, providing
  a comprehensive API for interacting with the underlying neural network inference
  engine.
