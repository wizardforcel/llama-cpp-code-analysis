classes: []
desc: 该文件定义了一个名为 useProcessingState 的 Svelte 组合式函数（hook），用于响应式地管理服务器的处理状态。它从 chatStore
  中直接读取响应式状态，提供格式化的处理详情用于 UI 显示，包括实时处理状态绑定、上下文和输出令牌跟踪、每秒令牌数计算、流式数据到达时自动更新等功能，并支持多个并发会话。
file: tools/server/webui/src/lib/hooks/use-processing-state.svelte.ts
