  - "\t\t\t\t\tdetails.push(`Processing ${percent}% (ETA: ${etaSecs}s)`);"
  - "\t\t\t\t} else {"
  - "\t\t\t\t\tdetails.push(`Processing ${percent}%`);"
  - "\t\t\t\t}"
  - "\t\t\t}"
  - "\t\t}"
  - ''
  - "\t\t// Always show context info when we have valid data"
