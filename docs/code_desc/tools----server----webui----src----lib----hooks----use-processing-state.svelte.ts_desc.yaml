  - "\t\t\tcase 'preparing':"
  - "\t\t\t\tif (processingState.progressPercent !== undefined) {"
  - "\t\t\t\t\treturn `Processing (${processingState.progressPercent}%)`;"
  - "\t\t\t\t}"
  - "\t\t\t\treturn 'Preparing response...';"
  - "\t\t\tcase 'generating':"
  - "\t\t\t\treturn '';"
  - "\t\t\tdefault:"
  - "\t\t\t\treturn 'Processing...';"
  - "\t\t}"
  - "\t}"
  - ''
