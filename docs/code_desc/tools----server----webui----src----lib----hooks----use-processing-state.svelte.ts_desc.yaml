  - "\t\t\t\tconst tokensPerSecond = actualProcessed / (time_ms / 1000);"
  - "\t\t\t\tlastKnownProcessingStats = {"
  - "\t\t\t\t\ttokensProcessed: actualProcessed,"
  - "\t\t\t\t\ttotalTokens: actualTotal,"
  - "\t\t\t\t\ttimeMs: time_ms,"
  - "\t\t\t\t\ttokensPerSecond"
