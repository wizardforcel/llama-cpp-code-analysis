  - ''
  - "\t// Derive processing state reactively from chatStore's direct state"
  - "\tconst processingState = $derived.by(() => {"
  - "\t\tif (!isMonitoring) {"
  - "\t\t\treturn lastKnownState;"
  - "\t\t}"
