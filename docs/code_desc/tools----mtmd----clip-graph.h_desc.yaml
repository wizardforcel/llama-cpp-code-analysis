  name: clip_graph
desc: 该文件定义了clip_graph结构体，这是CLIP（Contrastive Language-Image Pre-training）视觉模型在推理图中的核心构建器。它封装了创建视觉Transformer（ViT）计算图所需的所有状态和辅助方法，包括处理图像输入、构建卷积层、位置嵌入、注意力层、前馈网络以及2D旋转位置编码（RoPE）等。该结构体通过多态设计支持不同模型变体的定制化构建过程。
