- code:
  - static void batch_decode(llama_context * ctx, llama_batch & batch, float * output,
    int n_seq, int n_embd_out, int embd_norm) {
  - '    const enum llama_pooling_type pooling_type = llama_pooling_type(ctx);'
  - ''
  - '    // clear previous kv_cache values (irrelevant for embeddings)'
  - '    llama_memory_clear(llama_get_memory(ctx), true);'
  - ''
  - '    // run model'
  - '    LOG_INF("%s: n_tokens = %d, n_seq = %d\n", __func__, batch.n_tokens, n_seq);'
  - '    if (llama_decode(ctx, batch) < 0) {'
  - '        LOG_ERR("%s : failed to process\n", __func__);'
  - '    }'
  - ''
  - '    for (int i = 0; i < batch.n_tokens; i++) {'
  - '        if (!batch.logits[i]) {'
  - '            continue;'
  - '        }'
  - ''
  - '        const float * embd = nullptr;'
  - '        int embd_pos = 0;'
  - ''
  - '        if (pooling_type == LLAMA_POOLING_TYPE_NONE) {'
  - '            // try to get token embeddings'
  - '            embd = llama_get_embeddings_ith(ctx, i);'
  - '            embd_pos = i;'
  - '            GGML_ASSERT(embd != NULL && "failed to get token embeddings");'
  - '        } else {'
  - '            // try to get sequence embeddings - supported only when pooling_type
    is not NONE'
  - '            embd = llama_get_embeddings_seq(ctx, batch.seq_id[i][0]);'
  - '            embd_pos = batch.seq_id[i][0];'
  - '            GGML_ASSERT(embd != NULL && "failed to get sequence embeddings");'
  - '        }'
  - ''
  - '        float * out = output + embd_pos * n_embd_out;'
  - '        common_embd_normalize(embd, out, n_embd_out, embd_norm);'
  - '    }'
  - '}'
  desc: 执行模型推理，获取批次中所有序列的嵌入向量，并根据池化类型进行归一化后写入输出缓冲。
