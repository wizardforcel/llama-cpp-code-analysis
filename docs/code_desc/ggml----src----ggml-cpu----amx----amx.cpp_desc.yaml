    - '        case GGML_TYPE_Q4_0:'
    - '        case GGML_TYPE_Q4_1:'
    - '        case GGML_TYPE_Q8_0:'
    - '            alignment = TILE_K;'
    - '            break;'
    - '        case GGML_TYPE_Q4_K:'
    - '        case GGML_TYPE_Q5_K:'
    - '        case GGML_TYPE_Q6_K:'
    - '        case GGML_TYPE_IQ4_XS:'
    - '            alignment = 256; // QK_K'
    - '            break;'
    - '        case GGML_TYPE_F16:'
    - '            alignment = 16;'
    - '            break;'
    - '        default:'
    - '            return false;'
    - '    }'
    - '    if (src0->ne[0] % alignment) {'
    - '        return false;'
    - '    }'
    - '    if (src1->type != GGML_TYPE_F32) {'
    - '        return false;'
    - '    }'
    - '    return true;'
    - '}'
