- code:
  - 'def parallel_function_calls(function_list: List[Tuple[Callable[..., Any], Tuple[Any,
    ...]]]) -> List[Any]:'
  - '    """'
  - '    Run multiple functions in parallel and return results in the same order as
    calls. Equivalent to Promise.all in JS.'
  - ''
  - '    Example usage:'
  - ''
  - '    results = parallel_function_calls(['
  - '        (func1, (arg1, arg2)),'
  - '        (func2, (arg3, arg4)),'
  - '    ])'
  - '    """'
  - '    results = [None] * len(function_list)'
  - '    exceptions = []'
  - ''
  - '    def worker(index, func, args):'
  - '        try:'
  - '            result = func(*args)'
  - '            results[index] = result'
  - '        except Exception as e:'
  - '            exceptions.append((index, str(e)))'
  - ''
  - '    with ThreadPoolExecutor() as executor:'
  - '        futures = []'
  - '        for i, (func, args) in enumerate(function_list):'
  - '            future = executor.submit(worker, i, func, args)'
  - '            futures.append(future)'
  - ''
  - '        # Wait for all futures to complete'
  - '        for future in as_completed(futures):'
  - '            pass'
  - ''
  - '    # Check if there were any exceptions'
  - '    if exceptions:'
  - '        print("Exceptions occurred:")'
  - '        for index, error in exceptions:'
  - '            print(f"Function at index {index}: {error}")'
  - ''
  - '    return results'
  desc: 并行执行多个函数调用，返回结果列表，结果顺序与输入顺序一致。
