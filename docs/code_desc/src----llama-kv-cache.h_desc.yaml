desc: 该文件定义了llama_kv_cache和llama_kv_cache_context两个核心类，用于管理LLM推理过程中的KV缓存。llama_kv_cache类负责KV数据存储、序列管理（seq_rm/seq_cp等）、状态读写、内存管理（继承llama_memory_i），提供批次插入（prepare/find_slot/apply_ubatch）、图形构建（get_k/cpy_k等）和输入准备API；llama_kv_cache_context类实现llama_memory_context_i接口，为批次/更新/完整状态提供迭代处理上下文，封装对llama_kv_cache的操作并跟踪处理进度。
