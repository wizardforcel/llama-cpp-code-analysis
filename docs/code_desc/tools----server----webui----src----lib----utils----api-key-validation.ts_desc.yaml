classes: []
desc: 该文件提供了一个在当前SvelteKit项目中用于验证API密钥的核心工具函数。它通过向后端'/props'端点发送请求来检查API密钥的有效性。如果服务器返回401或403状态码，函数会抛出一个SvelteKit的401错误；对于其他网络错误或服务器问题，它会记录警告但不会中断执行。
file: tools/server/webui/src/lib/utils/api-key-validation.ts
funcs:
- code:
  - 'export async function validateApiKey(fetch: typeof globalThis.fetch): Promise<void>
    {'
  - "\tif (!browser) {"
  - "\t\treturn;"
  - "\t}"
  - ''
  - "\ttry {"
  - "\t\tconst apiKey = config().apiKey;"
  - ''
  - "\t\tconst headers: Record<string, string> = {"
  - "\t\t\t'Content-Type': 'application/json'"
  - "\t\t};"
  - ''
  - "\t\tif (apiKey) {"
  - "\t\t\theaders.Authorization = `Bearer ${apiKey}`;"
  - "\t\t}"
  - ''
  - "\t\tconst response = await fetch(`${base}/props`, { headers });"
  - ''
  - "\t\tif (!response.ok) {"
  - "\t\t\tif (response.status === 401 || response.status === 403) {"
  - "\t\t\t\tthrow error(401, 'Access denied');"
  - "\t\t\t}"
  - ''
  - "\t\t\tconsole.warn(`Server responded with status ${response.status} during API\
    \ key validation`);"
  - "\t\t\treturn;"
  - "\t\t}"
  - "\t} catch (err) {"
  - "\t\t// If it's already a SvelteKit error, re-throw it"
  - "\t\tif (err && typeof err === 'object' && 'status' in err) {"
  - "\t\t\tthrow err;"
  - "\t\t}"
  - ''
  - "\t\t// Network or other errors"
  - "\t\tconsole.warn('Cannot connect to server for API key validation:', err);"
  - "\t}"
  - '}'
  desc: 通过向服务器的'/props'端点发送请求来异步验证API密钥。它在浏览器环境中执行，并根据服务器响应处理身份验证失败或服务异常。
  line: 10-44
  name: validateApiKey
