classes:
- desc: NEO-BERT 模型的图构建类，继承自 llm_graph_context，负责构建整个模型的计算图，从输入嵌入到最终输出嵌入，包含注意力层和 FFN
    层的组装。
  methods:
  - code:
    - 'llm_build_neo_bert::llm_build_neo_bert(const llama_model & model, const llm_graph_params
      & params) : llm_graph_context(params) {'
    - '    const int64_t n_embd_head = hparams.n_embd_head_v();'
    - '    const int64_t n_embd_gqa  = hparams.n_embd_v_gqa();'
    - '    GGML_ASSERT(n_embd_head == hparams.n_embd_head_k());'
    - '    ggml_tensor * cur;'
    - '    ggml_tensor * inpL;'
    - '    ggml_tensor * inp_pos = build_inp_pos();'
    - '    inpL = build_inp_embd(model.tok_embd);'
    - '    cb(inpL, "inp_embd", -1);'
    - '    auto * inp_attn = build_attn_inp_no_cache();'
    - '    ggml_tensor * inp_out_ids = build_inp_out_ids();'
    - '    for (int il = 0; il < n_layer; ++il) {'
    - '        ggml_tensor * cur = inpL;'
    - '        cur = build_norm(inpL, model.layers[il].attn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        {'
    - '            ggml_tensor * Qcur;'
    - '            ggml_tensor * Kcur;'
    - '            ggml_tensor * Vcur;'
    - '            cur = build_lora_mm(model.layers[il].wqkv, cur);'
    - '            cb(cur, "wqkv", il);'
    - '            Qcur = ggml_view_3d(ctx0, cur, n_embd_head, n_head,    n_tokens,
      n_embd_head*sizeof(float), cur->nb[1], 0*sizeof(float)*(n_embd));'
    - '            Kcur = ggml_view_3d(ctx0, cur, n_embd_head, n_head_kv, n_tokens,
      n_embd_head*sizeof(float), cur->nb[1], 1*sizeof(float)*(n_embd));'
    - '            Vcur = ggml_view_3d(ctx0, cur, n_embd_head, n_head_kv, n_tokens,
      n_embd_head*sizeof(float), cur->nb[1], 1*sizeof(float)*(n_embd + n_embd_gqa));'
    - '            Qcur = ggml_rope_ext(ctx0, Qcur, inp_pos, nullptr, n_rot, rope_type,
      n_ctx_orig, freq_base, freq_scale, ext_factor, attn_factor, beta_fast, beta_slow);'
    - '            Kcur = ggml_rope_ext(ctx0, Kcur, inp_pos, nullptr, n_rot, rope_type,
      n_ctx_orig, freq_base, freq_scale, ext_factor, attn_factor, beta_fast, beta_slow);'
    - '            cb(Qcur, "Qcur", il);'
    - '            cb(Kcur, "Kcur", il);'
    - '            cb(Vcur, "Vcur", il);'
    - '            cur = build_attn(inp_attn, model.layers[il].wo, nullptr, Qcur,
      Kcur, Vcur, nullptr, nullptr, nullptr, 1.0f/sqrtf(float(n_embd_head)), il);'
    - '            cb(cur, "kqv_out", il);'
    - '        }'
    - '        if (il == n_layer - 1 && inp_out_ids) {'
    - '            cur  = ggml_get_rows(ctx0,  cur, inp_out_ids);'
    - '            inpL = ggml_get_rows(ctx0, inpL, inp_out_ids);'
    - '        }'
    - '        cur = ggml_add(ctx0, cur, inpL);'
    - '        ggml_tensor * ffn_inp = cur;'
    - '        cb(ffn_inp, "ffn_inp", il);'
    - '        cur = build_norm(ffn_inp, model.layers[il].ffn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        cb(cur, "ffn_norm", il);'
    - '        cur = build_ffn(cur, model.layers[il].ffn_up, NULL, NULL, NULL, NULL,
      NULL, model.layers[il].ffn_down, NULL, NULL, NULL, LLM_FFN_SWIGLU, LLM_FFN_SEQ,
      il);'
    - '        cur = ggml_add(ctx0, cur, ffn_inp);'
    - '        inpL = cur;'
    - '    }'
    - '    cur = inpL;'
    - '    cur = build_norm(cur, model.output_norm_enc, NULL, LLM_NORM_RMS, -1);'
    - '    cb(cur, "result_embd", -1);'
    - '    res->t_embd = cur;'
    - '    ggml_build_forward_expand(gf, cur);'
    - '}'
    desc: 构造函数，执行模型图构建的主逻辑：初始化输入位置、构建输入嵌入、创建注意力输入，并逐层执行归一化、自注意力、残差连接和 FFN 操作，最后构建输出归一化并生成结果嵌入。
    line: 1-75
    name: llm_build_neo_bert
  name: llm_build_neo_bert
desc: 该文件实现了 NEO-BERT 模型的图构建逻辑，定义了 llm_build_neo_bert 类，负责将模型的权重参数转换为 GGML 计算图，包括输入嵌入、多头自注意力（带
  RoPE 旋转位置编码）、残差连接、层归一化和前馈网络（FFN）等计算流程，最终输出嵌入向量作为模型结果。
