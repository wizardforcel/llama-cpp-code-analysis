  name: getConfigValue
- code:
  - export function configToParameterRecord<T extends SettingsConfigType>(
  - "\tconfig: T,"
  - "\tkeys: string[]"
  - '): Record<string, string | number | boolean> {'
  - "\tconst record: Record<string, string | number | boolean> = {};"
  - ''
  - "\tfor (const key of keys) {"
  - "\t\tconst value = getConfigValue(config, key);"
  - "\t\tif (value !== undefined) {"
  - "\t\t\trecord[key] = value;"
  - "\t\t}"
  - "\t}"
  - ''
  - "\treturn record;"
  - '}'
  desc: 将配置对象中指定的键提取并转换为参数记录对象，常用于参数同步操作，会跳过值为 undefined 的键。
