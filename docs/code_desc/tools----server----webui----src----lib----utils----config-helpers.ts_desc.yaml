desc: 该文件提供了一组类型安全的配置辅助工具函数，用于在 TypeScript 环境中安全地访问和修改具有动态键的配置对象。代码通过泛型约束和类型断言，在保持类型安全的同时支持灵活的键值操作。
file: tools/server/webui/src/lib/utils/config-helpers.ts
funcs:
- code:
  - export function setConfigValue<T extends SettingsConfigType>(
  - "\tconfig: T,"
  - "\tkey: string,"
  - "\tvalue: unknown"
  - '): void {'
  - "\tif (key in config) {"
  - "\t\t(config as Record<string, unknown>)[key] = value;"
  - "\t}"
  - '}'
  desc: 类型安全地设置配置对象中指定键的值，仅当键存在于配置中时才会执行赋值操作。
