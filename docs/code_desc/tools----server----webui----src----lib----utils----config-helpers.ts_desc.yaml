  name: setConfigValue
- code:
  - export function getConfigValue<T extends SettingsConfigType>(
  - "\tconfig: T,"
  - "\tkey: string"
  - '): string | number | boolean | undefined {'
  - "\tconst value = (config as Record<string, unknown>)[key];"
  - "\treturn value as string | number | boolean | undefined;"
  - '}'
  desc: 类型安全地从配置对象中获取指定键的值，返回值会被断言为 string、number、boolean 或 undefined 类型。
