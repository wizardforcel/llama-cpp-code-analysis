desc: 该文件实现了一个持久化状态存储工厂函数 persisted，用于在浏览器环境中将响应式状态同步到 localStorage。它返回一个包含 value
  getter/setter 的对象，在读取时自动从 localStorage 恢复数据，在写入时自动序列化并保存，同时处理了 SSR 环境兼容性和异常容错。
file: tools/server/webui/src/lib/stores/persisted.svelte.ts
funcs:
- code:
  - 'export function persisted<T>(key: string, initialValue: T): PersistedValue<T>
    {'
  - "\tlet value = initialValue;"
  - ''
  - "\tif (browser) {"
  - "\t\ttry {"
  - "\t\t\tconst stored = localStorage.getItem(key);"
  - ''
  - "\t\t\tif (stored !== null) {"
  - "\t\t\t\tvalue = JSON.parse(stored) as T;"
  - "\t\t\t}"
  - "\t\t} catch (error) {"
  - "\t\t\tconsole.warn(`Failed to load ${key}:`, error);"
  - "\t\t}"
  - "\t}"
  - ''
  - "\tconst persist = (next: T) => {"
  - "\t\tif (!browser) {"
  - "\t\t\treturn;"
  - "\t\t}"
  - ''
  - "\t\ttry {"
  - "\t\t\tif (next === null || next === undefined) {"
  - "\t\t\t\tlocalStorage.removeItem(key);"
  - "\t\t\t\treturn;"
  - "\t\t\t}"
  - ''
  - "\t\t\tlocalStorage.setItem(key, JSON.stringify(next));"
  - "\t\t} catch (error) {"
  - "\t\t\tconsole.warn(`Failed to persist ${key}:`, error);"
  - "\t\t}"
  - "\t};"
  - ''
  - "\treturn {"
  - "\t\tget value() {"
  - "\t\t\treturn value;"
  - "\t\t},"
  - ''
  - "\t\tset value(newValue: T) {"
  - "\t\t\tvalue = newValue;"
  - "\t\t\tpersist(newValue);"
  - "\t\t}"
  - "\t};"
  - '}'
  desc: 创建一个持久化存储对象，将泛型状态同步到 localStorage，支持浏览器环境检测、数据恢复、自动保存以及 null/undefined 时的键值移除
