desc: 该文件实现了llama.cpp中文件读写、内存映射和内存锁定相关的基础设施。它定义了llama_file（文件封装）、llama_mmap（内存映射）和llama_mlock（内存锁定）三个核心类，分别用于跨平台的文件操作、大文件的内存映射访问以及模型权重在内存中的锁定，以支持不同平台（Windows、POSIX等）上的模型加载和推理优化。
