desc: 该头文件为 C++ 提供 ggml、gguf、ggml 分配器及后端相关资源的智能指针封装。它定义了多个自定义删除器，在 std::unique_ptr
  释放资源时调用对应的项目 API，从而实现 ggml_context、gguf_context、ggml_gallocr 以及各类后端对象的自动生命周期管理。文件不包含全局函数，仅包含资源删除器结构体及其调用运算符方法。
