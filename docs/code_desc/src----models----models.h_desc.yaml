desc: 该文件为model-specific的图构建器定义了基类和一个庞大的具体实现类族，覆盖了Lambda、RWKV、Mamba、BERT、Qwen等多种主流LLM架构的图构建入口，每个类均以构造函数接收模型与图参数，并包含各自的私有辅助方法（如注意力层、FFN层、归一化等），用于将模型配置转换为GGML计算图。
