- code:
  - int op_ssm_conv_f32(struct htp_ops_context * octx) {
  - '    htp_ssm_conv_tensors_preamble;'
  - ''
  - '    if (src0->type != HTP_TYPE_F32 || src1->type != HTP_TYPE_F32 || dst->type
    != HTP_TYPE_F32) {'
  - '        FARF(ERROR, "ssm_conv: only (F32 x F32 -> F32) OPs supported");'
  - '        return HTP_STATUS_NO_SUPPORT;'
  - '    }'
  - ''
  - '    struct htp_ssm_conv_context scctx = { 0 };'
  - '    scctx.octx = octx;'
  - ''
  - '    const uint32_t d_conv  = src1->ne[0];'
  - '    const uint32_t d_inner = src0->ne[1];'
  - '    const uint32_t n_t     = dst->ne[1];'
  - '    const uint32_t n_s     = dst->ne[2];'
  - ''
  - '    const uint32_t n_threads = MIN(octx->n_threads, d_inner);'
  - ''
  - '    if (!(octx->flags & HTP_OPFLAGS_SKIP_COMPUTE)) {'
  - '        uint32_t use_hvx = 0;'
  - '        if (d_inner >= VLEN_FP32 && d_inner % VLEN_FP32 == 0) {'
  - '            int is_aligned = hex_is_aligned((void *) src0->data, VLEN) &&'
  - '                             hex_is_aligned((void *) src1->data, VLEN) &&'
  - '                             hex_is_aligned((void *) dst->data, VLEN);'
  - ''
  - '            if (is_aligned) {'
  - '                use_hvx = 1;'
  - '            }'
  - '        }'
  - ''
  - '        if (use_hvx) {'
  - '            scctx.nrows_per_thread  = (d_inner + n_threads - 1) / n_threads;'
  - '            scctx.nrows_per_thread += (scctx.nrows_per_thread & 1);'
  - ''
  - '            octx->src0_spad.size_per_thread = hex_round_up(scctx.nrows_per_thread
    * nb01, 256);'
  - '            octx->src1_spad.size_per_thread = hex_round_up(scctx.nrows_per_thread
    * nb11, 256);'
  - '            octx->dst_spad.size_per_thread  = hex_round_up(scctx.nrows_per_thread
    * sizeof(float), 256);'
  - ''
  - '            octx->src0_spad.size = octx->src0_spad.size_per_thread * n_threads;'
  - '            octx->src1_spad.size = octx->src1_spad.size_per_thread * n_threads;'
  - '            octx->dst_spad.size  = octx->dst_spad.size_per_thread  * n_threads;'
  - ''
  - '            const size_t gather_spad_size = n_threads * VLEN * 2;'
  - ''
  - '            octx->src0_spad.data = octx->ctx->vtcm_base + gather_spad_size;'
  - '            octx->src1_spad.data = octx->src0_spad.data + octx->src0_spad.size;'
  - '            octx->dst_spad.data  = octx->src1_spad.data + octx->src1_spad.size;'
  - ''
  - '            FARF(HIGH, "ssm_conv-f32: gather-spad:%zu spad-per-thread:(%u:%u:%u)
    spad-sizes:(%u:%u:%u) spad-data:(%p:%p:%p)\n",'
  - '                gather_spad_size, octx->src0_spad.size_per_thread, octx->src1_spad.size_per_thread,'
  - '                octx->dst_spad.size_per_thread, octx->src0_spad.size, octx->src1_spad.size,
    octx->dst_spad.size,'
  - '                octx->src0_spad.data, octx->src1_spad.data, octx->dst_spad.data);'
  - ''
  - '            const size_t total_spad_size ='
  - '                gather_spad_size + octx->src0_spad.size + octx->src1_spad.size
    + octx->dst_spad.size;'
  - ''
  - '            if (total_spad_size > octx->ctx->vtcm_size) {'
  - '                FARF(HIGH, "ssm_conv-f32: HVX scratchpad size %zu exceeds VTCM
    size %zu", total_spad_size,'
  - '                     octx->ctx->vtcm_size);'
  - '                use_hvx = 0;'
  - '            }'
  - '        }'
  - ''
  - '        FARF(HIGH, "ssm-conv-f32: (%ux%ux%ux%u) x (%ux%ux%ux%u) -> (%ux%ux%ux%u)
    : use_hvx %d\n", src0->ne[0],'
  - '             src0->ne[1], src0->ne[2], src0->ne[3], src1->ne[0], src1->ne[1],
    src1->ne[2], src1->ne[3], dst->ne[0],'
  - '             dst->ne[1], dst->ne[2], dst->ne[3], use_hvx);'
  - ''
  - '        if (use_hvx) {'
  - '            worker_pool_run_func(octx->ctx->worker_pool, ssm_conv_thread_f32_f32_hvx,
    &scctx, n_threads);'
  - '        } else {'
  - '            worker_pool_run_func(octx->ctx->worker_pool, ssm_conv_thread_f32_f32,
    &scctx, n_threads);'
  - '        }'
  - '    }'
  - ''
  - '    return HTP_STATUS_OK;'
  - '}'
