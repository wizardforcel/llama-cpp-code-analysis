    - '        return "unsupported"'
    - ''
    - '    support_count = 0'
    - '    total_backends = len(self.all_backends)'
    - ''
    - '    for backend in self.all_backends:'
    - '        if self.backend_support[backend].get(operation, False):'
    - '            support_count += 1'
    - ''
    - '    if support_count == 0:'
    - '        return "unsupported"'
    - '    elif support_count == total_backends:'
    - '        return "supported"'
    - '    else:'
    - '        return "partially supported"'
