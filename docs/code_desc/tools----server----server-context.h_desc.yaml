desc: 该文件定义了两个核心结构体：server_context_meta 和 server_context，以及辅助结构体 server_routes，用于管理
  llama.cpp 服务器实例的完整生命周期，包括模型加载、主循环调度、元数据查询、睡眠状态回调，以及路由处理器注册和统一响应生成器的创建。通过私有实现（pimpl）模式封装底层上下文，并提供
  REST API 路由（如健康检查、完成、嵌入、模型列表等）的关联处理器，是整个服务器后端的中枢抽象层。
