desc: 该文件是llama.cpp服务器上下文的核心实现，定义了服务器插槽（server_slot）的状态管理、任务处理、提示词缓存与加载，以及服务器指标（server_metrics）的统计。它通过私有实现结构体（server_context_impl）管理模型加载、上下文初始化、多插槽任务调度和队列通信，是服务器处理并发推理请求的关键逻辑层。该文件是
  llama.cpp 项目中的服务器上下文实现，负责管理多个推理槽位（slots）的任务调度、提示词缓存、令牌生成、结果发送等核心逻辑，是服务器后端处理各种推理请求（如文本生成、嵌入、重排序）的关键模块。该文件是
  llama.cpp 项目中的服务器上下文实现（server-context.cpp），核心功能是管理服务器端推理时的上下文槽位（slot），包括任务处理、批次构建、上下文移位（context
