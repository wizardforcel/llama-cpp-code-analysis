desc: 该文件实现了llama_kv_cache_iswa类及其上下文类llama_kv_cache_iswa_context。llama_kv_cache_iswa是一个双重KV缓存管理器，将KV缓存分为非SWA（滑动窗口注意力）和SWA两部分，分别存储和管理，以适应支持SWA的模型架构。它提供了缓存初始化、清理、序列操作、批次准备和状态读写等功能，并通过组合基础缓存和SWA缓存来统一管理，实现高效的缓存内存利用和上下文管理。llama_kv_cache_iswa_context则封装了针对该双重缓存的批次上下文管理，协调基础缓存和SWA缓存的初始化、迭代和状态查询。
