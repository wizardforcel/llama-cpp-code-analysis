- desc: llama_kv_cache_iswa是集成滑动窗口注意力（SWA）的双重KV缓存管理器，内部持有基础KV缓存（kv_base）和SWA KV缓存（kv_swa）两个缓存实例，负责协调两个缓存的操作，并为外部提供统一的接口。
