classes: []
desc: 该文件是OpenVINO的GGML前端中的一个操作符实现，具体实现了scale操作的转换，将GGML模型中的scale操作（乘以缩放因子并可选地加上偏置）转换为OpenVINO的核心操作（Multiply和Add），以便将GGML模型导入到OpenVINO中进行推理。
file: ggml/src/ggml-openvino/openvino/op/scale.cpp
funcs:
- code:
  - OutputVector translate_scale(const NodeContext & context) {
  - '    num_inputs_check(context, 1, 1);'
  - ''
  - '    float scale;'
  - '    float bias;'
  - '    memcpy(&scale, (float *) context.get_output_op_params() + 0, sizeof(float));'
  - '    memcpy(&bias, (float *) context.get_output_op_params() + 1, sizeof(float));'
  - ''
  - '    auto scale_node = std::make_shared<ov::op::v0::Constant>(ov::element::f32,
    ov::Shape{}, std::vector<float>{scale});'
  - '    auto scaled = std::make_shared<ov::op::v1::Multiply>(context.get_input(0),
    scale_node);'
  - ''
  - '    std::shared_ptr<ov::Node> res;'
  - '    if (bias != 0.0f) {'
  - '        auto bias_node ='
  - '            std::make_shared<ov::op::v0::Constant>(ov::element::f32, ov::Shape{},
    std::vector<float>{bias});'
  - '        res = std::make_shared<ov::op::v1::Add>(scaled, bias_node);'
  - '    } else {'
  - '        res = scaled;'
  - '    }'
  - ''
  - '    return rename_outputs_with_suffix({res}, context.get_name());'
  - '}'
  desc: 将GGML的scale操作转换为OpenVINO的Multiply和Add操作的全局函数，处理输入验证、参数解析、常量创建和操作构建。
