desc: 该文件是 gguf-py 包的初始化模块，通过从 constants, lazy, gguf_reader, gguf_writer, quants,
  tensor_mapping, vocab, utility 和 metadata 等模块导入所有公开接口，作为整个 GGUF（GPT-Generated Unified
  Format）格式处理库的统一入口。该包主要用于定义 GGUF 文件格式的常量、读取和写入 GGUF 文件、管理的量化操作、映射张量名称、处理词表以及提供元数据管理功能。其核心功能是让外部使用者能够通过
  gguf 包直接访问底层的读写和常量定义接口。
