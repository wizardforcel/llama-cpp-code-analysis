classes:
- desc: KV 缓存管理类，负责模型的键值缓存分配、初始化、槽位管理（如查找、复用）、序列操作（添加、删除、复制、移位）以及内存管理。它支持多数据流（stream）和多种后端，并集成
    K-shift（用于处理序列移位）和 Hadamard 旋转（用于优化量化缓存）。
