desc: 该文件是 llama.cpp 中 KV 缓存（Key-Value Cache）核心实现的源文件。它定义了 llama_kv_cache 类，负责管理 Transformer
  模型推理过程中的键值缓存，包括缓存的分配、初始化、查找空闲槽位、更新（如 K-shift 旋转）、序列管理和内存管理。同时，该文件还包含两个静态辅助函数，用于生成
  Hadamard 旋转矩阵以优化量化缓存的注意力计算，以及执行矩阵乘法辅助操作。该文件实现了llama.cpp中KV缓存的核心管理功能，定义了llama_kv_cache类，负责KV缓存的创建、分配、读取、写入、状态序列化，以及注意力掩码和旋转位置编码等辅助计算的构建与填充。The
  file implements the llama.cpp KV (Key-Value) cache system, including the cache state
  management, data input/output for save/restore operations, and a context wrapper
  class that provides a unified interface for building and updating the cache during
  attention computation.
