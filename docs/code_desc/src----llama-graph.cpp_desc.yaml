    - '        const bool last = ('
    - '             cparams.pooling_type == LLAMA_POOLING_TYPE_LAST ||'
    - '            (cparams.pooling_type == LLAMA_POOLING_TYPE_RANK && (arch == LLM_ARCH_QWEN3
      || arch == LLM_ARCH_QWEN3VL)) // qwen3 reranking & embedding models use last
      token'
    - '        );'
    - '        for (int i = 0; i < n_tokens; ++i) {'
