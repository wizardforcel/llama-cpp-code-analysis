desc: 'This file serves as the central barrel export module for all modal dialog components
  in the chat application. It aggregates and re-exports 16 distinct dialog components
  from separate .svelte files, organized into six functional categories: settings,
  confirmation, content preview, attachment, error/alert, data management, and model
  information dialogs. These dialogs wrap ShadCN Dialog or AlertDialog primitives
  to provide consistent styling and accessibility while integrating with application
  stores for state management.'
