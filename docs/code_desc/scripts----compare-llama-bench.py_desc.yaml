desc: 这是一个用于比较 llama-bench 或 test-backend-ops 性能数据的 Python 脚本。它从多个输入文件（JSON/CSV/JSONL/SQLite）中加载数据，基于
  git 提交历史自动识别或手动指定基准提交和目标提交，然后生成性能对比表格，支持多种输出格式，并可生成性能对比图表。该脚本设计了数据源抽象层，支持 SQLite
  数据库、JSON、JSONL 和 CSV 等不同格式的数据输入，并提供了针对 llama-bench 和 test-backend-ops 两种工具的不同数据处理逻辑。This
  script compares benchmark results between two Git commits (baseline and compare)
  for llama-bench and test-backend-ops tools. It reads benchmark data from a JSON
  file, filters and processes rows based on selected parameters, computes speedup
  ratios, formats results into a table, and optionally generates performance plots
  using matplotlib before printing the table.
file: scripts/compare-llama-bench.py
funcs:
- code:
  - 'def format_flops(flops_value: float) -> str:'
  - '    """Format FLOPS values with appropriate units for better readability."""'
  - '    if flops_value == 0:'
  - '        return "0.00"'
  - ''
  - '    # Define unit thresholds and names'
  - '    units = ['
  - '        (1e12, "T"),   # TeraFLOPS'
  - '        (1e9, "G"),    # GigaFLOPS'
  - '        (1e6, "M"),    # MegaFLOPS'
  - '        (1e3, "k"),    # kiloFLOPS'
  - '        (1, "")        # FLOPS'
  - '    ]'
  - ''
  - '    for threshold, unit in units:'
  - '        if abs(flops_value) >= threshold:'
  - '            formatted_value = flops_value / threshold'
  - '            if formatted_value >= 100:'
  - '                return f"{formatted_value:.1f}{unit}"'
  - '            else:'
  - '                return f"{formatted_value:.2f}{unit}"'
  - ''
  - '    # Fallback for very small values'
  - '    return f"{flops_value:.2f}"'
  desc: 格式化 FLOPS 值为可读字符串，根据数值大小自动选择合适的单位。
