desc: 该文件实现了将 JSON Schema 转换为 GBNF（Grammar-Based Natural Format）语法的功能。它定义了多个辅助函数和一个核心转换类
  common_schema_converter，用于处理 JSON Schema 中定义的数据结构，将其映射为可供 LLM（大型语言模型）输出的 GBNF 语法规则。文件中包含了正则表达式转换、字符串格式化、数字范围处理、对象属性构建等多种复杂逻辑。该文件实现了
  JSON Schema 到语法规则（GBNF 或可选的 LLGuidance JSON 语法）的转换功能。核心逻辑通过解析 $ref、oneOf、anyOf、allOf、对象属性、数组、字符串约束、整数范围、枚举和常量等
  JSON Schema 特性，递归生成命名规则并汇总为最终语法；同时提供 Schema 引用解析、错误检查、字符串可解析性判断以及面向外部调用的构建接口。
