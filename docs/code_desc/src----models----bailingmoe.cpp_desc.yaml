classes:
- desc: BaiLingMoE 模型图构建器，继承自 llm_graph_context，负责构建完整的模型计算图。
  methods:
  - code:
    - 'llm_build_bailingmoe::llm_build_bailingmoe(const llama_model & model, const
      llm_graph_params & params) : llm_graph_context(params) {'
    - '    ggml_tensor * cur;'
    - '    ggml_tensor * inpL;'
    - '    inpL = build_inp_embd(model.tok_embd);'
    - '    ggml_tensor * inp_pos = build_inp_pos();'
    - '    auto * inp_attn = build_attn_inp_kv();'
    - '    ggml_tensor * inp_out_ids = build_inp_out_ids();'
    - '    for (int il = 0; il < n_layer; ++il) {'
    - '        ggml_tensor * inpSA = inpL;'
    - '        cur = build_norm(inpL, model.layers[il].attn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        cb(cur, "attn_norm", il);'
    - '        // self-attention'
    - '        {'
    - '            ggml_tensor * rope_factors = model.get_rope_factors(cparams, il);'
    - '            ggml_tensor * Qcur = build_lora_mm(model.layers[il].wq, cur);'
    - '            cb(Qcur, "Qcur", il);'
    - '            if (model.layers[il].bq) { Qcur = ggml_add(ctx0, Qcur, model.layers[il].bq);
      cb(Qcur, "Qcur", il); }'
    - '            ggml_tensor * Kcur = build_lora_mm(model.layers[il].wk, cur);'
    - '            cb(Kcur, "Kcur", il);'
    - '            if (model.layers[il].bk) { Kcur = ggml_add(ctx0, Kcur, model.layers[il].bk);
      cb(Kcur, "Kcur", il); }'
    - '            ggml_tensor * Vcur = build_lora_mm(model.layers[il].wv, cur);'
    - '            cb(Vcur, "Vcur", il);'
    - '            if (model.layers[il].bv) { Vcur = ggml_add(ctx0, Vcur, model.layers[il].bv);
      cb(Vcur, "Vcur", il); }'
    - '            Qcur = ggml_reshape_3d(ctx0, Qcur, n_rot, n_head, n_tokens);'
    - '            Kcur = ggml_reshape_3d(ctx0, Kcur, n_rot, n_head_kv, n_tokens);'
    - '            Vcur = ggml_reshape_3d(ctx0, Vcur, n_rot, n_head_kv, n_tokens);'
    - '            Qcur = ggml_rope_ext(ctx0, Qcur, inp_pos, rope_factors, n_rot,
      rope_type, n_ctx_orig, freq_base, freq_scale, ext_factor, attn_factor, beta_fast,
      beta_slow);'
    - '            Kcur = ggml_rope_ext(ctx0, Kcur, inp_pos, rope_factors, n_rot,
      rope_type, n_ctx_orig, freq_base, freq_scale, ext_factor, attn_factor, beta_fast,
      beta_slow);'
    - '            cb(Qcur, "Qcur", il);'
    - '            cb(Kcur, "Kcur", il);'
    - '            cb(Vcur, "Vcur", il);'
    - '            cur = build_attn(inp_attn, model.layers[il].wo, model.layers[il].bo,
      Qcur, Kcur, Vcur, nullptr, nullptr, nullptr, 1.0f/sqrtf(float(n_rot)), il);'
    - '        }'
    - '        if (il == n_layer - 1 && inp_out_ids) {'
    - '            cur   = ggml_get_rows(ctx0, cur, inp_out_ids);'
    - '            inpSA = ggml_get_rows(ctx0, inpSA, inp_out_ids);'
    - '        }'
    - '        ggml_tensor * ffn_inp = ggml_add(ctx0, cur, inpSA);'
    - '        cb(ffn_inp, "ffn_inp", il);'
    - '        cur = build_norm(ffn_inp, model.layers[il].ffn_norm, NULL, LLM_NORM_RMS,
      il);'
    - '        cb(cur, "ffn_norm", il);'
    - '        ggml_tensor * moe_out = build_moe_ffn(cur, model.layers[il].ffn_gate_inp,
      model.layers[il].ffn_up_exps, model.layers[il].ffn_gate_exps, model.layers[il].ffn_down_exps,
      nullptr, n_expert, n_expert_used, LLM_FFN_SILU, hparams.expert_weights_norm,
      hparams.expert_weights_scale, LLAMA_EXPERT_GATING_FUNC_TYPE_SOFTMAX, il);'
    - '        cb(moe_out, "ffn_moe_out", il);'
    - '        // FFN shared expert'
    - '        {'
    - '            ggml_tensor * ffn_shexp = build_ffn(cur, model.layers[il].ffn_up_shexp,
      NULL, NULL, model.layers[il].ffn_gate_shexp, NULL, NULL, model.layers[il].ffn_down_shexp,
      NULL, NULL, LLM_FFN_SILU, LLM_FFN_PAR, il);'
    - '            cb(ffn_shexp, "ffn_shexp", il);'
    - '            cur = ggml_add(ctx0, moe_out, ffn_shexp);'
    - '            cb(cur, "ffn_out", il);'
    - '        }'
    - '        cur = ggml_add(ctx0, cur, ffn_inp);'
    - '        cur = build_cvec(cur, il);'
    - '        cb(cur, "l_out", il);'
    - '        inpL = cur;'
    - '    }'
    - '    cur = inpL;'
    - '    cur = build_norm(cur, model.output_norm, NULL, LLM_NORM_RMS, -1);'
    - '    cb(cur, "result_norm", -1);'
    - '    res->t_embd = cur;'
    - '    cur = build_lora_mm(model.output, cur);'
    - '    cb(cur, "result_output", -1);'
    - '    res->t_logits = cur;'
    - '    ggml_build_forward_expand(gf, cur);'
    - '}'
    desc: 构造函数，构建模型计算图，包含嵌入、位置编码、注意力、MoE FFN 和输出层。
    line: 5-87
    name: llm_build_bailingmoe
  name: llm_build_bailingmoe
desc: 该文件定义了 BaiLingMoE 模型的计算图构建函数，通过逐层构建自注意力、MoE FFN 和共享专家等模块，最终输出模型的 logits 结果。
