  - '            continue'
  - ''
  - '        # Calculate Tensor Volume'
  - '        sum_weights_in_tensor = 1'
  - '        for dim in tensor.shape:'
  - '            sum_weights_in_tensor *= dim'
  - '        total_weights += sum_weights_in_tensor'
  - ''
  - '    # Hash Progress Bar'
  - '    bar = tqdm(desc="Hashing", total=total_weights, unit="weights", unit_scale=True,
    disable=disable_progress_bar)'
  - ''
  - '    # Hashing Process'
  - '    for tensor in reader.tensors:'
  - ''
  - '        # We don''t need these'
  - '        if tensor.name.endswith((".attention.masked_bias", ".attention.bias",
    ".rotary_emb.inv_freq")):'
  - '            continue'
  - ''
  - '        # Progressbar'
  - '        sum_weights_in_tensor = 1'
  - '        for dim in tensor.shape:'
  - '            sum_weights_in_tensor *= dim'
  - '        bar.update(sum_weights_in_tensor)'
  - ''
  - '        if not no_layer:'
  - ''
  - '            sha1_layer = hashlib.sha1()'
  - '            sha1_layer.update(tensor.data.data)'
  - '            print("sha1      {0}  {1}:{2}".format(sha1_layer.hexdigest(), filename,
