desc: 该文件实现了 llama.cpp 中的词汇表（vocabulary）相关的各种分词器（tokenizer），包括 SPM（SentencePiece Model）、BPE（Byte
  Pair Encoding）、WPM（WordPiece Model）等，以及辅助数据结构（如朴素 Trie 树、优先级队列）和 Unicode 文本处理逻辑，用于将文本转换为模型可识别的
  token 序列。This file implements various tokenizers for the llama model, including
  the SentencePiece (SPM), Unigram (UGM), RWKV, and Plamo2 tokenizers, along with
  the core vocabulary management (llama_vocab::impl). It provides tokenization functionality,
  vocabulary loading, special token handling, and utilities for parsing and normalizing
  text.该文件是llama.cpp项目中llama-vocab.cpp源文件的片段，主要实现了llama_vocab::impl类中load方法的核心逻辑，负责从GGUF模型文件中加载和初始化词汇表（vocabulary），包括识别词汇表类型（如SPM、BPE、WPM等）、读取词汇表数据、设置特殊token，并根据词汇表类型配置对应的预分词器设置。该文件是
  llama.cpp 项目中负责词汇表（vocabulary）定义和分词（tokenization）的核心实现。它主要处理从 GGUF 模型文件加载词汇数据，执行各种分词算法（SPM、BPE、WPM、UGM、RWKV、PLaMo2），管理特殊
  token（如 BOS、EOS、FIM 等），并提供 token 与文本之间的转换接口。该文件实现了llama_vocab类及其内部实现类impl，负责词汇表的加载、管理、token化与反token化等核心功能，支持SPM、BPE、RWKV、PLAMO2等不同编码类型，提供C++类接口和C风格API供上层调用，涵盖特殊token处理、BPE合并规则、文本清洗等完整逻辑。
