- desc: 一元运算上下文结构体，用于在线程间传递运算所需的所有参数和数据，包括源/目标数据指针、行大小、内存对齐量、SPAD（ScratchPad）内存大小和计数等。
  methods: []
  name: htp_unary_context
desc: 该文件为Hexagon DSP（数字信号处理器）上的GGML库实现了F32类型的各种一元运算优化内核。它定义了多个静态函数用于执行RMS归一化、缩放、平方、平方根、取负、指数、Sigmoid和Softplus等操作，利用HVX（Hexagon矢量扩展）指令集进行加速，并通过双缓冲DMA传输和VTCM（矢量Tensor协处理器内存）分块处理以优化性能。文件主要包含上层操作调度函数和执行线程函数，支持多线程并行处理。
file: ggml/src/ggml-hexagon/htp/unary-ops.c
