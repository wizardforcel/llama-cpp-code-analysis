desc: 该文件定义了Bailingmoe2模型的图构建逻辑，通过继承llm_graph_context实现了一个完整的Transformer解码器前向计算图的构造过程。代码从输入嵌入开始，逐层构建包含自注意力（含QKV投影、归一化、旋转位置编码）和MoE混合专家前馈网络（含共享专家分支）的深度网络，最终生成logits输出，并包含用于KV缓存裁剪的特殊处理逻辑。
