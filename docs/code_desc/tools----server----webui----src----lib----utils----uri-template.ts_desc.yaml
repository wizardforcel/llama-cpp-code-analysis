classes:
- desc: An interface defining the structure of a parsed variable from a URI template
    expression, containing the variable name and its operator prefix.
  methods: []
  name: UriTemplateVariable
desc: This TypeScript file provides utility functions for URI template processing,
  implementing a simplified RFC 6570 Level 2 specification. It supports extracting
  variables from URI templates, expanding templates with provided values, normalizing
  resource URIs by removing extra leading slashes, and checking whether all required
  template variables have been provided with values.
file: tools/server/webui/src/lib/utils/uri-template.ts
