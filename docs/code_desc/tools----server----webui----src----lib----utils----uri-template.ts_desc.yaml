- code:
  - 'export function isTemplateComplete(template: string, values: Record<string, string>):
    boolean {'
  - "\tconst variables = extractTemplateVariables(template);"
  - ''
  - "\treturn variables.every((v) => (values[v.name] ?? '').trim() !== '');"
  - '}'
  desc: Checks whether all required variables in a URI template have been provided
