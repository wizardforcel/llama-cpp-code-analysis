  name: llm_build_qwen3
desc: 该代码是Qwen3模型的构建函数，通过构建token嵌入、多层Transformer解码器（包含自注意力机制、前馈神经网络和层归一化）以及最终的输出层，定义了语言模型的完整前向传播计算图谱，用于生成logits。
