  - '    const int64_t y_min = sycl::max(int64_t(0), int64_t(y - support1 + pixel_offset));'
  - '    const int64_t y_max = sycl::min(int64_t(ne01_src), int64_t(y + support1 +
    pixel_offset));'
  - ''
  - '    // bilinear filter with antialiasing'
  - '    float val = 0.0f;'
  - '    float total_weight = 0.0f;'
  - ''
