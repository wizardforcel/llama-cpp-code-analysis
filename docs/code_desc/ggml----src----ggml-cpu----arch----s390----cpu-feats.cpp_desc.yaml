classes:
- desc: 一个内部使用的上下文类，用于在构造时自动检测和存储 s390x 架构的特定硬件特性标志（如 VXE2 和 NNPA 支持）。
  methods:
  - code:
    - s390x_features() {
    - '    uint32_t hwcap = getauxval(AT_HWCAP);'
    - '    // NOTE: use hwcap2 with DFLT for z17 and later'
    - '    // uint32_t hwcap2 = getauxval(AT_HWCAP2);'
    - ''
    - '    has_vxe2 = !!(hwcap & HWCAP_VXRS_EXT2);'
    - '    has_nnpa = !!(hwcap & HWCAP_NNPA);'
    - '}'
    desc: 构造函数，通过 getauxval 读取硬件能力（AT_HWCAP）位标志，并初始化 has_vxe2 和 has_nnpa 两个布尔成员变量。
    line: 18-26
    name: s390x_features
  name: s390x_features
desc: 该文件实现了针对 IBM s390x 架构的 CPU 特性检测功能，通过读取硬件能力（HWCAP）寄存器来检测 VXE2 和 NNPA 等特定扩展指令集，并据此计算
  CPU 的后端评分，以优化 ggml 在不同 s390x 硬件上的性能选择。
file: ggml/src/ggml-cpu/arch/s390/cpu-feats.cpp
funcs:
- code:
  - static int ggml_backend_cpu_s390x_score() {
  - '    int score = 1;'
  - '    s390x_features sf;'
  - ''
  - // IBM z15 / LinuxONE 3
  - '#ifdef GGML_USE_VXE2'
  - '    if (!sf.has_vxe2) { return 0; }'
  - '    score += 1 << 1;'
  - '#endif'
  - ''
  - // IBM z16 / LinuxONE 4 and z17 / LinuxONE 5
  - '#ifdef GGML_USE_NNPA'
  - '    if (!sf.has_nnpa) { return 0; }'
  - '    score += 1 << 2;'
  - '#endif'
  - ''
  - '    return score;'
  - '}'
  desc: 全局评分函数，根据检测到的 s390x 硬件特性（VXE2 和 NNPA）计算并返回一个整数值，用于确定是否适合在特定 CPU 上运行以及优先级。
  line: 29-44
  name: ggml_backend_cpu_s390x_score
