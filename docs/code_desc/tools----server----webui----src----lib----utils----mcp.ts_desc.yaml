- code:
  - export function downloadResourceContent(
  - '  text: string,'
  - '  mimeType: MimeTypeUnion = MimeTypeText.PLAIN,'
  - '  filename: string = DEFAULT_RESOURCE_FILENAME'
  - '): void {'
  - '  const blob = new Blob([text], { type: mimeType });'
  - '  const url = URL.createObjectURL(blob);'
  - '  const a = document.createElement(''a'');'
  - '  a.href = url;'
  - '  a.download = filename;'
  - '  document.body.appendChild(a);'
  - '  a.click();'
  - '  document.body.removeChild(a);'
  - '  URL.revokeObjectURL(url);'
  - '}'
  desc: Triggers a browser file download by creating a Blob from text content, generating
    an object URL, and programmatically clicking a temporary anchor element.
  line: 270-284
  name: downloadResourceContent
