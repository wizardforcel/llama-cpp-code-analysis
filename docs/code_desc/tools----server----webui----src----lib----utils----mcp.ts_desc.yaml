- code:
  - 'export function parseResourcePath(uri: string): string[] {'
  - '  try {'
  - '    const withoutProtocol = uri.replace(PROTOCOL_PREFIX_REGEX, '''');'
  - '    return withoutProtocol.split(PATH_SEPARATOR).filter((p) => p.length > 0);'
  - '  } catch {'
  - '    return [uri];'
  - '  }'
  - '}'
