desc: This file provides utility functions for handling MCP (Model Context Protocol)
  data in a web UI, including parsing server settings, detecting transport types,
  mapping log levels to icons and CSS classes, determining resource types (image,
  code, text, database), extracting content, and triggering file downloads.
file: tools/server/webui/src/lib/utils/mcp.ts
funcs:
- code:
  - 'export function detectMcpTransportFromUrl(url: string): MCPTransportType {'
  - '  const normalized = url.trim().toLowerCase();'
  - ''
  - '  return normalized.startsWith(UrlProtocol.WEBSOCKET) ||'
  - '    normalized.startsWith(UrlProtocol.WEBSOCKET_SECURE)'
  - '    ? MCPTransportType.WEBSOCKET'
  - '    : MCPTransportType.STREAMABLE_HTTP;'
  - '}'
  desc: Detects the MCP transport type (websocket or streamable_http) based on the
    URL protocol prefix.
  line: 39-47
  name: detectMcpTransportFromUrl
- code:
  - 'export function parseMcpServerSettings(rawServers: unknown): MCPServerSettingsEntry[]
    {'
  - '  if (!rawServers) return [];'
  - ''
  - '  let parsed: unknown;'
  - ''
  - '  if (typeof rawServers === ''string'') {'
  - '    const trimmed = rawServers.trim();'
  - '    if (!trimmed) return [];'
  - ''
  - '    try {'
  - '      parsed = JSON.parse(trimmed);'
  - '    } catch (error) {'
  - '      console.warn(''[MCP] Failed to parse mcpServers JSON, ignoring value:'',
    error);'
  - ''
  - '      return [];'
  - '    }'
  - '  } else {'
  - '    parsed = rawServers;'
  - '  }'
  - ''
  - '  if (!Array.isArray(parsed)) return [];'
  - ''
  - '  return parsed.map((entry, index) => {'
  - '    const url = typeof entry?.url === ''string'' ? entry.url.trim() : '''';'
  - '    const headers = typeof entry?.headers === ''string'' ? entry.headers.trim()
    : undefined;'
  - '    const id ='
  - '      typeof (entry as { id?: unknown })?.id === ''string'' && (entry as { id?:
    string }).id?.trim()'
  - '        ? (entry as { id: string }).id.trim()'
  - '        : `${MCP_SERVER_ID_PREFIX}-${index + 1}`;'
  - ''
  - '    return {'
  - '      id,'
  - '      enabled: Boolean((entry as { enabled?: unknown })?.enabled),'
  - '      url,'
  - '      name: (entry as { name?: string })?.name,'
  - '      requestTimeoutSeconds: DEFAULT_MCP_CONFIG.requestTimeoutSeconds,'
  - '      headers: headers || undefined,'
  - '      useProxy: Boolean((entry as { useProxy?: unknown })?.useProxy)'
  - '    } satisfies MCPServerSettingsEntry;'
  - '  });'
  - '}'
  desc: Parses MCP server settings from a JSON string or array into a structured array
    of MCPServerSettingsEntry objects, generating default IDs and enforcing default
    timeout values.
  line: 53-91
  name: parseMcpServerSettings
