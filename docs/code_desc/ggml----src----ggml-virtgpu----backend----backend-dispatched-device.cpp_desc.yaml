classes: []
desc: 该文件实现了虚拟 GPU 后端中设备相关功能的远程过程调用（RPC）分发处理。它作为主机端（host）与 guest 端（guest）之间的桥梁，通过
  apir_encoder 和 apir_decoder 进行数据序列化与反序列化，将 guest 端发起的一系列设备操作请求（如获取设备数量、名称、类型、内存信息、属性、支持的操作检查以及从主机共享内存创建后端缓冲区等）分发给对应的设备接口（dev->iface）执行，并将结果编码后返回给
  guest 端。该文件涵盖了设备信息查询、能力检查、缓冲区创建等核心后端交互逻辑。
file: ggml/src/ggml-virtgpu/backend/backend-dispatched-device.cpp
