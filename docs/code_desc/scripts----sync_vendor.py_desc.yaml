classes: []
desc: 该文件是一个用于同步第三方C/C++库头文件到项目vendor目录的脚本，它定义了需要下载的第三方库资源映射，依次下载这些文件，并在下载完成后执行一个分割操作（split.py）来处理httplib.h，最后清理临时文件。脚本的核心目的是自动化项目依赖库的获取与准备过程，确保构建所需的第三方头文件就绪。
file: scripts/sync_vendor.py
funcs:
- code:
  - HTTPLIB_VERSION = "refs/tags/v0.40.0"
  - ''
  - vendor = {
  - '    "https://github.com/nlohmann/json/releases/latest/download/json.hpp":     "vendor/nlohmann/json.hpp",'
  - '    "https://github.com/nlohmann/json/releases/latest/download/json_fwd.hpp":
    "vendor/nlohmann/json_fwd.hpp",'
  - ''
  - '    "https://raw.githubusercontent.com/nothings/stb/refs/heads/master/stb_image.h":
    "vendor/stb/stb_image.h",'
  - ''
  - '    # 注释部分'
  - '    "https://github.com/mackron/miniaudio/raw/9634bedb5b5a2ca38c1ee7108a9358a4e233f14d/miniaudio.h":
    "vendor/miniaudio/miniaudio.h",'
  - ''
  - '    f"https://raw.githubusercontent.com/yhirose/cpp-httplib/{HTTPLIB_VERSION}/httplib.h":
    "httplib.h",'
  - '    f"https://raw.githubusercontent.com/yhirose/cpp-httplib/{HTTPLIB_VERSION}/split.py":  "split.py",'
  - '    f"https://raw.githubusercontent.com/yhirose/cpp-httplib/{HTTPLIB_VERSION}/LICENSE":   "vendor/cpp-httplib/LICENSE",'
  - ''
  - '    "https://raw.githubusercontent.com/sheredom/subprocess.h/b49c56e9fe214488493021017bf3954b91c7c1f5/subprocess.h":
    "vendor/sheredom/subprocess.h",'
  - '}'
  - ''
  - 'for url, filename in vendor.items():'
  - '    print(f"downloading {url} to {filename}") # noqa: NP100'
  - '    urllib.request.urlretrieve(url, filename)'
  - ''
  - 'print("Splitting httplib.h...") # noqa: NP100'
  - 'try:'
  - '    subprocess.check_call(['
  - '        sys.executable, "split.py",'
  - '        "--extension", "cpp",'
  - '        "--out", "vendor/cpp-httplib"'
  - '    ])'
  - 'except Exception as e:'
  - '    print(f"Error: {e}") # noqa: NP100'
  - '    sys.exit(1)'
  - 'finally:'
  - '    os.remove("split.py")'
  - '    os.remove("httplib.h")'
  desc: 脚本的全局执行部分，包括定义下载资源映射、遍历下载文件、执行分割命令及清理临时文件。
  line: 1-40
  name: __main__
