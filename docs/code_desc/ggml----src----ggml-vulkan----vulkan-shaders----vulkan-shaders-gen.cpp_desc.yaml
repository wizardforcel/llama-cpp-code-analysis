classes: []
desc: 该文件是ggml Vulkan后端的着色器生成器，负责根据配置生成和编译各种Vulkan计算着色器，包括矩阵乘法、Flash Attention、归一化、拷贝等操作，并生成对应的SPIR-V二进制文件及C++头文件和源文件。该文件是
  ggml 项目中针对 Vulkan 后端的着色器生成工具。它通过调用 glslangValidator 或 glslc 将 GLSL 着色器源码编译为 SPIR-V
  二进制格式，并使用模板宏（如 A_TYPE, D_TYPE）为不同的数据类型和操作生成多个变体，最终将编译产物输出为 C++ 头文件和源文件，包含二进制数据和元数据，供
  Vulkan 后端在运行时加载和执行。
