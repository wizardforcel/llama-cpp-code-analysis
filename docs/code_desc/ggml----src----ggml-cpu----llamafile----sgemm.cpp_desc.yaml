desc: 该文件实现了针对常见连续矩阵场景 C = Aᵀ * B 的多线程 CPU 矩阵乘法，设计目标是充分利用 CPU 缓存，提供高性能的 SGEMM（单精度通用矩阵乘法）内核，并针对不同
  SIMD 指令集（如 SSE、AVX、AVX512、NEON、RVV 等）提供了向量化和融合乘加（FMA）的底层封装。This file contains SIMD-optimized
  implementations of small matrix multiplication (sgemm) kernels for various CPU architectures
  (ARM, AVX, PPC), including specialized handling for quantized block types like Q4_0,
  Q5_0, Q8_0, and IQ4_NL. It also includes a generic tinyBLAS class template for unquantized
  float/half precision matrices.The file implements PowerPC (PPC) optimized SGEMM
  (Single precision GEneral Matrix Multiply) kernels for llama.cpp, supporting FP32,
  FP16, Q4_0, and Q8_0 quantization, using Altivec/VSX and MMA instructions for vectorized
  SIMD and matrix-multiply-accumulate operations.该文件是ggml项目中用于PowerPC架构（PPC）的SGEMM（单精度通用矩阵乘法）内核实现。它利用PowerPC的MMA（矩阵乘法加速）指令集以及VSX向量化指令，针对不同量化数据类型（如block_q4_0和block_q8_0）和FP32类型，提供了多种尺寸（4x4，
  4x8， 8x4， 8x8等）的矩阵乘加内核。该代码通过分块（tiling）和任务分配（基于线程ID）策略，高效地将大矩阵乘法分解为小规模内核计算，并支持FP32累加、量化数据反量化以及结果存储等功能。该文件实现了llamafile_sgemm函数，这是一个针对CPU优化的矩阵乘法（GEMM）实现，支持多种数据类型（F32、BF16、F16、量化格式如Q8_0、Q4_0、Q5_0、IQ4_NL）和多种SIMD指令集（如AVX、AVX512、ARM
  NEON、PowerPC MMA、RISC-V RVV等），根据硬件能力选择不同的内核函数进行加速计算，用于ggml框架中的矩阵运算。
