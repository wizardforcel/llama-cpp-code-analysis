- code:
  - static void test_roundtrip_on_chunk(
  - '    const ggml_tensor * layer, int64_t offset, int64_t chunk_size, const ggml_type_traits
    & qfns, const ggml_type_traits_cpu & qfns_cpu, bool use_reference,'
  - '    float * input_scratch, char * quantized_scratch, float * output_scratch,
    error_stats & stats'
  - ) {
  - '    if (layer->type == GGML_TYPE_F16) {'
  - '        for (int i = 0; i < chunk_size; i++) {'
  - '            input_scratch[i] = ggml_get_f32_1d(layer, i + offset);'
  - '        }'
  - '    } else {'
  - '        input_scratch = ggml_get_data_f32(layer) + offset;'
  - '    }'
  - ''
  - '    if (use_reference) {'
  - '        qfns.from_float_ref(input_scratch, quantized_scratch, chunk_size);'
  - '    } else {'
  - '        qfns_cpu.from_float(input_scratch, quantized_scratch, chunk_size);'
  - '    }'
  - '    qfns.to_float(quantized_scratch, output_scratch, chunk_size);'
  - ''
  - '    update_error_stats(chunk_size, input_scratch, output_scratch, stats);'
  - '}'
  desc: 对一个大张量的一部分执行量化往返测试，即从原类型转换到目标量化类型再转回，并更新误差统计。
  line: 170-194
  name: test_roundtrip_on_chunk
- code:
  - static void test_roundtrip_on_layer(
  - '    std::string & name, bool print_layer_stats, const ggml_type_traits & qfns,
    const ggml_type_traits_cpu & qfns_cpu, bool use_reference,'
  - '    const ggml_tensor * layer, std::vector<float> & input_scratch, std::vector<char>
    & quantized_scratch,'
  - '    std::vector<float> & output_scratch, error_stats & total_error, int max_thread
    = 0'
  - ) {
  - '    assert(tensor_is_contiguous(layer));'
  - '    error_stats layer_error {};'
  - '    uint64_t nelements = ggml_nelements(layer);'
  - ''
  - '    float* input_scratch_ptr = nullptr;'
  - '    if (layer->type == GGML_TYPE_F16) {'
  - '        if (input_scratch.size() < nelements) input_scratch.resize(nelements);'
  - '        input_scratch_ptr = input_scratch.data();'
  - '    }'
  - '    if (quantized_scratch.size() < 4*nelements) quantized_scratch.resize(4*nelements);'
  - '    if (output_scratch.size() < nelements) output_scratch.resize(nelements);'
  - ''
  - '    if (max_thread < 1) max_thread = std::thread::hardware_concurrency();'
  - '    int chunk_size = 32*512;'
  - '    int num_chunks = (nelements + chunk_size - 1)/chunk_size;'
  - ''
  - '    if (num_chunks < 2 || max_thread < 2) {'
  - '        test_roundtrip_on_chunk(layer, 0, nelements, qfns, qfns_cpu, use_reference,
    input_scratch_ptr, quantized_scratch.data(),'
  - '                output_scratch.data(), print_layer_stats ? layer_error : total_error);'
  - '    } else {'
  - '        auto & stats = print_layer_stats ? layer_error : total_error;'
  - '        std::mutex mutex;'
  - '        uint64_t counter = 0;'
  - '        auto compute = [&mutex, &counter, &stats, &qfns, &qfns_cpu, nelements,
    layer, use_reference, input_scratch_ptr,'
  - '             &quantized_scratch, &output_scratch, chunk_size] () {'
  - '            error_stats local_stats {};'
  - '            while (true) {'
  - '                std::unique_lock<std::mutex> lock(mutex);'
  - '                uint64_t offset = counter; counter += chunk_size;'
  - '                if (offset >= nelements) {'
  - '                    combine_error_stats(stats, local_stats);'
  - '                    break;'
  - '                }'
  - '                lock.unlock();'
  - '                uint64_t chunk = offset + chunk_size < nelements ? chunk_size
    : nelements - offset;'
  - '                test_roundtrip_on_chunk(layer, offset, chunk, qfns, qfns_cpu,
    use_reference, input_scratch_ptr + offset,'
  - '                        quantized_scratch.data() + 4*offset, output_scratch.data()
    + offset, local_stats);'
  - '            }'
  - '        };'
  - '        int nthread = std::min(num_chunks, max_thread);'
  - '        std::vector<std::thread> workers(nthread-1);'
  - '        for (auto& w : workers) w = std::thread(compute);'
  - '        compute();'
  - '        for (auto& w : workers) w.join();'
  - '    }'
  - ''
  - '    if (print_layer_stats) {'
  - '        print_error_stats(name, layer_error, false);'
  - '        combine_error_stats(total_error, layer_error);'
  - '    }'
  - '}'
  desc: 对一个完整层执行量化往返测试，分配必要的暂存空间，根据需要分割工作负载并在多线程间分配，最后汇总误差统计。
  line: 197-250
  name: test_roundtrip_on_layer
