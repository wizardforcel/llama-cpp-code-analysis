  - '    delim = "wgsl"'
  - '    while f"{delim}\"" in shader_code:'
  - '        delim += "_x"'
  - '    return delim'
  desc: 选择一个不会出现在着色器代码中的原始字符串定界符，确保生成代码的语法正确
