desc: 该文件是一个WGSL着色器资源的自动化嵌入工具，用于将所有.wgsl着色器文件读取、处理并生成C++源代码，将各个着色器内容以原始字符串常量的形式嵌入到生成的C++头文件中，支持处理文件包含指令、内容分块和自定义原始字符串定界符，常见的WebGPU着色器资源管理场景
