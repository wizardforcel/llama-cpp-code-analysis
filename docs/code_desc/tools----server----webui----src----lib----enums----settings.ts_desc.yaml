desc: 该文件定义了三个 TypeScript 枚举类型，用于设置模块的参数管理。这些枚举分别表示参数来源（默认或自定义）、可同步参数的数据类型（数字、字符串、布尔值）以及设置字段的输入类型（输入框、文本域、复选框、下拉选择框），为前端的设置界面提供了类型安全的常量定义。
