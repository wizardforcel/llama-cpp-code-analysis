  desc: 将数据缓冲区内容转换并加载到已初始化的 zDNN 张量中。
  line: 36-39
  name: ggml_zdnn_load_tensor
- code:
  - void ggml_zdnn_init_tensor(ggml_backend_zdnn_buffer * buffer, const ggml_tensor
    * tensor) {
  - '    switch (tensor->op) {'
  - '        case GGML_OP_MUL_MAT:'
  - '            {'
  - '                zdnn_init_pre_transformed_desc('
  - '                    ZDNN_2D,'
  - '                    ggml_zdnn_type_mapping(tensor->type),'
  - '                    &buffer->pre_tfm_desc,'
  - '                    tensor->ne[1], tensor->ne[0]'
  - '                );'
  - '            } break;'
  - ''
  - '        default:'
  - '            {'
  - '                // 对于4D张量，GGML使用NCHW布局，但zDNN自动转换为NHWC格式'
  - '                // 此处直接使用NHWC以避免布局变换带来的性能开销'
  - '                zdnn_init_pre_transformed_desc('
  - '                    ZDNN_NHWC,'
  - '                    ggml_zdnn_type_mapping(tensor->type),'
  - '                    &buffer->pre_tfm_desc,'
  - '                    tensor->ne[3], tensor->ne[2], tensor->ne[1], tensor->ne[0]'
  - '                );'
  - ''
  - '                // TODO: 考虑添加ggml检查。'
  - '                // TODO: 如果tensor=4D，默认使用ZDNN_NCHW。'
  - '                // TODO: 如果tensor=2D，默认使用ZDNN_NHWC。'
  - '            } break;'
  - '    }'
  - ''
  - '    ZDNN_CHECK(zdnn_generate_transformed_desc(&buffer->pre_tfm_desc, &buffer->tfm_desc));'
  - '    ZDNN_CHECK(zdnn_init_ztensor_with_malloc(&buffer->pre_tfm_desc, &buffer->tfm_desc,
    &buffer->ztensor));'
  - '}'
  desc: 根据张量的操作类型初始化 zDNN 缓冲区中的张量描述符，并根据维度适配不同的数据布局方案。
  line: 41-65
  name: ggml_zdnn_init_tensor
