desc: 该文件是 ggml 库中 zDNN 后端相关的工具函数集合，负责将 ggml 张量类型映射为 zDNN 数据类型，并提供张量描述符初始化、转换及加载等底层操作的封装，桥接
  ggml 张量与 zDNN 张量系统。
file: ggml/src/ggml-zdnn/utils.cpp
funcs:
- code:
  - zdnn_data_types ggml_zdnn_type_mapping(ggml_type type) {
  - '    switch (type) {'
  - '        case GGML_TYPE_F32:'
  - '            return FP32;'
  - '        case GGML_TYPE_F16:'
  - '            return FP16;'
  - '        case GGML_TYPE_BF16:'
  - '            return BFLOAT;'
  - '        case GGML_TYPE_Q8_0:'
  - '            return INT8;'
  - '        case GGML_TYPE_I8:'
  - '            return INT8;'
  - '        case GGML_TYPE_I32:'
  - '            return INT32;'
  - '        default:'
  - '            GGML_ABORT("%s: fatal: unable to determine zTensor data type",'
  - '                       __func__);'
  - '            break;'
  - '    }'
  - '}'
  desc: 将 ggml 张量数据类型映射为 zDNN 数据类型，不支持的类型会触发终止。
  line: 5-18
  name: ggml_zdnn_type_mapping
- code:
  - void ggml_zdnn_create_tensor(zdnn_tensor_desc  & pre_tfm_desc,
  - '                             zdnn_tensor_desc  & tfm_desc,'
  - '                             zdnn_ztensor      & ztensor,'
  - '                       const ggml_tensor       * src,'
  - '                       const int64_t           * ne,'
  - '                       const zdnn_data_layouts   layout) {'
  - '    zdnn_init_pre_transformed_desc('
  - '        layout,'
  - '        ggml_zdnn_type_mapping(src->type),'
  - '        &pre_tfm_desc,'
  - '        ne[3], ne[2], ne[1], ne[0]'
  - '    );'
  - ''
  - '    ZDNN_CHECK(zdnn_generate_transformed_desc(&pre_tfm_desc, &tfm_desc));'
  - '    ZDNN_CHECK(zdnn_init_ztensor_with_malloc(&pre_tfm_desc, &tfm_desc, &ztensor));'
  - '}'
  desc: 根据 ggml 张量参数创建 zDNN 张量描述符并分配内存初始化 zTensor。
