  - "\tTEXT = 'text'"
  - '}'
  - ''
  - export enum MimeTypeIncludes {
  - "\tJSON = 'json',"
  - "\tJAVASCRIPT = 'javascript',"
  - "\tTYPESCRIPT = 'typescript'"
  - '}'
  - ''
  - // URI patterns for content detection
  - export enum UriPattern {
