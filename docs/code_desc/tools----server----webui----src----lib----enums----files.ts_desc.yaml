desc: 这是一个 TypeScript 文件，定义了 WebUI 中支持的所有文件类型的综合字典。它通过 TypeScript 枚举将这些文件类型组织成不同的类别，例如图像、音频、PDF
  和文本，以及文件扩展名、MIME 类型前缀、MIME 类型包含内容和 URI 模式，旨在提供更好的类型安全。
file: tools/server/webui/src/lib/enums/files.ts
