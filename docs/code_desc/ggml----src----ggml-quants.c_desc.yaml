desc: 该文件是 ggml 库中的量化与反量化核心实现，提供了多种低比特位（1-8 bit）张量数据类型的参考量化、优化量化及反量化函数，这些函数在模型生成和推理过程中用于在浮点表示和紧凑的量化块表示之间进行转换，以显著减少模型的内存占用和计算开销。该代码片段来自
  ggml/src/ggml-quants.c，主要实现多种 K 组量化格式及传统量化格式的浮点数据压缩与解压缩，包括 Q2_K、Q3_K、Q4_K、Q5_K、Q6_K、Q4_0、Q4_1、Q5_0
  等格式。代码通过块级缩放因子、最小值、低位与高位比特打包，以及可选量化权重支持，在压缩率、重构精度和量化误差之间进行平衡。This file provides
  quantization and dequantization routines for various low-bit precision data types
  used in the GGML tensor library, including Q5_0, Q5_1, Q8_0, MXFP4, NVFP4, TQ1_0,
  TQ2_0, IQ2_XXS, IQ2_XS, IQ2_S, IQ3_XXS, IQ3_S, IQ1_S, IQ1_M, IQ4_NL, IQ4_XS, and
  Q8_K. It includes reference implementations for converting float data to quantized
  formats and back, along with efficient quantizer entry points that handle row-wise
  operations with optional weighted quantization. The code leverages lookup tables
  and bit-packing schemes to achieve compact representation while maintaining precision,
  and initializes lookup grids for IQ types.该代码片段来自 ggml 的量化实现文件 ggml-quants.c，主要负责初始化和释放
  IQ1/IQ2 量化所需的离散网格、索引映射及近邻表，并利用加权误差最小化、符号编码和网格近邻搜索，将浮点向量分别量化为 IQ2_XXS 与 IQ2_XS 格式。当前输入从文件第
  2920 行开始，但片段未提供完整函数起始位置，因此只能对可见函数给出基于片段的行号范围估计。该代码片段来自 ggml/src/ggml-quants.c，主要实现基于有限格点搜索的低比特量化算法，包含
  IQ2 和 IQ3 系列量化格式。代码负责初始化 3-bit D4 格点及其映射、构建近邻索引，并通过加权误差最小化为输入浮点数据选择量化格点、缩放因子和符号位，最终将结果编码为紧凑的块状量化数据。该代码片段来自
  ggml/src/ggml-quants.c，主要实现 IQ1_S、IQ1_M、IQ4_NL、IQ4_XS 和 IQ2_S 等低比特非线性量化算法。代码通过加权平方误差优化、候选量化网格搜索、邻居网格回退、尺度重估计以及位级数据打包，将
  FP32 向量压缩为适用于 GGML 推理的紧凑量化块格式。This file implements quantization and validation routines
  for various low-bit quantized tensor formats used in the GGML tensor library. It
  contains the core quantization logic for IQ2_S (integer 2-bit signed) quantization
  along with comprehensive data validation functions that check tensor data for NaN
  and infinity values across all supported quantization types.
