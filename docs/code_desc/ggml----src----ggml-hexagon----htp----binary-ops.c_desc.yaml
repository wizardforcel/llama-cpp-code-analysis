desc: 该文件是Qualcomm Hexagon DSP上二进制运算（如加法、减法、乘法、除法）的优化实现，使用HVX向量指令对张量进行并行的广播和重复运算。该文件实现了Hexagon
  HTP后端上的二元运算操作，包括张量加法、缩放、广播和元素重复。它负责在VTCM（向量张量计算内存）中分配缓冲区，配置DMA传输，并调度worker线程池来执行特定的运算作业。该代码的核心功能是管理内存布局和并发执行，以优化Hexagon
  DSP上的二元张量运算性能。
