desc: 这个文件是llama.cpp项目Web UI前端(Vite)的配置文件，用于配置开发与构建流程。它使用Vite配合SvelteKit和TailwindCSS构建前端，并定义了自定义构建插件。该插件在构建完成后，会执行一系列后处理任务，包括内嵌favicon图标为Base64数据URL、将生成的JS/CSS
  bundle文件重命名为固定的bundle.js和bundle.css，并将处理后的内容写入公共目录中的index.html，以便后端服务器集成。此外，该配置还设置了开发服务器代理、SCSS变量、测试环境（包括客户端、单元和Storybook测试）以及静态资源的内联限制。
file: tools/server/webui/vite.config.ts
funcs:
- code:
  - function llamaCppBuildPlugin() {
  - "\treturn {"
  - "\t\tname: 'llamacpp:build',"
  - "\t\tapply: 'build' as const,"
  - "\t\tcloseBundle() {"
  - "\t\t\t// Ensure the SvelteKit adapter has finished writing to ../public"
  - "\t\t\tsetTimeout(() => {"
  - "\t\t\t\ttry {"
  - "\t\t\t\t\tconst indexPath = resolve('../public/index.html');"
  - "\t\t\t\t\tif (!existsSync(indexPath)) {"
  - "\t\t\t\t\t\treturn;"
  - "\t\t\t\t\t}"
  - "\t\t\t\t\tlet content = readFileSync(indexPath, 'utf-8');"
  - "\t\t\t\t\tconst faviconPath = resolve('static/favicon.svg');"
  - "\t\t\t\t\tif (existsSync(faviconPath)) {"
  - "\t\t\t\t\t\tconst faviconContent = readFileSync(faviconPath, 'utf-8');"
  - "\t\t\t\t\t\tconst faviconBase64 = Buffer.from(faviconContent).toString('base64');"
  - "\t\t\t\t\t\tconst faviconDataUrl = `data:image/svg+xml;base64,${faviconBase64}`;"
  - "\t\t\t\t\t\tcontent = content.replace(/href=\"[^\"]*favicon\\.svg\"/g, `href=\"\
    ${faviconDataUrl}\"`);"
  - "\t\t\t\t\t\tconsole.log('✓ Inlined favicon.svg as base64 data URL');"
  - "\t\t\t\t\t}"
  - "\t\t\t\t\tcontent = content.replace(/\\r/g, '');"
  - "\t\t\t\t\tcontent = GUIDE_FOR_FRONTEND + '\\n' + content;"
  - "\t\t\t\t\tcontent = content.replace(/\\/_app\\/immutable\\/bundle\\.[^\"]+\\\
    .js/g, './bundle.js');"
  - "\t\t\t\t\tcontent = content.replace(/\\/_app\\/immutable\\/assets\\/bundle\\\
    .[^\"]+\\.css/g, './bundle.css');"
  - "\t\t\t\t\twriteFileSync(indexPath, content, 'utf-8');"
  - "\t\t\t\t\tconsole.log('✓ Updated index.html');"
  - "\t\t\t\t\tconst immutableDir = resolve('../public/_app/immutable');"
  - "\t\t\t\t\tconst bundleDir = resolve('../public/_app/immutable/assets');"
  - "\t\t\t\t\tif (existsSync(immutableDir)) {"
  - "\t\t\t\t\t\tconst jsFiles = readdirSync(immutableDir).filter((f) => f.match(/^bundle\\\
    ..+\\.js$/));"
  - "\t\t\t\t\t\tif (jsFiles.length > 0) {"
  - "\t\t\t\t\t\t\tcopyFileSync(resolve(immutableDir, jsFiles[0]), resolve('../public/bundle.js'));"
  - "\t\t\t\t\t\t\tconsole.log(`✓ Copied ${jsFiles[0]} -> bundle.js`);"
  - "\t\t\t\t\t\t}"
  - "\t\t\t\t\t}"
  - "\t\t\t\t\tif (existsSync(bundleDir)) {"
  - "\t\t\t\t\t\tconst cssFiles = readdirSync(bundleDir).filter((f) => f.match(/^bundle\\\
    ..+\\.css$/));"
  - "\t\t\t\t\t\tif (cssFiles.length > 0) {"
  - "\t\t\t\t\t\t\tcopyFileSync(resolve(bundleDir, cssFiles[0]), resolve('../public/bundle.css'));"
  - "\t\t\t\t\t\t\tconsole.log(`✓ Copied ${cssFiles[0]} -> bundle.css`);"
  - "\t\t\t\t\t\t}"
  - "\t\t\t\t\t}"
  - "\t\t\t\t} catch (error) {"
  - "\t\t\t\t\tconsole.error('Failed to update index.html:', error);"
  - "\t\t\t\t}"
  - "\t\t\t}, 100);"
  - "\t\t}"
  - "\t};"
  - '}'
