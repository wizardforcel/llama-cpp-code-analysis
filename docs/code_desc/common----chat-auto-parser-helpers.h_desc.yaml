desc: 该文件是聊天自动解析器的辅助头文件，提供了一系列字符串处理函数（如去除空白字符、计算差异分割、前缀/后缀匹配提取）和标记分段函数，以及一个用于模板渲染和变体比较的命名空间。这些功能主要用于解析和比较聊天模板中不同部分之间的差异，为上层聊天解析器提供基础的数据处理能力。
