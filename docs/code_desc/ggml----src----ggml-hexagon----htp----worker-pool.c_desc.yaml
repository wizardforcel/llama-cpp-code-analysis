desc: 该文件实现了基于QuRT实时操作系统的工作线程池管理模块，提供线程池初始化、任务分发、线程优先级管理等功能。系统通过循环任务队列和futex同步机制，实现多线程并行执行用户定义的任务函数，适用于高通Hexagon
  DSP等嵌入式环境。
