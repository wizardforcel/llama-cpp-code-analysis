desc: 该文件是ggml库的WebGPU后端实现，负责在WebGPU设备上执行张量计算。它包含了WebGPU上下文管理、缓冲区操作、计算管线创建与调度、以及各种张量操作（如复制、设置等）的GPU加速实现，同时提供了性能剖析支持。该文件是ggml-webgpu后端实现的一部分，负责为各种张量操作（如pad、solve_tri、ssm_conv等）构建WebGPU计算管线。它通过定义多个静态函数来封装不同操作的shader管线选择和参数准备逻辑，最终调用通用构建函数提交GPU任务。This
  file implements WebGPU backend operations for the ggml tensor library, handling
  flash attention with advanced shader pipelines, unary/binary operations, concatenation,
  repetition, and row normalization. It manages tensor memory alignment, workgroup
  scheduling, and dispatches compute shaders through a shader library system, supporting
  multiple execution paths including vectorized operations with block-based masking
  for attention mechanisms.该代码是ggml库的WebGPU后端实现的一部分，主要实现各种张量操作在WebGPU上的编码和执行，包括张量拷贝、矩阵乘法、归一化、RoPE旋转位置编码、GLU激活函数、缩放、softmax、排序等操作。代码通过获取对应的GPU着色器管线，构建参数和绑定组，最后将操作编码为WebGPU命令。该文件包含
  WebGPU 后端接口的实现，负责对 ggml 计算图的图计算、带张量加载等操作进行编码并提交到 GPU 队列处理。这个文件是 ggml 库中 WebGPU 后端的核心实现，负责将深度学习运算（如矩阵乘法、归一化、激活函数等）映射到
  WebGPU API 上。它通过定义后端设备接口、缓冲区管理以及操作支持检查，实现了对 GPU 加速的支持，并提供了后端注册和初始化功能，使上层计算图能够在 WebGPU
  设备上高效运行。
