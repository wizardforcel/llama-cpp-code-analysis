desc: 该文件实现了在 Qualcomm Hexagon 处理器上针对 Hermes 测试平台（HTP）优化的 ROPE（Rotary Position Embedding）操作的加速实现。该实现支持标准（Normal）和
  Neox 两种旋转位置编码模式，并利用 HVX 向量指令和 DMA 双缓冲机制在 VTCM 中高效地执行张量旋转操作。代码包含了 from 预计算、角度缓存初始化、向量化核心计算函数以及多线程任务调度逻辑，旨在最大化硬件利用率并降低延迟。
file: ggml/src/ggml-hexagon/htp/rope-ops.c
funcs:
- code:
  - static float rope_yarn_ramp(const float low, const float high, const int i0) {
  - '    const float y = (i0 / 2 - low) / MAX(0.001f, high - low);'
  - '    return (1 - MIN(1, MAX(0, y)));'
  - '}'
  desc: 计算 YaRN 缩放中使用的斜坡混合因子，基于给定的低/高边界和索引，返回一个 0 到 1 之间的权重值。
