  - '        HVX_Vector v0 = vsrc[i/2+0];'
  - '        HVX_Vector v1 = vsrc[i/2+hv];'
  - '        HVX_Vector v2 = vtheta[i+0];'
  - '        HVX_Vector v3 = vtheta[i+1];'
