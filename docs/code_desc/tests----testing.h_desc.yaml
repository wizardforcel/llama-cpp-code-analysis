    - ''
    - '    std::chrono::microseconds duration(0);'
    - ''
    - '    run_with_exceptions([&] {'
    - '        for (auto i = 0; i < iterations; i++) {'
    - '            auto start = clock::now();'
    - '            f();'
    - '            duration += std::chrono::duration_cast<std::chrono::microseconds>(clock::now()
      - start);'
    - '        }'
    - '    }, "bench");'
    - ''
    - '    auto avg_elapsed   = duration.count() / iterations;'
    - '    auto avg_elapsed_s = std::chrono::duration_cast<std::chrono::duration<double>>(duration).count()
      / iterations;'
    - '    auto rate = (avg_elapsed_s > 0.0) ? (1.0 / avg_elapsed_s) : 0.0;'
    - ''
    - '    int new_failures   = failures   - before_failures;'
    - '    int new_assertions = assertions - before_assertions;'
    - ''
