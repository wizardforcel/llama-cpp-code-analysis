    - '        "n=" + std::to_string(iterations) +'
    - '        " avg=" + std::to_string(avg_elapsed) + "us" +'
    - '        " rate=" + std::to_string(int(rate)) + "/s";'
    - ''
    - '    print_result("[bench] " + name, new_failures, new_assertions, extra);'
    - ''
    - '    stack.pop_back();'
    - '}'
