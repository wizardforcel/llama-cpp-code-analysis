- code:
  - int op_set_rows(struct htp_ops_context * octx) {
  - '    set_rows_preamble;'
  - ''
  - '    const uint32_t n_threads = MIN(nr, octx->n_threads);'
  - ''
  - '    if (octx->src0.type != HTP_TYPE_F32) {'
  - '        return HTP_STATUS_NO_SUPPORT;'
  - '    }'
  - ''
  - '    if (octx->dst.type != HTP_TYPE_F32 && octx->dst.type != HTP_TYPE_F16) {'
  - '        return HTP_STATUS_NO_SUPPORT;'
  - '    }'
  - ''
  - '    if (octx->src1.type != HTP_TYPE_I32 && octx->src1.type != HTP_TYPE_I64) {'
  - '        return HTP_STATUS_NO_SUPPORT;'
  - '    }'
  - ''
  - '    if (octx->flags & HTP_OPFLAGS_SKIP_COMPUTE) {'
  - '        return HTP_STATUS_OK;'
  - '    }'
  - ''
  - '    struct htp_set_rows_context srctx;'
  - '    srctx.octx = octx;'
  - '    srctx.div_ne12 = init_fastdiv_values(ne12);'
  - '    srctx.div_ne11 = init_fastdiv_values(ne11);'
  - ''
  - '    srctx.src0_nrows_per_thread = (nr + n_threads - 1) / n_threads;'
  - ''
  - '    switch(octx->dst.type) {'
  - '    case HTP_TYPE_F32:'
  - '        worker_pool_run_func(octx->ctx->worker_pool, set_rows_thread_f32_f32,
    &srctx, n_threads);'
  - '        break;'
  - '    case HTP_TYPE_F16:'
  - '        worker_pool_run_func(octx->ctx->worker_pool, set_rows_thread_f16_f32,
    &srctx, n_threads);'
  - '        break;'
  - '    default:'
  - '        return HTP_STATUS_NO_SUPPORT;'
  - '    }'
  - ''
  - '    return HTP_STATUS_OK;'
  - '}'
