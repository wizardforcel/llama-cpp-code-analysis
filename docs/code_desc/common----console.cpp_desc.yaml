desc: 该文件实现了跨平台的控制台输入输出功能，包括初始化控制台、设置显示样式（ANSI颜色）、高级行编辑（支持光标移动、删除、历史记录、自动补全等）以及UTF-8/16字符处理。它封装了Windows和POSIX系统的底层差异，提供了统一的控制台交互接口。该文件实现了控制台交互功能，包括多行输入、光标控制、字符显示宽度处理、自动补全、历史记录、进度指示器（spinner）以及简单的文本输出与格式化错误输出。核心功能是`readline`系列函数，负责读取用户输入，支持高级编辑和简单模式，并处理特殊字符（如'/'和'\'）以控制多行输入行为。
